@startuml
!pragma layout smetana
start
note right
CompressionTypecompressionType()
end note
:return compressionType;;
stop
end
start
note right
void measureValidateMessagesAndAssignOffsetsCompressed(Blackholebh)
end note
:LogValidator.validateMessagesAndAssignOffsetsCompressed(records,
new TopicPartition("a",0),new LongRef(startingOffset),
Time.SYSTEM,System.currentTimeMillis(),CompressionCodec.getCompressionCodec(compressionType.id),
