@startuml
!pragma layout smetana
start
note right
CompressionTypecompressionType()
end note
:return compressionType;;
stop
end
start
note right
void measureIteratorForBatchWithSingleMessage(Blackholebh)
end note
:try ;
while (iterator.hasNext())
:bh.consume(iterator.next());;
endwhile
end
start
note right
