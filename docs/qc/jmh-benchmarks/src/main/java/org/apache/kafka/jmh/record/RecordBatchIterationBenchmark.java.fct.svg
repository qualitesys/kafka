@startuml
!pragma layout smetana
start
note right
CompressionTypecompressionType()
end note
:return compressionType;;
stop
end
start
note right
void measureIteratorForBatchWithSingleMessage(Blackholebh)
end note
:try (CloseableIterator<Record>iterator=batch.streamingIterator(requestLocal.bufferSupplier())){while (iterator.hasNext())bh.consume(iterator.next());};
end
start
note right
void measureStreamingIteratorForVariableBatchSize(Blackholebh)
end note
:try (CloseableIterator<Record>iterator=batch.streamingIterator(requestLocal.bufferSupplier())){while (iterator.hasNext())bh.consume(iterator.next());};
end
start
note right
void measureSkipIteratorForVariableBatchSize(Blackholebh)
end note
:try (CloseableIterator<Record>iterator=batch.skipKeyValueIterator(requestLocal.bufferSupplier())){while (iterator.hasNext())bh.consume(iterator.next());};
end
@enduml

