@startuml
!pragma layout smetana
start
note right
void setup()
end note
end
start
note right
void initializeMetadataCache()
end note
end
start
note right
List<UpdateMetadataEndpoint>endpoints(final intbrokerId)
end note
:return Collections.singletonList(new UpdateMetadataEndpoint().setHost("host_"+
brokerId).setPort(9092).setSecurityProtocol(SecurityProtocol.PLAINTEXT.id).setListener(ListenerName.forSecurityProtocol(SecurityProtocol.PLAINTEXT).value()));;
stop
end
start
note right
KafkaApiscreateKafkaApis()
end note
:return new KafkaApisBuilder().setRequestChannel(requestChannel).setMetadataSupport(new ZkSupport(adminManager,
kafkaController,kafkaZkClient,Option.empty(),
metadataCache)).setReplicaManager(replicaManager).setGroupCoordinator(groupCoordinator).setTxnCoordinator(transactionCoordinator).setAutoTopicCreationManager(autoTopicCreationManager).setBrokerId(brokerId).setConfig(config).setConfigRepository(new MockConfigRepository()).setMetadataCache(metadataCache).setMetrics(metrics).setAuthorizer(Optional.empty()).setQuotas(quotaManagers).setFetchManager(fetchManager).setBrokerTopicStats(brokerTopicStats).setClusterId("clusterId").setTime(Time.SYSTEM).setTokenManager(null ).setApiVersionManager(new SimpleApiVersionManager(ApiMessageType.ListenerType.ZK_BROKER)).build();;
stop
end
start
note right
void tearDown()
end note
end
start
note right
RequestChannel.RequestbuildAllTopicMetadataRequest()
end note
:return new RequestChannel.Request(1,context,
0,MemoryPool.NONE,bodyBuffer,requestChannelMetrics,
Option.empty());;
stop
end
start
note right
void testMetadataRequestForAllTopics()
end note
end
start
note right
StringtestRequestToJson()
end note
:return RequestConvertToJson.requestDesc(allTopicMetadataRequest.header(),
allTopicMetadataRequest.requestLog(),allTopicMetadataRequest.isForwarded()).toString();;
stop
end
