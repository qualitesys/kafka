@startuml
!pragma layout smetana
start
note right
void setup()
end note
:topics.add(tp.topic());;
:futures.put(tp,new KafkaFutureImpl<>());;
:topicPartitionOffsets.put(tp,OffsetSpec.latest());;
:mrPartitionList.add(mrPartition);;
:mrTopic.setPartitions(mrPartitionList);;
:mrTopicList.add(mrTopic);;
:data.setTopics(new MetadataResponseData.MetadataResponseTopicCollection(mrTopicList.listIterator()));;
:context=new MetadataOperationContext<>(topics,
new ListOffsetsOptions(),deadline,futures);;
:context.setResponse(Optional.of(new MetadataResponse(data,
version)));;
:admin=(KafkaAdminClient)adminEnv.adminClient();;
end
start
note right
ObjecttestGetListOffsetsCalls()
end note
:return AdminClientTestUtils.getListOffsetsCalls(admin,
context,topicPartitionOffsets,futures);;
stop
end
start
note right
ClustermockCluster()
end note
:nodes.put(i,new Node(i,"localhost",8121+
i));;
:return new Cluster("mockClusterId",nodes.values(),
Collections.emptySet(),Collections.emptySet(),
Collections.emptySet(),nodes.get(controllerIndex));;
stop
end
@enduml

