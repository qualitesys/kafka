@startuml
!pragma layout smetana
start
note right
CompressionTypecompressionType()
end note
:return CompressionType.NONE;;
stop
end
start
note right
void measureAssignOffsetsNonCompressed(Blackholebh)
end note
:LogValidator.assignOffsetsNonCompressed(records,
new TopicPartition("a",0),new LongRef(startingOffset),
System.currentTimeMillis(),false,TimestampType.CREATE_TIME,
Long.MAX_VALUE,0,new AppendOrigin.Client$(),
messageVersion,brokerTopicStats);;
end
@enduml

