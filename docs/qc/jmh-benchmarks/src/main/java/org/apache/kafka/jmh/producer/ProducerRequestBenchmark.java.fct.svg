@startuml
!pragma layout smetana
start
note right
ProduceRequest request()
end note
:return ProduceRequest.forMagic(RecordBatch.CURRENT_MAGIC_VALUE,
PRODUCE_REQUEST_DATA).build();;
stop
end
start
note right
ProduceRequest constructorProduceRequest()
end note
:return request();;
stop
end
start
note right
ProduceResponse constructorErrorResponse()
end note
:return REQUEST.getErrorResponse(0,Errors.INVALID_REQUEST.exception());;
stop
end
@enduml

