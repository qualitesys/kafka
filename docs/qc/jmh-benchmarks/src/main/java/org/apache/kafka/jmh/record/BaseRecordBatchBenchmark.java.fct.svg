@startuml
!pragma layout smetana
start
note right
void init()
end note
if (bufferSupplierStr.equals("NO_CACHING")) then (yes) 
else (no)
:throw new IllegalArgumentException("Unsupported buffer supplier "+
bufferSupplierStr);;
endif 
end
start
note right
Header[]createHeaders()
end note
:return IntStream.range(0,MAX_HEADER_SIZE).mapToObj(index->new Header(){@Override public Stringkey(){return headerKey;
:}@Override public byte[]value(){return headerValue;
:}}).toArray(Header[]::new );;
stop
end
start
note right
ByteBuffercreateBatch(intbatchSize)
end note
:return builder.build().buffer();;
stop
end
@enduml

