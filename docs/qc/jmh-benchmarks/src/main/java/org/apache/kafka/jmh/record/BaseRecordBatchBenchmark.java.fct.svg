@startuml
!pragma layout smetana
start
note right
void init()
end note
:startingOffset=messageVersion==2? 0:42;;
if (bufferSupplierStr.equals("NO_CACHING")) then (yes) 
:requestLocal=RequestLocal.NoCaching();;
else if (bufferSupplierStr.equals("CREATE")) then (yes) 
:requestLocal=RequestLocal.withThreadConfinedCaching();;
else (no)
:throw new IllegalArgumentException("Unsupported buffer supplier "+
bufferSupplierStr);;
stop
endif 
:singleBatchBuffer=createBatch(1);;
:batchBuffers=new ByteBuffer[batchCount];;
:intsize=random.nextInt(maxBatchSize)+1;;
:batchBuffers[i]=createBatch(size);;
end
start
note right
Header[]createHeaders()
end note
:char[]headerChars=new char[HEADER_KEY_SIZE];;
:Arrays.fill(headerChars,'a');;
:StringheaderKey=new String(headerChars);;
:byte[]headerValue=new byte[0];;
:return IntStream.range(0,MAX_HEADER_SIZE).mapToObj(index->new Header(){@Override public Stringkey(){return headerKey;
:}@Override public byte[]value(){return headerValue;
:}}).toArray(Header[]::new );;
stop
end
start
note right
ByteBuffercreateBatch(intbatchSize)
end note
:Header[]headers=messageVersion<RecordBatch.MAGIC_VALUE_V2? Record.EMPTY_HEADERS:createHeaders();;
:byte[]value=new byte[messageSize];;
:final ByteBufferbuf=ByteBuffer.allocate(AbstractRecords.estimateSizeInBytesUpperBound(messageVersion,
compressionType(),new byte[0],value,headers)*batchSize);;
:final MemoryRecordsBuilderbuilder=MemoryRecords.builder(buf,
messageVersion,compressionType(),TimestampType.CREATE_TIME,
startingOffset);;
switch (switch (bytes))
endswith
:builder.append(0,null ,value,headers);;
:return builder.build().buffer();;
stop
end
@enduml

