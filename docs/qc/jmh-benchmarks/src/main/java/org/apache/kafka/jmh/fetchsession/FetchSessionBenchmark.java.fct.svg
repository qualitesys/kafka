@startuml
!pragma layout smetana
start
note right
void setUp()
end note
:fetches=new LinkedHashMap<>();;
:handler=new FetchSessionHandler(LOG_CONTEXT,1);;
:topicIds=new HashMap<>();;
:topicIds.put("foo",id);;
:fetches.put(tp,partitionData);;
:builder.add(tp,partitionData);;
:respMap.put(new TopicIdPartition(id,tp),
new FetchResponseData.PartitionData().setPartitionIndex(tp.partition()).setLastStableOffset(0).setLogStartOffset(0));;
:builder.build();;
:handler.handleResponse(FetchResponse.of(Errors.NONE,
0,1,respMap),ApiKeys.FETCH.latestVersion());;
if (updatedPercentage!=0&&counter%(100/updatedPercentage)==0) then (yes) 
:fetches.remove(topicPartition);;
:fetches.put(topicPartition,new FetchRequest.PartitionData(id,
50,40,200,Optional.empty()));;
endif 
:counter++;;
end
start
note right
void incrementalFetchSessionBuild()
end note
if (presize) then (yes) 
:builder=handler.newBuilder(fetches.size(),
true);;
else (no)
:builder=handler.newBuilder();;
endif 
:builder.add(topicPartition,entry.getValue());;
:builder.build();;
end
@enduml

