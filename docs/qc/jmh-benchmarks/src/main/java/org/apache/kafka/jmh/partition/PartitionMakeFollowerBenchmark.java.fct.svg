@startuml
!pragma layout smetana
start
note right
void setup()
end note
if (!logDir.mkdir()) then (yes) 
:throw new IOException("error creating test directory");;
endif 
end
start
note right
void tearDown()
end note
end
start
note right
booleantestMakeFollower()
end note
:return partition.makeFollower(partitionState,
offsetCheckpoints,topicId);;
stop
end
start
note right
LogConfigcreateLogConfig()
end note
:return LogConfig.apply(logProps,new scala.collection.immutable.HashSet<>());;
stop
end
@enduml

