@startuml
!pragma layout smetana
start
note right
void setup()
end note
:this.produceRequest=ProduceRequest.forCurrentMagic(new ProduceRequestData()).build(ApiKeys.PRODUCE.latestVersion());
end
start
note right
StringtestRequestToJson()
end note
:return RequestConvertToJson.request(produceRequest).toString();;
stop
end
@enduml

