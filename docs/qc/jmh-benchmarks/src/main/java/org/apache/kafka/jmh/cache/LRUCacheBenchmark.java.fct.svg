@startuml
!pragma layout smetana
start
note right
void setUp()
end note
:++i;
:keys[i]=KEY+i;
:values[i]=VALUE+i;
:lruCache=new LRUCache<>(100);
end
start
note right
StringtestCachePerformance()
end note
:counter++;
:lruCache.put(hashkey,values[index]);
:return lruCache.get(hashkey);;
stop
end
start
note right
void main(String[]args)
end note
:new Runner(opt).run();
end
@enduml

