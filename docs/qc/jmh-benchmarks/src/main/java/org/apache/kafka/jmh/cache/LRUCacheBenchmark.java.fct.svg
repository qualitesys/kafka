@startuml
!pragma layout smetana
start
note right
void setUp()
end note
:keys[i]=KEY+i;;
:values[i]=VALUE+i;;
:lruCache=new LRUCache<>(100);;
end
start
note right
String testCachePerformance()
end note
:counter++;;
:int index=(int )(counter%DISTINCT_KEYS);;
:String hashkey=keys[index];;
:lruCache.put(hashkey,values[index]);;
:return lruCache.get(hashkey);;
stop
end
start
note right
void main(String[] args)
end note
:Options opt=new OptionsBuilder().include(LRUCacheBenchmark.class .getSimpleName())
.forks(2).build();;
:new Runner(opt).run();;
end
@enduml

