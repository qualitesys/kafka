/><line style="stroke:#181818;stroke-width:1.0;" x1="334.5" x2="334.5" y1="922" y2="942"/><polygon fill="#181818" points="330.5,932,334.5,942,338.5,932,334.5,936" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[4183abef207ec12f74b2316f51d0d7ff]
@startuml
!pragma layout smetana
start
note right
void setup()
end note
:Set<TopicPartition> assignment=new HashSet<>(topicCount*partitionCount);;
:IntStream.range(0,topicCount).forEach(topicId->IntStream.range(0,
partitionCount).forEach(partitionId->assignment.add(new TopicPartition(String.format("topic-%04d",
topicId),partitionId))));;
:subscriptionState=new SubscriptionState(new LogContext(),
OffsetResetStrategy.EARLIEST);;
:subscriptionState.assignFromUser(assignment);;
:SubscriptionState.FetchPosition position=new SubscriptionState.FetchPosition(0L,
Optional.of(0),new Metadata.LeaderAndEpoch(Optional.of(new Node(0,
"host",9092)),Optional.of(10)));;
:assignment.forEach(topicPartition->{subscriptionState.seekUnvalidated(topicPartition,
position);subscriptionState.completeValidation(topicPartition);});;
end
start
note right
boolean testHasAllFetchPositions()
end note
:return subscriptionState.hasAllFetchPositions();;
stop
end
start
note right
int testFetchablePartitions()
end note
:return subscriptionState.fetchablePartitions(tp->true)
.size();;
stop
end
start
note right
int testPartitionsNeedingValidation()
end note
:return subscriptionState.partitionsNeedingValidation(0L)
.size();;
stop
end
@enduml

