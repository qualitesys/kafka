@startuml
!pragma layout smetana
start
note right
void setup()
end note
:IntStream.range(0,topicCount).forEach(topicId->IntStream.range(0,
partitionCount).forEach(partitionId->assignment.add(new TopicPartition(String.format("topic-%04d",
topicId),partitionId))));;
:subscriptionState=new SubscriptionState(new LogContext(),
OffsetResetStrategy.EARLIEST);;
:subscriptionState.assignFromUser(assignment);;
:assignment.forEach(topicPartition->{subscriptionState.seekUnvalidated(topicPartition,
position);subscriptionState.completeValidation(topicPartition);});;
end
start
note right
booleantestHasAllFetchPositions()
end note
:return subscriptionState.hasAllFetchPositions();;
stop
end
start
note right
inttestFetchablePartitions()
end note
:return subscriptionState.fetchablePartitions(tp->true)
.size();;
stop
end
start
note right
inttestPartitionsNeedingValidation()
end note
:return subscriptionState.partitionsNeedingValidation(0L)
.size();;
stop
end
@enduml

