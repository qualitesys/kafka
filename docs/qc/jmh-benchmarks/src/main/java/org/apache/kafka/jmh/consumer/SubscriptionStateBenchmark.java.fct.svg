ne style="stroke:#181818;stroke-width:1.0;" x1="497.5" x2="497.5" y1="687.6836" y2="710.25"/><polygon fill="#181818" points="493.5,700.25,497.5,710.25,501.5,700.25,497.5,704.25" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="497.5" x2="497.5" y1="758.1875" y2="778.1875"/><polygon fill="#181818" points="493.5,768.1875,497.5,778.1875,501.5,768.1875,497.5,772.1875" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[f17f71fadd5a8a0773e85cdf08726598]
@startuml
!pragma layout smetana
start
note right
void setup()
end note
:IntStream.range(0,topicCount).forEach(topicId->IntStream.range(0,
partitionCount).forEach(partitionId->assignment.add(new TopicPartition(String.format("topic-%04d",topicId),partitionId))));
:subscriptionState=new SubscriptionState(new LogContext(),
OffsetResetStrategy.EARLIEST);
:subscriptionState.assignFromUser(assignment);
:assignment.forEach(topicPartition->{subscriptionState.seekUnvalidated(topicPartition,position);subscriptionState.completeValidation(topicPartition);});
end
start
note right
booleantestHasAllFetchPositions()
end note
:return subscriptionState.hasAllFetchPositions();;
stop
end
start
note right
inttestFetchablePartitions()
end note
:return subscriptionState.fetchablePartitions(tp->true)
.size();;
stop
end
start
note right
inttestPartitionsNeedingValidation()
end note
:return subscriptionState.partitionsNeedingValidation(0L)
.size();;
stop
end
@enduml

