@startuml
!pragma layout smetana
start
note right
void setup()
end note
:this.offsetData=new HashMap<>();
:topicIdx++;
:partitionId++;
:this.offsetData.put(new TopicPartition(topic,
partitionId),data);
:this.offsetRequest=ListOffsetsRequest.Builder.forConsumer(false,
IsolationLevel.READ_UNCOMMITTED,false).build(ApiKeys.LIST_OFFSETS.latestVersion());
end
start
note right
StringtestRequestToJson()
end note
:return RequestConvertToJson.request(offsetRequest).toString();;
stop
end
@enduml

