@startuml
!pragma layout smetana
start
note right
void setup()
end note
:this.offsetData=new HashMap<>();;
:Stringtopic=UUID.randomUUID().toString();;
:ListOffsetsRequestData.ListOffsetsPartitiondata=new ListOffsetsRequestData.ListOffsetsPartition();;
:this.offsetData.put(new TopicPartition(topic,
