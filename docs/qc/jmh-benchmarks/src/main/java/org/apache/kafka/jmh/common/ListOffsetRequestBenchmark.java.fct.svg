@startuml
!pragma layout smetana
start
note right
void setup()
end note
:this.offsetData=new HashMap<>();;
:String topic=UUID.randomUUID().toString();;
:ListOffsetsRequestData.ListOffsetsPartition data=new ListOffsetsRequestData.ListOffsetsPartition();;
:this.offsetData.put(new TopicPartition(topic,
partitionId),data);;
:this.offsetRequest=ListOffsetsRequest.Builder.forConsumer(false,
IsolationLevel.READ_UNCOMMITTED,false).build(ApiKeys.LIST_OFFSETS.latestVersion());;
end
start
note right
String testRequestToJson()
end note
:return RequestConvertToJson.request(offsetRequest)
.toString();;
stop
end
@enduml

