@startuml
!pragma layout smetana
start
note right
Map<Integer,String>testAddEntriesInHashMap()
end note
:return map;;
stop
end
start
note right
Map<Integer,String>testAddEntriesInTimelineMap()
end note
:return map;;
stop
end
start
note right
Map<Integer,String>testAddEntriesWithSnapshots()
end note
if (j>10&&key%3==0) then (yes) 
else (no)
endif 
:return map;;
stop
end
@enduml

