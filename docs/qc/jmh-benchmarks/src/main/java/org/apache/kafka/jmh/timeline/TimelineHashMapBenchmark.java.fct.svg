="853.0859" y2="873.0859"/><polygon fill="#181818" points="299.5,863.0859,303.5,873.0859,307.5,863.0859,303.5,867.0859" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[4014347c8e955a3534c349b45663a05b]
@startuml
!pragma layout smetana
start
note right
Map<Integer,String>testAddEntriesInHashMap()
end note
:map.put(key,String.valueOf(key));;
:return map;;
stop
end
start
note right
Map<Integer,String>testAddEntriesInTimelineMap()
end note
:map.put(key,String.valueOf(key));;
:return map;;
stop
end
start
note right
Map<Integer,String>testAddEntriesWithSnapshots()
end note
if (j>10&&key%3==0) then (yes) 
:snapshotRegistry.deleteSnapshotsUpTo(epoch-1000);;
:snapshotRegistry.getOrCreateSnapshot(epoch);;
:j=0;;
else (no)
:j++;;
endif 
:map.put(key,String.valueOf(key));;
:epoch++;;
:return map;;
stop
end
@enduml

