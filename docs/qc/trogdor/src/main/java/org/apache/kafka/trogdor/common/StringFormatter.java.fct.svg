@startuml
!pragma layout smetana
start
note right
StringdateString(longtimeMs,ZoneOffsetzoneOffset)
end note
:return new Date(timeMs).toInstant().atOffset(zoneOffset)
.format(DateTimeFormatter.ISO_OFFSET_DATE_TIME);;
stop
end
start
note right
StringdurationString(longperiodMs)
end note
if (hours>0) then (yes) 
endif 
if (minutes>0) then (yes) 
endif 
if ((seconds!=0)||bld.toString().isEmpty()) then (yes) 
endif 
:return bld.toString();;
stop
end
start
note right
StringprettyPrintGrid(List<List<String>>lines)
end note
if (numColumns==-1) then (yes) 
endif 
:return bld.toString();;
stop
end
@enduml

