@startuml
!pragma layout smetana
start
note right
constructor AgentStatusResponse(@JsonProperty ("serverStartMs")longserverStartMs,@JsonProperty ("workers")TreeMap<Long,WorkerState>workers)
end note
:this.serverStartMs=serverStartMs;
:this.workers=workers==null ? new TreeMap<Long,WorkerState>():workers;
end
start
note right
longserverStartMs()
end note
:return serverStartMs;;
stop
end
start
note right
TreeMap<Long,WorkerState>workers()
end note
:return workers;;
stop
end
@enduml

