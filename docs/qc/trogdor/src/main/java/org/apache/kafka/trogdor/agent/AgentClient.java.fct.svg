@startuml
!pragma layout smetana
start
note right
constructor Builder()
end note
end
start
note right
Builderlog(Loggerlog)
end note
:this.log=log;;
:return this;;
stop
end
start
note right
BuildermaxTries(intmaxTries)
end note
:this.maxTries=maxTries;;
:return this;;
stop
end
start
note right
Buildertarget(Stringtarget)
end note
:this.target=target;;
:return this;;
stop
end
start
note right
Buildertarget(Stringhost,intport)
end note
:this.target=String.format("%s:%d",host,port);;
:return this;;
stop
end
start
note right
AgentClientbuild()
end note
if (target==null ) then (yes) 
:throw new RuntimeException("You must specify a target.");;
stop
endif 
:return new AgentClient(log,maxTries,target);;
stop
end
start
note right
constructor AgentClient(Loggerlog,intmaxTries,
Stringtarget)
end note
:this.log=log;;
:this.maxTries=maxTries;;
:this.target=target;;
end
start
note right
Stringtarget()
end note
:return target;;
stop
end
start
note right
intmaxTries()
end note
:return maxTries;;
stop
end
start
note right
Stringurl(Stringsuffix)
end note
:return String.format("http://%s%s",target,
suffix);;
stop
end
start
note right
AgentStatusResponsestatus()
end note
:HttpResponse<AgentStatusResponse>resp=JsonRestServer.<AgentStatusResponse>httpRequest(url("/agent/status"),
"GET",null ,new TypeReference<AgentStatusResponse>(){},
maxTries);;
:return resp.body();;
stop
end
start
note right
UptimeResponseuptime()
end note
:HttpResponse<UptimeResponse>resp=JsonRestServer.httpRequest(url("/agent/uptime"),
"GET",null ,new TypeReference<UptimeResponse>(){},
maxTries);;
:return resp.body();;
stop
end
start
note right
void createWorker(CreateWorkerRequestrequest)
end note
:HttpResponse<Empty>resp=JsonRestServer.<Empty>httpRequest(url("/agent/worker/create"),
"POST",request,new TypeReference<Empty>(){},
maxTries);;
:resp.body();;
end
start
note right
void stopWorker(StopWorkerRequestrequest)
end note
:HttpResponse<Empty>resp=JsonRestServer.<Empty>httpRequest(url("/agent/worker/stop"),
"PUT",request,new TypeReference<Empty>(){},
maxTries);;
:resp.body();;
end
start
note right
void destroyWorker(DestroyWorkerRequestrequest)
end note
:UriBuilderuriBuilder=UriBuilder.fromPath(url("/agent/worker"));;
:uriBuilder.queryParam("workerId",request.workerId());;
:HttpResponse<Empty>resp=JsonRestServer.<Empty>httpRequest(uriBuilder.build().toString(),
"DELETE",null ,new TypeReference<Empty>(){},
maxTries);;
:resp.body();;
end
start
note right
void invokeShutdown()
end note
:HttpResponse<Empty>resp=JsonRestServer.<Empty>httpRequest(url("/agent/shutdown"),
"PUT",null ,new TypeReference<Empty>(){},
maxTries);;
:resp.body();;
end
start
note right
void addTargetArgument(ArgumentParserparser)
end note
:parser.addArgument("- -target","-t").action(store()).required(true).type(String.class ).dest("target").metavar("TARGET").help("A colon-separated host and port pair.  For example,
 example.com:8888");;
end
start
note right
void addJsonArgument(ArgumentParserparser)
end note
:parser.addArgument("- -json").action(storeTrue())
.dest("json").metavar("JSON").help("Show the full response as JSON.");;
end
start
note right
void addWorkerIdArgument(ArgumentParserparser,
Stringhelp)
end note
:parser.addArgument("- -workerId").action(storeTrue())
.type(Long.class ).dest("workerId").metavar("WORKER_ID").help(help);;
end
start
note right
void main(String[]args)
end note
:ArgumentParserrootParser=ArgumentParsers.newArgumentParser("trogdor-agent-client")
.defaultHelp(true).description("The Trogdor agent client.");;
:SubparserssubParsers=rootParser.addSubparsers()
.dest("command");;
:SubparseruptimeParser=subParsers.addParser("uptime")
.help("Get the agent uptime.");;
:addTargetArgument(uptimeParser);;
:addJsonArgument(uptimeParser);;
:SubparserstatusParser=subParsers.addParser("status")
.help("Get the agent status.");;
:addTargetArgument(statusParser);;
:addJsonArgument(statusParser);;
:SubparsercreateWorkerParser=subParsers.addParser("createWorker")
.help("Create a new worker.");;
:addTargetArgument(createWorkerParser);;
:addWorkerIdArgument(createWorkerParser,"The worker ID to create.");;
:createWorkerParser.addArgument("- -taskId")
.action(store()).required(true).type(String.class ).dest("taskId").metavar("TASK_ID").help("The task ID to create.");;
:createWorkerParser.addArgument("- -spec",
"-s").action(store()).required(true).type(String.class ).dest("taskSpec").metavar("TASK_SPEC").help("The task spec to create,
 or a path to a file containing the task spec.");;
:SubparserstopWorkerParser=subParsers.addParser("stopWorker")
.help("Stop a worker.");;
:addTargetArgument(stopWorkerParser);;
:addWorkerIdArgument(stopWorkerParser,"The worker ID to stop.");;
:SubparserdestroyWorkerParser=subParsers.addParser("destroyWorker")
.help("Destroy a worker.");;
:addTargetArgument(destroyWorkerParser);;
:addWorkerIdArgument(destroyWorkerParser,
"The worker ID to destroy.");;
:SubparsershutdownParser=subParsers.addParser("shutdown")
.help("Shut down the agent.");;
:addTargetArgument(shutdownParser);;
:Namespaceres=rootParser.parseArgsOrFail(args);;
:Stringtarget=res.getString("target");;
:AgentClientclient=new Builder().maxTries(3)
.target(target).build();;
:ZoneOffsetlocalOffset=OffsetDateTime.now()
.getOffset();;
switch (switch (res.getString("command")))
endswith
end
@enduml

