@startuml
!pragma layout smetana
start
note right
constructor ErrorResponse(@JsonProperty ("code")intcode,@JsonProperty ("message")Stringmessage)
end note
:this.code=code;
:this.message=message;
end
start
note right
intcode()
end note
:return code;;
stop
end
start
note right
Stringmessage()
end note
:return message;;
stop
end
start
note right
booleanequals(Objecto)
end note
if (this==o) then (yes) 
:return true;;
stop
endif 
if (o==null ||getClass()!=o.getClass()) then (yes) 
:return false;;
stop
endif 
:return Objects.equals(code,that.code)&&Objects.equals(message,that.message);;
stop
end
start
note right
inthashCode()
end note
:return Objects.hash(code,message);;
stop
end
start
note right
StringtoString()
end note
:return JsonUtil.toJsonString(this);;
stop
end
@enduml

