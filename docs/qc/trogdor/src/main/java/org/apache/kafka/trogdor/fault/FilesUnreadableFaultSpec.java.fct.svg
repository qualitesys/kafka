@startuml
!pragma layout smetana
start
note right
constructor FilesUnreadableFaultSpec(@JsonProperty ("startMs")longstartMs,
@JsonProperty ("durationMs")longdurationMs,
@JsonProperty ("nodeNames")Set<String>nodeNames,
@JsonProperty ("mountPath")StringmountPath,
@JsonProperty ("prefix")Stringprefix,@JsonProperty ("errorCode")interrorCode)
end note
:super (startMs,durationMs);
:this.nodeNames=nodeNames==null ? new HashSet<String>():nodeNames;
:this.mountPath=mountPath==null ? String.valueOf(""):mountPath;
:this.prefix=prefix==null ? String.valueOf(""):prefix;
:this.errorCode=errorCode;
end
start
note right
Set<String>nodeNames()
end note
:return nodeNames;;
stop
end
start
note right
StringmountPath()
end note
:return mountPath;;
stop
end
start
note right
Stringprefix()
end note
:return prefix;;
stop
end
start
note right
interrorCode()
end note
:return errorCode;;
stop
end
start
note right
TaskControllernewController(Stringid)
end note
:return new KiboshFaultController(nodeNames);;
stop
end
start
note right
TaskWorkernewTaskWorker(Stringid)
end note
:return new KiboshFaultWorker(id,new KiboshFilesUnreadableFaultSpec(prefix,
errorCode),mountPath);;
stop
end
@enduml

