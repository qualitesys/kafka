@startuml
!pragma layout smetana
start
note right
constructor ConstantPayloadGenerator(@JsonProperty ("size")intsize,
@JsonProperty ("value")byte[]value)
end note
:this.size=size;
:this.value=(value==null ||value.length==0)? new byte[size]:value;
end
start
note right
intsize()
end note
:return size;;
stop
end
start
note right
byte[]value()
end note
:return value;;
stop
end
start
note right
byte[]generate(longposition)
end note
:i+=value.length;
:System.arraycopy(value,0,next,i,Math.min(next.length-i,
value.length));
:return next;;
stop
end
@enduml

