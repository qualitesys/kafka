" points="246,1085.832,236,1089.832,246,1093.832,242,1089.832" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="224" x2="224" y1="1057.832" y2="1077.832"/><polygon fill="#181818" points="220,1067.832,224,1077.832,228,1067.832,224,1071.832" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="224" x2="224" y1="945.3281" y2="975.4609"/><polygon fill="#181818" points="220,965.4609,224,975.4609,228,965.4609,224,969.4609" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="224" x2="224" y1="1101.832" y2="1121.832"/><polygon fill="#181818" points="220,1111.832,224,1121.832,228,1111.832,224,1115.832" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="224" x2="224" y1="1197.707" y2="1217.707"/><polygon fill="#181818" points="220,1207.707,224,1217.707,228,1207.707,224,1211.707" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[d4182b67e886f974f1798ef6f0ded67a]
@startuml
!pragma layout smetana
start
note right
constructor NetworkPartitionFaultWorker(Stringid,
List<Set<String>>partitionSets)
end note
:this.id=id;
:this.partitionSets=partitionSets;
end
start
note right
void start(Platformplatform,WorkerStatusTrackerstatus,
KafkaFutureImpl<String>errorFuture)
end note
:log.info("Activating NetworkPartitionFault {}.",id);
:this.status=status;
:this.status.update(new TextNode("creating network partition "+
id));
:runIptablesCommands(platform,"-A");
:this.status.update(new TextNode("created network partition "+
id));
end
start
note right
void stop(Platformplatform)
end note
:log.info("Deactivating NetworkPartitionFault {}.",id);
:this.status.update(new TextNode("removing network partition "+
id));
:runIptablesCommands(platform,"-D");
:this.status.update(new TextNode("removed network partition "+
id));
end
start
note right
void runIptablesCommands(Platformplatform,
StringiptablesAction)
end note
if (!partitionSet.contains(curNode.name())) then (yes) 
:toBlock.add(nodeName);
endif 
:platform.runCommand(new String[]{"sudo",
"iptables",iptablesAction,"INPUT","-p","tcp",
"-s",addr.getHostAddress(),"-j","DROP","-m",
"comment","- -comment",nodeName});
end
@enduml

