ke:#181818;stroke-width:1.0;" x1="224" x2="224" y1="907.4961" y2="930.0625"/><polygon fill="#181818" points="220,920.0625,224,930.0625,228,920.0625,224,924.0625" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="224" x2="224" y1="1056.4336" y2="1076.4336"/><polygon fill="#181818" points="220,1066.4336,224,1076.4336,228,1066.4336,224,1070.4336" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="224" x2="224" y1="1152.3086" y2="1172.3086"/><polygon fill="#181818" points="220,1162.3086,224,1172.3086,228,1162.3086,224,1166.3086" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[ced6720ae3354a9f7bedcda2beda6478]
@startuml
!pragma layout smetana
start
note right
constructor NetworkPartitionFaultWorker(Stringid,List<Set<String>>partitionSets)
end note
:this.id=id;
:this.partitionSets=partitionSets;
end
start
note right
void start(Platformplatform,WorkerStatusTrackerstatus,KafkaFutureImpl<String>errorFuture)
end note
:log.info("Activating NetworkPartitionFault {}.",id);
:this.status=status;
:this.status.update(new TextNode("creating network partition "+
id));
:runIptablesCommands(platform,"-A");
:this.status.update(new TextNode("created network partition "+
id));
end
start
note right
void stop(Platformplatform)
end note
:log.info("Deactivating NetworkPartitionFault {}.",id);
:this.status.update(new TextNode("removing network partition "+
id));
:runIptablesCommands(platform,"-D");
:this.status.update(new TextNode("removed network partition "+
id));
end
start
note right
void runIptablesCommands(Platformplatform,StringiptablesAction)
end note
if (!partitionSet.contains(curNode.name())) then (yes) 
:toBlock.add(nodeName);
endif 
:platform.runCommand(new String[]{"sudo",
"iptables",iptablesAction,"INPUT","-p","tcp",
"-s",addr.getHostAddress(),"-j","DROP","-m",
"comment","- -comment",nodeName});
end
@enduml

