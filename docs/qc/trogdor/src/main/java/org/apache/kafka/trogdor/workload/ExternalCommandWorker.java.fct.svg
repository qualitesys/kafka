@startuml
!pragma layout smetana
start
note right
constructor ExternalCommandWorker(Stringid,
ExternalCommandSpecspec)
end note
:this.id=id;;
:this.spec=spec;;
end
start
note right
void start(Platformplatform,WorkerStatusTrackerstatus,
KafkaFutureImpl<String>doneFuture)
end note
if (!running.compareAndSet(false,true)) then (yes) 
:throw new IllegalStateException("ConsumeBenchWorker is already running.");;
stop
endif 
:log.info("{}: Activating ExternalCommandWorker with {}",
id,spec);;
:this.status=status;;
:this.doneFuture=doneFuture;;
:this.executor=Executors.newCachedThreadPool(ThreadUtils.createThreadFactory("ExternalCommandWorkerThread%d",
false));;
:Processprocess=null ;;
:try ;
:process=startProcess();;
:catch (Throwablet);
:log.error("{}: Unable to start process",
id,t);;
:executor.shutdown();;
:doneFuture.complete("Unable to start process: "+
t.getMessage());;
:return ;;
stop
:Future<? >stdoutFuture=executor.submit(new StdoutMonitor(process));;
:Future<? >stderrFuture=executor.submit(new StderrMonitor(process));;
:executor.submit(new StdinWriter(process));;
:Future<? >terminatorFuture=executor.submit(new Terminator(process));;
:executor.submit(new ExitMonitor(process,
stdoutFuture,stderrFuture,terminatorFuture));;
:ObjectNodestartMessage=new ObjectNode(JsonNodeFactory.instance);;
:startMessage.set("id",new TextNode(id));;
:startMessage.set("workload",spec.workload());;
:stdinQueue.add(Optional.of(startMessage));;
end
start
note right
ProcessstartProcess()
end note
if (spec.command().isEmpty()) then (yes) 
:throw new RuntimeException("No command specified");;
stop
endif 
:ProcessBuilderbld=new ProcessBuilder(spec.command());;
:Processprocess=bld.start();;
:return process;;
stop
end
start
note right
JsonNodereadObject(Stringline)
end note
:JsonNoderesp;;
:try ;
:resp=JsonUtil.JSON_SERDE.readTree(line);;
:catch (IOExceptione);
:return NullNode.instance;;
stop
:return resp;;
stop
end
start
note right
constructor StdoutMonitor(Processprocess)
end note
:this.process=process;;
end
start
note right
void run()
end note
:log.trace("{}: starting stdout monitor.",
id);;
:try ;
:Stringline;;
while (true)
:try ;
:line=br.readLine();;
if (line==null ) then (yes) 
:throw new IOException("EOF");;
stop
endif 
:catch (IOExceptione);
:log.info("{}: can't read any more from stdout: {}",
id,e.getMessage());;
:return ;;
stop
:log.trace("{}: read line from stdin: {}",
id,line);;
:JsonNoderesp=readObject(line);;
if (resp.has("status")) then (yes) 
:log.info("{}: New status: {}",id,resp.get("status")
.toString());;
:status.update(resp.get("status"));;
endif 
if (resp.has("log")) then (yes) 
:log.info("{}: (stdout): {}",id,resp.get("log")
.asText());;
endif 
if (resp.has("error")) then (yes) 
:Stringerror=resp.get("error").asText();;
:log.error("{}: error: {}",id,error);;
:doneFuture.complete(error);;
endif 
endwhile
:catch (Throwablee);
:log.info("{}: error reading from stdout.",
id,e);;
end
start
note right
constructor StderrMonitor(Processprocess)
end note
:this.process=process;;
end
start
note right
void run()
end note
:log.trace("{}: starting stderr monitor.",
id);;
:try ;
:Stringline;;
while (true)
:try ;
:line=br.readLine();;
if (line==null ) then (yes) 
:throw new IOException("EOF");;
stop
endif 
:catch (IOExceptione);
:log.info("{}: can't read any more from stderr: {}",
id,e.getMessage());;
:return ;;
stop
:log.error("{}: (stderr):{}",id,line);;
endwhile
:catch (Throwablee);
:log.info("{}: error reading from stderr.",
id,e);;
end
start
note right
constructor StdinWriter(Processprocess)
end note
:this.process=process;;
end
start
note right
void run()
end note
:OutputStreamWriterstdinWriter=new OutputStreamWriter(process.getOutputStream(),
StandardCharsets.UTF_8);;
:try ;
while (true)
:log.info("{}: stdin writer ready.",id);;
:Optional<JsonNode>node=stdinQueue.take();;
if (!node.isPresent()) then (yes) 
:log.trace("{}: StdinWriter terminating.",
id);;
:return ;;
stop
endif 
:StringinputString=JsonUtil.toJsonString(node.get());;
:log.info("{}: writing to stdin: {}",id,inputString);;
:stdinWriter.write(inputString+"\n");;
:stdinWriter.flush();;
endwhile
end
start
note right
constructor ExitMonitor(Processprocess,Future<? >stdoutFuture,
Future<? >stderrFuture,Future<? >terminatorFuture)
end note
:this.process=process;;
:this.stdoutFuture=stdoutFuture;;
:this.stderrFuture=stderrFuture;;
:this.terminatorFuture=terminatorFuture;;
end
start
note right
void run()
end note
:try ;
:intexitStatus=process.waitFor();;
:log.info("{}: process exited with return code {}",
id,exitStatus);;
:stdoutFuture.get();;
:stderrFuture.get();;
if (exitStatus==0) then (yes) 
:doneFuture.complete("");;
else (no)
:doneFuture.complete("exited with return code "+
exitStatus);;
endif 
:stdinQueue.add(Optional.empty());;
:terminatorActionQueue.add(TerminatorAction.CLOSE);;
:terminatorFuture.get();;
:executor.shutdown();;
:catch (Throwablee);
:log.error("{}: ExitMonitor error",id,e);;
:doneFuture.complete("ExitMonitor error: "+
e.getMessage());;
end
start
note right
constructor Terminator(Processprocess)
end note
:this.process=process;;
end
start
note right
void run()
end note
:try ;
while (true)
switch (switch (terminatorActionQueue.take()))
endswith
endwhile
:catch (Throwablee);
:log.error("{}: Terminator error",id,e);;
:doneFuture.complete("Terminator error: "+
e.getMessage());;
end
start
note right
void stop(Platformplatform)
end note
if (!running.compareAndSet(true,false)) then (yes) 
:throw new IllegalStateException("ExternalCommandWorker is not running.");;
stop
endif 
:log.info("{}: Deactivating ExternalCommandWorker.",
id);;
:terminatorActionQueue.add(TerminatorAction.DESTROY);;
:intshutdownGracePeriodMs=spec.shutdownGracePeriodMs()
.isPresent()? spec.shutdownGracePeriodMs().get():DEFAULT_SHUTDOWN_GRACE_PERIOD_MS;;
if (!executor.awaitTermination(shutdownGracePeriodMs,
TimeUnit.MILLISECONDS)) then (yes) 
:terminatorActionQueue.add(TerminatorAction.DESTROY_FORCIBLY);;
:executor.awaitTermination(1,TimeUnit.DAYS);;
endif 
:this.status=null ;;
:this.doneFuture=null ;;
:this.executor=null ;;
end
@enduml

