@startuml
!pragma layout smetana
start
note right
constructor UniformRandomPayloadGenerator(@JsonProperty ("size")intsize,
@JsonProperty ("seed")longseed,@JsonProperty ("padding")intpadding)
end note
if (padding<0||padding>size) then (yes) 
:throw new RuntimeException("Invalid value "+
padding+" for "+"padding: the number of padding bytes must not be smaller than "+
"0 or greater than the total payload size.");;
endif 
end
start
note right
intsize()
end note
:return size;;
stop
end
start
note right
longseed()
end note
:return seed;;
stop
end
start
note right
intpadding()
end note
:return padding;;
stop
end
start
note right
byte[]generate(longposition)
end note
if (randomBytes.length>0) then (yes) 
endif 
if (padBytes.length>0) then (yes) 
endif 
:return result;;
stop
end
@enduml

