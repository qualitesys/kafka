@startuml
!pragma layout smetana
start
note right
constructor RandomComponentPayloadGenerator(@JsonProperty ("seed")longseed,
@JsonProperty ("components")List<RandomComponent>components)
end note
if (components==null ||components.isEmpty()) then (yes) 
:throw new IllegalArgumentException("Components must be a specified,
 non-empty list of RandomComponents.");;
endif 
if (component.percent()<1) then (yes) 
:throw new IllegalArgumentException("Percent value must be greater than zero.");;
endif 
if (sum!=100) then (yes) 
:throw new IllegalArgumentException("Components must be a list of RandomComponents such that the percent fields sum to 100");;
endif 
end
start
note right
longseed()
end note
:return seed;;
stop
end
start
note right
List<RandomComponent>components()
end note
:return components;;
stop
end
start
note right
byte[]generate(longposition)
end note
if (curPercent>randPercent) then (yes) 
endif 
:return com.component().generate(position);;
stop
end
@enduml

