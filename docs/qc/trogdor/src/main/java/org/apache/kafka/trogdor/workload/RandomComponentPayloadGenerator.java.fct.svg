@startuml
!pragma layout smetana
start
note right
constructor RandomComponentPayloadGenerator(@JsonProperty ("seed")longseed,@JsonProperty ("components")List<RandomComponent>components)
end note
:this.seed=seed;
if (components==null ||components.isEmpty()) then (yes) 
endif 
if (component.percent()<1) then (yes) 
endif 
:sum+=component.percent();
if (sum!=100) then (yes) 
endif 
:this.components=new ArrayList<>(components);
end
start
note right
longseed()
end note
:return seed;;
stop
end
start
note right
List<RandomComponent>components()
end note
:return components;;
stop
end
start
note right
byte[]generate(longposition)
end note
:random.setSeed(seed+position);
:randPercent=random.nextInt(100);
:curPercent+=component.percent();
if (curPercent>randPercent) then (yes) 
:com=component;
endif 
:return com.component().generate(position);;
stop
end
@enduml

