@startuml
!pragma layout smetana
start
note right
constructor NoOpTaskSpec(@JsonProperty ("startMs")longstartMs,
@JsonProperty ("durationMs")longdurationMs)
end note
:super (startMs,durationMs);;
end
start
note right
TaskControllernewController(Stringid)
end note
:return new NoOpTaskController();;
stop
end
start
note right
TaskWorkernewTaskWorker(Stringid)
end note
:return new NoOpTaskWorker(id);;
stop
end
@enduml

