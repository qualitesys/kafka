@startuml
!pragma layout smetana
start
note right
constructor TopicsSpec()
end note
:this.map=new HashMap<>();
end
start
note right
constructor TopicsSpec(Map<String,PartitionsSpec>map)
end note
:this.map=map;
end
start
note right
Map<String,PartitionsSpec>get()
end note
:return map;;
stop
end
start
note right
void set(Stringname,PartitionsSpecvalue)
end note
:map.put(name,value);
end
start
note right
TopicsSpecimmutableCopy()
end note
:mapCopy.putAll(map);
:return new TopicsSpec(Collections.unmodifiableMap(mapCopy));;
stop
end
start
