start
note right
constructor TopicsSpec()
end note
:this.map=new HashMap<>();;
end
start
note right
constructor TopicsSpec(Map<String,PartitionsSpec> map)
end note
:this.map=map;;
end
start
note right
Map<String,PartitionsSpec> get()
end note
:return map;;
stop
end
start
note right
void set(String name,PartitionsSpec value)
end note
:map.put(name,value);;
end
start
note right
TopicsSpec immutableCopy()
end note
:HashMap<String,PartitionsSpec> mapCopy=new HashMap<>();;
:mapCopy.putAll(map);;
:return new TopicsSpec(Collections.unmodifiableMap(mapCopy));;
stop
end
start
note right
Map<String,PartitionsSpec> materialize()
end note
:HashMap<String,PartitionsSpec> all=new HashMap<>();;
:String topicName=entry.getKey();;
:PartitionsSpec partitions=entry.getValue();;
:all.put(expandedTopicName,partitions);;
:return all;;
stop
end
