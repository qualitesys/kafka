@startuml
!pragma layout smetana
start
note right
constructor NetworkPartitionFaultController(List<Set<String>> partitionSets)
end note
:this.partitionSets=partitionSets;;
end
start
note right
Set<String> targetNodes(Topology topology)
end note
:Set<String> targetNodes=new HashSet<>();;
:targetNodes.addAll(partitionSet);;
:return targetNodes;;
stop
end
@enduml

