@startuml
!pragma layout smetana
start
note right
constructor NetworkPartitionFaultController(List<Set<String>>partitionSets)
end note
:this.partitionSets=partitionSets;;
end
start
note right
Set<String>targetNodes(Topologytopology)
end note
:targetNodes.addAll(partitionSet);;
:return targetNodes;;
stop
end
@enduml

