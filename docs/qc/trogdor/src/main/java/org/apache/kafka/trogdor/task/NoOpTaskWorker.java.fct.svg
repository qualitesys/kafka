@startuml
!pragma layout smetana
start
note right
constructor NoOpTaskWorker(Stringid)
end note
:this.id=id;
end
start
note right
void start(Platformplatform,WorkerStatusTrackerstatus,
KafkaFutureImpl<String>errorFuture)
end note
:log.info("{}: Activating NoOpTask.",id);
:this.status=status;
:this.status.update(new TextNode("active"));
end
start
note right
void stop(Platformplatform)
end note
:log.info("{}: Deactivating NoOpTask.",id);
:this.status.update(new TextNode("done"));
end
@enduml

