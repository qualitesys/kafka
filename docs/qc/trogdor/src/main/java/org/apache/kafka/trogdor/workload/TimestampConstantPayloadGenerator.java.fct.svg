@startuml
!pragma layout smetana
start
note right
constructor TimestampConstantPayloadGenerator(@JsonProperty ("size")intsize)
end note
:this.size=size;
if (size<Long.BYTES) then (yes) 
endif 
:buffer=ByteBuffer.allocate(Long.BYTES);
:buffer.order(ByteOrder.LITTLE_ENDIAN);
end
start
note right
intsize()
end note
:return size;;
stop
end
start
note right
byte[]generate(longposition)
end note
:buffer.clear();
:buffer.putLong(Time.SYSTEM.milliseconds());
:buffer.rewind();
:System.arraycopy(buffer.array(),0,result,0,Long.BYTES);
:return result;;
stop
end
@enduml

