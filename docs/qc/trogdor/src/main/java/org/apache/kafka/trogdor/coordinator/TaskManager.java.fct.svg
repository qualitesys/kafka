@startuml
!pragma layout smetana
start
note right
constructor TaskManager(Platformplatform,
Schedulerscheduler,longfirstWorkerId)
end note
:this.platform=platform;;
:this.scheduler=scheduler;;
:this.time=scheduler.time();;
:this.tasks=new HashMap<>();;
:this.executor=Executors.newSingleThreadScheduledExecutor(ThreadUtils.createThreadFactory("TaskManagerStateThread",
false));;
:this.nodeManagers=new HashMap<>();;
:this.nextWorkerId=firstWorkerId;;
if (Node.Util.getTrogdorAgentPort(node)>0) then (yes) 
:this.nodeManagers.put(node.name(),new NodeManager(node,
this));;
endif 
:log.info("Created TaskManager for agent(s) on: {}",
Utils.join(nodeManagers.keySet(),", "));;
end
start
note right
constructor ManagedTask(Stringid,TaskSpecoriginalSpec,
TaskSpecspec,TaskControllercontroller,TaskStateTypestate)
end note
:this.id=id;;
:this.originalSpec=originalSpec;;
:this.spec=spec;;
:this.controller=controller;;
:this.state=state;;
end
start
note right
void clearStartFuture()
end note
if (startFuture!=null ) then (yes) 
:startFuture.cancel(false);;
:startFuture=null ;;
endif 
end
start
note right
longstartDelayMs(longnow)
end note
if (now>spec.startMs()) then (yes) 
:return 0;;
stop
endif 
:return spec.startMs()-now;;
stop
end
start
note right
TreeSet<String>findNodeNames()
end note
:Set<String>nodeNames=controller.targetNodes(platform.topology());;
:TreeSet<String>validNodeNames=new TreeSet<>();;
:TreeSet<String>nonExistentNodeNames=new TreeSet<>();;
if (nodeManagers.containsKey(nodeName)) then (yes) 
:validNodeNames.add(nodeName);;
else (no)
:nonExistentNodeNames.add(nodeName);;
endif 
if (!nonExistentNodeNames.isEmpty()) then (yes) 
:throw new KafkaException("Unknown node names: "+
Utils.join(nonExistentNodeNames,", "));;
stop
endif 
if (validNodeNames.isEmpty()) then (yes) 
:throw new KafkaException("No node names specified.");;
stop
endif 
:return validNodeNames;;
stop
end
start
note right
void maybeSetError(StringnewError)
end note
if (error.isEmpty()) then (yes) 
:error=newError;;
endif 
end
start
note right
TaskStatetaskState()
end note
switch (switch (state))
endswith
:throw new RuntimeException("unreachable");;
stop
end
start
note right
JsonNodegetCombinedStatus()
end note
if (workerIds.size()==1) then (yes) 
:return workerStates.get(workerIds.values()
.iterator().next()).status();;
stop
else (no)
:ObjectNodeobjectNode=new ObjectNode(JsonNodeFactory.instance);;
:StringnodeName=entry.getKey();;
:LongworkerId=entry.getValue();;
:WorkerStatestate=workerStates.get(workerId);;
:JsonNodenode=state.status();;
if (node!=null ) then (yes) 
:objectNode.set(nodeName,node);;
endif 
:return objectNode;;
stop
endif 
end
start
note right
TreeMap<String,Long>activeWorkerIds()
end note
:TreeMap<String,Long>activeWorkerIds=new TreeMap<>();;
:WorkerStateworkerState=workerStates.get(entry.getValue());;
if (!workerState.done()) then (yes) 
:activeWorkerIds.put(entry.getKey(),entry.getValue());;
endif 
:return activeWorkerIds;;
stop
end
start
note right
void createTask(final Stringid,TaskSpecspec)
end note
:try ;
:executor.submit(new CreateTask(id,spec))
.get();;
:catch (ExecutionException|JsonProcessingExceptione);
:log.info("createTask(id={}, spec={}) error",
id,spec,e);;
:throw e.getCause();;
stop
end
start
note right
constructor CreateTask(Stringid,TaskSpecspec)
end note
:this.id=id;;
:this.originalSpec=spec;;
:ObjectNodenode=JsonUtil.JSON_SERDE.valueToTree(originalSpec);;
:node.set("startMs",new LongNode(Math.max(time.milliseconds(),
originalSpec.startMs())));;
:this.spec=JsonUtil.JSON_SERDE.treeToValue(node,
TaskSpec.class );;
end
start
note right
Voidcall()
end note
if (id.isEmpty()) then (yes) 
:throw new InvalidRequestException("Invalid empty ID in createTask request.");;
stop
endif 
:ManagedTasktask=tasks.get(id);;
if (task!=null ) then (yes) 
if (!task.originalSpec.equals(originalSpec)) then (yes) 
:throw new RequestConflictException("Task ID "+
id+" already "+"exists, and has a different spec "+
task.originalSpec);;
stop
endif 
:log.info("Task {} already exists with spec {}",
id,originalSpec);;
:return null ;;
stop
endif 
:TaskControllercontroller=null ;;
:Stringfailure=null ;;
:try ;
:controller=spec.newController(id);;
:catch (Throwablet);
:failure="Failed to create TaskController: "+
t.getMessage();;
if (failure!=null ) then (yes) 
:log.info("Failed to create a new task {} with spec {}: {}",
id,spec,failure);;
:task=new ManagedTask(id,originalSpec,spec,
null ,TaskStateType.DONE);;
:task.doneMs=time.milliseconds();;
:task.maybeSetError(failure);;
:tasks.put(id,task);;
:return null ;;
stop
endif 
:task=new ManagedTask(id,originalSpec,spec,
controller,TaskStateType.PENDING);;
:tasks.put(id,task);;
:longdelayMs=task.startDelayMs(time.milliseconds());;
:task.startFuture=scheduler.schedule(executor,
new RunTask(task),delayMs);;
:log.info("Created a new task {} with spec {},
 scheduled to start {} ms from now.",id,spec,
delayMs);;
:return null ;;
stop
end
start
note right
constructor RunTask(ManagedTasktask)
end note
:this.task=task;;
end
start
note right
Voidcall()
end note
:task.clearStartFuture();;
if (task.state!=TaskStateType.PENDING) then (yes) 
:log.info("Can't start task {}, because it is already in state {}.",
task.id,task.state);;
:return null ;;
stop
endif 
:TreeSet<String>nodeNames;;
:try ;
:nodeNames=task.findNodeNames();;
:catch (Exceptione);
:log.error("Unable to find nodes for task {}",
task.id,e);;
:task.doneMs=time.milliseconds();;
:task.state=TaskStateType.DONE;;
:task.maybeSetError("Unable to find nodes for task: "+
e.getMessage());;
:return null ;;
stop
:log.info("Running task {} on node(s): {}",
task.id,Utils.join(nodeNames,", "));;
:task.state=TaskStateType.RUNNING;;
:task.startedMs=time.milliseconds();;
:longworkerId=nextWorkerId++;;
:task.workerIds.put(workerName,workerId);;
:workerStates.put(workerId,new WorkerReceiving(task.id,
task.spec));;
:nodeManagers.get(workerName).createWorker(workerId,
task.id,task.spec);;
:return null ;;
stop
end
start
note right
void stopTask(final Stringid)
end note
:try ;
:executor.submit(new CancelTask(id)).get();;
:catch (ExecutionExceptione);
:log.info("stopTask(id={}) error",id,e);;
:throw e.getCause();;
stop
end
start
note right
constructor CancelTask(Stringid)
end note
:this.id=id;;
end
start
note right
Voidcall()
end note
if (id.isEmpty()) then (yes) 
:throw new InvalidRequestException("Invalid empty ID in stopTask request.");;
stop
endif 
:ManagedTasktask=tasks.get(id);;
if (task==null ) then (yes) 
:log.info("Can't cancel non-existent task {}.",
id);;
:return null ;;
stop
endif 
switch (switch (task.state))
endswith
:return null ;;
stop
end
start
note right
void destroyTask(Stringid)
end note
:try ;
:executor.submit(new DestroyTask(id)).get();;
:catch (ExecutionExceptione);
:log.info("destroyTask(id={}) error",id,e);;
:throw e.getCause();;
stop
end
start
note right
constructor DestroyTask(Stringid)
end note
:this.id=id;;
end
start
note right
Voidcall()
end note
if (id.isEmpty()) then (yes) 
:throw new InvalidRequestException("Invalid empty ID in destroyTask request.");;
stop
endif 
:ManagedTasktask=tasks.remove(id);;
if (task==null ) then (yes) 
:log.info("Can't destroy task {}: no such task found.",
id);;
:return null ;;
stop
endif 
:log.info("Destroying task {}.",id);;
:task.clearStartFuture();;
:longworkerId=entry.getValue();;
:workerStates.remove(workerId);;
:StringnodeName=entry.getKey();;
:nodeManagers.get(nodeName).destroyWorker(workerId);;
:return null ;;
stop
end
start
note right
void updateWorkerState(StringnodeName,longworkerId,
WorkerStatestate)
end note
:executor.submit(new UpdateWorkerState(nodeName,
workerId,state));;
end
start
note right
constructor UpdateWorkerState(StringnodeName,
longworkerId,WorkerStatenextState)
end note
:this.nodeName=nodeName;;
:this.workerId=workerId;;
:this.nextState=nextState;;
end
start
note right
Voidcall()
end note
:try ;
:WorkerStateprevState=workerStates.get(workerId);;
if (prevState==null ) then (yes) 
:throw new RuntimeException("Unable to find workerId "+
workerId);;
stop
endif 
:ManagedTasktask=tasks.get(prevState.taskId());;
if (task==null ) then (yes) 
:throw new RuntimeException("Unable to find taskId "+
prevState.taskId());;
stop
endif 
:log.debug("Task {}: Updating worker state for {} on {} from {} to {}.",
task.id,workerId,nodeName,prevState,nextState);;
:workerStates.put(workerId,nextState);;
if (nextState.done()&&(!prevState.done())) then (yes) 
:handleWorkerCompletion(task,nodeName,(WorkerDone)nextState);;
endif 
:catch (Exceptione);
:log.error("Error updating worker state for {} on {}.  Stopping worker.",
workerId,nodeName,e);;
:nodeManagers.get(nodeName).stopWorker(workerId);;
:return null ;;
stop
end
start
note right
void handleWorkerCompletion(ManagedTasktask,
StringnodeName,WorkerDonestate)
end note
if (state.error().isEmpty()) then (yes) 
:log.info("{}: Worker {} finished with status '{}'",
nodeName,task.id,JsonUtil.toJsonString(state.status()));;
else (no)
:log.warn("{}: Worker {} finished with error '{}' and status '{}'",
nodeName,task.id,state.error(),JsonUtil.toJsonString(state.status()));;
:task.maybeSetError(state.error());;
endif 
:TreeMap<String,Long>activeWorkerIds=task.activeWorkerIds();;
if (activeWorkerIds.isEmpty()) then (yes) 
:task.doneMs=time.milliseconds();;
:task.state=TaskStateType.DONE;;
:log.info("{}: Task {} is now complete on {} with error: {}",
nodeName,task.id,Utils.join(task.workerIds.keySet(),
", "),task.error.isEmpty()? String.valueOf("(none)"):task.error);;
else if ((task.state==TaskStateType.RUNNING)&&(!task.error.isEmpty())) then (yes) 
:log.info("{}: task {} stopped with error {}.  Stopping worker(s): {}",
nodeName,task.id,task.error,Utils.mkString(activeWorkerIds,
"{","}",": ",", "));;
:task.state=TaskStateType.STOPPING;;
:nodeManagers.get(entry.getKey()).stopWorker(entry.getValue());;
endif 
end
start
note right
TasksResponsetasks(TasksRequestrequest)
end note
:return executor.submit(new GetTasksResponse(request))
.get();;
stop
end
start
note right
constructor GetTasksResponse(TasksRequestrequest)
end note
:this.request=request;;
end
start
note right
TasksResponsecall()
end note
:TreeMap<String,TaskState>states=new TreeMap<>();;
if (request.matches(task.id,task.startedMs,
task.doneMs,task.state)) then (yes) 
:states.put(task.id,task.taskState());;
endif 
:return new TasksResponse(states);;
stop
end
start
note right
TaskStatetask(TaskRequestrequest)
end note
:return executor.submit(new GetTaskState(request))
.get();;
stop
end
start
note right
constructor GetTaskState(TaskRequestrequest)
end note
:this.request=request;;
end
start
note right
TaskStatecall()
end note
:ManagedTasktask=tasks.get(request.taskId());;
if (task==null ) then (yes) 
:return null ;;
stop
endif 
:return task.taskState();;
stop
end
start
note right
void beginShutdown(booleanstopAgents)
end note
if (shutdown.compareAndSet(false,true)) then (yes) 
:executor.submit(new Shutdown(stopAgents));;
endif 
end
start
note right
void waitForShutdown()
end note
while (!executor.awaitTermination(1,TimeUnit.DAYS))
endwhile
end
start
note right
constructor Shutdown(booleanstopAgents)
end note
:this.stopAgents=stopAgents;;
end
start
note right
Voidcall()
end note
:log.info("Shutting down TaskManager{}.",
stopAgents? String.valueOf(" and agents"):String.valueOf(""));;
:nodeManager.beginShutdown(stopAgents);;
:nodeManager.waitForShutdown();;
:executor.shutdown();;
:return null ;;
stop
end
