@startuml
!pragma layout smetana
start
note right
constructor GaussianTimestampRandomPayloadGenerator(@JsonProperty ("messageSizeAverage")intmessageSizeAverage,
@JsonProperty ("messageSizeDeviation")doublemessageSizeDeviation,
@JsonProperty ("messagesUntilSizeChange")intmessagesUntilSizeChange,
@JsonProperty ("seed")longseed)
end note
end
start
note right
intmessageSizeAverage()
end note
:return messageSizeAverage;;
stop
end
start
note right
doublemessageSizeDeviation()
end note
:return messageSizeDeviation;;
stop
end
start
note right
intmessagesUntilSizeChange()
end note
:return messagesUntilSizeChange;;
stop
end
start
note right
longseed()
end note
:return seed;;
stop
end
start
note right
byte[]generate(longposition)
end note
if ((messageSize==0)||(messageTracker>=messagesUntilSizeChange)) then (yes) 
endif 
:return result;;
stop
end
@enduml

