@startuml
!pragma layout smetana
start
note right
constructor WorkerDone(@JsonProperty ("taskId")StringtaskId,
@JsonProperty ("spec")TaskSpecspec,@JsonProperty ("startedMs")longstartedMs,
@JsonProperty ("doneMs")longdoneMs,@JsonProperty ("status")JsonNodestatus,
@JsonProperty ("error")Stringerror)
end note
:super (taskId,spec);
:this.startedMs=startedMs;
:this.doneMs=doneMs;
:this.status=status==null ? NullNode.instance:status;
:this.error=error==null ? String.valueOf(""):error;
end
start
note right
longstartedMs()
end note
:return startedMs;;
stop
end
start
note right
longdoneMs()
end note
:return doneMs;;
stop
end
start
note right
JsonNodestatus()
end note
:return status;;
stop
end
start
note right
Stringerror()
end note
:return error;;
stop
end
start
note right
booleandone()
end note
:return true;;
stop
end
@enduml

