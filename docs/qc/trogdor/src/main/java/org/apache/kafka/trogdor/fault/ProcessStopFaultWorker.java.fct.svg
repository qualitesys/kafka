@startuml
!pragma layout smetana
start
note right
constructor ProcessStopFaultWorker(Stringid,
StringjavaProcessName)
end note
end
start
note right
void start(Platformplatform,WorkerStatusTrackerstatus,
KafkaFutureImpl<String>errorFuture)
end note
end
start
note right
void stop(Platformplatform)
end note
end
start
note right
void sendSignals(Platformplatform,StringsignalName)
end note
if (line.contains(javaProcessName)) then (yes) 
endif 
if (pids.isEmpty()) then (yes) 
else (no)
endif 
end
@enduml

