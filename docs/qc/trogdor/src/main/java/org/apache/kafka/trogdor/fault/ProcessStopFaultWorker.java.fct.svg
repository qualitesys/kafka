@startuml
!pragma layout smetana
start
note right
constructor ProcessStopFaultWorker(Stringid,StringjavaProcessName)
end note
:this.id=id;
:this.javaProcessName=javaProcessName;
end
start
note right
void start(Platformplatform,WorkerStatusTrackerstatus,KafkaFutureImpl<String>errorFuture)
end note
:this.status=status;
:log.info("Activating ProcessStopFault {}.",id);
:this.status.update(new TextNode("stopping "+javaProcessName));
:sendSignals(platform,"SIGSTOP");
:this.status.update(new TextNode("stopped "+javaProcessName));
end
start
note right
void stop(Platformplatform)
end note
:log.info("Deactivating ProcessStopFault {}.",id);
:this.status.update(new TextNode("resuming "+javaProcessName));
:sendSignals(platform,"SIGCONT");
:this.status.update(new TextNode("resumed "+javaProcessName));
end
start
note right
void sendSignals(Platformplatform,StringsignalName)
end note
if (line.contains(javaProcessName)) then (yes) 
:pids.add(Integer.parseInt(components[0]));
:log.error("Failed to parse process ID from line",e);
endif 
if (pids.isEmpty()) then (yes) 
:log.error("{}: no processes containing {} found to send {} to.",id,javaProcessName,signalName);
else (no)
:log.info("{}: sending {} to {} pid(s) {}",id,signalName,javaProcessName,Utils.join(pids,", "));
:platform.runCommand(new String[]{"kill","-"+signalName,pid.toString()});
endif 
