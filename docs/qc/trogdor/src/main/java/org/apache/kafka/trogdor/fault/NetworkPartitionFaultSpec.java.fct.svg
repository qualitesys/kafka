@startuml
!pragma layout smetana
start
note right
constructor NetworkPartitionFaultSpec(@JsonProperty ("startMs")long startMs,
@JsonProperty ("durationMs")long durationMs,
@JsonProperty ("partitions")List<List<String>> partitions)
end note
:super (startMs,durationMs);;
:this.partitions=partitions==null ? new ArrayList<List<String> >():partitions;;
end
start
note right
List<List<String>> partitions()
end note
:return partitions;;
stop
end
start
note right
TaskController newController(String id)
end note
:return new NetworkPartitionFaultController(partitionSets());;
stop
end
start
note right
TaskWorker newTaskWorker(String id)
end note
:return new NetworkPartitionFaultWorker(id,
partitionSets());;
stop
end
start
note right
List<Set<String>> partitionSets()
end note
:List<Set<String>> partitionSets=new ArrayList<>();;
:HashSet<String> prevNodes=new HashSet<>();;
if (prevNodes.contains(nodeName)) then (yes) 
:throw new RuntimeException("Node "+nodeName+
" appears in more than one partition.");;
stop
endif 
:prevNodes.add(nodeName);;
:partitionSets.add(new HashSet<>(partition));;
:return partitionSets;;
stop
end
@enduml

