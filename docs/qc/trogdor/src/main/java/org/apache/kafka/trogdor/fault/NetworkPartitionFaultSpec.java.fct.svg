@startuml
!pragma layout smetana
start
note right
constructor NetworkPartitionFaultSpec(@JsonProperty ("startMs")longstartMs,@JsonProperty ("durationMs")longdurationMs,@JsonProperty ("partitions")List<List<String>>partitions)
end note
:super (startMs,durationMs);
:this.partitions=partitions==null ? new ArrayList<List<String>>():partitions;
end
start
note right
List<List<String>>partitions()
end note
:return partitions;;
stop
end
start
note right
TaskControllernewController(Stringid)
end note
:return new NetworkPartitionFaultController(partitionSets());;
stop
end
start
note right
TaskWorkernewTaskWorker(Stringid)
end note
:return new NetworkPartitionFaultWorker(id,partitionSets());;
stop
end
start
note right
List<Set<String>>partitionSets()
end note
if (prevNodes.contains(nodeName)) then (yes) 
endif 
:prevNodes.add(nodeName);
:partitionSets.add(new HashSet<>(partition));
:return partitionSets;;
stop
end
@enduml

