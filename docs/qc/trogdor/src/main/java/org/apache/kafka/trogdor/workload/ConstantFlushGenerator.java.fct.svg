@startuml
!pragma layout smetana
start
note right
constructor ConstantFlushGenerator(@JsonProperty ("messagesPerFlush")int messagesPerFlush)
end note
:this.messagesPerFlush=messagesPerFlush;;
end
start
note right
int messagesPerFlush()
end note
:return messagesPerFlush;;
stop
end
:messageTracker+=1;;
if (messageTracker>=messagesPerFlush) then (yes) 
:messageTracker=0;;
switch (try/catch block)
case (try)
:producer.flush();;
case (catch (InterruptException e))
endswitch
endif 
@enduml

