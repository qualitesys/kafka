@startuml
!pragma layout smetana
start
note right
constructor ConstantFlushGenerator(@JsonProperty ("messagesPerFlush")intmessagesPerFlush)
end note
:this.messagesPerFlush=messagesPerFlush;;
end
start
note right
intmessagesPerFlush()
end note
:return messagesPerFlush;;
stop
end
:messageTracker+=1;;
if (messageTracker>=messagesPerFlush) then (yes) 
:messageTracker=0;;
:try {producer.flush();}catch (InterruptExceptione){};
endif 
@enduml

