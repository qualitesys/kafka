@startuml
!pragma layout smetana
start
note right
constructor WorkerState(StringtaskId,TaskSpecspec)
end note
:this.taskId=taskId;
:this.spec=spec;
end
start
note right
StringtaskId()
end note
:return taskId;;
stop
end
start
note right
TaskSpecspec()
end note
:return spec;;
stop
end
start
note right
booleanstopping()
end note
:return false;;
stop
end
start
note right
booleandone()
end note
:return false;;
stop
end
start
note right
longstartedMs()
end note
:throw new KafkaException("invalid state");;
end
start
note right
booleanrunning()
end note
:return false;;
stop
end
@enduml

