@startuml
!pragma layout smetana
start
note right
boolean equals(Object o)
end note
if (this==o) then (yes) 
:return true;;
stop
endif 
if (o==null ||getClass()!=o.getClass()) then (yes) 
:return false;;
stop
endif 
:return Objects.equals(toString(),o.toString());;
stop
end
start
note right
int hashCode()
end note
:return toString().hashCode();;
stop
end
start
note right
String toString()
end note
:return JsonUtil.toJsonString(this);;
stop
end
@enduml

