@startuml
!pragma layout smetana
start
note right
Set<String> agentNodeNames(Topology topology)
end note
:Set<String> set=new HashSet<>();;
if (entry.getValue().getConfig(Platform.Config.TROGDOR_AGENT_PORT)!=null ) then (yes) 
:set.add(entry.getKey());;
endif 
:return set;;
stop
end
@enduml

