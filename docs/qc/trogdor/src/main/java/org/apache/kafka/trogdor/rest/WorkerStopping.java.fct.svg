@startuml
!pragma layout smetana
start
note right
constructor WorkerStopping(@JsonProperty ("taskId")StringtaskId,
@JsonProperty ("spec")TaskSpecspec,@JsonProperty ("startedMs")longstartedMs,
@JsonProperty ("status")JsonNodestatus)
end note
end
start
note right
longstartedMs()
end note
:return startedMs;;
stop
end
start
note right
JsonNodestatus()
end note
:return status;;
stop
end
start
note right
booleanstopping()
end note
:return true;;
stop
end
start
note right
booleanrunning()
end note
:return true;;
stop
end
@enduml

