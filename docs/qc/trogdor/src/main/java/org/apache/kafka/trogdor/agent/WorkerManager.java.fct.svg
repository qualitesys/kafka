@startuml
!pragma layout smetana
start
note right
void close()
end note
if (closed.compareAndSet(false,true)) then (yes) 
:synchronized (ShutdownManager.this){refCount- -;
:if (shutdown&&(refCount==0)){ShutdownManager.this.notifyAll();}};
endif 
end
start
note right
ReferencetakeReference()
end note
if (shutdown) then (yes) 
:throw new KafkaException("WorkerManager is shut down.");;
stop
endif 
:refCount++;;
:return new Reference();;
stop
end
start
note right
booleanshutdown()
end note
if (shutdown) then (yes) 
:return false;;
stop
endif 
:shutdown=true;;
if (refCount==0) then (yes) 
:this.notifyAll();;
endif 
:return true;;
stop
end
start
note right
void waitForQuiescence()
end note
while ((!shutdown)||(refCount>0))
:this.wait();;
endwhile
end
start
note right
constructor WorkerManager(Platformplatform,
Schedulerscheduler)
end note
:this.platform=platform;;
:this.nodeName=platform.curNode().name();;
:this.scheduler=scheduler;;
:this.time=scheduler.time();;
:this.workers=new HashMap<>();;
:this.stateChangeExecutor=Executors.newSingleThreadScheduledExecutor(ThreadUtils.createThreadFactory("WorkerManagerStateThread",
false));;
:this.workerCleanupExecutor=Executors.newCachedThreadPool(ThreadUtils.createThreadFactory("WorkerCleanupThread%d",
false));;
:this.shutdownExecutor=Executors.newScheduledThreadPool(0,
ThreadUtils.createThreadFactory("WorkerManagerShutdownThread%d",
false));;
end
start
note right
constructor Worker(longworkerId,StringtaskId,
TaskSpecspec,longnow)
end note
:this.workerId=workerId;;
:this.taskId=taskId;;
:this.spec=spec;;
:this.taskWorker=spec.newTaskWorker(taskId);;
:this.startedMs=now;;
:this.reference=shutdownManager.takeReference();;
end
start
note right
longworkerId()
end note
:return workerId;;
stop
end
start
note right
StringtaskId()
end note
:return taskId;;
stop
end
start
note right
TaskSpecspec()
end note
:return spec;;
stop
end
start
note right
WorkerStatestate()
end note
switch (switch (state))
endswith
:throw new RuntimeException("unreachable");;
stop
end
start
note right
void transitionToRunning()
end note
:state=State.RUNNING;;
:timeoutFuture=scheduler.schedule(stateChangeExecutor,
new StopWorker(workerId,false),Math.max(0,
spec.endMs()-time.milliseconds()));;
end
start
note right
Future<Void>transitionToStopping()
end note
:state=State.STOPPING;;
if (timeoutFuture!=null ) then (yes) 
:timeoutFuture.cancel(false);;
:timeoutFuture=null ;;
endif 
:return workerCleanupExecutor.submit(new HaltWorker(this));;
stop
end
start
note right
void transitionToDone()
end note
:state=State.DONE;;
:doneMs=time.milliseconds();;
if (reference!=null ) then (yes) 
:reference.close();;
:reference=null ;;
endif 
:doneFuture.complete(error);;
end
start
note right
StringtoString()
end note
:return String.format("%s_%d",taskId,workerId);;
stop
end
start
note right
KafkaFuture<String>createWorker(longworkerId,
StringtaskId,TaskSpecspec)
end note
:try ;
:final Workerworker=stateChangeExecutor.submit(new CreateWorker(workerId,
taskId,spec,time.milliseconds())).get();;
if (worker.doneFuture!=null ) then (yes) 
:log.info("{}: Ignoring request to create worker {}, because there is already "+
"a worker with that id.",nodeName,workerId);;
:return worker.doneFuture;;
stop
endif 
:worker.doneFuture=new KafkaFutureImpl<>();;
if (worker.spec.endMs()<=time.milliseconds()) then (yes) 
:log.info("{}: Will not run worker {} as it has expired.",
nodeName,worker);;
:stateChangeExecutor.submit(new HandleWorkerHalting(worker,
"worker expired",true));;
:return worker.doneFuture;;
stop
endif 
:KafkaFutureImpl<String>haltFuture=new KafkaFutureImpl<>();;
:haltFuture.thenApply((KafkaFuture.BaseFunction<String,
Void>)errorString->{if (errorString==null )errorString="";if (errorString.isEmpty()){log.info("{}: Worker {} is halting.",
nodeName,worker);}else {log.info("{}: Worker {} is halting with error {}",
nodeName,worker,errorString);}stateChangeExecutor.submit(new HandleWorkerHalting(worker,
errorString,false));return null ;});;
:try ;
:worker.taskWorker.start(platform,worker.status,
haltFuture);;
:catch (Exceptione);
:log.info("{}: Worker {} start() exception",
nodeName,worker,e);;
:stateChangeExecutor.submit(new HandleWorkerHalting(worker,"worker.start() exception: "+
Utils.stackTrace(e),true));;
:stateChangeExecutor.submit(new FinishCreatingWorker(worker));;
:return worker.doneFuture;;
stop
:catch (ExecutionExceptione);
if (e.getCause() instanceof RequestConflictException) then (yes) 
:log.info("{}: request conflict while creating worker {} for task {} with spec {}.",
nodeName,workerId,taskId,spec);;
else (no)
:log.info("{}: Error creating worker {} for task {} with spec {}",
nodeName,workerId,taskId,spec,e);;
endif 
:throw e.getCause();;
stop
end
start
note right
constructor CreateWorker(longworkerId,StringtaskId,
TaskSpecspec,longnow)
end note
:this.workerId=workerId;;
:this.taskId=taskId;;
:this.spec=spec;;
:this.now=now;;
end
start
note right
Workercall()
end note
:try ;
:Workerworker=workers.get(workerId);;
if (worker!=null ) then (yes) 
if (!worker.taskId().equals(taskId)) then (yes) 
:throw new RequestConflictException("There is already a worker ID "+
workerId+" with a different task ID.");;
stop
else if (!worker.spec().equals(spec)) then (yes) 
:throw new RequestConflictException("There is already a worker ID "+
workerId+" with a different task spec.");;
stop
else (no)
:return worker;;
stop
endif 
endif 
:worker=new Worker(workerId,taskId,spec,now);;
:workers.put(workerId,worker);;
:log.info("{}: Created worker {} with spec {}",
nodeName,worker,spec);;
:return worker;;
stop
:catch (Exceptione);
:log.info("{}: unable to create worker {} for task {},
 with spec {}",nodeName,workerId,taskId,spec,e);;
:throw e;;
stop
end
start
note right
constructor FinishCreatingWorker(Workerworker)
end note
:this.worker=worker;;
end
start
note right
Voidcall()
end note
switch (switch (worker.state))
endswith
:return null ;;
stop
end
start
note right
constructor HandleWorkerHalting(Workerworker,
Stringfailure,booleanstartupHalt)
end note
:this.worker=worker;;
:this.failure=failure;;
:this.startupHalt=startupHalt;;
end
start
note right
Voidcall()
end note
if (worker.error.isEmpty()) then (yes) 
:worker.error=failure;;
endif 
:Stringverb=(worker.error.isEmpty())? String.valueOf("halting"):String.valueOf("halting with error [")+
worker.error+"]";;
switch (switch (worker.state))
endswith
:return null ;;
stop
end
start
note right
constructor CompleteWorker(Workerworker,Stringfailure)
end note
:this.worker=worker;;
:this.failure=failure;;
end
start
note right
Voidcall()
end note
if (worker.error.isEmpty()&&!failure.isEmpty()) then (yes) 
:worker.error=failure;;
endif 
:worker.transitionToDone();;
if (worker.mustDestroy) then (yes) 
:log.info("{}: destroying worker {} with error {}",
nodeName,worker,worker.error);;
:workers.remove(worker.workerId);;
else (no)
:log.info("{}: completed worker {} with error {}",
nodeName,worker,worker.error);;
endif 
:return null ;;
stop
end
start
note right
void stopWorker(longworkerId,booleanmustDestroy)
end note
:try ;
:stateChangeExecutor.submit(new StopWorker(workerId,
mustDestroy)).get();;
:catch (ExecutionExceptione);
:throw e.getCause();;
stop
end
start
note right
constructor StopWorker(longworkerId,booleanmustDestroy)
end note
:this.workerId=workerId;;
:this.mustDestroy=mustDestroy;;
end
start
note right
Voidcall()
end note
:Workerworker=workers.get(workerId);;
if (worker==null ) then (yes) 
:log.info("{}: Can't stop worker {} because there is no worker with that ID.",
nodeName,workerId);;
:return null ;;
stop
endif 
if (mustDestroy) then (yes) 
:worker.mustDestroy=true;;
endif 
switch (switch (worker.state))
endswith
:return null ;;
stop
end
start
note right
constructor HaltWorker(Workerworker)
end note
:this.worker=worker;;
end
start
note right
Voidcall()
end note
:Stringfailure="";;
:try ;
:worker.taskWorker.stop(platform);;
:catch (Exceptionexception);
:log.error("{}: worker.stop() exception",
nodeName,exception);;
:failure=exception.getMessage();;
:stateChangeExecutor.submit(new CompleteWorker(worker,
failure));;
:return null ;;
stop
end
start
note right
TreeMap<Long,WorkerState>workerStates()
end note
:try ;
:return stateChangeExecutor.submit(new GetWorkerStates())
.get();;
stop
end
start
note right
TreeMap<Long,WorkerState>call()
end note
:TreeMap<Long,WorkerState>workerMap=new TreeMap<>();;
:workerMap.put(worker.workerId(),worker.state());;
:return workerMap;;
stop
end
start
note right
void beginShutdown()
end note
if (shutdownManager.shutdown()) then (yes) 
:shutdownExecutor.submit(new Shutdown());;
endif 
end
start
note right
void waitForShutdown()
end note
while (!shutdownExecutor.isShutdown())
:shutdownExecutor.awaitTermination(1,TimeUnit.DAYS);;
endwhile
end
start
note right
Voidcall()
end note
:log.info("{}: Shutting down WorkerManager.",
nodeName);;
:try ;
:stateChangeExecutor.submit(new DestroyAllWorkers())
.get();;
:log.info("{}: Waiting for shutdownManager quiescence...",
nodeName);;
:shutdownManager.waitForQuiescence();;
:workerCleanupExecutor.shutdownNow();;
:stateChangeExecutor.shutdownNow();;
:log.info("{}: Waiting for workerCleanupExecutor to terminate...",
nodeName);;
:workerCleanupExecutor.awaitTermination(1,
TimeUnit.DAYS);;
:log.info("{}: Waiting for stateChangeExecutor to terminate...",
nodeName);;
:stateChangeExecutor.awaitTermination(1,TimeUnit.DAYS);;
:log.info("{}: Shutting down shutdownExecutor.",
nodeName);;
:shutdownExecutor.shutdown();;
:catch (Exceptione);
:log.info("{}: Caught exception while shutting down WorkerManager",
nodeName,e);;
:throw e;;
stop
:return null ;;
stop
end
start
note right
Voidcall()
end note
:log.info("{}: Destroying all workers.",nodeName);;
:ArrayList<Long>workerIds=new ArrayList<>(workers.keySet());;
