@startuml
!pragma layout smetana
start
note right
constructor Throttle(intmaxPerPeriod,intperiodMs)
end note
:this.maxPerPeriod=maxPerPeriod;;
:this.periodMs=periodMs;;
:this.count=maxPerPeriod;;
:this.prevPeriod=-1;;
:this.lastTimeMs=0;;
end
start
note right
booleanincrement()
end note
:booleanthrottled=false;;
:while (true){if (count<maxPerPeriod){count+
+;return throttled;}lastTimeMs=time().milliseconds();longcurPeriod=lastTimeMs/periodMs;if (curPeriod<=prevPeriod){longnextPeriodMs=(curPeriod+
1)*periodMs;delay(nextPeriodMs-lastTimeMs);throttled=true;}else {prevPeriod=curPeriod;count=0;}};
end
start
note right
longlastTimeMs()
end note
:return lastTimeMs;;
stop
end
start
note right
Timetime()
end note
:return Time.SYSTEM;;
stop
end
start
note right
void delay(longamount)
end note
if (amount>0) then (yes) 
:wait(amount);;
endif 
end
@enduml

