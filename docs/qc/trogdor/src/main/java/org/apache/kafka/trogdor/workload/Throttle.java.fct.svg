@startuml
!pragma layout smetana
start
note right
constructor Throttle(intmaxPerPeriod,intperiodMs)
end note
end
start
note right
booleanincrement()
end note
while (true)
if (count<maxPerPeriod) then (yes) 
:return throttled;;
stop
endif 
if (curPeriod<=prevPeriod) then (yes) 
else (no)
endif 
endwhile
end
start
note right
longlastTimeMs()
end note
:return lastTimeMs;;
stop
end
start
note right
Timetime()
end note
:return Time.SYSTEM;;
stop
end
start
note right
void delay(longamount)
end note
if (amount>0) then (yes) 
endif 
end
@enduml

