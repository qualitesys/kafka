@startuml
!pragma layout smetana
start
note right
constructor ProduceBenchWorker(Stringid,ProduceBenchSpecspec)
end note
:this.id=id;;
:this.spec=spec;;
end
start
note right
void start(Platformplatform,WorkerStatusTrackerstatus,
KafkaFutureImpl<String>doneFuture)
end note
if (!running.compareAndSet(false,true)) then (yes) 
:throw new IllegalStateException("ProducerBenchWorker is already running.");;
stop
endif 
:log.info("{}: Activating ProduceBenchWorker with {}",
id,spec);;
:this.executor=Executors.newScheduledThreadPool(2,
ThreadUtils.createThreadFactory("ProduceBenchWorkerThread%d",
false));;
:this.status=status;;
:this.doneFuture=doneFuture;;
:executor.submit(new Prepare());;
end
start
note right
void run()
end note
:try ;
:Map<String,NewTopic>newTopics=new HashMap<>();;
:HashSet<TopicPartition>active=new HashSet<>();;
:StringtopicName=entry.getKey();;
:PartitionsSpecpartSpec=entry.getValue();;
:newTopics.put(topicName,partSpec.newTopic(topicName));;
:active.add(new TopicPartition(topicName,
partitionNumber));;
if (active.isEmpty()) then (yes) 
:throw new RuntimeException("You must specify at least one active topic.");;
stop
endif 
:StringtopicName=entry.getKey();;
:PartitionsSpecpartSpec=entry.getValue();;
:newTopics.put(topicName,partSpec.newTopic(topicName));;
:status.update(new TextNode("Creating "+newTopics.keySet().size()+
" topic(s)"));;
:WorkerUtils.createTopics(log,spec.bootstrapServers(),
spec.commonClientConf(),spec.adminClientConf(),
newTopics,false);;
:status.update(new TextNode("Created "+newTopics.keySet().size()+
" topic(s)"));;
:executor.submit(new SendRecords(active));;
:catch (Throwablee);
:WorkerUtils.abort(log,"Prepare",e,doneFuture);;
end
start
note right
constructor SendRecordsCallback(SendRecordssendRecords,
longstartMs)
end note
:this.sendRecords=sendRecords;;
:this.startMs=startMs;;
end
start
note right
void onCompletion(RecordMetadatametadata,
Exceptionexception)
end note
:longnow=Time.SYSTEM.milliseconds();;
:longdurationMs=now-startMs;;
:sendRecords.recordDuration(durationMs);;
if (exception!=null ) then (yes) 
:log.error("SendRecordsCallback: error",exception);;
endif 
end
start
note right
constructor SendRecordsThrottle(intmaxPerPeriod,
KafkaProducer<? ,? >producer)
end note
:super (maxPerPeriod,THROTTLE_PERIOD_MS);;
:this.producer=producer;;
end
start
note right
void delay(longamount)
end note
:longstartMs=time().milliseconds();;
:producer.flush();;
:longendMs=time().milliseconds();;
:longdelta=endMs-startMs;;
:super .delay(amount-delta);;
end
start
note right
constructor SendRecords(HashSet<TopicPartition>activePartitions)
end note
:this.activePartitions=activePartitions;;
:this.partitionsIterator=activePartitions.iterator();;
:this.histogram=new Histogram(10000);;
:this.transactionGenerator=spec.transactionGenerator();;
:this.enableTransactions=this.transactionGenerator.isPresent();;
:this.transactionsCommitted=new AtomicLong();;
:intperPeriod=WorkerUtils.perSecToPerPeriod(spec.targetMessagesPerSec(),
THROTTLE_PERIOD_MS);;
:this.statusUpdaterFuture=executor.scheduleWithFixedDelay(new StatusUpdater(histogram,
transactionsCommitted),30,30,TimeUnit.SECONDS);;
:Propertiesprops=new Properties();;
:props.put(ProducerConfig.BOOTSTRAP_SERVERS_CONFIG,
spec.bootstrapServers());;
if (enableTransactions) then (yes) 
:props.put(ProducerConfig.TRANSACTIONAL_ID_CONFIG,"produce-bench-transaction-id-"+
UUID.randomUUID());;
endif 
:WorkerUtils.addConfigsToProperties(props,
spec.commonClientConf(),spec.producerConf());;
:this.producer=new KafkaProducer<>(props,
new ByteArraySerializer(),new ByteArraySerializer());;
:this.keys=new PayloadIterator(spec.keyGenerator());;
:this.values=new PayloadIterator(spec.valueGenerator());;
if (spec.skipFlush()) then (yes) 
:this.throttle=new Throttle(perPeriod,THROTTLE_PERIOD_MS);;
else (no)
:this.throttle=new SendRecordsThrottle(perPeriod,
producer);;
endif 
end
start
note right
Voidcall()
end note
:longstartTimeMs=Time.SYSTEM.milliseconds();;
:try ;
:try ;
if (enableTransactions) then (yes) 
:producer.initTransactions();;
endif 
:longsentMessages=0;;
while (sentMessages<spec.maxMessages())
if (enableTransactions) then (yes) 
:booleantookAction=takeTransactionAction();;
if (tookAction) then (yes) 
:continue ;;
endif 
endif 
:sendMessage();;
:sentMessages++;;
endwhile
if (enableTransactions) then (yes) 
:takeTransactionAction();;
endif 
:doneFuture.complete("");;
:return null ;;
stop
end
start
note right
booleantakeTransactionAction()
end note
:booleantookAction=true;;
:TransactionActionnextAction=transactionGenerator.get()
.nextAction();;
switch (switch (nextAction))
endswith
:return tookAction;;
stop
end
start
note right
void sendMessage()
end note
if (!partitionsIterator.hasNext()) then (yes) 
:partitionsIterator=activePartitions.iterator();;
endif 
:TopicPartitionpartition=partitionsIterator.next();;
:ProducerRecord<byte[],byte[]>record;;
if (spec.useConfiguredPartitioner()) then (yes) 
:record=new ProducerRecord<>(partition.topic(),
keys.next(),values.next());;
else (no)
:record=new ProducerRecord<>(partition.topic(),
partition.partition(),keys.next(),values.next());;
endif 
:sendFuture=producer.send(record,new SendRecordsCallback(this,
Time.SYSTEM.milliseconds()));;
:throttle.increment();;
end
start
note right
void recordDuration(longdurationMs)
end note
:histogram.add(durationMs);;
end
start
note right
constructor StatusUpdater(Histogramhistogram,
AtomicLongtransactionsCommitted)
end note
:this.histogram=histogram;;
:this.transactionsCommitted=transactionsCommitted;;
end
start
note right
void run()
end note
:try ;
:update();;
:catch (Exceptione);
:WorkerUtils.abort(log,"StatusUpdater",e,
doneFuture);;
end
start
note right
StatusDataupdate()
end note
:Histogram.Summarysummary=histogram.summarize(StatusData.PERCENTILES);;
:StatusDatastatusData=new StatusData(summary.numSamples(),
summary.average(),summary.percentiles().get(0).value(),
summary.percentiles().get(1).value(),summary.percentiles().get(2).value(),
transactionsCommitted.get());;
:status.update(JsonUtil.JSON_SERDE.valueToTree(statusData));;
:return statusData;;
stop
end
start
note right
constructor StatusData(@JsonProperty ("totalSent")longtotalSent,
@JsonProperty ("averageLatencyMs")floataverageLatencyMs,
@JsonProperty ("p50LatencyMs")intp50latencyMs,
@JsonProperty ("p95LatencyMs")intp95latencyMs,
@JsonProperty ("p99LatencyMs")intp99latencyMs,
@JsonProperty ("transactionsCommitted")longtransactionsCommitted)
end note
:this.totalSent=totalSent;;
:this.averageLatencyMs=averageLatencyMs;;
:this.p50LatencyMs=p50latencyMs;;
:this.p95LatencyMs=p95latencyMs;;
:this.p99LatencyMs=p99latencyMs;;
:this.transactionsCommitted=transactionsCommitted;;
end
start
note right
longtotalSent()
end note
:return totalSent;;
stop
end
start
note right
longtransactionsCommitted()
end note
:return transactionsCommitted;;
stop
end
start
note right
floataverageLatencyMs()
end note
:return averageLatencyMs;;
stop
end
start
note right
intp50LatencyMs()
end note
:return p50LatencyMs;;
stop
end
start
note right
intp95LatencyMs()
end note
:return p95LatencyMs;;
stop
end
start
note right
intp99LatencyMs()
end note
:return p99LatencyMs;;
stop
end
start
note right
void stop(Platformplatform)
end note
if (!running.compareAndSet(true,false)) then (yes) 
:throw new IllegalStateException("ProduceBenchWorker is not running.");;
stop
endif 
:log.info("{}: Deactivating ProduceBenchWorker.",
id);;
:doneFuture.complete("");;
:executor.shutdownNow();;
:executor.awaitTermination(1,TimeUnit.DAYS);;
:this.executor=null ;;
:this.status=null ;;
:this.doneFuture=null ;;
end
@enduml

