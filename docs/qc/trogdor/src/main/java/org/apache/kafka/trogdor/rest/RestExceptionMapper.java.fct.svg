;" x1="213.75" x2="379.25" y1="510.5117" y2="510.5117"/><polygon fill="#181818" points="369.25,506.5117,379.25,510.5117,369.25,514.5117,373.25,510.5117" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="568.75" x2="568.75" y1="492.5117" y2="510.5117"/><line style="stroke:#181818;stroke-width:1.0;" x1="568.75" x2="403.25" y1="510.5117" y2="510.5117"/><polygon fill="#181818" points="413.25,506.5117,403.25,510.5117,413.25,514.5117,409.25,510.5117" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="391.25" x2="391.25" y1="401.9766" y2="424.543"/><polygon fill="#181818" points="387.25,414.543,391.25,424.543,395.25,414.543,391.25,418.543" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="391.25" x2="391.25" y1="522.5117" y2="542.5117"/><polygon fill="#181818" points="387.25,532.5117,391.25,542.5117,395.25,532.5117,391.25,536.5117" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="391.25" x2="391.25" y1="602.6445" y2="632.7773"/><polygon fill="#181818" points="387.25,622.7773,391.25,632.7773,395.25,622.7773,391.25,626.7773" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="391.25" x2="391.25" y1="680.7148" y2="700.7148"/><polygon fill="#181818" points="387.25,690.7148,391.25,700.7148,395.25,690.7148,391.25,694.7148" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[a4dcd8690e477ad8edffd12921b278c7]
@startuml
!pragma layout smetana
start
note right
ResponsetoResponse(Throwablee)
end note
if (log.isDebugEnabled()) then (yes) 
:log.debug("Uncaught exception in REST call: ",
e);
endif 
if (e instanceof NotFoundException) then (yes) 
:return buildResponse(Response.Status.NOT_FOUND,
e);;
stop
else (no)
:return buildResponse(Response.Status.INTERNAL_SERVER_ERROR,
e);;
stop
endif 
end
start
note right
ExceptiontoException(intcode,Stringmsg)
end note
if (code==Response.Status.NOT_FOUND.getStatusCode()) then (yes) 
:throw new NotFoundException(msg);;
else (no)
:throw new RuntimeException(msg);;
endif 
end
start
note right
ResponsebuildResponse(Response.Statuscode,
Throwablee)
end note
:return Response.status(code).entity(new ErrorResponse(code.getStatusCode(),
e.getMessage())).build();;
stop
end
@enduml

