.707,408.25,603.707" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[6d43292658d6b5e987a3af2948246b0c]
@startuml
!pragma layout smetana
start
note right
ResponsetoResponse(Throwablee)
end note
if (log.isDebugEnabled()) then (yes) 
:log.debug("Uncaught exception in REST call: ",e);
endif 
if (e instanceof NotFoundException) then (yes) 
:return buildResponse(Response.Status.NOT_FOUND,e);;
stop
else (no)
:return buildResponse(Response.Status.INTERNAL_SERVER_ERROR,e);;
stop
endif 
end
start
note right
ExceptiontoException(intcode,Stringmsg)
end note
if (code==Response.Status.NOT_FOUND.getStatusCode()) then (yes) 
else (no)
endif 
end
start
note right
ResponsebuildResponse(Response.Statuscode,Throwablee)
end note
:return Response.status(code).entity(new ErrorResponse(code.getStatusCode(),e.getMessage())).build();;
stop
end
@enduml

