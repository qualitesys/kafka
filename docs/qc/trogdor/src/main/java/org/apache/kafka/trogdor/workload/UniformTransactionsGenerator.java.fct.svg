@startuml
!pragma layout smetana
start
note right
constructor UniformTransactionsGenerator(@JsonProperty ("messagesPerTransaction")intmessagesPerTransaction)
end note
if (messagesPerTransaction<1) then (yes) 
endif 
:this.messagesPerTransaction=messagesPerTransaction;
end
start
note right
intmessagesPerTransaction()
end note
:return messagesPerTransaction;;
stop
end
start
note right
TransactionActionnextAction()
end note
if (messagesInTransaction==-1) then (yes) 
:messagesInTransaction=0;
:return TransactionAction.BEGIN_TRANSACTION;;
stop
endif 
if (messagesInTransaction==messagesPerTransaction) then (yes) 
:messagesInTransaction=-1;
:return TransactionAction.COMMIT_TRANSACTION;;
stop
endif 
:messagesInTransaction+=1;
:return TransactionAction.NO_OP;;
stop
end
@enduml

