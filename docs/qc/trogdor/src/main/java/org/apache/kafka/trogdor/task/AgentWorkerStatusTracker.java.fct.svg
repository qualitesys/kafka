@startuml
!pragma layout smetana
start
note right
void update(JsonNode newStatus)
end note
:JsonNode status=newStatus.deepCopy();;
:synchronized (this){this.status=status;};
end
start
note right
JsonNode get()
end note
:return status;;
stop
end
@enduml

