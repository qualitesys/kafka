@startuml
!pragma layout smetana
start
note right
constructor TaskDone(@JsonProperty ("spec")TaskSpec spec,
@JsonProperty ("startedMs")long startedMs,
@JsonProperty ("doneMs")long doneMs,@JsonProperty ("error")String error,
@JsonProperty ("cancelled")boolean cancelled,
@JsonProperty ("status")JsonNode status)
end note
:super (spec,status);;
:this.startedMs=startedMs;;
:this.doneMs=doneMs;;
:this.error=error;;
:this.cancelled=cancelled;;
end
start
note right
long startedMs()
end note
:return startedMs;;
stop
end
start
note right
long doneMs()
end note
:return doneMs;;
stop
end
start
note right
String error()
end note
:return error;;
stop
end
start
note right
boolean cancelled()
end note
:return cancelled;;
stop
end
start
note right
TaskStateType stateType()
end note
:return TaskStateType.DONE;;
stop
end
@enduml

