@startuml
!pragma layout smetana
start
note right
constructor TaskDone(@JsonProperty ("spec")TaskSpecspec,@JsonProperty ("startedMs")longstartedMs,@JsonProperty ("doneMs")longdoneMs,@JsonProperty ("error")Stringerror,@JsonProperty ("cancelled")booleancancelled,@JsonProperty ("status")JsonNodestatus)
end note
:super (spec,status);
:this.startedMs=startedMs;
:this.doneMs=doneMs;
:this.error=error;
:this.cancelled=cancelled;
end
start
note right
longstartedMs()
end note
:return startedMs;;
stop
end
start
note right
longdoneMs()
end note
:return doneMs;;
stop
end
start
note right
Stringerror()
end note
:return error;;
stop
end
start
note right
booleancancelled()
end note
:return cancelled;;
stop
end
start
note right
TaskStateTypestateType()
end note
:return TaskStateType.DONE;;
stop
end
@enduml

