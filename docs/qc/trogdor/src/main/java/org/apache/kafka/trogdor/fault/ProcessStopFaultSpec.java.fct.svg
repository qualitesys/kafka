@startuml
!pragma layout smetana
start
note right
constructor ProcessStopFaultSpec(@JsonProperty ("startMs")longstartMs,
@JsonProperty ("durationMs")longdurationMs,
@JsonProperty ("nodeNames")List<String>nodeNames,
@JsonProperty ("javaProcessName")StringjavaProcessName)
end note
:super (startMs,durationMs);;
:this.nodeNames=nodeNames==null ? new HashSet<String>():new HashSet<>(nodeNames);;
:this.javaProcessName=javaProcessName==null ? String.valueOf(""):javaProcessName;;
end
start
note right
Set<String>nodeNames()
end note
:return nodeNames;;
stop
end
start
note right
StringjavaProcessName()
end note
:return javaProcessName;;
stop
end
start
note right
TaskControllernewController(Stringid)
end note
:return new ProcessStopFaultController(nodeNames);;
stop
end
start
note right
TaskWorkernewTaskWorker(Stringid)
end note
:return new ProcessStopFaultWorker(id,javaProcessName);;
stop
end
@enduml

