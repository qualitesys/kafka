@startuml
!pragma layout smetana
start
note right
constructor ProcessStopFaultSpec(@JsonProperty ("startMs")long startMs,
@JsonProperty ("durationMs")long durationMs,
@JsonProperty ("nodeNames")List<String> nodeNames,
@JsonProperty ("javaProcessName")String javaProcessName)
end note
:super (startMs,durationMs);;
:this.nodeNames=nodeNames==null ? new HashSet<String >():new HashSet<>(nodeNames);;
:this.javaProcessName=javaProcessName==null ? String.valueOf(""):javaProcessName;;
end
start
note right
Set<String> nodeNames()
end note
:return nodeNames;;
stop
end
start
note right
String javaProcessName()
end note
:return javaProcessName;;
stop
end
start
note right
TaskController newController(String id)
end note
:return new ProcessStopFaultController(nodeNames);;
stop
end
start
note right
TaskWorker newTaskWorker(String id)
end note
:return new ProcessStopFaultWorker(id,javaProcessName);;
stop
end
@enduml

