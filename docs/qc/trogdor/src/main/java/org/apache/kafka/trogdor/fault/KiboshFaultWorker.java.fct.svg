0859" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="258.5" x2="258.5" y1="779.0547" y2="799.0547"/><polygon fill="#181818" points="254.5,789.0547,258.5,799.0547,262.5,789.0547,258.5,793.0547" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="258.5" x2="258.5" y1="833.0234" y2="853.0234"/><polygon fill="#181818" points="254.5,843.0234,258.5,853.0234,262.5,843.0234,258.5,847.0234" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[e68ce714be8b9b9377779982a9df05c7]
@startuml
!pragma layout smetana
start
note right
constructor KiboshFaultWorker(Stringid,KiboshFaultSpecspec,StringmountPath)
end note
:this.id=id;
:this.spec=spec;
:this.mountPath=mountPath;
end
start
note right
void start(Platformplatform,WorkerStatusTrackerstatus,KafkaFutureImpl<String>errorFuture)
end note
:log.info("Activating {} {}: {}.",spec.getClass().getSimpleName(),id,spec);
:this.status=status;
:this.status.update(new TextNode("Adding fault "+id));
:Kibosh.INSTANCE.addFault(mountPath,spec);
:this.status.update(new TextNode("Added fault "+id));
end
start
note right
void stop(Platformplatform)
end note
:log.info("Deactivating {} {}: {}.",spec.getClass().getSimpleName(),id,spec);
:this.status.update(new TextNode("Removing fault "+id));
:Kibosh.INSTANCE.removeFault(mountPath,spec);
:this.status.update(new TextNode("Removed fault "+id));
end
@enduml

