@startuml
!pragma layout smetana
start
note right
constructor KiboshFaultWorker(Stringid,KiboshFaultSpecspec,
StringmountPath)
end note
:this.id=id;
:this.spec=spec;
:this.mountPath=mountPath;
end
start
note right
void start(Platformplatform,WorkerStatusTrackerstatus,
KafkaFutureImpl<String>errorFuture)
end note
:log.info("Activating {} {}: {}.",spec.getClass().getSimpleName(),
id,spec);
:this.status=status;
:this.status.update(new TextNode("Adding fault "+id));
:Kibosh.INSTANCE.addFault(mountPath,spec);
:this.status.update(new TextNode("Added fault "+id));
end
start
note right
void stop(Platformplatform)
end note
:log.info("Deactivating {} {}: {}.",spec.getClass().getSimpleName(),
id,spec);
:this.status.update(new TextNode("Removing fault "+id));
:Kibosh.INSTANCE.removeFault(mountPath,spec);
:this.status.update(new TextNode("Removed fault "+id));
end
@enduml

