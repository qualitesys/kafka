@startuml
!pragma layout smetana
start
note right
constructor TaskStopping(@JsonProperty ("spec")TaskSpecspec,@JsonProperty ("startedMs")longstartedMs,@JsonProperty ("status")JsonNodestatus)
end note
:super (spec,status);
:this.startedMs=startedMs;
end
start
note right
longstartedMs()
end note
:return startedMs;;
stop
end
start
note right
TaskStateTypestateType()
end note
:return TaskStateType.STOPPING;;
stop
end
@enduml

