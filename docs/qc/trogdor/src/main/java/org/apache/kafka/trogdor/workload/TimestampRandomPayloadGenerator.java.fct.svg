@startuml
!pragma layout smetana
start
note right
constructor TimestampRandomPayloadGenerator(@JsonProperty ("size")intsize,
@JsonProperty ("seed")longseed)
end note
if (size<Long.BYTES) then (yes) 
:throw new RuntimeException("The size of the payload must be greater than or equal to "+
Long.BYTES+".");;
endif 
end
start
note right
intsize()
end note
:return size;;
stop
end
start
note right
longseed()
end note
:return seed;;
stop
end
start
note right
byte[]generate(longposition)
end note
if (randomBytes.length>0) then (yes) 
endif 
:return result;;
stop
end
@enduml

