@startuml
!pragma layout smetana
start
note right
constructor TimestampRandomPayloadGenerator(@JsonProperty ("size")intsize,
@JsonProperty ("seed")longseed)
end note
:this.size=size;
:this.seed=seed;
if (size<Long.BYTES) then (yes) 
:throw new RuntimeException("The size of the payload must be greater than or equal to "+Long.BYTES+".");;
endif 
:random.setSeed(seed);
:this.randomBytes=new byte[size-Long.BYTES];
:buffer=ByteBuffer.allocate(Long.BYTES);
:buffer.order(ByteOrder.LITTLE_ENDIAN);
end
start
note right
intsize()
end note
:return size;;
stop
end
start
note right
longseed()
end note
:return seed;;
stop
end
start
note right
byte[]generate(longposition)
end note
if (randomBytes.length>0) then (yes) 
:random.setSeed(seed+position);
:random.nextBytes(randomBytes);
:System.arraycopy(randomBytes,0,result,Long.BYTES,
randomBytes.length);
endif 
:buffer.clear();
:buffer.putLong(Time.SYSTEM.milliseconds());
:buffer.rewind();
:System.arraycopy(buffer.array(),0,result,
0,Long.BYTES);
:return result;;
stop
end
@enduml

