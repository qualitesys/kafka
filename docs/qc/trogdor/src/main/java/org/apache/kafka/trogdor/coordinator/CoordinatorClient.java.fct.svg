:Stringuri=UriBuilder.fromPath(url("/coordinator/tasks/{taskId}"))
.build(request.taskId()).toString();;
:HttpResponse<TaskState>resp=JsonRestServer.httpRequest(log,
uri,"GET",null ,new TypeReference<TaskState>(){},
maxTries);;
:return resp.body();;
stop
end
