note right
void addTargetArgument(ArgumentParserparser)
end note
:parser.addArgument("- -target","-t").action(store()).required(true).type(String.class ).dest("target").metavar("TARGET").help("A colon-separated host and port pair.  For example,
 example.com:8889");;
end
start
note right
void addJsonArgument(ArgumentParserparser)
end note
:parser.addArgument("- -json").action(storeTrue())
.dest("json").metavar("JSON").help("Show the full response as JSON.");;
end
start
note right
void main(String[]args)
end note
:ArgumentParserrootParser=ArgumentParsers.newArgumentParser("trogdor-coordinator-client")
.description("The Trogdor coordinator client.");;
:SubparserssubParsers=rootParser.addSubparsers()
.dest("command");;
:SubparseruptimeParser=subParsers.addParser("uptime")
.help("Get the coordinator uptime.");;
:addTargetArgument(uptimeParser);;
:addJsonArgument(uptimeParser);;
:SubparserstatusParser=subParsers.addParser("status")
.help("Get the coordinator status.");;
:addTargetArgument(statusParser);;
:addJsonArgument(statusParser);;
:SubparsershowTaskParser=subParsers.addParser("showTask")
.help("Show a coordinator task.");;
:addTargetArgument(showTaskParser);;
:addJsonArgument(showTaskParser);;
:showTaskParser.addArgument("- -id","-i").action(store())
.required(true).type(String.class ).dest("taskId").metavar("TASK_ID").help("The task ID to show.");;
:showTaskParser.addArgument("- -verbose","-v")
.action(storeTrue()).dest("verbose").metavar("VERBOSE").help("Print out everything.");;
:showTaskParser.addArgument("- -show-status",
"-S").action(storeTrue()).dest("showStatus").metavar("SHOW_STATUS").help("Show the task status.");;
:SubparsershowTasksParser=subParsers.addParser("showTasks").help("Show many coordinator tasks.  By default, all tasks are shown, but "+
"command-line options can be specified as filters.");;
:addTargetArgument(showTasksParser);;
:addJsonArgument(showTasksParser);;
:MutuallyExclusiveGroupidGroup=showTasksParser.addMutuallyExclusiveGroup();;
:idGroup.addArgument("- -id","-i").action(append())
.type(String.class ).dest("taskIds").metavar("TASK_IDS").help("Show only this task ID.  This option may be specified multiple times.");;
:idGroup.addArgument("- -id-pattern").action(store())
.type(String.class ).dest("taskIdPattern").metavar("TASK_ID_PATTERN").help("Only display tasks which match the given ID pattern.");;
:showTasksParser.addArgument("- -state","-s")
.type(TaskStateType.class ).dest("taskStateType").metavar("TASK_STATE_TYPE").help("Show only tasks in this state.");;
:SubparsercreateTaskParser=subParsers.addParser("createTask")
.help("Create a new task.");;
:addTargetArgument(createTaskParser);;
:createTaskParser.addArgument("- -id","-i")
.action(store()).required(true).type(String.class ).dest("taskId").metavar("TASK_ID").help("The task ID to create.");;
:createTaskParser.addArgument("- -spec","-s").action(store()).required(true).type(String.class ).dest("taskSpec").metavar("TASK_SPEC").help("The task spec to create,
 or a path to a file containing the task spec.");;
:SubparserstopTaskParser=subParsers.addParser("stopTask")
.help("Stop a task.");;
:addTargetArgument(stopTaskParser);;
:stopTaskParser.addArgument("- -id","-i").action(store())
.required(true).type(String.class ).dest("taskId").metavar("TASK_ID").help("The task ID to create.");;
:SubparserdestroyTaskParser=subParsers.addParser("destroyTask")
.help("Destroy a task.");;
:addTargetArgument(destroyTaskParser);;
:destroyTaskParser.addArgument("- -id","-i")
.action(store()).required(true).type(String.class ).dest("taskId").metavar("TASK_ID").help("The task ID to destroy.");;
:SubparsershutdownParser=subParsers.addParser("shutdown")
.help("Shut down the coordinator.");;
:addTargetArgument(shutdownParser);;
:Namespaceres=rootParser.parseArgsOrFail(args);;
:Stringtarget=res.getString("target");;
:CoordinatorClientclient=new Builder().maxTries(3)
.target(target).build();;
:ZoneOffsetlocalOffset=OffsetDateTime.now()
.getOffset();;
switch (switch (res.getString("command")))
endswith
end
start
note right
StringprettyPrintTasksResponse(TasksResponseresponse,
ZoneOffsetzoneOffset)
end note
if (response.tasks().isEmpty()) then (yes) 
:return "No matching tasks found.";;
stop
endif 
:List<List<String>>lines=new ArrayList<>();;
:List<String>header=new ArrayList<>(Arrays.asList("ID",
"TYPE","STATE","INFO"));;
:lines.add(header);;
:StringtaskId=entry.getKey();;
:TaskStatetaskState=entry.getValue();;
:List<String>cols=new ArrayList<>();;
:cols.add(taskId);;
:cols.add(taskState.spec().getClass().getCanonicalName());;
:cols.add(taskState.stateType().toString());;
:cols.add(prettyPrintTaskInfo(taskState,zoneOffset));;
:lines.add(cols);;
:return StringFormatter.prettyPrintGrid(lines);;
stop
end
start
note right
StringprettyPrintTaskInfo(TaskStatetaskState,
ZoneOffsetzoneOffset)
end note
if (taskState instanceof TaskPending) then (yes) 
:return "Will start at "+dateString(taskState.spec().startMs(),
zoneOffset);;
stop
else if (taskState instanceof TaskRunning) then (yes) 
:TaskRunningrunState=(TaskRunning)taskState;;
:return "Started "+dateString(runState.startedMs(),zoneOffset)+
"; will stop after "+durationString(taskState.spec().durationMs());;
stop
else if (taskState instanceof TaskStopping) then (yes) 
:TaskStoppingstoppingState=(TaskStopping)taskState;;
:return "Started "+dateString(stoppingState.startedMs(),
zoneOffset);;
stop
else if (taskState instanceof TaskDone) then (yes) 
:TaskDonedoneState=(TaskDone)taskState;;
:Stringstatus=null ;;
if (doneState.error()==null ||doneState.error().isEmpty()) then (yes) 
if (doneState.cancelled()) then (yes) 
:status="CANCELLED";;
else (no)
:status="FINISHED";;
endif 
else (no)
:status="FAILED";;
endif 
:return String.format("%s at %s after %s",
status,dateString(doneState.doneMs(),zoneOffset),
durationString(doneState.doneMs()-doneState.startedMs()));;
stop
else (no)
:throw new RuntimeException("Unknown task state type "+
taskState.stateType());;
stop
endif 
end
