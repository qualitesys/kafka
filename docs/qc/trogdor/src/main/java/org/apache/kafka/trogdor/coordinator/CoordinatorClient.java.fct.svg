end note
:this.target=String.format("%s:%d",host,port);
:return this;;
stop
end
start
note right
CoordinatorClientbuild()
end note
if (target==null ) then (yes) 
:throw new RuntimeException("You must specify a target.");;
endif 
:return new CoordinatorClient(log,maxTries,
target);;
stop
end
start
note right
constructor CoordinatorClient(Loggerlog,intmaxTries,
Stringtarget)
end note
:this.log=log;
:this.maxTries=maxTries;
:this.target=target;
end
start
note right
intmaxTries()
end note
:return maxTries;;
stop
end
start
note right
Stringurl(Stringsuffix)
end note
:return String.format("http://%s%s",target,
suffix);;
stop
end
start
note right
CoordinatorStatusResponsestatus()
end note
:return resp.body();;
stop
end
start
note right
UptimeResponseuptime()
end note
:return resp.body();;
stop
end
start
note right
void createTask(CreateTaskRequestrequest)
end note
:resp.body();
end
start
note right
void stopTask(StopTaskRequestrequest)
end note
:resp.body();
end
start
note right
void destroyTask(DestroyTaskRequestrequest)
end note
:uriBuilder.queryParam("taskId",request.id());
:resp.body();
end
start
note right
TasksResponsetasks(TasksRequestrequest)
end note
:uriBuilder.queryParam("taskId",request.taskIds()
.toArray(new Object[0]));
:uriBuilder.queryParam("firstStartMs",request.firstStartMs());
:uriBuilder.queryParam("lastStartMs",request.lastStartMs());
:uriBuilder.queryParam("firstEndMs",request.firstEndMs());
:uriBuilder.queryParam("lastEndMs",request.lastEndMs());
if (request.state().isPresent()) then (yes) 
:uriBuilder.queryParam("state",request.state()
.get().toString());
endif 
:return resp.body();;
stop
end
start
note right
TaskStatetask(TaskRequestrequest)
end note
:return resp.body();;
stop
end
start
note right
void shutdown()
end note
:resp.body();
end
start
note right
void addTargetArgument(ArgumentParserparser)
end note
:parser.addArgument("- -target","-t").action(store())
.required(true).type(String.class ).dest("target")
.metavar("TARGET").help("A colon-separated host and port pair.  For example,
 example.com:8889");
end
start
note right
void addJsonArgument(ArgumentParserparser)
end note
:parser.addArgument("- -json").action(storeTrue())
.dest("json").metavar("JSON").help("Show the full response as JSON.");
end
start
note right
void main(String[]args)
end note
:addTargetArgument(uptimeParser);
:addJsonArgument(uptimeParser);
:addTargetArgument(statusParser);
:addJsonArgument(statusParser);
:addTargetArgument(showTaskParser);
:addJsonArgument(showTaskParser);
:showTaskParser.addArgument("- -id","-i").action(store())
.required(true).type(String.class ).dest("taskId")
.metavar("TASK_ID").help("The task ID to show.");
:showTaskParser.addArgument("- -verbose","-v")
.action(storeTrue()).dest("verbose").metavar("VERBOSE")
.help("Print out everything.");
:showTaskParser.addArgument("- -show-status",
"-S").action(storeTrue()).dest("showStatus")
.metavar("SHOW_STATUS").help("Show the task status.");
:addTargetArgument(showTasksParser);
:addJsonArgument(showTasksParser);
:idGroup.addArgument("- -id","-i").action(append())
.type(String.class ).dest("taskIds").metavar("TASK_IDS")
.help("Show only this task ID.  This option may be specified multiple times.");
:idGroup.addArgument("- -id-pattern").action(store())
.type(String.class ).dest("taskIdPattern")
.metavar("TASK_ID_PATTERN").help("Only display tasks which match the given ID pattern.");
:showTasksParser.addArgument("- -state","-s")
.type(TaskStateType.class ).dest("taskStateType")
.metavar("TASK_STATE_TYPE").help("Show only tasks in this state.");
:addTargetArgument(createTaskParser);
:createTaskParser.addArgument("- -id","-i")
.action(store()).required(true).type(String.class )
.dest("taskId").metavar("TASK_ID").help("The task ID to create.");
:createTaskParser.addArgument("- -spec","-s")
.action(store()).required(true).type(String.class ).dest("taskSpec").metavar("TASK_SPEC").help("The task spec to create,
 or a path to a file containing the task spec.");
:addTargetArgument(stopTaskParser);
:stopTaskParser.addArgument("- -id","-i").action(store())
.required(true).type(String.class ).dest("taskId")
.metavar("TASK_ID").help("The task ID to create.");
:addTargetArgument(destroyTaskParser);
:destroyTaskParser.addArgument("- -id","-i")
.action(store()).required(true).type(String.class )
.dest("taskId").metavar("TASK_ID").help("The task ID to destroy.");
:addTargetArgument(shutdownParser);
if (res.getBoolean("json")) then (yes) 
:System.out.println(JsonUtil.toJsonString(uptime));
else (no)
:System.out.printf("Coordinator is running at %s.%n",
target);
:System.out.printf("\tStart time: %s%n",dateString(uptime.serverStartMs(),
localOffset));
:System.out.printf("\tCurrent server time: %s%n",
dateString(uptime.nowMs(),localOffset));
:System.out.printf("\tUptime: %s%n",durationString(uptime.nowMs()-uptime.serverStartMs()));
endif 
if (res.getBoolean("json")) then (yes) 
:System.out.println(JsonUtil.toJsonString(response));
else (no)
:System.out.printf("Coordinator is running at %s.%n",
target);
:System.out.printf("\tStart time: %s%n",dateString(response.serverStartMs(),
localOffset));
endif 
:taskState=client.task(req);
:System.out.printf("Task %s was not found.%n",
taskId);
:Exit.exit(1);
if (res.getBoolean("json")) then (yes) 
:System.out.println(JsonUtil.toJsonString(taskState));
else (no)
:System.out.printf("Task %s of type %s is %s. %s%n",
taskId,taskState.spec().getClass().getCanonicalName(),
taskState.stateType(),prettyPrintTaskInfo(taskState,
localOffset));
if (taskState instanceof TaskDone) then (yes) 
if ((taskDone.error()!=null )&&(!taskDone.error()
.isEmpty())) then (yes) 
:System.out.printf("Error: %s%n",taskDone.error());
endif 
endif 
if (res.getBoolean("verbose")) then (yes) 
:System.out.printf("Spec: %s%n%n",JsonUtil.toPrettyJsonString(taskState.spec()));
endif 
if (res.getBoolean("verbose")||res.getBoolean("showStatus")) then (yes) 
:System.out.printf("Status: %s%n%n",JsonUtil.toPrettyJsonString(taskState.status()));
endif 
endif 
if (res.getList("taskIds")!=null ) then (yes) 
:taskIds.add((String)taskId);
endif 
if (taskIdPattern!=null ) then (yes) 
if (taskIdPattern.matcher(entry.getKey())
.matches()) then (yes) 
:filteredTasks.put(entry.getKey(),entry.getValue());
endif 
:response=new TasksResponse(filteredTasks);
endif 
if (res.getBoolean("json")) then (yes) 
:System.out.println(JsonUtil.toJsonString(response));
else (no)
:System.out.println(prettyPrintTasksResponse(response,
localOffset));
endif 
if (response.tasks().isEmpty()) then (yes) 
:Exit.exit(1);
endif 
:client.createTask(req);
:System.out.printf("Sent CreateTaskRequest for task %s.%n",
req.id());
:System.out.printf("CreateTaskRequest for task %s got a 409 status code - "+
