@startuml
!pragma layout smetana
start
note right
constructor Builder()
end note
end
start
note right
Builderlog(Loggerlog)
end note
:this.log=log;;
:return this;;
stop
end
start
note right
BuildermaxTries(intmaxTries)
end note
:this.maxTries=maxTries;;
:return this;;
stop
end
start
note right
Buildertarget(Stringtarget)
end note
:this.target=target;;
:return this;;
stop
end
start
note right
Buildertarget(Stringhost,intport)
end note
:this.target=String.format("%s:%d",host,port);;
:return this;;
stop
end
start
note right
CoordinatorClientbuild()
end note
if (target==null ) then (yes) 
:throw new RuntimeException("You must specify a target.");;
stop
endif 
:return new CoordinatorClient(log,maxTries,
target);;
stop
end
start
note right
constructor CoordinatorClient(Loggerlog,intmaxTries,
Stringtarget)
end note
:this.log=log;;
:this.maxTries=maxTries;;
:this.target=target;;
end
start
note right
intmaxTries()
end note
:return maxTries;;
stop
end
start
note right
Stringurl(Stringsuffix)
end note
:return String.format("http://%s%s",target,
suffix);;
stop
end
start
note right
CoordinatorStatusResponsestatus()
end note
:HttpResponse<CoordinatorStatusResponse>resp=JsonRestServer.<CoordinatorStatusResponse>httpRequest(url("/coordinator/status"),
"GET",null ,new TypeReference<CoordinatorStatusResponse>(){},
maxTries);;
:return resp.body();;
stop
end
start
note right
UptimeResponseuptime()
end note
:HttpResponse<UptimeResponse>resp=JsonRestServer.httpRequest(url("/coordinator/uptime"),
"GET",null ,new TypeReference<UptimeResponse>(){},
maxTries);;
:return resp.body();;
stop
end
start
note right
void createTask(CreateTaskRequestrequest)
end note
:HttpResponse<Empty>resp=JsonRestServer.httpRequest(log,
url("/coordinator/task/create"),"POST",request,
new TypeReference<Empty>(){},maxTries);;
:resp.body();;
end
start
note right
void stopTask(StopTaskRequestrequest)
end note
:HttpResponse<Empty>resp=JsonRestServer.httpRequest(log,
url("/coordinator/task/stop"),"PUT",request,
new TypeReference<Empty>(){},maxTries);;
:resp.body();;
end
start
note right
void destroyTask(DestroyTaskRequestrequest)
end note
:UriBuilderuriBuilder=UriBuilder.fromPath(url("/coordinator/tasks"));;
:uriBuilder.queryParam("taskId",request.id());;
:HttpResponse<Empty>resp=JsonRestServer.httpRequest(log,
uriBuilder.build().toString(),"DELETE",null ,
new TypeReference<Empty>(){},maxTries);;
:resp.body();;
end
start
note right
TasksResponsetasks(TasksRequestrequest)
end note
:UriBuilderuriBuilder=UriBuilder.fromPath(url("/coordinator/tasks"));;
:uriBuilder.queryParam("taskId",request.taskIds()
.toArray(new Object[0]));;
:uriBuilder.queryParam("firstStartMs",request.firstStartMs());;
:uriBuilder.queryParam("lastStartMs",request.lastStartMs());;
:uriBuilder.queryParam("firstEndMs",request.firstEndMs());;
:uriBuilder.queryParam("lastEndMs",request.lastEndMs());;
if (request.state().isPresent()) then (yes) 
:uriBuilder.queryParam("state",request.state()
.get().toString());;
endif 
:HttpResponse<TasksResponse>resp=JsonRestServer.httpRequest(log,
uriBuilder.build().toString(),"GET",null ,
new TypeReference<TasksResponse>(){},maxTries);;
:return resp.body();;
stop
end
start
note right
TaskStatetask(TaskRequestrequest)
