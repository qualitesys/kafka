@startuml
!pragma layout smetana
start
note right
constructor Builder()
end note
end
start
note right
Builderlog(Loggerlog)
end note
:this.log=log;
:return this;;
stop
end
start
note right
BuildermaxTries(intmaxTries)
end note
:this.maxTries=maxTries;
:return this;;
stop
end
start
