req.id(),rce.getMessage());
:Exit.exit(1);
:client.stopTask(req);
:System.out.printf("Sent StopTaskRequest for task %s.%n",
taskId);
:client.destroyTask(req);
:System.out.printf("Sent DestroyTaskRequest for task %s.%n",
taskId);
:client.shutdown();
:System.out.println("Sent ShutdownRequest.");
:System.out.println("You must choose an action. Type - -help for help.");
:Exit.exit(1);
end
start
note right
StringprettyPrintTasksResponse(TasksResponseresponse,
ZoneOffsetzoneOffset)
end note
if (response.tasks().isEmpty()) then (yes) 
:return "No matching tasks found.";;
stop
endif 
:lines.add(header);
:cols.add(taskId);
:cols.add(taskState.spec().getClass().getCanonicalName());
:cols.add(taskState.stateType().toString());
:cols.add(prettyPrintTaskInfo(taskState,zoneOffset));
:lines.add(cols);
:return StringFormatter.prettyPrintGrid(lines);;
stop
end
start
note right
StringprettyPrintTaskInfo(TaskStatetaskState,
ZoneOffsetzoneOffset)
end note
if (taskState instanceof TaskPending) then (yes) 
:return "Will start at "+dateString(taskState.spec().startMs(),
zoneOffset);;
stop
else (no)
:throw new RuntimeException("Unknown task state type "+
taskState.stateType());;
endif 
end
