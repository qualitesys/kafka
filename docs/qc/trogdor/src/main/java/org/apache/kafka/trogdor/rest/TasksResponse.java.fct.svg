@startuml
!pragma layout smetana
start
note right
constructor TasksResponse(@JsonProperty ("tasks")TreeMap<String,TaskState>tasks)
end note
:this.tasks=Collections.unmodifiableMap((tasks==null )? new TreeMap<String,
TaskState>():tasks);
end
start
note right
Map<String,TaskState>tasks()
end note
:return tasks;;
stop
end
@enduml

