@startuml
!pragma layout smetana
start
note right
constructor TaskRunning(@JsonProperty ("spec")TaskSpec spec,
@JsonProperty ("startedMs")long startedMs,
@JsonProperty ("status")JsonNode status)
end note
:super (spec,status);;
:this.startedMs=startedMs;;
end
start
note right
long startedMs()
end note
:return startedMs;;
stop
end
start
note right
TaskStateType stateType()
end note
:return TaskStateType.RUNNING;;
stop
end
@enduml

