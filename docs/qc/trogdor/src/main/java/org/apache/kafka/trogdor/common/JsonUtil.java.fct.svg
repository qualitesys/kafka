@startuml
!pragma layout smetana
:JSON_SERDE=new ObjectMapper();
:JSON_SERDE.configure(SerializationFeature.FAIL_ON_EMPTY_BEANS,false);
:JSON_SERDE.configure(DeserializationFeature.ACCEPT_SINGLE_VALUE_AS_ARRAY,true);
