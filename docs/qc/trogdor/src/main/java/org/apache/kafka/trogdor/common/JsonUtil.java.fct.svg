:JSON_SERDE.setSerializationInclusion(JsonInclude.Include.NON_EMPTY);
start
note right
StringtoJsonString(Objectobject)
end note
:return JSON_SERDE.writeValueAsString(object);;
stop
end
start
note right
StringtoPrettyJsonString(Objectobject)
end note
:return JSON_SERDE.writerWithDefaultPrettyPrinter().writeValueAsString(object);;
stop
end
start
note right
booleanopenBraceComesFirst(Stringinput)
end note
:i++;
if (!Character.isWhitespace(c)) then (yes) 
:return c=='{';;
stop
endif 
:return false;;
stop
end
if (openBraceComesFirst(argument)) then (yes) 
:return JSON_SERDE.readValue(argument,clazz);;
stop
else (no)
:return JSON_SERDE.readValue(new File(argument),clazz);;
stop
endif 
