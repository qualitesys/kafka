@startuml
!pragma layout smetana
:JSON_SERDE=new ObjectMapper();
:JSON_SERDE.configure(SerializationFeature.FAIL_ON_EMPTY_BEANS,
false);
:JSON_SERDE.configure(DeserializationFeature.ACCEPT_SINGLE_VALUE_AS_ARRAY,
true);
:JSON_SERDE.configure(JsonParser.Feature.ALLOW_COMMENTS,
true);
:JSON_SERDE.registerModule(new Jdk8Module());
:JSON_SERDE.setSerializationInclusion(JsonInclude.Include.NON_EMPTY);
start
note right
StringtoJsonString(Objectobject)
end note
:return JSON_SERDE.writeValueAsString(object);;
stop
:throw new RuntimeException(e);;
end
start
note right
StringtoPrettyJsonString(Objectobject)
end note
:return JSON_SERDE.writerWithDefaultPrettyPrinter().writeValueAsString(object);;
stop
:throw new RuntimeException(e);;
end
start
note right
booleanopenBraceComesFirst(Stringinput)
end note
:i++;
if (!Character.isWhitespace(c)) then (yes) 
:return c=='{';;
stop
endif 
:return false;;
stop
end
if (openBraceComesFirst(argument)) then (yes) 
:return JSON_SERDE.readValue(argument,clazz);;
stop
else (no)
:return JSON_SERDE.readValue(new File(argument),
clazz);;
stop
endif 
@enduml

