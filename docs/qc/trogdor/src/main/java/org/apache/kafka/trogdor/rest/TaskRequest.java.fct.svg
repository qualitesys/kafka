@startuml
!pragma layout smetana
start
note right
constructor TaskRequest(@JsonProperty ("taskId")String taskId)
end note
:this.taskId=taskId==null ? String.valueOf(""):taskId;;
end
start
note right
String taskId()
end note
:return taskId;;
stop
end
@enduml

