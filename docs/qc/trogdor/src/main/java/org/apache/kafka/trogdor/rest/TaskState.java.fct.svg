@startuml
!pragma layout smetana
start
note right
constructor TaskState(TaskSpec spec,JsonNode status)
end note
:this.spec=spec;;
:this.status=status==null ? NullNode.instance:status;;
end
start
note right
TaskSpec spec()
end note
:return spec;;
stop
end
start
note right
JsonNode status()
end note
:return status;;
stop
end
@enduml

