@startuml
!pragma layout smetana
start
note right
constructor TaskState(TaskSpecspec,JsonNodestatus)
end note
:this.spec=spec;
:this.status=status==null ? NullNode.instance:status;
end
start
note right
TaskSpecspec()
end note
:return spec;;
stop
end
start
note right
JsonNodestatus()
end note
:return status;;
stop
end
@enduml

