3047,337,465.3047,341,455.3047,337,459.3047" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[3ab48cb4bbe5e4b412cea8f1f9870a1d]
@startuml
!pragma layout smetana
start
note right
intgetIntConfig(Nodenode,Stringkey,intdefaultVal)
end note
if (val==null ) then (yes) 
:return defaultVal;;
stop
else (no)
:return Integer.parseInt(val);;
stop
endif 
end
start
note right
intgetTrogdorAgentPort(Nodenode)
end note
:return getIntConfig(node,Platform.Config.TROGDOR_AGENT_PORT,Agent.DEFAULT_PORT);;
stop
end
start
note right
intgetTrogdorCoordinatorPort(Nodenode)
end note
:return getIntConfig(node,Platform.Config.TROGDOR_COORDINATOR_PORT,Coordinator.DEFAULT_PORT);;
stop
end
@enduml

