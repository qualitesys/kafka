 x2="247.5" y1="89.1016" y2="109.1016"/><polygon fill="#181818" points="243.5,99.1016,247.5,109.1016,251.5,99.1016,247.5,103.1016" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="247.5" x2="247.5" y1="281.6367" y2="304.2031"/><polygon fill="#181818" points="243.5,294.2031,247.5,304.2031,251.5,294.2031,247.5,298.2031" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="247.5" x2="247.5" y1="352.1406" y2="372.1406"/><polygon fill="#181818" points="243.5,362.1406,247.5,372.1406,251.5,362.1406,247.5,366.1406" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="247.5" x2="247.5" y1="456.707" y2="479.2734"/><polygon fill="#181818" points="243.5,469.2734,247.5,479.2734,251.5,469.2734,247.5,473.2734" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="247.5" x2="247.5" y1="527.2109" y2="547.2109"/><polygon fill="#181818" points="243.5,537.2109,247.5,547.2109,251.5,537.2109,247.5,541.2109" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[0fb941d0c4fef577a133cfe9850bbfe1]
@startuml
!pragma layout smetana
start
note right
int getIntConfig(Node node,String key,int defaultVal)
end note
:String val=node.getConfig(key);;
if (val==null ) then (yes) 
:return defaultVal;;
stop
else (no)
:return Integer.parseInt(val);;
stop
endif 
end
start
note right
int getTrogdorAgentPort(Node node)
end note
:return getIntConfig(node,Platform.Config.TROGDOR_AGENT_PORT,
Agent.DEFAULT_PORT);;
stop
end
start
note right
int getTrogdorCoordinatorPort(Node node)
end note
:return getIntConfig(node,Platform.Config.TROGDOR_COORDINATOR_PORT,
Coordinator.DEFAULT_PORT);;
stop
end
@enduml

