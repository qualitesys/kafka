813" y2="806.2813"/><polygon fill="#181818" points="362,796.2813,366,806.2813,370,796.2813,366,800.2813" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[f54918ba8a10a4a48b7bf20c44415cdd]
@startuml
!pragma layout smetana
start
note right
constructor GaussianFlushGenerator(@JsonProperty ("messagesPerFlushAverage")intmessagesPerFlushAverage,@JsonProperty ("messagesPerFlushDeviation")doublemessagesPerFlushDeviation)
end note
:this.messagesPerFlushAverage=messagesPerFlushAverage;
:this.messagesPerFlushDeviation=messagesPerFlushDeviation;
:calculateFlushSize();
end
start
note right
intmessagesPerFlushAverage()
end note
:return messagesPerFlushAverage;;
stop
end
start
note right
doublemessagesPerFlushDeviation()
end note
:return messagesPerFlushDeviation;;
stop
end
start
note right
void calculateFlushSize()
end note
:flushSize=Math.max((int)(random.nextGaussian()*messagesPerFlushDeviation)+messagesPerFlushAverage,1);
:messageTracker=0;
end
:messageTracker+=1;
if (messageTracker>=flushSize) then (yes) 
:producer.flush();
:calculateFlushSize();
endif 
@enduml

