"stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="273" x2="273" y1="800.25" y2="820.25"/><polygon fill="#181818" points="269,810.25,273,820.25,277,810.25,273,814.25" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[b80d16ece953afb5199f8ca0d694cf3e]
@startuml
!pragma layout smetana
start
note right
constructor GaussianFlushGenerator(@JsonProperty ("messagesPerFlushAverage")intmessagesPerFlushAverage,@JsonProperty ("messagesPerFlushDeviation")doublemessagesPerFlushDeviation)
end note
:this.messagesPerFlushAverage=messagesPerFlushAverage;
:this.messagesPerFlushDeviation=messagesPerFlushDeviation;
:calculateFlushSize();
end
start
note right
intmessagesPerFlushAverage()
end note
:return messagesPerFlushAverage;;
stop
end
start
note right
doublemessagesPerFlushDeviation()
end note
:return messagesPerFlushDeviation;;
stop
end
start
note right
void calculateFlushSize()
end note
:flushSize=Math.max((int)(random.nextGaussian()*messagesPerFlushDeviation)+
messagesPerFlushAverage,1);
:messageTracker=0;
end
:messageTracker+=1;
if (messageTracker>=flushSize) then (yes) 
:producer.flush();
:calculateFlushSize();
endif 
@enduml

