81818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="275" x2="275" y1="815.3828" y2="835.3828"/><polygon fill="#181818" points="271,825.3828,275,835.3828,279,825.3828,275,829.3828" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[170c57b9006a1304f7a68c69b47715aa]
@startuml
!pragma layout smetana
start
note right
constructor GaussianFlushGenerator(@JsonProperty ("messagesPerFlushAverage")int messagesPerFlushAverage,
@JsonProperty ("messagesPerFlushDeviation")double messagesPerFlushDeviation)
end note
:this.messagesPerFlushAverage=messagesPerFlushAverage;;
:this.messagesPerFlushDeviation=messagesPerFlushDeviation;;
:calculateFlushSize();;
end
start
note right
int messagesPerFlushAverage()
end note
:return messagesPerFlushAverage;;
stop
end
start
note right
double messagesPerFlushDeviation()
end note
:return messagesPerFlushDeviation;;
stop
end
start
note right
void calculateFlushSize()
end note
:flushSize=Math.max((int )(random.nextGaussian()*messagesPerFlushDeviation)+
messagesPerFlushAverage,1);;
:messageTracker=0;;
end
:messageTracker+=1;;
if (messageTracker>=flushSize) then (yes) 
switch (try/catch block)
case (try)
:producer.flush();;
case (catch (InterruptException e))
endswitch
:calculateFlushSize();;
endif 
@enduml

