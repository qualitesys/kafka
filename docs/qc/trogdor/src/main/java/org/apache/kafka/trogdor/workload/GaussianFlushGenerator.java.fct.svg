roke-width:1.0;" x1="273" x2="273" y1="986.7227" y2="1006.7227"/><polygon fill="#181818" points="269,996.7227,273,1006.7227,277,996.7227,273,1000.7227" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="273" x2="273" y1="815.3828" y2="835.3828"/><polygon fill="#181818" points="269,825.3828,273,835.3828,277,825.3828,273,829.3828" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[3058fff03e5e8cbe6874f7ced5902262]
@startuml
!pragma layout smetana
start
note right
constructor GaussianFlushGenerator(@JsonProperty ("messagesPerFlushAverage")intmessagesPerFlushAverage,
@JsonProperty ("messagesPerFlushDeviation")doublemessagesPerFlushDeviation)
end note
:this.messagesPerFlushAverage=messagesPerFlushAverage;
:this.messagesPerFlushDeviation=messagesPerFlushDeviation;
:calculateFlushSize();
end
start
note right
intmessagesPerFlushAverage()
end note
:return messagesPerFlushAverage;;
stop
end
start
note right
doublemessagesPerFlushDeviation()
end note
:return messagesPerFlushDeviation;;
stop
end
start
note right
void calculateFlushSize()
end note
:flushSize=Math.max((int)(random.nextGaussian()*messagesPerFlushDeviation)+
messagesPerFlushAverage,1);
:messageTracker=0;
end
:messageTracker+=1;
if (messageTracker>=flushSize) then (yes) 
:producer.flush();
:calculateFlushSize();
endif 
@enduml

