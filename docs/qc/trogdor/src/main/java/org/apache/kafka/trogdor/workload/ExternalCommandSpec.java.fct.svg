c5e4f658cf61282c23afdc0e4762]
@startuml
!pragma layout smetana
start
note right
constructor ExternalCommandSpec(@JsonProperty ("startMs")longstartMs,@JsonProperty ("durationMs")longdurationMs,@JsonProperty ("commandNode")StringcommandNode,@JsonProperty ("command")List<String>command,@JsonProperty ("workload")JsonNodeworkload,@JsonProperty ("shutdownGracePeriodMs")Optional<Integer>shutdownGracePeriodMs)
end note
:super (startMs,durationMs);
:this.commandNode=(commandNode==null )? String.valueOf(""):commandNode;
:this.command=(command==null )? Collections.unmodifiableList(new ArrayList<String>()):command;
:this.workload=(workload==null )? NullNode.instance:workload;
:this.shutdownGracePeriodMs=shutdownGracePeriodMs;
end
start
note right
StringcommandNode()
end note
:return commandNode;;
stop
end
start
note right
List<String>command()
end note
:return command;;
stop
end
start
note right
JsonNodeworkload()
end note
:return workload;;
stop
end
start
note right
Optional<Integer>shutdownGracePeriodMs()
end note
:return shutdownGracePeriodMs;;
stop
end
start
note right
TaskControllernewController(Stringid)
end note
:return topology->Collections.singleton(commandNode);;
stop
end
start
note right
TaskWorkernewTaskWorker(Stringid)
end note
:return new ExternalCommandWorker(id,this);;
stop
end
@enduml

