@startuml
!pragma layout smetana
start
note right
constructor ExternalCommandSpec(@JsonProperty ("startMs")long startMs,
@JsonProperty ("durationMs")long durationMs,
@JsonProperty ("commandNode")String commandNode,
@JsonProperty ("command")List<String> command,
@JsonProperty ("workload")JsonNode workload,
@JsonProperty ("shutdownGracePeriodMs")Optional<Integer> shutdownGracePeriodMs)
end note
:super (startMs,durationMs);;
:this.commandNode=(commandNode==null )? String.valueOf(""):commandNode;;
:this.command=(command==null )? Collections.unmodifiableList(new ArrayList<String >()):command;;
:this.workload=(workload==null )? NullNode.instance:workload;;
:this.shutdownGracePeriodMs=shutdownGracePeriodMs;;
end
start
note right
String commandNode()
end note
:return commandNode;;
stop
end
start
note right
List<String> command()
end note
:return command;;
stop
end
start
note right
JsonNode workload()
end note
:return workload;;
stop
end
start
note right
Optional<Integer> shutdownGracePeriodMs()
end note
:return shutdownGracePeriodMs;;
stop
end
start
note right
TaskController newController(String id)
end note
:return topology->Collections.singleton(commandNode);;
stop
end
start
note right
TaskWorker newTaskWorker(String id)
end note
:return new ExternalCommandWorker(id,this);;
stop
end
@enduml

