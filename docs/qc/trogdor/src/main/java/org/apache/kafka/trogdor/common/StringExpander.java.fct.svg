@startuml
!pragma layout smetana
start
note right
HashSet<String>expand(Stringval)
end note
if (!matcher.matches()) then (yes) 
:set.add(val);
:return set;;
stop
endif 
if (rangeEndInt<rangeStartInt) then (yes) 
endif 
:i++;
:set.add(String.format("%s%d%s",prequel,i,epilog));
:return set;;
stop
end
@enduml

