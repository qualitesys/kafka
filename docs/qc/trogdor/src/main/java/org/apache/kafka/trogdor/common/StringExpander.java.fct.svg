@startuml
!pragma layout smetana
start
note right
HashSet<String> expand(String val)
end note
:HashSet<String> set=new HashSet<>();;
:Matcher matcher=NUMERIC_RANGE_PATTERN.matcher(val);;
if (!matcher.matches()) then (yes) 
:set.add(val);;
:return set;;
stop
endif 
:String prequel=matcher.group(1);;
:String rangeStart=matcher.group(2);;
:String rangeEnd=matcher.group(3);;
:String epilog=matcher.group(4);;
:int rangeStartInt=Integer.parseInt(rangeStart);;
:int rangeEndInt=Integer.parseInt(rangeEnd);;
if (rangeEndInt<rangeStartInt) then (yes) 
:throw new RuntimeException("Invalid range: start "+
rangeStartInt+" is higher than end "+rangeEndInt);;
stop
endif 
:set.add(String.format("%s%d%s",prequel,i,
epilog));;
:return set;;
stop
end
@enduml

