@startuml
!pragma layout smetana
start
note right
HashSet<String>expand(Stringval)
end note
:HashSet<String>set=new HashSet<>();;
:Matchermatcher=NUMERIC_RANGE_PATTERN.matcher(val);;
if (!matcher.matches()) then (yes) 
:set.add(val);;
:return set;;
stop
endif 
:Stringprequel=matcher.group(1);;
:StringrangeStart=matcher.group(2);;
:StringrangeEnd=matcher.group(3);;
:Stringepilog=matcher.group(4);;
:intrangeStartInt=Integer.parseInt(rangeStart);;
:intrangeEndInt=Integer.parseInt(rangeEnd);;
if (rangeEndInt<rangeStartInt) then (yes) 
:throw new RuntimeException("Invalid range: start "+
rangeStartInt+" is higher than end "+rangeEndInt);;
stop
endif 
:set.add(String.format("%s%d%s",prequel,i,
epilog));;
:return set;;
stop
end
@enduml

