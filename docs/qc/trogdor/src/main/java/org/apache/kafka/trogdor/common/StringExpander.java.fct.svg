@startuml
!pragma layout smetana
start
note right
HashSet<String>expand(Stringval)
end note
if (!matcher.matches()) then (yes) 
:return set;;
stop
endif 
if (rangeEndInt<rangeStartInt) then (yes) 
:throw new RuntimeException("Invalid range: start "+
rangeStartInt+" is higher than end "+rangeEndInt);;
endif 
:return set;;
stop
end
@enduml

