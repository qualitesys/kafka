@startuml
!pragma layout smetana
start
note right
constructor SequentialPayloadGenerator(@JsonProperty ("size")int size,
@JsonProperty ("offset")long startOffset)
end note
:this.size=size;;
:this.startOffset=startOffset;;
:this.buf=ByteBuffer.allocate(8);;
:this.buf.order(ByteOrder.LITTLE_ENDIAN);;
end
start
note right
int size()
end note
:return size;;
stop
end
start
note right
long startOffset()
end note
:return startOffset;;
stop
end
start
note right
byte[] generate(long position)
end note
:buf.clear();;
:buf.putLong(position+startOffset);;
:byte[] result=new byte[size];;
:System.arraycopy(buf.array(),0,result,0,
Math.min(buf.array().length,result.length));;
:return result;;
stop
end
@enduml

