@startuml
!pragma layout smetana
start
note right
constructor SequentialPayloadGenerator(@JsonProperty ("size")intsize,@JsonProperty ("offset")longstartOffset)
end note
:this.size=size;
:this.startOffset=startOffset;
:this.buf=ByteBuffer.allocate(8);
:this.buf.order(ByteOrder.LITTLE_ENDIAN);
end
start
note right
intsize()
end note
:return size;;
stop
end
start
note right
longstartOffset()
end note
:return startOffset;;
stop
end
start
note right
byte[]generate(longposition)
end note
:buf.clear();
:buf.putLong(position+startOffset);
:System.arraycopy(buf.array(),0,result,0,Math.min(buf.array().length,result.length));
:return result;;
stop
end
@enduml

