@startuml
!pragma layout smetana
start
note right
Platformparse(StringcurNodeName,Stringpath)
end note
if (platformNode==null ) then (yes) 
:throw new RuntimeException("Expected to find a 'platform' field "
+"in the root JSON configuration object");;
endif 
:return Utils.newParameterizedInstance(platformName,
String.class ,curNodeName,Scheduler.class ,
Scheduler.SYSTEM,JsonNode.class ,root);;
stop
end
@enduml

