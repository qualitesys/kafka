@startuml
!pragma layout smetana
start
note right
constructor BasicTopology(NavigableMap<String,
Node>nodes)
end note
end
start
note right
constructor BasicTopology(JsonNodeconfigRoot)
end note
if (!configRoot.isObject()) then (yes) 
:throw new RuntimeException("Expected the 'nodes' element to be "+
"a JSON object.");;
endif 
end
start
note right
Nodenode(Stringid)
end note
:return nodes.get(id);;
stop
end
start
note right
NavigableMap<String,Node>nodes()
end note
:return nodes;;
stop
end
@enduml

