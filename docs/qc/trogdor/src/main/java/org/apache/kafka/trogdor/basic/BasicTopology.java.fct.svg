@startuml
!pragma layout smetana
start
note right
constructor BasicTopology(NavigableMap<String,Node>nodes)
end note
:this.nodes=nodes;
end
start
note right
constructor BasicTopology(JsonNodeconfigRoot)
end note
if (!configRoot.isObject()) then (yes) 
endif 
:nodes=new TreeMap<>();
:Iterator<String>iter=configRoot.fieldNames();
:nodes.put(nodeName,node);
end
start
note right
Nodenode(Stringid)
end note
:return nodes.get(id);;
stop
end
start
note right
NavigableMap<String,Node>nodes()
end note
:return nodes;;
stop
end
@enduml

