><line style="stroke:#181818;stroke-width:1.0;" x1="237.5" x2="237.5" y1="921.2852" y2="941.2852"/><polygon fill="#181818" points="233.5,931.2852,237.5,941.2852,241.5,931.2852,237.5,935.2852" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[c3d906cc7424114d146ea4909e16e977]
@startuml
!pragma layout smetana
start
note right
constructor BasicTopology(NavigableMap<String,
Node> nodes)
end note
:this.nodes=nodes;;
end
start
note right
constructor BasicTopology(JsonNode configRoot)
end note
if (!configRoot.isObject()) then (yes) 
:throw new RuntimeException("Expected the 'nodes' element to be "+
"a JSON object.");;
stop
endif 
:nodes=new TreeMap<>();;
:String nodeName=iter.next();;
:JsonNode nodeConfig=configRoot.get(nodeName);;
:BasicNode node=new BasicNode(nodeName,nodeConfig);;
:nodes.put(nodeName,node);;
end
start
note right
Node node(String id)
end note
:return nodes.get(id);;
stop
end
start
note right
NavigableMap<String,Node> nodes()
end note
:return nodes;;
stop
end
@enduml

