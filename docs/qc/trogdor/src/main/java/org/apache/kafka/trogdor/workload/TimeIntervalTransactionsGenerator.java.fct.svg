@startuml
!pragma layout smetana
start
note right
constructor TimeIntervalTransactionsGenerator(@JsonProperty ("transactionIntervalMs")intintervalMs)
end note
:this(intervalMs,Time.SYSTEM);;
end
start
note right
constructor TimeIntervalTransactionsGenerator(@JsonProperty ("transactionIntervalMs")intintervalMs,
Timetime)
end note
if (intervalMs<1) then (yes) 
:throw new IllegalArgumentException("Cannot have a negative interval");;
stop
endif 
:this.time=time;;
:this.intervalMs=intervalMs;;
end
start
note right
inttransactionIntervalMs()
end note
:return intervalMs;;
stop
end
start
note right
TransactionActionnextAction()
end note
if (lastTransactionStartMs==NULL_START_MS) then (yes) 
:lastTransactionStartMs=time.milliseconds();;
:return TransactionAction.BEGIN_TRANSACTION;;
stop
endif 
if (time.milliseconds()-lastTransactionStartMs>=intervalMs) then (yes) 
:lastTransactionStartMs=NULL_START_MS;;
:return TransactionAction.COMMIT_TRANSACTION;;
stop
endif 
:return TransactionAction.NO_OP;;
stop
end
@enduml

