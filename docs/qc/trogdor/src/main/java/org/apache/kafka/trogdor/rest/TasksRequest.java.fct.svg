note right
Optional<TaskStateType>state()
end note
:return state;;
stop
end
start
note right
booleanmatches(StringtaskId,longstartMs,longendMs,
TaskStateTypestate)
end note
if ((!taskIds.isEmpty())&&(!taskIds.contains(taskId))) then (yes) 
:return false;;
stop
endif 
if ((firstStartMs>0)&&(startMs<firstStartMs)) then (yes) 
:return false;;
stop
endif 
if ((lastStartMs>0)&&((startMs<0)||(startMs>lastStartMs))) then (yes) 
:return false;;
stop
endif 
if ((firstEndMs>0)&&(endMs<firstEndMs)) then (yes) 
:return false;;
stop
endif 
if ((lastEndMs>0)&&((endMs<0)||(endMs>lastEndMs))) then (yes) 
:return false;;
stop
endif 
if (this.state.isPresent()&&!this.state.get()
.equals(state)) then (yes) 
:return false;;
stop
endif 
:return true;;
stop
end
