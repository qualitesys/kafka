@startuml
!pragma layout smetana
start
note right
constructor TasksRequest(@JsonProperty ("taskIds")Collection<String>taskIds,
@JsonProperty ("firstStartMs")longfirstStartMs,
@JsonProperty ("lastStartMs")longlastStartMs,
@JsonProperty ("firstEndMs")longfirstEndMs,
@JsonProperty ("lastEndMs")longlastEndMs,
@JsonProperty ("state")Optional<TaskStateType>state)
end note
:this.taskIds=Collections.unmodifiableSet((taskIds==null )? new HashSet<String>():new HashSet<>(taskIds));
:this.firstStartMs=Math.max(0,firstStartMs);
:this.lastStartMs=Math.max(0,lastStartMs);
:this.firstEndMs=Math.max(0,firstEndMs);
:this.lastEndMs=Math.max(0,lastEndMs);
:this.state=state==null ? Optional.empty():state;
end
start
note right
Collection<String>taskIds()
end note
:return taskIds;;
stop
end
start
note right
longfirstStartMs()
end note
:return firstStartMs;;
stop
end
start
note right
longlastStartMs()
end note
:return lastStartMs;;
stop
end
start
