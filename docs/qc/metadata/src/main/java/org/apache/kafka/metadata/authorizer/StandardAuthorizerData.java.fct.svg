@startuml
!pragma layout smetana
start
note right
LoggercreateLogger(intnodeId)
end note
:return new LogContext("[StandardAuthorizer "+
nodeId+"] ").logger(StandardAuthorizerData.class );;
stop
end
start
note right
LoggerauditLogger()
end note
:return LoggerFactory.getLogger("kafka.authorizer.logger");;
stop
end
start
note right
StandardAuthorizerDatacreateEmpty()
end note
:return new StandardAuthorizerData(createLogger(-1),
null ,false,Collections.emptySet(),DENIED,
new ConcurrentSkipListSet<>(),new ConcurrentHashMap<>());;
stop
end
start
note right
constructor StandardAuthorizerData(Loggerlog,
AclMutatoraclMutator,booleanloadingComplete,
Set<String>superUsers,AuthorizationResultdefaultResult,
ConcurrentSkipListSet<StandardAcl>aclsByResource,
ConcurrentHashMap<Uuid,StandardAcl>aclsById)
end note
:this.log=log;
:this.auditLog=auditLogger();
:this.aclMutator=aclMutator;
:this.loadingComplete=loadingComplete;
:this.superUsers=superUsers;
:this.defaultRule=new DefaultRule(defaultResult);
:this.aclsByResource=aclsByResource;
:this.aclsById=aclsById;
end
start
note right
StandardAuthorizerDatacopyWithNewAclMutator(AclMutatornewAclMutator)
end note
:return new StandardAuthorizerData(log,newAclMutator,
loadingComplete,superUsers,defaultRule.result,
aclsByResource,aclsById);;
stop
end
start
note right
StandardAuthorizerDatacopyWithNewLoadingComplete(booleannewLoadingComplete)
end note
:return new StandardAuthorizerData(log,aclMutator,
newLoadingComplete,superUsers,defaultRule.result,
aclsByResource,aclsById);;
stop
end
start
note right
StandardAuthorizerDatacopyWithNewConfig(intnodeId,
Set<String>newSuperUsers,AuthorizationResultnewDefaultResult)
end note
:return new StandardAuthorizerData(createLogger(nodeId),
aclMutator,loadingComplete,newSuperUsers,
newDefaultResult,aclsByResource,aclsById);;
stop
end
start
note right
StandardAuthorizerDatacopyWithNewAcls(Collection<Entry<Uuid,
StandardAcl>>aclEntries)
end note
:newData.addAcl(entry.getKey(),entry.getValue());
:log.info("Applied {} acl(s) from image.",
aclEntries.size());
:return newData;;
stop
end
start
note right
void addAcl(Uuidid,StandardAclacl)
end note
if (prevAcl!=null ) then (yes) 
:throw new RuntimeException("An ACL with ID "+
id+" already exists.");;
endif 
if (!aclsByResource.add(acl)) then (yes) 
:aclsById.remove(id);
:throw new RuntimeException("Unable to add the ACL with ID "+
id+" to aclsByResource");;
endif 
:log.trace("Added ACL {}: {}",id,acl);
:log.error("addAcl error",e);
:throw e;;
end
start
note right
void removeAcl(Uuidid)
end note
if (acl==null ) then (yes) 
:throw new RuntimeException("ID "+id+" not found in aclsById.");;
endif 
if (!aclsByResource.remove(acl)) then (yes) 
:throw new RuntimeException("Unable to remove the ACL with ID "+
id+" from aclsByResource");;
endif 
:log.trace("Removed ACL {}: {}",id,acl);
:log.error("removeAcl error",e);
:throw e;;
end
start
note right
Set<String>superUsers()
end note
:return superUsers;;
stop
end
start
note right
AuthorizationResultdefaultResult()
end note
:return defaultRule.result;;
stop
end
start
note right
intaclCount()
end note
:return aclsById.size();;
stop
end
start
note right
AuthorizationResultauthorize(AuthorizableRequestContextrequestContext,
Actionaction)
end note
if (superUsers.contains(principal.toString())) then (yes) 
:rule=SuperUserRule.INSTANCE;
else (no)
if (aclRule!=null ) then (yes) 
:rule=aclRule;
else (no)
:rule=defaultRule;
endif 
endif 
:logAuditMessage(principal,requestContext,
action,rule);
:return rule.result();;
stop
end
start
note right
StringbuildAuditMessage(KafkaPrincipalprincipal,
AuthorizableRequestContextcontext,Actionaction,
MatchingRulerule)
end note
:bldr.append("Principal = ").append(principal);
:bldr.append(" is ").append(rule.result()==ALLOWED? String.valueOf("Allowed"):String.valueOf("Denied"));
:bldr.append(" operation = ").append(action.operation());
:bldr.append(" from host = ").append(context.clientAddress()
.getHostAddress());
:bldr.append(" on resource = ");
:appendResourcePattern(action.resourcePattern(),
bldr);
:bldr.append(" for request = ").append(ApiKeys.forId(context.requestType())
.name);
:bldr.append(" with resourceRefCount = ")
.append(action.resourceReferenceCount());
:bldr.append(" based on rule ").append(rule);
:return bldr.toString();;
stop
end
start
note right
void appendResourcePattern(ResourcePatternresourcePattern,
StringBuilderbldr)
end note
:bldr.append(SecurityUtils.resourceTypeName(resourcePattern.resourceType()))
.append(":").append(resourcePattern.patternType())
.append(":").append(resourcePattern.name());
end
start
note right
void logAuditMessage(KafkaPrincipalprincipal,
AuthorizableRequestContextrequestContext,
Actionaction,MatchingRulerule)
end note
if (action.logIfAllowed()&&auditLog.isDebugEnabled()) then (yes) 
:auditLog.debug(buildAuditMessage(principal,
requestContext,action,rule));
endif 
:return ;;
stop
if (action.logIfDenied()) then (yes) 
:auditLog.info(buildAuditMessage(principal,
requestContext,action,rule));
endif 
end
start
note right
MatchingAclRulefindAclRule(Set<KafkaPrincipal>matchingPrincipals,
Stringhost,Actionaction)
end note
:checkSection(action,exemplar,matchingPrincipals,
host,matchingAclBuilder);
if (matchingAclBuilder.foundDeny()) then (yes) 
:return matchingAclBuilder.build();;
stop
endif 
:exemplar=new StandardAcl(action.resourcePattern().resourceType(),
WILDCARD,LITERAL,"","",AclOperation.UNKNOWN,
AclPermissionType.UNKNOWN);
:checkSection(action,exemplar,matchingPrincipals,
host,matchingAclBuilder);
:return matchingAclBuilder.build();;
stop
end
start
note right
void checkSection(Actionaction,StandardAclexemplar,
Set<KafkaPrincipal>matchingPrincipals,Stringhost,
MatchingAclBuildermatchingAclBuilder)
end note
:Iterator<StandardAcl>iterator=tailSet.iterator();
if (!acl.resourceType().equals(action.resourcePattern()
.resourceType())) then (yes) 
endif 
if (resourceName.startsWith(acl.resourceName())) then (yes) 
if (acl.patternType()==LITERAL&&!resourceName.equals(acl.resourceName())) then (yes) 
endif 
endif 
if (ALLOWED==result) then (yes) 
:matchingAclBuilder.allowAcl=acl;
endif 
end
start
note right
AuthorizationResultfindResult(Actionaction,
AuthorizableRequestContextrequestContext,
StandardAclacl)
end note
:return findResult(action,matchingPrincipals(requestContext),
requestContext.clientAddress().getHostAddress(),
acl);;
stop
end
start
note right
KafkaPrincipalbaseKafkaPrincipal(AuthorizableRequestContextcontext)
end note
:return sessionPrincipal.getClass().equals(KafkaPrincipal.class )? sessionPrincipal:new KafkaPrincipal(sessionPrincipal.getPrincipalType(),sessionPrincipal.getName());;
stop
end
start
note right
Set<KafkaPrincipal>matchingPrincipals(AuthorizableRequestContextcontext)
end note
:return Utils.mkSet(basePrincipal,WILDCARD_KAFKA_PRINCIPAL);;
stop
end
start
note right
AuthorizationResultfindResult(Actionaction,
Set<KafkaPrincipal>matchingPrincipals,Stringhost,
StandardAclacl)
end note
if (!matchingPrincipals.contains(acl.kafkaPrincipal())) then (yes) 
:return null ;;
stop
endif 
if (!acl.host().equals(WILDCARD)&&!acl.host()
.equals(host)) then (yes) 
:return null ;;
stop
endif 
if (acl.operation()!=ALL) then (yes) 
if (acl.permissionType().equals(ALLOW)) then (yes) 
if (!IMPLIES_DESCRIBE.contains(acl.operation())) then (yes) 
:return null ;;
stop
endif 
if (!IMPLIES_DESCRIBE_CONFIGS.contains(acl.operation())) then (yes) 
:return null ;;
stop
endif 
if (action.operation()!=acl.operation()) then (yes) 
:return null ;;
stop
endif 
endif 
endif 
:return acl.permissionType().equals(ALLOW)? ALLOWED:DENIED;;
stop
end
start
note right
Iterable<AclBinding>acls(AclBindingFilterfilter)
end note
:return new AclIterable(filter);;
stop
end
start
note right
constructor AclIterable(AclBindingFilterfilter)
end note
:this.filter=filter;
end
start
note right
Iterator<AclBinding>iterator()
end note
:return new AclIterator(filter);;
stop
end
start
note right
constructor AclIterator(AclBindingFilterfilter)
end note
:this.filter=filter;
:this.iterator=aclsByResource.iterator();
:this.next=null ;
end
start
note right
booleanhasNext()
end note
while (next==null )
if (!iterator.hasNext()) then (yes) 
:return false;;
stop
endif 
if (filter.matches(binding)) then (yes) 
:next=binding;
endif 
endwhile
:return true;;
stop
end
start
note right
AclBindingnext()
end note
if (!hasNext()) then (yes) 
:throw new NoSuchElementException();;
endif 
:next=null ;
:return result;;
stop
end
start
note right
AuthorizationResultresult()
end note
:return ALLOWED;;
stop
end
start
note right
StringtoString()
end note
:return "SuperUser";;
stop
end
start
note right
constructor DefaultRule(AuthorizationResultresult)
end note
:this.result=result;
end
start
note right
AuthorizationResultresult()
end note
:return result;;
stop
end
start
note right
StringtoString()
end note
:return result==ALLOWED? String.valueOf("DefaultAllow"):String.valueOf("DefaultDeny");;
stop
end
start
note right
constructor MatchingAclRule(StandardAclacl,
AuthorizationResultresult)
end note
:this.acl=acl;
:this.result=result;
end
start
note right
AuthorizationResultresult()
end note
:return result;;
stop
end
start
note right
StringtoString()
end note
:return "MatchingAcl(acl="+acl+")";;
stop
end
start
note right
booleanfoundDeny()
end note
:return denyAcl!=null ;;
stop
end
start
note right
MatchingAclRulebuild()
end note
if (denyAcl!=null ) then (yes) 
:return new MatchingAclRule(denyAcl,DENIED);;
stop
else (no)
:return null ;;
stop
endif 
end
@enduml

