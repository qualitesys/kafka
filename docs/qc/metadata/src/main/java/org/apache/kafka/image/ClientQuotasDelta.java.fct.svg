@startuml
!pragma layout smetana
start
note right
constructor ClientQuotasDelta(ClientQuotasImageimage)
end note
:this.image=image;;
end
start
note right
Map<ClientQuotaEntity,ClientQuotaDelta>changes()
end note
:return changes;;
stop
end
start
note right
void finishSnapshot()
end note
:ClientQuotaEntityentity=entry.getKey();;
:ClientQuotaImagequotaImage=entry.getValue();;
:ClientQuotaDeltaquotaDelta=changes.computeIfAbsent(entity,
__->new ClientQuotaDelta(quotaImage));;
:quotaDelta.finishSnapshot();;
end
start
note right
void handleMetadataVersionChange(MetadataVersionnewVersion)
end note
end
start
note right
void replay(ClientQuotaRecordrecord )
end note
:ClientQuotaEntityentity=ClientQuotaImage.dataToEntity(record .entity());;
:ClientQuotaDeltachange=changes.computeIfAbsent(entity,
__->new ClientQuotaDelta(image.entities().getOrDefault(entity,
ClientQuotaImage.EMPTY)));;
:change.replay(record );;
end
start
note right
ClientQuotasImageapply()
end note
:Map<ClientQuotaEntity,ClientQuotaImage>newEntities=new HashMap<>(image.entities()
.size());;
:ClientQuotaEntityentity=entry.getKey();;
:ClientQuotaDeltachange=changes.get(entity);;
if (change==null ) then (yes) 
:newEntities.put(entity,entry.getValue());;
else (no)
:ClientQuotaImagequotaImage=change.apply();;
if (!quotaImage.isEmpty()) then (yes) 
:newEntities.put(entity,quotaImage);;
endif 
endif 
:ClientQuotaEntityentity=entry.getKey();;
if (!newEntities.containsKey(entity)) then (yes) 
:ClientQuotaImagequotaImage=entry.getValue()
.apply();;
if (!quotaImage.isEmpty()) then (yes) 
:newEntities.put(entity,quotaImage);;
endif 
endif 
:return new ClientQuotasImage(newEntities);;
stop
end
start
note right
StringtoString()
end note
:return "ClientQuotasDelta("+"changes="+changes+
')';;
stop
end
@enduml

