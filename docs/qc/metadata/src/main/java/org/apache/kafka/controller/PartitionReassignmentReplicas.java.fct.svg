@startuml
!pragma layout smetana
start
note right
Set<Integer>calculateDifference(List<Integer>a,
List<Integer>b)
end note
:return result;;
stop
end
start
note right
constructor PartitionReassignmentReplicas(List<Integer>currentReplicas,
List<Integer>targetReplicas)
end note
end
start
note right
List<Integer>removing()
end note
:return removing;;
stop
end
start
note right
List<Integer>adding()
end note
:return adding;;
stop
end
start
note right
List<Integer>merged()
end note
:return merged;;
stop
end
start
note right
inthashCode()
end note
:return Objects.hash(removing,adding,merged);;
stop
end
start
note right
booleanequals(Objecto)
end note
if (!(o instanceof PartitionReassignmentReplicas)) then (yes) 
:return false;;
stop
endif 
