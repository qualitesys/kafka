@startuml
!pragma layout smetana
start
note right
constructor FeaturesImage(Map<String,Short>finalizedVersions,MetadataVersionmetadataVersion)
end note
:this.finalizedVersions=Collections.unmodifiableMap(finalizedVersions);
:this.metadataVersion=metadataVersion;
end
start
note right
booleanisEmpty()
end note
:return finalizedVersions.isEmpty();;
stop
end
start
note right
MetadataVersionmetadataVersion()
end note
:return metadataVersion;;
stop
end
start
note right
Map<String,Short>finalizedVersions()
end note
:return finalizedVersions;;
stop
end
start
note right
Optional<Short>finalizedVersion(Stringfeature)
end note
:return Optional.ofNullable(finalizedVersions.get(feature));;
stop
end
start
note right
void write(Consumer<List<ApiMessageAndVersion>>out)
end note
:batch.add(new ApiMessageAndVersion(new FeatureLevelRecord().setName(MetadataVersion.FEATURE_NAME).setFeatureLevel(metadataVersion.featureLevel()),FEATURE_LEVEL_RECORD.lowestSupportedVersion()));
if (entry.getKey().equals(MetadataVersion.FEATURE_NAME)) then (yes) 
endif 
:batch.add(new ApiMessageAndVersion(new FeatureLevelRecord().setName(entry.getKey()).setFeatureLevel(entry.getValue()),FEATURE_LEVEL_RECORD.highestSupportedVersion()));
:out.accept(batch);
end
start
note right
inthashCode()
end note
:return finalizedVersions.hashCode();;
stop
end
start
note right
booleanequals(Objecto)
end note
if (!(o instanceof FeaturesImage)) then (yes) 
:return false;;
stop
endif 
:return finalizedVersions.equals(other.finalizedVersions);;
stop
end
start
note right
StringtoString()
end note
:return "FeaturesImage{"+"finalizedVersions="+
finalizedVersions+", metadataVersion="+metadataVersion+
'}';;
stop
end
@enduml

