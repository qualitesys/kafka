@startuml
!pragma layout smetana
start
note right
constructor BrokerHeartbeatState(intid)
end note
:this.id=id;;
:this.lastContactNs=0;;
:this.prev=null ;;
:this.next=null ;;
:this.metadataOffset=-1;;
:this.controlledShutDownOffset=-1;;
end
start
note right
intid()
end note
:return id;;
stop
end
start
note right
booleanfenced()
end note
:return prev==null ;;
stop
end
start
note right
booleanshuttingDown()
end note
:return controlledShutDownOffset>=0;;
stop
end
start
note right
intcompare(BrokerHeartbeatStatea,BrokerHeartbeatStateb)
end note
if (a.metadataOffset<b.metadataOffset) then (yes) 
:return -1;;
stop
else if (a.metadataOffset>b.metadataOffset) then (yes) 
:return 1;;
stop
else if (a.id<b.id) then (yes) 
:return -1;;
stop
else if (a.id>b.id) then (yes) 
:return 1;;
stop
else (no)
:return 0;;
stop
endif 
end
start
note right
constructor BrokerHeartbeatStateList()
end note
:this.head=new BrokerHeartbeatState(-1);;
:head.prev=head;;
:head.next=head;;
end
start
note right
BrokerHeartbeatStatefirst()
end note
:BrokerHeartbeatStateresult=head.next;;
:return result==head? null :result;;
stop
end
start
note right
void add(BrokerHeartbeatStatebroker)
end note
:BrokerHeartbeatStatecur=head.prev;;
while (true)
if (cur==head||cur.lastContactNs<=broker.lastContactNs) then (yes) 
:broker.next=cur.next;;
:cur.next.prev=broker;;
:broker.prev=cur;;
:cur.next=broker;;
:break ;;
endif 
:cur=cur.prev;;
endwhile
end
start
note right
void remove(BrokerHeartbeatStatebroker)
end note
if (broker.next==null ) then (yes) 
:throw new RuntimeException(broker+" is not in the  list.");;
stop
endif 
:broker.prev.next=broker.next;;
:broker.next.prev=broker.prev;;
:broker.prev=null ;;
:broker.next=null ;;
end
start
note right
BrokerHeartbeatStateIteratoriterator()
end note
:return new BrokerHeartbeatStateIterator(head);;
stop
end
start
note right
constructor BrokerHeartbeatStateIterator(BrokerHeartbeatStatehead)
end note
:this.head=head;;
:this.cur=head;;
end
start
note right
booleanhasNext()
end note
:return cur.next!=head;;
stop
end
start
note right
BrokerHeartbeatStatenext()
end note
if (!hasNext()) then (yes) 
:throw new NoSuchElementException();;
stop
endif 
:BrokerHeartbeatStateresult=cur.next;;
:cur=cur.next;;
:return result;;
stop
end
start
note right
constructor BrokerHeartbeatManager(LogContextlogContext,
Timetime,longsessionTimeoutNs)
end note
:this.log=logContext.logger(BrokerHeartbeatManager.class );;
:this.time=time;;
:this.sessionTimeoutNs=sessionTimeoutNs;;
:this.brokers=new HashMap<>();;
:this.unfenced=new BrokerHeartbeatStateList();;
:this.active=new TreeSet<>(MetadataOffsetComparator.INSTANCE);;
end
start
note right
Timetime()
end note
:return time;;
stop
end
start
note right
BrokerHeartbeatStateListunfenced()
end note
:return unfenced;;
stop
end
start
note right
Collection<BrokerHeartbeatState>brokers()
end note
:return brokers.values();;
stop
end
start
note right
void fence(intbrokerId)
end note
:BrokerHeartbeatStatebroker=brokers.get(brokerId);;
if (broker!=null ) then (yes) 
:untrack(broker);;
endif 
end
start
note right
void remove(intbrokerId)
end note
:BrokerHeartbeatStatebroker=brokers.remove(brokerId);;
if (broker!=null ) then (yes) 
:untrack(broker);;
endif 
end
start
note right
void untrack(BrokerHeartbeatStatebroker)
end note
if (!broker.fenced()) then (yes) 
:unfenced.remove(broker);;
if (!broker.shuttingDown()) then (yes) 
:active.remove(broker);;
endif 
endif 
end
start
note right
booleanhasValidSession(intbrokerId)
end note
:BrokerHeartbeatStatebroker=brokers.get(brokerId);;
if (broker==null ) then (yes) 
:return false;;
stop
endif 
:return hasValidSession(broker);;
stop
end
start
note right
booleanhasValidSession(BrokerHeartbeatStatebroker)
end note
if (broker.fenced()) then (yes) 
:return false;;
stop
else (no)
:return broker.lastContactNs+sessionTimeoutNs>=time.nanoseconds();;
stop
endif 
end
start
note right
void register(intbrokerId,booleanfenced)
end note
:BrokerHeartbeatStatebroker=brokers.get(brokerId);;
if (broker==null ) then (yes) 
:touch(brokerId,fenced,-1);;
else if (broker.fenced()!=fenced) then (yes) 
:touch(brokerId,fenced,broker.metadataOffset);;
endif 
end
start
note right
void touch(intbrokerId,booleanfenced,longmetadataOffset)
end note
:BrokerHeartbeatStatebroker=brokers.get(brokerId);;
if (broker==null ) then (yes) 
:broker=new BrokerHeartbeatState(brokerId);;
:brokers.put(brokerId,broker);;
else (no)
:untrack(broker);;
endif 
:broker.lastContactNs=time.nanoseconds();;
:broker.metadataOffset=metadataOffset;;
if (fenced) then (yes) 
:broker.controlledShutDownOffset=-1;;
else (no)
:unfenced.add(broker);;
if (!broker.shuttingDown()) then (yes) 
:active.add(broker);;
endif 
endif 
end
start
note right
longlowestActiveOffset()
end note
:Iterator<BrokerHeartbeatState>iterator=active.iterator();;
if (!iterator.hasNext()) then (yes) 
:return Long.MAX_VALUE;;
stop
endif 
:BrokerHeartbeatStatefirst=iterator.next();;
:return first.metadataOffset;;
stop
end
start
note right
void updateControlledShutdownOffset(intbrokerId,
longcontrolledShutDownOffset)
end note
:BrokerHeartbeatStatebroker=brokers.get(brokerId);;
if (broker==null ) then (yes) 
:throw new RuntimeException("Unable to locate broker "+
brokerId);;
stop
endif 
if (broker.fenced()) then (yes) 
:throw new RuntimeException("Fenced brokers cannot enter controlled shutdown.");;
stop
endif 
:active.remove(broker);;
:broker.controlledShutDownOffset=controlledShutDownOffset;;
:log.debug("Updated the controlled shutdown offset for broker {} to {}.",
brokerId,controlledShutDownOffset);;
end
start
note right
longnextCheckTimeNs()
end note
:BrokerHeartbeatStatebroker=unfenced.first();;
if (broker==null ) then (yes) 
:return Long.MAX_VALUE;;
stop
else (no)
:return broker.lastContactNs+sessionTimeoutNs;;
stop
endif 
end
start
note right
Optional<Integer>findOneStaleBroker()
end note
:BrokerHeartbeatStateIteratoriterator=unfenced.iterator();;
if (iterator.hasNext()) then (yes) 
:BrokerHeartbeatStatebroker=iterator.next();;
if (!hasValidSession(broker)) then (yes) 
:return Optional.of(broker.id);;
stop
endif 
endif 
:return Optional.empty();;
stop
end
start
note right
Iterator<UsableBroker>usableBrokers(Function<Integer,
Optional<String>>idToRack)
end note
:return new UsableBrokerIterator(brokers.values().iterator(),
idToRack);;
stop
end
start
note right
constructor UsableBrokerIterator(Iterator<BrokerHeartbeatState>iterator,
Function<Integer,Optional<String>>idToRack)
end note
:this.iterator=iterator;;
:this.idToRack=idToRack;;
:this.next=null ;;
end
start
note right
booleanhasNext()
end note
if (next!=null ) then (yes) 
:return true;;
stop
endif 
:BrokerHeartbeatStateresult;;
repeat
if (!iterator.hasNext()) then (yes) 
:return false;;
stop
endif 
:result=iterator.next();;
repeat while (result.shuttingDown())
:Optional<String>rack=idToRack.apply(result.id());;
:next=new UsableBroker(result.id(),rack,result.fenced());;
:return true;;
stop
end
start
note right
UsableBrokernext()
end note
if (!hasNext()) then (yes) 
:throw new NoSuchElementException();;
stop
endif 
:UsableBrokerresult=next;;
:next=null ;;
:return result;;
stop
end
start
note right
BrokerControlStatecurrentBrokerState(BrokerHeartbeatStatebroker)
end note
if (broker.shuttingDown()) then (yes) 
:return CONTROLLED_SHUTDOWN;;
stop
else if (broker.fenced()) then (yes) 
:return FENCED;;
stop
else (no)
:return UNFENCED;;
stop
endif 
end
start
note right
BrokerControlStatescalculateNextBrokerState(intbrokerId,
BrokerHeartbeatRequestDatarequest,longlastCommittedOffset,
Supplier<Boolean>hasLeaderships)
end note
:BrokerHeartbeatStatebroker=brokers.getOrDefault(brokerId,
new BrokerHeartbeatState(brokerId));;
:BrokerControlStatecurrentState=currentBrokerState(broker);;
switch (switch (currentState))
endswith
end
