@startuml
!pragma layout smetana
start
note right
constructor ConfigurationDelta(ConfigurationImageimage)
end note
end
start
note right
void finishSnapshot()
end note
if (!changes.containsKey(key)) then (yes) 
endif 
end
start
note right
void replay(ConfigRecordrecord)
end note
end
start
note right
void deleteAll()
end note
end
start
note right
ConfigurationImageapply()
end note
if (change==null ) then (yes) 
endif 
if (!newData.containsKey(entry.getKey())) then (yes) 
if (entry.getValue().isPresent()) then (yes) 
endif 
endif 
:return new ConfigurationImage(newData);;
stop
end
start
note right
StringtoString()
end note
:return "ConfigurationDelta("+"changedKeys="+
changes.keySet()+')';;
stop
end
@enduml

