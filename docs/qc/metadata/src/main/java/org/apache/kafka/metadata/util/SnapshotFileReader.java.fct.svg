@startuml
!pragma layout smetana
start
note right
constructor SnapshotFileReader(StringsnapshotPath,
RaftClient.Listener<ApiMessageAndVersion>listener)
end note
:this.snapshotPath=snapshotPath;;
:this.listener=listener;;
:this.queue=new KafkaEventQueue(Time.SYSTEM,
new LogContext("[snapshotReaderQueue] "),
"snapshotReaderQueue_");;
:this.caughtUpFuture=new CompletableFuture<>();;
end
start
note right
void startup()
end note
:CompletableFuture<Void>future=new CompletableFuture<>();;
:queue.append(new EventQueue.Event(){@Override public void run()throws Exception{fileRecords=FileRecords.open(new File(snapshotPath),
false);batchIterator=fileRecords.batches().iterator();scheduleHandleNextBatch();future.complete(null );}@Override public void handleException(Throwablee){future.completeExceptionally(e);beginShutdown("startup error");}});;
:future.get();;
end
start
note right
void handleNextBatch()
end note
if (!batchIterator.hasNext()) then (yes) 
:beginShutdown("done");;
:return ;;
stop
endif 
:FileChannelRecordBatchbatch=batchIterator.next();;
if (batch.isControlBatch()) then (yes) 
:handleControlBatch(batch);;
else (no)
:handleMetadataBatch(batch);;
endif 
:scheduleHandleNextBatch();;
end
start
note right
void scheduleHandleNextBatch()
end note
:queue.append(new EventQueue.Event(){@Override public void run(){handleNextBatch();}@Override public void handleException(Throwablee){log.error("Unexpected error while handling a batch of events",
e);beginShutdown("handleBatch error");}});;
end
start
note right
void handleControlBatch(FileChannelRecordBatchbatch)
end note
:Recordrecord=iter.next();;
:try ;
:shorttypeId=ControlRecordType.parseTypeId(record.key());;
:ControlRecordTypetype=ControlRecordType.fromTypeId(typeId);;
switch (switch (type))
endswith
:catch (Throwablee);
:log.error("unable to read control record at offset {}",
record.offset(),e);;
end
start
note right
void handleMetadataBatch(FileChannelRecordBatchbatch)
end note
:List<ApiMessageAndVersion>messages=new ArrayList<>();;
:ByteBufferAccessoraccessor=new ByteBufferAccessor(record.value());;
:try ;
:ApiMessageAndVersionmessageAndVersion=serde.read(accessor,
record.valueSize());;
:messages.add(messageAndVersion);;
:catch (Throwablee);
:log.error("unable to read metadata record at offset {}",
record.offset(),e);;
:listener.handleCommit(MemoryBatchReader.of(Collections.singletonList(Batch.data(batch.baseOffset(),
batch.partitionLeaderEpoch(),batch.maxTimestamp(),
batch.sizeInBytes(),messages)),reader->{}));;
end
start
note right
void beginShutdown(Stringreason)
end note
if (reason.equals("done")) then (yes) 
:caughtUpFuture.complete(null );;
else (no)
:caughtUpFuture.completeExceptionally(new RuntimeException(reason));;
endif 
:queue.beginShutdown(reason,new EventQueue.Event(){@Override public void run()throws Exception{listener.beginShutdown();
:if (fileRecords!=null ){fileRecords.close();fileRecords=null ;}batchIterator=null ;}@Override public void handleException(Throwablee){log.error("shutdown error",
e);}});;
end
start
note right
void close()
end note
:beginShutdown("closing");;
:queue.close();;
end
start
note right
CompletableFuture<Void>caughtUpFuture()
end note
:return caughtUpFuture;;
stop
end
@enduml

