@startuml
!pragma layout smetana
start
note right
constructor SnapshotFileReader(StringsnapshotPath,
RaftClient.Listener<ApiMessageAndVersion>listener)
end note
end
start
note right
void startup()
end note
end
start
note right
void handleNextBatch()
end note
if (!batchIterator.hasNext()) then (yes) 
:return ;;
stop
endif 
if (batch.isControlBatch()) then (yes) 
else (no)
endif 
end
start
note right
void scheduleHandleNextBatch()
end note
end
start
note right
void handleControlBatch(FileChannelRecordBatchbatch)
end note
end
start
note right
void handleMetadataBatch(FileChannelRecordBatchbatch)
end note
end
start
note right
void beginShutdown(Stringreason)
end note
if (reason.equals("done")) then (yes) 
else (no)
endif 
end
start
note right
void close()
end note
end
start
note right
CompletableFuture<Void>caughtUpFuture()
end note
:return caughtUpFuture;;
stop
end
@enduml

