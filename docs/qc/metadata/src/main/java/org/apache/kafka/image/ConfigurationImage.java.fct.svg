@startuml
!pragma layout smetana
start
note right
constructor ConfigurationImage(Map<String,
String>data)
end note
end
start
note right
Map<String,String>data()
end note
:return data;;
stop
end
start
note right
booleanisEmpty()
end note
:return data.isEmpty();;
stop
end
start
note right
PropertiestoProperties()
end note
:return properties;;
stop
end
start
note right
void write(ConfigResourceconfigResource,Consumer<List<ApiMessageAndVersion>>out)
end note
end
start
note right
booleanequals(Objecto)
end note
if (!(o instanceof ConfigurationImage)) then (yes) 
:return false;;
stop
endif 
:return data.equals(other.data);;
stop
end
start
note right
inthashCode()
end note
:return Objects.hash(data);;
stop
end
start
note right
StringtoString()
end note
:return "ConfigurationImage(data="+data.entrySet().stream().map(e->e.getKey()+
":"+e.getValue()).collect(Collectors.joining(", "))+
")";;
stop
end
@enduml

