@startuml
!pragma layout smetana
start
note right
constructor ProducerIdsImage(longnextProducerId)
end note
:this.nextProducerId=nextProducerId;
end
start
note right
longhighestSeenProducerId()
end note
:return nextProducerId;;
stop
end
start
note right
void write(Consumer<List<ApiMessageAndVersion>>out)
end note
if (nextProducerId>=0) then (yes) 
:out.accept(Collections.singletonList(new ApiMessageAndVersion(new ProducerIdsRecord().setBrokerId(-1).setBrokerEpoch(-1).setNextProducerId(nextProducerId),(short)0)));
endif 
end
start
note right
booleanequals(Objecto)
end note
if (!(o instanceof ProducerIdsImage)) then (yes) 
:return false;;
stop
endif 
:return nextProducerId==other.nextProducerId;;
stop
end
start
note right
inthashCode()
end note
:return Objects.hash(nextProducerId);;
stop
end
start
note right
StringtoString()
end note
:return "ProducerIdsImage(highestSeenProducerId="+nextProducerId+")";;
stop
end
start
note right
booleanisEmpty()
end note
:return nextProducerId<0;;
stop
end
@enduml

