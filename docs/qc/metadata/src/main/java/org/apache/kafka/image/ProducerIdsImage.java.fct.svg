@startuml
!pragma layout smetana
start
note right
constructor ProducerIdsImage(long nextProducerId)
end note
:this.nextProducerId=nextProducerId;;
end
start
note right
long highestSeenProducerId()
end note
:return nextProducerId;;
stop
end
start
note right
void write(Consumer<List<ApiMessageAndVersion>> out)
end note
if (nextProducerId>=0) then (yes) 
:out.accept(Collections.singletonList(new ApiMessageAndVersion(new ProducerIdsRecord().setBrokerId(-1).setBrokerEpoch(-1).setNextProducerId(nextProducerId),
(short )0)));;
endif 
end
start
note right
boolean equals(Object o)
end note
if (!(o instanceof ProducerIdsImage )) then (yes) 
:return false;;
stop
endif 
:ProducerIdsImage other=(ProducerIdsImage )o;;
:return nextProducerId==other.nextProducerId;;
stop
end
start
note right
int hashCode()
end note
:return Objects.hash(nextProducerId);;
stop
end
start
note right
String toString()
end note
:return "ProducerIdsImage(highestSeenProducerId="+
nextProducerId+")";;
stop
end
start
note right
boolean isEmpty()
end note
:return nextProducerId<0;;
stop
end
@enduml

