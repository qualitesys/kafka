@startuml
!pragma layout smetana
start
note right
constructor UsableBroker(intid,Optional<String>rack,booleanfenced)
end note
:this.id=id;
:this.rack=rack;
:this.fenced=fenced;
end
start
note right
intid()
end note
:return id;;
stop
end
start
note right
Optional<String>rack()
end note
:return rack;;
stop
end
start
note right
booleanfenced()
end note
:return fenced;;
stop
end
start
note right
booleanequals(Objecto)
end note
if (!(o instanceof UsableBroker)) then (yes) 
:return false;;
stop
endif 
:return other.id==id&&other.rack.equals(rack)&&other.fenced==fenced;;
stop
end
start
note right
inthashCode()
end note
:return Objects.hash(id,rack,fenced);;
stop
end
start
note right
StringtoString()
end note
:return "UsableBroker"+"(id="+id+", rack="+
rack+", fenced="+fenced+")";;
stop
end
@enduml

