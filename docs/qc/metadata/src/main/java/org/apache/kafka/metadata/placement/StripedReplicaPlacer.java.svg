+  throwInvalidReplicationFactorIfNonPositive(int)
+  throwInvalidReplicationFactorIfZero(int)
+  throwInvalidReplicationFactorIfTooFewBrokers(int;int)
+  StripedReplicaPlacer(Random)
+  place(PlacementSpec;ClusterDescriber)
} 
@enduml

