@startuml
!pragma layout smetana
start
note right
constructor ProducerIdsDelta(ProducerIdsImage image)
end note
:this.nextProducerId=image.highestSeenProducerId();;
end
start
note right
void setNextProducerId(long highestSeenProducerId)
end note
:this.nextProducerId=highestSeenProducerId;;
end
start
note right
long nextProducerId()
end note
:return nextProducerId;;
stop
end
start
note right
void finishSnapshot()
end note
end
start
note right
void handleMetadataVersionChange(MetadataVersion newVersion)
end note
end
start
note right
void replay(ProducerIdsRecord record)
end note
:nextProducerId=record.nextProducerId();;
end
start
note right
ProducerIdsImage apply()
end note
:return new ProducerIdsImage(nextProducerId);;
stop
end
@enduml

