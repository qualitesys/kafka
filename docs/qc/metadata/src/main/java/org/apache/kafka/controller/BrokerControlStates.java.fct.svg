@startuml
!pragma layout smetana
start
note right
constructor BrokerControlStates(BrokerControlStatecurrent,
BrokerControlStatenext)
end note
:this.current=current;
:this.next=next;
end
start
note right
BrokerControlStatecurrent()
end note
:return current;;
stop
end
start
note right
BrokerControlStatenext()
end note
:return next;;
stop
end
start
note right
inthashCode()
end note
:return Objects.hash(current,next);;
stop
end
start
note right
booleanequals(Objecto)
end note
if (!(o instanceof BrokerControlStates)) then (yes) 
:return false;;
stop
endif 
:return other.current==current&&other.next==next;;
stop
end
start
note right
StringtoString()
end note
:return "BrokerControlStates(current="+current+
", next="+next+")";;
stop
end
@enduml

