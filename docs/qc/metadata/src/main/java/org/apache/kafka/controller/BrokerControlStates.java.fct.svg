@startuml
!pragma layout smetana
start
note right
constructor BrokerControlStates(BrokerControlState current,
BrokerControlState next)
end note
:this.current=current;;
:this.next=next;;
end
start
note right
BrokerControlState current()
end note
:return current;;
stop
end
start
note right
BrokerControlState next()
end note
:return next;;
stop
end
start
note right
int hashCode()
end note
:return Objects.hash(current,next);;
stop
end
start
note right
boolean equals(Object o)
end note
if (!(o instanceof BrokerControlStates )) then (yes) 
:return false;;
stop
endif 
:BrokerControlStates other=(BrokerControlStates )o;;
:return other.current==current&&other.next==next;;
stop
end
start
note right
String toString()
end note
:return "BrokerControlStates(current="+current+
", next="+next+")";;
stop
end
@enduml

