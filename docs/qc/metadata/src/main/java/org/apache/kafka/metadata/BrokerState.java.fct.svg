@startuml
!pragma layout smetana
:VALUES_TO_ENUMS.put(state.value(),state);;
start
note right
constructor BrokerState(byte value)
end note
:this.value=value;;
end
start
note right
BrokerState fromValue(byte value)
end note
:BrokerState state=VALUES_TO_ENUMS.get(value);;
if (state==null ) then (yes) 
:return UNKNOWN;;
stop
endif 
:return state;;
stop
end
start
note right
byte value()
end note
:return value;;
stop
end
@enduml

