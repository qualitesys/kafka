@startuml
!pragma layout smetana
start
note right
constructor BrokerRegistrationReply(longepoch)
end note
:this.epoch=epoch;
end
start
note right
longepoch()
end note
:return epoch;;
stop
end
start
note right
inthashCode()
end note
:return Objects.hash(epoch);;
stop
end
start
note right
booleanequals(Objecto)
end note
if (!(o instanceof BrokerRegistrationReply)) then (yes) 
:return false;;
stop
endif 
:return other.epoch==epoch;;
stop
end
start
note right
StringtoString()
end note
:return "BrokerRegistrationReply(epoch="+
epoch+")";;
stop
end
@enduml

