@startuml
!pragma layout smetana
start
note right
constructor BrokerRegistrationReply(long epoch)
end note
:this.epoch=epoch;;
end
start
note right
long epoch()
end note
:return epoch;;
stop
end
start
note right
int hashCode()
end note
:return Objects.hash(epoch);;
stop
end
start
note right
boolean equals(Object o)
end note
if (!(o instanceof BrokerRegistrationReply )) then (yes) 
:return false;;
stop
endif 
:BrokerRegistrationReply other=(BrokerRegistrationReply )o;;
:return other.epoch==epoch;;
stop
end
start
note right
String toString()
end note
:return "BrokerRegistrationReply(epoch="+
epoch+")";;
stop
end
@enduml

