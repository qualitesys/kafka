@startuml
!pragma layout smetana
start
note right
intcompare(Optional<String>a,Optional<String>b)
end note
if (!a.isPresent()) then (yes) 
if (!b.isPresent()) then (yes) 
:return 0;;
stop
else (no)
:return -1;;
stop
endif 
else if (!b.isPresent()) then (yes) 
:return 1;;
stop
endif 
:return a.get().compareTo(b.get());;
stop
end
@enduml

