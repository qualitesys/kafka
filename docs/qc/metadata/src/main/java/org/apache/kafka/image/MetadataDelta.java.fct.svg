@startuml
!pragma layout smetana
start
note right
constructor MetadataDelta(MetadataImageimage)
end note
:this.image=image;;
:this.highestOffset=image.highestOffsetAndEpoch()
.offset;;
:this.highestEpoch=image.highestOffsetAndEpoch()
.epoch;;
end
start
note right
MetadataImageimage()
end note
:return image;;
stop
end
start
note right
FeaturesDeltafeaturesDelta()
end note
:return featuresDelta;;
stop
end
start
note right
FeaturesDeltagetOrCreateFeaturesDelta()
end note
if (featuresDelta==null ) then (yes) 
:featuresDelta=new FeaturesDelta(image.features());;
endif 
:return featuresDelta;;
stop
end
start
note right
ClusterDeltaclusterDelta()
end note
:return clusterDelta;;
stop
end
start
note right
ClusterDeltagetOrCreateClusterDelta()
end note
if (clusterDelta==null ) then (yes) 
:clusterDelta=new ClusterDelta(image.cluster());;
endif 
:return clusterDelta;;
stop
end
start
note right
TopicsDeltatopicsDelta()
end note
:return topicsDelta;;
stop
end
start
note right
TopicsDeltagetOrCreateTopicsDelta()
end note
if (topicsDelta==null ) then (yes) 
:topicsDelta=new TopicsDelta(image.topics());;
endif 
:return topicsDelta;;
stop
end
start
note right
ConfigurationsDeltaconfigsDelta()
end note
:return configsDelta;;
stop
end
start
note right
ConfigurationsDeltagetOrCreateConfigsDelta()
end note
if (configsDelta==null ) then (yes) 
:configsDelta=new ConfigurationsDelta(image.configs());;
endif 
:return configsDelta;;
stop
end
start
note right
ClientQuotasDeltaclientQuotasDelta()
end note
:return clientQuotasDelta;;
stop
end
start
note right
ClientQuotasDeltagetOrCreateClientQuotasDelta()
end note
if (clientQuotasDelta==null ) then (yes) 
:clientQuotasDelta=new ClientQuotasDelta(image.clientQuotas());;
endif 
:return clientQuotasDelta;;
stop
end
start
note right
ProducerIdsDeltaproducerIdsDelta()
end note
:return producerIdsDelta;;
stop
end
start
note right
ProducerIdsDeltagetOrCreateProducerIdsDelta()
end note
if (producerIdsDelta==null ) then (yes) 
:producerIdsDelta=new ProducerIdsDelta(image.producerIds());;
endif 
:return producerIdsDelta;;
stop
end
start
note right
AclsDeltaaclsDelta()
end note
:return aclsDelta;;
stop
end
start
note right
AclsDeltagetOrCreateAclsDelta()
end note
if (aclsDelta==null ) then (yes) 
:aclsDelta=new AclsDelta(image.acls());;
endif 
:return aclsDelta;;
stop
end
start
note right
Optional<MetadataVersion>metadataVersionChanged()
end note
if (featuresDelta==null ) then (yes) 
:return Optional.empty();;
stop
else (no)
:return featuresDelta.metadataVersionChange();;
stop
endif 
end
start
note right
void read(longhighestOffset,inthighestEpoch,
Iterator<List<ApiMessageAndVersion>>reader)
end note
while (reader.hasNext())
:List<ApiMessageAndVersion>batch=reader.next();;
:replay(highestOffset,highestEpoch,messageAndVersion.message());;
endwhile
end
start
note right
void replay(longoffset,intepoch,ApiMessagerecord)
end note
:highestOffset=offset;;
:highestEpoch=epoch;;
:MetadataRecordTypetype=MetadataRecordType.fromId(record.apiKey());;
switch (switch (type))
endswith
end
start
note right
void replay(RegisterBrokerRecordrecord)
end note
if (clusterDelta==null ) then (yes) 
:clusterDelta=new ClusterDelta(image.cluster());;
endif 
:clusterDelta.replay(record);;
end
start
note right
void replay(UnregisterBrokerRecordrecord)
end note
if (clusterDelta==null ) then (yes) 
:clusterDelta=new ClusterDelta(image.cluster());;
endif 
:clusterDelta.replay(record);;
end
start
note right
void replay(TopicRecordrecord)
end note
:getOrCreateTopicsDelta().replay(record);;
end
start
note right
void replay(PartitionRecordrecord)
end note
:getOrCreateTopicsDelta().replay(record);;
end
start
note right
void replay(ConfigRecordrecord)
end note
:getOrCreateConfigsDelta().replay(record);;
end
start
note right
void replay(PartitionChangeRecordrecord)
end note
:getOrCreateTopicsDelta().replay(record);;
end
start
note right
void replay(FenceBrokerRecordrecord)
end note
:getOrCreateClusterDelta().replay(record);;
end
start
note right
void replay(UnfenceBrokerRecordrecord)
end note
:getOrCreateClusterDelta().replay(record);;
end
start
note right
void replay(RemoveTopicRecordrecord)
end note
:getOrCreateTopicsDelta().replay(record);;
:StringtopicName=topicsDelta.replay(record);;
:getOrCreateConfigsDelta().replay(record,
topicName);;
end
start
note right
void replay(FeatureLevelRecordrecord)
end note
:getOrCreateFeaturesDelta().replay(record);;
:featuresDelta.metadataVersionChange().ifPresent(changedMetadataVersion->{getOrCreateClusterDelta().handleMetadataVersionChange(changedMetadataVersion);
:getOrCreateConfigsDelta().handleMetadataVersionChange(changedMetadataVersion);
:getOrCreateTopicsDelta().handleMetadataVersionChange(changedMetadataVersion);
:getOrCreateClientQuotasDelta().handleMetadataVersionChange(changedMetadataVersion);
:getOrCreateProducerIdsDelta().handleMetadataVersionChange(changedMetadataVersion);
:getOrCreateAclsDelta().handleMetadataVersionChange(changedMetadataVersion);});;
end
start
note right
void replay(BrokerRegistrationChangeRecordrecord)
end note
:getOrCreateClusterDelta().replay(record);;
end
start
note right
void replay(ClientQuotaRecordrecord)
end note
:getOrCreateClientQuotasDelta().replay(record);;
end
start
note right
void replay(ProducerIdsRecordrecord)
end note
:getOrCreateProducerIdsDelta().replay(record);;
end
start
note right
void replay(AccessControlEntryRecordrecord)
end note
:getOrCreateAclsDelta().replay(record);;
end
start
note right
void replay(RemoveAccessControlEntryRecordrecord)
end note
:getOrCreateAclsDelta().replay(record);;
end
start
note right
void finishSnapshot()
end note
:getOrCreateFeaturesDelta().finishSnapshot();;
:getOrCreateClusterDelta().finishSnapshot();;
:getOrCreateTopicsDelta().finishSnapshot();;
:getOrCreateConfigsDelta().finishSnapshot();;
:getOrCreateClientQuotasDelta().finishSnapshot();;
:getOrCreateProducerIdsDelta().finishSnapshot();;
:getOrCreateAclsDelta().finishSnapshot();;
end
start
note right
MetadataImageapply()
end note
:FeaturesImagenewFeatures;;
if (featuresDelta==null ) then (yes) 
:newFeatures=image.features();;
else (no)
:newFeatures=featuresDelta.apply();;
endif 
:ClusterImagenewCluster;;
if (clusterDelta==null ) then (yes) 
:newCluster=image.cluster();;
else (no)
:newCluster=clusterDelta.apply();;
endif 
:TopicsImagenewTopics;;
if (topicsDelta==null ) then (yes) 
:newTopics=image.topics();;
else (no)
:newTopics=topicsDelta.apply();;
endif 
:ConfigurationsImagenewConfigs;;
if (configsDelta==null ) then (yes) 
:newConfigs=image.configs();;
else (no)
:newConfigs=configsDelta.apply();;
endif 
:ClientQuotasImagenewClientQuotas;;
if (clientQuotasDelta==null ) then (yes) 
:newClientQuotas=image.clientQuotas();;
else (no)
:newClientQuotas=clientQuotasDelta.apply();;
endif 
:ProducerIdsImagenewProducerIds;;
if (producerIdsDelta==null ) then (yes) 
:newProducerIds=image.producerIds();;
else (no)
:newProducerIds=producerIdsDelta.apply();;
endif 
:AclsImagenewAcls;;
if (aclsDelta==null ) then (yes) 
:newAcls=image.acls();;
else (no)
:newAcls=aclsDelta.apply();;
endif 
:return new MetadataImage(new OffsetAndEpoch(highestOffset,
highestEpoch),newFeatures,newCluster,newTopics,
newConfigs,newClientQuotas,newProducerIds,
newAcls);;
stop
end
start
note right
StringtoString()
end note
:return "MetadataDelta("+"highestOffset="+
highestOffset+", highestEpoch="+highestEpoch+
", featuresDelta="+featuresDelta+", clusterDelta="+
clusterDelta+", topicsDelta="+topicsDelta+
", configsDelta="+configsDelta+", clientQuotasDelta="+
clientQuotasDelta+", producerIdsDelta="+producerIdsDelta+
", aclsDelta="+aclsDelta+')';;
stop
end
@enduml

