@startuml
!pragma layout smetana
start
note right
constructor TopicIdPartition(UuidtopicId,
intpartitionId)
end note
end
start
note right
UuidtopicId()
end note
:return topicId;;
stop
end
start
note right
intpartitionId()
end note
:return partitionId;;
stop
end
start
note right
booleanequals(Objecto)
end note
if (!(o instanceof TopicIdPartition)) then (yes) 
:return false;;
stop
endif 
:return other.topicId.equals(topicId)&&other.partitionId==partitionId;;
stop
end
start
note right
inthashCode()
end note
:return Objects.hash(topicId,partitionId);;
stop
end
start
note right
StringtoString()
end note
:return topicId+":"+partitionId;;
stop
end
@enduml

