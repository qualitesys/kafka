@startuml
!pragma layout smetana
start
note right
constructor BrokerHeartbeatReply(booleanisCaughtUp,
booleanisFenced,booleaninControlledShutdown,
booleanshouldShutDown)
end note
end
start
note right
booleanisCaughtUp()
end note
:return isCaughtUp;;
stop
end
start
note right
booleanisFenced()
end note
:return isFenced;;
stop
end
start
note right
booleaninControlledShutdown()
end note
:return inControlledShutdown;;
stop
end
start
note right
booleanshouldShutDown()
end note
:return shouldShutDown;;
stop
end
start
note right
inthashCode()
end note
:return Objects.hash(isCaughtUp,isFenced,
inControlledShutdown,shouldShutDown);;
stop
end
start
note right
booleanequals(Objecto)
end note
if (!(o instanceof BrokerHeartbeatReply)) then (yes) 
:return false;;
stop
endif 
:return other.isCaughtUp==isCaughtUp&&other.isFenced==isFenced&&other.inControlledShutdown==inControlledShutdown&&other.shouldShutDown==shouldShutDown;;
stop
end
start
note right
StringtoString()
end note
:return "BrokerHeartbeatReply(isCaughtUp="+
isCaughtUp+", isFenced="+isFenced+", inControlledShutdown="+
inControlledShutdown+", shouldShutDown = "+
shouldShutDown+")";;
stop
end
@enduml

