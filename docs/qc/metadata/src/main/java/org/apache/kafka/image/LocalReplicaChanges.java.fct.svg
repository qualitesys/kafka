@startuml
!pragma layout smetana
start
note right
constructor LocalReplicaChanges(Set<TopicPartition>deletes,
Map<TopicPartition,PartitionInfo>leaders,
Map<TopicPartition,PartitionInfo>followers)
end note
end
start
note right
Set<TopicPartition>deletes()
end note
:return deletes;;
stop
end
start
note right
Map<TopicPartition,PartitionInfo>leaders()
end note
:return leaders;;
stop
end
start
note right
Map<TopicPartition,PartitionInfo>followers()
end note
:return followers;;
stop
end
start
note right
StringtoString()
end note
:return String.format("LocalReplicaChanges(deletes = %s,
 leaders = %s, followers = %s)",deletes,leaders,
followers);;
stop
end
start
note right
constructor PartitionInfo(UuidtopicId,PartitionRegistrationpartition)
end note
end
start
note right
StringtoString()
