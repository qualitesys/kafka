@startuml
!pragma layout smetana
start
note right
constructor BrokerControlState(boolean fenced,
boolean shouldShutDown)
end note
:this.fenced=fenced;;
:this.shouldShutDown=shouldShutDown;;
end
start
note right
boolean fenced()
end note
:return fenced;;
stop
end
start
note right
boolean shouldShutDown()
end note
:return shouldShutDown;;
stop
end
start
note right
boolean inControlledShutdown()
end note
:return this==CONTROLLED_SHUTDOWN;;
stop
end
@enduml

