@startuml
!pragma layout smetana
start
note right
constructor BrokerControlState(booleanfenced,
booleanshouldShutDown)
end note
end
start
note right
booleanfenced()
end note
:return fenced;;
stop
end
start
note right
booleanshouldShutDown()
end note
:return shouldShutDown;;
stop
end
start
note right
booleaninControlledShutdown()
end note
:return this==CONTROLLED_SHUTDOWN;;
stop
end
@enduml

