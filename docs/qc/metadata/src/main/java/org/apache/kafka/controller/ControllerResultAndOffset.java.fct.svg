@startuml
!pragma layout smetana
start
note right
constructor ControllerResultAndOffset(long offset,
ControllerResult<T> result)
end note
:super (result.records(),result.response(),
result.isAtomic());;
:this.offset=offset;;
end
start
note right
long offset()
end note
:return offset;;
stop
end
start
note right
boolean equals(Object o)
end note
if (o==null ||(!o.getClass().equals(getClass()))) then (yes) 
:return false;;
stop
endif 
:ControllerResultAndOffset other=(ControllerResultAndOffset )o;;
:return records().equals(other.records())&&response()
.equals(other.response())&&isAtomic()==other.isAtomic()&&offset==other.offset;;
stop
end
start
note right
int hashCode()
end note
:return Objects.hash(records(),response(),
isAtomic(),offset);;
stop
end
start
note right
String toString()
end note
:return String.format("ControllerResultAndOffset(records=%s,
 response=%s, isAtomic=%s, offset=%s)",String.join(",
",records().stream().map(ApiMessageAndVersion::toString).collect(Collectors.toList())),
response(),isAtomic(),offset);;
stop
end
:return new ControllerResultAndOffset<>(offset,
result);;
stop
@enduml

