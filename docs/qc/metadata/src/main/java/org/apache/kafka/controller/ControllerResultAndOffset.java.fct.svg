6,293,1043.3086" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="293" x2="293" y1="1159.2461" y2="1179.2461"/><polygon fill="#181818" points="289,1169.2461,293,1179.2461,297,1169.2461,293,1173.2461" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[23b0dfdcb6614745328ce3db8937786a]
@startuml
!pragma layout smetana
start
note right
constructor ControllerResultAndOffset(longoffset,
ControllerResult<T>result)
end note
:super (result.records(),result.response(),
result.isAtomic());
:this.offset=offset;
end
start
note right
longoffset()
end note
:return offset;;
stop
end
start
note right
booleanequals(Objecto)
end note
if (o==null ||(!o.getClass().equals(getClass()))) then (yes) 
:return false;;
stop
endif 
:return records().equals(other.records())&&response()
.equals(other.response())&&isAtomic()==other.isAtomic()&&offset==other.offset;;
stop
end
start
note right
inthashCode()
end note
:return Objects.hash(records(),response(),
isAtomic(),offset);;
stop
end
start
note right
StringtoString()
end note
:return String.format("ControllerResultAndOffset(records=%s,
 response=%s, isAtomic=%s, offset=%s)",String.join(",
",records().stream().map(ApiMessageAndVersion::toString).collect(Collectors.toList())),
response(),isAtomic(),offset);;
stop
end
:return new ControllerResultAndOffset<>(offset,
result);;
stop
@enduml

