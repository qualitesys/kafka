@startuml
!pragma layout smetana
start
note right
constructor FeaturesDelta(FeaturesImageimage)
end note
:this.image=image;
end
start
note right
Map<String,Optional<Short>>changes()
end note
:return changes;;
stop
end
start
note right
Optional<MetadataVersion>metadataVersionChange()
end note
:return Optional.ofNullable(metadataVersionChange);;
stop
end
start
note right
void finishSnapshot()
end note
if (!changes.containsKey(featureName)) then (yes) 
:changes.put(featureName,Optional.empty());
endif 
end
start
note right
void replay(FeatureLevelRecordrecord)
end note
if (record.name().equals(MetadataVersion.FEATURE_NAME)) then (yes) 
:metadataVersionChange=MetadataVersion.fromFeatureLevel(record.featureLevel());
else (no)
if (record.featureLevel()==0) then (yes) 
:changes.put(record.name(),Optional.empty());
else (no)
:changes.put(record.name(),Optional.of(record.featureLevel()));
endif 
endif 
end
start
note right
FeaturesImageapply()
end note
if (change==null ) then (yes) 
:newFinalizedVersions.put(name,entry.getValue());
endif 
if (!newFinalizedVersions.containsKey(name)) then (yes) 
if (change.isPresent()) then (yes) 
:newFinalizedVersions.put(name,change.get());
endif 
endif 
if (metadataVersionChange==null ) then (yes) 
:metadataVersion=image.metadataVersion();
else (no)
:metadataVersion=metadataVersionChange;
endif 
:return new FeaturesImage(newFinalizedVersions,
metadataVersion);;
stop
end
start
note right
StringtoString()
end note
:return "FeaturesDelta("+"changes="+changes+
", metadataVersionChange="+metadataVersionChange+
')';;
stop
end
@enduml

