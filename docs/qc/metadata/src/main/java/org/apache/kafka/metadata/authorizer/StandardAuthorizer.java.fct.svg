@startuml
!pragma layout smetana
start
note right
void setAclMutator(AclMutatoraclMutator)
end note
:this.data=data.copyWithNewAclMutator(aclMutator);
end
start
note right
AclMutatoraclMutatorOrException()
end note
if (aclMutator==null ) then (yes) 
:throw new NotControllerException("The current node is not the active controller.");;
endif 
:return aclMutator;;
stop
end
start
note right
void completeInitialLoad()
end note
:data=data.copyWithNewLoadingComplete(true);
:data.log.info("Completed initial ACL load process.");
:initialLoadFuture.complete(null );
end
start
note right
CompletableFuture<Void>initialLoadFuture()
end note
:return initialLoadFuture;;
stop
end
start
note right
void completeInitialLoad(Exceptione)
end note
:data.log.error("Failed to complete initial ACL load process.",e);
:initialLoadFuture.completeExceptionally(e);
end
start
note right
void addAcl(Uuidid,StandardAclacl)
end note
:data.addAcl(id,acl);
end
start
note right
void removeAcl(Uuidid)
end note
:data.removeAcl(id);
end
start
note right
void loadSnapshot(Map<Uuid,StandardAcl>acls)
end note
:data=data.copyWithNewAcls(acls.entrySet());
end
start
note right
Map<Endpoint,?  extends CompletionStage<Void>>start(AuthorizerServerInfoserverInfo)
end note
if (serverInfo.earlyStartListeners().contains(endpoint.listenerName()
.orElseGet(()->""))) then (yes) 
:result.put(endpoint,CompletableFuture.completedFuture(null ));
else (no)
:result.put(endpoint,initialLoadFuture);
endif 
:return result;;
stop
end
start
note right
List<AuthorizationResult>authorize(AuthorizableRequestContextrequestContext,
List<Action>actions)
end note
:results.add(result);
:return results;;
stop
end
start
note right
Iterable<AclBinding>acls(AclBindingFilterfilter)
end note
:return data.acls(filter);;
stop
end
start
note right
intaclCount()
end note
:return data.aclCount();;
stop
end
start
note right
void close()
end note
:initialLoadFuture.completeExceptionally(new TimeoutException("The authorizer was "+
"closed before the initial load could complete."));
end
start
note right
void configure(Map<String,? >configs)
end note
:nodeId=Integer.parseInt(configs.get("node.id")
.toString());
:nodeId=-1;
:this.data=data.copyWithNewConfig(nodeId,
superUsers,defaultResult);
:this.data.log.info("set super.users={}, default result={}",
String.join(",",superUsers),defaultResult);
end
start
note right
Set<String>superUsers()
end note
:return new HashSet<>(data.superUsers());;
stop
end
start
note right
AuthorizationResultdefaultResult()
end note
:return data.defaultResult();;
stop
end
start
note right
Set<String>getConfiguredSuperUsers(Map<String,
? >configs)
end note
if (configValue==null ) then (yes) 
:return Collections.emptySet();;
stop
endif 
if (!v.isEmpty()) then (yes) 
:SecurityUtils.parseKafkaPrincipal(v);
:result.add(v);
endif 
:return result;;
stop
end
start
note right
AuthorizationResultgetDefaultResult(Map<String,
? >configs)
end note
if (configValue==null ) then (yes) 
:return DENIED;;
stop
endif 
:return Boolean.valueOf(configValue.toString())? ALLOWED:DENIED;;
stop
end
@enduml

