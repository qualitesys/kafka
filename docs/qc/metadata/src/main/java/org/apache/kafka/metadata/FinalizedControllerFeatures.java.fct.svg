@startuml
!pragma layout smetana
start
note right
constructor FinalizedControllerFeatures(Map<String,Short>featureMap,longepoch)
end note
:this.featureMap=Collections.unmodifiableMap(featureMap);
:this.epoch=epoch;
end
start
note right
Optional<Short>get(Stringname)
end note
:return Optional.ofNullable(featureMap.get(name));;
stop
end
start
note right
Set<String>featureNames()
end note
:return featureMap.keySet();;
stop
end
start
note right
longepoch()
end note
:return epoch;;
stop
end
start
note right
inthashCode()
end note
:return Objects.hash(featureMap,epoch);;
stop
end
start
note right
booleanequals(Objecto)
end note
if (!(o instanceof FinalizedControllerFeatures)) then (yes) 
:return false;;
stop
endif 
:return featureMap.equals(other.featureMap)&&epoch==other.epoch;;
stop
end
start
note right
StringtoString()
end note
:bld.append("{");
:bld.append("featureMap=").append(featureMap.toString());
:bld.append(", epoch=").append(epoch);
:bld.append("}");
:return bld.toString();;
stop
end
@enduml

