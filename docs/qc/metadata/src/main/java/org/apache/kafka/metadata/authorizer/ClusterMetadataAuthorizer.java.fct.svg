@startuml
!pragma layout smetana
:aclBindings.forEach(b->futures.add(new CompletableFuture<>()));
:aclMutator.createAcls(context,aclBindings).whenComplete((results,
throwable)->{if (throwable==null &&results.size()!=futures.size()){throwable=new UnknownServerException("Invalid size "+
"of result set from controller. Expected "+
futures.size()+"; got "+results.size());}if (throwable==null ){for (inti=0;i<futures.size();i+
+){futures.get(i).complete(results.get(i));}}else {for (CompletableFuture<AclCreateResult>future:futures){ApiExceptione=(throwable instanceof ApiException)? (ApiException)throwable:ApiError.fromThrowable(throwable).exception();future.complete(new AclCreateResult(e));}}});
:return futures;;
stop
:filters.forEach(b->futures.add(new CompletableFuture<>()));
:aclMutator.deleteAcls(context,filters).whenComplete((results,
throwable)->{if (throwable==null &&results.size()!=futures.size()){throwable=new UnknownServerException("Invalid size "+
"of result set from controller. Expected "+
futures.size()+"; got "+results.size());}if (throwable==null ){for (inti=0;i<futures.size();i+
+){futures.get(i).complete(results.get(i));}}else {for (CompletableFuture<AclDeleteResult>future:futures){ApiExceptione=(throwable instanceof ApiException)? (ApiException)throwable:ApiError.fromThrowable(throwable).exception();future.complete(new AclDeleteResult(e));}}});
:return futures;;
stop
@enduml

