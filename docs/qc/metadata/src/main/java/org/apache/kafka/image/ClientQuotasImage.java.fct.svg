@startuml
!pragma layout smetana
start
note right
constructor ClientQuotasImage(Map<ClientQuotaEntity,
ClientQuotaImage>entities)
end note
:this.entities=Collections.unmodifiableMap(entities);;
end
start
note right
booleanisEmpty()
end note
:return entities.isEmpty();;
stop
end
start
note right
Map<ClientQuotaEntity,ClientQuotaImage>entities()
end note
:return entities;;
stop
end
start
note right
void write(Consumer<List<ApiMessageAndVersion>>out)
end note
:ClientQuotaEntityentity=entry.getKey();;
:ClientQuotaImageclientQuotaImage=entry.getValue();;
:clientQuotaImage.write(entity,out);;
end
start
note right
DescribeClientQuotasResponseDatadescribe(DescribeClientQuotasRequestDatarequest)
end note
:DescribeClientQuotasResponseDataresponse=new DescribeClientQuotasResponseData();;
:Map<String,String>exactMatch=new HashMap<>();;
:Set<String>typeMatch=new HashSet<>();;
if (component.entityType().isEmpty()) then (yes) 
:throw new InvalidRequestException("Invalid empty entity type.");;
stop
else if (exactMatch.containsKey(component.entityType())||typeMatch.contains(component.entityType())) then (yes) 
:throw new InvalidRequestException("Entity type "+
component.entityType()+" cannot appear more than once in the filter.");;
stop
endif 
if (!(component.entityType().equals(IP)||component.entityType().equals(USER)||component.entityType().equals(CLIENT_ID))) then (yes) 
:throw new UnsupportedVersionException("Unsupported entity type "+
component.entityType());;
stop
endif 
switch (switch (component.matchType()))
endswith
if (exactMatch.containsKey(IP)||typeMatch.contains(IP)) then (yes) 
if ((exactMatch.containsKey(USER)||typeMatch.contains(USER))||(exactMatch.containsKey(CLIENT_ID)||typeMatch.contains(CLIENT_ID))) then (yes) 
:throw new InvalidRequestException("Invalid entity filter component "+
"combination. IP filter component should not be used with "+
"user or clientId filter component.");;
stop
endif 
endif 
:ClientQuotaEntityentity=entry.getKey();;
:ClientQuotaImagequotaImage=entry.getValue();;
if (matches(entity,exactMatch,typeMatch,request.strict())) then (yes) 
:response.entries().add(toDescribeEntry(entity,
quotaImage));;
endif 
:return response;;
stop
end
start
note right
booleanmatches(ClientQuotaEntityentity,Map<String,
String>exactMatch,Set<String>typeMatch,booleanstrict)
end note
if (strict) then (yes) 
if (entity.entries().size()!=exactMatch.size()+
typeMatch.size()) then (yes) 
:return false;;
stop
endif 
endif 
if (!entity.entries().containsKey(entry.getKey())) then (yes) 
:return false;;
stop
endif 
if (!Objects.equals(entity.entries().get(entry.getKey()),
entry.getValue())) then (yes) 
:return false;;
stop
endif 
if (!entity.entries().containsKey(type)) then (yes) 
:return false;;
stop
endif 
:return true;;
stop
end
start
note right
EntryDatatoDescribeEntry(ClientQuotaEntityentity,
ClientQuotaImagequotaImage)
end note
:EntryDatadata=new EntryData();;
:data.entity().add(new EntityData().setEntityType(entry.getKey())
.setEntityName(entry.getValue()));;
:data.setValues(quotaImage.toDescribeValues());;
:return data;;
stop
end
start
note right
booleanequals(Objecto)
end note
if (!(o instanceof ClientQuotasImage)) then (yes) 
:return false;;
stop
endif 
:ClientQuotasImageother=(ClientQuotasImage)o;;
:return entities.equals(other.entities);;
stop
end
start
note right
inthashCode()
end note
:return Objects.hash(entities);;
stop
end
start
note right
StringtoString()
end note
:return "ClientQuotasImage(entities="+entities.entrySet().stream().map(e->e.getKey()+
":"+e.getValue()).collect(Collectors.joining(", "))+
")";;
stop
end
@enduml

