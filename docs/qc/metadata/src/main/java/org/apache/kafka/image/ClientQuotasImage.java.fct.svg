th="78" x="5" y="567.4688">note right</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="698" x="5" y="583.7656">DescribeClientQuotasResponseDatadescribe(DescribeClientQuotasRequestDatarequest)</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="71" x="5" y="600.0625">end note</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="381" x="5" y="616.3594">if (component.entityType().isEmpty()) then (yes)</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="526" x="5" y="632.6563">:throw new InvalidRequestException("Invalid empty entity type.");;</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="40" x="5" y="648.9531">endif</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="506" x="5" y="665.25">if (!(component.entityType().equals(IP)||component.entityType()</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" text-decoration="wavy underline" textLength="552" x="5" y="681.5469">.equals(USER)||component.entityType().equals(CLIENT_ID))) then (yes)</text><text fill="#FF0000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="106" x="10" y="697.8438">Syntax Error?</text><!--MD5=[20988ce3b6e45b36c3c92a5ce995f2b1]
@startuml
!pragma layout smetana
start
note right
constructor ClientQuotasImage(Map<ClientQuotaEntity,
ClientQuotaImage>entities)
end note
:this.entities=Collections.unmodifiableMap(entities);
end
start
note right
booleanisEmpty()
end note
:return entities.isEmpty();;
stop
end
start
note right
Map<ClientQuotaEntity,ClientQuotaImage>entities()
end note
:return entities;;
stop
end
start
note right
void write(Consumer<List<ApiMessageAndVersion>>out)
end note
:clientQuotaImage.write(entity,out);
end
start
note right
DescribeClientQuotasResponseDatadescribe(DescribeClientQuotasRequestDatarequest)
end note
if (component.entityType().isEmpty()) then (yes) 
:throw new InvalidRequestException("Invalid empty entity type.");;
endif 
if (!(component.entityType().equals(IP)||component.entityType()
.equals(USER)||component.entityType().equals(CLIENT_ID))) then (yes) 
:throw new UnsupportedVersionException("Unsupported entity type "+
component.entityType());;
endif 
if (component.match()==null ) then (yes) 
:throw new InvalidRequestException("Request specified "+
"MATCH_TYPE_EXACT, but set match string to null.");;
endif 
:exactMatch.put(component.entityType(),component.match());
if (component.match()!=null ) then (yes) 
:throw new InvalidRequestException("Request specified "+
"MATCH_TYPE_DEFAULT, but also specified a match string.");;
endif 
:exactMatch.put(component.entityType(),null );
if (component.match()!=null ) then (yes) 
:throw new InvalidRequestException("Request specified "+
"MATCH_TYPE_SPECIFIED, but also specified a match string.");;
endif 
:typeMatch.add(component.entityType());
:throw new InvalidRequestException("Unknown match type "+
component.matchType());;
if (exactMatch.containsKey(IP)||typeMatch.contains(IP)) then (yes) 
if ((exactMatch.containsKey(USER)||typeMatch.contains(USER))||(exactMatch.containsKey(CLIENT_ID)||typeMatch.contains(CLIENT_ID))) then (yes) 
:throw new InvalidRequestException("Invalid entity filter component "+
"combination. IP filter component should not be used with "+
"user or clientId filter component.");;
endif 
endif 
if (matches(entity,exactMatch,typeMatch,request.strict())) then (yes) 
:response.entries().add(toDescribeEntry(entity,
quotaImage));
endif 
:return response;;
stop
end
start
note right
booleanmatches(ClientQuotaEntityentity,Map<String,
String>exactMatch,Set<String>typeMatch,booleanstrict)
end note
if (strict) then (yes) 
if (entity.entries().size()!=exactMatch.size()+
typeMatch.size()) then (yes) 
:return false;;
stop
endif 
endif 
if (!entity.entries().containsKey(entry.getKey())) then (yes) 
:return false;;
stop
endif 
if (!Objects.equals(entity.entries().get(entry.getKey()),
entry.getValue())) then (yes) 
:return false;;
stop
endif 
if (!entity.entries().containsKey(type)) then (yes) 
:return false;;
stop
endif 
:return true;;
stop
end
start
note right
EntryDatatoDescribeEntry(ClientQuotaEntityentity,
ClientQuotaImagequotaImage)
end note
:data.entity().add(new EntityData().setEntityType(entry.getKey())
.setEntityName(entry.getValue()));
:data.setValues(quotaImage.toDescribeValues());
:return data;;
stop
end
start
note right
booleanequals(Objecto)
end note
if (!(o instanceof ClientQuotasImage)) then (yes) 
:return false;;
stop
endif 
:return entities.equals(other.entities);;
stop
end
start
note right
inthashCode()
end note
:return Objects.hash(entities);;
stop
end
start
note right
StringtoString()
end note
:return "ClientQuotasImage(entities="+entities.entrySet().stream().map(e->e.getKey()+
":"+e.getValue()).collect(Collectors.joining(", "))+
")";;
stop
end
@enduml

