end note
:Map<String,String>validatedEntityMap=new HashMap<>(3);;
:ApiErrorerror=validateEntity(entity,validatedEntityMap);;
if (error.isFailure()) then (yes) 
:outputResults.put(entity,error);;
:return ;;
stop
