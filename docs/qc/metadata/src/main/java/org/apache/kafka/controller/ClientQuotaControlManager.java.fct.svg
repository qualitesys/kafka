start
note right
ApiErrorconfigKeysForEntityType(Map<String,
String>entity,Map<String,ConfigDef.ConfigKey>output)
end note
:booleanhasUser=entity.containsKey(ClientQuotaEntity.USER);;
:booleanhasClientId=entity.containsKey(ClientQuotaEntity.CLIENT_ID);;
:booleanhasIp=entity.containsKey(ClientQuotaEntity.IP);;
:final Map<String,ConfigDef.ConfigKey>configKeys;;
if (hasIp) then (yes) 
if (hasUser||hasClientId) then (yes) 
:return new ApiError(Errors.INVALID_REQUEST,"Invalid quota entity combination, IP entity should"+
"not be combined with User or ClientId");;
stop
else (no)
if (isValidIpEntity(entity.get(ClientQuotaEntity.IP))) then (yes) 
:configKeys=QuotaConfigs.ipConfigs().configKeys();;
else (no)
:return new ApiError(Errors.INVALID_REQUEST,entity.get(ClientQuotaEntity.IP)+
" is not a valid IP or resolvable host.");;
stop
endif 
endif 
else if (hasUser&&hasClientId) then (yes) 
:configKeys=QuotaConfigs.userConfigs().configKeys();;
else if (hasUser) then (yes) 
:configKeys=QuotaConfigs.userConfigs().configKeys();;
else if (hasClientId) then (yes) 
:configKeys=QuotaConfigs.clientConfigs().configKeys();;
else (no)
:return new ApiError(Errors.INVALID_REQUEST,
"Invalid empty client quota entity");;
stop
endif 
:output.putAll(configKeys);;
:return ApiError.NONE;;
stop
end
start
note right
ApiErrorvalidateQuotaKeyValue(Map<String,
ConfigDef.ConfigKey>validKeys,Stringkey,Doublevalue)
end note
:ConfigDef.ConfigKeyconfigKey=validKeys.get(key);;
if (configKey==null ) then (yes) 
:return new ApiError(Errors.INVALID_REQUEST,"Invalid configuration key "+
key);;
stop
endif 
switch (switch (configKey.type()))
endswith
:return ApiError.NONE;;
stop
end
start
note right
booleanisValidIpEntity(Stringip)
end note
if (Objects.nonNull(ip)) then (yes) 
:try ;
:InetAddress.getByName(ip);;
:return true;;
stop
:catch (UnknownHostExceptione);
:return false;;
stop
else (no)
:return true;;
stop
endif 
end
start
note right
ApiErrorvalidateEntity(ClientQuotaEntityentity,
Map<String,String>validatedEntityMap)
end note
if (entity.entries().isEmpty()) then (yes) 
:return new ApiError(Errors.INVALID_REQUEST,
"Invalid empty client quota entity");;
stop
endif 
:StringentityType=entityEntry.getKey();;
:StringentityName=entityEntry.getValue();;
if (validatedEntityMap.containsKey(entityType)) then (yes) 
:return new ApiError(Errors.INVALID_REQUEST,"Invalid client quota entity, duplicate entity entry "+
entityType);;
stop
endif 
if (Objects.equals(entityType,ClientQuotaEntity.USER)) then (yes) 
:validatedEntityMap.put(ClientQuotaEntity.USER,
entityName);;
else if (Objects.equals(entityType,ClientQuotaEntity.CLIENT_ID)) then (yes) 
:validatedEntityMap.put(ClientQuotaEntity.CLIENT_ID,
entityName);;
else if (Objects.equals(entityType,ClientQuotaEntity.IP)) then (yes) 
:validatedEntityMap.put(ClientQuotaEntity.IP,
entityName);;
else (no)
:return new ApiError(Errors.INVALID_REQUEST,"Unhandled client quota entity type: "+
entityType);;
stop
endif 
if (entityName!=null &&entityName.isEmpty()) then (yes) 
:return new ApiError(Errors.INVALID_REQUEST,"Empty "+
entityType+" not supported");;
stop
endif 
:return ApiError.NONE;;
stop
end
