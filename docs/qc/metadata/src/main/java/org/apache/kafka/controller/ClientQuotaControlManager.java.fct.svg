note right
constructor ClientQuotaControlIterator(longepoch)
end note
:this.epoch=epoch;;
:this.iterator=clientQuotaData.entrySet(epoch)
.iterator();;
end
start
note right
booleanhasNext()
end note
:return iterator.hasNext();;
stop
end
start
note right
List<ApiMessageAndVersion>next()
end note
if (!hasNext()) then (yes) 
:throw new NoSuchElementException();;
stop
endif 
:Entry<ClientQuotaEntity,TimelineHashMap<String,
Double>>entry=iterator.next();;
:ClientQuotaEntityentity=entry.getKey();;
:List<ApiMessageAndVersion>records=new ArrayList<>();;
:ClientQuotaRecordrecord=new ClientQuotaRecord();;
:record.entity().add(new EntityData().setEntityType(entityEntry.getKey())
.setEntityName(entityEntry.getValue()));;
:record.setKey(quotaEntry.getKey());;
:record.setValue(quotaEntry.getValue());;
:record.setRemove(false);;
:records.add(new ApiMessageAndVersion(record,
CLIENT_QUOTA_RECORD.highestSupportedVersion()));;
:return records;;
stop
end
start
note right
ClientQuotaControlIteratoriterator(longepoch)
