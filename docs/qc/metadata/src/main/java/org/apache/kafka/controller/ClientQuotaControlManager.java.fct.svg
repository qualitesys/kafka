:Map<String,ConfigDef.ConfigKey>configKeys=new HashMap<>(4);;
:error=configKeysForEntityType(validatedEntityMap,
configKeys);;
if (error.isFailure()) then (yes) 
:outputResults.put(entity,error);;
:return ;;
stop
endif 
:Supplier<List<EntityData>>recordEntitySupplier=()->validatedEntityMap.entrySet()
.stream().map(mapEntry->new EntityData().setEntityType(mapEntry.getKey()).setEntityName(mapEntry.getValue())).collect(Collectors.toList());;
:List<ApiMessageAndVersion>newRecords=new ArrayList<>(newQuotaConfigs.size());;
:Map<String,Double>currentQuotas=clientQuotaData.containsKey(entity)? clientQuotaData.get(entity):Collections.emptyMap();;
:Stringkey=entry.getKey();;
:DoublenewValue=entry.getValue();;
if (newValue==null ) then (yes) 
if (currentQuotas.containsKey(key)) then (yes) 
:newRecords.add(new ApiMessageAndVersion(new ClientQuotaRecord().setEntity(recordEntitySupplier.get()).setKey(key).setRemove(true),
CLIENT_QUOTA_RECORD.highestSupportedVersion()));;
endif 
else (no)
:ApiErrorvalidationError=validateQuotaKeyValue(configKeys,
key,newValue);;
if (validationError.isFailure()) then (yes) 
