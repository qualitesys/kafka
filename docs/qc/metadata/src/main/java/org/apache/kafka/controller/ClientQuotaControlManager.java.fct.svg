:newRecords.add(new ApiMessageAndVersion(new ClientQuotaRecord().setEntity(recordEntitySupplier.get()).setKey(key).setValue(newValue),
CLIENT_QUOTA_RECORD.highestSupportedVersion()));;
endif 
endif 
endif 
:outputRecords.addAll(newRecords);;
:outputResults.put(entity,ApiError.NONE);;
