@startuml
!pragma layout smetana
start
note right
constructor ClientQuotaControlManager(SnapshotRegistrysnapshotRegistry)
end note
:this.snapshotRegistry=snapshotRegistry;;
:this.clientQuotaData=new TimelineHashMap<>(snapshotRegistry,0);;
end
start
note right
ControllerResult<Map<ClientQuotaEntity,ApiError>>alterClientQuotas(Collection<ClientQuotaAlteration>quotaAlterations)
end note
:List<ApiMessageAndVersion>outputRecords=new ArrayList<>();;
:Map<ClientQuotaEntity,ApiError>outputResults=new HashMap<>();;
:quotaAlterations.forEach(quotaAlteration->{Map<String,
Double>alterations=new HashMap<>(quotaAlteration.ops().size());quotaAlteration.ops().forEach(op->{if (alterations.containsKey(op.key())){outputResults.put(quotaAlteration.entity(),
ApiError.fromThrowable(new InvalidRequestException("Duplicate quota key "+
op.key()+" not updating quota for this entity "+
quotaAlteration.entity())));}else {alterations.put(op.key(),
op.value());}});if (outputResults.containsKey(quotaAlteration.entity())){outputResults.put(quotaAlteration.entity(),ApiError.fromThrowable(new InvalidRequestException("Ignoring duplicate entity "+
quotaAlteration.entity())));}else {alterClientQuotaEntity(quotaAlteration.entity(),
alterations,outputRecords,outputResults);}});;
:return ControllerResult.atomicOf(outputRecords,
outputResults);;
stop
end
start
note right
void replay(ClientQuotaRecordrecord)
end note
:Map<String,String>entityMap=new HashMap<>(2);;
:record.entity().forEach(entityData->entityMap.put(entityData.entityType(),
entityData.entityName()));;
:ClientQuotaEntityentity=new ClientQuotaEntity(entityMap);;
:TimelineHashMap<String,Double>quotas=clientQuotaData.get(entity);;
if (quotas==null ) then (yes) 
:quotas=new TimelineHashMap<>(snapshotRegistry,0);;
:clientQuotaData.put(entity,quotas);;
endif 
if (record.remove()) then (yes) 
:quotas.remove(record.key());;
if (quotas.size()==0) then (yes) 
:clientQuotaData.remove(entity);;
endif 
else (no)
:quotas.put(record.key(),record.value());;
endif 
end
start
note right
