@startuml
!pragma layout smetana
start
note right
constructor TopicImage(Stringname,Uuidid,
Map<Integer,PartitionRegistration>partitions)
end note
end
start
note right
Stringname()
end note
:return name;;
stop
end
start
note right
Uuidid()
end note
:return id;;
stop
end
start
note right
Map<Integer,PartitionRegistration>partitions()
end note
:return partitions;;
stop
end
start
note right
void write(Consumer<List<ApiMessageAndVersion>>out)
end note
end
start
note right
booleanequals(Objecto)
end note
if (!(o instanceof TopicImage)) then (yes) 
:return false;;
stop
endif 
:return name.equals(other.name)&&id.equals(other.id)&&partitions.equals(other.partitions);;
stop
end
start
note right
inthashCode()
end note
:return Objects.hash(name,id,partitions);;
stop
end
