@startuml
!pragma layout smetana
start
note right
constructor ProducerIdControlManager(ClusterControlManagerclusterControlManager,SnapshotRegistrysnapshotRegistry)
end note
:this.clusterControlManager=clusterControlManager;
:this.nextProducerBlock=new TimelineObject<>(snapshotRegistry,ProducerIdsBlock.EMPTY);
:this.brokerEpoch=new TimelineLong(snapshotRegistry);
end
start
note right
ControllerResult<ProducerIdsBlock>generateNextProducerId(intbrokerId,longbrokerEpoch)
end note
:clusterControlManager.checkBrokerEpoch(brokerId,brokerEpoch);
if (firstProducerIdInBlock>Long.MAX_VALUE-ProducerIdsBlock.PRODUCER_ID_BLOCK_SIZE) then (yes) 
endif 
:return ControllerResult.of(Collections.singletonList(new ApiMessageAndVersion(record,(short)0)),block);;
stop
end
start
note right
void replay(ProducerIdsRecordrecord)
end note
if (record.nextProducerId()<=currentNextProducerId) then (yes) 
else (no)
:nextProducerBlock.set(new ProducerIdsBlock(record.brokerId(),record.nextProducerId(),ProducerIdsBlock.PRODUCER_ID_BLOCK_SIZE));
:brokerEpoch.set(record.brokerEpoch());
endif 
end
start
note right
Iterator<List<ApiMessageAndVersion>>iterator(longepoch)
end note
if (producerIdBlock.firstProducerId()>0) then (yes) 
:records.add(new ApiMessageAndVersion(new ProducerIdsRecord().setNextProducerId(producerIdBlock.firstProducerId()).setBrokerId(producerIdBlock.assignedBrokerId()).setBrokerEpoch(brokerEpoch.get(epoch)),(short)0));
endif 
:return Collections.singleton(records).iterator();;
stop
end
@enduml

