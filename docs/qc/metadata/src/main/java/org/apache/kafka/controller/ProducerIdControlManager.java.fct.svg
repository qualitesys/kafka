16" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[46b3ee013801f3e39d2a1219be7777bb]
@startuml
!pragma layout smetana
start
note right
constructor ProducerIdControlManager(ClusterControlManagerclusterControlManager,
SnapshotRegistrysnapshotRegistry)
end note
end
start
note right
ControllerResult<ProducerIdsBlock>generateNextProducerId(intbrokerId,
longbrokerEpoch)
end note
if (firstProducerIdInBlock>Long.MAX_VALUE-ProducerIdsBlock.PRODUCER_ID_BLOCK_SIZE) then (yes) 
:throw new UnknownServerException("Exhausted all producerIds as the next block's end producerId "+
"has exceeded the int64 type limit");;
endif 
:return ControllerResult.of(Collections.singletonList(new ApiMessageAndVersion(record,
(short)0)),block);;
stop
end
start
note right
void replay(ProducerIdsRecordrecord)
end note
if (record.nextProducerId()<=currentNextProducerId) then (yes) 
:throw new RuntimeException("Next Producer ID from replayed record ("+
record.nextProducerId()+")"+" is not greater than current next Producer ID ("+
currentNextProducerId+")");;
else (no)
endif 
end
start
note right
Iterator<List<ApiMessageAndVersion>>iterator(longepoch)
end note
if (producerIdBlock.firstProducerId()>0) then (yes) 
endif 
:return Collections.singleton(records).iterator();;
stop
end
@enduml

