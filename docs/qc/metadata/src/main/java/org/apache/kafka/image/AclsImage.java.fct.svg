72a1f2222a8ee31]
@startuml
!pragma layout smetana
start
note right
constructor AclsImage(Map<Uuid,StandardAcl>acls)
end note
:this.acls=Collections.unmodifiableMap(acls);
end
start
note right
booleanisEmpty()
end note
:return acls.isEmpty();;
stop
end
start
note right
Map<Uuid,StandardAcl>acls()
end note
:return acls;;
stop
end
start
note right
void write(Consumer<List<ApiMessageAndVersion>>out)
end note
:batch.add(new ApiMessageAndVersion(aclWithId.toRecord(),
(short)0));
:out.accept(batch);
end
start
note right
inthashCode()
end note
:return acls.hashCode();;
stop
end
start
note right
booleanequals(Objecto)
end note
if (!(o instanceof AclsImage)) then (yes) 
:return false;;
stop
endif 
:return acls.equals(other.acls);;
stop
end
start
note right
StringtoString()
end note
:return "AclsImage("+acls.values().stream().map(a->a.toString()).collect(Collectors.joining(", "))+")";;
stop
end
@enduml

