start
note right
Map<String,ConfigEntry>resolveEffectiveTopicConfigs(Map<String,
?  extends Object>staticNodeConfig,Map<String,
?  extends Object>dynamicClusterConfigs,Map<String,
?  extends Object>dynamicNodeConfigs,Map<String,
?  extends Object>dynamicTopicConfigs)
end note
:ConfigDefconfigDef=configDefs.getOrDefault(ConfigResource.Type.TOPIC,
EMPTY_CONFIG_DEF);;
:HashMap<String,ConfigEntry>effectiveConfigs=new HashMap<>();;
:ConfigEntryentry=resolveEffectiveTopicConfig(configKey,
staticNodeConfig,dynamicClusterConfigs,dynamicNodeConfigs,
dynamicTopicConfigs);;
:effectiveConfigs.put(entry.name(),entry);;
:return effectiveConfigs;;
stop
end
start
note right
ConfigEntryresolveEffectiveTopicConfig(ConfigDef.ConfigKeyconfigKey,
Map<String,?  extends Object>staticNodeConfig,
Map<String,?  extends Object>dynamicClusterConfigs,
Map<String,?  extends Object>dynamicNodeConfigs,
Map<String,?  extends Object>dynamicTopicConfigs)
end note
if (dynamicTopicConfigs.containsKey(configKey.name)) then (yes) 
:return toConfigEntry(configKey,dynamicTopicConfigs.get(configKey.name),
ConfigSource.DYNAMIC_TOPIC_CONFIG,Function.identity());;
stop
endif 
:List<ConfigSynonym>synonyms=logConfigSynonyms.getOrDefault(configKey.name,
emptyList());;
if (dynamicNodeConfigs.containsKey(synonym.name())) then (yes) 
:return toConfigEntry(configKey,dynamicNodeConfigs.get(synonym.name()),
ConfigSource.DYNAMIC_BROKER_CONFIG,synonym.converter());;
stop
endif 
if (dynamicClusterConfigs.containsKey(synonym.name())) then (yes) 
:return toConfigEntry(configKey,dynamicClusterConfigs.get(synonym.name()),
ConfigSource.DYNAMIC_DEFAULT_BROKER_CONFIG,
synonym.converter());;
stop
endif 
if (staticNodeConfig.containsKey(synonym.name())) then (yes) 
:return toConfigEntry(configKey,staticNodeConfig.get(synonym.name()),
ConfigSource.STATIC_BROKER_CONFIG,synonym.converter());;
stop
endif 
:return toConfigEntry(configKey,configKey.hasDefault()? configKey.defaultValue:null ,
ConfigSource.DEFAULT_CONFIG,Function.identity());;
stop
end
start
note right
ConfigEntrytoConfigEntry(ConfigDef.ConfigKeyconfigKey,
Objectvalue,ConfigSourcesource,Function<String,
String>converter)
end note
:StringstringValue=null ;;
if (value!=null ) then (yes) 
if (value instanceof String) then (yes) 
:stringValue=(String)value;;
else if (value instanceof Password) then (yes) 
:stringValue=((Password)value).value();;
else (no)
:try ;
:stringValue=ConfigDef.convertToString(value,
configKey.type);;
:catch (Exceptione);
:throw new RuntimeException("Unable to convert "+
configKey.name+" to string.",e);;
stop
endif 
endif 
if (stringValue!=null ) then (yes) 
:stringValue=converter.apply(stringValue);;
endif 
:return new ConfigEntry(configKey.name,stringValue,
source,configKey.type().isSensitive(),false,
emptyList(),translateConfigType(configKey.type()),
configKey.documentation);;
stop
end
