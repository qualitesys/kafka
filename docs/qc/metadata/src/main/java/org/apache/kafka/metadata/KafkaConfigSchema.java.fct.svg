@startuml
!pragma layout smetana
start
note right
ConfigEntry.ConfigTypetranslateConfigType(ConfigDef.Typetype)
end note
switch (switch (type))
endswith
end
:Map<ConfigEntry.ConfigSource,DescribeConfigsResponse.ConfigSource>map=new HashMap<>();;
:map.put(source.source(),source);;
:TRANSLATE_CONFIG_SOURCE_MAP=Collections.unmodifiableMap(map);;
start
note right
DescribeConfigsResponse.ConfigSourcetranslateConfigSource(ConfigEntry.ConfigSourceconfigSource)
end note
:DescribeConfigsResponse.ConfigSourceresult=TRANSLATE_CONFIG_SOURCE_MAP.get(configSource);;
if (result!=null ) then (yes) 
:return result;;
stop
endif 
:return DescribeConfigsResponse.ConfigSource.UNKNOWN;;
stop
end
start
note right
constructor KafkaConfigSchema(Map<ConfigResource.Type,
ConfigDef>configDefs,Map<String,List<ConfigSynonym>>logConfigSynonyms)
end note
:this.configDefs=configDefs;;
:this.logConfigSynonyms=logConfigSynonyms;;
end
start
note right
booleanisSplittable(ConfigResource.Typetype,
Stringkey)
end note
:ConfigDefconfigDef=configDefs.get(type);;
if (configDef==null ) then (yes) 
:return false;;
stop
endif 
:ConfigDef.ConfigKeyconfigKey=configDef.configKeys()
.get(key);;
if (configKey==null ) then (yes) 
:return false;;
stop
endif 
:return configKey.type==ConfigDef.Type.LIST;;
stop
end
start
note right
booleanisSensitive(ConfigRecordrecord)
end note
:ConfigResource.Typetype=ConfigResource.Type.forId(record.resourceType());;
:return isSensitive(type,record.name());;
stop
end
start
note right
booleanisSensitive(ConfigResource.Typetype,
Stringkey)
end note
:ConfigDefconfigDef=configDefs.get(type);;
if (configDef==null ) then (yes) 
:return true;;
stop
endif 
:ConfigDef.ConfigKeyconfigKey=configDef.configKeys()
.get(key);;
if (configKey==null ) then (yes) 
:return true;;
stop
endif 
:return configKey.type.isSensitive();;
stop
end
start
note right
StringgetDefault(ConfigResource.Typetype,
Stringkey)
end note
:ConfigDefconfigDef=configDefs.get(type);;
if (configDef==null ) then (yes) 
:return null ;;
stop
endif 
:ConfigDef.ConfigKeyconfigKey=configDef.configKeys()
.get(key);;
if (configKey==null ||!configKey.hasDefault()) then (yes) 
:return null ;;
stop
endif 
:return ConfigDef.convertToString(configKey.defaultValue,
configKey.type);;
