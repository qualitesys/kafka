@startuml
!pragma layout smetana
start
note right
intvalueToInt(Stringinput,intdefaultValue,Stringwhat)
end note
if (input==null ) then (yes) 
:return defaultValue;;
stop
endif 
if (trimmedInput.isEmpty()) then (yes) 
:return defaultValue;;
stop
endif 
:return Integer.parseInt(trimmedInput);;
stop
:log.error("{} failed: unable to parse '{}' as an integer.",what,trimmedInput,e);
:return defaultValue;;
stop
end
start
note right
constructor ConfigSynonym(Stringname,Function<String,String>converter)
end note
:this.name=name;
:this.converter=converter;
end
start
note right
constructor ConfigSynonym(Stringname)
end note
:this(name,Function.identity());
end
start
note right
Stringname()
end note
:return name;;
stop
end
start
note right
Function<String,String>converter()
end note
:return converter;;
stop
end
@enduml

