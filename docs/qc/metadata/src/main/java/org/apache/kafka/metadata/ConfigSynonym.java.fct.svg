@startuml
!pragma layout smetana
start
note right
int valueToInt(String input,int defaultValue,
String what)
end note
if (input==null ) then (yes) 
:return defaultValue;;
stop
endif 
:String trimmedInput=input.trim();;
if (trimmedInput.isEmpty()) then (yes) 
:return defaultValue;;
stop
endif 
switch (try/catch block)
case (try)
:return Integer.parseInt(trimmedInput);;
stop
case (catch (Exception e))
:log.error("{} failed: unable to parse '{}' as an integer.",
what,trimmedInput,e);;
:return defaultValue;;
stop
endswitch
end
start
note right
constructor ConfigSynonym(String name,Function<String,
String> converter)
end note
:this.name=name;;
:this.converter=converter;;
end
start
note right
constructor ConfigSynonym(String name)
end note
:this(name,Function.identity());;
end
start
note right
String name()
end note
:return name;;
stop
end
start
note right
Function<String,String> converter()
end note
:return converter;;
stop
end
@enduml

