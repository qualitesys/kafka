@startuml
!pragma layout smetana
start
note right
intvalueToInt(Stringinput,intdefaultValue,
Stringwhat)
end note
if (input==null ) then (yes) 
:return defaultValue;;
stop
endif 
:StringtrimmedInput=input.trim();;
if (trimmedInput.isEmpty()) then (yes) 
:return defaultValue;;
stop
endif 
:try ;
:return Integer.parseInt(trimmedInput);;
stop
:catch (Exceptione);
:log.error("{} failed: unable to parse '{}' as an integer.",
what,trimmedInput,e);;
:return defaultValue;;
stop
end
start
note right
constructor ConfigSynonym(Stringname,Function<String,
String>converter)
end note
:this.name=name;;
