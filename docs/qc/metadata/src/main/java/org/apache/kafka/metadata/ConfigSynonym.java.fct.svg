,399,1045.5156" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="399" x2="399" y1="1085.4844" y2="1105.4844"/><polygon fill="#181818" points="395,1095.4844,399,1105.4844,403,1095.4844,399,1099.4844" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[d924613e01b663fbd67c5da224960521]
@startuml
!pragma layout smetana
start
note right
intvalueToInt(Stringinput,intdefaultValue,
Stringwhat)
end note
if (input==null ) then (yes) 
:return defaultValue;;
stop
endif 
if (trimmedInput.isEmpty()) then (yes) 
:return defaultValue;;
stop
endif 
:try {return Integer.parseInt(trimmedInput);}catch (Exceptione){log.error("{} failed: unable to parse '{}' as an integer.",
what,trimmedInput,e);return defaultValue;};
end
start
note right
constructor ConfigSynonym(Stringname,Function<String,
String>converter)
end note
:this.name=name;;
:this.converter=converter;;
end
start
note right
constructor ConfigSynonym(Stringname)
end note
:this(name,Function.identity());;
end
start
note right
Stringname()
end note
:return name;;
stop
end
start
note right
Function<String,String>converter()
end note
:return converter;;
stop
end
@enduml

