@startuml
!pragma layout smetana
start
note right
constructor SnapshotFileWriter(FileChannelchannel,
BatchAccumulator<ApiMessageAndVersion>batchAccumulator)
end note
:this.channel=channel;;
:this.batchAccumulator=batchAccumulator;;
end
start
note right
void append(ApiMessageAndVersionapiMessageAndVersion)
end note
:batchAccumulator.append(0,Collections.singletonList(apiMessageAndVersion));;
end
start
note right
void append(List<ApiMessageAndVersion>messageBatch)
end note
:batchAccumulator.append(0,messageBatch);;
end
start
note right
void close()
end note
:Utils.writeFully(channel,batch.data.buffer());;
:channel.close();;
end
start
note right
SnapshotFileWriteropen(PathsnapshotPath)
end note
:BatchAccumulator<ApiMessageAndVersion>batchAccumulator=new BatchAccumulator<>(0,
0,Integer.MAX_VALUE,MAX_BATCH_SIZE_BYTES,
new BatchMemoryPool(5,MAX_BATCH_SIZE_BYTES),
Time.SYSTEM,CompressionType.NONE,new MetadataRecordSerde());;
:FileChannelchannel=FileChannel.open(snapshotPath,
StandardOpenOption.CREATE_NEW,StandardOpenOption.WRITE);;
:return new SnapshotFileWriter(channel,batchAccumulator);;
stop
end
@enduml

