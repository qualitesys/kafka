@startuml
!pragma layout smetana
start
note right
OptionalLongrequestTimeoutMsToDeadlineNs(Timetime,
intmillisecondsOffset)
end note
:return OptionalLong.of(time.nanoseconds()+
NANOSECONDS.convert(millisecondsOffset,MILLISECONDS));;
stop
end
start
note right
constructor ControllerRequestContext(RequestHeaderDatarequestHeader,
KafkaPrincipalprincipal,OptionalLongdeadlineNs)
end note
:this.requestHeader=requestHeader;;
:this.principal=principal;;
:this.deadlineNs=deadlineNs;;
end
start
note right
constructor ControllerRequestContext(AuthorizableRequestContextrequestContext,
OptionalLongdeadlineNs)
end note
:this(new RequestHeaderData().setRequestApiKey((short)requestContext.requestType())
.setRequestApiVersion((short)requestContext.requestVersion()).setCorrelationId(requestContext.correlationId()).setClientId(requestContext.clientId()),
requestContext.principal(),deadlineNs);;
end
start
note right
RequestHeaderDatarequestHeader()
end note
:return requestHeader;;
stop
end
start
note right
KafkaPrincipalprincipal()
end note
:return principal;;
stop
end
start
note right
OptionalLongdeadlineNs()
end note
:return deadlineNs;;
stop
end
@enduml

