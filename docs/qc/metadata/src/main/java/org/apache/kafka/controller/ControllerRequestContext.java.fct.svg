@startuml
!pragma layout smetana
start
note right
OptionalLong requestTimeoutMsToDeadlineNs(Time time,
int millisecondsOffset)
end note
:return OptionalLong.of(time.nanoseconds()+
NANOSECONDS.convert(millisecondsOffset,MILLISECONDS));;
stop
end
start
note right
constructor ControllerRequestContext(RequestHeaderData requestHeader,
KafkaPrincipal principal,OptionalLong deadlineNs)
end note
:this.requestHeader=requestHeader;;
:this.principal=principal;;
:this.deadlineNs=deadlineNs;;
end
start
note right
constructor ControllerRequestContext(AuthorizableRequestContext requestContext,
OptionalLong deadlineNs)
end note
:this(new RequestHeaderData().setRequestApiKey((short )requestContext.requestType())
.setRequestApiVersion((short )requestContext.requestVersion()).setCorrelationId(requestContext.correlationId()).setClientId(requestContext.clientId()),
requestContext.principal(),deadlineNs);;
end
start
note right
RequestHeaderData requestHeader()
end note
:return requestHeader;;
stop
end
start
note right
KafkaPrincipal principal()
end note
:return principal;;
stop
end
start
note right
OptionalLong deadlineNs()
end note
:return deadlineNs;;
stop
end
@enduml

