@startuml
!pragma layout smetana
start
note right
constructor PlacementSpec(intstartPartition,
intnumPartitions,shortnumReplicas)
end note
end
start
note right
intstartPartition()
end note
:return startPartition;;
stop
end
start
note right
intnumPartitions()
end note
:return numPartitions;;
stop
end
start
note right
shortnumReplicas()
end note
:return numReplicas;;
stop
end
start
note right
booleanequals(Objecto)
end note
if (o==null ) then (yes) 
:return false;;
stop
endif 
if (!(o.getClass().equals(this.getClass()))) then (yes) 
:return false;;
stop
endif 
:return startPartition==other.startPartition&&numPartitions==other.numPartitions&&numReplicas==other.numReplicas;;
stop
end
start
note right
inthashCode()
end note
:return Objects.hash(startPartition,numPartitions,
numReplicas);;
stop
end
start
note right
StringtoString()
end note
:return "PlacementSpec"+"(startPartition="+
startPartition+", numPartitions="+numPartitions+
", numReplicas="+numReplicas+")";;
stop
end
@enduml

