@startuml
!pragma layout smetana
start
note right
LeaderRecoveryState of(byte value)
end note
:return optionalOf(value).orElseThrow(()->new IllegalArgumentException(String.format("Value %s is not a valid leader recovery state",
value)));;
stop
end
start
note right
Optional<LeaderRecoveryState> optionalOf(byte value)
end note
if (value==RECOVERED.value()) then (yes) 
:return Optional.of(RECOVERED);;
stop
endif 
if (value==RECOVERING.value()) then (yes) 
:return Optional.of(RECOVERING);;
stop
endif 
:return Optional.empty();;
stop
end
start
note right
constructor LeaderRecoveryState(byte value)
end note
:this.value=value;;
end
start
note right
byte value()
end note
:return value;;
stop
end
start
note right
LeaderRecoveryState changeTo(byte value)
end note
if (value==NO_CHANGE) then (yes) 
:return this;;
stop
endif 
:return of(value);;
stop
end
@enduml

