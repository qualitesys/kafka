@startuml
!pragma layout smetana
start
note right
constructor ClusterImage(Map<Integer,BrokerRegistration>brokers)
end note
:this.brokers=Collections.unmodifiableMap(brokers);
end
start
note right
booleanisEmpty()
end note
:return brokers.isEmpty();;
stop
end
start
note right
Map<Integer,BrokerRegistration>brokers()
end note
:return brokers;;
stop
end
start
note right
BrokerRegistrationbroker(intnodeId)
end note
:return brokers.get(nodeId);;
stop
end
start
note right
void write(Consumer<List<ApiMessageAndVersion>>out,MetadataVersionmetadataVersion)
end note
:batch.add(broker.toRecord(metadataVersion));
:out.accept(batch);
end
start
note right
inthashCode()
end note
:return brokers.hashCode();;
stop
end
start
note right
