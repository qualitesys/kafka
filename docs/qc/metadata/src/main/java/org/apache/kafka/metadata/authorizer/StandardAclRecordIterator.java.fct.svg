@startuml
!pragma layout smetana
start
note right
constructor StandardAclRecordIterator(Iterator<StandardAclWithId>iterator)
end note
:this(iterator,DEFAULT_MAX_RECORDS_IN_BATCH);;
end
start
note right
constructor StandardAclRecordIterator(Iterator<StandardAclWithId>iterator,
intmaxRecordsInBatch)
end note
:this.iterator=iterator;;
:this.maxRecordsInBatch=maxRecordsInBatch;;
end
start
note right
booleanhasNext()
end note
:return iterator.hasNext();;
stop
end
start
note right
List<ApiMessageAndVersion>next()
end note
if (!hasNext()) then (yes) 
:throw new NoSuchElementException();;
stop
endif 
if (!iterator.hasNext()) then (yes) 
:break ;;
endif 
:result.add(new ApiMessageAndVersion(aclWithId.toRecord(),
(short)0));;
:return result;;
stop
end
@enduml

