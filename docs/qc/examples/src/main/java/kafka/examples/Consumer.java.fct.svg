@startuml
!pragma layout smetana
start
note right
constructor Consumer(final Stringtopic,final StringgroupId,
final Optional<String>instanceId,final booleanreadCommitted,
final intnumMessageToConsume,final CountDownLatchlatch)
end note
if (readCommitted) then (yes) 
endif 
end
start
note right
KafkaConsumer<Integer,String>get()
end note
:return consumer;;
stop
end
start
note right
void doWork()
end note
if (messageRemaining<=0) then (yes) 
endif 
end
start
note right
Stringname()
end note
:return null ;;
stop
end
start
note right
booleanisInterruptible()
end note
:return false;;
stop
end
@enduml

