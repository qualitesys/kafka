@startuml
!pragma layout smetana
start
note right
void main(String[]args)
end note
:booleanisAsync=args.length==0||!args[0].trim()
.equalsIgnoreCase("sync");;
:CountDownLatchlatch=new CountDownLatch(2);;
:ProducerproducerThread=new Producer(KafkaProperties.TOPIC,
isAsync,null ,false,10000,-1,latch);;
:producerThread.start();;
:ConsumerconsumerThread=new Consumer(KafkaProperties.TOPIC,
"DemoConsumer",Optional.empty(),false,10000,
latch);;
:consumerThread.start();;
if (!latch.await(5,TimeUnit.MINUTES)) then (yes) 
:throw new TimeoutException("Timeout after 5 minutes waiting for demo producer and consumer to finish");;
stop
endif 
:consumerThread.shutdown();;
:System.out.println("All finished!");;
end
@enduml

