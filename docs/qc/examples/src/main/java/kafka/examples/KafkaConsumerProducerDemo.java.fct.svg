@startuml
!pragma layout smetana
start
note right
void main(String[]args)
end note
:producerThread.start();
:consumerThread.start();
if (!latch.await(5,TimeUnit.MINUTES)) then (yes) 
endif 
:consumerThread.shutdown();
:System.out.println("All finished!");
end
@enduml

