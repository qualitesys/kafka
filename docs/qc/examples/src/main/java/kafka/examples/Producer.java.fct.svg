@startuml
!pragma layout smetana
start
note right
constructor Producer(final Stringtopic,final BooleanisAsync,
final StringtransactionalId,final booleanenableIdempotency,
final intnumRecords,final inttransactionTimeoutMs,
final CountDownLatchlatch)
end note
if (transactionTimeoutMs>0) then (yes) 
endif 
if (transactionalId!=null ) then (yes) 
endif 
end
start
note right
KafkaProducer<Integer,String>get()
end note
:return producer;;
stop
end
start
note right
void run()
end note
while (recordsSent<numRecords)
if (isAsync) then (yes) 
else (no)
endif 
endwhile
end
start
note right
constructor DemoCallBack(longstartTime,intkey,
Stringmessage)
end note
end
start
note right
void onCompletion(RecordMetadatametadata,
Exceptionexception)
end note
if (metadata!=null ) then (yes) 
else (no)
endif 
end
@enduml

