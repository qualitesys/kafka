@startuml
!pragma layout smetana
start
note right
void run(ArgumentParser parser,Argument arg,
Map<String,Object> attrs,String flag,Object value)
end note
:String version=AppInfoParser.getVersion();;
:String commitId=AppInfoParser.getCommitId();;
:System.out.println(version+" (Commit:"+commitId+
")");;
:Exit.exit(0);;
end
start
note right
void onAttach(Argument arg)
end note
end
start
note right
boolean consumeArgument()
end note
:return false;;
stop
end
@enduml

