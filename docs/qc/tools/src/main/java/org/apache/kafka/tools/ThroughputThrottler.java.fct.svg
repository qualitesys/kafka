@startuml
!pragma layout smetana
start
note right
constructor ThroughputThrottler(longtargetThroughput,
longstartMs)
end note
end
start
note right
booleanshouldThrottle(longamountSoFar,longsendStartMs)
end note
if (this.targetThroughput<0) then (yes) 
:return false;;
stop
endif 
:return elapsedSec>0&&(amountSoFar/elapsedSec)>this.targetThroughput;;
stop
end
start
note right
void throttle()
end note
if (targetThroughput==0) then (yes) 
while (!wakeup)
endwhile
:return ;;
stop
endif 
if (sleepDeficitNs>=MIN_SLEEP_NS) then (yes) 
while (!wakeup&&remaining>0)
endwhile
if (sleepElapsedNs<=sleepDeficitNs) then (yes) 
endif 
endif 
end
start
note right
void wakeup()
end note
end
@enduml

