@startuml
!pragma layout smetana
start
note right
constructor ThroughputThrottler(longtargetThroughput,
longstartMs)
end note
:this.startMs=startMs;;
:this.targetThroughput=targetThroughput;;
:this.sleepTimeNs=targetThroughput>0? NS_PER_SEC/targetThroughput:Long.MAX_VALUE;;
end
start
note right
booleanshouldThrottle(longamountSoFar,longsendStartMs)
end note
if (this.targetThroughput<0) then (yes) 
:return false;;
stop
endif 
:return elapsedSec>0&&(amountSoFar/elapsedSec)>this.targetThroughput;;
stop
end
start
note right
void throttle()
end note
if (targetThroughput==0) then (yes) 
:try {synchronized (this){while (!wakeup){this.wait();
:}}}catch (InterruptedExceptione){};
:return ;;
stop
endif 
:sleepDeficitNs+=sleepTimeNs;;
