@startuml
!pragma layout smetana
start
note right
void printMetrics(Map<MetricName,?  extends Metric>metrics)
end note
if (metrics!=null &&!metrics.isEmpty()) then (yes) 
if (entry.getValue() instanceof Double) then (yes) 
else (no)
endif 
endif 
end
@enduml

