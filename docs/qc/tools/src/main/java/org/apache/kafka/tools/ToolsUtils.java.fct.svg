3.5,449.3789,417.5,459.3789,421.5,449.3789,417.5,453.3789" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="417.5" x2="417.5" y1="32.5664" y2="55.1328"/><polygon fill="#181818" points="413.5,45.1328,417.5,55.1328,421.5,45.1328,417.5,49.1328" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="417.5" x2="417.5" y1="483.3789" y2="503.3789"/><polygon fill="#181818" points="413.5,493.3789,417.5,503.3789,421.5,493.3789,417.5,497.3789" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[935f0093bd986c1920fc3f4090c83913]
@startuml
!pragma layout smetana
start
note right
void printMetrics(Map<MetricName,?  extends Metric>metrics)
end note
if (metrics!=null &&!metrics.isEmpty()) then (yes) 
:maxLengthOfDisplayName=maxLengthOfDisplayName<mergedName.length()? mergedName.length():maxLengthOfDisplayName;
:sortedMetrics.put(mergedName,metric.metricValue());
:System.out.println(String.format("\n%-"+maxLengthOfDisplayName+"s   %s","Metric Name","Value"));
if (entry.getValue() instanceof Double) then (yes) 
:outputFormat=doubleOutputFormat;
else (no)
:outputFormat=defaultOutputFormat;
endif 
:System.out.println(String.format(outputFormat,entry.getKey(),entry.getValue()));
endif 
end
@enduml

