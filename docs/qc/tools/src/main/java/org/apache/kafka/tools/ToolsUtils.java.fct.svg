/><polygon fill="#181818" points="439.5,495.3164,429.5,499.3164,439.5,503.3164,435.5,499.3164" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="417.5" x2="417.5" y1="467.3164" y2="487.3164"/><polygon fill="#181818" points="413.5,477.3164,417.5,487.3164,421.5,477.3164,417.5,481.3164" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="417.5" x2="417.5" y1="32.5664" y2="55.1328"/><polygon fill="#181818" points="413.5,45.1328,417.5,55.1328,421.5,45.1328,417.5,49.1328" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="417.5" x2="417.5" y1="511.3164" y2="531.3164"/><polygon fill="#181818" points="413.5,521.3164,417.5,531.3164,421.5,521.3164,417.5,525.3164" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[c31006837cd27dedec0130ab33b50b7c]
@startuml
!pragma layout smetana
start
note right
void printMetrics(Map<MetricName,?  extends Metric>metrics)
end note
if (metrics!=null &&!metrics.isEmpty()) then (yes) 
:maxLengthOfDisplayName=maxLengthOfDisplayName<mergedName.length()? mergedName.length():maxLengthOfDisplayName;
:sortedMetrics.put(mergedName,metric.metricValue());
:System.out.println(String.format("\n%-"+
maxLengthOfDisplayName+"s   %s","Metric Name",
"Value"));
if (entry.getValue() instanceof Double) then (yes) 
:outputFormat=doubleOutputFormat;
else (no)
:outputFormat=defaultOutputFormat;
endif 
:System.out.println(String.format(outputFormat,
entry.getKey(),entry.getValue()));
endif 
end
@enduml

