18;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="838" x2="838" y1="67.1328" y2="910.9727"/><line style="stroke:#181818;stroke-width:1.0;" x1="838" x2="431.5" y1="910.9727" y2="910.9727"/><polygon fill="#181818" points="441.5,906.9727,431.5,910.9727,441.5,914.9727,437.5,910.9727" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="419.5" x2="419.5" y1="878.9727" y2="898.9727"/><polygon fill="#181818" points="415.5,888.9727,419.5,898.9727,423.5,888.9727,419.5,892.9727" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="419.5" x2="419.5" y1="32.5664" y2="55.1328"/><polygon fill="#181818" points="415.5,45.1328,419.5,55.1328,423.5,45.1328,419.5,49.1328" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="419.5" x2="419.5" y1="922.9727" y2="942.9727"/><polygon fill="#181818" points="415.5,932.9727,419.5,942.9727,423.5,932.9727,419.5,936.9727" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[002783613356b096c7008faef4da4cf1]
@startuml
!pragma layout smetana
start
note right
void printMetrics(Map<MetricName,?extendsMetric> metrics)
end note
if (metrics!=null &&!metrics.isEmpty()) then (yes) 
:int maxLengthOfDisplayName=0;;
:TreeMap<String,Object> sortedMetrics=new TreeMap<>();;
:MetricName mName=metric.metricName();;
:String mergedName=mName.group()+":"+mName.name()+
":"+mName.tags();;
:maxLengthOfDisplayName=maxLengthOfDisplayName<mergedName.length()? mergedName.length():maxLengthOfDisplayName;;
:sortedMetrics.put(mergedName,metric.metricValue());;
:String doubleOutputFormat="%-"+maxLengthOfDisplayName+
"s : %.3f";;
:String defaultOutputFormat="%-"+maxLengthOfDisplayName+
"s : %s";;
:System.out.println(String.format("\n%-"+
maxLengthOfDisplayName+"s   %s","Metric Name",
"Value"));;
:String outputFormat;;
if (entry.getValue() instanceof Double ) then (yes) 
:outputFormat=doubleOutputFormat;;
else (no)
:outputFormat=defaultOutputFormat;;
endif 
:System.out.println(String.format(outputFormat,
entry.getKey(),entry.getValue()));;
endif 
end
@enduml

