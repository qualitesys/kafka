><line style="stroke:#181818;stroke-width:1.0;" x1="417.5" x2="417.5" y1="460.3164" y2="480.3164"/><polygon fill="#181818" points="413.5,470.3164,417.5,480.3164,421.5,470.3164,417.5,474.3164" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="417.5" x2="417.5" y1="32.5664" y2="55.1328"/><polygon fill="#181818" points="413.5,45.1328,417.5,55.1328,421.5,45.1328,417.5,49.1328" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="417.5" x2="417.5" y1="504.3164" y2="524.3164"/><polygon fill="#181818" points="413.5,514.3164,417.5,524.3164,421.5,514.3164,417.5,518.3164" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[90e04c36cbcfa6ab47151bf6496a4461]
@startuml
!pragma layout smetana
start
note right
void printMetrics(Map<MetricName,?  extends Metric>metrics)
end note
if (metrics!=null &&!metrics.isEmpty()) then (yes) 
:maxLengthOfDisplayName=maxLengthOfDisplayName<mergedName.length()? mergedName.length():maxLengthOfDisplayName;
:sortedMetrics.put(mergedName,metric.metricValue());
:System.out.println(String.format("\n%-"+maxLengthOfDisplayName+"s   %s",
"Metric Name","Value"));
if (entry.getValue() instanceof Double) then (yes) 
:outputFormat=doubleOutputFormat;
else (no)
:outputFormat=defaultOutputFormat;
endif 
:System.out.println(String.format(outputFormat,
entry.getKey(),entry.getValue()));
endif 
end
@enduml

