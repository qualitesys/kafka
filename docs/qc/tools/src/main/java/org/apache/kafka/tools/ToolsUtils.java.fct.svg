.3164"/><polygon fill="#181818" points="441.5,495.3164,431.5,499.3164,441.5,503.3164,437.5,499.3164" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="419.5" x2="419.5" y1="467.3164" y2="487.3164"/><polygon fill="#181818" points="415.5,477.3164,419.5,487.3164,423.5,477.3164,419.5,481.3164" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="419.5" x2="419.5" y1="32.5664" y2="55.1328"/><polygon fill="#181818" points="415.5,45.1328,419.5,55.1328,423.5,45.1328,419.5,49.1328" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="419.5" x2="419.5" y1="511.3164" y2="531.3164"/><polygon fill="#181818" points="415.5,521.3164,419.5,531.3164,423.5,521.3164,419.5,525.3164" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[433e4d277004d24ceeb0ef3ca9f7ed6b]
@startuml
!pragma layout smetana
start
note right
void printMetrics(Map<MetricName,?  extends Metric>metrics)
end note
if (metrics!=null &&!metrics.isEmpty()) then (yes) 
:maxLengthOfDisplayName=maxLengthOfDisplayName<mergedName.length()? mergedName.length():maxLengthOfDisplayName;;
:sortedMetrics.put(mergedName,metric.metricValue());;
:System.out.println(String.format("\n%-"+
maxLengthOfDisplayName+"s   %s","Metric Name",
"Value"));;
if (entry.getValue() instanceof Double) then (yes) 
:outputFormat=doubleOutputFormat;;
else (no)
:outputFormat=defaultOutputFormat;;
endif 
:System.out.println(String.format(outputFormat,
entry.getKey(),entry.getValue()));;
endif 
end
@enduml

