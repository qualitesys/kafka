@startuml
!pragma layout smetana
start
note right
constructor RemoteLogSegmentState(byteid)
end note
end
start
note right
byteid()
end note
:return id;;
stop
end
start
note right
RemoteLogSegmentStateforId(byteid)
end note
:return STATE_TYPES.get(id);;
stop
end
start
note right
booleanisValidTransition(RemoteLogSegmentStatesrcState,
RemoteLogSegmentStatetargetState)
end note
if (srcState==null ) then (yes) 
:return targetState==COPY_SEGMENT_STARTED;;
stop
else (no)
:return false;;
stop
endif 
end
@enduml

