@startuml
!pragma layout smetana
start
note right
constructor RemotePartitionDeleteState(byte id)
end note
:this.id=id;;
end
start
note right
byte id()
end note
:return id;;
stop
end
start
note right
RemotePartitionDeleteState forId(byte id)
end note
:return STATE_TYPES.get(id);;
stop
end
start
note right
boolean isValidTransition(RemotePartitionDeleteState srcState,
RemotePartitionDeleteState targetState)
end note
:Objects.requireNonNull(targetState,"targetState can not be null");;
if (srcState==null ) then (yes) 
:return targetState==DELETE_PARTITION_MARKED;;
stop
else if (srcState==targetState) then (yes) 
:return true;;
stop
else if (srcState==DELETE_PARTITION_MARKED) then (yes) 
:return targetState==DELETE_PARTITION_STARTED;;
stop
else if (srcState==DELETE_PARTITION_STARTED) then (yes) 
:return targetState==DELETE_PARTITION_FINISHED;;
stop
else (no)
:return false;;
stop
endif 
end
@enduml

