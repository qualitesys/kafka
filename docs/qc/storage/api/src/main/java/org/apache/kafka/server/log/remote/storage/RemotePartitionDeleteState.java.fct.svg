;" x1="176" x2="176" y1="587.5391" y2="609.5391"/><polygon fill="#181818" points="172,599.5391,176,609.5391,180,599.5391,176,603.5391" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="349.75" x2="409.5" y1="587.5391" y2="587.5391"/><line style="stroke:#181818;stroke-width:1.0;" x1="409.5" x2="409.5" y1="587.5391" y2="609.5391"/><polygon fill="#181818" points="405.5,599.5391,409.5,609.5391,413.5,599.5391,409.5,603.5391" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="292.75" x2="292.75" y1="555.5391" y2="575.5391"/><polygon fill="#181818" points="288.75,565.5391,292.75,575.5391,296.75,565.5391,292.75,569.5391" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[240c52bc3d0b92cca40f42569c282800]
@startuml
!pragma layout smetana
start
note right
constructor RemotePartitionDeleteState(byteid)
end note
:this.id=id;
end
start
note right
byteid()
end note
:return id;;
stop
end
start
note right
RemotePartitionDeleteStateforId(byteid)
end note
:return STATE_TYPES.get(id);;
stop
end
start
note right
booleanisValidTransition(RemotePartitionDeleteStatesrcState,
RemotePartitionDeleteStatetargetState)
end note
:Objects.requireNonNull(targetState,"targetState can not be null");
if (srcState==null ) then (yes) 
:return targetState==DELETE_PARTITION_MARKED;;
stop
else (no)
:return false;;
stop
endif 
end
@enduml

