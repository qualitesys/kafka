!pragma layout smetana
start
note right
constructor RemotePartitionDeleteMetadata(TopicIdPartitiontopicIdPartition,
RemotePartitionDeleteStatestate,longeventTimestampMs,
intbrokerId)
end note
end
start
note right
TopicIdPartitiontopicIdPartition()
end note
:return topicIdPartition;;
stop
end
start
note right
RemotePartitionDeleteStatestate()
end note
:return state;;
stop
end
start
note right
StringtoString()
end note
:return "RemotePartitionDeleteMetadata{"+
"topicPartition="+topicIdPartition+", state="+
