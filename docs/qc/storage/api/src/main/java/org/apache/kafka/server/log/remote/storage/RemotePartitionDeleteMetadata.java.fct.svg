@startuml
!pragma layout smetana
start
note right
constructor RemotePartitionDeleteMetadata(TopicIdPartitiontopicIdPartition,RemotePartitionDeleteStatestate,longeventTimestampMs,intbrokerId)
end note
:super (brokerId,eventTimestampMs);
:this.topicIdPartition=Objects.requireNonNull(topicIdPartition);
:this.state=Objects.requireNonNull(state);
end
start
note right
TopicIdPartitiontopicIdPartition()
end note
:return topicIdPartition;;
stop
end
start
note right
RemotePartitionDeleteStatestate()
end note
:return state;;
stop
end
start
note right
StringtoString()
end note
:return "RemotePartitionDeleteMetadata{"+
"topicPartition="+topicIdPartition+", state="+
state+", eventTimestampMs="+eventTimestampMs()+
", brokerId="+brokerId()+'}';;
stop
end
start
note right
booleanequals(Objecto)
end note
if (this==o) then (yes) 
:return true;;
stop
endif 
if (o==null ||getClass()!=o.getClass()) then (yes) 
:return false;;
stop
endif 
:return Objects.equals(topicIdPartition,that.topicIdPartition)&&state==that.state&&eventTimestampMs()==that.eventTimestampMs()&&brokerId()==that.brokerId();;
stop
end
start
note right
inthashCode()
end note
:return Objects.hash(topicIdPartition,state,
eventTimestampMs(),brokerId());;
stop
end
