@startuml
!pragma layout smetana
start
note right
constructor RemoteLogSegmentId(TopicIdPartitiontopicIdPartition,
Uuidid)
end note
:this.topicIdPartition=Objects.requireNonNull(topicIdPartition,
"topicIdPartition can not be null");
:this.id=Objects.requireNonNull(id,"id can not be null");
end
start
note right
TopicIdPartitiontopicIdPartition()
end note
:return topicIdPartition;;
stop
end
start
note right
Uuidid()
end note
:return id;;
stop
end
start
note right
StringtoString()
end note
:return "RemoteLogSegmentId{"+"topicIdPartition="+
topicIdPartition+", id="+id+'}';;
stop
end
start
note right
booleanequals(Objecto)
end note
if (this==o) then (yes) 
:return true;;
stop
endif 
if (o==null ||getClass()!=o.getClass()) then (yes) 
:return false;;
stop
endif 
:return Objects.equals(topicIdPartition,that.topicIdPartition)&&Objects.equals(id,
that.id);;
stop
end
start
note right
inthashCode()
end note
:return Objects.hash(topicIdPartition,id);;
stop
end
