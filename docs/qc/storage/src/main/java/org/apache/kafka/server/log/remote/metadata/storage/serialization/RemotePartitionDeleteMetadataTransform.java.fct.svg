@startuml
!pragma layout smetana
start
note right
ApiMessageAndVersion toApiMessageAndVersion(RemotePartitionDeleteMetadata partitionDeleteMetadata)
end note
:RemotePartitionDeleteMetadataRecord record =new RemotePartitionDeleteMetadataRecord()
.setTopicIdPartition(createTopicIdPartitionEntry(partitionDeleteMetadata.topicIdPartition())).setEventTimestampMs(partitionDeleteMetadata.eventTimestampMs()).setBrokerId(partitionDeleteMetadata.brokerId()).setRemotePartitionDeleteState(partitionDeleteMetadata.state().id());;
:return new ApiMessageAndVersion(record ,
record .highestSupportedVersion());;
stop
end
start
note right
RemotePartitionDeleteMetadataRecord.TopicIdPartitionEntry createTopicIdPartitionEntry(TopicIdPartition topicIdPartition)
end note
:return new RemotePartitionDeleteMetadataRecord.TopicIdPartitionEntry()
.setName(topicIdPartition.topic()).setPartition(topicIdPartition.partition()).setId(topicIdPartition.topicId());;
stop
end
start
note right
RemotePartitionDeleteMetadata fromApiMessageAndVersion(ApiMessageAndVersion apiMessageAndVersion)
end note
:RemotePartitionDeleteMetadataRecord record =(RemotePartitionDeleteMetadataRecord )apiMessageAndVersion.message();;
:TopicIdPartition topicIdPartition=new TopicIdPartition(record .topicIdPartition().id(),
new TopicPartition(record .topicIdPartition().name(),
record .topicIdPartition().partition()));;
:return new RemotePartitionDeleteMetadata(topicIdPartition,
RemotePartitionDeleteState.forId(record .remotePartitionDeleteState()),
record .eventTimestampMs(),record .brokerId());;
stop
end
@enduml

