@startuml
!pragma layout smetana
start
note right
constructor RemoteLogMetadataSnapshotFile(PathmetadataStoreDir)
end note
:this.metadataStoreFile=new File(metadataStoreDir.toFile(),
COMMITTED_LOG_METADATA_SNAPSHOT_FILE_NAME);
if (!fileExists) then (yes) 
:Files.createFile(metadataStoreFile.toPath());
endif 
:log.info("Remote log metadata snapshot file: [{}],
 newFileCreated: [{}]",metadataStoreFile,
!fileExists);
:throw new KafkaException(e);;
end
start
note right
void write(Snapshotsnapshot)
end note
:headerBuffer.putShort(snapshot.version());
:headerBuffer.putInt(snapshot.metadataPartition());
:headerBuffer.putLong(snapshot.metadataPartitionOffset());
:headerBuffer.putInt(metadataSnapshots.size());
:headerBuffer.flip();
:fileChannel.write(headerBuffer);
:lenBuffer.putInt(serializedBytes.length);
:lenBuffer.flip();
:fileChannel.write(lenBuffer);
:lenBuffer.rewind();
:fileChannel.write(ByteBuffer.wrap(serializedBytes));
:fileChannel.force(true);
:Utils.atomicMoveWithFallback(newMetadataSnapshotFilePath,
metadataStoreFile.toPath());
end
start
note right
Optional<Snapshot>read()
end note
if (metadataStoreFile.length()==0) then (yes) 
:return Optional.empty();;
stop
endif 
:channel.read(headerBuffer);
:headerBuffer.rewind();
while ((lenBufferReadCt=channel.read(lenBuffer))>0)
:lenBuffer.rewind();
if (lenBufferReadCt!=lenBuffer.capacity()) then (yes) 
:throw new IOException("Invalid amount of data read for the length of an entry,
 file may have been corrupted.");;
endif 
:lenBuffer.rewind();
if (read!=len) then (yes) 
:throw new IOException("Invalid amount of data read,
 file may have been corrupted.");;
endif 
:result.add(remoteLogSegmentMetadata);
endwhile
if (metadataSnapshotsSize!=result.size()) then (yes) 
:throw new IOException("Unexpected entries in the snapshot file. Expected size: "+metadataSnapshotsSize+", but found: "+result.size());;
endif 
:return Optional.of(new Snapshot(version,
metadataPartition,metadataPartitionOffset,
result));;
stop
end
start
note right
constructor Snapshot(intmetadataPartition,longmetadataPartitionOffset,Collection<RemoteLogSegmentMetadataSnapshot>remoteLogSegmentMetadataSnapshots)
end note
:this(CURRENT_VERSION,metadataPartition,metadataPartitionOffset,
remoteLogSegmentMetadataSnapshots);
end
start
note right
constructor Snapshot(shortversion,intmetadataPartition,longmetadataPartitionOffset,Collection<RemoteLogSegmentMetadataSnapshot>remoteLogSegmentMetadataSnapshots)
end note
if (version!=CURRENT_VERSION) then (yes) 
:throw new IllegalArgumentException("Unexpected version received: "+
version);;
endif 
:this.version=version;
:this.metadataPartition=metadataPartition;
:this.metadataPartitionOffset=metadataPartitionOffset;
:this.remoteLogSegmentMetadataSnapshots=remoteLogSegmentMetadataSnapshots;
end
start
note right
shortversion()
end note
:return version;;
stop
end
start
note right
intmetadataPartition()
end note
:return metadataPartition;;
stop
end
start
note right
longmetadataPartitionOffset()
end note
:return metadataPartitionOffset;;
stop
end
start
note right
Collection<RemoteLogSegmentMetadataSnapshot>remoteLogSegmentMetadataSnapshots()
end note
:return remoteLogSegmentMetadataSnapshots;;
stop
end
start
note right
booleanequals(Objecto)
end note
if (this==o) then (yes) 
:return true;;
stop
endif 
if (!(o instanceof Snapshot)) then (yes) 
:return false;;
stop
endif 
:return version==snapshot.version&&metadataPartition==snapshot.metadataPartition&&metadataPartitionOffset==snapshot.metadataPartitionOffset&&Objects.equals(remoteLogSegmentMetadataSnapshots,snapshot.remoteLogSegmentMetadataSnapshots);;
stop
end
start
note right
inthashCode()
end note
:return Objects.hash(version,metadataPartition,
metadataPartitionOffset,remoteLogSegmentMetadataSnapshots);;
stop
end
start
note right
StringtoString()
end note
:return "Snapshot{"+"version="+version+", metadataPartition="+
metadataPartition+", metadataPartitionOffset="+
metadataPartitionOffset+", remoteLogSegmentMetadataSnapshotsSize"+
remoteLogSegmentMetadataSnapshots.size()+
'}';;
stop
end
