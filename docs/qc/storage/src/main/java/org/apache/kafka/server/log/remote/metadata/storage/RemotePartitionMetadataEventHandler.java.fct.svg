note right
void handleRemoteLogMetadata(RemoteLogMetadataremoteLogMetadata)
end note
if (remoteLogMetadata instanceof RemoteLogSegmentMetadata) then (yes) 
:handleRemoteLogSegmentMetadata((RemoteLogSegmentMetadata)remoteLogMetadata);
else (no)
:throw new IllegalArgumentException("remoteLogMetadata: "+remoteLogMetadata+" is not supported.");;
endif 
end
