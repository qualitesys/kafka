@startuml
!pragma layout smetana
start
note right
void handleRemoteLogMetadata(RemoteLogMetadata remoteLogMetadata)
end note
if (remoteLogMetadata instanceof RemoteLogSegmentMetadata ) then (yes) 
:handleRemoteLogSegmentMetadata((RemoteLogSegmentMetadata )remoteLogMetadata);;
else if (remoteLogMetadata instanceof RemoteLogSegmentMetadataUpdate ) then (yes) 
:handleRemoteLogSegmentMetadataUpdate((RemoteLogSegmentMetadataUpdate )remoteLogMetadata);;
else if (remoteLogMetadata instanceof RemotePartitionDeleteMetadata ) then (yes) 
:handleRemotePartitionDeleteMetadata((RemotePartitionDeleteMetadata )remoteLogMetadata);;
else (no)
:throw new IllegalArgumentException("remoteLogMetadata: "+
remoteLogMetadata+" is not supported.");;
stop
endif 
end
start
note right
void handleRemoteLogSegmentMetadata(RemoteLogSegmentMetadata remoteLogSegmentMetadata)
end note
end
start
note right
void handleRemoteLogSegmentMetadataUpdate(RemoteLogSegmentMetadataUpdate remoteLogSegmentMetadataUpdate)
end note
end
start
note right
void handleRemotePartitionDeleteMetadata(RemotePartitionDeleteMetadata remotePartitionDeleteMetadata)
end note
end
start
note right
void syncLogMetadataSnapshot(TopicIdPartition topicIdPartition,
int metadataPartition,Long metadataPartitionOffset)
end note
end
start
note right
void clearTopicPartition(TopicIdPartition topicIdPartition)
end note
end
@enduml

