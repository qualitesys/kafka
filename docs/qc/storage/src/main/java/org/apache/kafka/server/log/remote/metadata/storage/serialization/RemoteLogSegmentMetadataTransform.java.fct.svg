@startuml
!pragma layout smetana
start
note right
ApiMessageAndVersiontoApiMessageAndVersion(RemoteLogSegmentMetadatasegmentMetadata)
end note
:return new ApiMessageAndVersion(record,record.highestSupportedVersion());;
stop
end
start
note right
List<RemoteLogSegmentMetadataRecord.SegmentLeaderEpochEntry>createSegmentLeaderEpochsEntry(RemoteLogSegmentMetadatadata)
end note
:return data.segmentLeaderEpochs().entrySet()
.stream().map(entry->new RemoteLogSegmentMetadataRecord.SegmentLeaderEpochEntry().setLeaderEpoch(entry.getKey()).setOffset(entry.getValue())).collect(Collectors.toList());;
stop
end
start
note right
RemoteLogSegmentMetadataRecord.RemoteLogSegmentIdEntrycreateRemoteLogSegmentIdEntry(RemoteLogSegmentMetadatadata)
end note
:return new RemoteLogSegmentMetadataRecord.RemoteLogSegmentIdEntry()
.setTopicIdPartition(new RemoteLogSegmentMetadataRecord.TopicIdPartitionEntry()
.setId(data.remoteLogSegmentId().topicIdPartition()
.topicId()).setName(data.remoteLogSegmentId()
.topicIdPartition().topic()).setPartition(data.remoteLogSegmentId()
.topicIdPartition().partition())).setId(data.remoteLogSegmentId()
.id());;
stop
end
start
note right
RemoteLogSegmentMetadatafromApiMessageAndVersion(ApiMessageAndVersionapiMessageAndVersion)
end note
:segmentLeaderEpochs.put(segmentLeaderEpoch.leaderEpoch(),
segmentLeaderEpoch.offset());
:return remoteLogSegmentMetadata.createWithUpdates(rlsmUpdate);;
stop
end
start
note right
RemoteLogSegmentIdbuildRemoteLogSegmentId(RemoteLogSegmentMetadataRecord.RemoteLogSegmentIdEntryentry)
end note
:return new RemoteLogSegmentId(topicIdPartition,
entry.id());;
stop
end
