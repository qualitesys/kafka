"stroke:#181818;stroke-width:1.0;" x1="1725" x2="1725" y1="562.3125" y2="582.3125"/><polygon fill="#181818" points="1721,572.3125,1725,582.3125,1729,572.3125,1725,576.3125" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="1725" x2="1725" y1="630.25" y2="650.25"/><polygon fill="#181818" points="1721,640.25,1725,650.25,1729,640.25,1725,644.25" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="1725" x2="1725" y1="740.0938" y2="760.0938"/><polygon fill="#181818" points="1721,750.0938,1725,760.0938,1729,750.0938,1725,754.0938" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[dd7aa3a6b94c5e4aadc3a5e1fbb2c56c]
@startuml
!pragma layout smetana
start
note right
ApiMessageAndVersion toApiMessageAndVersion(RemoteLogSegmentMetadataSnapshot segmentMetadata)
end note
:RemoteLogSegmentMetadataSnapshotRecord record=new RemoteLogSegmentMetadataSnapshotRecord()
.setSegmentId(segmentMetadata.segmentId()).setStartOffset(segmentMetadata.startOffset()).setEndOffset(segmentMetadata.endOffset()).setBrokerId(segmentMetadata.brokerId()).setEventTimestampMs(segmentMetadata.eventTimestampMs()).setMaxTimestampMs(segmentMetadata.maxTimestampMs()).setSegmentSizeInBytes(segmentMetadata.segmentSizeInBytes()).setSegmentLeaderEpochs(createSegmentLeaderEpochsEntry(segmentMetadata.segmentLeaderEpochs())).setRemoteLogSegmentState(segmentMetadata.state().id());;
:return new ApiMessageAndVersion(record,record.highestSupportedVersion());;
stop
end
start
note right
List<RemoteLogSegmentMetadataSnapshotRecord.SegmentLeaderEpochEntry> createSegmentLeaderEpochsEntry(Map<Integer,
Long> leaderEpochs)
end note
:return leaderEpochs.entrySet().stream().map(entry->new RemoteLogSegmentMetadataSnapshotRecord.SegmentLeaderEpochEntry()
.setLeaderEpoch(entry.getKey()).setOffset(entry.getValue())).collect(Collectors.toList());;
stop
end
start
note right
RemoteLogSegmentMetadataSnapshot fromApiMessageAndVersion(ApiMessageAndVersion apiMessageAndVersion)
end note
:RemoteLogSegmentMetadataSnapshotRecord record=(RemoteLogSegmentMetadataSnapshotRecord )apiMessageAndVersion.message();;
:Map<Integer,Long> segmentLeaderEpochs=new HashMap<>();;
:segmentLeaderEpochs.put(segmentLeaderEpoch.leaderEpoch(),
segmentLeaderEpoch.offset());;
:return new RemoteLogSegmentMetadataSnapshot(record.segmentId(),
record.startOffset(),record.endOffset(),record.maxTimestampMs(),
record.brokerId(),record.eventTimestampMs(),
record.segmentSizeInBytes(),RemoteLogSegmentState.forId(record.remoteLogSegmentState()),
segmentLeaderEpochs);;
stop
end
@enduml

