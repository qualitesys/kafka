@startuml
!pragma layout smetana
start
note right
ApiMessageAndVersiontoApiMessageAndVersion(RemoteLogSegmentMetadataSnapshotsegmentMetadata)
end note
:RemoteLogSegmentMetadataSnapshotRecordrecord =new RemoteLogSegmentMetadataSnapshotRecord()
.setSegmentId(segmentMetadata.segmentId()).setStartOffset(segmentMetadata.startOffset()).setEndOffset(segmentMetadata.endOffset()).setBrokerId(segmentMetadata.brokerId()).setEventTimestampMs(segmentMetadata.eventTimestampMs()).setMaxTimestampMs(segmentMetadata.maxTimestampMs()).setSegmentSizeInBytes(segmentMetadata.segmentSizeInBytes()).setSegmentLeaderEpochs(createSegmentLeaderEpochsEntry(segmentMetadata.segmentLeaderEpochs())).setRemoteLogSegmentState(segmentMetadata.state().id());;
:return new ApiMessageAndVersion(record ,
record .highestSupportedVersion());;
stop
end
start
note right
List<RemoteLogSegmentMetadataSnapshotRecord.SegmentLeaderEpochEntry>createSegmentLeaderEpochsEntry(Map<Integer,
Long>leaderEpochs)
end note
:return leaderEpochs.entrySet().stream().map(entry->new RemoteLogSegmentMetadataSnapshotRecord.SegmentLeaderEpochEntry()
.setLeaderEpoch(entry.getKey()).setOffset(entry.getValue())).collect(Collectors.toList());;
stop
end
start
note right
RemoteLogSegmentMetadataSnapshotfromApiMessageAndVersion(ApiMessageAndVersionapiMessageAndVersion)
end note
:RemoteLogSegmentMetadataSnapshotRecordrecord =(RemoteLogSegmentMetadataSnapshotRecord)apiMessageAndVersion.message();;
:Map<Integer,Long>segmentLeaderEpochs=new HashMap<>();;
:segmentLeaderEpochs.put(segmentLeaderEpoch.leaderEpoch(),
segmentLeaderEpoch.offset());;
:return new RemoteLogSegmentMetadataSnapshot(record .segmentId(),
record .startOffset(),record .endOffset(),
record .maxTimestampMs(),record .brokerId(),
record .eventTimestampMs(),record .segmentSizeInBytes(),
RemoteLogSegmentState.forId(record .remoteLogSegmentState()),
segmentLeaderEpochs);;
stop
end
