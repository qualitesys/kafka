 fill="#181818" points="302.5,796.3633,306.5,806.3633,310.5,796.3633,306.5,800.3633" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="306.5" x2="306.5" y1="1022.2031" y2="1042.2031"/><polygon fill="#181818" points="302.5,1032.2031,306.5,1042.2031,310.5,1032.2031,306.5,1036.2031" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[b37a2834957374fa61a4392c06845342]
@startuml
!pragma layout smetana
start
note right
constructor CommittedOffsetsFile(FileoffsetsFile)
end note
:checkpointFile=new CheckpointFile<>(offsetsFile,
CURRENT_VERSION,formatter);;
end
start
note right
StringtoString(Map.Entry<Integer,Long>entry)
end note
:return entry.getKey()+SEPARATOR+entry.getValue();;
stop
end
start
note right
Optional<Map.Entry<Integer,Long>>fromString(Stringline)
end note
if (strings.length!=2) then (yes) 
:return Optional.empty();;
stop
endif 
:try {return Optional.of(Utils.mkEntry(Integer.parseInt(strings[0]),
Long.parseLong(strings[1])));}catch (NumberFormatExceptione){return Optional.empty();};
end
start
note right
void writeEntries(Map<Integer,Long>committedOffsets)
end note
:checkpointFile.write(committedOffsets.entrySet());;
end
start
note right
Map<Integer,Long>readEntries()
end note
if (existingValue!=null ) then (yes) 
:throw new IOException("Multiple entries exist for key: "+
entry.getKey());;
stop
endif 
:return partitionToOffsets;;
stop
end
@enduml

