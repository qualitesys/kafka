longinitializationRetryIntervalMs()
end note
:return initializationRetryIntervalMs;;
stop
end
start
note right
StringlogDir()
end note
:return logDir;;
stop
end
start
note right
Map<String,Object>consumerProperties()
end note
:return consumerProps;;
stop
end
start
note right
Map<String,Object>producerProperties()
end note
:return producerProps;;
stop
end
start
note right
Map<String,Object>createConsumerProps(HashMap<String,Object>allConsumerConfigs)
end note
:props.put(CommonClientConfigs.CLIENT_ID_CONFIG,clientIdPrefix+
"_consumer");
:props.put(ConsumerConfig.ENABLE_AUTO_COMMIT_CONFIG,
false);
:props.put(ConsumerConfig.AUTO_OFFSET_RESET_CONFIG,
"earliest");
:props.put(ConsumerConfig.EXCLUDE_INTERNAL_TOPICS_CONFIG,
false);
:props.put(ConsumerConfig.KEY_DESERIALIZER_CLASS_CONFIG,
ByteArrayDeserializer.class .getName());
:props.put(ConsumerConfig.VALUE_DESERIALIZER_CLASS_CONFIG,
ByteArrayDeserializer.class .getName());
:return props;;
stop
end
start
note right
Map<String,Object>createProducerProps(HashMap<String,Object>allProducerConfigs)
end note
:props.put(ProducerConfig.CLIENT_ID_CONFIG,clientIdPrefix+
"_producer");
:props.put(ProducerConfig.ACKS_CONFIG,"all");
:props.put(ProducerConfig.MAX_IN_FLIGHT_REQUESTS_PER_CONNECTION,1);
:props.put(ProducerConfig.KEY_SERIALIZER_CLASS_CONFIG,
ByteArraySerializer.class .getName());
:props.put(ProducerConfig.VALUE_SERIALIZER_CLASS_CONFIG,
ByteArraySerializer.class .getName());
:return Collections.unmodifiableMap(props);;
stop
end
start
note right
StringtoString()
end note
:return "TopicBasedRemoteLogMetadataManagerConfig{"+
"clientIdPrefix='"+clientIdPrefix+'\''+", metadataTopicPartitionsCount="+
metadataTopicPartitionsCount+", consumeWaitMs="+
consumeWaitMs+", metadataTopicRetentionMs="+
metadataTopicRetentionMs+", metadataTopicReplicationFactor="+
metadataTopicReplicationFactor+", initializationRetryMaxTimeoutMs="+
initializationRetryMaxTimeoutMs+", initializationRetryIntervalMs="+
initializationRetryIntervalMs+", consumerProps="+
consumerProps+", producerProps="+producerProps+
'}';;
stop
end
