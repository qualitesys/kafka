@startuml
!pragma layout smetana
start
note right
ApiMessageAndVersion toApiMessageAndVersion(RemoteLogSegmentMetadataUpdate segmentMetadataUpdate)
end note
:RemoteLogSegmentMetadataUpdateRecord record =new RemoteLogSegmentMetadataUpdateRecord()
.setRemoteLogSegmentId(createRemoteLogSegmentIdEntry(segmentMetadataUpdate)).setBrokerId(segmentMetadataUpdate.brokerId()).setEventTimestampMs(segmentMetadataUpdate.eventTimestampMs()).setRemoteLogSegmentState(segmentMetadataUpdate.state().id());;
:return new ApiMessageAndVersion(record ,
record .highestSupportedVersion());;
stop
end
start
note right
RemoteLogSegmentMetadataUpdate fromApiMessageAndVersion(ApiMessageAndVersion apiMessageAndVersion)
end note
:RemoteLogSegmentMetadataUpdateRecord record =(RemoteLogSegmentMetadataUpdateRecord )apiMessageAndVersion.message();;
:RemoteLogSegmentMetadataUpdateRecord.RemoteLogSegmentIdEntry entry=record .remoteLogSegmentId();;
:TopicIdPartition topicIdPartition=new TopicIdPartition(entry.topicIdPartition().id(),
new TopicPartition(entry.topicIdPartition().name(),
entry.topicIdPartition().partition()));;
:return new RemoteLogSegmentMetadataUpdate(new RemoteLogSegmentId(topicIdPartition,
entry.id()),record .eventTimestampMs(),RemoteLogSegmentState.forId(record .remoteLogSegmentState()),
record .brokerId());;
stop
end
start
note right
RemoteLogSegmentMetadataUpdateRecord.RemoteLogSegmentIdEntry createRemoteLogSegmentIdEntry(RemoteLogSegmentMetadataUpdate data)
end note
:return new RemoteLogSegmentMetadataUpdateRecord.RemoteLogSegmentIdEntry()
.setId(data.remoteLogSegmentId().id()).setTopicIdPartition(new RemoteLogSegmentMetadataUpdateRecord.TopicIdPartitionEntry().setName(data.remoteLogSegmentId().topicIdPartition().topic()).setPartition(data.remoteLogSegmentId().topicIdPartition().partition()).setId(data.remoteLogSegmentId().topicIdPartition().topicId()));;
stop
end
@enduml

