ke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="506" x2="506" y1="1180.9727" y2="1200.9727"/><polygon fill="#181818" points="502,1190.9727,506,1200.9727,510,1190.9727,506,1194.9727" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="506" x2="506" y1="1234.9414" y2="1254.9414"/><polygon fill="#181818" points="502,1244.9414,506,1254.9414,510,1244.9414,506,1248.9414" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="506" x2="506" y1="1302.8789" y2="1322.8789"/><polygon fill="#181818" points="502,1312.8789,506,1322.8789,510,1312.8789,506,1316.8789" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[ece1d04cac67a60543623d9a47fa3135]
@startuml
!pragma layout smetana
start
note right
constructor FileBasedRemoteLogMetadataCache(TopicIdPartitiontopicIdPartition,
PathpartitionDir)
end note
if (!partitionDir.toFile().exists()||!partitionDir.toFile().isDirectory()) then (yes) 
:throw new KafkaException("Given partition directory:"+
partitionDir+" must be an existing directory.");;
stop
endif 
:this.topicIdPartition=topicIdPartition;;
:snapshotFile=new RemoteLogMetadataSnapshotFile(partitionDir);;
:try {snapshotFile.read().ifPresent(snapshot->loadRemoteLogSegmentMetadata(snapshot));
:}catch (IOExceptione){throw new KafkaException(e);};
end
start
note right
void loadRemoteLogSegmentMetadata(RemoteLogMetadataSnapshotFile.Snapshotsnapshot)
end note
:log.info("Loading snapshot for partition {} is: {}",
topicIdPartition,snapshot);;
:switch (metadataSnapshot.state()){case COPY_SEGMENT_STARTED:addCopyInProgressSegment(createRemoteLogSegmentMetadata(metadataSnapshot));
:break ;case COPY_SEGMENT_FINISHED:handleSegmentWithCopySegmentFinishedState(createRemoteLogSegmentMetadata(metadataSnapshot));
:break ;case DELETE_SEGMENT_STARTED:handleSegmentWithDeleteSegmentStartedState(createRemoteLogSegmentMetadata(metadataSnapshot));
:break ;case DELETE_SEGMENT_FINISHED:default :throw new IllegalArgumentException("Given remoteLogSegmentMetadata has invalid state: "+
metadataSnapshot);};
end
start
note right
RemoteLogSegmentMetadatacreateRemoteLogSegmentMetadata(RemoteLogSegmentMetadataSnapshotsnapshot)
end note
:return new RemoteLogSegmentMetadata(new RemoteLogSegmentId(topicIdPartition,
snapshot.segmentId()),snapshot.startOffset(),
snapshot.endOffset(),snapshot.maxTimestampMs(),
snapshot.brokerId(),snapshot.eventTimestampMs(),
snapshot.segmentSizeInBytes(),snapshot.state(),
snapshot.segmentLeaderEpochs());;
stop
end
start
note right
void flushToFile(intmetadataPartition,LongmetadataPartitionOffset)
end note
:snapshots.add(RemoteLogSegmentMetadataSnapshot.create(idToSegmentMetadata.get(id)));;
:snapshots.add(RemoteLogSegmentMetadataSnapshot.create(idToSegmentMetadata.get(id)));;
:snapshotFile.write(new RemoteLogMetadataSnapshotFile.Snapshot(metadataPartition,
metadataPartitionOffset,snapshots));;
end
@enduml

