="1023.5,926.2188,1027.5,936.2188,1031.5,926.2188,1027.5,930.2188" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="1027.5" x2="1027.5" y1="970.1875" y2="990.1875"/><polygon fill="#181818" points="1023.5,980.1875,1027.5,990.1875,1031.5,980.1875,1027.5,984.1875" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[fc06d26d1fa36ab2c37b705a2dab66e2]
@startuml
!pragma layout smetana
start
note right
constructor FileBasedRemoteLogMetadataCache(TopicIdPartitiontopicIdPartition,PathpartitionDir)
end note
if (!partitionDir.toFile().exists()||!partitionDir.toFile().isDirectory()) then (yes) 
endif 
:this.topicIdPartition=topicIdPartition;
:snapshotFile=new RemoteLogMetadataSnapshotFile(partitionDir);
:snapshotFile.read().ifPresent(snapshot->loadRemoteLogSegmentMetadata(snapshot));
end
start
note right
void loadRemoteLogSegmentMetadata(RemoteLogMetadataSnapshotFile.Snapshotsnapshot)
end note
:log.info("Loading snapshot for partition {} is: {}",topicIdPartition,snapshot);
:addCopyInProgressSegment(createRemoteLogSegmentMetadata(metadataSnapshot));
:handleSegmentWithCopySegmentFinishedState(createRemoteLogSegmentMetadata(metadataSnapshot));
:handleSegmentWithDeleteSegmentStartedState(createRemoteLogSegmentMetadata(metadataSnapshot));
end
start
note right
RemoteLogSegmentMetadatacreateRemoteLogSegmentMetadata(RemoteLogSegmentMetadataSnapshotsnapshot)
end note
:return new RemoteLogSegmentMetadata(new RemoteLogSegmentId(topicIdPartition,snapshot.segmentId()),snapshot.startOffset(),snapshot.endOffset(),snapshot.maxTimestampMs(),snapshot.brokerId(),snapshot.eventTimestampMs(),snapshot.segmentSizeInBytes(),snapshot.state(),snapshot.segmentLeaderEpochs());;
stop
end
start
note right
void flushToFile(intmetadataPartition,LongmetadataPartitionOffset)
end note
:snapshots.add(RemoteLogSegmentMetadataSnapshot.create(idToSegmentMetadata.get(id)));
:snapshots.add(RemoteLogSegmentMetadataSnapshot.create(idToSegmentMetadata.get(id)));
:snapshotFile.write(new RemoteLogMetadataSnapshotFile.Snapshot(metadataPartition,metadataPartitionOffset,snapshots));
end
@enduml

