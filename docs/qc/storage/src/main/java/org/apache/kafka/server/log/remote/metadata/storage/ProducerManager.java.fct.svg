@startuml
!pragma layout smetana
start
note right
constructor ProducerManager(TopicBasedRemoteLogMetadataManagerConfigrlmmConfig,
RemoteLogMetadataTopicPartitionerrlmmTopicPartitioner)
end note
:this.rlmmConfig=rlmmConfig;
:this.producer=new KafkaProducer<>(rlmmConfig.producerProperties());
:topicPartitioner=rlmmTopicPartitioner;
end
start
note right
CompletableFuture<RecordMetadata>publishMessage(RemoteLogMetadataremoteLogMetadata)
end note
:log.debug("Publishing metadata message of partition:[{}] into metadata topic partition:[{}] with payload: [{}]",topicIdPartition,metadataPartitionNum,remoteLogMetadata);
if (metadataPartitionNum>=rlmmConfig.metadataTopicPartitionsCount()) then (yes) 
:throw new KafkaException("Chosen partition no "+metadataPartitionNum+" must be less than the partition count: "+rlmmConfig.metadataTopicPartitionsCount());;
endif 
start
note right
void onCompletion(RecordMetadatametadata,
Exceptionexception)
end note
if (exception!=null ) then (yes) 
:future.completeExceptionally(exception);
else (no)
:future.complete(metadata);
endif 
end
:producer.send(new ProducerRecord<>(rlmmConfig.remoteLogMetadataTopicName(),
metadataPartitionNum,null ,serde.serialize(remoteLogMetadata)),
callback);
:future.completeExceptionally(ex);
:return future;;
stop
end
start
note right
void close()
end note
:producer.close(Duration.ofSeconds(30));
:log.error("Error encountered while closing the producer",
e);
end
@enduml

