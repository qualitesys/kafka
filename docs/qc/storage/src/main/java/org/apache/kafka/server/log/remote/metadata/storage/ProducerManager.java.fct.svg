@startuml
!pragma layout smetana
start
note right
constructor ProducerManager(TopicBasedRemoteLogMetadataManagerConfigrlmmConfig,
RemoteLogMetadataTopicPartitionerrlmmTopicPartitioner)
end note
:this.rlmmConfig=rlmmConfig;;
:this.producer=new KafkaProducer<>(rlmmConfig.producerProperties());;
:topicPartitioner=rlmmTopicPartitioner;;
end
start
note right
CompletableFuture<RecordMetadata>publishMessage(RemoteLogMetadataremoteLogMetadata)
end note
:CompletableFuture<RecordMetadata>future=new CompletableFuture<>();;
:TopicIdPartitiontopicIdPartition=remoteLogMetadata.topicIdPartition();;
:intmetadataPartitionNum=topicPartitioner.metadataPartition(topicIdPartition);;
:log.debug("Publishing metadata message of partition:[{}] into metadata topic partition:[{}] with payload: [{}]",
topicIdPartition,metadataPartitionNum,remoteLogMetadata);;
if (metadataPartitionNum>=rlmmConfig.metadataTopicPartitionsCount()) then (yes) 
:throw new KafkaException("Chosen partition no "+
metadataPartitionNum+" must be less than the partition count: "+
rlmmConfig.metadataTopicPartitionsCount());;
stop
endif 
:try ;
:Callbackcallback=new Callback(){@Override public void onCompletion(RecordMetadatametadata,
Exceptionexception){if (exception!=null ){future.completeExceptionally(exception);}else {future.complete(metadata);}}};;
:producer.send(new ProducerRecord<>(rlmmConfig.remoteLogMetadataTopicName(),
metadataPartitionNum,null ,serde.serialize(remoteLogMetadata)),
callback);;
:catch (Exceptionex);
:future.completeExceptionally(ex);;
:return future;;
stop
end
start
note right
void close()
end note
:try ;
:producer.close(Duration.ofSeconds(30));;
:catch (Exceptione);
:log.error("Error encountered while closing the producer",e);;
end
@enduml

