longoffset)
end note
:RemoteLogLeaderEpochStateremoteLogLeaderEpochState=leaderEpochEntries.get(leaderEpoch);;
if (remoteLogLeaderEpochState==null ) then (yes) 
:return Optional.empty();;
stop
