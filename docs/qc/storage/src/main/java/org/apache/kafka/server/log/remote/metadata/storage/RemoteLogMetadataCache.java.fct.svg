start
note right
void addCopyInProgressSegment(RemoteLogSegmentMetadataremoteLogSegmentMetadata)
end note
:log.debug("Adding to in-progress state: [{}]",
remoteLogSegmentMetadata);;
:Objects.requireNonNull(remoteLogSegmentMetadata,
"remoteLogSegmentMetadata can not be null");;
if (remoteLogSegmentMetadata.state()!=RemoteLogSegmentState.COPY_SEGMENT_STARTED) then (yes) 
:throw new IllegalArgumentException("Given remoteLogSegmentMetadata:"+
remoteLogSegmentMetadata+" should have state as "+
RemoteLogSegmentState.COPY_SEGMENT_STARTED+
" but it contains state as: "+remoteLogSegmentMetadata.state());;
stop
endif 
:RemoteLogSegmentIdremoteLogSegmentId=remoteLogSegmentMetadata.remoteLogSegmentId();;
:RemoteLogSegmentMetadataexistingMetadata=idToSegmentMetadata.get(remoteLogSegmentId);;
:checkStateTransition(existingMetadata!=null ? existingMetadata.state():null ,
remoteLogSegmentMetadata.state());;
:leaderEpochEntries.computeIfAbsent(epoch,
leaderEpoch->new RemoteLogLeaderEpochState()).handleSegmentWithCopySegmentStartedState(remoteLogSegmentId);;
:idToSegmentMetadata.put(remoteLogSegmentId,
remoteLogSegmentMetadata);;
end
start
note right
void checkStateTransition(RemoteLogSegmentStateexistingState,
RemoteLogSegmentStatetargetState)
end note
if (!RemoteLogSegmentState.isValidTransition(existingState,
targetState)) then (yes) 
:throw new IllegalStateException("Current state: "+
existingState+" can not be transitioned to target state: "+
targetState);;
stop
endif 
