end note
:doHandleSegmentStateTransitionForLeaderEpochs(remoteLogSegmentMetadata,
(leaderEpoch,remoteLogLeaderEpochState,startOffset,
segmentId)->{longleaderEpochEndOffset=highestOffsetForEpoch(leaderEpoch,
remoteLogSegmentMetadata);remoteLogLeaderEpochState.handleSegmentWithCopySegmentFinishedState(startOffset,
segmentId,leaderEpochEndOffset);});;
:idToSegmentMetadata.put(remoteLogSegmentMetadata.remoteLogSegmentId(),
