:Map.Entry<Integer,Long>nextEntry=metadata.segmentLeaderEpochs()
.higherEntry(leaderEpoch);;
:longepochEndOffset=(nextEntry!=null )? nextEntry.getValue()-1:metadata.endOffset();;
:return offset>epochEndOffset? Optional.empty():Optional.of(metadata);;
stop
end
start
note right
void updateRemoteLogSegmentMetadata(RemoteLogSegmentMetadataUpdatemetadataUpdate)
end note
:log.debug("Updating remote log segment metadata: [{}]",
metadataUpdate);;
:Objects.requireNonNull(metadataUpdate,"metadataUpdate can not be null");;
:RemoteLogSegmentStatetargetState=metadataUpdate.state();;
:RemoteLogSegmentIdremoteLogSegmentId=metadataUpdate.remoteLogSegmentId();;
:RemoteLogSegmentMetadataexistingMetadata=idToSegmentMetadata.get(remoteLogSegmentId);;
if (existingMetadata==null ) then (yes) 
:throw new RemoteResourceNotFoundException("No remote log segment metadata found for :"+
remoteLogSegmentId);;
stop
endif 
:checkStateTransition(existingMetadata.state(),
targetState);;
switch (switch (targetState))
endswith
end
start
