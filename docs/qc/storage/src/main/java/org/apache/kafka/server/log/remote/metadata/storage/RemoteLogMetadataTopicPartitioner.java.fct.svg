18" points="431,336.1406,435,346.1406,439,336.1406,435,340.1406" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="435" x2="435" y1="430.707" y2="453.2734"/><polygon fill="#181818" points="431,443.2734,435,453.2734,439,443.2734,435,447.2734" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="435" x2="435" y1="487.2422" y2="507.2422"/><polygon fill="#181818" points="431,497.2422,435,507.2422,439,497.2422,435,501.2422" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="435" x2="435" y1="591.8086" y2="614.375"/><polygon fill="#181818" points="431,604.375,435,614.375,439,604.375,435,608.375" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="435" x2="435" y1="648.3438" y2="668.3438"/><polygon fill="#181818" points="431,658.3438,435,668.3438,439,658.3438,435,662.3438" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[d8593d87bccf7d0efb6259333129d311]
@startuml
!pragma layout smetana
start
note right
constructor RemoteLogMetadataTopicPartitioner(intnumMetadataTopicPartitions)
end note
:this.numMetadataTopicPartitions=numMetadataTopicPartitions;
end
start
note right
intmetadataPartition(TopicIdPartitiontopicIdPartition)
end note
:Objects.requireNonNull(topicIdPartition,"TopicPartition can not be null");
:log.debug("No of partitions [{}], partitionNum: [{}] for given topic: [{}]",numMetadataTopicPartitions,partitionNum,topicIdPartition);
:return partitionNum;;
stop
end
start
note right
byte[]toBytes(TopicIdPartitiontopicIdPartition)
end note
:return toBytes(hash);;
stop
end
start
note right
byte[]toBytes(intn)
end note
:return new byte[]{(byte)(n>>24),(byte)(n>>16),(byte)(n>>8),(byte)n};;
stop
end
@enduml

