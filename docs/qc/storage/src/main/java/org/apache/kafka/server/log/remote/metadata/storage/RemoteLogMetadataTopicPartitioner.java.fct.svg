:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="347.5" x2="347.5" y1="512.6133" y2="535.1797"/><polygon fill="#181818" points="343.5,525.1797,347.5,535.1797,351.5,525.1797,347.5,529.1797" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="347.5" x2="347.5" y1="597.0859" y2="617.0859"/><polygon fill="#181818" points="343.5,607.0859,347.5,617.0859,351.5,607.0859,347.5,611.0859" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="347.5" x2="347.5" y1="651.0547" y2="671.0547"/><polygon fill="#181818" points="343.5,661.0547,347.5,671.0547,351.5,661.0547,347.5,665.0547" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="347.5" x2="347.5" y1="755.6211" y2="778.1875"/><polygon fill="#181818" points="343.5,768.1875,347.5,778.1875,351.5,768.1875,347.5,772.1875" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="347.5" x2="347.5" y1="826.125" y2="846.125"/><polygon fill="#181818" points="343.5,836.125,347.5,846.125,351.5,836.125,347.5,840.125" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[1c246bf4aed20c2643ae9799f912f0f8]
@startuml
!pragma layout smetana
start
note right
constructor RemoteLogMetadataTopicPartitioner(intnumMetadataTopicPartitions)
end note
:this.numMetadataTopicPartitions=numMetadataTopicPartitions;;
end
start
note right
intmetadataPartition(TopicIdPartitiontopicIdPartition)
end note
:Objects.requireNonNull(topicIdPartition,
"TopicPartition can not be null");;
:intpartitionNum=Utils.toPositive(Utils.murmur2(toBytes(topicIdPartition)))%numMetadataTopicPartitions;;
:log.debug("No of partitions [{}], partitionNum: [{}] for given topic: [{}]",
numMetadataTopicPartitions,partitionNum,topicIdPartition);;
:return partitionNum;;
stop
end
start
note right
byte[]toBytes(TopicIdPartitiontopicIdPartition)
end note
:inthash=Objects.hash(topicIdPartition.topicId().getLeastSignificantBits(),
topicIdPartition.topicId().getMostSignificantBits(),
topicIdPartition.partition());;
:return toBytes(hash);;
stop
end
start
note right
byte[]toBytes(intn)
end note
:return new byte[]{(byte)(n>>24),(byte)(n>>16),
(byte)(n>>8),(byte)n};;
stop
end
@enduml

