@startuml
!pragma layout smetana
start
note right
shortunsignedIntToShort(Readableinput,Stringentity)
end note
:throw new MetadataParseException("Error while reading "+
entity,e);;
if (val>Short.MAX_VALUE) then (yes) 
:throw new MetadataParseException("Value for "+
entity+" was too large.");;
endif 
:return (short)val;;
stop
end
start
note right
intrecordSize(ApiMessageAndVersiondata,ObjectSerializationCacheserializationCache)
end note
:return size;;
stop
end
start
note right
void write(ApiMessageAndVersiondata,ObjectSerializationCacheserializationCache,
Writableout)
end note
end
start
note right
ApiMessageAndVersionread(Readableinput,intsize)
end note
if (frameVersion==0) then (yes) 
:throw new MetadataParseException("Could not deserialize metadata record with frame version 0. "+
"Note that upgrades from the preview release of KRaft in 2.8 to newer versions are not supported.");;
endif 
:throw new MetadataParseException(e);;
:throw new MetadataParseException("Failed to deserialize record with type "+
apiKey,e);;
if (input.remaining()>0) then (yes) 
:throw new MetadataParseException("Found "+
input.remaining()+" byte(s) of garbage after "+
apiKey);;
endif 
:return new ApiMessageAndVersion(record,version);;
stop
end
@enduml

