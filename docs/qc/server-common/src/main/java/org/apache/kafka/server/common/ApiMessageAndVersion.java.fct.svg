@startuml
!pragma layout smetana
start
note right
constructor ApiMessageAndVersion(ApiMessage message,
short version)
end note
:this.message=message;;
:this.version=version;;
end
start
note right
ApiMessage message()
end note
:return message;;
stop
end
start
note right
short version()
end note
:return version;;
stop
end
start
note right
boolean equals(Object o)
end note
if (this==o) then (yes) 
:return true;;
stop
endif 
if (o==null ||getClass()!=o.getClass()) then (yes) 
:return false;;
stop
endif 
:ApiMessageAndVersion that=(ApiMessageAndVersion )o;;
:return version==that.version&&Objects.equals(message,
