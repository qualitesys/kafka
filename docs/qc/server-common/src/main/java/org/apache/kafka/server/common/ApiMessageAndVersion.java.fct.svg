e="stroke:#181818;stroke-width:1.0;"/><!--MD5=[d47e5652dd91f8af854361f1e3c3901b]
@startuml
!pragma layout smetana
start
note right
constructor ApiMessageAndVersion(ApiMessagemessage,shortversion)
end note
:this.message=message;
:this.version=version;
end
start
note right
ApiMessagemessage()
end note
:return message;;
stop
end
start
note right
shortversion()
end note
:return version;;
stop
end
start
note right
booleanequals(Objecto)
end note
if (this==o) then (yes) 
:return true;;
stop
endif 
if (o==null ||getClass()!=o.getClass()) then (yes) 
:return false;;
stop
endif 
:return version==that.version&&Objects.equals(message,that.message);;
stop
end
start
note right
inthashCode()
end note
:return Objects.hash(message,version);;
stop
end
start
note right
StringtoString()
end note
:return "ApiMessageAndVersion("+message+" at version "+version+")";;
stop
end
@enduml

