.8398"/><polygon fill="#181818" points="242,464.8398,246,474.8398,250,464.8398,246,468.8398" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="246" x2="246" y1="508.8086" y2="528.8086"/><polygon fill="#181818" points="242,518.8086,246,528.8086,250,518.8086,246,522.8086" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="246" x2="246" y1="590.7148" y2="610.7148"/><polygon fill="#181818" points="242,600.7148,246,610.7148,250,600.7148,246,604.7148" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[4999c7f0a7ee84bea422cdd989b4f238]
@startuml
!pragma layout smetana
start
note right
constructor FilteringJmxReporter(MetricsRegistryregistry,
Predicate<MetricName>metricPredicate)
end note
:super (registry);;
:this.metricPredicate=metricPredicate;;
end
start
note right
void onMetricAdded(MetricNamename,Metricmetric)
end note
if (metricPredicate.test(name)) then (yes) 
:super .onMetricAdded(name,metric);;
endif 
end
start
note right
void updatePredicate(Predicate<MetricName>predicate)
end note
:this.metricPredicate=predicate;;
:getMetricsRegistry().allMetrics().forEach((name,
metric)->{if (metricPredicate.test(name)){super .onMetricAdded(name,
metric);}else {super .onMetricRemoved(name);}});;
end
@enduml

