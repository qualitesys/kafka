81818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="246" x2="246" y1="493.6758" y2="513.6758"/><polygon fill="#181818" points="242,503.6758,246,513.6758,250,503.6758,246,507.6758" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="246" x2="246" y1="575.582" y2="595.582"/><polygon fill="#181818" points="242,585.582,246,595.582,250,585.582,246,589.582" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[12bd59efc3abac5ef923b82336f7b417]
@startuml
!pragma layout smetana
start
note right
constructor FilteringJmxReporter(MetricsRegistryregistry,Predicate<MetricName>metricPredicate)
end note
:super (registry);
:this.metricPredicate=metricPredicate;
end
start
note right
void onMetricAdded(MetricNamename,Metricmetric)
end note
if (metricPredicate.test(name)) then (yes) 
:super .onMetricAdded(name,metric);
endif 
end
start
note right
void updatePredicate(Predicate<MetricName>predicate)
end note
:this.metricPredicate=predicate;
:getMetricsRegistry().allMetrics().forEach((name,
metric)->{if (metricPredicate.test(name)){super .onMetricAdded(name,
metric);}else {super .onMetricRemoved(name);}});
end
@enduml

