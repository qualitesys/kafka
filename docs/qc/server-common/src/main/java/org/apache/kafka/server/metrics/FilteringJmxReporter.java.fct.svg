e-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="555.5" x2="555.5" y1="493.6758" y2="513.6758"/><polygon fill="#181818" points="551.5,503.6758,555.5,513.6758,559.5,503.6758,555.5,507.6758" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="555.5" x2="555.5" y1="547.6445" y2="567.6445"/><polygon fill="#181818" points="551.5,557.6445,555.5,567.6445,559.5,557.6445,555.5,561.6445" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[83e462ba895b412051fdc772170e2b17]
@startuml
!pragma layout smetana
start
note right
constructor FilteringJmxReporter(MetricsRegistryregistry,Predicate<MetricName>metricPredicate)
end note
:super (registry);
:this.metricPredicate=metricPredicate;
end
start
note right
void onMetricAdded(MetricNamename,Metricmetric)
end note
if (metricPredicate.test(name)) then (yes) 
:super .onMetricAdded(name,metric);
endif 
end
start
note right
void updatePredicate(Predicate<MetricName>predicate)
end note
:this.metricPredicate=predicate;
:getMetricsRegistry().allMetrics().forEach((name,metric)->{if (metricPredicate.test(name)){super .onMetricAdded(name,metric);}else {super .onMetricRemoved(name);}});
end
@enduml

