@startuml
!pragma layout smetana
start
note right
void ensureValid(String name,Object value)
end note
switch (try/catch block)
case (try)
:MetadataVersion.fromVersionString(value.toString());;
case (catch (IllegalArgumentException e))
:throw new ConfigException(name,value.toString(),
e.getMessage());;
stop
endswitch
end
start
note right
String toString()
end note
:return "["+Arrays.stream(MetadataVersion.VERSIONS).map(MetadataVersion::version).collect(Collectors.joining(", "))+
"]";;
stop
end
@enduml

