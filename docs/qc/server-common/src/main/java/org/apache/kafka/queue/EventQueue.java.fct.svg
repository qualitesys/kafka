@startuml
!pragma layout smetana
start
note right
constructor FailureLoggingEvent(Loggerlog)
end note
end
start
note right
void handleException(Throwablee)
end note
if (e instanceof RejectedExecutionException) then (yes) 
else (no)
endif 
end
start
note right
StringtoString()
end note
:return this.getClass().getSimpleName();;
stop
end
start
note right
OptionalLongapply(OptionalLongignored)
end note
:return OptionalLong.empty();;
stop
end
start
note right
constructor DeadlineFunction(longdeadlineNs)
end note
end
start
note right
OptionalLongapply(OptionalLongignored)
end note
:return OptionalLong.of(deadlineNs);;
stop
end
start
note right
constructor EarliestDeadlineFunction(longnewDeadlineNs)
end note
end
start
note right
OptionalLongapply(OptionalLongprevDeadlineNs)
end note
if (!prevDeadlineNs.isPresent()) then (yes) 
:return OptionalLong.of(newDeadlineNs);;
stop
else (no)
:return OptionalLong.of(newDeadlineNs);;
stop
endif 
end
start
note right
void run()
end note
end
