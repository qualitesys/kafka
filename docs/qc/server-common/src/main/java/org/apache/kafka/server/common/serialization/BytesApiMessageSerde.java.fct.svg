@startuml
!pragma layout smetana
start
note right
byte[] serialize(ApiMessageAndVersion messageAndVersion)
end note
:ObjectSerializationCache cache=new ObjectSerializationCache();;
:int size=apiMessageSerde.recordSize(messageAndVersion,
cache);;
:ByteBufferAccessor writable=new ByteBufferAccessor(ByteBuffer.allocate(size));;
:apiMessageSerde.write(messageAndVersion,
cache,writable);;
:return writable.buffer().array();;
stop
end
start
note right
ApiMessageAndVersion deserialize(byte[] data)
end note
:Readable readable=new ByteBufferAccessor(ByteBuffer.wrap(data));;
:return apiMessageSerde.read(readable,data.length);;
stop
end
@enduml

