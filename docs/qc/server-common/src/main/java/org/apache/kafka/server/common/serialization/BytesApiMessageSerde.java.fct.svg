@startuml
!pragma layout smetana
start
note right
byte[]serialize(ApiMessageAndVersionmessageAndVersion)
end note
:apiMessageSerde.write(messageAndVersion,cache,writable);
:return writable.buffer().array();;
stop
end
start
note right
ApiMessageAndVersiondeserialize(byte[]data)
end note
:return apiMessageSerde.read(readable,data.length);;
stop
end
@enduml

