@startuml
!pragma layout smetana
start
note right
byte[]serialize(ApiMessageAndVersionmessageAndVersion)
end note
:ObjectSerializationCachecache=new ObjectSerializationCache();;
:intsize=apiMessageSerde.recordSize(messageAndVersion,
cache);;
:ByteBufferAccessorwritable=new ByteBufferAccessor(ByteBuffer.allocate(size));;
:apiMessageSerde.write(messageAndVersion,
cache,writable);;
:return writable.buffer().array();;
stop
end
start
note right
ApiMessageAndVersiondeserialize(byte[]data)
end note
:Readablereadable=new ByteBufferAccessor(ByteBuffer.wrap(data));;
:return apiMessageSerde.read(readable,data.length);;
stop
end
@enduml

