@startuml
!pragma layout smetana
start
note right
constructor ErroneousCommandHandler(String message)
end note
:this.message=message;;
end
start
note right
void run(Optional<InteractiveShell> shell,
PrintWriter writer,MetadataNodeManager manager)
end note
:writer.println(message);;
end
start
note right
int hashCode()
end note
:return Objects.hashCode(message);;
stop
end
start
note right
boolean equals(Object other)
end note
if (!(other instanceof ErroneousCommandHandler )) then (yes) 
:return false;;
stop
endif 
:ErroneousCommandHandler o=(ErroneousCommandHandler )other;;
if (!Objects.equals(o.message,message)) then (yes) 
:return false;;
stop
endif 
:return true;;
stop
end
start
note right
String toString()
end note
:return "ErroneousCommandHandler("+message+
")";;
stop
end
@enduml

