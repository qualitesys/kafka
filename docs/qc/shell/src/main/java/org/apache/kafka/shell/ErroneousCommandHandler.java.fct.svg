@startuml
!pragma layout smetana
start
note right
constructor ErroneousCommandHandler(Stringmessage)
end note
:this.message=message;;
end
start
note right
void run(Optional<InteractiveShell>shell,
PrintWriterwriter,MetadataNodeManagermanager)
end note
:writer.println(message);;
end
start
note right
inthashCode()
end note
:return Objects.hashCode(message);;
stop
end
start
note right
booleanequals(Objectother)
end note
if (!(other instanceof ErroneousCommandHandler)) then (yes) 
:return false;;
stop
endif 
:ErroneousCommandHandlero=(ErroneousCommandHandler)other;;
if (!Objects.equals(o.message,message)) then (yes) 
:return false;;
stop
endif 
:return true;;
stop
end
start
note right
StringtoString()
end note
:return "ErroneousCommandHandler("+message+
")";;
stop
end
@enduml

