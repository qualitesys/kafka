@startuml
!pragma layout smetana
start
note right
constructor Commands(booleanaddShellCommands)
end note
if (addShellCommands||!type.shellOnly()) then (yes) 
endif 
end
start
note right
ArgumentParserparser()
end note
:return parser;;
stop
end
start
note right
HandlerparseCommand(List<String>arguments)
end note
while (true)
if (trimmedArguments.isEmpty()) then (yes) 
:return new NoOpCommandHandler();;
stop
endif 
if (!last.isEmpty()) then (yes) 
endif 
endwhile
:return new NoOpCommandHandler();;
stop
:return new ErroneousCommandHandler(e.getMessage());;
stop
if (!command.equals(trimmedArguments.get(0))) then (yes) 
:return new ErroneousCommandHandler("invalid choice: '"+
