@startuml
!pragma layout smetana
:typesMap.put(type.name(),type);;
:TYPES=Collections.unmodifiableNavigableMap(typesMap);;
start
note right
constructor Commands(booleanaddShellCommands)
end note
:this.parser=ArgumentParsers.newArgumentParser("",
false);;
if (addShellCommands||!type.shellOnly()) then (yes) 
:subParser.help(type.description());;
:type.addArguments(subParser);;
endif 
end
start
note right
ArgumentParserparser()
end note
:return parser;;
stop
end
start
note right
HandlerparseCommand(List<String>arguments)
end note
:while (true){if (trimmedArguments.isEmpty()){return new NoOpCommandHandler();
:}Stringlast=trimmedArguments.get(trimmedArguments.size()-1);
:if (!last.isEmpty()){break ;}trimmedArguments.remove(trimmedArguments.size()-1);};
:try {namespace=parser.parseArgs(trimmedArguments.toArray(new String[0]));
:}catch (HelpScreenExceptione){return new NoOpCommandHandler();
:}catch (ArgumentParserExceptione){return new ErroneousCommandHandler(e.getMessage());};
if (!command.equals(trimmedArguments.get(0))) then (yes) 
:return new ErroneousCommandHandler("invalid choice: '"+
trimmedArguments.get(0)+"': did you mean '"+
command+"'?");;
stop
endif 
if (type==null ) then (yes) 
:return new ErroneousCommandHandler("Unknown command specified: "+
command);;
stop
else (no)
:return type.createHandler(namespace);;
stop
endif 
end
@enduml

