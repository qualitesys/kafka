@startuml
!pragma layout smetana
start
note right
constructor BatchMemoryPool(intmaxBatches,
intbatchSize)
end note
end
start
note right
ByteBuffertryAllocate(intsizeBytes)
end note
if (sizeBytes>batchSize) then (yes) 
:throw new IllegalArgumentException("Cannot allocate buffers larger than max "+
"batch size of "+batchSize);;
endif 
if (buffer==null &&numAllocatedBatches<maxBatches) then (yes) 
endif 
:return buffer;;
stop
end
start
note right
void release(ByteBufferpreviouslyAllocated)
end note
if (previouslyAllocated.limit()!=batchSize) then (yes) 
:throw new IllegalArgumentException("Released buffer with unexpected size "+
previouslyAllocated.limit());;
endif 
end
start
note right
longsize()
end note
:return numAllocatedBatches*(long)batchSize;;
stop
end
start
note right
longavailableMemory()
end note
:return freeBatches*(long)batchSize;;
stop
end
start
note right
