@startuml
!pragma layout smetana
start
note right
constructor FileRawSnapshotReader(FileRecordsfileRecords,OffsetAndEpochsnapshotId)
end note
:this.fileRecords=fileRecords;
:this.snapshotId=snapshotId;
end
start
note right
OffsetAndEpochsnapshotId()
end note
:return snapshotId;;
stop
end
start
note right
longsizeInBytes()
end note
:return fileRecords.sizeInBytes();;
stop
end
start
note right
UnalignedRecordsslice(longposition,intsize)
end note
:return fileRecords.sliceUnaligned(Math.toIntExact(position),size);;
stop
end
start
note right
Recordsrecords()
end note
:return fileRecords;;
stop
end
start
note right
void close()
end note
:fileRecords.close();
end
start
note right
FileRawSnapshotReaderopen(PathlogDir,OffsetAndEpochsnapshotId)
end note
:fileRecords=FileRecords.open(filePath.toFile(),false,true,0,false);
:return new FileRawSnapshotReader(fileRecords,snapshotId);;
stop
end
@enduml

