="394,1274.625,398,1284.625,402,1274.625,398,1278.625" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[d84f08f5c3a47151579d626cfb85b8b8]
@startuml
!pragma layout smetana
start
note right
constructor FileRawSnapshotReader(FileRecordsfileRecords,
OffsetAndEpochsnapshotId)
end note
:this.fileRecords=fileRecords;
:this.snapshotId=snapshotId;
end
start
note right
OffsetAndEpochsnapshotId()
end note
:return snapshotId;;
stop
end
start
note right
longsizeInBytes()
end note
:return fileRecords.sizeInBytes();;
stop
end
start
note right
UnalignedRecordsslice(longposition,intsize)
end note
:return fileRecords.sliceUnaligned(Math.toIntExact(position),
size);;
stop
end
start
note right
Recordsrecords()
end note
:return fileRecords;;
stop
end
start
note right
void close()
end note
:fileRecords.close();
:throw new UncheckedIOException(String.format("Unable to close snapshot reader %s at %s",snapshotId,fileRecords),e);;
end
start
note right
FileRawSnapshotReaderopen(PathlogDir,OffsetAndEpochsnapshotId)
end note
:fileRecords=FileRecords.open(filePath.toFile(),
false,true,0,false);
:throw new UncheckedIOException(String.format("Unable to Opens a snapshot file %s",filePath.toAbsolutePath()),e);;
:return new FileRawSnapshotReader(fileRecords,
snapshotId);;
stop
end
@enduml

