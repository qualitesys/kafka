@startuml
!pragma layout smetana
start
note right
constructor MemoryBatchReader(longbaseOffset,longlastOffset,Iterator<Batch<T>>iterator,CloseListener<BatchReader<T>>closeListener)
end note
:this.baseOffset=baseOffset;
:this.lastOffset=lastOffset;
:this.iterator=iterator;
:this.closeListener=closeListener;
end
start
note right
booleanhasNext()
end note
:return iterator.hasNext();;
stop
end
start
note right
Batch<T>next()
end note
:return iterator.next();;
stop
end
start
note right
longbaseOffset()
end note
:return baseOffset;;
stop
end
start
note right
OptionalLonglastOffset()
end note
:return OptionalLong.of(lastOffset);;
stop
end
start
note right
void close()
end note
:closeListener.onClose(this);
end
:return new MemoryBatchReader<>(baseOffset,
lastOffset,Collections.emptyIterator(),closeListener);;
stop
if (batches.isEmpty()) then (yes) 
:throw new IllegalArgumentException("MemoryBatchReader requires at least "+
"one batch to iterate, but an empty list was provided");;
endif 
:return new MemoryBatchReader<>(batches.get(0).baseOffset(),
batches.get(batches.size()-1).lastOffset(),
batches.iterator(),closeListener);;
stop
@enduml

