@startuml
!pragma layout smetana
start
note right
constructor SnapshotPath(Pathpath,OffsetAndEpochsnapshotId,
booleanpartial,booleandeleted)
end note
:this.path=path;
:this.snapshotId=snapshotId;
:this.partial=partial;
:this.deleted=deleted;
end
start
note right
StringtoString()
end note
:return String.format("SnapshotPath(path=%s,
 snapshotId=%s, partial=%s)",path,snapshotId,
partial);;
stop
end
@enduml

