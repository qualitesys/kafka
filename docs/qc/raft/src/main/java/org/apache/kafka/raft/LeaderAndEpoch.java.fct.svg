@startuml
!pragma layout smetana
start
note right
constructor LeaderAndEpoch(OptionalIntleaderId,intepoch)
end note
:this.leaderId=Objects.requireNonNull(leaderId);
:this.epoch=epoch;
end
start
note right
OptionalIntleaderId()
end note
:return leaderId;;
stop
end
start
note right
intepoch()
end note
:return epoch;;
stop
end
start
note right
booleanisLeader(intnodeId)
end note
:return leaderId.isPresent()&&leaderId.getAsInt()==nodeId;;
stop
end
start
note right
booleanequals(Objecto)
end note
if (this==o) then (yes) 
:return true;;
stop
endif 
if (o==null ||getClass()!=o.getClass()) then (yes) 
:return false;;
stop
endif 
:return epoch==that.epoch&&leaderId.equals(that.leaderId);;
stop
end
start
note right
inthashCode()
end note
:return Objects.hash(leaderId,epoch);;
stop
end
start
note right
StringtoString()
end note
:return "LeaderAndEpoch("+"leaderId="+leaderId+
", epoch="+epoch+')';;
stop
end
@enduml

