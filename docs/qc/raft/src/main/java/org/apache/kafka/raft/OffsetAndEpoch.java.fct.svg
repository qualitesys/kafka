@startuml
!pragma layout smetana
start
note right
constructor OffsetAndEpoch(longoffset,intepoch)
end note
end
start
note right
booleanequals(Objecto)
end note
if (this==o) then (yes) 
:return true;;
stop
endif 
if (o==null ||getClass()!=o.getClass()) then (yes) 
:return false;;
stop
endif 
if (offset!=that.offset) then (yes) 
:return false;;
stop
endif 
:return epoch==that.epoch;;
stop
end
start
note right
inthashCode()
end note
:return result;;
stop
end
start
note right
StringtoString()
end note
:return "OffsetAndEpoch("+"offset="+offset+
", epoch="+epoch+')';;
stop
end
start
note right
intcompareTo(OffsetAndEpocho)
end note
if (epoch==o.epoch) then (yes) 
:return Long.compare(offset,o.offset);;
stop
endif 
:return Integer.compare(epoch,o.epoch);;
stop
end
@enduml

