="259" x="5" y="544.1875">:fetchingSnapshot.get().close();;</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" text-decoration="wavy underline" textLength="40" x="5" y="560.4844">endif</text><text fill="#FF0000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="106" x="10" y="576.7813">Cannot find if</text><!--MD5=[ee224cbf8287a20b34226e97f9141aa7]
@startuml
!pragma layout smetana
start
note right
constructor FollowerState(Timetime,intepoch,
intleaderId,Set<Integer>voters,Optional<LogOffsetMetadata>highWatermark,
intfetchTimeoutMs,LogContextlogContext)
end note
:this.fetchTimeoutMs=fetchTimeoutMs;;
:this.epoch=epoch;;
:this.leaderId=leaderId;;
:this.voters=voters;;
:this.fetchTimer=time.timer(fetchTimeoutMs);;
:this.highWatermark=highWatermark;;
:this.fetchingSnapshot=Optional.empty();;
:this.log=logContext.logger(FollowerState.class );;
end
start
note right
ElectionStateelection()
end note
:return new ElectionState(epoch,OptionalInt.of(leaderId),
OptionalInt.empty(),voters);;
stop
end
start
note right
intepoch()
end note
:return epoch;;
stop
end
start
note right
Stringname()
end note
:return "Follower";;
stop
end
start
note right
longremainingFetchTimeMs(longcurrentTimeMs)
end note
:fetchTimer.update(currentTimeMs);;
:return fetchTimer.remainingMs();;
stop
end
start
note right
intleaderId()
end note
:return leaderId;;
stop
end
start
note right
booleanhasFetchTimeoutExpired(longcurrentTimeMs)
end note
:fetchTimer.update(currentTimeMs);;
:return fetchTimer.isExpired();;
stop
end
start
note right
void resetFetchTimeout(longcurrentTimeMs)
end note
:fetchTimer.update(currentTimeMs);;
:fetchTimer.reset(fetchTimeoutMs);;
end
start
note right
void overrideFetchTimeout(longcurrentTimeMs,
longtimeoutMs)
end note
:fetchTimer.update(currentTimeMs);;
:fetchTimer.reset(timeoutMs);;
end
start
note right
booleanupdateHighWatermark(OptionalLonghighWatermark)
end note
if (!highWatermark.isPresent()&&this.highWatermark.isPresent()) then (yes) 
:throw new IllegalArgumentException("Attempt to overwrite current high watermark "+
this.highWatermark+" with unknown value");;
stop
endif 
if (this.highWatermark.isPresent()) then (yes) 
:longpreviousHighWatermark=this.highWatermark.get()
.offset;;
:longupdatedHighWatermark=highWatermark.getAsLong();;
if (updatedHighWatermark<0) then (yes) 
:throw new IllegalArgumentException("Illegal negative high watermark update");;
stop
endif 
if (previousHighWatermark>updatedHighWatermark) then (yes) 
:throw new IllegalArgumentException("Non-monotonic update of high watermark attempted");;
stop
endif 
if (previousHighWatermark==updatedHighWatermark) then (yes) 
:return false;;
stop
endif 
endif 
:this.highWatermark=highWatermark.isPresent()? Optional.of(new LogOffsetMetadata(highWatermark.getAsLong())):Optional.empty();;
:return true;;
stop
end
start
note right
Optional<LogOffsetMetadata>highWatermark()
end note
:return highWatermark;;
stop
end
start
note right
Optional<RawSnapshotWriter>fetchingSnapshot()
end note
:return fetchingSnapshot;;
stop
end
start
note right
void setFetchingSnapshot(Optional<RawSnapshotWriter>newSnapshot)
end note
if (fetchingSnapshot.isPresent()) then (yes) 
:fetchingSnapshot.get().close();;
endif 
:fetchingSnapshot=newSnapshot;;
end
start
note right
booleancanGrantVote(intcandidateId,booleanisLogUpToDate)
end note
:log.debug("Rejecting vote request from candidate {} since we already have a leader {} in epoch {}",
candidateId,leaderId(),epoch);;
:return false;;
stop
end
start
note right
StringtoString()
end note
:return "FollowerState("+"fetchTimeoutMs="+
fetchTimeoutMs+", epoch="+epoch+", leaderId="+
leaderId+", voters="+voters+", highWatermark="+
highWatermark+", fetchingSnapshot="+fetchingSnapshot+
')';;
stop
end
start
note right
void close()
end note
if (fetchingSnapshot.isPresent()) then (yes) 
:fetchingSnapshot.get().close();;
endif 
end
@enduml

