@startuml
!pragma layout smetana
start
note right
constructor FollowerState(Timetime,intepoch,
intleaderId,Set<Integer>voters,Optional<LogOffsetMetadata>highWatermark,
intfetchTimeoutMs,LogContextlogContext)
end note
end
start
note right
ElectionStateelection()
end note
:return new ElectionState(epoch,OptionalInt.of(leaderId),
OptionalInt.empty(),voters);;
stop
end
start
note right
intepoch()
end note
:return epoch;;
stop
end
start
note right
Stringname()
end note
:return "Follower";;
stop
end
start
note right
longremainingFetchTimeMs(longcurrentTimeMs)
end note
:return fetchTimer.remainingMs();;
stop
end
start
note right
intleaderId()
end note
:return leaderId;;
stop
end
start
note right
booleanhasFetchTimeoutExpired(longcurrentTimeMs)
end note
:return fetchTimer.isExpired();;
stop
end
start
note right
void resetFetchTimeout(longcurrentTimeMs)
end note
end
start
note right
void overrideFetchTimeout(longcurrentTimeMs,
longtimeoutMs)
end note
end
start
note right
booleanupdateHighWatermark(OptionalLonghighWatermark)
end note
if (!highWatermark.isPresent()&&this.highWatermark.isPresent()) then (yes) 
:throw new IllegalArgumentException("Attempt to overwrite current high watermark "+
this.highWatermark+" with unknown value");;
endif 
if (this.highWatermark.isPresent()) then (yes) 
if (updatedHighWatermark<0) then (yes) 
:throw new IllegalArgumentException("Illegal negative high watermark update");;
endif 
if (previousHighWatermark>updatedHighWatermark) then (yes) 
:throw new IllegalArgumentException("Non-monotonic update of high watermark attempted");;
endif 
if (previousHighWatermark==updatedHighWatermark) then (yes) 
:return false;;
stop
endif 
endif 
:return true;;
stop
end
start
note right
Optional<LogOffsetMetadata>highWatermark()
end note
:return highWatermark;;
stop
end
start
note right
Optional<RawSnapshotWriter>fetchingSnapshot()
end note
:return fetchingSnapshot;;
stop
end
start
note right
void setFetchingSnapshot(Optional<RawSnapshotWriter>newSnapshot)
end note
if (fetchingSnapshot.isPresent()) then (yes) 
endif 
end
start
note right
booleancanGrantVote(intcandidateId,booleanisLogUpToDate)
end note
:return false;;
stop
end
start
note right
StringtoString()
end note
:return "FollowerState("+"fetchTimeoutMs="+
fetchTimeoutMs+", epoch="+epoch+", leaderId="+
leaderId+", voters="+voters+", highWatermark="+
highWatermark+", fetchingSnapshot="+fetchingSnapshot+
')';;
stop
end
start
note right
void close()
end note
if (fetchingSnapshot.isPresent()) then (yes) 
endif 
end
@enduml

