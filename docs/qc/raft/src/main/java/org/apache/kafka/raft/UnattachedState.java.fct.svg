@startuml
!pragma layout smetana
start
note right
constructor UnattachedState(Timetime,intepoch,
Set<Integer>voters,Optional<LogOffsetMetadata>highWatermark,
longelectionTimeoutMs,LogContextlogContext)
end note
:this.epoch=epoch;;
:this.voters=voters;;
:this.highWatermark=highWatermark;;
:this.electionTimeoutMs=electionTimeoutMs;;
:this.electionTimer=time.timer(electionTimeoutMs);;
:this.log=logContext.logger(UnattachedState.class );;
end
start
note right
ElectionStateelection()
end note
:return new ElectionState(epoch,OptionalInt.empty(),
OptionalInt.empty(),voters);;
stop
end
start
note right
intepoch()
end note
:return epoch;;
stop
end
start
note right
Stringname()
end note
:return "Unattached";;
stop
end
start
note right
longelectionTimeoutMs()
end note
:return electionTimeoutMs;;
stop
end
start
note right
longremainingElectionTimeMs(longcurrentTimeMs)
end note
:electionTimer.update(currentTimeMs);;
:return electionTimer.remainingMs();;
stop
end
start
note right
booleanhasElectionTimeoutExpired(longcurrentTimeMs)
end note
:electionTimer.update(currentTimeMs);;
:return electionTimer.isExpired();;
stop
end
start
note right
Optional<LogOffsetMetadata>highWatermark()
end note
:return highWatermark;;
stop
end
start
note right
booleancanGrantVote(intcandidateId,booleanisLogUpToDate)
end note
if (!isLogUpToDate) then (yes) 
:log.debug("Rejecting vote request from candidate {} since candidate epoch/offset is not up to date with us",
candidateId);;
endif 
:return isLogUpToDate;;
stop
end
start
note right
StringtoString()
end note
:return "Unattached("+"epoch="+epoch+", voters="+
voters+", electionTimeoutMs="+electionTimeoutMs+
')';;
stop
end
start
note right
void close()
end note
end
@enduml

