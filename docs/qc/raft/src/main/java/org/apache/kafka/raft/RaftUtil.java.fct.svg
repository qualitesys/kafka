.setTopic(topicPartition.topic()).setTopicId(topicId).setPartitions(Collections.singletonList(fetchablePartition));;
:return new FetchResponseData().setErrorCode(topLevelError.code())
.setResponses(Collections.singletonList(fetchableTopic));;
stop
end
