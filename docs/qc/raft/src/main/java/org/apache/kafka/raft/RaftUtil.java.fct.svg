UuidtopicId,Consumer<FetchRequestData.FetchPartition>partitionConsumer)
end note
:FetchRequestData.FetchPartitionfetchPartition=new FetchRequestData.FetchPartition()
.setPartition(topicPartition.partition());;
:partitionConsumer.accept(fetchPartition);;
:FetchRequestData.FetchTopicfetchTopic=new FetchRequestData.FetchTopic()
.setTopic(topicPartition.topic()).setTopicId(topicId).setPartitions(singletonList(fetchPartition));;
:return new FetchRequestData().setTopics(singletonList(fetchTopic));;
stop
