@startuml
!pragma layout smetana
start
note right
constructor RaftRequest(intcorrelationId,
ApiMessagedata,longcreatedTimeMs)
end note
:this.correlationId=correlationId;;
:this.data=data;;
:this.createdTimeMs=createdTimeMs;;
end
start
note right
intcorrelationId()
end note
:return correlationId;;
stop
end
start
note right
ApiMessagedata()
end note
:return data;;
stop
end
start
note right
longcreatedTimeMs()
end note
:return createdTimeMs;;
stop
end
start
note right
constructor Inbound(intcorrelationId,ApiMessagedata,
longcreatedTimeMs)
end note
:super (correlationId,data,createdTimeMs);;
end
start
note right
StringtoString()
end note
:return "InboundRequest("+"correlationId="+
correlationId+", data="+data+", createdTimeMs="+
createdTimeMs+')';;
stop
end
start
note right
constructor Outbound(intcorrelationId,ApiMessagedata,
intdestinationId,longcreatedTimeMs)
end note
:super (correlationId,data,createdTimeMs);;
:this.destinationId=destinationId;;
end
start
note right
intdestinationId()
end note
:return destinationId;;
stop
end
start
note right
StringtoString()
end note
:return "OutboundRequest("+"correlationId="+
correlationId+", data="+data+", createdTimeMs="+
createdTimeMs+", destinationId="+destinationId+
')';;
stop
end
@enduml

