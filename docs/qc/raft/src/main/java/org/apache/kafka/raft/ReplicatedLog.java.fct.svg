@startuml
!pragma layout smetana
if (startOffset()==0&&offset==0) then (yes) 
:return ValidOffsetAndEpoch.valid(new OffsetAndEpoch(0,
0));;
stop
endif 
if (earliestSnapshotId.isPresent()&&((offset<startOffset())||(offset==startOffset()&&epoch!=earliestSnapshotId.get().epoch)||(epoch<earliestSnapshotId.get().epoch))) then (yes) 
:return ValidOffsetAndEpoch.snapshot(latestSnapshotId);;
stop
else (no)
if (endOffsetAndEpoch.epoch!=epoch||endOffsetAndEpoch.offset<offset) then (yes) 
:return ValidOffsetAndEpoch.diverging(endOffsetAndEpoch);;
stop
else (no)
:return ValidOffsetAndEpoch.valid(new OffsetAndEpoch(offset,
epoch));;
stop
endif 
endif 
if (leaderEpoch==0) then (yes) 
else (no)
if (localEndOffset.epoch==leaderEpoch) then (yes) 
else (no)
endif 
endif 
:return truncationOffset;;
stop
@enduml

