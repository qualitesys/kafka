@startuml
!pragma layout smetana
start
note right
constructor RaftResponse(intcorrelationId,
ApiMessagedata)
end note
end
start
note right
intcorrelationId()
end note
:return correlationId;;
stop
end
start
note right
ApiMessagedata()
end note
:return data;;
stop
end
start
note right
constructor Inbound(intcorrelationId,ApiMessagedata,
intsourceId)
end note
end
start
note right
intsourceId()
end note
:return sourceId;;
stop
end
start
note right
StringtoString()
end note
:return "InboundResponse("+"correlationId="+
correlationId+", data="+data+", sourceId="+
sourceId+')';;
stop
end
start
note right
constructor Outbound(intrequestId,ApiMessagedata)
end note
end
start
note right
StringtoString()
end note
:return "OutboundResponse("+"correlationId="+
correlationId+", data="+data+')';;
stop
end
@enduml

