@startuml
!pragma layout smetana
start
note right
constructor RaftResponse(int correlationId,
ApiMessage data)
end note
:this.correlationId=correlationId;;
:this.data=data;;
end
start
note right
int correlationId()
end note
:return correlationId;;
stop
end
start
note right
ApiMessage data()
end note
:return data;;
stop
end
start
note right
constructor Inbound(int correlationId,ApiMessage data,
int sourceId)
end note
:super (correlationId,data);;
:this.sourceId=sourceId;;
end
start
note right
int sourceId()
end note
:return sourceId;;
stop
end
start
note right
String toString()
end note
:return "InboundResponse("+"correlationId="+
correlationId+", data="+data+", sourceId="+
sourceId+')';;
stop
end
start
note right
constructor Outbound(int requestId,ApiMessage data)
end note
:super (requestId,data);;
end
start
note right
String toString()
end note
:return "OutboundResponse("+"correlationId="+
correlationId+", data="+data+')';;
stop
end
@enduml

