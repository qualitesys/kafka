@startuml
!pragma layout smetana
start
note right
constructor ThresholdPurgatory(ExpirationServiceexpirationService)
end note
:this.expirationService=expirationService;
end
start
note right
CompletableFuture<Long>await(Tthreshold,longmaxWaitTimeMs)
end note
:thresholdMap.put(key,future);
:future.whenComplete((timeMs,exception)->thresholdMap.remove(key));
:return future;;
stop
end
start
note right
void maybeComplete(Tvalue,longcurrentTimeMs)
end note
:completion.complete(currentTimeMs);
end
start
note right
void completeAll(longcurrentTimeMs)
end note
:completion.complete(currentTimeMs);
end
start
note right
void completeAllExceptionally(Throwableexception)
end note
:completion.completeExceptionally(exception);
end
start
note right
intnumWaiting()
end note
:return thresholdMap.size();;
stop
end
