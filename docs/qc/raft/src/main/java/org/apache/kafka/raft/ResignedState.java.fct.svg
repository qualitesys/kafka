@startuml
!pragma layout smetana
start
note right
constructor ResignedState(Timetime,intlocalId,intepoch,Set<Integer>voters,longelectionTimeoutMs,List<Integer>preferredSuccessors,LogContextlogContext)
end note
:this.localId=localId;
:this.epoch=epoch;
:this.voters=voters;
:this.unackedVoters=new HashSet<>(voters);
:this.unackedVoters.remove(localId);
:this.electionTimeoutMs=electionTimeoutMs;
:this.electionTimer=time.timer(electionTimeoutMs);
:this.preferredSuccessors=preferredSuccessors;
:this.log=logContext.logger(ResignedState.class );
end
start
note right
ElectionStateelection()
end note
:return ElectionState.withElectedLeader(epoch,
localId,voters);;
stop
end
start
note right
intepoch()
end note
:return epoch;;
stop
end
start
note right
Set<Integer>unackedVoters()
end note
:return unackedVoters;;
stop
end
start
note right
void acknowledgeResignation(intvoterId)
end note
if (!voters.contains(voterId)) then (yes) 
:throw new IllegalArgumentException("Attempt to acknowledge delivery of `EndQuorumEpoch` "+"by a non-voter "+voterId);;
endif 
:unackedVoters.remove(voterId);
end
start
note right
booleanhasElectionTimeoutExpired(longcurrentTimeMs)
end note
:electionTimer.update(currentTimeMs);
:return electionTimer.isExpired();;
stop
end
start
note right
longremainingElectionTimeMs(longcurrentTimeMs)
end note
:electionTimer.update(currentTimeMs);
:return electionTimer.remainingMs();;
stop
end
start
note right
List<Integer>preferredSuccessors()
end note
:return preferredSuccessors;;
stop
end
start
note right
booleancanGrantVote(intcandidateId,booleanisLogUpToDate)
end note
:log.debug("Rejecting vote request from candidate {} since we have resigned as candidate/leader in epoch {}",candidateId,epoch);
:return false;;
stop
end
start
note right
Stringname()
end note
:return "Resigned";;
stop
end
start
note right
StringtoString()
end note
:return "ResignedState("+"localId="+localId+
", epoch="+epoch+", voters="+voters+", electionTimeoutMs="+
electionTimeoutMs+", unackedVoters="+unackedVoters+
", preferredSuccessors="+preferredSuccessors+
')';;
stop
end
start
note right
void close()
end note
end
@enduml

