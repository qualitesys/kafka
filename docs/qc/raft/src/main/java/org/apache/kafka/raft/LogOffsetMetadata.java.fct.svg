@startuml
!pragma layout smetana
start
note right
constructor LogOffsetMetadata(longoffset)
end note
:this(offset,Optional.empty());
end
start
note right
constructor LogOffsetMetadata(longoffset,
Optional<OffsetMetadata>metadata)
end note
:this.offset=offset;
:this.metadata=metadata;
end
start
note right
StringtoString()
end note
:return "LogOffsetMetadata(offset="+offset+",
 metadata="+metadata+")";;
stop
end
start
note right
booleanequals(Objectobj)
end note
if (obj instanceof LogOffsetMetadata) then (yes) 
:return this.offset==other.offset&&this.metadata.equals(other.metadata);;
stop
else (no)
:return false;;
stop
endif 
end
start
note right
inthashCode()
end note
:return Objects.hash(offset,metadata);;
stop
end
@enduml

