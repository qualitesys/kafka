@startuml
!pragma layout smetana
start
note right
constructor LogOffsetMetadata(long offset)
end note
:this(offset,Optional.empty());;
end
start
note right
constructor LogOffsetMetadata(long offset,
Optional<OffsetMetadata> metadata)
end note
:this.offset=offset;;
:this.metadata=metadata;;
end
start
note right
String toString()
end note
:return "LogOffsetMetadata(offset="+offset+
", metadata="+metadata+")";;
stop
end
start
note right
boolean equals(Object obj)
end note
if (obj instanceof LogOffsetMetadata ) then (yes) 
:LogOffsetMetadata other=(LogOffsetMetadata )obj;;
:return this.offset==other.offset&&this.metadata.equals(other.metadata);;
stop
else (no)
:return false;;
stop
endif 
end
start
note right
int hashCode()
end note
:return Objects.hash(offset,metadata);;
stop
end
@enduml

