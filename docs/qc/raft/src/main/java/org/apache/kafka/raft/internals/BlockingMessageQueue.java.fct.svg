@startuml
!pragma layout smetana
start
note right
RaftMessage poll(long timeoutMs)
end note
switch (try/catch block)
case (try)
:RaftMessage message=queue.poll(timeoutMs,
TimeUnit.MILLISECONDS);;
if (message==null ||message==WAKEUP_MESSAGE) then (yes) 
:return null ;;
stop
else (no)
:size.decrementAndGet();;
:return message;;
stop
endif 
case (catch (InterruptedException e))
:throw new InterruptException(e);;
stop
endswitch
end
start
note right
void add(RaftMessage message)
end note
:queue.add(message);;
:size.incrementAndGet();;
end
start
note right
boolean isEmpty()
end note
:return size.get()==0;;
stop
end
start
note right
void wakeup()
end note
:queue.add(WAKEUP_MESSAGE);;
end
@enduml

