@startuml
!pragma layout smetana
start
note right
RaftMessagepoll(longtimeoutMs)
end note
if (message==null ||message==WAKEUP_MESSAGE) then (yes) 
:return null ;;
stop
else (no)
:return message;;
stop
endif 
:throw new InterruptException(e);;
end
start
note right
void add(RaftMessagemessage)
end note
end
start
note right
booleanisEmpty()
end note
:return size.get()==0;;
stop
end
start
note right
void wakeup()
end note
end
@enduml

