@startuml
!pragma layout smetana
start
note right
RaftMessagepoll(longtimeoutMs)
end note
switch (try/catch block)
case (try)
:RaftMessagemessage=queue.poll(timeoutMs,
TimeUnit.MILLISECONDS);;
if (message==null ||message==WAKEUP_MESSAGE) then (yes) 
:return null ;;
stop
else (no)
:size.decrementAndGet();;
:return message;;
stop
endif 
case (catch (InterruptedExceptione))
:throw new InterruptException(e);;
stop
endswitch
end
start
note right
void add(RaftMessagemessage)
end note
:queue.add(message);;
:size.incrementAndGet();;
end
start
note right
booleanisEmpty()
end note
:return size.get()==0;;
stop
end
start
note right
void wakeup()
end note
:queue.add(WAKEUP_MESSAGE);;
end
@enduml

