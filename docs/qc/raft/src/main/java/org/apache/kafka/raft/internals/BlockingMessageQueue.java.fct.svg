style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[7e58f61aa4982ebb88f5d3151387b478]
@startuml
!pragma layout smetana
start
note right
RaftMessagepoll(longtimeoutMs)
end note
:try {RaftMessagemessage=queue.poll(timeoutMs,
TimeUnit.MILLISECONDS);if (message==null ||message==WAKEUP_MESSAGE){return null ;}else {size.decrementAndGet();return message;}}catch (InterruptedExceptione){throw new InterruptException(e);};
end
start
note right
void add(RaftMessagemessage)
end note
:queue.add(message);;
:size.incrementAndGet();;
end
start
note right
booleanisEmpty()
end note
:return size.get()==0;;
stop
end
start
note right
void wakeup()
end note
:queue.add(WAKEUP_MESSAGE);;
end
@enduml

