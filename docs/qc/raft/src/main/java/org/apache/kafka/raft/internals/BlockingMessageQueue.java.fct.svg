1="521.2422" y2="541.2422"/><polygon fill="#181818" points="215.5,531.2422,219.5,541.2422,223.5,531.2422,219.5,535.2422" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="219.5" x2="219.5" y1="625.8086" y2="648.375"/><polygon fill="#181818" points="215.5,638.375,219.5,648.375,223.5,638.375,219.5,642.375" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="219.5" x2="219.5" y1="682.3438" y2="702.3438"/><polygon fill="#181818" points="215.5,692.3438,219.5,702.3438,223.5,692.3438,219.5,696.3438" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[d4775d9958992cbbd1bd61294682848e]
@startuml
!pragma layout smetana
start
note right
RaftMessagepoll(longtimeoutMs)
end note
if (message==null ||message==WAKEUP_MESSAGE) then (yes) 
:return null ;;
stop
else (no)
:size.decrementAndGet();
:return message;;
stop
endif 
end
start
note right
void add(RaftMessagemessage)
end note
:queue.add(message);
:size.incrementAndGet();
end
start
note right
booleanisEmpty()
end note
:return size.get()==0;;
stop
end
start
note right
void wakeup()
end note
:queue.add(WAKEUP_MESSAGE);
end
@enduml

