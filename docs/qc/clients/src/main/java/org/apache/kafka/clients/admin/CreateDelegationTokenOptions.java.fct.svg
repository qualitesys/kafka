@startuml
!pragma layout smetana
start
note right
CreateDelegationTokenOptionsrenewers(List<KafkaPrincipal>renewers)
end note
:return this;;
stop
end
start
note right
List<KafkaPrincipal>renewers()
end note
:return renewers;;
stop
end
start
note right
CreateDelegationTokenOptionsowner(KafkaPrincipalowner)
end note
:return this;;
stop
end
start
note right
Optional<KafkaPrincipal>owner()
end note
:return Optional.ofNullable(owner);;
stop
end
start
note right
CreateDelegationTokenOptionsmaxlifeTimeMs(longmaxLifeTimeMs)
end note
:return this;;
stop
end
start
note right
longmaxlifeTimeMs()
end note
:return maxLifeTimeMs;;
stop
end
@enduml

