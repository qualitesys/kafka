@startuml
!pragma layout smetana
start
note right
constructor Builder(HeartbeatRequestDatadata)
end note
end
start
note right
HeartbeatRequestbuild(shortversion)
end note
if (data.groupInstanceId()!=null &&version<3) then (yes) 
:throw new UnsupportedVersionException("The broker heartbeat protocol version "+
version+" does not support usage of config group.instance.id.");;
endif 
:return new HeartbeatRequest(data,version);;
stop
end
start
note right
StringtoString()
end note
:return data.toString();;
stop
end
start
note right
constructor HeartbeatRequest(HeartbeatRequestDatadata,
shortversion)
end note
end
start
note right
AbstractResponsegetErrorResponse(intthrottleTimeMs,
Throwablee)
end note
if (version()>=1) then (yes) 
endif 
:return new HeartbeatResponse(responseData);;
stop
end
start
note right
HeartbeatRequestparse(ByteBufferbuffer,shortversion)
end note
:return new HeartbeatRequest(new HeartbeatRequestData(new ByteBufferAccessor(buffer),
version),version);;
stop
end
start
note right
HeartbeatRequestDatadata()
end note
:return data;;
stop
end
@enduml

