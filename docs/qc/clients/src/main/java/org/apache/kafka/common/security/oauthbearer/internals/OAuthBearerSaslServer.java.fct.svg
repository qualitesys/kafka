@startuml
!pragma layout smetana
start
note right
constructor OAuthBearerSaslServer(CallbackHandlercallbackHandler)
end note
if (!(Objects.requireNonNull(callbackHandler) instanceof AuthenticateCallbackHandler)) then (yes) 
:throw new IllegalArgumentException(String.format("Callback handler must be castable to %s: %s",
AuthenticateCallbackHandler.class .getName(),
callbackHandler.getClass().getName()));;
endif 
:this.callbackHandler=(AuthenticateCallbackHandler)callbackHandler;
end
start
note right
byte[]evaluateResponse(byte[]response)
end note
if (response.length==1&&response[0]==OAuthBearerSaslClient.BYTE_CONTROL_A&&errorMessage!=null ) then (yes) 
:log.debug("Received %x01 response from client after it received our error");
:throw new SaslAuthenticationException(errorMessage);;
endif 
:errorMessage=null ;
:clientResponse=new OAuthBearerClientInitialResponse(response);
:log.debug(e.getMessage());
:throw e;;
:return process(clientResponse.tokenValue(),
clientResponse.authorizationId(),clientResponse.extensions());;
stop
end
start
note right
StringgetAuthorizationID()
end note
if (!complete) then (yes) 
:throw new IllegalStateException("Authentication exchange has not completed");;
endif 
:return tokenForNegotiatedProperty.principalName();;
stop
end
start
note right
StringgetMechanismName()
end note
:return OAuthBearerLoginModule.OAUTHBEARER_MECHANISM;;
stop
end
start
note right
ObjectgetNegotiatedProperty(StringpropName)
end note
if (!complete) then (yes) 
:throw new IllegalStateException("Authentication exchange has not completed");;
endif 
if (NEGOTIATED_PROPERTY_KEY_TOKEN.equals(propName)) then (yes) 
:return tokenForNegotiatedProperty;;
stop
endif 
if (SaslInternalConfigs.CREDENTIAL_LIFETIME_MS_SASL_NEGOTIATED_PROPERTY_KEY.equals(propName)) then (yes) 
:return tokenForNegotiatedProperty.lifetimeMs();;
stop
endif 
:return extensions.map().get(propName);;
stop
end
start
note right
booleanisComplete()
end note
:return complete;;
stop
end
start
note right
byte[]unwrap(byte[]incoming,intoffset,intlen)
end note
if (!complete) then (yes) 
:throw new IllegalStateException("Authentication exchange has not completed");;
endif 
:return Arrays.copyOfRange(incoming,offset,offset+
len);;
stop
end
start
note right
byte[]wrap(byte[]outgoing,intoffset,intlen)
end note
if (!complete) then (yes) 
:throw new IllegalStateException("Authentication exchange has not completed");;
endif 
:return Arrays.copyOfRange(outgoing,offset,offset+
len);;
stop
end
start
note right
void dispose()
end note
:complete=false;
:tokenForNegotiatedProperty=null ;
:extensions=null ;
end
start
note right
byte[]process(StringtokenValue,StringauthorizationId,
SaslExtensionsextensions)
end note
:callbackHandler.handle(new Callback[]{callback});
:handleCallbackError(e);
if (token==null ) then (yes) 
:errorMessage=jsonErrorResponse(callback.errorStatus(),
callback.errorScope(),callback.errorOpenIDConfiguration());
:log.debug(errorMessage);
:return errorMessage.getBytes(StandardCharsets.UTF_8);;
stop
endif 
if (!authorizationId.isEmpty()&&!authorizationId.equals(token.principalName())) then (yes) 
:throw new SaslAuthenticationException(String.format("Authentication failed: Client requested an authorization id (%s) that is different from the token's principal name (%s)",authorizationId,token.principalName()));;
endif 
:tokenForNegotiatedProperty=token;
:this.extensions=new SaslExtensions(validExtensions);
:complete=true;
:log.debug("Successfully authenticate User={}",
token.principalName());
:return new byte[0];;
stop
end
start
note right
Map<String,String>processExtensions(OAuthBearerTokentoken,
SaslExtensionsextensions)
end note
:callbackHandler.handle(new Callback[]{extensionsCallback});
:handleCallbackError(e);
if (!extensionsCallback.invalidExtensions()
.isEmpty()) then (yes) 
:log.debug(errorMessage);
:throw new SaslAuthenticationException(errorMessage);;
endif 
:return extensionsCallback.validatedExtensions();;
stop
end
start
note right
StringjsonErrorResponse(StringerrorStatus,
StringerrorScope,StringerrorOpenIDConfiguration)
end note
if (errorScope!=null ) then (yes) 
:jsonErrorResponse=String.format("%s, \"scope\":\"%s\"",
jsonErrorResponse,errorScope);
endif 
if (errorOpenIDConfiguration!=null ) then (yes) 
:jsonErrorResponse=String.format("%s, \"openid-configuration\":\"%s\"",
jsonErrorResponse,errorOpenIDConfiguration);
endif 
:jsonErrorResponse=String.format("%s}",jsonErrorResponse);
:return jsonErrorResponse;;
stop
end
start
note right
void handleCallbackError(Exceptione)
end note
:log.debug(msg,e);
:throw new SaslException(msg);;
end
start
note right
String[]mechanismNamesCompatibleWithPolicy(Map<String,
? >props)
end note
:return props!=null &&String.valueOf("true")
.equals(String.valueOf(props.get(Sasl.POLICY_NOPLAINTEXT)))? new String[]{}:new String[]{OAuthBearerLoginModule.OAUTHBEARER_MECHANISM};;
stop
end
start
note right
SaslServercreateSaslServer(Stringmechanism,
Stringprotocol,StringserverName,Map<String,
? >props,CallbackHandlercallbackHandler)
end note
:i++;
if (mechanismNamesCompatibleWithPolicy[i].equals(mechanism)) then (yes) 
:return new OAuthBearerSaslServer(callbackHandler);;
stop
endif 
:return null ;;
stop
end
start
note right
String[]getMechanismNames(Map<String,? >props)
end note
:return OAuthBearerSaslServer.mechanismNamesCompatibleWithPolicy(props);;
stop
