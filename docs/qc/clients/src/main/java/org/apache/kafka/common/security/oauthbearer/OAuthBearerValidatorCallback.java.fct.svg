@startuml
!pragma layout smetana
start
note right
constructor OAuthBearerValidatorCallback(StringtokenValue)
end note
if (Objects.requireNonNull(tokenValue).isEmpty()) then (yes) 
:throw new IllegalArgumentException("token value must not be empty");;
endif 
end
start
note right
StringtokenValue()
end note
:return tokenValue;;
stop
end
start
note right
OAuthBearerTokentoken()
end note
:return token;;
stop
end
start
note right
StringerrorStatus()
end note
:return errorStatus;;
stop
end
start
note right
StringerrorScope()
end note
:return errorScope;;
stop
end
start
note right
StringerrorOpenIDConfiguration()
end note
:return errorOpenIDConfiguration;;
stop
end
start
note right
void token(OAuthBearerTokentoken)
end note
end
start
note right
void error(StringerrorStatus,StringerrorScope,
StringerrorOpenIDConfiguration)
end note
if (Objects.requireNonNull(errorStatus).isEmpty()) then (yes) 
:throw new IllegalArgumentException("error status must not be empty");;
endif 
end
@enduml

