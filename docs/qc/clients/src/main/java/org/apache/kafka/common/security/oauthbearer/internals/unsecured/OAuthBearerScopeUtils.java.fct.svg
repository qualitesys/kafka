-width:1.0;" x1="289.5" x2="289.5" y1="597.3984" y2="617.3984"/><polygon fill="#181818" points="285.5,607.3984,289.5,617.3984,293.5,607.3984,289.5,611.3984" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="289.5" x2="289.5" y1="651.3672" y2="671.3672"/><polygon fill="#181818" points="285.5,661.3672,289.5,671.3672,293.5,661.3672,289.5,665.3672" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="289.5" x2="289.5" y1="755.9336" y2="778.5"/><polygon fill="#181818" points="285.5,768.5,289.5,778.5,293.5,768.5,289.5,772.5" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[cb3fcc347b3230e428fc6a9d2891f716]
@startuml
!pragma layout smetana
start
note right
boolean isValidScopeItem(String scopeItem)
end note
:return INDIVIDUAL_SCOPE_ITEM_PATTERN.matcher(Objects.requireNonNull(scopeItem))
.matches();;
stop
end
start
note right
List<String> parseScope(String spaceDelimitedScope)
end note
:List<String> retval=new ArrayList<>();;
if (!individualScopeItem.isEmpty()) then (yes) 
if (!isValidScopeItem(individualScopeItem)) then (yes) 
:throw new OAuthBearerConfigException(String.format("Invalid scope value: %s",
individualScopeItem));;
stop
endif 
:retval.add(individualScopeItem);;
endif 
:return Collections.unmodifiableList(retval);;
stop
end
start
note right
constructor OAuthBearerScopeUtils()
end note
end
@enduml

