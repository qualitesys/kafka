"/><polygon fill="#181818" points="285.5,714.5313,289.5,724.5313,293.5,714.5313,289.5,718.5313" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[406f6ef525a9e3dde703dd17ca003779]
@startuml
!pragma layout smetana
start
note right
booleanisValidScopeItem(StringscopeItem)
end note
:return INDIVIDUAL_SCOPE_ITEM_PATTERN.matcher(Objects.requireNonNull(scopeItem))
.matches();;
stop
end
start
note right
List<String>parseScope(StringspaceDelimitedScope)
end note
if (!individualScopeItem.isEmpty()) then (yes) 
if (!isValidScopeItem(individualScopeItem)) then (yes) 
:throw new OAuthBearerConfigException(String.format("Invalid scope value: %s",
individualScopeItem));;
stop
endif 
:retval.add(individualScopeItem);;
endif 
:return Collections.unmodifiableList(retval);;
stop
end
start
note right
constructor OAuthBearerScopeUtils()
end note
end
@enduml

