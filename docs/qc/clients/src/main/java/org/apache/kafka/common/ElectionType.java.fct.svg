@startuml
!pragma layout smetana
start
note right
constructor ElectionType(bytevalue)
end note
:this.value=value;;
end
start
note right
ElectionTypevalueOf(bytevalue)
end note
if (value==PREFERRED.value) then (yes) 
:return PREFERRED;;
stop
else if (value==UNCLEAN.value) then (yes) 
:return UNCLEAN;;
stop
else (no)
:throw new IllegalArgumentException(String.format("Value %s must be one of %s",
value,Arrays.asList(ElectionType.values())));;
stop
endif 
end
@enduml

