@startuml
!pragma layout smetana
start
note right
constructor TransactionResult(booleanid)
end note
:this.id=id;
end
start
note right
TransactionResultforId(booleanid)
end note
if (id) then (yes) 
:return TransactionResult.COMMIT;;
stop
endif 
:return TransactionResult.ABORT;;
stop
end
@enduml

