ust="spacing" textLength="374" x="5" y="371.9063">List&lt;AppConfigurationEntry&gt;jaasConfigEntries)</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="71" x="5" y="388.2031">end note</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="728" x="5" y="404.5">if (!OAuthBearerLoginModule.OAUTHBEARER_MECHANISM.equals(saslMechanism)) then (yes)</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="700" x="5" y="420.7969">:throw new IllegalArgumentException(String.format("Unexpected SASL mechanism: %s",</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="143" x="5" y="437.0938">saslMechanism));;</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="40" x="5" y="453.3906">endif</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="353" x="5" y="469.6875">if (Objects.requireNonNull(jaasConfigEntries)</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" text-decoration="wavy underline" textLength="426" x="5" y="485.9844">.size()!=1||jaasConfigEntries.get(0)==null ) then (yes)</text><text fill="#FF0000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="106" x="10" y="502.2813">Syntax Error?</text><!--MD5=[0c6097017880fdc71876562413a31844]
@startuml
!pragma layout smetana
start
note right
void time(Timetime)
end note
:this.time=Objects.requireNonNull(time);
end
start
note right
booleanconfigured()
end note
:return configured;;
stop
end
start
note right
void configure(Map<String,? >configs,StringsaslMechanism,
List<AppConfigurationEntry>jaasConfigEntries)
end note
if (!OAuthBearerLoginModule.OAUTHBEARER_MECHANISM.equals(saslMechanism)) then (yes) 
:throw new IllegalArgumentException(String.format("Unexpected SASL mechanism: %s",
saslMechanism));;
endif 
if (Objects.requireNonNull(jaasConfigEntries)
.size()!=1||jaasConfigEntries.get(0)==null ) then (yes) 
:throw new IllegalArgumentException(String.format("Must supply exactly 1 non-null JAAS mechanism configuration (size was %d)",jaasConfigEntries.size()));;
endif 
:this.moduleOptions=unmodifiableModuleOptions;
:configured=true;
end
start
note right
void handle(Callback[]callbacks)
end note
if (!configured()) then (yes) 
:throw new IllegalStateException("Callback handler not configured");;
endif 
if (callback instanceof OAuthBearerValidatorCallback) then (yes) 
:handleCallback(validationCallback);
:validationCallback.error(failureScope!=null ? String.valueOf("insufficient_scope"):String.valueOf("invalid_token"),
failureScope,failureReason.failureOpenIdConfig());
else (no)
:throw new UnsupportedCallbackException(callback);;
endif 
end
start
note right
void close()
end note
end
start
note right
void handleCallback(OAuthBearerValidatorCallbackcallback)
end note
if (tokenValue==null ) then (yes) 
:throw new IllegalArgumentException("Callback missing required token value");;
endif 
:OAuthBearerValidationUtils.validateClaimForExistenceAndType(unsecuredJwt,
true,principalClaimName,String.class ).throwExceptionIfFailed();
:OAuthBearerValidationUtils.validateIssuedAt(unsecuredJwt,
false,now,allowableClockSkewMs).throwExceptionIfFailed();
:OAuthBearerValidationUtils.validateExpirationTime(unsecuredJwt,
now,allowableClockSkewMs).throwExceptionIfFailed();
:OAuthBearerValidationUtils.validateTimeConsistency(unsecuredJwt)
.throwExceptionIfFailed();
:OAuthBearerValidationUtils.validateScope(unsecuredJwt,
requiredScope).throwExceptionIfFailed();
:log.info("Successfully validated token with principal {}: {}",
unsecuredJwt.principalName(),unsecuredJwt.claims());
:callback.token(unsecuredJwt);
end
start
note right
StringprincipalClaimName()
end note
:return Utils.isBlank(principalClaimNameValue)? String.valueOf("sub"):principalClaimNameValue.trim();;
stop
end
start
note right
StringscopeClaimName()
end note
:return Utils.isBlank(scopeClaimNameValue)? String.valueOf("scope"):scopeClaimNameValue.trim();;
stop
end
start
note right
List<String>requiredScope()
end note
:return Utils.isBlank(requiredSpaceDelimitedScope)? Collections.emptyList():OAuthBearerScopeUtils.parseScope(requiredSpaceDelimitedScope.trim());;
stop
end
start
note right
intallowableClockSkewMs()
end note
:allowableClockSkewMs=Utils.isBlank(allowableClockSkewMsValue)? 0:Integer.parseInt(allowableClockSkewMsValue.trim());
:throw new OAuthBearerConfigException(e.getMessage(),e);;
if (allowableClockSkewMs<0) then (yes) 
:throw new OAuthBearerConfigException(String.format("Allowable clock skew millis must not be negative: %s",
allowableClockSkewMsValue));;
endif 
:return allowableClockSkewMs;;
stop
end
start
note right
Stringoption(Stringkey)
end note
if (!configured) then (yes) 
:throw new IllegalStateException("Callback handler not configured");;
endif 
:return moduleOptions.get(Objects.requireNonNull(key));;
stop
end
@enduml

