@startuml
!pragma layout smetana
start
note right
constructor ScramSaslServerProvider()
end note
:super ("SASL/SCRAM Server Provider",1.0,
"SASL/SCRAM Server Provider for Kafka");;
:put("SaslServerFactory."+mechanism.mechanismName(),
ScramSaslServerFactory.class .getName());;
end
start
note right
void initialize()
end note
:Security.addProvider(new ScramSaslServerProvider());;
end
@enduml

