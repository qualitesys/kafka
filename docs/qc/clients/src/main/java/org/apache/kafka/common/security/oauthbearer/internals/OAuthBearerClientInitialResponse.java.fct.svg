@startuml
!pragma layout smetana
start
note right
constructor OAuthBearerClientInitialResponse(byte[]response)
end note
if (!matcher.matches()) then (yes) 
:throw new SaslException("Invalid OAUTHBEARER client first message");;
endif 
:this.authorizationId=authzid==null ? String.valueOf(""):authzid;
if (auth==null ) then (yes) 
:throw new SaslException("Invalid OAUTHBEARER client first message: 'auth' not specified");;
endif 
:properties.remove(AUTH_KEY);
:validateExtensions(extensions);
:this.saslExtensions=extensions;
if (!authMatcher.matches()) then (yes) 
:throw new SaslException("Invalid OAUTHBEARER client first message: invalid 'auth' format");;
endif 
if (!String.valueOf("bearer").equalsIgnoreCase(authMatcher.group("scheme"))) then (yes) 
:throw new SaslException(msg);;
endif 
:this.tokenValue=authMatcher.group("token");
end
start
note right
constructor OAuthBearerClientInitialResponse(StringtokenValue,
SaslExtensionsextensions)
end note
:this(tokenValue,"",extensions);
end
start
note right
constructor OAuthBearerClientInitialResponse(StringtokenValue,
StringauthorizationId,SaslExtensionsextensions)
end note
:this.tokenValue=Objects.requireNonNull(tokenValue,
"token value must not be null");
:this.authorizationId=authorizationId==null ? String.valueOf(""):authorizationId;
:validateExtensions(extensions);
:this.saslExtensions=extensions!=null ? extensions:SaslExtensions.NO_SASL_EXTENSIONS;
end
start
note right
SaslExtensionsextensions()
end note
:return saslExtensions;;
stop
end
start
note right
byte[]toBytes()
end note
if (extensions.length()>0) then (yes) 
:extensions=SEPARATOR+extensions;
endif 
:return message.getBytes(StandardCharsets.UTF_8);;
stop
end
start
note right
StringtokenValue()
end note
:return tokenValue;;
stop
end
start
note right
StringauthorizationId()
end note
:return authorizationId;;
stop
end
start
note right
void validateExtensions(SaslExtensionsextensions)
end note
if (extensions==null ) then (yes) 
:return ;;
stop
endif 
if (extensions.map().containsKey(OAuthBearerClientInitialResponse.AUTH_KEY)) then (yes) 
:throw new SaslException("Extension name "+
OAuthBearerClientInitialResponse.AUTH_KEY+
" is invalid");;
endif 
if (!EXTENSION_KEY_PATTERN.matcher(extensionName)
.matches()) then (yes) 
:throw new SaslException("Extension name "+
extensionName+" is invalid");;
endif 
if (!EXTENSION_VALUE_PATTERN.matcher(extensionValue)
.matches()) then (yes) 
:throw new SaslException("Extension value ("+
extensionValue+") for extension "+extensionName+
" is invalid");;
endif 
end
start
note right
StringextensionsMessage()
end note
:return Utils.mkString(saslExtensions.map(),
"","","=",SEPARATOR);;
stop
end
@enduml

