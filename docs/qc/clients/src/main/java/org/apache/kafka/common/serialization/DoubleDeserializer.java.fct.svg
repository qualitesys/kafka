@startuml
!pragma layout smetana
start
note right
Doubledeserialize(Stringtopic,byte[]data)
end note
if (data==null ) then (yes) 
:return null ;;
stop
endif 
if (data.length!=8) then (yes) 
:throw new SerializationException("Size of data received by Deserializer is not 8");;
endif 
:value<<=8;
:value|=b&0xFF;
:return Double.longBitsToDouble(value);;
stop
end
@enduml

