@startuml
!pragma layout smetana
start
note right
constructor RetriableCommitFailedException(Throwablet)
end note
:super ("Offset commit failed with a retriable exception. You should retry committing "+"the latest consumed offsets.",t);
end
start
note right
constructor RetriableCommitFailedException(Stringmessage)
end note
:super (message);
end
start
note right
constructor RetriableCommitFailedException(Stringmessage,
Throwablet)
end note
:super (message,t);
end
@enduml

