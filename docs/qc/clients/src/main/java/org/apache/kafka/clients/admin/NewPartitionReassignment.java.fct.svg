@startuml
!pragma layout smetana
start
note right
constructor NewPartitionReassignment(List<Integer>targetReplicas)
end note
if (targetReplicas==null ||targetReplicas.size()==0) then (yes) 
:throw new IllegalArgumentException("Cannot create a new partition reassignment without any replicas");;
endif 
:this.targetReplicas=Collections.unmodifiableList(new ArrayList<>(targetReplicas));
end
start
note right
List<Integer>targetReplicas()
end note
:return targetReplicas;;
stop
end
@enduml

