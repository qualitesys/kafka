@startuml
!pragma layout smetana
start
note right
constructor Frequency(MetricNamename,doublecenterValue)
end note
:this.name=name;
:this.centerValue=centerValue;
end
start
note right
MetricNamename()
end note
:return this.name;;
stop
end
start
note right
doublecenterValue()
end note
:return this.centerValue;;
stop
end
start
note right
StringtoString()
end note
:return "Frequency("+"name="+name+", centerValue="+
centerValue+')';;
stop
end
@enduml

