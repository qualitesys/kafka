@startuml
!pragma layout smetana
start
note right
constructor GroupAuthorizationException(Stringmessage,
StringgroupId)
end note
:super (message);;
:this.groupId=groupId;;
end
start
note right
constructor GroupAuthorizationException(Stringmessage)
end note
:this(message,null );;
end
start
note right
StringgroupId()
end note
:return groupId;;
stop
end
start
note right
GroupAuthorizationExceptionforGroupId(StringgroupId)
end note
:return new GroupAuthorizationException("Not authorized to access group: "+
groupId,groupId);;
stop
end
@enduml

