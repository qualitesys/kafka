@startuml
!pragma layout smetana
start
note right
constructor ClusterResourceListeners()
end note
:this.clusterResourceListeners=new ArrayList<>();;
end
start
note right
void maybeAdd(Object candidate)
end note
if (candidate instanceof ClusterResourceListener ) then (yes) 
:clusterResourceListeners.add((ClusterResourceListener )candidate);;
endif 
end
start
note right
void maybeAddAll(List<?> candidateList)
end note
:this.maybeAdd(candidate);;
end
start
note right
void onUpdate(ClusterResource cluster)
end note
:clusterResourceListener.onUpdate(cluster);;
end
@enduml

