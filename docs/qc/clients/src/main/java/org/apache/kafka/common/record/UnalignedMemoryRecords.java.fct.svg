@startuml
!pragma layout smetana
start
note right
constructor UnalignedMemoryRecords(ByteBufferbuffer)
end note
:this.buffer=Objects.requireNonNull(buffer);
end
start
note right
ByteBufferbuffer()
end note
:return buffer.duplicate();;
stop
end
start
note right
intsizeInBytes()
end note
:return buffer.remaining();;
stop
end
start
note right
longwriteTo(TransferableChannelchannel,longposition,intlength)
end note
if (position>Integer.MAX_VALUE) then (yes) 
endif 
if (position+length>buffer.limit()) then (yes) 
endif 
:return Utils.tryWriteTo(channel,(int)position,length,buffer);;
stop
end
@enduml

