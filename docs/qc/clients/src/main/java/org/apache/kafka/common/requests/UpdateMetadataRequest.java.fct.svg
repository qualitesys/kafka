@startuml
!pragma layout smetana
start
note right
constructor Builder(shortversion,intcontrollerId,
intcontrollerEpoch,longbrokerEpoch,List<UpdateMetadataPartitionState>partitionStates,
List<UpdateMetadataBroker>liveBrokers,Map<String,
Uuid>topicIds)
end note
:super (ApiKeys.UPDATE_METADATA,version,controllerId,
controllerEpoch,brokerEpoch);
:this.partitionStates=partitionStates;
:this.liveBrokers=liveBrokers;
:this.topicIds=topicIds;
end
start
note right
UpdateMetadataRequestbuild(shortversion)
end note
if (version<3) then (yes) 
if (version==0) then (yes) 
if (broker.endpoints().size()!=1) then (yes) 
:throw new UnsupportedVersionException("UpdateMetadataRequest v0 requires a single endpoint");;
endif 
if (broker.endpoints().get(0).securityProtocol()!=SecurityProtocol.PLAINTEXT.id) then (yes) 
:throw new UnsupportedVersionException("UpdateMetadataRequest v0 only handles PLAINTEXT endpoints");;
endif 
:broker.setV0Host(endpoint.host());
:broker.setV0Port(endpoint.port());
else (no)
if (broker.endpoints().stream().anyMatch(endpoint->!endpoint.listener()
.isEmpty()&&!endpoint.listener().equals(listenerNameFromSecurityProtocol(endpoint)))) then (yes) 
:throw new UnsupportedVersionException("UpdateMetadataRequest v0-v3 does not support custom "+
"listeners, request version: "+version+", endpoints: "+
broker.endpoints());;
endif 
endif 
endif 
if (version>=5) then (yes) 
:data.setTopicStates(new ArrayList<>(topicStatesMap.values()));
else (no)
:data.setUngroupedPartitionStates(partitionStates);
endif 
:return new UpdateMetadataRequest(data,version);;
stop
end
start
note right
Map<String,UpdateMetadataTopicState>groupByTopic(Map<String,
Uuid>topicIds,List<UpdateMetadataPartitionState>partitionStates)
end note
:topicState.partitionStates().add(partition);
:return topicStates;;
stop
end
start
note right
StringtoString()
end note
:bld.append("(type: UpdateMetadataRequest=").append(",
 controllerId=").append(controllerId).append(",
 controllerEpoch=").append(controllerEpoch).append(",
 brokerEpoch=").append(brokerEpoch).append(",
 partitionStates=").append(partitionStates).append(",
 liveBrokers=").append(Utils.join(liveBrokers,
", ")).append(")");
:return bld.toString();;
stop
end
start
note right
constructor UpdateMetadataRequest(UpdateMetadataRequestDatadata,
shortversion)
end note
:super (ApiKeys.UPDATE_METADATA,version);
:this.data=data;
:normalize();
end
start
note right
void normalize()
end note
if (version()<3) then (yes) 
if (version()==0&&liveBroker.endpoints().isEmpty()) then (yes) 
:liveBroker.setEndpoints(singletonList(new UpdateMetadataEndpoint()
.setHost(liveBroker.v0Host()).setPort(liveBroker.v0Port())
.setSecurityProtocol(securityProtocol.id)
.setListener(ListenerName.forSecurityProtocol(securityProtocol)
.value())));
else (no)
if (endpoint.listener().isEmpty()) then (yes) 
:endpoint.setListener(listenerNameFromSecurityProtocol(endpoint));
endif 
endif 
endif 
if (version()>=5) then (yes) 
:partitionState.setTopicName(topicState.topicName());
endif 
end
start
note right
StringlistenerNameFromSecurityProtocol(UpdateMetadataEndpointendpoint)
end note
:return ListenerName.forSecurityProtocol(securityProtocol)
.value();;
stop
end
start
note right
intcontrollerId()
end note
:return data.controllerId();;
stop
end
start
note right
intcontrollerEpoch()
end note
:return data.controllerEpoch();;
stop
end
start
note right
longbrokerEpoch()
end note
:return data.brokerEpoch();;
stop
end
start
note right
UpdateMetadataResponsegetErrorResponse(intthrottleTimeMs,
Throwablee)
end note
:return new UpdateMetadataResponse(data);;
stop
end
start
note right
Iterable<UpdateMetadataPartitionState>partitionStates()
end note
if (version()>=5) then (yes) 
:return ()->new FlattenedIterator<>(data.topicStates().iterator(),
topicState->topicState.partitionStates().iterator());;
stop
endif 
:return data.ungroupedPartitionStates();;
stop
end
start
note right
List<UpdateMetadataTopicState>topicStates()
end note
if (version()>=5) then (yes) 
:return data.topicStates();;
stop
endif 
:return Collections.emptyList();;
stop
end
start
note right
List<UpdateMetadataBroker>liveBrokers()
end note
:return data.liveBrokers();;
stop
end
start
note right
UpdateMetadataRequestDatadata()
end note
:return data;;
stop
end
start
note right
UpdateMetadataRequestparse(ByteBufferbuffer,
shortversion)
end note
:return new UpdateMetadataRequest(new UpdateMetadataRequestData(new ByteBufferAccessor(buffer),
version),version);;
stop
end
@enduml

