@startuml
!pragma layout smetana
start
note right
void initialize(Subjectsubject,CallbackHandlercallbackHandler,
Map<String,? >sharedState,Map<String,? >options)
end note
if (username!=null ) then (yes) 
endif 
if (password!=null ) then (yes) 
endif 
if (useTokenAuthentication) then (yes) 
endif 
end
start
note right
booleanlogin()
end note
:return true;;
stop
end
start
note right
booleanlogout()
end note
:return true;;
stop
end
start
note right
booleancommit()
end note
:return true;;
stop
end
start
note right
booleanabort()
end note
:return false;;
stop
end
@enduml

