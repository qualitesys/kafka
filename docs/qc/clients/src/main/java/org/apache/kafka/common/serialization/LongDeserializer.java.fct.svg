@startuml
!pragma layout smetana
start
note right
Long deserialize(String topic,byte[] data)
end note
if (data==null ) then (yes) 
:return null ;;
stop
endif 
if (data.length!=8) then (yes) 
:throw new SerializationException("Size of data received by LongDeserializer is not 8");;
stop
endif 
:long value=0;;
:value<<=8;;
:value|=b&0xFF;;
:return value;;
stop
end
@enduml

