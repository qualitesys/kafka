@startuml
!pragma layout smetana
start
note right
boolean isDisconnected()
end note
:return this==AUTHENTICATION_FAILED||this==DISCONNECTED;;
stop
end
start
note right
boolean isConnected()
end note
:return this==CHECKING_API_VERSIONS||this==READY;;
stop
end
@enduml

