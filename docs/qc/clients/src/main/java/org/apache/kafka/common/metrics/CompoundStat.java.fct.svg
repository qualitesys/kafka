@startuml
!pragma layout smetana
start
note right
constructor NamedMeasurable(MetricName name,
Measurable stat)
end note
:super ();;
:this.name=name;;
:this.stat=stat;;
end
start
note right
MetricName name()
end note
:return name;;
stop
end
start
note right
Measurable stat()
end note
:return stat;;
stop
end
@enduml

