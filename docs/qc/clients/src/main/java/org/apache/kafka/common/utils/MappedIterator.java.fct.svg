@startuml
!pragma layout smetana
start
note right
constructor MappedIterator(Iterator<?  extends F>underlyingIterator,
Function<F,T>mapper)
end note
:this.underlyingIterator=underlyingIterator;
:this.mapper=mapper;
end
start
note right
booleanhasNext()
end note
:return underlyingIterator.hasNext();;
stop
end
start
note right
Tnext()
end note
:return mapper.apply(underlyingIterator.next());;
stop
end
@enduml

