@startuml
!pragma layout smetana
start
note right
constructor IsolationLevel(byteid)
end note
:this.id=id;;
end
start
note right
byteid()
end note
:return id;;
stop
end
start
note right
IsolationLevelforId(byteid)
end note
:switch (id){case 0:return READ_UNCOMMITTED;case 1:return READ_COMMITTED;default :throw new IllegalArgumentException("Unknown isolation level "+
id);};
end
@enduml

