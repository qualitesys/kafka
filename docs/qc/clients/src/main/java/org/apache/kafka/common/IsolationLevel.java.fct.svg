@startuml
!pragma layout smetana
start
note right
constructor IsolationLevel(byte id)
end note
:this.id=id;;
end
start
note right
byte id()
end note
:return id;;
stop
end
start
note right
IsolationLevel forId(byte id)
end note
switch (switch id)
case (case 0:) 
:return READ_UNCOMMITTED;;
stop
case (case 1:) 
:return READ_COMMITTED;;
stop
case (default :) 
:throw new IllegalArgumentException("Unknown isolation level "+
id);;
stop
endswitch
end
@enduml

