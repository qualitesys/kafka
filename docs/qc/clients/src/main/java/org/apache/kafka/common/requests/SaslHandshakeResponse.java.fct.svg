@startuml
!pragma layout smetana
start
note right
constructor SaslHandshakeResponse(SaslHandshakeResponseDatadata)
end note
end
start
note right
Errorserror()
end note
:return Errors.forCode(data.errorCode());;
stop
end
start
note right
Map<Errors,Integer>errorCounts()
end note
:return errorCounts(Errors.forCode(data.errorCode()));;
stop
end
start
note right
intthrottleTimeMs()
end note
:return DEFAULT_THROTTLE_TIME;;
stop
end
start
note right
SaslHandshakeResponseDatadata()
end note
:return data;;
stop
end
start
note right
List<String>enabledMechanisms()
end note
:return data.mechanisms();;
stop
end
start
note right
SaslHandshakeResponseparse(ByteBufferbuffer,
shortversion)
end note
:return new SaslHandshakeResponse(new SaslHandshakeResponseData(new ByteBufferAccessor(buffer),
version));;
stop
end
@enduml

