@startuml
!pragma layout smetana
start
note right
constructor JaasOptionsUtils(Map<String,Object>options)
end note
:this.options=options;
end
start
note right
Map<String,Object>getOptions(StringsaslMechanism,
List<AppConfigurationEntry>jaasConfigEntries)
end note
if (!OAuthBearerLoginModule.OAUTHBEARER_MECHANISM.equals(saslMechanism)) then (yes) 
:throw new IllegalArgumentException(String.format("Unexpected SASL mechanism: %s",
saslMechanism));;
endif 
if (Objects.requireNonNull(jaasConfigEntries)
.size()!=1||jaasConfigEntries.get(0)==null ) then (yes) 
:throw new IllegalArgumentException(String.format("Must supply exactly 1 non-null JAAS mechanism configuration (size was %d)",jaasConfigEntries.size()));;
endif 
:return Collections.unmodifiableMap(jaasConfigEntries.get(0)
.getOptions());;
stop
end
start
note right
booleanshouldCreateSSLSocketFactory(URLurl)
end note
:return url.getProtocol().equalsIgnoreCase("https");;
stop
end
start
note right
Map<String,? >getSslClientConfig()
end note
:sslConfigDef.withClientSslSupport();
:return sslClientConfig.values();;
stop
end
start
note right
SSLSocketFactorycreateSSLSocketFactory()
end note
:sslFactory.configure(sslClientConfig);
:log.debug("Created SSLSocketFactory: {}",
sslClientConfig);
:return socketFactory;;
stop
end
start
note right
StringvalidateString(Stringname)
end note
:return validateString(name,true);;
stop
end
start
note right
StringvalidateString(Stringname,booleanisRequired)
end note
if (value==null ) then (yes) 
if (isRequired) then (yes) 
:throw new ConfigException(String.format("The OAuth configuration option %s value must be non-null",
name));;
else (no)
:return null ;;
stop
endif 
endif 
:value=value.trim();
if (value.isEmpty()) then (yes) 
if (isRequired) then (yes) 
:throw new ConfigException(String.format("The OAuth configuration option %s value must not contain only whitespace",
name));;
else (no)
:return null ;;
stop
endif 
endif 
:return value;;
stop
end
@enduml

