@startuml
!pragma layout smetana
start
note right
constructor Builder(ListGroupsRequestDatadata)
end note
end
start
note right
ListGroupsRequestbuild(shortversion)
end note
if (!data.statesFilter().isEmpty()&&version<4) then (yes) 
:throw new UnsupportedVersionException("The broker only supports ListGroups "+
"v"+version+", but we need v4 or newer to request groups by states.");;
endif 
:return new ListGroupsRequest(data,version);;
stop
end
start
note right
StringtoString()
end note
:return data.toString();;
stop
end
start
note right
constructor ListGroupsRequest(ListGroupsRequestDatadata,
shortversion)
end note
end
start
note right
ListGroupsResponsegetErrorResponse(intthrottleTimeMs,
Throwablee)
end note
if (version()>=1) then (yes) 
endif 
:return new ListGroupsResponse(listGroupsResponseData);;
stop
end
start
note right
ListGroupsRequestparse(ByteBufferbuffer,shortversion)
end note
:return new ListGroupsRequest(new ListGroupsRequestData(new ByteBufferAccessor(buffer),
version),version);;
stop
end
start
note right
ListGroupsRequestDatadata()
end note
:return data;;
stop
end
@enduml

