@startuml
!pragma layout smetana
start
note right
constructor Config(Collection<ConfigEntry>entries)
end note
:this.entries.put(entry.name(),entry);
end
start
note right
Collection<ConfigEntry>entries()
end note
:return Collections.unmodifiableCollection(entries.values());;
stop
end
start
note right
ConfigEntryget(Stringname)
end note
:return entries.get(name);;
stop
end
start
note right
booleanequals(Objecto)
end note
if (this==o) then (yes) 
:return true;;
stop
endif 
if (o==null ||getClass()!=o.getClass()) then (yes) 
:return false;;
stop
endif 
:return entries.equals(config.entries);;
stop
end
start
note right
inthashCode()
end note
:return entries.hashCode();;
stop
end
start
note right
StringtoString()
end note
:return "Config(entries="+entries.values()+
")";;
stop
end
@enduml

