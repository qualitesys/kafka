@startuml
!pragma layout smetana
start
note right
ListConsumerGroupsOptionsinStates(Set<ConsumerGroupState>states)
end note
:this.states=(states==null )? Collections.emptySet():new HashSet<>(states);
:return this;;
stop
end
start
note right
Set<ConsumerGroupState>states()
end note
:return states;;
stop
end
@enduml

