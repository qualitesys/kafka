!pragma layout smetana
start
note right
constructor LazyDownConversionRecordsSend(LazyDownConversionRecordsrecords)
end note
end
start
note right
MemoryRecordsbuildOverflowBatch(intremaining)
end note
:return MemoryRecords.readableRecords(overflowMessageBatch);;
stop
end
start
note right
longwriteTo(TransferableChannelchannel,longpreviouslyWritten,
intremaining)
end note
