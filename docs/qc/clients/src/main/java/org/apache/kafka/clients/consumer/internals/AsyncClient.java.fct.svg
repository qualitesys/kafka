@startuml
!pragma layout smetana
start
note right
constructor AsyncClient(ConsumerNetworkClientclient,
LogContextlogContext)
end note
:this.client=client;
:this.log=logContext.logger(getClass());
end
start
note right
RequestFuture<T2>sendAsyncRequest(Nodenode,
T1requestData)
end note
:return client.send(node,requestBuilder).compose(new RequestFutureAdapter<ClientResponse,
T2>(){@Override @SuppressWarnings ("unchecked")public void onSuccess(ClientResponsevalue,
RequestFuture<T2>future){Respresp;try {resp=(Resp)value.responseBody();}catch (ClassCastExceptioncce){log.error("Could not cast response body",cce);future.raise(cce);return ;}log.trace("Received {} {} from broker {}",resp.getClass().getSimpleName(),resp,node);try {future.complete(handleResponse(node,requestData,resp));}catch (RuntimeExceptione){if (!future.isDone()){future.raise(e);}}}@Override public void onFailure(RuntimeExceptione,RequestFuture<T2>future1){future1.raise(e);}});;
stop
end
start
note right
Loggerlogger()
end note
:return log;;
stop
end
@enduml

