<line style="stroke:#181818;stroke-width:1.0;" x1="508.5" x2="508.5" y1="316.4063" y2="336.4063"/><polygon fill="#181818" points="504.5,326.4063,508.5,336.4063,512.5,326.4063,508.5,330.4063" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="508.5" x2="508.5" y1="454.1875" y2="474.1875"/><polygon fill="#181818" points="504.5,464.1875,508.5,474.1875,512.5,464.1875,508.5,468.1875" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="508.5" x2="508.5" y1="558.7539" y2="581.3203"/><polygon fill="#181818" points="504.5,571.3203,508.5,581.3203,512.5,571.3203,508.5,575.3203" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="508.5" x2="508.5" y1="615.2891" y2="635.2891"/><polygon fill="#181818" points="504.5,625.2891,508.5,635.2891,512.5,625.2891,508.5,629.2891" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[743cdb91df5e144ef925c062dbb235d9]
@startuml
!pragma layout smetana
start
note right
constructor AsyncClient(ConsumerNetworkClient client,
LogContext logContext)
end note
:this.client=client;;
:this.log=logContext.logger(getClass());;
end
start
note right
RequestFuture<T2> sendAsyncRequest(Node node,
T1 requestData)
end note
:AbstractRequest.Builder<Req> requestBuilder=prepareRequest(node,
requestData);;
:return client.send(node,requestBuilder).compose(new RequestFutureAdapter<ClientResponse ,
T2 >(){@Override @SuppressWarnings ("unchecked")public void onSuccess(ClientResponse value,
RequestFuture<T2> future){Resp resp;try {resp=(Resp )value.responseBody();}catch (ClassCastException cce){log.error("Could not cast response body",
cce);future.raise(cce);return ;}log.trace("Received {} {} from broker {}",
resp.getClass().getSimpleName(),resp,node);try {future.complete(handleResponse(node,
requestData,resp));}catch (RuntimeException e){if (!future.isDone()){future.raise(e);}}}@Override public void onFailure(RuntimeException e,
RequestFuture<T2> future1){future1.raise(e);}});;
stop
end
start
note right
Logger logger()
end note
:return log;;
stop
end
@enduml

