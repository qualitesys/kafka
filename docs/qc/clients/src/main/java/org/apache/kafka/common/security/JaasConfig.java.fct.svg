s-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="387" x="5" y="544.1875">switch (switch (flag.toUpperCase(Locale.ROOT)))</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" text-decoration="wavy underline" textLength="73" x="5" y="560.4844">endswith</text><text fill="#FF0000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="106" x="10" y="576.7813">Syntax Error?</text><!--MD5=[71e9a2786bcf3dfbf541aa7aff71cc53]
@startuml
!pragma layout smetana
start
note right
constructor JaasConfig(StringloginContextName,
StringjaasConfigParams)
end note
:StreamTokenizertokenizer=new StreamTokenizer(new StringReader(jaasConfigParams));;
:tokenizer.slashSlashComments(true);;
:tokenizer.slashStarComments(true);;
:tokenizer.wordChars('-','-');;
:tokenizer.wordChars('_','_');;
:tokenizer.wordChars('$','$');;
:try ;
:configEntries=new ArrayList<>();;
while (tokenizer.nextToken()!=StreamTokenizer.TT_EOF)
:configEntries.add(parseAppConfigurationEntry(tokenizer));;
endwhile
if (configEntries.isEmpty()) then (yes) 
:throw new IllegalArgumentException("Login module not specified in JAAS config");;
stop
endif 
:this.loginContextName=loginContextName;;
:catch (IOExceptione);
:throw new KafkaException("Unexpected exception while parsing JAAS config");;
stop
end
start
note right
AppConfigurationEntry[]getAppConfigurationEntry(Stringname)
end note
if (this.loginContextName.equals(name)) then (yes) 
:return configEntries.toArray(new AppConfigurationEntry[0]);;
stop
else (no)
:return null ;;
stop
endif 
end
start
note right
LoginModuleControlFlagloginModuleControlFlag(Stringflag)
end note
if (flag==null ) then (yes) 
:throw new IllegalArgumentException("Login module control flag is not available in the JAAS config");;
stop
endif 
:LoginModuleControlFlagcontrolFlag;;
switch (switch (flag.toUpperCase(Locale.ROOT)))
endswith
:return controlFlag;;
stop
end
start
note right
AppConfigurationEntryparseAppConfigurationEntry(StreamTokenizertokenizer)
end note
:StringloginModule=tokenizer.sval;;
if (tokenizer.nextToken()==StreamTokenizer.TT_EOF) then (yes) 
:throw new IllegalArgumentException("Login module control flag not specified in JAAS config");;
stop
endif 
:LoginModuleControlFlagcontrolFlag=loginModuleControlFlag(tokenizer.sval);;
:Map<String,String>options=new HashMap<>();;
while (tokenizer.nextToken()!=StreamTokenizer.TT_EOF&&tokenizer.ttype!=';')
:Stringkey=tokenizer.sval;;
if (tokenizer.nextToken()!='='||tokenizer.nextToken()==StreamTokenizer.TT_EOF||tokenizer.sval==null ) then (yes) 
:throw new IllegalArgumentException("Value not specified for key '"+
key+"' in JAAS config");;
stop
endif 
:Stringvalue=tokenizer.sval;;
:options.put(key,value);;
endwhile
if (tokenizer.ttype!=';') then (yes) 
:throw new IllegalArgumentException("JAAS config entry not terminated by semi-colon");;
stop
endif 
:return new AppConfigurationEntry(loginModule,
controlFlag,options);;
stop
end
@enduml

