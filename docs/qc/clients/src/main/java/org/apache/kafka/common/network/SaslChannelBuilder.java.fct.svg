..</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="185" x="5" y="176.3438">... ( skipping 234 lines )</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="15" x="5" y="192.6406">...</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="222" x="5" y="208.9375">:return DefaultLogin.class ;;</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="35" x="5" y="225.2344">stop</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="30" x="5" y="241.5313">end</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="37" x="5" y="257.8281">start</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="78" x="5" y="274.125">note right</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="603" x="5" y="290.4219">Class&lt;?  extends AuthenticateCallbackHandler&gt;clientCallbackHandlerClass()</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="71" x="5" y="306.7188">end note</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="368" x="5" y="323.0156">:return KerberosClientCallbackHandler.class ;;</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="35" x="5" y="339.3125">stop</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="428" x="5" y="355.6094">:return OAuthBearerSaslClientCallbackHandler.class ;;</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="35" x="5" y="371.9063">stop</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="326" x="5" y="388.2031">:return SaslClientCallbackHandler.class ;;</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="35" x="5" y="404.5">stop</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="30" x="5" y="420.7969">end</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="37" x="5" y="437.0938">start</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="78" x="5" y="453.3906">note right</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="442" x="5" y="469.6875">void maybeAddNativeGssapiCredentials(Subjectsubject)</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="71" x="5" y="485.9844">end note</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="580" x="5" y="502.2813">if (usingNativeJgss&amp;&amp;subject.getPrivateCredentials(GSSCredential.class )</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" text-decoration="wavy underline" textLength="170" x="5" y="518.5781">.isEmpty()) then (yes)</text><text fill="#FF0000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="106" x="10" y="534.875">Syntax Error?</text><!--MD5=[38da52b49018a248189960adc27d2a32]
@startuml
!pragma layout smetana
start
note right
constructor SaslChannelBuilder(Modemode,Map<String,
JaasContext>jaasContexts,SecurityProtocolsecurityProtocol,
ListenerNamelistenerName,booleanisInterBrokerListener,
StringclientSaslMechanism,booleanhandshakeRequestEnable,
CredentialCachecredentialCache,DelegationTokenCachetokenCache,
StringsslClientAuthOverride,Timetime,LogContextlogContext,
Supplier<ApiVersionsResponse>apiVersionSupplier)
end note
:this.mode=mode;
:this.jaasContexts=jaasContexts;
:this.loginManagers=new HashMap<>(jaasContexts.size());
:this.subjects=new HashMap<>(jaasContexts.size());
:this.securityProtocol=securityProtocol;
:this.listenerName=listenerName;
:this.isInterBrokerListener=isInterBrokerListener;
:this.handshakeRequestEnable=handshakeRequestEnable;
:this.clientSaslMechanism=clientSaslMechanism;
:this.credentialCache=credentialCache;
:this.tokenCache=tokenCache;
:this.sslClientAuthOverride=sslClientAuthOverride;
:this.saslCallbackHandlers=new HashMap<>();
:this.connectionsMaxReauthMsByMechanism=new HashMap<>();
:this.time=time;
:this.logContext=logContext;
:this.log=logContext.logger(getClass());
:this.apiVersionSupplier=apiVersionSupplier;
if (mode==Mode.SERVER&&apiVersionSupplier==null ) then (yes) 
:throw new IllegalArgumentException("Server channel builder must provide an ApiVersionResponse supplier");;
endif 
end
start
note right
void configure(Map<String,? >configs)
end note
:this.configs=configs;
if (mode==Mode.SERVER) then (yes) 
:createServerCallbackHandlers(configs);
:createConnectionsMaxReauthMsMap(configs);
else (no)
:createClientCallbackHandler(configs);
endif 
:entry.getValue().configure(configs,mechanism,
jaasContexts.get(mechanism).configurationEntries());
if (mode==Mode.SERVER&&jaasContexts.containsKey(SaslConfigs.GSSAPI_MECHANISM)) then (yes) 
:defaultRealm=defaultKerberosRealm();
:defaultRealm="";
if (principalToLocalRules!=null ) then (yes) 
:kerberosShortNamer=KerberosShortNamer.fromUnparsedRules(defaultRealm,
principalToLocalRules);
endif 
endif 
:loginManagers.put(mechanism,loginManager);
:subjects.put(mechanism,subject);
if (mode==Mode.SERVER&&mechanism.equals(SaslConfigs.GSSAPI_MECHANISM)) then (yes) 
:maybeAddNativeGssapiCredentials(subject);
endif 
if (this.securityProtocol==SecurityProtocol.SASL_SSL) then (yes) 
:this.sslFactory=new SslFactory(mode,sslClientAuthOverride,
isInterBrokerListener);
:this.sslFactory.configure(configs);
endif 
:close();
:throw new KafkaException(e);;
end
start
note right
Set<String>reconfigurableConfigs()
end note
:return securityProtocol==SecurityProtocol.SASL_SSL? SslConfigs.RECONFIGURABLE_CONFIGS:Collections.emptySet();;
stop
end
start
note right
void validateReconfiguration(Map<String,? >configs)
end note
if (this.securityProtocol==SecurityProtocol.SASL_SSL) then (yes) 
:sslFactory.validateReconfiguration(configs);
endif 
end
start
note right
void reconfigure(Map<String,? >configs)
end note
if (this.securityProtocol==SecurityProtocol.SASL_SSL) then (yes) 
:sslFactory.reconfigure(configs);
endif 
end
start
note right
ListenerNamelistenerName()
end note
:return listenerName;;
stop
end
start
note right
KafkaChannelbuildChannel(Stringid,SelectionKeykey,
intmaxReceiveSize,MemoryPoolmemoryPool,ChannelMetadataRegistrymetadataRegistry)
end note
if (mode==Mode.SERVER) then (yes) 
:authenticatorCreator=()->buildServerAuthenticator(configs,
Collections.unmodifiableMap(saslCallbackHandlers),
id,transportLayer,Collections.unmodifiableMap(subjects),
Collections.unmodifiableMap(connectionsMaxReauthMsByMechanism),
metadataRegistry);
else (no)
:authenticatorCreator=()->buildClientAuthenticator(configs,
saslCallbackHandlers.get(clientSaslMechanism),
id,socket.getInetAddress().getHostName(),
loginManager.serviceName(),transportLayer,
subjects.get(clientSaslMechanism));
endif 
:return new KafkaChannel(id,transportLayer,
authenticatorCreator,maxReceiveSize,memoryPool!=null ? memoryPool:MemoryPool.NONE,
metadataRegistry);;
stop
:log.info("Failed to create channel due to ",e);
:throw new KafkaException(e);;
end
start
note right
void close()
end note
:loginManager.release();
:loginManagers.clear();
:handler.close();
if (sslFactory!=null ) then (yes) 
:sslFactory.close();
endif 
end
start
note right
TransportLayerbuildTransportLayer(Stringid,
SelectionKeykey,SocketChannelsocketChannel,
ChannelMetadataRegistrymetadataRegistry)
end note
if (this.securityProtocol==SecurityProtocol.SASL_SSL) then (yes) 
:return SslTransportLayer.create(id,key,sslFactory.createSslEngine(socketChannel.socket()),
metadataRegistry);;
stop
else (no)
:return new PlaintextTransportLayer(key);;
stop
endif 
end
start
note right
SaslServerAuthenticatorbuildServerAuthenticator(Map<String,
? >configs,Map<String,AuthenticateCallbackHandler>callbackHandlers,
Stringid,TransportLayertransportLayer,Map<String,
Subject>subjects,Map<String,Long>connectionsMaxReauthMsByMechanism,
ChannelMetadataRegistrymetadataRegistry)
end note
:return new SaslServerAuthenticator(configs,
callbackHandlers,id,subjects,kerberosShortNamer,
listenerName,securityProtocol,transportLayer,
connectionsMaxReauthMsByMechanism,metadataRegistry,
time,apiVersionSupplier);;
stop
end
start
note right
SaslClientAuthenticatorbuildClientAuthenticator(Map<String,
? >configs,AuthenticateCallbackHandlercallbackHandler,
Stringid,StringserverHost,StringservicePrincipal,
TransportLayertransportLayer,Subjectsubject)
end note
:return new SaslClientAuthenticator(configs,
callbackHandler,id,subject,servicePrincipal,
serverHost,clientSaslMechanism,handshakeRequestEnable,
transportLayer,time,logContext);;
stop
end
start
note right
Map<String,LoginManager>loginManagers()
end note
:return loginManagers;;
stop
end
start
note right
StringdefaultKerberosRealm()
end note
:return new KerberosPrincipal("tmp",1).getRealm();;
stop
end
start
note right
void createClientCallbackHandler(Map<String,
? >configs)
end note
if (clazz==null ) then (yes) 
:clazz=clientCallbackHandlerClass();
endif 
:saslCallbackHandlers.put(clientSaslMechanism,
callbackHandler);
end
start
note right
void createServerCallbackHandlers(Map<String,
? >configs)
end note
if (clazz!=null ) then (yes) 
:callbackHandler=Utils.newInstance(clazz);
else (no)
:callbackHandler=new SaslServerCallbackHandler();
endif 
:saslCallbackHandlers.put(mechanism,callbackHandler);
end
start
note right
void createConnectionsMaxReauthMsMap(Map<String,
? >configs)
end note
if (connectionsMaxReauthMs==null ) then (yes) 
:connectionsMaxReauthMs=(Long)configs.get(BrokerSecurityConfigs.CONNECTIONS_MAX_REAUTH_MS);
endif 
if (connectionsMaxReauthMs!=null ) then (yes) 
:connectionsMaxReauthMsByMechanism.put(mechanism,
connectionsMaxReauthMs);
endif 
end
start
note right
Class<?  extends Login>defaultLoginClass()
end note
if (jaasContexts.containsKey(SaslConfigs.GSSAPI_MECHANISM)) then (yes) 
:return KerberosLogin.class ;;
stop
endif 
if (OAuthBearerLoginModule.OAUTHBEARER_MECHANISM.equals(clientSaslMechanism)) then (yes) 
:return OAuthBearerRefreshingLogin.class ;;
stop
endif 
:return DefaultLogin.class ;;
stop
end
start
note right
Class<?  extends AuthenticateCallbackHandler>clientCallbackHandlerClass()
end note
:return KerberosClientCallbackHandler.class ;;
stop
:return OAuthBearerSaslClientCallbackHandler.class ;;
stop
:return SaslClientCallbackHandler.class ;;
stop
end
start
note right
void maybeAddNativeGssapiCredentials(Subjectsubject)
end note
if (usingNativeJgss&&subject.getPrivateCredentials(GSSCredential.class )
.isEmpty()) then (yes) 
:kerberosName=KerberosName.parse(servicePrincipal);
:throw new KafkaException("Principal has name with unexpected format "+
servicePrincipal);;
:subject.getPrivateCredentials().add(cred);
:log.info("Configured native GSSAPI private credentials for {}@{}",
serviceHostname,serviceHostname);
:log.warn("Cannot add private credential to subject;
: clients authentication may fail",ex);
endif 
end
start
note right
GSSManagergssManager()
end note
:return GSSManager.getInstance();;
stop
end
start
note right
Subjectsubject(StringsaslMechanism)
end note
:return subjects.get(saslMechanism);;
stop
end
@enduml

