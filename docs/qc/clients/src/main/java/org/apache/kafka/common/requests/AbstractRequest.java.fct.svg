@startuml
!pragma layout smetana
start
note right
constructor Builder(ApiKeysapiKey)
end note
:this(apiKey,apiKey.oldestVersion(),apiKey.latestVersion());;
end
start
note right
constructor Builder(ApiKeysapiKey,shortallowedVersion)
end note
:this(apiKey,allowedVersion,allowedVersion);;
end
start
note right
constructor Builder(ApiKeysapiKey,shortoldestAllowedVersion,
shortlatestAllowedVersion)
end note
:this.apiKey=apiKey;;
:this.oldestAllowedVersion=oldestAllowedVersion;;
:this.latestAllowedVersion=latestAllowedVersion;;
end
start
note right
ApiKeysapiKey()
end note
:return apiKey;;
stop
end
start
note right
shortoldestAllowedVersion()
end note
:return oldestAllowedVersion;;
stop
end
start
note right
shortlatestAllowedVersion()
end note
:return latestAllowedVersion;;
stop
end
start
note right
Tbuild()
end note
:return build(latestAllowedVersion());;
stop
end
start
note right
constructor AbstractRequest(ApiKeysapiKey,
shortversion)
end note
if (!apiKey.isVersionSupported(version)) then (yes) 
:throw new UnsupportedVersionException("The "+
apiKey+" protocol does not support version "+
version);;
stop
endif 
:this.version=version;;
:this.apiKey=apiKey;;
end
start
note right
shortversion()
end note
:return version;;
stop
end
start
note right
ApiKeysapiKey()
end note
:return apiKey;;
stop
end
start
note right
SendtoSend(RequestHeaderheader)
end note
:return SendBuilder.buildRequestSend(header,
data());;
stop
end
start
note right
ByteBufferserializeWithHeader(RequestHeaderheader)
end note
if (header.apiKey()!=apiKey) then (yes) 
:throw new IllegalArgumentException("Could not build request "+
apiKey+" with header api key "+header.apiKey());;
stop
endif 
if (header.apiVersion()!=version) then (yes) 
:throw new IllegalArgumentException("Could not build request version "+
version+" with header version "+header.apiVersion());;
stop
endif 
:return RequestUtils.serialize(header.data(),
header.headerVersion(),data(),version);;
stop
end
start
note right
ByteBufferserialize()
end note
:return MessageUtil.toByteBuffer(data(),version);;
stop
end
start
note right
intsizeInBytes()
end note
:return data().size(new ObjectSerializationCache(),
version);;
stop
end
start
note right
StringtoString(booleanverbose)
end note
:return data().toString();;
stop
end
start
note right
StringtoString()
end note
:return toString(true);;
stop
end
start
note right
AbstractResponsegetErrorResponse(Throwablee)
end note
:return getErrorResponse(AbstractResponse.DEFAULT_THROTTLE_TIME,e);;
stop
end
start
note right
Map<Errors,Integer>errorCounts(Throwablee)
end note
:AbstractResponseresponse=getErrorResponse(0,e);;
if (response==null ) then (yes) 
:throw new IllegalStateException("Error counts could not be obtained for request "+
this);;
stop
else (no)
:return response.errorCounts();;
stop
endif 
end
start
note right
RequestAndSizeparseRequest(ApiKeysapiKey,
shortapiVersion,ByteBufferbuffer)
end note
:intbufferSize=buffer.remaining();;
:return new RequestAndSize(doParseRequest(apiKey,
apiVersion,buffer),bufferSize);;
stop
end
start
note right
AbstractRequestdoParseRequest(ApiKeysapiKey,
shortapiVersion,ByteBufferbuffer)
end note
switch (switch (apiKey))
endswith
end
@enduml

