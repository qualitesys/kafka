@startuml
!pragma layout smetana
start
note right
constructor OperatingSystem()
end note
end
:NAME=System.getProperty("os.name").toLowerCase(Locale.ROOT);
:IS_WINDOWS=NAME.startsWith("windows");
:IS_ZOS=NAME.startsWith("z/os");
@enduml

