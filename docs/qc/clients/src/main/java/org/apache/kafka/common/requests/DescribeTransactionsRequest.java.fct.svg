end note
:return new DescribeTransactionsRequest(data,
version);;
stop
end
start
note right
StringtoString()
end note
:return data.toString();;
stop
end
start
note right
constructor DescribeTransactionsRequest(DescribeTransactionsRequestDatadata,
shortversion)
end note
:super (ApiKeys.DESCRIBE_TRANSACTIONS,version);
:this.data=data;
end
start
