end note
:response.transactionStates().add(transactionState);
:return new DescribeTransactionsResponse(response);;
stop
end
start
note right
DescribeTransactionsRequestparse(ByteBufferbuffer,
shortversion)
end note
:return new DescribeTransactionsRequest(new DescribeTransactionsRequestData(new ByteBufferAccessor(buffer),version),version);;
stop
end
start
