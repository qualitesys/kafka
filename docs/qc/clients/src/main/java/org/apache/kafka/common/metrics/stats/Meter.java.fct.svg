@startuml
!pragma layout smetana
start
note right
constructor Meter(MetricNamerateMetricName,
MetricNametotalMetricName)
end note
end
start
note right
constructor Meter(TimeUnitunit,MetricNamerateMetricName,
MetricNametotalMetricName)
end note
end
start
note right
constructor Meter(SampledStatrateStat,MetricNamerateMetricName,
MetricNametotalMetricName)
end note
end
start
note right
constructor Meter(TimeUnitunit,SampledStatrateStat,
MetricNamerateMetricName,MetricNametotalMetricName)
end note
if (!(rateStat instanceof WindowedSum)) then (yes) 
:throw new IllegalArgumentException("Meter is supported only for WindowedCount or WindowedSum.");;
endif 
end
start
note right
List<NamedMeasurable>stats()
end note
:return Arrays.asList(new NamedMeasurable(totalMetricName,
total),new NamedMeasurable(rateMetricName,
rate));;
stop
end
start
note right
void record(MetricConfigconfig,doublevalue,
longtimeMs)
end note
end
start
note right
StringtoString()
end note
:return "Meter("+"rate="+rate+", total="+
total+", rateMetricName="+rateMetricName+
", totalMetricName="+totalMetricName+')';;
stop
end
@enduml

