@startuml
!pragma layout smetana
start
note right
constructor CoordinatorStrategy(FindCoordinatorRequest.CoordinatorTypetype,
LogContextlogContext)
end note
:this.type=type;
:this.log=logContext.logger(CoordinatorStrategy.class );
end
start
note right
ApiRequestScopelookupScope(CoordinatorKeykey)
end note
if (batch) then (yes) 
:return BATCH_REQUEST_SCOPE;;
stop
else (no)
:return new LookupRequestScope(key);;
stop
endif 
end
start
note right
FindCoordinatorRequest.BuilderbuildRequest(Set<CoordinatorKey>keys)
end note
:unrepresentableKeys=keys.stream().filter(k->k==null ||!isRepresentableKey(k.idValue))
.collect(Collectors.toSet());
if (batch) then (yes) 
:ensureSameType(representableKeys);
:return new FindCoordinatorRequest.Builder(data);;
stop
else (no)
:return new FindCoordinatorRequest.Builder(new FindCoordinatorRequestData()
.setKey(key.idValue).setKeyType(key.type.id()));;
stop
endif 
end
start
note right
LookupResult<CoordinatorKey>handleResponse(Set<CoordinatorKey>keys,
AbstractResponseabstractResponse)
end note
:failedKeys.put(key,new InvalidGroupIdException("The given group id '"+
key.idValue+"' cannot be represented in a request."));
if (coordinator.key()==null ) then (yes) 
:key=requireSingletonAndType(keys);
else (no)
:key=(type==CoordinatorType.GROUP)? CoordinatorKey.byGroupId(coordinator.key()):CoordinatorKey.byTransactionalId(coordinator.key());
endif 
:handleError(Errors.forCode(coordinator.errorCode()),
key,coordinator.nodeId(),mappedKeys,failedKeys);
:return new LookupResult<>(failedKeys,mappedKeys);;
stop
end
start
note right
void disableBatch()
end note
:batch=false;
end
start
note right
CoordinatorKeyrequireSingletonAndType(Set<CoordinatorKey>keys)
end note
if (keys.size()!=1) then (yes) 
:throw new IllegalArgumentException("Unexpected size of key set: expected 1, but got "+
keys.size());;
endif 
if (key.type!=type) then (yes) 
:throw new IllegalArgumentException("Unexpected key type: expected key to be of type "+
type+", but got "+key.type);;
endif 
:return key;;
stop
end
start
note right
void ensureSameType(Set<CoordinatorKey>keys)
end note
if (keys.size()<1) then (yes) 
:throw new IllegalArgumentException("Unexpected size of key set: expected >= 1, but got "+
keys.size());;
endif 
if (keys.stream().filter(k->k.type==type)
.collect(Collectors.toSet()).size()!=keys.size()) then (yes) 
:throw new IllegalArgumentException("Unexpected key set: expected all key to be of type "+
type+", but some key were not");;
endif 
end
start
note right
booleanisRepresentableKey(StringgroupId)
end note
:return groupId!=null ;;
stop
end
start
note right
void handleError(Errorserror,CoordinatorKeykey,
intnodeId,Map<CoordinatorKey,Integer>mappedKeys,
Map<CoordinatorKey,Throwable>failedKeys)
end note
:mappedKeys.put(key,nodeId);
:log.debug("FindCoordinator request for key {} returned topic-level error {}. Will retry",
key,error);
:failedKeys.put(key,new GroupAuthorizationException("FindCoordinator request for groupId "+
"`"+key+"` failed due to authorization failure",
key.idValue));
:failedKeys.put(key,new TransactionalIdAuthorizationException("FindCoordinator request for "+
"transactionalId `"+key+"` failed due to authorization failure"));
:failedKeys.put(key,error.exception("FindCoordinator request for key "+
"`"+key+"` failed due to an unexpected error"));
end
start
note right
constructor LookupRequestScope(CoordinatorKeykey)
end note
:this.key=key;
end
start
note right
booleanequals(Objecto)
end note
if (this==o) then (yes) 
:return true;;
stop
endif 
if (o==null ||getClass()!=o.getClass()) then (yes) 
:return false;;
stop
endif 
:return Objects.equals(key,that.key);;
stop
end
start
note right
inthashCode()
end note
:return Objects.hash(key);;
stop
end
@enduml

