@startuml
!pragma layout smetana
start
note right
constructor RequestMetadata(ConfigResourceresource,Map<String,String>configs)
end note
:this.resource=resource;
:this.configs=configs;
end
start
note right
Map<String,String>configs()
end note
:return configs;;
stop
end
start
note right
ConfigResourceresource()
end note
:return resource;;
stop
end
start
note right
inthashCode()
end note
:return Objects.hash(resource,configs);;
stop
end
start
note right
booleanequals(Objecto)
end note
if ((o==null )||(!o.getClass().equals(getClass()))) then (yes) 
:return false;;
stop
endif 
:return resource.equals(other.resource)&&configs.equals(other.configs);;
stop
end
start
note right
StringtoString()
end note
:return "AlterConfigPolicy.RequestMetadata(resource="+
resource+", configs="+configs+")";;
stop
end
@enduml

