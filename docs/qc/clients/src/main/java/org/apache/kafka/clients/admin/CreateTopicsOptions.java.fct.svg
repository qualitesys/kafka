@startuml
!pragma layout smetana
start
note right
CreateTopicsOptionstimeoutMs(IntegertimeoutMs)
end note
:this.timeoutMs=timeoutMs;
:return this;;
stop
end
start
note right
CreateTopicsOptionsvalidateOnly(booleanvalidateOnly)
end note
:this.validateOnly=validateOnly;
:return this;;
stop
end
start
note right
booleanshouldValidateOnly()
end note
:return validateOnly;;
stop
end
start
note right
CreateTopicsOptionsretryOnQuotaViolation(booleanretryOnQuotaViolation)
end note
:this.retryOnQuotaViolation=retryOnQuotaViolation;
:return this;;
stop
end
start
note right
booleanshouldRetryOnQuotaViolation()
end note
:return retryOnQuotaViolation;;
stop
end
@enduml

