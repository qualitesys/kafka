@startuml
!pragma layout smetana
start
note right
constructor LoginManager(JaasContextjaasContext,
StringsaslMechanism,Map<String,? >configs,
LoginMetadata<? >loginMetadata)
end note
:this.loginMetadata=loginMetadata;
:this.login=Utils.newInstance(loginMetadata.loginClass);
:loginCallbackHandler=Utils.newInstance(loginMetadata.loginCallbackClass);
:loginCallbackHandler.configure(configs,saslMechanism,
jaasContext.configurationEntries());
:login.configure(configs,jaasContext.name(),
jaasContext.configuration(),loginCallbackHandler);
:login.login();
end
start
note right
LoginManageracquireLoginManager(JaasContextjaasContext,
StringsaslMechanism,Class<?  extends Login>defaultLoginClass,
Map<String,? >configs)
end note
if (jaasConfigValue!=null ) then (yes) 
:loginManager=DYNAMIC_INSTANCES.get(loginMetadata);
if (loginManager==null ) then (yes) 
:loginManager=new LoginManager(jaasContext,
saslMechanism,configs,loginMetadata);
:DYNAMIC_INSTANCES.put(loginMetadata,loginManager);
endif 
else (no)
:loginManager=STATIC_INSTANCES.get(loginMetadata);
if (loginManager==null ) then (yes) 
:loginManager=new LoginManager(jaasContext,
saslMechanism,configs,loginMetadata);
:STATIC_INSTANCES.put(loginMetadata,loginManager);
endif 
endif 
:SecurityUtils.addConfiguredSecurityProviders(configs);
:return loginManager.acquire();;
stop
end
start
note right
Subjectsubject()
end note
:return login.subject();;
stop
end
start
note right
StringserviceName()
end note
:return login.serviceName();;
stop
end
start
note right
ObjectcacheKey()
end note
:return loginMetadata.configInfo;;
stop
end
start
note right
LoginManageracquire()
end note
:++refCount;
:LOGGER.trace("{} acquired",this);
:return this;;
stop
end
start
note right
void release()
end note
if (refCount==0) then (yes) 
:throw new IllegalStateException("release() called on disposed "+
this);;
endif 
:- -refCount;
:LOGGER.trace("{} released",this);
end
start
note right
StringtoString()
end note
:return "LoginManager(serviceName="+serviceName()+
", publicCredentials="+subject().getPublicCredentials()+
", refCount="+refCount+')';;
stop
end
start
note right
void closeAll()
end note
:STATIC_INSTANCES.remove(key).login.close();
:DYNAMIC_INSTANCES.remove(key).login.close();
end
if (clazz!=null &&jaasContext.configurationEntries()
.size()!=1) then (yes) 
:throw new ConfigException(errorMessage);;
endif 
if (clazz==null ) then (yes) 
:clazz=defaultClass;
endif 
:return clazz;;
stop
start
note right
constructor LoginMetadata(TconfigInfo,Class<?  extends Login>loginClass,
Class<?  extends AuthenticateCallbackHandler>loginCallbackClass)
end note
:this.configInfo=configInfo;
:this.loginClass=loginClass;
:this.loginCallbackClass=loginCallbackClass;
end
start
note right
inthashCode()
end note
:return Objects.hash(configInfo,loginClass,
loginCallbackClass);;
stop
end
start
note right
booleanequals(Objecto)
end note
if (this==o) then (yes) 
:return true;;
stop
endif 
if (o==null ||getClass()!=o.getClass()) then (yes) 
:return false;;
stop
endif 
:return Objects.equals(configInfo,loginMetadata.configInfo)&&Objects.equals(loginClass,
loginMetadata.loginClass)&&Objects.equals(loginCallbackClass,
loginMetadata.loginCallbackClass);;
stop
end
@enduml

