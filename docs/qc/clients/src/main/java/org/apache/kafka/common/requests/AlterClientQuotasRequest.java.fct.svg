!pragma layout smetana
start
note right
constructor Builder(Collection<ClientQuotaAlteration>entries,
booleanvalidateOnly)
end note
end
start
note right
AlterClientQuotasRequestbuild(shortversion)
end note
:return new AlterClientQuotasRequest(data,
version);;
stop
end
start
note right
