@startuml
!pragma layout smetana
start
note right
constructor OffsetDeleteResponse(OffsetDeleteResponseDatadata)
end note
end
start
note right
OffsetDeleteResponseDatadata()
end note
:return data;;
stop
end
start
note right
Map<Errors,Integer>errorCounts()
end note
:return counts;;
stop
end
start
note right
OffsetDeleteResponseparse(ByteBufferbuffer,
shortversion)
end note
:return new OffsetDeleteResponse(new OffsetDeleteResponseData(new ByteBufferAccessor(buffer),
version));;
stop
end
start
note right
intthrottleTimeMs()
end note
:return data.throttleTimeMs();;
stop
end
start
note right
booleanshouldClientThrottle(shortversion)
end note
:return version>=0;;
stop
end
