@startuml
!pragma layout smetana
start
note right
constructor SupportedVersionRange(shortminVersion,
shortmaxVersion)
end note
end
start
note right
constructor SupportedVersionRange(shortmaxVersion)
end note
end
start
note right
SupportedVersionRangefromMap(Map<String,Short>versionRangeMap)
end note
:return new SupportedVersionRange(BaseVersionRange.valueOrThrow(MIN_VERSION_KEY_LABEL,
versionRangeMap),BaseVersionRange.valueOrThrow(MAX_VERSION_KEY_LABEL,
versionRangeMap));;
stop
end
start
note right
booleanisIncompatibleWith(shortversion)
end note
:return min()>version||max()<version;;
stop
end
@enduml

