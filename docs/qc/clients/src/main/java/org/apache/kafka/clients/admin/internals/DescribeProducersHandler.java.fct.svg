@startuml
!pragma layout smetana
start
note right
constructor DescribeProducersHandler(DescribeProducersOptionsoptions,
LogContextlogContext)
end note
:this.options=options;;
:this.log=logContext.logger(DescribeProducersHandler.class );;
if (options.brokerId().isPresent()) then (yes) 
:this.lookupStrategy=new StaticBrokerStrategy<>(options.brokerId()
.getAsInt());;
else (no)
:this.lookupStrategy=new PartitionLeaderStrategy(logContext);;
endif 
end
start
note right
AdminApiFuture.SimpleAdminApiFuture<TopicPartition,
PartitionProducerState>newFuture(Collection<TopicPartition>topicPartitions)
end note
:return AdminApiFuture.forKeys(new HashSet<>(topicPartitions));;
stop
end
start
note right
StringapiName()
end note
:return "describeProducers";;
stop
end
start
note right
AdminApiLookupStrategy<TopicPartition>lookupStrategy()
end note
:return lookupStrategy;;
stop
end
start
note right
DescribeProducersRequest.BuilderbuildBatchedRequest(intbrokerId,
Set<TopicPartition>topicPartitions)
end note
:DescribeProducersRequestDatarequest=new DescribeProducersRequestData();;
:DescribeProducersRequest.Builderbuilder=new DescribeProducersRequest.Builder(request);;
:CollectionUtils.groupPartitionsByTopic(topicPartitions,
builder::addTopic,(topicRequest,partitionId)->topicRequest.partitionIndexes().add(partitionId));;
:return builder;;
stop
end
start
note right
void handlePartitionError(TopicPartitiontopicPartition,
ApiErrorapiError,Map<TopicPartition,Throwable>failed,
List<TopicPartition>unmapped)
end note
switch (switch (apiError.error()))
endswith
end
start
note right
ApiResult<TopicPartition,PartitionProducerState>handleResponse(Nodebroker,
Set<TopicPartition>keys,AbstractResponseabstractResponse)
end note
:DescribeProducersResponseresponse=(DescribeProducersResponse)abstractResponse;;
:Map<TopicPartition,PartitionProducerState>completed=new HashMap<>();;
:Map<TopicPartition,Throwable>failed=new HashMap<>();;
:List<TopicPartition>unmapped=new ArrayList<>();;
:TopicPartitiontopicPartition=new TopicPartition(topicResponse.name(),
partitionResponse.partitionIndex());;
:Errorserror=Errors.forCode(partitionResponse.errorCode());;
if (error!=Errors.NONE) then (yes) 
:ApiErrorapiError=new ApiError(error,partitionResponse.errorMessage());;
:handlePartitionError(topicPartition,apiError,
failed,unmapped);;
:continue ;;
endif 
:List<ProducerState>activeProducers=partitionResponse.activeProducers()
.stream().map(activeProducer->{OptionalLongcurrentTransactionFirstOffset=activeProducer.currentTxnStartOffset()<0? OptionalLong.empty():OptionalLong.of(activeProducer.currentTxnStartOffset());OptionalIntcoordinatorEpoch=activeProducer.coordinatorEpoch()<0? OptionalInt.empty():OptionalInt.of(activeProducer.coordinatorEpoch());return new ProducerState(activeProducer.producerId(),activeProducer.producerEpoch(),activeProducer.lastSequence(),activeProducer.lastTimestamp(),coordinatorEpoch,currentTransactionFirstOffset);}).collect(Collectors.toList());;
:completed.put(topicPartition,new PartitionProducerState(activeProducers));;
:return new ApiResult<>(completed,failed,
unmapped);;
stop
end
@enduml

