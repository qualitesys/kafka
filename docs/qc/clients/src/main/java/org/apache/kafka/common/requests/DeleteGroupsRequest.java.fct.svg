!pragma layout smetana
start
note right
constructor Builder(DeleteGroupsRequestData data)
end note
:super (ApiKeys.DELETE_GROUPS);;
:this.data=data;;
end
start
note right
DeleteGroupsRequest build(short version)
end note
:return new DeleteGroupsRequest(data,version);;
stop
end
start
note right
String toString()
end note
:return data.toString();;
stop
end
start
note right
constructor DeleteGroupsRequest(DeleteGroupsRequestData data,
short version)
end note
:super (ApiKeys.DELETE_GROUPS,version);;
:this.data=data;;
end
start
note right
AbstractResponse getErrorResponse(int throttleTimeMs,
Throwable e)
end note
:Errors error=Errors.forException(e);;
:DeletableGroupResultCollection groupResults=new DeletableGroupResultCollection();;
:groupResults.add(new DeletableGroupResult()
.setGroupId(groupId).setErrorCode(error.code()));;
:return new DeleteGroupsResponse(new DeleteGroupsResponseData()
.setResults(groupResults).setThrottleTimeMs(throttleTimeMs));;
stop
end
