@startuml
!pragma layout smetana
start
note right
constructor NetworkSend(StringdestinationId,
Sendsend)
end note
:this.destinationId=destinationId;;
:this.send=send;;
end
start
note right
StringdestinationId()
end note
:return destinationId;;
stop
end
start
note right
booleancompleted()
end note
:return send.completed();;
stop
end
start
note right
longwriteTo(TransferableChannelchannel)
end note
:return send.writeTo(channel);;
stop
end
start
note right
longsize()
end note
:return send.size();;
stop
end
@enduml

