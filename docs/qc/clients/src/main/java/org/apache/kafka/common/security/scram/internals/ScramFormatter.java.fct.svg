@startuml
!pragma layout smetana
start
note right
constructor ScramFormatter(ScramMechanismmechanism)
end note
:this.messageDigest=MessageDigest.getInstance(mechanism.hashAlgorithm());
:this.mac=Mac.getInstance(mechanism.macAlgorithm());
:this.random=new SecureRandom();
end
start
note right
byte[]hmac(byte[]key,byte[]bytes)
end note
:mac.init(new SecretKeySpec(key,mac.getAlgorithm()));
:return mac.doFinal(bytes);;
stop
end
start
note right
byte[]hash(byte[]str)
end note
:return messageDigest.digest(str);;
stop
end
start
note right
byte[]xor(byte[]first,byte[]second)
end note
if (first.length!=second.length) then (yes) 
:throw new IllegalArgumentException("Argument arrays must be of the same length");;
endif 
:i++;
:result[i]=(byte)(first[i]^second[i]);
:return result;;
stop
end
start
note right
byte[]hi(byte[]str,byte[]salt,intiterations)
end note
:mac.init(new SecretKeySpec(str,mac.getAlgorithm()));
:mac.update(salt);
:i++;
:result=xor(result,ui);
:prev=ui;
:return result;;
stop
end
start
note right
byte[]normalize(Stringstr)
end note
:return toBytes(str);;
stop
end
start
note right
byte[]saltedPassword(Stringpassword,byte[]salt,
intiterations)
end note
:return hi(normalize(password),salt,iterations);;
stop
end
start
note right
byte[]clientKey(byte[]saltedPassword)
end note
:return hmac(saltedPassword,toBytes("Client Key"));;
stop
end
start
note right
byte[]storedKey(byte[]clientKey)
end note
:return hash(clientKey);;
stop
end
start
note right
StringsaslName(Stringusername)
end note
:return COMMA.matcher(replace1).replaceAll(Matcher.quoteReplacement("=2C"));;
stop
end
start
note right
Stringusername(StringsaslName)
end note
if (EQUAL_THREE_D.matcher(username).replaceAll(Matcher.quoteReplacement(""))
.indexOf('=')>=0) then (yes) 
:throw new IllegalArgumentException("Invalid username: "+
saslName);;
endif 
:return EQUAL_THREE_D.matcher(username).replaceAll(Matcher.quoteReplacement("="));;
stop
end
start
note right
StringauthMessage(StringclientFirstMessageBare,
StringserverFirstMessage,StringclientFinalMessageWithoutProof)
end note
:return clientFirstMessageBare+","+serverFirstMessage+
","+clientFinalMessageWithoutProof;;
stop
end
start
note right
byte[]clientSignature(byte[]storedKey,ClientFirstMessageclientFirstMessage,
ServerFirstMessageserverFirstMessage,ClientFinalMessageclientFinalMessage)
end note
:return hmac(storedKey,authMessage);;
stop
end
start
note right
byte[]clientProof(byte[]saltedPassword,ClientFirstMessageclientFirstMessage,
ServerFirstMessageserverFirstMessage,ClientFinalMessageclientFinalMessage)
end note
:return xor(clientKey,clientSignature);;
stop
end
start
note right
byte[]authMessage(ClientFirstMessageclientFirstMessage,
ServerFirstMessageserverFirstMessage,ClientFinalMessageclientFinalMessage)
end note
:return toBytes(authMessage(clientFirstMessage.clientFirstMessageBare(),
serverFirstMessage.toMessage(),clientFinalMessage.clientFinalMessageWithoutProof()));;
stop
end
start
note right
byte[]storedKey(byte[]clientSignature,byte[]clientProof)
end note
:return hash(xor(clientSignature,clientProof));;
stop
end
start
note right
byte[]serverKey(byte[]saltedPassword)
end note
:return hmac(saltedPassword,toBytes("Server Key"));;
stop
end
start
note right
byte[]serverSignature(byte[]serverKey,ClientFirstMessageclientFirstMessage,
ServerFirstMessageserverFirstMessage,ClientFinalMessageclientFinalMessage)
end note
:return hmac(serverKey,authMessage);;
stop
end
start
note right
StringsecureRandomString()
end note
:return secureRandomString(random);;
stop
end
start
note right
StringsecureRandomString(SecureRandomrandom)
end note
:return new BigInteger(130,random).toString(Character.MAX_RADIX);;
stop
end
start
note right
byte[]secureRandomBytes()
end note
:return secureRandomBytes(random);;
stop
end
start
note right
byte[]secureRandomBytes(SecureRandomrandom)
end note
:return toBytes(secureRandomString(random));;
stop
end
start
note right
byte[]toBytes(Stringstr)
end note
:return str.getBytes(StandardCharsets.UTF_8);;
stop
end
start
note right
ScramCredentialgenerateCredential(Stringpassword,
intiterations)
end note
:return generateCredential(salt,saltedPassword,
iterations);;
stop
:throw new KafkaException("Could not create credential",e);;
end
start
note right
ScramCredentialgenerateCredential(byte[]salt,
byte[]saltedPassword,intiterations)
end note
:return new ScramCredential(salt,storedKey,
serverKey,iterations);;
stop
:throw new KafkaException("Could not create credential",e);;
end
@enduml

