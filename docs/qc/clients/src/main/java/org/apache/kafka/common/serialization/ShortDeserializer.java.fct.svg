@startuml
!pragma layout smetana
start
note right
Short deserialize(String topic,byte[] data)
end note
if (data==null ) then (yes) 
:return null ;;
stop
endif 
if (data.length!=2) then (yes) 
:throw new SerializationException("Size of data received by ShortDeserializer is not 2");;
stop
endif 
:short value=0;;
:value<<=8;;
:value|=b&0xFF;;
:return value;;
stop
end
@enduml

