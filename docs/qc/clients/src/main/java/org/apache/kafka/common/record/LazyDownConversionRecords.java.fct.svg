:firstConvertedBatch=null ;
:return new Iterator(records,maximumReadSize,
firstBatch);;
stop
end
start
note right
constructor Iterator(RecordsrecordsToDownConvert,
longmaximumReadSize,ConvertedRecords<? >firstConvertedBatch)
end note
:this.batchIterator=recordsToDownConvert.batchIterator();
:this.maximumReadSize=maximumReadSize;
:this.firstConvertedBatch=firstConvertedBatch;
if (firstConvertedBatch!=null ) then (yes) 
:this.batchIterator.next();
endif 
end
start
note right
ConvertedRecordsmakeNext()
end note
if (firstConvertedBatch!=null ) then (yes) 
:firstConvertedBatch=null ;
:return convertedBatch;;
stop
endif 
while (batchIterator.hasNext())
while (batchIterator.hasNext()&&(isFirstBatch||(batchIterator.peek().sizeInBytes()+
sizeSoFar)<=maximumReadSize))
:batches.add(currentBatch);
:sizeSoFar+=currentBatch.sizeInBytes();
:isFirstBatch=false;
endwhile
if (convertedRecords.records().sizeInBytes()>0) then (yes) 
:return convertedRecords;;
stop
endif 
endwhile
:return allDone();;
stop
