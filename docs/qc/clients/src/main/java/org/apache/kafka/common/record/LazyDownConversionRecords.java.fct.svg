@startuml
!pragma layout smetana
start
note right
constructor LazyDownConversionRecords(TopicPartition topicPartition,
Records records,byte toMagic,long firstOffset,
Time time)
end note
:this.topicPartition=Objects.requireNonNull(topicPartition);;
:this.records=Objects.requireNonNull(records);;
:this.toMagic=toMagic;;
:this.firstOffset=firstOffset;;
:this.time=Objects.requireNonNull(time);;
:java.util.Iterator<ConvertedRecords<?>> it=iterator(0);;
if (it.hasNext()) then (yes) 
:firstConvertedBatch=it.next();;
:sizeInBytes=Math.max(records.sizeInBytes(),
firstConvertedBatch.records().sizeInBytes());;
else (no)
:firstConvertedBatch=null ;;
:sizeInBytes=records.batches().iterator()
.hasNext()? LazyDownConversionRecordsSend.MIN_OVERFLOW_MESSAGE_LENGTH:0;;
endif 
end
start
note right
int sizeInBytes()
end note
:return sizeInBytes;;
stop
end
start
note right
LazyDownConversionRecordsSend toSend()
end note
:return new LazyDownConversionRecordsSend(this);;
stop
end
start
note right
TopicPartition topicPartition()
end note
:return topicPartition;;
stop
end
start
note right
boolean equals(Object o)
end note
if (o instanceof LazyDownConversionRecords ) then (yes) 
:LazyDownConversionRecords that=(LazyDownConversionRecords )o;;
:return toMagic==that.toMagic&&firstOffset==that.firstOffset&&topicPartition.equals(that.topicPartition)&&records.equals(that.records);;
stop
endif 
:return false;;
stop
end
start
note right
int hashCode()
end note
:int result=toMagic;;
:result=31*result+Long.hashCode(firstOffset);;
:result=31*result+topicPartition.hashCode();;
:result=31*result+records.hashCode();;
:return result;;
stop
end
start
note right
String toString()
end note
:return "LazyDownConversionRecords(size="+
sizeInBytes+", underlying="+records+", toMagic="+
toMagic+", firstOffset="+firstOffset+")";;
stop
end
start
note right
java.util.Iterator<ConvertedRecords<?>> iterator(long maximumReadSize)
end note
:ConvertedRecords firstBatch=firstConvertedBatch;;
:firstConvertedBatch=null ;;
:return new Iterator(records,maximumReadSize,
firstBatch);;
stop
end
start
note right
constructor Iterator(Records recordsToDownConvert,
long maximumReadSize,ConvertedRecords<?> firstConvertedBatch)
end note
:this.batchIterator=recordsToDownConvert.batchIterator();;
:this.maximumReadSize=maximumReadSize;;
:this.firstConvertedBatch=firstConvertedBatch;;
if (firstConvertedBatch!=null ) then (yes) 
:this.batchIterator.next();;
endif 
end
start
note right
ConvertedRecords makeNext()
end note
if (firstConvertedBatch!=null ) then (yes) 
:ConvertedRecords convertedBatch=firstConvertedBatch;;
:firstConvertedBatch=null ;;
:return convertedBatch;;
stop
endif 
while (batchIterator.hasNext())
:final List<RecordBatch> batches=new ArrayList<>();;
:boolean isFirstBatch=true;;
:long sizeSoFar=0;;
while (batchIterator.hasNext()&&(isFirstBatch||(batchIterator.peek().sizeInBytes()+
sizeSoFar)<=maximumReadSize))
:RecordBatch currentBatch=batchIterator.next();;
:batches.add(currentBatch);;
:sizeSoFar+=currentBatch.sizeInBytes();;
:isFirstBatch=false;;
endwhile
:ConvertedRecords convertedRecords=RecordsUtil.downConvert(batches,
toMagic,firstOffset,time);;
if (convertedRecords.records().sizeInBytes()>0) then (yes) 
:return convertedRecords;;
stop
endif 
endwhile
:return allDone();;
stop
end
@enduml

