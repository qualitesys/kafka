@startuml
!pragma layout smetana
start
note right
constructor PatternType(bytecode)
end note
:this.code=code;
end
start
note right
bytecode()
end note
:return code;;
stop
end
start
note right
booleanisUnknown()
end note
:return this==UNKNOWN;;
stop
end
start
note right
booleanisSpecific()
end note
:return this!=UNKNOWN&&this!=ANY&&this!=MATCH;;
stop
end
start
note right
PatternTypefromCode(bytecode)
end note
:return CODE_TO_VALUE.getOrDefault(code,UNKNOWN);;
stop
end
start
note right
PatternTypefromString(Stringname)
end note
:return NAME_TO_VALUE.getOrDefault(name,UNKNOWN);;
stop
end
@enduml

