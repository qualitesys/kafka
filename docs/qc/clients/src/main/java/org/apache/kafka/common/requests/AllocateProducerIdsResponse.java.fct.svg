@startuml
!pragma layout smetana
start
note right
constructor AllocateProducerIdsResponse(AllocateProducerIdsResponseDatadata)
end note
:super (ApiKeys.ALLOCATE_PRODUCER_IDS);
:this.data=data;
end
start
note right
AllocateProducerIdsResponseDatadata()
end note
:return data;;
stop
end
start
note right
Map<Errors,Integer>errorCounts()
end note
:return Collections.singletonMap(Errors.forCode(data.errorCode()),1);;
stop
end
start
note right
intthrottleTimeMs()
end note
:return data.throttleTimeMs();;
stop
end
start
note right
AllocateProducerIdsResponseparse(ByteBufferbuffer,
shortversion)
end note
:return new AllocateProducerIdsResponse(new AllocateProducerIdsResponseData(new ByteBufferAccessor(buffer),
version));;
stop
end
@enduml

