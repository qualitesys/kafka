@startuml
!pragma layout smetana
:codeToSecurityProtocol.put(proto.id,proto);;
:names.add(proto.name);;
:CODE_TO_SECURITY_PROTOCOL=Collections.unmodifiableMap(codeToSecurityProtocol);;
:NAMES=Collections.unmodifiableList(names);;
start
note right
constructor SecurityProtocol(intid,Stringname)
end note
:this.id=(short)id;;
:this.name=name;;
end
start
note right
List<String>names()
end note
:return NAMES;;
stop
end
start
note right
SecurityProtocolforId(shortid)
end note
:return CODE_TO_SECURITY_PROTOCOL.get(id);;
stop
end
start
note right
SecurityProtocolforName(Stringname)
end note
:return SecurityProtocol.valueOf(name.toUpperCase(Locale.ROOT));;
stop
end
@enduml

