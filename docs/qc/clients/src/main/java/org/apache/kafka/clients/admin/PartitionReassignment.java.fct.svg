@startuml
!pragma layout smetana
start
note right
constructor PartitionReassignment(List<Integer>replicas,List<Integer>addingReplicas,List<Integer>removingReplicas)
end note
:this.replicas=Collections.unmodifiableList(replicas);
:this.addingReplicas=Collections.unmodifiableList(addingReplicas);
:this.removingReplicas=Collections.unmodifiableList(removingReplicas);
end
start
note right
List<Integer>replicas()
end note
:return replicas;;
stop
end
start
note right
List<Integer>addingReplicas()
end note
:return addingReplicas;;
stop
end
start
note right
List<Integer>removingReplicas()
end note
:return removingReplicas;;
stop
end
start
note right
StringtoString()
end note
:return "PartitionReassignment("+"replicas="+
replicas+", addingReplicas="+addingReplicas+
", removingReplicas="+removingReplicas+')';;
stop
end
@enduml

