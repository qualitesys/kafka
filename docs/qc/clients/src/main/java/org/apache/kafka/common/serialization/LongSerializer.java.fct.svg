@startuml
!pragma layout smetana
start
note right
byte[] serialize(String topic,Long data)
end note
if (data==null ) then (yes) 
:return null ;;
stop
endif 
:return new byte[]{(byte )(data>>>56),(byte )(data>>>48),
(byte )(data>>>40),(byte )(data>>>32),(byte )(data>>>24),
(byte )(data>>>16),(byte )(data>>>8),data.byteValue()};;
stop
end
@enduml

