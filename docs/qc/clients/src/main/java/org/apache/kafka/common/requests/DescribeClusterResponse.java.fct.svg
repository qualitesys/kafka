@startuml
!pragma layout smetana
start
note right
constructor DescribeClusterResponse(DescribeClusterResponseDatadata)
end note
:super (ApiKeys.DESCRIBE_CLUSTER);
:this.data=data;
end
start
note right
Map<Integer,Node>nodes()
end note
:return data.brokers().valuesList().stream().map(b->new Node(b.brokerId(),
b.host(),b.port(),b.rack())).collect(Collectors.toMap(Node::id,
Function.identity()));;
stop
end
start
note right
Map<Errors,Integer>errorCounts()
end note
:return errorCounts(Errors.forCode(data.errorCode()));;
stop
end
start
note right
intthrottleTimeMs()
end note
:return data.throttleTimeMs();;
stop
end
start
note right
DescribeClusterResponseDatadata()
end note
:return data;;
stop
end
start
note right
DescribeClusterResponseparse(ByteBufferbuffer,
shortversion)
end note
:return new DescribeClusterResponse(new DescribeClusterResponseData(new ByteBufferAccessor(buffer),version));;
stop
end
@enduml

