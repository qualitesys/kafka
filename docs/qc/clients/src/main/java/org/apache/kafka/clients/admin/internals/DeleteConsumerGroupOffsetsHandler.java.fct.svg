@startuml
!pragma layout smetana
start
note right
constructor DeleteConsumerGroupOffsetsHandler(StringgroupId,
Set<TopicPartition>partitions,LogContextlogContext)
end note
:this.groupId=CoordinatorKey.byGroupId(groupId);;
:this.partitions=partitions;;
:this.log=logContext.logger(DeleteConsumerGroupOffsetsHandler.class );;
:this.lookupStrategy=new CoordinatorStrategy(CoordinatorType.GROUP,
logContext);;
end
start
note right
StringapiName()
end note
:return "offsetDelete";;
stop
end
start
note right
AdminApiLookupStrategy<CoordinatorKey>lookupStrategy()
end note
:return lookupStrategy;;
stop
end
start
note right
AdminApiFuture.SimpleAdminApiFuture<CoordinatorKey,
Map<TopicPartition,Errors>>newFuture(StringgroupId)
end note
:return AdminApiFuture.forKeys(Collections.singleton(CoordinatorKey.byGroupId(groupId)));;
stop
end
start
note right
void validateKeys(Set<CoordinatorKey>groupIds)
end note
if (!groupIds.equals(Collections.singleton(groupId))) then (yes) 
:throw new IllegalArgumentException("Received unexpected group ids "+
groupIds+" (expected only "+Collections.singleton(groupId)+
")");;
stop
endif 
end
start
note right
OffsetDeleteRequest.BuilderbuildBatchedRequest(intcoordinatorId,
Set<CoordinatorKey>groupIds)
end note
:validateKeys(groupIds);;
:final OffsetDeleteRequestTopicCollectiontopics=new OffsetDeleteRequestTopicCollection();;
:partitions.stream().collect(Collectors.groupingBy(TopicPartition::topic)).forEach((topic,
topicPartitions)->topics.add(new OffsetDeleteRequestTopic().setName(topic).setPartitions(topicPartitions.stream().map(tp->new OffsetDeleteRequestPartition().setPartitionIndex(tp.partition())).collect(Collectors.toList()))));;
:return new OffsetDeleteRequest.Builder(new OffsetDeleteRequestData()
.setGroupId(groupId.idValue).setTopics(topics));;
stop
end
start
note right
ApiResult<CoordinatorKey,Map<TopicPartition,
Errors>>handleResponse(Nodecoordinator,Set<CoordinatorKey>groupIds,
AbstractResponseabstractResponse)
end note
:validateKeys(groupIds);;
:final OffsetDeleteResponseresponse=(OffsetDeleteResponse)abstractResponse;;
:final Errorserror=Errors.forCode(response.data()
.errorCode());;
if (error!=Errors.NONE) then (yes) 
:final Map<CoordinatorKey,Throwable>failed=new HashMap<>();;
:final Set<CoordinatorKey>groupsToUnmap=new HashSet<>();;
:handleGroupError(groupId,error,failed,groupsToUnmap);;
:return new ApiResult<>(Collections.emptyMap(),
failed,new ArrayList<>(groupsToUnmap));;
stop
else (no)
:final Map<TopicPartition,Errors>partitionResults=new HashMap<>();;
:response.data().topics().forEach(topic->topic.partitions().forEach(partition->partitionResults.put(new TopicPartition(topic.name(),
partition.partitionIndex()),Errors.forCode(partition.errorCode()))));;
:return ApiResult.completed(groupId,partitionResults);;
stop
endif 
end
start
note right
void handleGroupError(CoordinatorKeygroupId,
Errorserror,Map<CoordinatorKey,Throwable>failed,
Set<CoordinatorKey>groupsToUnmap)
end note
switch (switch (error))
endswith
end
@enduml

