181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="403.5" x2="441" y1="387.2422" y2="387.2422"/><polygon fill="#181818" points="437,456.1289,441,466.1289,445,456.1289,441,460.1289" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="441" x2="441" y1="387.2422" y2="530.1289"/><line style="stroke:#181818;stroke-width:1.0;" x1="441" x2="358" y1="530.1289" y2="530.1289"/><line style="stroke:#181818;stroke-width:1.0;" x1="358" x2="358" y1="530.1289" y2="550.1289"/><polygon fill="#181818" points="354,540.1289,358,550.1289,362,540.1289,358,544.1289" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="358" x2="358" y1="352.6758" y2="375.2422"/><polygon fill="#181818" points="354,365.2422,358,375.2422,362,365.2422,358,369.2422" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="358" x2="358" y1="584.0977" y2="604.0977"/><polygon fill="#181818" points="354,594.0977,358,604.0977,362,594.0977,358,598.0977" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="358" x2="358" y1="652.0352" y2="672.0352"/><polygon fill="#181818" points="354,662.0352,358,672.0352,362,662.0352,358,666.0352" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="358" x2="358" y1="719.9727" y2="739.9727"/><polygon fill="#181818" points="354,729.9727,358,739.9727,362,729.9727,358,733.9727" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="358" x2="358" y1="773.9414" y2="793.9414"/><polygon fill="#181818" points="354,783.9414,358,793.9414,362,783.9414,358,787.9414" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[c0612995d0384cde9891407c08b6c863]
@startuml
!pragma layout smetana
start
note right
constructor ExponentialBackoff(long initialInterval,
int multiplier,long maxInterval,double jitter)
end note
:this.initialInterval=initialInterval;;
:this.multiplier=multiplier;;
:this.jitter=jitter;;
:this.expMax=maxInterval>initialInterval? Math.log(maxInterval/(double )Math.max(initialInterval,
1))/Math.log(multiplier):0;;
end
start
note right
long backoff(long attempts)
end note
if (expMax==0) then (yes) 
:return initialInterval;;
stop
endif 
:double exp=Math.min(attempts,this.expMax);;
:double term=initialInterval*Math.pow(multiplier,
exp);;
:double randomFactor=jitter<Double.MIN_NORMAL? 1.0:ThreadLocalRandom.current().nextDouble(1-jitter,1+
jitter);;
:return (long )(randomFactor*term);;
stop
end
@enduml

