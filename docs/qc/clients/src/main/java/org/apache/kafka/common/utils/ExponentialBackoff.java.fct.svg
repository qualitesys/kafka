@startuml
!pragma layout smetana
start
note right
constructor ExponentialBackoff(longinitialInterval,intmultiplier,longmaxInterval,doublejitter)
end note
:this.initialInterval=initialInterval;
:this.multiplier=multiplier;
:this.jitter=jitter;
:this.expMax=maxInterval>initialInterval? Math.log(maxInterval/(double)Math.max(initialInterval,1))/Math.log(multiplier):0;
end
start
note right
longbackoff(longattempts)
end note
if (expMax==0) then (yes) 
:return initialInterval;;
stop
endif 
:return (long)(randomFactor*term);;
stop
end
@enduml

