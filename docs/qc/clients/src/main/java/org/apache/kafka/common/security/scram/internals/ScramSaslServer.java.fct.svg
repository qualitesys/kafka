<?xml version="1.0" encoding="UTF-8" standalone="no"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="439px" preserveAspectRatio="none" style="width:481px;height:439px;background:#000000;" version="1.1" viewBox="0 0 481 439" width="481px" zoomAndPan="magnify"><defs/><g><rect fill="#182119" height="1" style="stroke:#182119;stroke-width:1.0;" width="1" x="0" y="0"/><text fill="#33FF02" font-family="sans-serif" font-size="12" font-style="italic" font-weight="bold" lengthAdjust="spacing" textLength="127" x="5" y="17">PlantUML 1.2022.7</text><text fill="#33FF02" font-family="sans-serif" font-size="12" font-style="italic" font-weight="bold" lengthAdjust="spacing" textLength="4" x="5" y="30.9688"> </text><text fill="#33FF02" font-family="sans-serif" font-size="12" font-style="italic" font-weight="bold" lengthAdjust="spacing" textLength="399" x="5" y="44.9375">&lt;b&gt;This version of PlantUML is 138 days old, so you should</text><text fill="#33FF02" font-family="sans-serif" font-size="12" font-style="italic" font-weight="bold" lengthAdjust="spacing" textLength="408" x="5" y="58.9063">&lt;b&gt;consider upgrading from https://plantuml.com/download</text><rect fill="#33FF02" height="21.2969" style="stroke:#33FF02;stroke-width:1.0;" width="469" x="5" y="68.875"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="178" x="6" y="83.875">[From string (line 19) ]</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="5" x="5" y="104.1719"> </text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="79" x="5" y="120.4688">@startuml</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="190" x="5" y="136.7656">!pragma layout smetana</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="37" x="5" y="153.0625">start</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="78" x="5" y="169.3594">note right</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="469" x="5" y="185.6563">constructor ScramSaslServer(ScramMechanismmechanism,</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="428" x="5" y="201.9531">Map&lt;String,? &gt;props,CallbackHandlercallbackHandler)</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="71" x="5" y="218.25">end note</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="242" x="5" y="234.5469">:this.mechanism=mechanism;;</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="406" x="5" y="250.8438">:this.formatter=new ScramFormatter(mechanism);;</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="312" x="5" y="267.1406">:this.callbackHandler=callbackHandler;;</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="397" x="5" y="283.4375">:setState(State.RECEIVE_CLIENT_FIRST_MESSAGE);;</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="30" x="5" y="299.7344">end</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="37" x="5" y="316.0313">start</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="78" x="5" y="332.3281">note right</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="326" x="5" y="348.625">byte[]evaluateResponse(byte[]response)</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="71" x="5" y="364.9219">end note</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="39" x="5" y="381.2188">:try ;</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="178" x="5" y="397.5156">switch (switch (state))</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" text-decoration="wavy underline" textLength="73" x="5" y="413.8125">endswith</text><text fill="#FF0000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="106" x="10" y="430.1094">Syntax Error?</text><!--MD5=[555c535d0bff06bb5990a3f1ab832952]
@startuml
!pragma layout smetana
start
note right
constructor ScramSaslServer(ScramMechanismmechanism,
Map<String,? >props,CallbackHandlercallbackHandler)
end note
:this.mechanism=mechanism;;
:this.formatter=new ScramFormatter(mechanism);;
:this.callbackHandler=callbackHandler;;
:setState(State.RECEIVE_CLIENT_FIRST_MESSAGE);;
end
start
note right
byte[]evaluateResponse(byte[]response)
end note
:try ;
switch (switch (state))
endswith
:catch (SaslException|AuthenticationExceptione);
:clearCredentials();;
:setState(State.FAILED);;
:throw e;;
stop
end
start
note right
StringgetAuthorizationID()
end note
if (!isComplete()) then (yes) 
:throw new IllegalStateException("Authentication exchange has not completed");;
stop
endif 
:return authorizationId;;
stop
end
start
note right
StringgetMechanismName()
end note
:return mechanism.mechanismName();;
stop
end
start
note right
ObjectgetNegotiatedProperty(StringpropName)
end note
if (!isComplete()) then (yes) 
:throw new IllegalStateException("Authentication exchange has not completed");;
stop
endif 
if (SaslInternalConfigs.CREDENTIAL_LIFETIME_MS_SASL_NEGOTIATED_PROPERTY_KEY.equals(propName)) then (yes) 
:return tokenExpiryTimestamp;;
stop
endif 
if (SUPPORTED_EXTENSIONS.contains(propName)) then (yes) 
:return scramExtensions.map().get(propName);;
stop
else (no)
:return null ;;
stop
endif 
end
start
note right
booleanisComplete()
end note
:return state==State.COMPLETE;;
stop
end
start
note right
byte[]unwrap(byte[]incoming,intoffset,intlen)
end note
if (!isComplete()) then (yes) 
:throw new IllegalStateException("Authentication exchange has not completed");;
stop
endif 
:return Arrays.copyOfRange(incoming,offset,offset+
len);;
stop
end
start
note right
byte[]wrap(byte[]outgoing,intoffset,intlen)
end note
if (!isComplete()) then (yes) 
:throw new IllegalStateException("Authentication exchange has not completed");;
stop
endif 
:return Arrays.copyOfRange(outgoing,offset,offset+
len);;
stop
end
start
note right
void dispose()
end note
end
start
note right
void setState(Statestate)
end note
:log.debug("Setting SASL/{} server state to {}",
mechanism,state);;
:this.state=state;;
end
start
note right
void verifyClientProof(ClientFinalMessageclientFinalMessage)
end note
:try ;
:byte[]expectedStoredKey=scramCredential.storedKey();;
:byte[]clientSignature=formatter.clientSignature(expectedStoredKey,
clientFirstMessage,serverFirstMessage,clientFinalMessage);;
:byte[]computedStoredKey=formatter.storedKey(clientSignature,
clientFinalMessage.proof());;
if (!MessageDigest.isEqual(computedStoredKey,
expectedStoredKey)) then (yes) 
:throw new SaslException("Invalid client credentials");;
stop
endif 
:catch (InvalidKeyExceptione);
:throw new SaslException("Sasl client verification failed",e);;
stop
end
start
note right
void clearCredentials()
end note
:scramCredential=null ;;
:clientFirstMessage=null ;;
:serverFirstMessage=null ;;
end
start
note right
SaslServercreateSaslServer(Stringmechanism,
Stringprotocol,StringserverName,Map<String,
? >props,CallbackHandlercbh)
end note
if (!ScramMechanism.isScram(mechanism)) then (yes) 
:throw new SaslException(String.format("Requested mechanism '%s' is not supported. Supported mechanisms are '%s'.",
mechanism,ScramMechanism.mechanismNames()));;
stop
endif 
:try ;
:return new ScramSaslServer(ScramMechanism.forMechanismName(mechanism),
props,cbh);;
stop
:catch (NoSuchAlgorithmExceptione);
:throw new SaslException("Hash algorithm not supported for mechanism "+
mechanism,e);;
stop
end
start
note right
String[]getMechanismNames(Map<String,? >props)
end note
:Collection<String>mechanisms=ScramMechanism.mechanismNames();;
:return mechanisms.toArray(new String[0]);;
stop
end
@enduml

