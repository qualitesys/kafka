@startuml
!pragma layout smetana
start
note right
constructor ScramSaslServer(ScramMechanismmechanism,
Map<String,? >props,CallbackHandlercallbackHandler)
end note
:this.mechanism=mechanism;
:this.formatter=new ScramFormatter(mechanism);
:this.callbackHandler=callbackHandler;
:setState(State.RECEIVE_CLIENT_FIRST_MESSAGE);
end
start
note right
byte[]evaluateResponse(byte[]response)
end note
:this.clientFirstMessage=new ClientFirstMessage(response);
:this.scramExtensions=clientFirstMessage.extensions();
if (!SUPPORTED_EXTENSIONS.containsAll(scramExtensions.map()
.keySet())) then (yes) 
:log.debug("Unsupported extensions will be ignored,
 supported {}, provided {}",SUPPORTED_EXTENSIONS,
scramExtensions.map().keySet());
endif 
:this.username=ScramFormatter.username(saslName);
if (scramExtensions.tokenAuthenticated()) then (yes) 
:credentialCallback=tokenCallback;
:callbackHandler.handle(new Callback[]{nameCallback,
tokenCallback});
if (tokenCallback.tokenOwner()==null ) then (yes) 
:throw new SaslException("Token Authentication failed: Invalid tokenId : "+
username);;
endif 
:this.authorizationId=tokenCallback.tokenOwner();
:this.tokenExpiryTimestamp=tokenCallback.tokenExpiryTimestamp();
else (no)
:credentialCallback=new ScramCredentialCallback();
:callbackHandler.handle(new Callback[]{nameCallback,
credentialCallback});
:this.authorizationId=username;
:this.tokenExpiryTimestamp=null ;
endif 
:this.scramCredential=credentialCallback.scramCredential();
if (scramCredential==null ) then (yes) 
:throw new SaslException("Authentication failed: Invalid user credentials");;
endif 
if (!authorizationIdFromClient.isEmpty()&&!authorizationIdFromClient.equals(username)) then (yes) 
:throw new SaslAuthenticationException("Authentication failed: Client requested an authorization id that is different from username");;
endif 
if (scramCredential.iterations()<mechanism.minIterations()) then (yes) 
:throw new SaslException("Iterations "+scramCredential.iterations()+
" is less than the minimum "+mechanism.minIterations()+
" for "+mechanism);;
endif 
:this.serverFirstMessage=new ServerFirstMessage(clientFirstMessage.nonce(),
serverNonce,scramCredential.salt(),scramCredential.iterations());
:setState(State.RECEIVE_CLIENT_FINAL_MESSAGE);
:return serverFirstMessage.toBytes();;
stop
:throw e;;
:throw new SaslException("Authentication failed: Credentials could not be obtained",e);;
:verifyClientProof(clientFinalMessage);
:clearCredentials();
:setState(State.COMPLETE);
:return serverFinalMessage.toBytes();;
stop
:throw new SaslException("Authentication failed: Invalid client final message",e);;
:throw new IllegalSaslStateException("Unexpected challenge in Sasl server state "+
state);;
:clearCredentials();
:setState(State.FAILED);
:throw e;;
end
start
note right
StringgetAuthorizationID()
end note
if (!isComplete()) then (yes) 
:throw new IllegalStateException("Authentication exchange has not completed");;
endif 
:return authorizationId;;
stop
end
start
note right
StringgetMechanismName()
end note
:return mechanism.mechanismName();;
stop
end
start
note right
ObjectgetNegotiatedProperty(StringpropName)
end note
if (!isComplete()) then (yes) 
:throw new IllegalStateException("Authentication exchange has not completed");;
endif 
if (SaslInternalConfigs.CREDENTIAL_LIFETIME_MS_SASL_NEGOTIATED_PROPERTY_KEY.equals(propName)) then (yes) 
:return tokenExpiryTimestamp;;
stop
endif 
if (SUPPORTED_EXTENSIONS.contains(propName)) then (yes) 
:return scramExtensions.map().get(propName);;
stop
else (no)
:return null ;;
stop
endif 
end
start
note right
booleanisComplete()
end note
:return state==State.COMPLETE;;
stop
end
start
note right
byte[]unwrap(byte[]incoming,intoffset,intlen)
end note
if (!isComplete()) then (yes) 
:throw new IllegalStateException("Authentication exchange has not completed");;
endif 
:return Arrays.copyOfRange(incoming,offset,offset+
len);;
stop
end
start
note right
byte[]wrap(byte[]outgoing,intoffset,intlen)
end note
if (!isComplete()) then (yes) 
:throw new IllegalStateException("Authentication exchange has not completed");;
endif 
:return Arrays.copyOfRange(outgoing,offset,offset+
len);;
stop
end
start
note right
void dispose()
end note
end
start
note right
void setState(Statestate)
end note
:log.debug("Setting SASL/{} server state to {}",
mechanism,state);
:this.state=state;
end
start
note right
void verifyClientProof(ClientFinalMessageclientFinalMessage)
end note
if (!MessageDigest.isEqual(computedStoredKey,
expectedStoredKey)) then (yes) 
:throw new SaslException("Invalid client credentials");;
endif 
:throw new SaslException("Sasl client verification failed",e);;
end
start
note right
void clearCredentials()
end note
:scramCredential=null ;
:clientFirstMessage=null ;
:serverFirstMessage=null ;
end
start
note right
SaslServercreateSaslServer(Stringmechanism,
Stringprotocol,StringserverName,Map<String,
? >props,CallbackHandlercbh)
end note
if (!ScramMechanism.isScram(mechanism)) then (yes) 
:throw new SaslException(String.format("Requested mechanism '%s' is not supported. Supported mechanisms are '%s'.",
mechanism,ScramMechanism.mechanismNames()));;
endif 
:return new ScramSaslServer(ScramMechanism.forMechanismName(mechanism),
props,cbh);;
stop
:throw new SaslException("Hash algorithm not supported for mechanism "+
mechanism,e);;
end
start
note right
String[]getMechanismNames(Map<String,? >props)
end note
:return mechanisms.toArray(new String[0]);;
stop
end
