@startuml
!pragma layout smetana
start
note right
constructor CreateDelegationTokenRequest(CreateDelegationTokenRequestData data,
short version)
end note
:super (ApiKeys.CREATE_DELEGATION_TOKEN,version);;
:this.data=data;;
end
start
note right
CreateDelegationTokenRequest parse(ByteBuffer buffer,
short version)
end note
:return new CreateDelegationTokenRequest(new CreateDelegationTokenRequestData(new ByteBufferAccessor(buffer),
version),version);;
stop
end
start
note right
CreateDelegationTokenRequestData data()
end note
:return data;;
stop
end
start
note right
AbstractResponse getErrorResponse(int throttleTimeMs,
Throwable e)
end note
:return CreateDelegationTokenResponse.prepareResponse(version(),
throttleTimeMs,Errors.forException(e),KafkaPrincipal.ANONYMOUS,
KafkaPrincipal.ANONYMOUS);;
stop
end
start
note right
constructor Builder(CreateDelegationTokenRequestData data)
end note
:super (ApiKeys.CREATE_DELEGATION_TOKEN);;
:this.data=data;;
end
start
note right
CreateDelegationTokenRequest build(short version)
end note
:return new CreateDelegationTokenRequest(data,
version);;
stop
end
start
note right
String toString()
end note
:return data.toString();;
stop
end
@enduml

