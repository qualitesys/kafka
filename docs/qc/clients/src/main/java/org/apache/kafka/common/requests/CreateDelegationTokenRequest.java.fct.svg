@startuml
!pragma layout smetana
start
note right
constructor CreateDelegationTokenRequest(CreateDelegationTokenRequestDatadata,
shortversion)
end note
end
start
note right
CreateDelegationTokenRequestparse(ByteBufferbuffer,
shortversion)
end note
:return new CreateDelegationTokenRequest(new CreateDelegationTokenRequestData(new ByteBufferAccessor(buffer),
version),version);;
stop
end
start
note right
CreateDelegationTokenRequestDatadata()
end note
:return data;;
stop
end
start
note right
AbstractResponsegetErrorResponse(intthrottleTimeMs,
Throwablee)
end note
:return CreateDelegationTokenResponse.prepareResponse(version(),
throttleTimeMs,Errors.forException(e),KafkaPrincipal.ANONYMOUS,
KafkaPrincipal.ANONYMOUS);;
stop
end
start
note right
constructor Builder(CreateDelegationTokenRequestDatadata)
end note
end
start
note right
CreateDelegationTokenRequestbuild(shortversion)
end note
:return new CreateDelegationTokenRequest(data,
version);;
stop
end
start
note right
StringtoString()
end note
:return data.toString();;
stop
end
@enduml

