@startuml
!pragma layout smetana
start
note right
booleankafkaComplete(Tvalue)
end note
:return super .complete(value);;
stop
end
start
note right
booleankafkaCompleteExceptionally(Throwablethrowable)
end note
:return super .completeExceptionally(throwable);;
stop
end
start
note right
booleancomplete(Tvalue)
end note
end
start
note right
booleancompleteExceptionally(Throwableex)
end note
end
start
note right
void obtrudeValue(Tvalue)
end note
end
start
note right
void obtrudeException(Throwableex)
end note
end
:return new KafkaCompletableFuture<>();;
stop
start
note right
CompletableFuture<T>completeAsync(Supplier<?  extends T>supplier,Executorexecutor)
end note
end
start
note right
CompletableFuture<T>completeAsync(Supplier<?  extends T>supplier)
end note
end
start
note right
CompletableFuture<T>completeOnTimeout(Tvalue,longtimeout,TimeUnitunit)
end note
end
start
note right
UnsupportedOperationExceptionerroneousCompletionException()
end note
:return new UnsupportedOperationException("User code should not complete futures returned from Kafka clients");;
stop
end
@enduml

