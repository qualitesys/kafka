@startuml
!pragma layout smetana
start
note right
constructor ElectLeadersResult(KafkaFuture<Map<TopicPartition,Optional<Throwable>>>electionFuture)
end note
:this.electionFuture=electionFuture;
end
start
note right
KafkaFuture<Map<TopicPartition,Optional<Throwable>>>partitions()
end note
:return electionFuture;;
stop
end
start
note right
KafkaFuture<Void>all()
end note
:partitions().whenComplete(new KafkaFuture.BiConsumer<Map<TopicPartition,
Optional<Throwable>>,Throwable>(){@Override public void accept(Map<TopicPartition,Optional<Throwable>>topicPartitions,Throwablethrowable){if (throwable!=null ){result.completeExceptionally(throwable);}else {for (Optional<Throwable>exception:topicPartitions.values()){if (exception.isPresent()){result.completeExceptionally(exception.get());return ;}}result.complete(null );}}});
:return result;;
stop
end
@enduml

