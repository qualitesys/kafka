@startuml
!pragma layout smetana
start
note right
constructor ConsumerInterceptors(List<ConsumerInterceptor<K,
V>>interceptors)
end note
:this.interceptors=interceptors;
end
start
note right
ConsumerRecords<K,V>onConsume(ConsumerRecords<K,
V>records)
end note
:interceptRecords=interceptor.onConsume(interceptRecords);
:log.warn("Error executing interceptor onConsume callback",e);
:return interceptRecords;;
stop
end
start
note right
void onCommit(Map<TopicPartition,OffsetAndMetadata>offsets)
end note
:interceptor.onCommit(offsets);
:log.warn("Error executing interceptor onCommit callback",e);
end
start
note right
void close()
end note
:interceptor.close();
:log.error("Failed to close consumer interceptor ",e);
end
@enduml

