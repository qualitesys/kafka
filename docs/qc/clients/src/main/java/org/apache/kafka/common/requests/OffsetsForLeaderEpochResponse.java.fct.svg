@startuml
!pragma layout smetana
start
note right
constructor OffsetsForLeaderEpochResponse(OffsetForLeaderEpochResponseDatadata)
end note
:super (ApiKeys.OFFSET_FOR_LEADER_EPOCH);
:this.data=data;
end
start
note right
OffsetForLeaderEpochResponseDatadata()
end note
:return data;;
stop
end
start
note right
Map<Errors,Integer>errorCounts()
end note
:data.topics().forEach(topic->topic.partitions()
.forEach(partition->updateErrorCounts(errorCounts,
Errors.forCode(partition.errorCode()))));
:return errorCounts;;
stop
end
start
note right
intthrottleTimeMs()
end note
:return data.throttleTimeMs();;
stop
end
start
note right
OffsetsForLeaderEpochResponseparse(ByteBufferbuffer,shortversion)
end note
:return new OffsetsForLeaderEpochResponse(new OffsetForLeaderEpochResponseData(new ByteBufferAccessor(buffer),version));;
stop
end
start
note right
StringtoString()
end note
:return data.toString();;
stop
end
@enduml

