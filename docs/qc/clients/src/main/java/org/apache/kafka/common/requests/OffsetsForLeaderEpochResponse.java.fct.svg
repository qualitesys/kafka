@startuml
!pragma layout smetana
start
note right
constructor OffsetsForLeaderEpochResponse(OffsetForLeaderEpochResponseData data)
end note
:super (ApiKeys.OFFSET_FOR_LEADER_EPOCH);;
:this.data=data;;
end
start
note right
OffsetForLeaderEpochResponseData data()
end note
:return data;;
stop
end
start
note right
Map<Errors,Integer> errorCounts()
end note
:Map<Errors,Integer> errorCounts=new HashMap<>();;
:data.topics().forEach(topic->topic.partitions().forEach(partition->updateErrorCounts(errorCounts,
Errors.forCode(partition.errorCode()))));;
:return errorCounts;;
stop
end
start
note right
int throttleTimeMs()
end note
:return data.throttleTimeMs();;
stop
end
start
note right
OffsetsForLeaderEpochResponse parse(ByteBuffer buffer,
short version)
end note
:return new OffsetsForLeaderEpochResponse(new OffsetForLeaderEpochResponseData(new ByteBufferAccessor(buffer),
version));;
stop
end
start
note right
String toString()
end note
:return data.toString();;
stop
end
@enduml

