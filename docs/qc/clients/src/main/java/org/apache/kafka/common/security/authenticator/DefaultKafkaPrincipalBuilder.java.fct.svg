roke-width:1.0;"/><!--MD5=[a7a9679e3c56410aae8ac32d519e7ab7]
@startuml
!pragma layout smetana
start
note right
constructor DefaultKafkaPrincipalBuilder(KerberosShortNamerkerberosShortNamer,SslPrincipalMappersslPrincipalMapper)
end note
:this.kerberosShortNamer=kerberosShortNamer;
:this.sslPrincipalMapper=sslPrincipalMapper;
end
start
note right
KafkaPrincipalbuild(AuthenticationContextcontext)
end note
if (context instanceof PlaintextAuthenticationContext) then (yes) 
:return KafkaPrincipal.ANONYMOUS;;
stop
else (no)
endif 
end
start
note right
KafkaPrincipalapplyKerberosShortNamer(StringauthorizationId)
end note
:return new KafkaPrincipal(KafkaPrincipal.USER_TYPE,shortName);;
stop
end
start
note right
KafkaPrincipalapplySslPrincipalMapper(Principalprincipal)
end note
if (!(principal instanceof X500Principal)||principal==KafkaPrincipal.ANONYMOUS) then (yes) 
:return new KafkaPrincipal(KafkaPrincipal.USER_TYPE,principal.getName());;
stop
else (no)
:return new KafkaPrincipal(KafkaPrincipal.USER_TYPE,sslPrincipalMapper.getName(principal.getName()));;
stop
endif 
end
start
note right
