constructor RecordsSend(Trecords,intmaxBytesToWrite)
end note
:this.records=records;;
:this.maxBytesToWrite=maxBytesToWrite;;
:this.remaining=maxBytesToWrite;;
end
start
note right
booleancompleted()
end note
:return remaining<=0&&!pending;;
stop
end
start
note right
longwriteTo(TransferableChannelchannel)
end note
:longwritten=0;;
if (remaining>0) then (yes) 
:written=writeTo(channel,size()-remaining,
remaining);;
if (written<0) then (yes) 
:throw new EOFException("Wrote negative bytes to channel. This shouldn't happen.");;
stop
endif 
:remaining-=written;;
endif 
:pending=channel.hasPendingWrites();;
if (remaining<=0&&pending) then (yes) 
:channel.write(EMPTY_BYTE_BUFFER);;
endif 
:return written;;
stop
end
start
note right
longsize()
end note
:return maxBytesToWrite;;
stop
end
start
note right
Trecords()
end note
:return records;;
stop
end
