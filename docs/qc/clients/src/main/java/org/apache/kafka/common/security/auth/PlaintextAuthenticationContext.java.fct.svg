@startuml
!pragma layout smetana
start
note right
constructor PlaintextAuthenticationContext(InetAddressclientAddress,StringlistenerName)
end note
:this.clientAddress=clientAddress;
:this.listenerName=listenerName;
end
start
note right
SecurityProtocolsecurityProtocol()
end note
:return SecurityProtocol.PLAINTEXT;;
stop
end
start
note right
InetAddressclientAddress()
end note
:return clientAddress;;
stop
end
start
note right
StringlistenerName()
end note
:return listenerName;;
stop
end
@enduml

