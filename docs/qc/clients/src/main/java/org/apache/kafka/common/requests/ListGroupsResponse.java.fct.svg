@startuml
!pragma layout smetana
start
note right
constructor ListGroupsResponse(ListGroupsResponseDatadata)
end note
end
start
note right
ListGroupsResponseDatadata()
end note
:return data;;
stop
end
start
note right
intthrottleTimeMs()
end note
:return data.throttleTimeMs();;
stop
end
start
note right
Map<Errors,Integer>errorCounts()
end note
:return errorCounts(Errors.forCode(data.errorCode()));;
stop
end
start
note right
ListGroupsResponseparse(ByteBufferbuffer,
shortversion)
end note
:return new ListGroupsResponse(new ListGroupsResponseData(new ByteBufferAccessor(buffer),
version));;
stop
end
start
note right
booleanshouldClientThrottle(shortversion)
end note
:return version>=2;;
stop
end
@enduml

