@startuml
!pragma layout smetana
start
note right
constructor ListGroupsResponse(ListGroupsResponseData data)
end note
:super (ApiKeys.LIST_GROUPS);;
:this.data=data;;
end
start
note right
ListGroupsResponseData data()
end note
:return data;;
stop
end
start
note right
int throttleTimeMs()
end note
:return data.throttleTimeMs();;
stop
end
start
note right
Map<Errors,Integer> errorCounts()
end note
:return errorCounts(Errors.forCode(data.errorCode()));;
stop
end
start
note right
ListGroupsResponse parse(ByteBuffer buffer,
short version)
end note
:return new ListGroupsResponse(new ListGroupsResponseData(new ByteBufferAccessor(buffer),
version));;
stop
end
start
note right
boolean shouldClientThrottle(short version)
end note
:return version>=2;;
stop
end
@enduml

