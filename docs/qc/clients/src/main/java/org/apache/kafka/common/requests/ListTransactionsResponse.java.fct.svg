@startuml
!pragma layout smetana
start
note right
constructor ListTransactionsResponse(ListTransactionsResponseDatadata)
end note
:super (ApiKeys.LIST_TRANSACTIONS);
:this.data=data;
end
start
note right
ListTransactionsResponseDatadata()
end note
:return data;;
stop
end
start
note right
Map<Errors,Integer>errorCounts()
end note
:updateErrorCounts(errorCounts,Errors.forCode(data.errorCode()));
:return errorCounts;;
stop
end
start
note right
ListTransactionsResponseparse(ByteBufferbuffer,
shortversion)
end note
:return new ListTransactionsResponse(new ListTransactionsResponseData(new ByteBufferAccessor(buffer),version));;
stop
end
start
note right
StringtoString()
end note
:return data.toString();;
stop
end
start
note right
intthrottleTimeMs()
end note
:return data.throttleTimeMs();;
stop
end
@enduml

