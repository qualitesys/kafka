@startuml
!pragma layout smetana
start
note right
constructor ListTransactionsResponse(ListTransactionsResponseData data)
end note
:super (ApiKeys.LIST_TRANSACTIONS);;
:this.data=data;;
end
start
note right
ListTransactionsResponseData data()
end note
:return data;;
stop
end
start
note right
Map<Errors,Integer> errorCounts()
end note
:Map<Errors,Integer> errorCounts=new HashMap<>();;
:updateErrorCounts(errorCounts,Errors.forCode(data.errorCode()));;
:return errorCounts;;
stop
end
start
note right
ListTransactionsResponse parse(ByteBuffer buffer,
short version)
end note
:return new ListTransactionsResponse(new ListTransactionsResponseData(new ByteBufferAccessor(buffer),
version));;
stop
end
start
note right
String toString()
end note
:return data.toString();;
stop
end
start
note right
int throttleTimeMs()
end note
:return data.throttleTimeMs();;
stop
end
@enduml

