@startuml
!pragma layout smetana
start
note right
CloseableVerificationKeyResolvercreate(Map<String,
? >configs,Map<String,Object>jaasConfig)
end note
:return create(configs,null ,jaasConfig);;
stop
end
start
note right
CloseableVerificationKeyResolvercreate(Map<String,
? >configs,StringsaslMechanism,Map<String,
Object>jaasConfig)
end note
:ConfigurationUtilscu=new ConfigurationUtils(configs,
saslMechanism);;
:URLjwksEndpointUrl=cu.validateUrl(SASL_OAUTHBEARER_JWKS_ENDPOINT_URL);;
if (jwksEndpointUrl.getProtocol().toLowerCase(Locale.ROOT).equals("file")) then (yes) 
:Pathp=cu.validateFile(SASL_OAUTHBEARER_JWKS_ENDPOINT_URL);;
:return new JwksFileVerificationKeyResolver(p);;
stop
else (no)
:longrefreshIntervalMs=cu.validateLong(SASL_OAUTHBEARER_JWKS_ENDPOINT_REFRESH_MS,
true,0L);;
:JaasOptionsUtilsjou=new JaasOptionsUtils(jaasConfig);;
:SSLSocketFactorysslSocketFactory=null ;;
if (jou.shouldCreateSSLSocketFactory(jwksEndpointUrl)) then (yes) 
:sslSocketFactory=jou.createSSLSocketFactory();;
endif 
:HttpsJwkshttpsJwks=new HttpsJwks(jwksEndpointUrl.toString());;
:httpsJwks.setDefaultCacheDuration(refreshIntervalMs);;
if (sslSocketFactory!=null ) then (yes) 
:Getget=new Get();;
:get.setSslSocketFactory(sslSocketFactory);;
:httpsJwks.setSimpleHttpGet(get);;
endif 
:RefreshingHttpsJwksrefreshingHttpsJwks=new RefreshingHttpsJwks(Time.SYSTEM,
httpsJwks,refreshIntervalMs,cu.validateLong(SASL_OAUTHBEARER_JWKS_ENDPOINT_RETRY_BACKOFF_MS),
cu.validateLong(SASL_OAUTHBEARER_JWKS_ENDPOINT_RETRY_BACKOFF_MAX_MS));;
:return new RefreshingHttpsJwksVerificationKeyResolver(refreshingHttpsJwks);;
