@startuml
!pragma layout smetana
start
note right
CloseableVerificationKeyResolvercreate(Map<String,
? >configs,Map<String,Object>jaasConfig)
end note
:return create(configs,null ,jaasConfig);;
stop
end
start
note right
CloseableVerificationKeyResolvercreate(Map<String,
? >configs,StringsaslMechanism,Map<String,
Object>jaasConfig)
end note
if (jwksEndpointUrl.getProtocol().toLowerCase(Locale.ROOT)
.equals("file")) then (yes) 
:return new JwksFileVerificationKeyResolver(p);;
stop
else (no)
if (jou.shouldCreateSSLSocketFactory(jwksEndpointUrl)) then (yes) 
:sslSocketFactory=jou.createSSLSocketFactory();
endif 
:httpsJwks.setDefaultCacheDuration(refreshIntervalMs);
if (sslSocketFactory!=null ) then (yes) 
:get.setSslSocketFactory(sslSocketFactory);
:httpsJwks.setSimpleHttpGet(get);
endif 
:return new RefreshingHttpsJwksVerificationKeyResolver(refreshingHttpsJwks);;
stop
endif 
end
@enduml

