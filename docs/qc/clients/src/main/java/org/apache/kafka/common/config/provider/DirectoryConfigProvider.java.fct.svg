@startuml
!pragma layout smetana
start
note right
void configure(Map<String,? >configs)
end note
end
start
note right
void close()
end note
end
start
note right
ConfigDataget(Stringpath)
end note
:return get(path,Files::isRegularFile);;
stop
end
start
note right
ConfigDataget(Stringpath,Set<String>keys)
end note
:return get(path,pathname->Files.isRegularFile(pathname)&&keys.contains(pathname.getFileName()
.toString()));;
stop
end
start
note right
ConfigDataget(Stringpath,Predicate<Path>fileFilter)
end note
if (path!=null &&!path.isEmpty()) then (yes) 
if (!Files.isDirectory(dir)) then (yes) 
else (no)
:throw new ConfigException("Could not list directory "+
dir);;
endif 
endif 
:return new ConfigData(map);;
stop
end
start
note right
Stringread(Pathpath)
end note
:return new String(Files.readAllBytes(path),
StandardCharsets.UTF_8);;
stop
:throw new ConfigException("Could not read file "+
path+" for property "+path.getFileName());;
end
@enduml

