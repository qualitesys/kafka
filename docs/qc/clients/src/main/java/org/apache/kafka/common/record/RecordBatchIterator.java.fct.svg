1719" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[5b3a8b6304ae885917708e71112c7e04]
@startuml
!pragma layout smetana
start
note right
constructor RecordBatchIterator(LogInputStream<T>logInputStream)
end note
:this.logInputStream=logInputStream;;
end
start
note right
TmakeNext()
end note
:try {Tbatch=logInputStream.nextBatch();if (batch==null )return allDone();return batch;}catch (EOFExceptione){throw new CorruptRecordException("Unexpected EOF while attempting to read the next batch",
e);}catch (IOExceptione){throw new KafkaException(e);};
end
@enduml

