" y2="447.0586"/><line style="stroke:#181818;stroke-width:1.0;" x1="327.5" x2="327.5" y1="447.0586" y2="467.0586"/><polygon fill="#181818" points="323.5,457.0586,327.5,467.0586,331.5,457.0586,327.5,461.0586" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="327.5" x2="327.5" y1="272.1719" y2="292.1719"/><polygon fill="#181818" points="323.5,282.1719,327.5,292.1719,331.5,282.1719,327.5,286.1719" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="327.5" x2="327.5" y1="501.0273" y2="521.0273"/><polygon fill="#181818" points="323.5,511.0273,327.5,521.0273,331.5,511.0273,327.5,515.0273" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="327.5" x2="327.5" y1="586.9961" y2="606.9961"/><polygon fill="#181818" points="323.5,596.9961,327.5,606.9961,331.5,596.9961,327.5,600.9961" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="327.5" x2="327.5" y1="640.9648" y2="660.9648"/><polygon fill="#181818" points="323.5,650.9648,327.5,660.9648,331.5,650.9648,327.5,654.9648" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="327.5" x2="327.5" y1="726.9336" y2="746.9336"/><polygon fill="#181818" points="323.5,736.9336,327.5,746.9336,331.5,736.9336,327.5,740.9336" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="327.5" x2="327.5" y1="780.9023" y2="800.9023"/><polygon fill="#181818" points="323.5,790.9023,327.5,800.9023,331.5,790.9023,327.5,794.9023" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[c31e7fe1694c09e2838caad82134e7ed]
@startuml
!pragma layout smetana
start
note right
constructor RecordBatchIterator(LogInputStream<T>logInputStream)
end note
:this.logInputStream=logInputStream;;
end
start
note right
TmakeNext()
end note
:try ;
:Tbatch=logInputStream.nextBatch();;
if (batch==null ) then (yes) 
:return allDone();;
stop
endif 
:return batch;;
stop
:catch (EOFExceptione);
:throw new CorruptRecordException("Unexpected EOF while attempting to read the next batch",e);;
stop
:catch (IOExceptione);
:throw new KafkaException(e);;
stop
end
@enduml

