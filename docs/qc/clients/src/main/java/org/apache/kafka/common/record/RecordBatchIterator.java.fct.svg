7c]
@startuml
!pragma layout smetana
start
note right
constructor RecordBatchIterator(LogInputStream<T>logInputStream)
end note
:this.logInputStream=logInputStream;;
end
start
note right
TmakeNext()
end note
switch (try/catch block)
case (try)
:Tbatch=logInputStream.nextBatch();;
if (batch==null ) then (yes) 
:return allDone();;
stop
endif 
:return batch;;
stop
case (catch (EOFExceptione))
:throw new CorruptRecordException("Unexpected EOF while attempting to read the next batch",e);;
stop
case (catch (IOExceptione))
:throw new KafkaException(e);;
stop
endswitch
end
@enduml

