h:1.0;" x1="508" x2="508" y1="616.3438" y2="636.3438"/><polygon fill="#181818" points="504,626.3438,508,636.3438,512,626.3438,508,630.3438" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="508" x2="508" y1="720.9102" y2="743.4766"/><polygon fill="#181818" points="504,733.4766,508,743.4766,512,733.4766,508,737.4766" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="508" x2="508" y1="777.4453" y2="797.4453"/><polygon fill="#181818" points="504,787.4453,508,797.4453,512,787.4453,508,791.4453" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[61d48bc93b16bc008824ff64cc066a1e]
@startuml
!pragma layout smetana
start
note right
void update(StringnodeId,NodeApiVersionsnodeApiVersions)
end note
:this.nodeApiVersions.put(nodeId,nodeApiVersions);
:this.maxUsableProduceMagic=computeMaxUsableProduceMagic();
end
start
note right
void remove(StringnodeId)
end note
:this.nodeApiVersions.remove(nodeId);
:this.maxUsableProduceMagic=computeMaxUsableProduceMagic();
end
start
note right
NodeApiVersionsget(StringnodeId)
end note
:return this.nodeApiVersions.get(nodeId);;
stop
end
start
note right
bytecomputeMaxUsableProduceMagic()
end note
:return (byte)Math.min(RecordBatch.CURRENT_MAGIC_VALUE,knownBrokerNodesMinRequiredMagicForProduce.orElse(RecordBatch.CURRENT_MAGIC_VALUE));;
stop
end
start
note right
bytemaxUsableProduceMagic()
end note
:return maxUsableProduceMagic;;
stop
end
@enduml

