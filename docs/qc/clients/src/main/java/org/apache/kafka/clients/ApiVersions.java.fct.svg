6,572.375,320,582.375,324,572.375,320,576.375" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="320" x2="320" y1="630.3125" y2="650.3125"/><polygon fill="#181818" points="316,640.3125,320,650.3125,324,640.3125,320,644.3125" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="320" x2="320" y1="734.8789" y2="757.4453"/><polygon fill="#181818" points="316,747.4453,320,757.4453,324,747.4453,320,751.4453" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="320" x2="320" y1="791.4141" y2="811.4141"/><polygon fill="#181818" points="316,801.4141,320,811.4141,324,801.4141,320,805.4141" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[8841ac317051b877763d9daec939abd3]
@startuml
!pragma layout smetana
start
note right
void update(StringnodeId,NodeApiVersionsnodeApiVersions)
end note
:this.nodeApiVersions.put(nodeId,nodeApiVersions);;
:this.maxUsableProduceMagic=computeMaxUsableProduceMagic();;
end
start
note right
void remove(StringnodeId)
end note
:this.nodeApiVersions.remove(nodeId);;
:this.maxUsableProduceMagic=computeMaxUsableProduceMagic();;
end
start
note right
NodeApiVersionsget(StringnodeId)
end note
:return this.nodeApiVersions.get(nodeId);;
stop
end
start
note right
bytecomputeMaxUsableProduceMagic()
end note
:return (byte)Math.min(RecordBatch.CURRENT_MAGIC_VALUE,
knownBrokerNodesMinRequiredMagicForProduce.orElse(RecordBatch.CURRENT_MAGIC_VALUE));;
stop
end
start
note right
bytemaxUsableProduceMagic()
end note
:return maxUsableProduceMagic;;
stop
end
@enduml

