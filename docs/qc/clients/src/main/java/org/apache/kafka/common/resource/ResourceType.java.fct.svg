@startuml
!pragma layout smetana
start
note right
ResourceTypefromString(Stringstr)
end note
:return ResourceType.valueOf(str.toUpperCase(Locale.ROOT));;
stop
:return UNKNOWN;;
stop
end
start
note right
ResourceTypefromCode(bytecode)
end note
if (resourceType==null ) then (yes) 
:return UNKNOWN;;
stop
endif 
:return resourceType;;
stop
end
start
note right
constructor ResourceType(bytecode)
end note
end
start
note right
bytecode()
end note
:return code;;
stop
end
start
note right
booleanisUnknown()
end note
:return this==UNKNOWN;;
stop
end
@enduml

