@startuml
!pragma layout smetana
:CODE_TO_VALUE.put(resourceType.code,resourceType);;
start
note right
ResourceType fromString(String str)
end note
switch (try/catch block)
case (try)
:return ResourceType.valueOf(str.toUpperCase(Locale.ROOT));;
stop
case (catch (IllegalArgumentException e))
:return UNKNOWN;;
stop
endswitch
end
start
note right
ResourceType fromCode(byte code)
end note
:ResourceType resourceType=CODE_TO_VALUE.get(code);;
if (resourceType==null ) then (yes) 
:return UNKNOWN;;
stop
endif 
:return resourceType;;
stop
end
start
note right
constructor ResourceType(byte code)
end note
:this.code=code;;
end
start
note right
byte code()
end note
:return code;;
stop
end
start
note right
boolean isUnknown()
end note
:return this==UNKNOWN;;
stop
end
@enduml

