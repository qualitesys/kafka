@startuml
!pragma layout smetana
start
note right
constructor LookupResult(Map<K,Throwable>failedKeys,Map<K,Integer>mappedKeys)
end note
:this(Collections.emptyList(),failedKeys,
mappedKeys);
end
start
note right
constructor LookupResult(List<K>completedKeys,Map<K,Throwable>failedKeys,Map<K,Integer>mappedKeys)
end note
:this.completedKeys=Collections.unmodifiableList(completedKeys);
:this.failedKeys=Collections.unmodifiableMap(failedKeys);
:this.mappedKeys=Collections.unmodifiableMap(mappedKeys);
end
:return new LookupResult<>(emptyMap(),emptyMap());;
stop
:return new LookupResult<>(singletonMap(key,
exception),emptyMap());;
stop
:return new LookupResult<>(emptyMap(),singletonMap(key,
brokerId));;
stop
@enduml

