@startuml
!pragma layout smetana
start
note right
void registerCipherInformation(final CipherInformation cipherInformation)
end note
if (this.cipherInformation!=null ) then (yes) 
:this.cipherInformation=cipherInformation;;
endif 
end
start
note right
CipherInformation cipherInformation()
end note
:return this.cipherInformation;;
stop
end
start
note right
void registerClientInformation(final ClientInformation clientInformation)
end note
:this.clientInformation=clientInformation;;
end
start
note right
ClientInformation clientInformation()
end note
:return this.clientInformation;;
stop
end
start
note right
void close()
end note
:this.cipherInformation=null ;;
:this.clientInformation=null ;;
end
@enduml

