tLength="161" x="5" y="544.1875">:sample.reset(now);</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" text-decoration="wavy underline" textLength="40" x="5" y="560.4844">endif</text><text fill="#FF0000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="106" x="10" y="576.7813">Cannot find if</text><!--MD5=[81720a333d01f53dc3ecd762dafa5ae7]
@startuml
!pragma layout smetana
start
note right
constructor SampledStat(doubleinitialValue)
end note
:this.initialValue=initialValue;
:this.samples=new ArrayList<>(2);
end
start
note right
void record(MetricConfigconfig,doublevalue,
longtimeMs)
end note
if (sample.isComplete(timeMs,config)) then (yes) 
:sample=advance(config,timeMs);
endif 
:update(sample,config,value,timeMs);
:sample.eventCount+=1;
end
start
note right
Sampleadvance(MetricConfigconfig,longtimeMs)
end note
:this.current=(this.current+1)%config.samples();
if (this.current>=samples.size()) then (yes) 
:this.samples.add(sample);
:return sample;;
stop
else (no)
:sample.reset(timeMs);
:return sample;;
stop
endif 
end
start
note right
SamplenewSample(longtimeMs)
end note
:return new Sample(this.initialValue,timeMs);;
stop
end
start
note right
doublemeasure(MetricConfigconfig,longnow)
end note
:purgeObsoleteSamples(config,now);
:return combine(this.samples,config,now);;
stop
end
start
note right
Samplecurrent(longtimeMs)
end note
if (samples.size()==0) then (yes) 
:this.samples.add(newSample(timeMs));
endif 
:return this.samples.get(this.current);;
stop
end
start
note right
Sampleoldest(longnow)
end note
if (samples.size()==0) then (yes) 
:this.samples.add(newSample(now));
endif 
:i++;
if (curr.lastWindowMs<oldest.lastWindowMs) then (yes) 
:oldest=curr;
endif 
:return oldest;;
stop
end
start
note right
StringtoString()
end note
:return "SampledStat("+"initialValue="+initialValue+
", current="+current+", samples="+samples+
')';;
stop
end
start
note right
void update(Samplesample,MetricConfigconfig,
doublevalue,longtimeMs)
end note
end
start
note right
void purgeObsoleteSamples(MetricConfigconfig,
longnow)
end note
if (now-sample.lastWindowMs>=expireAge) then (yes) 
:sample.reset(now);
endif 
end
start
note right
constructor Sample(doubleinitialValue,longnow)
end note
:this.initialValue=initialValue;
:this.eventCount=0;
:this.lastWindowMs=now;
:this.value=initialValue;
end
start
note right
void reset(longnow)
end note
:this.eventCount=0;
:this.lastWindowMs=now;
:this.value=initialValue;
end
start
note right
booleanisComplete(longtimeMs,MetricConfigconfig)
end note
:return timeMs-lastWindowMs>=config.timeWindowMs()||eventCount>=config.eventWindow();;
stop
end
start
note right
StringtoString()
end note
:return "Sample("+"value="+value+", eventCount="+
eventCount+", lastWindowMs="+lastWindowMs+
", initialValue="+initialValue+')';;
stop
end
@enduml

