@startuml
!pragma layout smetana
start
note right
constructor Action(AclOperationoperation,
ResourcePatternresourcePattern,intresourceReferenceCount,
booleanlogIfAllowed,booleanlogIfDenied)
end note
:this.operation=Objects.requireNonNull(operation,
"operation can't be null");
:this.resourcePattern=Objects.requireNonNull(resourcePattern,
"resourcePattern can't be null");
:this.logIfAllowed=logIfAllowed;
:this.logIfDenied=logIfDenied;
:this.resourceReferenceCount=resourceReferenceCount;
end
start
note right
ResourcePatternresourcePattern()
end note
:return resourcePattern;;
stop
end
start
note right
AclOperationoperation()
end note
:return operation;;
stop
end
start
note right
booleanlogIfAllowed()
end note
:return logIfAllowed;;
stop
end
start
note right
booleanlogIfDenied()
end note
:return logIfDenied;;
stop
end
start
note right
intresourceReferenceCount()
end note
:return resourceReferenceCount;;
stop
end
start
note right
booleanequals(Objecto)
end note
if (this==o) then (yes) 
:return true;;
stop
endif 
if (!(o instanceof Action)) then (yes) 
:return false;;
stop
endif 
:return Objects.equals(this.resourcePattern,
that.resourcePattern)&&Objects.equals(this.operation,
that.operation)&&this.resourceReferenceCount==that.resourceReferenceCount&&this.logIfAllowed==that.logIfAllowed&&this.logIfDenied==that.logIfDenied;;
stop
end
start
note right
inthashCode()
end note
:return Objects.hash(resourcePattern,operation,
resourceReferenceCount,logIfAllowed,logIfDenied);;
stop
end
start
note right
StringtoString()
end note
:return "Action("+"resourcePattern='"+resourcePattern+
'\''+", operation='"+operation+'\''+", resourceReferenceCount='"+
resourceReferenceCount+'\''+", logIfAllowed='"+
logIfAllowed+'\''+", logIfDenied='"+logIfDenied+
'\''+')';;
stop
end
@enduml

