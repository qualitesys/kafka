@startuml
!pragma layout smetana
start
note right
constructor OAuthBearerSaslServerProvider()
end note
:super ("SASL/OAUTHBEARER Server Provider",1.0,"SASL/OAUTHBEARER Server Provider for Kafka");
:put("SaslServerFactory."+OAuthBearerLoginModule.OAUTHBEARER_MECHANISM,OAuthBearerSaslServerFactory.class .getName());
end
start
note right
void initialize()
end note
:Security.addProvider(new OAuthBearerSaslServerProvider());
end
@enduml

