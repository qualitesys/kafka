@startuml
!pragma layout smetana
start
note right
constructor RequestUtils()
end note
end
start
note right
Optional<Integer> getLeaderEpoch(int leaderEpoch)
end note
:return leaderEpoch==RecordBatch.NO_PARTITION_LEADER_EPOCH? Optional.empty():Optional.of(leaderEpoch);;
stop
end
start
note right
boolean hasTransactionalRecords(ProduceRequest request)
end note
:return flag(request,RecordBatch::isTransactional);;
stop
end
start
note right
boolean flag(ProduceRequest request,Predicate<RecordBatch> predicate)
end note
if (p.records() instanceof Records ) then (yes) 
:Iterator<?extendsRecordBatch> iter=(((Records )p.records()))
.batchIterator();;
if (iter.hasNext()&&predicate.test(iter.next())) then (yes) 
:return true;;
stop
endif 
endif 
:return false;;
stop
end
start
note right
ByteBuffer serialize(Message header,short headerVersion,
Message apiMessage,short apiVersion)
end note
:ObjectSerializationCache cache=new ObjectSerializationCache();;
:int headerSize=header.size(cache,headerVersion);;
:int messageSize=apiMessage.size(cache,apiVersion);;
:ByteBufferAccessor writable=new ByteBufferAccessor(ByteBuffer.allocate(headerSize+
messageSize));;
:header.write(writable,cache,headerVersion);;
:apiMessage.write(writable,cache,apiVersion);;
:writable.flip();;
:return writable.buffer();;
stop
end
@enduml

