@startuml
!pragma layout smetana
start
note right
constructor RequestUtils()
end note
end
start
note right
Optional<Integer>getLeaderEpoch(intleaderEpoch)
end note
:return leaderEpoch==RecordBatch.NO_PARTITION_LEADER_EPOCH? Optional.empty():Optional.of(leaderEpoch);;
stop
end
start
note right
booleanhasTransactionalRecords(ProduceRequestrequest)
end note
:return flag(request,RecordBatch::isTransactional);;
stop
end
start
note right
booleanflag(ProduceRequestrequest,Predicate<RecordBatch>predicate)
end note
if (p.records() instanceof Records) then (yes) 
if (iter.hasNext()&&predicate.test(iter.next())) then (yes) 
:return true;;
stop
endif 
endif 
:return false;;
stop
end
start
note right
ByteBufferserialize(Messageheader,shortheaderVersion,MessageapiMessage,shortapiVersion)
end note
:header.write(writable,cache,headerVersion);
:apiMessage.write(writable,cache,apiVersion);
:writable.flip();
:return writable.buffer();;
stop
end
@enduml

