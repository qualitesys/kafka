@startuml
!pragma layout smetana
start
note right
constructor Checksums()
end note
end
start
note right
void update(Checksum checksum,ByteBuffer buffer,
int length)
end note
:update(checksum,buffer,0,length);;
end
start
note right
void update(Checksum checksum,ByteBuffer buffer,
int offset,int length)
end note
if (buffer.hasArray()) then (yes) 
:checksum.update(buffer.array(),buffer.position()+
buffer.arrayOffset()+offset,length);;
else (no)
:int start=buffer.position()+offset;;
:checksum.update(buffer.get(i));;
endif 
end
start
note right
void updateInt(Checksum checksum,int input)
end note
:checksum.update((byte )(input>>24));;
:checksum.update((byte )(input>>16));;
:checksum.update((byte )(input>>8));;
:checksum.update((byte )input);;
end
start
note right
void updateLong(Checksum checksum,long input)
end note
:checksum.update((byte )(input>>56));;
:checksum.update((byte )(input>>48));;
:checksum.update((byte )(input>>40));;
:checksum.update((byte )(input>>32));;
:checksum.update((byte )(input>>24));;
:checksum.update((byte )(input>>16));;
:checksum.update((byte )(input>>8));;
:checksum.update((byte )input);;
end
@enduml

