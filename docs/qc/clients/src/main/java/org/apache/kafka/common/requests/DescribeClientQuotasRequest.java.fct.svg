@startuml
!pragma layout smetana
start
note right
constructor Builder(ClientQuotaFilterfilter)
end note
:super (ApiKeys.DESCRIBE_CLIENT_QUOTAS);;
:List<ComponentData>componentData=new ArrayList<>(filter.components()
.size());;
:ComponentDatafd=new ComponentData().setEntityType(component.entityType());;
if (component.match()==null ) then (yes) 
:fd.setMatchType(MATCH_TYPE_SPECIFIED);;
:fd.setMatch(null );;
else if (component.match().isPresent()) then (yes) 
:fd.setMatchType(MATCH_TYPE_EXACT);;
:fd.setMatch(component.match().get());;
else (no)
:fd.setMatchType(MATCH_TYPE_DEFAULT);;
:fd.setMatch(null );;
endif 
:componentData.add(fd);;
:this.data=new DescribeClientQuotasRequestData()
.setComponents(componentData).setStrict(filter.strict());;
end
start
note right
DescribeClientQuotasRequestbuild(shortversion)
end note
:return new DescribeClientQuotasRequest(data,
version);;
stop
end
start
note right
StringtoString()
end note
:return data.toString();;
stop
end
start
note right
constructor DescribeClientQuotasRequest(DescribeClientQuotasRequestDatadata,
shortversion)
end note
:super (ApiKeys.DESCRIBE_CLIENT_QUOTAS,version);;
:this.data=data;;
end
start
note right
ClientQuotaFilterfilter()
end note
:List<ClientQuotaFilterComponent>components=new ArrayList<>(data.components()
.size());;
:ClientQuotaFilterComponentcomponent;;
switch (switch (componentData.matchType()))
endswith
:components.add(component);;
if (data.strict()) then (yes) 
:return ClientQuotaFilter.containsOnly(components);;
stop
else (no)
:return ClientQuotaFilter.contains(components);;
stop
endif 
end
start
note right
DescribeClientQuotasRequestDatadata()
end note
:return data;;
stop
end
start
note right
DescribeClientQuotasResponsegetErrorResponse(intthrottleTimeMs,
Throwablee)
end note
:ApiErrorerror=ApiError.fromThrowable(e);;
:return new DescribeClientQuotasResponse(new DescribeClientQuotasResponseData()
.setThrottleTimeMs(throttleTimeMs).setErrorCode(error.error().code()).setErrorMessage(error.message()).setEntries(null ));;
stop
end
start
note right
DescribeClientQuotasRequestparse(ByteBufferbuffer,
shortversion)
end note
:return new DescribeClientQuotasRequest(new DescribeClientQuotasRequestData(new ByteBufferAccessor(buffer),
version),version);;
stop
end
@enduml

