e:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="1887.5" x2="1887.5" y1="842.457" y2="862.457"/><polygon fill="#181818" points="1883.5,852.457,1887.5,862.457,1891.5,852.457,1887.5,856.457" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="1887.5" x2="1887.5" y1="954.5898" y2="984.7227"/><polygon fill="#181818" points="1883.5,974.7227,1887.5,984.7227,1891.5,974.7227,1887.5,978.7227" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="1887.5" x2="1887.5" y1="1032.6602" y2="1052.6602"/><polygon fill="#181818" points="1883.5,1042.6602,1887.5,1052.6602,1891.5,1042.6602,1887.5,1046.6602" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[79f78076cd63f2a1cedd1d3ad1980b68]
@startuml
!pragma layout smetana
start
note right
constructor NetworkClientUtils()
end note
end
start
note right
booleanisReady(KafkaClientclient,Nodenode,
longcurrentTime)
end note
:client.poll(0,currentTime);;
:return client.isReady(node,currentTime);;
stop
end
start
note right
booleanawaitReady(KafkaClientclient,Nodenode,
Timetime,longtimeoutMs)
end note
if (timeoutMs<0) then (yes) 
:throw new IllegalArgumentException("Timeout needs to be greater than 0");;
stop
endif 
if (isReady(client,node,startTime)||client.ready(node,
startTime)) then (yes) 
:return true;;
stop
endif 
:while (!client.isReady(node,attemptStartTime)&&attemptStartTime-startTime<timeoutMs){if (client.connectionFailed(node)){throw new IOException("Connection to "+
node+" failed.");}longpollTimeout=timeoutMs-(attemptStartTime-startTime);client.poll(pollTimeout,
attemptStartTime);if (client.authenticationException(node)!=null )throw client.authenticationException(node);attemptStartTime=time.milliseconds();};
:return client.isReady(node,attemptStartTime);;
stop
end
start
note right
ClientResponsesendAndReceive(KafkaClientclient,
ClientRequestrequest,Timetime)
end note
:try {client.send(request,time.milliseconds());while (client.active()){List<ClientResponse>responses=client.poll(Long.MAX_VALUE,
time.milliseconds());for (ClientResponseresponse:responses){if (response.requestHeader().correlationId()==request.correlationId()){if (response.wasDisconnected()){throw new IOException("Connection to "+response.destination()+" was disconnected before the response was read");}if (response.versionMismatch()!=null ){throw response.versionMismatch();}return response;}}}throw new IOException("Client was shutdown before response was read");}catch (DisconnectExceptione){if (client.active())throw e;else throw new IOException("Client was shutdown before response was read");};
end
@enduml

