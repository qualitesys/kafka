@startuml
!pragma layout smetana
start
note right
constructor BeginQuorumEpochResponse(BeginQuorumEpochResponseDatadata)
end note
:super (ApiKeys.BEGIN_QUORUM_EPOCH);
:this.data=data;
end
start
note right
BeginQuorumEpochResponseDatasingletonResponse(ErrorstopLevelError,TopicPartitiontopicPartition,ErrorspartitionLevelError,intleaderEpoch,intleaderId)
end note
:return new BeginQuorumEpochResponseData()
.setErrorCode(topLevelError.code()).setTopics(Collections.singletonList(new BeginQuorumEpochResponseData.TopicData().setTopicName(topicPartition.topic()).setPartitions(Collections.singletonList(new BeginQuorumEpochResponseData.PartitionData().setErrorCode(partitionLevelError.code()).setLeaderId(leaderId).setLeaderEpoch(leaderEpoch)))));;
stop
end
start
note right
Map<Errors,Integer>errorCounts()
end note
:errors.put(Errors.forCode(data.errorCode()),1);
:errors.compute(Errors.forCode(partitionResponse.errorCode()),
(error,count)->count==null ? 1:count+1);
:return errors;;
stop
end
start
note right
BeginQuorumEpochResponseDatadata()
end note
:return data;;
stop
end
start
note right
intthrottleTimeMs()
end note
:return DEFAULT_THROTTLE_TIME;;
stop
end
start
note right
BeginQuorumEpochResponseparse(ByteBufferbuffer,shortversion)
end note
:return new BeginQuorumEpochResponse(new BeginQuorumEpochResponseData(new ByteBufferAccessor(buffer),version));;
stop
end
@enduml

