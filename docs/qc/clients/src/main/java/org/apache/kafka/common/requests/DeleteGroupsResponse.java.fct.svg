@startuml
!pragma layout smetana
start
note right
constructor DeleteGroupsResponse(DeleteGroupsResponseDatadata)
end note
end
start
note right
DeleteGroupsResponseDatadata()
end note
:return data;;
stop
end
start
note right
Map<String,Errors>errors()
end note
:return errorMap;;
stop
end
start
note right
Errorsget(Stringgroup)
end note
if (result==null ) then (yes) 
:throw new IllegalArgumentException("could not find group "+
group+" in the delete group response");;
endif 
:return Errors.forCode(result.errorCode());;
stop
end
start
note right
Map<Errors,Integer>errorCounts()
end note
:return counts;;
stop
end
start
note right
DeleteGroupsResponseparse(ByteBufferbuffer,
shortversion)
end note
:return new DeleteGroupsResponse(new DeleteGroupsResponseData(new ByteBufferAccessor(buffer),
version));;
stop
end
start
note right
intthrottleTimeMs()
end note
:return data.throttleTimeMs();;
stop
end
start
note right
booleanshouldClientThrottle(shortversion)
end note
:return version>=1;;
stop
end
@enduml

