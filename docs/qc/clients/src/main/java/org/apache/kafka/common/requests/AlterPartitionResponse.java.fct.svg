.5156,410,906.5156" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="410" x2="410" y1="960.4531" y2="980.4531"/><polygon fill="#181818" points="406,970.4531,410,980.4531,414,970.4531,410,974.4531" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[ed9e47a67992222de0d096be5ac4b438]
@startuml
!pragma layout smetana
start
note right
constructor AlterPartitionResponse(AlterPartitionResponseData data)
end note
:super (ApiKeys.ALTER_PARTITION);;
:this.data=data;;
end
start
note right
AlterPartitionResponseData data()
end note
:return data;;
stop
end
start
note right
Map<Errors,Integer> errorCounts()
end note
:Map<Errors,Integer> counts=new HashMap<>();;
:updateErrorCounts(counts,Errors.forCode(data.errorCode()));;
:data.topics().forEach(topicResponse->topicResponse.partitions().forEach(partitionResponse->{updateErrorCounts(counts,
Errors.forCode(partitionResponse.errorCode()));}));;
:return counts;;
stop
end
start
note right
int throttleTimeMs()
end note
:return data.throttleTimeMs();;
stop
end
start
note right
AlterPartitionResponse parse(ByteBuffer buffer,
short version)
end note
:return new AlterPartitionResponse(new AlterPartitionResponseData(new ByteBufferAccessor(buffer),
version));;
stop
end
@enduml

