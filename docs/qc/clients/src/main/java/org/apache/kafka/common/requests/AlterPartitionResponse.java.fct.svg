56b0f429ba532053297]
@startuml
!pragma layout smetana
start
note right
constructor AlterPartitionResponse(AlterPartitionResponseDatadata)
end note
:super (ApiKeys.ALTER_PARTITION);
:this.data=data;
end
start
note right
AlterPartitionResponseDatadata()
end note
:return data;;
stop
end
start
note right
Map<Errors,Integer>errorCounts()
end note
:updateErrorCounts(counts,Errors.forCode(data.errorCode()));
:data.topics().forEach(topicResponse->topicResponse.partitions()
.forEach(partitionResponse->{updateErrorCounts(counts,
Errors.forCode(partitionResponse.errorCode()));}));
:return counts;;
stop
end
start
note right
intthrottleTimeMs()
end note
:return data.throttleTimeMs();;
stop
end
start
note right
AlterPartitionResponseparse(ByteBufferbuffer,shortversion)
end note
:return new AlterPartitionResponse(new AlterPartitionResponseData(new ByteBufferAccessor(buffer),version));;
stop
end
@enduml

