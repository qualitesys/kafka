@startuml
!pragma layout smetana
start
note right
constructor AlterPartitionResponse(AlterPartitionResponseDatadata)
end note
end
start
note right
AlterPartitionResponseDatadata()
end note
:return data;;
stop
end
start
note right
Map<Errors,Integer>errorCounts()
end note
:return counts;;
stop
end
start
note right
intthrottleTimeMs()
end note
:return data.throttleTimeMs();;
stop
end
start
note right
AlterPartitionResponseparse(ByteBufferbuffer,
shortversion)
end note
:return new AlterPartitionResponse(new AlterPartitionResponseData(new ByteBufferAccessor(buffer),
version));;
stop
end
@enduml

