@startuml
!pragma layout smetana
start
note right
constructor ConfigData(Map<String,String>data,
Longttl)
end note
:this.data=data;
:this.ttl=ttl;
end
start
note right
constructor ConfigData(Map<String,String>data)
end note
:this(data,null );
end
start
note right
Map<String,String>data()
end note
:return data;;
stop
end
start
note right
Longttl()
end note
:return ttl;;
stop
end
@enduml

