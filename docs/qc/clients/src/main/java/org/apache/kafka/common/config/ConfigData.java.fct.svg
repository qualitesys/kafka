end note
:this.data=data;;
:this.ttl=ttl;;
end
start
note right
constructor ConfigData(Map<String,String> data)
end note
:this(data,null );;
end
start
note right
Map<String,String> data()
end note
:return data;;
stop
end
start
note right
Long ttl()
end note
:return ttl;;
stop
end
@enduml

