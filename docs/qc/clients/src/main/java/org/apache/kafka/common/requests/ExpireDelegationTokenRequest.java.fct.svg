@startuml
!pragma layout smetana
start
note right
constructor ExpireDelegationTokenRequest(ExpireDelegationTokenRequestDatadata,
shortversion)
end note
end
start
note right
ExpireDelegationTokenRequestparse(ByteBufferbuffer,
shortversion)
end note
:return new ExpireDelegationTokenRequest(new ExpireDelegationTokenRequestData(new ByteBufferAccessor(buffer),
version),version);;
stop
end
start
note right
ExpireDelegationTokenRequestDatadata()
end note
:return data;;
stop
end
start
note right
AbstractResponsegetErrorResponse(intthrottleTimeMs,
Throwablee)
end note
:return new ExpireDelegationTokenResponse(new ExpireDelegationTokenResponseData()
.setErrorCode(Errors.forException(e).code()).setThrottleTimeMs(throttleTimeMs));;
stop
end
start
note right
ByteBufferhmac()
end note
:return ByteBuffer.wrap(data.hmac());;
stop
end
start
note right
longexpiryTimePeriod()
end note
:return data.expiryTimePeriodMs();;
stop
end
start
note right
constructor Builder(ExpireDelegationTokenRequestDatadata)
end note
end
start
note right
ExpireDelegationTokenRequestbuild(shortversion)
end note
:return new ExpireDelegationTokenRequest(data,
version);;
stop
end
start
note right
StringtoString()
end note
:return data.toString();;
stop
end
@enduml

