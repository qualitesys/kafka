@startuml
!pragma layout smetana
start
note right
constructor QuotaViolationException(KafkaMetric metric,
double value,double bound)
end note
:this.metric=metric;;
:this.value=value;;
:this.bound=bound;;
end
start
note right
KafkaMetric metric()
end note
:return metric;;
stop
end
start
note right
double value()
end note
:return value;;
stop
end
start
note right
double bound()
end note
:return bound;;
stop
end
start
note right
String toString()
end note
:return getClass().getName()+": '"+metric.metricName()+
"' violated quota. Actual: "+value+", Threshold: "+
bound;;
stop
end
start
note right
Throwable fillInStackTrace()
end note
:return this;;
stop
end
@enduml

