@startuml
!pragma layout smetana
start
note right
constructor QuotaViolationException(KafkaMetricmetric,
doublevalue,doublebound)
end note
:this.metric=metric;
:this.value=value;
:this.bound=bound;
end
start
note right
KafkaMetricmetric()
end note
:return metric;;
stop
end
start
note right
doublevalue()
end note
:return value;;
stop
end
start
note right
doublebound()
end note
:return bound;;
stop
end
start
note right
StringtoString()
end note
:return getClass().getName()+": '"+metric.metricName()+"' violated quota. Actual: "+value+", Threshold: "+bound;;
stop
end
start
note right
ThrowablefillInStackTrace()
end note
:return this;;
stop
end
@enduml

