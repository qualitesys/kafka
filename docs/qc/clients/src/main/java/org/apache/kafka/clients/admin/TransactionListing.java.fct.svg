!pragma layout smetana
start
note right
constructor TransactionListing(StringtransactionalId,
longproducerId,TransactionStatetransactionState)
end note
end
start
note right
StringtransactionalId()
end note
:return transactionalId;;
stop
end
start
note right
longproducerId()
end note
:return producerId;;
stop
end
start
note right
TransactionStatestate()
end note
:return transactionState;;
stop
end
start
note right
booleanequals(Objecto)
end note
if (this==o) then (yes) 
:return true;;
stop
endif 
if (o==null ||getClass()!=o.getClass()) then (yes) 
:return false;;
stop
endif 
:return producerId==that.producerId&&Objects.equals(transactionalId,
that.transactionalId)&&transactionState==that.transactionState;;
stop
end
start
note right
inthashCode()
end note
:return Objects.hash(transactionalId,producerId,
transactionState);;
stop
end
start
note right
StringtoString()
end note
:return "TransactionListing("+"transactionalId='"+
