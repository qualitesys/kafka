2a4158f6fe]
@startuml
!pragma layout smetana
start
note right
boolean hasProducerId()
end note
:return RecordBatch.NO_PRODUCER_ID<producerId();;
stop
end
start
note right
long nextOffset()
end note
:return lastOffset()+1;;
stop
end
start
note right
boolean isCompressed()
end note
:return compressionType()!=CompressionType.NONE;;
stop
end
@enduml

