@startuml
!pragma layout smetana
start
note right
booleanequals(Objecto)
end note
if (this==o) then (yes) 
:return true;;
stop
endif 
if (o==null ||getClass()!=o.getClass()) then (yes) 
:return false;;
stop
endif 
:return name.equals(that.name)&&credentialInfos.equals(that.credentialInfos);;
stop
end
start
note right
inthashCode()
end note
:return Objects.hash(name,credentialInfos);;
stop
end
start
note right
StringtoString()
end note
:return "UserScramCredentialsDescription{"
+"name='"+name+'\''+", credentialInfos="+credentialInfos+'}';;
