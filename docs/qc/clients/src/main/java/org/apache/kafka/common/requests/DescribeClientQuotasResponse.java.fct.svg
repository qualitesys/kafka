@startuml
!pragma layout smetana
start
note right
constructor DescribeClientQuotasResponse(DescribeClientQuotasResponseDatadata)
end note
end
start
note right
void complete(KafkaFutureImpl<Map<ClientQuotaEntity,
Map<String,Double>>>future)
end note
if (error!=Errors.NONE) then (yes) 
:return ;;
stop
endif 
end
start
note right
intthrottleTimeMs()
end note
:return data.throttleTimeMs();;
stop
end
start
note right
DescribeClientQuotasResponseDatadata()
end note
:return data;;
stop
end
start
note right
Map<Errors,Integer>errorCounts()
end note
:return errorCounts(Errors.forCode(data.errorCode()));;
stop
end
start
note right
DescribeClientQuotasResponseparse(ByteBufferbuffer,
shortversion)
end note
:return new DescribeClientQuotasResponse(new DescribeClientQuotasResponseData(new ByteBufferAccessor(buffer),
