@startuml
!pragma layout smetana
start
note right
ThreadFactorycreateThreadFactory(final Stringpattern,final booleandaemon)
end note
:return new ThreadFactory(){private final AtomicLongthreadEpoch=new AtomicLong(0);@Override public ThreadnewThread(Runnabler){StringthreadName;if (pattern.contains("%d")){threadName=String.format(pattern,threadEpoch.addAndGet(1));}else {threadName=pattern;}Threadthread=new Thread(r,threadName);thread.setDaemon(daemon);return thread;}};;
stop
end
@enduml

