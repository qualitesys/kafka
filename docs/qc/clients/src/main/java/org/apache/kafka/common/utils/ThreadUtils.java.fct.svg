@startuml
!pragma layout smetana
start
note right
ThreadFactory createThreadFactory(final String pattern,
final boolean daemon)
end note
:return new ThreadFactory(){private final AtomicLong threadEpoch=new AtomicLong(0);
:@Override public Thread newThread(Runnable r){String threadName;if (pattern.contains("%d")){threadName=String.format(pattern,
threadEpoch.addAndGet(1));}else {threadName=pattern;}Thread thread=new Thread(r,
threadName);thread.setDaemon(daemon);return thread;}};;
stop
end
@enduml

