@startuml
!pragma layout smetana
start
note right
constructor DescribeClusterResult(KafkaFuture<Collection<Node>>nodes,KafkaFuture<Node>controller,KafkaFuture<String>clusterId,KafkaFuture<Set<AclOperation>>authorizedOperations)
end note
:this.nodes=nodes;
:this.controller=controller;
:this.clusterId=clusterId;
:this.authorizedOperations=authorizedOperations;
end
start
note right
KafkaFuture<Collection<Node>>nodes()
end note
:return nodes;;
stop
end
start
note right
KafkaFuture<Node>controller()
end note
:return controller;;
stop
end
start
note right
KafkaFuture<String>clusterId()
end note
:return clusterId;;
stop
end
start
note right
KafkaFuture<Set<AclOperation>>authorizedOperations()
end note
:return authorizedOperations;;
stop
end
@enduml

