@startuml
!pragma layout smetana
start
note right
constructor UpdateMetadataResponse(UpdateMetadataResponseDatadata)
end note
end
start
note right
Errorserror()
end note
:return Errors.forCode(data.errorCode());;
stop
end
start
note right
Map<Errors,Integer>errorCounts()
end note
:return errorCounts(error());;
stop
end
start
note right
intthrottleTimeMs()
end note
:return DEFAULT_THROTTLE_TIME;;
stop
end
start
note right
UpdateMetadataResponseparse(ByteBufferbuffer,
shortversion)
end note
:return new UpdateMetadataResponse(new UpdateMetadataResponseData(new ByteBufferAccessor(buffer),
version));;
stop
end
start
note right
UpdateMetadataResponseDatadata()
end note
:return data;;
stop
end
@enduml

