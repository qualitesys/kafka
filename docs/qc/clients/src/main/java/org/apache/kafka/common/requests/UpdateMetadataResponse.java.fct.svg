@startuml
!pragma layout smetana
start
note right
constructor UpdateMetadataResponse(UpdateMetadataResponseData data)
end note
:super (ApiKeys.UPDATE_METADATA);;
:this.data=data;;
end
start
note right
Errors error()
end note
:return Errors.forCode(data.errorCode());;
stop
end
start
note right
Map<Errors,Integer> errorCounts()
end note
:return errorCounts(error());;
stop
end
start
note right
int throttleTimeMs()
end note
:return DEFAULT_THROTTLE_TIME;;
stop
end
start
note right
UpdateMetadataResponse parse(ByteBuffer buffer,
short version)
end note
:return new UpdateMetadataResponse(new UpdateMetadataResponseData(new ByteBufferAccessor(buffer),
version));;
stop
end
start
note right
UpdateMetadataResponseData data()
end note
:return data;;
stop
end
@enduml

