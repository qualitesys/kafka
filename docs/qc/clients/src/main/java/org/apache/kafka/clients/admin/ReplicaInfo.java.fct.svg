@startuml
!pragma layout smetana
start
note right
constructor ReplicaInfo(longsize,longoffsetLag,booleanisFuture)
end note
:this.size=size;
:this.offsetLag=offsetLag;
:this.isFuture=isFuture;
end
start
note right
longsize()
end note
:return size;;
stop
end
start
note right
longoffsetLag()
end note
:return offsetLag;;
stop
end
start
note right
booleanisFuture()
end note
:return isFuture;;
stop
end
start
note right
StringtoString()
end note
:return "ReplicaInfo("+"size="+size+", offsetLag="+offsetLag+", isFuture="+isFuture+')';;
stop
end
@enduml

