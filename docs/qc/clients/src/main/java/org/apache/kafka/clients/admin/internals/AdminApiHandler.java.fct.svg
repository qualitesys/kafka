@startuml
!pragma layout smetana
start
note right
constructor ApiResult(Map<K,V>completedKeys,
Map<K,Throwable>failedKeys,List<K>unmappedKeys)
end note
end
:return new ApiResult<>(Collections.singletonMap(key,
value),Collections.emptyMap(),Collections.emptyList());;
stop
:return new ApiResult<>(Collections.emptyMap(),
Collections.singletonMap(key,t),Collections.emptyList());;
stop
:return new ApiResult<>(Collections.emptyMap(),
Collections.emptyMap(),keys);;
stop
:return new ApiResult<>(Collections.emptyMap(),
Collections.emptyMap(),Collections.emptyList());;
stop
start
note right
constructor RequestAndKeys(AbstractRequest.Builder<? >request,
Set<K>keys)
end note
end
start
note right
Collection<RequestAndKeys<K>>buildRequest(intbrokerId,
Set<K>keys)
end note
:return Collections.singleton(new RequestAndKeys<>(buildBatchedRequest(brokerId,
keys),keys));;
stop
end
start
note right
Collection<RequestAndKeys<K>>buildRequest(intbrokerId,
Set<K>keys)
end note
:return keys.stream().map(key->new RequestAndKeys<>(buildSingleRequest(brokerId,
key),Collections.singleton(key))).collect(Collectors.toSet());;
stop
end
start
note right
ApiResult<K,V>handleResponse(Nodebroker,Set<K>keys,
AbstractResponseresponse)
end note
if (keys.size()!=1) then (yes) 
:throw new IllegalArgumentException("Unbatched admin handler should only be required to handle responses for a single key at a time");;
endif 
:return handleSingleResponse(broker,key,response);;
stop
end
@enduml

