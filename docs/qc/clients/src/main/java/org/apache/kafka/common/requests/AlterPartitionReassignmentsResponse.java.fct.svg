@startuml
!pragma layout smetana
start
note right
constructor AlterPartitionReassignmentsResponse(AlterPartitionReassignmentsResponseDatadata)
end note
:super (ApiKeys.ALTER_PARTITION_REASSIGNMENTS);
:this.data=data;
end
start
note right
AlterPartitionReassignmentsResponseparse(ByteBufferbuffer,
shortversion)
end note
:return new AlterPartitionReassignmentsResponse(new AlterPartitionReassignmentsResponseData(new ByteBufferAccessor(buffer),version));;
stop
end
start
note right
AlterPartitionReassignmentsResponseDatadata()
end note
:return data;;
stop
end
start
note right
booleanshouldClientThrottle(shortversion)
end note
:return true;;
stop
end
start
note right
intthrottleTimeMs()
end note
:return data.throttleTimeMs();;
stop
end
start
note right
Map<Errors,Integer>errorCounts()
end note
:updateErrorCounts(counts,Errors.forCode(data.errorCode()));
:data.responses().forEach(topicResponse->topicResponse.partitions().forEach(partitionResponse->updateErrorCounts(counts,Errors.forCode(partitionResponse.errorCode()))));
:return counts;;
stop
end
@enduml

