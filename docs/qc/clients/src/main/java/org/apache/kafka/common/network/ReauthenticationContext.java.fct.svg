@startuml
!pragma layout smetana
start
note right
constructor ReauthenticationContext(AuthenticatorpreviousAuthenticator,NetworkReceivenetworkReceive,longnowNanos)
end note
:this.previousAuthenticator=Objects.requireNonNull(previousAuthenticator);
:this.networkReceive=networkReceive;
:this.reauthenticationBeginNanos=nowNanos;
end
start
note right
NetworkReceivenetworkReceive()
end note
:return networkReceive;;
stop
end
start
note right
AuthenticatorpreviousAuthenticator()
end note
:return previousAuthenticator;;
stop
end
start
note right
longreauthenticationBeginNanos()
end note
:return reauthenticationBeginNanos;;
stop
end
@enduml

