@startuml
!pragma layout smetana
:return new Fetch<>(new HashMap<>(),false,0);;
stop
:return new Fetch<>(recordsMap,positionAdvanced,records.size());;
stop
start
note right
constructor Fetch(Map<TopicPartition,List<ConsumerRecord<K,V>>>records,booleanpositionAdvanced,intnumRecords)
end note
:this.records=records;
:this.positionAdvanced=positionAdvanced;
:this.numRecords=numRecords;
end
start
note right
void add(Fetch<K,V>fetch)
end note
:Objects.requireNonNull(fetch);
:addRecords(fetch.records);
:this.positionAdvanced|=fetch.positionAdvanced;
end
start
note right
Map<TopicPartition,List<ConsumerRecord<K,V>>>records()
end note
:return Collections.unmodifiableMap(records);;
stop
end
start
note right
booleanpositionAdvanced()
end note
:return positionAdvanced;;
stop
end
start
note right
intnumRecords()
end note
:return numRecords;;
stop
end
start
note right
booleanisEmpty()
end note
:return numRecords==0&&!positionAdvanced;;
stop
end
start
note right
void addRecords(Map<TopicPartition,List<ConsumerRecord<K,V>>>records)
end note
:records.forEach((partition,partRecords)->{this.numRecords+=partRecords.size();List<ConsumerRecord<K,V>>currentRecords=this.records.get(partition);if (currentRecords==null ){this.records.put(partition,partRecords);}else {List<ConsumerRecord<K,V>>newRecords=new ArrayList<>(currentRecords.size()+partRecords.size());newRecords.addAll(currentRecords);newRecords.addAll(partRecords);this.records.put(partition,newRecords);}});
end
