@startuml
!pragma layout smetana
start
note right
GroupAssignmentassign(Clustermetadata,GroupSubscriptiongroupSubscription)
end note
if (numPartitions!=null &&numPartitions>0) then (yes) 
else (no)
endif 
:return new GroupAssignment(assignments);;
stop
end
start
note right
List<TopicPartition>partitions(Stringtopic,
intnumPartitions)
end note
:return partitions;;
stop
end
start
note right
constructor MemberInfo(StringmemberId,Optional<String>groupInstanceId)
end note
end
start
note right
intcompareTo(MemberInfootherMemberInfo)
end note
if (this.groupInstanceId.isPresent()&&otherMemberInfo.groupInstanceId.isPresent()) then (yes) 
:return this.groupInstanceId.get().compareTo(otherMemberInfo.groupInstanceId.get());;
stop
else (no)
:return this.memberId.compareTo(otherMemberInfo.memberId);;
stop
endif 
end
start
note right
booleanequals(Objecto)
end note
:return o instanceof MemberInfo&&this.memberId.equals(((MemberInfo)o)
.memberId);;
stop
end
start
note right
inthashCode()
end note
:return memberId.hashCode();;
stop
end
start
note right
StringtoString()
end note
:return "MemberInfo [member.id: "+memberId+
", group.instance.id: "+groupInstanceId.orElse("{}")+
"]";;
stop
end
@enduml

