@startuml
!pragma layout smetana
start
note right
constructor OAuthBearerSaslClientProvider()
end note
:super ("SASL/OAUTHBEARER Client Provider",
1.0,"SASL/OAUTHBEARER Client Provider for Kafka");
:put("SaslClientFactory."+OAuthBearerLoginModule.OAUTHBEARER_MECHANISM,
OAuthBearerSaslClientFactory.class .getName());
end
start
note right
void initialize()
end note
:Security.addProvider(new OAuthBearerSaslClientProvider());
end
@enduml

