@startuml
!pragma layout smetana
start
note right
constructor Builder(SaslAuthenticateRequestDatadata)
end note
:super (ApiKeys.SASL_AUTHENTICATE);
:this.data=data;
end
start
note right
SaslAuthenticateRequestbuild(shortversion)
end note
:return new SaslAuthenticateRequest(data,
version);;
stop
end
start
note right
StringtoString()
end note
:return "(type=SaslAuthenticateRequest)";;
stop
end
start
note right
constructor SaslAuthenticateRequest(SaslAuthenticateRequestDatadata,shortversion)
end note
:super (ApiKeys.SASL_AUTHENTICATE,version);
:this.data=data;
end
start
note right
SaslAuthenticateRequestDatadata()
end note
:return data;;
stop
end
start
note right
AbstractResponsegetErrorResponse(intthrottleTimeMs,Throwablee)
end note
:return new SaslAuthenticateResponse(response);;
stop
end
start
note right
SaslAuthenticateRequestparse(ByteBufferbuffer,shortversion)
end note
:return new SaslAuthenticateRequest(new SaslAuthenticateRequestData(new ByteBufferAccessor(buffer),version),version);;
stop
end
@enduml

