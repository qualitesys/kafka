@startuml
!pragma layout smetana
:return -1;;
stop
:SecurityUtils.authorizeByResourceTypeCheckArgs(op,
resourceType);;
if (authorize(requestContext,Collections.singletonList(new Action(op,
new ResourcePattern(resourceType,"hardcode",
PatternType.LITERAL),0,true,false))).get(0)==AuthorizationResult.ALLOWED) then (yes) 
:return AuthorizationResult.ALLOWED;;
stop
endif 
:ResourcePatternFilterresourceTypeFilter=new ResourcePatternFilter(resourceType,
null ,PatternType.ANY);;
:AclBindingFilteraclFilter=new AclBindingFilter(resourceTypeFilter,
AccessControlEntryFilter.ANY);;
:EnumMap<PatternType,Set<String>>denyPatterns=new EnumMap<PatternType,
Set<String>>(PatternType.class ){{put(PatternType.LITERAL,
new HashSet<>());put(PatternType.PREFIXED,
new HashSet<>());}};;
:EnumMap<PatternType,Set<String>>allowPatterns=new EnumMap<PatternType,
Set<String>>(PatternType.class ){{put(PatternType.LITERAL,
new HashSet<>());put(PatternType.PREFIXED,
new HashSet<>());}};;
:booleanhasWildCardAllow=false;;
:KafkaPrincipalprincipal=new KafkaPrincipal(requestContext.principal().getPrincipalType(),
requestContext.principal().getName());;
:StringhostAddr=requestContext.clientAddress()
.getHostAddress();;
if (!binding.entry().host().equals(hostAddr)&&!binding.entry().host().equals("*")) then (yes) 
:continue ;;
endif 
if (!SecurityUtils.parseKafkaPrincipal(binding.entry().principal()).equals(principal)&&!binding.entry().principal().equals("User:*")) then (yes) 
:continue ;;
endif 
if (binding.entry().operation()!=op&&binding.entry().operation()!=AclOperation.ALL) then (yes) 
:continue ;;
endif 
if (binding.entry().permissionType()==AclPermissionType.DENY) then (yes) 
switch (switch (binding.pattern().patternType()))
endswith
:continue ;;
endif 
if (binding.entry().permissionType()!=AclPermissionType.ALLOW) then (yes) 
:continue ;;
endif 
switch (switch (binding.pattern().patternType()))
endswith
if (hasWildCardAllow) then (yes) 
:return AuthorizationResult.ALLOWED;;
stop
endif 
if (entry.getKey()==PatternType.LITERAL&&denyPatterns.get(PatternType.LITERAL).contains(allowStr)) then (yes) 
:continue ;;
endif 
:StringBuildersb=new StringBuilder();;
:booleanhasDominatedDeny=false;;
:sb.append(ch);;
if (denyPatterns.get(PatternType.PREFIXED).contains(sb.toString())) then (yes) 
:hasDominatedDeny=true;;
:break ;;
endif 
if (!hasDominatedDeny) then (yes) 
:return AuthorizationResult.ALLOWED;;
stop
endif 
:return AuthorizationResult.DENIED;;
stop
