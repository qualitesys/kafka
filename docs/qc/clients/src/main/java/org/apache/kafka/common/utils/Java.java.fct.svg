@startuml
!pragma layout smetana
start
note right
constructor Java()
end note
end
start
note right
Version parseVersion(String versionString)
end note
:final StringTokenizer st=new StringTokenizer(versionString,
".");;
:int majorVersion=Integer.parseInt(st.nextToken());;
:int minorVersion;;
if (st.hasMoreTokens()) then (yes) 
:minorVersion=Integer.parseInt(st.nextToken());;
else (no)
:minorVersion=0;;
endif 
:return new Version(majorVersion,minorVersion);;
stop
end
start
note right
boolean isIbmJdk()
end note
:return System.getProperty("java.vendor")
.contains("IBM");;
stop
end
start
note right
constructor Version(int majorVersion,int minorVersion)
end note
:this.majorVersion=majorVersion;;
:this.minorVersion=minorVersion;;
end
start
note right
String toString()
end note
:return "Version(majorVersion="+majorVersion+
", minorVersion="+minorVersion+")";;
stop
end
start
note right
boolean isJava9Compatible()
end note
:return majorVersion>=9;;
stop
end
start
note right
boolean isJava11Compatible()
end note
:return majorVersion>=11;;
stop
end
@enduml

