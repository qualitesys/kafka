@startuml
!pragma layout smetana
start
note right
constructor Java()
end note
end
start
note right
VersionparseVersion(StringversionString)
end note
if (st.hasMoreTokens()) then (yes) 
:minorVersion=Integer.parseInt(st.nextToken());
else (no)
:minorVersion=0;
endif 
:return new Version(majorVersion,minorVersion);;
stop
end
start
note right
booleanisIbmJdk()
end note
:return System.getProperty("java.vendor").contains("IBM");;
stop
end
start
note right
constructor Version(intmajorVersion,intminorVersion)
end note
:this.majorVersion=majorVersion;
:this.minorVersion=minorVersion;
end
start
note right
StringtoString()
end note
:return "Version(majorVersion="+majorVersion+
", minorVersion="+minorVersion+")";;
stop
end
start
note right
booleanisJava9Compatible()
end note
:return majorVersion>=9;;
stop
end
start
note right
booleanisJava11Compatible()
end note
:return majorVersion>=11;;
stop
end
@enduml

