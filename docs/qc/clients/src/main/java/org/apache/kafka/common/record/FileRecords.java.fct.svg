@startuml
!pragma layout smetana
start
note right
constructor FileRecords(Filefile,FileChannelchannel,
intstart,intend,booleanisSlice)
end note
:this.file=file;
:this.channel=channel;
:this.start=start;
:this.end=end;
:this.isSlice=isSlice;
:this.size=new AtomicInteger();
if (isSlice) then (yes) 
:size.set(end-start);
else (no)
if (channel.size()>Integer.MAX_VALUE) then (yes) 
:throw new KafkaException("The size of segment "+
file+" ("+channel.size()+") is larger than the maximum allowed segment size of "+
Integer.MAX_VALUE);;
endif 
:size.set(limit-start);
:channel.position(limit);
endif 
:batches=batchesFrom(start);
end
start
note right
intsizeInBytes()
end note
:return size.get();;
stop
end
start
note right
Filefile()
end note
:return file;;
stop
end
start
note right
FileChannelchannel()
end note
:return channel;;
stop
end
start
note right
void readInto(ByteBufferbuffer,intposition)
end note
:Utils.readFully(channel,buffer,position+
this.start);
:buffer.flip();
end
start
note right
FileRecordsslice(intposition,intsize)
end note
:return new FileRecords(file,channel,startPosition,startPosition+
availableBytes,true);;
stop
end
start
note right
UnalignedFileRecordssliceUnaligned(intposition,
intsize)
end note
:return new UnalignedFileRecords(channel,this.start+
position,availableBytes);;
stop
end
start
note right
intavailableBytes(intposition,intsize)
end note
if (position<0) then (yes) 
:throw new IllegalArgumentException("Invalid position: "+
position+" in read from "+this);;
endif 
if (position>currentSizeInBytes-start) then (yes) 
:throw new IllegalArgumentException("Slice from position "+
position+" exceeds end position of "+this);;
endif 
if (size<0) then (yes) 
:throw new IllegalArgumentException("Invalid size: "+
size+" in read from "+this);;
endif 
if (end<0||end>start+currentSizeInBytes) then (yes) 
:end=this.start+currentSizeInBytes;
endif 
:return end-(this.start+position);;
stop
end
start
note right
intappend(MemoryRecordsrecords)
end note
if (records.sizeInBytes()>Integer.MAX_VALUE-size.get()) then (yes) 
:throw new IllegalArgumentException("Append of size "+
records.sizeInBytes()+" bytes is too large for segment with current file position at "+
size.get());;
endif 
:size.getAndAdd(written);
:return written;;
stop
end
start
note right
void flush()
end note
:channel.force(true);
end
start
note right
void close()
end note
:flush();
:trim();
:channel.close();
end
start
note right
void closeHandlers()
end note
:channel.close();
end
start
note right
booleandeleteIfExists()
end note
:Utils.closeQuietly(channel,"FileChannel");
:return Files.deleteIfExists(file.toPath());;
stop
end
start
note right
void trim()
end note
:truncateTo(sizeInBytes());
end
start
note right
void updateParentDir(FileparentDir)
end note
:this.file=new File(parentDir,file.getName());
end
start
note right
void renameTo(Filef)
end note
:Utils.atomicMoveWithFallback(file.toPath(),
f.toPath(),false);
:this.file=f;
end
start
note right
inttruncateTo(inttargetSize)
end note
if (targetSize>originalSize||targetSize<0) then (yes) 
:throw new KafkaException("Attempt to truncate log segment "+
file+" to "+targetSize+" bytes failed, "+
" size of this log segment is "+originalSize+
" bytes.");;
endif 
if (targetSize<(int)channel.size()) then (yes) 
:channel.truncate(targetSize);
:size.set(targetSize);
endif 
:return originalSize-targetSize;;
stop
end
start
note right
ConvertedRecords<?  extends Records>downConvert(bytetoMagic,
longfirstOffset,Timetime)
end note
if (convertedRecords.recordConversionStats()
.numRecordsConverted()==0) then (yes) 
:return new ConvertedRecords<>(this,RecordConversionStats.EMPTY);;
stop
else (no)
:return convertedRecords;;
stop
endif 
end
start
note right
longwriteTo(TransferableChanneldestChannel,
longoffset,intlength)
end note
if (newSize<oldSize) then (yes) 
:throw new KafkaException(String.format("Size of FileRecords %s has been truncated during write: old size %d,
 new size %d",file.getAbsolutePath(),oldSize,
newSize));;
endif 
:return destChannel.transferFrom(channel,
position,count);;
stop
end
start
note right
LogOffsetPositionsearchForOffsetWithSize(longtargetOffset,
intstartingPosition)
end note
if (offset>=targetOffset) then (yes) 
:return new LogOffsetPosition(offset,batch.position(),
batch.sizeInBytes());;
stop
endif 
:return null ;;
stop
end
start
note right
TimestampAndOffsetsearchForTimestamp(longtargetTimestamp,
intstartingPosition,longstartingOffset)
end note
if (batch.maxTimestamp()>=targetTimestamp) then (yes) 
if (timestamp>=targetTimestamp&&record.offset()>=startingOffset) then (yes) 
:return new TimestampAndOffset(timestamp,
record.offset(),maybeLeaderEpoch(batch.partitionLeaderEpoch()));;
stop
endif 
endif 
:return null ;;
stop
end
start
note right
TimestampAndOffsetlargestTimestampAfter(intstartingPosition)
end note
if (timestamp>maxTimestamp) then (yes) 
:maxTimestamp=timestamp;
:offsetOfMaxTimestamp=batch.lastOffset();
:leaderEpochOfMaxTimestamp=batch.partitionLeaderEpoch();
endif 
:return new TimestampAndOffset(maxTimestamp,
offsetOfMaxTimestamp,maybeLeaderEpoch(leaderEpochOfMaxTimestamp));;
stop
end
start
note right
Optional<Integer>maybeLeaderEpoch(intleaderEpoch)
end note
:return leaderEpoch==RecordBatch.NO_PARTITION_LEADER_EPOCH? Optional.empty():Optional.of(leaderEpoch);;
stop
end
start
note right
Iterable<FileChannelRecordBatch>batches()
end note
:return batches;;
stop
end
start
note right
StringtoString()
end note
:return "FileRecords(size="+sizeInBytes()+
", file="+file+", start="+start+", end="+
end+")";;
stop
end
start
note right
Iterable<FileChannelRecordBatch>batchesFrom(final intstart)
end note
:return ()->batchIterator(start);;
stop
end
start
note right
AbstractIterator<FileChannelRecordBatch>batchIterator()
end note
:return batchIterator(start);;
stop
end
start
note right
AbstractIterator<FileChannelRecordBatch>batchIterator(intstart)
end note
if (isSlice) then (yes) 
:end=this.end;
else (no)
:end=this.sizeInBytes();
endif 
:return new RecordBatchIterator<>(inputStream);;
stop
end
start
note right
FileRecordsopen(Filefile,booleanmutable,booleanfileAlreadyExists,
intinitFileSize,booleanpreallocate)
end note
:return new FileRecords(file,channel,0,end,
false);;
stop
end
start
note right
FileRecordsopen(Filefile,booleanfileAlreadyExists,
intinitFileSize,booleanpreallocate)
end note
:return open(file,true,fileAlreadyExists,
initFileSize,preallocate);;
stop
end
start
note right
FileRecordsopen(Filefile,booleanmutable)
end note
:return open(file,mutable,false,0,false);;
stop
end
start
note right
FileRecordsopen(Filefile)
end note
:return open(file,true);;
stop
end
start
note right
FileChannelopenChannel(Filefile,booleanmutable,
booleanfileAlreadyExists,intinitFileSize,
booleanpreallocate)
end note
if (mutable) then (yes) 
if (fileAlreadyExists||!preallocate) then (yes) 
:return FileChannel.open(file.toPath(),StandardOpenOption.CREATE,
StandardOpenOption.READ,StandardOpenOption.WRITE);;
stop
else (no)
:randomAccessFile.setLength(initFileSize);
:return randomAccessFile.getChannel();;
stop
endif 
else (no)
:return FileChannel.open(file.toPath());;
stop
endif 
end
start
note right
constructor LogOffsetPosition(longoffset,
intposition,intsize)
end note
:this.offset=offset;
:this.position=position;
:this.size=size;
end
start
note right
booleanequals(Objecto)
end note
if (this==o) then (yes) 
:return true;;
stop
endif 
if (o==null ||getClass()!=o.getClass()) then (yes) 
:return false;;
stop
endif 
:return offset==that.offset&&position==that.position&&size==that.size;;
stop
end
start
note right
inthashCode()
end note
:result=31*result+position;
:result=31*result+size;
:return result;;
stop
end
start
note right
StringtoString()
end note
:return "LogOffsetPosition("+"offset="+offset+
", position="+position+", size="+size+')';;
stop
end
start
note right
constructor TimestampAndOffset(longtimestamp,
longoffset,Optional<Integer>leaderEpoch)
end note
:this.timestamp=timestamp;
:this.offset=offset;
:this.leaderEpoch=leaderEpoch;
end
start
note right
booleanequals(Objecto)
end note
if (this==o) then (yes) 
:return true;;
stop
endif 
if (o==null ||getClass()!=o.getClass()) then (yes) 
:return false;;
stop
endif 
:return timestamp==that.timestamp&&offset==that.offset&&Objects.equals(leaderEpoch,
that.leaderEpoch);;
stop
end
start
note right
inthashCode()
end note
:return Objects.hash(timestamp,offset,leaderEpoch);;
stop
end
start
note right
StringtoString()
end note
:return "TimestampAndOffset("+"timestamp="+
timestamp+", offset="+offset+", leaderEpoch="+
leaderEpoch+')';;
stop
end
@enduml

