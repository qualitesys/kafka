@startuml
!pragma layout smetana
start
note right
constructor MetadataCache(StringclusterId,
Map<Integer,Node>nodes,Collection<PartitionMetadata>partitions,
Set<String>unauthorizedTopics,Set<String>invalidTopics,
Set<String>internalTopics,Nodecontroller,
Map<String,Uuid>topicIds)
end note
:this(clusterId,nodes,partitions,unauthorizedTopics,
invalidTopics,internalTopics,controller,topicIds,
null );
end
start
note right
constructor MetadataCache(StringclusterId,
Map<Integer,Node>nodes,Collection<PartitionMetadata>partitions,
Set<String>unauthorizedTopics,Set<String>invalidTopics,
Set<String>internalTopics,Nodecontroller,
Map<String,Uuid>topicIds,ClusterclusterInstance)
end note
:this.clusterId=clusterId;
:this.nodes=nodes;
:this.unauthorizedTopics=unauthorizedTopics;
:this.invalidTopics=invalidTopics;
:this.internalTopics=internalTopics;
:this.controller=controller;
:this.topicIds=topicIds;
:this.metadataByPartition=new HashMap<>(partitions.size());
:this.metadataByPartition.put(p.topicPartition,p);
if (clusterInstance==null ) then (yes) 
:computeClusterView();
else (no)
:this.clusterInstance=clusterInstance;
endif 
end
start
note right
Optional<PartitionMetadata>partitionMetadata(TopicPartitiontopicPartition)
end note
:return Optional.ofNullable(metadataByPartition.get(topicPartition));;
stop
end
start
note right
Map<String,Uuid>topicIds()
end note
:return topicIds;;
stop
end
start
note right
Optional<Node>nodeById(intid)
end note
:return Optional.ofNullable(nodes.get(id));;
stop
end
start
note right
Clustercluster()
end note
if (clusterInstance==null ) then (yes) 
:throw new IllegalStateException("Cached Cluster instance should not be null,
 but was.");;
else (no)
:return clusterInstance;;
stop
endif 
end
start
note right
ClusterResourceclusterResource()
end note
:return new ClusterResource(clusterId);;
stop
end
start
note right
MetadataCachemergeWith(StringnewClusterId,
Map<Integer,Node>newNodes,Collection<PartitionMetadata>addPartitions,
Set<String>addUnauthorizedTopics,Set<String>addInvalidTopics,
Set<String>addInternalTopics,NodenewController,
Map<String,Uuid>topicIds,BiPredicate<String,
Boolean>retainTopic)
end note
:newMetadataByPartition.put(partition.topicPartition,
partition);
if (id!=null ) then (yes) 
:newTopicIds.put(partition.topic(),id);
else (no)
:newTopicIds.remove(partition.topic());
endif 
if (shouldRetainTopic.test(entry.getKey()
.topic())) then (yes) 
:newMetadataByPartition.putIfAbsent(entry.getKey(),
entry.getValue());
endif 
:return new MetadataCache(newClusterId,newNodes,
newMetadataByPartition.values(),newUnauthorizedTopics,
newInvalidTopics,newInternalTopics,newController,
newTopicIds);;
stop
end
if (predicate.test(element)) then (yes) 
:result.add(element);
endif 
:return result;;
stop
start
note right
void computeClusterView()
end note
:this.clusterInstance=new Cluster(clusterId,
nodes.values(),partitionInfos,unauthorizedTopics,
invalidTopics,internalTopics,controller,topicIds);
end
start
note right
MetadataCachebootstrap(List<InetSocketAddress>addresses)
end note
:nodes.put(nodeId,new Node(nodeId,address.getHostString(),
address.getPort()));
:nodeId- -;
:return new MetadataCache(null ,nodes,Collections.emptyList(),
Collections.emptySet(),Collections.emptySet(),
Collections.emptySet(),null ,Collections.emptyMap(),
Cluster.bootstrap(addresses));;
stop
end
start
note right
MetadataCacheempty()
end note
:return new MetadataCache(null ,Collections.emptyMap(),
Collections.emptyList(),Collections.emptySet(),
Collections.emptySet(),Collections.emptySet(),
null ,Collections.emptyMap(),Cluster.empty());;
stop
end
start
note right
StringtoString()
end note
:return "MetadataCache{"+"clusterId='"+clusterId+
'\''+", nodes="+nodes+", partitions="+metadataByPartition.values()+
", controller="+controller+'}';;
stop
end
@enduml

