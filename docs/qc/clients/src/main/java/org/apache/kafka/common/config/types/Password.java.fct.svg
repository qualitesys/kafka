@startuml
!pragma layout smetana
start
note right
constructor Password(Stringvalue)
end note
:this.value=value;;
end
start
note right
inthashCode()
end note
:return value.hashCode();;
stop
end
start
note right
booleanequals(Objectobj)
end note
if (!(obj instanceof Password)) then (yes) 
:return false;;
stop
endif 
:return value.equals(other.value);;
stop
end
start
note right
StringtoString()
end note
:return HIDDEN;;
stop
end
start
note right
Stringvalue()
end note
:return value;;
stop
end
@enduml

