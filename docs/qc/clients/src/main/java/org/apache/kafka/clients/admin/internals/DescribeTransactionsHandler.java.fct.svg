@startuml
!pragma layout smetana
start
note right
constructor DescribeTransactionsHandler(LogContextlogContext)
end note
:this.log=logContext.logger(DescribeTransactionsHandler.class );;
:this.lookupStrategy=new CoordinatorStrategy(CoordinatorType.TRANSACTION,
logContext);;
end
start
note right
AdminApiFuture.SimpleAdminApiFuture<CoordinatorKey,
TransactionDescription>newFuture(Collection<String>transactionalIds)
end note
:return AdminApiFuture.forKeys(buildKeySet(transactionalIds));;
stop
end
start
note right
Set<CoordinatorKey>buildKeySet(Collection<String>transactionalIds)
end note
:return transactionalIds.stream().map(CoordinatorKey::byTransactionalId)
.collect(Collectors.toSet());;
stop
end
start
note right
StringapiName()
end note
:return "describeTransactions";;
stop
end
start
note right
AdminApiLookupStrategy<CoordinatorKey>lookupStrategy()
end note
:return lookupStrategy;;
stop
end
start
note right
DescribeTransactionsRequest.BuilderbuildBatchedRequest(intbrokerId,
Set<CoordinatorKey>keys)
end note
:DescribeTransactionsRequestDatarequest=new DescribeTransactionsRequestData();;
:List<String>transactionalIds=keys.stream().map(key->{if (key.type!=FindCoordinatorRequest.CoordinatorType.TRANSACTION){throw new IllegalArgumentException("Invalid group coordinator key "+
key+" when building  DescribeTransaction  request");}return key.idValue;}).collect(Collectors.toList());;
:request.setTransactionalIds(transactionalIds);;
:return new DescribeTransactionsRequest.Builder(request);;
stop
end
start
note right
ApiResult<CoordinatorKey,TransactionDescription>handleResponse(Nodebroker,
Set<CoordinatorKey>keys,AbstractResponseabstractResponse)
end note
:DescribeTransactionsResponseresponse=(DescribeTransactionsResponse)abstractResponse;;
:Map<CoordinatorKey,TransactionDescription>completed=new HashMap<>();;
:Map<CoordinatorKey,Throwable>failed=new HashMap<>();;
:List<CoordinatorKey>unmapped=new ArrayList<>();;
:CoordinatorKeytransactionalIdKey=CoordinatorKey.byTransactionalId(transactionState.transactionalId());;
if (!keys.contains(transactionalIdKey)) then (yes) 
:log.warn("Response included transactionalId  {} ,
 which was not requested",transactionState.transactionalId());;
:continue ;;
endif 
:Errorserror=Errors.forCode(transactionState.errorCode());;
if (error!=Errors.NONE) then (yes) 
:handleError(transactionalIdKey,error,failed,
unmapped);;
:continue ;;
endif 
:OptionalLongtransactionStartTimeMs=transactionState.transactionStartTimeMs()<0? OptionalLong.empty():OptionalLong.of(transactionState.transactionStartTimeMs());;
:completed.put(transactionalIdKey,new TransactionDescription(broker.id(),
TransactionState.parse(transactionState.transactionState()),
transactionState.producerId(),transactionState.producerEpoch(),
transactionState.transactionTimeoutMs(),transactionStartTimeMs,
collectTopicPartitions(transactionState)));;
:return new ApiResult<>(completed,failed,
unmapped);;
stop
end
start
note right
Set<TopicPartition>collectTopicPartitions(DescribeTransactionsResponseData.TransactionStatetransactionState)
end note
:Set<TopicPartition>res=new HashSet<>();;
:Stringtopic=topicData.topic();;
:res.add(new TopicPartition(topic,partitionId));;
:return res;;
stop
end
start
note right
void handleError(CoordinatorKeytransactionalIdKey,
Errorserror,Map<CoordinatorKey,Throwable>failed,
List<CoordinatorKey>unmapped)
end note
switch (switch (error))
endswith
end
@enduml

