!pragma layout smetana
start
note right
constructor BrokerHeartbeatResponse(BrokerHeartbeatResponseDatadata)
end note
:super (ApiKeys.BROKER_HEARTBEAT);
:this.data=data;
end
start
note right
BrokerHeartbeatResponseDatadata()
end note
:return data;;
stop
end
start
note right
intthrottleTimeMs()
end note
:return data.throttleTimeMs();;
stop
end
start
note right
Map<Errors,Integer>errorCounts()
end note
:errorCounts.put(Errors.forCode(data.errorCode()),1);
:return errorCounts;;
stop
end
start
note right
BrokerHeartbeatResponseparse(ByteBufferbuffer,shortversion)
end note
:return new BrokerHeartbeatResponse(new BrokerHeartbeatResponseData(new ByteBufferAccessor(buffer),version));;
stop
end
start
note right
booleanshouldClientThrottle(shortversion)
end note
:return true;;
