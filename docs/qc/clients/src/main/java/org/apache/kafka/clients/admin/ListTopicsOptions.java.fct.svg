@startuml
!pragma layout smetana
start
note right
ListTopicsOptionstimeoutMs(IntegertimeoutMs)
end note
:return this;;
stop
end
start
note right
ListTopicsOptionslistInternal(booleanlistInternal)
end note
:return this;;
stop
end
start
note right
booleanshouldListInternal()
end note
:return listInternal;;
stop
end
start
note right
StringtoString()
end note
:return "ListTopicsOptions("+"listInternal="+
listInternal+')';;
stop
end
start
note right
booleanequals(Objecto)
end note
if (this==o) then (yes) 
:return true;;
stop
endif 
if (o==null ||getClass()!=o.getClass()) then (yes) 
:return false;;
stop
endif 
:return listInternal==that.listInternal;;
stop
end
start
note right
inthashCode()
end note
:return Objects.hash(listInternal);;
stop
end
@enduml

