@startuml
!pragma layout smetana
start
note right
ListTopicsOptions timeoutMs(Integer timeoutMs)
end note
:this.timeoutMs=timeoutMs;;
:return this;;
stop
end
start
note right
ListTopicsOptions listInternal(boolean listInternal)
end note
:this.listInternal=listInternal;;
:return this;;
stop
end
start
note right
boolean shouldListInternal()
end note
:return listInternal;;
stop
end
start
note right
String toString()
end note
:return "ListTopicsOptions("+"listInternal="+
listInternal+')';;
stop
end
start
note right
boolean equals(Object o)
end note
if (this==o) then (yes) 
:return true;;
stop
endif 
if (o==null ||getClass()!=o.getClass()) then (yes) 
:return false;;
stop
endif 
:ListTopicsOptions that=(ListTopicsOptions )o;;
:return listInternal==that.listInternal;;
stop
end
start
note right
int hashCode()
end note
:return Objects.hash(listInternal);;
stop
end
@enduml

