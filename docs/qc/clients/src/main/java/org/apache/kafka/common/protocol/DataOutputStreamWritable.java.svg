@startuml
!pragma layout smetana
Writable <|- - org.apache.kafka.common.protocol.DataOutputStreamWritable
class org.apache.kafka.common.protocol.DataOutputStreamWritable {
+  DataOutputStreamWritable(DataOutputStream)
+  writeByte(byte)
+  writeShort(short)
+  writeInt(int)
+  writeLong(long)
+  writeDouble(double)
+  writeByteArray(byte[])
+  writeUnsignedVarint(int)
+  writeByteBuffer(ByteBuffer)
+  writeVarint(int)
+  writeVarlong(long)
+  flush()
+  close()
} 
@enduml

