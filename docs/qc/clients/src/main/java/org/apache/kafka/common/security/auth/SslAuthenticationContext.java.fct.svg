@startuml
!pragma layout smetana
start
note right
constructor SslAuthenticationContext(SSLSessionsession,InetAddressclientAddress,StringlistenerName)
end note
:this.session=session;
:this.clientAddress=clientAddress;
:this.listenerName=listenerName;
end
start
note right
SSLSessionsession()
end note
:return session;;
stop
end
start
note right
SecurityProtocolsecurityProtocol()
end note
:return SecurityProtocol.SSL;;
stop
end
start
note right
InetAddressclientAddress()
end note
:return clientAddress;;
stop
end
start
note right
StringlistenerName()
end note
:return listenerName;;
stop
end
@enduml

