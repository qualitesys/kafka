@startuml
!pragma layout smetana
start
note right
constructor PureJavaCrc32C()
end note
:reset();;
end
start
note right
longgetValue()
end note
:longret=crc;;
:return (~ret)&0xffffffffL;;
stop
end
start
note right
void reset()
end note
:crc=0xffffffff;;
end
start
note right
void update(byte[]b,intoff,intlen)
end note
:intlocalCrc=crc;;
while (len>7)
:final intc0=(b[off+0]^localCrc)&0xff;;
:final intc1=(b[off+1]^(localCrc>>>=8))&0xff;;
:final intc2=(b[off+2]^(localCrc>>>=8))&0xff;;
:final intc3=(b[off+3]^(localCrc>>>=8))&0xff;;
:localCrc=(T[T8_7_START+c0]^T[T8_6_START+
c1])^(T[T8_5_START+c2]^T[T8_4_START+c3]);;
:final intc4=b[off+4]&0xff;;
:final intc5=b[off+5]&0xff;;
:final intc6=b[off+6]&0xff;;
:final intc7=b[off+7]&0xff;;
:localCrc^=(T[T8_3_START+c4]^T[T8_2_START+
c5])^(T[T8_1_START+c6]^T[T8_0_START+c7]);;
:off+=8;;
:len-=8;;
endwhile
switch (switch (len))
endswith
:crc=localCrc;;
end
start
note right
void update(intb)
end note
:crc=(crc>>>8)^T[T8_0_START+((crc^b)&0xff)];;
end
@enduml

