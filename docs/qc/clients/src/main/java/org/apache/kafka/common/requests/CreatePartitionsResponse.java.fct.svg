@startuml
!pragma layout smetana
start
note right
constructor CreatePartitionsResponse(CreatePartitionsResponseDatadata)
end note
:super (ApiKeys.CREATE_PARTITIONS);
:this.data=data;
end
start
note right
CreatePartitionsResponseDatadata()
end note
:return data;;
stop
end
start
note right
Map<Errors,Integer>errorCounts()
end note
:data.results().forEach(result->updateErrorCounts(counts,
Errors.forCode(result.errorCode())));
:return counts;;
stop
end
start
note right
CreatePartitionsResponseparse(ByteBufferbuffer,shortversion)
end note
:return new CreatePartitionsResponse(new CreatePartitionsResponseData(new ByteBufferAccessor(buffer),version));;
stop
end
start
note right
booleanshouldClientThrottle(shortversion)
end note
:return version>=1;;
stop
end
start
note right
intthrottleTimeMs()
end note
:return data.throttleTimeMs();;
stop
end
@enduml

