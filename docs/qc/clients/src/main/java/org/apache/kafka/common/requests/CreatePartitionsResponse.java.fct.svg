@startuml
!pragma layout smetana
start
note right
constructor CreatePartitionsResponse(CreatePartitionsResponseData data)
end note
:super (ApiKeys.CREATE_PARTITIONS);;
:this.data=data;;
end
start
note right
CreatePartitionsResponseData data()
end note
:return data;;
stop
end
start
note right
Map<Errors,Integer> errorCounts()
end note
:Map<Errors,Integer> counts=new HashMap<>();;
:data.results().forEach(result->updateErrorCounts(counts,
Errors.forCode(result.errorCode())));;
:return counts;;
stop
end
start
note right
CreatePartitionsResponse parse(ByteBuffer buffer,
short version)
end note
:return new CreatePartitionsResponse(new CreatePartitionsResponseData(new ByteBufferAccessor(buffer),
version));;
stop
end
start
note right
boolean shouldClientThrottle(short version)
end note
:return version>=1;;
stop
end
start
note right
int throttleTimeMs()
end note
:return data.throttleTimeMs();;
stop
end
@enduml

