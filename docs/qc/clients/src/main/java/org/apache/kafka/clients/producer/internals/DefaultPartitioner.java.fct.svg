@startuml
!pragma layout smetana
start
note right
void configure(Map<String,?> configs)
end note
end
start
note right
int partition(String topic,Object key,byte[] keyBytes,
Object value,byte[] valueBytes,Cluster cluster)
end note
:return partition(topic,key,keyBytes,value,
valueBytes,cluster,cluster.partitionsForTopic(topic).size());;
stop
end
start
note right
int partition(String topic,Object key,byte[] keyBytes,
Object value,byte[] valueBytes,Cluster cluster,
int numPartitions)
end note
if (keyBytes==null ) then (yes) 
:return stickyPartitionCache.partition(topic,
cluster);;
stop
endif 
:return BuiltInPartitioner.partitionForKey(keyBytes,
numPartitions);;
stop
end
start
note right
void close()
end note
end
start
note right
void onNewBatch(String topic,Cluster cluster,
int prevPartition)
end note
:stickyPartitionCache.nextPartition(topic,
cluster,prevPartition);;
end
@enduml

