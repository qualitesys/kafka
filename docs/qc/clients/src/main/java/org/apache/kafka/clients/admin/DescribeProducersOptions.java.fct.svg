@startuml
!pragma layout smetana
start
note right
DescribeProducersOptionsbrokerId(intbrokerId)
end note
:this.brokerId=OptionalInt.of(brokerId);
:return this;;
stop
end
start
note right
OptionalIntbrokerId()
end note
:return brokerId;;
stop
end
start
note right
booleanequals(Objecto)
end note
if (this==o) then (yes) 
:return true;;
stop
endif 
if (o==null ||getClass()!=o.getClass()) then (yes) 
:return false;;
stop
endif 
:return Objects.equals(brokerId,that.brokerId)&&Objects.equals(timeoutMs,that.timeoutMs);;
stop
end
start
note right
inthashCode()
end note
:return Objects.hash(brokerId,timeoutMs);;
stop
end
start
note right
StringtoString()
end note
:return "DescribeProducersOptions("+"brokerId="+brokerId+", timeoutMs="+timeoutMs+')';;
stop
end
@enduml

