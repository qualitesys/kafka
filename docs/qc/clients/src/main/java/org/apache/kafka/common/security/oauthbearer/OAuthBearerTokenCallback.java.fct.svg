@startuml
!pragma layout smetana
start
note right
OAuthBearerToken token()
end note
:return token;;
stop
end
start
note right
String errorCode()
end note
:return errorCode;;
stop
end
start
note right
String errorDescription()
end note
:return errorDescription;;
stop
end
start
note right
String errorUri()
end note
:return errorUri;;
stop
end
start
note right
void token(OAuthBearerToken token)
end note
:this.token=token;;
:this.errorCode=null ;;
:this.errorDescription=null ;;
:this.errorUri=null ;;
end
start
note right
void error(String errorCode,String errorDescription,
String errorUri)
end note
if (Objects.requireNonNull(errorCode).isEmpty()) then (yes) 
:throw new IllegalArgumentException("error code must not be empty");;
stop
endif 
:this.errorCode=errorCode;;
:this.errorDescription=errorDescription;;
:this.errorUri=errorUri;;
:this.token=null ;;
end
@enduml

