@startuml
!pragma layout smetana
start
note right
OAuthBearerTokentoken()
end note
:return token;;
stop
end
start
note right
StringerrorCode()
end note
:return errorCode;;
stop
end
start
note right
StringerrorDescription()
end note
:return errorDescription;;
stop
end
start
note right
StringerrorUri()
end note
:return errorUri;;
stop
end
start
note right
void token(OAuthBearerTokentoken)
end note
:this.token=token;
:this.errorCode=null ;
:this.errorDescription=null ;
:this.errorUri=null ;
end
start
note right
void error(StringerrorCode,StringerrorDescription,StringerrorUri)
end note
if (Objects.requireNonNull(errorCode).isEmpty()) then (yes) 
endif 
:this.errorCode=errorCode;
:this.errorDescription=errorDescription;
:this.errorUri=errorUri;
:this.token=null ;
end
@enduml

