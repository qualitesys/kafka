@startuml
!pragma layout smetana
start
note right
byte[]serialize(Stringtopic,Integerdata)
end note
if (data==null ) then (yes) 
:return null ;;
stop
endif 
:return new byte[]{(byte)(data>>>24),(byte)(data>>>16),
