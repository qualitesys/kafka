@startuml
!pragma layout smetana
start
note right
constructor Builder(DescribeGroupsRequestDatadata)
end note
end
start
note right
DescribeGroupsRequestbuild(shortversion)
end note
:return new DescribeGroupsRequest(data,version);;
stop
end
start
note right
StringtoString()
end note
:return data.toString();;
stop
end
start
note right
constructor DescribeGroupsRequest(DescribeGroupsRequestDatadata,
shortversion)
end note
end
start
note right
DescribeGroupsRequestDatadata()
end note
:return data;;
stop
end
start
note right
AbstractResponsegetErrorResponse(intthrottleTimeMs,
Throwablee)
end note
if (version()==0) then (yes) 
:return DescribeGroupsResponse.fromError(DEFAULT_THROTTLE_TIME,
Errors.forException(e),data.groups());;
stop
else (no)
:return DescribeGroupsResponse.fromError(throttleTimeMs,
Errors.forException(e),data.groups());;
stop
endif 
end
start
note right
DescribeGroupsRequestparse(ByteBufferbuffer,
shortversion)
end note
:return new DescribeGroupsRequest(new DescribeGroupsRequestData(new ByteBufferAccessor(buffer),
version),version);;
stop
end
