start
note right
constructor ScramCredential(byte[]salt,byte[]storedKey,byte[]serverKey,intiterations)
end note
:this.salt=salt;
:this.serverKey=serverKey;
:this.storedKey=storedKey;
:this.iterations=iterations;
end
start
