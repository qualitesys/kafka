@startuml
!pragma layout smetana
start
note right
constructor AbortTransactionHandler(AbortTransactionSpecabortSpec,
LogContextlogContext)
end note
:this.abortSpec=abortSpec;
:this.log=logContext.logger(AbortTransactionHandler.class );
:this.lookupStrategy=new PartitionLeaderStrategy(logContext);
end
start
note right
AdminApiFuture.SimpleAdminApiFuture<TopicPartition,
Void>newFuture(Set<TopicPartition>topicPartitions)
end note
:return AdminApiFuture.forKeys(topicPartitions);;
stop
end
start
note right
StringapiName()
end note
:return "abortTransaction";;
stop
end
start
note right
AdminApiLookupStrategy<TopicPartition>lookupStrategy()
end note
:return lookupStrategy;;
stop
end
start
note right
WriteTxnMarkersRequest.BuilderbuildBatchedRequest(intbrokerId,
Set<TopicPartition>topicPartitions)
end note
:validateTopicPartitions(topicPartitions);
:marker.topics().add(new WriteTxnMarkersRequestData.WritableTxnMarkerTopic()
.setName(abortSpec.topicPartition().topic())
.setPartitionIndexes(singletonList(abortSpec.topicPartition()
.partition())));
:request.markers().add(marker);
:return new WriteTxnMarkersRequest.Builder(request);;
stop
end
start
note right
ApiResult<TopicPartition,Void>handleResponse(Nodebroker,
Set<TopicPartition>topicPartitions,AbstractResponseabstractResponse)
end note
:validateTopicPartitions(topicPartitions);
if (markerResponses.size()!=1||markerResponses.get(0)
.producerId()!=abortSpec.producerId()) then (yes) 
:return ApiResult.failed(abortSpec.topicPartition(),new KafkaException("WriteTxnMarkers response "+
"included unexpected marker entries: "+markerResponses+
"(expected to find exactly one "+"entry with producerId "+
abortSpec.producerId()+")"));;
stop
endif 
if (topicResponses.size()!=1||!topicResponses.get(0)
.name().equals(abortSpec.topicPartition()
.topic())) then (yes) 
:return ApiResult.failed(abortSpec.topicPartition(),new KafkaException("WriteTxnMarkers response "+
"included unexpected topic entries: "+markerResponses+
"(expected to find exactly one "+"entry with topic partition "+
abortSpec.topicPartition()+")"));;
stop
endif 
if (partitionResponses.size()!=1||partitionResponses.get(0)
.partitionIndex()!=abortSpec.topicPartition()
.partition()) then (yes) 
:return ApiResult.failed(abortSpec.topicPartition(),new KafkaException("WriteTxnMarkers response "+
"included unexpected partition entries for topic "+
abortSpec.topicPartition().topic()+": "+markerResponses+
"(expected to find exactly one entry with partition "+
abortSpec.topicPartition().partition()+")"));;
stop
endif 
if (error!=Errors.NONE) then (yes) 
:return handleError(error);;
stop
else (no)
:return ApiResult.completed(abortSpec.topicPartition(),
null );;
stop
endif 
end
start
note right
ApiResult<TopicPartition,Void>handleError(Errorserror)
end note
:log.error("WriteTxnMarkers request for abort spec {} failed cluster authorization",
abortSpec);
:return ApiResult.failed(abortSpec.topicPartition(),new ClusterAuthorizationException("WriteTxnMarkers request with "+
abortSpec+" failed due to cluster "+"authorization error"));;
stop
:log.error("WriteTxnMarkers request for abort spec {} failed due to an invalid producer epoch",
abortSpec);
:return ApiResult.failed(abortSpec.topicPartition(),new InvalidProducerEpochException("WriteTxnMarkers request with "+
abortSpec+" failed due an invalid producer epoch"));;
stop
:log.error("WriteTxnMarkers request for abort spec {} failed because the coordinator epoch is fenced",
abortSpec);
:return ApiResult.failed(abortSpec.topicPartition(),
new TransactionCoordinatorFencedException("WriteTxnMarkers request with "+
abortSpec+" failed since the provided "+"coordinator epoch "+
abortSpec.coordinatorEpoch()+" has been fenced "+
"by the active coordinator"));;
stop
:log.debug("WriteTxnMarkers request for abort spec {} failed due to {}. Will retry after attempting to "+
"find the leader again",abortSpec,error);
:return ApiResult.unmapped(singletonList(abortSpec.topicPartition()));;
stop
:log.error("WriteTxnMarkers request for abort spec {} failed due to an unexpected error {}",
abortSpec,error);
:return ApiResult.failed(abortSpec.topicPartition(),error.exception("WriteTxnMarkers request with "+
abortSpec+" failed due to unexpected error: "+
error.message()));;
stop
end
start
note right
void validateTopicPartitions(Set<TopicPartition>topicPartitions)
end note
if (!topicPartitions.equals(singleton(abortSpec.topicPartition()))) then (yes) 
:throw new IllegalArgumentException("Received unexpected topic partitions "+
topicPartitions+" (expected only "+singleton(abortSpec.topicPartition())+
")");;
endif 
end
@enduml

