@startuml
!pragma layout smetana
start
note right
void configure(Map<String,? >configs)
end note
end
start
note right
intpartition(Stringtopic,Objectkey,byte[]keyBytes,Objectvalue,byte[]valueBytes,Clustercluster)
end note
:return stickyPartitionCache.partition(topic,
cluster);;
stop
end
start
note right
void close()
end note
end
start
note right
void onNewBatch(Stringtopic,Clustercluster,intprevPartition)
end note
:stickyPartitionCache.nextPartition(topic,
cluster,prevPartition);
end
@enduml

