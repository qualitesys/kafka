@startuml
!pragma layout smetana
start
note right
constructor ExpireDelegationTokenResponse(ExpireDelegationTokenResponseDatadata)
end note
:super (ApiKeys.EXPIRE_DELEGATION_TOKEN);
:this.data=data;
end
start
note right
ExpireDelegationTokenResponseparse(ByteBufferbuffer,
shortversion)
end note
:return new ExpireDelegationTokenResponse(new ExpireDelegationTokenResponseData(new ByteBufferAccessor(buffer),
version));;
stop
end
start
note right
Errorserror()
end note
:return Errors.forCode(data.errorCode());;
stop
end
start
note right
longexpiryTimestamp()
end note
:return data.expiryTimestampMs();;
stop
end
start
note right
Map<Errors,Integer>errorCounts()
end note
