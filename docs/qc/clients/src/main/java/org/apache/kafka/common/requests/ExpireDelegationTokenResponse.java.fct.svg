@startuml
!pragma layout smetana
start
note right
constructor ExpireDelegationTokenResponse(ExpireDelegationTokenResponseDatadata)
end note
end
start
note right
ExpireDelegationTokenResponseparse(ByteBufferbuffer,
shortversion)
end note
:return new ExpireDelegationTokenResponse(new ExpireDelegationTokenResponseData(new ByteBufferAccessor(buffer),
version));;
stop
end
start
note right
Errorserror()
end note
:return Errors.forCode(data.errorCode());;
stop
end
start
note right
longexpiryTimestamp()
end note
:return data.expiryTimestampMs();;
stop
end
start
note right
Map<Errors,Integer>errorCounts()
end note
:return errorCounts(error());;
stop
end
start
note right
ExpireDelegationTokenResponseDatadata()
end note
:return data;;
stop
end
start
note right
intthrottleTimeMs()
end note
:return data.throttleTimeMs();;
stop
end
start
note right
booleanhasError()
end note
:return error()!=Errors.NONE;;
stop
end
start
note right
booleanshouldClientThrottle(shortversion)
end note
:return version>=1;;
stop
end
@enduml

