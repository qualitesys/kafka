@startuml
!pragma layout smetana
start
note right
constructor CreatePartitionsResult(Map<String,KafkaFuture<Void>>values)
end note
:this.values=values;
end
start
note right
Map<String,KafkaFuture<Void>>values()
end note
:return values;;
stop
end
start
note right
KafkaFuture<Void>all()
end note
:return KafkaFuture.allOf(values.values().toArray(new KafkaFuture[0]));;
stop
end
@enduml

