@startuml
!pragma layout smetana
start
note right
void configure(Map<String,? >configs,StringcontextName,
Configurationconfiguration,AuthenticateCallbackHandlerloginCallbackHandler)
end note
end
start
note right
void close()
end note
if (expiringCredentialRefreshingLogin!=null ) then (yes) 
endif 
end
start
note right
Subjectsubject()
end note
:return expiringCredentialRefreshingLogin!=null ? expiringCredentialRefreshingLogin.subject():null ;;
stop
end
start
note right
StringserviceName()
end note
:return expiringCredentialRefreshingLogin!=null ? expiringCredentialRefreshingLogin.serviceName():null ;;
stop
end
start
note right
LoginContextlogin()
end note
if (expiringCredentialRefreshingLogin!=null ) then (yes) 
:return expiringCredentialRefreshingLogin.login();;
stop
endif 
:throw new LoginException("Login was not configured properly");;
end
@enduml

