:expiringCredentialRefreshingLogin=new ExpiringCredentialRefreshingLogin(contextName,configuration,new ExpiringCredentialRefreshConfig(configs,true),loginCallbackHandler,classToSynchronizeOnPriorToRefresh){@Override public ExpiringCredentialexpiringCredential(){Set<OAuthBearerToken>privateCredentialTokens=expiringCredentialRefreshingLogin.subject().getPrivateCredentials(OAuthBearerToken.class );if (privateCredentialTokens.isEmpty())return null ;final OAuthBearerTokentoken=privateCredentialTokens.iterator().next();if (log.isDebugEnabled())log.debug("Found expiring credential with principal '{}'.",token.principalName());return new ExpiringCredential(){@Override public StringprincipalName(){return token.principalName();}@Override public LongstartTimeMs(){return token.startTimeMs();}@Override public longexpireTimeMs(){return token.lifetimeMs();}@Override public LongabsoluteLastRefreshTimeMs(){return null ;}};}};
