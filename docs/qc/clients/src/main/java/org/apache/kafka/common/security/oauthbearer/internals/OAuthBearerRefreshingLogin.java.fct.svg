end note
:Class<OAuthBearerRefreshingLogin> classToSynchronizeOnPriorToRefresh=OAuthBearerRefreshingLogin.class ;;
:expiringCredentialRefreshingLogin=new ExpiringCredentialRefreshingLogin(contextName,
