@startuml
!pragma layout smetana
start
note right
Optional<ReplicaView> select(TopicPartition topicPartition,
ClientMetadata clientMetadata,PartitionView partitionView)
end note
if (clientMetadata.rackId()!=null &&!clientMetadata.rackId().isEmpty()) then (yes) 
:Set<ReplicaView> sameRackReplicas=partitionView.replicas()
.stream().filter(replicaInfo->clientMetadata.rackId().equals(replicaInfo.endpoint().rack())).collect(Collectors.toSet());;
if (sameRackReplicas.isEmpty()) then (yes) 
:return Optional.of(partitionView.leader());;
stop
else (no)
if (sameRackReplicas.contains(partitionView.leader())) then (yes) 
:return Optional.of(partitionView.leader());;
stop
else (no)
:return sameRackReplicas.stream().max(ReplicaView.comparator());;
stop
endif 
endif 
else (no)
:return Optional.of(partitionView.leader());;
stop
endif 
end
@enduml

