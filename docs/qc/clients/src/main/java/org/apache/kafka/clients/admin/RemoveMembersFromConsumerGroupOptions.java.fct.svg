@startuml
!pragma layout smetana
start
note right
constructor RemoveMembersFromConsumerGroupOptions(Collection<MemberToRemove>members)
end note
if (members.isEmpty()) then (yes) 
:throw new IllegalArgumentException("Invalid empty members has been provided");;
endif 
end
start
note right
constructor RemoveMembersFromConsumerGroupOptions()
end note
end
start
note right
void reason(final Stringreason)
end note
end
start
note right
Set<MemberToRemove>members()
end note
:return members;;
stop
end
start
note right
Stringreason()
end note
:return reason;;
stop
end
start
note right
booleanremoveAll()
end note
:return members.isEmpty();;
stop
end
@enduml

