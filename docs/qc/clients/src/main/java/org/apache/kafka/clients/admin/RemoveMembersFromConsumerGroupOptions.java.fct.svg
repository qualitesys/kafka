@startuml
!pragma layout smetana
start
note right
constructor RemoveMembersFromConsumerGroupOptions(Collection<MemberToRemove> members)
end note
if (members.isEmpty()) then (yes) 
:throw new IllegalArgumentException("Invalid empty members has been provided");;
stop
endif 
:this.members=new HashSet<>(members);;
end
start
note right
constructor RemoveMembersFromConsumerGroupOptions()
end note
:this.members=Collections.emptySet();;
end
start
note right
void reason(final String reason)
end note
:this.reason=reason;;
end
start
note right
Set<MemberToRemove> members()
end note
:return members;;
stop
end
start
note right
String reason()
end note
:return reason;;
stop
end
start
note right
boolean removeAll()
end note
:return members.isEmpty();;
stop
end
@enduml

