@startuml
!pragma layout smetana
start
note right
constructor Builder(List<KafkaPrincipal>owners)
end note
end
start
note right
DescribeDelegationTokenRequestbuild(shortversion)
end note
:return new DescribeDelegationTokenRequest(data,
version);;
stop
end
start
note right
StringtoString()
end note
:return data.toString();;
stop
end
start
note right
constructor DescribeDelegationTokenRequest(DescribeDelegationTokenRequestDatadata,
shortversion)
end note
end
start
note right
DescribeDelegationTokenRequestDatadata()
end note
:return data;;
stop
end
start
note right
booleanownersListEmpty()
end note
:return data.owners()!=null &&data.owners()
.isEmpty();;
stop
end
start
note right
AbstractResponsegetErrorResponse(intthrottleTimeMs,
Throwablee)
end note
:return new DescribeDelegationTokenResponse(version(),
throttleTimeMs,Errors.forException(e));;
stop
end
start
note right
DescribeDelegationTokenRequestparse(ByteBufferbuffer,
shortversion)
end note
:return new DescribeDelegationTokenRequest(new DescribeDelegationTokenRequestData(new ByteBufferAccessor(buffer),
version),version);;
stop
end
@enduml

