@startuml
!pragma layout smetana
start
note right
constructor Builder(List<KafkaPrincipal>owners)
end note
:super (ApiKeys.DESCRIBE_DELEGATION_TOKEN);
:this.data=new DescribeDelegationTokenRequestData()
.setOwners(owners==null ? null :owners.stream()
.map(owner->new DescribeDelegationTokenRequestData.DescribeDelegationTokenOwner().setPrincipalName(owner.getName()).setPrincipalType(owner.getPrincipalType())).collect(Collectors.toList()));
end
start
note right
DescribeDelegationTokenRequestbuild(shortversion)
end note
:return new DescribeDelegationTokenRequest(data,
version);;
stop
end
start
note right
StringtoString()
end note
:return data.toString();;
stop
end
start
note right
constructor DescribeDelegationTokenRequest(DescribeDelegationTokenRequestDatadata,shortversion)
end note
:super (ApiKeys.DESCRIBE_DELEGATION_TOKEN,
version);
:this.data=data;
end
start
note right
DescribeDelegationTokenRequestDatadata()
end note
:return data;;
stop
end
start
note right
booleanownersListEmpty()
end note
:return data.owners()!=null &&data.owners()
.isEmpty();;
stop
end
start
note right
AbstractResponsegetErrorResponse(intthrottleTimeMs,Throwablee)
end note
:return new DescribeDelegationTokenResponse(version(),
throttleTimeMs,Errors.forException(e));;
stop
end
start
note right
DescribeDelegationTokenRequestparse(ByteBufferbuffer,shortversion)
end note
:return new DescribeDelegationTokenRequest(new DescribeDelegationTokenRequestData(new ByteBufferAccessor(buffer),version),version);;
stop
end
@enduml

