@startuml
!pragma layout smetana
start
note right
constructor ClusterResource(String clusterId)
end note
:this.clusterId=clusterId;;
end
start
note right
String clusterId()
end note
:return clusterId;;
stop
end
start
note right
String toString()
end note
:return "ClusterResource(clusterId="+clusterId+
")";;
stop
end
start
note right
boolean equals(Object o)
end note
if (this==o) then (yes) 
:return true;;
stop
endif 
if (o==null ||getClass()!=o.getClass()) then (yes) 
:return false;;
stop
endif 
:ClusterResource that=(ClusterResource )o;;
:return Objects.equals(clusterId,that.clusterId);;
stop
end
start
note right
int hashCode()
end note
:return Objects.hash(clusterId);;
stop
end
@enduml

