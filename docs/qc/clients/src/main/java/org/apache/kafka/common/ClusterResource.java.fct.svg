@startuml
!pragma layout smetana
start
note right
constructor ClusterResource(StringclusterId)
end note
:this.clusterId=clusterId;
end
start
note right
StringclusterId()
end note
:return clusterId;;
stop
end
start
note right
StringtoString()
end note
:return "ClusterResource(clusterId="+clusterId+
")";;
stop
end
start
note right
booleanequals(Objecto)
end note
if (this==o) then (yes) 
:return true;;
stop
endif 
if (o==null ||getClass()!=o.getClass()) then (yes) 
:return false;;
stop
endif 
:return Objects.equals(clusterId,that.clusterId);;
stop
end
start
note right
inthashCode()
end note
:return Objects.hash(clusterId);;
stop
end
@enduml

