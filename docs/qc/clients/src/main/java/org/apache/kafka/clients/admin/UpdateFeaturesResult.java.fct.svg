,360.4688,151.5,350.4688,147.5,354.4688" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="147.5" x2="147.5" y1="408.4063" y2="428.4063"/><polygon fill="#181818" points="143.5,418.4063,147.5,428.4063,151.5,418.4063,147.5,422.4063" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[282ecdf08cc028b1a7273bfe50652586]
@startuml
!pragma layout smetana
start
note right
constructor UpdateFeaturesResult(final Map<String,
KafkaFuture<Void>>futures)
end note
:this.futures=futures;;
end
start
note right
Map<String,KafkaFuture<Void>>values()
end note
:return futures;;
stop
end
start
note right
KafkaFuture<Void>all()
end note
:return KafkaFuture.allOf(futures.values()
.toArray(new KafkaFuture[0]));;
stop
end
@enduml

