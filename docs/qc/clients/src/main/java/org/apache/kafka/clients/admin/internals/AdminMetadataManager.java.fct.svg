@startuml
!pragma layout smetana
start
note right
List<Node>fetchNodes()
end note
:return cluster.nodes();;
stop
end
start
note right
booleanisUpdateDue(longnow)
end note
:return false;;
stop
end
start
note right
longmaybeUpdate(longnow)
end note
:return Long.MAX_VALUE;;
stop
end
start
note right
void handleServerDisconnect(longnow,StringdestinationId,
Optional<AuthenticationException>maybeFatalException)
end note
:maybeFatalException.ifPresent(AdminMetadataManager.this::updateFailed);;
:AdminMetadataManager.this.requestUpdate();;
end
start
note right
void handleFailedRequest(longnow,Optional<KafkaException>maybeFatalException)
end note
end
start
note right
void handleSuccessfulResponse(RequestHeaderrequestHeader,
longnow,MetadataResponsemetadataResponse)
end note
end
start
note right
void close()
end note
end
start
note right
constructor AdminMetadataManager(LogContextlogContext,
longrefreshBackoffMs,longmetadataExpireMs)
end note
:this.log=logContext.logger(AdminMetadataManager.class );;
:this.refreshBackoffMs=refreshBackoffMs;;
:this.metadataExpireMs=metadataExpireMs;;
:this.updater=new AdminMetadataUpdater();;
end
start
note right
AdminMetadataUpdaterupdater()
end note
:return updater;;
stop
end
start
note right
booleanisReady()
end note
if (authException!=null ) then (yes) 
:log.debug("Metadata is not usable: failed to get metadata.",
authException);;
:throw authException;;
stop
endif 
if (cluster.nodes().isEmpty()) then (yes) 
:log.trace("Metadata is not ready: bootstrap nodes have not been "+
"initialized yet.");;
:return false;;
stop
endif 
if (cluster.isBootstrapConfigured()) then (yes) 
:log.trace("Metadata is not ready: we have not fetched metadata from "+
"the bootstrap nodes yet.");;
:return false;;
stop
endif 
:log.trace("Metadata is ready to use.");;
:return true;;
stop
end
start
note right
Nodecontroller()
end note
:return cluster.controller();;
stop
end
start
note right
NodenodeById(intnodeId)
end note
:return cluster.nodeById(nodeId);;
stop
end
start
note right
void requestUpdate()
end note
if (state==State.QUIESCENT) then (yes) 
:state=State.UPDATE_REQUESTED;;
:log.debug("Requesting metadata update.");;
endif 
end
start
note right
void clearController()
end note
if (cluster.controller()!=null ) then (yes) 
:log.trace("Clearing cached controller node {}.",
cluster.controller());;
:this.cluster=new Cluster(cluster.clusterResource().clusterId(),
cluster.nodes(),Collections.emptySet(),Collections.emptySet(),
Collections.emptySet(),null );;
endif 
end
start
note right
longmetadataFetchDelayMs(longnow)
end note
switch (switch (state))
endswith
end
start
note right
longdelayBeforeNextExpireMs(longnow)
end note
:longtimeSinceUpdate=now-lastMetadataUpdateMs;;
:return Math.max(0,metadataExpireMs-timeSinceUpdate);;
stop
end
start
note right
longdelayBeforeNextAttemptMs(longnow)
end note
:longtimeSinceAttempt=now-lastMetadataFetchAttemptMs;;
:return Math.max(0,refreshBackoffMs-timeSinceAttempt);;
stop
end
start
note right
void transitionToUpdatePending(longnow)
end note
:this.state=State.UPDATE_PENDING;;
:this.lastMetadataFetchAttemptMs=now;;
end
start
note right
void updateFailed(Throwableexception)
end note
:this.state=State.QUIESCENT;;
if (exception instanceof AuthenticationException) then (yes) 
:log.warn("Metadata update failed due to authentication error",
exception);;
:this.authException=(AuthenticationException)exception;;
else (no)
:log.info("Metadata update failed",exception);;
endif 
end
start
note right
void update(Clustercluster,longnow)
end note
if (cluster.isBootstrapConfigured()) then (yes) 
:log.debug("Setting bootstrap cluster metadata {}.",
cluster);;
else (no)
:log.debug("Updating cluster metadata to {}",
cluster);;
:this.lastMetadataUpdateMs=now;;
endif 
:this.state=State.QUIESCENT;;
:this.authException=null ;;
if (!cluster.nodes().isEmpty()) then (yes) 
:this.cluster=cluster;;
endif 
end
@enduml

