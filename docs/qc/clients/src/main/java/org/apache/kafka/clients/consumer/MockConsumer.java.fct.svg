start
note right
void ensureNotClosed()
end note
if (this.closed) then (yes) 
:throw new IllegalStateException("This consumer has already been closed.");;
endif 
end
start
note right
void updateFetchPosition(TopicPartitiontp)
end note
if (subscriptions.isOffsetResetNeeded(tp)) then (yes) 
:resetOffsetPosition(tp);
else (no)
:subscriptions.seek(tp,committed.get(tp).offset());
endif 
end
start
note right
void resetOffsetPosition(TopicPartitiontp)
end note
if (strategy==OffsetResetStrategy.EARLIEST) then (yes) 
:offset=beginningOffsets.get(tp);
if (offset==null ) then (yes) 
:throw new IllegalStateException("MockConsumer didn't have beginning offset specified,
 but tried to seek to beginning");;
endif 
else (no)
:throw new NoOffsetForPartitionException(tp);;
endif 
:seek(tp,offset);
end
