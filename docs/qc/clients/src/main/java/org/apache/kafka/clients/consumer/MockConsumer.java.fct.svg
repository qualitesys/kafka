@startuml
!pragma layout smetana
start
note right
constructor MockConsumer(OffsetResetStrategyoffsetResetStrategy)
end note
:this.subscriptions=new SubscriptionState(new LogContext(),
offsetResetStrategy);
:this.partitions=new HashMap<>();
:this.records=new HashMap<>();
:this.paused=new HashSet<>();
:this.closed=false;
:this.beginningOffsets=new HashMap<>();
:this.endOffsets=new HashMap<>();
:this.pollTasks=new LinkedList<>();
:this.pollException=null ;
:this.wakeup=new AtomicBoolean(false);
:this.committed=new HashMap<>();
:this.shouldRebalance=false;
end
start
note right
Set<TopicPartition>assignment()
end note
:return this.subscriptions.assignedPartitions();;
stop
end
start
note right
void rebalance(Collection<TopicPartition>newAssignment)
end note
:this.records.clear();
:this.subscriptions.assignFromSubscribed(newAssignment);
end
start
note right
Set<String>subscription()
end note
:return this.subscriptions.subscription();;
stop
end
start
note right
void subscribe(Collection<String>topics)
end note
:subscribe(topics,new NoOpConsumerRebalanceListener());
end
start
note right
void subscribe(Patternpattern,final ConsumerRebalanceListenerlistener)
end note
:ensureNotClosed();
:committed.clear();
:this.subscriptions.subscribe(pattern,listener);
if (pattern.matcher(topic).matches()&&!subscriptions.subscription()
.contains(topic)) then (yes) 
:topicsToSubscribe.add(topic);
endif 
:ensureNotClosed();
:this.subscriptions.subscribeFromPattern(topicsToSubscribe);
:assignedPartitions.add(new TopicPartition(topic,
info.partition()));
:subscriptions.assignFromSubscribed(assignedPartitions);
end
start
note right
void subscribe(Patternpattern)
end note
:subscribe(pattern,new NoOpConsumerRebalanceListener());
end
start
note right
void subscribe(Collection<String>topics,final ConsumerRebalanceListenerlistener)
end note
:ensureNotClosed();
:committed.clear();
:this.subscriptions.subscribe(new HashSet<>(topics),
listener);
end
start
note right
void assign(Collection<TopicPartition>partitions)
end note
:ensureNotClosed();
:committed.clear();
:this.subscriptions.assignFromUser(new HashSet<>(partitions));
end
start
note right
void unsubscribe()
end note
:ensureNotClosed();
:committed.clear();
:subscriptions.unsubscribe();
end
start
note right
ConsumerRecords<K,V>poll(longtimeout)
end note
:return poll(Duration.ofMillis(timeout));;
stop
end
start
note right
ConsumerRecords<K,V>poll(final Durationtimeout)
end note
:ensureNotClosed();
:lastPollTimeout=timeout;
if (task!=null ) then (yes) 
:task.run();
endif 
if (wakeup.get()) then (yes) 
:wakeup.set(false);
:throw new WakeupException();;
endif 
if (pollException!=null ) then (yes) 
:this.pollException=null ;
:throw exception;;
endif 
if (!subscriptions.hasValidPosition(tp)) then (yes) 
:updateFetchPosition(tp);
endif 
if (!subscriptions.isPaused(entry.getKey())) then (yes) 
if (beginningOffsets.get(entry.getKey())!=null &&beginningOffsets.get(entry.getKey())>position) then (yes) 
:throw new OffsetOutOfRangeException(Collections.singletonMap(entry.getKey(),
position));;
endif 
if (assignment().contains(entry.getKey())&&rec.offset()>=position) then (yes) 
:results.computeIfAbsent(entry.getKey(),partition->new ArrayList<>())
.add(rec);
:subscriptions.position(entry.getKey(),newPosition);
endif 
:toClear.add(entry.getKey());
endif 
:toClear.forEach(p->this.records.remove(p));
:return new ConsumerRecords<>(results);;
stop
end
start
note right
void addRecord(ConsumerRecord<K,V>record)
end note
:ensureNotClosed();
if (!currentAssigned.contains(tp)) then (yes) 
:throw new IllegalStateException("Cannot add records for a partition that is not assigned to the consumer");;
endif 
:recs.add(record);
end
start
note right
void setException(KafkaExceptionexception)
end note
:setPollException(exception);
end
start
note right
void setPollException(KafkaExceptionexception)
end note
:this.pollException=exception;
end
start
note right
void setOffsetsException(KafkaExceptionexception)
end note
:this.offsetsException=exception;
end
start
note right
void commitAsync(Map<TopicPartition,OffsetAndMetadata>offsets,
OffsetCommitCallbackcallback)
end note
:ensureNotClosed();
:committed.put(entry.getKey(),entry.getValue());
if (callback!=null ) then (yes) 
:callback.onComplete(offsets,null );
endif 
end
start
note right
void commitSync(Map<TopicPartition,OffsetAndMetadata>offsets)
end note
:commitAsync(offsets,null );
end
start
note right
void commitAsync()
end note
:commitAsync(null );
end
start
note right
void commitAsync(OffsetCommitCallbackcallback)
end note
:ensureNotClosed();
:commitAsync(this.subscriptions.allConsumed(),
callback);
end
start
note right
void commitSync()
end note
:commitSync(this.subscriptions.allConsumed());
end
start
note right
void commitSync(Durationtimeout)
end note
:commitSync(this.subscriptions.allConsumed());
end
start
note right
void commitSync(Map<TopicPartition,OffsetAndMetadata>offsets,
final Durationtimeout)
end note
:commitSync(offsets);
end
start
note right
void seek(TopicPartitionpartition,longoffset)
end note
:ensureNotClosed();
:subscriptions.seek(partition,offset);
end
start
note right
void seek(TopicPartitionpartition,OffsetAndMetadataoffsetAndMetadata)
end note
:ensureNotClosed();
:subscriptions.seek(partition,offsetAndMetadata.offset());
end
start
note right
OffsetAndMetadatacommitted(final TopicPartitionpartition)
end note
:return committed(singleton(partition)).get(partition);;
stop
end
start
note right
OffsetAndMetadatacommitted(final TopicPartitionpartition,
final Durationtimeout)
end note
:return committed(partition);;
stop
end
start
note right
Map<TopicPartition,OffsetAndMetadata>committed(final Set<TopicPartition>partitions)
end note
:ensureNotClosed();
:return partitions.stream().filter(committed::containsKey).collect(Collectors.toMap(tp->tp,
tp->subscriptions.isAssigned(tp)? committed.get(tp):new OffsetAndMetadata(0)));;
stop
end
start
note right
Map<TopicPartition,OffsetAndMetadata>committed(final Set<TopicPartition>partitions,
final Durationtimeout)
end note
:return committed(partitions);;
stop
end
start
note right
longposition(TopicPartitionpartition)
end note
:ensureNotClosed();
if (!this.subscriptions.isAssigned(partition)) then (yes) 
:throw new IllegalArgumentException("You can only check the position for partitions assigned to this consumer.");;
endif 
if (position==null ) then (yes) 
:updateFetchPosition(partition);
:position=this.subscriptions.position(partition);
endif 
:return position.offset;;
stop
end
start
note right
longposition(TopicPartitionpartition,final Durationtimeout)
end note
:return position(partition);;
stop
end
start
note right
void seekToBeginning(Collection<TopicPartition>partitions)
end note
:ensureNotClosed();
:subscriptions.requestOffsetReset(partitions,
OffsetResetStrategy.EARLIEST);
end
start
note right
void updateBeginningOffsets(Map<TopicPartition,
Long>newOffsets)
end note
:beginningOffsets.putAll(newOffsets);
end
start
note right
void seekToEnd(Collection<TopicPartition>partitions)
end note
:ensureNotClosed();
:subscriptions.requestOffsetReset(partitions,
OffsetResetStrategy.LATEST);
end
start
note right
void updateEndOffsets(final Map<TopicPartition,
Long>newOffsets)
end note
:endOffsets.putAll(newOffsets);
end
start
note right
Map<MetricName,?  extends Metric>metrics()
end note
:ensureNotClosed();
:return Collections.emptyMap();;
stop
end
start
note right
List<PartitionInfo>partitionsFor(Stringtopic)
end note
:ensureNotClosed();
:return this.partitions.getOrDefault(topic,
Collections.emptyList());;
stop
end
start
note right
Map<String,List<PartitionInfo>>listTopics()
end note
:ensureNotClosed();
:return partitions;;
stop
end
start
note right
void updatePartitions(Stringtopic,List<PartitionInfo>partitions)
end note
:ensureNotClosed();
:this.partitions.put(topic,partitions);
end
start
note right
void pause(Collection<TopicPartition>partitions)
end note
:subscriptions.pause(partition);
:paused.add(partition);
end
start
note right
void resume(Collection<TopicPartition>partitions)
end note
:subscriptions.resume(partition);
:paused.remove(partition);
end
