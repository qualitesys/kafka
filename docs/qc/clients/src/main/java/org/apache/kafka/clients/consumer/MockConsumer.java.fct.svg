start
note right
OptionalLongcurrentLag(TopicPartitiontopicPartition)
end note
if (endOffsets.containsKey(topicPartition)) then (yes) 
:return OptionalLong.of(endOffsets.get(topicPartition)-position(topicPartition));;
stop
else (no)
:return OptionalLong.of(0L);;
stop
endif 
