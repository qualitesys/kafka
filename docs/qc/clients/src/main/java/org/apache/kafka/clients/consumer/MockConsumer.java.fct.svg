note right
Map<TopicPartition,OffsetAndTimestamp>offsetsForTimes(Map<TopicPartition,
Long>timestampsToSearch)
end note
:throw new UnsupportedOperationException("Not implemented yet.");;
end
start
note right
Map<TopicPartition,Long>beginningOffsets(Collection<TopicPartition>partitions)
end note
if (offsetsException!=null ) then (yes) 
:this.offsetsException=null ;
:throw exception;;
endif 
if (beginningOffset==null ) then (yes) 
:throw new IllegalStateException("The partition "+
tp+" does not have a beginning offset.");;
endif 
:result.put(tp,beginningOffset);
:return result;;
stop
end
start
note right
Map<TopicPartition,Long>endOffsets(Collection<TopicPartition>partitions)
end note
if (offsetsException!=null ) then (yes) 
:this.offsetsException=null ;
:throw exception;;
endif 
if (endOffset==null ) then (yes) 
:throw new IllegalStateException("The partition "+
tp+" does not have an end offset.");;
endif 
:result.put(tp,endOffset);
:return result;;
stop
