@startuml
!pragma layout smetana
start
note right
constructor PlainSaslServerProvider()
end note
:super ("Simple SASL/PLAIN Server Provider",
1.0,"Simple SASL/PLAIN Server Provider for Kafka");;
:put("SaslServerFactory."+PlainSaslServer.PLAIN_MECHANISM,
PlainSaslServerFactory.class .getName());;
end
start
note right
void initialize()
end note
:Security.addProvider(new PlainSaslServerProvider());;
end
@enduml

