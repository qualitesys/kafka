@startuml
!pragma layout smetana
start
note right
constructor LogTruncationException(Stringmessage,Map<TopicPartition,Long>fetchOffsets,Map<TopicPartition,OffsetAndMetadata>divergentOffsets)
end note
:super (message,fetchOffsets);
:this.divergentOffsets=Collections.unmodifiableMap(divergentOffsets);
end
start
note right
Map<TopicPartition,OffsetAndMetadata>divergentOffsets()
end note
:return divergentOffsets;;
stop
end
@enduml

