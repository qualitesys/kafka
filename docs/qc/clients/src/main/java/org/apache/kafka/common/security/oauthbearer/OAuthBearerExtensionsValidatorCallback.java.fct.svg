04fc76e5ef3eb05]
@startuml
!pragma layout smetana
start
note right
constructor OAuthBearerExtensionsValidatorCallback(OAuthBearerTokentoken,
SaslExtensionsextensions)
end note
:this.token=Objects.requireNonNull(token);
:this.inputExtensions=Objects.requireNonNull(extensions);
end
start
note right
OAuthBearerTokentoken()
end note
:return token;;
stop
end
start
note right
SaslExtensionsinputExtensions()
end note
:return inputExtensions;;
stop
end
start
note right
Map<String,String>validatedExtensions()
end note
:return Collections.unmodifiableMap(validatedExtensions);;
stop
end
start
note right
Map<String,String>invalidExtensions()
end note
:return Collections.unmodifiableMap(invalidExtensions);;
stop
end
start
note right
Map<String,String>ignoredExtensions()
end note
:return Collections.unmodifiableMap(subtractMap(subtractMap(inputExtensions.map(),
invalidExtensions),validatedExtensions));;
stop
end
start
note right
void valid(StringextensionName)
end note
if (!inputExtensions.map().containsKey(extensionName)) then (yes) 
:throw new IllegalArgumentException(String.format("Extension %s was not found in the original extensions",
extensionName));;
endif 
:validatedExtensions.put(extensionName,inputExtensions.map()
.get(extensionName));
end
start
note right
void error(StringinvalidExtensionName,StringerrorMessage)
end note
if (Objects.requireNonNull(invalidExtensionName)
.isEmpty()) then (yes) 
:throw new IllegalArgumentException("extension name must not be empty");;
endif 
:this.invalidExtensions.put(invalidExtensionName,
errorMessage);
end
@enduml

