@startuml
!pragma layout smetana
start
note right
constructor ByteBufferSend(ByteBuffer... buffers)
end note
end
start
note right
constructor ByteBufferSend(ByteBuffer[]buffers,
longsize)
end note
end
start
note right
booleancompleted()
end note
:return remaining<=0&&!pending;;
stop
end
start
note right
longsize()
end note
:return this.size;;
stop
end
start
note right
longwriteTo(TransferableChannelchannel)
end note
if (written<0) then (yes) 
:throw new EOFException("Wrote negative bytes to channel. This shouldn't happen.");;
endif 
:return written;;
stop
end
start
note right
longremaining()
end note
:return remaining;;
stop
end
start
note right
StringtoString()
end note
:return "ByteBufferSend("+", size="+size+
", remaining="+remaining+", pending="+pending+
')';;
stop
end
start
note right
ByteBufferSendsizePrefixed(ByteBufferbuffer)
end note
:return new ByteBufferSend(sizeBuffer,buffer);;
stop
end
@enduml

