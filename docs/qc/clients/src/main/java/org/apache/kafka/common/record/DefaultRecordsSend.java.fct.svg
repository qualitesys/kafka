@startuml
!pragma layout smetana
start
note right
constructor DefaultRecordsSend(T records)
end note
:this(records,records.sizeInBytes());;
end
start
note right
constructor DefaultRecordsSend(T records,
int maxBytesToWrite)
end note
:super (records,maxBytesToWrite);;
end
start
note right
long writeTo(TransferableChannel channel,
long previouslyWritten,int remaining)
end note
:return records().writeTo(channel,previouslyWritten,
remaining);;
stop
end
@enduml

