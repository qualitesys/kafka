@startuml
!pragma layout smetana
start
note right
constructor PlainAuthenticateCallback(char[]password)
end note
:this.password=password;
end
start
note right
char[]password()
end note
:return password;;
stop
end
start
note right
booleanauthenticated()
end note
:return this.authenticated;;
stop
end
start
note right
void authenticated(booleanauthenticated)
end note
:this.authenticated=authenticated;
end
@enduml

