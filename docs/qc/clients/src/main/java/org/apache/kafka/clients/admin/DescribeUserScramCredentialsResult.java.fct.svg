@startuml
!pragma layout smetana
start
note right
constructor DescribeUserScramCredentialsResult(KafkaFuture<DescribeUserScramCredentialsResponseData>dataFuture)
end note
:this.dataFuture=Objects.requireNonNull(dataFuture);
end
start
note right
KafkaFuture<Map<String,UserScramCredentialsDescription>>all()
end note
:dataFuture.whenComplete((data,throwable)->{if (throwable!=null ){retval.completeExceptionally(throwable);}else {/*Check to make sure every individual described user succeeded . Note that a successfully described user 
* is one that appears with * either * a NONE error code or a RESOURCE_NOT_FOUND error code . The 
* RESOURCE_NOT_FOUND means the client explicitly requested a describe of that particular user but it could 
* not be described because it does not exist ; such a user will not appear as a key in the returned map . 
*/Optional<DescribeUserScramCredentialsResponseData.DescribeUserScramCredentialsResult>optionalFirstFailedDescribe=data.results().stream().filter(result->result.errorCode()!=Errors.NONE.code()&&result.errorCode()!=Errors.RESOURCE_NOT_FOUND.code()).findFirst();if (optionalFirstFailedDescribe.isPresent()){retval.completeExceptionally(Errors.forCode(optionalFirstFailedDescribe.get().errorCode()).exception(optionalFirstFailedDescribe.get().errorMessage()));}else {Map<String,UserScramCredentialsDescription>retvalMap=new HashMap<>();data.results().stream().forEach(userResult->retvalMap.put(userResult.user(),new UserScramCredentialsDescription(userResult.user(),getScramCredentialInfosFor(userResult))));retval.complete(retvalMap);}}});
:return retval;;
stop
end
start
note right
KafkaFuture<List<String>>users()
end note
:dataFuture.whenComplete((data,throwable)->{if (throwable!=null ){retval.completeExceptionally(throwable);}else {retval.complete(data.results().stream().filter(result->result.errorCode()!=Errors.RESOURCE_NOT_FOUND.code()).map(result->result.user()).collect(Collectors.toList()));}});
:return retval;;
stop
end
start
note right
KafkaFuture<UserScramCredentialsDescription>description(StringuserName)
end note
:dataFuture.whenComplete((data,throwable)->{if (throwable!=null ){retval.completeExceptionally(throwable);}else {Optional<DescribeUserScramCredentialsResponseData.DescribeUserScramCredentialsResult>optionalUserResult=data.results().stream().filter(result->result.user().equals(userName)).findFirst();if (!optionalUserResult.isPresent()){retval.completeExceptionally(new ResourceNotFoundException("No such user: "+userName));}else {DescribeUserScramCredentialsResponseData.DescribeUserScramCredentialsResultuserResult=optionalUserResult.get();if (userResult.errorCode()!=Errors.NONE.code()){retval.completeExceptionally(Errors.forCode(userResult.errorCode()).exception(userResult.errorMessage()));}else {retval.complete(new UserScramCredentialsDescription(userResult.user(),getScramCredentialInfosFor(userResult)));}}}});
:return retval;;
stop
end
start
note right
List<ScramCredentialInfo>getScramCredentialInfosFor(DescribeUserScramCredentialsResponseData.DescribeUserScramCredentialsResultuserResult)
end note
:return userResult.credentialInfos().stream()
.map(c->new ScramCredentialInfo(ScramMechanism.fromType(c.mechanism()),
c.iterations())).collect(Collectors.toList());;
stop
end
