@startuml
!pragma layout smetana
start
note right
constructor CipherInformation(String cipher,
String protocol)
end note
:this.cipher=cipher==null ||cipher.isEmpty()? String.valueOf("unknown"):cipher;;
:this.protocol=protocol==null ||protocol.isEmpty()? String.valueOf("unknown"):protocol;;
end
start
note right
String cipher()
end note
:return cipher;;
stop
end
start
note right
String protocol()
end note
:return protocol;;
stop
end
start
note right
String toString()
end note
:return "CipherInformation(cipher="+cipher+
", protocol="+protocol+")";;
stop
end
start
note right
int hashCode()
end note
:return Objects.hash(cipher,protocol);;
stop
end
start
note right
boolean equals(Object o)
end note
if (o==null ) then (yes) 
:return false;;
stop
endif 
if (!(o instanceof CipherInformation )) then (yes) 
:return false;;
stop
endif 
:CipherInformation other=(CipherInformation )o;;
:return other.cipher.equals(cipher)&&other.protocol.equals(protocol);;
stop
end
@enduml

