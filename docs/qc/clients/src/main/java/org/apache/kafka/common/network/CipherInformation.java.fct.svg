@startuml
!pragma layout smetana
start
note right
constructor CipherInformation(Stringcipher,
Stringprotocol)
end note
end
start
note right
Stringcipher()
end note
:return cipher;;
stop
end
start
note right
Stringprotocol()
end note
:return protocol;;
stop
end
start
note right
StringtoString()
end note
:return "CipherInformation(cipher="+cipher+
", protocol="+protocol+")";;
stop
end
start
note right
inthashCode()
end note
:return Objects.hash(cipher,protocol);;
stop
end
start
note right
booleanequals(Objecto)
end note
if (o==null ) then (yes) 
:return false;;
stop
endif 
if (!(o instanceof CipherInformation)) then (yes) 
:return false;;
stop
endif 
:return other.cipher.equals(cipher)&&other.protocol.equals(protocol);;
stop
end
@enduml

