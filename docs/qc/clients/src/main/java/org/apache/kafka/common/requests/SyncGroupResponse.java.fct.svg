@startuml
!pragma layout smetana
start
note right
constructor SyncGroupResponse(SyncGroupResponseDatadata)
end note
:super (ApiKeys.SYNC_GROUP);
:this.data=data;
end
start
note right
intthrottleTimeMs()
end note
:return data.throttleTimeMs();;
stop
end
start
note right
Errorserror()
end note
:return Errors.forCode(data.errorCode());;
stop
end
start
note right
Map<Errors,Integer>errorCounts()
end note
:return errorCounts(Errors.forCode(data.errorCode()));;
stop
end
start
note right
SyncGroupResponseDatadata()
end note
:return data;;
stop
end
start
note right
StringtoString()
end note
:return data.toString();;
stop
end
start
note right
SyncGroupResponseparse(ByteBufferbuffer,shortversion)
end note
:return new SyncGroupResponse(new SyncGroupResponseData(new ByteBufferAccessor(buffer),version));;
stop
end
start
note right
booleanshouldClientThrottle(shortversion)
end note
:return version>=2;;
stop
end
@enduml

