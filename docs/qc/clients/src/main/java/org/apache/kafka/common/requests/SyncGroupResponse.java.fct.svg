@startuml
!pragma layout smetana
start
note right
constructor SyncGroupResponse(SyncGroupResponseData data)
end note
:super (ApiKeys.SYNC_GROUP);;
:this.data=data;;
end
start
note right
int throttleTimeMs()
end note
:return data.throttleTimeMs();;
stop
end
start
note right
Errors error()
end note
:return Errors.forCode(data.errorCode());;
stop
end
start
note right
Map<Errors,Integer> errorCounts()
end note
:return errorCounts(Errors.forCode(data.errorCode()));;
stop
end
start
note right
SyncGroupResponseData data()
end note
:return data;;
stop
end
start
note right
String toString()
end note
:return data.toString();;
stop
end
start
note right
SyncGroupResponse parse(ByteBuffer buffer,
short version)
end note
:return new SyncGroupResponse(new SyncGroupResponseData(new ByteBufferAccessor(buffer),
version));;
stop
end
start
note right
boolean shouldClientThrottle(short version)
end note
:return version>=2;;
stop
end
@enduml

