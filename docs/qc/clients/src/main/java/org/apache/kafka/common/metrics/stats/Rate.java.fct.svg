@startuml
!pragma layout smetana
start
note right
constructor Rate()
end note
:this(TimeUnit.SECONDS);
end
start
note right
constructor Rate(TimeUnitunit)
end note
:this(unit,new WindowedSum());
end
start
note right
constructor Rate(SampledStatstat)
end note
:this(TimeUnit.SECONDS,stat);
end
start
note right
constructor Rate(TimeUnitunit,SampledStatstat)
end note
:this.stat=stat;
:this.unit=unit;
end
start
note right
StringunitName()
end note
:return unit.name().substring(0,unit.name().length()-2).toLowerCase(Locale.ROOT);;
stop
end
start
note right
void record(MetricConfigconfig,doublevalue,
longtimeMs)
end note
:this.stat.record(config,value,timeMs);
end
start
note right
doublemeasure(MetricConfigconfig,longnow)
end note
:return value/convert(windowSize(config,now),
unit);;
stop
end
start
note right
longwindowSize(MetricConfigconfig,longnow)
end note
:stat.purgeObsoleteSamples(config,now);
if (numFullWindows<minFullWindows) then (yes) 
:totalElapsedTimeMs+=(minFullWindows-numFullWindows)*config.timeWindowMs();
endif 
:return totalElapsedTimeMs;;
stop
end
start
note right
StringtoString()
end note
:return "Rate("+"unit="+unit+", stat="+stat+
')';;
stop
end
@enduml

