@startuml
!pragma layout smetana
start
note right
constructor Rate()
end note
:this(TimeUnit.SECONDS);;
end
start
note right
constructor Rate(TimeUnit unit)
end note
:this(unit,new WindowedSum());;
end
start
note right
constructor Rate(SampledStat stat)
end note
:this(TimeUnit.SECONDS,stat);;
end
start
note right
constructor Rate(TimeUnit unit,SampledStat stat)
end note
:this.stat=stat;;
:this.unit=unit;;
end
start
note right
String unitName()
end note
:return unit.name().substring(0,unit.name()
.length()-2).toLowerCase(Locale.ROOT);;
stop
end
start
note right
void record(MetricConfig config,double value,
long timeMs)
end note
:this.stat.record(config,value,timeMs);;
end
start
note right
double measure(MetricConfig config,long now)
end note
:double value=stat.measure(config,now);;
:return value/convert(windowSize(config,now),
unit);;
stop
end
start
note right
long windowSize(MetricConfig config,long now)
end note
:stat.purgeObsoleteSamples(config,now);;
:long totalElapsedTimeMs=now-stat.oldest(now)
.lastWindowMs;;
:int numFullWindows=(int )(totalElapsedTimeMs/config.timeWindowMs());;
:int minFullWindows=config.samples()-1;;
if (numFullWindows<minFullWindows) then (yes) 
:totalElapsedTimeMs+=(minFullWindows-numFullWindows)*config.timeWindowMs();;
endif 
:return totalElapsedTimeMs;;
stop
end
start
note right
String toString()
end note
:return "Rate("+"unit="+unit+", stat="+stat+
')';;
stop
end
@enduml

