@startuml
!pragma layout smetana
start
note right
constructor Resource(ResourceTyperesourceType,
Stringname)
end note
end
start
note right
ResourceTyperesourceType()
end note
:return resourceType;;
stop
end
start
note right
Stringname()
end note
:return name;;
stop
end
start
note right
StringtoString()
end note
:return "(resourceType="+resourceType+", name="+
((name==null )? String.valueOf("<any>"):name)+
")";;
stop
end
start
note right
booleanisUnknown()
end note
:return resourceType.isUnknown();;
stop
end
start
note right
booleanequals(Objecto)
end note
if (!(o instanceof Resource)) then (yes) 
:return false;;
stop
endif 
:return resourceType.equals(other.resourceType)&&Objects.equals(name,
other.name);;
stop
end
start
note right
inthashCode()
end note
:return Objects.hash(resourceType,name);;
stop
end
@enduml

