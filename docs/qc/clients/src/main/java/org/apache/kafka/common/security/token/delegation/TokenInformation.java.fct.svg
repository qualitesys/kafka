@startuml
!pragma layout smetana
start
note right
constructor TokenInformation(StringtokenId,KafkaPrincipalowner,Collection<KafkaPrincipal>renewers,longissueTimestamp,longmaxTimestamp,longexpiryTimestamp)
end note
:this(tokenId,owner,owner,renewers,issueTimestamp,
maxTimestamp,expiryTimestamp);
end
start
note right
constructor TokenInformation(StringtokenId,KafkaPrincipalowner,KafkaPrincipaltokenRequester,Collection<KafkaPrincipal>renewers,longissueTimestamp,longmaxTimestamp,longexpiryTimestamp)
end note
:this.tokenId=tokenId;
:this.owner=owner;
:this.tokenRequester=tokenRequester;
:this.renewers=renewers;
:this.issueTimestamp=issueTimestamp;
:this.maxTimestamp=maxTimestamp;
:this.expiryTimestamp=expiryTimestamp;
end
start
note right
KafkaPrincipalowner()
end note
:return owner;;
stop
end
start
note right
KafkaPrincipaltokenRequester()
end note
:return tokenRequester;;
stop
end
start
note right
StringownerAsString()
end note
:return owner.toString();;
stop
end
start
note right
Collection<KafkaPrincipal>renewers()
end note
:return renewers;;
stop
end
start
note right
Collection<String>renewersAsString()
end note
:renewerList.add(renewer.toString());
:return renewerList;;
stop
end
start
note right
longissueTimestamp()
end note
:return issueTimestamp;;
stop
end
start
note right
longexpiryTimestamp()
end note
:return expiryTimestamp;;
stop
end
start
note right
void setExpiryTimestamp(longexpiryTimestamp)
end note
:this.expiryTimestamp=expiryTimestamp;
end
start
note right
StringtokenId()
end note
:return tokenId;;
stop
end
start
note right
longmaxTimestamp()
end note
:return maxTimestamp;;
stop
end
start
note right
booleanownerOrRenewer(KafkaPrincipalprincipal)
end note
:return owner.equals(principal)||tokenRequester.equals(principal)||renewers.contains(principal);;
stop
end
start
note right
StringtoString()
end note
:return "TokenInformation{"+"owner="+owner+
", tokenRequester="+tokenRequester+", renewers="+
renewers+", issueTimestamp="+issueTimestamp+
", maxTimestamp="+maxTimestamp+", expiryTimestamp="+
expiryTimestamp+", tokenId='"+tokenId+'\''+
'}';;
stop
end
start
note right
booleanequals(Objecto)
end note
if (this==o) then (yes) 
:return true;;
stop
endif 
if (o==null ||getClass()!=o.getClass()) then (yes) 
:return false;;
stop
endif 
:return issueTimestamp==that.issueTimestamp&&maxTimestamp==that.maxTimestamp&&Objects.equals(owner,that.owner)&&Objects.equals(tokenRequester,that.tokenRequester)&&Objects.equals(renewers,that.renewers)&&Objects.equals(tokenId,that.tokenId);;
stop
end
start
note right
inthashCode()
end note
:return Objects.hash(owner,tokenRequester,
renewers,issueTimestamp,maxTimestamp,expiryTimestamp,
tokenId);;
stop
end
@enduml

