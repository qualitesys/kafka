@startuml
!pragma layout smetana
start
note right
constructor StickyPartitionCache()
end note
end
start
note right
intpartition(Stringtopic,Clustercluster)
end note
if (part==null ) then (yes) 
:return nextPartition(topic,cluster,-1);;
stop
endif 
:return part;;
stop
end
start
note right
intnextPartition(Stringtopic,Clustercluster,
intprevPartition)
end note
if (oldPart==null ||oldPart==prevPartition) then (yes) 
if (availablePartitions.size()<1) then (yes) 
else (no)
while (newPart==null ||newPart.equals(oldPart))
endwhile
endif 
if (oldPart==null ) then (yes) 
else (no)
endif 
:return indexCache.get(topic);;
stop
endif 
:return indexCache.get(topic);;
stop
end
@enduml

