@startuml
!pragma layout smetana
start
note right
constructor StickyPartitionCache()
end note
:this.indexCache=new ConcurrentHashMap<>();
end
start
note right
intpartition(Stringtopic,Clustercluster)
end note
if (part==null ) then (yes) 
:return nextPartition(topic,cluster,-1);;
stop
endif 
:return part;;
stop
end
start
note right
intnextPartition(Stringtopic,Clustercluster,
intprevPartition)
end note
if (oldPart==null ||oldPart==prevPartition) then (yes) 
if (availablePartitions.size()<1) then (yes) 
:newPart=random%partitions.size();
else (no)
while (newPart==null ||newPart.equals(oldPart))
:newPart=availablePartitions.get(random%availablePartitions.size()).partition();
endwhile
endif 
if (oldPart==null ) then (yes) 
:indexCache.putIfAbsent(topic,newPart);
else (no)
:indexCache.replace(topic,prevPartition,newPart);
endif 
:return indexCache.get(topic);;
stop
endif 
:return indexCache.get(topic);;
stop
end
@enduml

