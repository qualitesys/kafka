" x1="190" x2="190" y1="492.8438" y2="512.8438"/><polygon fill="#181818" points="186,502.8438,190,512.8438,194,502.8438,190,506.8438" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="190" x2="190" y1="597.4102" y2="619.9766"/><polygon fill="#181818" points="186,609.9766,190,619.9766,194,609.9766,190,613.9766" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="190" x2="190" y1="653.9453" y2="673.9453"/><polygon fill="#181818" points="186,663.9453,190,673.9453,194,663.9453,190,667.9453" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[c5c3517e23d07a0faa8ba6d7d3d0d28c]
@startuml
!pragma layout smetana
start
note right
SslClientAuth forConfig(String key)
end note
if (key==null ) then (yes) 
:return SslClientAuth.NONE;;
stop
endif 
:String upperCaseKey=key.toUpperCase(Locale.ROOT);;
if (auth.name().equals(upperCaseKey)) then (yes) 
:return auth;;
stop
endif 
:return null ;;
stop
end
start
note right
String toString()
end note
:return super .toString().toLowerCase(Locale.ROOT);;
stop
end
@enduml

