@startuml
!pragma layout smetana
start
note right
SslClientAuthforConfig(Stringkey)
end note
if (key==null ) then (yes) 
:return SslClientAuth.NONE;;
stop
endif 
if (auth.name().equals(upperCaseKey)) then (yes) 
:return auth;;
stop
endif 
:return null ;;
stop
end
start
note right
StringtoString()
end note
:return super .toString().toLowerCase(Locale.ROOT);;
stop
end
@enduml

