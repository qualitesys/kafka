"188" x2="188" y1="492.8438" y2="512.8438"/><polygon fill="#181818" points="184,502.8438,188,512.8438,192,502.8438,188,506.8438" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="188" x2="188" y1="597.4102" y2="619.9766"/><polygon fill="#181818" points="184,609.9766,188,619.9766,192,609.9766,188,613.9766" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="188" x2="188" y1="653.9453" y2="673.9453"/><polygon fill="#181818" points="184,663.9453,188,673.9453,192,663.9453,188,667.9453" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[0d744371c6db85f9d576bcd6819be475]
@startuml
!pragma layout smetana
start
note right
SslClientAuthforConfig(Stringkey)
end note
if (key==null ) then (yes) 
:return SslClientAuth.NONE;;
stop
endif 
:StringupperCaseKey=key.toUpperCase(Locale.ROOT);;
if (auth.name().equals(upperCaseKey)) then (yes) 
:return auth;;
stop
endif 
:return null ;;
stop
end
start
note right
StringtoString()
end note
:return super .toString().toLowerCase(Locale.ROOT);;
stop
end
@enduml

