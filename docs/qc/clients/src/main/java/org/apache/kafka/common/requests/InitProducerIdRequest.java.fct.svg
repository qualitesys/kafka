@startuml
!pragma layout smetana
start
note right
constructor Builder(InitProducerIdRequestDatadata)
end note
:super (ApiKeys.INIT_PRODUCER_ID);
:this.data=data;
end
start
note right
InitProducerIdRequestbuild(shortversion)
end note
if (data.transactionTimeoutMs()<=0) then (yes) 
:throw new IllegalArgumentException("transaction timeout value is not positive: "+
data.transactionTimeoutMs());;
endif 
if (data.transactionalId()!=null &&data.transactionalId()
.isEmpty()) then (yes) 
:throw new IllegalArgumentException("Must set either a null or a non-empty transactional id.");;
endif 
:return new InitProducerIdRequest(data,version);;
stop
end
start
note right
StringtoString()
end note
:return data.toString();;
stop
end
start
note right
constructor InitProducerIdRequest(InitProducerIdRequestDatadata,
shortversion)
end note
:super (ApiKeys.INIT_PRODUCER_ID,version);
:this.data=data;
end
start
note right
AbstractResponsegetErrorResponse(intthrottleTimeMs,
Throwablee)
end note
:return new InitProducerIdResponse(response);;
stop
end
start
note right
InitProducerIdRequestparse(ByteBufferbuffer,
shortversion)
end note
:return new InitProducerIdRequest(new InitProducerIdRequestData(new ByteBufferAccessor(buffer),
version),version);;
stop
end
start
note right
InitProducerIdRequestDatadata()
end note
:return data;;
stop
end
@enduml

