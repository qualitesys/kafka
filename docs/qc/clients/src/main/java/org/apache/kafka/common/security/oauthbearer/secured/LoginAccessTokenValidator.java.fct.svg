@startuml
!pragma layout smetana
start
note right
constructor LoginAccessTokenValidator(StringscopeClaimName,
StringsubClaimName)
end note
end
start
note right
OAuthBearerTokenvalidate(StringaccessToken)
end note
:throw new ValidateException(String.format("Could not validate the access token: %s",
e.getMessage()),e);;
if (scopeRaw instanceof String) then (yes) 
else (no)
endif 
:return token;;
stop
end
start
note right
ObjectgetClaim(Map<String,Object>payload,
StringclaimName)
end note
:return value;;
stop
end
@enduml

