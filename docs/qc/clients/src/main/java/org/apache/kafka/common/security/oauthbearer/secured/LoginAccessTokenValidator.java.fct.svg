@startuml
!pragma layout smetana
start
note right
constructor LoginAccessTokenValidator(StringscopeClaimName,
StringsubClaimName)
end note
:this.scopeClaimName=ClaimValidationUtils.validateClaimNameOverride(DEFAULT_SASL_OAUTHBEARER_SCOPE_CLAIM_NAME,
scopeClaimName);;
:this.subClaimName=ClaimValidationUtils.validateClaimNameOverride(DEFAULT_SASL_OAUTHBEARER_SUB_CLAIM_NAME,
subClaimName);;
end
start
note right
OAuthBearerTokenvalidate(StringaccessToken)
end note
:try {payload=OAuthBearerUnsecuredJws.toMap(serializedJwt.getPayload());}catch (OAuthBearerIllegalTokenExceptione){throw new ValidateException(String.format("Could not validate the access token: %s",
e.getMessage()),e);};
if (scopeRaw instanceof String) then (yes) 
:scopeRawCollection=Collections.singletonList((String)scopeRaw);;
else (no)
:scopeRawCollection=Collections.emptySet();;
endif 
:return token;;
stop
end
start
note right
ObjectgetClaim(Map<String,Object>payload,
StringclaimName)
end note
:log.debug("getClaim - {}: {}",claimName,
value);;
:return value;;
stop
end
@enduml

