;"/><line style="stroke:#181818;stroke-width:1.0;" x1="459" x2="459" y1="605.2109" y2="625.2109"/><polygon fill="#181818" points="455,615.2109,459,625.2109,463,615.2109,459,619.2109" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="459" x2="459" y1="659.1797" y2="679.1797"/><polygon fill="#181818" points="455,669.1797,459,679.1797,463,669.1797,459,673.1797" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[b1309220a7a3f38d7f0621f8e10f24c2]
@startuml
!pragma layout smetana
start
note right
constructor LoginAccessTokenValidator(StringscopeClaimName,StringsubClaimName)
end note
:this.scopeClaimName=ClaimValidationUtils.validateClaimNameOverride(DEFAULT_SASL_OAUTHBEARER_SCOPE_CLAIM_NAME,scopeClaimName);
:this.subClaimName=ClaimValidationUtils.validateClaimNameOverride(DEFAULT_SASL_OAUTHBEARER_SUB_CLAIM_NAME,subClaimName);
end
start
note right
OAuthBearerTokenvalidate(StringaccessToken)
end note
:payload=OAuthBearerUnsecuredJws.toMap(serializedJwt.getPayload());
if (scopeRaw instanceof String) then (yes) 
:scopeRawCollection=Collections.singletonList((String)scopeRaw);
else (no)
:scopeRawCollection=Collections.emptySet();
endif 
:return token;;
stop
end
start
note right
ObjectgetClaim(Map<String,Object>payload,StringclaimName)
end note
:log.debug("getClaim - {}: {}",claimName,value);
:return value;;
stop
end
@enduml

