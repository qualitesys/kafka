@startuml
!pragma layout smetana
start
note right
constructor DefaultClientMetadata(StringrackId,
StringclientId,InetAddressclientAddress,KafkaPrincipalprincipal,
StringlistenerName)
end note
:this.rackId=rackId;;
:this.clientId=clientId;;
:this.clientAddress=clientAddress;;
:this.principal=principal;;
:this.listenerName=listenerName;;
end
start
note right
StringrackId()
end note
:return rackId;;
stop
end
start
note right
StringclientId()
end note
:return clientId;;
stop
end
start
note right
InetAddressclientAddress()
end note
:return clientAddress;;
stop
end
start
note right
KafkaPrincipalprincipal()
end note
:return principal;;
stop
end
start
note right
StringlistenerName()
end note
:return listenerName;;
stop
end
start
note right
booleanequals(Objecto)
end note
if (this==o) then (yes) 
:return true;;
stop
endif 
if (o==null ||getClass()!=o.getClass()) then (yes) 
:return false;;
stop
endif 
:DefaultClientMetadatathat=(DefaultClientMetadata)o;;
:return Objects.equals(rackId,that.rackId)&&Objects.equals(clientId,
that.clientId)&&Objects.equals(clientAddress,
that.clientAddress)&&Objects.equals(principal,
that.principal)&&Objects.equals(listenerName,
that.listenerName);;
stop
end
start
note right
inthashCode()
end note
:return Objects.hash(rackId,clientId,clientAddress,
principal,listenerName);;
stop
end
start
note right
StringtoString()
end note
:return "DefaultClientMetadata{"+"rackId='"+
rackId+'\''+", clientId='"+clientId+'\''+
", clientAddress="+clientAddress+", principal="+
principal+", listenerName='"+listenerName+
'\''+'}';;
stop
end
@enduml

