@startuml
!pragma layout smetana
start
note right
constructor OffsetsForLeaderEpochClient(ConsumerNetworkClientclient,
LogContextlogContext)
end note
:super (client,logContext);;
end
start
note right
AbstractRequest.Builder<OffsetsForLeaderEpochRequest>prepareRequest(Nodenode,
Map<TopicPartition,SubscriptionState.FetchPosition>requestData)
end note
:OffsetForLeaderTopicCollectiontopics=new OffsetForLeaderTopicCollection(requestData.size());;
:requestData.forEach((topicPartition,fetchPosition)->fetchPosition.offsetEpoch.ifPresent(fetchEpoch->{OffsetForLeaderTopictopic=topics.find(topicPartition.topic());
:if (topic==null ){topic=new OffsetForLeaderTopic().setTopic(topicPartition.topic());
:topics.add(topic);}topic.partitions().add(new OffsetForLeaderPartition()
.setPartition(topicPartition.partition()).setLeaderEpoch(fetchEpoch).setCurrentLeaderEpoch(fetchPosition.currentLeader.epoch.orElse(RecordBatch.NO_PARTITION_LEADER_EPOCH)));}));;
:return OffsetsForLeaderEpochRequest.Builder.forConsumer(topics);;
stop
end
start
note right
OffsetForEpochResulthandleResponse(Nodenode,
Map<TopicPartition,SubscriptionState.FetchPosition>requestData,
OffsetsForLeaderEpochResponseresponse)
end note
:Set<TopicPartition>partitionsToRetry=new HashSet<>(requestData.keySet());;
:Set<String>unauthorizedTopics=new HashSet<>();;
:Map<TopicPartition,EpochEndOffset>endOffsets=new HashMap<>();;
:TopicPartitiontopicPartition=new TopicPartition(topic.topic(),
partition.partition());;
if (!requestData.containsKey(topicPartition)) then (yes) 
:logger().warn("Received unrequested topic or partition {} from response,
 ignoring.",topicPartition);;
:continue ;;
endif 
:Errorserror=Errors.forCode(partition.errorCode());;
switch (switch (error))
endswith
if (!unauthorizedTopics.isEmpty()) then (yes) 
:throw new TopicAuthorizationException(unauthorizedTopics);;
stop
else (no)
:return new OffsetForEpochResult(endOffsets,
partitionsToRetry);;
stop
endif 
end
start
note right
constructor OffsetForEpochResult(Map<TopicPartition,
EpochEndOffset>endOffsets,Set<TopicPartition>partitionsNeedingRetry)
end note
:this.endOffsets=endOffsets;;
:this.partitionsToRetry=partitionsNeedingRetry;;
end
start
note right
Map<TopicPartition,EpochEndOffset>endOffsets()
end note
:return endOffsets;;
stop
end
start
note right
Set<TopicPartition>partitionsToRetry()
end note
:return partitionsToRetry;;
stop
end
@enduml

