@startuml
!pragma layout smetana
start
note right
constructor OffsetsForLeaderEpochClient(ConsumerNetworkClientclient,
LogContextlogContext)
end note
end
start
note right
AbstractRequest.Builder<OffsetsForLeaderEpochRequest>prepareRequest(Nodenode,
Map<TopicPartition,SubscriptionState.FetchPosition>requestData)
end note
:return OffsetsForLeaderEpochRequest.Builder.forConsumer(topics);;
stop
end
start
note right
OffsetForEpochResulthandleResponse(Nodenode,
Map<TopicPartition,SubscriptionState.FetchPosition>requestData,
OffsetsForLeaderEpochResponseresponse)
end note
if (!requestData.containsKey(topicPartition)) then (yes) 
endif 
if (!unauthorizedTopics.isEmpty()) then (yes) 
:throw new TopicAuthorizationException(unauthorizedTopics);;
else (no)
:return new OffsetForEpochResult(endOffsets,
partitionsToRetry);;
stop
endif 
end
start
note right
constructor OffsetForEpochResult(Map<TopicPartition,
EpochEndOffset>endOffsets,Set<TopicPartition>partitionsNeedingRetry)
end note
end
start
note right
Map<TopicPartition,EpochEndOffset>endOffsets()
end note
:return endOffsets;;
stop
end
start
note right
Set<TopicPartition>partitionsToRetry()
end note
:return partitionsToRetry;;
stop
end
@enduml

