@startuml
!pragma layout smetana
start
note right
constructor DescribeProducersResponse(DescribeProducersResponseDatadata)
end note
:super (ApiKeys.DESCRIBE_PRODUCERS);
:this.data=data;
end
start
note right
DescribeProducersResponseDatadata()
end note
:return data;;
stop
end
start
note right
Map<Errors,Integer>errorCounts()
end note
:updateErrorCounts(errorCounts,Errors.forCode(partitionResponse.errorCode()));
:return errorCounts;;
stop
end
start
note right
DescribeProducersResponseparse(ByteBufferbuffer,shortversion)
end note
:return new DescribeProducersResponse(new DescribeProducersResponseData(new ByteBufferAccessor(buffer),version));;
stop
end
start
note right
StringtoString()
end note
:return data.toString();;
stop
end
start
note right
intthrottleTimeMs()
end note
:return data.throttleTimeMs();;
stop
end
