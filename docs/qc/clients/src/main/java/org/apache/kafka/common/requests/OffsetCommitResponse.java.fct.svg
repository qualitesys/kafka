@startuml
!pragma layout smetana
start
note right
constructor OffsetCommitResponse(OffsetCommitResponseDatadata)
end note
end
start
note right
constructor OffsetCommitResponse(intrequestThrottleMs,
Map<TopicPartition,Errors>responseData)
end note
end
start
note right
constructor OffsetCommitResponse(Map<TopicPartition,
Errors>responseData)
end note
end
start
note right
OffsetCommitResponseDatadata()
end note
:return data;;
stop
end
start
note right
Map<Errors,Integer>errorCounts()
end note
:return errorCounts(data.topics().stream()
.flatMap(topicResult->topicResult.partitions().stream().map(partitionResult->Errors.forCode(partitionResult.errorCode()))));;
stop
end
start
note right
OffsetCommitResponseparse(ByteBufferbuffer,
shortversion)
end note
:return new OffsetCommitResponse(new OffsetCommitResponseData(new ByteBufferAccessor(buffer),
version));;
stop
end
start
note right
StringtoString()
end note
:return data.toString();;
stop
end
start
note right
intthrottleTimeMs()
end note
:return data.throttleTimeMs();;
stop
end
start
note right
booleanshouldClientThrottle(shortversion)
end note
:return version>=4;;
stop
end
@enduml

