@startuml
!pragma layout smetana
start
note right
constructor ScramExtensions()
end note
:this(Collections.emptyMap());;
end
start
note right
constructor ScramExtensions(Stringextensions)
end note
:this(Utils.parseMap(extensions,"=",","));;
end
start
note right
constructor ScramExtensions(Map<String,String>extensionMap)
end note
:super (extensionMap);;
end
start
note right
booleantokenAuthenticated()
end note
:return Boolean.parseBoolean(map().get(ScramLoginModule.TOKEN_AUTH_CONFIG));;
stop
end
@enduml

