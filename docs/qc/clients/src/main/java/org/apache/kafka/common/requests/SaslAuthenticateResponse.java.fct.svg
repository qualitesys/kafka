@startuml
!pragma layout smetana
start
note right
constructor SaslAuthenticateResponse(SaslAuthenticateResponseDatadata)
end note
end
start
note right
Errorserror()
end note
:return Errors.forCode(data.errorCode());;
stop
end
start
note right
Map<Errors,Integer>errorCounts()
end note
:return errorCounts(Errors.forCode(data.errorCode()));;
stop
end
start
note right
StringerrorMessage()
end note
:return data.errorMessage();;
stop
end
start
note right
longsessionLifetimeMs()
end note
:return data.sessionLifetimeMs();;
stop
end
start
note right
byte[]saslAuthBytes()
end note
:return data.authBytes();;
stop
end
start
note right
intthrottleTimeMs()
end note
:return DEFAULT_THROTTLE_TIME;;
stop
end
start
note right
SaslAuthenticateResponseDatadata()
end note
:return data;;
stop
end
start
note right
SaslAuthenticateResponseparse(ByteBufferbuffer,
shortversion)
end note
:return new SaslAuthenticateResponse(new SaslAuthenticateResponseData(new ByteBufferAccessor(buffer),
version));;
stop
end
@enduml

