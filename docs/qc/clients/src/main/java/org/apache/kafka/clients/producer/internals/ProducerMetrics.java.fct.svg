@startuml
!pragma layout smetana
start
note right
constructor ProducerMetrics(Metricsmetrics)
end note
:this.metrics=metrics;;
:this.senderMetrics=new SenderMetricsRegistry(this.metrics);;
end
start
note right
List<MetricNameTemplate>getAllTemplates()
end note
:List<MetricNameTemplate>l=new ArrayList<>(this.senderMetrics.allTemplates());;
:return l;;
stop
end
start
note right
void main(String[]args)
end note
:Map<String,String>metricTags=Collections.singletonMap("client-id",
"client-id");;
:MetricConfigmetricConfig=new MetricConfig()
.tags(metricTags);;
:Metricsmetrics=new Metrics(metricConfig);;
:ProducerMetricsmetricsRegistry=new ProducerMetrics(metrics);;
:System.out.println(Metrics.toHtmlTable("kafka.producer",
metricsRegistry.getAllTemplates()));;
end
@enduml

