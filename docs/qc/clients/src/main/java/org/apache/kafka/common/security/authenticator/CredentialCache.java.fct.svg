-width:1.0;"/><!--MD5=[73a51db238374cb582edecdcf8cec531]
@startuml
!pragma layout smetana
:return oldCache==null ? cache:oldCache;;
stop
if (cache!=null ) then (yes) 
if (cache.credentialClass()!=credentialClass) then (yes) 
:throw new IllegalArgumentException("Invalid credential class "+
credentialClass+", expected "+cache.credentialClass());;
endif 
:return (Cache<C>)cache;;
stop
else (no)
:return null ;;
stop
endif 
start
note right
constructor Cache(Class<C>credentialClass)
end note
:this.credentialClass=credentialClass;
:this.credentials=new ConcurrentHashMap<>();
end
start
note right
Cget(Stringusername)
end note
:return credentials.get(username);;
stop
end
start
note right
Cput(Stringusername,Ccredential)
end note
:return credentials.put(username,credential);;
stop
end
start
note right
Cremove(Stringusername)
end note
:return credentials.remove(username);;
stop
end
start
note right
Class<C>credentialClass()
end note
:return credentialClass;;
stop
end
@enduml

