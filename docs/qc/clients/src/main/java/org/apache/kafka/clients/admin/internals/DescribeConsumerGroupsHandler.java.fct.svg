@startuml
!pragma layout smetana
start
note right
constructor DescribeConsumerGroupsHandler(booleanincludeAuthorizedOperations,
LogContextlogContext)
end note
:this.includeAuthorizedOperations=includeAuthorizedOperations;;
:this.log=logContext.logger(DescribeConsumerGroupsHandler.class );;
:this.lookupStrategy=new CoordinatorStrategy(CoordinatorType.GROUP,
logContext);;
end
start
note right
Set<CoordinatorKey>buildKeySet(Collection<String>groupIds)
end note
:return groupIds.stream().map(CoordinatorKey::byGroupId)
.collect(Collectors.toSet());;
stop
end
start
note right
AdminApiFuture.SimpleAdminApiFuture<CoordinatorKey,
ConsumerGroupDescription>newFuture(Collection<String>groupIds)
end note
:return AdminApiFuture.forKeys(buildKeySet(groupIds));;
stop
end
start
note right
StringapiName()
end note
:return "describeGroups";;
stop
end
start
note right
AdminApiLookupStrategy<CoordinatorKey>lookupStrategy()
end note
:return lookupStrategy;;
stop
end
start
note right
DescribeGroupsRequest.BuilderbuildBatchedRequest(intcoordinatorId,
Set<CoordinatorKey>keys)
end note
:List<String>groupIds=keys.stream().map(key->{if (key.type!=FindCoordinatorRequest.CoordinatorType.GROUP){throw new IllegalArgumentException("Invalid transaction coordinator key "+
key+" when building  DescribeGroups  request");}return key.idValue;}).collect(Collectors.toList());;
:DescribeGroupsRequestDatadata=new DescribeGroupsRequestData()
.setGroups(groupIds).setIncludeAuthorizedOperations(includeAuthorizedOperations);;
:return new DescribeGroupsRequest.Builder(data);;
stop
end
start
note right
ApiResult<CoordinatorKey,ConsumerGroupDescription>handleResponse(Nodecoordinator,
Set<CoordinatorKey>groupIds,AbstractResponseabstractResponse)
end note
:final DescribeGroupsResponseresponse=(DescribeGroupsResponse)abstractResponse;;
:final Map<CoordinatorKey,ConsumerGroupDescription>completed=new HashMap<>();;
:final Map<CoordinatorKey,Throwable>failed=new HashMap<>();;
:final Set<CoordinatorKey>groupsToUnmap=new HashSet<>();;
:CoordinatorKeygroupIdKey=CoordinatorKey.byGroupId(describedGroup.groupId());;
:Errorserror=Errors.forCode(describedGroup.errorCode());;
if (error!=Errors.NONE) then (yes) 
:handleError(groupIdKey,error,failed,groupsToUnmap);;
:continue ;;
endif 
:final StringprotocolType=describedGroup.protocolType();;
if (protocolType.equals(ConsumerProtocol.PROTOCOL_TYPE)||protocolType.isEmpty()) then (yes) 
:final List<DescribedGroupMember>members=describedGroup.members();;
:final List<MemberDescription>memberDescriptions=new ArrayList<>(members.size());;
:final Set<AclOperation>authorizedOperations=validAclOperations(describedGroup.authorizedOperations());;
:Set<TopicPartition>partitions=Collections.emptySet();;
if (groupMember.memberAssignment().length>0) then (yes) 
:final Assignmentassignment=ConsumerProtocol.deserializeAssignment(ByteBuffer.wrap(groupMember.memberAssignment()));;
:partitions=new HashSet<>(assignment.partitions());;
endif 
:memberDescriptions.add(new MemberDescription(groupMember.memberId(),
Optional.ofNullable(groupMember.groupInstanceId()),
groupMember.clientId(),groupMember.clientHost(),
new MemberAssignment(partitions)));;
:final ConsumerGroupDescriptionconsumerGroupDescription=new ConsumerGroupDescription(groupIdKey.idValue,
protocolType.isEmpty(),memberDescriptions,
describedGroup.protocolData(),ConsumerGroupState.parse(describedGroup.groupState()),
coordinator,authorizedOperations);;
:completed.put(groupIdKey,consumerGroupDescription);;
else (no)
:failed.put(groupIdKey,new IllegalArgumentException(String.format("GroupId %s is not a consumer group (%s).",
groupIdKey.idValue,protocolType)));;
endif 
:return new ApiResult<>(completed,failed,
new ArrayList<>(groupsToUnmap));;
stop
end
start
note right
void handleError(CoordinatorKeygroupId,Errorserror,
Map<CoordinatorKey,Throwable>failed,Set<CoordinatorKey>groupsToUnmap)
end note
switch (switch (error))
endswith
end
start
note right
Set<AclOperation>validAclOperations(final intauthorizedOperations)
end note
if (authorizedOperations==MetadataResponse.AUTHORIZED_OPERATIONS_OMITTED) then (yes) 
:return null ;;
stop
endif 
:return Utils.from32BitField(authorizedOperations)
.stream().map(AclOperation::fromCode).filter(operation->operation!=AclOperation.UNKNOWN&&operation!=AclOperation.ALL&&operation!=AclOperation.ANY).collect(Collectors.toSet());;
stop
