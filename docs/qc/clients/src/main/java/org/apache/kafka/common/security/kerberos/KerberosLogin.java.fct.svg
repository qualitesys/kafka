@startuml
!pragma layout smetana
start
note right
void configure(Map<String,? >configs,StringcontextName,
Configurationconfiguration,AuthenticateCallbackHandlercallbackHandler)
end note
:super .configure(configs,contextName,configuration,
callbackHandler);
:this.ticketRenewWindowFactor=(Double)configs.get(SaslConfigs.SASL_KERBEROS_TICKET_RENEW_WINDOW_FACTOR);
:this.ticketRenewJitter=(Double)configs.get(SaslConfigs.SASL_KERBEROS_TICKET_RENEW_JITTER);
:this.minTimeBeforeRelogin=(Long)configs.get(SaslConfigs.SASL_KERBEROS_MIN_TIME_BEFORE_RELOGIN);
:this.kinitCmd=(String)configs.get(SaslConfigs.SASL_KERBEROS_KINIT_CMD);
:this.serviceName=getServiceName(configs,
contextName,configuration);
end
start
note right
LoginContextlogin()
end note
:this.lastLogin=currentElapsedTime();
:loginContext=super .login();
:subject=loginContext.getSubject();
:isKrbTicket=!subject.getPrivateCredentials(KerberosTicket.class )
.isEmpty();
if (entries.length==0) then (yes) 
:isUsingTicketCache=false;
:principal=null ;
else (no)
if (entry.getOptions().get("useTicketCache")!=null ) then (yes) 
:isUsingTicketCache=val.equals("true");
else (no)
:isUsingTicketCache=false;
endif 
if (entry.getOptions().get("principal")!=null ) then (yes) 
:principal=(String)entry.getOptions().get("principal");
else (no)
:principal=null ;
endif 
endif 
if (!isKrbTicket) then (yes) 
:log.debug("[Principal={}]: It is not a Kerberos ticket",
principal);
:t=null ;
:return loginContext;;
stop
endif 
:log.debug("[Principal={}]: It is a Kerberos ticket",
principal);
:t=KafkaThread.daemon(String.format("kafka-kerberos-refresh-thread-%s",
principal),()->{log.info("[Principal={}]: TGT refresh thread started.",
principal);while (true){KerberosTickettgt=getTGT();longnow=currentWallTime();longnextRefresh;DatenextRefreshDate;if (tgt==null ){nextRefresh=now+minTimeBeforeRelogin;nextRefreshDate=new Date(nextRefresh);log.warn("[Principal={}]: No TGT found: will try again at {}",principal,nextRefreshDate);}else {nextRefresh=getRefreshTime(tgt);longexpiry=tgt.getEndTime().getTime();DateexpiryDate=new Date(expiry);if (isUsingTicketCache&&tgt.getRenewTill()!=null &&tgt.getRenewTill().getTime()<expiry){log.warn("The TGT cannot be renewed beyond the next expiry date: {}."+"This process will not be able to authenticate new SASL connections after that "+"time (for example, it will not be able to authenticate a new connection with a Kafka "+"Broker).  Ask your system administrator to either increase the "+"'renew until' time by doing : 'modprinc -maxrenewlife {} ' within "+"kadmin, or instead, to generate a keytab for {}. Because the TGT's "+"expiry cannot be further extended by refreshing, exiting refresh thread now.",expiryDate,principal,principal);return ;}if ((nextRefresh>expiry)||(minTimeBeforeRelogin>expiry-now)){log.info("[Principal={}]: Refreshing now because expiry is before next scheduled refresh time.",principal);nextRefresh=now;}else {if (nextRefresh-now<minTimeBeforeRelogin){Dateuntil=new Date(nextRefresh);DatenewUntil=new Date(now+minTimeBeforeRelogin);log.warn("[Principal={}]: TGT refresh thread time adjusted from {} to {} since the former is sooner "+"than the minimum refresh interval ({} seconds) from now.",principal,until,newUntil,minTimeBeforeRelogin/1000);}nextRefresh=Math.max(nextRefresh,now+minTimeBeforeRelogin);}nextRefreshDate=new Date(nextRefresh);if (nextRefresh>expiry){log.error("[Principal={}]: Next refresh: {} is later than expiry {}. This may indicate a clock skew problem."+"Check that this host and the KDC hosts' clocks are in sync. Exiting refresh thread.",principal,nextRefreshDate,expiryDate);return ;}}if (now<nextRefresh){Dateuntil=new Date(nextRefresh);log.info("[Principal={}]: TGT refresh sleeping until: {}",principal,until);try {Thread.sleep(nextRefresh-now);}catch (InterruptedExceptionie){log.warn("[Principal={}]: TGT renewal thread has been interrupted and will exit.",principal);return ;}}else {log.error("[Principal={}]: NextRefresh: {} is in the past: exiting refresh thread. Check"+" clock sync between this host and KDC - (KDC's clock is likely ahead of this host)."+" Manual intervention will be required for this client to successfully authenticate."+" Exiting refresh thread.",principal,nextRefreshDate);return ;}if (isUsingTicketCache){StringkinitArgs="-R";intretry=1;while (retry>=0){try {log.debug("[Principal={}]: Running ticket cache refresh command: {} {}",principal,kinitCmd,kinitArgs);Shell.execCommand(kinitCmd,kinitArgs);break ;}catch (Exceptione){if (retry>0){log.warn("[Principal={}]: Error when trying to renew with TicketCache, but will retry ",principal,e);- -retry;try {Thread.sleep(10*1000);}catch (InterruptedExceptionie){log.error("[Principal={}]: Interrupted while renewing TGT, exiting Login thread",principal);return ;}}else {log.warn("[Principal={}]: Could not renew TGT due to problem running shell command: '{} {}'. "+"Exiting refresh thread.",principal,kinitCmd,kinitArgs,e);return ;}}}}try {intretry=1;while (retry>=0){try {reLogin();break ;}catch (LoginExceptionle){if (retry>0){log.warn("[Principal={}]: Error when trying to re-Login, but will retry ",principal,le);- -retry;try {Thread.sleep(10*1000);}catch (InterruptedExceptione){log.error("[Principal={}]: Interrupted during login retry after LoginException:",principal,le);throw le;}}else {log.error("[Principal={}]: Could not refresh TGT.",principal,le);}}}}catch (LoginExceptionle){log.error("[Principal={}]: Failed to refresh TGT: refresh thread exiting now.",principal,le);return ;}}});
:t.start();
:return loginContext;;
stop
end
start
note right
void close()
end note
if ((t!=null )&&(t.isAlive())) then (yes) 
:t.interrupt();
:t.join();
:log.warn("[Principal={}]: Error while waiting for Login thread to shutdown.",
principal,e);
:Thread.currentThread().interrupt();
endif 
end
start
note right
Subjectsubject()
end note
:return subject;;
stop
end
start
note right
StringserviceName()
end note
:return serviceName;;
stop
end
start
note right
StringgetServiceName(Map<String,? >configs,
StringcontextName,Configurationconfiguration)
end note
if (jaasServiceName!=null &&configServiceName!=null &&!jaasServiceName.equals(configServiceName)) then (yes) 
:throw new IllegalArgumentException(message);;
endif 
if (jaasServiceName!=null ) then (yes) 
:return jaasServiceName;;
stop
endif 
if (configServiceName!=null ) then (yes) 
:return configServiceName;;
stop
endif 
:throw new IllegalArgumentException("No serviceName defined in either JAAS or Kafka config");;
end
start
note right
longgetRefreshTime(KerberosTickettgt)
end note
:log.info("[Principal={}]: TGT valid starting at: {}",
principal,tgt.getStartTime());
:log.info("[Principal={}]: TGT expires: {}",
principal,tgt.getEndTime());
if (proposedRefresh>expires) then (yes) 
:return currentWallTime();;
stop
else (no)
:return proposedRefresh;;
stop
endif 
end
start
note right
KerberosTicketgetTGT()
end note
if (server.getName().equals("krbtgt/"+server.getRealm()+
"@"+server.getRealm())) then (yes) 
:log.debug("Found TGT with client principal '{}' and server principal '{}'.",
ticket.getClient().getName(),ticket.getServer()
.getName());
:return ticket;;
stop
endif 
:return null ;;
stop
end
start
note right
booleanhasSufficientTimeElapsed()
end note
if (now-lastLogin<minTimeBeforeRelogin) then (yes) 
:log.warn("[Principal={}]: Not attempting to re-login since the last re-login was attempted less than {} seconds before.",principal,minTimeBeforeRelogin/1000);
:return false;;
stop
endif 
:return true;;
stop
end
start
note right
void reLogin()
end note
if (!isKrbTicket) then (yes) 
:return ;;
stop
endif 
if (loginContext==null ) then (yes) 
:throw new LoginException("Login must be done first");;
endif 
if (!hasSufficientTimeElapsed()) then (yes) 
:return ;;
stop
endif 
:log.info("Initiating logout for {}",principal);
:lastLogin=currentElapsedTime();
if (subject!=null &&!subject.getPrincipals()
.isEmpty()) then (yes) 
:logout();
endif 
:loginContext=new LoginContext(contextName(),
subject,null ,configuration());
:log.info("Initiating re-login for {}",principal);
:login(loginContext);
end
start
note right
void login(LoginContextloginContext)
end note
:loginContext.login();
end
start
note right
void logout()
end note
:loginContext.logout();
end
start
note right
longcurrentElapsedTime()
end note
:return time.hiResClockMs();;
stop
end
start
note right
longcurrentWallTime()
end note
:return time.milliseconds();;
stop
end
@enduml

