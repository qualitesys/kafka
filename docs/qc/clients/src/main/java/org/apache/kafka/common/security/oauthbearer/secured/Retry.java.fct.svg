@startuml
!pragma layout smetana
start
note right
constructor Retry(longretryBackoffMs,longretryBackoffMaxMs)
end note
:this(Time.SYSTEM,retryBackoffMs,retryBackoffMaxMs);;
end
start
note right
constructor Retry(Timetime,longretryBackoffMs,
longretryBackoffMaxMs)
end note
:this.time=time;;
:this.retryBackoffMs=retryBackoffMs;;
:this.retryBackoffMaxMs=retryBackoffMaxMs;;
if (this.retryBackoffMs<0) then (yes) 
:throw new IllegalArgumentException(String.format("retryBackoffMs value (%d) must be non-negative",
retryBackoffMs));;
stop
endif 
if (this.retryBackoffMaxMs<0) then (yes) 
:throw new IllegalArgumentException(String.format("retryBackoffMaxMs value (%d) must be non-negative",
retryBackoffMaxMs));;
stop
endif 
if (this.retryBackoffMaxMs<this.retryBackoffMs) then (yes) 
:throw new IllegalArgumentException(String.format("retryBackoffMaxMs value (%d) is less than retryBackoffMs value (%d)",
retryBackoffMaxMs,retryBackoffMs));;
stop
endif 
end
start
note right
Rexecute(Retryable<R>retryable)
end note
:while (time.milliseconds()<=endMs){currAttempt+
+;try {return retryable.call();}catch (UnretryableExceptione){if (error==null )error=new ExecutionException(e);break ;}catch (ExecutionExceptione){log.warn("Error during retry attempt {}",
currAttempt,e);if (error==null )error=e;longwaitMs=retryBackoffMs*(long)Math.pow(2,
currAttempt-1);longdiff=endMs-time.milliseconds();waitMs=Math.min(waitMs,
diff);if (waitMs<=0)break ;Stringmessage=String.format("Attempt %d to make call resulted in an error; sleeping %d ms before retrying",
currAttempt,waitMs);log.warn(message,e);time.sleep(waitMs);}};
if (error==null ) then (yes) 
:error=new ExecutionException(new IllegalStateException("Exhausted all retry attempts but no attempt returned value or encountered exception"));;
endif 
:throw error;;
stop
end
@enduml

