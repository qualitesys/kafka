@startuml
!pragma layout smetana
start
note right
constructor TxnOffsetCommitResponse(TxnOffsetCommitResponseDatadata)
end note
end
start
note right
constructor TxnOffsetCommitResponse(intrequestThrottleMs,
Map<TopicPartition,Errors>responseData)
end note
end
start
note right
TxnOffsetCommitResponseDatadata()
end note
:return data;;
stop
end
start
note right
intthrottleTimeMs()
end note
:return data.throttleTimeMs();;
stop
end
start
note right
Map<Errors,Integer>errorCounts()
end note
:return errorCounts(data.topics().stream()
.flatMap(topic->topic.partitions().stream().map(partition->Errors.forCode(partition.errorCode()))));;
stop
end
start
note right
Map<TopicPartition,Errors>errors()
end note
:return errorMap;;
stop
end
start
note right
TxnOffsetCommitResponseparse(ByteBufferbuffer,
shortversion)
end note
:return new TxnOffsetCommitResponse(new TxnOffsetCommitResponseData(new ByteBufferAccessor(buffer),
version));;
stop
end
start
note right
StringtoString()
end note
:return data.toString();;
stop
end
start
note right
booleanshouldClientThrottle(shortversion)
end note
:return version>=1;;
stop
end
@enduml

