@startuml
!pragma layout smetana
start
note right
constructor Avg()
end note
:super (0.0);
end
start
note right
void update(Samplesample,MetricConfigconfig,doublevalue,longnow)
end note
:sample.value+=value;
end
start
note right
doublecombine(List<Sample>samples,MetricConfigconfig,longnow)
end note
:total+=s.value;
:count+=s.eventCount;
:return count==0? Double.NaN:total/count;;
stop
end
@enduml

