@startuml
!pragma layout smetana
if (Java.IS_JAVA11_COMPATIBLE) then (yes) 
:DEFAULT_SSL_PROTOCOL="TLSv1.3";;
:DEFAULT_SSL_ENABLED_PROTOCOLS="TLSv1.2,TLSv1.3";;
else (no)
:DEFAULT_SSL_PROTOCOL="TLSv1.2";;
:DEFAULT_SSL_ENABLED_PROTOCOLS="TLSv1.2";;
endif 
start
note right
