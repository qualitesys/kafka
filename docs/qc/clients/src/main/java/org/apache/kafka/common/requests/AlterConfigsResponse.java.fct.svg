1f87ab46e8030d1b1bdae]
@startuml
!pragma layout smetana
start
note right
constructor AlterConfigsResponse(AlterConfigsResponseDatadata)
end note
end
start
note right
Map<ConfigResource,ApiError>errors()
end note
:return data.responses().stream().collect(Collectors.toMap(response->new ConfigResource(ConfigResource.Type.forId(response.resourceType()),response.resourceName()),response->new ApiError(Errors.forCode(response.errorCode()),response.errorMessage())));;
stop
end
start
note right
Map<Errors,Integer>errorCounts()
end note
:return apiErrorCounts(errors());;
stop
end
start
note right
intthrottleTimeMs()
end note
:return data.throttleTimeMs();;
stop
end
start
note right
AlterConfigsResponseDatadata()
end note
:return data;;
stop
end
start
note right
AlterConfigsResponseparse(ByteBufferbuffer,
shortversion)
end note
:return new AlterConfigsResponse(new AlterConfigsResponseData(new ByteBufferAccessor(buffer),
version));;
stop
end
start
note right
booleanshouldClientThrottle(shortversion)
end note
:return version>=1;;
stop
end
@enduml

