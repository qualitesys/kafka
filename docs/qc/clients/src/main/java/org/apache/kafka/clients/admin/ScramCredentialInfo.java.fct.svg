@startuml
!pragma layout smetana
start
note right
constructor ScramCredentialInfo(ScramMechanismmechanism,
intiterations)
end note
end
start
note right
ScramMechanismmechanism()
end note
:return mechanism;;
stop
end
start
note right
intiterations()
end note
:return iterations;;
stop
end
start
note right
StringtoString()
end note
:return "ScramCredentialInfo{"+"mechanism="+
mechanism+", iterations="+iterations+'}';;
stop
end
start
note right
booleanequals(Objecto)
end note
if (this==o) then (yes) 
:return true;;
stop
endif 
if (o==null ||getClass()!=o.getClass()) then (yes) 
:return false;;
stop
endif 
:return iterations==that.iterations&&mechanism==that.mechanism;;
stop
end
start
note right
inthashCode()
end note
:return Objects.hash(mechanism,iterations);;
stop
end
@enduml

