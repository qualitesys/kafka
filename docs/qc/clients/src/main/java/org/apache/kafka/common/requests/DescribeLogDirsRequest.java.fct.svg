@startuml
!pragma layout smetana
start
note right
constructor Builder(DescribeLogDirsRequestData data)
end note
:super (ApiKeys.DESCRIBE_LOG_DIRS);;
:this.data=data;;
end
start
note right
DescribeLogDirsRequest build(short version)
end note
:return new DescribeLogDirsRequest(data,version);;
stop
end
start
note right
String toString()
end note
:return data.toString();;
stop
end
start
note right
constructor DescribeLogDirsRequest(DescribeLogDirsRequestData data,
short version)
end note
:super (ApiKeys.DESCRIBE_LOG_DIRS,version);;
:this.data=data;;
end
start
note right
DescribeLogDirsRequestData data()
end note
:return data;;
stop
end
start
note right
AbstractResponse getErrorResponse(int throttleTimeMs,
Throwable e)
end note
:return new DescribeLogDirsResponse(new DescribeLogDirsResponseData()
.setThrottleTimeMs(throttleTimeMs).setErrorCode(Errors.forException(e).code()));;
stop
end
start
note right
boolean isAllTopicPartitions()
end note
:return data.topics()==null ;;
stop
end
start
note right
DescribeLogDirsRequest parse(ByteBuffer buffer,
short version)
end note
:return new DescribeLogDirsRequest(new DescribeLogDirsRequestData(new ByteBufferAccessor(buffer),
version),version);;
stop
end
@enduml

