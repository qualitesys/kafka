@startuml
!pragma layout smetana
start
note right
constructor Builder(DescribeLogDirsRequestDatadata)
end note
end
start
note right
DescribeLogDirsRequestbuild(shortversion)
end note
:return new DescribeLogDirsRequest(data,version);;
stop
end
start
note right
StringtoString()
end note
:return data.toString();;
stop
end
start
note right
constructor DescribeLogDirsRequest(DescribeLogDirsRequestDatadata,
shortversion)
end note
end
start
note right
DescribeLogDirsRequestDatadata()
end note
:return data;;
stop
end
start
note right
AbstractResponsegetErrorResponse(intthrottleTimeMs,
Throwablee)
end note
:return new DescribeLogDirsResponse(new DescribeLogDirsResponseData()
.setThrottleTimeMs(throttleTimeMs).setErrorCode(Errors.forException(e).code()));;
stop
end
start
note right
booleanisAllTopicPartitions()
end note
:return data.topics()==null ;;
stop
end
start
note right
DescribeLogDirsRequestparse(ByteBufferbuffer,
shortversion)
end note
:return new DescribeLogDirsRequest(new DescribeLogDirsRequestData(new ByteBufferAccessor(buffer),
