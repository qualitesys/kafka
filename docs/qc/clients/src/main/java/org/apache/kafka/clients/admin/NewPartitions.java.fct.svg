@startuml
!pragma layout smetana
start
note right
constructor NewPartitions(inttotalCount,List<List<Integer>>newAssignments)
end note
:this.totalCount=totalCount;
:this.newAssignments=newAssignments;
end
start
note right
NewPartitionsincreaseTo(inttotalCount)
end note
:return new NewPartitions(totalCount,null );;
stop
end
start
note right
NewPartitionsincreaseTo(inttotalCount,List<List<Integer>>newAssignments)
end note
:return new NewPartitions(totalCount,newAssignments);;
stop
