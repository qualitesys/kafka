@startuml
!pragma layout smetana
start
note right
constructor NewPartitions(int totalCount,
List<List<Integer>> newAssignments)
end note
:this.totalCount=totalCount;;
:this.newAssignments=newAssignments;;
end
start
note right
NewPartitions increaseTo(int totalCount)
end note
:return new NewPartitions(totalCount,null );;
stop
end
start
note right
NewPartitions increaseTo(int totalCount,List<List<Integer>> newAssignments)
end note
:return new NewPartitions(totalCount,newAssignments);;
stop
end
start
note right
int totalCount()
end note
:return totalCount;;
stop
end
start
note right
List<List<Integer>> assignments()
end note
:return newAssignments;;
stop
end
start
note right
String toString()
end note
:return "(totalCount="+totalCount()+", newAssignments="+
assignments()+")";;
stop
end
@enduml

