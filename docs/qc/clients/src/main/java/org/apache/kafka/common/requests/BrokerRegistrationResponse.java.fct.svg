@startuml
!pragma layout smetana
start
note right
constructor BrokerRegistrationResponse(BrokerRegistrationResponseDatadata)
end note
:super (ApiKeys.BROKER_REGISTRATION);
:this.data=data;
end
start
note right
BrokerRegistrationResponseDatadata()
end note
:return data;;
stop
end
start
note right
intthrottleTimeMs()
end note
:return data.throttleTimeMs();;
stop
end
start
note right
Map<Errors,Integer>errorCounts()
end note
:errorCounts.put(Errors.forCode(data.errorCode()),
1);
:return errorCounts;;
stop
end
start
note right
BrokerRegistrationResponseparse(ByteBufferbuffer,
shortversion)
end note
:return new BrokerRegistrationResponse(new BrokerRegistrationResponseData(new ByteBufferAccessor(buffer),version));;
stop
end
start
note right
booleanshouldClientThrottle(shortversion)
end note
:return true;;
stop
end
start
note right
StringtoString()
end note
:return data.toString();;
stop
end
@enduml

