@startuml
!pragma layout smetana
start
note right
constructor BrokerRegistrationResponse(BrokerRegistrationResponseData data)
end note
:super (ApiKeys.BROKER_REGISTRATION);;
:this.data=data;;
end
start
note right
BrokerRegistrationResponseData data()
end note
:return data;;
stop
end
start
note right
int throttleTimeMs()
end note
:return data.throttleTimeMs();;
stop
end
start
note right
Map<Errors,Integer> errorCounts()
end note
:Map<Errors,Integer> errorCounts=new HashMap<>();;
:errorCounts.put(Errors.forCode(data.errorCode()),1);;
:return errorCounts;;
stop
end
start
note right
BrokerRegistrationResponse parse(ByteBuffer buffer,
short version)
end note
:return new BrokerRegistrationResponse(new BrokerRegistrationResponseData(new ByteBufferAccessor(buffer),
version));;
stop
end
start
note right
boolean shouldClientThrottle(short version)
end note
:return true;;
stop
end
start
note right
String toString()
end note
:return data.toString();;
stop
end
@enduml

