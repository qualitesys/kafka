@startuml
!pragma layout smetana
start
note right
constructor ChannelBuilders()
end note
end
start
note right
ChannelBuilderclientChannelBuilder(SecurityProtocolsecurityProtocol,
JaasContext.TypecontextType,AbstractConfigconfig,
ListenerNamelistenerName,StringclientSaslMechanism,
Timetime,booleansaslHandshakeRequestEnable,
LogContextlogContext)
end note
if (securityProtocol==SecurityProtocol.SASL_PLAINTEXT||securityProtocol==SecurityProtocol.SASL_SSL) then (yes) 
if (contextType==null ) then (yes) 
:throw new IllegalArgumentException(" contextType  must be non-null if  securityProtocol  is  "+
securityProtocol+" ");;
stop
endif 
if (clientSaslMechanism==null ) then (yes) 
:throw new IllegalArgumentException(" clientSaslMechanism  must be non-null in client mode if  securityProtocol  is  "+
securityProtocol+" ");;
stop
endif 
endif 
:return create(securityProtocol,Mode.CLIENT,
contextType,config,listenerName,false,clientSaslMechanism,
saslHandshakeRequestEnable,null ,null ,time,
logContext,null );;
stop
end
start
note right
ChannelBuilderserverChannelBuilder(ListenerNamelistenerName,
booleanisInterBrokerListener,SecurityProtocolsecurityProtocol,
AbstractConfigconfig,CredentialCachecredentialCache,
DelegationTokenCachetokenCache,Timetime,LogContextlogContext,
Supplier<ApiVersionsResponse>apiVersionSupplier)
end note
:return create(securityProtocol,Mode.SERVER,
JaasContext.Type.SERVER,config,listenerName,
isInterBrokerListener,null ,true,credentialCache,
tokenCache,time,logContext,apiVersionSupplier);;
stop
end
start
note right
ChannelBuildercreate(SecurityProtocolsecurityProtocol,
Modemode,JaasContext.TypecontextType,AbstractConfigconfig,
ListenerNamelistenerName,booleanisInterBrokerListener,
StringclientSaslMechanism,booleansaslHandshakeRequestEnable,
CredentialCachecredentialCache,DelegationTokenCachetokenCache,
Timetime,LogContextlogContext,Supplier<ApiVersionsResponse>apiVersionSupplier)
end note
:Map<String,Object>configs=channelBuilderConfigs(config,
listenerName);;
:ChannelBuilderchannelBuilder;;
switch (switch (securityProtocol))
endswith
:channelBuilder.configure(configs);;
:return channelBuilder;;
stop
end
start
note right
Map<String,Object>channelBuilderConfigs(final AbstractConfigconfig,
final ListenerNamelistenerName)
end note
:Map<String,Object>parsedConfigs;;
if (listenerName==null ) then (yes) 
:parsedConfigs=(Map<String,Object>)config.values();;
else (no)
:parsedConfigs=config.valuesWithPrefixOverride(listenerName.configPrefix());;
endif 
:config.originals().entrySet().stream().filter(e->!parsedConfigs.containsKey(e.getKey()))
.filter(e->!(listenerName!=null &&e.getKey().startsWith(listenerName.configPrefix())&&parsedConfigs.containsKey(e.getKey().substring(listenerName.configPrefix().length())))).filter(e->!(listenerName!=null &&parsedConfigs.containsKey(e.getKey().substring(e.getKey().indexOf('.')+1)))).forEach(e->parsedConfigs.put(e.getKey(),e.getValue()));;
:return parsedConfigs;;
stop
end
start
note right
void requireNonNullMode(Modemode,SecurityProtocolsecurityProtocol)
end note
if (mode==null ) then (yes) 
:throw new IllegalArgumentException(" mode  must be non-null if  securityProtocol  is  "+
securityProtocol+" ");;
stop
endif 
end
start
note right
KafkaPrincipalBuildercreatePrincipalBuilder(Map<String,
? >configs,KerberosShortNamerkerberosShortNamer,
SslPrincipalMappersslPrincipalMapper)
end note
:Class<? >principalBuilderClass=(Class<? >)configs.get(BrokerSecurityConfigs.PRINCIPAL_BUILDER_CLASS_CONFIG);;
:final KafkaPrincipalBuilderbuilder;;
if (principalBuilderClass==null ||principalBuilderClass==DefaultKafkaPrincipalBuilder.class ) then (yes) 
:builder=new DefaultKafkaPrincipalBuilder(kerberosShortNamer,
sslPrincipalMapper);;
else if (KafkaPrincipalBuilder.class .isAssignableFrom(principalBuilderClass)) then (yes) 
:builder=(KafkaPrincipalBuilder)Utils.newInstance(principalBuilderClass);;
else (no)
:throw new InvalidConfigurationException("Type "+
principalBuilderClass.getName()+" is not "+
"an instance of "+KafkaPrincipalBuilder.class .getName());;
stop
endif 
if (builder instanceof Configurable) then (yes) 
:((Configurable)builder).configure(configs);;
endif 
:return builder;;
stop
end
@enduml

