,494.9141,527.5,498.9141" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[fbf501ec2593ab8c7aee447726dd1665]
@startuml
!pragma layout smetana
start
note right
void configure(Map<String,? >configs,booleanisKey)
end note
if (encodingValue==null ) then (yes) 
:encodingValue=configs.get("deserializer.encoding");;
endif 
if (encodingValue instanceof String) then (yes) 
:encoding=(String)encodingValue;;
endif 
end
start
note right
Stringdeserialize(Stringtopic,byte[]data)
end note
:try {if (data==null )return null ;else return new String(data,
encoding);}catch (UnsupportedEncodingExceptione){throw new SerializationException("Error when deserializing byte[] to string due to unsupported encoding "+
encoding);};
end
@enduml

