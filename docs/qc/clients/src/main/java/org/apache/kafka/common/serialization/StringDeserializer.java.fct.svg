.5" x2="390.5" y1="400.4414" y2="423.0078"/><polygon fill="#181818" points="386.5,413.0078,390.5,423.0078,394.5,413.0078,390.5,417.0078" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="390.5" x2="390.5" y1="576.9453" y2="596.9453"/><polygon fill="#181818" points="386.5,586.9453,390.5,596.9453,394.5,586.9453,390.5,590.9453" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[7a351cb5ea68b8a1dad2690fbf97c03d]
@startuml
!pragma layout smetana
start
note right
void configure(Map<String,? >configs,booleanisKey)
end note
if (encodingValue==null ) then (yes) 
:encodingValue=configs.get("deserializer.encoding");
endif 
if (encodingValue instanceof String) then (yes) 
:encoding=(String)encodingValue;
endif 
end
start
note right
Stringdeserialize(Stringtopic,byte[]data)
end note
if (data==null ) then (yes) 
:return null ;;
stop
else (no)
:return new String(data,encoding);;
stop
endif 
:throw new SerializationException("Error when deserializing byte[] to string due to unsupported encoding "+encoding);;
end
@enduml

