078,361,413.0078,357,417.0078" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="357" x2="357" y1="590.9141" y2="610.9141"/><polygon fill="#181818" points="353,600.9141,357,610.9141,361,600.9141,357,604.9141" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[ef518da3a11c717b8540cb1f2a0598a7]
@startuml
!pragma layout smetana
start
note right
void configure(Map<String,? >configs,booleanisKey)
end note
if (encodingValue==null ) then (yes) 
:encodingValue=configs.get("deserializer.encoding");
endif 
if (encodingValue instanceof String) then (yes) 
:encoding=(String)encodingValue;
endif 
end
start
note right
Stringdeserialize(Stringtopic,byte[]data)
end note
if (data==null ) then (yes) 
:return null ;;
stop
else (no)
:return new String(data,encoding);;
stop
endif 
:throw new SerializationException("Error when deserializing byte[] to string due to unsupported encoding "+
encoding);;
end
@enduml

