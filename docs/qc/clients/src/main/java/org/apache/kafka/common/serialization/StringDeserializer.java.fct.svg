@startuml
!pragma layout smetana
start
note right
void configure(Map<String,? >configs,booleanisKey)
end note
:StringpropertyName=isKey? String.valueOf("key.deserializer.encoding"):String.valueOf("value.deserializer.encoding");;
:ObjectencodingValue=configs.get(propertyName);;
if (encodingValue==null ) then (yes) 
:encodingValue=configs.get("deserializer.encoding");;
endif 
if (encodingValue instanceof String) then (yes) 
:encoding=(String)encodingValue;;
endif 
end
start
note right
Stringdeserialize(Stringtopic,byte[]data)
end note
switch (try/catch block)
case (try)
if (data==null ) then (yes) 
:return null ;;
stop
else (no)
:return new String(data,encoding);;
stop
endif 
case (catch (UnsupportedEncodingExceptione))
:throw new SerializationException("Error when deserializing byte[] to string due to unsupported encoding "+
encoding);;
stop
endswitch
end
@enduml

