0;"/><!--MD5=[8d2a836a7d3180704872f617a151d3a7]
@startuml
!pragma layout smetana
start
note right
constructor EndTxnResponse(EndTxnResponseData data)
end note
:super (ApiKeys.END_TXN);;
:this.data=data;;
end
start
note right
int throttleTimeMs()
end note
:return data.throttleTimeMs();;
stop
end
start
note right
Errors error()
end note
:return Errors.forCode(data.errorCode());;
stop
end
start
note right
Map<Errors,Integer> errorCounts()
end note
:return errorCounts(error());;
stop
end
start
note right
EndTxnResponseData data()
end note
:return data;;
stop
end
start
note right
EndTxnResponse parse(ByteBuffer buffer,short version)
end note
:return new EndTxnResponse(new EndTxnResponseData(new ByteBufferAccessor(buffer),
version));;
stop
end
start
note right
String toString()
end note
:return data.toString();;
stop
end
start
note right
boolean shouldClientThrottle(short version)
end note
:return version>=1;;
stop
end
@enduml

