@startuml
!pragma layout smetana
start
note right
constructor EndTxnResponse(EndTxnResponseDatadata)
end note
:super (ApiKeys.END_TXN);
:this.data=data;
end
start
note right
intthrottleTimeMs()
end note
:return data.throttleTimeMs();;
stop
end
start
note right
Errorserror()
end note
:return Errors.forCode(data.errorCode());;
stop
end
start
note right
Map<Errors,Integer>errorCounts()
end note
:return errorCounts(error());;
stop
end
start
note right
EndTxnResponseDatadata()
end note
:return data;;
stop
end
start
note right
EndTxnResponseparse(ByteBufferbuffer,shortversion)
end note
:return new EndTxnResponse(new EndTxnResponseData(new ByteBufferAccessor(buffer),version));;
stop
end
start
note right
StringtoString()
end note
:return data.toString();;
stop
end
start
note right
booleanshouldClientThrottle(shortversion)
end note
:return version>=1;;
stop
end
@enduml

