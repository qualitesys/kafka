18" points="314,1101.6484,318,1111.6484,322,1101.6484,318,1105.6484" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[95af32371e72eb52a414d148059db9ce]
@startuml
!pragma layout smetana
start
note right
constructor HeartbeatResponse(HeartbeatResponseDatadata)
end note
:super (ApiKeys.HEARTBEAT);;
:this.data=data;;
end
start
note right
intthrottleTimeMs()
end note
:return data.throttleTimeMs();;
stop
end
start
note right
Errorserror()
end note
:return Errors.forCode(data.errorCode());;
stop
end
start
note right
Map<Errors,Integer>errorCounts()
end note
:return errorCounts(error());;
stop
end
start
note right
HeartbeatResponseDatadata()
end note
:return data;;
stop
end
start
note right
HeartbeatResponseparse(ByteBufferbuffer,shortversion)
end note
:return new HeartbeatResponse(new HeartbeatResponseData(new ByteBufferAccessor(buffer),
version));;
stop
end
start
note right
booleanshouldClientThrottle(shortversion)
end note
:return version>=2;;
stop
end
@enduml

