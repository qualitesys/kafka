roke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="318" x2="318" y1="1106.7813" y2="1126.7813"/><polygon fill="#181818" points="314,1116.7813,318,1126.7813,322,1116.7813,318,1120.7813" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[0c8ac0a9e826e46d4dffbdb9bb83031d]
@startuml
!pragma layout smetana
start
note right
constructor HeartbeatResponse(HeartbeatResponseData data)
end note
:super (ApiKeys.HEARTBEAT);;
:this.data=data;;
end
start
note right
int throttleTimeMs()
end note
:return data.throttleTimeMs();;
stop
end
start
note right
Errors error()
end note
:return Errors.forCode(data.errorCode());;
stop
end
start
note right
Map<Errors,Integer> errorCounts()
end note
:return errorCounts(error());;
stop
end
start
note right
HeartbeatResponseData data()
end note
:return data;;
stop
end
start
note right
HeartbeatResponse parse(ByteBuffer buffer,
short version)
end note
:return new HeartbeatResponse(new HeartbeatResponseData(new ByteBufferAccessor(buffer),
version));;
stop
end
start
note right
boolean shouldClientThrottle(short version)
end note
:return version>=2;;
stop
end
@enduml

