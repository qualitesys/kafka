@startuml
!pragma layout smetana
start
note right
constructor Uuid(longmostSigBits,longleastSigBits)
end note
:this.mostSignificantBits=mostSigBits;
:this.leastSignificantBits=leastSigBits;
end
start
note right
UuidunsafeRandomUuid()
end note
:return new Uuid(jUuid.getMostSignificantBits(),
jUuid.getLeastSignificantBits());;
stop
end
start
note right
UuidrandomUuid()
end note
while (uuid.equals(METADATA_TOPIC_ID)||uuid.equals(ZERO_UUID)||uuid.toString()
.startsWith("-"))
:uuid=unsafeRandomUuid();
endwhile
:return uuid;;
stop
end
start
note right
longgetMostSignificantBits()
end note
:return this.mostSignificantBits;;
stop
end
start
note right
longgetLeastSignificantBits()
end note
:return this.leastSignificantBits;;
stop
end
start
note right
booleanequals(Objectobj)
end note
if ((null ==obj)||(obj.getClass()!=this.getClass())) then (yes) 
:return false;;
stop
endif 
:return this.mostSignificantBits==id.mostSignificantBits&&this.leastSignificantBits==id.leastSignificantBits;;
stop
end
start
note right
inthashCode()
end note
:return (int)(xor>>32)^(int)xor;;
stop
end
start
note right
StringtoString()
end note
:return Base64.getUrlEncoder().withoutPadding()
.encodeToString(getBytesFromUuid());;
stop
end
start
note right
UuidfromString(Stringstr)
end note
if (str.length()>24) then (yes) 
:throw new IllegalArgumentException("Input string with prefix `"+
str.substring(0,24)+"` is too long to be decoded as a base64 UUID");;
endif 
if (uuidBytes.remaining()!=16) then (yes) 
:throw new IllegalArgumentException("Input string `"+
str+"` decoded as "+uuidBytes.remaining()+
" bytes, which is not equal to the expected 16 bytes "+
"of a base64-encoded UUID");;
endif 
:return new Uuid(uuidBytes.getLong(),uuidBytes.getLong());;
stop
end
start
note right
byte[]getBytesFromUuid()
end note
:uuidBytes.putLong(this.mostSignificantBits);
:uuidBytes.putLong(this.leastSignificantBits);
:return uuidBytes.array();;
stop
end
start
note right
intcompareTo(Uuidother)
end note
if (mostSignificantBits>other.mostSignificantBits) then (yes) 
:return 1;;
stop
else (no)
:return 0;;
stop
endif 
end
@enduml

