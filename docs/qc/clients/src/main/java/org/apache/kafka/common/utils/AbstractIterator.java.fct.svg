@startuml
!pragma layout smetana
start
note right
booleanhasNext()
end note
switch (switch (state))
endswith
end
start
note right
Tnext()
end note
if (!hasNext()) then (yes) 
:throw new NoSuchElementException();;
stop
endif 
:state=State.NOT_READY;;
if (next==null ) then (yes) 
:throw new IllegalStateException("Expected item but none found.");;
stop
endif 
:return next;;
stop
end
start
note right
void remove()
end note
:throw new UnsupportedOperationException("Removal not supported");;
stop
end
start
note right
Tpeek()
end note
if (!hasNext()) then (yes) 
:throw new NoSuchElementException();;
stop
endif 
:return next;;
stop
end
start
note right
TallDone()
end note
:state=State.DONE;;
:return null ;;
stop
end
start
note right
BooleanmaybeComputeNext()
end note
:state=State.FAILED;;
:next=makeNext();;
if (state==State.DONE) then (yes) 
:return false;;
stop
else (no)
:state=State.READY;;
:return true;;
stop
endif 
end
@enduml

