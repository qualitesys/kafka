=[57827acb2d2bbdeca2db459532d32743]
@startuml
!pragma layout smetana
start
note right
constructor ProducerIdAndEpoch(longproducerId,
shortepoch)
end note
:this.producerId=producerId;;
:this.epoch=epoch;;
end
start
note right
booleanisValid()
end note
:return RecordBatch.NO_PRODUCER_ID<producerId;;
stop
end
start
note right
StringtoString()
end note
:return "ProducerIdAndEpoch(producerId="+
producerId+", epoch="+epoch+")";;
stop
end
start
note right
booleanequals(Objecto)
end note
if (this==o) then (yes) 
:return true;;
stop
endif 
if (o==null ||getClass()!=o.getClass()) then (yes) 
:return false;;
stop
endif 
:ProducerIdAndEpochthat=(ProducerIdAndEpoch)o;;
if (producerId!=that.producerId) then (yes) 
:return false;;
stop
endif 
:return epoch==that.epoch;;
stop
end
