><polygon fill="#181818" points="176,1143.0039,180,1153.0039,184,1143.0039,180,1147.0039" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="180" x2="180" y1="1237.5703" y2="1260.1367"/><polygon fill="#181818" points="176,1250.1367,180,1260.1367,184,1250.1367,180,1254.1367" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="180" x2="180" y1="1294.1055" y2="1314.1055"/><polygon fill="#181818" points="176,1304.1055,180,1314.1055,184,1304.1055,180,1308.1055" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="180" x2="180" y1="1348.0742" y2="1368.0742"/><polygon fill="#181818" points="176,1358.0742,180,1368.0742,184,1358.0742,180,1362.0742" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[ed130062f1aea59584ba8d3730dfe16b]
@startuml
!pragma layout smetana
start
note right
constructor ProducerIdAndEpoch(longproducerId,shortepoch)
end note
:this.producerId=producerId;
:this.epoch=epoch;
end
start
note right
booleanisValid()
end note
:return RecordBatch.NO_PRODUCER_ID<producerId;;
stop
end
start
note right
StringtoString()
end note
:return "ProducerIdAndEpoch(producerId="+
producerId+", epoch="+epoch+")";;
stop
end
start
note right
booleanequals(Objecto)
end note
if (this==o) then (yes) 
:return true;;
stop
endif 
if (o==null ||getClass()!=o.getClass()) then (yes) 
:return false;;
stop
endif 
if (producerId!=that.producerId) then (yes) 
:return false;;
stop
endif 
:return epoch==that.epoch;;
stop
end
start
note right
inthashCode()
end note
:result=31*result+(int)epoch;
:return result;;
stop
end
@enduml

