@startuml
!pragma layout smetana
start
note right
constructor ProducerIdAndEpoch(long producerId,
short epoch)
end note
:this.producerId=producerId;;
:this.epoch=epoch;;
end
start
note right
boolean isValid()
end note
:return RecordBatch.NO_PRODUCER_ID<producerId;;
stop
end
start
note right
String toString()
end note
:return "ProducerIdAndEpoch(producerId="+
producerId+", epoch="+epoch+")";;
stop
end
start
note right
boolean equals(Object o)
end note
if (this==o) then (yes) 
:return true;;
stop
endif 
if (o==null ||getClass()!=o.getClass()) then (yes) 
:return false;;
stop
endif 
:ProducerIdAndEpoch that=(ProducerIdAndEpoch )o;;
if (producerId!=that.producerId) then (yes) 
:return false;;
stop
endif 
:return epoch==that.epoch;;
stop
end
