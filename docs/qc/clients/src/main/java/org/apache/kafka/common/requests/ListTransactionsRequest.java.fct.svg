@startuml
!pragma layout smetana
start
note right
constructor Builder(ListTransactionsRequestData data)
end note
:super (ApiKeys.LIST_TRANSACTIONS);;
:this.data=data;;
end
start
note right
ListTransactionsRequest build(short version)
end note
:return new ListTransactionsRequest(data,
version);;
stop
end
start
note right
String toString()
end note
:return data.toString();;
stop
end
start
note right
constructor ListTransactionsRequest(ListTransactionsRequestData data,
short version)
end note
:super (ApiKeys.LIST_TRANSACTIONS,version);;
:this.data=data;;
end
start
note right
ListTransactionsRequestData data()
end note
:return data;;
stop
end
start
note right
ListTransactionsResponse getErrorResponse(int throttleTimeMs,
Throwable e)
end note
:Errors error=Errors.forException(e);;
