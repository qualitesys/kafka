@startuml
!pragma layout smetana
start
note right
constructor DeleteTopicsResponse(DeleteTopicsResponseData data)
end note
:super (ApiKeys.DELETE_TOPICS);;
:this.data=data;;
end
start
note right
int throttleTimeMs()
end note
:return data.throttleTimeMs();;
stop
end
start
note right
DeleteTopicsResponseData data()
end note
:return data;;
stop
end
start
note right
Map<Errors,Integer> errorCounts()
end note
:HashMap<Errors,Integer> counts=new HashMap<>();;
:data.responses().forEach(result->updateErrorCounts(counts,
Errors.forCode(result.errorCode())));;
:return counts;;
stop
end
start
note right
DeleteTopicsResponse parse(ByteBuffer buffer,
short version)
end note
:return new DeleteTopicsResponse(new DeleteTopicsResponseData(new ByteBufferAccessor(buffer),
version));;
stop
end
start
note right
boolean shouldClientThrottle(short version)
end note
:return version>=2;;
stop
end
@enduml

