@startuml
!pragma layout smetana
start
note right
constructor DeleteTopicsResponse(DeleteTopicsResponseDatadata)
end note
:super (ApiKeys.DELETE_TOPICS);
:this.data=data;
end
start
note right
intthrottleTimeMs()
end note
:return data.throttleTimeMs();;
stop
end
start
note right
DeleteTopicsResponseDatadata()
end note
:return data;;
stop
end
start
note right
Map<Errors,Integer>errorCounts()
end note
:data.responses().forEach(result->updateErrorCounts(counts,Errors.forCode(result.errorCode())));
:return counts;;
stop
end
start
note right
DeleteTopicsResponseparse(ByteBufferbuffer,shortversion)
end note
:return new DeleteTopicsResponse(new DeleteTopicsResponseData(new ByteBufferAccessor(buffer),version));;
stop
end
start
note right
booleanshouldClientThrottle(shortversion)
end note
:return version>=2;;
stop
end
@enduml

