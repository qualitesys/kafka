@startuml
!pragma layout smetana
start
note right
constructor CorruptRecordException()
end note
:super ("This message has failed its CRC checksum,
 exceeds the valid size, has a null key for a compacted topic,
 or is otherwise corrupt.");;
end
start
note right
constructor CorruptRecordException(Stringmessage)
end note
:super (message);;
end
start
note right
constructor CorruptRecordException(Throwablecause)
end note
:super (cause);;
end
start
note right
constructor CorruptRecordException(Stringmessage,
Throwablecause)
end note
:super (message,cause);;
end
@enduml

