@startuml
!pragma layout smetana
start
note right
booleanisValidEntityType(StringentityType)
end note
:return Objects.equals(entityType,USER)||Objects.equals(entityType,
CLIENT_ID)||Objects.equals(entityType,IP);;
stop
end
start
note right
constructor ClientQuotaEntity(Map<String,
String>entries)
end note
end
start
note right
Map<String,String>entries()
end note
:return this.entries;;
stop
end
start
note right
booleanequals(Objecto)
end note
if (this==o) then (yes) 
:return true;;
stop
endif 
if (o==null ||getClass()!=o.getClass()) then (yes) 
:return false;;
stop
endif 
:return Objects.equals(entries,that.entries);;
stop
end
start
note right
inthashCode()
end note
:return Objects.hash(entries);;
stop
end
start
note right
StringtoString()
end note
:return "ClientQuotaEntity(entries="+entries+
")";;
stop
end
@enduml

