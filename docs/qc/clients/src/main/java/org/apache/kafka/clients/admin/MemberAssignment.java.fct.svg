@startuml
!pragma layout smetana
start
note right
constructor MemberAssignment(Set<TopicPartition>topicPartitions)
end note
:this.topicPartitions=topicPartitions==null ? Collections.<TopicPartition>emptySet():Collections.unmodifiableSet(new HashSet<>(topicPartitions));
end
start
note right
booleanequals(Objecto)
end note
if (this==o) then (yes) 
:return true;;
stop
endif 
if (o==null ||getClass()!=o.getClass()) then (yes) 
:return false;;
stop
endif 
:return Objects.equals(topicPartitions,that.topicPartitions);;
stop
end
start
note right
inthashCode()
end note
:return topicPartitions!=null ? topicPartitions.hashCode():0;;
stop
end
start
note right
Set<TopicPartition>topicPartitions()
end note
:return topicPartitions;;
stop
end
start
note right
StringtoString()
end note
:return "(topicPartitions="+Utils.join(topicPartitions,",")+
")";;
stop
end
@enduml

