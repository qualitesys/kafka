@startuml
!pragma layout smetana
start
note right
constructor InitProducerIdResponse(InitProducerIdResponseDatadata)
end note
:super (ApiKeys.INIT_PRODUCER_ID);
:this.data=data;
end
start
note right
intthrottleTimeMs()
end note
:return data.throttleTimeMs();;
stop
end
start
note right
Map<Errors,Integer>errorCounts()
end note
:return errorCounts(Errors.forCode(data.errorCode()));;
stop
end
start
note right
InitProducerIdResponseDatadata()
end note
:return data;;
stop
end
start
note right
InitProducerIdResponseparse(ByteBufferbuffer,shortversion)
end note
:return new InitProducerIdResponse(new InitProducerIdResponseData(new ByteBufferAccessor(buffer),version));;
stop
end
start
note right
StringtoString()
end note
:return data.toString();;
stop
end
start
note right
Errorserror()
end note
:return Errors.forCode(data.errorCode());;
stop
end
start
note right
booleanshouldClientThrottle(shortversion)
end note
:return version>=1;;
stop
end
@enduml

