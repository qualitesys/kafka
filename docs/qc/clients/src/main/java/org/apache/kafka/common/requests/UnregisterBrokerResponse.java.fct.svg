@startuml
!pragma layout smetana
start
note right
constructor UnregisterBrokerResponse(UnregisterBrokerResponseDatadata)
end note
:super (ApiKeys.UNREGISTER_BROKER);
:this.data=data;
end
start
note right
UnregisterBrokerResponseDatadata()
end note
:return data;;
stop
end
start
note right
intthrottleTimeMs()
end note
:return data.throttleTimeMs();;
stop
end
start
note right
Map<Errors,Integer>errorCounts()
end note
if (data.errorCode()!=0) then (yes) 
:errorCounts.put(Errors.forCode(data.errorCode()),1);
endif 
:return errorCounts;;
stop
end
start
note right
UnregisterBrokerResponseparse(ByteBufferbuffer,
shortversion)
end note
:return new UnregisterBrokerResponse(new UnregisterBrokerResponseData(new ByteBufferAccessor(buffer),version));;
stop
end
start
note right
booleanshouldClientThrottle(shortversion)
end note
:return true;;
stop
end
@enduml

