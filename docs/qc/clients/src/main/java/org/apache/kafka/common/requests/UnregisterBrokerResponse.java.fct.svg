@startuml
!pragma layout smetana
start
note right
constructor UnregisterBrokerResponse(UnregisterBrokerResponseData data)
end note
:super (ApiKeys.UNREGISTER_BROKER);;
:this.data=data;;
end
start
note right
UnregisterBrokerResponseData data()
end note
:return data;;
stop
end
start
note right
int throttleTimeMs()
end note
:return data.throttleTimeMs();;
stop
end
start
note right
Map<Errors,Integer> errorCounts()
end note
:Map<Errors,Integer> errorCounts=new HashMap<>();;
if (data.errorCode()!=0) then (yes) 
:errorCounts.put(Errors.forCode(data.errorCode()),1);;
endif 
:return errorCounts;;
stop
end
start
note right
UnregisterBrokerResponse parse(ByteBuffer buffer,
short version)
end note
:return new UnregisterBrokerResponse(new UnregisterBrokerResponseData(new ByteBufferAccessor(buffer),
version));;
stop
end
start
note right
boolean shouldClientThrottle(short version)
end note
:return true;;
stop
end
@enduml

