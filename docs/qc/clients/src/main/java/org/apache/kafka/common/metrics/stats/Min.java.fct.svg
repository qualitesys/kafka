@startuml
!pragma layout smetana
start
note right
constructor Min()
end note
:super (Double.MAX_VALUE);;
end
start
note right
void update(Samplesample,MetricConfigconfig,
doublevalue,longnow)
end note
:sample.value=Math.min(sample.value,value);;
end
start
note right
doublecombine(List<Sample>samples,MetricConfigconfig,
longnow)
end note
:min=Math.min(min,sample.value);;
:count+=sample.eventCount;;
:return count==0? Double.NaN:min;;
stop
end
@enduml

