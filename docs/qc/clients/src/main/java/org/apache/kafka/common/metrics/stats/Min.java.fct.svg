@startuml
!pragma layout smetana
start
note right
constructor Min()
end note
:super (Double.MAX_VALUE);;
end
start
note right
void update(Sample sample,MetricConfig config,
double value,long now)
end note
:sample.value=Math.min(sample.value,value);;
end
start
note right
double combine(List<Sample> samples,MetricConfig config,
long now)
end note
:double min=Double.MAX_VALUE;;
:long count=0;;
:min=Math.min(min,sample.value);;
:count+=sample.eventCount;;
:return count==0? Double.NaN:min;;
stop
end
@enduml

