><polygon fill="#181818" points="375.5,413.0078,379.5,423.0078,383.5,413.0078,379.5,417.0078" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="379.5" x2="379.5" y1="576.9453" y2="596.9453"/><polygon fill="#181818" points="375.5,586.9453,379.5,596.9453,383.5,586.9453,379.5,590.9453" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[e901ad073464cac114b0fd7b5e27de77]
@startuml
!pragma layout smetana
start
note right
void configure(Map<String,? >configs,booleanisKey)
end note
if (encodingValue==null ) then (yes) 
:encodingValue=configs.get("serializer.encoding");
endif 
if (encodingValue instanceof String) then (yes) 
:encoding=(String)encodingValue;
endif 
end
start
note right
byte[]serialize(Stringtopic,UUIDdata)
end note
if (data==null ) then (yes) 
:return null ;;
stop
else (no)
:return data.toString().getBytes(encoding);;
stop
endif 
:throw new SerializationException("Error when serializing UUID to byte[] due to unsupported encoding "+encoding);;
end
@enduml

