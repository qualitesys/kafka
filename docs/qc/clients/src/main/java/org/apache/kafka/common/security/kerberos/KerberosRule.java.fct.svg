@startuml
!pragma layout smetana
start
note right
constructor KerberosRule(StringdefaultRealm)
end note
:this.defaultRealm=defaultRealm;
:isDefault=true;
:numOfComponents=0;
:format=null ;
:match=null ;
:fromPattern=null ;
:toPattern=null ;
:repeat=false;
:toLowerCase=false;
:toUpperCase=false;
end
start
note right
constructor KerberosRule(StringdefaultRealm,
intnumOfComponents,Stringformat,Stringmatch,
StringfromPattern,StringtoPattern,booleanrepeat,
booleantoLowerCase,booleantoUpperCase)
end note
:this.defaultRealm=defaultRealm;
:isDefault=false;
:this.numOfComponents=numOfComponents;
:this.format=format;
:this.match=match==null ? null :Pattern.compile(match);
:this.fromPattern=fromPattern==null ? null :Pattern.compile(fromPattern);
:this.toPattern=toPattern;
:this.repeat=repeat;
:this.toLowerCase=toLowerCase;
:this.toUpperCase=toUpperCase;
end
start
note right
StringtoString()
end note
if (isDefault) then (yes) 
:buf.append("DEFAULT");
else (no)
:buf.append("RULE:[");
:buf.append(numOfComponents);
:buf.append(':');
:buf.append(format);
:buf.append(']');
if (match!=null ) then (yes) 
:buf.append('(');
:buf.append(match);
:buf.append(')');
endif 
if (fromPattern!=null ) then (yes) 
:buf.append("s/");
:buf.append(fromPattern);
:buf.append('/');
:buf.append(toPattern);
:buf.append('/');
if (repeat) then (yes) 
:buf.append('g');
endif 
endif 
if (toLowerCase) then (yes) 
:buf.append("/L");
endif 
if (toUpperCase) then (yes) 
:buf.append("/U");
endif 
endif 
:return buf.toString();;
stop
end
start
note right
StringreplaceParameters(Stringformat,String[]params)
end note
while (start<format.length()&&match.find(start))
:result.append(match.group(1));
if (paramNum!=null ) then (yes) 
if (num<0||num>=params.length) then (yes) 
:throw new BadFormatString("index "+num+" from "+
format+" is outside of the valid range 0 to "+
(params.length-1));;
endif 
:result.append(params[num]);
:throw new BadFormatString("bad format in username mapping in "+
paramNum,nfe);;
endif 
:start=match.end();
endwhile
:return result.toString();;
stop
end
start
note right
StringreplaceSubstitution(Stringbase,Patternfrom,
Stringto,booleanrepeat)
end note
if (repeat) then (yes) 
:return match.replaceAll(to);;
stop
else (no)
:return match.replaceFirst(to);;
stop
endif 
end
start
note right
Stringapply(String[]params)
end note
if (isDefault) then (yes) 
if (defaultRealm.equals(params[0])) then (yes) 
:result=params[1];
endif 
endif 
if (result!=null &&NON_SIMPLE_PATTERN.matcher(result)
.find()) then (yes) 
:throw new NoMatchingRule("Non-simple name "+
result+" after auth_to_local rule "+this);;
endif 
if (toLowerCase&&result!=null ) then (yes) 
:result=result.toLowerCase(Locale.ENGLISH);
endif 
:return result;;
stop
end
@enduml

