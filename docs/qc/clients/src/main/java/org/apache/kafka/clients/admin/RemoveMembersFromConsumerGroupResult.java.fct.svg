@startuml
!pragma layout smetana
start
note right
constructor RemoveMembersFromConsumerGroupResult(KafkaFuture<Map<MemberIdentity,
Errors>>future,Set<MemberToRemove>memberInfos)
end note
end
start
note right
KafkaFuture<Void>all()
end note
:return result;;
stop
end
start
note right
KafkaFuture<Void>memberResult(MemberToRemovemember)
end note
if (removeAll()) then (yes) 
:throw new IllegalArgumentException("The method: memberResult is not applicable in 'removeAll' mode");;
endif 
if (!memberInfos.contains(member)) then (yes) 
:throw new IllegalArgumentException("Member "+
member+" was not included in the original request");;
endif 
:return result;;
stop
end
start
note right
booleanmaybeCompleteExceptionally(Map<MemberIdentity,
Errors>memberErrors,MemberIdentitymember,
KafkaFutureImpl<Void>result)
end note
if (exception!=null ) then (yes) 
:return true;;
stop
else (no)
:return false;;
stop
endif 
end
start
note right
booleanremoveAll()
end note
:return memberInfos.isEmpty();;
stop
end
@enduml

