@startuml
!pragma layout smetana
start
note right
constructor RecordDeserializationException(TopicPartition partition,
long offset,String message,Throwable cause)
end note
:super (message,cause);;
:this.partition=partition;;
:this.offset=offset;;
end
start
note right
TopicPartition topicPartition()
end note
:return partition;;
stop
end
start
note right
long offset()
end note
:return offset;;
stop
end
@enduml

