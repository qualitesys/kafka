constructor ListConsumerGroupsResult(KafkaFuture<Collection<Object>>future)
end note
:this.all=new KafkaFutureImpl<>();;
:this.valid=new KafkaFutureImpl<>();;
:this.errors=new KafkaFutureImpl<>();;
:future.thenApply(new KafkaFuture.BaseFunction<Collection<Object>,
Void>(){@Override public Voidapply(Collection<Object>results){ArrayList<Throwable>curErrors=new ArrayList<>();ArrayList<ConsumerGroupListing>curValid=new ArrayList<>();for (ObjectresultObject:results){if (resultObject instanceof Throwable){curErrors.add((Throwable)resultObject);}else {curValid.add((ConsumerGroupListing)resultObject);}}if (!curErrors.isEmpty()){all.completeExceptionally(curErrors.get(0));}else {all.complete(curValid);}valid.complete(curValid);errors.complete(curErrors);return null ;}});;
end
