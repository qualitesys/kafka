@startuml
!pragma layout smetana
start
note right
constructor TokenBucket()
end note
end
start
note right
constructor TokenBucket(TimeUnitunit)
end note
end
start
note right
doublemeasure(final MetricConfigconfig,final longtimeMs)
end note
if (config.quota()==null ) then (yes) 
:return Long.MAX_VALUE;;
stop
endif 
:return this.tokens;;
stop
end
start
note right
void record(final MetricConfigconfig,final doublevalue,
final longtimeMs)
end note
if (config.quota()==null ) then (yes) 
:return ;;
stop
endif 
end
start
note right
void refill(final doublequota,final doubleburst,
final longtimeMs)
end note
end
start
note right
doubleburst(final MetricConfigconfig)
end note
:return config.samples()*convert(config.timeWindowMs(),
unit)*config.quota().bound();;
stop
end
start
note right
StringtoString()
end note
:return "TokenBucket("+"unit="+unit+", tokens="+
tokens+", lastUpdateMs="+lastUpdateMs+')';;
stop
end
@enduml

