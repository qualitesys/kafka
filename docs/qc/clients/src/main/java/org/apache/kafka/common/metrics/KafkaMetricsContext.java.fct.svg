@startuml
!pragma layout smetana
start
note right
constructor KafkaMetricsContext(Stringnamespace)
end note
:this(namespace,new HashMap<>());
end
start
note right
constructor KafkaMetricsContext(Stringnamespace,Map<String,? >contextLabels)
end note
:this.contextLabels.put(MetricsContext.NAMESPACE,
namespace);
:contextLabels.forEach((key,value)->this.contextLabels.put(key,
value!=null ? value.toString():null ));
end
start
note right
Map<String,String>contextLabels()
end note
:return Collections.unmodifiableMap(contextLabels);;
stop
end
@enduml

