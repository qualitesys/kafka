" x2="218.5" y1="247.3047" y2="267.3047"/><polygon fill="#181818" points="214.5,257.3047,218.5,267.3047,222.5,257.3047,218.5,261.3047" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="218.5" x2="218.5" y1="315.2422" y2="335.2422"/><polygon fill="#181818" points="214.5,325.2422,218.5,335.2422,222.5,325.2422,218.5,329.2422" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="218.5" x2="218.5" y1="387.8086" y2="410.375"/><polygon fill="#181818" points="214.5,400.375,218.5,410.375,222.5,400.375,218.5,404.375" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="218.5" x2="218.5" y1="444.3438" y2="464.3438"/><polygon fill="#181818" points="214.5,454.3438,218.5,464.3438,222.5,454.3438,218.5,458.3438" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[fd9976d4d65d8f2a8c3ce4bacbb036d1]
@startuml
!pragma layout smetana
start
note right
constructor KafkaMetricsContext(String namespace)
end note
:this(namespace,new HashMap<>());;
end
start
note right
constructor KafkaMetricsContext(String namespace,
Map<String,?> contextLabels)
end note
:this.contextLabels.put(MetricsContext.NAMESPACE,
namespace);;
:contextLabels.forEach((key,value)->this.contextLabels.put(key,
value!=null ? value.toString():null ));;
end
start
note right
Map<String,String> contextLabels()
end note
:return Collections.unmodifiableMap(contextLabels);;
stop
end
@enduml

