3047,329,361.3047" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="329" x2="329" y1="401.2734" y2="421.2734"/><polygon fill="#181818" points="325,411.2734,329,421.2734,333,411.2734,329,415.2734" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[3cfd6e51225de627d4f665eb753dfe07]
@startuml
!pragma layout smetana
start
note right
constructor KafkaMetricsContext(Stringnamespace)
end note
:this(namespace,new HashMap<>());
end
start
note right
constructor KafkaMetricsContext(Stringnamespace,Map<String,? >contextLabels)
end note
:this.contextLabels.put(MetricsContext.NAMESPACE,namespace);
:contextLabels.forEach((key,value)->this.contextLabels.put(key,value!=null ? value.toString():null ));
end
start
note right
Map<String,String>contextLabels()
end note
:return Collections.unmodifiableMap(contextLabels);;
stop
end
@enduml

