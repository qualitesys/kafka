@startuml
!pragma layout smetana
start
note right
constructor Builder(DescribeClusterRequestData data)
end note
:super (ApiKeys.DESCRIBE_CLUSTER);;
:this.data=data;;
end
start
note right
DescribeClusterRequest build(final short version)
end note
:return new DescribeClusterRequest(data,version);;
stop
end
start
note right
String toString()
end note
:return data.toString();;
stop
end
start
note right
constructor DescribeClusterRequest(DescribeClusterRequestData data,
short version)
end note
:super (ApiKeys.DESCRIBE_CLUSTER,version);;
:this.data=data;;
end
start
note right
DescribeClusterRequestData data()
end note
:return data;;
stop
end
start
note right
AbstractResponse getErrorResponse(final int throttleTimeMs,
final Throwable e)
end note
:ApiError apiError=ApiError.fromThrowable(e);;
:return new DescribeClusterResponse(new DescribeClusterResponseData()
.setErrorCode(apiError.error().code()).setErrorMessage(apiError.message()));;
stop
end
start
note right
String toString(final boolean verbose)
end note
:return data.toString();;
stop
end
start
note right
DescribeClusterRequest parse(ByteBuffer buffer,
short version)
end note
:return new DescribeClusterRequest(new DescribeClusterRequestData(new ByteBufferAccessor(buffer),
version),version);;
stop
end
@enduml

