@startuml
!pragma layout smetana
start
note right
constructor Builder(DescribeClusterRequestDatadata)
end note
end
start
note right
DescribeClusterRequestbuild(final shortversion)
end note
:return new DescribeClusterRequest(data,version);;
stop
end
start
note right
StringtoString()
end note
:return data.toString();;
stop
end
start
note right
constructor DescribeClusterRequest(DescribeClusterRequestDatadata,
shortversion)
end note
end
start
note right
DescribeClusterRequestDatadata()
end note
:return data;;
stop
end
start
note right
AbstractResponsegetErrorResponse(final intthrottleTimeMs,
final Throwablee)
end note
:return new DescribeClusterResponse(new DescribeClusterResponseData()
.setErrorCode(apiError.error().code()).setErrorMessage(apiError.message()));;
stop
end
start
note right
StringtoString(final booleanverbose)
end note
:return data.toString();;
stop
end
start
note right
DescribeClusterRequestparse(ByteBufferbuffer,
shortversion)
end note
:return new DescribeClusterRequest(new DescribeClusterRequestData(new ByteBufferAccessor(buffer),
version),version);;
stop
end
@enduml

