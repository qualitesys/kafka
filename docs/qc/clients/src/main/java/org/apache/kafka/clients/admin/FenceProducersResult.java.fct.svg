@startuml
!pragma layout smetana
start
note right
constructor FenceProducersResult(Map<CoordinatorKey,KafkaFuture<ProducerIdAndEpoch>>futures)
end note
:this.futures=futures;
end
start
note right
Map<String,KafkaFuture<Void>>fencedProducers()
end note
:return futures.entrySet().stream().collect(Collectors.toMap(e->e.getKey()
.idValue,e->e.getValue().thenApply(p->null )));;
stop
end
start
note right
KafkaFuture<Long>producerId(StringtransactionalId)
end note
:return findAndApply(transactionalId,p->p.producerId);;
stop
end
start
note right
KafkaFuture<Short>epochId(StringtransactionalId)
end note
:return findAndApply(transactionalId,p->p.epoch);;
stop
end
start
note right
KafkaFuture<Void>all()
end note
:return KafkaFuture.allOf(futures.values()
.toArray(new KafkaFuture[0]));;
stop
end
if (future==null ) then (yes) 
:throw new IllegalArgumentException("TransactionalId "+
"`"+transactionalId+"` was not included in the request");;
endif 
:return future.thenApply(followup);;
stop
@enduml

