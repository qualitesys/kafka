@startuml
!pragma layout smetana
start
note right
constructor TimestampSpec(longtimestamp)
end note
end
start
note right
longtimestamp()
end note
:return timestamp;;
stop
end
start
note right
OffsetSpeclatest()
end note
:return new LatestSpec();;
stop
end
start
note right
OffsetSpecearliest()
end note
:return new EarliestSpec();;
stop
end
start
note right
OffsetSpecforTimestamp(longtimestamp)
end note
:return new TimestampSpec(timestamp);;
stop
end
start
note right
OffsetSpecmaxTimestamp()
end note
:return new MaxTimestampSpec();;
stop
end
@enduml

