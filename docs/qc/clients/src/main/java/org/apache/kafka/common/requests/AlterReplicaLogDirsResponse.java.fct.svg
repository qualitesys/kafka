@startuml
!pragma layout smetana
start
note right
constructor AlterReplicaLogDirsResponse(AlterReplicaLogDirsResponseData data)
end note
:super (ApiKeys.ALTER_REPLICA_LOG_DIRS);;
:this.data=data;;
end
start
note right
AlterReplicaLogDirsResponseData data()
end note
:return data;;
stop
end
start
note right
int throttleTimeMs()
end note
:return data.throttleTimeMs();;
stop
end
start
note right
Map<Errors,Integer> errorCounts()
end note
:Map<Errors,Integer> errorCounts=new HashMap<>();;
:data.results().forEach(topicResult->topicResult.partitions().forEach(partitionResult->updateErrorCounts(errorCounts,
Errors.forCode(partitionResult.errorCode()))));;
:return errorCounts;;
stop
end
start
note right
AlterReplicaLogDirsResponse parse(ByteBuffer buffer,
short version)
end note
:return new AlterReplicaLogDirsResponse(new AlterReplicaLogDirsResponseData(new ByteBufferAccessor(buffer),
version));;
stop
end
start
note right
boolean shouldClientThrottle(short version)
end note
:return version>=1;;
stop
end
@enduml

