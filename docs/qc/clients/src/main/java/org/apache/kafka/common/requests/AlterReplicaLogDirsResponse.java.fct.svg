@startuml
!pragma layout smetana
start
note right
constructor AlterReplicaLogDirsResponse(AlterReplicaLogDirsResponseDatadata)
end note
:super (ApiKeys.ALTER_REPLICA_LOG_DIRS);
:this.data=data;
end
start
note right
AlterReplicaLogDirsResponseDatadata()
end note
:return data;;
stop
end
start
note right
intthrottleTimeMs()
end note
:return data.throttleTimeMs();;
stop
end
start
note right
Map<Errors,Integer>errorCounts()
end note
:data.results().forEach(topicResult->topicResult.partitions().forEach(partitionResult->updateErrorCounts(errorCounts,Errors.forCode(partitionResult.errorCode()))));
:return errorCounts;;
stop
end
start
note right
AlterReplicaLogDirsResponseparse(ByteBufferbuffer,
shortversion)
end note
:return new AlterReplicaLogDirsResponse(new AlterReplicaLogDirsResponseData(new ByteBufferAccessor(buffer),version));;
stop
end
start
note right
booleanshouldClientThrottle(shortversion)
end note
:return version>=1;;
stop
end
@enduml

