766,350.5,645.4766,346.5,649.4766" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="346.5" x2="346.5" y1="689.4453" y2="709.4453"/><polygon fill="#181818" points="342.5,699.4453,346.5,709.4453,350.5,699.4453,346.5,703.4453" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="346.5" x2="346.5" y1="743.4141" y2="763.4141"/><polygon fill="#181818" points="342.5,753.4141,346.5,763.4141,350.5,753.4141,346.5,757.4141" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="346.5" x2="346.5" y1="815.9805" y2="838.5469"/><polygon fill="#181818" points="342.5,828.5469,346.5,838.5469,350.5,828.5469,346.5,832.5469" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[a14e0618076e59511873e3ef26a7bb16]
@startuml
!pragma layout smetana
start
note right
void configure(Map<String,? >configs,Stringmechanism,
List<AppConfigurationEntry>jaasConfigEntries)
end note
:this.mechanism=mechanism;;
end
start
note right
void handle(Callback[]callbacks)
end note
if (callback instanceof RealmCallback) then (yes) 
:handleRealmCallback((RealmCallback)callback);;
else (no)
:throw new UnsupportedCallbackException(callback);;
stop
endif 
end
start
note right
void handleRealmCallback(RealmCallbackrc)
end note
:LOG.trace("Client supplied realm: {} ",rc.getDefaultText());;
:rc.setText(rc.getDefaultText());;
end
start
note right
void handleAuthorizeCallback(AuthorizeCallbackac)
end note
:LOG.info("Successfully authenticated client: authenticationID={}; authorizationID={}.",
authenticationID,authorizationID);;
:ac.setAuthorized(true);;
:ac.setAuthorizedID(authenticationID);;
end
start
note right
void close()
end note
end
@enduml

