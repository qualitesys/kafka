"681.709"/><polygon fill="#181818" points="639,671.709,643,681.709,647,671.709,643,675.709" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="643" x2="643" y1="715.6777" y2="735.6777"/><polygon fill="#181818" points="639,725.6777,643,735.6777,647,725.6777,643,729.6777" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="643" x2="643" y1="783.6152" y2="803.6152"/><polygon fill="#181818" points="639,793.6152,643,803.6152,647,793.6152,643,797.6152" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="643" x2="643" y1="837.584" y2="857.584"/><polygon fill="#181818" points="639,847.584,643,857.584,647,847.584,643,851.584" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="643" x2="643" y1="891.5527" y2="911.5527"/><polygon fill="#181818" points="639,901.5527,643,911.5527,647,901.5527,643,905.5527" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="643" x2="643" y1="964.1191" y2="986.6855"/><polygon fill="#181818" points="639,976.6855,643,986.6855,647,976.6855,643,980.6855" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[5529f34de1d9e26e8e0538dad324c670]
@startuml
!pragma layout smetana
start
note right
void configure(Map<String,? >configs,Stringmechanism,
List<AppConfigurationEntry>jaasConfigEntries)
end note
:this.mechanism=mechanism;;
end
start
note right
void handle(Callback[]callbacks)
end note
if (callback instanceof RealmCallback) then (yes) 
:handleRealmCallback((RealmCallback)callback);;
else if (callback instanceof AuthorizeCallback&&mechanism.equals(SaslConfigs.GSSAPI_MECHANISM)) then (yes) 
:handleAuthorizeCallback((AuthorizeCallback)callback);;
else (no)
:throw new UnsupportedCallbackException(callback);;
stop
endif 
end
start
note right
void handleRealmCallback(RealmCallbackrc)
end note
:LOG.trace("Client supplied realm: {} ",rc.getDefaultText());;
:rc.setText(rc.getDefaultText());;
end
start
note right
void handleAuthorizeCallback(AuthorizeCallbackac)
end note
:StringauthenticationID=ac.getAuthenticationID();;
:StringauthorizationID=ac.getAuthorizationID();;
:LOG.info("Successfully authenticated client: authenticationID={}; authorizationID={}.",
authenticationID,authorizationID);;
:ac.setAuthorized(true);;
:ac.setAuthorizedID(authenticationID);;
end
start
note right
void close()
end note
end
@enduml

