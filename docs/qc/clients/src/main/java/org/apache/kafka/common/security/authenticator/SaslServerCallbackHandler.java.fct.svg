1.709" y2="681.709"/><polygon fill="#181818" points="643,671.709,647,681.709,651,671.709,647,675.709" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="647" x2="647" y1="715.6777" y2="735.6777"/><polygon fill="#181818" points="643,725.6777,647,735.6777,651,725.6777,647,729.6777" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="647" x2="647" y1="783.6152" y2="803.6152"/><polygon fill="#181818" points="643,793.6152,647,803.6152,651,793.6152,647,797.6152" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="647" x2="647" y1="837.584" y2="857.584"/><polygon fill="#181818" points="643,847.584,647,857.584,651,847.584,647,851.584" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="647" x2="647" y1="891.5527" y2="911.5527"/><polygon fill="#181818" points="643,901.5527,647,911.5527,651,901.5527,647,905.5527" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="647" x2="647" y1="964.1191" y2="986.6855"/><polygon fill="#181818" points="643,976.6855,647,986.6855,651,976.6855,647,980.6855" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[9c092be3fdea44761102e008efca102e]
@startuml
!pragma layout smetana
start
note right
void configure(Map<String,?> configs,String mechanism,
List<AppConfigurationEntry> jaasConfigEntries)
end note
:this.mechanism=mechanism;;
end
start
note right
void handle(Callback[] callbacks)
end note
if (callback instanceof RealmCallback ) then (yes) 
:handleRealmCallback((RealmCallback )callback);;
else if (callback instanceof AuthorizeCallback &&mechanism.equals(SaslConfigs.GSSAPI_MECHANISM)) then (yes) 
:handleAuthorizeCallback((AuthorizeCallback )callback);;
else (no)
:throw new UnsupportedCallbackException(callback);;
stop
endif 
end
start
note right
void handleRealmCallback(RealmCallback rc)
end note
:LOG.trace("Client supplied realm: {} ",rc.getDefaultText());;
:rc.setText(rc.getDefaultText());;
end
start
note right
void handleAuthorizeCallback(AuthorizeCallback ac)
end note
:String authenticationID=ac.getAuthenticationID();;
:String authorizationID=ac.getAuthorizationID();;
:LOG.info("Successfully authenticated client: authenticationID={}; authorizationID={}.",
authenticationID,authorizationID);;
:ac.setAuthorized(true);;
:ac.setAuthorizedID(authenticationID);;
end
start
note right
void close()
end note
end
@enduml

