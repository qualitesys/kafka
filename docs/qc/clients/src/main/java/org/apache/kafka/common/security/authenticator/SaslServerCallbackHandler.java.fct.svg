@startuml
!pragma layout smetana
start
note right
void configure(Map<String,? >configs,Stringmechanism,
List<AppConfigurationEntry>jaasConfigEntries)
end note
end
start
note right
void handle(Callback[]callbacks)
end note
if (callback instanceof RealmCallback) then (yes) 
else (no)
:throw new UnsupportedCallbackException(callback);;
endif 
end
start
note right
void handleRealmCallback(RealmCallbackrc)
end note
end
start
note right
void handleAuthorizeCallback(AuthorizeCallbackac)
end note
end
start
note right
void close()
end note
end
@enduml

