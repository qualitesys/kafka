-size="14" font-weight="bold" lengthAdjust="spacing" textLength="106" x="10" y="355.6094">Syntax Error?</text><!--MD5=[1da8f38db5a5773407dbf698fd6dd506]
@startuml
!pragma layout smetana
start
note right
AccessTokenRetrievercreate(Map<String,? >configs,
Map<String,Object>jaasConfig)
end note
:return create(configs,null ,jaasConfig);;
stop
end
start
note right
AccessTokenRetrievercreate(Map<String,? >configs,
StringsaslMechanism,Map<String,Object>jaasConfig)
end note
if (tokenEndpointUrl.getProtocol().toLowerCase(Locale.ROOT)
.equals("file")) then (yes) 
:return new FileTokenRetriever(cu.validateFile(SASL_OAUTHBEARER_TOKEN_ENDPOINT_URL));;
stop
else (no)
if (jou.shouldCreateSSLSocketFactory(tokenEndpointUrl)) then (yes) 
:sslSocketFactory=jou.createSSLSocketFactory();
endif 
:return new HttpAccessTokenRetriever(clientId,
clientSecret,scope,sslSocketFactory,tokenEndpointUrl.toString(),
cu.validateLong(SASL_LOGIN_RETRY_BACKOFF_MS),
cu.validateLong(SASL_LOGIN_RETRY_BACKOFF_MAX_MS),
cu.validateInteger(SASL_LOGIN_CONNECT_TIMEOUT_MS,
false),cu.validateInteger(SASL_LOGIN_READ_TIMEOUT_MS,
false));;
stop
endif 
end
@enduml

