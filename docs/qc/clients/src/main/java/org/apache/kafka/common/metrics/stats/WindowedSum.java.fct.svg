@startuml
!pragma layout smetana
start
note right
constructor WindowedSum()
end note
:super (0);;
end
start
note right
void update(Samplesample,MetricConfigconfig,
doublevalue,longnow)
end note
:sample.value+=value;;
end
start
note right
doublecombine(List<Sample>samples,MetricConfigconfig,
longnow)
end note
:total+=sample.value;;
:return total;;
stop
end
@enduml

