@startuml
!pragma layout smetana
start
note right
constructor AccessControlEntryFilter(Stringprincipal,
Stringhost,AclOperationoperation,AclPermissionTypepermissionType)
end note
:Objects.requireNonNull(operation);
:Objects.requireNonNull(permissionType);
:this.data=new AccessControlEntryData(principal,
host,operation,permissionType);
end
start
note right
constructor AccessControlEntryFilter(AccessControlEntryDatadata)
end note
:this.data=data;
end
start
note right
Stringprincipal()
end note
:return data.principal();;
stop
end
start
note right
Stringhost()
end note
:return data.host();;
stop
end
start
note right
AclOperationoperation()
end note
:return data.operation();;
stop
end
start
note right
AclPermissionTypepermissionType()
end note
:return data.permissionType();;
stop
end
start
note right
StringtoString()
end note
:return data.toString();;
stop
end
start
note right
booleanisUnknown()
end note
:return data.isUnknown();;
stop
end
start
note right
booleanmatches(AccessControlEntryother)
end note
if ((principal()!=null )&&(!principal().equals(other.principal()))) then (yes) 
:return false;;
stop
endif 
if ((host()!=null )&&(!host().equals(other.host()))) then (yes) 
:return false;;
stop
endif 
if ((operation()!=AclOperation.ANY)&&(!operation()
.equals(other.operation()))) then (yes) 
:return false;;
stop
endif 
:return (permissionType()==AclPermissionType.ANY)||(permissionType()
.equals(other.permissionType()));;
stop
end
start
note right
booleanmatchesAtMostOne()
end note
:return findIndefiniteField()==null ;;
stop
end
start
note right
StringfindIndefiniteField()
end note
:return data.findIndefiniteField();;
stop
end
start
note right
booleanequals(Objecto)
end note
if (!(o instanceof AccessControlEntryFilter)) then (yes) 
:return false;;
stop
endif 
:return data.equals(other.data);;
stop
end
start
note right
inthashCode()
end note
:return data.hashCode();;
stop
end
@enduml

