8" points="266.5,550.4063,270.5,560.4063,274.5,550.4063,270.5,554.4063" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[9c239e6168c6697c8fb7a9a0084fae1a]
@startuml
!pragma layout smetana
start
note right
constructor ListTopicsResult(KafkaFuture<Map<String,TopicListing>>future)
end note
:this.future=future;
end
start
note right
KafkaFuture<Map<String,TopicListing>>namesToListings()
end note
:return future;;
stop
end
start
note right
KafkaFuture<Collection<TopicListing>>listings()
end note
:return future.thenApply(namesToDescriptions->namesToDescriptions.values());;
stop
end
start
note right
KafkaFuture<Set<String>>names()
end note
:return future.thenApply(namesToListings->namesToListings.keySet());;
stop
end
@enduml

