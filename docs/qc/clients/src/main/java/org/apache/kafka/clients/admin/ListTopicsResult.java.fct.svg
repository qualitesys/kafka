;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="270.5" x2="270.5" y1="555.5391" y2="575.5391"/><polygon fill="#181818" points="266.5,565.5391,270.5,575.5391,274.5,565.5391,270.5,569.5391" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[85a2be1ce18c9033156f17de772cc6e5]
@startuml
!pragma layout smetana
start
note right
constructor ListTopicsResult(KafkaFuture<Map<String,
TopicListing>>future)
end note
:this.future=future;
end
start
note right
KafkaFuture<Map<String,TopicListing>>namesToListings()
end note
:return future;;
stop
end
start
note right
KafkaFuture<Collection<TopicListing>>listings()
end note
:return future.thenApply(namesToDescriptions->namesToDescriptions.values());;
stop
end
start
note right
KafkaFuture<Set<String>>names()
end note
:return future.thenApply(namesToListings->namesToListings.keySet());;
stop
end
@enduml

