eb74c46ce6e978d]
@startuml
!pragma layout smetana
start
note right
int totalSize()
end note
:return totalSize;;
stop
end
start
note right
int sizeExcludingZeroCopy()
end note
:return totalSize-zeroCopySize;;
stop
end
start
note right
int zeroCopySize()
end note
:return zeroCopySize;;
stop
end
start
note right
void addZeroCopyBytes(int size)
end note
:zeroCopySize+=size;;
:totalSize+=size;;
end
start
note right
void addBytes(int size)
end note
:totalSize+=size;;
end
start
note right
void add(MessageSizeAccumulator size)
end note
:this.totalSize+=size.totalSize;;
:this.zeroCopySize+=size.zeroCopySize;;
end
@enduml

