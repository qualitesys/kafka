@startuml
!pragma layout smetana
if (Java.IS_JAVA9_COMPATIBLE) then (yes) 
:CHECKSUM_FACTORY=new Java9ChecksumFactory();
else (no)
:CHECKSUM_FACTORY=new PureJavaChecksumFactory();
endif 
start
note right
constructor Crc32C()
end note
end
start
note right
longcompute(byte[]bytes,intoffset,intsize)
end note
:crc.update(bytes,offset,size);
:return crc.getValue();;
stop
end
start
note right
longcompute(ByteBufferbuffer,intoffset,intsize)
end note
:Checksums.update(crc,buffer,offset,size);
:return crc.getValue();;
stop
end
start
note right
Checksumcreate()
end note
:return CHECKSUM_FACTORY.create();;
stop
end
:CONSTRUCTOR=MethodHandles.publicLookup().findConstructor(cls,MethodType.methodType(void .class ));
start
note right
Checksumcreate()
end note
:return (Checksum)CONSTRUCTOR.invoke();;
stop
end
start
note right
Checksumcreate()
end note
:return new PureJavaCrc32C();;
stop
end
@enduml

