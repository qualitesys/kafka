@startuml
!pragma layout smetana
start
note right
constructor CreateTopicsResponse(CreateTopicsResponseData data)
end note
:super (ApiKeys.CREATE_TOPICS);;
:this.data=data;;
end
start
note right
CreateTopicsResponseData data()
end note
:return data;;
stop
end
start
note right
int throttleTimeMs()
end note
:return data.throttleTimeMs();;
stop
end
start
note right
Map<Errors,Integer> errorCounts()
end note
:HashMap<Errors,Integer> counts=new HashMap<>();;
:data.topics().forEach(result->updateErrorCounts(counts,
Errors.forCode(result.errorCode())));;
:return counts;;
stop
end
start
note right
CreateTopicsResponse parse(ByteBuffer buffer,
short version)
end note
:return new CreateTopicsResponse(new CreateTopicsResponseData(new ByteBufferAccessor(buffer),
version));;
stop
end
start
note right
boolean shouldClientThrottle(short version)
end note
:return version>=3;;
stop
end
@enduml

