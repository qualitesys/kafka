@startuml
!pragma layout smetana
start
note right
constructor CreateTopicsResponse(CreateTopicsResponseDatadata)
end note
:super (ApiKeys.CREATE_TOPICS);
:this.data=data;
end
start
note right
CreateTopicsResponseDatadata()
end note
:return data;;
stop
end
start
note right
intthrottleTimeMs()
end note
:return data.throttleTimeMs();;
stop
end
start
note right
Map<Errors,Integer>errorCounts()
end note
:data.topics().forEach(result->updateErrorCounts(counts,
Errors.forCode(result.errorCode())));
:return counts;;
stop
end
start
note right
CreateTopicsResponseparse(ByteBufferbuffer,shortversion)
end note
:return new CreateTopicsResponse(new CreateTopicsResponseData(new ByteBufferAccessor(buffer),version));;
stop
end
start
note right
booleanshouldClientThrottle(shortversion)
end note
:return version>=3;;
stop
end
@enduml

