@startuml
!pragma layout smetana
start
note right
constructor DescribeConsumerGroupsResult(final Map<String,KafkaFuture<ConsumerGroupDescription>>futures)
end note
:this.futures=futures;
end
start
note right
Map<String,KafkaFuture<ConsumerGroupDescription>>describedGroups()
end note
:futures.forEach((key,future)->describedGroups.put(key,
future));
:return describedGroups;;
stop
end
start
note right
KafkaFuture<Map<String,ConsumerGroupDescription>>all()
end note
:return KafkaFuture.allOf(futures.values()
.toArray(new KafkaFuture[0])).thenApply(nil->{Map<String,
ConsumerGroupDescription>descriptions=new HashMap<>(futures.size());futures.forEach((key,future)->{try {descriptions.put(key,future.get());}catch (InterruptedException|ExecutionExceptione){throw new RuntimeException(e);}});return descriptions;});;
stop
end
@enduml

