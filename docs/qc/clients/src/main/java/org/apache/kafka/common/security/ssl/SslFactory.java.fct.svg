@startuml
!pragma layout smetana
start
note right
constructor SslFactory(Modemode)
end note
:this(mode,null ,false);;
end
start
note right
constructor SslFactory(Modemode,StringclientAuthConfigOverride,
booleankeystoreVerifiableUsingTruststore)
end note
:this.mode=mode;;
:this.clientAuthConfigOverride=clientAuthConfigOverride;;
:this.keystoreVerifiableUsingTruststore=keystoreVerifiableUsingTruststore;;
end
start
note right
void configure(Map<String,? >configs)
end note
if (sslEngineFactory!=null ) then (yes) 
:throw new IllegalStateException("SslFactory was already configured.");;
stop
endif 
:this.endpointIdentification=(String)configs.get(SslConfigs.SSL_ENDPOINT_IDENTIFICATION_ALGORITHM_CONFIG);;
:Map<String,Object>nextConfigs=(Map<String,
Object>)configs;;
if (clientAuthConfigOverride!=null ) then (yes) 
:nextConfigs.put(BrokerSecurityConfigs.SSL_CLIENT_AUTH_CONFIG,
clientAuthConfigOverride);;
endif 
:SslEngineFactorybuilder=instantiateSslEngineFactory(nextConfigs);;
if (keystoreVerifiableUsingTruststore) then (yes) 
:try ;
:SslEngineValidator.validate(builder,builder);;
:catch (Exceptione);
:throw new ConfigException("A client SSLEngine created with the provided settings "+
"can't connect to a server SSLEngine created with those settings.",e);;
stop
endif 
:this.sslEngineFactory=builder;;
end
start
note right
Set<String>reconfigurableConfigs()
end note
:return sslEngineFactory.reconfigurableConfigs();;
stop
end
start
note right
void validateReconfiguration(Map<String,? >newConfigs)
end note
:createNewSslEngineFactory(newConfigs);;
end
start
note right
void reconfigure(Map<String,? >newConfigs)
end note
:SslEngineFactorynewSslEngineFactory=createNewSslEngineFactory(newConfigs);;
if (newSslEngineFactory!=this.sslEngineFactory) then (yes) 
:Utils.closeQuietly(this.sslEngineFactory,
"close stale ssl engine factory");;
:this.sslEngineFactory=newSslEngineFactory;;
:log.info("Created new {} SSL engine builder with keystore {} truststore {}",
mode,newSslEngineFactory.keystore(),newSslEngineFactory.truststore());;
endif 
end
start
note right
SslEngineFactoryinstantiateSslEngineFactory(Map<String,
Object>configs)
end note
:@SuppressWarnings ("unchecked")Class<?  extends SslEngineFactory>sslEngineFactoryClass=(Class<?  extends SslEngineFactory>)configs.get(SslConfigs.SSL_ENGINE_FACTORY_CLASS_CONFIG);;
:SslEngineFactorysslEngineFactory;;
if (sslEngineFactoryClass==null ) then (yes) 
:sslEngineFactory=new DefaultSslEngineFactory();;
else (no)
:sslEngineFactory=Utils.newInstance(sslEngineFactoryClass);;
endif 
:sslEngineFactory.configure(configs);;
:this.sslEngineFactoryConfig=configs;;
:return sslEngineFactory;;
stop
end
start
note right
SslEngineFactorycreateNewSslEngineFactory(Map<String,
? >newConfigs)
end note
if (sslEngineFactory==null ) then (yes) 
:throw new IllegalStateException("SslFactory has not been configured.");;
stop
endif 
:Map<String,Object>nextConfigs=new HashMap<>(sslEngineFactoryConfig);;
:copyMapEntries(nextConfigs,newConfigs,reconfigurableConfigs());;
if (clientAuthConfigOverride!=null ) then (yes) 
:nextConfigs.put(BrokerSecurityConfigs.SSL_CLIENT_AUTH_CONFIG,
clientAuthConfigOverride);;
endif 
if (!sslEngineFactory.shouldBeRebuilt(nextConfigs)) then (yes) 
:return sslEngineFactory;;
stop
endif 
:try ;
:SslEngineFactorynewSslEngineFactory=instantiateSslEngineFactory(nextConfigs);;
if (sslEngineFactory.keystore()==null ) then (yes) 
if (newSslEngineFactory.keystore()!=null ) then (yes) 
:throw new ConfigException("Cannot add SSL keystore to an existing listener for "+
"which no keystore was configured.");;
stop
endif 
else (no)
if (newSslEngineFactory.keystore()==null ) then (yes) 
:throw new ConfigException("Cannot remove the SSL keystore from an existing listener for "+
"which a keystore was configured.");;
stop
endif 
:CertificateEntries.ensureCompatible(newSslEngineFactory.keystore(),
sslEngineFactory.keystore());;
endif 
if (sslEngineFactory.truststore()==null &&newSslEngineFactory.truststore()!=null ) then (yes) 
:throw new ConfigException("Cannot add SSL truststore to an existing listener for which no "+
"truststore was configured.");;
stop
endif 
if (keystoreVerifiableUsingTruststore) then (yes) 
if (sslEngineFactory.truststore()!=null ||sslEngineFactory.keystore()!=null ) then (yes) 
:SslEngineValidator.validate(sslEngineFactory,
newSslEngineFactory);;
endif 
endif 
:return newSslEngineFactory;;
stop
:catch (Exceptione);
:log.debug("Validation of dynamic config update of SSLFactory failed.",e);;
:throw new ConfigException("Validation of dynamic config update of SSLFactory failed: "+e);;
stop
end
start
note right
SSLEnginecreateSslEngine(Socketsocket)
end note
:return createSslEngine(peerHost(socket),
socket.getPort());;
stop
end
start
note right
SSLEnginecreateSslEngine(StringpeerHost,intpeerPort)
end note
if (sslEngineFactory==null ) then (yes) 
:throw new IllegalStateException("SslFactory has not been configured.");;
stop
endif 
if (mode==Mode.SERVER) then (yes) 
:return sslEngineFactory.createServerSslEngine(peerHost,
peerPort);;
stop
else (no)
:return sslEngineFactory.createClientSslEngine(peerHost,
peerPort,endpointIdentification);;
stop
endif 
end
start
note right
StringpeerHost(Socketsocket)
end note
:return new InetSocketAddress(socket.getInetAddress(),
0).getHostString();;
stop
end
start
note right
SslEngineFactorysslEngineFactory()
end note
:return sslEngineFactory;;
stop
end
:copyMapEntry(destMap,srcMap,k);;
if (srcMap.containsKey(key)) then (yes) 
:destMap.put(key,srcMap.get(key));;
endif 
start
note right
void close()
end note
:Utils.closeQuietly(sslEngineFactory,"close engine factory");;
end
start
note right
List<CertificateEntries>create(KeyStorekeystore)
end note
:Enumeration<String>aliases=keystore.aliases();;
:List<CertificateEntries>entries=new ArrayList<>();;
while (aliases.hasMoreElements())
:Stringalias=aliases.nextElement();;
:Certificatecert=keystore.getCertificate(alias);;
if (cert instanceof X509Certificate) then (yes) 
:entries.add(new CertificateEntries(alias,
(X509Certificate)cert));;
endif 
endwhile
:return entries;;
stop
end
start
note right
void ensureCompatible(KeyStorenewKeystore,
KeyStoreoldKeystore)
end note
:List<CertificateEntries>newEntries=CertificateEntries.create(newKeystore);;
:List<CertificateEntries>oldEntries=CertificateEntries.create(oldKeystore);;
if (newEntries.size()!=oldEntries.size()) then (yes) 
:throw new ConfigException(String.format("Keystore entries do not match,
 existing store contains %d entries, new store contains %d entries",
oldEntries.size(),newEntries.size()));;
stop
endif 
:CertificateEntriesnewEntry=newEntries.get(i);;
:CertificateEntriesoldEntry=oldEntries.get(i);;
if (!Objects.equals(newEntry.subjectPrincipal,
oldEntry.subjectPrincipal)) then (yes) 
:throw new ConfigException(String.format("Keystore DistinguishedName does not match: "+
" existing={alias=%s, DN=%s}, new={alias=%s,
 DN=%s}",oldEntry.alias,oldEntry.subjectPrincipal,
newEntry.alias,newEntry.subjectPrincipal));;
stop
endif 
if (!newEntry.subjectAltNames.containsAll(oldEntry.subjectAltNames)) then (yes) 
:throw new ConfigException(String.format("Keystore SubjectAltNames do not match: "+
" existing={alias=%s, SAN=%s}, new={alias=%s,
 SAN=%s}",oldEntry.alias,oldEntry.subjectAltNames,
newEntry.alias,newEntry.subjectAltNames));;
stop
endif 
end
start
note right
constructor CertificateEntries(Stringalias,
X509Certificatecert)
end note
:this.alias=alias;;
:this.subjectPrincipal=cert.getSubjectX500Principal();;
:Collection<List<? >>altNames=cert.getSubjectAlternativeNames();;
:this.subjectAltNames=altNames!=null ? new HashSet<>(altNames):Collections.emptySet();;
end
start
note right
inthashCode()
end note
:return Objects.hash(subjectPrincipal,subjectAltNames);;
stop
end
start
note right
booleanequals(Objectobj)
end note
if (!(obj instanceof CertificateEntries)) then (yes) 
:return false;;
stop
endif 
:CertificateEntriesother=(CertificateEntries)obj;;
:return Objects.equals(subjectPrincipal,other.subjectPrincipal)&&Objects.equals(subjectAltNames,
other.subjectAltNames);;
stop
end
start
note right
StringtoString()
end note
:return "subjectPrincipal="+subjectPrincipal+
", subjectAltNames="+subjectAltNames;;
stop
end
start
note right
void validate(SslEngineFactoryoldEngineBuilder,
SslEngineFactorynewEngineBuilder)
end note
:validate(createSslEngineForValidation(oldEngineBuilder,
Mode.SERVER),createSslEngineForValidation(newEngineBuilder,
Mode.CLIENT));;
:validate(createSslEngineForValidation(newEngineBuilder,
Mode.SERVER),createSslEngineForValidation(oldEngineBuilder,
Mode.CLIENT));;
end
start
note right
SSLEnginecreateSslEngineForValidation(SslEngineFactorysslEngineFactory,
Modemode)
end note
if (mode==Mode.SERVER) then (yes) 
:return sslEngineFactory.createServerSslEngine("",0);;
stop
else (no)
:return sslEngineFactory.createClientSslEngine("",
0,"");;
stop
endif 
end
start
note right
void validate(SSLEngineclientEngine,SSLEngineserverEngine)
end note
:SslEngineValidatorclientValidator=new SslEngineValidator(clientEngine);;
:SslEngineValidatorserverValidator=new SslEngineValidator(serverEngine);;
:try ;
:clientValidator.beginHandshake();;
:serverValidator.beginHandshake();;
while (!serverValidator.complete()||!clientValidator.complete())
:clientValidator.handshake(serverValidator);;
:serverValidator.handshake(clientValidator);;
endwhile
end
start
note right
constructor SslEngineValidator(SSLEngineengine)
end note
:this.sslEngine=engine;;
:appBuffer=ByteBuffer.allocate(sslEngine.getSession()
.getApplicationBufferSize());;
:netBuffer=ByteBuffer.allocate(sslEngine.getSession()
.getPacketBufferSize());;
end
start
note right
void beginHandshake()
end note
:sslEngine.beginHandshake();;
end
start
note right
void handshake(SslEngineValidatorpeerValidator)
end note
:SSLEngineResult.HandshakeStatushandshakeStatus=sslEngine.getHandshakeStatus();;
while (true)
switch (switch (handshakeStatus))
endswith
endwhile
end
start
note right
booleancomplete()
end note
:return sslEngine.getHandshakeStatus()==SSLEngineResult.HandshakeStatus.FINISHED||sslEngine.getHandshakeStatus()==SSLEngineResult.HandshakeStatus.NOT_HANDSHAKING;;
stop
end
start
note right
void close()
end note
:sslEngine.closeOutbound();;
:try ;
:sslEngine.closeInbound();;
:catch (Exceptione);
end
