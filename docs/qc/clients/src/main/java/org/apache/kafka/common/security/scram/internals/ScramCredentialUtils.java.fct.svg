@startuml
!pragma layout smetana
start
note right
constructor ScramCredentialUtils()
end note
end
start
note right
StringcredentialToString(ScramCredentialcredential)
end note
:return String.format("%s=%s,%s=%s,%s=%s,%s=%d",SALT,Base64.getEncoder().encodeToString(credential.salt()),STORED_KEY,Base64.getEncoder().encodeToString(credential.storedKey()),SERVER_KEY,Base64.getEncoder().encodeToString(credential.serverKey()),ITERATIONS,credential.iterations());;
stop
end
start
note right
ScramCredentialcredentialFromString(Stringstr)
end note
if (props.size()!=4||!props.containsKey(SALT)||!props.containsKey(STORED_KEY)||!props.containsKey(SERVER_KEY)||!props.containsKey(ITERATIONS)) then (yes) 
endif 
:return new ScramCredential(salt,storedKey,serverKey,iterations);;
stop
end
start
note right
PropertiestoProps(Stringstr)
end note
if (index<=0) then (yes) 
endif 
:props.put(token.substring(0,index),token.substring(index+1));
:return props;;
stop
end
start
note right
void createCache(CredentialCachecache,Collection<String>mechanisms)
end note
if (mechanisms.contains(mechanism)) then (yes) 
:cache.createCache(mechanism,ScramCredential.class );
endif 
end
@enduml

