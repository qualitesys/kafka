2,636.5,1117.4492" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="636.5" x2="636.5" y1="1070.0625" y2="1172.4336"/><line style="stroke:#181818;stroke-width:1.0;" x1="636.5" x2="453.5" y1="1172.4336" y2="1172.4336"/><polygon fill="#181818" points="463.5,1168.4336,453.5,1172.4336,463.5,1176.4336,459.5,1172.4336" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="441.5" x2="441.5" y1="1140.4336" y2="1160.4336"/><polygon fill="#181818" points="437.5,1150.4336,441.5,1160.4336,445.5,1150.4336,441.5,1154.4336" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="441.5" x2="441.5" y1="1035.4961" y2="1058.0625"/><polygon fill="#181818" points="437.5,1048.0625,441.5,1058.0625,445.5,1048.0625,441.5,1052.0625" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="441.5" x2="441.5" y1="1184.4336" y2="1204.4336"/><polygon fill="#181818" points="437.5,1194.4336,441.5,1204.4336,445.5,1194.4336,441.5,1198.4336" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[40b3664591450047bc91423ea79f2a85]
@startuml
!pragma layout smetana
start
note right
constructor ScramCredentialUtils()
end note
end
start
note right
StringcredentialToString(ScramCredentialcredential)
end note
:return String.format("%s=%s,%s=%s,%s=%s,
%s=%d",SALT,Base64.getEncoder().encodeToString(credential.salt()),
STORED_KEY,Base64.getEncoder().encodeToString(credential.storedKey()),
SERVER_KEY,Base64.getEncoder().encodeToString(credential.serverKey()),
ITERATIONS,credential.iterations());;
stop
end
start
note right
ScramCredentialcredentialFromString(Stringstr)
end note
if (props.size()!=4||!props.containsKey(SALT)||!props.containsKey(STORED_KEY)||!props.containsKey(SERVER_KEY)||!props.containsKey(ITERATIONS)) then (yes) 
:throw new IllegalArgumentException("Credentials not valid: "+
str);;
endif 
:return new ScramCredential(salt,storedKey,
serverKey,iterations);;
stop
end
start
note right
PropertiestoProps(Stringstr)
end note
if (index<=0) then (yes) 
:throw new IllegalArgumentException("Credentials not valid: "+
str);;
endif 
:props.put(token.substring(0,index),token.substring(index+1));
:return props;;
stop
end
start
note right
void createCache(CredentialCachecache,Collection<String>mechanisms)
end note
if (mechanisms.contains(mechanism)) then (yes) 
:cache.createCache(mechanism,ScramCredential.class );
endif 
end
@enduml

