@startuml
!pragma layout smetana
start
note right
constructor Builder(BrokerHeartbeatRequestData data)
end note
:super (ApiKeys.BROKER_HEARTBEAT);;
:this.data=data;;
end
start
note right
BrokerHeartbeatRequest build(short version)
end note
:return new BrokerHeartbeatRequest(data,version);;
stop
end
start
note right
String toString()
end note
:return data.toString();;
stop
end
start
note right
constructor BrokerHeartbeatRequest(BrokerHeartbeatRequestData data,
short version)
end note
:super (ApiKeys.BROKER_HEARTBEAT,version);;
:this.data=data;;
end
start
note right
BrokerHeartbeatRequestData data()
end note
:return data;;
stop
end
start
note right
BrokerHeartbeatResponse getErrorResponse(int throttleTimeMs,
Throwable e)
end note
:Errors error=Errors.forException(e);;
:return new BrokerHeartbeatResponse(new BrokerHeartbeatResponseData()
.setThrottleTimeMs(throttleTimeMs).setErrorCode(error.code()));;
stop
end
start
note right
BrokerHeartbeatRequest parse(ByteBuffer buffer,
short version)
end note
:return new BrokerHeartbeatRequest(new BrokerHeartbeatRequestData(new ByteBufferAccessor(buffer),
version),version);;
stop
end
@enduml

