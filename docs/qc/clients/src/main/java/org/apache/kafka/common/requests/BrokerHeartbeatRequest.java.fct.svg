@startuml
!pragma layout smetana
start
note right
constructor Builder(BrokerHeartbeatRequestDatadata)
end note
:super (ApiKeys.BROKER_HEARTBEAT);
:this.data=data;
end
start
note right
BrokerHeartbeatRequestbuild(shortversion)
end note
:return new BrokerHeartbeatRequest(data,version);;
stop
end
start
note right
StringtoString()
end note
:return data.toString();;
stop
end
start
note right
constructor BrokerHeartbeatRequest(BrokerHeartbeatRequestDatadata,shortversion)
end note
:super (ApiKeys.BROKER_HEARTBEAT,version);
:this.data=data;
end
start
note right
BrokerHeartbeatRequestDatadata()
end note
:return data;;
stop
end
start
note right
BrokerHeartbeatResponsegetErrorResponse(intthrottleTimeMs,Throwablee)
end note
:return new BrokerHeartbeatResponse(new BrokerHeartbeatResponseData()
.setThrottleTimeMs(throttleTimeMs).setErrorCode(error.code()));;
stop
end
start
note right
BrokerHeartbeatRequestparse(ByteBufferbuffer,shortversion)
end note
:return new BrokerHeartbeatRequest(new BrokerHeartbeatRequestData(new ByteBufferAccessor(buffer),version),version);;
stop
end
