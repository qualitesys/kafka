@startuml
!pragma layout smetana
start
note right
booleanvalidateOnly()
end note
:return this.validateOnly;;
stop
end
start
note right
AlterClientQuotasOptionsvalidateOnly(booleanvalidateOnly)
end note
:this.validateOnly=validateOnly;
:return this;;
stop
end
@enduml

