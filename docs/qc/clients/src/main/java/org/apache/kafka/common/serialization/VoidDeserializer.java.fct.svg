@startuml
!pragma layout smetana
start
note right
Void deserialize(String topic,byte[] data)
end note
if (data!=null ) then (yes) 
:throw new IllegalArgumentException("Data should be null for a VoidDeserializer.");;
stop
endif 
:return null ;;
stop
end
@enduml

