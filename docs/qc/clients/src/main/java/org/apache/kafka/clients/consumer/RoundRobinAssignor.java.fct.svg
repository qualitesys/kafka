3242,249,700.3242,245,704.3242" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="245" x2="245" y1="573.9844" y2="593.9844"/><polygon fill="#181818" points="241,583.9844,245,593.9844,249,583.9844,245,587.9844" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="245" x2="245" y1="734.3242" y2="754.3242"/><polygon fill="#181818" points="241,744.3242,245,754.3242,249,744.3242,245,748.3242" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="245" x2="245" y1="788.293" y2="808.293"/><polygon fill="#181818" points="241,798.293,245,808.293,249,798.293,245,802.293" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="245" x2="245" y1="892.8594" y2="915.4258"/><polygon fill="#181818" points="241,905.4258,245,915.4258,249,905.4258,245,909.4258" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="245" x2="245" y1="949.3945" y2="969.3945"/><polygon fill="#181818" points="241,959.3945,245,969.3945,249,959.3945,245,963.3945" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[c1c1f126a0e5c236c6c9c7b4e68d2386]
@startuml
!pragma layout smetana
start
note right
Map<String,List<TopicPartition>>assign(Map<String,Integer>partitionsPerTopic,Map<String,Subscription>subscriptions)
end note
:assignment.put(memberSubscription.getKey(),
new ArrayList<>());
:memberInfoList.add(new MemberInfo(memberSubscription.getKey(),
memberSubscription.getValue().groupInstanceId()));
while (!subscriptions.get(assigner.peek().memberId).topics().contains(topic))
:assigner.next();
endwhile
:assignment.get(assigner.next().memberId)
.add(partition);
:return assignment;;
stop
end
start
note right
List<TopicPartition>allPartitionsSorted(Map<String,Integer>partitionsPerTopic,Map<String,Subscription>subscriptions)
end note
:topics.addAll(subscription.topics());
if (numPartitionsForTopic!=null ) then (yes) 
:allPartitions.addAll(AbstractPartitionAssignor.partitions(topic,
numPartitionsForTopic));
endif 
:return allPartitions;;
stop
end
start
note right
Stringname()
end note
:return ROUNDROBIN_ASSIGNOR_NAME;;
stop
end
@enduml

