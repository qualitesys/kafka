@startuml
!pragma layout smetana
start
note right
Map<String,List<TopicPartition>>assign(Map<String,
Integer>partitionsPerTopic,Map<String,Subscription>subscriptions)
end note
:Map<String,List<TopicPartition>>assignment=new HashMap<>();;
:List<MemberInfo>memberInfoList=new ArrayList<>();;
:assignment.put(memberSubscription.getKey(),
new ArrayList<>());;
:memberInfoList.add(new MemberInfo(memberSubscription.getKey(),
memberSubscription.getValue().groupInstanceId()));;
:CircularIterator<MemberInfo>assigner=new CircularIterator<>(Utils.sorted(memberInfoList));;
:final Stringtopic=partition.topic();;
:while (!subscriptions.get(assigner.peek()
.memberId).topics().contains(topic))assigner.next();;
:assignment.get(assigner.next().memberId)
.add(partition);;
:return assignment;;
stop
end
start
note right
List<TopicPartition>allPartitionsSorted(Map<String,
Integer>partitionsPerTopic,Map<String,Subscription>subscriptions)
end note
:SortedSet<String>topics=new TreeSet<>();;
:topics.addAll(subscription.topics());;
:List<TopicPartition>allPartitions=new ArrayList<>();;
:IntegernumPartitionsForTopic=partitionsPerTopic.get(topic);;
if (numPartitionsForTopic!=null ) then (yes) 
:allPartitions.addAll(AbstractPartitionAssignor.partitions(topic,
numPartitionsForTopic));;
endif 
:return allPartitions;;
stop
end
start
note right
Stringname()
end note
:return ROUNDROBIN_ASSIGNOR_NAME;;
stop
end
@enduml

