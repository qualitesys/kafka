160.0469">Integer&gt;partitionsPerTopic,Map&lt;String,Subscription&gt;subscriptions)</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="71" x="5" y="176.3438">end note</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="376" x="5" y="192.6406">:assignment.put(memberSubscription.getKey(),</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="158" x="5" y="208.9375">new ArrayList&lt;&gt;());</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="550" x="5" y="225.2344">:memberInfoList.add(new MemberInfo(memberSubscription.getKey(),</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="414" x="5" y="241.5313">memberSubscription.getValue().groupInstanceId()));</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="327" x="5" y="257.8281">while (!subscriptions.get(assigner.peek()</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" text-decoration="wavy underline" textLength="284" x="5" y="274.125">.memberId).topics().contains(topic))</text><text fill="#FF0000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="106" x="10" y="290.4219">Syntax Error?</text><!--MD5=[eae8700f61d73416825dd804fcee1a02]
@startuml
!pragma layout smetana
start
note right
Map<String,List<TopicPartition>>assign(Map<String,
Integer>partitionsPerTopic,Map<String,Subscription>subscriptions)
end note
:assignment.put(memberSubscription.getKey(),
new ArrayList<>());
:memberInfoList.add(new MemberInfo(memberSubscription.getKey(),
memberSubscription.getValue().groupInstanceId()));
while (!subscriptions.get(assigner.peek()
.memberId).topics().contains(topic))
:assigner.next();
endwhile
:assignment.get(assigner.next().memberId)
.add(partition);
:return assignment;;
stop
end
start
note right
List<TopicPartition>allPartitionsSorted(Map<String,
Integer>partitionsPerTopic,Map<String,Subscription>subscriptions)
end note
:topics.addAll(subscription.topics());
if (numPartitionsForTopic!=null ) then (yes) 
:allPartitions.addAll(AbstractPartitionAssignor.partitions(topic,
numPartitionsForTopic));
endif 
:return allPartitions;;
stop
end
start
note right
Stringname()
end note
:return ROUNDROBIN_ASSIGNOR_NAME;;
stop
end
@enduml

