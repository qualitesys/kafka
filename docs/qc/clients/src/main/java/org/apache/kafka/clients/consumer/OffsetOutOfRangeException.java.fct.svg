@startuml
!pragma layout smetana
start
note right
constructor OffsetOutOfRangeException(Map<TopicPartition,
Long> offsetOutOfRangePartitions)
end note
:this("Offsets out of range with no configured reset policy for partitions: "+
offsetOutOfRangePartitions,offsetOutOfRangePartitions);;
end
start
note right
constructor OffsetOutOfRangeException(String message,
Map<TopicPartition,Long> offsetOutOfRangePartitions)
end note
:super (message);;
:this.offsetOutOfRangePartitions=offsetOutOfRangePartitions;;
end
start
note right
Map<TopicPartition,Long> offsetOutOfRangePartitions()
end note
:return offsetOutOfRangePartitions;;
stop
end
start
note right
Set<TopicPartition> partitions()
end note
:return offsetOutOfRangePartitions.keySet();;
stop
end
@enduml

