@startuml
!pragma layout smetana
start
note right
constructor AbortTransactionResult(Map<TopicPartition,
KafkaFuture<Void>>futures)
end note
:this.futures=futures;;
end
start
note right
KafkaFuture<Void>all()
end note
:return KafkaFuture.allOf(futures.values()
.toArray(new KafkaFuture[0]));;
stop
end
@enduml

