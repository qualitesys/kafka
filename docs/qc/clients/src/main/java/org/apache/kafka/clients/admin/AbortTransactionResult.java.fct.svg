stroke-width:1.0;" x1="147.5" x2="147.5" y1="232.1719" y2="252.1719"/><polygon fill="#181818" points="143.5,242.1719,147.5,252.1719,151.5,242.1719,147.5,246.1719" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[adc1627445aa87cbebfecc3a4151a2f4]
@startuml
!pragma layout smetana
start
note right
constructor AbortTransactionResult(Map<TopicPartition,KafkaFuture<Void>>futures)
end note
:this.futures=futures;
end
start
note right
KafkaFuture<Void>all()
end note
:return KafkaFuture.allOf(futures.values()
.toArray(new KafkaFuture[0]));;
stop
end
@enduml

