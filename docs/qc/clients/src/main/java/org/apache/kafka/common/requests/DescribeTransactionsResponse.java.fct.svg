@startuml
!pragma layout smetana
start
note right
constructor DescribeTransactionsResponse(DescribeTransactionsResponseDatadata)
end note
:super (ApiKeys.DESCRIBE_TRANSACTIONS);
:this.data=data;
end
start
note right
DescribeTransactionsResponseDatadata()
end note
:return data;;
stop
end
start
note right
Map<Errors,Integer>errorCounts()
end note
:updateErrorCounts(errorCounts,error);
:return errorCounts;;
stop
end
start
note right
DescribeTransactionsResponseparse(ByteBufferbuffer,
shortversion)
end note
:return new DescribeTransactionsResponse(new DescribeTransactionsResponseData(new ByteBufferAccessor(buffer),
version));;
stop
end
start
note right
StringtoString()
end note
:return data.toString();;
stop
end
start
note right
intthrottleTimeMs()
end note
:return data.throttleTimeMs();;
stop
end
@enduml

