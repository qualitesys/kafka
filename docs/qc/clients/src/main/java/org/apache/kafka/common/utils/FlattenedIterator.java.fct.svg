le="stroke:#181818;stroke-width:1.0;"/><!--MD5=[9928249d4a45108d655a82974722e36a]
@startuml
!pragma layout smetana
start
note right
constructor FlattenedIterator(Iterator<O>outerIterator,
Function<O,Iterator<I>>innerIteratorFunction)
end note
:this.outerIterator=outerIterator;;
:this.innerIteratorFunction=innerIteratorFunction;;
end
start
note right
ImakeNext()
end note
:while (innerIterator==null ||!innerIterator.hasNext()){if (outerIterator.hasNext())innerIterator=innerIteratorFunction.apply(outerIterator.next());
:else return allDone();};
:return innerIterator.next();;
stop
end
@enduml

