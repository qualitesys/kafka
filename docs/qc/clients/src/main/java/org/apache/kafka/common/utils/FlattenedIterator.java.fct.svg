@startuml
!pragma layout smetana
start
note right
constructor FlattenedIterator(Iterator<O>outerIterator,
Function<O,Iterator<I>>innerIteratorFunction)
end note
:this.outerIterator=outerIterator;;
:this.innerIteratorFunction=innerIteratorFunction;;
end
start
note right
ImakeNext()
end note
while (innerIterator==null ||!innerIterator.hasNext())
if (outerIterator.hasNext()) then (yes) 
:innerIterator=innerIteratorFunction.apply(outerIterator.next());;
else (no)
:return allDone();;
stop
endif 
endwhile
:return innerIterator.next();;
stop
end
@enduml

