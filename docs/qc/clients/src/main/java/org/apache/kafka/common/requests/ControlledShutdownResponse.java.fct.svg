@startuml
!pragma layout smetana
start
note right
constructor ControlledShutdownResponse(ControlledShutdownResponseData data)
end note
:super (ApiKeys.CONTROLLED_SHUTDOWN);;
:this.data=data;;
end
start
note right
Errors error()
end note
:return Errors.forCode(data.errorCode());;
stop
end
start
note right
Map<Errors,Integer> errorCounts()
end note
:return errorCounts(error());;
stop
end
start
note right
int throttleTimeMs()
end note
:return DEFAULT_THROTTLE_TIME;;
stop
end
start
note right
ControlledShutdownResponse parse(ByteBuffer buffer,
short version)
end note
:return new ControlledShutdownResponse(new ControlledShutdownResponseData(new ByteBufferAccessor(buffer),
version));;
stop
end
start
note right
ControlledShutdownResponseData data()
end note
:return data;;
stop
end
start
note right
ControlledShutdownResponse prepareResponse(Errors error,
Set<TopicPartition> tps)
end note
:ControlledShutdownResponseData data=new ControlledShutdownResponseData();;
:data.setErrorCode(error.code());;
:ControlledShutdownResponseData.RemainingPartitionCollection pSet=new ControlledShutdownResponseData.RemainingPartitionCollection();;
:tps.forEach(tp->{pSet.add(new RemainingPartition()
.setTopicName(tp.topic()).setPartitionIndex(tp.partition()));});;
:data.setRemainingPartitions(pSet);;
:return new ControlledShutdownResponse(data);;
stop
end
@enduml

