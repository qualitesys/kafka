3,384,1253.8203,380,1257.8203" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="380" x2="380" y1="1297.7891" y2="1317.7891"/><polygon fill="#181818" points="376,1307.7891,380,1317.7891,384,1307.7891,380,1311.7891" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[e016bcd77fae0594f6ec1fbcda74bc4e]
@startuml
!pragma layout smetana
start
note right
constructor ControlledShutdownResponse(ControlledShutdownResponseDatadata)
end note
:super (ApiKeys.CONTROLLED_SHUTDOWN);
:this.data=data;
end
start
note right
Errorserror()
end note
:return Errors.forCode(data.errorCode());;
stop
end
start
note right
Map<Errors,Integer>errorCounts()
end note
:return errorCounts(error());;
stop
end
start
note right
intthrottleTimeMs()
end note
:return DEFAULT_THROTTLE_TIME;;
stop
end
start
note right
ControlledShutdownResponseparse(ByteBufferbuffer,
shortversion)
end note
:return new ControlledShutdownResponse(new ControlledShutdownResponseData(new ByteBufferAccessor(buffer),
version));;
stop
end
start
note right
ControlledShutdownResponseDatadata()
end note
:return data;;
stop
end
start
note right
ControlledShutdownResponseprepareResponse(Errorserror,
Set<TopicPartition>tps)
end note
:data.setErrorCode(error.code());
:tps.forEach(tp->{pSet.add(new RemainingPartition()
.setTopicName(tp.topic()).setPartitionIndex(tp.partition()));});
:data.setRemainingPartitions(pSet);
:return new ControlledShutdownResponse(data);;
stop
end
@enduml

