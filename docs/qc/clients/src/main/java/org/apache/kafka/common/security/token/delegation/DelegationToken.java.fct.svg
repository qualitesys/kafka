@startuml
!pragma layout smetana
start
note right
constructor DelegationToken(TokenInformationtokenInformation,
byte[]hmac)
end note
end
start
note right
TokenInformationtokenInfo()
end note
:return tokenInformation;;
stop
end
start
note right
byte[]hmac()
end note
:return hmac;;
stop
end
start
note right
StringhmacAsBase64String()
end note
:return Base64.getEncoder().encodeToString(hmac);;
stop
end
start
note right
booleanequals(Objecto)
end note
if (this==o) then (yes) 
:return true;;
stop
endif 
if (o==null ||getClass()!=o.getClass()) then (yes) 
:return false;;
stop
endif 
:return Objects.equals(tokenInformation,token.tokenInformation)&&MessageDigest.isEqual(hmac,
token.hmac);;
stop
end
start
note right
inthashCode()
end note
:return result;;
stop
end
start
note right
StringtoString()
end note
:return "DelegationToken{"+"tokenInformation="+
tokenInformation+", hmac=[*******]"+'}';;
stop
end
@enduml

