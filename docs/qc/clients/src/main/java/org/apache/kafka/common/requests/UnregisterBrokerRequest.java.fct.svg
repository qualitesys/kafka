@startuml
!pragma layout smetana
start
note right
constructor Builder(UnregisterBrokerRequestData data)
end note
:super (ApiKeys.UNREGISTER_BROKER);;
:this.data=data;;
end
start
note right
UnregisterBrokerRequest build(short version)
end note
:return new UnregisterBrokerRequest(data,
version);;
stop
end
start
note right
constructor UnregisterBrokerRequest(UnregisterBrokerRequestData data,
short version)
end note
:super (ApiKeys.UNREGISTER_BROKER,version);;
:this.data=data;;
end
start
note right
UnregisterBrokerRequestData data()
end note
:return data;;
stop
end
start
note right
UnregisterBrokerResponse getErrorResponse(int throttleTimeMs,
Throwable e)
end note
:Errors error=Errors.forException(e);;
:return new UnregisterBrokerResponse(new UnregisterBrokerResponseData()
.setThrottleTimeMs(throttleTimeMs).setErrorCode(error.code()));;
stop
end
start
note right
UnregisterBrokerRequest parse(ByteBuffer buffer,
short version)
end note
:return new UnregisterBrokerRequest(new UnregisterBrokerRequestData(new ByteBufferAccessor(buffer),
version),version);;
stop
end
@enduml

