@startuml
!pragma layout smetana
start
note right
constructor Builder(UnregisterBrokerRequestDatadata)
end note
:super (ApiKeys.UNREGISTER_BROKER);
:this.data=data;
end
start
note right
UnregisterBrokerRequestbuild(shortversion)
end note
:return new UnregisterBrokerRequest(data,
version);;
stop
end
start
note right
constructor UnregisterBrokerRequest(UnregisterBrokerRequestDatadata,shortversion)
end note
:super (ApiKeys.UNREGISTER_BROKER,version);
:this.data=data;
end
start
note right
UnregisterBrokerRequestDatadata()
end note
:return data;;
stop
end
start
note right
UnregisterBrokerResponsegetErrorResponse(intthrottleTimeMs,Throwablee)
end note
:return new UnregisterBrokerResponse(new UnregisterBrokerResponseData().setThrottleTimeMs(throttleTimeMs).setErrorCode(error.code()));;
stop
end
start
note right
UnregisterBrokerRequestparse(ByteBufferbuffer,shortversion)
end note
:return new UnregisterBrokerRequest(new UnregisterBrokerRequestData(new ByteBufferAccessor(buffer),version),version);;
stop
end
