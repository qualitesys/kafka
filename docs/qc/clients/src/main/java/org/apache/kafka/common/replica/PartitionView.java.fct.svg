1="1223.7852" y2="1246.3516"/><polygon fill="#181818" points="237,1236.3516,241,1246.3516,245,1236.3516,241,1240.3516" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="241" x2="241" y1="1294.2891" y2="1314.2891"/><polygon fill="#181818" points="237,1304.2891,241,1314.2891,245,1304.2891,241,1308.2891" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[5937858b4aa3a7f94fa3e2d91f3c188a]
@startuml
!pragma layout smetana
start
note right
constructor DefaultPartitionView(Set<ReplicaView>replicas,ReplicaViewleader)
end note
:this.replicas=Collections.unmodifiableSet(replicas);
:this.leader=leader;
end
start
note right
Set<ReplicaView>replicas()
end note
:return replicas;;
stop
end
start
note right
ReplicaViewleader()
end note
:return leader;;
stop
end
start
note right
booleanequals(Objecto)
end note
if (this==o) then (yes) 
:return true;;
stop
endif 
if (o==null ||getClass()!=o.getClass()) then (yes) 
:return false;;
stop
endif 
:return Objects.equals(replicas,that.replicas)&&Objects.equals(leader,
that.leader);;
stop
end
start
note right
inthashCode()
end note
:return Objects.hash(replicas,leader);;
stop
end
start
note right
StringtoString()
end note
:return "DefaultPartitionView{"+"replicas="+
replicas+", leader="+leader+'}';;
stop
end
@enduml

