@startuml
!pragma layout smetana
start
note right
constructor DefaultPartitionView(Set<ReplicaView> replicas,
ReplicaView leader)
end note
:this.replicas=Collections.unmodifiableSet(replicas);;
:this.leader=leader;;
end
start
note right
Set<ReplicaView> replicas()
end note
:return replicas;;
stop
end
start
note right
ReplicaView leader()
end note
:return leader;;
stop
end
start
note right
boolean equals(Object o)
end note
if (this==o) then (yes) 
:return true;;
stop
endif 
if (o==null ||getClass()!=o.getClass()) then (yes) 
:return false;;
stop
endif 
:DefaultPartitionView that=(DefaultPartitionView )o;;
:return Objects.equals(replicas,that.replicas)&&Objects.equals(leader,
that.leader);;
stop
end
start
note right
int hashCode()
end note
:return Objects.hash(replicas,leader);;
stop
end
start
note right
String toString()
end note
:return "DefaultPartitionView{"+"replicas="+
replicas+", leader="+leader+'}';;
stop
end
@enduml

