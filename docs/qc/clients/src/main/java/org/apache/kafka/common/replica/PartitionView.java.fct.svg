@startuml
!pragma layout smetana
start
note right
constructor DefaultPartitionView(Set<ReplicaView>replicas,
ReplicaViewleader)
end note
end
start
note right
Set<ReplicaView>replicas()
end note
:return replicas;;
stop
end
start
note right
ReplicaViewleader()
end note
:return leader;;
stop
end
start
note right
booleanequals(Objecto)
end note
if (this==o) then (yes) 
:return true;;
stop
endif 
if (o==null ||getClass()!=o.getClass()) then (yes) 
:return false;;
stop
endif 
:return Objects.equals(replicas,that.replicas)&&Objects.equals(leader,
that.leader);;
stop
end
start
note right
inthashCode()
end note
:return Objects.hash(replicas,leader);;
stop
end
start
note right
StringtoString()
end note
:return "DefaultPartitionView{"+"replicas="+
replicas+", leader="+leader+'}';;
stop
end
@enduml

