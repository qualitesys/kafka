,1154.3516,245,1144.3516,241,1148.3516" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="241" x2="241" y1="1238.918" y2="1261.4844"/><polygon fill="#181818" points="237,1251.4844,241,1261.4844,245,1251.4844,241,1255.4844" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="241" x2="241" y1="1309.4219" y2="1329.4219"/><polygon fill="#181818" points="237,1319.4219,241,1329.4219,245,1319.4219,241,1323.4219" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[6e19c08c4e9160f38e655f3a7dfdaefa]
@startuml
!pragma layout smetana
start
note right
constructor DefaultPartitionView(Set<ReplicaView>replicas,
ReplicaViewleader)
end note
:this.replicas=Collections.unmodifiableSet(replicas);;
:this.leader=leader;;
end
start
note right
Set<ReplicaView>replicas()
end note
:return replicas;;
stop
end
start
note right
ReplicaViewleader()
end note
:return leader;;
stop
end
start
note right
booleanequals(Objecto)
end note
if (this==o) then (yes) 
:return true;;
stop
endif 
if (o==null ||getClass()!=o.getClass()) then (yes) 
:return false;;
stop
endif 
:return Objects.equals(replicas,that.replicas)&&Objects.equals(leader,
that.leader);;
stop
end
start
note right
inthashCode()
end note
:return Objects.hash(replicas,leader);;
stop
end
start
note right
StringtoString()
end note
:return "DefaultPartitionView{"+"replicas="+
replicas+", leader="+leader+'}';;
stop
end
@enduml

