@startuml
!pragma layout smetana
start
note right
constructor CoordinatorKey(FindCoordinatorRequest.CoordinatorType type,
String idValue)
end note
:this.idValue=idValue;;
:this.type=type;;
end
start
note right
boolean equals(Object o)
end note
if (this==o) then (yes) 
:return true;;
stop
endif 
if (o==null ||getClass()!=o.getClass()) then (yes) 
:return false;;
stop
endif 
:CoordinatorKey that=(CoordinatorKey )o;;
:return Objects.equals(idValue,that.idValue)&&type==that.type;;
stop
end
start
note right
int hashCode()
end note
:return Objects.hash(idValue,type);;
stop
end
start
note right
String toString()
end note
:return "CoordinatorKey("+"idValue='"+idValue+
'\''+", type="+type+')';;
stop
end
start
note right
CoordinatorKey byGroupId(String groupId)
end note
:return new CoordinatorKey(FindCoordinatorRequest.CoordinatorType.GROUP,
groupId);;
stop
end
start
note right
CoordinatorKey byTransactionalId(String transactionalId)
end note
:return new CoordinatorKey(FindCoordinatorRequest.CoordinatorType.TRANSACTION,
transactionalId);;
stop
end
@enduml

