@startuml
!pragma layout smetana
start
note right
constructor CoordinatorKey(FindCoordinatorRequest.CoordinatorTypetype,StringidValue)
end note
:this.idValue=idValue;
:this.type=type;
end
start
note right
booleanequals(Objecto)
end note
if (this==o) then (yes) 
:return true;;
stop
endif 
if (o==null ||getClass()!=o.getClass()) then (yes) 
:return false;;
stop
endif 
:return Objects.equals(idValue,that.idValue)&&type==that.type;;
stop
end
start
note right
inthashCode()
end note
:return Objects.hash(idValue,type);;
stop
end
start
note right
StringtoString()
end note
:return "CoordinatorKey("+"idValue='"+idValue+
'\''+", type="+type+')';;
stop
end
start
note right
CoordinatorKeybyGroupId(StringgroupId)
end note
:return new CoordinatorKey(FindCoordinatorRequest.CoordinatorType.GROUP,
groupId);;
stop
end
start
note right
CoordinatorKeybyTransactionalId(StringtransactionalId)
end note
:return new CoordinatorKey(FindCoordinatorRequest.CoordinatorType.TRANSACTION,
transactionalId);;
stop
end
@enduml

