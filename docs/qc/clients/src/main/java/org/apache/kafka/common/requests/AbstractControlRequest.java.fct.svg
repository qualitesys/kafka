:super (api,version);;
:this.controllerId=controllerId;;
:this.controllerEpoch=controllerEpoch;;
:this.brokerEpoch=brokerEpoch;;
end
start
note right
constructor AbstractControlRequest(ApiKeysapi,
shortversion)
end note
:super (api,version);;
end
@enduml

