@startuml
!pragma layout smetana
start
note right
constructor Builder(ApiKeys api,short version,
int controllerId,int controllerEpoch,long brokerEpoch)
end note
:super (api,version);;
:this.controllerId=controllerId;;
:this.controllerEpoch=controllerEpoch;;
:this.brokerEpoch=brokerEpoch;;
end
start
note right
constructor AbstractControlRequest(ApiKeys api,
short version)
end note
:super (api,version);;
end
@enduml

