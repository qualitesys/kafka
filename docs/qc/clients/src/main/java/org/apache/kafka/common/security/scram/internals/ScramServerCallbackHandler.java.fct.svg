@startuml
!pragma layout smetana
start
note right
constructor ScramServerCallbackHandler(CredentialCache.Cache<ScramCredential>credentialCache,DelegationTokenCachetokenCache)
end note
:this.credentialCache=credentialCache;
:this.tokenCache=tokenCache;
end
start
note right
void configure(Map<String,? >configs,Stringmechanism,List<AppConfigurationEntry>jaasConfigEntries)
end note
:this.saslMechanism=mechanism;
end
start
note right
void handle(Callback[]callbacks)
end note
if (callback instanceof NameCallback) then (yes) 
:username=((NameCallback)callback).getDefaultName();
else (no)
:throw new UnsupportedCallbackException(callback);;
endif 
end
start
note right
void close()
end note
end
@enduml

