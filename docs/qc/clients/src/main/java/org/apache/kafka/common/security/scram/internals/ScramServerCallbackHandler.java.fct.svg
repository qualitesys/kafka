@startuml
!pragma layout smetana
start
note right
constructor ScramServerCallbackHandler(CredentialCache.Cache<ScramCredential> credentialCache,
DelegationTokenCache tokenCache)
end note
:this.credentialCache=credentialCache;;
:this.tokenCache=tokenCache;;
end
start
note right
void configure(Map<String,?> configs,String mechanism,
List<AppConfigurationEntry> jaasConfigEntries)
end note
:this.saslMechanism=mechanism;;
end
start
note right
void handle(Callback[] callbacks)
end note
:String username=null ;;
if (callback instanceof NameCallback ) then (yes) 
:username=((NameCallback )callback).getDefaultName();;
else if (callback instanceof DelegationTokenCredentialCallback ) then (yes) 
:DelegationTokenCredentialCallback tokenCallback=(DelegationTokenCredentialCallback )callback;;
:tokenCallback.scramCredential(tokenCache.credential(saslMechanism,
username));;
:tokenCallback.tokenOwner(tokenCache.owner(username));;
:TokenInformation tokenInfo=tokenCache.token(username);;
if (tokenInfo!=null ) then (yes) 
:tokenCallback.tokenExpiryTimestamp(tokenInfo.expiryTimestamp());;
endif 
else if (callback instanceof ScramCredentialCallback ) then (yes) 
:ScramCredentialCallback sc=(ScramCredentialCallback )callback;;
:sc.scramCredential(credentialCache.get(username));;
else (no)
:throw new UnsupportedCallbackException(callback);;
stop
endif 
end
start
note right
void close()
end note
end
