@startuml
!pragma layout smetana
start
note right
constructor ScramServerCallbackHandler(CredentialCache.Cache<ScramCredential>credentialCache,
DelegationTokenCachetokenCache)
end note
:this.credentialCache=credentialCache;;
:this.tokenCache=tokenCache;;
end
start
note right
void configure(Map<String,? >configs,Stringmechanism,
List<AppConfigurationEntry>jaasConfigEntries)
end note
:this.saslMechanism=mechanism;;
end
start
note right
void handle(Callback[]callbacks)
end note
:Stringusername=null ;;
if (callback instanceof NameCallback) then (yes) 
:username=((NameCallback)callback).getDefaultName();;
else if (callback instanceof DelegationTokenCredentialCallback) then (yes) 
:DelegationTokenCredentialCallbacktokenCallback=(DelegationTokenCredentialCallback)callback;;
:tokenCallback.scramCredential(tokenCache.credential(saslMechanism,
username));;
:tokenCallback.tokenOwner(tokenCache.owner(username));;
:TokenInformationtokenInfo=tokenCache.token(username);;
if (tokenInfo!=null ) then (yes) 
:tokenCallback.tokenExpiryTimestamp(tokenInfo.expiryTimestamp());;
