@startuml
!pragma layout smetana
start
note right
RawTaggedFieldWriterforFields(List<RawTaggedField>fields)
end note
if (fields==null ) then (yes) 
:return EMPTY_WRITER;;
stop
endif 
:return new RawTaggedFieldWriter(fields);;
stop
end
start
note right
constructor RawTaggedFieldWriter(List<RawTaggedField>fields)
end note
:this.fields=fields;;
:this.iter=this.fields.listIterator();;
:this.prevTag=-1;;
end
start
note right
intnumFields()
end note
:return fields.size();;
stop
end
start
note right
void writeRawTags(Writablewritable,intnextDefinedTag)
end note
:while (iter.hasNext()){RawTaggedFieldfield=iter.next();inttag=field.tag();if (tag>=nextDefinedTag){if (tag==nextDefinedTag){throw new RuntimeException("Attempted to use tag "+
tag+" as an "+"undefined tag.");}iter.previous();return ;}if (tag<=prevTag){throw new RuntimeException("Invalid raw tag field list: tag "+
tag+" comes after tag "+prevTag+", but is not higher than it.");}writable.writeUnsignedVarint(field.tag());writable.writeUnsignedVarint(field.data().length);writable.writeByteArray(field.data());prevTag=tag;};
end
@enduml

