@startuml
!pragma layout smetana
start
note right
RawTaggedFieldWriterforFields(List<RawTaggedField>fields)
end note
if (fields==null ) then (yes) 
:return EMPTY_WRITER;;
stop
endif 
:return new RawTaggedFieldWriter(fields);;
stop
end
start
note right
constructor RawTaggedFieldWriter(List<RawTaggedField>fields)
end note
end
start
note right
intnumFields()
end note
:return fields.size();;
stop
end
start
note right
void writeRawTags(Writablewritable,intnextDefinedTag)
end note
while (iter.hasNext())
if (tag>=nextDefinedTag) then (yes) 
if (tag==nextDefinedTag) then (yes) 
:throw new RuntimeException("Attempted to use tag "+
tag+" as an "+"undefined tag.");;
endif 
:return ;;
stop
endif 
if (tag<=prevTag) then (yes) 
:throw new RuntimeException("Invalid raw tag field list: tag "+
tag+" comes after tag "+prevTag+", but is not higher than it.");;
endif 
endwhile
end
@enduml

