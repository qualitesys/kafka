@startuml
!pragma layout smetana
start
note right
void configure(Map<String,? >configs)
end note
end
start
note right
intpartition(Stringtopic,Objectkey,byte[]keyBytes,
Objectvalue,byte[]valueBytes,Clustercluster)
end note
if (!availablePartitions.isEmpty()) then (yes) 
:return availablePartitions.get(part).partition();;
stop
else (no)
:return Utils.toPositive(nextValue)%numPartitions;;
stop
endif 
end
start
note right
intnextValue(Stringtopic)
end note
:return counter.getAndIncrement();;
stop
end
start
note right
void close()
end note
end
@enduml

