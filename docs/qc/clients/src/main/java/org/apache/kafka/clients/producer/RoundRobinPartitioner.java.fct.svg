 points="401.5,722.25,405.5,732.25,409.5,722.25,405.5,726.25" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="405.5" x2="405.5" y1="816.8164" y2="839.3828"/><polygon fill="#181818" points="401.5,829.3828,405.5,839.3828,409.5,829.3828,405.5,833.3828" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[b94aaabc3dc53236bd3e430a6d20d18a]
@startuml
!pragma layout smetana
start
note right
void configure(Map<String,? >configs)
end note
end
start
note right
intpartition(Stringtopic,Objectkey,byte[]keyBytes,
Objectvalue,byte[]valueBytes,Clustercluster)
end note
:List<PartitionInfo>partitions=cluster.partitionsForTopic(topic);;
:intnumPartitions=partitions.size();;
:intnextValue=nextValue(topic);;
:List<PartitionInfo>availablePartitions=cluster.availablePartitionsForTopic(topic);;
if (!availablePartitions.isEmpty()) then (yes) 
:intpart=Utils.toPositive(nextValue)%availablePartitions.size();;
:return availablePartitions.get(part).partition();;
stop
else (no)
:return Utils.toPositive(nextValue)%numPartitions;;
stop
endif 
end
start
note right
intnextValue(Stringtopic)
end note
:AtomicIntegercounter=topicCounterMap.computeIfAbsent(topic,
k->new AtomicInteger(0));;
:return counter.getAndIncrement();;
stop
end
start
note right
void close()
end note
end
@enduml

