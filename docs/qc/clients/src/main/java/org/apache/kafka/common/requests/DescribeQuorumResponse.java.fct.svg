@startuml
!pragma layout smetana
start
note right
constructor DescribeQuorumResponse(DescribeQuorumResponseDatadata)
end note
:super (ApiKeys.DESCRIBE_QUORUM);
:this.data=data;
end
start
note right
Map<Errors,Integer>errorCounts()
end note
:errors.put(Errors.forCode(data.errorCode()),
1);
:updateErrorCounts(errors,Errors.forCode(partitionResponse.errorCode()));
:return errors;;
stop
end
start
note right
DescribeQuorumResponseDatadata()
end note
:return data;;
stop
end
start
note right
intthrottleTimeMs()
end note
:return DEFAULT_THROTTLE_TIME;;
stop
end
start
note right
DescribeQuorumResponseDatasingletonResponse(TopicPartitiontopicPartition,
intleaderId,intleaderEpoch,longhighWatermark,
List<ReplicaState>voterStates,List<ReplicaState>observerStates)
end note
:return new DescribeQuorumResponseData().setTopics(Collections.singletonList(new DescribeQuorumResponseData.TopicData().setTopicName(topicPartition.topic()).setPartitions(Collections.singletonList(new DescribeQuorumResponseData.PartitionData().setErrorCode(Errors.NONE.code()).setLeaderId(leaderId).setLeaderEpoch(leaderEpoch).setHighWatermark(highWatermark).setCurrentVoters(voterStates).setObservers(observerStates)))));;
stop
end
start
note right
DescribeQuorumResponseparse(ByteBufferbuffer,
shortversion)
end note
:return new DescribeQuorumResponse(new DescribeQuorumResponseData(new ByteBufferAccessor(buffer),version));;
stop
end
@enduml

