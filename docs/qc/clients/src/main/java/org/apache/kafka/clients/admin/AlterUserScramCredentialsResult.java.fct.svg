@startuml
!pragma layout smetana
start
note right
constructor AlterUserScramCredentialsResult(Map<String,
KafkaFuture<Void>>futures)
end note
:this.futures=Collections.unmodifiableMap(Objects.requireNonNull(futures));
end
start
note right
Map<String,KafkaFuture<Void>>values()
end note
:return this.futures;;
stop
end
start
note right
KafkaFuture<Void>all()
end note
:return KafkaFuture.allOf(futures.values()
.toArray(new KafkaFuture[0]));;
stop
end
@enduml

