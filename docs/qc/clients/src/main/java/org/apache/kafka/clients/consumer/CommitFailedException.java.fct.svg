 points="1351,174.2344,1355,184.2344,1359,174.2344,1355,178.2344" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="1355" x2="1355" y1="232.1719" y2="252.1719"/><polygon fill="#181818" points="1351,242.1719,1355,252.1719,1359,242.1719,1355,246.1719" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[0ad448da39402d3e9de59b078e2eff25]
@startuml
!pragma layout smetana
start
note right
constructor CommitFailedException(final Stringmessage)
end note
:super (message);
end
start
note right
constructor CommitFailedException()
end note
:super ("Commit cannot be completed since the group has already "+
"rebalanced and assigned the partitions to another member. This means that the time "+"between subsequent calls to poll() was longer than the configured max.poll.interval.ms, "+"which typically implies that the poll loop is spending too much time message processing. "+"You can address this either by increasing max.poll.interval.ms or by reducing the maximum "+"size of batches returned in poll() with max.poll.records.");
end
@enduml

