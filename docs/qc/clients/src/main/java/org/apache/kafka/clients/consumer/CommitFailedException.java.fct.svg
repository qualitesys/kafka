1.5,184.2344,1575.5,174.2344,1571.5,178.2344" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="1571.5" x2="1571.5" y1="218.2031" y2="238.2031"/><polygon fill="#181818" points="1567.5,228.2031,1571.5,238.2031,1575.5,228.2031,1571.5,232.2031" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[c308a656a33d2096b08fc8f39afb1c24]
@startuml
!pragma layout smetana
start
note right
constructor CommitFailedException(final Stringmessage)
end note
:super (message);
end
start
note right
constructor CommitFailedException()
end note
:super ("Commit cannot be completed since the group has already "+"rebalanced and assigned the partitions to another member. This means that the time "+"between subsequent calls to poll() was longer than the configured max.poll.interval.ms, "+"which typically implies that the poll loop is spending too much time message processing. "+"You can address this either by increasing max.poll.interval.ms or by reducing the maximum "+"size of batches returned in poll() with max.poll.records.");
end
@enduml

