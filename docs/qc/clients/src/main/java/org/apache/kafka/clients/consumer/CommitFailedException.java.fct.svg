<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" data-diagram-type="ACTIVITY" height="353px" preserveAspectRatio="none" style="width:759px;height:353px;background:#FFFFFF;" version="1.1" viewBox="0 0 759 353" width="759px" zoomAndPan="magnify"><?plantuml 1.2026.6?><defs/><g><path d="M345.3242,15 L345.3242,23.5664 L325.3242,27.5664 L345.3242,31.5664 L345.3242,40.1328 A0,0 0 0 0 345.3242,40.1328 L738.4873,40.1328 A0,0 0 0 0 738.4873,40.1328 L738.4873,25 L728.4873,15 L345.3242,15 A0,0 0 0 0 345.3242,15" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M728.4873,15 L728.4873,25 L738.4873,25 L728.4873,15" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="372.1631" x="351.3242" y="32.0669">constructor CommitFailedException(final Stringmessage)</text><ellipse cx="315.3242" cy="27.5664" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="#F1F1F1" height="33.9688" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="124.9414" x="252.8535" y="60.1328"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="104.9414" x="262.8535" y="81.2715">super (message);</text><ellipse cx="315.3242" cy="124.1016" fill="none" rx="10" ry="10" style="stroke:#222222;stroke-width:1.5;"/><line style="stroke:#222222;stroke-width:2.5;" x1="309.137" x2="321.5114" y1="117.9144" y2="130.2887"/><line style="stroke:#222222;stroke-width:2.5;" x1="321.5114" x2="309.137" y1="117.9144" y2="130.2887"/><path d="M345.3242,144.1016 L345.3242,152.668 L325.3242,156.668 L345.3242,160.668 L345.3242,169.2344 A0,0 0 0 0 345.3242,169.2344 L609.1284,169.2344 A0,0 0 0 0 609.1284,169.2344 L609.1284,154.1016 L599.1284,144.1016 L345.3242,144.1016 A0,0 0 0 0 345.3242,144.1016" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><path d="M599.1284,144.1016 L599.1284,154.1016 L609.1284,154.1016 L599.1284,144.1016" fill="#FEFFDD" style="stroke:#181818;stroke-width:0.5;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="242.8042" x="351.3242" y="161.1685">constructor CommitFailedException()</text><ellipse cx="315.3242" cy="156.668" fill="#222222" rx="10" ry="10" style="stroke:#222222;stroke-width:1;"/><rect fill="#F1F1F1" height="103.8125" rx="12.5" ry="12.5" style="stroke:#181818;stroke-width:0.5;" width="598.6484" x="16" y="189.2344"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="416.9941" x="26" y="210.373">super ("Commit cannot be completed since the group has already "+</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="540.1875" x="26" y="224.3418">"rebalanced and assigned the partitions to another member. This means that the time "+</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="554.4551" x="26" y="238.3105">"between subsequent calls to poll() was longer than the configured max.poll.interval.ms, "+</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="561.4922" x="26" y="252.2793">"which typically implies that the poll loop is spending too much time message processing. "+</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="578.6484" x="26" y="266.248">"You can address this either by increasing max.poll.interval.ms or by reducing the maximum "+</text><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="352.6406" x="26" y="280.2168">"size of batches returned in poll() with max.poll.records.");</text><ellipse cx="315.3242" cy="323.0469" fill="none" rx="10" ry="10" style="stroke:#222222;stroke-width:1.5;"/><line style="stroke:#222222;stroke-width:2.5;" x1="309.137" x2="321.5114" y1="316.8597" y2="329.2341"/><line style="stroke:#222222;stroke-width:2.5;" x1="321.5114" x2="309.137" y1="316.8597" y2="329.2341"/><line style="stroke:#181818;stroke-width:1;" x1="315.3242" x2="315.3242" y1="37.5664" y2="60.1328"/><polygon fill="#181818" points="311.3242,50.1328,315.3242,60.1328,319.3242,50.1328,315.3242,54.1328" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#181818;stroke-width:1;" x1="315.3242" x2="315.3242" y1="94.1016" y2="114.1016"/><polygon fill="#181818" points="311.3242,104.1016,315.3242,114.1016,319.3242,104.1016,315.3242,108.1016" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#181818;stroke-width:1;" x1="315.3242" x2="315.3242" y1="166.668" y2="189.2344"/><polygon fill="#181818" points="311.3242,179.2344,315.3242,189.2344,319.3242,179.2344,315.3242,183.2344" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><line style="stroke:#181818;stroke-width:1;" x1="315.3242" x2="315.3242" y1="293.0469" y2="313.0469"/><polygon fill="#181818" points="311.3242,303.0469,315.3242,313.0469,319.3242,303.0469,315.3242,307.0469" style="stroke:#181818;stroke-width:1;stroke-linejoin:miter;stroke-miterlimit:10;"/><?plantuml-src dP9DajGm38NtEONerKn1vG3Cae8Bm8QbugWJLTcMaMHwcjCZc-5dCIjsiVNqlISvRvhYKH0otgKxM277YeivgYzLd43vE7r9Kisr9nU53r8A-oVaJFl7vqJDMUh3bIjc-EpAzIXaXWSzBbHt69JblVL62W-_AqzFe_O_Fgz0Bx-KaB36FMm4IKhBvBI3SKq4VX8SAht1YGQObN2_m-NjSb7QC6DeTi3WeXaVDGwZeqKu7gO6Bb6Mk5GeL3RI5RwSR770KJtHPuTpeOdTo6z45QnlHjywrP4kvmbgalF38zmYIPPw13Bww-oFyQzyT8q01P_NeLovEkbtp6knTvDzEpcTuFV60ta7ZbcP_aansW8j3IAXjTXNl4au2vG-EaV8buU0ffBYCmJhX7-LFlO8kEyQzy4B1l6SV0klcc9tG_vgG92fYlmzJSz84peklKowyGy2kSA6diw8hEHTnxgv_bbBUFrbAoNHtTRBon_p4m00?></g></svg>