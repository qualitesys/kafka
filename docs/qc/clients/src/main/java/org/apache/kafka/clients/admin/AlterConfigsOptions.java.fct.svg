@startuml
!pragma layout smetana
start
note right
AlterConfigsOptionstimeoutMs(IntegertimeoutMs)
end note
:this.timeoutMs=timeoutMs;
:return this;;
stop
end
start
note right
booleanshouldValidateOnly()
end note
:return validateOnly;;
stop
end
start
note right
AlterConfigsOptionsvalidateOnly(booleanvalidateOnly)
end note
:this.validateOnly=validateOnly;
:return this;;
stop
end
@enduml

