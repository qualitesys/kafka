@startuml
!pragma layout smetana
start
note right
AlterConfigsOptions timeoutMs(Integer timeoutMs)
end note
:this.timeoutMs=timeoutMs;;
:return this;;
stop
end
start
note right
boolean shouldValidateOnly()
end note
:return validateOnly;;
stop
end
start
note right
AlterConfigsOptions validateOnly(boolean validateOnly)
end note
:this.validateOnly=validateOnly;;
:return this;;
stop
end
@enduml

