@startuml
!pragma layout smetana
start
note right
constructor ErrorLoggingCallback(Stringtopic,
byte[]key,byte[]value,booleanlogAsString)
end note
:this.topic=topic;;
:this.key=key;;
if (logAsString) then (yes) 
:this.value=value;;
endif 
:this.valueLength=value==null ? -1:value.length;;
:this.logAsString=logAsString;;
end
start
note right
void onCompletion(RecordMetadatametadata,
Exceptione)
end note
if (e!=null ) then (yes) 
:StringkeyString=(key==null )? String.valueOf("null"):logAsString? new String(key,StandardCharsets.UTF_8):key.length+
" bytes";;
:StringvalueString=(valueLength==-1)? String.valueOf("null"):logAsString? new String(value,StandardCharsets.UTF_8):valueLength+
" bytes";;
:log.error("Error when sending message to topic {} with key: {},
 value: {} with error:",topic,keyString,valueString,e);;
endif 
end
@enduml

