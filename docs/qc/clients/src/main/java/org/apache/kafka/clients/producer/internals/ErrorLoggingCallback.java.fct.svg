@startuml
!pragma layout smetana
start
note right
constructor ErrorLoggingCallback(String topic,
byte[] key,byte[] value,boolean logAsString)
end note
:this.topic=topic;;
:this.key=key;;
if (logAsString) then (yes) 
:this.value=value;;
endif 
:this.valueLength=value==null ? -1:value.length;;
:this.logAsString=logAsString;;
end
start
note right
void onCompletion(RecordMetadata metadata,
Exception e)
end note
if (e!=null ) then (yes) 
:String keyString=(key==null )? String.valueOf("null"):logAsString? new String(key,StandardCharsets.UTF_8):key.length+
" bytes";;
:String valueString=(valueLength==-1)? String.valueOf("null"):logAsString? new String(value,StandardCharsets.UTF_8):valueLength+
" bytes";;
:log.error("Error when sending message to topic {} with key: {},
 value: {} with error:",topic,keyString,valueString,e);;
endif 
end
@enduml

