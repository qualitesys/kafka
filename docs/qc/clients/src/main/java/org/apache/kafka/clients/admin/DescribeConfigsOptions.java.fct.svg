@startuml
!pragma layout smetana
start
note right
DescribeConfigsOptionstimeoutMs(IntegertimeoutMs)
end note
:this.timeoutMs=timeoutMs;
:return this;;
stop
end
start
note right
booleanincludeSynonyms()
end note
:return includeSynonyms;;
stop
end
start
note right
booleanincludeDocumentation()
end note
:return includeDocumentation;;
stop
end
start
note right
DescribeConfigsOptionsincludeSynonyms(booleanincludeSynonyms)
end note
:this.includeSynonyms=includeSynonyms;
:return this;;
stop
end
start
note right
DescribeConfigsOptionsincludeDocumentation(booleanincludeDocumentation)
end note
:this.includeDocumentation=includeDocumentation;
:return this;;
stop
end
@enduml

