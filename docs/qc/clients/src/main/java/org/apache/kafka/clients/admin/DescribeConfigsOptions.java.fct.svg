end note
:return this;;
stop
end
start
note right
booleanincludeSynonyms()
end note
:return includeSynonyms;;
stop
end
start
note right
booleanincludeDocumentation()
end note
:return includeDocumentation;;
stop
end
start
note right
DescribeConfigsOptionsincludeSynonyms(booleanincludeSynonyms)
end note
:return this;;
stop
end
start
note right
DescribeConfigsOptionsincludeDocumentation(booleanincludeDocumentation)
end note
:return this;;
stop
end
@enduml

