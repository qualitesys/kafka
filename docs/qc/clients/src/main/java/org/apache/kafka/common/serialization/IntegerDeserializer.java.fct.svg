@startuml
!pragma layout smetana
start
note right
Integer deserialize(String topic,byte[] data)
end note
if (data==null ) then (yes) 
:return null ;;
stop
endif 
if (data.length!=4) then (yes) 
:throw new SerializationException("Size of data received by IntegerDeserializer is not 4");;
stop
endif 
:int value=0;;
:value<<=8;;
:value|=b&0xFF;;
:return value;;
stop
end
@enduml

