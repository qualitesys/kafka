@startuml
!pragma layout smetana
start
note right
constructor UpdateFeaturesResponse(UpdateFeaturesResponseDatadata)
end note
end
start
note right
ApiErrortopLevelError()
end note
:return new ApiError(Errors.forCode(data.errorCode()),
data.errorMessage());;
stop
end
start
note right
Map<Errors,Integer>errorCounts()
end note
:return errorCounts;;
stop
end
start
note right
intthrottleTimeMs()
end note
:return data.throttleTimeMs();;
stop
end
start
note right
StringtoString()
end note
:return data.toString();;
stop
end
start
note right
UpdateFeaturesResponseDatadata()
end note
:return data;;
stop
end
start
note right
UpdateFeaturesResponseparse(ByteBufferbuffer,
shortversion)
end note
:return new UpdateFeaturesResponse(new UpdateFeaturesResponseData(new ByteBufferAccessor(buffer),
version));;
stop
end
start
note right
UpdateFeaturesResponsecreateWithErrors(ApiErrortopLevelError,
Map<String,ApiError>updateErrors,intthrottleTimeMs)
end note
:return new UpdateFeaturesResponse(responseData);;
stop
end
@enduml

