@startuml
!pragma layout smetana
if (records instanceof MemoryRecords ) then (yes) 
:MemoryRecords memRecords=(MemoryRecords )records;;
:writeByteBuffer(memRecords.buffer());;
else (no)
:throw new UnsupportedOperationException("Unsupported record type "+
records.getClass());;
stop
endif 
:writeLong(uuid.getMostSignificantBits());;
:writeLong(uuid.getLeastSignificantBits());;
:writeShort((short )i);;
:writeInt((int )i);;
@enduml

