gon fill="#181818" points="902,644.4414,906,654.4414,910,644.4414,906,648.4414" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="906" x2="906" y1="535.1172" y2="765.3633"/><line style="stroke:#181818;stroke-width:1.0;" x1="906" x2="630" y1="765.3633" y2="765.3633"/><line style="stroke:#181818;stroke-width:1.0;" x1="630" x2="630" y1="765.3633" y2="785.3633"/><polygon fill="#181818" points="626,775.3633,630,785.3633,634,775.3633,630,779.3633" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="630" x2="630" y1="503.1172" y2="523.1172"/><polygon fill="#181818" points="626,513.1172,630,523.1172,634,513.1172,630,517.1172" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="630" x2="630" y1="819.332" y2="839.332"/><polygon fill="#181818" points="626,829.332,630,839.332,634,829.332,630,833.332" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[93428163c89d4fb9850b351836d4add0]
@startuml
!pragma layout smetana
start
note right
constructor JaasUtils()
end note
end
start
note right
StringzkSecuritySysConfigString()
end note
:return "["+JAVA_LOGIN_CONFIG_PARAM+"="+loginConfig+
", "+ZK_SASL_CLIENT+"="+clientEnabled+", "+
ZK_LOGIN_CONTEXT_NAME_KEY+"="+contextName+
"]";;
stop
end
start
note right
booleanisZkSaslEnabled()
end note
:LOG.debug("Checking login config for Zookeeper JAAS context {}",
zkSecuritySysConfigString());;
:try {ConfigurationloginConf=Configuration.getConfiguration();
:foundLoginConfigEntry=loginConf.getAppConfigurationEntry(zkLoginContextName)!=null ;}catch (Exceptione){throw new KafkaException("Exception while loading Zookeeper JAAS login context "+
zkSecuritySysConfigString(),e);};
if (foundLoginConfigEntry&&!zkSaslEnabled) then (yes) 
:LOG.error("JAAS configuration is present, but system property "+
ZK_SASL_CLIENT+" is set to false, which disables "+
"SASL in the ZooKeeper client");;
:throw new KafkaException("Exception while determining if ZooKeeper is secure "+
zkSecuritySysConfigString());;
stop
endif 
:return foundLoginConfigEntry;;
stop
end
@enduml

