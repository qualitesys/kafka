@startuml
!pragma layout smetana
start
note right
constructor JaasUtils()
end note
end
start
note right
String zkSecuritySysConfigString()
end note
:String loginConfig=System.getProperty(JAVA_LOGIN_CONFIG_PARAM);;
:String clientEnabled=System.getProperty(ZK_SASL_CLIENT,"default:"+
DEFAULT_ZK_SASL_CLIENT);;
:String contextName=System.getProperty(ZK_LOGIN_CONTEXT_NAME_KEY,"default:"+
DEFAULT_ZK_LOGIN_CONTEXT_NAME);;
:return "["+JAVA_LOGIN_CONFIG_PARAM+"="+loginConfig+
", "+ZK_SASL_CLIENT+"="+clientEnabled+", "+
ZK_LOGIN_CONTEXT_NAME_KEY+"="+contextName+
"]";;
stop
end
start
note right
boolean isZkSaslEnabled()
end note
:boolean zkSaslEnabled=Boolean.parseBoolean(System.getProperty(ZK_SASL_CLIENT,
DEFAULT_ZK_SASL_CLIENT));;
:String zkLoginContextName=System.getProperty(ZK_LOGIN_CONTEXT_NAME_KEY,
DEFAULT_ZK_LOGIN_CONTEXT_NAME);;
:LOG.debug("Checking login config for Zookeeper JAAS context {}",
zkSecuritySysConfigString());;
:boolean foundLoginConfigEntry;;
switch (try/catch block)
case (try)
:Configuration loginConf=Configuration.getConfiguration();;
:foundLoginConfigEntry=loginConf.getAppConfigurationEntry(zkLoginContextName)!=null ;;
case (catch (Exception e))
:throw new KafkaException("Exception while loading Zookeeper JAAS login context "+
zkSecuritySysConfigString(),e);;
stop
endswitch
if (foundLoginConfigEntry&&!zkSaslEnabled) then (yes) 
:LOG.error("JAAS configuration is present, but system property "+
ZK_SASL_CLIENT+" is set to false, which disables "+
"SASL in the ZooKeeper client");;
:throw new KafkaException("Exception while determining if ZooKeeper is secure "+
zkSecuritySysConfigString());;
stop
endif 
:return foundLoginConfigEntry;;
stop
end
@enduml

