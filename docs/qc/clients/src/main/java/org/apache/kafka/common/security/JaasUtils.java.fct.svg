h:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="379.5" x2="379.5" y1="461.2109" y2="481.2109"/><polygon fill="#181818" points="375.5,471.2109,379.5,481.2109,383.5,471.2109,379.5,475.2109" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="379.5" x2="379.5" y1="693.0195" y2="713.0195"/><polygon fill="#181818" points="375.5,703.0195,379.5,713.0195,383.5,703.0195,379.5,707.0195" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="379.5" x2="379.5" y1="746.9883" y2="766.9883"/><polygon fill="#181818" points="375.5,756.9883,379.5,766.9883,383.5,756.9883,379.5,760.9883" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[fdf7aa99996a75192b08e8eb576ee9e5]
@startuml
!pragma layout smetana
start
note right
constructor JaasUtils()
end note
end
start
note right
StringzkSecuritySysConfigString()
end note
:return "["+JAVA_LOGIN_CONFIG_PARAM+"="+loginConfig+",
 "+ZK_SASL_CLIENT+"="+clientEnabled+", "+ZK_LOGIN_CONTEXT_NAME_KEY+"="+contextName+"]";;
stop
end
start
note right
booleanisZkSaslEnabled()
end note
:LOG.debug("Checking login config for Zookeeper JAAS context {}",
zkSecuritySysConfigString());
:foundLoginConfigEntry=loginConf.getAppConfigurationEntry(zkLoginContextName)!=null ;
:throw new KafkaException("Exception while loading Zookeeper JAAS login context "+zkSecuritySysConfigString(),e);;
if (foundLoginConfigEntry&&!zkSaslEnabled) then (yes) 
:LOG.error("JAAS configuration is present,
 but system property "+ZK_SASL_CLIENT+" is set to false, which disables "
+"SASL in the ZooKeeper client");
:throw new KafkaException("Exception while determining if ZooKeeper is secure "+zkSecuritySysConfigString());;
endif 
:return foundLoginConfigEntry;;
stop
end
@enduml

