29.9102" y2="729.9102"/><polygon fill="#181818" points="401.5,725.9102,391.5,729.9102,401.5,733.9102,397.5,729.9102" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="379.5" x2="379.5" y1="697.9102" y2="717.9102"/><polygon fill="#181818" points="375.5,707.9102,379.5,717.9102,383.5,707.9102,379.5,711.9102" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="379.5" x2="379.5" y1="489.1484" y2="509.1484"/><polygon fill="#181818" points="375.5,499.1484,379.5,509.1484,383.5,499.1484,379.5,503.1484" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="379.5" x2="379.5" y1="741.9102" y2="761.9102"/><polygon fill="#181818" points="375.5,751.9102,379.5,761.9102,383.5,751.9102,379.5,755.9102" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="379.5" x2="379.5" y1="795.8789" y2="815.8789"/><polygon fill="#181818" points="375.5,805.8789,379.5,815.8789,383.5,805.8789,379.5,809.8789" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[836905b7fb5a52093f73a89653fe14aa]
@startuml
!pragma layout smetana
start
note right
constructor JaasUtils()
end note
end
start
note right
StringzkSecuritySysConfigString()
end note
:return "["+JAVA_LOGIN_CONFIG_PARAM+"="+loginConfig+
", "+ZK_SASL_CLIENT+"="+clientEnabled+", "+
ZK_LOGIN_CONTEXT_NAME_KEY+"="+contextName+
"]";;
stop
end
start
note right
booleanisZkSaslEnabled()
end note
:LOG.debug("Checking login config for Zookeeper JAAS context {}",
zkSecuritySysConfigString());
:foundLoginConfigEntry=loginConf.getAppConfigurationEntry(zkLoginContextName)!=null ;
:throw new KafkaException("Exception while loading Zookeeper JAAS login context "+zkSecuritySysConfigString(),e);;
if (foundLoginConfigEntry&&!zkSaslEnabled) then (yes) 
:LOG.error("JAAS configuration is present, but system property "+
ZK_SASL_CLIENT+" is set to false, which disables "+
"SASL in the ZooKeeper client");
:throw new KafkaException("Exception while determining if ZooKeeper is secure "+
zkSecuritySysConfigString());;
endif 
:return foundLoginConfigEntry;;
stop
end
@enduml

