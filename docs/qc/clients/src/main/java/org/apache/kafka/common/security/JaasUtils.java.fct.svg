.5" x2="573.5" y1="535.1172" y2="743.8789"/><line style="stroke:#181818;stroke-width:1.0;" x1="573.5" x2="309.5" y1="743.8789" y2="743.8789"/><polygon fill="#181818" points="319.5,739.8789,309.5,743.8789,319.5,747.8789,315.5,743.8789" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="297.5" x2="297.5" y1="711.8789" y2="731.8789"/><polygon fill="#181818" points="293.5,721.8789,297.5,731.8789,301.5,721.8789,297.5,725.8789" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="297.5" x2="297.5" y1="503.1172" y2="523.1172"/><polygon fill="#181818" points="293.5,513.1172,297.5,523.1172,301.5,513.1172,297.5,517.1172" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="297.5" x2="297.5" y1="755.8789" y2="775.8789"/><polygon fill="#181818" points="293.5,765.8789,297.5,775.8789,301.5,765.8789,297.5,769.8789" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="297.5" x2="297.5" y1="809.8477" y2="829.8477"/><polygon fill="#181818" points="293.5,819.8477,297.5,829.8477,301.5,819.8477,297.5,823.8477" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[11120ecd7a173bf682fa4f0d84ec1c52]
@startuml
!pragma layout smetana
start
note right
constructor JaasUtils()
end note
end
start
note right
StringzkSecuritySysConfigString()
end note
:return "["+JAVA_LOGIN_CONFIG_PARAM+"="+loginConfig+
", "+ZK_SASL_CLIENT+"="+clientEnabled+", "+
ZK_LOGIN_CONTEXT_NAME_KEY+"="+contextName+
"]";;
stop
end
start
note right
booleanisZkSaslEnabled()
end note
:LOG.debug("Checking login config for Zookeeper JAAS context {}",
zkSecuritySysConfigString());
:foundLoginConfigEntry=loginConf.getAppConfigurationEntry(zkLoginContextName)!=null ;
:throw new KafkaException("Exception while loading Zookeeper JAAS login context "+
zkSecuritySysConfigString(),e);;
if (foundLoginConfigEntry&&!zkSaslEnabled) then (yes) 
:LOG.error("JAAS configuration is present, but system property "+
ZK_SASL_CLIENT+" is set to false, which disables "+
"SASL in the ZooKeeper client");
:throw new KafkaException("Exception while determining if ZooKeeper is secure "+
zkSecuritySysConfigString());;
endif 
:return foundLoginConfigEntry;;
stop
end
@enduml

