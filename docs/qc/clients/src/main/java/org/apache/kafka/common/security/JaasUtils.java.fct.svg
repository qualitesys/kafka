.6758" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="513.5" x2="513.5" y1="481.6758" y2="501.6758"/><polygon fill="#181818" points="509.5,491.6758,513.5,501.6758,517.5,491.6758,513.5,495.6758" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="513.5" x2="513.5" y1="379.3047" y2="399.3047"/><polygon fill="#181818" points="509.5,389.3047,513.5,399.3047,517.5,389.3047,513.5,393.3047" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="513.5" x2="513.5" y1="525.6758" y2="545.6758"/><polygon fill="#181818" points="509.5,535.6758,513.5,545.6758,517.5,535.6758,513.5,539.6758" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="513.5" x2="513.5" y1="579.6445" y2="599.6445"/><polygon fill="#181818" points="509.5,589.6445,513.5,599.6445,517.5,589.6445,513.5,593.6445" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[e50932a9180f2e7815e09a78bf73ed9c]
@startuml
!pragma layout smetana
start
note right
constructor JaasUtils()
end note
end
start
note right
StringzkSecuritySysConfigString()
end note
:return "["+JAVA_LOGIN_CONFIG_PARAM+"="+loginConfig+", "+ZK_SASL_CLIENT+"="+clientEnabled+", "+ZK_LOGIN_CONTEXT_NAME_KEY+"="+contextName+"]";;
stop
end
start
note right
booleanisZkSaslEnabled()
end note
:LOG.debug("Checking login config for Zookeeper JAAS context {}",zkSecuritySysConfigString());
:foundLoginConfigEntry=loginConf.getAppConfigurationEntry(zkLoginContextName)!=null ;
if (foundLoginConfigEntry&&!zkSaslEnabled) then (yes) 
:LOG.error("JAAS configuration is present, but system property "+ZK_SASL_CLIENT+" is set to false, which disables "+"SASL in the ZooKeeper client");
endif 
:return foundLoginConfigEntry;;
stop
end
@enduml

