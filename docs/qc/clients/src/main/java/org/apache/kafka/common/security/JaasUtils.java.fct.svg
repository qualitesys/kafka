133" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="427" x2="575.5" y1="1108.7109" y2="1108.7109"/><polygon fill="#181818" points="571.5,1218.0352,575.5,1228.0352,579.5,1218.0352,575.5,1222.0352" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="575.5" x2="575.5" y1="1108.7109" y2="1338.957"/><line style="stroke:#181818;stroke-width:1.0;" x1="575.5" x2="299.5" y1="1338.957" y2="1338.957"/><line style="stroke:#181818;stroke-width:1.0;" x1="299.5" x2="299.5" y1="1338.957" y2="1358.957"/><polygon fill="#181818" points="295.5,1348.957,299.5,1358.957,303.5,1348.957,299.5,1352.957" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="299.5" x2="299.5" y1="1392.9258" y2="1412.9258"/><polygon fill="#181818" points="295.5,1402.9258,299.5,1412.9258,303.5,1402.9258,299.5,1406.9258" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[712f6be7f254deb47d7f631fd4f60060]
@startuml
!pragma layout smetana
start
note right
constructor JaasUtils()
end note
end
start
note right
StringzkSecuritySysConfigString()
end note
:StringloginConfig=System.getProperty(JAVA_LOGIN_CONFIG_PARAM);;
:StringclientEnabled=System.getProperty(ZK_SASL_CLIENT,"default:"+
DEFAULT_ZK_SASL_CLIENT);;
:StringcontextName=System.getProperty(ZK_LOGIN_CONTEXT_NAME_KEY,"default:"+
DEFAULT_ZK_LOGIN_CONTEXT_NAME);;
:return "["+JAVA_LOGIN_CONFIG_PARAM+"="+loginConfig+
", "+ZK_SASL_CLIENT+"="+clientEnabled+", "+
ZK_LOGIN_CONTEXT_NAME_KEY+"="+contextName+
"]";;
stop
end
start
note right
booleanisZkSaslEnabled()
end note
:booleanzkSaslEnabled=Boolean.parseBoolean(System.getProperty(ZK_SASL_CLIENT,
DEFAULT_ZK_SASL_CLIENT));;
:StringzkLoginContextName=System.getProperty(ZK_LOGIN_CONTEXT_NAME_KEY,
DEFAULT_ZK_LOGIN_CONTEXT_NAME);;
:LOG.debug("Checking login config for Zookeeper JAAS context {}",
zkSecuritySysConfigString());;
:booleanfoundLoginConfigEntry;;
:try ;
:ConfigurationloginConf=Configuration.getConfiguration();;
:foundLoginConfigEntry=loginConf.getAppConfigurationEntry(zkLoginContextName)!=null ;;
:catch (Exceptione);
:throw new KafkaException("Exception while loading Zookeeper JAAS login context "+
zkSecuritySysConfigString(),e);;
stop
if (foundLoginConfigEntry&&!zkSaslEnabled) then (yes) 
:LOG.error("JAAS configuration is present, but system property "+
ZK_SASL_CLIENT+" is set to false, which disables "+
"SASL in the ZooKeeper client");;
:throw new KafkaException("Exception while determining if ZooKeeper is secure "+
zkSecuritySysConfigString());;
stop
endif 
:return foundLoginConfigEntry;;
stop
end
@enduml

