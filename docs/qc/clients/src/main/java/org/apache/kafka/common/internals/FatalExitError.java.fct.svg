@startuml
!pragma layout smetana
start
note right
constructor FatalExitError(intstatusCode)
end note
if (statusCode==0) then (yes) 
:throw new IllegalArgumentException("statusCode must not be 0");;
endif 
:this.statusCode=statusCode;
end
start
note right
constructor FatalExitError()
end note
:this(1);
end
start
note right
intstatusCode()
end note
:return statusCode;;
stop
end
@enduml

