@startuml
!pragma layout smetana
start
note right
AccessTokenValidatorcreate(Map<String,? >configs)
end note
:return create(configs,(String)null );;
stop
end
start
note right
AccessTokenValidatorcreate(Map<String,? >configs,
StringsaslMechanism)
end note
:ConfigurationUtilscu=new ConfigurationUtils(configs,
saslMechanism);;
:StringscopeClaimName=cu.get(SASL_OAUTHBEARER_SCOPE_CLAIM_NAME);;
:StringsubClaimName=cu.get(SASL_OAUTHBEARER_SUB_CLAIM_NAME);;
:return new LoginAccessTokenValidator(scopeClaimName,
subClaimName);;
stop
end
start
note right
AccessTokenValidatorcreate(Map<String,? >configs,
VerificationKeyResolververificationKeyResolver)
end note
:return create(configs,null ,verificationKeyResolver);;
stop
end
start
note right
AccessTokenValidatorcreate(Map<String,? >configs,
StringsaslMechanism,VerificationKeyResolververificationKeyResolver)
end note
:ConfigurationUtilscu=new ConfigurationUtils(configs,
saslMechanism);;
:Set<String>expectedAudiences=null ;;
:List<String>l=cu.get(SASL_OAUTHBEARER_EXPECTED_AUDIENCE);;
if (l!=null ) then (yes) 
:expectedAudiences=Collections.unmodifiableSet(new HashSet<>(l));;
endif 
:IntegerclockSkew=cu.validateInteger(SASL_OAUTHBEARER_CLOCK_SKEW_SECONDS,
false);;
:StringexpectedIssuer=cu.validateString(SASL_OAUTHBEARER_EXPECTED_ISSUER,
false);;
:StringscopeClaimName=cu.validateString(SASL_OAUTHBEARER_SCOPE_CLAIM_NAME);;
:StringsubClaimName=cu.validateString(SASL_OAUTHBEARER_SUB_CLAIM_NAME);;
:return new ValidatorAccessTokenValidator(clockSkew,
expectedAudiences,expectedIssuer,verificationKeyResolver,
scopeClaimName,subClaimName);;
stop
end
@enduml

