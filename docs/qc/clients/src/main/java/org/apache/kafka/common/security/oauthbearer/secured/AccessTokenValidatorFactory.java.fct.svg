@startuml
!pragma layout smetana
start
note right
AccessTokenValidator create(Map<String,?> configs)
end note
:return create(configs,(String )null );;
stop
end
start
note right
AccessTokenValidator create(Map<String,?> configs,
String saslMechanism)
end note
:ConfigurationUtils cu=new ConfigurationUtils(configs,
saslMechanism);;
:String scopeClaimName=cu.get(SASL_OAUTHBEARER_SCOPE_CLAIM_NAME);;
:String subClaimName=cu.get(SASL_OAUTHBEARER_SUB_CLAIM_NAME);;
:return new LoginAccessTokenValidator(scopeClaimName,
subClaimName);;
stop
end
start
note right
AccessTokenValidator create(Map<String,?> configs,
VerificationKeyResolver verificationKeyResolver)
end note
:return create(configs,null ,verificationKeyResolver);;
stop
end
start
note right
AccessTokenValidator create(Map<String,?> configs,
String saslMechanism,VerificationKeyResolver verificationKeyResolver)
end note
:ConfigurationUtils cu=new ConfigurationUtils(configs,
saslMechanism);;
:Set<String> expectedAudiences=null ;;
:List<String> l=cu.get(SASL_OAUTHBEARER_EXPECTED_AUDIENCE);;
if (l!=null ) then (yes) 
:expectedAudiences=Collections.unmodifiableSet(new HashSet<>(l));;
endif 
:Integer clockSkew=cu.validateInteger(SASL_OAUTHBEARER_CLOCK_SKEW_SECONDS,
false);;
:String expectedIssuer=cu.validateString(SASL_OAUTHBEARER_EXPECTED_ISSUER,
false);;
:String scopeClaimName=cu.validateString(SASL_OAUTHBEARER_SCOPE_CLAIM_NAME);;
:String subClaimName=cu.validateString(SASL_OAUTHBEARER_SUB_CLAIM_NAME);;
:return new ValidatorAccessTokenValidator(clockSkew,
expectedAudiences,expectedIssuer,verificationKeyResolver,
scopeClaimName,subClaimName);;
stop
end
@enduml

