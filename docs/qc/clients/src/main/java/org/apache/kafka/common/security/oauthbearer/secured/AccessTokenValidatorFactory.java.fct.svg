@startuml
!pragma layout smetana
start
note right
AccessTokenValidatorcreate(Map<String,? >configs)
end note
:return create(configs,(String)null );;
stop
end
start
note right
AccessTokenValidatorcreate(Map<String,? >configs,StringsaslMechanism)
end note
:return new LoginAccessTokenValidator(scopeClaimName,
subClaimName);;
stop
end
start
note right
AccessTokenValidatorcreate(Map<String,? >configs,VerificationKeyResolververificationKeyResolver)
end note
:return create(configs,null ,verificationKeyResolver);;
stop
end
start
note right
AccessTokenValidatorcreate(Map<String,? >configs,StringsaslMechanism,VerificationKeyResolververificationKeyResolver)
end note
if (l!=null ) then (yes) 
:expectedAudiences=Collections.unmodifiableSet(new HashSet<>(l));
endif 
:return new ValidatorAccessTokenValidator(clockSkew,
expectedAudiences,expectedIssuer,verificationKeyResolver,
scopeClaimName,subClaimName);;
stop
end
@enduml

