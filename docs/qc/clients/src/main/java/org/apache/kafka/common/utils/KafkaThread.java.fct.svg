@startuml
!pragma layout smetana
start
note right
KafkaThread daemon(final String name,Runnable runnable)
end note
:return new KafkaThread(name,runnable,true);;
stop
end
start
note right
KafkaThread nonDaemon(final String name,Runnable runnable)
end note
:return new KafkaThread(name,runnable,false);;
stop
end
start
note right
constructor KafkaThread(final String name,
boolean daemon)
end note
:super (name);;
:configureThread(name,daemon);;
end
start
note right
constructor KafkaThread(final String name,
Runnable runnable,boolean daemon)
end note
:super (runnable,name);;
:configureThread(name,daemon);;
end
start
note right
void configureThread(final String name,boolean daemon)
end note
:setDaemon(daemon);;
:setUncaughtExceptionHandler((t,e)->log.error("Uncaught exception in thread '{}':",
name,e));;
end
@enduml

