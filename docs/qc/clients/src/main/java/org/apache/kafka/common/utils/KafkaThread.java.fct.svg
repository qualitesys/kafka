@startuml
!pragma layout smetana
start
note right
KafkaThreaddaemon(final Stringname,Runnablerunnable)
end note
:return new KafkaThread(name,runnable,true);;
stop
end
start
note right
KafkaThreadnonDaemon(final Stringname,Runnablerunnable)
end note
:return new KafkaThread(name,runnable,false);;
stop
end
start
note right
constructor KafkaThread(final Stringname,
booleandaemon)
end note
end
start
note right
constructor KafkaThread(final Stringname,
Runnablerunnable,booleandaemon)
end note
end
start
note right
void configureThread(final Stringname,booleandaemon)
end note
end
@enduml

