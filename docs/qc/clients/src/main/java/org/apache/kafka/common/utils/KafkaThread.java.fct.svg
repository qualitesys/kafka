@startuml
!pragma layout smetana
start
note right
KafkaThreaddaemon(final Stringname,Runnablerunnable)
end note
:return new KafkaThread(name,runnable,true);;
stop
end
start
note right
KafkaThreadnonDaemon(final Stringname,Runnablerunnable)
end note
:return new KafkaThread(name,runnable,false);;
stop
end
start
note right
constructor KafkaThread(final Stringname,booleandaemon)
end note
:super (name);
:configureThread(name,daemon);
end
start
note right
constructor KafkaThread(final Stringname,Runnablerunnable,booleandaemon)
end note
:super (runnable,name);
:configureThread(name,daemon);
end
start
note right
void configureThread(final Stringname,booleandaemon)
end note
:setDaemon(daemon);
:setUncaughtExceptionHandler((t,e)->log.error("Uncaught exception in thread '{}':",name,e));
end
@enduml

