@startuml
!pragma layout smetana
:CODE_TO_VALUE.put(permissionType.code,permissionType);;
start
note right
AclPermissionType fromString(String str)
end note
switch (try/catch block)
case (try)
:return AclPermissionType.valueOf(str.toUpperCase(Locale.ROOT));;
stop
case (catch (IllegalArgumentException e))
:return UNKNOWN;;
stop
endswitch
end
start
note right
AclPermissionType fromCode(byte code)
end note
:AclPermissionType permissionType=CODE_TO_VALUE.get(code);;
if (permissionType==null ) then (yes) 
:return UNKNOWN;;
stop
endif 
:return permissionType;;
stop
end
start
note right
constructor AclPermissionType(byte code)
end note
:this.code=code;;
end
start
note right
byte code()
end note
:return code;;
stop
end
start
note right
boolean isUnknown()
end note
:return this==UNKNOWN;;
stop
end
@enduml

