@startuml
!pragma layout smetana
:CODE_TO_VALUE.put(permissionType.code,permissionType);
start
note right
AclPermissionTypefromString(Stringstr)
end note
:return AclPermissionType.valueOf(str.toUpperCase(Locale.ROOT));;
stop
:return UNKNOWN;;
stop
end
start
note right
AclPermissionTypefromCode(bytecode)
end note
if (permissionType==null ) then (yes) 
:return UNKNOWN;;
stop
endif 
:return permissionType;;
stop
end
start
note right
constructor AclPermissionType(bytecode)
end note
:this.code=code;
end
start
note right
bytecode()
end note
:return code;;
stop
end
start
note right
booleanisUnknown()
end note
:return this==UNKNOWN;;
stop
end
@enduml

