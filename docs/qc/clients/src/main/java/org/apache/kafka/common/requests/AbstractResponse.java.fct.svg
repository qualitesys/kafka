@startuml
!pragma layout smetana
start
note right
constructor AbstractResponse(ApiKeysapiKey)
end note
:this.apiKey=apiKey;;
end
start
note right
SendtoSend(ResponseHeaderheader,shortversion)
end note
:return SendBuilder.buildResponseSend(header,
data(),version);;
stop
end
start
note right
ByteBufferserializeWithHeader(ResponseHeaderheader,
shortversion)
end note
:return RequestUtils.serialize(header.data(),
header.headerVersion(),data(),version);;
stop
end
start
note right
ByteBufferserialize(shortversion)
end note
:return MessageUtil.toByteBuffer(data(),version);;
stop
end
start
note right
Map<Errors,Integer>errorCounts(Errorserror)
end note
:return Collections.singletonMap(error,1);;
stop
end
start
note right
Map<Errors,Integer>errorCounts(Stream<Errors>errors)
end note
:return errors.collect(Collectors.groupingBy(e->e,
Collectors.summingInt(e->1)));;
stop
end
start
note right
Map<Errors,Integer>errorCounts(Collection<Errors>errors)
end note
:Map<Errors,Integer>errorCounts=new HashMap<>();;
:updateErrorCounts(errorCounts,error);;
:return errorCounts;;
stop
end
start
note right
Map<Errors,Integer>apiErrorCounts(Map<? ,
ApiError>errors)
end note
:Map<Errors,Integer>errorCounts=new HashMap<>();;
:updateErrorCounts(errorCounts,apiError.error());;
:return errorCounts;;
stop
end
start
note right
void updateErrorCounts(Map<Errors,Integer>errorCounts,
Errorserror)
end note
:Integercount=errorCounts.getOrDefault(error,0);;
:errorCounts.put(error,count+1);;
end
start
note right
AbstractResponseparseResponse(ByteBufferbuffer,
RequestHeaderrequestHeader)
end note
:ApiKeysapiKey=requestHeader.apiKey();;
:shortapiVersion=requestHeader.apiVersion();;
:ResponseHeaderresponseHeader=ResponseHeader.parse(buffer,
apiKey.responseHeaderVersion(apiVersion));;
if (requestHeader.correlationId()!=responseHeader.correlationId()) then (yes) 
:throw new CorrelationIdMismatchException("Correlation id for response ("+
responseHeader.correlationId()+") does not match request ("+
requestHeader.correlationId()+"), request header: "+
requestHeader,requestHeader.correlationId(),
responseHeader.correlationId());;
stop
endif 
:return AbstractResponse.parseResponse(apiKey,
buffer,apiVersion);;
stop
end
start
note right
AbstractResponseparseResponse(ApiKeysapiKey,
ByteBufferresponseBuffer,shortversion)
end note
switch (switch (apiKey))
endswith
end
start
note right
booleanshouldClientThrottle(shortversion)
end note
:return false;;
stop
end
start
note right
ApiKeysapiKey()
end note
:return apiKey;;
stop
end
start
note right
StringtoString()
end note
:return data().toString();;
stop
end
@enduml

