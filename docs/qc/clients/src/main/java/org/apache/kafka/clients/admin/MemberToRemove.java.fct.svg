@startuml
!pragma layout smetana
start
note right
constructor MemberToRemove(StringgroupInstanceId)
end note
:this.groupInstanceId=groupInstanceId;
end
start
note right
booleanequals(Objecto)
end note
if (o instanceof MemberToRemove) then (yes) 
:return this.groupInstanceId.equals(otherMember.groupInstanceId);;
stop
else (no)
:return false;;
stop
endif 
end
start
note right
inthashCode()
end note
:return Objects.hash(groupInstanceId);;
stop
end
start
note right
MemberIdentitytoMemberIdentity()
end note
:return new MemberIdentity().setGroupInstanceId(groupInstanceId).setMemberId(JoinGroupRequest.UNKNOWN_MEMBER_ID);;
stop
end
start
note right
StringgroupInstanceId()
end note
:return groupInstanceId;;
stop
end
@enduml

