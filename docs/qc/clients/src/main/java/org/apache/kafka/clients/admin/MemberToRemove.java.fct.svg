@startuml
!pragma layout smetana
start
note right
constructor MemberToRemove(String groupInstanceId)
end note
:this.groupInstanceId=groupInstanceId;;
end
start
note right
boolean equals(Object o)
end note
if (o instanceof MemberToRemove ) then (yes) 
:MemberToRemove otherMember=(MemberToRemove )o;;
:return this.groupInstanceId.equals(otherMember.groupInstanceId);;
stop
else (no)
:return false;;
stop
endif 
end
start
note right
int hashCode()
end note
:return Objects.hash(groupInstanceId);;
stop
end
start
note right
MemberIdentity toMemberIdentity()
end note
:return new MemberIdentity().setGroupInstanceId(groupInstanceId)
.setMemberId(JoinGroupRequest.UNKNOWN_MEMBER_ID);;
stop
end
start
note right
String groupInstanceId()
end note
:return groupInstanceId;;
stop
end
@enduml

