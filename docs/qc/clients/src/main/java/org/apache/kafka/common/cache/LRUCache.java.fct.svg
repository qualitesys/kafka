@startuml
!pragma layout smetana
start
note right
constructor LRUCache(final int maxSize)
end note
:cache=new LinkedHashMap<K ,V >(16,.75f,true){@Override protected boolean removeEldestEntry(Map.Entry<K,
V> eldest){return this.size()>maxSize;}};;
end
start
note right
V get(K key)
end note
:return cache.get(key);;
stop
end
start
note right
void put(K key,V value)
end note
:cache.put(key,value);;
end
start
note right
boolean remove(K key)
end note
:return cache.remove(key)!=null ;;
stop
end
start
note right
long size()
end note
:return cache.size();;
stop
end
@enduml

