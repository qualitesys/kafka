@startuml
!pragma layout smetana
start
note right
constructor LRUCache(final intmaxSize)
end note
:cache=new LinkedHashMap<K,V>(16,.75f,true){@Override protected booleanremoveEldestEntry(Map.Entry<K,V>eldest){return this.size()>maxSize;}};
end
start
note right
Vget(Kkey)
end note
:return cache.get(key);;
stop
end
start
note right
void put(Kkey,Vvalue)
end note
:cache.put(key,value);
end
start
note right
booleanremove(Kkey)
end note
:return cache.remove(key)!=null ;;
stop
end
start
note right
longsize()
end note
:return cache.size();;
stop
end
@enduml

