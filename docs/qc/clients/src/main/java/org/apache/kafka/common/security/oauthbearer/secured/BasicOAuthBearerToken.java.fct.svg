229.8828" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="263" x2="263" y1="1311.7578" y2="1331.7578"/><polygon fill="#181818" points="259,1321.7578,263,1331.7578,267,1321.7578,263,1325.7578" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[3c5e14d71c97e3479ae0c80e04bf6dce]
@startuml
!pragma layout smetana
start
note right
constructor BasicOAuthBearerToken(Stringtoken,
Set<String>scopes,longlifetimeMs,StringprincipalName,
LongstartTimeMs)
end note
:this.token=token;
:this.scopes=scopes;
:this.lifetimeMs=lifetimeMs;
:this.principalName=principalName;
:this.startTimeMs=startTimeMs;
end
start
note right
Stringvalue()
end note
:return token;;
stop
end
start
note right
Set<String>scope()
end note
:return scopes;;
stop
end
start
note right
longlifetimeMs()
end note
:return lifetimeMs;;
stop
end
start
note right
StringprincipalName()
end note
:return principalName;;
stop
end
start
note right
LongstartTimeMs()
end note
:return startTimeMs;;
stop
end
start
note right
StringtoString()
end note
:return new StringJoiner(", ",BasicOAuthBearerToken.class .getSimpleName()+
"[","]").add("token='"+token+"'").add("scopes="+
scopes).add("lifetimeMs="+lifetimeMs).add("principalName='"+
principalName+"'").add("startTimeMs="+startTimeMs).toString();;
stop
end
@enduml

