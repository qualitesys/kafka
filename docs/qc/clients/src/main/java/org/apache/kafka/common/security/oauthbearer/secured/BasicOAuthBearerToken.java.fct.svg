="1239.5859" y2="1259.5859"/><polygon fill="#181818" points="816.5,1249.5859,820.5,1259.5859,824.5,1249.5859,820.5,1253.5859" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[1e9769f27620a1e78d12775c1996696f]
@startuml
!pragma layout smetana
start
note right
constructor BasicOAuthBearerToken(Stringtoken,Set<String>scopes,longlifetimeMs,StringprincipalName,LongstartTimeMs)
end note
:this.token=token;
:this.scopes=scopes;
:this.lifetimeMs=lifetimeMs;
:this.principalName=principalName;
:this.startTimeMs=startTimeMs;
end
start
note right
Stringvalue()
end note
:return token;;
stop
end
start
note right
Set<String>scope()
end note
:return scopes;;
stop
end
start
note right
longlifetimeMs()
end note
:return lifetimeMs;;
stop
end
start
note right
StringprincipalName()
end note
:return principalName;;
stop
end
start
note right
LongstartTimeMs()
end note
:return startTimeMs;;
stop
end
start
note right
StringtoString()
end note
:return new StringJoiner(", ",BasicOAuthBearerToken.class .getSimpleName()+"[","]").add("token='"+token+"'").add("scopes="+scopes).add("lifetimeMs="+lifetimeMs).add("principalName='"+principalName+"'").add("startTimeMs="+startTimeMs).toString();;
stop
end
@enduml

