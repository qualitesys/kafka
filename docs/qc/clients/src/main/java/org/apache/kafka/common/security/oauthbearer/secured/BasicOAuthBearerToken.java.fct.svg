@startuml
!pragma layout smetana
start
note right
constructor BasicOAuthBearerToken(Stringtoken,
Set<String>scopes,longlifetimeMs,StringprincipalName,
LongstartTimeMs)
end note
end
start
note right
Stringvalue()
end note
:return token;;
stop
end
start
note right
Set<String>scope()
end note
:return scopes;;
stop
end
start
note right
longlifetimeMs()
end note
:return lifetimeMs;;
stop
end
start
note right
StringprincipalName()
end note
:return principalName;;
stop
end
start
note right
LongstartTimeMs()
end note
:return startTimeMs;;
stop
end
start
note right
StringtoString()
end note
:return new StringJoiner(", ",BasicOAuthBearerToken.class .getSimpleName()+
"[","]").add("token='"+token+"'").add("scopes="+
scopes).add("lifetimeMs="+lifetimeMs).add("principalName='"+
principalName+"'").add("startTimeMs="+startTimeMs).toString();;
stop
end
@enduml

