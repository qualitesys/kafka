:1.0;" x1="263" x2="263" y1="1295.4609" y2="1315.4609"/><polygon fill="#181818" points="259,1305.4609,263,1315.4609,267,1305.4609,263,1309.4609" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[12151e5c7440c5eafa5675c351339ce6]
@startuml
!pragma layout smetana
start
note right
constructor BasicOAuthBearerToken(Stringtoken,Set<String>scopes,longlifetimeMs,StringprincipalName,LongstartTimeMs)
end note
:this.token=token;
:this.scopes=scopes;
:this.lifetimeMs=lifetimeMs;
:this.principalName=principalName;
:this.startTimeMs=startTimeMs;
end
start
note right
Stringvalue()
end note
:return token;;
stop
end
start
note right
Set<String>scope()
end note
:return scopes;;
stop
end
start
note right
longlifetimeMs()
end note
:return lifetimeMs;;
stop
end
start
note right
StringprincipalName()
end note
:return principalName;;
stop
end
start
note right
LongstartTimeMs()
end note
:return startTimeMs;;
stop
end
start
note right
StringtoString()
end note
:return new StringJoiner(", ",BasicOAuthBearerToken.class .getSimpleName()+
"[","]").add("token='"+token+"'").add("scopes="+
scopes).add("lifetimeMs="+lifetimeMs).add("principalName='"+
principalName+"'").add("startTimeMs="+startTimeMs)
.toString();;
stop
end
@enduml

