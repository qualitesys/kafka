@startuml
!pragma layout smetana
start
note right
constructor KafkaConsumerMetrics(Metricsmetrics,
StringmetricGrpPrefix)
end note
if (lastPollMs==0L) then (yes) 
:return -1d;;
stop
else (no)
:return TimeUnit.SECONDS.convert(now-lastPollMs,
TimeUnit.MILLISECONDS);;
stop
endif 
end
start
note right
void recordPollStart(longpollStartMs)
end note
end
start
note right
void recordPollEnd(longpollEndMs)
end note
end
start
note right
void recordCommitSync(longduration)
end note
end
start
note right
void recordCommitted(longduration)
end note
end
start
note right
void close()
end note
end
@enduml

