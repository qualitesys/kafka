s="612.25,1019.9883,616.25,1029.9883,620.25,1019.9883,616.25,1023.9883" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="819.75" x2="819.75" y1="956.0195" y2="976.0195"/><polygon fill="#181818" points="815.75,966.0195,819.75,976.0195,823.75,966.0195,819.75,970.0195" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="661" x2="616.25" y1="900.0508" y2="900.0508"/><line style="stroke:#181818;stroke-width:1.0;" x1="616.25" x2="616.25" y1="900.0508" y2="922.0508"/><polygon fill="#181818" points="612.25,912.0508,616.25,922.0508,620.25,912.0508,616.25,916.0508" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="775" x2="819.75" y1="900.0508" y2="900.0508"/><line style="stroke:#181818;stroke-width:1.0;" x1="819.75" x2="819.75" y1="900.0508" y2="922.0508"/><polygon fill="#181818" points="815.75,912.0508,819.75,922.0508,823.75,912.0508,819.75,916.0508" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="718" x2="718" y1="850.3516" y2="888.0508"/><polygon fill="#181818" points="714,878.0508,718,888.0508,722,878.0508,718,882.0508" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[85298636464a51c54d7a3a90e6d68e6f]
@startuml
!pragma layout smetana
start
note right
constructor DeleteConsumerGroupOffsetsResult(KafkaFuture<Map<TopicPartition,
Errors>>future,Set<TopicPartition>partitions)
end note
:this.future=future;
:this.partitions=partitions;
end
start
note right
KafkaFuture<Void>partitionResult(final TopicPartitionpartition)
end note
if (!partitions.contains(partition)) then (yes) 
:throw new IllegalArgumentException("Partition "+partition+" was not included in the original request");;
endif 
:this.future.whenComplete((topicPartitions,
throwable)->{if (throwable!=null ){result.completeExceptionally(throwable);}else if (!maybeCompleteExceptionally(topicPartitions,partition,result)){result.complete(null );}});
:return result;;
stop
end
start
note right
KafkaFuture<Void>all()
end note
:this.future.whenComplete((topicPartitions,
throwable)->{if (throwable!=null ){result.completeExceptionally(throwable);}else {for (TopicPartitionpartition:partitions){if (maybeCompleteExceptionally(topicPartitions,partition,result)){return ;}}result.complete(null );}});
:return result;;
stop
end
start
note right
booleanmaybeCompleteExceptionally(Map<TopicPartition,
Errors>partitionLevelErrors,TopicPartitionpartition,
KafkaFutureImpl<Void>result)
end note
if (exception!=null ) then (yes) 
:result.completeExceptionally(exception);
:return true;;
stop
else (no)
:return false;;
stop
endif 
end
@enduml

