@startuml
!pragma layout smetana
start
note right
constructor DeleteConsumerGroupOffsetsResult(KafkaFuture<Map<TopicPartition,
Errors>> future,Set<TopicPartition> partitions)
end note
:this.future=future;;
:this.partitions=partitions;;
end
start
note right
KafkaFuture<Void> partitionResult(final TopicPartition partition)
end note
if (!partitions.contains(partition)) then (yes) 
:throw new IllegalArgumentException("Partition "+
partition+" was not included in the original request");;
stop
endif 
:final KafkaFutureImpl<Void> result=new KafkaFutureImpl<>();;
:this.future.whenComplete((topicPartitions,
throwable)->{if (throwable!=null ){result.completeExceptionally(throwable);}else if (!maybeCompleteExceptionally(topicPartitions,
partition,result)){result.complete(null );}});;
:return result;;
stop
end
start
note right
KafkaFuture<Void> all()
end note
:final KafkaFutureImpl<Void> result=new KafkaFutureImpl<>();;
:this.future.whenComplete((topicPartitions,
throwable)->{if (throwable!=null ){result.completeExceptionally(throwable);}else {for (TopicPartition partition:partitions){if (maybeCompleteExceptionally(topicPartitions,
partition,result)){return ;}}result.complete(null );}});;
:return result;;
stop
end
start
note right
boolean maybeCompleteExceptionally(Map<TopicPartition,
Errors> partitionLevelErrors,TopicPartition partition,
