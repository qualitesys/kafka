207" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="188.5" x2="188.5" y1="620.5078" y2="658.207"/><polygon fill="#181818" points="184.5,648.207,188.5,658.207,192.5,648.207,188.5,652.207" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[a228a5c49c9b0d7d4e70c4918f49d311]
@startuml
!pragma layout smetana
start
note right
constructor DeleteConsumerGroupOffsetsResult(KafkaFuture<Map<TopicPartition,
Errors>>future,Set<TopicPartition>partitions)
end note
end
start
note right
KafkaFuture<Void>partitionResult(final TopicPartitionpartition)
end note
if (!partitions.contains(partition)) then (yes) 
:throw new IllegalArgumentException("Partition "+
partition+" was not included in the original request");;
endif 
:return result;;
stop
end
start
note right
KafkaFuture<Void>all()
end note
:return result;;
stop
end
start
note right
booleanmaybeCompleteExceptionally(Map<TopicPartition,
Errors>partitionLevelErrors,TopicPartitionpartition,
KafkaFutureImpl<Void>result)
end note
if (exception!=null ) then (yes) 
:return true;;
stop
else (no)
:return false;;
stop
endif 
end
@enduml

