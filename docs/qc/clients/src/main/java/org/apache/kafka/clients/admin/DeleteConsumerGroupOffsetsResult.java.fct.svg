23.75,934.5898,819.75,938.5898" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="661" x2="616.25" y1="868.6211" y2="868.6211"/><line style="stroke:#181818;stroke-width:1.0;" x1="616.25" x2="616.25" y1="868.6211" y2="890.6211"/><polygon fill="#181818" points="612.25,880.6211,616.25,890.6211,620.25,880.6211,616.25,884.6211" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="775" x2="819.75" y1="868.6211" y2="868.6211"/><line style="stroke:#181818;stroke-width:1.0;" x1="819.75" x2="819.75" y1="868.6211" y2="890.6211"/><polygon fill="#181818" points="815.75,880.6211,819.75,890.6211,823.75,880.6211,819.75,884.6211" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="718" x2="718" y1="834.0547" y2="856.6211"/><polygon fill="#181818" points="714,846.6211,718,856.6211,722,846.6211,718,850.6211" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[6e2cf51c5021a5acb7bdf485c4d7bb91]
@startuml
!pragma layout smetana
start
note right
constructor DeleteConsumerGroupOffsetsResult(KafkaFuture<Map<TopicPartition,Errors>>future,Set<TopicPartition>partitions)
end note
:this.future=future;
:this.partitions=partitions;
end
start
note right
KafkaFuture<Void>partitionResult(final TopicPartitionpartition)
end note
if (!partitions.contains(partition)) then (yes) 
:throw new IllegalArgumentException("Partition "+
partition+" was not included in the original request");;
endif 
:this.future.whenComplete((topicPartitions,
throwable)->{if (throwable!=null ){result.completeExceptionally(throwable);}else if (!maybeCompleteExceptionally(topicPartitions,partition,result)){result.complete(null );}});
:return result;;
stop
end
start
note right
KafkaFuture<Void>all()
end note
:this.future.whenComplete((topicPartitions,
throwable)->{if (throwable!=null ){result.completeExceptionally(throwable);}else {for (TopicPartitionpartition:partitions){if (maybeCompleteExceptionally(topicPartitions,partition,result)){return ;}}result.complete(null );}});
:return result;;
stop
end
start
note right
booleanmaybeCompleteExceptionally(Map<TopicPartition,Errors>partitionLevelErrors,TopicPartitionpartition,KafkaFutureImpl<Void>result)
end note
if (exception!=null ) then (yes) 
:result.completeExceptionally(exception);
:return true;;
stop
else (no)
:return false;;
stop
endif 
end
@enduml

