.3438,952.75,786.3438,956.75,776.3438,952.75,780.3438" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="851" x2="851" y1="729.7773" y2="752.3438"/><polygon fill="#181818" points="847,742.3438,851,752.3438,855,742.3438,851,746.3438" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[050650e6d5454718d6e251f483d145fb]
@startuml
!pragma layout smetana
start
note right
constructor DeleteConsumerGroupOffsetsResult(KafkaFuture<Map<TopicPartition,Errors>>future,Set<TopicPartition>partitions)
end note
:this.future=future;
:this.partitions=partitions;
end
start
note right
KafkaFuture<Void>partitionResult(final TopicPartitionpartition)
end note
if (!partitions.contains(partition)) then (yes) 
endif 
:this.future.whenComplete((topicPartitions,throwable)->{if (throwable!=null ){result.completeExceptionally(throwable);}else if (!maybeCompleteExceptionally(topicPartitions,partition,result)){result.complete(null );}});
:return result;;
stop
end
start
note right
KafkaFuture<Void>all()
end note
:this.future.whenComplete((topicPartitions,throwable)->{if (throwable!=null ){result.completeExceptionally(throwable);}else {for (TopicPartitionpartition:partitions){if (maybeCompleteExceptionally(topicPartitions,partition,result)){return ;}}result.complete(null );}});
:return result;;
stop
end
start
note right
booleanmaybeCompleteExceptionally(Map<TopicPartition,Errors>partitionLevelErrors,TopicPartitionpartition,KafkaFutureImpl<Void>result)
end note
if (exception!=null ) then (yes) 
:result.completeExceptionally(exception);
:return true;;
stop
else (no)
:return false;;
stop
endif 
end
@enduml

