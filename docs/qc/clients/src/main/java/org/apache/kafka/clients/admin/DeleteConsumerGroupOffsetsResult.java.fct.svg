le="stroke:#181818;stroke-width:1.0;" x1="616.25" x2="616.25" y1="1023.957" y2="1043.957"/><polygon fill="#181818" points="612.25,1033.957,616.25,1043.957,620.25,1033.957,616.25,1037.957" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="819.75" x2="819.75" y1="969.9883" y2="989.9883"/><polygon fill="#181818" points="815.75,979.9883,819.75,989.9883,823.75,979.9883,819.75,983.9883" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="661" x2="616.25" y1="914.0195" y2="914.0195"/><line style="stroke:#181818;stroke-width:1.0;" x1="616.25" x2="616.25" y1="914.0195" y2="936.0195"/><polygon fill="#181818" points="612.25,926.0195,616.25,936.0195,620.25,926.0195,616.25,930.0195" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="775" x2="819.75" y1="914.0195" y2="914.0195"/><line style="stroke:#181818;stroke-width:1.0;" x1="819.75" x2="819.75" y1="914.0195" y2="936.0195"/><polygon fill="#181818" points="815.75,926.0195,819.75,936.0195,823.75,926.0195,819.75,930.0195" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="718" x2="718" y1="864.3203" y2="902.0195"/><polygon fill="#181818" points="714,892.0195,718,902.0195,722,892.0195,718,896.0195" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[1161d01ef87e350434ff13ccfe324704]
@startuml
!pragma layout smetana
start
note right
constructor DeleteConsumerGroupOffsetsResult(KafkaFuture<Map<TopicPartition,
Errors>>future,Set<TopicPartition>partitions)
end note
:this.future=future;
:this.partitions=partitions;
end
start
note right
KafkaFuture<Void>partitionResult(final TopicPartitionpartition)
end note
if (!partitions.contains(partition)) then (yes) 
:throw new IllegalArgumentException("Partition "+
partition+" was not included in the original request");;
endif 
:this.future.whenComplete((topicPartitions,
throwable)->{if (throwable!=null ){result.completeExceptionally(throwable);}else if (!maybeCompleteExceptionally(topicPartitions,partition,result)){result.complete(null );}});
:return result;;
stop
end
start
note right
KafkaFuture<Void>all()
end note
:this.future.whenComplete((topicPartitions,
throwable)->{if (throwable!=null ){result.completeExceptionally(throwable);}else {for (TopicPartitionpartition:partitions){if (maybeCompleteExceptionally(topicPartitions,partition,result)){return ;}}result.complete(null );}});
:return result;;
stop
end
start
note right
booleanmaybeCompleteExceptionally(Map<TopicPartition,
Errors>partitionLevelErrors,TopicPartitionpartition,
KafkaFutureImpl<Void>result)
end note
if (exception!=null ) then (yes) 
:result.completeExceptionally(exception);
:return true;;
stop
else (no)
:return false;;
stop
endif 
end
@enduml

