@startuml
!pragma layout smetana
start
note right
constructor DeleteConsumerGroupOffsetsResult(KafkaFuture<Map<TopicPartition,
Errors>>future,Set<TopicPartition>partitions)
end note
:this.future=future;;
:this.partitions=partitions;;
end
start
note right
KafkaFuture<Void>partitionResult(final TopicPartitionpartition)
end note
if (!partitions.contains(partition)) then (yes) 
:throw new IllegalArgumentException("Partition "+
partition+" was not included in the original request");;
stop
endif 
:this.future.whenComplete((topicPartitions,
throwable)->{if (throwable!=null ){result.completeExceptionally(throwable);}else if (!maybeCompleteExceptionally(topicPartitions,
partition,result)){result.complete(null );}});;
:return result;;
stop
end
start
note right
KafkaFuture<Void>all()
end note
:this.future.whenComplete((topicPartitions,
throwable)->{if (throwable!=null ){result.completeExceptionally(throwable);}else {for (TopicPartitionpartition:partitions){if (maybeCompleteExceptionally(topicPartitions,
partition,result)){return ;}}result.complete(null );}});;
:return result;;
stop
end
start
note right
booleanmaybeCompleteExceptionally(Map<TopicPartition,
Errors>partitionLevelErrors,TopicPartitionpartition,
KafkaFutureImpl<Void>result)
end note
if (exception!=null ) then (yes) 
:result.completeExceptionally(exception);;
:return true;;
stop
else (no)
:return false;;
stop
endif 
end
@enduml

