gs)</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="71" x="5" y="176.3438">end note</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="149" x="5" y="192.6406">:this(configs,null );</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="30" x="5" y="208.9375">end</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="37" x="5" y="225.2344">start</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="78" x="5" y="241.5313">note right</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="341" x="5" y="257.8281">constructor ConfigurationUtils(Map&lt;String,</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="260" x="5" y="274.125">? &gt;configs,StringsaslMechanism)</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="71" x="5" y="290.4219">end note</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="174" x="5" y="306.7188">:this.configs=configs;</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="390" x="5" y="323.0156">if (saslMechanism!=null &amp;&amp;!saslMechanism.trim()</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" text-decoration="wavy underline" textLength="170" x="5" y="339.3125">.isEmpty()) then (yes)</text><text fill="#FF0000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="106" x="10" y="355.6094">Syntax Error?</text><!--MD5=[6d113d7d533dc161c3789d2638c0bdad]
@startuml
!pragma layout smetana
start
note right
constructor ConfigurationUtils(Map<String,
? >configs)
end note
:this(configs,null );
end
start
note right
constructor ConfigurationUtils(Map<String,
? >configs,StringsaslMechanism)
end note
:this.configs=configs;
if (saslMechanism!=null &&!saslMechanism.trim()
.isEmpty()) then (yes) 
:this.prefix=ListenerName.saslMechanismPrefix(saslMechanism.trim());
else (no)
:this.prefix=null ;
endif 
end
start
note right
PathvalidateFile(Stringname)
end note
:file=new File(url.toURI().getRawPath()).getAbsoluteFile();
:throw new ConfigException(name,url.toString(),
String.format("The OAuth configuration option %s contains a URL (%s) that is malformed: %s",
name,url,e.getMessage()));;
if (!file.exists()) then (yes) 
:throw new ConfigException(name,file,String.format("The OAuth configuration option %s contains a file (%s) that doesn't exist",name,file));;
endif 
if (!file.canRead()) then (yes) 
:throw new ConfigException(name,file,String.format("The OAuth configuration option %s contains a file (%s) that doesn't have read permission",name,file));;
endif 
if (file.isDirectory()) then (yes) 
:throw new ConfigException(name,file,String.format("The OAuth configuration option %s references a directory (%s),
 not a file",name,file));;
endif 
:return file.toPath();;
stop
end
start
note right
IntegervalidateInteger(Stringname,booleanisRequired)
end note
if (value==null ) then (yes) 
if (isRequired) then (yes) 
:throw new ConfigException(name,null ,String.format("The OAuth configuration option %s must be non-null",
name));;
else (no)
:return null ;;
stop
endif 
endif 
:return value;;
stop
end
start
note right
LongvalidateLong(Stringname)
end note
:return validateLong(name,true);;
stop
end
start
note right
LongvalidateLong(Stringname,booleanisRequired)
end note
:return validateLong(name,isRequired,null );;
stop
end
start
note right
LongvalidateLong(Stringname,booleanisRequired,
Longmin)
end note
if (value==null ) then (yes) 
if (isRequired) then (yes) 
:throw new ConfigException(name,null ,String.format("The OAuth configuration option %s must be non-null",
name));;
else (no)
:return null ;;
stop
endif 
endif 
if (min!=null &&value<min) then (yes) 
:throw new ConfigException(name,value,String.format("The OAuth configuration option %s value must be at least %s",
name,min));;
endif 
:return value;;
stop
end
start
note right
URLvalidateUrl(Stringname)
end note
:url=new URL(value);
:throw new ConfigException(name,value,String.format("The OAuth configuration option %s contains a URL (%s) that is malformed: %s",name,value,e.getMessage()));;
if (protocol==null ||protocol.trim().isEmpty()) then (yes) 
:throw new ConfigException(name,value,String.format("The OAuth configuration option %s contains a URL (%s) that is missing the protocol",name,value));;
endif 
:protocol=protocol.toLowerCase(Locale.ROOT);
if (!(protocol.equals("http")||protocol.equals("https")||protocol.equals("file"))) then (yes) 
:throw new ConfigException(name,value,String.format("The OAuth configuration option %s contains a URL (%s) that contains an invalid protocol (%s); only \"http\", \"https\", and \"file\" protocol are supported",name,value,protocol));;
endif 
:return url;;
stop
end
start
note right
StringvalidateString(Stringname)
end note
:return validateString(name,true);;
stop
end
start
note right
StringvalidateString(Stringname,booleanisRequired)
end note
if (value==null ) then (yes) 
if (isRequired) then (yes) 
:throw new ConfigException(String.format("The OAuth configuration option %s value must be non-null",
name));;
else (no)
:return null ;;
stop
endif 
endif 
:value=value.trim();
if (value.isEmpty()) then (yes) 
if (isRequired) then (yes) 
:throw new ConfigException(String.format("The OAuth configuration option %s value must not contain only whitespace",
name));;
else (no)
:return null ;;
stop
endif 
endif 
:return value;;
stop
end
if (value!=null ) then (yes) 
:return value;;
stop
endif 
:return (T)configs.get(name);;
stop
@enduml

