@startuml
!pragma layout smetana
start
note right
constructor ConfigException(Stringmessage)
end note
:super (message);
end
start
note right
constructor ConfigException(Stringname,Objectvalue)
end note
:this(name,value,null );
end
start
note right
constructor ConfigException(Stringname,Objectvalue,
Stringmessage)
end note
:super ("Invalid value "+value+" for configuration "+
name+(message==null ? String.valueOf(""):String.valueOf(": ")+
message));
end
@enduml

