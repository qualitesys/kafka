@startuml
!pragma layout smetana
start
note right
constructor RenewDelegationTokenRequest(RenewDelegationTokenRequestDatadata,
shortversion)
end note
:super (ApiKeys.RENEW_DELEGATION_TOKEN,version);
:this.data=data;
end
start
note right
RenewDelegationTokenRequestparse(ByteBufferbuffer,
shortversion)
end note
:return new RenewDelegationTokenRequest(new RenewDelegationTokenRequestData(new ByteBufferAccessor(buffer),version),version);;
stop
end
start
note right
RenewDelegationTokenRequestDatadata()
end note
:return data;;
stop
end
start
note right
AbstractResponsegetErrorResponse(intthrottleTimeMs,
Throwablee)
end note
:return new RenewDelegationTokenResponse(new RenewDelegationTokenResponseData().setThrottleTimeMs(throttleTimeMs).setErrorCode(Errors.forException(e).code()));;
stop
end
start
note right
constructor Builder(RenewDelegationTokenRequestDatadata)
end note
:super (ApiKeys.RENEW_DELEGATION_TOKEN);
:this.data=data;
end
start
note right
RenewDelegationTokenRequestbuild(shortversion)
end note
:return new RenewDelegationTokenRequest(data,
version);;
stop
end
start
note right
StringtoString()
end note
:return data.toString();;
stop
end
@enduml

