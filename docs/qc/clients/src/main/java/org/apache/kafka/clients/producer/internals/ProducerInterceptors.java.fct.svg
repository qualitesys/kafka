@startuml
!pragma layout smetana
start
note right
constructor ProducerInterceptors(List<ProducerInterceptor<K,
V>>interceptors)
end note
:this.interceptors=interceptors;;
end
start
note right
ProducerRecord<K,V>onSend(ProducerRecord<K,
V>record)
end note
:try {interceptRecord=interceptor.onSend(interceptRecord);}catch (Exceptione){if (record!=null )log.warn("Error executing interceptor onSend callback for topic: {},
 partition: {}",record.topic(),record.partition(),
e);else log.warn("Error executing interceptor onSend callback",
e);};
:return interceptRecord;;
stop
end
start
note right
void onAcknowledgement(RecordMetadatametadata,
Exceptionexception)
end note
:try {interceptor.onAcknowledgement(metadata,
exception);}catch (Exceptione){log.warn("Error executing interceptor onAcknowledgement callback",
e);};
end
start
note right
void onSendError(ProducerRecord<K,V>record,
TopicPartitioninterceptTopicPartition,Exceptionexception)
end note
:try {if (record==null &&interceptTopicPartition==null ){interceptor.onAcknowledgement(null ,
exception);}else {if (interceptTopicPartition==null ){interceptTopicPartition=extractTopicPartition(record);}interceptor.onAcknowledgement(new RecordMetadata(interceptTopicPartition,
-1,-1,RecordBatch.NO_TIMESTAMP,-1,-1),exception);}}catch (Exceptione){log.warn("Error executing interceptor onAcknowledgement callback",
e);};
end
:return new TopicPartition(record.topic(),
record.partition()==null ? RecordMetadata.UNKNOWN_PARTITION:record.partition());;
stop
start
note right
void close()
end note
:try {interceptor.close();}catch (Exceptione){log.error("Failed to close producer interceptor ",
e);};
end
@enduml

