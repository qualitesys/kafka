@startuml
!pragma layout smetana
start
note right
constructor ProducerInterceptors(List<ProducerInterceptor<K,
V>>interceptors)
end note
end
start
note right
ProducerRecord<K,V>onSend(ProducerRecord<K,
V>record)
end note
if (record!=null ) then (yes) 
else (no)
endif 
:return interceptRecord;;
stop
end
start
note right
void onAcknowledgement(RecordMetadatametadata,
Exceptionexception)
end note
end
start
note right
void onSendError(ProducerRecord<K,V>record,
TopicPartitioninterceptTopicPartition,Exceptionexception)
end note
if (record==null &&interceptTopicPartition==null ) then (yes) 
else (no)
if (interceptTopicPartition==null ) then (yes) 
endif 
endif 
end
:return new TopicPartition(record.topic(),
record.partition()==null ? RecordMetadata.UNKNOWN_PARTITION:record.partition());;
stop
start
note right
void close()
end note
end
@enduml

