start
note right
constructor EnvelopeResponse(ByteBufferresponseData,
Errorserror)
end note
:super (ApiKeys.ENVELOPE);
:this.data=new EnvelopeResponseData().setResponseData(responseData)
.setErrorCode(error.code());
end
start
note right
constructor EnvelopeResponse(Errorserror)
end note
:this(null ,error);
end
start
note right
constructor EnvelopeResponse(EnvelopeResponseDatadata)
end note
:super (ApiKeys.ENVELOPE);
:this.data=data;
