@startuml
!pragma layout smetana
start
note right
constructor EnvelopeResponse(ByteBufferresponseData,
Errorserror)
end note
end
start
note right
constructor EnvelopeResponse(Errorserror)
end note
end
start
note right
constructor EnvelopeResponse(EnvelopeResponseDatadata)
end note
end
start
note right
ByteBufferresponseData()
end note
:return data.responseData();;
stop
end
start
note right
Map<Errors,Integer>errorCounts()
end note
:return errorCounts(error());;
stop
end
start
note right
Errorserror()
end note
:return Errors.forCode(data.errorCode());;
stop
end
start
note right
EnvelopeResponseDatadata()
end note
:return data;;
stop
end
start
note right
intthrottleTimeMs()
end note
:return DEFAULT_THROTTLE_TIME;;
stop
end
start
note right
EnvelopeResponseparse(ByteBufferbuffer,shortversion)
end note
:return new EnvelopeResponse(new EnvelopeResponseData(new ByteBufferAccessor(buffer),
version));;
stop
end
@enduml

