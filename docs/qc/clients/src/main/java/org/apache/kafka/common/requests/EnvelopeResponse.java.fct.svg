@startuml
!pragma layout smetana
start
note right
constructor EnvelopeResponse(ByteBufferresponseData,Errorserror)
end note
:super (ApiKeys.ENVELOPE);
:this.data=new EnvelopeResponseData().setResponseData(responseData).setErrorCode(error.code());
end
start
note right
constructor EnvelopeResponse(Errorserror)
end note
:this(null ,error);
end
start
note right
constructor EnvelopeResponse(EnvelopeResponseDatadata)
end note
:super (ApiKeys.ENVELOPE);
:this.data=data;
end
start
note right
ByteBufferresponseData()
end note
:return data.responseData();;
stop
end
start
note right
Map<Errors,Integer>errorCounts()
end note
:return errorCounts(error());;
stop
end
start
note right
Errorserror()
end note
:return Errors.forCode(data.errorCode());;
stop
end
start
note right
EnvelopeResponseDatadata()
end note
:return data;;
stop
end
start
note right
intthrottleTimeMs()
end note
:return DEFAULT_THROTTLE_TIME;;
stop
