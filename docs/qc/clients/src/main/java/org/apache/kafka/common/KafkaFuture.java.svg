+  complete(T)
+  completeExceptionally(Throwable)
+  cancel(boolean)
+  get()
+  get(long;TimeUnit)
+  getNow(T)
+  isCancelled()
+  isCompletedExceptionally()
+  isDone()
} 
@enduml

