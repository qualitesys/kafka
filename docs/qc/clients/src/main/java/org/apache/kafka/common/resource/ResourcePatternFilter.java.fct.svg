@startuml
!pragma layout smetana
start
note right
constructor ResourcePatternFilter(ResourceTyperesourceType,
Stringname,PatternTypepatternType)
end note
:this.resourceType=Objects.requireNonNull(resourceType,
"resourceType");;
:this.name=name;;
:this.patternType=Objects.requireNonNull(patternType,
"patternType");;
end
start
note right
booleanisUnknown()
end note
:return resourceType.isUnknown()||patternType.isUnknown();;
stop
end
start
note right
ResourceTyperesourceType()
end note
:return resourceType;;
stop
end
start
note right
Stringname()
end note
:return name;;
stop
end
start
note right
PatternTypepatternType()
end note
:return patternType;;
stop
end
start
note right
booleanmatches(ResourcePatternpattern)
end note
if (!resourceType.equals(ResourceType.ANY)&&!resourceType.equals(pattern.resourceType())) then (yes) 
:return false;;
stop
endif 
if (!patternType.equals(PatternType.ANY)&&!patternType.equals(PatternType.MATCH)&&!patternType.equals(pattern.patternType())) then (yes) 
:return false;;
stop
endif 
if (name==null ) then (yes) 
:return true;;
stop
endif 
if (patternType.equals(PatternType.ANY)||patternType.equals(pattern.patternType())) then (yes) 
:return name.equals(pattern.name());;
stop
endif 
switch (switch (pattern.patternType()))
endswith
end
start
note right
booleanmatchesAtMostOne()
end note
:return findIndefiniteField()==null ;;
stop
end
start
note right
StringfindIndefiniteField()
end note
if (resourceType==ResourceType.ANY) then (yes) 
:return "Resource type is ANY.";;
stop
endif 
if (resourceType==ResourceType.UNKNOWN) then (yes) 
:return "Resource type is UNKNOWN.";;
stop
endif 
if (name==null ) then (yes) 
:return "Resource name is NULL.";;
stop
endif 
if (patternType==PatternType.MATCH) then (yes) 
:return "Resource pattern type is MATCH.";;
stop
endif 
if (patternType==PatternType.UNKNOWN) then (yes) 
:return "Resource pattern type is UNKNOWN.";;
stop
endif 
:return null ;;
stop
end
start
note right
StringtoString()
end note
:return "ResourcePattern(resourceType="+resourceType+
", name="+((name==null )? String.valueOf("<any>"):name)+
", patternType="+patternType+")";;
stop
end
start
note right
booleanequals(Objecto)
end note
if (this==o) then (yes) 
:return true;;
stop
endif 
if (o==null ||getClass()!=o.getClass()) then (yes) 
:return false;;
stop
endif 
:final ResourcePatternFilterresource=(ResourcePatternFilter)o;;
:return resourceType==resource.resourceType&&Objects.equals(name,
resource.name)&&patternType==resource.patternType;;
stop
end
start
note right
inthashCode()
end note
:return Objects.hash(resourceType,name,patternType);;
stop
end
@enduml

