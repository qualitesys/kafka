@startuml
!pragma layout smetana
start
note right
constructor LogDirDescription(ApiExceptionerror,
Map<TopicPartition,ReplicaInfo>replicaInfos)
end note
:this(error,replicaInfos,UNKNOWN_VOLUME_BYTES,
UNKNOWN_VOLUME_BYTES);
end
start
note right
constructor LogDirDescription(ApiExceptionerror,
Map<TopicPartition,ReplicaInfo>replicaInfos,
longtotalBytes,longusableBytes)
end note
:this.error=error;
:this.replicaInfos=replicaInfos;
:this.totalBytes=(totalBytes==UNKNOWN_VOLUME_BYTES)? OptionalLong.empty():OptionalLong.of(totalBytes);
:this.usableBytes=(usableBytes==UNKNOWN_VOLUME_BYTES)? OptionalLong.empty():OptionalLong.of(usableBytes);
end
start
note right
ApiExceptionerror()
end note
:return error;;
stop
end
start
note right
Map<TopicPartition,ReplicaInfo>replicaInfos()
end note
:return unmodifiableMap(replicaInfos);;
stop
end
start
note right
OptionalLongtotalBytes()
end note
:return totalBytes;;
stop
end
start
note right
OptionalLongusableBytes()
end note
:return usableBytes;;
stop
end
start
note right
StringtoString()
end note
:return "LogDirDescription("+"replicaInfos="+replicaInfos+",
 error="+error+", totalBytes="+totalBytes+",
 usableBytes="+usableBytes+')';;
stop
end
@enduml

