@startuml
!pragma layout smetana
start
note right
constructor LogDirDescription(ApiExceptionerror,
Map<TopicPartition,ReplicaInfo>replicaInfos)
end note
end
start
note right
constructor LogDirDescription(ApiExceptionerror,
Map<TopicPartition,ReplicaInfo>replicaInfos,
longtotalBytes,longusableBytes)
end note
end
start
note right
ApiExceptionerror()
end note
:return error;;
stop
end
start
note right
Map<TopicPartition,ReplicaInfo>replicaInfos()
end note
:return unmodifiableMap(replicaInfos);;
stop
end
start
note right
OptionalLongtotalBytes()
end note
:return totalBytes;;
stop
end
start
note right
OptionalLongusableBytes()
end note
:return usableBytes;;
stop
end
start
note right
StringtoString()
end note
:return "LogDirDescription("+"replicaInfos="+
replicaInfos+", error="+error+", totalBytes="+
totalBytes+", usableBytes="+usableBytes+')';;
stop
end
@enduml

