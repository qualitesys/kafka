@startuml
!pragma layout smetana
Comparable_Uuid_ <|- - org.apache.kafka.common.Uuid
class org.apache.kafka.common.Uuid {
+  Uuid(long;long)
+  unsafeRandomUuid()
+  randomUuid()
+  getMostSignificantBits()
+  getLeastSignificantBits()
+  equals(Object)
+  hashCode()
+  toString()
+  fromString(String)
+  getBytesFromUuid()
+  compareTo(Uuid)
} 
@enduml

