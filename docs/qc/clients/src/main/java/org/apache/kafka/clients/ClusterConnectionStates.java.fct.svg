@startuml
!pragma layout smetana
start
note right
constructor ClusterConnectionStates(longreconnectBackoffMs,
longreconnectBackoffMaxMs,longconnectionSetupTimeoutMs,
longconnectionSetupTimeoutMaxMs,LogContextlogContext,
HostResolverhostResolver)
end note
:this.log=logContext.logger(ClusterConnectionStates.class );
:this.reconnectBackoff=new ExponentialBackoff(reconnectBackoffMs,
RECONNECT_BACKOFF_EXP_BASE,reconnectBackoffMaxMs,
RECONNECT_BACKOFF_JITTER);
:this.connectionSetupTimeout=new ExponentialBackoff(connectionSetupTimeoutMs,
CONNECTION_SETUP_TIMEOUT_EXP_BASE,connectionSetupTimeoutMaxMs,
CONNECTION_SETUP_TIMEOUT_JITTER);
:this.nodeState=new HashMap<>();
:this.connectingNodes=new HashSet<>();
:this.hostResolver=hostResolver;
end
start
note right
booleancanConnect(Stringid,longnow)
end note
if (state==null ) then (yes) 
:return true;;
stop
else (no)
:return state.state.isDisconnected()&&now-state.lastConnectAttemptMs>=state.reconnectBackoffMs;;
stop
endif 
end
start
note right
booleanisBlackedOut(Stringid,longnow)
end note
:return state!=null &&state.state.isDisconnected()&&now-state.lastConnectAttemptMs<state.reconnectBackoffMs;;
stop
end
start
note right
longconnectionDelay(Stringid,longnow)
end note
if (state==null ) then (yes) 
:return 0;;
stop
endif 
if (state.state==ConnectionState.CONNECTING) then (yes) 
:return connectionSetupTimeoutMs(id);;
stop
else (no)
:return Long.MAX_VALUE;;
stop
endif 
end
start
note right
booleanisConnecting(Stringid)
end note
:return state!=null &&state.state==ConnectionState.CONNECTING;;
stop
end
start
note right
booleanisPreparingConnection(Stringid)
end note
:return state!=null &&(state.state==ConnectionState.CONNECTING||state.state==ConnectionState.CHECKING_API_VERSIONS);;
stop
end
start
note right
void connecting(Stringid,longnow,Stringhost)
end note
if (connectionState!=null &&connectionState.host()
.equals(host)) then (yes) 
:connectionState.lastConnectAttemptMs=now;
:connectionState.state=ConnectionState.CONNECTING;
:connectionState.moveToNextAddress();
:connectingNodes.add(id);
:return ;;
stop
endif 
:nodeState.put(id,new NodeConnectionState(ConnectionState.CONNECTING,
now,reconnectBackoff.backoff(0),connectionSetupTimeout.backoff(0),
host,hostResolver));
:connectingNodes.add(id);
end
start
note right
InetAddresscurrentAddress(Stringid)
end note
:return nodeState(id).currentAddress();;
stop
end
start
note right
void disconnected(Stringid,longnow)
end note
:nodeState.lastConnectAttemptMs=now;
:updateReconnectBackoff(nodeState);
if (nodeState.state==ConnectionState.CONNECTING) then (yes) 
:updateConnectionSetupTimeout(nodeState);
:connectingNodes.remove(id);
else (no)
:resetConnectionSetupTimeout(nodeState);
if (nodeState.state.isConnected()) then (yes) 
:nodeState.clearAddresses();
endif 
endif 
:nodeState.state=ConnectionState.DISCONNECTED;
end
start
note right
void throttle(Stringid,longthrottleUntilTimeMs)
end note
if (state!=null &&state.throttleUntilTimeMs<throttleUntilTimeMs) then (yes) 
:state.throttleUntilTimeMs=throttleUntilTimeMs;
endif 
end
start
note right
longthrottleDelayMs(Stringid,longnow)
end note
if (state!=null &&state.throttleUntilTimeMs>now) then (yes) 
:return state.throttleUntilTimeMs-now;;
stop
else (no)
:return 0;;
stop
endif 
end
start
note right
longpollDelayMs(Stringid,longnow)
end note
if (isConnected(id)&&throttleDelayMs>0) then (yes) 
:return throttleDelayMs;;
stop
else (no)
:return connectionDelay(id,now);;
stop
endif 
end
start
note right
void checkingApiVersions(Stringid)
end note
:nodeState.state=ConnectionState.CHECKING_API_VERSIONS;
:resetConnectionSetupTimeout(nodeState);
:connectingNodes.remove(id);
end
start
note right
void ready(Stringid)
