end
start
note right
constructor NodeConnectionState(ConnectionStatestate,
longlastConnectAttempt,longreconnectBackoffMs,
longconnectionSetupTimeoutMs,Stringhost,HostResolverhostResolver)
end note
:this.state=state;
:this.addresses=Collections.emptyList();
:this.addressIndex=-1;
:this.authenticationException=null ;
:this.lastConnectAttemptMs=lastConnectAttempt;
:this.failedAttempts=0;
:this.reconnectBackoffMs=reconnectBackoffMs;
:this.connectionSetupTimeoutMs=connectionSetupTimeoutMs;
:this.throttleUntilTimeMs=0;
:this.host=host;
:this.hostResolver=hostResolver;
end
start
note right
Stringhost()
end note
:return host;;
stop
end
start
note right
InetAddresscurrentAddress()
end note
if (addresses.isEmpty()) then (yes) 
:addresses=ClientUtils.resolve(host,hostResolver);
:addressIndex=0;
endif 
:return addresses.get(addressIndex);;
stop
end
start
note right
void moveToNextAddress()
end note
if (addresses.isEmpty()) then (yes) 
:return ;;
stop
endif 
:addressIndex=(addressIndex+1)%addresses.size();
if (addressIndex==0) then (yes) 
:addresses=Collections.emptyList();
endif 
end
start
note right
void clearAddresses()
end note
:addresses=Collections.emptyList();
end
start
note right
StringtoString()
end note
:return "NodeState("+state+", "+lastConnectAttemptMs+
", "+failedAttempts+", "+throttleUntilTimeMs+
")";;
stop
end
