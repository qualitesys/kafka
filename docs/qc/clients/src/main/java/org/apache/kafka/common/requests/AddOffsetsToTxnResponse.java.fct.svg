@startuml
!pragma layout smetana
start
note right
constructor AddOffsetsToTxnResponse(AddOffsetsToTxnResponseDatadata)
end note
end
start
note right
Map<Errors,Integer>errorCounts()
end note
:return errorCounts(Errors.forCode(data.errorCode()));;
stop
end
start
note right
intthrottleTimeMs()
end note
:return data.throttleTimeMs();;
stop
end
start
note right
AddOffsetsToTxnResponseDatadata()
end note
:return data;;
stop
end
start
note right
AddOffsetsToTxnResponseparse(ByteBufferbuffer,
shortversion)
end note
:return new AddOffsetsToTxnResponse(new AddOffsetsToTxnResponseData(new ByteBufferAccessor(buffer),
version));;
stop
end
start
note right
StringtoString()
end note
:return data.toString();;
stop
end
start
note right
booleanshouldClientThrottle(shortversion)
end note
:return version>=1;;
stop
end
@enduml

