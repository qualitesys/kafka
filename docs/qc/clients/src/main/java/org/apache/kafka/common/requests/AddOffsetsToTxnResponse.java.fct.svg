25,358,1072.8125,362,1062.8125,358,1066.8125" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="358" x2="358" y1="1106.7813" y2="1126.7813"/><polygon fill="#181818" points="354,1116.7813,358,1126.7813,362,1116.7813,358,1120.7813" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[8b71c026ff5042cc4d258d4847abc806]
@startuml
!pragma layout smetana
start
note right
constructor AddOffsetsToTxnResponse(AddOffsetsToTxnResponseData data)
end note
:super (ApiKeys.ADD_OFFSETS_TO_TXN);;
:this.data=data;;
end
start
note right
Map<Errors,Integer> errorCounts()
end note
:return errorCounts(Errors.forCode(data.errorCode()));;
stop
end
start
note right
int throttleTimeMs()
end note
:return data.throttleTimeMs();;
stop
end
start
note right
AddOffsetsToTxnResponseData data()
end note
:return data;;
stop
end
start
note right
AddOffsetsToTxnResponse parse(ByteBuffer buffer,
short version)
end note
:return new AddOffsetsToTxnResponse(new AddOffsetsToTxnResponseData(new ByteBufferAccessor(buffer),
version));;
stop
end
start
note right
String toString()
end note
:return data.toString();;
stop
end
start
note right
boolean shouldClientThrottle(short version)
end note
:return version>=1;;
stop
end
@enduml

