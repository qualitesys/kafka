@startuml
!pragma layout smetana
start
note right
constructor ZstdFactory()
end note
end
start
note right
OutputStreamwrapForOutput(ByteBufferOutputStreambuffer)
end note
:return new BufferedOutputStream(new ZstdOutputStreamNoFinalizer(buffer,
RecyclingBufferPool.INSTANCE),16*1024);;
stop
:throw new KafkaException(e);;
end
start
note right
InputStreamwrapForInput(ByteBufferbuffer,
bytemessageVersion,BufferSupplierdecompressionBufferSupplier)
end note
start
note right
ByteBufferget(intcapacity)
end note
:return decompressionBufferSupplier.get(capacity);;
stop
end
start
note right
void release(ByteBufferbuffer)
end note
:decompressionBufferSupplier.release(buffer);
end
:return new BufferedInputStream(new ZstdInputStreamNoFinalizer(new ByteBufferInputStream(buffer),
bufferPool),16*1024);;
stop
:throw new KafkaException(e);;
