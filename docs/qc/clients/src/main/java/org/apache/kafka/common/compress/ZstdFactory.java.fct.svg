@startuml
!pragma layout smetana
start
note right
constructor ZstdFactory()
end note
end
start
note right
OutputStream wrapForOutput(ByteBufferOutputStream buffer)
end note
switch (try/catch block)
case (try)
:return new BufferedOutputStream(new ZstdOutputStreamNoFinalizer(buffer,
RecyclingBufferPool.INSTANCE),16*1024);;
stop
case (catch (Throwable e))
:throw new KafkaException(e);;
stop
endswitch
end
start
note right
InputStream wrapForInput(ByteBuffer buffer,
byte messageVersion,BufferSupplier decompressionBufferSupplier)
end note
switch (try/catch block)
case (try)
:BufferPool bufferPool=new BufferPool(){@Override public ByteBuffer get(int capacity){return decompressionBufferSupplier.get(capacity);
:}@Override public void release(ByteBuffer buffer){decompressionBufferSupplier.release(buffer);}};;
:return new BufferedInputStream(new ZstdInputStreamNoFinalizer(new ByteBufferInputStream(buffer),
bufferPool),16*1024);;
stop
case (catch (Throwable e))
:throw new KafkaException(e);;
stop
endswitch
end
@enduml

