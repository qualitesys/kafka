@startuml
!pragma layout smetana
start
note right
constructor Builder(BrokerRegistrationRequestDatadata)
end note
end
start
note right
BrokerRegistrationRequestbuild(shortversion)
end note
:return new BrokerRegistrationRequest(data,
version);;
stop
end
start
note right
StringtoString()
end note
:return data.toString();;
stop
end
start
note right
constructor BrokerRegistrationRequest(BrokerRegistrationRequestDatadata,
shortversion)
end note
end
start
note right
BrokerRegistrationRequestDatadata()
end note
:return data;;
stop
end
start
note right
BrokerRegistrationResponsegetErrorResponse(intthrottleTimeMs,
Throwablee)
end note
:return new BrokerRegistrationResponse(new BrokerRegistrationResponseData()
.setThrottleTimeMs(throttleTimeMs).setErrorCode(error.code()));;
stop
end
start
note right
BrokerRegistrationRequestparse(ByteBufferbuffer,
shortversion)
end note
:return new BrokerRegistrationRequest(new BrokerRegistrationRequestData(new ByteBufferAccessor(buffer),
version),version);;
stop
end
