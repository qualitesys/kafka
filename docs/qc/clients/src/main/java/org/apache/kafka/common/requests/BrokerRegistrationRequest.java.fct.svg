@startuml
!pragma layout smetana
start
note right
constructor Builder(BrokerRegistrationRequestData data)
end note
:super (ApiKeys.BROKER_REGISTRATION);;
:this.data=data;;
end
start
note right
BrokerRegistrationRequest build(short version)
end note
:return new BrokerRegistrationRequest(data,
version);;
stop
end
start
note right
String toString()
end note
:return data.toString();;
stop
end
start
note right
constructor BrokerRegistrationRequest(BrokerRegistrationRequestData data,
short version)
end note
:super (ApiKeys.BROKER_REGISTRATION,version);;
:this.data=data;;
end
start
note right
BrokerRegistrationRequestData data()
end note
:return data;;
stop
end
start
note right
BrokerRegistrationResponse getErrorResponse(int throttleTimeMs,
Throwable e)
end note
:Errors error=Errors.forException(e);;
:return new BrokerRegistrationResponse(new BrokerRegistrationResponseData()
.setThrottleTimeMs(throttleTimeMs).setErrorCode(error.code()));;
stop
end
start
note right
BrokerRegistrationRequest parse(ByteBuffer buffer,
short version)
end note
:return new BrokerRegistrationRequest(new BrokerRegistrationRequestData(new ByteBufferAccessor(buffer),
version),version);;
stop
end
@enduml

