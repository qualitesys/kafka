@startuml
!pragma layout smetana
start
note right
long windowSize(MetricConfig config,long now)
end note
:stat.purgeObsoleteSamples(config,now);;
:long elapsed=now-stat.oldest(now).lastWindowMs;;
:return Math.max(elapsed,config.timeWindowMs());;
stop
end
@enduml

