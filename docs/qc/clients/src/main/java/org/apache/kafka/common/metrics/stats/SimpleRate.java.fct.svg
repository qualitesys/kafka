@startuml
!pragma layout smetana
start
note right
longwindowSize(MetricConfigconfig,longnow)
end note
:stat.purgeObsoleteSamples(config,now);;
:return Math.max(elapsed,config.timeWindowMs());;
stop
end
@enduml

