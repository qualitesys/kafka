@startuml
!pragma layout smetana
start
note right
constructor DeleteConsumerGroupsResult(final Map<String,KafkaFuture<Void>>futures)
end note
:this.futures=futures;
end
start
note right
Map<String,KafkaFuture<Void>>deletedGroups()
end note
:futures.forEach((key,future)->deletedGroups.put(key,
future));
:return deletedGroups;;
stop
end
start
note right
KafkaFuture<Void>all()
end note
:return KafkaFuture.allOf(futures.values()
.toArray(new KafkaFuture[0]));;
stop
end
@enduml

