"272.1719" y2="292.1719"/><polygon fill="#181818" points="238.5,282.1719,242.5,292.1719,246.5,282.1719,242.5,286.1719" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="242.5" x2="242.5" y1="376.7383" y2="399.3047"/><polygon fill="#181818" points="238.5,389.3047,242.5,399.3047,246.5,389.3047,242.5,393.3047" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="242.5" x2="242.5" y1="433.2734" y2="453.2734"/><polygon fill="#181818" points="238.5,443.2734,242.5,453.2734,246.5,443.2734,242.5,447.2734" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[0b2a2425cec9f341a4072a39879dba5e]
@startuml
!pragma layout smetana
start
note right
constructor DeleteConsumerGroupsResult(final Map<String,KafkaFuture<Void>>futures)
end note
:this.futures=futures;
end
start
note right
Map<String,KafkaFuture<Void>>deletedGroups()
end note
:futures.forEach((key,future)->deletedGroups.put(key,future));
:return deletedGroups;;
stop
end
start
note right
KafkaFuture<Void>all()
end note
:return KafkaFuture.allOf(futures.values().toArray(new KafkaFuture[0]));;
stop
end
@enduml

