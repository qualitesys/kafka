5" x2="317.5" y1="388.1094" y2="408.1094"/><polygon fill="#181818" points="313.5,398.1094,317.5,408.1094,321.5,398.1094,317.5,402.1094" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="317.5" x2="317.5" y1="269.2031" y2="291.7695"/><polygon fill="#181818" points="313.5,281.7695,317.5,291.7695,321.5,281.7695,317.5,285.7695" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="317.5" x2="317.5" y1="432.1094" y2="452.1094"/><polygon fill="#181818" points="313.5,442.1094,317.5,452.1094,321.5,442.1094,317.5,446.1094" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="317.5" x2="317.5" y1="504.6758" y2="527.2422"/><polygon fill="#181818" points="313.5,517.2422,317.5,527.2422,321.5,517.2422,317.5,521.2422" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[9d7077158354855e1aab2a63bd36f3c0]
@startuml
!pragma layout smetana
start
note right
void configure(Map<String,? >configs,StringsaslMechanism,
List<AppConfigurationEntry>jaasConfigEntries)
end note
if (!saslMechanism.equals(SaslConfigs.GSSAPI_MECHANISM)) then (yes) 
:throw new IllegalStateException("Kerberos callback handler should only be used with GSSAPI");;
endif 
end
start
note right
void handle(Callback[]callbacks)
end note
if (callback instanceof NameCallback) then (yes) 
else (no)
:throw new UnsupportedCallbackException(callback,
"Unrecognized SASL ClientCallback");;
endif 
end
start
note right
void close()
end note
end
@enduml

