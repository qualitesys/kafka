0a8227cb0292a6]
@startuml
!pragma layout smetana
start
note right
void configure(Map<String,? >configs,StringsaslMechanism,List<AppConfigurationEntry>jaasConfigEntries)
end note
if (!saslMechanism.equals(SaslConfigs.GSSAPI_MECHANISM)) then (yes) 
endif 
end
start
note right
void handle(Callback[]callbacks)
end note
if (callback instanceof NameCallback) then (yes) 
:nc.setName(nc.getDefaultName());
else (no)
endif 
end
start
note right
void close()
end note
end
@enduml

