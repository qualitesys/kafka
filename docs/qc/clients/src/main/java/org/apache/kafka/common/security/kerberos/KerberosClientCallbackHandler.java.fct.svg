@startuml
!pragma layout smetana
start
note right
void configure(Map<String,? >configs,StringsaslMechanism,
List<AppConfigurationEntry>jaasConfigEntries)
end note
if (!saslMechanism.equals(SaslConfigs.GSSAPI_MECHANISM)) then (yes) 
:throw new IllegalStateException("Kerberos callback handler should only be used with GSSAPI");;
stop
endif 
end
start
note right
void handle(Callback[]callbacks)
end note
if (callback instanceof NameCallback) then (yes) 
:nc.setName(nc.getDefaultName());;
else (no)
:throw new UnsupportedCallbackException(callback,
"Unrecognized SASL ClientCallback");;
stop
endif 
end
start
note right
void close()
end note
end
@enduml

