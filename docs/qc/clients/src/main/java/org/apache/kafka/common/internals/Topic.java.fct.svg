4" x="5" y="355.6094">if (String.valueOf(".").equals(name)||String.valueOf("..")</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" text-decoration="wavy underline" textLength="204" x="5" y="371.9063">.equals(name)) then (yes)</text><text fill="#FF0000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="106" x="10" y="388.2031">Syntax Error?</text><!--MD5=[fe9a2cc3dc35971ba75fe8303d199655]
@startuml
!pragma layout smetana
start
note right
void validate(Stringtopic)
end note
:validate(topic,"Topic name",message->{throw new InvalidTopicException(message);});
end
start
note right
void validate(Stringname,StringlogPrefix,
Consumer<String>throwableConsumer)
end note
if (name.isEmpty()) then (yes) 
:throwableConsumer.accept(logPrefix+" is illegal,
 it can't be empty");
endif 
if (String.valueOf(".").equals(name)||String.valueOf("..")
.equals(name)) then (yes) 
:throwableConsumer.accept(logPrefix+" cannot be \".\" or \"..\"");
endif 
if (name.length()>MAX_NAME_LENGTH) then (yes) 
:throwableConsumer.accept(logPrefix+" is illegal, it can't be longer than "+
MAX_NAME_LENGTH+" characters, "+logPrefix+
": "+name);
endif 
if (!containsValidPattern(name)) then (yes) 
:throwableConsumer.accept(logPrefix+" \""+
name+"\" is illegal, it contains a character other than "+
"ASCII alphanumerics, '.', '_' and '-'");
endif 
end
start
note right
booleanisInternal(Stringtopic)
end note
:return INTERNAL_TOPICS.contains(topic);;
stop
end
start
note right
booleanhasCollisionChars(Stringtopic)
end note
:return topic.contains("_")||topic.contains(".");;
stop
end
start
note right
StringunifyCollisionChars(Stringtopic)
end note
:return topic.replace('.','_');;
stop
end
start
note right
booleanhasCollision(StringtopicA,StringtopicB)
end note
:return unifyCollisionChars(topicA).equals(unifyCollisionChars(topicB));;
stop
end
start
note right
booleancontainsValidPattern(Stringtopic)
end note
:++i;
if (!validChar) then (yes) 
:return false;;
stop
endif 
:return true;;
stop
end
@enduml

