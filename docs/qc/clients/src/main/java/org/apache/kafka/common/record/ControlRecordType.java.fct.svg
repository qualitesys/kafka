 y="527.8906">end note</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="187" x="5" y="544.1875">switch (switch (typeId))</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" text-decoration="wavy underline" textLength="73" x="5" y="560.4844">endswith</text><text fill="#FF0000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="106" x="10" y="576.7813">Syntax Error?</text><!--MD5=[4c3ec1aa702085eeb842b66627ebc6b8]
@startuml
!pragma layout smetana
start
note right
constructor ControlRecordType(shorttype)
end note
:this.type=type;;
end
start
note right
StructrecordKey()
end note
if (this==UNKNOWN) then (yes) 
:throw new IllegalArgumentException("Cannot serialize UNKNOWN control record type");;
stop
endif 
:Structstruct=new Struct(CONTROL_RECORD_KEY_SCHEMA_VERSION_V0);;
:struct.set("version",CURRENT_CONTROL_RECORD_KEY_VERSION);;
:struct.set("type",type);;
:return struct;;
stop
end
start
note right
shortparseTypeId(ByteBufferkey)
end note
if (key.remaining()<CURRENT_CONTROL_RECORD_KEY_SIZE) then (yes) 
:throw new InvalidRecordException("Invalid value size found for end control record key. Must have "+
"at least "+CURRENT_CONTROL_RECORD_KEY_SIZE+
" bytes, but found only "+key.remaining());;
stop
endif 
:shortversion=key.getShort(0);;
if (version<0) then (yes) 
:throw new InvalidRecordException("Invalid version found for control record: "+
version+". May indicate data corruption");;
stop
endif 
if (version!=CURRENT_CONTROL_RECORD_KEY_VERSION) then (yes) 
:log.debug("Received unknown control record key version {}. Parsing as version {}",
version,CURRENT_CONTROL_RECORD_KEY_VERSION);;
endif 
:return key.getShort(2);;
stop
end
start
note right
ControlRecordTypefromTypeId(shorttypeId)
end note
switch (switch (typeId))
endswith
end
start
note right
ControlRecordTypeparse(ByteBufferkey)
end note
:return fromTypeId(parseTypeId(key));;
stop
end
@enduml

