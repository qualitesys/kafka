><line style="stroke:#181818;stroke-width:1.0;" x1="714.5" x2="726.5" y1="496.1289" y2="496.1289"/><polygon fill="#181818" points="722.5,621.3867,726.5,631.3867,730.5,621.3867,726.5,625.3867" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="726.5" x2="726.5" y1="496.1289" y2="738.8398"/><line style="stroke:#181818;stroke-width:1.0;" x1="726.5" x2="430" y1="738.8398" y2="738.8398"/><polygon fill="#181818" points="440,734.8398,430,738.8398,440,742.8398,436,738.8398" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="418" x2="418" y1="461.5625" y2="484.1289"/><polygon fill="#181818" points="414,474.1289,418,484.1289,422,474.1289,418,478.1289" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="418" x2="418" y1="750.8398" y2="770.8398"/><polygon fill="#181818" points="414,760.8398,418,770.8398,422,760.8398,418,764.8398" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[69208d9fa8db6b8a1ab49e5ab02c1bca]
@startuml
!pragma layout smetana
start
note right
Map<String,Object>postProcessReconnectBackoffConfigs(AbstractConfigconfig,
Map<String,Object>parsedValues)
end note
if ((!originalConfig.containsKey(RECONNECT_BACKOFF_MAX_MS_CONFIG))&&originalConfig.containsKey(RECONNECT_BACKOFF_MS_CONFIG)) then (yes) 
:log.debug("Disabling exponential reconnect backoff because {} is set,
 but {} is not.",RECONNECT_BACKOFF_MS_CONFIG,
RECONNECT_BACKOFF_MAX_MS_CONFIG);;
:rval.put(RECONNECT_BACKOFF_MAX_MS_CONFIG,
parsedValues.get(RECONNECT_BACKOFF_MS_CONFIG));;
endif 
:return rval;;
stop
end
start
note right
void postValidateSaslMechanismConfig(AbstractConfigconfig)
end note
if (securityProtocol==SecurityProtocol.SASL_PLAINTEXT||securityProtocol==SecurityProtocol.SASL_SSL) then (yes) 
if (clientSaslMechanism==null ||clientSaslMechanism.isEmpty()) then (yes) 
:throw new ConfigException(SaslConfigs.SASL_MECHANISM,null ,"When the "+
CommonClientConfigs.SECURITY_PROTOCOL_CONFIG+
" configuration enables SASL, mechanism must be non-null and non-empty string.");;
stop
endif 
endif 
end
@enduml

