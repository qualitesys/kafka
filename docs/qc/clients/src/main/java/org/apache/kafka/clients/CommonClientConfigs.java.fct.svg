:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="428" x2="428" y1="724.0039" y2="748.4063"/><polygon fill="#181818" points="424,738.4063,428,748.4063,432,738.4063,428,742.4063" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="724.5" x2="736.5" y1="712.0039" y2="712.0039"/><polygon fill="#181818" points="732.5,837.2617,736.5,847.2617,740.5,837.2617,736.5,841.2617" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="736.5" x2="736.5" y1="712.0039" y2="954.7148"/><line style="stroke:#181818;stroke-width:1.0;" x1="736.5" x2="440" y1="954.7148" y2="954.7148"/><polygon fill="#181818" points="450,950.7148,440,954.7148,450,958.7148,446,954.7148" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="428" x2="428" y1="680.0039" y2="700.0039"/><polygon fill="#181818" points="424,690.0039,428,700.0039,432,690.0039,428,694.0039" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="428" x2="428" y1="966.7148" y2="986.7148"/><polygon fill="#181818" points="424,976.7148,428,986.7148,432,976.7148,428,980.7148" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[d6bc0a7790c6877e13ef3b6f054e871c]
@startuml
!pragma layout smetana
start
note right
Map<String,Object>postProcessReconnectBackoffConfigs(AbstractConfigconfig,
Map<String,Object>parsedValues)
end note
:HashMap<String,Object>rval=new HashMap<>();;
:Map<String,Object>originalConfig=config.originals();;
if ((!originalConfig.containsKey(RECONNECT_BACKOFF_MAX_MS_CONFIG))&&originalConfig.containsKey(RECONNECT_BACKOFF_MS_CONFIG)) then (yes) 
:log.debug("Disabling exponential reconnect backoff because {} is set,
 but {} is not.",RECONNECT_BACKOFF_MS_CONFIG,
RECONNECT_BACKOFF_MAX_MS_CONFIG);;
:rval.put(RECONNECT_BACKOFF_MAX_MS_CONFIG,
parsedValues.get(RECONNECT_BACKOFF_MS_CONFIG));;
endif 
:return rval;;
stop
end
start
note right
void postValidateSaslMechanismConfig(AbstractConfigconfig)
end note
:SecurityProtocolsecurityProtocol=SecurityProtocol.forName(config.getString(CommonClientConfigs.SECURITY_PROTOCOL_CONFIG));;
:StringclientSaslMechanism=config.getString(SaslConfigs.SASL_MECHANISM);;
if (securityProtocol==SecurityProtocol.SASL_PLAINTEXT||securityProtocol==SecurityProtocol.SASL_SSL) then (yes) 
if (clientSaslMechanism==null ||clientSaslMechanism.isEmpty()) then (yes) 
:throw new ConfigException(SaslConfigs.SASL_MECHANISM,null ,"When the "+
CommonClientConfigs.SECURITY_PROTOCOL_CONFIG+
" configuration enables SASL, mechanism must be non-null and non-empty string.");;
stop
endif 
endif 
end
@enduml

