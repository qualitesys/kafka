="480.9961" y2="703.707"/><line style="stroke:#181818;stroke-width:1.0;" x1="726.5" x2="430" y1="703.707" y2="703.707"/><polygon fill="#181818" points="440,699.707,430,703.707,440,707.707,436,703.707" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="418" x2="418" y1="671.707" y2="691.707"/><polygon fill="#181818" points="414,681.707,418,691.707,422,681.707,418,685.707" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="418" x2="418" y1="446.4297" y2="468.9961"/><polygon fill="#181818" points="414,458.9961,418,468.9961,422,458.9961,418,462.9961" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="418" x2="418" y1="715.707" y2="735.707"/><polygon fill="#181818" points="414,725.707,418,735.707,422,725.707,418,729.707" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[dfb71d4868c6dfbbeca63e15d9c49841]
@startuml
!pragma layout smetana
start
note right
Map<String,Object>postProcessReconnectBackoffConfigs(AbstractConfigconfig,Map<String,Object>parsedValues)
end note
if ((!originalConfig.containsKey(RECONNECT_BACKOFF_MAX_MS_CONFIG))&&originalConfig.containsKey(RECONNECT_BACKOFF_MS_CONFIG)) then (yes) 
:log.debug("Disabling exponential reconnect backoff because {} is set,
 but {} is not.",RECONNECT_BACKOFF_MS_CONFIG,
RECONNECT_BACKOFF_MAX_MS_CONFIG);
:rval.put(RECONNECT_BACKOFF_MAX_MS_CONFIG,
parsedValues.get(RECONNECT_BACKOFF_MS_CONFIG));
endif 
:return rval;;
stop
end
start
note right
void postValidateSaslMechanismConfig(AbstractConfigconfig)
end note
if (securityProtocol==SecurityProtocol.SASL_PLAINTEXT||securityProtocol==SecurityProtocol.SASL_SSL) then (yes) 
if (clientSaslMechanism==null ||clientSaslMechanism.isEmpty()) then (yes) 
:throw new ConfigException(SaslConfigs.SASL_MECHANISM,null ,"When the "+
CommonClientConfigs.SECURITY_PROTOCOL_CONFIG+
" configuration enables SASL, mechanism must be non-null and non-empty string.");;
endif 
endif 
end
@enduml

