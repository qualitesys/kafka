="12.5" style="stroke:#181818;stroke-width:0.5;" width="265" x="323.5" y="629.5078"/><text fill="#000000" font-family="sans-serif" font-size="12" lengthAdjust="spacing" textLength="245" x="333.5" y="650.6465">obj.wait(deadlineMs-currentTimeMs);}}</text><ellipse cx="456" cy="693.4766" fill="none" rx="10" ry="10" style="stroke:#222222;stroke-width:1.5;"/><line style="stroke:#222222;stroke-width:2.5;" x1="449.8128" x2="462.1872" y1="687.2894" y2="699.6637"/><line style="stroke:#222222;stroke-width:2.5;" x1="462.1872" x2="449.8128" y1="687.2894" y2="699.6637"/><line style="stroke:#181818;stroke-width:1.0;" x1="456" x2="456" y1="32.5664" y2="55.1328"/><polygon fill="#181818" points="452,45.1328,456,55.1328,460,45.1328,456,49.1328" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="456" x2="456" y1="89.1016" y2="109.1016"/><polygon fill="#181818" points="452,99.1016,456,109.1016,460,99.1016,456,103.1016" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="456" x2="456" y1="193.668" y2="216.2344"/><polygon fill="#181818" points="452,206.2344,456,216.2344,460,206.2344,456,210.2344" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="456" x2="456" y1="250.2031" y2="270.2031"/><polygon fill="#181818" points="452,260.2031,456,270.2031,460,260.2031,456,264.2031" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="456" x2="456" y1="354.7695" y2="377.3359"/><polygon fill="#181818" points="452,367.3359,456,377.3359,460,367.3359,456,371.3359" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="456" x2="456" y1="411.3047" y2="431.3047"/><polygon fill="#181818" points="452,421.3047,456,431.3047,460,421.3047,456,425.3047" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="456" x2="456" y1="491.4375" y2="521.5703"/><polygon fill="#181818" points="452,511.5703,456,521.5703,460,511.5703,456,515.5703" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="456" x2="456" y1="555.5391" y2="575.5391"/><polygon fill="#181818" points="452,565.5391,456,575.5391,460,565.5391,456,569.5391" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="456" x2="456" y1="609.5078" y2="629.5078"/><polygon fill="#181818" points="452,619.5078,456,629.5078,460,619.5078,456,623.5078" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="456" x2="456" y1="663.4766" y2="683.4766"/><polygon fill="#181818" points="452,673.4766,456,683.4766,460,673.4766,456,677.4766" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[ca80176abfc81729afdcd87a0d36933d]
@startuml
!pragma layout smetana
start
note right
long milliseconds()
end note
:return System.currentTimeMillis();;
stop
end
start
note right
long nanoseconds()
end note
:return System.nanoTime();;
stop
end
start
note right
void sleep(long ms)
end note
:Utils.sleep(ms);;
end
start
note right
void waitObject(Object obj,Supplier<Boolean> condition,
long deadlineMs)
end note
:synchronized (obj){while (true){if (condition.get())return ;
:long currentTimeMs=milliseconds();if (currentTimeMs>=deadlineMs)throw new TimeoutException("Condition not satisfied before deadline");
:obj.wait(deadlineMs-currentTimeMs);}};
end
@enduml

