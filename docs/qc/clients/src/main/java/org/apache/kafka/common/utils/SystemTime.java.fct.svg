tyle="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="277.5" x2="277.5" y1="437.4688" y2="467.6016"/><polygon fill="#181818" points="273.5,457.6016,277.5,467.6016,281.5,457.6016,277.5,461.6016" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[17b64ff2322cdf3d852f24db2672a22a]
@startuml
!pragma layout smetana
start
note right
longmilliseconds()
end note
:return System.currentTimeMillis();;
stop
end
start
note right
longnanoseconds()
end note
:return System.nanoTime();;
stop
end
start
note right
void sleep(longms)
end note
end
start
note right
void waitObject(Objectobj,Supplier<Boolean>condition,
longdeadlineMs)
end note
while (true)
if (condition.get()) then (yes) 
:return ;;
stop
endif 
if (currentTimeMs>=deadlineMs) then (yes) 
:throw new TimeoutException("Condition not satisfied before deadline");;
endif 
endwhile
end
@enduml

