@startuml
!pragma layout smetana
start
note right
longmilliseconds()
end note
:return System.currentTimeMillis();;
stop
end
start
note right
longnanoseconds()
end note
:return System.nanoTime();;
stop
end
start
note right
void sleep(longms)
end note
:Utils.sleep(ms);;
end
start
note right
void waitObject(Objectobj,Supplier<Boolean>condition,
longdeadlineMs)
end note
:synchronized (obj){while (true){if (condition.get())return ;
:longcurrentTimeMs=milliseconds();if (currentTimeMs>=deadlineMs)throw new TimeoutException("Condition not satisfied before deadline");
:obj.wait(deadlineMs-currentTimeMs);}};
end
@enduml

