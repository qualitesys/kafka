@startuml
!pragma layout smetana
start
note right
longmilliseconds()
end note
:return System.currentTimeMillis();;
stop
end
start
note right
longnanoseconds()
end note
:return System.nanoTime();;
stop
end
start
note right
void sleep(longms)
end note
:Utils.sleep(ms);
end
start
note right
void waitObject(Objectobj,Supplier<Boolean>condition,longdeadlineMs)
end note
while (true)
if (condition.get()) then (yes) 
:return ;;
stop
endif 
if (currentTimeMs>=deadlineMs) then (yes) 
endif 
:obj.wait(deadlineMs-currentTimeMs);
endwhile
end
@enduml

