@startuml
!pragma layout smetana
start
note right
constructor DescribeUserScramCredentialsResponse(DescribeUserScramCredentialsResponseDataresponseData)
end note
:super (ApiKeys.DESCRIBE_USER_SCRAM_CREDENTIALS);;
:this.data=responseData;;
end
start
note right
DescribeUserScramCredentialsResponseDatadata()
end note
:return data;;
stop
end
start
note right
booleanshouldClientThrottle(shortversion)
end note
:return true;;
stop
end
start
note right
intthrottleTimeMs()
end note
:return data.throttleTimeMs();;
stop
end
start
note right
Map<Errors,Integer>errorCounts()
end note
:return errorCounts(data.results().stream()
.map(r->Errors.forCode(r.errorCode())));;
stop
end
start
note right
DescribeUserScramCredentialsResponseparse(ByteBufferbuffer,
shortversion)
end note
:return new DescribeUserScramCredentialsResponse(new DescribeUserScramCredentialsResponseData(new ByteBufferAccessor(buffer),
version));;
stop
end
