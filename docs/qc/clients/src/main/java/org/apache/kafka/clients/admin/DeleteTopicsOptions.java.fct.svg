@startuml
!pragma layout smetana
start
note right
DeleteTopicsOptionstimeoutMs(IntegertimeoutMs)
end note
:this.timeoutMs=timeoutMs;;
:return this;;
stop
end
start
note right
DeleteTopicsOptionsretryOnQuotaViolation(booleanretryOnQuotaViolation)
end note
:this.retryOnQuotaViolation=retryOnQuotaViolation;;
:return this;;
stop
end
start
note right
booleanshouldRetryOnQuotaViolation()
end note
:return retryOnQuotaViolation;;
stop
end
@enduml

