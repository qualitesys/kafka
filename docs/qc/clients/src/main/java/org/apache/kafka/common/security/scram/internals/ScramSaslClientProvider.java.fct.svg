@startuml
!pragma layout smetana
start
note right
constructor ScramSaslClientProvider()
end note
:super ("SASL/SCRAM Client Provider",1.0,
"SASL/SCRAM Client Provider for Kafka");
:put("SaslClientFactory."+mechanism.mechanismName(),
ScramSaslClientFactory.class .getName());
end
start
note right
void initialize()
end note
:Security.addProvider(new ScramSaslClientProvider());
end
@enduml

