@startuml
!pragma layout smetana
start
note right
constructor Builder(AddOffsetsToTxnRequestDatadata)
end note
:super (ApiKeys.ADD_OFFSETS_TO_TXN);;
:this.data=data;;
end
start
note right
AddOffsetsToTxnRequestbuild(shortversion)
end note
:return new AddOffsetsToTxnRequest(data,version);;
stop
end
start
note right
StringtoString()
end note
:return data.toString();;
stop
end
start
note right
constructor AddOffsetsToTxnRequest(AddOffsetsToTxnRequestDatadata,
shortversion)
end note
:super (ApiKeys.ADD_OFFSETS_TO_TXN,version);;
:this.data=data;;
end
start
note right
AddOffsetsToTxnRequestDatadata()
end note
:return data;;
stop
end
start
note right
AddOffsetsToTxnResponsegetErrorResponse(intthrottleTimeMs,
Throwablee)
end note
:return new AddOffsetsToTxnResponse(new AddOffsetsToTxnResponseData()
.setErrorCode(Errors.forException(e).code()).setThrottleTimeMs(throttleTimeMs));;
stop
end
start
note right
AddOffsetsToTxnRequestparse(ByteBufferbuffer,
shortversion)
end note
:return new AddOffsetsToTxnRequest(new AddOffsetsToTxnRequestData(new ByteBufferAccessor(buffer),
