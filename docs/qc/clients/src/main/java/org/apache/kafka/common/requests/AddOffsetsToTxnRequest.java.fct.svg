start
note right
constructor AddOffsetsToTxnRequest(AddOffsetsToTxnRequestDatadata,
shortversion)
end note
end
start
note right
AddOffsetsToTxnRequestDatadata()
end note
:return data;;
stop
end
start
note right
AddOffsetsToTxnResponsegetErrorResponse(intthrottleTimeMs,
