;"/><line style="stroke:#181818;stroke-width:1.0;" x1="685.25" x2="685.25" y1="432.7383" y2="455.3047"/><polygon fill="#181818" points="681.25,445.3047,685.25,455.3047,689.25,445.3047,685.25,449.3047" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[54c49a56ba384abbaef795f921c58c4b]
@startuml
!pragma layout smetana
start
note right
void configure(Map<String,? >configs,StringsaslMechanism,List<AppConfigurationEntry>jaasConfigEntries)
end note
:this.mechanism=saslMechanism;
end
start
note right
void handle(Callback[]callbacks)
end note
if (callback instanceof NameCallback) then (yes) 
if (subject!=null &&!subject.getPublicCredentials(String.class ).isEmpty()) then (yes) 
:nc.setName(subject.getPublicCredentials(String.class )
.iterator().next());
else (no)
:nc.setName(nc.getDefaultName());
endif 
else (no)
:throw new UnsupportedCallbackException(callback,
"Unrecognized SASL ClientCallback");;
endif 
end
start
note right
void close()
end note
end
@enduml

