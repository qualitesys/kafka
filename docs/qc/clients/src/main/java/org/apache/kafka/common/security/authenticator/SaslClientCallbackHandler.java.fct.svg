3047"/><polygon fill="#181818" points="681.25,385.3047,685.25,395.3047,689.25,385.3047,685.25,389.3047" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="685.25" x2="685.25" y1="447.8711" y2="470.4375"/><polygon fill="#181818" points="681.25,460.4375,685.25,470.4375,689.25,460.4375,685.25,464.4375" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[a779976923d37c5626ee401c074cec22]
@startuml
!pragma layout smetana
start
note right
void configure(Map<String,? >configs,StringsaslMechanism,
List<AppConfigurationEntry>jaasConfigEntries)
end note
:this.mechanism=saslMechanism;
end
start
note right
void handle(Callback[]callbacks)
end note
if (callback instanceof NameCallback) then (yes) 
if (subject!=null &&!subject.getPublicCredentials(String.class ).isEmpty()) then (yes) 
:nc.setName(subject.getPublicCredentials(String.class )
.iterator().next());
else (no)
:nc.setName(nc.getDefaultName());
endif 
else (no)
:throw new UnsupportedCallbackException(callback,
"Unrecognized SASL ClientCallback");;
endif 
end
start
note right
void close()
end note
end
@enduml

