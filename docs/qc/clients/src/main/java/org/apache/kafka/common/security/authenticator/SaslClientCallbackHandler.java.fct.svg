n fill="#181818" points="734.75,371.3359,738.75,381.3359,742.75,371.3359,738.75,375.3359" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="738.75" x2="738.75" y1="433.9023" y2="456.4688"/><polygon fill="#181818" points="734.75,446.4688,738.75,456.4688,742.75,446.4688,738.75,450.4688" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[2267478971ab2426b4479f6abd99ad34]
@startuml
!pragma layout smetana
start
note right
void configure(Map<String,? >configs,StringsaslMechanism,
List<AppConfigurationEntry>jaasConfigEntries)
end note
:this.mechanism=saslMechanism;
end
start
note right
void handle(Callback[]callbacks)
end note
if (callback instanceof NameCallback) then (yes) 
if (subject!=null &&!subject.getPublicCredentials(String.class ).isEmpty()) then (yes) 
:nc.setName(subject.getPublicCredentials(String.class ).iterator().next());
else (no)
:nc.setName(nc.getDefaultName());
endif 
else (no)
:throw new UnsupportedCallbackException(callback,
"Unrecognized SASL ClientCallback");;
endif 
end
start
note right
void close()
end note
end
@enduml

