"stroke:#181818;stroke-width:1.0;" x1="738.75" x2="738.75" y1="418.7695" y2="441.3359"/><polygon fill="#181818" points="734.75,431.3359,738.75,441.3359,742.75,431.3359,738.75,435.3359" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[1f370b53a571ba9b9b9dc4d6bb19550f]
@startuml
!pragma layout smetana
start
note right
void configure(Map<String,? >configs,StringsaslMechanism,List<AppConfigurationEntry>jaasConfigEntries)
end note
:this.mechanism=saslMechanism;
end
start
note right
void handle(Callback[]callbacks)
end note
if (callback instanceof NameCallback) then (yes) 
if (subject!=null &&!subject.getPublicCredentials(String.class ).isEmpty()) then (yes) 
:nc.setName(subject.getPublicCredentials(String.class ).iterator().next());
else (no)
:nc.setName(nc.getDefaultName());
endif 
else (no)
:throw new UnsupportedCallbackException(callback,
"Unrecognized SASL ClientCallback");;
endif 
end
start
note right
void close()
end note
end
@enduml

