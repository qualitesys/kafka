@startuml
!pragma layout smetana
start
note right
constructor ScramSaslClient(ScramMechanismmechanism,
CallbackHandlercbh)
end note
:this.mechanism=mechanism;;
:this.callbackHandler=cbh;;
:this.formatter=new ScramFormatter(mechanism);;
:setState(State.SEND_CLIENT_FIRST_MESSAGE);;
end
start
note right
StringgetMechanismName()
end note
:return mechanism.mechanismName();;
stop
end
start
note right
booleanhasInitialResponse()
end note
:return true;;
stop
end
start
note right
byte[]evaluateChallenge(byte[]challenge)
end note
:try ;
switch (switch (state))
endswith
:catch (SaslExceptione);
:setState(State.FAILED);;
:throw e;;
stop
end
start
note right
booleanisComplete()
end note
:return state==State.COMPLETE;;
stop
end
start
note right
byte[]unwrap(byte[]incoming,intoffset,intlen)
end note
if (!isComplete()) then (yes) 
:throw new IllegalStateException("Authentication exchange has not completed");;
stop
endif 
:return Arrays.copyOfRange(incoming,offset,offset+
len);;
stop
end
start
note right
byte[]wrap(byte[]outgoing,intoffset,intlen)
end note
if (!isComplete()) then (yes) 
:throw new IllegalStateException("Authentication exchange has not completed");;
stop
endif 
:return Arrays.copyOfRange(outgoing,offset,offset+
len);;
stop
end
start
note right
ObjectgetNegotiatedProperty(StringpropName)
end note
if (!isComplete()) then (yes) 
:throw new IllegalStateException("Authentication exchange has not completed");;
stop
endif 
:return null ;;
stop
end
start
note right
void dispose()
end note
end
start
note right
void setState(Statestate)
end note
:log.debug("Setting SASL/{} client state to {}",
mechanism,state);;
:this.state=state;;
end
start
note right
ClientFinalMessagehandleServerFirstMessage(char[]password)
end note
:try ;
:byte[]passwordBytes=ScramFormatter.normalize(new String(password));;
:this.saltedPassword=formatter.hi(passwordBytes,
serverFirstMessage.salt(),serverFirstMessage.iterations());;
:ClientFinalMessageclientFinalMessage=new ClientFinalMessage(String.valueOf("n,
,").getBytes(StandardCharsets.UTF_8),serverFirstMessage.nonce());;
:byte[]clientProof=formatter.clientProof(saltedPassword,
clientFirstMessage,serverFirstMessage,clientFinalMessage);;
:clientFinalMessage.proof(clientProof);;
:return clientFinalMessage;;
stop
:catch (InvalidKeyExceptione);
:throw new SaslException("Client final message could not be created",e);;
stop
end
start
note right
void handleServerFinalMessage(byte[]signature)
end note
:try ;
:byte[]serverKey=formatter.serverKey(saltedPassword);;
:byte[]serverSignature=formatter.serverSignature(serverKey,
clientFirstMessage,serverFirstMessage,clientFinalMessage);;
if (!MessageDigest.isEqual(signature,serverSignature)) then (yes) 
:throw new SaslException("Invalid server signature in server final message");;
stop
endif 
:catch (InvalidKeyExceptione);
:throw new SaslException("Sasl server signature verification failed",e);;
stop
end
start
note right
SaslClientcreateSaslClient(String[]mechanisms,
StringauthorizationId,Stringprotocol,StringserverName,
Map<String,? >props,CallbackHandlercbh)
end note
:ScramMechanismmechanism=null ;;
:mechanism=ScramMechanism.forMechanismName(mech);;
if (mechanism!=null ) then (yes) 
:break ;;
endif 
if (mechanism==null ) then (yes) 
:throw new SaslException(String.format("Requested mechanisms '%s' not supported. Supported mechanisms are '%s'.",
Arrays.asList(mechanisms),ScramMechanism.mechanismNames()));;
stop
endif 
:try ;
:return new ScramSaslClient(mechanism,cbh);;
stop
:catch (NoSuchAlgorithmExceptione);
:throw new SaslException("Hash algorithm not supported for mechanism "+
mechanism,e);;
stop
end
start
note right
String[]getMechanismNames(Map<String,? >props)
end note
:Collection<String>mechanisms=ScramMechanism.mechanismNames();;
:return mechanisms.toArray(new String[0]);;
stop
end
@enduml

