 font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="375" x="5" y="355.6094">new Date(sortedByLifetime.last().lifetimeMs()));</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="316" x="5" y="371.9063">:callback.token(sortedByLifetime.last());</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="40" x="5" y="388.2031">endif</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="30" x="5" y="404.5">end</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="37" x="5" y="420.7969">start</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="78" x="5" y="437.0938">note right</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="502" x="5" y="453.3906">void handleCallback(SaslExtensionsCallbackextensionsCallback,</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="123" x="5" y="469.6875">Subjectsubject)</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="71" x="5" y="485.9844">end note</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="568" x="5" y="502.2813">if (subject!=null &amp;&amp;!subject.getPublicCredentials(SaslExtensions.class )</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" text-decoration="wavy underline" textLength="170" x="5" y="518.5781">.isEmpty()) then (yes)</text><text fill="#FF0000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="106" x="10" y="534.875">Syntax Error?</text><!--MD5=[6f7a87ff40dbb44efab7c609708b73df]
@startuml
!pragma layout smetana
start
note right
booleanconfigured()
end note
:return configured;;
stop
end
start
note right
void configure(Map<String,? >configs,StringsaslMechanism,
List<AppConfigurationEntry>jaasConfigEntries)
end note
if (!OAuthBearerLoginModule.OAUTHBEARER_MECHANISM.equals(saslMechanism)) then (yes) 
:throw new IllegalArgumentException(String.format("Unexpected SASL mechanism: %s",
saslMechanism));;
endif 
:configured=true;
end
start
note right
void handle(Callback[]callbacks)
end note
if (!configured()) then (yes) 
:throw new IllegalStateException("Callback handler not configured");;
endif 
if (callback instanceof OAuthBearerTokenCallback) then (yes) 
:handleCallback((OAuthBearerTokenCallback)callback);
else (no)
:throw new UnsupportedCallbackException(callback);;
endif 
end
start
note right
void close()
end note
end
start
note right
void handleCallback(OAuthBearerTokenCallbackcallback)
end note
if (callback.token()!=null ) then (yes) 
:throw new IllegalArgumentException("Callback had a token already");;
endif 
if (privateCredentials.size()==0) then (yes) 
:throw new IOException("No OAuth Bearer tokens in Subject's private credentials");;
endif 
if (privateCredentials.size()==1) then (yes) 
:callback.token(privateCredentials.iterator()
.next());
else (no)
start
note right
intcompare(OAuthBearerTokeno1,OAuthBearerTokeno2)
end note
:return Long.compare(o1.lifetimeMs(),o2.lifetimeMs());;
stop
end
:sortedByLifetime.addAll(privateCredentials);
:log.warn("Found {} OAuth Bearer tokens in Subject's private credentials; the oldest expires at {},
 will use the newest, which expires at {}",
sortedByLifetime.size(),new Date(sortedByLifetime.first().lifetimeMs()),
new Date(sortedByLifetime.last().lifetimeMs()));
:callback.token(sortedByLifetime.last());
endif 
end
start
note right
void handleCallback(SaslExtensionsCallbackextensionsCallback,
Subjectsubject)
end note
if (subject!=null &&!subject.getPublicCredentials(SaslExtensions.class )
.isEmpty()) then (yes) 
:extensionsCallback.extensions(extensions);
endif 
end
@enduml

