@startuml
!pragma layout smetana
start
note right
AclOperationfromString(Stringstr)
end note
:return AclOperation.valueOf(str.toUpperCase(Locale.ROOT));;
stop
:return UNKNOWN;;
stop
end
start
note right
AclOperationfromCode(bytecode)
end note
if (operation==null ) then (yes) 
:return UNKNOWN;;
stop
endif 
:return operation;;
stop
end
start
note right
constructor AclOperation(bytecode)
end note
end
start
note right
bytecode()
end note
:return code;;
stop
end
start
note right
booleanisUnknown()
end note
:return this==UNKNOWN;;
stop
end
@enduml

