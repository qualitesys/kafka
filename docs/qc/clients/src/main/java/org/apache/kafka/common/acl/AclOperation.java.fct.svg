@startuml
!pragma layout smetana
:CODE_TO_VALUE.put(operation.code,operation);;
start
note right
AclOperation fromString(String str)
end note
switch (try/catch block)
case (try)
:return AclOperation.valueOf(str.toUpperCase(Locale.ROOT));;
stop
case (catch (IllegalArgumentException e))
:return UNKNOWN;;
stop
endswitch
end
start
note right
AclOperation fromCode(byte code)
end note
:AclOperation operation=CODE_TO_VALUE.get(code);;
if (operation==null ) then (yes) 
:return UNKNOWN;;
stop
endif 
:return operation;;
stop
end
start
note right
constructor AclOperation(byte code)
end note
:this.code=code;;
end
start
note right
byte code()
end note
:return code;;
stop
end
start
note right
boolean isUnknown()
end note
:return this==UNKNOWN;;
stop
end
@enduml

