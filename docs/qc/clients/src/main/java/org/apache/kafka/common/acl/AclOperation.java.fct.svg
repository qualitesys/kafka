@startuml
!pragma layout smetana
:CODE_TO_VALUE.put(operation.code,operation);;
start
note right
AclOperationfromString(Stringstr)
end note
:try {return AclOperation.valueOf(str.toUpperCase(Locale.ROOT));
:}catch (IllegalArgumentExceptione){return UNKNOWN;};
end
start
note right
AclOperationfromCode(bytecode)
end note
if (operation==null ) then (yes) 
:return UNKNOWN;;
stop
endif 
:return operation;;
stop
end
start
note right
constructor AclOperation(bytecode)
end note
:this.code=code;;
end
start
note right
bytecode()
end note
:return code;;
stop
end
start
note right
booleanisUnknown()
end note
:return this==UNKNOWN;;
stop
end
@enduml

