@startuml
!pragma layout smetana
:CODE_TO_VALUE.put(operation.code,operation);;
start
note right
AclOperationfromString(Stringstr)
end note
switch (try/catch block)
case (try)
:return AclOperation.valueOf(str.toUpperCase(Locale.ROOT));;
stop
case (catch (IllegalArgumentExceptione))
:return UNKNOWN;;
stop
endswitch
end
start
note right
AclOperationfromCode(bytecode)
end note
:AclOperationoperation=CODE_TO_VALUE.get(code);;
if (operation==null ) then (yes) 
:return UNKNOWN;;
stop
endif 
:return operation;;
stop
end
start
note right
constructor AclOperation(bytecode)
end note
:this.code=code;;
end
start
note right
bytecode()
end note
:return code;;
stop
end
start
note right
booleanisUnknown()
end note
:return this==UNKNOWN;;
stop
end
@enduml

