@startuml
!pragma layout smetana
start
note right
byte[]serialize(Stringtopic,Doubledata)
end note
if (data==null ) then (yes) 
:return null ;;
stop
endif 
:return new byte[]{(byte)(bits>>>56),(byte)(bits>>>48),(byte)(bits>>>40),(byte)(bits>>>32),(byte)(bits>>>24),(byte)(bits>>>16),(byte)(bits>>>8),(byte)bits};;
stop
end
@enduml

