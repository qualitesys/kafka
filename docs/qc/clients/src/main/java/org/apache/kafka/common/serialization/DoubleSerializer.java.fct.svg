@startuml
!pragma layout smetana
start
note right
byte[] serialize(String topic,Double data)
end note
if (data==null ) then (yes) 
:return null ;;
stop
endif 
:long bits=Double.doubleToLongBits(data);;
:return new byte[]{(byte )(bits>>>56),(byte )(bits>>>48),
(byte )(bits>>>40),(byte )(bits>>>32),(byte )(bits>>>24),
(byte )(bits>>>16),(byte )(bits>>>8),(byte )bits};;
stop
end
@enduml

