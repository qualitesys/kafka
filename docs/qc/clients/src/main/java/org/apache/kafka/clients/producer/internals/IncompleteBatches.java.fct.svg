@startuml
!pragma layout smetana
start
note right
constructor IncompleteBatches()
end note
:this.incomplete=new HashSet<>();
end
start
note right
void add(ProducerBatchbatch)
end note
:this.incomplete.add(batch);
end
start
note right
void remove(ProducerBatchbatch)
end note
if (!removed) then (yes) 
endif 
end
start
note right
Iterable<ProducerBatch>copyAll()
end note
:return new ArrayList<>(this.incomplete);;
stop
end
start
note right
Iterable<ProduceRequestResult>requestResults()
end note
:return incomplete.stream().map(batch->batch.produceFuture).collect(Collectors.toList());;
stop
end
start
note right
booleanisEmpty()
end note
:return incomplete.isEmpty();;
stop
end
@enduml

