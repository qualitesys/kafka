@startuml
!pragma layout smetana
start
note right
constructor IncompleteBatches()
end note
:this.incomplete=new HashSet<>();;
end
start
note right
void add(ProducerBatchbatch)
end note
:synchronized (incomplete){this.incomplete.add(batch);};
end
start
note right
void remove(ProducerBatchbatch)
end note
:synchronized (incomplete){booleanremoved=this.incomplete.remove(batch);
:if (!removed)throw new IllegalStateException("Remove from the incomplete set failed. This should be impossible.");};
end
start
note right
Iterable<ProducerBatch>copyAll()
end note
:synchronized (incomplete){return new ArrayList<>(this.incomplete);};
end
start
note right
Iterable<ProduceRequestResult>requestResults()
end note
:synchronized (incomplete){return incomplete.stream()
.map(batch->batch.produceFuture).collect(Collectors.toList());};
end
start
note right
booleanisEmpty()
end note
:synchronized (incomplete){return incomplete.isEmpty();};
end
@enduml

