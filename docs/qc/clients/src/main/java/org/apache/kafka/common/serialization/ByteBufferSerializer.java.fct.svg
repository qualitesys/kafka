@startuml
!pragma layout smetana
start
note right
byte[] serialize(String topic,ByteBuffer data)
end note
if (data==null ) then (yes) 
:return null ;;
stop
endif 
:data.rewind();;
if (data.hasArray()) then (yes) 
:byte[] arr=data.array();;
if (data.arrayOffset()==0&&arr.length==data.remaining()) then (yes) 
:return arr;;
stop
endif 
endif 
:byte[] ret=new byte[data.remaining()];;
:data.get(ret,0,ret.length);;
:data.rewind();;
:return ret;;
stop
end
@enduml

