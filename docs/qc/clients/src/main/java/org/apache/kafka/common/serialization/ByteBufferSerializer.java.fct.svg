@startuml
!pragma layout smetana
start
note right
byte[]serialize(Stringtopic,ByteBufferdata)
end note
if (data==null ) then (yes) 
:return null ;;
stop
endif 
:data.rewind();;
if (data.hasArray()) then (yes) 
if (data.arrayOffset()==0&&arr.length==data.remaining()) then (yes) 
:return arr;;
stop
endif 
endif 
:data.get(ret,0,ret.length);;
:data.rewind();;
:return ret;;
stop
end
@enduml

