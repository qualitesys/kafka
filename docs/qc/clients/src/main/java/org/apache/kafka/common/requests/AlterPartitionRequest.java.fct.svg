@startuml
!pragma layout smetana
start
note right
constructor AlterPartitionRequest(AlterPartitionRequestDatadata,
shortapiVersion)
end note
:super (ApiKeys.ALTER_PARTITION,apiVersion);;
:this.data=data;;
end
start
note right
AlterPartitionRequestDatadata()
end note
:return data;;
stop
end
start
note right
AbstractResponsegetErrorResponse(intthrottleTimeMs,
Throwablee)
end note
:return new AlterPartitionResponse(new AlterPartitionResponseData()
.setThrottleTimeMs(throttleTimeMs).setErrorCode(Errors.forException(e).code()));;
stop
end
start
note right
AlterPartitionRequestparse(ByteBufferbuffer,
shortversion)
end note
:return new AlterPartitionRequest(new AlterPartitionRequestData(new ByteBufferAccessor(buffer),
version),version);;
stop
end
start
note right
constructor Builder(AlterPartitionRequestDatadata,
booleancanUseTopicIds)
end note
:super (ApiKeys.ALTER_PARTITION,ApiKeys.ALTER_PARTITION.oldestVersion(),
canUseTopicIds? ApiKeys.ALTER_PARTITION.latestVersion():1);;
:this.data=data;;
end
start
note right
AlterPartitionRequestbuild(shortversion)
end note
:return new AlterPartitionRequest(data,version);;
stop
end
start
note right
StringtoString()
end note
:return data.toString();;
stop
end
@enduml

