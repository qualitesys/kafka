@startuml
!pragma layout smetana
start
note right
constructor ByteBufferInputStream(ByteBuffer buffer)
end note
:this.buffer=buffer;;
end
start
note right
int read()
end note
if (!buffer.hasRemaining()) then (yes) 
:return -1;;
stop
endif 
:return buffer.get()&0xFF;;
stop
end
start
note right
int read(byte[] bytes,int off,int len)
end note
if (len==0) then (yes) 
:return 0;;
stop
endif 
if (!buffer.hasRemaining()) then (yes) 
:return -1;;
stop
endif 
:len=Math.min(len,buffer.remaining());;
:buffer.get(bytes,off,len);;
:return len;;
stop
end
@enduml

