@startuml
!pragma layout smetana
start
note right
constructor CorrelationIdMismatchException(Stringmessage,
intrequestCorrelationId,intresponseCorrelationId)
end note
:super (message);
:this.requestCorrelationId=requestCorrelationId;
:this.responseCorrelationId=responseCorrelationId;
end
start
note right
intrequestCorrelationId()
end note
:return requestCorrelationId;;
stop
end
start
note right
intresponseCorrelationId()
end note
:return responseCorrelationId;;
stop
end
@enduml

