@startuml
!pragma layout smetana
start
note right
constructor CorrelationIdMismatchException(String message,
int requestCorrelationId,int responseCorrelationId)
end note
:super (message);;
:this.requestCorrelationId=requestCorrelationId;;
:this.responseCorrelationId=responseCorrelationId;;
end
start
note right
int requestCorrelationId()
end note
:return requestCorrelationId;;
stop
end
start
note right
int responseCorrelationId()
end note
:return responseCorrelationId;;
stop
end
@enduml

