@startuml
!pragma layout smetana
start
note right
floatupdateEstimation(Stringtopic,CompressionTypetype,
floatobservedRatio)
end note
if (observedRatio>currentEstimation) then (yes) 
endif 
:return compressionRatioForTopic[type.id];;
stop
end
start
note right
floatestimation(Stringtopic,CompressionTypetype)
end note
:return compressionRatioForTopic[type.id];;
stop
end
start
note right
void resetEstimation(Stringtopic)
end note
end
start
note right
void removeEstimation(Stringtopic)
end note
end
start
note right
void setEstimation(Stringtopic,CompressionTypetype,
floatratio)
end note
end
start
note right
float[]getAndCreateEstimationIfAbsent(Stringtopic)
end note
if (compressionRatioForTopic==null ) then (yes) 
if (existingCompressionRatio!=null ) then (yes) 
:return existingCompressionRatio;;
stop
endif 
endif 
:return compressionRatioForTopic;;
stop
end
start
note right
float[]initialCompressionRatio()
end note
:return compressionRatio;;
stop
end
@enduml

