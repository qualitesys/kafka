@startuml
!pragma layout smetana
start
note right
constructor UnalignedFileRecords(FileChannelchannel,longposition,intsize)
end note
:this.channel=channel;
:this.position=position;
:this.size=size;
end
start
note right
intsizeInBytes()
end note
:return size;;
stop
end
start
note right
longwriteTo(TransferableChanneldestChannel,longpreviouslyWritten,intremaining)
end note
:return destChannel.transferFrom(channel,
position,count);;
stop
end
@enduml

