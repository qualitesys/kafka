.5,527.5078,222.5,537.5078,226.5,527.5078,222.5,531.5078" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="222.5" x2="222.5" y1="571.4766" y2="591.4766"/><polygon fill="#181818" points="218.5,581.4766,222.5,591.4766,226.5,581.4766,222.5,585.4766" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="222.5" x2="222.5" y1="639.4141" y2="659.4141"/><polygon fill="#181818" points="218.5,649.4141,222.5,659.4141,226.5,649.4141,222.5,653.4141" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[06f2f5433aab0cf3f31618b4275d2b83]
@startuml
!pragma layout smetana
start
note right
constructor UnalignedFileRecords(FileChannel channel,
long position,int size)
end note
:this.channel=channel;;
:this.position=position;;
:this.size=size;;
end
start
note right
int sizeInBytes()
end note
:return size;;
stop
end
start
note right
long writeTo(TransferableChannel destChannel,
long previouslyWritten,int remaining)
end note
:long position=this.position+previouslyWritten;;
:long count=Math.min(remaining,sizeInBytes()-previouslyWritten);;
:return destChannel.transferFrom(channel,
position,count);;
stop
end
@enduml

