@startuml
!pragma layout smetana
start
note right
constructor Builder(SaslHandshakeRequestDatadata)
end note
end
start
note right
SaslHandshakeRequestbuild(shortversion)
end note
:return new SaslHandshakeRequest(data,version);;
stop
end
start
note right
StringtoString()
end note
:return data.toString();;
stop
end
start
note right
constructor SaslHandshakeRequest(SaslHandshakeRequestDatadata,
shortversion)
end note
end
start
note right
SaslHandshakeRequestDatadata()
end note
:return data;;
stop
end
start
note right
AbstractResponsegetErrorResponse(intthrottleTimeMs,
Throwablee)
end note
:return new SaslHandshakeResponse(response);;
stop
end
start
note right
SaslHandshakeRequestparse(ByteBufferbuffer,
shortversion)
end note
:return new SaslHandshakeRequest(new SaslHandshakeRequestData(new ByteBufferAccessor(buffer),
