@startuml
!pragma layout smetana
start
note right
constructor AlterConsumerGroupOffsetsResult(KafkaFuture<Map<TopicPartition,
Errors>>future)
end note
end
start
note right
KafkaFuture<Void>partitionResult(final TopicPartitionpartition)
end note
:return result;;
stop
end
start
note right
KafkaFuture<Void>all()
end note
:return this.future.thenApply(topicPartitionErrorsMap->{List<TopicPartition>partitionsFailed=topicPartitionErrorsMap.entrySet().stream().filter(e->e.getValue()!=Errors.NONE).map(Map.Entry::getKey).collect(Collectors.toList());for (Errorserror:topicPartitionErrorsMap.values()){if (error!=Errors.NONE){throw error.exception("Failed altering consumer group offsets for the following partitions: "+partitionsFailed);}}return null ;});;
stop
end
@enduml

