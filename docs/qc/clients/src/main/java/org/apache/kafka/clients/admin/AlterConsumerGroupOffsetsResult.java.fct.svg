181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="1306.5" x2="1306.5" y1="459.8086" y2="482.375"/><polygon fill="#181818" points="1302.5,472.375,1306.5,482.375,1310.5,472.375,1306.5,476.375" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="1306.5" x2="1306.5" y1="530.3125" y2="550.3125"/><polygon fill="#181818" points="1302.5,540.3125,1306.5,550.3125,1310.5,540.3125,1306.5,544.3125" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[8551e64ced2270ad57d39f4c7aac0c2d]
@startuml
!pragma layout smetana
start
note right
constructor AlterConsumerGroupOffsetsResult(KafkaFuture<Map<TopicPartition,
Errors>> future)
end note
:this.future=future;;
end
start
note right
KafkaFuture<Void> partitionResult(final TopicPartition partition)
end note
:final KafkaFutureImpl<Void> result=new KafkaFutureImpl<>();;
:this.future.whenComplete((topicPartitions,
throwable)->{if (throwable!=null ){result.completeExceptionally(throwable);}else if (!topicPartitions.containsKey(partition)){result.completeExceptionally(new IllegalArgumentException("Alter offset for partition \""+partition+"\" was not attempted"));}else {final Errors error=topicPartitions.get(partition);if (error==Errors.NONE){result.complete(null );}else {result.completeExceptionally(error.exception());}}});;
:return result;;
stop
end
start
note right
KafkaFuture<Void> all()
end note
:return this.future.thenApply(topicPartitionErrorsMap->{List<TopicPartition> partitionsFailed=topicPartitionErrorsMap.entrySet()
.stream().filter(e->e.getValue()!=Errors.NONE).map(Map.Entry::getKey).collect(Collectors.toList());for (Errors error:topicPartitionErrorsMap.values()){if (error!=Errors.NONE){throw error.exception("Failed altering consumer group offsets for the following partitions: "+partitionsFailed);}}return null ;});;
stop
end
@enduml

