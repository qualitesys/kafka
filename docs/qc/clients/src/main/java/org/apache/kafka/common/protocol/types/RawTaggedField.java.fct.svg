@startuml
!pragma layout smetana
start
note right
constructor RawTaggedField(inttag,byte[]data)
end note
:this.tag=tag;
:this.data=data;
end
start
note right
inttag()
end note
:return tag;;
stop
end
start
note right
byte[]data()
end note
:return data;;
stop
end
start
note right
intsize()
end note
:return data.length;;
stop
end
start
note right
booleanequals(Objecto)
end note
if ((o==null )||(!o.getClass().equals(getClass()))) then (yes) 
:return false;;
stop
endif 
:return tag==other.tag&&Arrays.equals(data,other.data);;
stop
end
start
note right
inthashCode()
end note
:return tag^Arrays.hashCode(data);;
stop
end
@enduml

