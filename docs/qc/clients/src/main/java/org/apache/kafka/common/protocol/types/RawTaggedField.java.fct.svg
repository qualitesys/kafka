end
start
note right
inttag()
end note
:return tag;;
stop
end
start
note right
byte[]data()
end note
:return data;;
stop
end
start
note right
intsize()
end note
:return data.length;;
stop
end
start
note right
booleanequals(Objecto)
end note
if ((o==null )||(!o.getClass().equals(getClass()))) then (yes) 
:return false;;
stop
endif 
