@startuml
!pragma layout smetana
start
note right
constructor RawTaggedField(int tag,byte[] data)
end note
:this.tag=tag;;
:this.data=data;;
end
start
note right
int tag()
end note
:return tag;;
stop
end
start
note right
byte[] data()
end note
:return data;;
stop
end
start
note right
int size()
end note
:return data.length;;
stop
end
start
note right
boolean equals(Object o)
end note
if ((o==null )||(!o.getClass().equals(getClass()))) then (yes) 
:return false;;
stop
endif 
:RawTaggedField other=(RawTaggedField )o;;
:return tag==other.tag&&Arrays.equals(data,
other.data);;
stop
end
start
note right
int hashCode()
end note
:return tag^Arrays.hashCode(data);;
stop
end
@enduml

