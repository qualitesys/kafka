@startuml
!pragma layout smetana
start
note right
void configure(Map<String,? >configs,Stringmechanism,List<AppConfigurationEntry>jaasConfigEntries)
end note
:this.jaasConfigEntries=jaasConfigEntries;
end
start
note right
void handle(Callback[]callbacks)
end note
if (callback instanceof NameCallback) then (yes) 
:username=((NameCallback)callback).getDefaultName();
else (no)
endif 
end
start
note right
booleanauthenticate(Stringusername,char[]password)
end note
if (username==null ) then (yes) 
:return false;;
stop
else (no)
:return expectedPassword!=null &&Utils.isEqualConstantTime(password,expectedPassword.toCharArray());;
stop
endif 
end
start
note right
void close()
end note
end
@enduml

