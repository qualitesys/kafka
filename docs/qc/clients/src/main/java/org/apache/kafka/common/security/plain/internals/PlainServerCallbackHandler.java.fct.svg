9023,212,366.9023,216,356.9023,212,360.9023" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="212" x2="212" y1="567.375" y2="589.9414"/><polygon fill="#181818" points="208,579.9414,212,589.9414,216,579.9414,212,583.9414" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[cf086267b6cbc795dfa89d1e7c5c05ec]
@startuml
!pragma layout smetana
start
note right
void configure(Map<String,? >configs,Stringmechanism,
List<AppConfigurationEntry>jaasConfigEntries)
end note
end
start
note right
void handle(Callback[]callbacks)
end note
if (callback instanceof NameCallback) then (yes) 
else (no)
:throw new UnsupportedCallbackException(callback);;
endif 
end
start
note right
booleanauthenticate(Stringusername,char[]password)
end note
if (username==null ) then (yes) 
:return false;;
stop
else (no)
:return expectedPassword!=null &&Utils.isEqualConstantTime(password,
expectedPassword.toCharArray());;
stop
endif 
end
start
note right
void close()
end note
end
@enduml

