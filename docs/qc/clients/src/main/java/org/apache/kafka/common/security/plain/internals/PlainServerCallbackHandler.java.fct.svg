@startuml
!pragma layout smetana
start
note right
void configure(Map<String,? >configs,Stringmechanism,
List<AppConfigurationEntry>jaasConfigEntries)
end note
:this.jaasConfigEntries=jaasConfigEntries;;
end
start
note right
void handle(Callback[]callbacks)
end note
:Stringusername=null ;;
if (callback instanceof NameCallback) then (yes) 
:username=((NameCallback)callback).getDefaultName();;
else if (callback instanceof PlainAuthenticateCallback) then (yes) 
:PlainAuthenticateCallbackplainCallback=(PlainAuthenticateCallback)callback;;
:booleanauthenticated=authenticate(username,
plainCallback.password());;
:plainCallback.authenticated(authenticated);;
else (no)
:throw new UnsupportedCallbackException(callback);;
stop
endif 
end
start
note right
booleanauthenticate(Stringusername,char[]password)
end note
if (username==null ) then (yes) 
:return false;;
stop
else (no)
:StringexpectedPassword=JaasContext.configEntryOption(jaasConfigEntries,JAAS_USER_PREFIX+
username,PlainLoginModule.class .getName());;
:return expectedPassword!=null &&Utils.isEqualConstantTime(password,
expectedPassword.toCharArray());;
stop
endif 
end
start
note right
void close()
end note
end
@enduml

