@startuml
!pragma layout smetana
start
note right
void configure(Map<String,? >configs,booleanisKey)
end note
if (encodingValue==null ) then (yes) 
:encodingValue=configs.get("deserializer.encoding");
endif 
if (encodingValue instanceof String) then (yes) 
:encoding=(String)encodingValue;
endif 
end
start
note right
UUIDdeserialize(Stringtopic,byte[]data)
end note
if (data==null ) then (yes) 
:return null ;;
stop
else (no)
:return UUID.fromString(new String(data,encoding));;
stop
endif 
:throw new SerializationException("Error when deserializing byte[] to UUID due to unsupported encoding "+encoding,e);;
:throw new SerializationException("Error parsing data into UUID",
e);;
end
@enduml

