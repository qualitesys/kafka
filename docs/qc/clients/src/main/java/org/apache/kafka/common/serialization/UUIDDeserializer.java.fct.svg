:1.0;" x1="840" x2="840" y1="566.8151" y2="590.5547"/><polygon fill="#181818" points="836,580.5547,840,590.5547,844,580.5547,840,584.5547" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="231" x="820.5" y="571.5581">catch (UnsupportedEncodingException e)</text><line style="stroke:#181818;stroke-width:1.0;" x1="820.5" x2="820.5" y1="508.3789" y2="530.9453"/><polygon fill="#181818" points="816.5,520.9453,820.5,530.9453,824.5,520.9453,820.5,524.9453" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[a134a5741dfc6984f347913b652ce6a9]
@startuml
!pragma layout smetana
start
note right
void configure(Map<String,?> configs,boolean isKey)
end note
:String propertyName=isKey? String.valueOf("key.deserializer.encoding"):String.valueOf("value.deserializer.encoding");;
:Object encodingValue=configs.get(propertyName);;
if (encodingValue==null ) then (yes) 
:encodingValue=configs.get("deserializer.encoding");;
endif 
if (encodingValue instanceof String ) then (yes) 
:encoding=(String )encodingValue;;
endif 
end
start
note right
UUID deserialize(String topic,byte[] data)
end note
switch (try/catch block)
case (try)
if (data==null ) then (yes) 
:return null ;;
stop
else (no)
:return UUID.fromString(new String(data,encoding));;
stop
endif 
case (catch (UnsupportedEncodingException e))
:throw new SerializationException("Error when deserializing byte[] to UUID due to unsupported encoding "+
encoding,e);;
stop
case (catch (IllegalArgumentException e))
:throw new SerializationException("Error parsing data into UUID",e);;
stop
endswitch
end
@enduml

