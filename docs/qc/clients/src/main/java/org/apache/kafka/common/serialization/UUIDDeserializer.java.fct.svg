yle="stroke:#181818;stroke-width:1.0;"/><!--MD5=[e96f361f901e84b0f40b61e3d79e33a4]
@startuml
!pragma layout smetana
start
note right
void configure(Map<String,? >configs,booleanisKey)
end note
if (encodingValue==null ) then (yes) 
:encodingValue=configs.get("deserializer.encoding");;
endif 
if (encodingValue instanceof String) then (yes) 
:encoding=(String)encodingValue;;
endif 
end
start
note right
UUIDdeserialize(Stringtopic,byte[]data)
end note
:try {if (data==null )return null ;else return UUID.fromString(new String(data,
encoding));}catch (UnsupportedEncodingExceptione){throw new SerializationException("Error when deserializing byte[] to UUID due to unsupported encoding "+
encoding,e);}catch (IllegalArgumentExceptione){throw new SerializationException("Error parsing data into UUID",
e);};
end
@enduml

