roke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="384.5" x2="384.5" y1="946.7266" y2="966.7266"/><polygon fill="#181818" points="380.5,956.7266,384.5,966.7266,388.5,956.7266,384.5,960.7266" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[f771133a4d45fb423228c33a4f72aa4e]
@startuml
!pragma layout smetana
start
note right
void configure(Map<String,? >configs,booleanisKey)
end note
:StringpropertyName=isKey? String.valueOf("key.deserializer.encoding"):String.valueOf("value.deserializer.encoding");;
:ObjectencodingValue=configs.get(propertyName);;
if (encodingValue==null ) then (yes) 
:encodingValue=configs.get("deserializer.encoding");;
endif 
if (encodingValue instanceof String) then (yes) 
:encoding=(String)encodingValue;;
endif 
end
start
note right
UUIDdeserialize(Stringtopic,byte[]data)
end note
:try ;
if (data==null ) then (yes) 
:return null ;;
stop
else (no)
:return UUID.fromString(new String(data,encoding));;
stop
endif 
:catch (UnsupportedEncodingExceptione);
:throw new SerializationException("Error when deserializing byte[] to UUID due to unsupported encoding "+
encoding,e);;
stop
:catch (IllegalArgumentExceptione);
:throw new SerializationException("Error parsing data into UUID",e);;
stop
end
@enduml

