@startuml
!pragma layout smetana
start
note right
constructor Builder(CreatePartitionsRequestData data)
end note
:super (ApiKeys.CREATE_PARTITIONS);;
:this.data=data;;
end
start
note right
CreatePartitionsRequest build(short version)
end note
:return new CreatePartitionsRequest(data,
version);;
stop
end
start
note right
String toString()
end note
:return data.toString();;
stop
end
start
note right
constructor CreatePartitionsRequest(CreatePartitionsRequestData data,
short apiVersion)
end note
:super (ApiKeys.CREATE_PARTITIONS,apiVersion);;
:this.data=data;;
end
start
note right
CreatePartitionsRequestData data()
end note
:return data;;
stop
end
start
note right
AbstractResponse getErrorResponse(int throttleTimeMs,
Throwable e)
end note
:CreatePartitionsResponseData response=new CreatePartitionsResponseData();;
:response.setThrottleTimeMs(throttleTimeMs);;
:ApiError apiError=ApiError.fromThrowable(e);;
:response.results().add(new CreatePartitionsTopicResult()
.setName(topic.name()).setErrorCode(apiError.error().code()).setErrorMessage(apiError.message()));;
:return new CreatePartitionsResponse(response);;
stop
end
start
note right
CreatePartitionsRequest parse(ByteBuffer buffer,
short version)
end note
:return new CreatePartitionsRequest(new CreatePartitionsRequestData(new ByteBufferAccessor(buffer),
version),version);;
stop
end
@enduml

