@startuml
!pragma layout smetana
start
note right
constructor Builder(CreatePartitionsRequestDatadata)
end note
:super (ApiKeys.CREATE_PARTITIONS);;
:this.data=data;;
end
start
note right
CreatePartitionsRequestbuild(shortversion)
end note
:return new CreatePartitionsRequest(data,
version);;
stop
end
start
note right
StringtoString()
end note
:return data.toString();;
stop
end
start
note right
constructor CreatePartitionsRequest(CreatePartitionsRequestDatadata,
shortapiVersion)
end note
:super (ApiKeys.CREATE_PARTITIONS,apiVersion);;
:this.data=data;;
end
start
note right
CreatePartitionsRequestDatadata()
end note
:return data;;
stop
end
start
note right
AbstractResponsegetErrorResponse(intthrottleTimeMs,
Throwablee)
end note
:CreatePartitionsResponseDataresponse=new CreatePartitionsResponseData();;
:response.setThrottleTimeMs(throttleTimeMs);;
:ApiErrorapiError=ApiError.fromThrowable(e);;
:response.results().add(new CreatePartitionsTopicResult()
.setName(topic.name()).setErrorCode(apiError.error().code()).setErrorMessage(apiError.message()));;
:return new CreatePartitionsResponse(response);;
stop
end
start
note right
CreatePartitionsRequestparse(ByteBufferbuffer,
shortversion)
end note
:return new CreatePartitionsRequest(new CreatePartitionsRequestData(new ByteBufferAccessor(buffer),
