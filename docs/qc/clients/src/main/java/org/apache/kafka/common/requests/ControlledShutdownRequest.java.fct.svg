ControlledShutdownRequestparse(ByteBufferbuffer,shortversion)
end note
:return new ControlledShutdownRequest(new ControlledShutdownRequestData(new ByteBufferAccessor(buffer),version),version);;
stop
end
start
note right
ControlledShutdownRequestDatadata()
end note
:return data;;
stop
end
