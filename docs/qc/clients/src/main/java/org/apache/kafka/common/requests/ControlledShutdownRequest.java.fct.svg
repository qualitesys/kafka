@startuml
!pragma layout smetana
start
note right
constructor Builder(ControlledShutdownRequestDatadata,shortdesiredVersion)
end note
:super (ApiKeys.CONTROLLED_SHUTDOWN,desiredVersion);
:this.data=data;
end
start
note right
ControlledShutdownRequestbuild(shortversion)
end note
:return new ControlledShutdownRequest(data,
version);;
stop
end
start
note right
StringtoString()
end note
:return data.toString();;
stop
end
start
note right
constructor ControlledShutdownRequest(ControlledShutdownRequestDatadata,shortversion)
end note
:super (ApiKeys.CONTROLLED_SHUTDOWN,version);
:this.data=data;
end
start
note right
ControlledShutdownResponsegetErrorResponse(intthrottleTimeMs,Throwablee)
end note
:return new ControlledShutdownResponse(data);;
stop
end
start
