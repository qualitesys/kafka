@startuml
!pragma layout smetana
start
note right
constructor Builder(ControlledShutdownRequestDatadata,
shortdesiredVersion)
end note
end
start
note right
ControlledShutdownRequestbuild(shortversion)
end note
:return new ControlledShutdownRequest(data,
version);;
stop
end
start
note right
StringtoString()
end note
:return data.toString();;
stop
end
start
note right
constructor ControlledShutdownRequest(ControlledShutdownRequestDatadata,
shortversion)
end note
end
start
note right
ControlledShutdownResponsegetErrorResponse(intthrottleTimeMs,
Throwablee)
end note
:return new ControlledShutdownResponse(data);;
stop
end
start
note right
ControlledShutdownRequestparse(ByteBufferbuffer,
shortversion)
end note
:return new ControlledShutdownRequest(new ControlledShutdownRequestData(new ByteBufferAccessor(buffer),
version),version);;
stop
end
start
note right
ControlledShutdownRequestDatadata()
end note
:return data;;
stop
end
@enduml

