@startuml
!pragma layout smetana
start
note right
constructor BoundField(Field def,Schema schema,
int index)
end note
:this.def=def;;
:this.schema=schema;;
:this.index=index;;
end
start
note right
String toString()
end note
:return def.name+":"+def.type;;
stop
end
@enduml

