@startuml
!pragma layout smetana
start
note right
Stringname()
end note
:return RANGE_ASSIGNOR_NAME;;
stop
end
start
note right
Map<String,List<MemberInfo>>consumersPerTopic(Map<String,
Subscription>consumerMetadata)
end note
:put(topicToConsumers,topic,memberInfo);
:return topicToConsumers;;
stop
end
start
note right
Map<String,List<TopicPartition>>assign(Map<String,
Integer>partitionsPerTopic,Map<String,Subscription>subscriptions)
end note
:assignment.put(memberId,new ArrayList<>());
if (numPartitionsForTopic==null ) then (yes) 
endif 
:Collections.sort(consumersForTopic);
:i++;
:assignment.get(consumersForTopic.get(i).memberId).addAll(partitions.subList(start,start+
length));
:return assignment;;
stop
end
@enduml

