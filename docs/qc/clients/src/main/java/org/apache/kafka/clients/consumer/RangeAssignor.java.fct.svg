.2422" y2="623.2422"/><polygon fill="#181818" points="184,613.2422,188,623.2422,192,613.2422,188,617.2422" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="188" x2="188" y1="657.2109" y2="677.2109"/><polygon fill="#181818" points="184,667.2109,188,677.2109,192,667.2109,188,671.2109" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="188" x2="188" y1="725.1484" y2="745.1484"/><polygon fill="#181818" points="184,735.1484,188,745.1484,192,735.1484,188,739.1484" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="188" x2="188" y1="779.1172" y2="799.1172"/><polygon fill="#181818" points="184,789.1172,188,799.1172,192,789.1172,188,793.1172" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[5a4e55a28a13c5edf5e25f6dfb7962e7]
@startuml
!pragma layout smetana
start
note right
Stringname()
end note
:return RANGE_ASSIGNOR_NAME;;
stop
end
start
note right
Map<String,List<MemberInfo>>consumersPerTopic(Map<String,Subscription>consumerMetadata)
end note
:put(topicToConsumers,topic,memberInfo);
:return topicToConsumers;;
stop
end
start
note right
Map<String,List<TopicPartition>>assign(Map<String,Integer>partitionsPerTopic,Map<String,Subscription>subscriptions)
end note
:assignment.put(memberId,new ArrayList<>());
if (numPartitionsForTopic==null ) then (yes) 
endif 
:Collections.sort(consumersForTopic);
:i++;
:assignment.get(consumersForTopic.get(i).memberId)
.addAll(partitions.subList(start,start+length));
:return assignment;;
stop
end
@enduml

