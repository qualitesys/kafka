@startuml
!pragma layout smetana
start
note right
Stringname()
end note
:return RANGE_ASSIGNOR_NAME;;
stop
end
start
note right
Map<String,List<MemberInfo>>consumersPerTopic(Map<String,
Subscription>consumerMetadata)
end note
:return topicToConsumers;;
stop
end
start
note right
Map<String,List<TopicPartition>>assign(Map<String,
Integer>partitionsPerTopic,Map<String,Subscription>subscriptions)
end note
if (numPartitionsForTopic==null ) then (yes) 
endif 
:return assignment;;
stop
end
@enduml

