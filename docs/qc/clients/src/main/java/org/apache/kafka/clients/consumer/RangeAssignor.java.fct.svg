,617.2422" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="330" x2="330" y1="657.2109" y2="677.2109"/><polygon fill="#181818" points="326,667.2109,330,677.2109,334,667.2109,330,671.2109" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="330" x2="330" y1="711.1797" y2="731.1797"/><polygon fill="#181818" points="326,721.1797,330,731.1797,334,721.1797,330,725.1797" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="330" x2="330" y1="765.1484" y2="785.1484"/><polygon fill="#181818" points="326,775.1484,330,785.1484,334,775.1484,330,779.1484" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[fadcefc63b55e1913a33e0da8850a3a4]
@startuml
!pragma layout smetana
start
note right
Stringname()
end note
:return RANGE_ASSIGNOR_NAME;;
stop
end
start
note right
Map<String,List<MemberInfo>>consumersPerTopic(Map<String,Subscription>consumerMetadata)
end note
:put(topicToConsumers,topic,memberInfo);
:return topicToConsumers;;
stop
end
start
note right
Map<String,List<TopicPartition>>assign(Map<String,Integer>partitionsPerTopic,Map<String,Subscription>subscriptions)
end note
:assignment.put(memberId,new ArrayList<>());
if (numPartitionsForTopic==null ) then (yes) 
endif 
:Collections.sort(consumersForTopic);
:i++;
:assignment.get(consumersForTopic.get(i).memberId).addAll(partitions.subList(start,start+length));
:return assignment;;
stop
end
@enduml

