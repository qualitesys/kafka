.5391,334,589.5391,330,593.5391" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="330" x2="330" y1="633.5078" y2="653.5078"/><polygon fill="#181818" points="326,643.5078,330,653.5078,334,643.5078,330,647.5078" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="330" x2="330" y1="687.4766" y2="707.4766"/><polygon fill="#181818" points="326,697.4766,330,707.4766,334,697.4766,330,701.4766" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="330" x2="330" y1="741.4453" y2="761.4453"/><polygon fill="#181818" points="326,751.4453,330,761.4453,334,751.4453,330,755.4453" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="330" x2="330" y1="795.4141" y2="815.4141"/><polygon fill="#181818" points="326,805.4141,330,815.4141,334,805.4141,330,809.4141" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[d453e2eaea5a5399a091b954db0ec68c]
@startuml
!pragma layout smetana
start
note right
Stringname()
end note
:return RANGE_ASSIGNOR_NAME;;
stop
end
start
note right
Map<String,List<MemberInfo>>consumersPerTopic(Map<String,
Subscription>consumerMetadata)
end note
:put(topicToConsumers,topic,memberInfo);
:return topicToConsumers;;
stop
end
start
note right
Map<String,List<TopicPartition>>assign(Map<String,
Integer>partitionsPerTopic,Map<String,Subscription>subscriptions)
end note
:assignment.put(memberId,new ArrayList<>());
if (numPartitionsForTopic==null ) then (yes) 
endif 
:Collections.sort(consumersForTopic);
:i++;
:assignment.get(consumersForTopic.get(i).memberId).addAll(partitions.subList(start,start+length));
:return assignment;;
stop
end
@enduml

