@startuml
!pragma layout smetana
start
note right
constructor CircularIterator(final Collection<T>col)
end note
:this.iterable=Objects.requireNonNull(col);;
:this.iterator=col.iterator();;
if (col.isEmpty()) then (yes) 
:throw new IllegalArgumentException("CircularIterator can only be used on non-empty lists");;
stop
endif 
:this.nextValue=advance();;
end
start
note right
booleanhasNext()
end note
:return true;;
stop
end
start
note right
Tnext()
end note
:nextValue=advance();;
:return next;;
stop
end
start
note right
Tadvance()
end note
if (!iterator.hasNext()) then (yes) 
:iterator=iterable.iterator();;
endif 
:return iterator.next();;
stop
end
start
note right
Tpeek()
end note
:return nextValue;;
stop
end
start
note right
void remove()
end note
:throw new UnsupportedOperationException();;
stop
end
@enduml

