@startuml
!pragma layout smetana
start
note right
constructor OAuthBearerIllegalTokenException(OAuthBearerValidationResultreason)
end note
if (reason.success()) then (yes) 
:throw new IllegalArgumentException("The reason indicates success;
: it must instead indicate failure");;
endif 
end
start
note right
OAuthBearerValidationResultreason()
end note
:return reason;;
stop
end
@enduml

