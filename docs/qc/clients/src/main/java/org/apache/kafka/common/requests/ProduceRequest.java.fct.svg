@startuml
!pragma layout smetana
start
note right
BuilderforMagic(bytemagic,ProduceRequestDatadata)
end note
:final shortminVersion;;
:final shortmaxVersion;;
if (magic<RecordBatch.MAGIC_VALUE_V2) then (yes) 
:minVersion=2;;
:maxVersion=2;;
else (no)
:minVersion=3;;
:maxVersion=ApiKeys.PRODUCE.latestVersion();;
endif 
:return new Builder(minVersion,maxVersion,
data);;
stop
end
start
note right
BuilderforCurrentMagic(ProduceRequestDatadata)
end note
:return forMagic(RecordBatch.CURRENT_MAGIC_VALUE,
data);;
stop
end
start
note right
constructor Builder(shortminVersion,shortmaxVersion,
ProduceRequestDatadata)
end note
:super (ApiKeys.PRODUCE,minVersion,maxVersion);;
:this.data=data;;
end
start
note right
ProduceRequestbuild(shortversion)
end note
:return build(version,true);;
stop
end
start
note right
ProduceRequestbuildUnsafe(shortversion)
end note
:return build(version,false);;
stop
end
start
note right
ProduceRequestbuild(shortversion,booleanvalidate)
end note
if (validate) then (yes) 
:data.topicData().forEach(tpd->tpd.partitionData().forEach(partitionProduceData->ProduceRequest.validateRecords(version,
partitionProduceData.records())));;
endif 
:return new ProduceRequest(data,version);;
stop
end
start
note right
StringtoString()
end note
:StringBuilderbld=new StringBuilder();;
:bld.append("(type=ProduceRequest").append(",
 acks=").append(data.acks()).append(", timeout=").append(data.timeoutMs()).append(",
 partitionRecords=(").append(data.topicData().stream().flatMap(d->d.partitionData().stream()).collect(Collectors.toList())).append("),
 transactionalId='").append(data.transactionalId()!=null ? data.transactionalId():String.valueOf("")).append("'");;
:return bld.toString();;
stop
end
start
note right
constructor ProduceRequest(ProduceRequestDataproduceRequestData,
shortversion)
end note
:super (ApiKeys.PRODUCE,version);;
:this.data=produceRequestData;;
:this.acks=data.acks();;
:this.timeout=data.timeoutMs();;
:this.transactionalId=data.transactionalId();;
end
start
note right
Map<TopicPartition,Integer>partitionSizes()
end note
if (partitionSizes==null ) then (yes) 
:synchronized (this){if (partitionSizes==null ){partitionSizes=new HashMap<>();
:data.topicData().forEach(topicData->topicData.partitionData().forEach(partitionData->partitionSizes.compute(new TopicPartition(topicData.name(),
partitionData.index()),(ignored,previousValue)->partitionData.records().sizeInBytes()+
(previousValue==null ? 0:previousValue))));}};
endif 
:return partitionSizes;;
stop
end
start
note right
ProduceRequestDatadata()
end note
:ProduceRequestDatatmp=data;;
if (tmp==null ) then (yes) 
:throw new IllegalStateException("The partition records are no longer available because clearPartitionRecords() has been invoked.");;
stop
endif 
:return tmp;;
stop
end
start
note right
StringtoString(booleanverbose)
end note
:StringBuilderbld=new StringBuilder();;
:bld.append("{acks=").append(acks).append(",
timeout=").append(timeout);;
if (verbose) then (yes) 
:bld.append(",partitionSizes=").append(Utils.mkString(partitionSizes(),
"[","]","=",","));;
else (no)
:bld.append(",numPartitions=").append(partitionSizes()
.size());;
endif 
:bld.append("}");;
:return bld.toString();;
stop
end
start
note right
ProduceResponsegetErrorResponse(intthrottleTimeMs,
Throwablee)
end note
if (acks==0) then (yes) 
:return null ;;
stop
endif 
:ApiErrorapiError=ApiError.fromThrowable(e);;
:ProduceResponseDatadata=new ProduceResponseData()
.setThrottleTimeMs(throttleTimeMs);;
:partitionSizes().forEach((tp,ignored)->{ProduceResponseData.TopicProduceResponsetpr=data.responses().find(tp.topic());
:if (tpr==null ){tpr=new ProduceResponseData.TopicProduceResponse().setName(tp.topic());
:data.responses().add(tpr);}tpr.partitionResponses()
.add(new ProduceResponseData.PartitionProduceResponse().setIndex(tp.partition()).setRecordErrors(Collections.emptyList()).setBaseOffset(INVALID_OFFSET).setLogAppendTimeMs(RecordBatch.NO_TIMESTAMP).setLogStartOffset(INVALID_OFFSET).setErrorMessage(apiError.message()).setErrorCode(apiError.error().code()));});;
:return new ProduceResponse(data);;
stop
end
start
note right
Map<Errors,Integer>errorCounts(Throwablee)
end note
:Errorserror=Errors.forException(e);;
:return Collections.singletonMap(error,partitionSizes()
.size());;
stop
end
start
note right
shortacks()
end note
:return acks;;
stop
end
start
note right
inttimeout()
end note
:return timeout;;
stop
end
start
note right
StringtransactionalId()
end note
:return transactionalId;;
stop
end
start
note right
void clearPartitionRecords()
end note
:partitionSizes();;
:data=null ;;
end
start
note right
void validateRecords(shortversion,BaseRecordsbaseRecords)
end note
if (version>=3) then (yes) 
if (baseRecords instanceof Records) then (yes) 
:Recordsrecords=(Records)baseRecords;;
:Iterator<?  extends RecordBatch>iterator=records.batches()
.iterator();;
if (!iterator.hasNext()) then (yes) 
:throw new InvalidRecordException("Produce requests with version "+
version+" must have at least "+"one record batch");;
stop
endif 
:RecordBatchentry=iterator.next();;
if (entry.magic()!=RecordBatch.MAGIC_VALUE_V2) then (yes) 
:throw new InvalidRecordException("Produce requests with version "+
version+" are only allowed to "+"contain record batches with magic version 2");;
stop
endif 
if (version<7&&entry.compressionType()==CompressionType.ZSTD) then (yes) 
:throw new UnsupportedCompressionTypeException("Produce requests with version "+
version+" are not allowed to "+"use ZStandard compression");;
stop
endif 
if (iterator.hasNext()) then (yes) 
:throw new InvalidRecordException("Produce requests with version "+
version+" are only allowed to "+"contain exactly one record batch");;
stop
endif 
endif 
endif 
end
start
note right
ProduceRequestparse(ByteBufferbuffer,shortversion)
end note
:return new ProduceRequest(new ProduceRequestData(new ByteBufferAccessor(buffer),
version),version);;
stop
end
start
note right
byterequiredMagicForVersion(shortproduceRequestVersion)
end note
if (produceRequestVersion<ApiKeys.PRODUCE.oldestVersion()||produceRequestVersion>ApiKeys.PRODUCE.latestVersion()) then (yes) 
:throw new IllegalArgumentException("Magic value to use for produce request version "+
produceRequestVersion+" is not known");;
stop
endif 
switch (switch (produceRequestVersion))
endswith
end
@enduml

