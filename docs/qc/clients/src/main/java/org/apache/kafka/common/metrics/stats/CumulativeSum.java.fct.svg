@startuml
!pragma layout smetana
start
note right
constructor CumulativeSum()
end note
:total=0.0;
end
start
note right
constructor CumulativeSum(doublevalue)
end note
:total=value;
end
start
note right
void record(MetricConfigconfig,doublevalue,longnow)
end note
:total+=value;
end
start
note right
doublemeasure(MetricConfigconfig,longnow)
end note
:return total;;
stop
end
start
note right
StringtoString()
end note
:return "CumulativeSum(total="+total+")";;
stop
end
@enduml

