@startuml
!pragma layout smetana
start
note right
void configure(Map<String,? >configs,StringcontextName,
Configurationconfiguration,AuthenticateCallbackHandlerloginCallbackHandler)
end note
end
start
note right
LoginContextlogin()
end note
:return loginContext;;
stop
end
start
note right
Subjectsubject()
end note
:return loginContext.getSubject();;
stop
end
start
note right
StringcontextName()
end note
:return contextName;;
stop
end
start
note right
Configurationconfiguration()
end note
:return configuration;;
stop
end
start
note right
void configure(Map<String,? >configs,StringsaslMechanism,
List<AppConfigurationEntry>jaasConfigEntries)
end note
end
start
note right
void handle(Callback[]callbacks)
end note
if (callback instanceof NameCallback) then (yes) 
else (no)
:throw new UnsupportedCallbackException(callback,
"Unrecognized SASL Login callback");;
endif 
end
start
note right
void close()
end note
end
@enduml

