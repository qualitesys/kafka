@startuml
!pragma layout smetana
:future.complete(value);
:return future;;
stop
start
note right
KafkaFuture<Void>allOf(KafkaFuture<? >... futures)
end note
:CompletableFuture.allOf(Arrays.stream(futures).map(kafkaFuture->{return (CompletableFuture<? >)kafkaFuture.toCompletionStage();}).toArray(CompletableFuture[]::new )).whenComplete((value,ex)->{if (ex==null ){result.complete(value);}else {result.completeExceptionally(ex.getCause());}});
:return result;;
stop
end
@enduml

