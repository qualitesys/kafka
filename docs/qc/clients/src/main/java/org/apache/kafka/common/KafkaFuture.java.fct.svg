-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="332.5" x2="332.5" y1="173.5039" y2="196.0703"/><polygon fill="#181818" points="328.5,186.0703,332.5,196.0703,336.5,186.0703,332.5,190.0703" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="332.5" x2="332.5" y1="271.9453" y2="291.9453"/><polygon fill="#181818" points="328.5,281.9453,332.5,291.9453,336.5,281.9453,332.5,285.9453" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="332.5" x2="332.5" y1="325.9141" y2="345.9141"/><polygon fill="#181818" points="328.5,335.9141,332.5,345.9141,336.5,335.9141,332.5,339.9141" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[6f5111c1b3813bc09a7e8818531f07a2]
@startuml
!pragma layout smetana
:future.complete(value);
:return future;;
stop
start
note right
KafkaFuture<Void>allOf(KafkaFuture<? >... futures)
end note
:CompletableFuture.allOf(Arrays.stream(futures)
.map(kafkaFuture->{return (CompletableFuture<? >)kafkaFuture.toCompletionStage();})
.toArray(CompletableFuture[]::new )).whenComplete((value,
ex)->{if (ex==null ){result.complete(value);}else {result.completeExceptionally(ex.getCause());}});
:return result;;
stop
end
@enduml

