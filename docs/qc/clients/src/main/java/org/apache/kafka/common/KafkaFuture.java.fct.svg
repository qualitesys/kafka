note right
KafkaFuture<Void> allOf(KafkaFuture<?> ... futures)
end note
:KafkaFutureImpl<Void> result=new KafkaFutureImpl<>();;
:CompletableFuture.allOf(Arrays.stream(futures).map(kafkaFuture->{return (CompletableFuture<?> )kafkaFuture.toCompletionStage();}).toArray(CompletableFuture[]::new )).whenComplete((value,
ex)->{if (ex==null ){result.complete(value);}else {result.completeExceptionally(ex.getCause());}});;
:return result;;
stop
end
