" x2="163.5" y1="593.4453" y2="613.4453"/><polygon fill="#181818" points="159.5,603.4453,163.5,613.4453,167.5,603.4453,163.5,607.4453" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[5205a247c839c8d8e901f83f2d40a360]
@startuml
!pragma layout smetana
start
note right
constructor Max()
end note
:super (Double.NEGATIVE_INFINITY);;
end
start
note right
void update(Samplesample,MetricConfigconfig,
doublevalue,longnow)
end note
:sample.value=Math.max(sample.value,value);;
end
start
note right
doublecombine(List<Sample>samples,MetricConfigconfig,
longnow)
end note
:doublemax=Double.NEGATIVE_INFINITY;;
:longcount=0;;
:max=Math.max(max,sample.value);;
:count+=sample.eventCount;;
:return count==0? Double.NaN:max;;
stop
end
@enduml

