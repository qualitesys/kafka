" y1="290.7695" y2="313.3359"/><polygon fill="#181818" points="157.5,303.3359,161.5,313.3359,165.5,303.3359,161.5,307.3359" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="161.5" x2="161.5" y1="347.3047" y2="367.3047"/><polygon fill="#181818" points="157.5,357.3047,161.5,367.3047,165.5,357.3047,161.5,361.3047" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="161.5" x2="161.5" y1="401.2734" y2="421.2734"/><polygon fill="#181818" points="157.5,411.2734,161.5,421.2734,165.5,411.2734,161.5,415.2734" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="161.5" x2="161.5" y1="455.2422" y2="475.2422"/><polygon fill="#181818" points="157.5,465.2422,161.5,475.2422,165.5,465.2422,161.5,469.2422" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[3fa722133fde56d59d5cd505865325ae]
@startuml
!pragma layout smetana
start
note right
constructor Max()
end note
:super (Double.NEGATIVE_INFINITY);
end
start
note right
void update(Samplesample,MetricConfigconfig,doublevalue,longnow)
end note
:sample.value=Math.max(sample.value,value);
end
start
note right
doublecombine(List<Sample>samples,MetricConfigconfig,longnow)
end note
:max=Math.max(max,sample.value);
:count+=sample.eventCount;
:return count==0? Double.NaN:max;;
stop
end
@enduml

