@startuml
!pragma layout smetana
start
note right
constructor Max()
end note
:super (Double.NEGATIVE_INFINITY);
end
start
note right
void update(Samplesample,MetricConfigconfig,
doublevalue,longnow)
end note
:sample.value=Math.max(sample.value,value);
end
start
note right
doublecombine(List<Sample>samples,MetricConfigconfig,
longnow)
end note
:max=Math.max(max,sample.value);
:count+=sample.eventCount;
:return count==0? Double.NaN:max;;
stop
end
@enduml

