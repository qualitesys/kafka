@startuml
!pragma layout smetana
start
note right
booleandryRun()
end note
:return validateOnly;;
stop
end
start
note right
booleanvalidateOnly()
end note
:return validateOnly;;
stop
end
start
note right
UpdateFeaturesOptionsdryRun(booleandryRun)
end note
:return validateOnly(dryRun);;
stop
end
start
note right
UpdateFeaturesOptionsvalidateOnly(booleanvalidateOnly)
end note
:this.validateOnly=validateOnly;
:return this;;
stop
end
@enduml

