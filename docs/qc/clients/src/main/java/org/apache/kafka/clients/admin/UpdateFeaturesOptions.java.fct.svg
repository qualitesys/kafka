@startuml
!pragma layout smetana
start
note right
boolean dryRun()
end note
:return validateOnly;;
stop
end
start
note right
boolean validateOnly()
end note
:return validateOnly;;
stop
end
start
note right
UpdateFeaturesOptions dryRun(boolean dryRun)
end note
:return validateOnly(dryRun);;
stop
end
