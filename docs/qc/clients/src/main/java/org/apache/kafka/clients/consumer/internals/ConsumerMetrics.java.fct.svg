" x1="289.5" x2="289.5" y1="713.3828" y2="733.3828"/><polygon fill="#181818" points="285.5,723.3828,289.5,733.3828,293.5,723.3828,289.5,727.3828" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="289.5" x2="289.5" y1="781.3203" y2="801.3203"/><polygon fill="#181818" points="285.5,791.3203,289.5,801.3203,293.5,791.3203,289.5,795.3203" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[ffb0ad453e4e6308793b8896d9e078be]
@startuml
!pragma layout smetana
start
note right
constructor ConsumerMetrics(Set<String> metricsTags,
String metricGrpPrefix)
end note
:this.fetcherMetrics=new FetcherMetricsRegistry(metricsTags,
metricGrpPrefix);;
end
start
note right
constructor ConsumerMetrics(String metricGroupPrefix)
end note
:this(new HashSet<String >(),metricGroupPrefix);;
end
start
note right
List<MetricNameTemplate> getAllTemplates()
end note
:List<MetricNameTemplate> l=new ArrayList<>(this.fetcherMetrics.getAllTemplates());;
:return l;;
stop
end
start
note right
void main(String[] args)
end note
:Set<String> tags=new HashSet<>();;
:tags.add("client-id");;
:ConsumerMetrics metrics=new ConsumerMetrics(tags,
"consumer");;
:System.out.println(Metrics.toHtmlTable("kafka.consumer",
metrics.getAllTemplates()));;
end
@enduml

