.5" x2="287.5" y1="713.3828" y2="733.3828"/><polygon fill="#181818" points="283.5,723.3828,287.5,733.3828,291.5,723.3828,287.5,727.3828" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="287.5" x2="287.5" y1="781.3203" y2="801.3203"/><polygon fill="#181818" points="283.5,791.3203,287.5,801.3203,291.5,791.3203,287.5,795.3203" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[408d00f1136e3c59455523d8a68c0c21]
@startuml
!pragma layout smetana
start
note right
constructor ConsumerMetrics(Set<String>metricsTags,
StringmetricGrpPrefix)
end note
:this.fetcherMetrics=new FetcherMetricsRegistry(metricsTags,
metricGrpPrefix);;
end
start
note right
constructor ConsumerMetrics(StringmetricGroupPrefix)
end note
:this(new HashSet<String>(),metricGroupPrefix);;
end
start
note right
List<MetricNameTemplate>getAllTemplates()
end note
:List<MetricNameTemplate>l=new ArrayList<>(this.fetcherMetrics.getAllTemplates());;
:return l;;
stop
end
start
note right
void main(String[]args)
end note
:Set<String>tags=new HashSet<>();;
:tags.add("client-id");;
:ConsumerMetricsmetrics=new ConsumerMetrics(tags,
"consumer");;
:System.out.println(Metrics.toHtmlTable("kafka.consumer",
metrics.getAllTemplates()));;
end
@enduml

