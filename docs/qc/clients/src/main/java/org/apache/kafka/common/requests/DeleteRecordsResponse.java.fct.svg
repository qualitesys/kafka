@startuml
!pragma layout smetana
start
note right
constructor DeleteRecordsResponse(DeleteRecordsResponseDatadata)
end note
:super (ApiKeys.DELETE_RECORDS);
:this.data=data;
end
start
note right
DeleteRecordsResponseDatadata()
end note
:return data;;
stop
end
start
note right
intthrottleTimeMs()
end note
:return data.throttleTimeMs();;
stop
end
start
note right
Map<Errors,Integer>errorCounts()
end note
:data.topics().forEach(topicResponses->topicResponses.partitions().forEach(response->updateErrorCounts(errorCounts,
Errors.forCode(response.errorCode()))));
:return errorCounts;;
stop
end
start
note right
DeleteRecordsResponseparse(ByteBufferbuffer,
shortversion)
end note
:return new DeleteRecordsResponse(new DeleteRecordsResponseData(new ByteBufferAccessor(buffer),
version));;
stop
end
start
note right
booleanshouldClientThrottle(shortversion)
end note
:return version>=1;;
stop
end
@enduml

