@startuml
!pragma layout smetana
start
note right
constructor DeleteRecordsResponse(DeleteRecordsResponseData data)
end note
:super (ApiKeys.DELETE_RECORDS);;
:this.data=data;;
end
start
note right
DeleteRecordsResponseData data()
end note
:return data;;
stop
end
start
note right
int throttleTimeMs()
end note
:return data.throttleTimeMs();;
stop
end
start
note right
Map<Errors,Integer> errorCounts()
end note
:Map<Errors,Integer> errorCounts=new HashMap<>();;
:data.topics().forEach(topicResponses->topicResponses.partitions().forEach(response->updateErrorCounts(errorCounts,
Errors.forCode(response.errorCode()))));;
:return errorCounts;;
stop
end
start
note right
DeleteRecordsResponse parse(ByteBuffer buffer,
short version)
end note
:return new DeleteRecordsResponse(new DeleteRecordsResponseData(new ByteBufferAccessor(buffer),
version));;
stop
end
start
note right
boolean shouldClientThrottle(short version)
end note
:return version>=1;;
stop
end
@enduml

