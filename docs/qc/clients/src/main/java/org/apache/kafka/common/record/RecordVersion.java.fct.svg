@startuml
!pragma layout smetana
start
note right
constructor RecordVersion(int value)
end note
:this.value=(byte )value;;
end
start
note right
boolean precedes(RecordVersion other)
end note
:return this.value<other.value;;
stop
end
start
note right
RecordVersion lookup(byte value)
end note
if (value<0||value>=VALUES.length) then (yes) 
:throw new IllegalArgumentException("Unknown record version: "+
value);;
stop
endif 
:return VALUES[value];;
stop
end
start
note right
RecordVersion current()
end note
:return V2;;
stop
end
@enduml

