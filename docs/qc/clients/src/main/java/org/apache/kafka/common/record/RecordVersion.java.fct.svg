@startuml
!pragma layout smetana
start
note right
constructor RecordVersion(intvalue)
end note
:this.value=(byte)value;
end
start
note right
booleanprecedes(RecordVersionother)
end note
:return this.value<other.value;;
stop
end
start
note right
RecordVersionlookup(bytevalue)
end note
if (value<0||value>=VALUES.length) then (yes) 
:throw new IllegalArgumentException("Unknown record version: "+
value);;
endif 
:return VALUES[value];;
stop
end
start
note right
RecordVersioncurrent()
end note
:return V2;;
stop
end
@enduml

