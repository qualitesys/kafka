.9453,1259,1025.9453,1255,1029.9453" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="1255" x2="1255" y1="1069.9141" y2="1089.9141"/><polygon fill="#181818" points="1251,1079.9141,1255,1089.9141,1259,1079.9141,1255,1083.9141" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[4411b055ffdfc0ac4b75b608f49b00e2]
@startuml
!pragma layout smetana
start
note right
constructor EndQuorumEpochResponse(EndQuorumEpochResponseDatadata)
end note
:super (ApiKeys.END_QUORUM_EPOCH);
:this.data=data;
end
start
note right
Map<Errors,Integer>errorCounts()
end note
:errors.put(Errors.forCode(data.errorCode()),1);
:updateErrorCounts(errors,Errors.forCode(partitionResponse.errorCode()));
:return errors;;
stop
end
start
note right
EndQuorumEpochResponseDatadata()
end note
:return data;;
stop
end
start
note right
intthrottleTimeMs()
end note
:return DEFAULT_THROTTLE_TIME;;
stop
end
start
note right
EndQuorumEpochResponseDatasingletonResponse(ErrorstopLevelError,
TopicPartitiontopicPartition,ErrorspartitionLevelError,
intleaderEpoch,intleaderId)
end note
:return new EndQuorumEpochResponseData().setErrorCode(topLevelError.code()).setTopics(Collections.singletonList(new EndQuorumEpochResponseData.TopicData().setTopicName(topicPartition.topic()).setPartitions(Collections.singletonList(new EndQuorumEpochResponseData.PartitionData().setErrorCode(partitionLevelError.code()).setLeaderId(leaderId).setLeaderEpoch(leaderEpoch)))));;
stop
end
start
note right
EndQuorumEpochResponseparse(ByteBufferbuffer,
shortversion)
end note
:return new EndQuorumEpochResponse(new EndQuorumEpochResponseData(new ByteBufferAccessor(buffer),version));;
stop
end
@enduml

