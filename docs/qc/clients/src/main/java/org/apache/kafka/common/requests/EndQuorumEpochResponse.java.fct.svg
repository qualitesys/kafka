@startuml
!pragma layout smetana
start
note right
constructor EndQuorumEpochResponse(EndQuorumEpochResponseDatadata)
end note
:super (ApiKeys.END_QUORUM_EPOCH);
:this.data=data;
end
start
note right
Map<Errors,Integer>errorCounts()
end note
:errors.put(Errors.forCode(data.errorCode()),1);
:updateErrorCounts(errors,Errors.forCode(partitionResponse.errorCode()));
:return errors;;
stop
end
start
note right
EndQuorumEpochResponseDatadata()
end note
:return data;;
stop
end
start
note right
intthrottleTimeMs()
end note
:return DEFAULT_THROTTLE_TIME;;
stop
end
start
note right
EndQuorumEpochResponseDatasingletonResponse(ErrorstopLevelError,
TopicPartitiontopicPartition,ErrorspartitionLevelError,
intleaderEpoch,intleaderId)
end note
:return new EndQuorumEpochResponseData().setErrorCode(topLevelError.code())
.setTopics(Collections.singletonList(new EndQuorumEpochResponseData.TopicData().setTopicName(topicPartition.topic()).setPartitions(Collections.singletonList(new EndQuorumEpochResponseData.PartitionData().setErrorCode(partitionLevelError.code()).setLeaderId(leaderId).setLeaderEpoch(leaderEpoch)))));;
stop
end
start
note right
EndQuorumEpochResponseparse(ByteBufferbuffer,
shortversion)
end note
:return new EndQuorumEpochResponse(new EndQuorumEpochResponseData(new ByteBufferAccessor(buffer),
version));;
stop
end
@enduml

