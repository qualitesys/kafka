@startuml
!pragma layout smetana
start
note right
constructor TransactionState(String name)
end note
:this.name=name;;
end
start
note right
String toString()
end note
:return name;;
stop
end
start
note right
TransactionState parse(String name)
end note
:TransactionState state=NAME_TO_ENUM.get(name);;
:return state==null ? UNKNOWN:state;;
stop
end
@enduml

