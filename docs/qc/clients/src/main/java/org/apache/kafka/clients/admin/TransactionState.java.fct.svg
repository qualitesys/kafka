@startuml
!pragma layout smetana
start
note right
constructor TransactionState(Stringname)
end note
:this.name=name;;
end
start
note right
StringtoString()
end note
:return name;;
stop
end
start
note right
TransactionStateparse(Stringname)
end note
:TransactionStatestate=NAME_TO_ENUM.get(name);;
:return state==null ? UNKNOWN:state;;
stop
end
@enduml

