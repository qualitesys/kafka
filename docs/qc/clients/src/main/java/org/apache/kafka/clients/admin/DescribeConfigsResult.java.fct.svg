th:1.0;" x1="1669.5" x2="1669.5" y1="218.2031" y2="238.2031"/><polygon fill="#181818" points="1665.5,228.2031,1669.5,238.2031,1673.5,228.2031,1669.5,232.2031" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="1669.5" x2="1669.5" y1="322.7695" y2="345.3359"/><polygon fill="#181818" points="1665.5,335.3359,1669.5,345.3359,1673.5,335.3359,1669.5,339.3359" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="1669.5" x2="1669.5" y1="379.3047" y2="399.3047"/><polygon fill="#181818" points="1665.5,389.3047,1669.5,399.3047,1673.5,389.3047,1669.5,393.3047" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[29ed6e3a84735d5e19ba5b18dd20f564]
@startuml
!pragma layout smetana
start
note right
constructor DescribeConfigsResult(Map<ConfigResource,KafkaFuture<Config>>futures)
end note
:this.futures=futures;
end
start
note right
Map<ConfigResource,KafkaFuture<Config>>values()
end note
:return futures;;
stop
end
start
note right
KafkaFuture<Map<ConfigResource,Config>>all()
end note
:return KafkaFuture.allOf(futures.values().toArray(new KafkaFuture[0])).thenApply(new KafkaFuture.BaseFunction<Void,Map<ConfigResource,Config>>(){@Override public Map<ConfigResource,Config>apply(Voidv){Map<ConfigResource,Config>configs=new HashMap<>(futures.size());for (Map.Entry<ConfigResource,KafkaFuture<Config>>entry:futures.entrySet()){try {configs.put(entry.getKey(),entry.getValue().get());}catch (InterruptedException|ExecutionExceptione){throw new RuntimeException(e);}}return configs;}});;
stop
end
@enduml

