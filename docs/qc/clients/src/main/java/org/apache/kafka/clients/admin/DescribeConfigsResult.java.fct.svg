5.5,189.3672,1669.5,199.3672,1673.5,189.3672,1669.5,193.3672" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="1669.5" x2="1669.5" y1="233.3359" y2="253.3359"/><polygon fill="#181818" points="1665.5,243.3359,1669.5,253.3359,1673.5,243.3359,1669.5,247.3359" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="1669.5" x2="1669.5" y1="337.9023" y2="360.4688"/><polygon fill="#181818" points="1665.5,350.4688,1669.5,360.4688,1673.5,350.4688,1669.5,354.4688" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="1669.5" x2="1669.5" y1="394.4375" y2="414.4375"/><polygon fill="#181818" points="1665.5,404.4375,1669.5,414.4375,1673.5,404.4375,1669.5,408.4375" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[77dd03499a654eeff2b20d4a30875b89]
@startuml
!pragma layout smetana
start
note right
constructor DescribeConfigsResult(Map<ConfigResource,
KafkaFuture<Config>>futures)
end note
:this.futures=futures;
end
start
note right
Map<ConfigResource,KafkaFuture<Config>>values()
end note
:return futures;;
stop
end
start
note right
KafkaFuture<Map<ConfigResource,Config>>all()
end note
:return KafkaFuture.allOf(futures.values().toArray(new KafkaFuture[0])).thenApply(new KafkaFuture.BaseFunction<Void,Map<ConfigResource,Config>>(){@Override public Map<ConfigResource,Config>apply(Voidv){Map<ConfigResource,Config>configs=new HashMap<>(futures.size());for (Map.Entry<ConfigResource,KafkaFuture<Config>>entry:futures.entrySet()){try {configs.put(entry.getKey(),entry.getValue().get());}catch (InterruptedException|ExecutionExceptione){throw new RuntimeException(e);}}return configs;}});;
stop
end
@enduml

