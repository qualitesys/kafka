@startuml
!pragma layout smetana
start
note right
constructor DescribeConfigsResult(Map<ConfigResource,KafkaFuture<Config>>futures)
end note
:this.futures=futures;
end
start
note right
Map<ConfigResource,KafkaFuture<Config>>values()
end note
:return futures;;
stop
end
start
note right
KafkaFuture<Map<ConfigResource,Config>>all()
end note
:return KafkaFuture.allOf(futures.values()
.toArray(new KafkaFuture[0])).thenApply(new KafkaFuture.BaseFunction<Void,
Map<ConfigResource,Config>>(){@Override public Map<ConfigResource,
Config>apply(Voidv){Map<ConfigResource,Config>configs=new HashMap<>(futures.size());for (Map.Entry<ConfigResource,KafkaFuture<Config>>entry:futures.entrySet()){try {configs.put(entry.getKey(),entry.getValue().get());}catch (InterruptedException|ExecutionExceptione){throw new RuntimeException(e);}}return configs;}});;
stop
end
@enduml

