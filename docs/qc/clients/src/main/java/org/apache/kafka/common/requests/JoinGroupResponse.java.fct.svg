@startuml
!pragma layout smetana
start
note right
constructor JoinGroupResponse(JoinGroupResponseDatadata)
end note
end
start
note right
JoinGroupResponseDatadata()
end note
:return data;;
stop
end
start
note right
booleanisLeader()
end note
:return data.memberId().equals(data.leader());;
stop
end
start
note right
intthrottleTimeMs()
end note
:return data.throttleTimeMs();;
stop
end
start
note right
Errorserror()
end note
:return Errors.forCode(data.errorCode());;
stop
end
start
note right
Map<Errors,Integer>errorCounts()
end note
:return errorCounts(Errors.forCode(data.errorCode()));;
stop
end
start
note right
JoinGroupResponseparse(ByteBufferbuffer,shortversion)
end note
:return new JoinGroupResponse(new JoinGroupResponseData(new ByteBufferAccessor(buffer),
version));;
stop
end
start
note right
StringtoString()
end note
:return data.toString();;
stop
end
start
note right
booleanshouldClientThrottle(shortversion)
end note
:return version>=3;;
stop
end
@enduml

