@startuml
!pragma layout smetana
start
note right
constructor JoinGroupResponse(JoinGroupResponseData data)
end note
:super (ApiKeys.JOIN_GROUP);;
:this.data=data;;
end
start
note right
JoinGroupResponseData data()
end note
:return data;;
stop
end
start
note right
boolean isLeader()
end note
:return data.memberId().equals(data.leader());;
stop
end
start
note right
int throttleTimeMs()
end note
:return data.throttleTimeMs();;
stop
end
start
note right
Errors error()
end note
:return Errors.forCode(data.errorCode());;
stop
end
start
note right
Map<Errors,Integer> errorCounts()
end note
:return errorCounts(Errors.forCode(data.errorCode()));;
stop
end
start
note right
JoinGroupResponse parse(ByteBuffer buffer,
