@startuml
!pragma layout smetana
:return translateDeprecatedConfigs(configs,
Stream.of(aliasGroups).collect(Collectors.toMap(x->x[0],
x->Stream.of(x).skip(1).collect(Collectors.toList()))));;
stop
:return newConfigs;;
stop
start
note right
StringconfigMapToRedactedString(Map<String,
Object>map,ConfigDefconfigDef)
end note
if (configKey==null ||configKey.type().isSensitive()) then (yes) 
else (no)
if (value==null ) then (yes) 
else (no)
endif 
endif 
:return bld.toString();;
stop
end
@enduml

