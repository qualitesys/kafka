@startuml
!pragma layout smetana
start
note right
constructor ClientInformation(String softwareName,
String softwareVersion)
end note
:this.softwareName=softwareName.isEmpty()? UNKNOWN_NAME_OR_VERSION:softwareName;;
:this.softwareVersion=softwareVersion.isEmpty()? UNKNOWN_NAME_OR_VERSION:softwareVersion;;
end
start
note right
String softwareName()
end note
:return this.softwareName;;
stop
end
start
note right
String softwareVersion()
end note
:return this.softwareVersion;;
stop
end
start
note right
String toString()
end note
:return "ClientInformation(softwareName="+
softwareName+", softwareVersion="+softwareVersion+
")";;
stop
end
start
note right
