@startuml
!pragma layout smetana
start
note right
constructor ClientInformation(StringsoftwareName,StringsoftwareVersion)
end note
:this.softwareName=softwareName.isEmpty()? UNKNOWN_NAME_OR_VERSION:softwareName;
:this.softwareVersion=softwareVersion.isEmpty()? UNKNOWN_NAME_OR_VERSION:softwareVersion;
end
start
note right
StringsoftwareName()
end note
:return this.softwareName;;
stop
end
start
note right
StringsoftwareVersion()
end note
:return this.softwareVersion;;
stop
end
start
note right
StringtoString()
end note
:return "ClientInformation(softwareName="+softwareName+", softwareVersion="+softwareVersion+")";;
stop
end
start
note right
inthashCode()
end note
:return Objects.hash(softwareName,softwareVersion);;
stop
end
start
note right
booleanequals(Objecto)
end note
if (o==null ) then (yes) 
:return false;;
stop
endif 
if (!(o instanceof ClientInformation)) then (yes) 
:return false;;
stop
endif 
:return other.softwareName.equals(softwareName)&&other.softwareVersion.equals(softwareVersion);;
stop
end
@enduml

