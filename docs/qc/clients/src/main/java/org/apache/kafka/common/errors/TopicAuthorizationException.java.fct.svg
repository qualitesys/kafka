@startuml
!pragma layout smetana
start
note right
constructor TopicAuthorizationException(Stringmessage,Set<String>unauthorizedTopics)
end note
:super (message);
:this.unauthorizedTopics=unauthorizedTopics;
end
start
note right
constructor TopicAuthorizationException(Set<String>unauthorizedTopics)
end note
:this("Not authorized to access topics: "+
unauthorizedTopics,unauthorizedTopics);
end
start
note right
constructor TopicAuthorizationException(Stringmessage)
end note
:this(message,Collections.emptySet());
end
start
note right
Set<String>unauthorizedTopics()
end note
:return unauthorizedTopics;;
stop
end
@enduml

