th:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="15" x="146.5" y="570.5581">try</text><line style="stroke:#181818;stroke-width:1.0;" x1="580" x2="715" y1="542.9453" y2="542.9453"/><line style="stroke:#181818;stroke-width:1.0;" x1="715" x2="715" y1="542.9453" y2="590.5547"/><polygon fill="#181818" points="711,580.5547,715,590.5547,719,580.5547,715,584.5547" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="231" x="715" y="570.5581">catch (UnsupportedEncodingException e)</text><line style="stroke:#181818;stroke-width:1.0;" x1="527" x2="527" y1="508.3789" y2="530.9453"/><polygon fill="#181818" points="523,520.9453,527,530.9453,531,520.9453,527,524.9453" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[3008ad66003de12511fc428e2ccffaa7]
@startuml
!pragma layout smetana
start
note right
void configure(Map<String,?> configs,boolean isKey)
end note
:String propertyName=isKey? String.valueOf("key.serializer.encoding"):String.valueOf("value.serializer.encoding");;
:Object encodingValue=configs.get(propertyName);;
if (encodingValue==null ) then (yes) 
:encodingValue=configs.get("serializer.encoding");;
endif 
if (encodingValue instanceof String ) then (yes) 
:encoding=(String )encodingValue;;
endif 
end
start
note right
byte[] serialize(String topic,String data)
end note
switch (try/catch block)
case (try)
if (data==null ) then (yes) 
:return null ;;
stop
else (no)
:return data.getBytes(encoding);;
stop
endif 
case (catch (UnsupportedEncodingException e))
:throw new SerializationException("Error when serializing string to byte[] due to unsupported encoding "+
encoding);;
stop
endswitch
end
@enduml

