on fill="#181818" points="378.5,413.0078,382.5,423.0078,386.5,413.0078,382.5,417.0078" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="382.5" x2="382.5" y1="576.9453" y2="596.9453"/><polygon fill="#181818" points="378.5,586.9453,382.5,596.9453,386.5,586.9453,382.5,590.9453" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[4b15f4d0ed5d510cd0d0d89df4c92d2f]
@startuml
!pragma layout smetana
start
note right
void configure(Map<String,? >configs,booleanisKey)
end note
if (encodingValue==null ) then (yes) 
:encodingValue=configs.get("serializer.encoding");
endif 
if (encodingValue instanceof String) then (yes) 
:encoding=(String)encodingValue;
endif 
end
start
note right
byte[]serialize(Stringtopic,Stringdata)
end note
if (data==null ) then (yes) 
:return null ;;
stop
else (no)
:return data.getBytes(encoding);;
stop
endif 
:throw new SerializationException("Error when serializing string to byte[] due to unsupported encoding "+encoding);;
end
@enduml

