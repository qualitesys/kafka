@startuml
!pragma layout smetana
start
note right
void configure(Map<String,? >configs,booleanisKey)
end note
if (encodingValue==null ) then (yes) 
:encodingValue=configs.get("serializer.encoding");;
endif 
if (encodingValue instanceof String) then (yes) 
:encoding=(String)encodingValue;;
endif 
end
start
note right
byte[]serialize(Stringtopic,Stringdata)
end note
:try {if (data==null )return null ;else return data.getBytes(encoding);
:}catch (UnsupportedEncodingExceptione){throw new SerializationException("Error when serializing string to byte[] due to unsupported encoding "+
encoding);};
end
@enduml

