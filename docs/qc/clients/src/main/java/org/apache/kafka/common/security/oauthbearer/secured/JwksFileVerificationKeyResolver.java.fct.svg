 y2="473.2734"/><polygon fill="#181818" points="285.5,469.2734,275.5,473.2734,285.5,477.2734,281.5,473.2734" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="263.5" x2="263.5" y1="398.707" y2="421.2734"/><polygon fill="#181818" points="259.5,411.2734,263.5,421.2734,267.5,411.2734,263.5,415.2734" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="263.5" x2="263.5" y1="485.2734" y2="505.2734"/><polygon fill="#181818" points="259.5,495.2734,263.5,505.2734,267.5,495.2734,263.5,499.2734" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="263.5" x2="263.5" y1="539.2422" y2="559.2422"/><polygon fill="#181818" points="259.5,549.2422,263.5,559.2422,267.5,549.2422,263.5,553.2422" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[6dd65a245c81bd169530eb4b5928dca0]
@startuml
!pragma layout smetana
start
note right
constructor JwksFileVerificationKeyResolver(PathjwksFile)
end note
:this.jwksFile=jwksFile;
end
start
note right
void init()
end note
:log.debug("Starting creation of new VerificationKeyResolver from {}",jwksFile);
:jwks=new JsonWebKeySet(json);
:delegate=new JwksVerificationKeyResolver(jwks.getJsonWebKeys());
end
start
note right
KeyresolveKey(JsonWebSignaturejws,List<JsonWebStructure>nestingContext)
end note
if (delegate==null ) then (yes) 
endif 
:return delegate.resolveKey(jws,nestingContext);;
stop
end
@enduml

