.5,839.0977,263.5,849.0977,267.5,839.0977,263.5,843.0977" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="263.5" x2="263.5" y1="716.7578" y2="741.1602"/><polygon fill="#181818" points="259.5,731.1602,263.5,741.1602,267.5,731.1602,263.5,735.1602" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="321" x2="526" y1="704.7578" y2="704.7578"/><polygon fill="#181818" points="522,793.1289,526,803.1289,530,793.1289,526,797.1289" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="526" x2="526" y1="704.7578" y2="893.0977"/><line style="stroke:#181818;stroke-width:1.0;" x1="526" x2="263.5" y1="893.0977" y2="893.0977"/><line style="stroke:#181818;stroke-width:1.0;" x1="263.5" x2="263.5" y1="893.0977" y2="913.0977"/><polygon fill="#181818" points="259.5,903.0977,263.5,913.0977,267.5,903.0977,263.5,907.0977" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="263.5" x2="263.5" y1="670.1914" y2="692.7578"/><polygon fill="#181818" points="259.5,682.7578,263.5,692.7578,267.5,682.7578,263.5,686.7578" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="263.5" x2="263.5" y1="947.0664" y2="967.0664"/><polygon fill="#181818" points="259.5,957.0664,263.5,967.0664,267.5,957.0664,263.5,961.0664" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[1317cdbcd14f952cbd03e027c0ff3bf0]
@startuml
!pragma layout smetana
start
note right
constructor JwksFileVerificationKeyResolver(Path jwksFile)
end note
:this.jwksFile=jwksFile;;
end
start
note right
void init()
end note
:log.debug("Starting creation of new VerificationKeyResolver from {}",
jwksFile);;
:String json=Utils.readFileAsString(jwksFile.toFile()
.getPath());;
:JsonWebKeySet jwks;;
switch (try/catch block)
case (try)
:jwks=new JsonWebKeySet(json);;
case (catch (JoseException e))
:throw new IOException(e);;
stop
endswitch
:delegate=new JwksVerificationKeyResolver(jwks.getJsonWebKeys());;
end
start
note right
Key resolveKey(JsonWebSignature jws,List<JsonWebStructure> nestingContext)
end note
if (delegate==null ) then (yes) 
:throw new UnresolvableKeyException("VerificationKeyResolver delegate is null;
: please call init() first");;
stop
endif 
:return delegate.resolveKey(jws,nestingContext);;
stop
end
@enduml

