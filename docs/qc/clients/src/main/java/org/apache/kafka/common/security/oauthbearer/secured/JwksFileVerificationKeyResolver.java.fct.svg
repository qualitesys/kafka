@startuml
!pragma layout smetana
start
note right
constructor JwksFileVerificationKeyResolver(PathjwksFile)
end note
:this.jwksFile=jwksFile;;
end
start
note right
void init()
end note
:log.debug("Starting creation of new VerificationKeyResolver from {}",
jwksFile);;
:try {jwks=new JsonWebKeySet(json);}catch (JoseExceptione){throw new IOException(e);};
:delegate=new JwksVerificationKeyResolver(jwks.getJsonWebKeys());;
end
start
note right
KeyresolveKey(JsonWebSignaturejws,List<JsonWebStructure>nestingContext)
end note
if (delegate==null ) then (yes) 
:throw new UnresolvableKeyException("VerificationKeyResolver delegate is null;
: please call init() first");;
stop
endif 
:return delegate.resolveKey(jws,nestingContext);;
stop
end
@enduml

