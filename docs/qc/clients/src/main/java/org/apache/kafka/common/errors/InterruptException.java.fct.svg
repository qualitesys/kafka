@startuml
!pragma layout smetana
start
note right
constructor InterruptException(InterruptedException cause)
end note
:super (cause);;
:Thread.currentThread().interrupt();;
end
start
note right
constructor InterruptException(String message,
InterruptedException cause)
end note
:super (message,cause);;
:Thread.currentThread().interrupt();;
end
start
note right
constructor InterruptException(String message)
end note
:super (message,new InterruptedException());;
:Thread.currentThread().interrupt();;
end
@enduml

