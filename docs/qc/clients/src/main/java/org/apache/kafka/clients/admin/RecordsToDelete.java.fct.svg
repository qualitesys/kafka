@startuml
!pragma layout smetana
start
note right
constructor RecordsToDelete(longoffset)
end note
:this.offset=offset;;
end
start
note right
RecordsToDeletebeforeOffset(longoffset)
end note
:return new RecordsToDelete(offset);;
stop
end
start
note right
longbeforeOffset()
end note
:return offset;;
stop
end
start
note right
booleanequals(Objecto)
end note
if (this==o) then (yes) 
:return true;;
stop
endif 
if (o==null ||getClass()!=o.getClass()) then (yes) 
:return false;;
stop
endif 
:return this.offset==that.offset;;
stop
end
start
note right
inthashCode()
end note
:return (int)offset;;
stop
end
start
note right
StringtoString()
end note
:return "(beforeOffset = "+offset+")";;
stop
end
@enduml

