@startuml
!pragma layout smetana
start
note right
void buildUserClientQuotaConfigDef(ConfigDefconfigDef)
end note
:configDef.define(PRODUCER_BYTE_RATE_OVERRIDE_CONFIG,
ConfigDef.Type.LONG,Long.MAX_VALUE,ConfigDef.Importance.MEDIUM,
PRODUCER_BYTE_RATE_DOC);;
:configDef.define(CONSUMER_BYTE_RATE_OVERRIDE_CONFIG,
ConfigDef.Type.LONG,Long.MAX_VALUE,ConfigDef.Importance.MEDIUM,
CONSUMER_BYTE_RATE_DOC);;
:configDef.define(REQUEST_PERCENTAGE_OVERRIDE_CONFIG,
ConfigDef.Type.DOUBLE,Integer.valueOf(Integer.MAX_VALUE).doubleValue(),
ConfigDef.Importance.MEDIUM,REQUEST_PERCENTAGE_DOC);;
:configDef.define(CONTROLLER_MUTATION_RATE_OVERRIDE_CONFIG,
ConfigDef.Type.DOUBLE,Integer.valueOf(Integer.MAX_VALUE).doubleValue(),
ConfigDef.Importance.MEDIUM,CONTROLLER_MUTATION_RATE_DOC);;
end
start
note right
booleanisClientOrUserConfig(Stringname)
end note
:return userClientConfigNames.contains(name);;
stop
end
start
note right
ConfigDefuserConfigs()
end note
:ConfigDefconfigDef=new ConfigDef();;
:ScramMechanism.mechanismNames().forEach(mechanismName->{configDef.define(mechanismName,ConfigDef.Type.STRING,null ,ConfigDef.Importance.MEDIUM,"User credentials for SCRAM mechanism "+
mechanismName);});;
:buildUserClientQuotaConfigDef(configDef);;
:return configDef;;
stop
end
