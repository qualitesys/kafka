,647.2109,286.5,657.2109,290.5,647.2109,286.5,651.2109" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[6951c2712536805b1c6aa0b93a227138]
@startuml
!pragma layout smetana
start
note right
Stringsanitize(Stringname)
end note
:encoded=URLEncoder.encode(name,StandardCharsets.UTF_8.name());
:i++;
if (c=='*') then (yes) 
:builder.append("%2A");
else (no)
:builder.append(c);
endif 
:return builder.toString();;
stop
end
start
note right
Stringdesanitize(Stringname)
end note
:return URLDecoder.decode(name,StandardCharsets.UTF_8.name());;
stop
end
start
note right
StringjmxSanitize(Stringname)
end note
:return MBEAN_PATTERN.matcher(name).matches()? name:ObjectName.quote(name);;
stop
end
@enduml

