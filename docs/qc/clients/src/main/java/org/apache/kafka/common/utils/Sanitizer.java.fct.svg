e-width:1.0;"/><!--MD5=[409f69ecd9a5231e61425646e90a1f84]
@startuml
!pragma layout smetana
start
note right
Stringsanitize(Stringname)
end note
:Stringencoded="";;
:try ;
:encoded=URLEncoder.encode(name,StandardCharsets.UTF_8.name());;
:StringBuilderbuilder=new StringBuilder();;
:charc=encoded.charAt(i);;
if (c=='*') then (yes) 
:builder.append("%2A");;
else if (c=='+') then (yes) 
:builder.append("%20");;
else (no)
:builder.append(c);;
endif 
:return builder.toString();;
stop
:catch (UnsupportedEncodingExceptione);
:throw new KafkaException(e);;
stop
end
start
note right
Stringdesanitize(Stringname)
end note
:try ;
:return URLDecoder.decode(name,StandardCharsets.UTF_8.name());;
stop
:catch (UnsupportedEncodingExceptione);
:throw new KafkaException(e);;
stop
end
start
note right
StringjmxSanitize(Stringname)
end note
:return MBEAN_PATTERN.matcher(name).matches()? name:ObjectName.quote(name);;
stop
end
@enduml

