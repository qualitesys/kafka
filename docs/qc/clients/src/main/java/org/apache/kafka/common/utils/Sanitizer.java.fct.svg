"843.2031"/><polygon fill="#181818" points="437.75,833.2031,441.75,843.2031,445.75,833.2031,441.75,837.2031" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="441.75" x2="441.75" y1="877.1719" y2="897.1719"/><polygon fill="#181818" points="437.75,887.1719,441.75,897.1719,445.75,887.1719,441.75,891.1719" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[2ca322d2757abcc3653157ae5c3fefa9]
@startuml
!pragma layout smetana
start
note right
String sanitize(String name)
end note
:String encoded="";;
switch (try/catch block)
case (try)
:encoded=URLEncoder.encode(name,StandardCharsets.UTF_8.name());;
:StringBuilder builder=new StringBuilder();;
:char c=encoded.charAt(i);;
if (c=='*') then (yes) 
:builder.append("%2A");;
else if (c=='+') then (yes) 
:builder.append("%20");;
else (no)
:builder.append(c);;
endif 
:return builder.toString();;
stop
case (catch (UnsupportedEncodingException e))
:throw new KafkaException(e);;
stop
endswitch
end
start
note right
String desanitize(String name)
end note
switch (try/catch block)
case (try)
:return URLDecoder.decode(name,StandardCharsets.UTF_8.name());;
stop
case (catch (UnsupportedEncodingException e))
:throw new KafkaException(e);;
stop
endswitch
end
start
note right
String jmxSanitize(String name)
end note
:return MBEAN_PATTERN.matcher(name).matches()? name:ObjectName.quote(name);;
stop
end
@enduml

