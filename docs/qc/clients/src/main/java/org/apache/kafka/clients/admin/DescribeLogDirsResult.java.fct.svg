@startuml
!pragma layout smetana
start
note right
constructor DescribeLogDirsResult(Map<Integer,KafkaFuture<Map<String,LogDirDescription>>>futures)
end note
:this.futures=futures;
end
start
note right
Map<Integer,KafkaFuture<Map<String,DescribeLogDirsResponse.LogDirInfo>>>values()
end note
:return descriptions().entrySet().stream().collect(Collectors.toMap(Map.Entry::getKey,entry->entry.getValue().thenApply(map->convertMapValues(map))));;
stop
end
start
note right
Map<String,DescribeLogDirsResponse.LogDirInfo>convertMapValues(Map<String,LogDirDescription>map)
end note
:return stream.collect(Collectors.toMap(Map.Entry::getKey,infoEntry->{LogDirDescriptionlogDir=infoEntry.getValue();return new DescribeLogDirsResponse.LogDirInfo(logDir.error()==null ? Errors.NONE:Errors.forException(logDir.error()),logDir.replicaInfos().entrySet().stream().collect(Collectors.toMap(Map.Entry::getKey,replicaEntry->new DescribeLogDirsResponse.ReplicaInfo(replicaEntry.getValue().size(),replicaEntry.getValue().offsetLag(),replicaEntry.getValue().isFuture()))));}));;
stop
end
start
note right
Map<Integer,KafkaFuture<Map<String,LogDirDescription>>>descriptions()
end note
:return futures;;
stop
end
start
note right
KafkaFuture<Map<Integer,Map<String,DescribeLogDirsResponse.LogDirInfo>>>all()
end note
:return allDescriptions().thenApply(map->map.entrySet().stream().collect(Collectors.toMap(entry->entry.getKey(),entry->convertMapValues(entry.getValue()))));;
stop
end
start
note right
KafkaFuture<Map<Integer,Map<String,LogDirDescription>>>allDescriptions()
end note
:return KafkaFuture.allOf(futures.values().toArray(new KafkaFuture[0])).thenApply(v->{Map<Integer,Map<String,LogDirDescription>>descriptions=new HashMap<>(futures.size());for (Map.Entry<Integer,KafkaFuture<Map<String,LogDirDescription>>>entry:futures.entrySet()){try {descriptions.put(entry.getKey(),entry.getValue().get());}catch (InterruptedException|ExecutionExceptione){throw new RuntimeException(e);}}return descriptions;});;
stop
end
@enduml

