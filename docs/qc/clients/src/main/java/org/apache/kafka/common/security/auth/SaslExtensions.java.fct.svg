end note
:this.extensionsMap=Collections.unmodifiableMap(new HashMap<>(extensionsMap));
end
start
note right
Map<String,String>map()
end note
:return extensionsMap;;
stop
end
start
note right
booleanequals(Objecto)
end note
if (this==o) then (yes) 
:return true;;
stop
endif 
if (o==null ||getClass()!=o.getClass()) then (yes) 
:return false;;
stop
endif 
:return extensionsMap.equals(((SaslExtensions)o).extensionsMap);;
stop
end
start
note right
StringtoString()
end note
:return extensionsMap.toString();;
stop
end
start
note right
inthashCode()
end note
:return extensionsMap.hashCode();;
stop
end
