"/><!--MD5=[0eb2679d600c8b2b20cbba4a357dd8f9]
@startuml
!pragma layout smetana
start
note right
constructor PartitionComparator(Map<String,
List<String>> map)
end note
:this.map=map;;
end
start
note right
int compare(TopicPartition o1,TopicPartition o2)
end note
:int ret=map.get(o1.topic()).size()-map.get(o2.topic())
.size();;
if (ret==0) then (yes) 
:ret=o1.topic().compareTo(o2.topic());;
if (ret==0) then (yes) 
:ret=o1.partition()-o2.partition();;
endif 
endif 
:return ret;;
stop
end
start
note right
int compare(TopicPartition topicPartition1,
TopicPartition topicPartition2)
end note
:String topic1=topicPartition1.topic();;
:String topic2=topicPartition2.topic();;
if (topic1.equals(topic2)) then (yes) 
:return topicPartition1.partition()-topicPartition2.partition();;
stop
else (no)
:return topic1.compareTo(topic2);;
stop
endif 
end
@enduml

