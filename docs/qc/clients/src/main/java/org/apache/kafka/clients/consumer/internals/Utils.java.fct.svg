@startuml
!pragma layout smetana
start
note right
constructor PartitionComparator(Map<String,List<String>>map)
end note
:this.map=map;
end
start
note right
intcompare(TopicPartitiono1,TopicPartitiono2)
end note
if (ret==0) then (yes) 
:ret=o1.topic().compareTo(o2.topic());
if (ret==0) then (yes) 
:ret=o1.partition()-o2.partition();
endif 
endif 
:return ret;;
stop
end
start
note right
intcompare(TopicPartitiontopicPartition1,TopicPartitiontopicPartition2)
end note
if (topic1.equals(topic2)) then (yes) 
:return topicPartition1.partition()-topicPartition2.partition();;
stop
else (no)
:return topic1.compareTo(topic2);;
stop
endif 
end
@enduml

