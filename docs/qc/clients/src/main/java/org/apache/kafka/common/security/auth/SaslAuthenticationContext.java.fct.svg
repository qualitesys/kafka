@startuml
!pragma layout smetana
start
note right
constructor SaslAuthenticationContext(SaslServerserver,
SecurityProtocolsecurityProtocol,InetAddressclientAddress,
StringlistenerName)
end note
:this(server,securityProtocol,clientAddress,
listenerName,Optional.empty());;
end
start
note right
constructor SaslAuthenticationContext(SaslServerserver,
SecurityProtocolsecurityProtocol,InetAddressclientAddress,
StringlistenerName,Optional<SSLSession>sslSession)
end note
:this.server=server;;
:this.securityProtocol=securityProtocol;;
:this.clientAddress=clientAddress;;
:this.listenerName=listenerName;;
:this.sslSession=sslSession;;
end
start
note right
SaslServerserver()
end note
:return server;;
stop
end
start
note right
Optional<SSLSession>sslSession()
end note
:return sslSession;;
stop
end
start
note right
SecurityProtocolsecurityProtocol()
end note
:return securityProtocol;;
stop
end
start
note right
InetAddressclientAddress()
end note
:return clientAddress;;
stop
end
start
note right
StringlistenerName()
end note
:return listenerName;;
stop
end
@enduml

