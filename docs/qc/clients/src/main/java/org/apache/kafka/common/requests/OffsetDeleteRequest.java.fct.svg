@startuml
!pragma layout smetana
start
note right
constructor Builder(OffsetDeleteRequestDatadata)
end note
end
start
note right
OffsetDeleteRequestbuild(shortversion)
end note
:return new OffsetDeleteRequest(data,version);;
stop
end
start
note right
StringtoString()
end note
:return data.toString();;
stop
end
start
note right
constructor OffsetDeleteRequest(OffsetDeleteRequestDatadata,
shortversion)
end note
end
start
note right
AbstractResponsegetErrorResponse(intthrottleTimeMs,
Errorserror)
end note
:return new OffsetDeleteResponse(new OffsetDeleteResponseData()
.setThrottleTimeMs(throttleTimeMs).setErrorCode(error.code()));;
stop
end
start
note right
AbstractResponsegetErrorResponse(intthrottleTimeMs,
Throwablee)
end note
:return getErrorResponse(throttleTimeMs,Errors.forException(e));;
stop
end
start
note right
OffsetDeleteRequestparse(ByteBufferbuffer,
shortversion)
end note
:return new OffsetDeleteRequest(new OffsetDeleteRequestData(new ByteBufferAccessor(buffer),
version),version);;
stop
end
start
note right
OffsetDeleteRequestDatadata()
end note
:return data;;
stop
end
@enduml

