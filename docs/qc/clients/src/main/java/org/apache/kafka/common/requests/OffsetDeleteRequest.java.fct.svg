@startuml
!pragma layout smetana
start
note right
constructor Builder(OffsetDeleteRequestData data)
end note
:super (ApiKeys.OFFSET_DELETE);;
:this.data=data;;
end
start
note right
OffsetDeleteRequest build(short version)
end note
:return new OffsetDeleteRequest(data,version);;
stop
end
start
note right
String toString()
end note
:return data.toString();;
stop
end
start
note right
constructor OffsetDeleteRequest(OffsetDeleteRequestData data,
short version)
end note
:super (ApiKeys.OFFSET_DELETE,version);;
:this.data=data;;
end
start
note right
AbstractResponse getErrorResponse(int throttleTimeMs,
Errors error)
end note
:return new OffsetDeleteResponse(new OffsetDeleteResponseData()
.setThrottleTimeMs(throttleTimeMs).setErrorCode(error.code()));;
stop
end
start
note right
AbstractResponse getErrorResponse(int throttleTimeMs,
Throwable e)
end note
:return getErrorResponse(throttleTimeMs,Errors.forException(e));;
stop
end
start
note right
OffsetDeleteRequest parse(ByteBuffer buffer,
short version)
end note
:return new OffsetDeleteRequest(new OffsetDeleteRequestData(new ByteBufferAccessor(buffer),
version),version);;
stop
end
start
note right
OffsetDeleteRequestData data()
end note
:return data;;
stop
end
@enduml

