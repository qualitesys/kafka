1" y2="322.2031"/><polygon fill="#181818" points="1360.5,312.2031,1364.5,322.2031,1368.5,312.2031,1364.5,316.2031" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="1364.5" x2="1364.5" y1="406.7695" y2="429.3359"/><polygon fill="#181818" points="1360.5,419.3359,1364.5,429.3359,1368.5,419.3359,1364.5,423.3359" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="1364.5" x2="1364.5" y1="463.3047" y2="483.3047"/><polygon fill="#181818" points="1360.5,473.3047,1364.5,483.3047,1368.5,473.3047,1364.5,477.3047" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[3da1c571cd6d45ae1fab9e6fe31ede37]
@startuml
!pragma layout smetana
start
note right
constructor DescribeTransactionsResult(Map<CoordinatorKey,KafkaFuture<TransactionDescription>>futures)
end note
:this.futures=futures;
end
start
note right
KafkaFuture<TransactionDescription>description(StringtransactionalId)
end note
if (future==null ) then (yes) 
endif 
:return future;;
stop
end
start
note right
KafkaFuture<Map<String,TransactionDescription>>all()
end note
:return KafkaFuture.allOf(futures.values().toArray(new KafkaFuture[0])).thenApply(nil->{Map<String,TransactionDescription>results=new HashMap<>(futures.size());for (Map.Entry<CoordinatorKey,KafkaFuture<TransactionDescription>>entry:futures.entrySet()){try {results.put(entry.getKey().idValue,entry.getValue().get());}catch (InterruptedException|ExecutionExceptione){throw new RuntimeException(e);}}return results;});;
stop
end
@enduml

