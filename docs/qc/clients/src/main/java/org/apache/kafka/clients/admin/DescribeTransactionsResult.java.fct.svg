="361.2383" y2="381.2383"/><polygon fill="#181818" points="418,371.2383,422,381.2383,426,371.2383,422,375.2383" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="422" x2="422" y1="176.8008" y2="199.3672"/><polygon fill="#181818" points="418,189.3672,422,199.3672,426,189.3672,422,193.3672" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="422" x2="422" y1="415.207" y2="435.207"/><polygon fill="#181818" points="418,425.207,422,435.207,426,425.207,422,429.207" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="422" x2="422" y1="519.7734" y2="542.3398"/><polygon fill="#181818" points="418,532.3398,422,542.3398,426,532.3398,422,536.3398" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="422" x2="422" y1="618.2148" y2="638.2148"/><polygon fill="#181818" points="418,628.2148,422,638.2148,426,628.2148,422,632.2148" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[acc21599a3393126a1ecf2e40338f30d]
@startuml
!pragma layout smetana
start
note right
constructor DescribeTransactionsResult(Map<CoordinatorKey,
KafkaFuture<TransactionDescription>>futures)
end note
:this.futures=futures;;
end
start
note right
KafkaFuture<TransactionDescription>description(StringtransactionalId)
end note
if (future==null ) then (yes) 
:throw new IllegalArgumentException("TransactionalId "+
" "+transactionalId+"  was not included in the request");;
stop
endif 
:return future;;
stop
end
start
note right
KafkaFuture<Map<String,TransactionDescription>>all()
end note
:return KafkaFuture.allOf(futures.values().toArray(new KafkaFuture[0])).thenApply(nil->{Map<String,
TransactionDescription>results=new HashMap<>(futures.size());for (Map.Entry<CoordinatorKey,
KafkaFuture<TransactionDescription>>entry:futures.entrySet()){try {results.put(entry.getKey().idValue,
entry.getValue().get());}catch (InterruptedException|ExecutionExceptione){throw new RuntimeException(e);}}return results;});;
stop
end
@enduml

