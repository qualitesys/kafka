y1="726.1523" y2="746.1523"/><polygon fill="#181818" points="418,736.1523,422,746.1523,426,736.1523,422,740.1523" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[4d3d7082b3de5908304dd9a4b230ef4a]
@startuml
!pragma layout smetana
start
note right
constructor DescribeTransactionsResult(Map<CoordinatorKey,
KafkaFuture<TransactionDescription>>futures)
end note
:this.futures=futures;;
end
start
note right
KafkaFuture<TransactionDescription>description(StringtransactionalId)
end note
:CoordinatorKeykey=CoordinatorKey.byTransactionalId(transactionalId);;
:KafkaFuture<TransactionDescription>future=futures.get(key);;
if (future==null ) then (yes) 
:throw new IllegalArgumentException("TransactionalId "+
" "+transactionalId+"  was not included in the request");;
stop
endif 
:return future;;
stop
end
start
note right
KafkaFuture<Map<String,TransactionDescription>>all()
end note
:return KafkaFuture.allOf(futures.values().toArray(new KafkaFuture[0])).thenApply(nil->{Map<String,
TransactionDescription>results=new HashMap<>(futures.size());for (Map.Entry<CoordinatorKey,
KafkaFuture<TransactionDescription>>entry:futures.entrySet()){try {results.put(entry.getKey().idValue,
entry.getValue().get());}catch (InterruptedException|ExecutionExceptione){throw new RuntimeException(e);}}return results;});;
stop
end
@enduml

