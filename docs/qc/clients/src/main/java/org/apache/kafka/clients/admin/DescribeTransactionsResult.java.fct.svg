@startuml
!pragma layout smetana
start
note right
constructor DescribeTransactionsResult(Map<CoordinatorKey,KafkaFuture<TransactionDescription>>futures)
end note
:this.futures=futures;
end
start
note right
KafkaFuture<TransactionDescription>description(StringtransactionalId)
end note
if (future==null ) then (yes) 
:throw new IllegalArgumentException("TransactionalId "+
"`"+transactionalId+"` was not included in the request");;
endif 
:return future;;
stop
end
start
note right
KafkaFuture<Map<String,TransactionDescription>>all()
end note
:return KafkaFuture.allOf(futures.values()
.toArray(new KafkaFuture[0])).thenApply(nil->{Map<String,
TransactionDescription>results=new HashMap<>(futures.size());for (Map.Entry<CoordinatorKey,KafkaFuture<TransactionDescription>>entry:futures.entrySet()){try {results.put(entry.getKey().idValue,entry.getValue().get());}catch (InterruptedException|ExecutionExceptione){throw new RuntimeException(e);}}return results;});;
stop
end
@enduml

