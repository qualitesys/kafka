.2344,1368.5,174.2344,1364.5,178.2344" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="1364.5" x2="1364.5" y1="324.5742" y2="344.5742"/><polygon fill="#181818" points="1360.5,334.5742,1364.5,344.5742,1368.5,334.5742,1364.5,338.5742" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="1364.5" x2="1364.5" y1="378.543" y2="398.543"/><polygon fill="#181818" points="1360.5,388.543,1364.5,398.543,1368.5,388.543,1364.5,392.543" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="1364.5" x2="1364.5" y1="483.1094" y2="505.6758"/><polygon fill="#181818" points="1360.5,495.6758,1364.5,505.6758,1368.5,495.6758,1364.5,499.6758" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="1364.5" x2="1364.5" y1="539.6445" y2="559.6445"/><polygon fill="#181818" points="1360.5,549.6445,1364.5,559.6445,1368.5,549.6445,1364.5,553.6445" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[910caa1dc62eff4587ec4485b1b7898b]
@startuml
!pragma layout smetana
start
note right
constructor DescribeTransactionsResult(Map<CoordinatorKey,KafkaFuture<TransactionDescription>>futures)
end note
:this.futures=futures;
end
start
note right
KafkaFuture<TransactionDescription>description(StringtransactionalId)
end note
if (future==null ) then (yes) 
:throw new IllegalArgumentException("TransactionalId "+
"`"+transactionalId+"` was not included in the request");;
endif 
:return future;;
stop
end
start
note right
KafkaFuture<Map<String,TransactionDescription>>all()
end note
:return KafkaFuture.allOf(futures.values().toArray(new KafkaFuture[0])).thenApply(nil->{Map<String,TransactionDescription>results=new HashMap<>(futures.size());for (Map.Entry<CoordinatorKey,KafkaFuture<TransactionDescription>>entry:futures.entrySet()){try {results.put(entry.getKey().idValue,entry.getValue().get());}catch (InterruptedException|ExecutionExceptione){throw new RuntimeException(e);}}return results;});;
stop
end
@enduml

