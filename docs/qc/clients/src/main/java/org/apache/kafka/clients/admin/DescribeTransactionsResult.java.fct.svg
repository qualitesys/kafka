="stroke:#181818;stroke-width:1.0;" x1="422" x2="422" y1="176.8008" y2="199.3672"/><polygon fill="#181818" points="418,189.3672,422,199.3672,426,189.3672,422,193.3672" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="422" x2="422" y1="339.707" y2="359.707"/><polygon fill="#181818" points="418,349.707,422,359.707,426,349.707,422,353.707" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="422" x2="422" y1="393.6758" y2="413.6758"/><polygon fill="#181818" points="418,403.6758,422,413.6758,426,403.6758,422,407.6758" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="422" x2="422" y1="498.2422" y2="520.8086"/><polygon fill="#181818" points="418,510.8086,422,520.8086,426,510.8086,422,514.8086" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="422" x2="422" y1="596.6836" y2="616.6836"/><polygon fill="#181818" points="418,606.6836,422,616.6836,426,606.6836,422,610.6836" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[b26ab32530aa12e0af141a7434516620]
@startuml
!pragma layout smetana
start
note right
constructor DescribeTransactionsResult(Map<CoordinatorKey,
KafkaFuture<TransactionDescription>>futures)
end note
:this.futures=futures;
end
start
note right
KafkaFuture<TransactionDescription>description(StringtransactionalId)
end note
if (future==null ) then (yes) 
:throw new IllegalArgumentException("TransactionalId "+
"`"+transactionalId+"` was not included in the request");;
endif 
:return future;;
stop
end
start
note right
KafkaFuture<Map<String,TransactionDescription>>all()
end note
:return KafkaFuture.allOf(futures.values().toArray(new KafkaFuture[0])).thenApply(nil->{Map<String,
TransactionDescription>results=new HashMap<>(futures.size());for (Map.Entry<CoordinatorKey,
KafkaFuture<TransactionDescription>>entry:futures.entrySet()){try {results.put(entry.getKey().idValue,
entry.getValue().get());}catch (InterruptedException|ExecutionExceptione){throw new RuntimeException(e);}}return results;});;
stop
end
@enduml

