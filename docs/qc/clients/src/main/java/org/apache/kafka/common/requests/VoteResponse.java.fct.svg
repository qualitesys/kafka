@startuml
!pragma layout smetana
start
note right
constructor VoteResponse(VoteResponseDatadata)
end note
:super (ApiKeys.VOTE);
:this.data=data;
end
start
note right
VoteResponseDatasingletonResponse(ErrorstopLevelError,TopicPartitiontopicPartition,ErrorspartitionLevelError,intleaderEpoch,intleaderId,booleanvoteGranted)
end note
:return new VoteResponseData().setErrorCode(topLevelError.code())
.setTopics(Collections.singletonList(new VoteResponseData.TopicData()
.setTopicName(topicPartition.topic()).setPartitions(Collections.singletonList(new VoteResponseData.PartitionData().setErrorCode(partitionLevelError.code()).setLeaderId(leaderId).setLeaderEpoch(leaderEpoch).setVoteGranted(voteGranted)))));;
stop
end
start
note right
Map<Errors,Integer>errorCounts()
end note
:errors.put(Errors.forCode(data.errorCode()),1);
:updateErrorCounts(errors,Errors.forCode(partitionResponse.errorCode()));
:return errors;;
stop
end
start
note right
VoteResponseDatadata()
end note
:return data;;
stop
end
start
note right
intthrottleTimeMs()
end note
:return DEFAULT_THROTTLE_TIME;;
stop
end
start
note right
VoteResponseparse(ByteBufferbuffer,shortversion)
end note
:return new VoteResponse(new VoteResponseData(new ByteBufferAccessor(buffer),
version));;
stop
end
@enduml

