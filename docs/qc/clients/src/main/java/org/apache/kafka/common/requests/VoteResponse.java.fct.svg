" y1="893.6797" y2="913.6797"/><polygon fill="#181818" points="1222.5,903.6797,1226.5,913.6797,1230.5,903.6797,1226.5,907.6797" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="1226.5" x2="1226.5" y1="998.2461" y2="1020.8125"/><polygon fill="#181818" points="1222.5,1010.8125,1226.5,1020.8125,1230.5,1010.8125,1226.5,1014.8125" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="1226.5" x2="1226.5" y1="1068.75" y2="1088.75"/><polygon fill="#181818" points="1222.5,1078.75,1226.5,1088.75,1230.5,1078.75,1226.5,1082.75" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[cd25c4fe47e4ef2ed0d15bf3831d1ca7]
@startuml
!pragma layout smetana
start
note right
constructor VoteResponse(VoteResponseDatadata)
end note
:super (ApiKeys.VOTE);
:this.data=data;
end
start
note right
VoteResponseDatasingletonResponse(ErrorstopLevelError,
TopicPartitiontopicPartition,ErrorspartitionLevelError,
intleaderEpoch,intleaderId,booleanvoteGranted)
end note
:return new VoteResponseData().setErrorCode(topLevelError.code()).setTopics(Collections.singletonList(new VoteResponseData.TopicData().setTopicName(topicPartition.topic()).setPartitions(Collections.singletonList(new VoteResponseData.PartitionData().setErrorCode(partitionLevelError.code()).setLeaderId(leaderId).setLeaderEpoch(leaderEpoch).setVoteGranted(voteGranted)))));;
stop
end
start
note right
Map<Errors,Integer>errorCounts()
end note
:errors.put(Errors.forCode(data.errorCode()),1);
:updateErrorCounts(errors,Errors.forCode(partitionResponse.errorCode()));
:return errors;;
stop
end
start
note right
VoteResponseDatadata()
end note
:return data;;
stop
end
start
note right
intthrottleTimeMs()
end note
:return DEFAULT_THROTTLE_TIME;;
stop
end
start
note right
VoteResponseparse(ByteBufferbuffer,shortversion)
end note
:return new VoteResponse(new VoteResponseData(new ByteBufferAccessor(buffer),
version));;
stop
end
@enduml

