@startuml
!pragma layout smetana
start
note right
constructor VoteResponse(VoteResponseData data)
end note
:super (ApiKeys.VOTE);;
:this.data=data;;
end
start
note right
VoteResponseData singletonResponse(Errors topLevelError,
TopicPartition topicPartition,Errors partitionLevelError,
int leaderEpoch,int leaderId,boolean voteGranted)
end note
:return new VoteResponseData().setErrorCode(topLevelError.code())
.setTopics(Collections.singletonList(new VoteResponseData.TopicData().setTopicName(topicPartition.topic()).setPartitions(Collections.singletonList(new VoteResponseData.PartitionData().setErrorCode(partitionLevelError.code()).setLeaderId(leaderId).setLeaderEpoch(leaderEpoch).setVoteGranted(voteGranted)))));;
stop
end
start
note right
Map<Errors,Integer> errorCounts()
end note
:Map<Errors,Integer> errors=new HashMap<>();;
:errors.put(Errors.forCode(data.errorCode()),1);;
:updateErrorCounts(errors,Errors.forCode(partitionResponse.errorCode()));;
:return errors;;
stop
end
start
note right
VoteResponseData data()
end note
:return data;;
stop
end
start
note right
int throttleTimeMs()
end note
:return DEFAULT_THROTTLE_TIME;;
stop
end
start
note right
VoteResponse parse(ByteBuffer buffer,short version)
end note
:return new VoteResponse(new VoteResponseData(new ByteBufferAccessor(buffer),
version));;
stop
end
@enduml

