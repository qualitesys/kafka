start
note right
booleanmaybeBeginClientReauthentication(Supplier<Long>nowNanosSupplier)
end note
if (!ready()) then (yes) 
:throw new IllegalStateException("KafkaChannel should always be \"ready\" when it is checked for possible re-authentication");;
