stop
end
start
note right
void handleChannelMuteEvent(ChannelMuteEventevent)
end note
:booleanstateChanged=false;;
switch (switch (event))
endswith
if (!stateChanged) then (yes) 
:throw new IllegalStateException("Cannot transition from "+
muteState.name()+" for "+event.name());;
stop
endif 
