intmaxReceiveSize,MemoryPoolmemoryPool,ChannelMetadataRegistrymetadataRegistry)
end note
:this.id=id;;
:this.transportLayer=transportLayer;;
:this.authenticatorCreator=authenticatorCreator;;
:this.authenticator=authenticatorCreator.get();;
:this.networkThreadTimeNanos=0L;;
:this.maxReceiveSize=maxReceiveSize;;
:this.memoryPool=memoryPool;;
:this.metadataRegistry=metadataRegistry;;
:this.disconnected=false;;
:this.muteState=ChannelMuteState.NOT_MUTED;;
:this.state=ChannelState.NOT_CONNECTED;;
end
start
note right
void close()
end note
:this.disconnected=true;;
:Utils.closeAll(transportLayer,authenticator,
receive,metadataRegistry);;
end
start
note right
KafkaPrincipalprincipal()
end note
:return authenticator.principal();;
stop
end
start
note right
Optional<KafkaPrincipalSerde>principalSerde()
end note
:return authenticator.principalSerde();;
stop
end
start
note right
void prepare()
end note
:booleanauthenticating=false;;
:try ;
if (!transportLayer.ready()) then (yes) 
:transportLayer.handshake();;
endif 
if (transportLayer.ready()&&!authenticator.complete()) then (yes) 
:authenticating=true;;
:authenticator.authenticate();;
endif 
:catch (AuthenticationExceptione);
:StringremoteDesc=remoteAddress!=null ? remoteAddress.toString():null ;;
:state=new ChannelState(ChannelState.State.AUTHENTICATION_FAILED,
e,remoteDesc);;
if (authenticating) then (yes) 
:delayCloseOnAuthenticationFailure();;
:throw new DelayedResponseAuthenticationException(e);;
stop
endif 
:throw e;;
stop
if (ready()) then (yes) 
:++successfulAuthentications;;
:state=ChannelState.READY;;
endif 
end
start
note right
void disconnect()
end note
:disconnected=true;;
if (state==ChannelState.NOT_CONNECTED&&remoteAddress!=null ) then (yes) 
:state=new ChannelState(ChannelState.State.NOT_CONNECTED,
remoteAddress.toString());;
endif 
:transportLayer.disconnect();;
end
start
note right
void state(ChannelStatestate)
end note
:this.state=state;;
end
start
note right
ChannelStatestate()
end note
:return this.state;;
stop
end
start
note right
booleanfinishConnect()
end note
:SocketChannelsocketChannel=transportLayer.socketChannel();;
if (socketChannel!=null ) then (yes) 
:remoteAddress=socketChannel.getRemoteAddress();;
endif 
:booleanconnected=transportLayer.finishConnect();;
if (connected) then (yes) 
if (ready()) then (yes) 
:state=ChannelState.READY;;
else if (remoteAddress!=null ) then (yes) 
:state=new ChannelState(ChannelState.State.AUTHENTICATE,
remoteAddress.toString());;
else (no)
:state=ChannelState.AUTHENTICATE;;
endif 
endif 
:return connected;;
stop
end
start
note right
booleanisConnected()
end note
:return transportLayer.isConnected();;
stop
end
start
note right
Stringid()
end note
:return id;;
stop
end
start
note right
SelectionKeyselectionKey()
end note
:return transportLayer.selectionKey();;
stop
end
start
note right
void mute()
end note
if (muteState==ChannelMuteState.NOT_MUTED) then (yes) 
if (!disconnected) then (yes) 
:transportLayer.removeInterestOps(SelectionKey.OP_READ);;
endif 
:muteState=ChannelMuteState.MUTED;;
endif 
end
start
note right
booleanmaybeUnmute()
end note
if (muteState==ChannelMuteState.MUTED) then (yes) 
if (!disconnected) then (yes) 
:transportLayer.addInterestOps(SelectionKey.OP_READ);;
endif 
:muteState=ChannelMuteState.NOT_MUTED;;
endif 
