note right
NetworkSendmaybeCompleteSend()
end note
if (send!=null &&send.completed()) then (yes) 
:midWrite=false;;
:transportLayer.removeInterestOps(SelectionKey.OP_WRITE);;
:NetworkSendresult=send;;
:send=null ;;
:return result;;
stop
