:transportLayer.removeInterestOps(SelectionKey.OP_WRITE);;
end
start
note right
void completeCloseOnAuthenticationFailure()
end note
:transportLayer.addInterestOps(SelectionKey.OP_WRITE);;
:authenticator.handleAuthenticationFailure();;
