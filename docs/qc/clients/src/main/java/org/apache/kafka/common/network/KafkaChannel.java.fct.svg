start
note right
booleanmaybeBeginServerReauthentication(NetworkReceivesaslHandshakeNetworkReceive,
Supplier<Long>nowNanosSupplier)
end note
if (!ready()) then (yes) 
:throw new IllegalStateException("KafkaChannel should be \"ready\" when processing SASL Handshake for potential re-authentication");;
stop
