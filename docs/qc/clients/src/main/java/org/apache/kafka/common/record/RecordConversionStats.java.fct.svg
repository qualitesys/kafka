@startuml
!pragma layout smetana
start
note right
constructor RecordConversionStats(long temporaryMemoryBytes,
int numRecordsConverted,long conversionTimeNanos)
end note
:this.temporaryMemoryBytes=temporaryMemoryBytes;;
:this.numRecordsConverted=numRecordsConverted;;
:this.conversionTimeNanos=conversionTimeNanos;;
end
start
note right
constructor RecordConversionStats()
end note
:this(0,0,0);;
end
start
note right
void add(RecordConversionStats stats)
end note
:temporaryMemoryBytes+=stats.temporaryMemoryBytes;;
:numRecordsConverted+=stats.numRecordsConverted;;
:conversionTimeNanos+=stats.conversionTimeNanos;;
end
start
note right
long temporaryMemoryBytes()
end note
:return temporaryMemoryBytes;;
stop
end
start
note right
int numRecordsConverted()
end note
:return numRecordsConverted;;
stop
end
start
note right
long conversionTimeNanos()
end note
:return conversionTimeNanos;;
stop
end
start
note right
String toString()
end note
:return String.format("RecordConversionStats(temporaryMemoryBytes=%d,
 numRecordsConverted=%d, conversionTimeNanos=%d)",
temporaryMemoryBytes,numRecordsConverted,
conversionTimeNanos);;
stop
end
@enduml

