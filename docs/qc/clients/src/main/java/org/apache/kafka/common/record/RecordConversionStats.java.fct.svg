@startuml
!pragma layout smetana
start
note right
constructor RecordConversionStats(longtemporaryMemoryBytes,
intnumRecordsConverted,longconversionTimeNanos)
end note
end
start
note right
constructor RecordConversionStats()
end note
end
start
note right
void add(RecordConversionStatsstats)
end note
end
start
note right
longtemporaryMemoryBytes()
end note
:return temporaryMemoryBytes;;
stop
end
start
note right
intnumRecordsConverted()
end note
:return numRecordsConverted;;
stop
end
start
note right
longconversionTimeNanos()
end note
:return conversionTimeNanos;;
stop
end
start
note right
StringtoString()
end note
:return String.format("RecordConversionStats(temporaryMemoryBytes=%d,
