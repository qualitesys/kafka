@startuml
!pragma layout smetana
start
note right
constructor NoOffsetForPartitionException(TopicPartitionpartition)
end note
:super ("Undefined offset with no reset policy for partition: "+
partition);
:this.partitions=Collections.singleton(partition);
end
start
note right
constructor NoOffsetForPartitionException(Collection<TopicPartition>partitions)
end note
:super ("Undefined offset with no reset policy for partitions: "+
partitions);
:this.partitions=Collections.unmodifiableSet(new HashSet<>(partitions));
end
start
note right
Set<TopicPartition>partitions()
end note
:return partitions;;
stop
end
@enduml

