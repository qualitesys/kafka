@startuml
!pragma layout smetana
start
note right
constructor SupportedVersionRange(final shortminVersion,final shortmaxVersion)
end note
if (minVersion<1||maxVersion<1||maxVersion<minVersion) then (yes) 
endif 
:this.minVersion=minVersion;
:this.maxVersion=maxVersion;
end
start
note right
shortminVersion()
end note
:return minVersion;;
stop
end
start
note right
shortmaxVersion()
end note
:return maxVersion;;
stop
end
start
note right
booleanequals(Objectother)
end note
if (this==other) then (yes) 
:return true;;
