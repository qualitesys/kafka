@startuml
!pragma layout smetana
start
note right
constructor SupportedVersionRange(final shortminVersion,
final shortmaxVersion)
end note
if (minVersion<1||maxVersion<1||maxVersion<minVersion) then (yes) 
:throw new IllegalArgumentException(String.format("Expected 1 <= minVersion <= maxVersion but received minVersion:%d,
 maxVersion:%d.",minVersion,maxVersion));;
endif 
end
start
note right
shortminVersion()
end note
:return minVersion;;
stop
end
start
note right
shortmaxVersion()
end note
:return maxVersion;;
stop
end
start
note right
booleanequals(Objectother)
end note
if (this==other) then (yes) 
:return true;;
stop
endif 
if (other==null ||getClass()!=other.getClass()) then (yes) 
:return false;;
stop
endif 
:return this.minVersion==that.minVersion&&this.maxVersion==that.maxVersion;;
stop
end
start
note right
inthashCode()
end note
:return Objects.hash(minVersion,maxVersion);;
stop
end
start
note right
StringtoString()
end note
:return String.format("SupportedVersionRange[min_version:%d,
 max_version:%d]",minVersion,maxVersion);;
stop
end
@enduml

