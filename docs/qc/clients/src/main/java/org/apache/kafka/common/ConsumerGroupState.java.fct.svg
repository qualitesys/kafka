@startuml
!pragma layout smetana
start
note right
constructor ConsumerGroupState(Stringname)
end note
:this.name=name;;
end
start
note right
ConsumerGroupStateparse(Stringname)
end note
:ConsumerGroupStatestate=NAME_TO_ENUM.get(name);;
:return state==null ? UNKNOWN:state;;
stop
end
start
note right
StringtoString()
end note
:return name;;
stop
end
@enduml

