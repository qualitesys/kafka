@startuml
!pragma layout smetana
start
note right
constructor ConsumerGroupState(String name)
end note
:this.name=name;;
end
start
note right
ConsumerGroupState parse(String name)
end note
:ConsumerGroupState state=NAME_TO_ENUM.get(name);;
:return state==null ? UNKNOWN:state;;
stop
end
start
note right
String toString()
end note
:return name;;
stop
end
@enduml

