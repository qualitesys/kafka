442.5,874.4258,446.5,864.4258,442.5,868.4258" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="442.5" x2="442.5" y1="908.3945" y2="928.3945"/><polygon fill="#181818" points="438.5,918.3945,442.5,928.3945,446.5,918.3945,442.5,922.3945" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="442.5" x2="442.5" y1="962.3633" y2="982.3633"/><polygon fill="#181818" points="438.5,972.3633,442.5,982.3633,446.5,972.3633,442.5,976.3633" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[1eaffc383b8eeeba57c2e68516dda98f]
@startuml
!pragma layout smetana
start
note right
ScramMechanismfromType(bytetype)
end note
if (scramMechanism.type==type) then (yes) 
:return scramMechanism;;
stop
endif 
:return UNKNOWN;;
stop
end
start
note right
ScramMechanismfromMechanismName(StringmechanismName)
end note
:return Arrays.stream(VALUES).filter(mechanism->mechanism.mechanismName.equals(mechanismName)).findFirst().orElse(UNKNOWN);;
stop
end
start
note right
StringmechanismName()
end note
:return this.mechanismName;;
stop
end
start
note right
bytetype()
end note
:return this.type;;
stop
end
start
note right
constructor ScramMechanism(bytetype)
end note
:this.type=type;
:this.mechanismName=toString().replace('_','-');
end
@enduml

