@startuml
!pragma layout smetana
start
note right
ScramMechanismfromType(bytetype)
end note
if (scramMechanism.type==type) then (yes) 
:return scramMechanism;;
stop
endif 
:return UNKNOWN;;
stop
end
start
note right
ScramMechanismfromMechanismName(StringmechanismName)
end note
:return Arrays.stream(VALUES).filter(mechanism->mechanism.mechanismName.equals(mechanismName))
.findFirst().orElse(UNKNOWN);;
stop
end
start
note right
StringmechanismName()
end note
:return this.mechanismName;;
stop
end
start
note right
bytetype()
end note
:return this.type;;
stop
end
start
note right
constructor ScramMechanism(bytetype)
end note
end
@enduml

