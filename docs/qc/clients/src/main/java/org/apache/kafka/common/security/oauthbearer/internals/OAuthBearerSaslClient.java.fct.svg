@startuml
!pragma layout smetana
start
note right
constructor OAuthBearerSaslClient(AuthenticateCallbackHandlercallbackHandler)
end note
:this.callbackHandler=Objects.requireNonNull(callbackHandler);;
:setState(State.SEND_CLIENT_FIRST_MESSAGE);;
end
start
note right
CallbackHandlercallbackHandler()
end note
:return callbackHandler;;
stop
end
start
note right
StringgetMechanismName()
end note
:return OAuthBearerLoginModule.OAUTHBEARER_MECHANISM;;
stop
end
start
note right
booleanhasInitialResponse()
end note
:return true;;
stop
end
start
note right
byte[]evaluateChallenge(byte[]challenge)
end note
:try ;
:OAuthBearerTokenCallbackcallback=new OAuthBearerTokenCallback();;
switch (switch (state))
endswith
:catch (SaslExceptione);
:setState(State.FAILED);;
:throw e;;
stop
:catch (IOException|UnsupportedCallbackExceptione);
:setState(State.FAILED);;
:throw new SaslException(e.getMessage(),e);;
stop
end
start
note right
booleanisComplete()
end note
:return state==State.COMPLETE;;
stop
end
start
note right
byte[]unwrap(byte[]incoming,intoffset,intlen)
end note
if (!isComplete()) then (yes) 
:throw new IllegalStateException("Authentication exchange has not completed");;
stop
endif 
:return Arrays.copyOfRange(incoming,offset,offset+
len);;
stop
end
start
note right
byte[]wrap(byte[]outgoing,intoffset,intlen)
end note
if (!isComplete()) then (yes) 
:throw new IllegalStateException("Authentication exchange has not completed");;
stop
endif 
:return Arrays.copyOfRange(outgoing,offset,offset+
len);;
stop
end
start
note right
ObjectgetNegotiatedProperty(StringpropName)
end note
if (!isComplete()) then (yes) 
:throw new IllegalStateException("Authentication exchange has not completed");;
stop
endif 
:return null ;;
stop
end
start
note right
void dispose()
end note
end
start
note right
void setState(Statestate)
end note
:log.debug("Setting SASL/{} client state to {}",
OAuthBearerLoginModule.OAUTHBEARER_MECHANISM,
state);;
:this.state=state;;
end
start
note right
SaslExtensionsretrieveCustomExtensions()
end note
:SaslExtensionsCallbackextensionsCallback=new SaslExtensionsCallback();;
:try ;
:callbackHandler().handle(new Callback[]{extensionsCallback});;
:catch (UnsupportedCallbackExceptione);
:log.debug("Extensions callback is not supported by client callback handler {},
 no extensions will be added",callbackHandler());;
:catch (Exceptione);
:throw new SaslException("SASL extensions could not be obtained",e);;
stop
:return extensionsCallback.extensions();;
stop
end
start
note right
SaslClientcreateSaslClient(String[]mechanisms,
StringauthorizationId,Stringprotocol,StringserverName,
Map<String,? >props,CallbackHandlercallbackHandler)
end note
:String[]mechanismNamesCompatibleWithPolicy=getMechanismNames(props);;
if (mechanismNamesCompatibleWithPolicy[i].equals(mechanism)) then (yes) 
if (!(Objects.requireNonNull(callbackHandler) instanceof AuthenticateCallbackHandler)) then (yes) 
:throw new IllegalArgumentException(String.format("Callback handler must be castable to %s: %s",
AuthenticateCallbackHandler.class .getName(),
callbackHandler.getClass().getName()));;
stop
endif 
:return new OAuthBearerSaslClient((AuthenticateCallbackHandler)callbackHandler);;
stop
endif 
:return null ;;
stop
end
start
note right
String[]getMechanismNames(Map<String,? >props)
end note
:return OAuthBearerSaslServer.mechanismNamesCompatibleWithPolicy(props);;
stop
end
@enduml

