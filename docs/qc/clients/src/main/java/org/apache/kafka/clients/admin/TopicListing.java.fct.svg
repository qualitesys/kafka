7]
@startuml
!pragma layout smetana
start
note right
constructor TopicListing(Stringname,booleaninternal)
end note
:this.name=name;
:this.internal=internal;
:this.topicId=Uuid.ZERO_UUID;
end
start
note right
constructor TopicListing(Stringname,UuidtopicId,
booleaninternal)
end note
:this.topicId=topicId;
:this.name=name;
:this.internal=internal;
end
start
note right
UuidtopicId()
end note
:return topicId;;
stop
end
start
note right
Stringname()
end note
:return name;;
stop
end
start
note right
booleanisInternal()
end note
:return internal;;
stop
end
start
note right
StringtoString()
end note
:return "(name="+name+", topicId="+topicId+",
 internal="+internal+")";;
stop
end
@enduml

