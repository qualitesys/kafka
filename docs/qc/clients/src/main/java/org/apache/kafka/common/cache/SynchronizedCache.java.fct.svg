@startuml
!pragma layout smetana
start
note right
constructor SynchronizedCache(Cache<K,V>underlying)
end note
:this.underlying=underlying;
end
start
note right
Vget(Kkey)
end note
:return underlying.get(key);;
stop
end
start
note right
void put(Kkey,Vvalue)
end note
:underlying.put(key,value);
end
start
note right
booleanremove(Kkey)
end note
:return underlying.remove(key);;
stop
end
start
note right
longsize()
end note
:return underlying.size();;
stop
end
@enduml

