@startuml
!pragma layout smetana
start
note right
constructor SynchronizedCache(Cache<K,V> underlying)
end note
:this.underlying=underlying;;
end
start
note right
V get(K key)
end note
:return underlying.get(key);;
stop
end
start
note right
void put(K key,V value)
end note
:underlying.put(key,value);;
end
start
note right
boolean remove(K key)
end note
:return underlying.remove(key);;
stop
end
start
note right
long size()
end note
:return underlying.size();;
stop
end
@enduml

