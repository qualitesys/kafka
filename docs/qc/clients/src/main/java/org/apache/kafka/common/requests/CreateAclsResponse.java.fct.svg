@startuml
!pragma layout smetana
start
note right
constructor CreateAclsResponse(CreateAclsResponseDatadata)
end note
:super (ApiKeys.CREATE_ACLS);
:this.data=data;
end
start
note right
CreateAclsResponseDatadata()
end note
:return data;;
stop
end
start
note right
intthrottleTimeMs()
end note
:return data.throttleTimeMs();;
stop
end
start
note right
List<CreateAclsResponseData.AclCreationResult>results()
end note
:return data.results();;
stop
end
start
note right
Map<Errors,Integer>errorCounts()
end note
:return errorCounts(results().stream().map(r->Errors.forCode(r.errorCode())));;
stop
end
start
note right
CreateAclsResponseparse(ByteBufferbuffer,
shortversion)
end note
:return new CreateAclsResponse(new CreateAclsResponseData(new ByteBufferAccessor(buffer),version));;
stop
end
start
note right
booleanshouldClientThrottle(shortversion)
end note
:return version>=1;;
stop
end
@enduml

