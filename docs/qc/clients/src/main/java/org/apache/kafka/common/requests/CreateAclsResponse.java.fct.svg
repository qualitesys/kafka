@startuml
!pragma layout smetana
start
note right
constructor CreateAclsResponse(CreateAclsResponseData data)
end note
:super (ApiKeys.CREATE_ACLS);;
:this.data=data;;
end
start
note right
CreateAclsResponseData data()
end note
:return data;;
stop
end
start
note right
int throttleTimeMs()
end note
:return data.throttleTimeMs();;
stop
end
start
note right
List<CreateAclsResponseData.AclCreationResult> results()
end note
:return data.results();;
stop
end
start
note right
Map<Errors,Integer> errorCounts()
end note
:return errorCounts(results().stream().map(r->Errors.forCode(r.errorCode())));;
stop
end
start
note right
CreateAclsResponse parse(ByteBuffer buffer,
short version)
end note
:return new CreateAclsResponse(new CreateAclsResponseData(new ByteBufferAccessor(buffer),
version));;
stop
end
start
note right
boolean shouldClientThrottle(short version)
end note
:return version>=1;;
stop
end
@enduml

