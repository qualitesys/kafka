@startuml
!pragma layout smetana
start
note right
constructor StopReplicaResponse(StopReplicaResponseDatadata)
end note
end
start
note right
List<StopReplicaPartitionError>partitionErrors()
end note
:return data.partitionErrors();;
stop
end
start
note right
Errorserror()
end note
:return Errors.forCode(data.errorCode());;
stop
end
start
note right
Map<Errors,Integer>errorCounts()
end note
if (data.errorCode()!=Errors.NONE.code()) then (yes) 
:return Collections.singletonMap(error(),
data.partitionErrors().size()+1);;
stop
endif 
:return errors;;
stop
end
start
note right
StopReplicaResponseparse(ByteBufferbuffer,
shortversion)
end note
:return new StopReplicaResponse(new StopReplicaResponseData(new ByteBufferAccessor(buffer),
version));;
stop
end
start
note right
intthrottleTimeMs()
end note
:return DEFAULT_THROTTLE_TIME;;
stop
end
start
note right
StopReplicaResponseDatadata()
end note
:return data;;
stop
end
start
note right
StringtoString()
end note
:return data.toString();;
stop
end
@enduml

