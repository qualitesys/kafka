@startuml
!pragma layout smetana
start
note right
constructor AlterPartitionReassignmentsResult(Map<TopicPartition,
KafkaFuture<Void>>futures)
end note
end
start
note right
Map<TopicPartition,KafkaFuture<Void>>values()
end note
:return futures;;
stop
end
start
note right
KafkaFuture<Void>all()
end note
:return KafkaFuture.allOf(futures.values()
.toArray(new KafkaFuture[0]));;
stop
end
@enduml

