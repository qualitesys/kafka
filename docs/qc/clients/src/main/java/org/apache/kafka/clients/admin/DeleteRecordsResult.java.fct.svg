@startuml
!pragma layout smetana
start
note right
constructor DeleteRecordsResult(Map<TopicPartition,KafkaFuture<DeletedRecords>>futures)
end note
:this.futures=futures;
end
start
note right
Map<TopicPartition,KafkaFuture<DeletedRecords>>lowWatermarks()
end note
:return futures;;
stop
end
start
note right
KafkaFuture<Void>all()
end note
:return KafkaFuture.allOf(futures.values().toArray(new KafkaFuture[0]));;
stop
end
@enduml

