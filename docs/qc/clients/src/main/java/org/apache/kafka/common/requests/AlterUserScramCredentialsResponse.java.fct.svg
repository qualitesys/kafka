@startuml
!pragma layout smetana
start
note right
constructor AlterUserScramCredentialsResponse(AlterUserScramCredentialsResponseDataresponseData)
end note
:super (ApiKeys.ALTER_USER_SCRAM_CREDENTIALS);
:this.data=responseData;
end
start
note right
AlterUserScramCredentialsResponseDatadata()
end note
:return data;;
stop
end
start
note right
booleanshouldClientThrottle(shortversion)
end note
:return true;;
stop
end
start
note right
intthrottleTimeMs()
end note
:return data.throttleTimeMs();;
stop
end
start
note right
Map<Errors,Integer>errorCounts()
end note
:return errorCounts(data.results().stream()
.map(r->Errors.forCode(r.errorCode())));;
stop
end
start
note right
AlterUserScramCredentialsResponseparse(ByteBufferbuffer,
shortversion)
end note
:return new AlterUserScramCredentialsResponse(new AlterUserScramCredentialsResponseData(new ByteBufferAccessor(buffer),
version));;
stop
end
@enduml

