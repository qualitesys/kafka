@startuml
!pragma layout smetana
start
note right
constructor UserScramCredentialUpsertion(Stringuser,
ScramCredentialInfocredentialInfo,Stringpassword)
end note
end
start
note right
constructor UserScramCredentialUpsertion(Stringuser,
ScramCredentialInfocredentialInfo,byte[]password)
end note
end
start
note right
constructor UserScramCredentialUpsertion(Stringuser,
ScramCredentialInfocredentialInfo,byte[]password,
byte[]salt)
end note
end
start
note right
ScramCredentialInfocredentialInfo()
end note
:return info;;
stop
end
start
note right
byte[]salt()
end note
:return salt;;
stop
end
start
note right
byte[]password()
end note
:return password;;
stop
end
start
note right
byte[]generateRandomSalt()
end note
:return ScramFormatter.secureRandomBytes(new SecureRandom());;
stop
end
@enduml

