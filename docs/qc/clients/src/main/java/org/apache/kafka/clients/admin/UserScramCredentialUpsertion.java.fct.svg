@startuml
!pragma layout smetana
start
note right
constructor UserScramCredentialUpsertion(Stringuser,
ScramCredentialInfocredentialInfo,Stringpassword)
end note
:this(user,credentialInfo,password.getBytes(StandardCharsets.UTF_8));;
end
start
note right
constructor UserScramCredentialUpsertion(Stringuser,
ScramCredentialInfocredentialInfo,byte[]password)
end note
:this(user,credentialInfo,password,generateRandomSalt());;
end
start
note right
constructor UserScramCredentialUpsertion(Stringuser,
ScramCredentialInfocredentialInfo,byte[]password,
byte[]salt)
end note
:super (Objects.requireNonNull(user));;
:this.info=Objects.requireNonNull(credentialInfo);;
:this.password=Objects.requireNonNull(password);;
:this.salt=Objects.requireNonNull(salt);;
end
start
note right
ScramCredentialInfocredentialInfo()
end note
:return info;;
stop
end
start
note right
byte[]salt()
end note
:return salt;;
stop
end
start
note right
byte[]password()
end note
:return password;;
stop
end
start
note right
byte[]generateRandomSalt()
end note
:return ScramFormatter.secureRandomBytes(new SecureRandom());;
stop
end
@enduml

