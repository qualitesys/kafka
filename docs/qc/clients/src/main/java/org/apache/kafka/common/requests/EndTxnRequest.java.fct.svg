@startuml
!pragma layout smetana
start
note right
constructor Builder(EndTxnRequestDatadata)
end note
end
start
note right
EndTxnRequestbuild(shortversion)
end note
:return new EndTxnRequest(data,version);;
stop
end
start
note right
StringtoString()
end note
:return data.toString();;
stop
end
start
note right
constructor EndTxnRequest(EndTxnRequestDatadata,
shortversion)
end note
end
start
note right
TransactionResultresult()
end note
if (data.committed()) then (yes) 
:return TransactionResult.COMMIT;;
stop
else (no)
:return TransactionResult.ABORT;;
stop
endif 
end
start
note right
EndTxnRequestDatadata()
end note
:return data;;
stop
end
start
note right
EndTxnResponsegetErrorResponse(intthrottleTimeMs,
Throwablee)
end note
:return new EndTxnResponse(new EndTxnResponseData()
.setErrorCode(Errors.forException(e).code()).setThrottleTimeMs(throttleTimeMs));;
stop
end
start
note right
EndTxnRequestparse(ByteBufferbuffer,shortversion)
end note
:return new EndTxnRequest(new EndTxnRequestData(new ByteBufferAccessor(buffer),
version),version);;
stop
end
@enduml

