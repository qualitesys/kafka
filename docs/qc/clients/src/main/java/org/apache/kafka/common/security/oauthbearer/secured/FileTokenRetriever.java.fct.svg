225,321.3047" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="225" x2="225" y1="581.6133" y2="601.6133"/><polygon fill="#181818" points="221,591.6133,225,601.6133,229,591.6133,225,595.6133" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[2d2df3fe86159fb753d529c944290693]
@startuml
!pragma layout smetana
start
note right
constructor FileTokenRetriever(PathaccessTokenFile)
end note
:this.accessTokenFile=accessTokenFile;;
end
start
note right
void init()
end note
:this.accessToken=Utils.readFileAsString(accessTokenFile.toFile()
.getPath());;
end
start
note right
Stringretrieve()
end note
if (accessToken==null ) then (yes) 
:throw new IllegalStateException("Access token is null;
: please call init() first");;
stop
endif 
:return accessToken;;
stop
end
@enduml

