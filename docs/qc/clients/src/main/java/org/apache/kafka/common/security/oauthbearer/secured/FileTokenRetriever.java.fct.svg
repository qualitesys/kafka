@startuml
!pragma layout smetana
start
note right
constructor FileTokenRetriever(PathaccessTokenFile)
end note
:this.accessTokenFile=accessTokenFile;
end
start
note right
void init()
end note
:this.accessToken=Utils.readFileAsString(accessTokenFile.toFile().getPath());
end
start
note right
Stringretrieve()
end note
if (accessToken==null ) then (yes) 
:throw new IllegalStateException("Access token is null; please call init() first");;
endif 
:return accessToken;;
stop
end
@enduml

