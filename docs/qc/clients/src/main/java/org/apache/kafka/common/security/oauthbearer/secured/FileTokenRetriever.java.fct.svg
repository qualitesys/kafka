e="stroke:#181818;stroke-width:1.0;" x1="259.5" x2="259.5" y1="508.6758" y2="528.6758"/><polygon fill="#181818" points="255.5,518.6758,259.5,528.6758,263.5,518.6758,259.5,522.6758" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="259.5" x2="259.5" y1="562.6445" y2="582.6445"/><polygon fill="#181818" points="255.5,572.6445,259.5,582.6445,263.5,572.6445,259.5,576.6445" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[55894c6b186db6542774a86c8237df10]
@startuml
!pragma layout smetana
start
note right
constructor FileTokenRetriever(PathaccessTokenFile)
end note
:this.accessTokenFile=accessTokenFile;
end
start
note right
void init()
end note
:this.accessToken=Utils.readFileAsString(accessTokenFile.toFile().getPath());
end
start
note right
Stringretrieve()
end note
if (accessToken==null ) then (yes) 
:throw new IllegalStateException("Access token is null;
: please call init() first");;
endif 
:return accessToken;;
stop
end
@enduml

