ll="#181818" points="221,532.6445,225,542.6445,229,532.6445,225,536.6445" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="225" x2="225" y1="576.6133" y2="596.6133"/><polygon fill="#181818" points="221,586.6133,225,596.6133,229,586.6133,225,590.6133" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[523b85d9cf771a417db31a10dd43a629]
@startuml
!pragma layout smetana
start
note right
constructor FileTokenRetriever(PathaccessTokenFile)
end note
:this.accessTokenFile=accessTokenFile;
end
start
note right
void init()
end note
:this.accessToken=Utils.readFileAsString(accessTokenFile.toFile()
.getPath());
end
start
note right
Stringretrieve()
end note
if (accessToken==null ) then (yes) 
:throw new IllegalStateException("Access token is null;
: please call init() first");;
endif 
:return accessToken;;
stop
end
@enduml

