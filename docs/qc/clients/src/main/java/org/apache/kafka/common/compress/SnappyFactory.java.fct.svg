@startuml
!pragma layout smetana
start
note right
constructor SnappyFactory()
end note
end
start
note right
OutputStreamwrapForOutput(ByteBufferOutputStreambuffer)
end note
switch (try/catch block)
case (try)
:return new SnappyOutputStream(buffer);;
stop
case (catch (Throwablee))
:throw new KafkaException(e);;
stop
endswitch
end
start
note right
InputStreamwrapForInput(ByteBufferbuffer)
end note
switch (try/catch block)
case (try)
:return new SnappyInputStream(new ByteBufferInputStream(buffer));;
stop
case (catch (Throwablee))
:throw new KafkaException(e);;
stop
endswitch
end
@enduml

