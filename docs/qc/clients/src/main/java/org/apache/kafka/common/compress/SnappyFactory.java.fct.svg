@startuml
!pragma layout smetana
start
note right
constructor SnappyFactory()
end note
end
start
note right
OutputStreamwrapForOutput(ByteBufferOutputStreambuffer)
end note
:try {return new SnappyOutputStream(buffer);
:}catch (Throwablee){throw new KafkaException(e);};
end
start
note right
InputStreamwrapForInput(ByteBufferbuffer)
end note
:try {return new SnappyInputStream(new ByteBufferInputStream(buffer));
:}catch (Throwablee){throw new KafkaException(e);};
end
@enduml

