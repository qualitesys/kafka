@startuml
!pragma layout smetana
start
note right
constructor ListTransactionsResult(KafkaFuture<Map<Integer,
KafkaFutureImpl<Collection<TransactionListing>>>>future)
end note
:this.future=future;;
end
start
note right
KafkaFuture<Collection<TransactionListing>>all()
end note
:return allByBrokerId().thenApply(map->{List<TransactionListing>allListings=new ArrayList<>();
:for (Collection<TransactionListing>listings:map.values()){allListings.addAll(listings);
:}return allListings;});;
stop
end
start
note right
KafkaFuture<Map<Integer,KafkaFuture<Collection<TransactionListing>>>>byBrokerId()
end note
:KafkaFutureImpl<Map<Integer,KafkaFuture<Collection<TransactionListing>>>>result=new KafkaFutureImpl<>();;
:future.whenComplete((brokerFutures,exception)->{if (brokerFutures!=null ){Map<Integer,
KafkaFuture<Collection<TransactionListing>>>brokerFuturesCopy=new HashMap<>(brokerFutures.size());brokerFuturesCopy.putAll(brokerFutures);result.complete(brokerFuturesCopy);}else {result.completeExceptionally(exception);}});;
:return result;;
stop
end
start
note right
KafkaFuture<Map<Integer,Collection<TransactionListing>>>allByBrokerId()
end note
:KafkaFutureImpl<Map<Integer,Collection<TransactionListing>>>allFuture=new KafkaFutureImpl<>();;
:Map<Integer,Collection<TransactionListing>>allListingsMap=new HashMap<>();;
:future.whenComplete((map,topLevelException)->{if (topLevelException!=null ){allFuture.completeExceptionally(topLevelException);
:return ;}Set<Integer>remainingResponses=new HashSet<>(map.keySet());map.forEach((brokerId,
future)->{future.whenComplete((listings,brokerException)->{if (brokerException!=null ){allFuture.completeExceptionally(brokerException);}else if (!allFuture.isDone()){allListingsMap.put(brokerId,
listings);remainingResponses.remove(brokerId);if (remainingResponses.isEmpty()){allFuture.complete(allListingsMap);}}});});});;
:return allFuture;;
stop
end
