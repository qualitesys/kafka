-width:2.5;" x1="1755.3128" x2="1767.6872" y1="719.2894" y2="731.6637"/><line style="stroke:#222222;stroke-width:2.5;" x1="1767.6872" x2="1755.3128" y1="719.2894" y2="731.6637"/><line style="stroke:#181818;stroke-width:1.0;" x1="1761.5" x2="1761.5" y1="40.1328" y2="70.2656"/><polygon fill="#181818" points="1757.5,60.2656,1761.5,70.2656,1765.5,60.2656,1761.5,64.2656" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="1761.5" x2="1761.5" y1="104.2344" y2="124.2344"/><polygon fill="#181818" points="1757.5,114.2344,1761.5,124.2344,1765.5,114.2344,1761.5,118.2344" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="1761.5" x2="1761.5" y1="176.8008" y2="199.3672"/><polygon fill="#181818" points="1757.5,189.3672,1761.5,199.3672,1765.5,189.3672,1761.5,193.3672" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="1761.5" x2="1761.5" y1="233.3359" y2="253.3359"/><polygon fill="#181818" points="1757.5,243.3359,1761.5,253.3359,1765.5,243.3359,1761.5,247.3359" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="1761.5" x2="1761.5" y1="337.9023" y2="360.4688"/><polygon fill="#181818" points="1757.5,350.4688,1761.5,360.4688,1765.5,350.4688,1761.5,354.4688" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="1761.5" x2="1761.5" y1="394.4375" y2="414.4375"/><polygon fill="#181818" points="1757.5,404.4375,1761.5,414.4375,1765.5,404.4375,1761.5,408.4375" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="1761.5" x2="1761.5" y1="448.4063" y2="468.4063"/><polygon fill="#181818" points="1757.5,458.4063,1761.5,468.4063,1765.5,458.4063,1761.5,462.4063" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="1761.5" x2="1761.5" y1="552.9727" y2="575.5391"/><polygon fill="#181818" points="1757.5,565.5391,1761.5,575.5391,1765.5,565.5391,1761.5,569.5391" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="1761.5" x2="1761.5" y1="609.5078" y2="629.5078"/><polygon fill="#181818" points="1757.5,619.5078,1761.5,629.5078,1765.5,619.5078,1761.5,623.5078" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="1761.5" x2="1761.5" y1="663.4766" y2="683.4766"/><polygon fill="#181818" points="1757.5,673.4766,1761.5,683.4766,1765.5,673.4766,1761.5,677.4766" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[f9e6b3e8d9a9c4b7a05e6f89c8b90a57]
@startuml
!pragma layout smetana
start
note right
constructor ListTransactionsResult(KafkaFuture<Map<Integer,
KafkaFutureImpl<Collection<TransactionListing>>>>future)
end note
:this.future=future;
end
start
note right
KafkaFuture<Collection<TransactionListing>>all()
end note
:return allByBrokerId().thenApply(map->{List<TransactionListing>allListings=new ArrayList<>();for (Collection<TransactionListing>listings:map.values()){allListings.addAll(listings);}return allListings;});;
stop
end
start
note right
KafkaFuture<Map<Integer,KafkaFuture<Collection<TransactionListing>>>>byBrokerId()
end note
:future.whenComplete((brokerFutures,exception)->{if (brokerFutures!=null ){Map<Integer,KafkaFuture<Collection<TransactionListing>>>brokerFuturesCopy=new HashMap<>(brokerFutures.size());brokerFuturesCopy.putAll(brokerFutures);result.complete(brokerFuturesCopy);}else {result.completeExceptionally(exception);}});
:return result;;
stop
end
start
note right
KafkaFuture<Map<Integer,Collection<TransactionListing>>>allByBrokerId()
end note
:future.whenComplete((map,topLevelException)->{if (topLevelException!=null ){allFuture.completeExceptionally(topLevelException);return ;}Set<Integer>remainingResponses=new HashSet<>(map.keySet());map.forEach((brokerId,future)->{future.whenComplete((listings,brokerException)->{if (brokerException!=null ){allFuture.completeExceptionally(brokerException);}else if (!allFuture.isDone()){allListingsMap.put(brokerId,listings);remainingResponses.remove(brokerId);if (remainingResponses.isEmpty()){allFuture.complete(allListingsMap);}}});});});
:return allFuture;;
stop
end
@enduml

