end note
end
start
note right
KafkaFuture<Collection<TransactionListing>>all()
end note
:return allByBrokerId().thenApply(map->{List<TransactionListing>allListings=new ArrayList<>();
:for (Collection<TransactionListing>listings:map.values()){allListings.addAll(listings);
:}return allListings;});;
stop
end
start
note right
KafkaFuture<Map<Integer,KafkaFuture<Collection<TransactionListing>>>>byBrokerId()
end note
:return result;;
stop
end
start
note right
KafkaFuture<Map<Integer,Collection<TransactionListing>>>allByBrokerId()
end note
:return allFuture;;
stop
end
@enduml

