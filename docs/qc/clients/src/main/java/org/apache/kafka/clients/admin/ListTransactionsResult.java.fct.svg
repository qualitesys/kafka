-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="1761.5" x2="1761.5" y1="341.2734" y2="361.2734"/><polygon fill="#181818" points="1757.5,351.2734,1761.5,361.2734,1765.5,351.2734,1761.5,355.2734" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="1761.5" x2="1761.5" y1="445.8398" y2="468.4063"/><polygon fill="#181818" points="1757.5,458.4063,1761.5,468.4063,1765.5,458.4063,1761.5,462.4063" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="1761.5" x2="1761.5" y1="516.3438" y2="536.3438"/><polygon fill="#181818" points="1757.5,526.3438,1761.5,536.3438,1765.5,526.3438,1761.5,530.3438" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="1761.5" x2="1761.5" y1="570.3125" y2="590.3125"/><polygon fill="#181818" points="1757.5,580.3125,1761.5,590.3125,1765.5,580.3125,1761.5,584.3125" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="1761.5" x2="1761.5" y1="674.8789" y2="697.4453"/><polygon fill="#181818" points="1757.5,687.4453,1761.5,697.4453,1765.5,687.4453,1761.5,691.4453" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="1761.5" x2="1761.5" y1="731.4141" y2="751.4141"/><polygon fill="#181818" points="1757.5,741.4141,1761.5,751.4141,1765.5,741.4141,1761.5,745.4141" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="1761.5" x2="1761.5" y1="785.3828" y2="805.3828"/><polygon fill="#181818" points="1757.5,795.3828,1761.5,805.3828,1765.5,795.3828,1761.5,799.3828" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[dd7048939152750533fe875db72556a1]
@startuml
!pragma layout smetana
start
note right
constructor ListTransactionsResult(KafkaFuture<Map<Integer,
KafkaFutureImpl<Collection<TransactionListing>>>>future)
end note
:this.future=future;
end
start
note right
KafkaFuture<Collection<TransactionListing>>all()
end note
:return allByBrokerId().thenApply(map->{List<TransactionListing>allListings=new ArrayList<>();
:for (Collection<TransactionListing>listings:map.values()){allListings.addAll(listings);
:}return allListings;});;
stop
end
start
note right
KafkaFuture<Map<Integer,KafkaFuture<Collection<TransactionListing>>>>byBrokerId()
end note
:future.whenComplete((brokerFutures,exception)->{if (brokerFutures!=null ){Map<Integer,
KafkaFuture<Collection<TransactionListing>>>brokerFuturesCopy=new HashMap<>(brokerFutures.size());brokerFuturesCopy.putAll(brokerFutures);result.complete(brokerFuturesCopy);}else {result.completeExceptionally(exception);}});
:return result;;
stop
end
start
note right
KafkaFuture<Map<Integer,Collection<TransactionListing>>>allByBrokerId()
end note
:future.whenComplete((map,topLevelException)->{if (topLevelException!=null ){allFuture.completeExceptionally(topLevelException);return ;}Set<Integer>remainingResponses=new HashSet<>(map.keySet());map.forEach((brokerId,future)->{future.whenComplete((listings,brokerException)->{if (brokerException!=null ){allFuture.completeExceptionally(brokerException);}else if (!allFuture.isDone()){allListingsMap.put(brokerId,listings);remainingResponses.remove(brokerId);if (remainingResponses.isEmpty()){allFuture.complete(allListingsMap);}}});});});
:return allFuture;;
stop
end
@enduml

