@startuml
!pragma layout smetana
start
note right
constructor TimestampType(intid,Stringname)
end note
end
start
note right
TimestampTypeforName(Stringname)
end note
if (t.name.equals(name)) then (yes) 
:return t;;
stop
endif 
:throw new NoSuchElementException("Invalid timestamp type "+
name);;
end
start
note right
StringtoString()
end note
:return name;;
stop
end
@enduml

