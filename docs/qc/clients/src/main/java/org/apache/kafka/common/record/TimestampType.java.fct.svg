.1914,241.5,542.1914,245.5,532.1914,241.5,536.1914" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="241.5" x2="241.5" y1="576.1602" y2="596.1602"/><polygon fill="#181818" points="237.5,586.1602,241.5,596.1602,245.5,586.1602,241.5,590.1602" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[d6f8864e205ebff05b98d6ab1cca84ad]
@startuml
!pragma layout smetana
start
note right
constructor TimestampType(intid,Stringname)
end note
:this.id=id;
:this.name=name;
end
start
note right
TimestampTypeforName(Stringname)
end note
if (t.name.equals(name)) then (yes) 
:return t;;
stop
endif 
:throw new NoSuchElementException("Invalid timestamp type "+name);;
end
start
note right
StringtoString()
end note
:return name;;
stop
end
@enduml

