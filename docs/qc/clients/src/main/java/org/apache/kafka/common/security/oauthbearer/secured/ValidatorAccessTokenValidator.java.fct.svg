@startuml
!pragma layout smetana
start
note right
constructor ValidatorAccessTokenValidator(IntegerclockSkew,
Set<String>expectedAudiences,StringexpectedIssuer,
VerificationKeyResolververificationKeyResolver,
StringscopeClaimName,StringsubClaimName)
end note
if (clockSkew!=null ) then (yes) 
endif 
if (expectedAudiences!=null &&!expectedAudiences.isEmpty()) then (yes) 
endif 
if (expectedIssuer!=null ) then (yes) 
endif 
end
start
note right
OAuthBearerTokenvalidate(StringaccessToken)
end note
:throw new ValidateException(String.format("Could not validate the access token: %s",
e.getMessage()),e);;
if (scopeRaw instanceof String) then (yes) 
else (no)
endif 
:return token;;
stop
end
:return value;;
stop
:throw new ValidateException(String.format("Could not extract the '%s' claim from the access token",
claimName),e);;
@enduml

