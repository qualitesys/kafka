e-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="752.5" x2="752.5" y1="926.5586" y2="944.5586"/><line style="stroke:#181818;stroke-width:1.0;" x1="752.5" x2="572.5" y1="944.5586" y2="944.5586"/><polygon fill="#181818" points="582.5,940.5586,572.5,944.5586,582.5,948.5586,578.5,944.5586" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="560.5" x2="560.5" y1="838.5898" y2="858.5898"/><polygon fill="#181818" points="556.5,848.5898,560.5,858.5898,564.5,848.5898,560.5,852.5898" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="560.5" x2="560.5" y1="956.5586" y2="976.5586"/><polygon fill="#181818" points="556.5,966.5586,560.5,976.5586,564.5,966.5586,560.5,970.5586" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="560.5" x2="560.5" y1="1010.5273" y2="1030.5273"/><polygon fill="#181818" points="556.5,1020.5273,560.5,1030.5273,564.5,1020.5273,560.5,1024.5273" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[5548cc418b833bf1c01184d8d586e8ad]
@startuml
!pragma layout smetana
start
note right
constructor ValidatorAccessTokenValidator(IntegerclockSkew,
Set<String>expectedAudiences,StringexpectedIssuer,
VerificationKeyResolververificationKeyResolver,
StringscopeClaimName,StringsubClaimName)
end note
if (clockSkew!=null ) then (yes) 
:jwtConsumerBuilder.setAllowedClockSkewInSeconds(clockSkew);;
endif 
if (expectedAudiences!=null &&!expectedAudiences.isEmpty()) then (yes) 
:jwtConsumerBuilder.setExpectedAudience(expectedAudiences.toArray(new String[0]));;
endif 
if (expectedIssuer!=null ) then (yes) 
:jwtConsumerBuilder.setExpectedIssuer(expectedIssuer);;
endif 
:this.jwtConsumer=jwtConsumerBuilder.setJwsAlgorithmConstraints(DISALLOW_NONE)
.setRequireExpirationTime().setRequireIssuedAt().setRequireSubject().setVerificationKeyResolver(verificationKeyResolver).build();;
:this.scopeClaimName=scopeClaimName;;
:this.subClaimName=subClaimName;;
end
start
note right
OAuthBearerTokenvalidate(StringaccessToken)
end note
:try {jwt=jwtConsumer.process(serializedJwt.getToken());}catch (InvalidJwtExceptione){throw new ValidateException(String.format("Could not validate the access token: %s",
e.getMessage()),e);};
if (scopeRaw instanceof String) then (yes) 
:scopeRawCollection=Collections.singletonList((String)scopeRaw);;
else (no)
:scopeRawCollection=Collections.emptySet();;
endif 
:return token;;
stop
end
:try {Tvalue=supplier.get();log.debug("getClaim - {}: {}",
claimName,value);return value;}catch (MalformedClaimExceptione){throw new ValidateException(String.format("Could not extract the '%s' claim from the access token",
claimName),e);};
@enduml

