@startuml
!pragma layout smetana
start
note right
constructor ValidatorAccessTokenValidator(IntegerclockSkew,Set<String>expectedAudiences,StringexpectedIssuer,VerificationKeyResolververificationKeyResolver,StringscopeClaimName,StringsubClaimName)
end note
if (clockSkew!=null ) then (yes) 
:jwtConsumerBuilder.setAllowedClockSkewInSeconds(clockSkew);
endif 
if (expectedAudiences!=null &&!expectedAudiences.isEmpty()) then (yes) 
:jwtConsumerBuilder.setExpectedAudience(expectedAudiences.toArray(new String[0]));
endif 
if (expectedIssuer!=null ) then (yes) 
:jwtConsumerBuilder.setExpectedIssuer(expectedIssuer);
endif 
:this.jwtConsumer=jwtConsumerBuilder.setJwsAlgorithmConstraints(DISALLOW_NONE).setRequireExpirationTime().setRequireIssuedAt().setRequireSubject().setVerificationKeyResolver(verificationKeyResolver).build();
:this.scopeClaimName=scopeClaimName;
:this.subClaimName=subClaimName;
end
start
note right
