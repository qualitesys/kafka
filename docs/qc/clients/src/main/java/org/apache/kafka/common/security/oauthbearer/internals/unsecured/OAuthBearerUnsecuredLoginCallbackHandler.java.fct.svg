@startuml
!pragma layout smetana
start
note right
void time(Timetime)
end note
:this.time=Objects.requireNonNull(time);;
end
start
note right
booleanconfigured()
end note
:return configured;;
stop
end
start
note right
void configure(Map<String,? >configs,StringsaslMechanism,
List<AppConfigurationEntry>jaasConfigEntries)
end note
if (!OAuthBearerLoginModule.OAUTHBEARER_MECHANISM.equals(saslMechanism)) then (yes) 
:throw new IllegalArgumentException(String.format("Unexpected SASL mechanism: %s",
saslMechanism));;
stop
endif 
if (Objects.requireNonNull(jaasConfigEntries).size()!=1||jaasConfigEntries.get(0)==null ) then (yes) 
:throw new IllegalArgumentException(String.format("Must supply exactly 1 non-null JAAS mechanism configuration (size was %d)",
jaasConfigEntries.size()));;
stop
endif 
:this.moduleOptions=Collections.unmodifiableMap((Map<String,
String>)jaasConfigEntries.get(0).getOptions());;
:configured=true;;
end
start
note right
void handle(Callback[]callbacks)
end note
if (!configured()) then (yes) 
:throw new IllegalStateException("Callback handler not configured");;
stop
endif 
if (callback instanceof OAuthBearerTokenCallback) then (yes) 
:try ;
:handleTokenCallback((OAuthBearerTokenCallback)callback);;
:catch (KafkaExceptione);
:throw new IOException(e.getMessage(),e);;
stop
else if (callback instanceof SaslExtensionsCallback) then (yes) 
:try ;
:handleExtensionsCallback((SaslExtensionsCallback)callback);;
:catch (KafkaExceptione);
:throw new IOException(e.getMessage(),e);;
stop
else (no)
:throw new UnsupportedCallbackException(callback);;
stop
endif 
end
start
note right
void close()
end note
end
start
note right
void handleTokenCallback(OAuthBearerTokenCallbackcallback)
end note
if (callback.token()!=null ) then (yes) 
:throw new IllegalArgumentException("Callback had a token already");;
stop
endif 
if (moduleOptions.isEmpty()) then (yes) 
:log.debug("Token not provided, this login cannot be used to establish client connections");;
:callback.token(null );;
:return ;;
stop
endif 
if (moduleOptions.keySet().stream().noneMatch(name->!name.startsWith(EXTENSION_PREFIX))) then (yes) 
:throw new OAuthBearerConfigException("Extensions provided in login context without a token");;
stop
endif 
:StringprincipalClaimNameValue=optionValue(PRINCIPAL_CLAIM_NAME_OPTION);;
:StringprincipalClaimName=Utils.isBlank(principalClaimNameValue)? DEFAULT_PRINCIPAL_CLAIM_NAME:principalClaimNameValue.trim();;
:StringscopeClaimNameValue=optionValue(SCOPE_CLAIM_NAME_OPTION);;
:StringscopeClaimName=Utils.isBlank(scopeClaimNameValue)? DEFAULT_SCOPE_CLAIM_NAME:scopeClaimNameValue.trim();;
:StringheaderJson="{"+claimOrHeaderJsonText("alg","none")+
"}";;
:StringlifetimeSecondsValueToUse=optionValue(LIFETIME_SECONDS_OPTION,
DEFAULT_LIFETIME_SECONDS_ONE_HOUR);;
:StringclaimsJson;;
:try ;
:claimsJson=String.format("{%s,%s%s}",expClaimText(Long.parseLong(lifetimeSecondsValueToUse)),
claimOrHeaderJsonText("iat",time.milliseconds()/1000.0),
commaPrependedStringNumberAndListClaimsJsonText());;
:catch (NumberFormatExceptione);
:throw new OAuthBearerConfigException(e.getMessage());;
stop
:try ;
:EncoderurlEncoderNoPadding=Base64.getUrlEncoder()
.withoutPadding();;
:OAuthBearerUnsecuredJwsjws=new OAuthBearerUnsecuredJws(String.format("%s.%s.",
urlEncoderNoPadding.encodeToString(headerJson.getBytes(StandardCharsets.UTF_8)),
urlEncoderNoPadding.encodeToString(claimsJson.getBytes(StandardCharsets.UTF_8))),
principalClaimName,scopeClaimName);;
:log.info("Retrieved token with principal {}",
jws.principalName());;
:callback.token(jws);;
:catch (OAuthBearerIllegalTokenExceptione);
:throw new OAuthBearerConfigException(e.getMessage(),e);;
stop
end
start
note right
void handleExtensionsCallback(SaslExtensionsCallbackcallback)
end note
:Map<String,String>extensions=new HashMap<>();;
:Stringkey=configEntry.getKey();;
if (!key.startsWith(EXTENSION_PREFIX)) then (yes) 
:continue ;;
endif 
:extensions.put(key.substring(EXTENSION_PREFIX.length()),
configEntry.getValue());;
:SaslExtensionssaslExtensions=new SaslExtensions(extensions);;
:try ;
:OAuthBearerClientInitialResponse.validateExtensions(saslExtensions);;
:catch (SaslExceptione);
:throw new ConfigException(e.getMessage());;
stop
:callback.extensions(saslExtensions);;
end
start
note right
StringcommaPrependedStringNumberAndListClaimsJsonText()
end note
:StringBuildersb=new StringBuilder();;
if (key.startsWith(STRING_CLAIM_PREFIX)&&key.length()>STRING_CLAIM_PREFIX.length()) then (yes) 
:sb.append(',').append(claimOrHeaderJsonText(confirmNotReservedClaimName(key.substring(STRING_CLAIM_PREFIX.length())),
optionValue(key)));;
else if (key.startsWith(NUMBER_CLAIM_PREFIX)&&key.length()>NUMBER_CLAIM_PREFIX.length()) then (yes) 
:sb.append(',').append(claimOrHeaderJsonText(confirmNotReservedClaimName(key.substring(NUMBER_CLAIM_PREFIX.length())),
Double.valueOf(optionValue(key))));;
else if (key.startsWith(LIST_CLAIM_PREFIX)&&key.length()>LIST_CLAIM_PREFIX.length()) then (yes) 
:sb.append(',').append(claimOrHeaderJsonArrayText(confirmNotReservedClaimName(key.substring(LIST_CLAIM_PREFIX.length())),
listJsonText(optionValue(key))));;
endif 
:return sb.toString();;
stop
end
start
note right
StringconfirmNotReservedClaimName(StringclaimName)
end note
if (RESERVED_CLAIMS.contains(claimName)) then (yes) 
:throw new OAuthBearerConfigException(String.format("Cannot explicitly set the '%s' claim",
claimName));;
stop
endif 
:return claimName;;
stop
end
start
note right
StringlistJsonText(Stringvalue)
end note
if (value.isEmpty()||value.length()<=1) then (yes) 
:return "[]";;
stop
endif 
:Stringdelimiter;;
:StringunescapedDelimiterChar=value.substring(0,1);;
switch (switch (unescapedDelimiterChar))
endswith
:StringlistText=value.substring(1);;
:String[]elements=listText.split(delimiter);;
:StringBuildersb=new StringBuilder();;
:sb.append(sb.length()==0? '[':',');;
:sb.append('"').append(escape(element)).append('"');;
if (listText.startsWith(unescapedDelimiterChar)||listText.endsWith(unescapedDelimiterChar)||listText.contains(unescapedDelimiterChar+
unescapedDelimiterChar)) then (yes) 
:sb.append(",\"\"");;
endif 
:return sb.append(']').toString();;
stop
end
start
note right
StringoptionValue(Stringkey)
end note
:return optionValue(key,null );;
stop
end
start
note right
StringoptionValue(Stringkey,StringdefaultValue)
end note
:StringexplicitValue=option(key);;
:return explicitValue!=null ? explicitValue:defaultValue;;
stop
end
start
note right
Stringoption(Stringkey)
end note
if (!configured) then (yes) 
:throw new IllegalStateException("Callback handler not configured");;
stop
endif 
:return moduleOptions.get(Objects.requireNonNull(key));;
stop
end
start
note right
StringclaimOrHeaderJsonText(StringclaimName,
NumberclaimValue)
end note
:return QUOTE+escape(claimName)+QUOTE+":"+
claimValue;;
stop
end
start
note right
StringclaimOrHeaderJsonText(StringclaimName,
StringclaimValue)
end note
:return QUOTE+escape(claimName)+QUOTE+":"+
QUOTE+escape(claimValue)+QUOTE;;
stop
end
start
note right
StringclaimOrHeaderJsonArrayText(StringclaimName,
StringescapedClaimValue)
end note
if (!escapedClaimValue.startsWith("[")||!escapedClaimValue.endsWith("]")) then (yes) 
:throw new IllegalArgumentException(String.format("Illegal JSON array: %s",
escapedClaimValue));;
stop
endif 
:return QUOTE+escape(claimName)+QUOTE+":"+
escapedClaimValue;;
stop
end
start
note right
Stringescape(StringjsonStringValue)
end note
:Stringreplace1=DOUBLEQUOTE.matcher(jsonStringValue)
.replaceAll(Matcher.quoteReplacement("\\\""));;
:return BACKSLASH.matcher(replace1).replaceAll(Matcher.quoteReplacement("\\\\"));;
stop
end
start
note right
StringexpClaimText(longlifetimeSeconds)
end note
:return claimOrHeaderJsonText("exp",time.milliseconds()/1000.0+
lifetimeSeconds);;
stop
end
