"1350" y1="829.8477" y2="849.8477"/><polygon fill="#181818" points="1346,839.8477,1350,849.8477,1354,839.8477,1350,843.8477" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="1350" x2="1350" y1="934.4141" y2="956.9805"/><polygon fill="#181818" points="1346,946.9805,1350,956.9805,1354,946.9805,1350,950.9805" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="1350" x2="1350" y1="1004.918" y2="1024.918"/><polygon fill="#181818" points="1346,1014.918,1350,1024.918,1354,1014.918,1350,1018.918" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[f5871fe35009ae0e0e75ef68c9b07492]
@startuml
!pragma layout smetana
start
note right
constructor DescribeProducersResult(Map<TopicPartition,KafkaFuture<PartitionProducerState>>futures)
end note
:this.futures=futures;
end
start
note right
KafkaFuture<PartitionProducerState>partitionResult(final TopicPartitionpartition)
end note
if (future==null ) then (yes) 
:throw new IllegalArgumentException("Topic partition "+
partition+" was not included in the request");;
endif 
:return future;;
stop
end
start
note right
KafkaFuture<Map<TopicPartition,PartitionProducerState>>all()
end note
:return KafkaFuture.allOf(futures.values().toArray(new KafkaFuture[0])).thenApply(nil->{Map<TopicPartition,PartitionProducerState>results=new HashMap<>(futures.size());for (Map.Entry<TopicPartition,KafkaFuture<PartitionProducerState>>entry:futures.entrySet()){try {results.put(entry.getKey(),entry.getValue().get());}catch (InterruptedException|ExecutionExceptione){throw new KafkaException(e);}}return results;});;
stop
end
start
note right
constructor PartitionProducerState(List<ProducerState>activeProducers)
end note
:this.activeProducers=activeProducers;
end
start
note right
List<ProducerState>activeProducers()
end note
:return activeProducers;;
stop
end
start
note right
StringtoString()
end note
:return "PartitionProducerState("+"activeProducers="+
activeProducers+')';;
stop
end
@enduml

