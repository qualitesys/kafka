" y2="823.8164"/><polygon fill="#181818" points="1010,813.8164,1014,823.8164,1018,813.8164,1014,817.8164" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="1014" x2="1014" y1="857.7852" y2="877.7852"/><polygon fill="#181818" points="1010,867.7852,1014,877.7852,1018,867.7852,1014,871.7852" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="1014" x2="1014" y1="962.3516" y2="984.918"/><polygon fill="#181818" points="1010,974.918,1014,984.918,1018,974.918,1014,978.918" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="1014" x2="1014" y1="1032.8555" y2="1052.8555"/><polygon fill="#181818" points="1010,1042.8555,1014,1052.8555,1018,1042.8555,1014,1046.8555" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[31a8b2df78856dc768c650be066385f0]
@startuml
!pragma layout smetana
start
note right
constructor DescribeProducersResult(Map<TopicPartition,KafkaFuture<PartitionProducerState>>futures)
end note
:this.futures=futures;
end
start
note right
KafkaFuture<PartitionProducerState>partitionResult(final TopicPartitionpartition)
end note
if (future==null ) then (yes) 
:throw new IllegalArgumentException("Topic partition "+
partition+" was not included in the request");;
endif 
:return future;;
stop
end
start
note right
KafkaFuture<Map<TopicPartition,PartitionProducerState>>all()
end note
:return KafkaFuture.allOf(futures.values()
.toArray(new KafkaFuture[0])).thenApply(nil->{Map<TopicPartition,
PartitionProducerState>results=new HashMap<>(futures.size());for (Map.Entry<TopicPartition,KafkaFuture<PartitionProducerState>>entry:futures.entrySet()){try {results.put(entry.getKey(),entry.getValue().get());}catch (InterruptedException|ExecutionExceptione){throw new KafkaException(e);}}return results;});;
stop
end
start
note right
constructor PartitionProducerState(List<ProducerState>activeProducers)
end note
:this.activeProducers=activeProducers;
end
start
note right
List<ProducerState>activeProducers()
end note
:return activeProducers;;
stop
end
start
note right
StringtoString()
end note
:return "PartitionProducerState("+"activeProducers="+
activeProducers+')';;
stop
end
@enduml

