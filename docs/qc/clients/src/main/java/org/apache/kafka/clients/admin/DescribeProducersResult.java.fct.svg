1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="1350" x2="1350" y1="935.5781" y2="958.1445"/><polygon fill="#181818" points="1346,948.1445,1350,958.1445,1354,948.1445,1350,952.1445" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="1350" x2="1350" y1="992.1133" y2="1012.1133"/><polygon fill="#181818" points="1346,1002.1133,1350,1012.1133,1354,1002.1133,1350,1006.1133" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[b1065d6d4a605781c2202c219b473035]
@startuml
!pragma layout smetana
start
note right
constructor DescribeProducersResult(Map<TopicPartition,
KafkaFuture<PartitionProducerState>>futures)
end note
:this.futures=futures;
end
start
note right
KafkaFuture<PartitionProducerState>partitionResult(final TopicPartitionpartition)
end note
if (future==null ) then (yes) 
:throw new IllegalArgumentException("Topic partition "+partition+" was not included in the request");;
endif 
:return future;;
stop
end
start
note right
KafkaFuture<Map<TopicPartition,PartitionProducerState>>all()
end note
:return KafkaFuture.allOf(futures.values().toArray(new KafkaFuture[0])).thenApply(nil->{Map<TopicPartition,PartitionProducerState>results=new HashMap<>(futures.size());for (Map.Entry<TopicPartition,KafkaFuture<PartitionProducerState>>entry:futures.entrySet()){try {results.put(entry.getKey(),entry.getValue().get());}catch (InterruptedException|ExecutionExceptione){throw new KafkaException(e);}}return results;});;
stop
end
start
note right
constructor PartitionProducerState(List<ProducerState>activeProducers)
end note
:this.activeProducers=activeProducers;
end
start
note right
List<ProducerState>activeProducers()
end note
:return activeProducers;;
stop
end
start
note right
StringtoString()
end note
:return "PartitionProducerState("+"activeProducers="+activeProducers+')';;
stop
end
@enduml

