354,801.0117,1350,805.0117" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="1350" x2="1350" y1="844.9805" y2="864.9805"/><polygon fill="#181818" points="1346,854.9805,1350,864.9805,1354,854.9805,1350,858.9805" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="1350" x2="1350" y1="949.5469" y2="972.1133"/><polygon fill="#181818" points="1346,962.1133,1350,972.1133,1354,962.1133,1350,966.1133" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="1350" x2="1350" y1="1020.0508" y2="1040.0508"/><polygon fill="#181818" points="1346,1030.0508,1350,1040.0508,1354,1030.0508,1350,1034.0508" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[f09511e1b608d3ff02295078a00b2d3b]
@startuml
!pragma layout smetana
start
note right
constructor DescribeProducersResult(Map<TopicPartition,
KafkaFuture<PartitionProducerState>>futures)
end note
:this.futures=futures;
end
start
note right
KafkaFuture<PartitionProducerState>partitionResult(final TopicPartitionpartition)
end note
if (future==null ) then (yes) 
:throw new IllegalArgumentException("Topic partition "+
partition+" was not included in the request");;
endif 
:return future;;
stop
end
start
note right
KafkaFuture<Map<TopicPartition,PartitionProducerState>>all()
end note
:return KafkaFuture.allOf(futures.values().toArray(new KafkaFuture[0])).thenApply(nil->{Map<TopicPartition,PartitionProducerState>results=new HashMap<>(futures.size());for (Map.Entry<TopicPartition,KafkaFuture<PartitionProducerState>>entry:futures.entrySet()){try {results.put(entry.getKey(),entry.getValue().get());}catch (InterruptedException|ExecutionExceptione){throw new KafkaException(e);}}return results;});;
stop
end
start
note right
constructor PartitionProducerState(List<ProducerState>activeProducers)
end note
:this.activeProducers=activeProducers;
end
start
note right
List<ProducerState>activeProducers()
end note
:return activeProducers;;
stop
end
start
note right
StringtoString()
end note
:return "PartitionProducerState("+"activeProducers="+
activeProducers+')';;
stop
end
@enduml

