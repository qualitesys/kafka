@startuml
!pragma layout smetana
start
note right
constructor DescribeProducersResult(Map<TopicPartition,
KafkaFuture<PartitionProducerState>> futures)
end note
:this.futures=futures;;
end
start
note right
KafkaFuture<PartitionProducerState> partitionResult(final TopicPartition partition)
end note
:KafkaFuture<PartitionProducerState> future=futures.get(partition);;
if (future==null ) then (yes) 
:throw new IllegalArgumentException("Topic partition "+
partition+" was not included in the request");;
stop
endif 
:return future;;
stop
end
start
note right
KafkaFuture<Map<TopicPartition,PartitionProducerState>> all()
end note
:return KafkaFuture.allOf(futures.values().toArray(new KafkaFuture[0])).thenApply(nil->{Map<TopicPartition,
PartitionProducerState> results=new HashMap<>(futures.size());for (Map.Entry<TopicPartition,
KafkaFuture<PartitionProducerState>> entry:futures.entrySet()){try {results.put(entry.getKey(),
entry.getValue().get());}catch (InterruptedException |ExecutionException e){throw new KafkaException(e);}}return results;});;
stop
end
start
note right
constructor PartitionProducerState(List<ProducerState> activeProducers)
end note
:this.activeProducers=activeProducers;;
end
start
note right
List<ProducerState> activeProducers()
end note
:return activeProducers;;
stop
end
start
note right
String toString()
end note
:return "PartitionProducerState("+"activeProducers="+
activeProducers+')';;
stop
end
@enduml

