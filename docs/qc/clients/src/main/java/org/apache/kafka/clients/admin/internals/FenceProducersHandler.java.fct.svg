 font-weight="bold" lengthAdjust="spacing" textLength="71" x="5" y="527.8906">end note</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="179" x="5" y="544.1875">switch (switch (error))</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" text-decoration="wavy underline" textLength="73" x="5" y="560.4844">endswith</text><text fill="#FF0000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="106" x="10" y="576.7813">Syntax Error?</text><!--MD5=[7777d8e97d7d6d1cb279bc67fe338220]
@startuml
!pragma layout smetana
start
note right
constructor FenceProducersHandler(LogContextlogContext)
end note
:this.log=logContext.logger(FenceProducersHandler.class );;
:this.lookupStrategy=new CoordinatorStrategy(FindCoordinatorRequest.CoordinatorType.TRANSACTION,
logContext);;
end
start
note right
AdminApiFuture.SimpleAdminApiFuture<CoordinatorKey,
ProducerIdAndEpoch>newFuture(Collection<String>transactionalIds)
end note
:return AdminApiFuture.forKeys(buildKeySet(transactionalIds));;
stop
end
start
note right
Set<CoordinatorKey>buildKeySet(Collection<String>transactionalIds)
end note
:return transactionalIds.stream().map(CoordinatorKey::byTransactionalId)
.collect(Collectors.toSet());;
stop
end
start
note right
StringapiName()
end note
:return "fenceProducer";;
stop
end
start
note right
AdminApiLookupStrategy<CoordinatorKey>lookupStrategy()
end note
:return lookupStrategy;;
stop
end
start
note right
InitProducerIdRequest.BuilderbuildSingleRequest(intbrokerId,
CoordinatorKeykey)
end note
if (key.type!=FindCoordinatorRequest.CoordinatorType.TRANSACTION) then (yes) 
:throw new IllegalArgumentException("Invalid group coordinator key "+
key+" when building  InitProducerId  request");;
stop
endif 
:InitProducerIdRequestDatadata=new InitProducerIdRequestData()
.setProducerEpoch(ProducerIdAndEpoch.NONE.epoch).setProducerId(ProducerIdAndEpoch.NONE.producerId).setTransactionalId(key.idValue).setTransactionTimeoutMs(1);;
:return new InitProducerIdRequest.Builder(data);;
stop
end
start
note right
ApiResult<CoordinatorKey,ProducerIdAndEpoch>handleSingleResponse(Nodebroker,
CoordinatorKeykey,AbstractResponseabstractResponse)
end note
:InitProducerIdResponseresponse=(InitProducerIdResponse)abstractResponse;;
:Errorserror=Errors.forCode(response.data()
.errorCode());;
if (error!=Errors.NONE) then (yes) 
:return handleError(key,error);;
stop
endif 
:Map<CoordinatorKey,ProducerIdAndEpoch>completed=Collections.singletonMap(key,
new ProducerIdAndEpoch(response.data().producerId(),
response.data().producerEpoch()));;
:return new ApiResult<>(completed,Collections.emptyMap(),
Collections.emptyList());;
stop
end
start
note right
ApiResult<CoordinatorKey,ProducerIdAndEpoch>handleError(CoordinatorKeytransactionalIdKey,
Errorserror)
end note
switch (switch (error))
endswith
end
@enduml

