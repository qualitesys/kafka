@startuml
!pragma layout smetana
start
note right
doubleconvert(longtimeMs,TimeUnitunit)
end note
:return timeMs*1000.0*1000.0;;
stop
:return timeMs*1000.0;;
stop
:return timeMs;;
stop
:return timeMs/1000.0;;
stop
:return timeMs/(60.0*1000.0);;
stop
:return timeMs/(60.0*60.0*1000.0);;
stop
:return timeMs/(24.0*60.0*60.0*1000.0);;
stop
:throw new IllegalStateException("Unknown unit: "+
unit);;
end
start
note right
Map<String,String>getTags(String... keyValue)
end note
if ((keyValue.length%2)!=0) then (yes) 
:throw new IllegalArgumentException("keyValue needs to be specified in pairs");;
endif 
:i+=2;
:tags.put(keyValue[i],keyValue[i+1]);
:return tags;;
stop
end
@enduml

