"515" x2="515" y1="568.9648" y2="588.9648"/><polygon fill="#181818" points="511,578.9648,515,588.9648,519,578.9648,515,582.9648" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="515" x2="515" y1="622.9336" y2="642.9336"/><polygon fill="#181818" points="511,632.9336,515,642.9336,519,632.9336,515,636.9336" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[3f21f43b81e383dd39863fbfffc569b5]
@startuml
!pragma layout smetana
start
note right
doubleconvert(longtimeMs,TimeUnitunit)
end note
:switch (unit){case NANOSECONDS:return timeMs*1000.0*1000.0;
:case MICROSECONDS:return timeMs*1000.0;case MILLISECONDS:return timeMs;
:case SECONDS:return timeMs/1000.0;case MINUTES:return timeMs/(60.0*1000.0);
:case HOURS:return timeMs/(60.0*60.0*1000.0);case DAYS:return timeMs/(24.0*60.0*60.0*1000.0);default :throw new IllegalStateException("Unknown unit: "+
unit);};
end
start
note right
Map<String,String>getTags(String... keyValue)
end note
if ((keyValue.length%2)!=0) then (yes) 
:throw new IllegalArgumentException("keyValue needs to be specified in pairs");;
stop
endif 
:tags.put(keyValue[i],keyValue[i+1]);;
:return tags;;
stop
end
@enduml

