roke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="965" x2="965" y1="620.5742" y2="640.5742"/><polygon fill="#181818" points="961,630.5742,965,640.5742,969,630.5742,965,634.5742" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[7d1ad7d0a8c8c3493e91313d25107110]
@startuml
!pragma layout smetana
start
note right
doubleconvert(longtimeMs,TimeUnitunit)
end note
switch (switch unit)
case (case NANOSECONDS:) 
:return timeMs*1000.0*1000.0;;
stop
case (case MICROSECONDS:) 
:return timeMs*1000.0;;
stop
case (case MILLISECONDS:) 
:return timeMs;;
stop
case (case SECONDS:) 
:return timeMs/1000.0;;
stop
case (case MINUTES:) 
:return timeMs/(60.0*1000.0);;
stop
case (case HOURS:) 
:return timeMs/(60.0*60.0*1000.0);;
stop
case (case DAYS:) 
:return timeMs/(24.0*60.0*60.0*1000.0);;
stop
case (default :) 
:throw new IllegalStateException("Unknown unit: "+
unit);;
stop
endswitch
end
start
note right
Map<String,String>getTags(String... keyValue)
end note
if ((keyValue.length%2)!=0) then (yes) 
:throw new IllegalArgumentException("keyValue needs to be specified in pairs");;
stop
endif 
:Map<String,String>tags=new LinkedHashMap<>(keyValue.length/2);;
:tags.put(keyValue[i],keyValue[i+1]);;
:return tags;;
stop
end
@enduml

