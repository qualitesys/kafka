if (!this.transactionInFlight) then (yes) 
:this.sent.add(record);
else (no)
:this.uncommittedSends.add(record);
endif 
if (autoComplete) then (yes) 
:completion.complete(null );
else (no)
:this.completions.addLast(completion);
endif 
:return future;;
stop
