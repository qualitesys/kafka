if (!this.cluster.partitionsForTopic(record.topic())
.isEmpty()) then (yes) 
:partition=partition(record,this.cluster);
else (no)
:keySerializer.serialize(record.topic(),record.key());
:valueSerializer.serialize(record.topic(),
record.value());
