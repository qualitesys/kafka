note right
intpartition(ProducerRecord<K,V>record,Clustercluster)
end note
if (partition!=null ) then (yes) 
if (partition<0||partition>=numPartitions) then (yes) 
:throw new IllegalArgumentException("Invalid partition given with record: "+
partition+" is not in the range [0..."+numPartitions+
