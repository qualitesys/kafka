start
note right
Future<RecordMetadata>send(ProducerRecord<K,
V>record,Callbackcallback)
end note
if (this.closed) then (yes) 
:throw new IllegalStateException("MockProducer is already closed.");;
endif 
if (this.producerFenced) then (yes) 
:throw new KafkaException("MockProducer is fenced.",
new ProducerFencedException("Fenced"));;
