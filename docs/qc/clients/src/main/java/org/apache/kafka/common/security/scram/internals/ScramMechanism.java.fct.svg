@startuml
!pragma layout smetana
:map.put(mech.mechanismName,mech);
:MECHANISMS_MAP=Collections.unmodifiableMap(map);
start
note right
constructor ScramMechanism(StringhashAlgorithm,StringmacAlgorithm,intminIterations)
end note
:this.mechanismName="SCRAM-"+hashAlgorithm;
:this.hashAlgorithm=hashAlgorithm;
:this.macAlgorithm=macAlgorithm;
:this.minIterations=minIterations;
end
start
note right
StringmechanismName()
end note
:return mechanismName;;
stop
end
start
note right
StringhashAlgorithm()
end note
:return hashAlgorithm;;
stop
end
start
note right
StringmacAlgorithm()
end note
:return macAlgorithm;;
stop
end
start
note right
intminIterations()
end note
