@startuml
!pragma layout smetana
start
note right
constructor ScramMechanism(StringhashAlgorithm,
StringmacAlgorithm,intminIterations)
end note
end
start
note right
StringmechanismName()
end note
:return mechanismName;;
stop
end
start
note right
StringhashAlgorithm()
end note
:return hashAlgorithm;;
stop
end
start
note right
StringmacAlgorithm()
end note
:return macAlgorithm;;
stop
end
start
note right
intminIterations()
end note
:return minIterations;;
stop
end
start
note right
ScramMechanismforMechanismName(StringmechanismName)
end note
:return MECHANISMS_MAP.get(mechanismName);;
stop
end
start
note right
Collection<String>mechanismNames()
end note
:return MECHANISMS_MAP.keySet();;
stop
end
start
note right
booleanisScram(StringmechanismName)
end note
:return MECHANISMS_MAP.containsKey(mechanismName);;
stop
end
@enduml

