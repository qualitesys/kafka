@startuml
!pragma layout smetana
start
note right
constructor OffsetStorageReaderImpl(OffsetBackingStorebackingStore,
Stringnamespace,ConverterkeyConverter,ConvertervalueConverter)
end note
end
:return offsets(Collections.singletonList(partition))
.get(partition);;
stop
if (closed.get()) then (yes) 
:throw new ConnectException("Offset reader is closed. This is likely because the task has already been "+
"scheduled to stop but has taken longer than the graceful shutdown "+
"period to do so.");;
endif 
:throw new ConnectException("Offset reader closed while attempting to read offsets. This is likely because "+
"the task was been scheduled to stop but has taken longer than the "+
"graceful shutdown period to do so.");;
:throw new ConnectException("Failed to fetch offsets.",e);;
if (!serializedToOriginal.containsKey(rawEntry.getKey())) then (yes) 
endif 
:return result;;
stop
start
note right
void close()
end note
if (!closed.getAndSet(true)) then (yes) 
endif 
end
@enduml

