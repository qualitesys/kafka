@startuml
!pragma layout smetana
start
note right
void main(String[]args)
end note
if (args.length<2||Arrays.asList(args).contains("- -help")) then (yes) 
:log.info("Usage: ConnectStandalone worker.properties connector1.properties [connector2.properties ...]");
:Exit.exit(1);
endif 
:log.info("Kafka Connect standalone worker initializing ...");
:initInfo.logAll();
:log.info("Scanning for plugin classes. This might take a moment ...");
:plugins.compareAndSwapWithDelegatingLoader();
:log.debug("Kafka cluster ID: {}",kafkaClusterId);
:rest.initializeServer();
:log.info("Kafka Connect standalone worker initialization took {}ms",
time.hiResClockMs()-initStart);
:connect.start();
if (error!=null ) then (yes) 
:log.error("Failed to create job for {}",
connectorPropsFile);
else (no)
:log.info("Created connector {}",info.result().name());
endif 
:herder.putConnectorConfig(connectorProps.get(ConnectorConfig.NAME_CONFIG),
connectorProps,false,cb);
:cb.get();
:log.error("Stopping after connector error",t);
:connect.stop();
:Exit.exit(3);
:connect.awaitStop();
:log.error("Stopping due to error",t);
:Exit.exit(2);
end
@enduml

