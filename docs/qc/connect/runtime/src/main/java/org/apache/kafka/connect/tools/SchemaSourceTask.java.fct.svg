@startuml
!pragma layout smetana
start
note right
Stringversion()
end note
:return new SchemaSourceConnector().version();;
stop
end
start
note right
void start(Map<String,String>props)
end note
:throw new ConnectException("Invalid SchemaSourceTask configuration",e);;
if (previousOffset!=null ) then (yes) 
else (no)
endif 
end
start
note right
List<SourceRecord>poll()
end note
if (count<maxNumMsgs) then (yes) 
if (throttler.shouldThrottle(seqno-startingSeqno,
sendStartMs)) then (yes) 
endif 
if (!multipleSchema||count%2==0) then (yes) 
else (no)
endif 
:return Collections.singletonList(srcRecord);;
stop
else (no)
:return Collections.emptyList();;
stop
endif 
end
start
note right
void stop()
end note
end
@enduml

