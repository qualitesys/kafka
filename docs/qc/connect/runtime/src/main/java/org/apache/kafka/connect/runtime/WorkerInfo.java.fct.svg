@startuml
!pragma layout smetana
:RUNTIME=ManagementFactory.getRuntimeMXBean();
:OS=ManagementFactory.getOperatingSystemMXBean();
start
note right
constructor WorkerInfo()
end note
:this.values=new LinkedHashMap<>();
:addRuntimeInfo();
:addSystemInfo();
end
start
note right
void logAll()
end note
:b.append(getClass().getSimpleName());
:b.append(" values: ");
:b.append(Utils.NL);
:b.append('\t');
:b.append(entry.getKey());
:b.append(" = ");
:b.append(format(entry.getValue()));
:b.append(Utils.NL);
:log.info(b.toString());
end
start
note right
Objectformat(Objectvalue)
end note
:return value==null ? String.valueOf("NA"):value;;
stop
end
start
note right
void addRuntimeInfo()
end note
:values.put("jvm.args",Utils.join(jvmArgs,", "));
:values.put("jvm.spec",Utils.join(jvmSpec,", "));
:values.put("jvm.classpath",RUNTIME.getClassPath());
end
start
note right
void addSystemInfo()
end note
:values.put("os.spec",Utils.join(osInfo,", "));
:values.put("os.vcpus",String.valueOf(OS.getAvailableProcessors()));
end
@enduml

