y1="780.5156" y2="800.5156"/><polygon fill="#181818" points="328.5,790.5156,332.5,800.5156,336.5,790.5156,332.5,794.5156" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[cae0c4d964006e8c78add71689acd100]
@startuml
!pragma layout smetana
start
note right
void validatePartitions(StringconfigName,
intfactor)
end note
if (factor!=TopicAdmin.NO_PARTITIONS&&factor<1) then (yes) 
:throw new ConfigException(configName,factor,
"Number of partitions must be positive, or -1 to use the broker's default");;
endif 
end
start
note right
void validateReplicationFactor(StringconfigName,
shortfactor)
end note
if (factor!=TopicAdmin.NO_REPLICATION_FACTOR&&factor<1) then (yes) 
:throw new ConfigException(configName,factor,
"Replication factor must be positive and not larger than the number of brokers in the Kafka cluster,
 or -1 to use the broker's default");;
endif 
end
start
note right
ConfigDefconfigDef(Stringgroup,shortdefaultReplicationFactor,
intdefaultParitionCount)
end note
:return configDef;;
stop
end
start
note right
ConfigDefdefaultGroupConfigDef()
end note
:return configDef;;
stop
end
@enduml

