@startuml
!pragma layout smetana
start
note right
constructor ClusterConfigState(longoffset,
SessionKeysessionKey,Map<String,Integer>connectorTaskCounts,
Map<String,Map<String,String>>connectorConfigs,
Map<String,TargetState>connectorTargetStates,
Map<ConnectorTaskId,Map<String,String>>taskConfigs,
Map<String,Integer>connectorTaskCountRecords,
Map<String,Integer>connectorTaskConfigGenerations,
Set<String>connectorsPendingFencing,Set<String>inconsistentConnectors)
end note
:this(offset,sessionKey,connectorTaskCounts,
connectorConfigs,connectorTargetStates,taskConfigs,
connectorTaskCountRecords,connectorTaskConfigGenerations,
connectorsPendingFencing,inconsistentConnectors,
null );
end
start
note right
constructor ClusterConfigState(longoffset,
SessionKeysessionKey,Map<String,Integer>connectorTaskCounts,
Map<String,Map<String,String>>connectorConfigs,
Map<String,TargetState>connectorTargetStates,
Map<ConnectorTaskId,Map<String,String>>taskConfigs,
Map<String,Integer>connectorTaskCountRecords,
Map<String,Integer>connectorTaskConfigGenerations,
Set<String>connectorsPendingFencing,Set<String>inconsistentConnectors,
WorkerConfigTransformerconfigTransformer)
end note
:this.offset=offset;
:this.sessionKey=sessionKey;
:this.connectorTaskCounts=connectorTaskCounts;
:this.connectorConfigs=connectorConfigs;
:this.connectorTargetStates=connectorTargetStates;
:this.taskConfigs=taskConfigs;
:this.connectorTaskCountRecords=connectorTaskCountRecords;
:this.connectorTaskConfigGenerations=connectorTaskConfigGenerations;
:this.connectorsPendingFencing=connectorsPendingFencing;
:this.inconsistentConnectors=inconsistentConnectors;
:this.configTransformer=configTransformer;
end
start
note right
longoffset()
end note
:return offset;;
stop
end
start
note right
SessionKeysessionKey()
end note
:return sessionKey;;
stop
end
start
note right
booleancontains(Stringconnector)
end note
:return connectorConfigs.containsKey(connector);;
stop
end
start
note right
Set<String>connectors()
end note
:return connectorConfigs.keySet();;
stop
end
start
note right
Map<String,String>connectorConfig(Stringconnector)
end note
if (configTransformer!=null ) then (yes) 
:configs=configTransformer.transform(connector,
configs);
endif 
:return configs;;
stop
end
start
note right
Map<String,String>rawConnectorConfig(Stringconnector)
end note
:return connectorConfigs.get(connector);;
stop
end
start
note right
TargetStatetargetState(Stringconnector)
end note
:return connectorTargetStates.get(connector);;
stop
end
start
note right
Map<String,String>taskConfig(ConnectorTaskIdtask)
end note
if (configTransformer!=null ) then (yes) 
:configs=configTransformer.transform(task.connector(),
configs);
endif 
:return configs;;
stop
end
start
note right
Map<String,String>rawTaskConfig(ConnectorTaskIdtask)
end note
:return taskConfigs.get(task);;
stop
end
start
note right
List<Map<String,String>>allTaskConfigs(Stringconnector)
end note
if (taskConfigEntry.getKey().connector().equals(connector)) then (yes) 
if (configTransformer!=null ) then (yes) 
:configs=configTransformer.transform(connector,
configs);
endif 
:taskConfigs.put(taskConfigEntry.getKey().task(),
configs);
endif 
:return Collections.unmodifiableList(new ArrayList<>(taskConfigs.values()));;
stop
end
start
note right
inttaskCount(StringconnectorName)
end note
:return count==null ? 0:count;;
stop
end
start
note right
booleanpendingFencing(StringconnectorName)
end note
:return connectorsPendingFencing.contains(connectorName);;
stop
end
start
note right
List<ConnectorTaskId>tasks(StringconnectorName)
end note
if (inconsistentConnectors.contains(connectorName)) then (yes) 
:return Collections.emptyList();;
stop
endif 
if (numTasks==null ) then (yes) 
:return Collections.emptyList();;
stop
endif 
:taskIndex++;
:taskIds.add(taskId);
:return Collections.unmodifiableList(taskIds);;
stop
end
start
note right
IntegertaskCountRecord(Stringconnector)
end note
:return connectorTaskCountRecords.get(connector);;
stop
end
start
note right
IntegertaskConfigGeneration(Stringconnector)
end note
:return connectorTaskConfigGenerations.get(connector);;
stop
end
start
note right
Set<String>inconsistentConnectors()
end note
:return inconsistentConnectors;;
stop
end
start
note right
StringtoString()
end note
:return "ClusterConfigState{"+"offset="+offset+
", sessionKey="+(sessionKey!=null ? String.valueOf("[hidden]"):String.valueOf("null"))+
", connectorTaskCounts="+connectorTaskCounts+
", connectorConfigs="+connectorConfigs+", taskConfigs="+
taskConfigs+", inconsistentConnectors="+inconsistentConnectors+
'}';;
stop
end
start
note right
booleanequals(Objecto)
end note
if (this==o) then (yes) 
:return true;;
stop
endif 
if (o==null ||getClass()!=o.getClass()) then (yes) 
:return false;;
stop
endif 
:return offset==that.offset&&Objects.equals(sessionKey,
that.sessionKey)&&Objects.equals(connectorTaskCounts,
that.connectorTaskCounts)&&Objects.equals(connectorConfigs,
that.connectorConfigs)&&Objects.equals(connectorTargetStates,
that.connectorTargetStates)&&Objects.equals(taskConfigs,
that.taskConfigs)&&Objects.equals(inconsistentConnectors,
that.inconsistentConnectors)&&Objects.equals(configTransformer,
that.configTransformer);;
stop
end
start
note right
inthashCode()
end note
:return Objects.hash(offset,sessionKey,connectorTaskCounts,
connectorConfigs,connectorTargetStates,taskConfigs,
inconsistentConnectors,configTransformer);;
stop
end
@enduml

