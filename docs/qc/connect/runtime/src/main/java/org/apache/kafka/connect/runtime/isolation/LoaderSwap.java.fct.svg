@startuml
!pragma layout smetana
start
note right
constructor LoaderSwap(ClassLoadersavedLoader)
end note
:this.savedLoader=savedLoader;;
end
start
note right
void close()
end note
:Plugins.compareAndSwapLoaders(savedLoader);;
end
@enduml

