@startuml
!pragma layout smetana
start
note right
ByteBufferserializeMetadata(ExtendedWorkerStateworkerState,
booleansessioned)
end note
:connectProtocolHeader.writeTo(buffer);
:CONFIG_STATE_V1.write(buffer,configState);
:ALLOCATION_V1.write(buffer,allocation);
:buffer.flip();
:return buffer;;
stop
end
start
note right
JoinGroupRequestProtocolCollectionmetadataRequest(ExtendedWorkerStateworkerState,
booleansessioned)
end note
if (sessioned) then (yes) 
:joinGroupRequestProtocols.add(new JoinGroupRequestProtocol()
.setName(SESSIONED.protocol()).setMetadata(IncrementalCooperativeConnectProtocol.serializeMetadata(workerState,
true).array()));
endif 
:joinGroupRequestProtocols.add(new JoinGroupRequestProtocol()
.setName(COMPATIBLE.protocol()).setMetadata(IncrementalCooperativeConnectProtocol.serializeMetadata(workerState,
false).array()));
:joinGroupRequestProtocols.add(new JoinGroupRequestProtocol()
.setName(EAGER.protocol()).setMetadata(ConnectProtocol.serializeMetadata(workerState)
.array()));
:return new JoinGroupRequestProtocolCollection(joinGroupRequestProtocols.iterator());;
stop
end
start
note right
ExtendedWorkerStatedeserializeMetadata(ByteBufferbuffer)
end note
:checkVersionCompatibility(version);
:return new ExtendedWorkerState(url,configOffset,
assignment);;
stop
end
start
note right
ByteBufferserializeAssignment(ExtendedAssignmentassignment,
booleansessioned)
end note
if (assignment==null ||ExtendedAssignment.empty()
.equals(assignment)) then (yes) 
:return null ;;
stop
endif 
:protocolHeader.writeTo(buffer);
:ASSIGNMENT_V1.write(buffer,struct);
:buffer.flip();
:return buffer;;
stop
end
start
note right
ExtendedAssignmentdeserializeAssignment(ByteBufferbuffer)
end note
if (buffer==null ) then (yes) 
:return null ;;
stop
endif 
:checkVersionCompatibility(version);
:return ExtendedAssignment.fromStruct(version,
struct);;
stop
end
start
note right
void checkVersionCompatibility(shortversion)
end note
if (version<CONNECT_PROTOCOL_V0) then (yes) 
:throw new SchemaException("Unsupported subscription version: "+
version);;
endif 
end
@enduml

