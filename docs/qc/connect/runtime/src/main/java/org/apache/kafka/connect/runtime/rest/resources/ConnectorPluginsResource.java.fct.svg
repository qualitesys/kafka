@startuml
!pragma layout smetana
start
note right
constructor ConnectorPluginsResource(Herderherder)
end note
:this.herder=herder;
:this.connectorPlugins=new ArrayList<>();
:this.requestTimeoutMs=DEFAULT_REST_REQUEST_TIMEOUT_MS;
:addConnectorPlugins(herder.plugins().sinkConnectors(),
SINK_CONNECTOR_EXCLUDES);
:addConnectorPlugins(herder.plugins().sourceConnectors(),
SOURCE_CONNECTOR_EXCLUDES);
:addConnectorPlugins(herder.plugins().transformations(),
TRANSFORM_EXCLUDES);
:addConnectorPlugins(herder.plugins().predicates(),
Collections.emptySet());
:addConnectorPlugins(herder.plugins().converters(),
Collections.emptySet());
:addConnectorPlugins(herder.plugins().headerConverters(),
Collections.emptySet());
end
:plugins.stream().filter(p->!excludes.contains(p.pluginClass()))
.map(PluginInfo::new ).forEach(connectorPlugins::add);
start
note right
void requestTimeout(longrequestTimeoutMs)
end note
:this.requestTimeoutMs=requestTimeoutMs;
end
start
note right
ConfigInfosvalidateConfigs(final @PathParam ("pluginName")StringpluginName,
final Map<String,String>connectorConfig)
end note
if (includedConnType!=null &&!normalizedPluginName(includedConnType)
.endsWith(normalizedPluginName(pluginName))) then (yes) 
:throw new BadRequestException("Included connector type "+
includedConnType+" does not match request type "+
pluginName);;
endif 
:herder.validateConnectorConfig(connectorConfig,
validationCallback,false);
:return validationCallback.get(requestTimeoutMs,
TimeUnit.MILLISECONDS);;
stop
:throw new ConnectRestException(Response.Status.INTERNAL_SERVER_ERROR.getStatusCode(),
"Request timed out");;
:throw new ConnectRestException(Response.Status.INTERNAL_SERVER_ERROR.getStatusCode(),
"Request interrupted");;
end
start
note right
List<PluginInfo>listConnectorPlugins(@DefaultValue ("true")@QueryParam ("connectorsOnly")@Parameter (description="Whether to list only connectors instead of all plugins")booleanconnectorsOnly)
end note
if (connectorsOnly) then (yes) 
:return Collections.unmodifiableList(connectorPlugins.stream()
.filter(p->PluginType.SINK.toString().equals(p.type())||PluginType.SOURCE.toString()
.equals(p.type())).collect(Collectors.toList()));;
stop
else (no)
:return Collections.unmodifiableList(connectorPlugins);;
stop
endif 
end
start
note right
List<ConfigKeyInfo>getConnectorConfigDef(final @PathParam ("pluginName")StringpluginName)
end note
:return herder.connectorPluginConfig(pluginName);;
stop
end
start
note right
StringnormalizedPluginName(StringpluginName)
end note
:return pluginName.endsWith(ALIAS_SUFFIX)&&pluginName.length()>ALIAS_SUFFIX.length()? pluginName.substring(0,
pluginName.length()-ALIAS_SUFFIX.length()):pluginName;;
stop
end
@enduml

