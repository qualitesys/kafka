@startuml
!pragma layout smetana
start
note right
constructor RootResource(Herderherder)
end note
:this.herder=herder;;
end
start
note right
void requestTimeout(longrequestTimeoutMs)
end note
end
start
note right
ServerInfoserverInfo()
end note
:return new ServerInfo(herder.kafkaClusterId());;
stop
end
@enduml

