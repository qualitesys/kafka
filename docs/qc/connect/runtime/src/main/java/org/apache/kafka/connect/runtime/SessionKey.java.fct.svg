@startuml
!pragma layout smetana
start
note right
constructor SessionKey(SecretKeykey,longcreationTimestamp)
end note
end
start
note right
SecretKeykey()
end note
:return key;;
stop
end
start
note right
longcreationTimestamp()
end note
:return creationTimestamp;;
stop
end
start
note right
booleanequals(Objecto)
end note
if (this==o) then (yes) 
:return true;;
stop
endif 
if (o==null ||getClass()!=o.getClass()) then (yes) 
:return false;;
stop
endif 
:return creationTimestamp==that.creationTimestamp&&key.equals(that.key);;
stop
end
start
note right
inthashCode()
end note
:return Objects.hash(key,creationTimestamp);;
stop
end
@enduml

