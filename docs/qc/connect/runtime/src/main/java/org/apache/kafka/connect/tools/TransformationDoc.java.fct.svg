x2="253.5" y1="874.9297" y2="894.9297"/><polygon fill="#181818" points="249.5,884.9297,253.5,894.9297,257.5,884.9297,253.5,888.9297" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="253.5" x2="253.5" y1="947.4961" y2="970.0625"/><polygon fill="#181818" points="249.5,960.0625,253.5,970.0625,257.5,960.0625,253.5,964.0625" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="253.5" x2="253.5" y1="1004.0313" y2="1024.0313"/><polygon fill="#181818" points="249.5,1014.0313,253.5,1024.0313,257.5,1014.0313,253.5,1018.0313" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[b42fa7b02fca8ee35e41ea880c3daa61]
@startuml
!pragma layout smetana
start
note right
constructor DocInfo(StringtransformationName,Stringoverview,ConfigDefconfigDef)
end note
:this.transformationName=transformationName;
:this.overview=overview;
:this.configDef=configDef;
end
start
note right
void printTransformationHtml(PrintStreamout,DocInfodocInfo)
end note
:out.println("<div id=\""+docInfo.transformationName+
"\">");
:out.print("<h5>");
:out.print("<a href=\"#"+docInfo.transformationName+
"\">"+docInfo.transformationName+"</a>");
:out.println("</h5>");
:out.println(docInfo.overview);
:out.println("<p/>");
:out.println(docInfo.configDef.toHtml(6,key->docInfo.transformationName+
"_"+key));
:out.println("</div>");
end
start
note right
void printHtml(PrintStreamout)
end note
:printTransformationHtml(out,docInfo);
end
start
note right
void main(String... args)
end note
:printHtml(System.out);
end
@enduml

