@startuml
!pragma layout smetana
start
note right
constructor DocInfo(StringtransformationName,
Stringoverview,ConfigDefconfigDef)
end note
:this.transformationName=transformationName;
:this.overview=overview;
:this.configDef=configDef;
end
start
note right
void printTransformationHtml(PrintStreamout,
DocInfodocInfo)
end note
:out.println("<div id=\""+docInfo.transformationName+"\">");
:out.print("<h5>");
:out.print("<a href=\"#"+docInfo.transformationName+"\">"+docInfo.transformationName+"</a>");
:out.println("</h5>");
:out.println(docInfo.overview);
:out.println("<p/>");
:out.println(docInfo.configDef.toHtml(6,key->docInfo.transformationName+"_"+key));
:out.println("</div>");
end
start
note right
void printHtml(PrintStreamout)
end note
:printTransformationHtml(out,docInfo);
end
start
note right
void main(String... args)
end note
:printHtml(System.out);
end
@enduml

