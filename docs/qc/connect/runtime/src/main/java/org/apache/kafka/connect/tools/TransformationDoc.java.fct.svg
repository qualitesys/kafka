;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="330.5" x2="330.5" y1="962.125" y2="982.125"/><polygon fill="#181818" points="326.5,972.125,330.5,982.125,334.5,972.125,330.5,976.125" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[8114e6cd051ff4a86e32c6bb8f39ca17]
@startuml
!pragma layout smetana
start
note right
constructor DocInfo(StringtransformationName,Stringoverview,ConfigDefconfigDef)
end note
:this.transformationName=transformationName;
:this.overview=overview;
:this.configDef=configDef;
end
start
note right
void printTransformationHtml(PrintStreamout,DocInfodocInfo)
end note
:out.println("<div id=\""+docInfo.transformationName+"\">");
:out.print("<h5>");
:out.print("<a href=\"#"+docInfo.transformationName+"\">"+docInfo.transformationName+"</a>");
:out.println("</h5>");
:out.println(docInfo.overview);
:out.println("<p/>");
:out.println(docInfo.configDef.toHtml(6,key->docInfo.transformationName+"_"+key));
:out.println("</div>");
end
start
note right
void printHtml(PrintStreamout)
end note
:printTransformationHtml(out,docInfo);
end
start
note right
void main(String... args)
end note
:printHtml(System.out);
end
@enduml

