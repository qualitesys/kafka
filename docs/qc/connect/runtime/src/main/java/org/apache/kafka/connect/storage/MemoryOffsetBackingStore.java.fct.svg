@startuml
!pragma layout smetana
start
note right
constructor MemoryOffsetBackingStore()
end note
end
start
note right
void configure(WorkerConfigconfig)
end note
end
start
note right
void start()
end note
:executor=Executors.newFixedThreadPool(1,ThreadUtils.createThreadFactory(this.getClass().getSimpleName()+"-%d",false));
end
start
note right
void stop()
end note
if (executor!=null ) then (yes) 
:executor.shutdown();
:executor.awaitTermination(30,TimeUnit.SECONDS);
:Thread.currentThread().interrupt();
if (!executor.shutdownNow().isEmpty()) then (yes) 
endif 
:executor=null ;
endif 
end
start
note right
Future<Map<ByteBuffer,ByteBuffer>>get(final Collection<ByteBuffer>keys)
end note
:return executor.submit(()->{Map<ByteBuffer,ByteBuffer>result=new HashMap<>();for (ByteBufferkey:keys){result.put(key,data.get(key));}return result;});;
stop
end
start
note right
Future<Void>set(final Map<ByteBuffer,ByteBuffer>values,final Callback<Void>callback)
