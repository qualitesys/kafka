@startuml
!pragma layout smetana
start
note right
constructor TopicStatus(Stringtopic,ConnectorTaskIdtask,longdiscoverTimestamp)
end note
:this(topic,task.connector(),task.task(),
discoverTimestamp);
end
start
note right
constructor TopicStatus(Stringtopic,Stringconnector,inttask,longdiscoverTimestamp)
end note
:this.topic=Objects.requireNonNull(topic);
:this.connector=Objects.requireNonNull(connector);
:this.task=task;
:this.discoverTimestamp=discoverTimestamp;
end
start
note right
Stringtopic()
end note
:return topic;;
stop
end
start
note right
Stringconnector()
end note
:return connector;;
stop
end
start
note right
inttask()
end note
:return task;;
stop
end
start
note right
longdiscoverTimestamp()
end note
:return discoverTimestamp;;
stop
end
start
note right
StringtoString()
end note
:return "TopicStatus{"+"topic='"+topic+'\''+
", connector='"+connector+'\''+", task="+
task+", discoverTimestamp="+discoverTimestamp+
'}';;
stop
end
start
note right
booleanequals(Objecto)
end note
if (this==o) then (yes) 
:return true;;
stop
endif 
if (!(o instanceof TopicStatus)) then (yes) 
:return false;;
stop
endif 
:return task==that.task&&discoverTimestamp==that.discoverTimestamp&&topic.equals(that.topic)&&connector.equals(that.connector);;
stop
end
start
note right
inthashCode()
end note
:return Objects.hash(topic,connector,task,
discoverTimestamp);;
stop
end
@enduml

