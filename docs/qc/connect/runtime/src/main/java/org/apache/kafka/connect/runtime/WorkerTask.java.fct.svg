" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="37" x="5" y="348.625">start</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="78" x="5" y="364.9219">note right</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="275" x="5" y="381.2188">void onRestart(ConnectorTaskIdid)</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="71" x="5" y="397.5156">end note</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="383" x="5" y="413.8125">:taskStateTimer.changeState(State.RESTARTING,</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="166" x="5" y="430.1094">time.milliseconds());;</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="260" x="5" y="446.4063">:delegateListener.onRestart(id);;</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="30" x="5" y="462.7031">end</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="37" x="5" y="479">start</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="78" x="5" y="495.2969">note right</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="277" x="5" y="511.5938">void recordState(TargetStatestate)</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="71" x="5" y="527.8906">end note</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="178" x="5" y="544.1875">switch (switch (state))</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" text-decoration="wavy underline" textLength="73" x="5" y="560.4844">endswith</text><text fill="#FF0000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="106" x="10" y="576.7813">Syntax Error?</text><!--MD5=[6e2040f9110c0dc21e349060a6a6ac12]
@startuml
!pragma layout smetana
start
note right
constructor WorkerTask(ConnectorTaskIdid,
TaskStatus.ListenerstatusListener,TargetStateinitialState,
ClassLoaderloader,ConnectMetricsconnectMetrics,
RetryWithToleranceOperatorretryWithToleranceOperator,
Timetime,StatusBackingStorestatusBackingStore)
end note
:this.id=id;;
:this.taskMetricsGroup=new TaskMetricsGroup(this.id,
connectMetrics,statusListener);;
:this.statusListener=taskMetricsGroup;;
:this.loader=loader;;
:this.targetState=initialState;;
:this.stopping=false;;
:this.cancelled=false;;
:this.taskMetricsGroup.recordState(this.targetState);;
:this.retryWithToleranceOperator=retryWithToleranceOperator;;
:this.time=time;;
:this.statusBackingStore=statusBackingStore;;
end
start
note right
ConnectorTaskIdid()
end note
:return id;;
stop
end
start
note right
ClassLoaderloader()
end note
:return loader;;
stop
end
start
note right
void initialize(TaskConfigtaskConfig)
end note
end
start
note right
void triggerStop()
end note
:synchronized (this){stopping=true;this.notifyAll();};
end
start
note right
void stop()
end note
:triggerStop();;
end
start
note right
void cancel()
end note
:cancelled=true;;
end
start
note right
booleanawaitStop(longtimeoutMs)
end note
:try ;
:return shutdownLatch.await(timeoutMs,TimeUnit.MILLISECONDS);;
stop
:catch (InterruptedExceptione);
:return false;;
stop
end
start
note right
void removeMetrics()
end note
:taskMetricsGroup.close();;
end
start
note right
void initializeAndStart()
end note
end
start
note right
void execute()
end note
end
start
note right
void close()
end note
end
start
note right
booleanisStopping()
end note
:return stopping;;
stop
end
start
note right
booleanisCancelled()
end note
:return cancelled;;
stop
end
start
note right
void doClose()
end note
:try ;
:close();;
:catch (Throwablet);
:log.error("{} Task threw an uncaught and unrecoverable exception during shutdown",
this,t);;
:throw t;;
stop
end
start
note right
void doRun()
end note
:try ;
:synchronized (this){if (stopping)return ;
:if (targetState==TargetState.PAUSED){onPause();
:if (!awaitUnpause())return ;}};
:initializeAndStart();;
:statusListener.onStartup(id);;
:execute();;
end
start
note right
void onShutdown()
end note
:synchronized (this){triggerStop();if (!cancelled)statusListener.onShutdown(id);};
end
start
note right
void onFailure(Throwablet)
end note
:synchronized (this){triggerStop();if (!cancelled)statusListener.onFailure(id,
t);};
end
start
note right
void onPause()
end note
:statusListener.onPause(id);;
end
start
note right
void onResume()
end note
:statusListener.onResume(id);;
end
start
note right
void run()
end note
:LoggingContext.clear();;
:try ;
:ClassLoadersavedLoader=Plugins.compareAndSwapLoaders(loader);;
:StringsavedName=Thread.currentThread().getName();;
:try ;
:Thread.currentThread().setName(THREAD_NAME_PREFIX+
id);;
:doRun();;
:onShutdown();;
end
start
note right
booleanshouldPause()
end note
:return this.targetState==TargetState.PAUSED;;
stop
end
start
note right
booleanawaitUnpause()
end note
:synchronized (this){while (targetState==TargetState.PAUSED){if (stopping)return false;
:this.wait();}return true;};
end
start
note right
void transitionTo(TargetStatestate)
end note
:synchronized (this){if (stopping)return ;
:this.targetState=state;this.notifyAll();};
end
start
note right
void recordActiveTopic(Stringtopic)
end note
if (statusBackingStore.getTopic(id.connector(),
topic)!=null ) then (yes) 
:return ;;
stop
endif 
:statusBackingStore.put(new TopicStatus(topic,
id,time.milliseconds()));;
end
start
note right
void recordCommitSuccess(longduration)
end note
:taskMetricsGroup.recordCommit(duration,true,
null );;
end
start
note right
void recordCommitFailure(longduration,Throwableerror)
end note
:taskMetricsGroup.recordCommit(duration,false,
error);;
end
start
note right
void recordBatch(intsize)
end note
:taskMetricsGroup.recordBatch(size);;
end
start
note right
TaskMetricsGrouptaskMetricsGroup()
end note
:return taskMetricsGroup;;
stop
end
start
note right
constructor TaskMetricsGroup(ConnectorTaskIdid,
ConnectMetricsconnectMetrics,TaskStatus.ListenerstatusListener)
end note
:delegateListener=statusListener;;
:time=connectMetrics.time();;
:taskStateTimer=new StateTracker();;
:ConnectMetricsRegistryregistry=connectMetrics.registry();;
:metricGroup=connectMetrics.group(registry.taskGroupName(),
registry.connectorTagName(),id.connector(),
registry.taskTagName(),Integer.toString(id.task()));;
:metricGroup.close();;
:metricGroup.addValueMetric(registry.taskStatus,
now->taskStateTimer.currentState().toString().toLowerCase(Locale.getDefault()));;
:addRatioMetric(State.RUNNING,registry.taskRunningRatio);;
:addRatioMetric(State.PAUSED,registry.taskPauseRatio);;
:commitTime=metricGroup.sensor("commit-time");;
:commitTime.add(metricGroup.metricName(registry.taskCommitTimeMax),
new Max());;
:commitTime.add(metricGroup.metricName(registry.taskCommitTimeAvg),
new Avg());;
:batchSize=metricGroup.sensor("batch-size");;
:batchSize.add(metricGroup.metricName(registry.taskBatchSizeMax),
new Max());;
:batchSize.add(metricGroup.metricName(registry.taskBatchSizeAvg),
new Avg());;
:MetricNameoffsetCommitFailures=metricGroup.metricName(registry.taskCommitFailurePercentage);;
:MetricNameoffsetCommitSucceeds=metricGroup.metricName(registry.taskCommitSuccessPercentage);;
:FrequenciescommitFrequencies=Frequencies.forBooleanValues(offsetCommitFailures,
offsetCommitSucceeds);;
:commitAttempts=metricGroup.sensor("offset-commit-completion");;
:commitAttempts.add(commitFrequencies);;
end
start
note right
void addRatioMetric(final StatematchingState,
MetricNameTemplatetemplate)
end note
:MetricNamemetricName=metricGroup.metricName(template);;
:metricGroup.metrics().addMetricIfAbsent(metricName,
null ,(Gauge<Double>)(config,now)->taskStateTimer.durationRatio(matchingState,
now));;
end
start
note right
void close()
end note
:metricGroup.close();;
end
start
note right
void recordCommit(longduration,booleansuccess,
Throwableerror)
end note
if (success) then (yes) 
:commitTime.record(duration);;
:commitAttempts.record(1.0d);;
else (no)
:commitAttempts.record(0.0d);;
endif 
end
start
note right
void recordBatch(intsize)
end note
:batchSize.record(size);;
end
start
note right
void onStartup(ConnectorTaskIdid)
end note
:taskStateTimer.changeState(State.RUNNING,
time.milliseconds());;
:delegateListener.onStartup(id);;
end
start
note right
void onFailure(ConnectorTaskIdid,Throwablecause)
end note
:taskStateTimer.changeState(State.FAILED,
time.milliseconds());;
:delegateListener.onFailure(id,cause);;
end
start
note right
void onPause(ConnectorTaskIdid)
end note
:taskStateTimer.changeState(State.PAUSED,
time.milliseconds());;
:delegateListener.onPause(id);;
end
start
note right
void onResume(ConnectorTaskIdid)
end note
:taskStateTimer.changeState(State.RUNNING,
time.milliseconds());;
:delegateListener.onResume(id);;
end
start
note right
void onShutdown(ConnectorTaskIdid)
end note
:taskStateTimer.changeState(State.UNASSIGNED,
time.milliseconds());;
:delegateListener.onShutdown(id);;
end
start
note right
void onDeletion(ConnectorTaskIdid)
end note
:taskStateTimer.changeState(State.DESTROYED,
time.milliseconds());;
:delegateListener.onDeletion(id);;
end
start
note right
void onRestart(ConnectorTaskIdid)
end note
:taskStateTimer.changeState(State.RESTARTING,
time.milliseconds());;
:delegateListener.onRestart(id);;
end
start
note right
void recordState(TargetStatestate)
end note
switch (switch (state))
endswith
end
start
note right
Statestate()
end note
:return taskStateTimer.currentState();;
stop
end
start
note right
MetricGroupmetricGroup()
end note
:return metricGroup;;
stop
end
@enduml

