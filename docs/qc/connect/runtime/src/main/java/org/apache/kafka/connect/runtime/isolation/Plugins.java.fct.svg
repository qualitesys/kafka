@startuml
!pragma layout smetana
start
note right
constructor Plugins(Map<String,String>props)
end note
:List<String>pluginLocations=WorkerConfig.pluginLocations(props);;
:delegatingLoader=newDelegatingClassLoader(pluginLocations);;
:delegatingLoader.initLoaders();;
end
start
note right
DelegatingClassLoadernewDelegatingClassLoader(final List<String>paths)
end note
:return AccessController.doPrivileged((PrivilegedAction<DelegatingClassLoader>)()->new DelegatingClassLoader(paths));;
stop
end
:return Utils.join(plugins,", ");;
stop
:ClassLoadersavedLoader=compareAndSwapLoaders(klass.getClassLoader());;
:try ;
:return Utils.newInstance(klass);;
stop
:Class<? >klass=config.getClass(propertyName);;
if (pluginClass.isAssignableFrom(klass)) then (yes) 
:return (Class<?  extends U>)klass;;
stop
endif 
:throw new ConnectException("Failed to find any class that implements "+
pluginClass.getSimpleName()+" for the config "+
propertyName+", available classes are: "+
pluginNames(plugins));;
stop
:Class<? >klass=loader.loadClass(classOrAlias,
false);;
if (pluginClass.isAssignableFrom(klass)) then (yes) 
:return (Class<?  extends U>)klass;;
stop
endif 
:throw new ClassNotFoundException("Requested class: "+
classOrAlias+" does not extend "+pluginClass.getSimpleName());;
stop
start
note right
ClassLoadercompareAndSwapLoaders(ClassLoaderloader)
end note
:ClassLoadercurrent=Thread.currentThread()
.getContextClassLoader();;
if (!current.equals(loader)) then (yes) 
:Thread.currentThread().setContextClassLoader(loader);;
endif 
:return current;;
stop
end
start
note right
ClassLoadercurrentThreadLoader()
end note
:return Thread.currentThread().getContextClassLoader();;
stop
end
start
note right
ClassLoadercompareAndSwapWithDelegatingLoader()
end note
:ClassLoadercurrent=Thread.currentThread()
.getContextClassLoader();;
if (!current.equals(delegatingLoader)) then (yes) 
:Thread.currentThread().setContextClassLoader(delegatingLoader);;
endif 
:return current;;
stop
end
start
note right
ClassLoadercompareAndSwapLoaders(Connectorconnector)
end note
:ClassLoaderconnectorLoader=delegatingLoader.connectorLoader(connector);;
:return compareAndSwapLoaders(connectorLoader);;
stop
end
start
note right
LoaderSwapwithClassLoader(ClassLoaderloader)
end note
:ClassLoadersavedLoader=compareAndSwapLoaders(loader);;
:try ;
:return new LoaderSwap(savedLoader);;
stop
:catch (Throwablet);
:compareAndSwapLoaders(savedLoader);;
:throw t;;
stop
end
start
note right
DelegatingClassLoaderdelegatingLoader()
end note
:return delegatingLoader;;
stop
end
start
note right
Set<PluginDesc<SinkConnector>>sinkConnectors()
end note
:return delegatingLoader.sinkConnectors();;
stop
end
start
note right
Set<PluginDesc<SourceConnector>>sourceConnectors()
end note
:return delegatingLoader.sourceConnectors();;
stop
end
start
note right
Set<PluginDesc<Converter>>converters()
end note
:return delegatingLoader.converters();;
stop
end
start
note right
Set<PluginDesc<HeaderConverter>>headerConverters()
end note
:return delegatingLoader.headerConverters();;
stop
end
start
note right
Set<PluginDesc<Transformation<? >>>transformations()
end note
:return delegatingLoader.transformations();;
stop
end
start
note right
Set<PluginDesc<Predicate<? >>>predicates()
end note
:return delegatingLoader.predicates();;
stop
end
start
note right
ObjectnewPlugin(StringclassOrAlias)
end note
:Class<? >klass=pluginClass(delegatingLoader,
classOrAlias,Object.class );;
:return newPlugin(klass);;
stop
end
start
note right
ConnectornewConnector(StringconnectorClassOrAlias)
end note
:Class<?  extends Connector>klass=connectorClass(connectorClassOrAlias);;
:return newPlugin(klass);;
stop
end
start
note right
Class<?  extends Connector>connectorClass(StringconnectorClassOrAlias)
end note
:Class<?  extends Connector>klass;;
:try ;
:klass=pluginClass(delegatingLoader,connectorClassOrAlias,
Connector.class );;
:catch (ClassNotFoundExceptione);
:List<PluginDesc<?  extends Connector>>matches=new ArrayList<>();;
:Set<PluginDesc<Connector>>connectors=delegatingLoader.connectors();;
:Class<? >pluginClass=plugin.pluginClass();;
:StringsimpleName=pluginClass.getSimpleName();;
if (simpleName.equals(connectorClassOrAlias)||simpleName.equals(connectorClassOrAlias+
"Connector")) then (yes) 
:matches.add(plugin);;
endif 
if (matches.isEmpty()) then (yes) 
:throw new ConnectException("Failed to find any class that implements Connector and which name matches "+
connectorClassOrAlias+", available connectors are: "+
Utils.join(connectors,", "));;
stop
endif 
if (matches.size()>1) then (yes) 
:throw new ConnectException("More than one connector matches alias "+
connectorClassOrAlias+". Please use full package and class name instead. Classes found: "+
Utils.join(connectors,", "));;
stop
endif 
:PluginDesc<?  extends Connector>entry=matches.get(0);;
:klass=entry.pluginClass();;
:return klass;;
stop
end
start
note right
TasknewTask(Class<?  extends Task>taskClass)
end note
:return newPlugin(taskClass);;
stop
end
start
note right
ConverternewConverter(AbstractConfigconfig,
StringclassPropertyName,ClassLoaderUsageclassLoaderUsage)
end note
if (!config.originals().containsKey(classPropertyName)) then (yes) 
:return null ;;
stop
endif 
:Class<?  extends Converter>klass=null ;;
switch (switch (classLoaderUsage))
endswith
if (klass==null ) then (yes) 
:throw new ConnectException("Unable to initialize the Converter specified in '"+
classPropertyName+"'");;
stop
endif 
:final booleanisKeyConverter=WorkerConfig.KEY_CONVERTER_CLASS_CONFIG.equals(classPropertyName);;
:StringconfigPrefix=classPropertyName+".";;
:Map<String,Object>converterConfig=config.originalsWithPrefix(configPrefix);;
:log.debug("Configuring the {} converter with configuration keys:{}{}",
isKeyConverter? String.valueOf("key"):String.valueOf("value"),
System.lineSeparator(),converterConfig.keySet());;
:Converterplugin;;
:ClassLoadersavedLoader=compareAndSwapLoaders(klass.getClassLoader());;
:try ;
:plugin=newPlugin(klass);;
:plugin.configure(converterConfig,isKeyConverter);;
:return plugin;;
stop
end
start
note right
ConverternewInternalConverter(booleanisKey,
StringclassName,Map<String,String>converterConfig)
end note
:Class<?  extends Converter>klass;;
:try ;
:klass=pluginClass(delegatingLoader,className,
Converter.class );;
:catch (ClassNotFoundExceptione);
:throw new ConnectException("Failed to load internal converter class "+
className);;
stop
:Converterplugin;;
:ClassLoadersavedLoader=compareAndSwapLoaders(klass.getClassLoader());;
:try ;
:plugin=newPlugin(klass);;
:plugin.configure(converterConfig,isKey);;
:return plugin;;
stop
end
start
note right
HeaderConverternewHeaderConverter(AbstractConfigconfig,
StringclassPropertyName,ClassLoaderUsageclassLoaderUsage)
end note
:Class<?  extends HeaderConverter>klass=null ;;
switch (switch (classLoaderUsage))
endswith
if (klass==null ) then (yes) 
:throw new ConnectException("Unable to initialize the HeaderConverter specified in '"+
classPropertyName+"'");;
stop
endif 
:StringconfigPrefix=classPropertyName+".";;
:Map<String,Object>converterConfig=config.originalsWithPrefix(configPrefix);;
:converterConfig.put(ConverterConfig.TYPE_CONFIG,
ConverterType.HEADER.getName());;
:log.debug("Configuring the header converter with configuration keys:{}{}",
System.lineSeparator(),converterConfig.keySet());;
:HeaderConverterplugin;;
:ClassLoadersavedLoader=compareAndSwapLoaders(klass.getClassLoader());;
:try ;
:plugin=newPlugin(klass);;
:plugin.configure(converterConfig);;
:return plugin;;
stop
end
start
note right
ConfigProvidernewConfigProvider(AbstractConfigconfig,
StringproviderPrefix,ClassLoaderUsageclassLoaderUsage)
end note
:StringclassPropertyName=providerPrefix+".class";;
:Map<String,String>originalConfig=config.originalsStrings();;
if (!originalConfig.containsKey(classPropertyName)) then (yes) 
:return null ;;
stop
endif 
:Class<?  extends ConfigProvider>klass=null ;;
switch (switch (classLoaderUsage))
endswith
if (klass==null ) then (yes) 
:throw new ConnectException("Unable to initialize the ConfigProvider specified in '"+
classPropertyName+"'");;
stop
endif 
:StringconfigPrefix=providerPrefix+".param.";;
:Map<String,Object>configProviderConfig=config.originalsWithPrefix(configPrefix);;
:ConfigProviderplugin;;
:ClassLoadersavedLoader=compareAndSwapLoaders(klass.getClassLoader());;
:try ;
:plugin=newPlugin(klass);;
:plugin.configure(configProviderConfig);;
:return plugin;;
stop
end
:List<T>plugins=new ArrayList<>();;
if (klassNames!=null ) then (yes) 
:plugins.add(newPlugin(klassName,config,pluginKlass));;
endif 
:return plugins;;
stop
:Tplugin;;
:Class<?  extends T>klass;;
:try ;
:klass=pluginClass(delegatingLoader,klassName,
pluginKlass);;
:catch (ClassNotFoundExceptione);
:Stringmsg=String.format("Failed to find any class that implements %s and which "+
"name matches %s",pluginKlass,klassName);;
:throw new ConnectException(msg);;
stop
:ClassLoadersavedLoader=compareAndSwapLoaders(klass.getClassLoader());;
:try ;
:plugin=newPlugin(klass);;
if (plugin instanceof Versioned) then (yes) 
:VersionedversionedPlugin=(Versioned)plugin;;
if (Utils.isBlank(versionedPlugin.version())) then (yes) 
:throw new ConnectException("Version not defined for '"+
klassName+"'");;
stop
endif 
endif 
if (plugin instanceof Configurable) then (yes) 
:((Configurable)plugin).configure(config.originals());;
endif 
:return plugin;;
stop
