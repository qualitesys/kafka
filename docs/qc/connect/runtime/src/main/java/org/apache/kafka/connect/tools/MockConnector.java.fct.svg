@startuml
!pragma layout smetana
start
note right
Stringversion()
end note
:return AppInfoParser.getVersion();;
stop
end
start
note right
void start(Map<String,String>config)
end note
if (CONNECTOR_FAILURE.equals(config.get(MOCK_MODE_KEY))) then (yes) 
if (delayMsString!=null ) then (yes) 
endif 
endif 
end
start
note right
Class<?  extends Task>taskClass()
end note
:throw new UnsupportedOperationException();;
end
start
note right
List<Map<String,String>>taskConfigs(intmaxTasks)
end note
:return Collections.singletonList(config);;
stop
end
start
note right
void stop()
end note
if (executor!=null ) then (yes) 
if (!executor.awaitTermination(20,TimeUnit.SECONDS)) then (yes) 
:throw new RuntimeException("Failed timely termination of scheduler");;
endif 
:throw new RuntimeException("Task was interrupted during shutdown");;
endif 
end
start
note right
ConfigDefconfig()
end note
:return new ConfigDef();;
stop
end
@enduml

