@startuml
!pragma layout smetana
start
note right
constructor PredicatedTransformation(Predicate<R>predicate,
booleannegate,Transformation<R>delegate)
end note
:this.predicate=predicate;
:this.negate=negate;
:this.delegate=delegate;
end
start
note right
void configure(Map<String,? >configs)
end note
:throw new ConnectException(PredicatedTransformation.class .getName()+
".configure() "+"should never be called directly.");;
end
start
note right
Rapply(Rrecord)
end note
if (negate^predicate.test(record)) then (yes) 
:return delegate.apply(record);;
stop
endif 
:return record;;
stop
end
start
note right
ConfigDefconfig()
end note
:throw new ConnectException(PredicatedTransformation.class .getName()+
".config() "+"should never be called directly.");;
end
start
note right
void close()
end note
:Utils.closeQuietly(delegate,"predicated");
:Utils.closeQuietly(predicate,"predicate");
end
start
note right
StringtoString()
end note
:return "PredicatedTransformation{"+"predicate="+
predicate+", delegate="+delegate+", negate="+
negate+'}';;
stop
end
@enduml

