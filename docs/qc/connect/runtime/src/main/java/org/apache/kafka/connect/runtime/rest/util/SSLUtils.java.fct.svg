@startuml
!pragma layout smetana
start
note right
SslContextFactorycreateServerSideSslContextFactory(WorkerConfigconfig,
Stringprefix)
end note
:Map<String,Object>sslConfigValues=config.valuesWithPrefixAllOrNothing(prefix);;
:final SslContextFactory.Serverssl=new SslContextFactory.Server();;
:configureSslContextFactoryKeyStore(ssl,sslConfigValues);;
:configureSslContextFactoryTrustStore(ssl,
sslConfigValues);;
:configureSslContextFactoryAlgorithms(ssl,
sslConfigValues);;
:configureSslContextFactoryAuthentication(ssl,
sslConfigValues);;
:return ssl;;
stop
end
start
note right
SslContextFactorycreateServerSideSslContextFactory(WorkerConfigconfig)
end note
:return createServerSideSslContextFactory(config,
"listeners.https.");;
stop
end
start
note right
SslContextFactorycreateClientSideSslContextFactory(WorkerConfigconfig)
end note
:Map<String,Object>sslConfigValues=config.valuesWithPrefixAllOrNothing("listeners.https.");;
:final SslContextFactory.Clientssl=new SslContextFactory.Client();;
:configureSslContextFactoryKeyStore(ssl,sslConfigValues);;
:configureSslContextFactoryTrustStore(ssl,
sslConfigValues);;
:configureSslContextFactoryAlgorithms(ssl,
sslConfigValues);;
:configureSslContextFactoryEndpointIdentification(ssl,
sslConfigValues);;
:return ssl;;
stop
end
start
note right
void configureSslContextFactoryKeyStore(SslContextFactoryssl,
Map<String,Object>sslConfigValues)
end note
:ssl.setKeyStoreType((String)getOrDefault(sslConfigValues,
SslConfigs.SSL_KEYSTORE_TYPE_CONFIG,SslConfigs.DEFAULT_SSL_KEYSTORE_TYPE));;
:StringsslKeystoreLocation=(String)sslConfigValues.get(SslConfigs.SSL_KEYSTORE_LOCATION_CONFIG);;
if (sslKeystoreLocation!=null ) then (yes) 
:ssl.setKeyStorePath(sslKeystoreLocation);;
endif 
:PasswordsslKeystorePassword=(Password)sslConfigValues.get(SslConfigs.SSL_KEYSTORE_PASSWORD_CONFIG);;
if (sslKeystorePassword!=null ) then (yes) 
:ssl.setKeyStorePassword(sslKeystorePassword.value());;
endif 
:PasswordsslKeyPassword=(Password)sslConfigValues.get(SslConfigs.SSL_KEY_PASSWORD_CONFIG);;
if (sslKeyPassword!=null ) then (yes) 
:ssl.setKeyManagerPassword(sslKeyPassword.value());;
endif 
end
start
note right
ObjectgetOrDefault(Map<String,Object>configMap,
Stringkey,ObjectdefaultValue)
end note
if (configMap.containsKey(key)) then (yes) 
:return configMap.get(key);;
stop
endif 
:return defaultValue;;
stop
end
start
note right
void configureSslContextFactoryTrustStore(SslContextFactoryssl,
Map<String,Object>sslConfigValues)
end note
:ssl.setTrustStoreType((String)getOrDefault(sslConfigValues,
SslConfigs.SSL_TRUSTSTORE_TYPE_CONFIG,SslConfigs.DEFAULT_SSL_TRUSTSTORE_TYPE));;
:StringsslTruststoreLocation=(String)sslConfigValues.get(SslConfigs.SSL_TRUSTSTORE_LOCATION_CONFIG);;
if (sslTruststoreLocation!=null ) then (yes) 
:ssl.setTrustStorePath(sslTruststoreLocation);;
endif 
:PasswordsslTruststorePassword=(Password)sslConfigValues.get(SslConfigs.SSL_TRUSTSTORE_PASSWORD_CONFIG);;
if (sslTruststorePassword!=null ) then (yes) 
:ssl.setTrustStorePassword(sslTruststorePassword.value());;
endif 
end
start
note right
void configureSslContextFactoryAlgorithms(SslContextFactoryssl,
Map<String,Object>sslConfigValues)
end note
:List<String>sslEnabledProtocols=(List<String>)getOrDefault(sslConfigValues,
SslConfigs.SSL_ENABLED_PROTOCOLS_CONFIG,Arrays.asList(COMMA_WITH_WHITESPACE.split(SslConfigs.DEFAULT_SSL_ENABLED_PROTOCOLS)));;
:ssl.setIncludeProtocols(sslEnabledProtocols.toArray(new String[0]));;
:StringsslProvider=(String)sslConfigValues.get(SslConfigs.SSL_PROVIDER_CONFIG);;
if (sslProvider!=null ) then (yes) 
:ssl.setProvider(sslProvider);;
endif 
:ssl.setProtocol((String)getOrDefault(sslConfigValues,
SslConfigs.SSL_PROTOCOL_CONFIG,SslConfigs.DEFAULT_SSL_PROTOCOL));;
:List<String>sslCipherSuites=(List<String>)sslConfigValues.get(SslConfigs.SSL_CIPHER_SUITES_CONFIG);;
if (sslCipherSuites!=null ) then (yes) 
:ssl.setIncludeCipherSuites(sslCipherSuites.toArray(new String[0]));;
endif 
:ssl.setKeyManagerFactoryAlgorithm((String)getOrDefault(sslConfigValues,
SslConfigs.SSL_KEYMANAGER_ALGORITHM_CONFIG,
SslConfigs.DEFAULT_SSL_KEYMANGER_ALGORITHM));;
:StringsslSecureRandomImpl=(String)sslConfigValues.get(SslConfigs.SSL_SECURE_RANDOM_IMPLEMENTATION_CONFIG);;
if (sslSecureRandomImpl!=null ) then (yes) 
:ssl.setSecureRandomAlgorithm(sslSecureRandomImpl);;
endif 
:ssl.setTrustManagerFactoryAlgorithm((String)getOrDefault(sslConfigValues,
SslConfigs.SSL_TRUSTMANAGER_ALGORITHM_CONFIG,
SslConfigs.DEFAULT_SSL_TRUSTMANAGER_ALGORITHM));;
end
start
note right
void configureSslContextFactoryEndpointIdentification(SslContextFactoryssl,
Map<String,Object>sslConfigValues)
end note
:StringsslEndpointIdentificationAlg=(String)sslConfigValues.get(SslConfigs.SSL_ENDPOINT_IDENTIFICATION_ALGORITHM_CONFIG);;
if (sslEndpointIdentificationAlg!=null ) then (yes) 
:ssl.setEndpointIdentificationAlgorithm(sslEndpointIdentificationAlg);;
endif 
end
start
note right
void configureSslContextFactoryAuthentication(SslContextFactory.Serverssl,
Map<String,Object>sslConfigValues)
end note
:StringsslClientAuth=(String)getOrDefault(sslConfigValues,
BrokerSecurityConfigs.SSL_CLIENT_AUTH_CONFIG,
"none");;
switch (switch (sslClientAuth))
endswith
end
@enduml

