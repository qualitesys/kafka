@startuml
!pragma layout smetana
start
note right
void validateFormat(ObjectoffsetData)
end note
if (offsetData==null ) then (yes) 
:return ;;
stop
endif 
if (!(offsetData instanceof Map)) then (yes) 
endif 
:validateFormat((Map<Object,Object>)offsetData);
end
if (offsetData==null ) then (yes) 
:return ;;
stop
endif 
if (!(entry.getKey() instanceof String)) then (yes) 
endif 
if (value==null ) then (yes) 
endif 
if (schemaType==null ) then (yes) 
endif 
if (!schemaType.isPrimitive()) then (yes) 
endif 
@enduml

