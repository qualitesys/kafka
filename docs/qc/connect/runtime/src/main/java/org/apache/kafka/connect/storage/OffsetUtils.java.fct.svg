@startuml
!pragma layout smetana
start
note right
void validateFormat(ObjectoffsetData)
end note
if (offsetData==null ) then (yes) 
:return ;;
stop
endif 
if (!(offsetData instanceof Map)) then (yes) 
:throw new DataException("Offsets must be specified as a Map");;
endif 
:validateFormat((Map<Object,Object>)offsetData);
end
if (offsetData==null ) then (yes) 
:return ;;
stop
endif 
if (!(entry.getKey() instanceof String)) then (yes) 
:throw new DataException("Offsets may only use String keys");;
endif 
if (value==null ) then (yes) 
endif 
if (schemaType==null ) then (yes) 
:throw new DataException("Offsets may only contain primitive types as values, but field "+
entry.getKey()+" contains "+value.getClass());;
endif 
if (!schemaType.isPrimitive()) then (yes) 
:throw new DataException("Offsets may only contain primitive types as values, but field "+
entry.getKey()+" contains "+schemaType);;
endif 
@enduml

