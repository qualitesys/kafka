@startuml
!pragma layout smetana
start
note right
String version()
end note
:return AppInfoParser.getVersion();;
stop
end
start
note right
void start(Map<String,String> config)
end note
:this.mockMode=config.get(MockConnector.MOCK_MODE_KEY);;
if (MockConnector.TASK_FAILURE.equals(mockMode)) then (yes) 
:this.startTimeMs=System.currentTimeMillis();;
:String delayMsString=config.get(MockConnector.DELAY_MS_KEY);;
:this.failureDelayMs=MockConnector.DEFAULT_FAILURE_DELAY_MS;;
if (delayMsString!=null ) then (yes) 
:failureDelayMs=Long.parseLong(delayMsString);;
endif 
:log.debug("Started MockSourceTask at {} with failure scheduled in {} ms",
startTimeMs,failureDelayMs);;
endif 
end
start
note right
List<SourceRecord> poll()
end note
if (MockConnector.TASK_FAILURE.equals(mockMode)) then (yes) 
:long now=System.currentTimeMillis();;
if (now-startTimeMs>failureDelayMs) then (yes) 
:log.debug("Triggering source task failure");;
:throw new RuntimeException();;
stop
endif 
endif 
:return Collections.emptyList();;
stop
end
start
note right
void stop()
end note
end
@enduml

