8" x2="918" y1="467.1641" y2="1052.9297"/><line style="stroke:#181818;stroke-width:1.0;" x1="918" x2="470.5" y1="467.1641" y2="467.1641"/><polygon fill="#181818" points="480.5,463.1641,470.5,467.1641,480.5,471.1641,476.5,467.1641" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="458.5" x2="458.5" y1="1020.9297" y2="1040.9297"/><polygon fill="#181818" points="454.5,1030.9297,458.5,1040.9297,462.5,1030.9297,458.5,1034.9297" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="458.5" x2="458.5" y1="1064.9297" y2="1084.9297"/><polygon fill="#181818" points="454.5,1074.9297,458.5,1084.9297,462.5,1074.9297,458.5,1078.9297" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[a3cada7f8f10e51c5f7495426ac02ccb]
@startuml
!pragma layout smetana
if (retryBackoffMs<0) then (yes) 
:log.debug("Assuming no retry backoff since retryBackoffMs={} is negative",
retryBackoffMs);
:retryBackoffMs=0;
endif 
if (timeoutMs<=0||retryBackoffMs>=timeoutMs) then (yes) 
:log.debug("Executing {} only once, since timeoutMs={} is not larger than retryBackoffMs={}",descriptionStr,timeoutMs,retryBackoffMs);
:return callable.call();;
stop
endif 
repeat
:attempt++;
:return callable.call();;
stop
:log.warn("Attempt {} to {} resulted in RetriableException; retrying automatically. "+"Reason: {}",attempt,descriptionStr,e.getMessage(),e);
:lastError=e;
:lastError=e;
if (retryBackoffMs>0) then (yes) 
if (millisRemaining<retryBackoffMs) then (yes) 
endif 
:Utils.sleep(retryBackoffMs);
endif 
repeat while (System.currentTimeMillis()<end)
:throw new ConnectException("Fail to "+descriptionStr+" after "+attempt+" attempts.  Reason: "+lastError.getMessage(),lastError);;
@enduml

