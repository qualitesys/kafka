@startuml
!pragma layout smetana
if (retryBackoffMs<0) then (yes) 
:log.debug("Assuming no retry backoff since retryBackoffMs={} is negative",
retryBackoffMs);;
:retryBackoffMs=0;;
endif 
if (timeoutMs<=0||retryBackoffMs>=timeoutMs) then (yes) 
:log.debug("Executing {} only once, since timeoutMs={} is not larger than retryBackoffMs={}",
descriptionStr,timeoutMs,retryBackoffMs);;
:return callable.call();;
stop
endif 
repeat
:attempt++;;
:try {return callable.call();}catch (RetriableException|org.apache.kafka.connect.errors.RetriableExceptione){log.warn("Attempt {} to {} resulted in RetriableException; retrying automatically. "+
"Reason: {}",attempt,descriptionStr,e.getMessage(),
e);lastError=e;}catch (WakeupExceptione){lastError=e;};
if (retryBackoffMs>0) then (yes) 
if (millisRemaining<retryBackoffMs) then (yes) 
:break ;;
endif 
:Utils.sleep(retryBackoffMs);;
endif 
repeat while (System.currentTimeMillis()<end)
:throw new ConnectException("Fail to "+descriptionStr+
" after "+attempt+" attempts.  Reason: "+
lastError.getMessage(),lastError);;
stop
@enduml

