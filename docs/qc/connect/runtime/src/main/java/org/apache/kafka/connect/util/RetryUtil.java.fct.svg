423" x2="606" y1="1087.8516" y2="1087.8516"/><polygon fill="#181818" points="602,774.9766,606,764.9766,610,774.9766,606,770.9766" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="606" x2="606" y1="481.1328" y2="1087.8516"/><line style="stroke:#181818;stroke-width:1.0;" x1="606" x2="332" y1="481.1328" y2="481.1328"/><polygon fill="#181818" points="342,477.1328,332,481.1328,342,485.1328,338,481.1328" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="320" x2="320" y1="1055.8516" y2="1075.8516"/><polygon fill="#181818" points="316,1065.8516,320,1075.8516,324,1065.8516,320,1069.8516" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="320" x2="320" y1="1099.8516" y2="1119.8516"/><polygon fill="#181818" points="316,1109.8516,320,1119.8516,324,1109.8516,320,1113.8516" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[7b0dafe7697059cb4e0df6a4d24629c8]
@startuml
!pragma layout smetana
if (retryBackoffMs<0) then (yes) 
:log.debug("Assuming no retry backoff since retryBackoffMs={} is negative",
retryBackoffMs);
:retryBackoffMs=0;
endif 
if (timeoutMs<=0||retryBackoffMs>=timeoutMs) then (yes) 
:log.debug("Executing {} only once, since timeoutMs={} is not larger than retryBackoffMs={}",
descriptionStr,timeoutMs,retryBackoffMs);
:return callable.call();;
stop
endif 
repeat
:attempt++;
:return callable.call();;
stop
:log.warn("Attempt {} to {} resulted in RetriableException; retrying automatically. "+
"Reason: {}",attempt,descriptionStr,e.getMessage(),e);
:lastError=e;
:lastError=e;
if (retryBackoffMs>0) then (yes) 
if (millisRemaining<retryBackoffMs) then (yes) 
endif 
:Utils.sleep(retryBackoffMs);
endif 
repeat while (System.currentTimeMillis()<end)
:throw new ConnectException("Fail to "+descriptionStr+
" after "+attempt+" attempts.  Reason: "+
lastError.getMessage(),lastError);;
@enduml

