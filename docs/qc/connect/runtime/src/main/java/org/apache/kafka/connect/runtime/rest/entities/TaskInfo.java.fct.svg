@startuml
!pragma layout smetana
start
note right
constructor TaskInfo(ConnectorTaskIdid,Map<String,
String>config)
end note
end
start
note right
ConnectorTaskIdid()
end note
:return id;;
stop
end
start
note right
Map<String,String>config()
end note
:return config;;
stop
end
start
note right
booleanequals(Objecto)
end note
if (this==o) then (yes) 
:return true;;
stop
endif 
if (o==null ||getClass()!=o.getClass()) then (yes) 
:return false;;
stop
endif 
:return Objects.equals(id,taskInfo.id)&&Objects.equals(config,
taskInfo.config);;
stop
end
start
note right
inthashCode()
end note
:return Objects.hash(id,config);;
stop
end
@enduml

