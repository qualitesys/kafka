@startuml
!pragma layout smetana
start
note right
constructor HerderConnectorContext(AbstractHerderherder,
StringconnectorName)
end note
:this.herder=herder;
:this.connectorName=connectorName;
:this.closed=false;
end
start
note right
void requestTaskReconfiguration()
end note
if (closed) then (yes) 
:throw new ConnectException("The request for task reconfiguration has been rejected "+"because this instance of the connector '"+connectorName+"' has already "+"been shut down.");;
endif 
:herder.requestTaskReconfiguration(connectorName);
end
start
note right
void raiseError(Exceptione)
end note
if (closed) then (yes) 
:log.warn("Connector {} attempted to raise error after shutdown:",
connectorName,e);
:throw new ConnectException("The request to fail the connector has been rejected "+"because this instance of the connector '"+connectorName+"' has already "+"been shut down.");;
endif 
:herder.onFailure(connectorName,e);
end
start
note right
void close()
end note
:closed=true;
end
@enduml

