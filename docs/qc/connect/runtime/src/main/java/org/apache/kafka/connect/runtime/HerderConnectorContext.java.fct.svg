e style="stroke:#181818;stroke-width:1.0;" x1="299.5" x2="299.5" y1="1026.5469" y2="1046.5469"/><polygon fill="#181818" points="295.5,1036.5469,299.5,1046.5469,303.5,1036.5469,299.5,1040.5469" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[e22e7627b280861ee1533b4ec85f5302]
@startuml
!pragma layout smetana
start
note right
constructor HerderConnectorContext(AbstractHerderherder,
StringconnectorName)
end note
:this.herder=herder;
:this.connectorName=connectorName;
:this.closed=false;
end
start
note right
void requestTaskReconfiguration()
end note
if (closed) then (yes) 
:throw new ConnectException("The request for task reconfiguration has been rejected "+
"because this instance of the connector '"+
connectorName+"' has already "+"been shut down.");;
endif 
:herder.requestTaskReconfiguration(connectorName);
end
start
note right
void raiseError(Exceptione)
end note
if (closed) then (yes) 
:log.warn("Connector {} attempted to raise error after shutdown:",
connectorName,e);
:throw new ConnectException("The request to fail the connector has been rejected "+
"because this instance of the connector '"+
connectorName+"' has already "+"been shut down.");;
endif 
:herder.onFailure(connectorName,e);
end
start
note right
void close()
end note
:closed=true;
end
@enduml

