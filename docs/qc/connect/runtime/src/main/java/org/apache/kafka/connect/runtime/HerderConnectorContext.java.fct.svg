@startuml
!pragma layout smetana
start
note right
constructor HerderConnectorContext(AbstractHerderherder,StringconnectorName)
end note
:this.herder=herder;
:this.connectorName=connectorName;
:this.closed=false;
end
start
note right
void requestTaskReconfiguration()
end note
if (closed) then (yes) 
endif 
:herder.requestTaskReconfiguration(connectorName);
end
start
note right
void raiseError(Exceptione)
end note
if (closed) then (yes) 
:log.warn("Connector {} attempted to raise error after shutdown:",connectorName,e);
endif 
:herder.onFailure(connectorName,e);
end
start
note right
void close()
end note
:closed=true;
end
@enduml

