5.5,1066.0313,299.5,1076.0313,303.5,1066.0313,299.5,1070.0313" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[7b4b4061efedf489f7bde595f8384c9f]
@startuml
!pragma layout smetana
start
note right
constructor HerderConnectorContext(AbstractHerder herder,
String connectorName)
end note
:this.herder=herder;;
:this.connectorName=connectorName;;
:this.closed=false;;
end
start
note right
void requestTaskReconfiguration()
end note
if (closed) then (yes) 
:throw new ConnectException("The request for task reconfiguration has been rejected "+
"because this instance of the connector '"+
connectorName+"' has already "+"been shut down.");;
stop
endif 
:herder.requestTaskReconfiguration(connectorName);;
end
start
note right
void raiseError(Exception e)
end note
if (closed) then (yes) 
:log.warn("Connector {} attempted to raise error after shutdown:",
connectorName,e);;
:throw new ConnectException("The request to fail the connector has been rejected "+
"because this instance of the connector '"+
connectorName+"' has already "+"been shut down.");;
stop
endif 
:herder.onFailure(connectorName,e);;
end
start
note right
void close()
end note
:closed=true;;
end
@enduml

