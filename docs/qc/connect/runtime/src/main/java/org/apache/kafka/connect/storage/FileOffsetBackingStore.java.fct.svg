@startuml
!pragma layout smetana
start
note right
constructor FileOffsetBackingStore()
end note
end
start
note right
void configure(WorkerConfigconfig)
end note
:super .configure(config);
:file=new File(config.getString(StandaloneConfig.OFFSET_STORAGE_FILE_FILENAME_CONFIG));
end
start
note right
void start()
end note
:super .start();
:log.info("Starting FileOffsetBackingStore with file {}",file);
:load();
end
start
note right
void stop()
end note
:super .stop();
:log.info("Stopped FileOffsetBackingStore");
end
start
note right
void load()
end note
if (!(obj instanceof HashMap)) then (yes) 
endif 
:data=new HashMap<>();
:data.put(key,value);
end
start
note right
void save()
end note
:raw.put(key,value);
:os.writeObject(raw);
end
@enduml

