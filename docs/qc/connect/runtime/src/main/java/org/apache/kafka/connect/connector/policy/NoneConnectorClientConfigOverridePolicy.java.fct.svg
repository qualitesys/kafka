@startuml
!pragma layout smetana
start
note right
String policyName()
end note
:return "None";;
stop
end
start
note right
boolean isAllowed(ConfigValue configValue)
end note
:return false;;
stop
end
start
note right
void configure(Map<String,?> configs)
end note
:log.info("Setting up None Policy for ConnectorClientConfigOverride. This will disallow any client configuration to be overridden");;
end
@enduml

