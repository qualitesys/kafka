@startuml
!pragma layout smetana
start
note right
constructor WorkerSourceTaskContext(OffsetStorageReaderreader,
ConnectorTaskIdid,ClusterConfigStateconfigState,
WorkerTransactionContexttransactionContext)
end note
:this.reader=reader;
:this.id=id;
:this.configState=configState;
:this.transactionContext=transactionContext;
end
start
note right
Map<String,String>configs()
end note
:return configState.taskConfig(id);;
stop
end
start
note right
OffsetStorageReaderoffsetStorageReader()
end note
:return reader;;
stop
end
start
note right
WorkerTransactionContexttransactionContext()
end note
:return transactionContext;;
stop
end
@enduml

