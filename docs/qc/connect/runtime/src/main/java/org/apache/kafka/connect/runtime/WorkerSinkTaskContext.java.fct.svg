@startuml
!pragma layout smetana
start
note right
constructor WorkerSinkTaskContext(KafkaConsumer<byte[],byte[]>consumer,WorkerSinkTasksinkTask,ClusterConfigStateconfigState)
end note
:this.offsets=new HashMap<>();
:this.timeoutMs=-1L;
:this.consumer=consumer;
:this.sinkTask=sinkTask;
:this.configState=configState;
:this.pausedPartitions=new HashSet<>();
end
start
note right
Map<String,String>configs()
end note
:return configState.taskConfig(sinkTask.id());;
stop
end
start
note right
void offset(Map<TopicPartition,Long>offsets)
end note
:log.debug("{} Setting offsets for topic partitions {}",
this,offsets);
:this.offsets.putAll(offsets);
end
start
note right
void offset(TopicPartitiontp,longoffset)
end note
:log.debug("{} Setting offset for topic partition {} to {}",
this,tp,offset);
:offsets.put(tp,offset);
end
start
note right
void clearOffsets()
end note
:offsets.clear();
end
start
note right
Map<TopicPartition,Long>offsets()
end note
:return offsets;;
stop
end
start
note right
void timeout(longtimeoutMs)
end note
:log.debug("{} Setting timeout to {} ms",
this,timeoutMs);
:this.timeoutMs=timeoutMs;
end
start
note right
longtimeout()
end note
:return timeoutMs;;
stop
end
start
note right
Set<TopicPartition>assignment()
end note
if (consumer==null ) then (yes) 
:throw new IllegalWorkerStateException("SinkTaskContext may not be used to look up partition assignment until the task is initialized");;
endif 
:return consumer.assignment();;
stop
end
start
note right
void pause(TopicPartition... partitions)
end note
if (consumer==null ) then (yes) 
:throw new IllegalWorkerStateException("SinkTaskContext may not be used to pause consumption until the task is initialized");;
endif 
:Collections.addAll(pausedPartitions,partitions);
if (sinkTask.shouldPause()) then (yes) 
:log.debug("{} Connector is paused, so not pausing consumer's partitions {}",
this,partitions);
else (no)
:consumer.pause(Arrays.asList(partitions));
:log.debug("{} Pausing partitions {}. Connector is not paused.",
this,partitions);
endif 
:throw new IllegalWorkerStateException("SinkTasks may not pause partitions that are not currently assigned to them.",e);;
end
start
note right
void resume(TopicPartition... partitions)
end note
if (consumer==null ) then (yes) 
:throw new IllegalWorkerStateException("SinkTaskContext may not be used to resume consumption until the task is initialized");;
endif 
:pausedPartitions.removeAll(Arrays.asList(partitions));
if (sinkTask.shouldPause()) then (yes) 
:log.debug("{} Connector is paused, so not resuming consumer's partitions {}",
this,partitions);
else (no)
:consumer.resume(Arrays.asList(partitions));
:log.debug("{} Resuming partitions: {}",this,
partitions);
endif 
:throw new IllegalWorkerStateException("SinkTasks may not resume partitions that are not currently assigned to them.",e);;
end
start
note right
Set<TopicPartition>pausedPartitions()
end note
:return pausedPartitions;;
stop
end
start
note right
void requestCommit()
end note
:log.debug("{} Requesting commit",this);
:commitRequested=true;
end
start
note right
booleanisCommitRequested()
end note
:return commitRequested;;
stop
end
start
note right
void clearCommitRequest()
end note
:commitRequested=false;
end
start
note right
ErrantRecordReportererrantRecordReporter()
end note
:return sinkTask.workerErrantRecordReporter();;
stop
end
start
note right
StringtoString()
end note
:return "WorkerSinkTaskContext{"+"id="+sinkTask.id+
'}';;
stop
end
@enduml

