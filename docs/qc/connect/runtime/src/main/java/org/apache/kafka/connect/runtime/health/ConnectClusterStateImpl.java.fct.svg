@startuml
!pragma layout smetana
start
note right
constructor ConnectClusterStateImpl(longconnectorsTimeoutMs,
ConnectClusterDetailsclusterDetails,Herderherder)
end note
:this.herderRequestTimeoutMs=connectorsTimeoutMs;
:this.clusterDetails=clusterDetails;
:this.herder=herder;
end
start
note right
Collection<String>connectors()
end note
:herder.connectors(connectorsCallback);
:return connectorsCallback.get(herderRequestTimeoutMs,
TimeUnit.MILLISECONDS);;
stop
:throw new ConnectException("Failed to retrieve list of connectors",e);;
end
start
note right
ConnectorHealthconnectorHealth(StringconnName)
end note
:return new ConnectorHealth(connName,connectorState,
taskStates,ConnectorType.valueOf(state.type().name()));;
stop
end
start
note right
Map<String,String>connectorConfig(StringconnName)
end note
:herder.connectorConfig(connName,connectorConfigCallback);
:return new HashMap<>(connectorConfigCallback.get(herderRequestTimeoutMs,
TimeUnit.MILLISECONDS));;
stop
:throw new ConnectException(String.format("Failed to retrieve configuration for connector '%s'",
connName),e);;
end
start
note right
ConnectClusterDetailsclusterDetails()
end note
:return clusterDetails;;
stop
end
start
note right
Map<Integer,TaskState>taskStates(List<ConnectorStateInfo.TaskState>states)
end note
:taskStates.put(state.id(),new TaskState(state.id(),
state.state(),state.workerId(),state.trace()));
:return taskStates;;
stop
end
@enduml

