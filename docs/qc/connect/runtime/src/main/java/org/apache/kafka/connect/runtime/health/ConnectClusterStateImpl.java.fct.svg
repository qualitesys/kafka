" x1="319.5" x2="319.5" y1="1053.7617" y2="1076.3281"/><polygon fill="#181818" points="315.5,1066.3281,319.5,1076.3281,323.5,1066.3281,319.5,1070.3281" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="319.5" x2="319.5" y1="1110.2969" y2="1130.2969"/><polygon fill="#181818" points="315.5,1120.2969,319.5,1130.2969,323.5,1120.2969,319.5,1124.2969" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="319.5" x2="319.5" y1="1214.8633" y2="1237.4297"/><polygon fill="#181818" points="315.5,1227.4297,319.5,1237.4297,323.5,1227.4297,319.5,1231.4297" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="319.5" x2="319.5" y1="1285.3672" y2="1305.3672"/><polygon fill="#181818" points="315.5,1295.3672,319.5,1305.3672,323.5,1295.3672,319.5,1299.3672" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="319.5" x2="319.5" y1="1339.3359" y2="1359.3359"/><polygon fill="#181818" points="315.5,1349.3359,319.5,1359.3359,323.5,1349.3359,319.5,1353.3359" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[9df3a519eeb7b9460b571f264495a9cf]
@startuml
!pragma layout smetana
start
note right
constructor ConnectClusterStateImpl(longconnectorsTimeoutMs,
ConnectClusterDetailsclusterDetails,Herderherder)
end note
:this.herderRequestTimeoutMs=connectorsTimeoutMs;
:this.clusterDetails=clusterDetails;
:this.herder=herder;
end
start
note right
Collection<String>connectors()
end note
:herder.connectors(connectorsCallback);
:return connectorsCallback.get(herderRequestTimeoutMs,
TimeUnit.MILLISECONDS);;
stop
:throw new ConnectException("Failed to retrieve list of connectors",e);;
end
start
note right
ConnectorHealthconnectorHealth(StringconnName)
end note
:return new ConnectorHealth(connName,connectorState,
taskStates,ConnectorType.valueOf(state.type()
.name()));;
stop
end
start
note right
Map<String,String>connectorConfig(StringconnName)
end note
:herder.connectorConfig(connName,connectorConfigCallback);
:return new HashMap<>(connectorConfigCallback.get(herderRequestTimeoutMs,
TimeUnit.MILLISECONDS));;
stop
:throw new ConnectException(String.format("Failed to retrieve configuration for connector '%s'",
connName),e);;
end
start
note right
ConnectClusterDetailsclusterDetails()
end note
:return clusterDetails;;
stop
end
start
note right
Map<Integer,TaskState>taskStates(List<ConnectorStateInfo.TaskState>states)
end note
:taskStates.put(state.id(),new TaskState(state.id(),
state.state(),state.workerId(),state.trace()));
:return taskStates;;
stop
end
@enduml

