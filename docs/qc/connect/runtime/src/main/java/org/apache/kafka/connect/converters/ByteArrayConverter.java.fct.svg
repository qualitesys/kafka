@startuml
!pragma layout smetana
start
note right
ConfigDefconfig()
end note
:return CONFIG_DEF;;
stop
end
start
note right
void configure(Map<String,? >configs)
end note
end
start
note right
void configure(Map<String,? >configs,booleanisKey)
end note
end
start
note right
byte[]fromConnectData(Stringtopic,Schemaschema,Objectvalue)
end note
if (schema!=null &&schema.type()!=Schema.Type.BYTES) then (yes) 
:throw new DataException("Invalid schema type for ByteArrayConverter: "+
schema.type().toString());;
endif 
if (value!=null &&!(value instanceof byte[])) then (yes) 
:throw new DataException("ByteArrayConverter is not compatible with objects of type "+value.getClass());;
endif 
:return (byte[])value;;
stop
end
start
note right
