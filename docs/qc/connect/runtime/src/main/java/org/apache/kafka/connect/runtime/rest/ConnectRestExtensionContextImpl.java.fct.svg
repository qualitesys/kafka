@startuml
!pragma layout smetana
start
note right
constructor ConnectRestExtensionContextImpl(Configurable<?extendsConfigurable<?>> configurable,
ConnectClusterState clusterState)
end note
:this.configurable=configurable;;
:this.clusterState=clusterState;;
end
start
note right
Configurable<?extendsConfigurable<?>> configurable()
end note
:return configurable;;
stop
end
