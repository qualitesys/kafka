@startuml
!pragma layout smetana
:TOLERABLE_EXCEPTIONS.put(Stage.TRANSFORMATION,
Exception.class );;
:TOLERABLE_EXCEPTIONS.put(Stage.HEADER_CONVERTER,
Exception.class );;
:TOLERABLE_EXCEPTIONS.put(Stage.KEY_CONVERTER,
Exception.class );;
:TOLERABLE_EXCEPTIONS.put(Stage.VALUE_CONVERTER,
Exception.class );;
start
note right
constructor RetryWithToleranceOperator(longerrorRetryTimeout,
longerrorMaxDelayInMillis,ToleranceTypetoleranceType,
Timetime)
end note
:this(errorRetryTimeout,errorMaxDelayInMillis,
toleranceType,time,new ProcessingContext());;
end
start
note right
constructor RetryWithToleranceOperator(longerrorRetryTimeout,
longerrorMaxDelayInMillis,ToleranceTypetoleranceType,
Timetime,ProcessingContextcontext)
end note
:this.errorRetryTimeout=errorRetryTimeout;;
:this.errorMaxDelayInMillis=errorMaxDelayInMillis;;
:this.errorToleranceType=toleranceType;;
:this.time=time;;
:this.context=context;;
end
start
note right
Future<Void>executeFailed(Stagestage,Class<? >executingClass,
ConsumerRecord<byte[],byte[]>consumerRecord,
Throwableerror)
end note
:markAsFailed();;
:context.consumerRecord(consumerRecord);;
:context.currentContext(stage,executingClass);;
:context.error(error);;
:errorHandlingMetrics.recordFailure();;
:Future<Void>errantRecordFuture=context.report();;
if (!withinToleranceLimits()) then (yes) 
:errorHandlingMetrics.recordError();;
:throw new ConnectException("Tolerance exceeded in error handler",
error);;
stop
endif 
:return errantRecordFuture;;
stop
end
start
note right
Future<Void>executeFailed(Stagestage,Class<? >executingClass,
SourceRecordsourceRecord,Throwableerror)
end note
:markAsFailed();;
:context.sourceRecord(sourceRecord);;
:context.currentContext(stage,executingClass);;
:context.error(error);;
:errorHandlingMetrics.recordFailure();;
:Future<Void>errantRecordFuture=context.report();;
if (!withinToleranceLimits()) then (yes) 
:errorHandlingMetrics.recordError();;
:throw new ConnectException("Tolerance exceeded in Source Worker error handler",
error);;
stop
endif 
:return errantRecordFuture;;
stop
end
:context.currentContext(stage,executingClass);;
if (context.failed()) then (yes) 
:log.debug("ProcessingContext is already in failed state. Ignoring requested operation.");;
:return null ;;
stop
endif 
:try ;
:Class<?  extends Exception>ex=TOLERABLE_EXCEPTIONS.getOrDefault(context.stage(),
RetriableException.class );;
:return execAndHandleError(operation,ex);;
stop
:intattempt=0;;
:longstartTime=time.milliseconds();;
:longdeadline=startTime+errorRetryTimeout;;
repeat
:try ;
:attempt++;;
:return operation.call();;
stop
repeat while (true)
:try ;
:Vresult=execAndRetry(operation);;
if (context.failed()) then (yes) 
:markAsFailed();;
:errorHandlingMetrics.recordSkipped();;
endif 
:return result;;
stop
:catch (Exceptione);
:errorHandlingMetrics.recordFailure();;
:markAsFailed();;
:context.error(e);;
if (!tolerated.isAssignableFrom(e.getClass())) then (yes) 
:throw new ConnectException("Unhandled exception in error handler",e);;
stop
endif 
if (!withinToleranceLimits()) then (yes) 
:throw new ConnectException("Tolerance exceeded in error handler",e);;
stop
endif 
:errorHandlingMetrics.recordSkipped();;
:return null ;;
stop
start
note right
void markAsFailed()
end note
:errorHandlingMetrics.recordErrorTimestamp();;
:totalFailures++;;
end
start
note right
booleanwithinToleranceLimits()
end note
switch (switch (errorToleranceType))
endswith
end
start
note right
ToleranceTypegetErrorToleranceType()
end note
:return errorToleranceType;;
stop
end
start
note right
booleancheckRetry(longstartTime)
end note
:return (time.milliseconds()-startTime)<errorRetryTimeout;;
stop
end
start
note right
void backoff(intattempt,longdeadline)
end note
:intnumRetry=attempt-1;;
:longdelay=RETRIES_DELAY_MIN_MS<<numRetry;;
if (delay>errorMaxDelayInMillis) then (yes) 
:delay=ThreadLocalRandom.current().nextLong(errorMaxDelayInMillis);;
endif 
if (delay+time.milliseconds()>deadline) then (yes) 
:delay=deadline-time.milliseconds();;
endif 
:log.debug("Sleeping for {} millis",delay);;
:time.sleep(delay);;
end
start
note right
void metrics(ErrorHandlingMetricserrorHandlingMetrics)
end note
:this.errorHandlingMetrics=errorHandlingMetrics;;
end
start
note right
StringtoString()
end note
:return "RetryWithToleranceOperator{"+"errorRetryTimeout="+
errorRetryTimeout+", errorMaxDelayInMillis="+
errorMaxDelayInMillis+", errorToleranceType="+
errorToleranceType+", totalFailures="+totalFailures+
", time="+time+", context="+context+'}';;
stop
end
start
note right
void reporters(List<ErrorReporter>reporters)
end note
:this.context.reporters(reporters);;
end
start
note right
void sourceRecord(SourceRecordpreTransformRecord)
end note
:this.context.sourceRecord(preTransformRecord);;
end
start
note right
void consumerRecord(ConsumerRecord<byte[],
byte[]>consumedMessage)
end note
:this.context.consumerRecord(consumedMessage);;
end
start
note right
booleanfailed()
end note
:return this.context.failed();;
stop
end
start
note right
Throwableerror()
end note
:return this.context.error();;
stop
end
start
note right
void close()
end note
:this.context.close();;
end
@enduml

