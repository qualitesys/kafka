345.75" x2="345.75" y1="1032.2422" y2="1052.2422"/><polygon fill="#181818" points="341.75,1042.2422,345.75,1052.2422,349.75,1042.2422,345.75,1046.2422" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[93be2a8fc5d4b06ecb97c85cfb0d2d0a]
@startuml
!pragma layout smetana
start
note right
ResponsetoResponse(Exceptionexception)
end note
:log.debug("Uncaught exception in REST call to /{}",
uriInfo.getPath(),exception);
if (exception instanceof ConnectRestException) then (yes) 
:return Response.status(restException.statusCode())
.entity(new ErrorMessage(restException.errorCode(),
restException.getMessage())).build();;
stop
endif 
if (exception instanceof NotFoundException) then (yes) 
:return Response.status(Response.Status.NOT_FOUND)
.entity(new ErrorMessage(Response.Status.NOT_FOUND.getStatusCode(),
exception.getMessage())).build();;
stop
endif 
if (exception instanceof AlreadyExistsException) then (yes) 
:return Response.status(Response.Status.CONFLICT)
.entity(new ErrorMessage(Response.Status.CONFLICT.getStatusCode(),
exception.getMessage())).build();;
stop
endif 
if (!log.isDebugEnabled()) then (yes) 
:log.error("Uncaught exception in REST call to /{}",
uriInfo.getPath(),exception);
endif 
if (exception instanceof WebApplicationException) then (yes) 
:statusCode=statusInfo.getStatusCode();
else (no)
:statusCode=Response.Status.INTERNAL_SERVER_ERROR.getStatusCode();
endif 
:return Response.status(statusCode).entity(new ErrorMessage(statusCode,
exception.getMessage())).build();;
stop
end
@enduml

