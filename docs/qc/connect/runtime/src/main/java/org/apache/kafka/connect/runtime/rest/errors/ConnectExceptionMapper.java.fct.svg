@startuml
!pragma layout smetana
start
note right
Response toResponse(Exception exception)
end note
:log.debug("Uncaught exception in REST call to /{}",
uriInfo.getPath(),exception);;
if (exception instanceof ConnectRestException ) then (yes) 
:ConnectRestException restException=(ConnectRestException )exception;;
:return Response.status(restException.statusCode()).entity(new ErrorMessage(restException.errorCode(),
restException.getMessage())).build();;
stop
endif 
if (exception instanceof NotFoundException ) then (yes) 
:return Response.status(Response.Status.NOT_FOUND).entity(new ErrorMessage(Response.Status.NOT_FOUND.getStatusCode(),
exception.getMessage())).build();;
stop
endif 
if (exception instanceof AlreadyExistsException ) then (yes) 
:return Response.status(Response.Status.CONFLICT).entity(new ErrorMessage(Response.Status.CONFLICT.getStatusCode(),
exception.getMessage())).build();;
stop
endif 
if (!log.isDebugEnabled()) then (yes) 
:log.error("Uncaught exception in REST call to /{}",
uriInfo.getPath(),exception);;
endif 
:final int statusCode;;
if (exception instanceof WebApplicationException ) then (yes) 
:Response.StatusType statusInfo=((WebApplicationException )exception)
.getResponse().getStatusInfo();;
:statusCode=statusInfo.getStatusCode();;
else (no)
:statusCode=Response.Status.INTERNAL_SERVER_ERROR.getStatusCode();;
endif 
:return Response.status(statusCode).entity(new ErrorMessage(statusCode,
exception.getMessage())).build();;
stop
end
@enduml

