-width:1.0;" x1="588.5" x2="588.5" y1="810.1133" y2="832.6797"/><polygon fill="#181818" points="584.5,822.6797,588.5,832.6797,592.5,822.6797,588.5,826.6797" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="588.5" x2="588.5" y1="866.6484" y2="886.6484"/><polygon fill="#181818" points="584.5,876.6484,588.5,886.6484,592.5,876.6484,588.5,880.6484" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="588.5" x2="588.5" y1="948.5547" y2="968.5547"/><polygon fill="#181818" points="584.5,958.5547,588.5,968.5547,592.5,958.5547,588.5,962.5547" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[608077de7eafaf665311da329bde33c8]
@startuml
!pragma layout smetana
:ClassLoader.registerAsParallelCapable();;
start
note right
constructor PluginClassLoader(URLpluginLocation,
URL[]urls,ClassLoaderparent)
end note
:super (urls,parent);;
:this.pluginLocation=pluginLocation;;
end
start
note right
constructor PluginClassLoader(URLpluginLocation,
URL[]urls)
end note
:super (urls);;
:this.pluginLocation=pluginLocation;;
end
start
note right
Stringlocation()
end note
:return pluginLocation.toString();;
stop
end
start
note right
StringtoString()
end note
:return "PluginClassLoader{pluginLocation="+
pluginLocation+"}";;
stop
end
start
note right
Class<? >loadClass(Stringname,booleanresolve)
end note
:synchronized (getClassLoadingLock(name)){Class<? >klass=findLoadedClass(name);
:if (klass==null ){try {if (PluginUtils.shouldLoadInIsolation(name)){klass=findClass(name);}}catch (ClassNotFoundExceptione){log.trace("Class '{}' not found. Delegating to parent",
name);}}if (klass==null ){klass=super .loadClass(name,
false);}if (resolve){resolveClass(klass);}return klass;};
end
@enduml

