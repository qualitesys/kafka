81818;stroke-width:1.0;" x1="590.5" x2="590.5" y1="810.1133" y2="832.6797"/><polygon fill="#181818" points="586.5,822.6797,590.5,832.6797,594.5,822.6797,590.5,826.6797" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="590.5" x2="590.5" y1="866.6484" y2="886.6484"/><polygon fill="#181818" points="586.5,876.6484,590.5,886.6484,594.5,876.6484,590.5,880.6484" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="590.5" x2="590.5" y1="948.5547" y2="968.5547"/><polygon fill="#181818" points="586.5,958.5547,590.5,968.5547,594.5,958.5547,590.5,962.5547" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[3ef3ace119ca8169fe6839853d83e759]
@startuml
!pragma layout smetana
:ClassLoader.registerAsParallelCapable();;
start
note right
constructor PluginClassLoader(URL pluginLocation,
URL[] urls,ClassLoader parent)
end note
:super (urls,parent);;
:this.pluginLocation=pluginLocation;;
end
start
note right
constructor PluginClassLoader(URL pluginLocation,
URL[] urls)
end note
:super (urls);;
:this.pluginLocation=pluginLocation;;
end
start
note right
String location()
end note
:return pluginLocation.toString();;
stop
end
start
note right
String toString()
end note
:return "PluginClassLoader{pluginLocation="+
pluginLocation+"}";;
stop
end
start
note right
Class<?> loadClass(String name,boolean resolve)
end note
:synchronized (getClassLoadingLock(name)){Class<?> klass=findLoadedClass(name);
:if (klass==null ){try {if (PluginUtils.shouldLoadInIsolation(name)){klass=findClass(name);}}catch (ClassNotFoundException e){log.trace("Class '{}' not found. Delegating to parent",
name);}}if (klass==null ){klass=super .loadClass(name,
false);}if (resolve){resolveClass(klass);}return klass;};
end
@enduml

