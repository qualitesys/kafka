start
note right
constructor SafeObjectInputStream(InputStream in)
end note
:super (in);;
end
start
note right
Class<?> resolveClass(ObjectStreamClass desc)
end note
:String name=desc.getName();;
if (isBlocked(name)) then (yes) 
:throw new SecurityException("Illegal type to deserialize: prevented for security reasons");;
stop
endif 
:return super .resolveClass(desc);;
stop
end
start
note right
boolean isBlocked(String name)
end note
if (name.endsWith(list)) then (yes) 
:return true;;
stop
endif 
:return false;;
stop
end
