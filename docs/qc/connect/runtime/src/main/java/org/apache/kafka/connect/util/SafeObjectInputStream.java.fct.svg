@startuml
!pragma layout smetana
start
note right
constructor SafeObjectInputStream(InputStreamin)
end note
end
start
note right
Class<? >resolveClass(ObjectStreamClassdesc)
end note
if (isBlocked(name)) then (yes) 
:throw new SecurityException("Illegal type to deserialize: prevented for security reasons");;
endif 
:return super .resolveClass(desc);;
stop
end
start
note right
booleanisBlocked(Stringname)
end note
if (name.endsWith(list)) then (yes) 
:return true;;
stop
endif 
:return false;;
stop
end
@enduml

