@startuml
!pragma layout smetana
start
note right
constructor ConfigInfo(@JsonProperty ("definition")ConfigKeyInfoconfigKey,
@JsonProperty ("value")ConfigValueInfoconfigValue)
end note
end
start
note right
ConfigKeyInfoconfigKey()
end note
:return configKey;;
stop
end
start
note right
ConfigValueInfoconfigValue()
end note
:return configValue;;
stop
end
start
note right
booleanequals(Objecto)
end note
if (this==o) then (yes) 
:return true;;
stop
endif 
if (o==null ||getClass()!=o.getClass()) then (yes) 
:return false;;
stop
endif 
:return Objects.equals(configKey,that.configKey)&&Objects.equals(configValue,
that.configValue);;
stop
end
start
note right
inthashCode()
end note
:return Objects.hash(configKey,configValue);;
stop
end
start
note right
StringtoString()
end note
:return "["+configKey+","+configValue+"]";;
stop
end
@enduml

