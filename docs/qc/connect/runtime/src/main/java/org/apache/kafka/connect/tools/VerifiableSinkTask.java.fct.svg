@startuml
!pragma layout smetana
start
note right
Stringversion()
end note
:return new VerifiableSinkConnector().version();;
stop
end
start
note right
void start(Map<String,String>props)
end note
:throw new ConnectException("Invalid VerifiableSourceTask configuration",e);;
end
start
note right
void put(Collection<SinkRecord>records)
end note
end
start
note right
void flush(Map<TopicPartition,OffsetAndMetadata>offsets)
end note
if (!unflushed.containsKey(topicPartition)) then (yes) 
endif 
end
start
note right
void stop()
end note
end
@enduml

