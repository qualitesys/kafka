@startuml
!pragma layout smetana
start
note right
constructor ErrorMessage(@JsonProperty ("error_code")interrorCode,
@JsonProperty ("message")Stringmessage)
end note
:this.errorCode=errorCode;;
:this.message=message;;
end
start
note right
interrorCode()
end note
:return errorCode;;
stop
end
start
note right
Stringmessage()
end note
:return message;;
stop
end
start
note right
booleanequals(Objecto)
end note
if (this==o) then (yes) 
:return true;;
stop
endif 
if (o==null ||getClass()!=o.getClass()) then (yes) 
:return false;;
stop
endif 
:return Objects.equals(errorCode,that.errorCode)&&Objects.equals(message,
that.message);;
stop
end
start
note right
inthashCode()
end note
:return Objects.hash(errorCode,message);;
stop
end
@enduml

