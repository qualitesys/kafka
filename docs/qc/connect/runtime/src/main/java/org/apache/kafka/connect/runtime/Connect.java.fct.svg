@startuml
!pragma layout smetana
start
note right
constructor Connect(Herderherder,RestServerrest)
end note
:log.debug("Kafka Connect instance created");;
:this.herder=herder;;
:this.rest=rest;;
:shutdownHook=new ShutdownHook();;
end
start
note right
void start()
end note
:try {log.info("Kafka Connect starting");Exit.addShutdownHook("connect-shutdown-hook",
shutdownHook);herder.start();rest.initializeResources(herder);log.info("Kafka Connect started");}finally {startLatch.countDown();};
end
start
note right
void stop()
end note
:try {booleanwasShuttingDown=shutdown.getAndSet(true);
:if (!wasShuttingDown){log.info("Kafka Connect stopping");
:rest.stop();herder.stop();log.info("Kafka Connect stopped");
:}}finally {stopLatch.countDown();};
end
start
note right
void awaitStop()
end note
:try {stopLatch.await();}catch (InterruptedExceptione){log.error("Interrupted waiting for Kafka Connect to shutdown");};
end
start
note right
booleanisRunning()
end note
:return herder.isRunning();;
stop
end
start
note right
RestServerrest()
end note
:return rest;;
stop
end
start
note right
void run()
end note
:try {startLatch.await();Connect.this.stop();
