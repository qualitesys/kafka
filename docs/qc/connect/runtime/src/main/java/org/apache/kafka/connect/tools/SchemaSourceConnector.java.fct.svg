@startuml
!pragma layout smetana
start
note right
Stringversion()
end note
:return AppInfoParser.getVersion();;
stop
end
start
note right
void start(Map<String,String>props)
end note
:this.config=props;;
end
start
note right
Class<?  extends Task>taskClass()
end note
:return SchemaSourceTask.class ;;
stop
end
start
note right
List<Map<String,String>>taskConfigs(intmaxTasks)
end note
:ArrayList<Map<String,String>>configs=new ArrayList<>();;
:Map<String,String>props=new HashMap<>(config);;
:props.put(SchemaSourceTask.ID_CONFIG,String.valueOf(i));;
:configs.add(props);;
:return configs;;
stop
end
start
note right
void stop()
end note
end
start
note right
ConfigDefconfig()
end note
:return new ConfigDef();;
stop
end
@enduml

