@startuml
!pragma layout smetana
start
note right
constructor InternalSinkRecord(ConsumerRecord<byte[],
byte[]> originalRecord,SinkRecord record )
end note
:super (record .topic(),record .kafkaPartition(),
record .keySchema(),record .key(),record .valueSchema(),
record .value(),record .kafkaOffset(),record .timestamp(),
record .timestampType(),record .headers());;
:this.originalRecord=originalRecord;;
end
start
note right
constructor InternalSinkRecord(ConsumerRecord<byte[],
byte[]> originalRecord,String topic,int partition,
Schema keySchema,Object key,Schema valueSchema,
Object value,long kafkaOffset,Long timestamp,
TimestampType timestampType,Iterable<Header> headers)
end note
:super (topic,partition,keySchema,key,valueSchema,
value,kafkaOffset,timestamp,timestampType,
headers);;
:this.originalRecord=originalRecord;;
end
start
note right
SinkRecord newRecord(String topic,Integer kafkaPartition,
Schema keySchema,Object key,Schema valueSchema,
Object value,Long timestamp,Iterable<Header> headers)
end note
:return new InternalSinkRecord(originalRecord,
topic,kafkaPartition,keySchema,key,valueSchema,
value,kafkaOffset(),timestamp,timestampType(),
headers());;
stop
end
start
note right
boolean equals(Object o)
end note
:return super .equals(o);;
stop
end
start
note right
int hashCode()
end note
:return super .hashCode();;
stop
end
start
note right
String toString()
end note
:return super .toString();;
stop
end
start
note right
ConsumerRecord<byte[],byte[]> originalRecord()
end note
:return originalRecord;;
stop
end
@enduml

