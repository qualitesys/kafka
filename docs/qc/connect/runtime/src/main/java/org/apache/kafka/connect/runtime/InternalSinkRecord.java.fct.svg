="stroke:#181818;stroke-width:1.0;"/><!--MD5=[e762d6f185d5c77789429905f7df6f47]
@startuml
!pragma layout smetana
start
note right
constructor InternalSinkRecord(ConsumerRecord<byte[],byte[]>originalRecord,SinkRecordrecord)
end note
:super (record.topic(),record.kafkaPartition(),
record.keySchema(),record.key(),record.valueSchema(),
record.value(),record.kafkaOffset(),record.timestamp(),
record.timestampType(),record.headers());
:this.originalRecord=originalRecord;
end
start
note right
constructor InternalSinkRecord(ConsumerRecord<byte[],byte[]>originalRecord,Stringtopic,intpartition,SchemakeySchema,Objectkey,SchemavalueSchema,Objectvalue,longkafkaOffset,Longtimestamp,TimestampTypetimestampType,Iterable<Header>headers)
end note
:super (topic,partition,keySchema,key,valueSchema,
value,kafkaOffset,timestamp,timestampType,
headers);
:this.originalRecord=originalRecord;
end
start
note right
SinkRecordnewRecord(Stringtopic,IntegerkafkaPartition,SchemakeySchema,Objectkey,SchemavalueSchema,Objectvalue,Longtimestamp,Iterable<Header>headers)
end note
:return new InternalSinkRecord(originalRecord,
topic,kafkaPartition,keySchema,key,valueSchema,
value,kafkaOffset(),timestamp,timestampType(),
headers());;
stop
end
start
note right
booleanequals(Objecto)
end note
:return super .equals(o);;
stop
end
start
note right
inthashCode()
end note
:return super .hashCode();;
stop
end
start
note right
StringtoString()
end note
:return super .toString();;
stop
end
start
note right
ConsumerRecord<byte[],byte[]>originalRecord()
end note
:return originalRecord;;
stop
end
@enduml

