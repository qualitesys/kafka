@startuml
!pragma layout smetana
start
note right
constructor InternalSinkRecord(ConsumerRecord<byte[],
byte[]>originalRecord,SinkRecordrecord)
end note
end
start
note right
constructor InternalSinkRecord(ConsumerRecord<byte[],
byte[]>originalRecord,Stringtopic,intpartition,
SchemakeySchema,Objectkey,SchemavalueSchema,
Objectvalue,longkafkaOffset,Longtimestamp,
TimestampTypetimestampType,Iterable<Header>headers)
end note
end
start
note right
SinkRecordnewRecord(Stringtopic,IntegerkafkaPartition,
SchemakeySchema,Objectkey,SchemavalueSchema,
Objectvalue,Longtimestamp,Iterable<Header>headers)
end note
:return new InternalSinkRecord(originalRecord,
topic,kafkaPartition,keySchema,key,valueSchema,
value,kafkaOffset(),timestamp,timestampType(),
headers());;
stop
end
start
note right
booleanequals(Objecto)
end note
:return super .equals(o);;
stop
end
start
note right
inthashCode()
end note
:return super .hashCode();;
stop
end
start
note right
StringtoString()
end note
:return super .toString();;
stop
end
start
note right
ConsumerRecord<byte[],byte[]>originalRecord()
end note
:return originalRecord;;
stop
end
@enduml

