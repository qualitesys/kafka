@startuml
!pragma layout smetana
start
note right
String version()
end note
:return AppInfoParser.getVersion();;
stop
end
start
note right
void start(Map<String,String> props)
end note
:this.config=props;;
end
start
note right
Class<?extendsTask> taskClass()
end note
:return VerifiableSourceTask.class ;;
stop
end
start
note right
List<Map<String,String>> taskConfigs(int maxTasks)
end note
:ArrayList<Map<String,String>> configs=new ArrayList<>();;
:Map<String,String> props=new HashMap<>(config);;
:props.put(VerifiableSourceTask.ID_CONFIG,
String.valueOf(i));;
:configs.add(props);;
:return configs;;
stop
end
start
note right
void stop()
end note
end
start
note right
ConfigDef config()
end note
:return new ConfigDef();;
stop
end
@enduml

