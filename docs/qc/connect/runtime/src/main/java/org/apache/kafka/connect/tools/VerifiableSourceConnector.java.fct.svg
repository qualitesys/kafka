@startuml
!pragma layout smetana
start
note right
Stringversion()
end note
:return AppInfoParser.getVersion();;
stop
end
start
note right
void start(Map<String,String>props)
end note
:this.config=props;
end
start
note right
Class<?  extends Task>taskClass()
end note
:return VerifiableSourceTask.class ;;
stop
end
start
note right
List<Map<String,String>>taskConfigs(intmaxTasks)
end note
:i++;
:props.put(VerifiableSourceTask.ID_CONFIG,
String.valueOf(i));
:configs.add(props);
:return configs;;
stop
end
start
note right
void stop()
end note
end
start
note right
ConfigDefconfig()
end note
:return new ConfigDef();;
stop
end
@enduml

