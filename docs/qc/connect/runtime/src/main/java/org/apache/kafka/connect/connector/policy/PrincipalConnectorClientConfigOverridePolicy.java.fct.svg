@startuml
!pragma layout smetana
start
note right
String policyName()
end note
:return "Principal";;
stop
end
start
note right
boolean isAllowed(ConfigValue configValue)
end note
:return ALLOWED_CONFIG.contains(configValue.name());;
stop
end
start
note right
void configure(Map<String,?> configs)
end note
:log.info("Setting up Principal policy for ConnectorClientConfigOverride. This will allow  sasl  client configuration to be "+
"overridden.");;
end
@enduml

