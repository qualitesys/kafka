,436.5,431.3047,440.5,421.3047,436.5,425.3047" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[2c57eec2d13ff933fa9644bfd8e8dda4]
@startuml
!pragma layout smetana
start
note right
StringpolicyName()
end note
:return "Principal";;
stop
end
start
note right
booleanisAllowed(ConfigValueconfigValue)
end note
:return ALLOWED_CONFIG.contains(configValue.name());;
stop
end
start
note right
void configure(Map<String,? >configs)
end note
:log.info("Setting up Principal policy for ConnectorClientConfigOverride. This will allow `sasl` client configuration to be "+"overridden.");
end
@enduml

