oke:#181818;stroke-width:1.0;" x1="393.5" x2="393.5" y1="425.2734" y2="445.2734"/><polygon fill="#181818" points="389.5,435.2734,393.5,445.2734,397.5,435.2734,393.5,439.2734" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[b6c431aaa1d5927e1361e279f22acaa2]
@startuml
!pragma layout smetana
start
note right
StringpolicyName()
end note
:return "Principal";;
stop
end
start
note right
booleanisAllowed(ConfigValueconfigValue)
end note
:return ALLOWED_CONFIG.contains(configValue.name());;
stop
end
start
note right
void configure(Map<String,? >configs)
end note
:log.info("Setting up Principal policy for ConnectorClientConfigOverride. This will allow `sasl` client configuration to be "+
"overridden.");;
end
@enduml

