@startuml
!pragma layout smetana
start
note right
void main(String[]args)
end note
if (args.length<1||Arrays.asList(args).contains("- -help")) then (yes) 
:log.info("Usage: ConnectDistributed worker.properties");;
:Exit.exit(1);;
endif 
:try {WorkerInfoinitInfo=new WorkerInfo();initInfo.logAll();StringworkerPropsFile=args[0];Map<String,
String>workerProps=!workerPropsFile.isEmpty()? Utils.propsToStringMap(Utils.loadProps(workerPropsFile)):Collections.emptyMap();ConnectDistributedconnectDistributed=new ConnectDistributed();Connectconnect=connectDistributed.startConnect(workerProps);connect.awaitStop();}catch (Throwablet){log.error("Stopping due to error",t);Exit.exit(2);};
end
start
note right
ConnectstartConnect(Map<String,String>workerProps)
end note
:log.info("Scanning for plugin classes. This might take a moment ...");;
:plugins.compareAndSwapWithDelegatingLoader();;
:log.debug("Kafka cluster ID: {}",kafkaClusterId);;
:rest.initializeServer();;
:ConnectUtils.addMetricsContextProperties(adminProps,
config,kafkaClusterId);;
:offsetBackingStore.configure(config);;
:statusBackingStore.configure(config);;
:log.info("Kafka Connect distributed worker initialization took {}ms",
time.hiResClockMs()-initStart);;
:try {connect.start();}catch (Exceptione){log.error("Failed to start Connect",
e);connect.stop();Exit.exit(3);};
:return connect;;
stop
end
@enduml

