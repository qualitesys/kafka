@startuml
!pragma layout smetana
start
note right
void close()
end note
end
start
note right
List<ConfigValue> validate(ConnectorClientConfigRequest connectorClientConfigRequest)
end note
:Map<String,Object> inputConfig=connectorClientConfigRequest.clientProps();;
:return inputConfig.entrySet().stream().map(this::configValue)
.collect(Collectors.toList());;
stop
end
start
note right
ConfigValue configValue(Map.Entry<String,
Object> configEntry)
end note
:ConfigValue configValue=new ConfigValue(configEntry.getKey(),
configEntry.getValue(),new ArrayList<>(),
new ArrayList<>());;
:validate(configValue);;
:return configValue;;
stop
end
start
note right
void validate(ConfigValue configValue)
end note
if (!isAllowed(configValue)) then (yes) 
:configValue.addErrorMessage("The '"+policyName()+
"' policy does not allow '"+configValue.name()+
"' to be overridden in the connector configuration.");;
endif 
end
@enduml

