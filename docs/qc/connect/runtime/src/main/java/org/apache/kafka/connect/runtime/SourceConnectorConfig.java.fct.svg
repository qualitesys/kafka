note right
ConfigDefenrich(ConfigDefbaseConfigDef,Map<String,String>props,AbstractConfigdefaultGroupConfig)
end note
if (aliases instanceof List) then (yes) 
:topicCreationGroups.addAll((List<? >)aliases);
endif 
:topicCreationGroups.stream().distinct().forEach(group->{if (!(group instanceof String)){throw new ConfigException("Item in "+TOPIC_CREATION_GROUPS_CONFIG+" property is not of type String");}Stringalias=(String)group;Stringprefix=TOPIC_CREATION_PREFIX+alias+".";StringconfigGroup=TOPIC_CREATION_GROUP+": "+alias;newDef.embed(prefix,configGroup,0,TopicCreationConfig.configDef(configGroup,defaultGroupReplicationFactor,defaultGroupPartitions));});
:return newDef;;
