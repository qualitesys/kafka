:return new ConfigDef(ConnectorConfig.configDef()).define(TOPIC_CREATION_GROUPS_CONFIG,ConfigDef.Type.LIST,Collections.emptyList(),ConfigDef.CompositeValidator.of(new ConfigDef.NonNullValidator(),ConfigDef.LambdaValidator.with((name,value)->{List<? >groupAliases=(List<? >)value;if (groupAliases.size()>new HashSet<>(groupAliases).size()){throw new ConfigException(name,value,"Duplicate alias provided.");}},()->"unique topic creation groups")),ConfigDef.Importance.LOW,TOPIC_CREATION_GROUPS_DOC,TOPIC_CREATION_GROUP,++orderInGroup,ConfigDef.Width.LONG,TOPIC_CREATION_GROUPS_DISPLAY).define(EXACTLY_ONCE_SUPPORT_CONFIG,ConfigDef.Type.STRING,REQUESTED.toString(),ConfigDef.CaseInsensitiveValidString.in(enumOptions(ExactlyOnceSupportLevel.class )),ConfigDef.Importance.MEDIUM,EXACTLY_ONCE_SUPPORT_DOC,EXACTLY_ONCE_SUPPORT_GROUP,++orderInGroup,ConfigDef.Width.SHORT,EXACTLY_ONCE_SUPPORT_DISPLAY).define(TRANSACTION_BOUNDARY_CONFIG,ConfigDef.Type.STRING,DEFAULT.toString(),ConfigDef.CaseInsensitiveValidString.in(enumOptions(TransactionBoundary.class )),ConfigDef.Importance.MEDIUM,TRANSACTION_BOUNDARY_DOC,EXACTLY_ONCE_SUPPORT_GROUP,++orderInGroup,ConfigDef.Width.SHORT,TRANSACTION_BOUNDARY_DISPLAY).define(TRANSACTION_BOUNDARY_INTERVAL_CONFIG,ConfigDef.Type.LONG,null ,ConfigDef.LambdaValidator.with((name,value)->{if (value==null ){return ;}atLeastZero.ensureValid(name,value);},atLeastZero::toString),ConfigDef.Importance.LOW,TRANSACTION_BOUNDARY_INTERVAL_DOC,EXACTLY_ONCE_SUPPORT_GROUP,++orderInGroup,ConfigDef.Width.SHORT,TRANSACTION_BOUNDARY_INTERVAL_DISPLAY).define(OFFSETS_TOPIC_CONFIG,ConfigDef.Type.STRING,null ,new ConfigDef.NonEmptyString(),ConfigDef.Importance.LOW,OFFSETS_TOPIC_DOC,OFFSETS_TOPIC_GROUP,orderInGroup=1,ConfigDef.Width.LONG,OFFSETS_TOPIC_DISPLAY);;
stop
