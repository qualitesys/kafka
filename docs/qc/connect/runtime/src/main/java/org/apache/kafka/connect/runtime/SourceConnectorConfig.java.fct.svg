note right
Map<String,Object>topicCreationOtherConfigs(Stringgroup)
end note
if (enrichedSourceConfig==null ) then (yes) 
:return Collections.emptyMap();;
stop
endif 
:return enrichedSourceConfig.originalsWithPrefix(TOPIC_CREATION_PREFIX+
group+'.').entrySet().stream().filter(e->{Stringkey=e.getKey();return !(INCLUDE_REGEX_CONFIG.equals(key)||EXCLUDE_REGEX_CONFIG.equals(key)||REPLICATION_FACTOR_CONFIG.equals(key)||PARTITIONS_CONFIG.equals(key));}).collect(Collectors.toMap(Map.Entry::getKey,Map.Entry::getValue));;
stop
end
start
note right
void main(String[]args)
end note
:System.out.println(configDef().toHtml(4,config->"sourceconnectorconfigs_"+
config));
end
