note right
constructor SourceConnectorConfig(Pluginsplugins,Map<String,String>props,booleancreateTopics)
end note
:super (plugins,configDef(),props);
if (createTopics&&props.entrySet().stream().anyMatch(e->e.getKey().startsWith(TOPIC_CREATION_PREFIX))) then (yes) 
:propsWithoutRegexForDefaultGroup.entrySet().removeIf(e->e.getKey().equals(DEFAULT_TOPIC_CREATION_PREFIX+INCLUDE_REGEX_CONFIG)||e.getKey().equals(DEFAULT_TOPIC_CREATION_PREFIX+EXCLUDE_REGEX_CONFIG));
:enrichedSourceConfig=new EnrichedSourceConnectorConfig(plugins,
enrich(defaultConfigDef,props,defaultGroup),
propsWithoutRegexForDefaultGroup);
else (no)
:enrichedSourceConfig=null ;
endif 
:transactionBoundary=TransactionBoundary.fromProperty(getString(TRANSACTION_BOUNDARY_CONFIG));
:transactionBoundaryInterval=getLong(TRANSACTION_BOUNDARY_INTERVAL_CONFIG);
:offsetsTopic=getString(OFFSETS_TOPIC_CONFIG);
end
start
note right
booleanusesTopicCreation(Map<String,String>props)
end note
:return props.entrySet().stream().anyMatch(e->e.getKey().startsWith(TOPIC_CREATION_PREFIX));;
stop
end
start
