224.5,727.1094,228.5,717.1094,224.5,721.1094" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="224.5" x2="224.5" y1="761.0781" y2="781.0781"/><polygon fill="#181818" points="220.5,771.0781,224.5,781.0781,228.5,771.0781,224.5,775.0781" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[35e3eedcb48022388d41b17a15d9bff3]
@startuml
!pragma layout smetana
start
note right
ConnectorType from(Class<?extendsConnector> clazz)
end note
if (SinkConnector.class .isAssignableFrom(clazz)) then (yes) 
:return SINK;;
stop
endif 
if (SourceConnector.class .isAssignableFrom(clazz)) then (yes) 
:return SOURCE;;
stop
endif 
:return UNKNOWN;;
stop
end
start
note right
String toString()
end note
:return super .toString().toLowerCase(Locale.ROOT);;
stop
end
start
note right
ConnectorType forValue(String value)
end note
:return ConnectorType.valueOf(value.toUpperCase(Locale.ROOT));;
stop
end
@enduml

