@startuml
!pragma layout smetana
:validateConnectorConfig(connectorConfig,
callback);;
start
note right
constructor Created(boolean created,T result)
end note
:this.created=created;;
:this.result=result;;
end
start
note right
boolean created()
end note
:return created;;
stop
end
start
note right
T result()
end note
:return result;;
stop
end
start
note right
boolean equals(Object o)
end note
if (this==o) then (yes) 
:return true;;
stop
endif 
if (o==null ||getClass()!=o.getClass()) then (yes) 
:return false;;
stop
endif 
:Created<?> created1=(Created<?> )o;;
:return Objects.equals(created,created1.created)&&Objects.equals(result,
created1.result);;
stop
end
start
note right
int hashCode()
end note
:return Objects.hash(created,result);;
stop
end
@enduml

