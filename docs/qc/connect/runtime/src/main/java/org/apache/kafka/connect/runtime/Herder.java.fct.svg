@startuml
!pragma layout smetana
start
note right
constructor Created(booleancreated,Tresult)
end note
end
start
note right
booleancreated()
end note
:return created;;
stop
end
start
note right
Tresult()
end note
:return result;;
stop
end
start
note right
booleanequals(Objecto)
end note
if (this==o) then (yes) 
:return true;;
stop
endif 
if (o==null ||getClass()!=o.getClass()) then (yes) 
:return false;;
stop
endif 
:return Objects.equals(created,created1.created)&&Objects.equals(result,
created1.result);;
stop
end
start
note right
inthashCode()
end note
:return Objects.hash(created,result);;
stop
end
