@startuml
!pragma layout smetana
start
note right
constructor ExactlyOnceWorkerSourceTask(ConnectorTaskIdid,
SourceTasktask,TaskStatus.ListenerstatusListener,
TargetStateinitialState,ConverterkeyConverter,
ConvertervalueConverter,HeaderConverterheaderConverter,
TransformationChain<SourceRecord>transformationChain,
Producer<byte[],byte[]>producer,TopicAdminadmin,
Map<String,TopicCreationGroup>topicGroups,
CloseableOffsetStorageReaderoffsetReader,
OffsetStorageWriteroffsetWriter,ConnectorOffsetBackingStoreoffsetStore,
WorkerConfigworkerConfig,ClusterConfigStateconfigState,
ConnectMetricsconnectMetrics,ClassLoaderloader,
Timetime,RetryWithToleranceOperatorretryWithToleranceOperator,
StatusBackingStorestatusBackingStore,SourceConnectorConfigsourceConfig,
ExecutorcloseExecutor,RunnablepreProducerCheck,
RunnablepostProducerCheck)
end note
:super (id,task,statusListener,initialState,
keyConverter,valueConverter,headerConverter,
transformationChain,new WorkerSourceTaskContext(offsetReader,
id,configState,buildTransactionContext(sourceConfig)),
producer,admin,topicGroups,offsetReader,offsetWriter,
offsetStore,workerConfig,connectMetrics,loader,
time,retryWithToleranceOperator,statusBackingStore,
closeExecutor);;
:this.transactionOpen=false;;
:this.commitableRecords=new LinkedHashMap<>();;
:this.preProducerCheck=preProducerCheck;;
:this.postProducerCheck=postProducerCheck;;
:this.transactionBoundaryManager=buildTransactionManager(workerConfig,
sourceConfig,sourceTaskContext.transactionContext());;
:this.transactionMetrics=new TransactionMetricsGroup(id,
connectMetrics);;
end
start
note right
WorkerTransactionContextbuildTransactionContext(SourceConnectorConfigsourceConfig)
end note
:return TransactionBoundary.CONNECTOR.equals(sourceConfig.transactionBoundary())? new WorkerTransactionContext():null ;;
stop
end
start
note right
void prepareToInitializeTask()
end note
:preProducerCheck.run();;
if (isStopping()) then (yes) 
:return ;;
stop
endif 
:producer.initTransactions();;
:postProducerCheck.run();;
end
start
note right
void prepareToEnterSendLoop()
end note
:transactionBoundaryManager.initialize();;
end
start
note right
void beginSendIteration()
end note
end
start
note right
void prepareToPollTask()
end note
end
start
note right
void recordDropped(SourceRecordrecord)
end note
:synchronized (commitableRecords){commitableRecords.put(record,
null );};
:transactionBoundaryManager.maybeCommitTransactionForRecord(record);;
end
start
note right
Optional<SubmittedRecords.SubmittedRecord>prepareToSendRecord(SourceRecordsourceRecord,
ProducerRecord<byte[],byte[]>producerRecord)
end note
if (offsetStore.primaryOffsetsTopic().equals(producerRecord.topic())) then (yes) 
:throw new ConnectException("Source tasks may not produce to their own offsets topics when exactly-once support is enabled");;
stop
endif 
:maybeBeginTransaction();;
:return Optional.empty();;
stop
end
start
note right
void recordDispatched(SourceRecordrecord)
end note
:offsetWriter.offset(record.sourcePartition(),
record.sourceOffset());;
:transactionMetrics.addRecord();;
:transactionBoundaryManager.maybeCommitTransactionForRecord(record);;
end
start
note right
void batchDispatched()
end note
:transactionBoundaryManager.maybeCommitTransactionForBatch();;
end
start
note right
void recordSent(SourceRecordsourceRecord,
ProducerRecord<byte[],byte[]>producerRecord,
RecordMetadatarecordMetadata)
end note
:synchronized (commitableRecords){commitableRecords.put(sourceRecord,
recordMetadata);};
end
start
note right
void producerSendFailed(booleansynchronous,
ProducerRecord<byte[],byte[]>producerRecord,
SourceRecordpreTransformRecord,Exceptione)
end note
if (synchronous) then (yes) 
:throw maybeWrapProducerSendException("Unrecoverable exception trying to send",e);;
stop
else (no)
endif 
end
start
note right
void finalOffsetCommit(booleanfailed)
end note
if (failed) then (yes) 
:log.debug("Skipping final offset commit as task has failed");;
:return ;;
stop
endif 
:transactionBoundaryManager.maybeCommitFinalTransaction();;
end
start
note right
void removeMetrics()
end note
:Utils.closeQuietly(transactionMetrics,"source task transaction metrics tracker");;
end
start
note right
void onPause()
end note
:super .onPause();;
:transactionBoundaryManager.maybeCommitFinalTransaction();;
end
start
note right
void maybeBeginTransaction()
end note
if (!transactionOpen) then (yes) 
:producer.beginTransaction();;
:transactionOpen=true;;
endif 
end
start
note right
void commitTransaction()
end note
:log.debug("{} Committing offsets",this);;
:longstarted=time.milliseconds();;
:maybeBeginTransaction();;
:AtomicReference<Throwable>flushError=new AtomicReference<>();;
if (offsetWriter.beginFlush()) then (yes) 
:offsetWriter.doFlush((error,result)->{if (error!=null ){log.error("{} Failed to flush offsets to storage: ",
ExactlyOnceWorkerSourceTask.this,error);flushError.compareAndSet(null ,
error);}else {log.trace("{} Finished flushing offsets to storage",
ExactlyOnceWorkerSourceTask.this);}});;
endif 
:try ;
:producer.commitTransaction();;
:catch (Throwablet);
:log.error("{} Failed to commit producer transaction",
ExactlyOnceWorkerSourceTask.this,t);;
:flushError.compareAndSet(null ,t);;
:transactionOpen=false;;
:Throwableerror=flushError.get();;
if (error!=null ) then (yes) 
:recordCommitFailure(time.milliseconds()-started,
null );;
:offsetWriter.cancelFlush();;
:throw maybeWrapProducerSendException("Failed to flush offsets and/or records for task "+
id,error);;
stop
endif 
:transactionMetrics.commitTransaction();;
:longdurationMillis=time.milliseconds()-started;;
:recordCommitSuccess(durationMillis);;
:log.debug("{} Finished commitOffsets successfully in {} ms",
this,durationMillis);;
:synchronized (commitableRecords){commitableRecords.forEach(this::commitTaskRecord);
:commitableRecords.clear();};
:commitSourceTask();;
end
start
note right
RuntimeExceptionmaybeWrapProducerSendException(Stringmessage,
Throwableerror)
end note
if (isPossibleTransactionTimeoutError(error)) then (yes) 
:return wrapTransactionTimeoutError(error);;
stop
else (no)
:return new ConnectException(message,error);;
stop
endif 
end
start
note right
booleanisPossibleTransactionTimeoutError(Throwableerror)
end note
:return error instanceof InvalidProducerEpochException||error.getCause() instanceof InvalidProducerEpochException;;
stop
end
start
note right
ConnectExceptionwrapTransactionTimeoutError(Throwableerror)
end note
:return new ConnectException("The task "+
id+" was unable to finish writing records to Kafka before its producer transaction expired. "+
"It may be necessary to reconfigure this connector in order for it to run healthily with exactly-once support. "+
"Options for this include: tune the connector's producer configuration for higher throughput, "+
"increase the transaction timeout for the connector's producers, "+
"decrease the offset commit interval (if using interval-based transaction boundaries), "+
"or use the 'poll' transaction boundary (if the connector is not already configured to use it).",
error);;
stop
end
start
note right
StringtoString()
end note
:return "ExactlyOnceWorkerSourceTask{"+"id="+
id+'}';;
stop
end
start
note right
booleanshouldCommitTransactionForRecord(SourceRecordrecord)
end note
:return false;;
stop
end
start
note right
booleanshouldCommitTransactionForBatch(longcurrentTimeMs)
end note
:return false;;
stop
end
start
note right
booleanshouldCommitFinalTransaction()
end note
:return false;;
stop
end
start
note right
void initialize()
end note
end
start
note right
void maybeCommitTransactionForRecord(SourceRecordrecord)
end note
:maybeCommitTransaction(shouldCommitTransactionForRecord(record));;
end
start
note right
void maybeCommitTransactionForBatch()
end note
:maybeCommitTransaction(shouldCommitTransactionForBatch(time.milliseconds()));;
end
start
note right
void maybeCommitFinalTransaction()
end note
:maybeCommitTransaction(shouldCommitFinalTransaction());;
end
start
note right
void maybeCommitTransaction(booleanshouldCommit)
end note
if (shouldCommit&&(transactionOpen||offsetWriter.willFlush())) then (yes) 
:try ;
:commitTransaction();;
endif 
end
start
note right
TransactionBoundaryManagerbuildTransactionManager(WorkerConfigworkerConfig,
SourceConnectorConfigsourceConfig,WorkerTransactionContexttransactionContext)
end note
:TransactionBoundaryboundary=sourceConfig.transactionBoundary();;
switch (switch (boundary))
endswith
end
start
note right
TransactionMetricsGrouptransactionMetricsGroup()
end note
:return transactionMetrics;;
stop
end
start
note right
constructor TransactionMetricsGroup(ConnectorTaskIdid,
ConnectMetricsconnectMetrics)
end note
:ConnectMetricsRegistryregistry=connectMetrics.registry();;
:metricGroup=connectMetrics.group(registry.sourceTaskGroupName(),
registry.connectorTagName(),id.connector(),
registry.taskTagName(),Integer.toString(id.task()));;
:transactionSize=metricGroup.sensor("transaction-size");;
:transactionSize.add(metricGroup.metricName(registry.transactionSizeAvg),
new Avg());;
:transactionSize.add(metricGroup.metricName(registry.transactionSizeMin),
new Min());;
:transactionSize.add(metricGroup.metricName(registry.transactionSizeMax),
new Max());;
end
start
note right
void close()
end note
:metricGroup.close();;
end
start
note right
void addRecord()
end note
:size++;;
end
start
note right
void abortTransaction()
end note
:size=0;;
end
start
note right
void commitTransaction()
end note
:transactionSize.record(size);;
:size=0;;
end
start
note right
ConnectMetrics.MetricGroupmetricGroup()
end note
:return metricGroup;;
stop
end
@enduml

