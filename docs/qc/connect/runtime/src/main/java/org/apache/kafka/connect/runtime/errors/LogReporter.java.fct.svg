81818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="228.5" x2="228.5" y1="1135.9609" y2="1155.9609"/><polygon fill="#181818" points="224.5,1145.9609,228.5,1155.9609,232.5,1145.9609,228.5,1149.9609" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[873f93f6dc489dbbb09ca88cc3dda1e0]
@startuml
!pragma layout smetana
start
note right
constructor LogReporter(ConnectorTaskIdid,
ConnectorConfigconnConfig,ErrorHandlingMetricserrorHandlingMetrics)
end note
:Objects.requireNonNull(id);
:Objects.requireNonNull(connConfig);
:Objects.requireNonNull(errorHandlingMetrics);
:this.id=id;
:this.connConfig=connConfig;
:this.errorHandlingMetrics=errorHandlingMetrics;
end
start
note right
Future<RecordMetadata>report(ProcessingContextcontext)
end note
if (!connConfig.enableErrorLog()) then (yes) 
:return COMPLETED;;
stop
endif 
if (!context.failed()) then (yes) 
:return COMPLETED;;
stop
endif 
:log.error(message(context),context.error());
:errorHandlingMetrics.recordErrorLogged();
:return COMPLETED;;
stop
end
start
note right
Stringmessage(ProcessingContextcontext)
end note
:return String.format("Error encountered in task %s. %s",
id,context.toString(connConfig.includeRecordDetailsInErrorLog()));;
stop
end
@enduml

