@startuml
!pragma layout smetana
start
note right
constructor LogReporter(ConnectorTaskIdid,
ConnectorConfigconnConfig,ErrorHandlingMetricserrorHandlingMetrics)
end note
end
start
note right
Future<RecordMetadata>report(ProcessingContextcontext)
end note
if (!connConfig.enableErrorLog()) then (yes) 
:return COMPLETED;;
stop
endif 
if (!context.failed()) then (yes) 
:return COMPLETED;;
stop
endif 
:return COMPLETED;;
stop
end
start
note right
Stringmessage(ProcessingContextcontext)
end note
:return String.format("Error encountered in task %s. %s",
id,context.toString(connConfig.includeRecordDetailsInErrorLog()));;
stop
end
@enduml

