8594" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[c25d79ee43923dc80cf23db2ada90bff]
@startuml
!pragma layout smetana
start
note right
constructor LogReporter(ConnectorTaskIdid,ConnectorConfigconnConfig,ErrorHandlingMetricserrorHandlingMetrics)
end note
:Objects.requireNonNull(id);
:Objects.requireNonNull(connConfig);
:Objects.requireNonNull(errorHandlingMetrics);
:this.id=id;
:this.connConfig=connConfig;
:this.errorHandlingMetrics=errorHandlingMetrics;
end
start
note right
Future<RecordMetadata>report(ProcessingContextcontext)
end note
if (!connConfig.enableErrorLog()) then (yes) 
:return COMPLETED;;
stop
endif 
if (!context.failed()) then (yes) 
:return COMPLETED;;
stop
endif 
:log.error(message(context),context.error());
:errorHandlingMetrics.recordErrorLogged();
:return COMPLETED;;
stop
end
start
note right
Stringmessage(ProcessingContextcontext)
end note
:return String.format("Error encountered in task %s. %s",id,context.toString(connConfig.includeRecordDetailsInErrorLog()));;
stop
end
@enduml

