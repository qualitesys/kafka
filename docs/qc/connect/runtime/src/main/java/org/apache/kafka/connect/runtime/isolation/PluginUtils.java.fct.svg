@startuml
!pragma layout smetana
start
note right
booleanshouldLoadInIsolation(Stringname)
end note
:return !(EXCLUDE.matcher(name).matches()&&!INCLUDE.matcher(name)
.matches());;
stop
end
start
note right
booleanisConcrete(Class<? >klass)
end note
:intmod=klass.getModifiers();;
:return !Modifier.isAbstract(mod)&&!Modifier.isInterface(mod);;
stop
end
start
note right
booleanisArchive(Pathpath)
end note
:StringarchivePath=path.toString().toLowerCase(Locale.ROOT);;
:return archivePath.endsWith(".jar")||archivePath.endsWith(".zip");;
stop
end
start
note right
booleanisClassFile(Pathpath)
end note
:return path.toString().toLowerCase(Locale.ROOT)
.endsWith(".class");;
stop
end
start
note right
List<Path>pluginLocations(PathtopPath)
end note
:List<Path>locations=new ArrayList<>();;
:try ;
:locations.add(dir);;
:return locations;;
stop
end
start
note right
List<Path>pluginUrls(PathtopPath)
end note
:booleancontainsClassFiles=false;;
:Set<Path>archives=new TreeSet<>();;
:LinkedList<DirectoryEntry>dfs=new LinkedList<>();;
:Set<Path>visited=new HashSet<>();;
if (isArchive(topPath)) then (yes) 
:return Collections.singletonList(topPath);;
stop
endif 
:DirectoryStream<Path>topListing=Files.newDirectoryStream(topPath,
PLUGIN_PATH_FILTER);;
:dfs.push(new DirectoryEntry(topListing));;
:visited.add(topPath);;
:try ;
while (!dfs.isEmpty())
:Iterator<Path>neighbors=dfs.peek().iterator;;
if (!neighbors.hasNext()) then (yes) 
:dfs.pop().stream.close();;
:continue ;;
endif 
:Pathadjacent=neighbors.next();;
if (Files.isSymbolicLink(adjacent)) then (yes) 
:try ;
:Pathsymlink=Files.readSymbolicLink(adjacent);;
:Pathparent=adjacent.getParent();;
if (parent==null ) then (yes) 
:continue ;;
endif 
:Pathabsolute=parent.resolve(symlink).toRealPath();;
if (Files.exists(absolute)) then (yes) 
:adjacent=absolute;;
else (no)
:continue ;;
endif 
:catch (IOExceptione);
:log.warn("Resolving symbolic link '{}' failed. Ignoring this path.",
adjacent,e);;
:continue ;;
endif 
if (!visited.contains(adjacent)) then (yes) 
:visited.add(adjacent);;
if (isArchive(adjacent)) then (yes) 
:archives.add(adjacent);;
else if (isClassFile(adjacent)) then (yes) 
:containsClassFiles=true;;
else (no)
:DirectoryStream<Path>listing=Files.newDirectoryStream(adjacent,
PLUGIN_PATH_FILTER);;
:dfs.push(new DirectoryEntry(listing));;
endif 
endif 
endwhile
if (containsClassFiles) then (yes) 
if (archives.isEmpty()) then (yes) 
:return Collections.singletonList(topPath);;
stop
endif 
:log.warn("Plugin path contains both java archives and class files. Returning only the"+
" archives");;
endif 
:return Arrays.asList(archives.toArray(new Path[0]));;
stop
end
start
note right
StringsimpleName(PluginDesc<? >plugin)
end note
:return plugin.pluginClass().getSimpleName();;
stop
end
start
note right
StringprunedName(PluginDesc<? >plugin)
end note
switch (switch (plugin.type()))
endswith
end
:booleanmatched=false;;
if (simpleName(alias).equals(simpleName(plugin))||prunedName(alias).equals(prunedName(plugin))) then (yes) 
if (matched) then (yes) 
:return false;;
stop
endif 
:matched=true;;
endif 
:return true;;
stop
start
note right
StringprunePluginName(PluginDesc<? >plugin,
Stringsuffix)
end note
:Stringsimple=plugin.pluginClass().getSimpleName();;
:intpos=simple.lastIndexOf(suffix);;
if (pos>0) then (yes) 
:return simple.substring(0,pos);;
stop
endif 
:return simple;;
stop
end
start
note right
constructor DirectoryEntry(DirectoryStream<Path>stream)
end note
:this.stream=stream;;
:this.iterator=stream.iterator();;
end
@enduml

