@startuml
!pragma layout smetana
start
note right
constructor CreateConnectorRequest(@JsonProperty ("name")Stringname,
@JsonProperty ("config")Map<String,String>config)
end note
:this.name=name;;
:this.config=config;;
end
start
note right
Stringname()
end note
:return name;;
stop
end
start
note right
Map<String,String>config()
end note
:return config;;
stop
end
start
note right
booleanequals(Objecto)
end note
if (this==o) then (yes) 
:return true;;
stop
endif 
if (o==null ||getClass()!=o.getClass()) then (yes) 
:return false;;
stop
endif 
:CreateConnectorRequestthat=(CreateConnectorRequest)o;;
:return Objects.equals(name,that.name)&&Objects.equals(config,
that.config);;
stop
end
start
note right
inthashCode()
end note
:return Objects.hash(name,config);;
stop
end
@enduml

