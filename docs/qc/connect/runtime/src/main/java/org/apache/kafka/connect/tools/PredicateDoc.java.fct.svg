@startuml
!pragma layout smetana
:this.predicateName=predicateClass.getName();;
:this.overview=overview;;
:this.configDef=configDef;;
:List<DocInfo> collect=new Plugins(Collections.emptyMap()).predicates().stream().map(p->{try {String overviewDoc=(String )p.pluginClass().getDeclaredField("OVERVIEW_DOC").get(null );
:ConfigDef configDef=(ConfigDef )p.pluginClass().getDeclaredField("CONFIG_DEF").get(null );return new DocInfo(p.pluginClass(),
overviewDoc,configDef);}catch (ReflectiveOperationException e){throw new RuntimeException("Predicate class "+
p.pluginClass().getName()+" lacks either a  public static final String OVERVIEW_DOC  or  public static final ConfigDef CONFIG_DEF ");}}).sorted(Comparator.comparing(docInfo->docInfo.predicateName)).collect(Collectors.toList());;
:PREDICATES=collect;;
start
note right
void printPredicateHtml(PrintStream out,DocInfo docInfo)
end note
:out.println("<div id=\""+docInfo.predicateName+
"\">");;
:out.print("<h5>");;
:out.print("<a href=\"#"+docInfo.predicateName+
"\">"+docInfo.predicateName+"</a>");;
:out.println("</h5>");;
:out.println(docInfo.overview);;
:out.println("<p/>");;
:out.println(docInfo.configDef.toHtml(6,key->docInfo.predicateName+
"_"+key));;
:out.println("</div>");;
end
start
note right
void printHtml(PrintStream out)
end note
:printPredicateHtml(out,docInfo);;
end
start
note right
void main(String ... args)
end note
:printHtml(System.out);;
end
@enduml

