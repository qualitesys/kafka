@startuml
!pragma layout smetana
:this.predicateName=predicateClass.getName();
:this.overview=overview;
:this.configDef=configDef;
:return new DocInfo(p.pluginClass(),overviewDoc,
configDef);;
stop
:throw new RuntimeException("Predicate class "+
p.pluginClass().getName()+" lacks either a `public static final String OVERVIEW_DOC` or `public static final ConfigDef CONFIG_DEF`");;
:PREDICATES=collect;
start
note right
void printPredicateHtml(PrintStreamout,DocInfodocInfo)
end note
:out.println("<div id=\""+docInfo.predicateName+
"\">");
:out.print("<h5>");
:out.print("<a href=\"#"+docInfo.predicateName+
"\">"+docInfo.predicateName+"</a>");
:out.println("</h5>");
:out.println(docInfo.overview);
:out.println("<p/>");
:out.println(docInfo.configDef.toHtml(6,key->docInfo.predicateName+
"_"+key));
:out.println("</div>");
end
start
note right
void printHtml(PrintStreamout)
end note
:printPredicateHtml(out,docInfo);
end
start
note right
void main(String... args)
end note
:printHtml(System.out);
end
@enduml

