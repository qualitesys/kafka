@startuml
!pragma layout smetana
:this.predicateName=predicateClass.getName();;
:this.overview=overview;;
:this.configDef=configDef;;
:try {StringoverviewDoc=(String)p.pluginClass().getDeclaredField("OVERVIEW_DOC").get(null );
:ConfigDefconfigDef=(ConfigDef)p.pluginClass().getDeclaredField("CONFIG_DEF").get(null );return new DocInfo(p.pluginClass(),
