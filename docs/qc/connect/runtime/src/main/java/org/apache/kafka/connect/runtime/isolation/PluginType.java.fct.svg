@startuml
!pragma layout smetana
start
note right
constructor PluginType(Class<? >klass)
end note
end
start
note right
PluginTypefrom(Class<? >klass)
end note
if (type.klass.isAssignableFrom(klass)) then (yes) 
:return type;;
stop
endif 
:return UNKNOWN;;
stop
end
start
note right
StringsimpleName()
end note
:return klass.getSimpleName();;
stop
end
start
note right
StringtoString()
end note
:return super .toString().toLowerCase(Locale.ROOT);;
stop
end
@enduml

