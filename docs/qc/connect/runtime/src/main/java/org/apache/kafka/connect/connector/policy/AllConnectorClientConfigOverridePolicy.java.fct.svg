@startuml
!pragma layout smetana
start
note right
String policyName()
end note
:return "All";;
stop
end
start
note right
boolean isAllowed(ConfigValue configValue)
end note
:return true;;
stop
end
start
note right
void configure(Map<String,?> configs)
end note
:log.info("Setting up All Policy for ConnectorClientConfigOverride. This will allow all client configurations to be overridden");;
end
@enduml

