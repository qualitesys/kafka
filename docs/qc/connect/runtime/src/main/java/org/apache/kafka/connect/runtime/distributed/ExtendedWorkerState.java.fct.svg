@startuml
!pragma layout smetana
start
note right
constructor ExtendedWorkerState(Stringurl,
longoffset,ExtendedAssignmentassignment)
end note
:super (url,offset);
:this.assignment=assignment!=null ? assignment:ExtendedAssignment.empty();
end
start
note right
ExtendedAssignmentassignment()
end note
:return assignment;;
stop
end
start
note right
StringtoString()
end note
:return "WorkerState{"+"url='"+url()+'\''+
", offset="+offset()+", "+assignment+'}';;
stop
end
@enduml

