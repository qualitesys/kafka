@startuml
!pragma layout smetana
start
note right
Stringversion()
end note
:return new VerifiableSourceConnector().version();;
stop
end
start
note right
void start(Map<String,String>props)
end note
:throw new ConnectException("Invalid VerifiableSourceTask configuration",e);;
if (previousOffset!=null ) then (yes) 
else (no)
endif 
end
start
note right
List<SourceRecord>poll()
end note
if (throttler.shouldThrottle(seqno-startingSeqno,
sendStartMs)) then (yes) 
endif 
:return result;;
stop
end
start
note right
void commitRecord(SourceRecordrecord,RecordMetadatametadata)
end note
end
start
note right
void stop()
end note
end
@enduml

