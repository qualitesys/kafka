@startuml
!pragma layout smetana
start
note right
constructor SourceTaskOffsetCommitter(WorkerConfigconfig,
ScheduledExecutorServicecommitExecutorService,
ConcurrentMap<ConnectorTaskId,ScheduledFuture<? >>committers)
end note
end
start
note right
constructor SourceTaskOffsetCommitter(WorkerConfigconfig)
end note
end
start
note right
void close(longtimeoutMs)
end note
if (!commitExecutorService.awaitTermination(timeoutMs,
TimeUnit.MILLISECONDS)) then (yes) 
endif 
end
start
note right
void schedule(final ConnectorTaskIdid,final WorkerSourceTaskworkerTask)
end note
end
start
note right
void remove(ConnectorTaskIdid)
end note
if (task==null ) then (yes) 
:return ;;
stop
endif 
if (!task.isDone()) then (yes) 
endif 
:throw new ConnectException("Unexpected interruption in SourceTaskOffsetCommitter while removing task with id: "+
id,e);;
end
start
note right
void commit(WorkerSourceTaskworkerTask)
end note
if (workerTask.commitOffsets()) then (yes) 
:return ;;
stop
endif 
end
@enduml

