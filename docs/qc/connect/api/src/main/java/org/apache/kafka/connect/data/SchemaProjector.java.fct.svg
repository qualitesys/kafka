@startuml
!pragma layout smetana
:Type[]promotableTypes={Type.INT8,Type.INT16,
Type.INT32,Type.INT64,Type.FLOAT32,Type.FLOAT64};;
:promotable.add(new AbstractMap.SimpleImmutableEntry<>(promotableTypes[i],
promotableTypes[j]));;
start
note right
Objectproject(Schemasource,Objectrecord,Schematarget)
end note
:checkMaybeCompatible(source,target);;
if (source.isOptional()&&!target.isOptional()) then (yes) 
if (target.defaultValue()!=null ) then (yes) 
if (record!=null ) then (yes) 
:return projectRequiredSchema(source,record,
target);;
stop
else (no)
:return target.defaultValue();;
stop
endif 
else (no)
:throw new SchemaProjectorException("Writer schema is optional,
 however, target schema does not provide a default value.");;
stop
endif 
else (no)
if (record!=null ) then (yes) 
:return projectRequiredSchema(source,record,
target);;
stop
else (no)
:return null ;;
stop
endif 
endif 
end
start
note right
ObjectprojectRequiredSchema(Schemasource,
Objectrecord,Schematarget)
end note
switch (switch (target.type()))
endswith
:return null ;;
stop
end
start
note right
ObjectprojectStruct(Schemasource,StructsourceStruct,
Schematarget)
end note
:StructtargetStruct=new Struct(target);;
:StringfieldName=targetField.name();;
:FieldsourceField=source.field(fieldName);;
if (sourceField!=null ) then (yes) 
:ObjectsourceFieldValue=sourceStruct.get(fieldName);;
:try ;
:ObjecttargetFieldValue=project(sourceField.schema(),
sourceFieldValue,targetField.schema());;
:targetStruct.put(fieldName,targetFieldValue);;
:catch (SchemaProjectorExceptione);
:throw new SchemaProjectorException("Error projecting "+
sourceField.name(),e);;
stop
else if (targetField.schema().isOptional()) then (yes) 
else if (targetField.schema().defaultValue()!=null ) then (yes) 
:targetStruct.put(fieldName,targetField.schema()
.defaultValue());;
else (no)
:throw new SchemaProjectorException("Required field  "+
fieldName+"  is missing from source schema: "+
source);;
stop
endif 
:return targetStruct;;
stop
end
start
note right
void checkMaybeCompatible(Schemasource,Schematarget)
end note
if (source.type()!=target.type()&&!isPromotable(source.type(),
target.type())) then (yes) 
:throw new SchemaProjectorException("Schema type mismatch. source type: "+
source.type()+" and target type: "+target.type());;
stop
else if (!Objects.equals(source.name(),target.name())) then (yes) 
:throw new SchemaProjectorException("Schema name mismatch. source name: "+
source.name()+" and target name: "+target.name());;
stop
else if (!Objects.equals(source.parameters(),
target.parameters())) then (yes) 
:throw new SchemaProjectorException("Schema parameters not equal. source parameters: "+
source.parameters()+" and target parameters: "+
target.parameters());;
stop
endif 
end
start
note right
ObjectprojectArray(Schemasource,Objectrecord,
Schematarget)
end note
:List<? >array=(List<? >)record;;
:List<Object>retArray=new ArrayList<>();;
:retArray.add(project(source.valueSchema(),
entry,target.valueSchema()));;
:return retArray;;
stop
end
start
note right
ObjectprojectMap(Schemasource,Objectrecord,
Schematarget)
end note
:Map<? ,? >map=(Map<? ,? >)record;;
:Map<Object,Object>retMap=new HashMap<>();;
:Objectkey=entry.getKey();;
:Objectvalue=entry.getValue();;
:ObjectretKey=project(source.keySchema(),
key,target.keySchema());;
:ObjectretValue=project(source.valueSchema(),
value,target.valueSchema());;
:retMap.put(retKey,retValue);;
:return retMap;;
stop
end
start
note right
ObjectprojectPrimitive(Schemasource,Objectrecord,
Schematarget)
end note
:assert source.type().isPrimitive();;
:assert target.type().isPrimitive();;
:Objectresult;;
if (isPromotable(source.type(),target.type())&&record instanceof Number) then (yes) 
:NumbernumberRecord=(Number)record;;
switch (switch (target.type()))
endswith
else (no)
:result=record;;
endif 
:return result;;
stop
end
start
note right
booleanisPromotable(TypesourceType,TypetargetType)
end note
:return promotable.contains(new AbstractMap.SimpleImmutableEntry<>(sourceType,
targetType));;
stop
end
@enduml

