@startuml
!pragma layout smetana
start
note right
ConfigDefnewConfigDef()
end note
:return new ConfigDef().define(TYPE_CONFIG,
Type.STRING,ConfigDef.NO_DEFAULT_VALUE,in(ConverterType.KEY.getName(),
ConverterType.VALUE.getName(),ConverterType.HEADER.getName()),
Importance.LOW,TYPE_DOC);;
stop
end
start
note right
constructor ConverterConfig(ConfigDefconfigDef,Map<String,? >props)
end note
:super (configDef,props,true);
end
start
note right
ConverterTypetype()
end note
:return ConverterType.withName(getString(TYPE_CONFIG));;
stop
end
@enduml

