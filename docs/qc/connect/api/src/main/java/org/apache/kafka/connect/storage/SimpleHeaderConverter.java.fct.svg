@startuml
!pragma layout smetana
start
note right
ConfigDefconfig()
end note
:return CONFIG_DEF;;
stop
end
start
note right
void configure(Map<String,? >configs)
end note
end
start
note right
SchemaAndValuetoConnectHeader(Stringtopic,
StringheaderKey,byte[]value)
end note
if (value==null ) then (yes) 
:return NULL_SCHEMA_AND_VALUE;;
stop
endif 
:try {Stringstr=new String(value,UTF_8);if (str.isEmpty()){return new SchemaAndValue(Schema.STRING_SCHEMA,
str);}return Values.parseString(str);}catch (NoSuchElementExceptione){throw new DataException("Failed to deserialize value for header '"+
headerKey+"' on topic '"+topic+"'",e);}catch (Throwablet){LOG.warn("Failed to deserialize value for header '{}' on topic '{}',
 so using byte array",headerKey,topic,t);return new SchemaAndValue(Schema.BYTES_SCHEMA,
value);};
end
start
note right
byte[]fromConnectHeader(Stringtopic,StringheaderKey,
Schemaschema,Objectvalue)
end note
if (value==null ) then (yes) 
:return null ;;
stop
endif 
:return Values.convertToString(schema,value)
.getBytes(UTF_8);;
stop
end
start
note right
void close()
end note
end
@enduml

