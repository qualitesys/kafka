@startuml
!pragma layout smetana
start
note right
SchemaBuilder builder()
end note
:return SchemaBuilder.int32().name(LOGICAL_NAME)
.version(1);;
stop
end
start
note right
int fromLogical(Schema schema,java.util.Date value)
end note
if (!(LOGICAL_NAME.equals(schema.name()))) then (yes) 
:throw new DataException("Requested conversion of Time object but the schema does not match.");;
stop
endif 
:Calendar calendar=Calendar.getInstance(UTC);;
:calendar.setTime(value);;
:long unixMillis=calendar.getTimeInMillis();;
if (unixMillis<0||unixMillis>MILLIS_PER_DAY) then (yes) 
:throw new DataException("Kafka Connect Time type should not have any date fields set to non-zero values.");;
stop
endif 
:return (int )unixMillis;;
stop
end
start
note right
java.util.Date toLogical(Schema schema,int value)
end note
if (!(LOGICAL_NAME.equals(schema.name()))) then (yes) 
:throw new DataException("Requested conversion of Date object but the schema does not match.");;
stop
endif 
if (value<0||value>MILLIS_PER_DAY) then (yes) 
:throw new DataException("Time values must use number of milliseconds greater than 0 and less than 86400000");;
stop
endif 
:return new java.util.Date(value);;
stop
end
@enduml

