@startuml
!pragma layout smetana
:CONFIG=ConverterConfig.newConfigDef();
:CONFIG.define(ENCODING_CONFIG,Type.STRING,ENCODING_DEFAULT,Importance.HIGH,ENCODING_DOC,null ,-1,Width.MEDIUM,ENCODING_DISPLAY);
start
note right
ConfigDefconfigDef()
end note
:return CONFIG;;
stop
end
start
note right
constructor StringConverterConfig(Map<String,? >props)
end note
:super (CONFIG,props);
end
start
note right
Stringencoding()
end note
:return getString(ENCODING_CONFIG);;
stop
end
@enduml

