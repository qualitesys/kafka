@startuml
!pragma layout smetana
start
note right
SchemaBuilderbuilder()
end note
:return SchemaBuilder.int64().name(LOGICAL_NAME)
.version(1);;
stop
end
start
note right
longfromLogical(Schemaschema,java.util.Datevalue)
end note
if (!(LOGICAL_NAME.equals(schema.name()))) then (yes) 
:throw new DataException("Requested conversion of Timestamp object but the schema does not match.");;
endif 
:return value.getTime();;
stop
end
start
note right
java.util.DatetoLogical(Schemaschema,longvalue)
end note
if (!(LOGICAL_NAME.equals(schema.name()))) then (yes) 
:throw new DataException("Requested conversion of Timestamp object but the schema does not match.");;
endif 
:return new java.util.Date(value);;
stop
end
@enduml

