@startuml
!pragma layout smetana
start
note right
void initialize(ConnectorContext ctx)
end note
:context=ctx;;
end
start
note right
void initialize(ConnectorContext ctx,List<Map<String,
String>> taskConfigs)
end note
:context=ctx;;
end
start
note right
ConnectorContext context()
end note
:return context;;
stop
end
start
note right
void start(Map<String,String> props)
end note
end
start
note right
void reconfigure(Map<String,String> props)
end note
:stop();;
:start(props);;
end
start
note right
void stop()
end note
end
start
note right
Config validate(Map<String,String> connectorConfigs)
end note
:ConfigDef configDef=config();;
if (null ==configDef) then (yes) 
:throw new ConnectException(String.format("%s.config() must return a ConfigDef that is not null.",
this.getClass().getName()));;
stop
endif 
:List<ConfigValue> configValues=configDef.validate(connectorConfigs);;
:return new Config(configValues);;
stop
end
@enduml

