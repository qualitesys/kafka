@startuml
!pragma layout smetana
start
note right
constructor ConnectorState(Stringstate,StringworkerId,
StringtraceMessage)
end note
end
start
note right
StringtoString()
end note
:return "ConnectorState{"+"state='"+state()+
'\''+", traceMessage='"+traceMessage()+'\''+
", workerId='"+workerId()+'\''+'}';;
stop
end
@enduml

