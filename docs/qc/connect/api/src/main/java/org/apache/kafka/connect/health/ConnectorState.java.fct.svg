@startuml
!pragma layout smetana
start
note right
constructor ConnectorState(String state,String workerId,
String traceMessage)
end note
:super (state,workerId,traceMessage);;
end
start
note right
String toString()
end note
:return "ConnectorState{"+"state='"+state()+
'\''+", traceMessage='"+traceMessage()+'\''+
", workerId='"+workerId()+'\''+'}';;
stop
end
@enduml

