@startuml
!pragma layout smetana
start
note right
constructor Type()
end note
:this.name=this.name().toLowerCase(Locale.ROOT);;
end
start
note right
String getName()
end note
:return name;;
stop
end
start
note right
boolean isPrimitive()
end note
switch (switch this)
case (case INT8:) 
case (case INT16:) 
case (case INT32:) 
case (case INT64:) 
case (case FLOAT32:) 
case (case FLOAT64:) 
case (case BOOLEAN:) 
case (case STRING:) 
case (case BYTES:) 
:return true;;
stop
endswitch
:return false;;
stop
end
@enduml

