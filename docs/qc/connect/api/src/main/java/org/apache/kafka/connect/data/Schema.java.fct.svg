@startuml
!pragma layout smetana
start
note right
constructor Type()
end note
:this.name=this.name().toLowerCase(Locale.ROOT);
end
start
note right
StringgetName()
end note
:return name;;
stop
end
start
note right
booleanisPrimitive()
end note
:return true;;
stop
:return false;;
stop
end
@enduml

