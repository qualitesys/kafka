@startuml
!pragma layout smetana
start
note right
constructor Type()
end note
:this.name=this.name().toLowerCase(Locale.ROOT);;
end
start
note right
StringgetName()
end note
:return name;;
stop
end
start
note right
booleanisPrimitive()
end note
:switch (this){case INT8:case INT16:case INT32:case INT64:case FLOAT32:case FLOAT64:case BOOLEAN:case STRING:case BYTES:return true;};
:return false;;
stop
end
@enduml

