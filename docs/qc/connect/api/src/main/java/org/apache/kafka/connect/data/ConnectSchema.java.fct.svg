start
note right
List<Field>fields()
end note
if (type!=Type.STRUCT) then (yes) 
:throw new DataException("Cannot list fields on non-struct type");;
stop
endif 
:return fields;;
stop
end
start
note right
Fieldfield(StringfieldName)
end note
if (type!=Type.STRUCT) then (yes) 
:throw new DataException("Cannot look up fields on non-struct type");;
stop
endif 
:return fieldsByName.get(fieldName);;
stop
end
start
note right
SchemakeySchema()
end note
if (type!=Type.MAP) then (yes) 
:throw new DataException("Cannot look up key schema on non-map type");;
stop
endif 
:return keySchema;;
stop
end
start
note right
SchemavalueSchema()
end note
if (type!=Type.MAP&&type!=Type.ARRAY) then (yes) 
:throw new DataException("Cannot look up value schema on non-array and non-map type");;
stop
endif 
:return valueSchema;;
stop
end
start
note right
void validateValue(Schemaschema,Objectvalue)
end note
:validateValue(null ,schema,value);;
end
start
note right
void validateValue(Stringname,Schemaschema,
Objectvalue)
end note
if (value==null ) then (yes) 
if (!schema.isOptional()) then (yes) 
:throw new DataException("Invalid value: null used for required field: \""+
name+"\", schema type: "+schema.type());;
stop
endif 
:return ;;
stop
endif 
:List<Class<? >>expectedClasses=expectedClassesFor(schema);;
:booleanfoundMatch=false;;
if (expectedClass.isInstance(value)) then (yes) 
:foundMatch=true;;
:break ;;
endif 
if (!foundMatch) then (yes) 
:StringBuilderexceptionMessage=new StringBuilder("Invalid Java object for schema");;
if (schema.name()!=null ) then (yes) 
:exceptionMessage.append(" \"").append(schema.name())
.append("\"");;
endif 
:exceptionMessage.append(" with type ").append(schema.type())
.append(": ").append(value.getClass());;
if (name!=null ) then (yes) 
:exceptionMessage.append(" for field: \"")
.append(name).append("\"");;
endif 
:throw new DataException(exceptionMessage.toString());;
stop
endif 
switch (switch (schema.type()))
endswith
end
start
note right
List<Class<? >>expectedClassesFor(Schemaschema)
end note
:List<Class<? >>expectedClasses=LOGICAL_TYPE_CLASSES.get(schema.name());;
if (expectedClasses==null ) then (yes) 
:expectedClasses=SCHEMA_TYPE_CLASSES.getOrDefault(schema.type(),
Collections.emptyList());;
endif 
:return expectedClasses;;
stop
end
