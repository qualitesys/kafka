start
note right
booleanequals(Objecto)
end note
if (this==o) then (yes) 
:return true;;
stop
endif 
if (o==null ||getClass()!=o.getClass()) then (yes) 
:return false;;
stop
endif 
:ConnectSchemaschema=(ConnectSchema)o;;
:return Objects.equals(optional,schema.optional)&&Objects.equals(version,
schema.version)&&Objects.equals(name,schema.name)&&Objects.equals(doc,
schema.doc)&&Objects.equals(type,schema.type)&&Objects.deepEquals(defaultValue,
schema.defaultValue)&&Objects.equals(fields,
schema.fields)&&Objects.equals(keySchema,
schema.keySchema)&&Objects.equals(valueSchema,
schema.valueSchema)&&Objects.equals(parameters,
schema.parameters);;
stop
end
start
note right
inthashCode()
end note
if (this.hash==null ) then (yes) 
:this.hash=Objects.hash(type,optional,defaultValue,
fields,keySchema,valueSchema,name,version,
doc,parameters);;
endif 
:return this.hash;;
stop
end
start
note right
StringtoString()
end note
if (name!=null ) then (yes) 
:return "Schema{"+name+":"+type+"}";;
stop
else (no)
:return "Schema{"+type+"}";;
stop
endif 
end
start
note right
TypeschemaType(Class<? >klass)
end note
:synchronized (JAVA_CLASS_SCHEMA_TYPES){TypeschemaType=JAVA_CLASS_SCHEMA_TYPES.get(klass);if (schemaType!=null )return schemaType;for (Map.Entry<Class<? >,
Type>entry:JAVA_CLASS_SCHEMA_TYPES.entrySet()){try {klass.asSubclass(entry.getKey());JAVA_CLASS_SCHEMA_TYPES.put(klass,
entry.getValue());return entry.getValue();}catch (ClassCastExceptione){}}};
:return null ;;
stop
