@startuml
!pragma layout smetana
:nameToType.put(type.name,type);;
:NAME_TO_TYPE=Collections.unmodifiableMap(nameToType);;
start
note right
ConverterTypewithName(Stringname)
end note
if (name==null ) then (yes) 
:return null ;;
stop
endif 
:return NAME_TO_TYPE.get(name.toLowerCase(Locale.getDefault()));;
stop
end
start
note right
constructor ConverterType()
end note
:this.name=this.name().toLowerCase(Locale.ROOT);;
end
start
note right
StringgetName()
end note
:return name;;
stop
end
@enduml

