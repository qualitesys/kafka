3" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="255.5" x2="255.5" y1="768.5" y2="788.5"/><polygon fill="#181818" points="251.5,778.5,255.5,788.5,259.5,778.5,255.5,782.5" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[2b710cd3471a1fabd48ab8c10cebc491]
@startuml
!pragma layout smetana
:ConverterType[] types=ConverterType.values();;
:Map<String,ConverterType> nameToType=new HashMap<>(types.length);;
:nameToType.put(type.name,type);;
:NAME_TO_TYPE=Collections.unmodifiableMap(nameToType);;
start
note right
ConverterType withName(String name)
end note
if (name==null ) then (yes) 
:return null ;;
stop
endif 
:return NAME_TO_TYPE.get(name.toLowerCase(Locale.getDefault()));;
stop
end
start
note right
constructor ConverterType()
end note
:this.name=this.name().toLowerCase(Locale.ROOT);;
end
start
note right
String getName()
end note
:return name;;
stop
end
@enduml

