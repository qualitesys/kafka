@startuml
!pragma layout smetana
start
note right
void initialize(SinkTaskContextcontext)
end note
:this.context=context;;
end
start
note right
void start(Map<String,String>props)
end note
end
start
note right
void put(Collection<SinkRecord>records)
end note
end
start
note right
void flush(Map<TopicPartition,OffsetAndMetadata>currentOffsets)
end note
end
start
note right
Map<TopicPartition,OffsetAndMetadata>preCommit(Map<TopicPartition,
OffsetAndMetadata>currentOffsets)
end note
:flush(currentOffsets);;
:return currentOffsets;;
stop
end
start
note right
void open(Collection<TopicPartition>partitions)
end note
:this.onPartitionsAssigned(partitions);;
end
start
note right
void onPartitionsAssigned(Collection<TopicPartition>partitions)
end note
end
start
note right
void close(Collection<TopicPartition>partitions)
end note
:this.onPartitionsRevoked(partitions);;
end
start
note right
void onPartitionsRevoked(Collection<TopicPartition>partitions)
end note
end
start
note right
void stop()
end note
end
