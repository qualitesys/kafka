="913.7852" y2="1016.1563"/><line style="stroke:#181818;stroke-width:1.0;" x1="633" x2="371" y1="1016.1563" y2="1016.1563"/><polygon fill="#181818" points="381,1012.1563,371,1016.1563,381,1020.1563,377,1016.1563" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="359" x2="359" y1="984.1563" y2="1004.1563"/><polygon fill="#181818" points="355,994.1563,359,1004.1563,363,994.1563,359,998.1563" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="359" x2="359" y1="879.2188" y2="901.7852"/><polygon fill="#181818" points="355,891.7852,359,901.7852,363,891.7852,359,895.7852" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="359" x2="359" y1="1028.1563" y2="1048.1563"/><polygon fill="#181818" points="355,1038.1563,359,1048.1563,363,1038.1563,359,1042.1563" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="359" x2="359" y1="1082.125" y2="1102.125"/><polygon fill="#181818" points="355,1092.125,359,1102.125,363,1092.125,359,1096.125" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="359" x2="359" y1="1168.0938" y2="1188.0938"/><polygon fill="#181818" points="355,1178.0938,359,1188.0938,363,1178.0938,359,1182.0938" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[3b04650de0503b2338acc09b0222ff18]
@startuml
!pragma layout smetana
start
note right
SchemaBuilderbuilder(intscale)
end note
:return SchemaBuilder.bytes().name(LOGICAL_NAME).parameter(SCALE_FIELD,
Integer.toString(scale)).version(1);;
stop
end
start
note right
Schemaschema(intscale)
end note
:return builder(scale).build();;
stop
end
start
note right
byte[]fromLogical(Schemaschema,BigDecimalvalue)
end note
if (value.scale()!=schemaScale) then (yes) 
:throw new DataException(String.format("Decimal value has mismatching scale for given Decimal schema. "+
"Schema has scale %d, value has scale %d.",
schemaScale,value.scale()));;
endif 
:return value.unscaledValue().toByteArray();;
stop
end
start
note right
BigDecimaltoLogical(Schemaschema,byte[]value)
end note
:return new BigDecimal(new BigInteger(value),
scale(schema));;
stop
end
start
note right
intscale(Schemaschema)
end note
if (scaleString==null ) then (yes) 
:throw new DataException("Invalid Decimal schema: scale parameter not found.");;
endif 
:return Integer.parseInt(scaleString);;
stop
:throw new DataException("Invalid scale parameter found in Decimal schema: ",e);;
end
@enduml

