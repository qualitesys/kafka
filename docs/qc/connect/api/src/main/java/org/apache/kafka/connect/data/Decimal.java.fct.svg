@startuml
!pragma layout smetana
start
note right
SchemaBuilderbuilder(intscale)
end note
:return SchemaBuilder.bytes().name(LOGICAL_NAME).parameter(SCALE_FIELD,
Integer.toString(scale)).version(1);;
stop
end
start
note right
Schemaschema(intscale)
end note
:return builder(scale).build();;
stop
end
start
note right
byte[]fromLogical(Schemaschema,BigDecimalvalue)
end note
if (value.scale()!=schemaScale) then (yes) 
:throw new DataException(String.format("Decimal value has mismatching scale for given Decimal schema. "+"Schema has scale %d, value has scale %d.",schemaScale,value.scale()));;
endif 
:return value.unscaledValue().toByteArray();;
stop
end
start
note right
BigDecimaltoLogical(Schemaschema,byte[]value)
end note
:return new BigDecimal(new BigInteger(value),
scale(schema));;
stop
end
start
note right
intscale(Schemaschema)
end note
if (scaleString==null ) then (yes) 
:throw new DataException("Invalid Decimal schema: scale parameter not found.");;
endif 
:return Integer.parseInt(scaleString);;
stop
:throw new DataException("Invalid scale parameter found in Decimal schema: ",e);;
end
@enduml

