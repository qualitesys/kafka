;" x1="410" x2="410" y1="1184.6094" y2="1204.6094"/><polygon fill="#181818" points="406,1194.6094,410,1204.6094,414,1194.6094,410,1198.6094" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="410" x2="410" y1="1009.7227" y2="1029.7227"/><polygon fill="#181818" points="406,1019.7227,410,1029.7227,414,1019.7227,410,1023.7227" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="135" x2="135" y1="1298.1875" y2="1318.1875"/><polygon fill="#181818" points="131,1308.1875,135,1318.1875,139,1308.1875,135,1312.1875" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="544" x2="544" y1="1298.1875" y2="1318.1875"/><polygon fill="#181818" points="540,1308.1875,544,1318.1875,548,1308.1875,544,1312.1875" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="357" x2="135" y1="1216.6094" y2="1216.6094"/><line style="stroke:#181818;stroke-width:1.0;" x1="135" x2="135" y1="1216.6094" y2="1264.2188"/><polygon fill="#181818" points="131,1254.2188,135,1264.2188,139,1254.2188,135,1258.2188" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="15" x="135" y="1244.2222">try</text><line style="stroke:#181818;stroke-width:1.0;" x1="463" x2="544" y1="1216.6094" y2="1216.6094"/><line style="stroke:#181818;stroke-width:1.0;" x1="544" x2="544" y1="1216.6094" y2="1264.2188"/><polygon fill="#181818" points="540,1254.2188,544,1264.2188,548,1254.2188,544,1258.2188" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="11" lengthAdjust="spacing" textLength="188" x="544" y="1244.2222">catch (NumberFormatExceptione)</text><!--MD5=[1186cc3f345ca11ab7a4dfa5928e1e2a]
@startuml
!pragma layout smetana
start
note right
SchemaBuilderbuilder(intscale)
end note
:return SchemaBuilder.bytes().name(LOGICAL_NAME).parameter(SCALE_FIELD,
Integer.toString(scale)).version(1);;
stop
end
start
note right
Schemaschema(intscale)
end note
:return builder(scale).build();;
stop
end
start
note right
byte[]fromLogical(Schemaschema,BigDecimalvalue)
end note
:intschemaScale=scale(schema);;
if (value.scale()!=schemaScale) then (yes) 
:throw new DataException(String.format("Decimal value has mismatching scale for given Decimal schema. "+
"Schema has scale %d, value has scale %d.",
schemaScale,value.scale()));;
stop
endif 
:return value.unscaledValue().toByteArray();;
stop
end
start
note right
BigDecimaltoLogical(Schemaschema,byte[]value)
end note
:return new BigDecimal(new BigInteger(value),
scale(schema));;
stop
end
start
note right
intscale(Schemaschema)
end note
:StringscaleString=schema.parameters().get(SCALE_FIELD);;
if (scaleString==null ) then (yes) 
:throw new DataException("Invalid Decimal schema: scale parameter not found.");;
stop
endif 
switch (try/catch block)
case (try)
:return Integer.parseInt(scaleString);;
stop
case (catch (NumberFormatExceptione))
:throw new DataException("Invalid scale parameter found in Decimal schema: ",e);;
stop
endswitch
end
@enduml

