@startuml
!pragma layout smetana
start
note right
constructor TaskState(inttaskId,Stringstate,
StringworkerId,Stringtrace)
end note
:super (state,workerId,trace);;
:this.taskId=taskId;;
end
start
note right
inttaskId()
end note
:return taskId;;
stop
end
start
note right
booleanequals(Objecto)
end note
if (this==o) then (yes) 
:return true;;
stop
endif 
if (o==null ||getClass()!=o.getClass()) then (yes) 
:return false;;
stop
endif 
if (!super .equals(o)) then (yes) 
:return false;;
stop
endif 
:TaskStatetaskState=(TaskState)o;;
:return taskId==taskState.taskId;;
stop
end
start
note right
inthashCode()
end note
:return Objects.hash(super .hashCode(),taskId);;
stop
end
start
note right
StringtoString()
end note
:return "TaskState{"+"taskId='"+taskId+'\''+
"state='"+state()+'\''+", traceMessage='"+
traceMessage()+'\''+", workerId='"+workerId()+
'\''+'}';;
stop
end
@enduml

