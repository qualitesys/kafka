@startuml
!pragma layout smetana
start
note right
TransactionBoundary fromProperty(String property)
end note
:Objects.requireNonNull(property,"Value for transaction boundary property may not be null");;
:return TransactionBoundary.valueOf(property.toUpperCase(Locale.ROOT)
.trim());;
stop
end
start
note right
String toString()
end note
:return name().toLowerCase(Locale.ROOT);;
stop
end
start
note right
void initialize(SourceTaskContext context)
end note
:this.context=context;;
end
start
note right
void start(Map<String,String> props)
end note
end
start
note right
void commit()
end note
end
start
note right
void stop()
end note
end
start
note right
void commitRecord(SourceRecord record )
end note
end
start
note right
void commitRecord(SourceRecord record ,RecordMetadata metadata)
end note
:commitRecord(record );;
end
@enduml

