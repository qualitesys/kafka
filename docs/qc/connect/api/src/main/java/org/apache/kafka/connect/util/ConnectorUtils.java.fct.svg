@startuml
!pragma layout smetana
if (numGroups<=0) then (yes) 
:throw new IllegalArgumentException("Number of groups must be positive.");;
stop
endif 
:groupList.add(elements.get(assigned));;
:assigned++;;
:result.add(groupList);;
:return result;;
stop
@enduml

