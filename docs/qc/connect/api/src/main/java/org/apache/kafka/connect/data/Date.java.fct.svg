@startuml
!pragma layout smetana
start
note right
SchemaBuilderbuilder()
end note
:return SchemaBuilder.int32().name(LOGICAL_NAME).version(1);;
stop
end
start
note right
intfromLogical(Schemaschema,java.util.Datevalue)
end note
if (!(LOGICAL_NAME.equals(schema.name()))) then (yes) 
endif 
:calendar.setTime(value);
if (calendar.get(Calendar.HOUR_OF_DAY)!=0||calendar.get(Calendar.MINUTE)!=0||calendar.get(Calendar.SECOND)!=0||calendar.get(Calendar.MILLISECOND)!=0) then (yes) 
endif 
:return (int)(unixMillis/MILLIS_PER_DAY);;
stop
end
start
note right
java.util.DatetoLogical(Schemaschema,intvalue)
end note
if (!(LOGICAL_NAME.equals(schema.name()))) then (yes) 
endif 
:return new java.util.Date(value*MILLIS_PER_DAY);;
stop
end
@enduml

