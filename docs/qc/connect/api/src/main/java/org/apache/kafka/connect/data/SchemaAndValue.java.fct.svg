@startuml
!pragma layout smetana
start
note right
constructor SchemaAndValue(Schemaschema,Objectvalue)
end note
:this.value=value;
:this.schema=schema;
end
start
note right
Schemaschema()
end note
:return schema;;
stop
end
start
note right
Objectvalue()
end note
:return value;;
stop
end
start
note right
booleanequals(Objecto)
end note
if (this==o) then (yes) 
:return true;;
stop
endif 
if (o==null ||getClass()!=o.getClass()) then (yes) 
:return false;;
stop
endif 
:return Objects.equals(schema,that.schema)&&Objects.equals(value,that.value);;
stop
end
start
note right
inthashCode()
end note
:return Objects.hash(schema,value);;
stop
end
start
note right
StringtoString()
end note
:return "SchemaAndValue{"+"schema="+schema+", value="+value+'}';;
stop
end
@enduml

