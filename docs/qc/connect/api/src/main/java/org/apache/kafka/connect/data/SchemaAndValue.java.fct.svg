@startuml
!pragma layout smetana
start
note right
constructor SchemaAndValue(Schema schema,
Object value)
end note
:this.value=value;;
:this.schema=schema;;
end
start
note right
Schema schema()
end note
:return schema;;
stop
end
start
note right
Object value()
end note
:return value;;
stop
end
start
note right
boolean equals(Object o)
end note
if (this==o) then (yes) 
:return true;;
stop
endif 
if (o==null ||getClass()!=o.getClass()) then (yes) 
:return false;;
stop
endif 
:SchemaAndValue that=(SchemaAndValue )o;;
