@startuml
!pragma layout smetana
start
note right
Stringversion()
end note
:return AppInfoParser.getVersion();;
stop
end
start
note right
void start(Map<String,String>props)
end note
:filename=parsedConfig.getString(FILE_CONFIG);
if (topics.size()!=1) then (yes) 
:throw new ConfigException("'topic' in FileStreamSourceConnector configuration requires definition of a single topic");;
endif 
:topic=topics.get(0);
:batchSize=parsedConfig.getInt(TASK_BATCH_SIZE_CONFIG);
end
start
note right
Class<?  extends Task>taskClass()
end note
:return FileStreamSourceTask.class ;;
stop
end
start
note right
List<Map<String,String>>taskConfigs(intmaxTasks)
end note
if (filename!=null ) then (yes) 
:config.put(FILE_CONFIG,filename);
endif 
:config.put(TOPIC_CONFIG,topic);
:config.put(TASK_BATCH_SIZE_CONFIG,String.valueOf(batchSize));
:configs.add(config);
:return configs;;
stop
end
start
note right
void stop()
end note
end
start
note right
ConfigDefconfig()
end note
:return CONFIG_DEF;;
stop
end
@enduml

