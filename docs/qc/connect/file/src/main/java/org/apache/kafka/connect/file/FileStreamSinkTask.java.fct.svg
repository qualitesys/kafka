@startuml
!pragma layout smetana
start
note right
constructor FileStreamSinkTask()
end note
end
start
note right
constructor FileStreamSinkTask(PrintStreamoutputStream)
end note
end
start
note right
Stringversion()
end note
:return new FileStreamSinkConnector().version();;
stop
end
start
note right
void start(Map<String,String>props)
end note
if (filename==null ) then (yes) 
else (no)
:throw new ConnectException("Couldn't find or create file '"+
filename+"' for FileStreamSinkTask",e);;
endif 
end
start
note right
void put(Collection<SinkRecord>sinkRecords)
end note
end
start
note right
void flush(Map<TopicPartition,OffsetAndMetadata>offsets)
end note
end
start
note right
void stop()
end note
if (outputStream!=null &&outputStream!=System.out) then (yes) 
endif 
end
start
note right
StringlogFilename()
end note
:return filename==null ? String.valueOf("stdout"):filename;;
stop
end
@enduml

