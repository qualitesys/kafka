@startuml
!pragma layout smetana
start
note right
String version()
end note
:return AppInfoParser.getVersion();;
stop
end
start
note right
void start(Map<String,String> props)
end note
:AbstractConfig parsedConfig=new AbstractConfig(CONFIG_DEF,
props);;
:filename=parsedConfig.getString(FILE_CONFIG);;
end
start
note right
Class<?extendsTask> taskClass()
end note
:return FileStreamSinkTask.class ;;
stop
end
start
note right
List<Map<String,String>> taskConfigs(int maxTasks)
end note
:ArrayList<Map<String,String>> configs=new ArrayList<>();;
:Map<String,String> config=new HashMap<>();;
if (filename!=null ) then (yes) 
:config.put(FILE_CONFIG,filename);;
endif 
:configs.add(config);;
:return configs;;
stop
end
start
note right
void stop()
end note
end
start
note right
ConfigDef config()
end note
:return CONFIG_DEF;;
stop
end
@enduml

