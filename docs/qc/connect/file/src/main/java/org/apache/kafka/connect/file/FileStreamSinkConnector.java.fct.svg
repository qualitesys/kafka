@startuml
!pragma layout smetana
start
note right
Stringversion()
end note
:return AppInfoParser.getVersion();;
stop
end
start
note right
void start(Map<String,String>props)
end note
:filename=parsedConfig.getString(FILE_CONFIG);;
end
start
note right
Class<?  extends Task>taskClass()
end note
:return FileStreamSinkTask.class ;;
stop
end
start
note right
List<Map<String,String>>taskConfigs(intmaxTasks)
end note
if (filename!=null ) then (yes) 
:config.put(FILE_CONFIG,filename);;
endif 
:configs.add(config);;
:return configs;;
stop
end
start
note right
void stop()
end note
end
start
note right
ConfigDefconfig()
end note
:return CONFIG_DEF;;
stop
end
@enduml

