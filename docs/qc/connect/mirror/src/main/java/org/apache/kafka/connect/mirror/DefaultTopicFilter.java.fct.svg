@startuml
!pragma layout smetana
start
note right
void configure(Map<String,?> props)
end note
:TopicFilterConfig config=new TopicFilterConfig(props);;
:includePattern=config.includePattern();;
:excludePattern=config.excludePattern();;
end
start
note right
void close()
end note
end
start
note right
boolean included(String topic)
end note
:return includePattern!=null &&includePattern.matcher(topic)
.matches();;
stop
end
start
note right
boolean excluded(String topic)
end note
:return excludePattern!=null &&excludePattern.matcher(topic)
.matches();;
stop
end
start
note right
boolean shouldReplicateTopic(String topic)
end note
:return included(topic)&&!excluded(topic);;
stop
end
start
note right
constructor TopicFilterConfig(Map<String,
?> props)
end note
:super (DEF,ConfigUtils.translateDeprecatedConfigs(props,
new String[][]{{TOPICS_EXCLUDE_CONFIG,TOPICS_EXCLUDE_CONFIG_ALIAS}}),
false);;
end
start
note right
Pattern includePattern()
end note
:return MirrorUtils.compilePatternList(getList(TOPICS_INCLUDE_CONFIG));;
stop
end
start
note right
Pattern excludePattern()
end note
:return MirrorUtils.compilePatternList(getList(TOPICS_EXCLUDE_CONFIG));;
stop
end
@enduml

