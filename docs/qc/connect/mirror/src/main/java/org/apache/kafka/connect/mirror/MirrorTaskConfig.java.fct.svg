@startuml
!pragma layout smetana
start
note right
constructor MirrorTaskConfig(Map<String,String> props)
end note
:super (TASK_CONFIG_DEF,props);;
end
start
note right
Set<TopicPartition> taskTopicPartitions()
end note
:List<String> fields=getList(TASK_TOPIC_PARTITIONS);;
if (fields==null ||fields.isEmpty()) then (yes) 
:return Collections.emptySet();;
stop
endif 
:return fields.stream().map(MirrorUtils::decodeTopicPartition)
.collect(Collectors.toSet());;
stop
end
start
note right
Set<String> taskConsumerGroups()
end note
:List<String> fields=getList(TASK_CONSUMER_GROUPS);;
if (fields==null ||fields.isEmpty()) then (yes) 
:return Collections.emptySet();;
stop
endif 
:return new HashSet<>(fields);;
stop
end
start
note right
MirrorMetrics metrics()
end note
:MirrorMetrics metrics=new MirrorMetrics(this);;
:metricsReporters().forEach(metrics::addReporter);;
:return metrics;;
stop
end
@enduml

