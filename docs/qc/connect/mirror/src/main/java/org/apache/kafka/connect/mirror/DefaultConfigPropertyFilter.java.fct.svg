@startuml
!pragma layout smetana
start
note right
void configure(Map<String,? >props)
end note
end
start
note right
void close()
end note
end
start
note right
booleanexcluded(Stringprop)
end note
:return excludePattern!=null &&excludePattern.matcher(prop)
.matches();;
stop
end
start
note right
booleanshouldReplicateConfigProperty(Stringprop)
end note
:return !excluded(prop);;
stop
end
start
note right
constructor ConfigPropertyFilterConfig(Map<String,
? >props)
end note
end
start
note right
PatternexcludePattern()
end note
:return MirrorUtils.compilePatternList(getList(CONFIG_PROPERTIES_EXCLUDE_CONFIG));;
stop
end
@enduml

