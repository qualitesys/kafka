@startuml
!pragma layout smetana
start
note right
void configure(Map<String,? >props)
end note
:excludePattern=config.excludePattern();
end
start
note right
void close()
end note
end
start
note right
booleanexcluded(Stringprop)
end note
:return excludePattern!=null &&excludePattern.matcher(prop).matches();;
stop
end
start
note right
booleanshouldReplicateConfigProperty(Stringprop)
end note
:return !excluded(prop);;
stop
end
start
note right
constructor ConfigPropertyFilterConfig(Map<String,? >props)
end note
:super (DEF,ConfigUtils.translateDeprecatedConfigs(props,
new String[][]{{CONFIG_PROPERTIES_EXCLUDE_CONFIG,
CONFIG_PROPERTIES_EXCLUDE_ALIAS_CONFIG}}),
false);
end
start
note right
PatternexcludePattern()
end note
:return MirrorUtils.compilePatternList(getList(CONFIG_PROPERTIES_EXCLUDE_CONFIG));;
stop
end
@enduml

