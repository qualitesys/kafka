@startuml
!pragma layout smetana
start
note right
constructor MirrorCheckpointConnector()
end note
end
start
note right
constructor MirrorCheckpointConnector(List<String>knownConsumerGroups,
MirrorConnectorConfigconfig)
end note
:this.knownConsumerGroups=knownConsumerGroups;
:this.config=config;
end
start
note right
void start(Map<String,String>props)
end note
:config=new MirrorConnectorConfig(props);
if (!config.enabled()) then (yes) 
:return ;;
stop
endif 
:sourceAndTarget=new SourceAndTarget(config.sourceClusterAlias(),
config.targetClusterAlias());
:groupFilter=config.groupFilter();
:sourceAdminClient=AdminClient.create(config.sourceAdminConfig());
:scheduler=new Scheduler(MirrorCheckpointConnector.class ,
config.adminTimeout());
:scheduler.execute(this::createInternalTopics,
"creating internal topics");
:scheduler.execute(this::loadInitialConsumerGroups,
"loading initial consumer groups");
:scheduler.scheduleRepeatingDelayed(this::refreshConsumerGroups,
config.refreshGroupsInterval(),"refreshing consumer groups");
:log.info("Started {} with {} consumer groups.",
connectorName,knownConsumerGroups.size());
:log.debug("Started {} with consumer groups: {}",
connectorName,knownConsumerGroups);
end
start
note right
void stop()
end note
if (!config.enabled()) then (yes) 
:return ;;
stop
endif 
:Utils.closeQuietly(scheduler,"scheduler");
:Utils.closeQuietly(groupFilter,"group filter");
:Utils.closeQuietly(sourceAdminClient,"source admin client");
end
start
note right
Class<?  extends Task>taskClass()
end note
:return MirrorCheckpointTask.class ;;
stop
end
start
note right
List<Map<String,String>>taskConfigs(intmaxTasks)
end note
if (!config.enabled()||knownConsumerGroups.isEmpty()||config.emitCheckpointsInterval()
.isNegative()) then (yes) 
:return Collections.emptyList();;
stop
endif 
:return ConnectorUtils.groupPartitions(knownConsumerGroups,
numTasks).stream().map(config::taskConfigForConsumerGroups)
.collect(Collectors.toList());;
stop
end
start
note right
ConfigDefconfig()
end note
:return MirrorConnectorConfig.CONNECTOR_CONFIG_DEF;;
stop
end
start
note right
Stringversion()
end note
:return AppInfoParser.getVersion();;
stop
end
start
note right
void refreshConsumerGroups()
end note
:newConsumerGroups.addAll(consumerGroups);
:newConsumerGroups.removeAll(knownConsumerGroups);
:deadConsumerGroups.addAll(knownConsumerGroups);
:deadConsumerGroups.removeAll(consumerGroups);
if (!newConsumerGroups.isEmpty()||!deadConsumerGroups.isEmpty()) then (yes) 
:log.info("Found {} consumer groups for {}. {} are new. {} were removed. Previously had {}.",
consumerGroups.size(),sourceAndTarget,newConsumerGroups.size(),
deadConsumerGroups.size(),knownConsumerGroups.size());
:log.debug("Found new consumer groups: {}",
newConsumerGroups);
:knownConsumerGroups=consumerGroups;
:context.requestTaskReconfiguration();
endif 
end
start
note right
void loadInitialConsumerGroups()
end note
:knownConsumerGroups=findConsumerGroups();
end
start
note right
List<String>findConsumerGroups()
end note
:return listConsumerGroups().stream().map(ConsumerGroupListing::groupId)
.filter(this::shouldReplicate).collect(Collectors.toList());;
stop
end
start
note right
Collection<ConsumerGroupListing>listConsumerGroups()
end note
:return sourceAdminClient.listConsumerGroups()
.valid().get();;
stop
end
start
note right
void createInternalTopics()
end note
:MirrorUtils.createSinglePartitionCompactedTopic(config.checkpointsTopic(),
config.checkpointsTopicReplicationFactor(),
config.targetAdminConfig());
end
start
note right
booleanshouldReplicate(Stringgroup)
end note
:return groupFilter.shouldReplicateGroup(group);;
stop
end
@enduml

