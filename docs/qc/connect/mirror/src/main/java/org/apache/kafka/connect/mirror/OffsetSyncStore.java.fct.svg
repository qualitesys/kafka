@startuml
!pragma layout smetana
start
note right
constructor OffsetSyncStore(MirrorConnectorConfigconfig)
end note
end
start
note right
constructor OffsetSyncStore(KafkaConsumer<byte[],
byte[]>consumer,TopicPartitionoffsetSyncTopicPartition)
end note
end
start
note right
OptionalLongtranslateDownstream(TopicPartitionsourceTopicPartition,
longupstreamOffset)
end note
if (offsetSync.isPresent()) then (yes) 
if (offsetSync.get().upstreamOffset()>upstreamOffset) then (yes) 
:return OptionalLong.of(-1L);;
stop
endif 
:return OptionalLong.of(offsetSync.get().downstreamOffset()+
upstreamStep);;
stop
else (no)
:return OptionalLong.empty();;
stop
endif 
end
start
note right
void update(DurationpollTimeout)
end note
end
start
note right
void close()
end note
end
start
note right
void handleRecord(ConsumerRecord<byte[],byte[]>record)
end note
end
start
note right
Optional<OffsetSync>latestOffsetSync(TopicPartitiontopicPartition)
end note
:return Optional.ofNullable(offsetSyncs.get(topicPartition));;
stop
end
@enduml

