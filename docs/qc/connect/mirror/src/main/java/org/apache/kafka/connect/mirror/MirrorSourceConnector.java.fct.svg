end
start
note right
Map<String,String>configToMap(Configconfig)
end note
:return config.entries().stream().collect(Collectors.toMap(ConfigEntry::name,
ConfigEntry::value));;
stop
end
start
note right
void updateTopicConfigs(Map<String,Config>topicConfigs)
end note
:log.trace("Syncing configs for {} topics.",
configs.size());
:targetAdminClient.alterConfigs(configs).values().forEach((k,
v)->v.whenComplete((x,e)->{if (e!=null ){log.warn("Could not alter configuration of topic {}.",
k.name(),e);}}));
end
start
note right
void updateTopicAcls(List<AclBinding>bindings)
end note
:log.trace("Syncing {} topic ACL bindings.",
bindings.size());
:targetAdminClient.createAcls(bindings).values().forEach((k,
v)->v.whenComplete((x,e)->{if (e!=null ){log.warn("Could not sync ACL of topic {}.",
k.pattern().name(),e);}}));
end
start
note right
Stream<TopicPartition>expandTopicDescription(TopicDescriptiondescription)
end note
