start
note right
void createNewTopics(Map<String,NewTopic>newTopics)
end note
:targetAdminClient.createTopics(newTopics.values(),
new CreateTopicsOptions()).values().forEach((k,
v)->v.whenComplete((x,e)->{if (e!=null ){log.warn("Could not create topic {}.",
k,e);}else {log.info("Created remote topic {} with {} partitions.",
k,newTopics.get(k).numPartitions());}}));
end
start
note right
void createNewPartitions(Map<String,NewPartitions>newPartitions)
end note
:targetAdminClient.createPartitions(newPartitions).values().forEach((k,
v)->v.whenComplete((x,e)->{if (e instanceof InvalidPartitionsException){}else if (e!=null ){log.warn("Could not create topic-partitions for {}.",k,e);}else {log.info("Increased size of {} to {} partitions.",k,newPartitions.get(k).totalCount());}}));
end
start
note right
Set<String>listTopics(AdminClientadminClient)
