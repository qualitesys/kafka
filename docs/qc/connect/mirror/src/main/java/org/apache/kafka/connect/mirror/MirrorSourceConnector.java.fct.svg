@startuml
!pragma layout smetana
start
note right
constructor MirrorSourceConnector()
end note
end
start
note right
constructor MirrorSourceConnector(List<TopicPartition>knownSourceTopicPartitions,
MirrorConnectorConfigconfig)
end note
:this.knownSourceTopicPartitions=knownSourceTopicPartitions;
:this.config=config;
end
start
note right
constructor MirrorSourceConnector(SourceAndTargetsourceAndTarget,
ReplicationPolicyreplicationPolicy,TopicFiltertopicFilter,
ConfigPropertyFilterconfigPropertyFilter)
end note
:this.sourceAndTarget=sourceAndTarget;
:this.replicationPolicy=replicationPolicy;
:this.topicFilter=topicFilter;
:this.configPropertyFilter=configPropertyFilter;
end
start
note right
void start(Map<String,String>props)
end note
:config=new MirrorConnectorConfig(props);
if (!config.enabled()) then (yes) 
:return ;;
stop
endif 
:connectorName=config.connectorName();
:sourceAndTarget=new SourceAndTarget(config.sourceClusterAlias(),
config.targetClusterAlias());
:topicFilter=config.topicFilter();
:configPropertyFilter=config.configPropertyFilter();
:replicationPolicy=config.replicationPolicy();
:replicationFactor=config.replicationFactor();
:sourceAdminClient=AdminClient.create(config.sourceAdminConfig());
:targetAdminClient=AdminClient.create(config.targetAdminConfig());
:scheduler=new Scheduler(MirrorSourceConnector.class ,
config.adminTimeout());
:scheduler.execute(this::createOffsetSyncsTopic,
"creating upstream offset-syncs topic");
:scheduler.execute(this::loadTopicPartitions,
"loading initial set of topic-partitions");
:scheduler.execute(this::computeAndCreateTopicPartitions,
"creating downstream topic-partitions");
:scheduler.execute(this::refreshKnownTargetTopics,
"refreshing known target topics");
:scheduler.scheduleRepeating(this::syncTopicAcls,
config.syncTopicAclsInterval(),"syncing topic ACLs");
:scheduler.scheduleRepeating(this::syncTopicConfigs,
config.syncTopicConfigsInterval(),"syncing topic configs");
:scheduler.scheduleRepeatingDelayed(this::refreshTopicPartitions,
config.refreshTopicsInterval(),"refreshing topics");
:log.info("Started {} with {} topic-partitions.",
connectorName,knownSourceTopicPartitions.size());
:log.info("Starting {} took {} ms.",connectorName,
System.currentTimeMillis()-start);
end
start
note right
void stop()
end note
if (!config.enabled()) then (yes) 
:return ;;
stop
endif 
:Utils.closeQuietly(scheduler,"scheduler");
:Utils.closeQuietly(topicFilter,"topic filter");
:Utils.closeQuietly(configPropertyFilter,
"config property filter");
:Utils.closeQuietly(sourceAdminClient,"source admin client");
:Utils.closeQuietly(targetAdminClient,"target admin client");
:log.info("Stopping {} took {} ms.",connectorName,
System.currentTimeMillis()-start);
end
start
note right
Class<?  extends Task>taskClass()
end note
:return MirrorSourceTask.class ;;
stop
end
start
note right
List<Map<String,String>>taskConfigs(intmaxTasks)
end note
if (!config.enabled()||knownSourceTopicPartitions.isEmpty()) then (yes) 
:return Collections.emptyList();;
stop
endif 
:i++;
:roundRobinByTask.add(new ArrayList<>());
:roundRobinByTask.get(index).add(partition);
:count++;
:return roundRobinByTask.stream().map(config::taskConfigForTopicPartitions)
.collect(Collectors.toList());;
stop
end
start
note right
ConfigDefconfig()
end note
:return MirrorConnectorConfig.CONNECTOR_CONFIG_DEF;;
stop
end
start
note right
Stringversion()
end note
:return AppInfoParser.getVersion();;
stop
end
