b044a9ec8f8ef8faff067290f]
@startuml
!pragma layout smetana
start
note right
void start(Map<String,String>props)
end note
:stopped=new CountDownLatch(1);;
:sourceClusterAlias=config.sourceClusterAlias();;
:targetClusterAlias=config.targetClusterAlias();;
:heartbeatsTopic=config.heartbeatsTopic();;
:interval=config.emitHeartbeatsInterval();;
end
start
note right
void commit()
end note
end
start
note right
void stop()
end note
:stopped.countDown();;
end
start
note right
Stringversion()
end note
:return new MirrorHeartbeatConnector().version();;
stop
end
start
note right
List<SourceRecord>poll()
end note
if (stopped.await(interval.toMillis(),TimeUnit.MILLISECONDS)) then (yes) 
:return null ;;
stop
endif 
:return Collections.singletonList(record);;
stop
end
start
note right
void commitRecord(SourceRecordrecord,RecordMetadatametadata)
end note
end
@enduml

