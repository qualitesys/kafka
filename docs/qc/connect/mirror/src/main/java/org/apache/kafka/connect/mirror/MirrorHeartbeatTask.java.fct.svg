 points="242,1038.2695,246,1048.2695,250,1038.2695,246,1042.2695" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="246" x2="246" y1="1096.207" y2="1116.207"/><polygon fill="#181818" points="242,1106.207,246,1116.207,250,1106.207,246,1110.207" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="246" x2="246" y1="1206.0508" y2="1226.0508"/><polygon fill="#181818" points="242,1216.0508,246,1226.0508,250,1216.0508,246,1220.0508" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="246" x2="246" y1="1260.0195" y2="1280.0195"/><polygon fill="#181818" points="242,1270.0195,246,1280.0195,250,1270.0195,246,1274.0195" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="246" x2="246" y1="1364.5859" y2="1387.1523"/><polygon fill="#181818" points="242,1377.1523,246,1387.1523,250,1377.1523,246,1381.1523" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[e53e5537530a200d1fca65da614405a1]
@startuml
!pragma layout smetana
start
note right
void start(Map<String,String> props)
end note
:stopped=new CountDownLatch(1);;
:MirrorTaskConfig config=new MirrorTaskConfig(props);;
:sourceClusterAlias=config.sourceClusterAlias();;
:targetClusterAlias=config.targetClusterAlias();;
:heartbeatsTopic=config.heartbeatsTopic();;
:interval=config.emitHeartbeatsInterval();;
end
start
note right
void commit()
end note
end
start
note right
void stop()
end note
:stopped.countDown();;
end
start
note right
String version()
end note
:return new MirrorHeartbeatConnector().version();;
stop
end
start
note right
List<SourceRecord> poll()
end note
if (stopped.await(interval.toMillis(),TimeUnit.MILLISECONDS)) then (yes) 
:return null ;;
stop
endif 
:long timestamp=System.currentTimeMillis();;
:Heartbeat heartbeat=new Heartbeat(sourceClusterAlias,
targetClusterAlias,timestamp);;
:SourceRecord record=new SourceRecord(heartbeat.connectPartition(),
MirrorUtils.wrapOffset(0),heartbeatsTopic,
0,Schema.BYTES_SCHEMA,heartbeat.recordKey(),
Schema.BYTES_SCHEMA,heartbeat.recordValue(),
timestamp);;
:return Collections.singletonList(record);;
stop
end
start
note right
void commitRecord(SourceRecord record,RecordMetadata metadata)
end note
end
@enduml

