@startuml
!pragma layout smetana
start
note right
void configure(Map<String,?> props)
end note
:GroupFilterConfig config=new GroupFilterConfig(props);;
:includePattern=config.includePattern();;
:excludePattern=config.excludePattern();;
end
start
note right
void close()
end note
end
start
note right
boolean included(String group)
end note
:return includePattern!=null &&includePattern.matcher(group)
.matches();;
stop
end
start
note right
boolean excluded(String group)
end note
:return excludePattern!=null &&excludePattern.matcher(group)
.matches();;
stop
end
start
note right
boolean shouldReplicateGroup(String group)
end note
:return included(group)&&!excluded(group);;
stop
end
start
note right
constructor GroupFilterConfig(Map<String,
?> props)
end note
:super (DEF,ConfigUtils.translateDeprecatedConfigs(props,
new String[][]{{GROUPS_EXCLUDE_CONFIG,GROUPS_EXCLUDE_CONFIG_ALIAS}}),
false);;
end
start
note right
Pattern includePattern()
end note
:return MirrorUtils.compilePatternList(getList(GROUPS_INCLUDE_CONFIG));;
stop
end
start
note right
Pattern excludePattern()
end note
:return MirrorUtils.compilePatternList(getList(GROUPS_EXCLUDE_CONFIG));;
stop
end
@enduml

