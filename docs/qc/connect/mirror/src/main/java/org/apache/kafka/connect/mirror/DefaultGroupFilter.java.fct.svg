@startuml
!pragma layout smetana
start
note right
void configure(Map<String,? >props)
end note
:includePattern=config.includePattern();
:excludePattern=config.excludePattern();
end
start
note right
void close()
end note
end
start
note right
booleanincluded(Stringgroup)
end note
:return includePattern!=null &&includePattern.matcher(group).matches();;
stop
end
start
note right
booleanexcluded(Stringgroup)
end note
:return excludePattern!=null &&excludePattern.matcher(group).matches();;
stop
end
start
note right
booleanshouldReplicateGroup(Stringgroup)
end note
:return included(group)&&!excluded(group);;
stop
end
start
note right
constructor GroupFilterConfig(Map<String,? >props)
end note
:super (DEF,ConfigUtils.translateDeprecatedConfigs(props,new String[][]{{GROUPS_EXCLUDE_CONFIG,GROUPS_EXCLUDE_CONFIG_ALIAS}}),false);
end
start
note right
PatternincludePattern()
end note
:return MirrorUtils.compilePatternList(getList(GROUPS_INCLUDE_CONFIG));;
stop
end
start
note right
PatternexcludePattern()
end note
:return MirrorUtils.compilePatternList(getList(GROUPS_EXCLUDE_CONFIG));;
stop
end
@enduml

