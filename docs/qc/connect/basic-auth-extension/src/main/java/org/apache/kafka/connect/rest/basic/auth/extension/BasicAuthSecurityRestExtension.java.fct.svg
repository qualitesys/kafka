@startuml
!pragma layout smetana
start
note right
Supplier<Configuration>initializeConfiguration(Supplier<Configuration>configurationSupplier)
end note
:return ()->configuration;;
stop
:return ()->{throw new ConnectException("Failed to retrieve JAAS configuration",
e);};;
stop
end
start
note right
constructor BasicAuthSecurityRestExtension()
end note
:this(CONFIGURATION);
end
start
note right
constructor BasicAuthSecurityRestExtension(Supplier<Configuration>configuration)
end note
:this.configuration=configuration;
end
start
note right
void register(ConnectRestExtensionContextrestPluginContext)
end note
:log.trace("Registering JAAS basic auth filter");
:restPluginContext.configurable().register(new JaasBasicAuthFilter(configuration.get()));
:log.trace("Finished registering JAAS basic auth filter");
end
start
note right
void close()
end note
end
start
note right
void configure(Map<String,? >configs)
end note
:configuration.get();
end
start
note right
Stringversion()
end note
:return AppInfoParser.getVersion();;
stop
end
@enduml

