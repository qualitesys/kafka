@startuml
!pragma layout smetana
:String group="Schemas";;
:int orderInGroup=0;;
:CONFIG=ConverterConfig.newConfigDef();;
:CONFIG.define(SCHEMAS_ENABLE_CONFIG,Type.BOOLEAN,SCHEMAS_ENABLE_DEFAULT,Importance.HIGH,SCHEMAS_ENABLE_DOC,group,orderInGroup+
+,Width.MEDIUM,SCHEMAS_ENABLE_DISPLAY);;
:CONFIG.define(SCHEMAS_CACHE_SIZE_CONFIG,Type.INT,SCHEMAS_CACHE_SIZE_DEFAULT,Importance.HIGH,SCHEMAS_CACHE_SIZE_DOC,group,orderInGroup+
+,Width.MEDIUM,SCHEMAS_CACHE_SIZE_DISPLAY);;
:group="Serialization";;
:orderInGroup=0;;
:CONFIG.define(DECIMAL_FORMAT_CONFIG,Type.STRING,
DECIMAL_FORMAT_DEFAULT,ConfigDef.CaseInsensitiveValidString.in(DecimalFormat.BASE64.name(),DecimalFormat.NUMERIC.name()),Importance.LOW,DECIMAL_FORMAT_DOC,group,orderInGroup+
+,Width.MEDIUM,DECIMAL_FORMAT_DISPLAY);;
start
note right
ConfigDef configDef()
end note
:return CONFIG;;
stop
end
start
note right
constructor JsonConverterConfig(Map<String,
?> props)
end note
:super (CONFIG,props);;
:this.schemasEnabled=getBoolean(SCHEMAS_ENABLE_CONFIG);;
:this.schemaCacheSize=getInt(SCHEMAS_CACHE_SIZE_CONFIG);;
:this.decimalFormat=DecimalFormat.valueOf(getString(DECIMAL_FORMAT_CONFIG)
.toUpperCase(Locale.ROOT));;
end
start
note right
boolean schemasEnabled()
end note
:return schemasEnabled;;
stop
end
start
note right
int schemaCacheSize()
end note
:return schemaCacheSize;;
stop
end
start
note right
DecimalFormat decimalFormat()
end note
:return decimalFormat;;
stop
end
