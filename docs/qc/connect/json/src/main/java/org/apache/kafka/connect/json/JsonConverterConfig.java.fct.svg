@startuml
!pragma layout smetana
:CONFIG=ConverterConfig.newConfigDef();
:CONFIG.define(SCHEMAS_ENABLE_CONFIG,Type.BOOLEAN,
SCHEMAS_ENABLE_DEFAULT,Importance.HIGH,SCHEMAS_ENABLE_DOC,group,orderInGroup+
+,Width.MEDIUM,SCHEMAS_ENABLE_DISPLAY);
:CONFIG.define(SCHEMAS_CACHE_SIZE_CONFIG,
Type.INT,SCHEMAS_CACHE_SIZE_DEFAULT,Importance.HIGH,SCHEMAS_CACHE_SIZE_DOC,group,orderInGroup+
+,Width.MEDIUM,SCHEMAS_CACHE_SIZE_DISPLAY);
:group="Serialization";
:orderInGroup=0;
:CONFIG.define(DECIMAL_FORMAT_CONFIG,Type.STRING,
DECIMAL_FORMAT_DEFAULT,ConfigDef.CaseInsensitiveValidString.in(DecimalFormat.BASE64.name(),
DecimalFormat.NUMERIC.name()),Importance.LOW,DECIMAL_FORMAT_DOC,group,orderInGroup+
+,Width.MEDIUM,DECIMAL_FORMAT_DISPLAY);
start
note right
ConfigDefconfigDef()
end note
:return CONFIG;;
stop
end
start
note right
constructor JsonConverterConfig(Map<String,
? >props)
end note
:super (CONFIG,props);
:this.schemasEnabled=getBoolean(SCHEMAS_ENABLE_CONFIG);
:this.schemaCacheSize=getInt(SCHEMAS_CACHE_SIZE_CONFIG);
:this.decimalFormat=DecimalFormat.valueOf(getString(DECIMAL_FORMAT_CONFIG)
.toUpperCase(Locale.ROOT));
end
start
note right
booleanschemasEnabled()
end note
:return schemasEnabled;;
stop
end
start
note right
intschemaCacheSize()
end note
:return schemaCacheSize;;
stop
end
start
note right
DecimalFormatdecimalFormat()
end note
:return decimalFormat;;
stop
end
@enduml

