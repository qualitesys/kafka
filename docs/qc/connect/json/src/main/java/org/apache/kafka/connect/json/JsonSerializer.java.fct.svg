@startuml
!pragma layout smetana
start
note right
constructor JsonSerializer()
end note
:this(Collections.emptySet(),JsonNodeFactory.withExactBigDecimals(true));;
end
start
note right
constructor JsonSerializer(final Set<SerializationFeature> serializationFeatures,
final JsonNodeFactory jsonNodeFactory)
end note
:serializationFeatures.forEach(objectMapper::enable);;
:objectMapper.setNodeFactory(jsonNodeFactory);;
end
start
note right
byte[] serialize(String topic,JsonNode data)
end note
if (data==null ) then (yes) 
:return null ;;
stop
endif 
switch (try/catch block)
case (try)
:return objectMapper.writeValueAsBytes(data);;
stop
case (catch (Exception e))
:throw new SerializationException("Error serializing JSON message",e);;
stop
endswitch
end
@enduml

