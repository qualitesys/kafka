@startuml
!pragma layout smetana
start
note right
constructor JsonSerializer()
end note
:this(Collections.emptySet(),JsonNodeFactory.withExactBigDecimals(true));;
end
start
note right
constructor JsonSerializer(final Set<SerializationFeature>serializationFeatures,
final JsonNodeFactoryjsonNodeFactory)
end note
:serializationFeatures.forEach(objectMapper::enable);;
:objectMapper.setNodeFactory(jsonNodeFactory);;
end
start
note right
byte[]serialize(Stringtopic,JsonNodedata)
end note
if (data==null ) then (yes) 
:return null ;;
stop
endif 
:try {return objectMapper.writeValueAsBytes(data);}catch (Exceptione){throw new SerializationException("Error serializing JSON message",
e);};
end
@enduml

