@startuml
!pragma layout smetana
start
note right
constructor JsonDeserializer()
end note
:this(Collections.emptySet(),JsonNodeFactory.withExactBigDecimals(true));
end
start
note right
constructor JsonDeserializer(final Set<DeserializationFeature>deserializationFeatures,
final JsonNodeFactoryjsonNodeFactory)
end note
:deserializationFeatures.forEach(objectMapper::enable);
:objectMapper.setNodeFactory(jsonNodeFactory);
end
start
note right
JsonNodedeserialize(Stringtopic,byte[]bytes)
end note
if (bytes==null ) then (yes) 
:return null ;;
stop
endif 
:data=objectMapper.readTree(bytes);
:throw new SerializationException(e);;
:return data;;
stop
end
@enduml

