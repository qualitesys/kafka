@startuml
!pragma layout smetana
start
note right
ObjectNodeenvelope(JsonNodeschema,JsonNodepayload)
end note
:result.set(ENVELOPE_SCHEMA_FIELD_NAME,schema);
:result.set(ENVELOPE_PAYLOAD_FIELD_NAME,payload);
:return result;;
stop
end
start
note right
constructor Envelope(JsonNodeschema,JsonNodepayload)
end note
:this.schema=schema;
:this.payload=payload;
end
start
note right
ObjectNodetoJsonNode()
end note
:return envelope(schema,payload);;
stop
end
@enduml

