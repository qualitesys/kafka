@startuml
!pragma layout smetana
start
note right
ObjectNode envelope(JsonNode schema,JsonNode payload)
end note
:ObjectNode result=JsonNodeFactory.instance.objectNode();;
:result.set(ENVELOPE_SCHEMA_FIELD_NAME,schema);;
:result.set(ENVELOPE_PAYLOAD_FIELD_NAME,payload);;
:return result;;
stop
end
start
note right
constructor Envelope(JsonNode schema,JsonNode payload)
end note
:this.schema=schema;;
:this.payload=payload;;
end
start
note right
ObjectNode toJsonNode()
end note
:return envelope(schema,payload);;
stop
end
@enduml

