@startuml
!pragma layout smetana
start
note right
void configure(Map<String,? >props)
end note
:final SimpleConfigconfig=new SimpleConfig(CONFIG_DEF,
props);;
:delimiter=config.getString(DELIMITER_CONFIG);;
:schemaUpdateCache=new SynchronizedCache<>(new LRUCache<>(16));;
end
start
note right
Rapply(Rrecord)
end note
if (operatingValue(record)==null ) then (yes) 
:return record;;
stop
else if (operatingSchema(record)==null ) then (yes) 
:return applySchemaless(record);;
stop
else (no)
:return applyWithSchema(record);;
stop
endif 
end
start
note right
void close()
end note
end
start
note right
ConfigDefconfig()
end note
:return CONFIG_DEF;;
stop
end
start
note right
RapplySchemaless(Rrecord)
end note
:final Map<String,Object>value=requireMap(operatingValue(record),
PURPOSE);;
:final Map<String,Object>newValue=new LinkedHashMap<>();;
:applySchemaless(value,"",newValue);;
:return newRecord(record,null ,newValue);;
stop
end
start
note right
void applySchemaless(Map<String,Object>originalRecord,
StringfieldNamePrefix,Map<String,Object>newRecord)
end note
:final StringfieldName=fieldName(fieldNamePrefix,
entry.getKey());;
:Objectvalue=entry.getValue();;
if (value==null ) then (yes) 
:newRecord.put(fieldName(fieldNamePrefix,
entry.getKey()),null );;
:continue ;;
endif 
:Schema.TypeinferredType=ConnectSchema.schemaType(value.getClass());;
if (inferredType==null ) then (yes) 
:throw new DataException("Flatten transformation was passed a value of type "+
value.getClass()+" which is not supported by Connect's data API");;
stop
endif 
switch (switch (inferredType))
endswith
end
start
note right
RapplyWithSchema(Rrecord)
end note
:final Structvalue=requireStructOrNull(operatingValue(record),
PURPOSE);;
:Schemaschema=operatingSchema(record);;
:SchemaupdatedSchema=schemaUpdateCache.get(schema);;
if (updatedSchema==null ) then (yes) 
:final SchemaBuilderbuilder=SchemaUtil.copySchemaBasics(schema,
SchemaBuilder.struct());;
:StructdefaultValue=(Struct)schema.defaultValue();;
:buildUpdatedSchema(schema,"",builder,schema.isOptional(),
defaultValue);;
:updatedSchema=builder.build();;
:schemaUpdateCache.put(schema,updatedSchema);;
endif 
if (value==null ) then (yes) 
:return newRecord(record,updatedSchema,null );;
stop
else (no)
:final StructupdatedValue=new Struct(updatedSchema);;
:buildWithSchema(value,"",updatedValue);;
:return newRecord(record,updatedSchema,updatedValue);;
stop
endif 
end
start
note right
void buildUpdatedSchema(Schemaschema,StringfieldNamePrefix,
SchemaBuildernewSchema,booleanoptional,StructdefaultFromParent)
end note
:final StringfieldName=fieldName(fieldNamePrefix,
field.name());;
:final booleanfieldIsOptional=optional||field.schema()
.isOptional();;
:ObjectfieldDefaultValue=null ;;
if (field.schema().defaultValue()!=null ) then (yes) 
:fieldDefaultValue=field.schema().defaultValue();;
else if (defaultFromParent!=null ) then (yes) 
:fieldDefaultValue=defaultFromParent.get(field);;
endif 
switch (switch (field.schema().type()))
endswith
end
start
note right
SchemaconvertFieldSchema(Schemaorig,booleanoptional,
ObjectdefaultFromParent)
end note
:final SchemaBuilderbuilder=SchemaUtil.copySchemaBasics(orig);;
if (optional) then (yes) 
:builder.optional();;
endif 
if (defaultFromParent!=null ) then (yes) 
:builder.defaultValue(defaultFromParent);;
endif 
:return builder.build();;
stop
end
start
note right
void buildWithSchema(Structrecord,StringfieldNamePrefix,
StructnewRecord)
end note
if (record==null ) then (yes) 
:return ;;
stop
endif 
:final StringfieldName=fieldName(fieldNamePrefix,
field.name());;
switch (switch (field.schema().type()))
endswith
end
start
note right
StringfieldName(Stringprefix,StringfieldName)
end note
:return prefix.isEmpty()? fieldName:(prefix+
delimiter+fieldName);;
stop
end
start
note right
SchemaoperatingSchema(Rrecord)
end note
:return record.keySchema();;
stop
end
start
note right
ObjectoperatingValue(Rrecord)
end note
:return record.key();;
stop
end
start
note right
RnewRecord(Rrecord,SchemaupdatedSchema,ObjectupdatedValue)
end note
:return record.newRecord(record.topic(),record.kafkaPartition(),
updatedSchema,updatedValue,record.valueSchema(),
record.value(),record.timestamp());;
stop
end
start
note right
SchemaoperatingSchema(Rrecord)
end note
:return record.valueSchema();;
stop
end
start
note right
ObjectoperatingValue(Rrecord)
end note
:return record.value();;
stop
end
start
note right
RnewRecord(Rrecord,SchemaupdatedSchema,ObjectupdatedValue)
end note
:return record.newRecord(record.topic(),record.kafkaPartition(),
record.keySchema(),record.key(),updatedSchema,
updatedValue,record.timestamp());;
stop
end
@enduml

