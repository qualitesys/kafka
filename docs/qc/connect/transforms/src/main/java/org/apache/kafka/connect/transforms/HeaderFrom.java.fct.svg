<?xml version="1.0" encoding="UTF-8" standalone="no"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="357px" preserveAspectRatio="none" style="width:422px;height:357px;background:#000000;" version="1.1" viewBox="0 0 422 357" width="422px" zoomAndPan="magnify"><defs/><g><rect fill="#000F1D" height="1" style="stroke:#000F1D;stroke-width:1.0;" width="1" x="0" y="0"/><text fill="#33FF02" font-family="sans-serif" font-size="12" font-style="italic" font-weight="bold" lengthAdjust="spacing" textLength="127" x="5" y="17">PlantUML 1.2022.7</text><text fill="#33FF02" font-family="sans-serif" font-size="12" font-style="italic" font-weight="bold" lengthAdjust="spacing" textLength="4" x="5" y="30.9688"> </text><text fill="#33FF02" font-family="sans-serif" font-size="12" font-style="italic" font-weight="bold" lengthAdjust="spacing" textLength="399" x="5" y="44.9375">&lt;b&gt;This version of PlantUML is 138 days old, so you should</text><text fill="#33FF02" font-family="sans-serif" font-size="12" font-style="italic" font-weight="bold" lengthAdjust="spacing" textLength="408" x="5" y="58.9063">&lt;b&gt;consider upgrading from https://plantuml.com/download</text><rect fill="#33FF02" height="21.2969" style="stroke:#33FF02;stroke-width:1.0;" width="278" x="5" y="68.875"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="178" x="6" y="83.875">[From string (line 14) ]</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="5" x="5" y="104.1719"> </text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="79" x="5" y="120.4688">@startuml</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="190" x="5" y="136.7656">!pragma layout smetana</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="37" x="5" y="153.0625">start</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="78" x="5" y="169.3594">note right</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="278" x="5" y="185.6563">constructor Operation(Stringname)</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="71" x="5" y="201.9531">end note</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="150" x="5" y="218.25">:this.name=name;;</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="30" x="5" y="234.5469">end</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="37" x="5" y="250.8438">start</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="78" x="5" y="267.1406">note right</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="261" x="5" y="283.4375">OperationfromName(Stringname)</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="71" x="5" y="299.7344">end note</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="181" x="5" y="316.0313">switch (switch (name))</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" text-decoration="wavy underline" textLength="73" x="5" y="332.3281">endswith</text><text fill="#FF0000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="106" x="10" y="348.625">Syntax Error?</text><!--MD5=[194f6f08c4818ec0980800da3fc34679]
@startuml
!pragma layout smetana
start
note right
constructor Operation(Stringname)
end note
:this.name=name;;
end
start
note right
OperationfromName(Stringname)
end note
switch (switch (name))
endswith
end
start
note right
StringtoString()
end note
:return name;;
stop
end
start
note right
Rapply(Rrecord)
end note
:ObjectoperatingValue=operatingValue(record);;
:SchemaoperatingSchema=operatingSchema(record);;
if (operatingSchema==null ) then (yes) 
:return applySchemaless(record,operatingValue);;
stop
else (no)
:return applyWithSchema(record,operatingValue,
operatingSchema);;
stop
endif 
end
start
note right
RapplyWithSchema(Rrecord,ObjectoperatingValue,
SchemaoperatingSchema)
end note
:HeadersupdatedHeaders=record.headers().duplicate();;
:Structvalue=Requirements.requireStruct(operatingValue,"header "+
operation);;
:final SchemaupdatedSchema;;
:final StructupdatedValue;;
if (operation==Operation.MOVE) then (yes) 
:updatedSchema=moveSchema(operatingSchema);;
:updatedValue=new Struct(updatedSchema);;
:updatedValue.put(field,value.get(field.name()));;
else (no)
:updatedSchema=operatingSchema;;
:updatedValue=value;;
endif 
:StringfieldName=fields.get(i);;
:StringheaderName=headers.get(i);;
:ObjectfieldValue=value.schema().field(fieldName)!=null ? value.get(fieldName):null ;;
:SchemafieldSchema=operatingSchema.field(fieldName)
.schema();;
:updatedHeaders.add(headerName,fieldValue,
fieldSchema);;
:return newRecord(record,updatedSchema,updatedValue,
updatedHeaders);;
stop
end
start
note right
SchemamoveSchema(SchemaoperatingSchema)
end note
:SchemamoveSchema=this.moveSchemaCache.get(operatingSchema);;
if (moveSchema==null ) then (yes) 
:final SchemaBuilderbuilder=SchemaUtil.copySchemaBasics(operatingSchema,
SchemaBuilder.struct());;
if (!fields.contains(field.name())) then (yes) 
:builder.field(field.name(),field.schema());;
endif 
:moveSchema=builder.build();;
:moveSchemaCache.put(operatingSchema,moveSchema);;
endif 
:return moveSchema;;
stop
end
start
note right
RapplySchemaless(Rrecord,ObjectoperatingValue)
end note
:HeadersupdatedHeaders=record.headers().duplicate();;
:Map<String,Object>value=Requirements.requireMap(operatingValue,"header "+
operation);;
:Map<String,Object>updatedValue=new HashMap<>(value);;
:StringfieldName=fields.get(i);;
:ObjectfieldValue=value.get(fieldName);;
:StringheaderName=headers.get(i);;
if (operation==Operation.MOVE) then (yes) 
:updatedValue.remove(fieldName);;
endif 
:updatedHeaders.add(headerName,fieldValue,
null );;
:return newRecord(record,null ,updatedValue,
updatedHeaders);;
stop
end
start
note right
ObjectoperatingValue(Rrecord)
end note
:return record.key();;
stop
end
start
note right
SchemaoperatingSchema(Rrecord)
end note
:return record.keySchema();;
stop
end
start
note right
RnewRecord(Rrecord,SchemaupdatedSchema,ObjectupdatedValue,
Iterable<Header>updatedHeaders)
end note
:return record.newRecord(record.topic(),record.kafkaPartition(),
updatedSchema,updatedValue,record.valueSchema(),
record.value(),record.timestamp(),updatedHeaders);;
stop
end
start
note right
ObjectoperatingValue(Rrecord)
end note
:return record.value();;
stop
end
start
note right
SchemaoperatingSchema(Rrecord)
end note
:return record.valueSchema();;
stop
end
start
note right
RnewRecord(Rrecord,SchemaupdatedSchema,ObjectupdatedValue,
Iterable<Header>updatedHeaders)
end note
:return record.newRecord(record.topic(),record.kafkaPartition(),
record.keySchema(),record.key(),updatedSchema,
updatedValue,record.timestamp(),updatedHeaders);;
stop
end
start
note right
ConfigDefconfig()
end note
:return CONFIG_DEF;;
stop
end
start
note right
void close()
end note
end
start
note right
void configure(Map<String,? >props)
end note
:final SimpleConfigconfig=new SimpleConfig(CONFIG_DEF,
props);;
:fields=config.getList(FIELDS_FIELD);;
:headers=config.getList(HEADERS_FIELD);;
if (headers.size()!=fields.size()) then (yes) 
:throw new ConfigException(format("'%s' config must have the same number of elements as '%s' config.",
FIELDS_FIELD,HEADERS_FIELD));;
stop
endif 
:operation=Operation.fromName(config.getString(OPERATION_FIELD));;
end
@enduml

