,361.25,759.5508" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="361.25" x2="361.25" y1="799.5195" y2="819.5195"/><polygon fill="#181818" points="357.25,809.5195,361.25,819.5195,365.25,809.5195,361.25,813.5195" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[99900528576f3882b373083ffa1e3759]
@startuml
!pragma layout smetana
start
note right
SchemaBuildercopySchemaBasics(Schemasource)
end note
:SchemaBuilderbuilder;;
if (source.type()==Schema.Type.ARRAY) then (yes) 
:builder=SchemaBuilder.array(source.valueSchema());;
else (no)
:builder=new SchemaBuilder(source.type());;
endif 
:return copySchemaBasics(source,builder);;
stop
end
start
note right
SchemaBuildercopySchemaBasics(Schemasource,
SchemaBuilderbuilder)
end note
:builder.name(source.name());;
:builder.version(source.version());;
:builder.doc(source.doc());;
:final Map<String,String>params=source.parameters();;
if (params!=null ) then (yes) 
:builder.parameters(params);;
endif 
:return builder;;
stop
end
@enduml

