@startuml
!pragma layout smetana
start
note right
SchemaBuildercopySchemaBasics(Schemasource)
end note
if (source.type()==Schema.Type.ARRAY) then (yes) 
else (no)
endif 
:return copySchemaBasics(source,builder);;
stop
end
start
note right
SchemaBuildercopySchemaBasics(Schemasource,
SchemaBuilderbuilder)
end note
if (params!=null ) then (yes) 
endif 
:return builder;;
stop
end
@enduml

