@startuml
!pragma layout smetana
start
note right
void ensureValid(Stringname,Objectvalue)
end note
:try ;
:Pattern.compile((String)value);;
:catch (Exceptione);
:throw new ConfigException(name,value,"Invalid regex: "+
e.getMessage());;
stop
end
start
note right
StringtoString()
end note
:return "valid regex";;
stop
end
@enduml

