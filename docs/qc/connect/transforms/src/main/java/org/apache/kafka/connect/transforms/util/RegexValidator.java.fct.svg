@startuml
!pragma layout smetana
start
note right
void ensureValid(Stringname,Objectvalue)
end note
switch (try/catch block)
case (try)
:Pattern.compile((String)value);;
case (catch (Exceptione))
:throw new ConfigException(name,value,"Invalid regex: "+
e.getMessage());;
stop
endswitch
end
start
note right
StringtoString()
end note
:return "valid regex";;
stop
end
@enduml

