@startuml
!pragma layout smetana
start
note right
void ensureValid(String name,Object value)
end note
switch (try/catch block)
case (try)
:Pattern.compile((String )value);;
case (catch (Exception e))
:throw new ConfigException(name,value,"Invalid regex: "+
e.getMessage());;
stop
endswitch
end
start
note right
String toString()
end note
:return "valid regex";;
stop
end
@enduml

