 style="stroke:#181818;stroke-width:1.0;" x1="220" x2="220" y1="658.1797" y2="680.7461"/><polygon fill="#181818" points="216,670.7461,220,680.7461,224,670.7461,220,674.7461" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="220" x2="220" y1="728.6836" y2="748.6836"/><polygon fill="#181818" points="216,738.6836,220,748.6836,224,738.6836,220,742.6836" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="220" x2="220" y1="782.6523" y2="802.6523"/><polygon fill="#181818" points="216,792.6523,220,802.6523,224,792.6523,220,796.6523" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[0af90e1c12c722dc7a5c67bc2758d365]
@startuml
!pragma layout smetana
start
note right
R apply(R record)
end note
:Headers updatedHeaders=new ConnectHeaders();;
if (!headers.contains(header.key())) then (yes) 
:updatedHeaders.add(header);;
endif 
:return record.newRecord(record.topic(),record.kafkaPartition(),
record.keySchema(),record.key(),record.valueSchema(),
record.value(),record.timestamp(),updatedHeaders);;
stop
end
start
note right
ConfigDef config()
end note
:return CONFIG_DEF;;
stop
end
start
note right
void close()
end note
end
start
note right
void configure(Map<String,?> props)
end note
:final SimpleConfig config=new SimpleConfig(CONFIG_DEF,
props);;
:headers=new HashSet<>(config.getList(HEADERS_FIELD));;
end
@enduml

