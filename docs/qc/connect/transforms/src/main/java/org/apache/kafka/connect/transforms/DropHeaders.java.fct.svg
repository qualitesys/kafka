@startuml
!pragma layout smetana
start
note right
Rapply(Rrecord)
end note
if (!headers.contains(header.key())) then (yes) 
:updatedHeaders.add(header);
endif 
:return record.newRecord(record.topic(),record.kafkaPartition(),record.keySchema(),record.key(),record.valueSchema(),record.value(),record.timestamp(),updatedHeaders);;
stop
end
start
note right
ConfigDefconfig()
end note
:return CONFIG_DEF;;
stop
end
start
note right
void close()
end note
end
start
note right
void configure(Map<String,? >props)
end note
:headers=new HashSet<>(config.getList(HEADERS_FIELD));
end
@enduml

