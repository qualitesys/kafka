@startuml
!pragma layout smetana
start
note right
R apply(R record )
end note
:Headers updatedHeaders=new ConnectHeaders();;
if (!headers.contains(header.key())) then (yes) 
:updatedHeaders.add(header);;
endif 
:return record .newRecord(record .topic(),
record .kafkaPartition(),record .keySchema(),
record .key(),record .valueSchema(),record .value(),
record .timestamp(),updatedHeaders);;
stop
end
start
note right
ConfigDef config()
end note
:return CONFIG_DEF;;
stop
end
start
note right
void close()
end note
end
start
note right
void configure(Map<String,?> props)
end note
:final SimpleConfig config=new SimpleConfig(CONFIG_DEF,
props);;
:headers=new HashSet<>(config.getList(HEADERS_FIELD));;
end
@enduml

