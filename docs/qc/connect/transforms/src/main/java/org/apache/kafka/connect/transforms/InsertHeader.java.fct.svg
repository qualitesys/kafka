;" x1="247.5" x2="247.5" y1="511.8086" y2="534.375"/><polygon fill="#181818" points="243.5,524.375,247.5,534.375,251.5,524.375,247.5,528.375" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="247.5" x2="247.5" y1="568.3438" y2="588.3438"/><polygon fill="#181818" points="243.5,578.3438,247.5,588.3438,251.5,578.3438,247.5,582.3438" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="247.5" x2="247.5" y1="622.3125" y2="642.3125"/><polygon fill="#181818" points="243.5,632.3125,247.5,642.3125,251.5,632.3125,247.5,636.3125" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[0cea9310cf6b592b53442c24fcb69a42]
@startuml
!pragma layout smetana
start
note right
Rapply(Rrecord)
end note
:updatedHeaders.add(header,literalValue);;
:return record.newRecord(record.topic(),record.kafkaPartition(),
record.keySchema(),record.key(),record.valueSchema(),
record.value(),record.timestamp(),updatedHeaders);;
stop
end
start
note right
ConfigDefconfig()
end note
:return CONFIG_DEF;;
stop
end
start
note right
void close()
end note
end
start
note right
void configure(Map<String,? >props)
end note
:header=config.getString(HEADER_FIELD);;
:literalValue=Values.parseString(config.getString(VALUE_LITERAL_FIELD));;
end
@enduml

