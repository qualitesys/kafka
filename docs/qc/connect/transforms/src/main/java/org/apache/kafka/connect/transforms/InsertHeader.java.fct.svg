@startuml
!pragma layout smetana
start
note right
Rapply(Rrecord)
end note
:updatedHeaders.add(header,literalValue);
:return record.newRecord(record.topic(),record.kafkaPartition(),record.keySchema(),record.key(),record.valueSchema(),record.value(),record.timestamp(),updatedHeaders);;
stop
end
start
note right
ConfigDefconfig()
end note
:return CONFIG_DEF;;
stop
end
start
note right
void close()
end note
end
start
note right
void configure(Map<String,? >props)
end note
:header=config.getString(HEADER_FIELD);
:literalValue=Values.parseString(config.getString(VALUE_LITERAL_FIELD));
end
@enduml

