@startuml
!pragma layout smetana
start
note right
R apply(R record)
end note
:Headers updatedHeaders=record.headers().duplicate();;
:updatedHeaders.add(header,literalValue);;
:return record.newRecord(record.topic(),record.kafkaPartition(),
record.keySchema(),record.key(),record.valueSchema(),
record.value(),record.timestamp(),updatedHeaders);;
stop
end
start
note right
ConfigDef config()
end note
:return CONFIG_DEF;;
stop
end
start
note right
void close()
end note
end
start
note right
void configure(Map<String,?> props)
end note
:final SimpleConfig config=new SimpleConfig(CONFIG_DEF,
props);;
:header=config.getString(HEADER_FIELD);;
:literalValue=Values.parseString(config.getString(VALUE_LITERAL_FIELD));;
end
@enduml

