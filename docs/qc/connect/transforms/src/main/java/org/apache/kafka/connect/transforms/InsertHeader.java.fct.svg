oke-width:1.0;"/><!--MD5=[1402a7bafd217828082901b2a3c726cd]
@startuml
!pragma layout smetana
start
note right
Rapply(Rrecord )
end note
:HeadersupdatedHeaders=record .headers().duplicate();;
:updatedHeaders.add(header,literalValue);;
:return record .newRecord(record .topic(),
record .kafkaPartition(),record .keySchema(),
record .key(),record .valueSchema(),record .value(),
record .timestamp(),updatedHeaders);;
stop
end
start
note right
ConfigDefconfig()
end note
:return CONFIG_DEF;;
stop
end
start
note right
void close()
end note
end
start
note right
void configure(Map<String,? >props)
end note
:final SimpleConfigconfig=new SimpleConfig(CONFIG_DEF,
props);;
:header=config.getString(HEADER_FIELD);;
:literalValue=Values.parseString(config.getString(VALUE_LITERAL_FIELD));;
end
@enduml

