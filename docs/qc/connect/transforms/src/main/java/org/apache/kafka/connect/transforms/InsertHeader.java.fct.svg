x1="245.5" x2="245.5" y1="511.8086" y2="534.375"/><polygon fill="#181818" points="241.5,524.375,245.5,534.375,249.5,524.375,245.5,528.375" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="245.5" x2="245.5" y1="568.3438" y2="588.3438"/><polygon fill="#181818" points="241.5,578.3438,245.5,588.3438,249.5,578.3438,245.5,582.3438" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="245.5" x2="245.5" y1="622.3125" y2="642.3125"/><polygon fill="#181818" points="241.5,632.3125,245.5,642.3125,249.5,632.3125,245.5,636.3125" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[9507227b952a31490fee8df35e963e86]
@startuml
!pragma layout smetana
start
note right
Rapply(Rrecord)
end note
:updatedHeaders.add(header,literalValue);
:return record.newRecord(record.topic(),record.kafkaPartition(),
record.keySchema(),record.key(),record.valueSchema(),
record.value(),record.timestamp(),updatedHeaders);;
stop
end
start
note right
ConfigDefconfig()
end note
:return CONFIG_DEF;;
stop
end
start
note right
void close()
end note
end
start
note right
void configure(Map<String,? >props)
end note
:header=config.getString(HEADER_FIELD);
:literalValue=Values.parseString(config.getString(VALUE_LITERAL_FIELD));
end
@enduml

