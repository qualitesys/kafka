@startuml
!pragma layout smetana
start
note right
void configure(Map<String,? >props)
end note
:final SimpleConfigconfig=new SimpleConfig(CONFIG_DEF,
props);;
:casts=parseFieldTypes(config.getList(SPEC_CONFIG));;
:wholeValueCastType=casts.get(WHOLE_VALUE_CAST);;
:schemaUpdateCache=new SynchronizedCache<>(new LRUCache<>(16));;
end
start
note right
Rapply(Rrecord)
end note
if (operatingValue(record)==null ) then (yes) 
:return record;;
stop
endif 
if (operatingSchema(record)==null ) then (yes) 
:return applySchemaless(record);;
stop
else (no)
:return applyWithSchema(record);;
stop
endif 
end
start
note right
ConfigDefconfig()
end note
:return CONFIG_DEF;;
stop
end
start
note right
void close()
end note
end
start
note right
RapplySchemaless(Rrecord)
end note
if (wholeValueCastType!=null ) then (yes) 
:return newRecord(record,null ,castValueToType(null ,
operatingValue(record),wholeValueCastType));;
stop
endif 
:final Map<String,Object>value=requireMap(operatingValue(record),
PURPOSE);;
:final HashMap<String,Object>updatedValue=new HashMap<>(value);;
:Stringfield=fieldSpec.getKey();;
:updatedValue.put(field,castValueToType(null ,
value.get(field),fieldSpec.getValue()));;
:return newRecord(record,null ,updatedValue);;
stop
end
start
note right
RapplyWithSchema(Rrecord)
end note
:SchemavalueSchema=operatingSchema(record);;
:SchemaupdatedSchema=getOrBuildSchema(valueSchema);;
if (wholeValueCastType!=null ) then (yes) 
:return newRecord(record,updatedSchema,castValueToType(valueSchema,
operatingValue(record),wholeValueCastType));;
stop
endif 
:final Structvalue=requireStruct(operatingValue(record),
PURPOSE);;
:final StructupdatedValue=new Struct(updatedSchema);;
:final ObjectorigFieldValue=value.get(field);;
:final Schema.TypetargetType=casts.get(field.name());;
:final ObjectnewFieldValue=targetType!=null ? castValueToType(field.schema(),
origFieldValue,targetType):origFieldValue;;
:log.trace("Cast field '{}' from '{}' to '{}'",
field.name(),origFieldValue,newFieldValue);;
:updatedValue.put(updatedSchema.field(field.name()),
newFieldValue);;
:return newRecord(record,updatedSchema,updatedValue);;
stop
end
start
note right
SchemagetOrBuildSchema(SchemavalueSchema)
end note
:SchemaupdatedSchema=schemaUpdateCache.get(valueSchema);;
if (updatedSchema!=null ) then (yes) 
:return updatedSchema;;
stop
endif 
:final SchemaBuilderbuilder;;
if (wholeValueCastType!=null ) then (yes) 
:builder=SchemaUtil.copySchemaBasics(valueSchema,
convertFieldType(wholeValueCastType));;
else (no)
:builder=SchemaUtil.copySchemaBasics(valueSchema,
SchemaBuilder.struct());;
if (casts.containsKey(field.name())) then (yes) 
:SchemaBuilderfieldBuilder=convertFieldType(casts.get(field.name()));;
if (field.schema().isOptional()) then (yes) 
:fieldBuilder.optional();;
endif 
if (field.schema().defaultValue()!=null ) then (yes) 
:SchemafieldSchema=field.schema();;
:fieldBuilder.defaultValue(castValueToType(fieldSchema,
fieldSchema.defaultValue(),fieldBuilder.type()));;
endif 
:builder.field(field.name(),fieldBuilder.build());;
else (no)
:builder.field(field.name(),field.schema());;
endif 
endif 
if (valueSchema.isOptional()) then (yes) 
:builder.optional();;
endif 
if (valueSchema.defaultValue()!=null ) then (yes) 
:builder.defaultValue(castValueToType(valueSchema,
valueSchema.defaultValue(),builder.type()));;
endif 
:updatedSchema=builder.build();;
:schemaUpdateCache.put(valueSchema,updatedSchema);;
:return updatedSchema;;
stop
end
start
note right
SchemaBuilderconvertFieldType(Schema.Typetype)
end note
switch (switch (type))
endswith
end
start
note right
ObjectencodeLogicalType(Schemaschema,Objectvalue)
end note
switch (switch (schema.name()))
endswith
:return value;;
stop
end
start
note right
ObjectcastValueToType(Schemaschema,Objectvalue,
Schema.TypetargetType)
end note
:try ;
if (value==null ) then (yes) 
:return null ;;
stop
endif 
:Schema.TypeinferredType=schema==null ? ConnectSchema.schemaType(value.getClass()):schema.type();;
if (inferredType==null ) then (yes) 
:throw new DataException("Cast transformation was passed a value of type "+
value.getClass()+" which is not supported by Connect's data API");;
stop
endif 
:validCastType(inferredType,FieldType.INPUT);;
if (schema!=null &&schema.name()!=null &&targetType!=Type.STRING) then (yes) 
:value=encodeLogicalType(schema,value);;
endif 
switch (switch (targetType))
endswith
:catch (NumberFormatExceptione);
:throw new DataException("Value ("+value.toString()+
") was out of range for requested data type",e);;
stop
end
start
note right
bytecastToInt8(Objectvalue)
end note
if (value instanceof Number) then (yes) 
:return ((Number)value).byteValue();;
stop
else if (value instanceof Boolean) then (yes) 
:return ((boolean)value)? (byte)1:(byte)0;;
stop
else if (value instanceof String) then (yes) 
:return Byte.parseByte((String)value);;
stop
else (no)
:throw new DataException("Unexpected type in Cast transformation: "+
value.getClass());;
stop
endif 
end
start
note right
shortcastToInt16(Objectvalue)
end note
if (value instanceof Number) then (yes) 
:return ((Number)value).shortValue();;
stop
else if (value instanceof Boolean) then (yes) 
:return ((boolean)value)? (short)1:(short)0;;
stop
else if (value instanceof String) then (yes) 
:return Short.parseShort((String)value);;
stop
else (no)
:throw new DataException("Unexpected type in Cast transformation: "+
value.getClass());;
stop
endif 
end
start
note right
intcastToInt32(Objectvalue)
end note
if (value instanceof Number) then (yes) 
:return ((Number)value).intValue();;
stop
else if (value instanceof Boolean) then (yes) 
:return ((boolean)value)? 1:0;;
stop
else if (value instanceof String) then (yes) 
:return Integer.parseInt((String)value);;
stop
else (no)
:throw new DataException("Unexpected type in Cast transformation: "+
value.getClass());;
stop
endif 
end
start
note right
longcastToInt64(Objectvalue)
end note
if (value instanceof Number) then (yes) 
:return ((Number)value).longValue();;
stop
else if (value instanceof Boolean) then (yes) 
:return ((boolean)value)? (long)1:(long)0;;
stop
else if (value instanceof String) then (yes) 
:return Long.parseLong((String)value);;
stop
else (no)
:throw new DataException("Unexpected type in Cast transformation: "+
value.getClass());;
stop
endif 
end
start
note right
floatcastToFloat32(Objectvalue)
end note
if (value instanceof Number) then (yes) 
:return ((Number)value).floatValue();;
stop
else if (value instanceof Boolean) then (yes) 
:return ((boolean)value)? 1.f:0.f;;
stop
else if (value instanceof String) then (yes) 
:return Float.parseFloat((String)value);;
stop
else (no)
:throw new DataException("Unexpected type in Cast transformation: "+
value.getClass());;
stop
endif 
end
start
note right
doublecastToFloat64(Objectvalue)
end note
if (value instanceof Number) then (yes) 
:return ((Number)value).doubleValue();;
stop
else if (value instanceof Boolean) then (yes) 
:return ((boolean)value)? 1.:0.;;
stop
else if (value instanceof String) then (yes) 
:return Double.parseDouble((String)value);;
stop
else (no)
:throw new DataException("Unexpected type in Cast transformation: "+
value.getClass());;
stop
endif 
end
start
note right
booleancastToBoolean(Objectvalue)
end note
if (value instanceof Number) then (yes) 
:return ((Number)value).longValue()!=0L;;
stop
else if (value instanceof Boolean) then (yes) 
:return (Boolean)value;;
stop
else if (value instanceof String) then (yes) 
:return Boolean.parseBoolean((String)value);;
stop
else (no)
:throw new DataException("Unexpected type in Cast transformation: "+
value.getClass());;
stop
endif 
end
start
note right
StringcastToString(Objectvalue)
end note
if (value instanceof java.util.Date) then (yes) 
:java.util.DatedateValue=(java.util.Date)value;;
:return Values.dateFormatFor(dateValue).format(dateValue);;
stop
else if (value instanceof ByteBuffer) then (yes) 
:ByteBufferbyteBuffer=(ByteBuffer)value;;
:return Base64.getEncoder().encodeToString(Utils.readBytes(byteBuffer));;
stop
else if (value instanceof byte[]) then (yes) 
:byte[]rawBytes=(byte[])value;;
:return Base64.getEncoder().encodeToString(rawBytes);;
stop
else (no)
:return value.toString();;
stop
endif 
end
start
note right
Map<String,Schema.Type>parseFieldTypes(List<String>mappings)
end note
:final Map<String,Schema.Type>m=new HashMap<>();;
:booleanisWholeValueCast=false;;
:final String[]parts=mapping.split(":");;
if (parts.length>2) then (yes) 
:throw new ConfigException(ReplaceField.ConfigName.RENAME,mappings,"Invalid rename mapping: "+
mapping);;
stop
endif 
if (parts.length==1) then (yes) 
:Schema.TypetargetType=Schema.Type.valueOf(parts[0].trim()
.toUpperCase(Locale.ROOT));;
:m.put(WHOLE_VALUE_CAST,validCastType(targetType,
FieldType.OUTPUT));;
:isWholeValueCast=true;;
else (no)
:Schema.Typetype;;
:try ;
:type=Schema.Type.valueOf(parts[1].trim()
.toUpperCase(Locale.ROOT));;
:catch (IllegalArgumentExceptione);
:throw new ConfigException("Invalid type found in casting spec: "+
parts[1].trim(),e);;
stop
:m.put(parts[0].trim(),validCastType(type,
FieldType.OUTPUT));;
endif 
if (isWholeValueCast&&mappings.size()>1) then (yes) 
:throw new ConfigException("Cast transformations that specify a type to cast the entire value to "+
"may ony specify a single cast in their spec");;
stop
endif 
:return m;;
stop
end
start
note right
Schema.TypevalidCastType(Schema.Typetype,
FieldTypefieldType)
end note
switch (switch (fieldType))
endswith
:return type;;
stop
end
