@startuml
!pragma layout smetana
start
note right
ConfigDefconfig()
end note
:return CONFIG_DEF;;
stop
end
start
note right
booleantest(Rrecord )
end note
:Iterator<Header>headerIterator=record .headers()
.allWithName(name);;
:return headerIterator!=null &&headerIterator.hasNext();;
stop
end
start
note right
void close()
end note
end
start
note right
void configure(Map<String,? >configs)
end note
:this.name=new SimpleConfig(config(),configs)
.getString(NAME_CONFIG);;
end
start
note right
StringtoString()
end note
:return "HasHeaderKey{"+"name='"+name+'\''+
'}';;
stop
end
@enduml

