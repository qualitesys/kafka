@startuml
!pragma layout smetana
start
note right
void configure(Map<String,? >configs)
end note
end
start
note right
Rapply(Rrecord)
end note
if (record.valueSchema()==null ) then (yes) 
:return applySchemaless(record);;
stop
else (no)
:return applyWithSchema(record);;
stop
endif 
end
start
note right
RapplySchemaless(Rrecord)
end note
:return record.newRecord(record.topic(),record.kafkaPartition(),
null ,key,record.valueSchema(),record.value(),
record.timestamp());;
stop
end
start
note right
RapplyWithSchema(Rrecord)
end note
if (keySchema==null ) then (yes) 
if (fieldFromValue==null ) then (yes) 
:throw new DataException("Field does not exist: "+
field);;
endif 
endif 
:return record.newRecord(record.topic(),record.kafkaPartition(),
keySchema,key,value.schema(),value,record.timestamp());;
stop
end
start
note right
ConfigDefconfig()
end note
:return CONFIG_DEF;;
stop
end
start
note right
void close()
end note
end
@enduml

