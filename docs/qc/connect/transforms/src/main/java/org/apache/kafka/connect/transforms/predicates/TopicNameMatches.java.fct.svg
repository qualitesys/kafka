@startuml
!pragma layout smetana
start
note right
ConfigDefconfig()
end note
:return CONFIG_DEF;;
stop
end
start
note right
booleantest(Rrecord)
end note
:return record.topic()!=null &&pattern.matcher(record.topic()).matches();;
stop
end
start
note right
void close()
end note
end
start
note right
void configure(Map<String,? >configs)
end note
:result=Pattern.compile(value);
:throw new ConfigException(PATTERN_CONFIG,
value,"entry must be a Java-compatible regular expression: "+
e.getMessage());;
:this.pattern=result;
end
start
note right
StringtoString()
end note
:return "TopicNameMatches{"+"pattern="+pattern+
'}';;
stop
end
@enduml

