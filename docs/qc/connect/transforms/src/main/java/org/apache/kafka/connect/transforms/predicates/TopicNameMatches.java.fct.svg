th:1.0;" x1="268.5" x2="268.5" y1="680.9102" y2="703.4766"/><polygon fill="#181818" points="264.5,693.4766,268.5,703.4766,272.5,693.4766,268.5,697.4766" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="268.5" x2="268.5" y1="737.4453" y2="757.4453"/><polygon fill="#181818" points="264.5,747.4453,268.5,757.4453,272.5,747.4453,268.5,751.4453" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[f3eca93feb47d649ea4455468984c776]
@startuml
!pragma layout smetana
start
note right
ConfigDefconfig()
end note
:return CONFIG_DEF;;
stop
end
start
note right
booleantest(Rrecord)
end note
:return record.topic()!=null &&pattern.matcher(record.topic()).matches();;
stop
end
start
note right
void close()
end note
end
start
note right
void configure(Map<String,? >configs)
end note
:result=Pattern.compile(value);
:throw new ConfigException(PATTERN_CONFIG,
value,"entry must be a Java-compatible regular expression: "+e.getMessage());;
:this.pattern=result;
end
start
note right
StringtoString()
end note
:return "TopicNameMatches{"+"pattern="+pattern+'}';;
stop
end
@enduml

