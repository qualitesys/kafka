@startuml
!pragma layout smetana
start
note right
ConfigDef config()
end note
:return CONFIG_DEF;;
stop
end
start
note right
boolean test(R record)
end note
:return record.topic()!=null &&pattern.matcher(record.topic())
.matches();;
stop
end
start
note right
void close()
end note
end
start
note right
void configure(Map<String,?> configs)
end note
:SimpleConfig simpleConfig=new SimpleConfig(config(),
configs);;
:Pattern result;;
:String value=simpleConfig.getString(PATTERN_CONFIG);;
switch (try/catch block)
case (try)
:result=Pattern.compile(value);;
case (catch (PatternSyntaxException e))
:throw new ConfigException(PATTERN_CONFIG,value,"entry must be a Java-compatible regular expression: "+
e.getMessage());;
stop
endswitch
:this.pattern=result;;
end
start
note right
String toString()
end note
:return "TopicNameMatches{"+"pattern="+pattern+
'}';;
stop
end
@enduml

