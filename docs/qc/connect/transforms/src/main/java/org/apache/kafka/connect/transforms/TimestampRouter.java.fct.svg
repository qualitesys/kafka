@startuml
!pragma layout smetana
start
note right
void configure(Map<String,? >props)
end note
:final SimpleConfigconfig=new SimpleConfig(CONFIG_DEF,
props);;
:topicFormat=config.getString(ConfigName.TOPIC_FORMAT);;
:final StringtimestampFormatStr=config.getString(ConfigName.TIMESTAMP_FORMAT);;
:timestampFormat=ThreadLocal.withInitial(()->{final SimpleDateFormatfmt=new SimpleDateFormat(timestampFormatStr);
:fmt.setTimeZone(TimeZone.getTimeZone("UTC"));
:return fmt;});;
end
start
note right
Rapply(Rrecord)
end note
:final Longtimestamp=record.timestamp();;
if (timestamp==null ) then (yes) 
:throw new DataException("Timestamp missing on record: "+
record);;
stop
endif 
:final StringformattedTimestamp=timestampFormat.get()
.format(new Date(timestamp));;
:final Stringreplace1=TOPIC.matcher(topicFormat)
.replaceAll(Matcher.quoteReplacement(record.topic()));;
:final StringupdatedTopic=TIMESTAMP.matcher(replace1)
.replaceAll(Matcher.quoteReplacement(formattedTimestamp));;
:return record.newRecord(updatedTopic,record.kafkaPartition(),
record.keySchema(),record.key(),record.valueSchema(),
record.value(),record.timestamp());;
stop
end
start
note right
void close()
end note
:timestampFormat.remove();;
end
start
note right
ConfigDefconfig()
end note
:return CONFIG_DEF;;
stop
end
@enduml

