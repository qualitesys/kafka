@startuml
!pragma layout smetana
start
note right
void configure(Map<String,? >props)
end note
:topicFormat=config.getString(ConfigName.TOPIC_FORMAT);
:timestampFormat=ThreadLocal.withInitial(()->{final SimpleDateFormatfmt=new SimpleDateFormat(timestampFormatStr);fmt.setTimeZone(TimeZone.getTimeZone("UTC"));return fmt;});
end
start
note right
Rapply(Rrecord)
end note
if (timestamp==null ) then (yes) 
:throw new DataException("Timestamp missing on record: "+record);;
endif 
:return record.newRecord(updatedTopic,record.kafkaPartition(),
record.keySchema(),record.key(),record.valueSchema(),
record.value(),record.timestamp());;
stop
end
start
note right
void close()
end note
:timestampFormat.remove();
end
start
note right
ConfigDefconfig()
end note
:return CONFIG_DEF;;
stop
end
@enduml

