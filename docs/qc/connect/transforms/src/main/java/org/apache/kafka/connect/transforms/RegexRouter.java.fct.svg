@startuml
!pragma layout smetana
start
note right
void configure(Map<String,? >props)
end note
end
start
note right
Rapply(Rrecord)
end note
if (matcher.matches()) then (yes) 
:return record.newRecord(topic,record.kafkaPartition(),
record.keySchema(),record.key(),record.valueSchema(),
record.value(),record.timestamp());;
stop
else (no)
endif 
:return record;;
stop
end
start
note right
void close()
end note
end
start
note right
ConfigDefconfig()
end note
:return CONFIG_DEF;;
stop
end
@enduml

