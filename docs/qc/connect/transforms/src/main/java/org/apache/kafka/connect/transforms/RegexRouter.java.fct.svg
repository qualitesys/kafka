@startuml
!pragma layout smetana
start
note right
void configure(Map<String,? >props)
end note
:final SimpleConfigconfig=new SimpleConfig(CONFIG_DEF,
props);;
:regex=Pattern.compile(config.getString(ConfigName.REGEX));;
:replacement=config.getString(ConfigName.REPLACEMENT);;
end
start
note right
Rapply(Rrecord)
end note
:final Matchermatcher=regex.matcher(record.topic());;
if (matcher.matches()) then (yes) 
:final Stringtopic=matcher.replaceFirst(replacement);;
:log.trace("Rerouting from topic '{}' to new topic '{}'",
record.topic(),topic);;
:return record.newRecord(topic,record.kafkaPartition(),
record.keySchema(),record.key(),record.valueSchema(),
record.value(),record.timestamp());;
stop
else (no)
:log.trace("Not rerouting topic '{}' as it does not match the configured regex",
record.topic());;
endif 
:return record;;
stop
end
start
note right
void close()
end note
end
start
note right
ConfigDefconfig()
end note
:return CONFIG_DEF;;
stop
end
@enduml

