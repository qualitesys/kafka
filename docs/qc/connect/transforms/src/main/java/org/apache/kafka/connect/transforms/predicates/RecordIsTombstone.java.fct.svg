@startuml
!pragma layout smetana
start
note right
ConfigDef config()
end note
:return CONFIG_DEF;;
stop
end
start
note right
boolean test(R record)
end note
:return record.value()==null ;;
stop
end
start
note right
void close()
end note
end
start
note right
void configure(Map<String,?> configs)
end note
end
start
note right
String toString()
end note
:return "RecordIsTombstone{}";;
stop
end
@enduml

