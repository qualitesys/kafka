@startuml
!pragma layout smetana
start
note right
void ensureValid(Stringname,Objectvalue)
end note
if (value==null ||((List)value).isEmpty()) then (yes) 
:throw new ConfigException(name,value,"Empty list");;
stop
endif 
end
start
note right
StringtoString()
end note
:return "non-empty list";;
stop
end
@enduml

