@startuml
!pragma layout smetana
start
note right
constructor SourceAndTarget(Stringsource,Stringtarget)
end note
:this.source=source;
:this.target=target;
end
start
note right
Stringsource()
end note
:return source;;
stop
end
start
note right
Stringtarget()
end note
:return target;;
stop
end
start
note right
StringtoString()
end note
:return source+"->"+target;;
stop
end
start
note right
inthashCode()
end note
:return toString().hashCode();;
stop
end
start
note right
booleanequals(Objectother)
end note
:return other!=null &&toString().equals(other.toString());;
stop
end
@enduml

