@startuml
!pragma layout smetana
start
note right
constructor RemoteClusterUtils()
end note
end
start
note right
intreplicationHops(Map<String,Object>properties,
StringupstreamClusterAlias)
end note
:try (MirrorClientclient=new MirrorClient(properties)){return client.replicationHops(upstreamClusterAlias);};
end
start
note right
Set<String>heartbeatTopics(Map<String,Object>properties)
end note
:try (MirrorClientclient=new MirrorClient(properties)){return client.heartbeatTopics();};
end
start
note right
Set<String>checkpointTopics(Map<String,Object>properties)
end note
:try (MirrorClientclient=new MirrorClient(properties)){return client.checkpointTopics();};
end
start
note right
Set<String>upstreamClusters(Map<String,Object>properties)
end note
:try (MirrorClientclient=new MirrorClient(properties)){return client.upstreamClusters();};
end
start
note right
Map<TopicPartition,OffsetAndMetadata>translateOffsets(Map<String,
Object>properties,StringremoteClusterAlias,
StringconsumerGroupId,Durationtimeout)
end note
:try (MirrorClientclient=new MirrorClient(properties)){return client.remoteConsumerOffsets(consumerGroupId,
remoteClusterAlias,timeout);};
end
@enduml

