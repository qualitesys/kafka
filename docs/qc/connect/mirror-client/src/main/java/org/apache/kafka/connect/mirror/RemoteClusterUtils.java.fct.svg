@startuml
!pragma layout smetana
start
note right
constructor RemoteClusterUtils()
end note
end
start
note right
intreplicationHops(Map<String,Object>properties,StringupstreamClusterAlias)
end note
:return client.replicationHops(upstreamClusterAlias);;
stop
end
start
note right
Set<String>heartbeatTopics(Map<String,Object>properties)
end note
:return client.heartbeatTopics();;
stop
end
start
note right
Set<String>checkpointTopics(Map<String,Object>properties)
end note
:return client.checkpointTopics();;
stop
end
start
note right
Set<String>upstreamClusters(Map<String,Object>properties)
end note
:return client.upstreamClusters();;
stop
end
start
note right
Map<TopicPartition,OffsetAndMetadata>translateOffsets(Map<String,Object>properties,StringremoteClusterAlias,StringconsumerGroupId,Durationtimeout)
end note
:return client.remoteConsumerOffsets(consumerGroupId,
remoteClusterAlias,timeout);;
stop
end
