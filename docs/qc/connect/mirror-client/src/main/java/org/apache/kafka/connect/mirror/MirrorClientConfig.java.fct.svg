@startuml
!pragma layout smetana
start
note right
constructor MirrorClientConfig(Map<? ,? >props)
end note
:super (CONFIG_DEF,props,true);
end
start
note right
ReplicationPolicyreplicationPolicy()
end note
:return getConfiguredInstance(REPLICATION_POLICY_CLASS,
ReplicationPolicy.class );;
stop
end
start
note right
Map<String,Object>adminConfig()
end note
:return clientConfig(ADMIN_CLIENT_PREFIX);;
stop
end
start
note right
Map<String,Object>consumerConfig()
end note
:return clientConfig(CONSUMER_CLIENT_PREFIX);;
stop
end
start
note right
Map<String,Object>producerConfig()
end note
:return clientConfig(PRODUCER_CLIENT_PREFIX);;
stop
end
start
note right
Map<String,Object>clientConfig(Stringprefix)
end note
:props.putAll(valuesWithPrefixOverride(prefix));
:props.keySet().retainAll(CLIENT_CONFIG_DEF.names());
:props.entrySet().removeIf(x->x.getValue()==null );
:return props;;
stop
end
@enduml

