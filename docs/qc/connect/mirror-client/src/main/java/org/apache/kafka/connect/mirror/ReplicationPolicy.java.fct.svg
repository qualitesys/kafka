.6489,265,629.6489,269,619.6489,265,623.6489" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="265" x2="265" y1="695.6177" y2="715.6177"/><polygon fill="#181818" points="261,705.6177,265,715.6177,269,705.6177,265,709.6177" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[14ee44a5705ecf1c1a35c3be5f490091]
@startuml
!pragma layout smetana
if (upstream==null ||upstream.equals(topic)) then (yes) 
:return topic;;
stop
else (no)
:return originalTopic(upstream);;
stop
endif 
:return "heartbeats";;
stop
:return "mm2-offset-syncs."+clusterAlias+
".internal";;
stop
:return clusterAlias+".checkpoints.internal";;
stop
:return heartbeatsTopic().equals(originalTopic(topic));;
stop
:return topic.endsWith(".checkpoints.internal");;
stop
:return topic.endsWith(".internal");;
stop
:return isMM2InternalTopic(topic)||isKafkaInternalTopic||isDefaultConnectTopic;;
stop
@enduml

