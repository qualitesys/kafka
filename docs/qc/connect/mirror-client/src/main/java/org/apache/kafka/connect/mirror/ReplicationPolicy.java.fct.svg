@startuml
!pragma layout smetana
:Stringupstream=upstreamTopic(topic);;
if (upstream==null ||upstream.equals(topic)) then (yes) 
:return topic;;
stop
else (no)
:return originalTopic(upstream);;
stop
endif 
:return "heartbeats";;
stop
:return "mm2-offset-syncs."+clusterAlias+
".internal";;
stop
:return clusterAlias+".checkpoints.internal";;
stop
:return heartbeatsTopic().equals(originalTopic(topic));;
stop
:return topic.endsWith(".checkpoints.internal");;
stop
:return topic.endsWith(".internal");;
stop
:booleanisKafkaInternalTopic=topic.startsWith("__")||topic.startsWith(".");;
:booleanisDefaultConnectTopic=topic.endsWith("-internal")||topic.endsWith(".internal");;
:return isMM2InternalTopic(topic)||isKafkaInternalTopic||isDefaultConnectTopic;;
stop
@enduml

