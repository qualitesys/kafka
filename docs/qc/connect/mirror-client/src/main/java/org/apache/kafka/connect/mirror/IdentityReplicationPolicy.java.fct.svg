@startuml
!pragma layout smetana
start
note right
void configure(Map<String,? >props)
end note
:super .configure(props);
if (props.containsKey(SOURCE_CLUSTER_ALIAS_CONFIG)) then (yes) 
:sourceClusterAlias=(String)props.get(SOURCE_CLUSTER_ALIAS_CONFIG);
:log.info("Using source cluster alias `{}`.",sourceClusterAlias);
endif 
end
start
note right
StringformatRemoteTopic(StringsourceClusterAlias,Stringtopic)
end note
if (looksLikeHeartbeat(topic)) then (yes) 
:return super .formatRemoteTopic(sourceClusterAlias,topic);;
stop
