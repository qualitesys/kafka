@startuml
!pragma layout smetana
start
note right
void configure(Map<String,? >props)
end note
if (props.containsKey(SOURCE_CLUSTER_ALIAS_CONFIG)) then (yes) 
endif 
end
start
note right
StringformatRemoteTopic(StringsourceClusterAlias,
Stringtopic)
end note
if (looksLikeHeartbeat(topic)) then (yes) 
:return super .formatRemoteTopic(sourceClusterAlias,
topic);;
stop
else (no)
:return topic;;
stop
endif 
end
start
note right
StringtopicSource(Stringtopic)
end note
if (looksLikeHeartbeat(topic)) then (yes) 
:return super .topicSource(topic);;
stop
else (no)
:return sourceClusterAlias;;
stop
endif 
end
start
note right
StringupstreamTopic(Stringtopic)
end note
if (looksLikeHeartbeat(topic)) then (yes) 
:return super .upstreamTopic(topic);;
stop
else (no)
:return topic;;
stop
endif 
end
start
note right
booleanlooksLikeHeartbeat(Stringtopic)
end note
:return topic!=null &&topic.endsWith(heartbeatsTopic());;
stop
end
@enduml

