@startuml
!pragma layout smetana
start
note right
constructor MirrorClient(Map<String,Object>props)
end note
:this(new MirrorClientConfig(props));
end
start
note right
constructor MirrorClient(MirrorClientConfigconfig)
end note
:adminClient=AdminClient.create(config.adminConfig());
:consumerConfig=config.consumerConfig();
:replicationPolicy=config.replicationPolicy();
end
start
note right
constructor MirrorClient(AdminClientadminClient,
ReplicationPolicyreplicationPolicy,Map<String,
Object>consumerConfig)
end note
:this.adminClient=adminClient;
:this.replicationPolicy=replicationPolicy;
:this.consumerConfig=consumerConfig;
end
start
note right
void close()
end note
:adminClient.close();
end
start
note right
ReplicationPolicyreplicationPolicy()
end note
:return replicationPolicy;;
stop
end
start
note right
intreplicationHops(StringupstreamClusterAlias)
end note
:return heartbeatTopics().stream().map(x->countHopsForTopic(x,
upstreamClusterAlias)).filter(x->x!=-1).mapToInt(x->x).min().orElse(-1);;
stop
end
start
note right
Set<String>heartbeatTopics()
end note
:return listTopics().stream().filter(this::isHeartbeatTopic)
.collect(Collectors.toSet());;
stop
end
start
note right
Set<String>checkpointTopics()
end note
:return listTopics().stream().filter(this::isCheckpointTopic)
.collect(Collectors.toSet());;
stop
end
start
note right
Set<String>upstreamClusters()
end note
:return listTopics().stream().filter(this::isHeartbeatTopic)
.flatMap(x->allSources(x).stream()).collect(Collectors.toSet());;
stop
end
start
note right
Set<String>remoteTopics()
end note
:return listTopics().stream().filter(this::isRemoteTopic)
.collect(Collectors.toSet());;
stop
end
start
note right
Set<String>remoteTopics(Stringsource)
end note
:return listTopics().stream().filter(this::isRemoteTopic)
.filter(x->source.equals(replicationPolicy.topicSource(x))).collect(Collectors.toSet());;
stop
end
start
note right
Map<TopicPartition,OffsetAndMetadata>remoteConsumerOffsets(StringconsumerGroupId,
StringremoteClusterAlias,Durationtimeout)
end note
:consumer.assign(checkpointAssignment);
:consumer.seekToBeginning(checkpointAssignment);
while (System.currentTimeMillis()<deadline&&!endOfStream(consumer,
checkpointAssignment))
if (checkpoint.consumerGroupId().equals(consumerGroupId)) then (yes) 
:offsets.put(checkpoint.topicPartition(),
checkpoint.offsetAndMetadata());
endif 
:log.info("Could not deserialize record. Skipping.",e);
endwhile
:log.info("Consumed {} checkpoint records for {} from {}.",
offsets.size(),consumerGroupId,checkpointTopic);
:return offsets;;
stop
end
start
note right
Set<String>listTopics()
end note
:return adminClient.listTopics().names().get();;
stop
:throw new KafkaException(e.getCause());;
end
start
note right
intcountHopsForTopic(Stringtopic,StringsourceClusterAlias)
end note
while (true)
:hops++;
if (source==null ) then (yes) 
:return -1;;
stop
endif 
if (source.equals(sourceClusterAlias)) then (yes) 
:return hops;;
stop
endif 
if (visited.contains(source)) then (yes) 
:return -1;;
stop
endif 
:visited.add(source);
:topic=replicationPolicy.upstreamTopic(topic);
endwhile
end
start
note right
booleanisHeartbeatTopic(Stringtopic)
end note
:return replicationPolicy.isHeartbeatsTopic(topic);;
stop
end
start
note right
booleanisCheckpointTopic(Stringtopic)
end note
:return replicationPolicy.isCheckpointsTopic(topic);;
stop
end
start
note right
booleanisRemoteTopic(Stringtopic)
end note
:return !replicationPolicy.isInternalTopic(topic)&&replicationPolicy.topicSource(topic)!=null ;;
stop
end
start
note right
Set<String>allSources(Stringtopic)
end note
while (source!=null &&!sources.contains(source))
:sources.add(source);
:topic=replicationPolicy.upstreamTopic(topic);
:source=replicationPolicy.topicSource(topic);
endwhile
:return sources;;
stop
end
start
note right
booleanendOfStream(Consumer<? ,? >consumer,
Collection<TopicPartition>assignments)
end note
if (consumer.position(topicPartition)<endOffsets.get(topicPartition)) then (yes) 
:return false;;
stop
endif 
:return true;;
stop
end
@enduml

