@startuml
!pragma layout smetana
start
note right
constructor MirrorClient(Map<String,Object> props)
end note
:this(new MirrorClientConfig(props));;
end
start
note right
constructor MirrorClient(MirrorClientConfig config)
end note
:adminClient=AdminClient.create(config.adminConfig());;
:consumerConfig=config.consumerConfig();;
:replicationPolicy=config.replicationPolicy();;
end
start
note right
constructor MirrorClient(AdminClient adminClient,
ReplicationPolicy replicationPolicy,Map<String,
Object> consumerConfig)
end note
:this.adminClient=adminClient;;
:this.replicationPolicy=replicationPolicy;;
:this.consumerConfig=consumerConfig;;
end
start
note right
void close()
end note
:adminClient.close();;
end
start
note right
ReplicationPolicy replicationPolicy()
end note
:return replicationPolicy;;
stop
end
start
note right
int replicationHops(String upstreamClusterAlias)
end note
:return heartbeatTopics().stream().map(x->countHopsForTopic(x,
upstreamClusterAlias)).filter(x->x!=-1).mapToInt(x->x).min().orElse(-1);;
stop
end
start
note right
Set<String> heartbeatTopics()
end note
:return listTopics().stream().filter(this::isHeartbeatTopic)
.collect(Collectors.toSet());;
stop
end
start
note right
Set<String> checkpointTopics()
end note
:return listTopics().stream().filter(this::isCheckpointTopic)
.collect(Collectors.toSet());;
stop
end
start
note right
Set<String> upstreamClusters()
end note
:return listTopics().stream().filter(this::isHeartbeatTopic)
.flatMap(x->allSources(x).stream()).collect(Collectors.toSet());;
stop
end
start
note right
Set<String> remoteTopics()
end note
:return listTopics().stream().filter(this::isRemoteTopic)
.collect(Collectors.toSet());;
stop
end
start
note right
Set<String> remoteTopics(String source)
end note
:return listTopics().stream().filter(this::isRemoteTopic)
.filter(x->source.equals(replicationPolicy.topicSource(x))).collect(Collectors.toSet());;
stop
end
start
note right
Map<TopicPartition,OffsetAndMetadata> remoteConsumerOffsets(String consumerGroupId,
String remoteClusterAlias,Duration timeout)
end note
:long deadline=System.currentTimeMillis()+
timeout.toMillis();;
:Map<TopicPartition,OffsetAndMetadata> offsets=new HashMap<>();;
switch (try/catch block)
case (try)
:String checkpointTopic=replicationPolicy.checkpointsTopic(remoteClusterAlias);;
:List<TopicPartition> checkpointAssignment=Collections.singletonList(new TopicPartition(checkpointTopic,
0));;
:consumer.assign(checkpointAssignment);;
:consumer.seekToBeginning(checkpointAssignment);;
while (System.currentTimeMillis()<deadline&&!endOfStream(consumer,
checkpointAssignment))
:ConsumerRecords<byte[],byte[]> records=consumer.poll(timeout);;
switch (try/catch block)
case (try)
:Checkpoint checkpoint=Checkpoint.deserializeRecord(record);;
if (checkpoint.consumerGroupId().equals(consumerGroupId)) then (yes) 
:offsets.put(checkpoint.topicPartition(),
checkpoint.offsetAndMetadata());;
endif 
case (catch (SchemaException e))
:log.info("Could not deserialize record. Skipping.",e);;
endswitch
endwhile
:log.info("Consumed {} checkpoint records for {} from {}.",
offsets.size(),consumerGroupId,checkpointTopic);;
endswitch
:return offsets;;
stop
end
start
note right
Set<String> listTopics()
end note
switch (try/catch block)
case (try)
:return adminClient.listTopics().names().get();;
stop
case (catch (ExecutionException e))
:throw new KafkaException(e.getCause());;
stop
endswitch
end
start
note right
int countHopsForTopic(String topic,String sourceClusterAlias)
end note
:int hops=0;;
:Set<String> visited=new HashSet<>();;
while (true)
:hops++;;
:String source=replicationPolicy.topicSource(topic);;
if (source==null ) then (yes) 
:return -1;;
stop
endif 
if (source.equals(sourceClusterAlias)) then (yes) 
:return hops;;
stop
endif 
if (visited.contains(source)) then (yes) 
:return -1;;
stop
endif 
:visited.add(source);;
:topic=replicationPolicy.upstreamTopic(topic);;
endwhile
end
start
note right
boolean isHeartbeatTopic(String topic)
end note
:return replicationPolicy.isHeartbeatsTopic(topic);;
stop
end
start
note right
boolean isCheckpointTopic(String topic)
end note
:return replicationPolicy.isCheckpointsTopic(topic);;
stop
end
start
note right
boolean isRemoteTopic(String topic)
end note
:return !replicationPolicy.isInternalTopic(topic)&&replicationPolicy.topicSource(topic)!=null ;;
stop
end
start
note right
Set<String> allSources(String topic)
end note
:Set<String> sources=new HashSet<>();;
:String source=replicationPolicy.topicSource(topic);;
while (source!=null &&!sources.contains(source))
:sources.add(source);;
:topic=replicationPolicy.upstreamTopic(topic);;
:source=replicationPolicy.topicSource(topic);;
endwhile
:return sources;;
stop
end
start
note right
boolean endOfStream(Consumer<?,?> consumer,
Collection<TopicPartition> assignments)
end note
:Map<TopicPartition,Long> endOffsets=consumer.endOffsets(assignments);;
if (consumer.position(topicPartition)<endOffsets.get(topicPartition)) then (yes) 
:return false;;
stop
endif 
:return true;;
stop
end
@enduml

