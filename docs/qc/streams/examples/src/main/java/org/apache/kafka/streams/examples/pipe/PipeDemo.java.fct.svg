@startuml
!pragma layout smetana
start
note right
void main(final String[]args)
end note
:final Propertiesprops=new Properties();;
:props.put(StreamsConfig.APPLICATION_ID_CONFIG,
"streams-pipe");;
:props.put(StreamsConfig.BOOTSTRAP_SERVERS_CONFIG,
"localhost:9092");;
:props.put(StreamsConfig.DEFAULT_KEY_SERDE_CLASS_CONFIG,
Serdes.String().getClass());;
:props.put(StreamsConfig.DEFAULT_VALUE_SERDE_CLASS_CONFIG,
Serdes.String().getClass());;
:props.put(ConsumerConfig.AUTO_OFFSET_RESET_CONFIG,
"earliest");;
:final StreamsBuilderbuilder=new StreamsBuilder();;
:builder.stream("streams-plaintext-input")
.to("streams-pipe-output");;
:final KafkaStreamsstreams=new KafkaStreams(builder.build(),
props);;
:final CountDownLatchlatch=new CountDownLatch(1);;
:Runtime.getRuntime().addShutdownHook(new Thread("streams-pipe-shutdown-hook"){@Override public void run(){streams.close();
:latch.countDown();}});;
switch (try/catch block)
case (try)
:streams.start();;
:latch.await();;
case (catch (final Throwablee))
:System.exit(1);;
endswitch
:System.exit(0);;
end
@enduml

