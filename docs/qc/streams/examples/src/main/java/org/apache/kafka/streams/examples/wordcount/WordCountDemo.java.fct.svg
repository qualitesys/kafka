@startuml
!pragma layout smetana
start
note right
PropertiesgetStreamsConfig(final String[]args)
end note
if (args!=null &&args.length>0) then (yes) 
:props.load(fis);
if (args.length>1) then (yes) 
:System.out.println("Warning: Some command line arguments were ignored. This demo only accepts an optional configuration file.");
endif 
endif 
:props.putIfAbsent(StreamsConfig.APPLICATION_ID_CONFIG,"streams-wordcount");
:props.putIfAbsent(StreamsConfig.BOOTSTRAP_SERVERS_CONFIG,"localhost:9092");
:props.putIfAbsent(StreamsConfig.CACHE_MAX_BYTES_BUFFERING_CONFIG,0);
:props.putIfAbsent(StreamsConfig.DEFAULT_KEY_SERDE_CLASS_CONFIG,Serdes.String().getClass().getName());
:props.putIfAbsent(StreamsConfig.DEFAULT_VALUE_SERDE_CLASS_CONFIG,Serdes.String().getClass().getName());
:props.putIfAbsent(ConsumerConfig.AUTO_OFFSET_RESET_CONFIG,"earliest");
:return props;;
stop
end
start
note right
void createWordCountStream(final StreamsBuilderbuilder)
end note
:counts.toStream().to(OUTPUT_TOPIC,Produced.with(Serdes.String(),Serdes.Long()));
end
start
note right
void main(final String[]args)
end note
:createWordCountStream(builder);
:Runtime.getRuntime().addShutdownHook(new Thread("streams-wordcount-shutdown-hook"){@Override public void run(){streams.close();latch.countDown();}});
:streams.start();
:latch.await();
:System.exit(1);
:System.exit(0);
end
@enduml

