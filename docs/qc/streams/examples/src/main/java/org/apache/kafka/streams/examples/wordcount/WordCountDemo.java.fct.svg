<line style="stroke:#181818;stroke-width:1.0;" x1="524" x2="524" y1="1241.5781" y2="1261.5781"/><polygon fill="#181818" points="520,1251.5781,524,1261.5781,528,1251.5781,524,1255.5781" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="524" x2="524" y1="1295.5469" y2="1315.5469"/><polygon fill="#181818" points="520,1305.5469,524,1315.5469,528,1305.5469,524,1309.5469" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="524" x2="524" y1="1349.5156" y2="1369.5156"/><polygon fill="#181818" points="520,1359.5156,524,1369.5156,528,1359.5156,524,1363.5156" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[59b234a8784858bcd35c85ef7f81eb13]
@startuml
!pragma layout smetana
start
note right
PropertiesgetStreamsConfig(final String[]args)
end note
if (args!=null &&args.length>0) then (yes) 
:props.load(fis);
if (args.length>1) then (yes) 
:System.out.println("Warning: Some command line arguments were ignored. This demo only accepts an optional configuration file.");
endif 
endif 
:props.putIfAbsent(StreamsConfig.APPLICATION_ID_CONFIG,
"streams-wordcount");
:props.putIfAbsent(StreamsConfig.BOOTSTRAP_SERVERS_CONFIG,
"localhost:9092");
:props.putIfAbsent(StreamsConfig.CACHE_MAX_BYTES_BUFFERING_CONFIG,0);
:props.putIfAbsent(StreamsConfig.DEFAULT_KEY_SERDE_CLASS_CONFIG,
Serdes.String().getClass().getName());
:props.putIfAbsent(StreamsConfig.DEFAULT_VALUE_SERDE_CLASS_CONFIG,
Serdes.String().getClass().getName());
:props.putIfAbsent(ConsumerConfig.AUTO_OFFSET_RESET_CONFIG,
"earliest");
:return props;;
stop
end
start
note right
void createWordCountStream(final StreamsBuilderbuilder)
end note
:counts.toStream().to(OUTPUT_TOPIC,Produced.with(Serdes.String(),
Serdes.Long()));
end
start
note right
void main(final String[]args)
end note
:createWordCountStream(builder);
:Runtime.getRuntime().addShutdownHook(new Thread("streams-wordcount-shutdown-hook"){@Override public void run(){streams.close();latch.countDown();}});
:streams.start();
:latch.await();
:System.exit(1);
:System.exit(0);
end
@enduml

