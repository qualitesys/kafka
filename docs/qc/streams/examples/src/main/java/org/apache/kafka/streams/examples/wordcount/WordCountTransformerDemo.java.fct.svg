@startuml
!pragma layout smetana
start
note right
Processor<String,String,String,String>get()
end note
:return new Processor<String,String,String,
String>(){private KeyValueStore<String,Integer>kvStore;@Override public void init(final ProcessorContext<String,
String>context){context.schedule(Duration.ofSeconds(1),
PunctuationType.STREAM_TIME,timestamp->{try (final KeyValueIterator<String,
Integer>iter=kvStore.all()){System.out.println("- - - - - - - - - - - "+
timestamp+" - - - - - - - - - - - ");while (iter.hasNext()){final KeyValue<String,
Integer>entry=iter.next();System.out.println("["+
entry.key+", "+entry.value+"]");context.forward(new Record<>(entry.key,
entry.value.toString(),timestamp));}}});this.kvStore=context.getStateStore("Counts");}@Override public void process(final Record<String,String>record){final String[]words=record.value().toLowerCase(Locale.getDefault()).split("\\W+");for (final Stringword:words){final IntegeroldValue=this.kvStore.get(word);if (oldValue==null ){this.kvStore.put(word,1);}else {this.kvStore.put(word,oldValue+1);}}}@Override public void close(){}};;
stop
end
start
note right
Set<StoreBuilder<? >>stores()
end note
:return Collections.singleton(Stores.keyValueStoreBuilder(Stores.inMemoryKeyValueStore("Counts"),
