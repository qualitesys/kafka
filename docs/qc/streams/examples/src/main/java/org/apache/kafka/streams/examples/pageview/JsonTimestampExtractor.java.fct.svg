@startuml
!pragma layout smetana
start
note right
longextract(final ConsumerRecord<Object,Object>record,final longpartitionTime)
end note
if (record.value() instanceof PageViewTypedDemo.PageView) then (yes) 
:return ((PageViewTypedDemo.PageView)record.value()).timestamp;;
stop
endif 
if (record.value() instanceof PageViewTypedDemo.UserProfile) then (yes) 
:return ((PageViewTypedDemo.UserProfile)record.value()).timestamp;;
stop
endif 
if (record.value() instanceof JsonNode) then (yes) 
:return ((JsonNode)record.value()).get("timestamp").longValue();;
stop
endif 
end
@enduml

