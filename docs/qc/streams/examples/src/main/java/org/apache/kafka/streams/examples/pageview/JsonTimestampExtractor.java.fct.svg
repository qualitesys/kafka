0;" x1="602.5" x2="382" y1="574.9258" y2="574.9258"/><line style="stroke:#181818;stroke-width:1.0;" x1="382" x2="382" y1="574.9258" y2="594.9258"/><polygon fill="#181818" points="378,584.9258,382,594.9258,386,584.9258,382,588.9258" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="382" x2="382" y1="628.8945" y2="648.8945"/><polygon fill="#181818" points="378,638.8945,382,648.8945,386,638.8945,382,642.8945" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[ffa2d9efd4b8dc1f63c8ceab779066f0]
@startuml
!pragma layout smetana
start
note right
longextract(final ConsumerRecord<Object,Object>record,
final longpartitionTime)
end note
if (record.value() instanceof PageViewTypedDemo.PageView) then (yes) 
:return ((PageViewTypedDemo.PageView)record.value()).timestamp;;
stop
endif 
if (record.value() instanceof PageViewTypedDemo.UserProfile) then (yes) 
:return ((PageViewTypedDemo.UserProfile)record.value()).timestamp;;
stop
endif 
if (record.value() instanceof JsonNode) then (yes) 
:return ((JsonNode)record.value()).get("timestamp").longValue();;
stop
endif 
:throw new IllegalArgumentException("JsonTimestampExtractor cannot recognize the record value "+record.value());;
end
@enduml

