.5,516.7461,566.5,506.7461,562.5,510.7461" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="562.5" x2="562.5" y1="430.875" y2="580.7461"/><line style="stroke:#181818;stroke-width:1.0;" x1="562.5" x2="382" y1="580.7461" y2="580.7461"/><line style="stroke:#181818;stroke-width:1.0;" x1="382" x2="382" y1="580.7461" y2="600.7461"/><polygon fill="#181818" points="378,590.7461,382,600.7461,386,590.7461,382,594.7461" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="382" x2="382" y1="634.7148" y2="654.7148"/><polygon fill="#181818" points="378,644.7148,382,654.7148,386,644.7148,382,648.7148" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[bf644469439683a6b2f16b58a5ce9f3f]
@startuml
!pragma layout smetana
start
note right
longextract(final ConsumerRecord<Object,Object>record,final longpartitionTime)
end note
if (record.value() instanceof PageViewTypedDemo.PageView) then (yes) 
:return ((PageViewTypedDemo.PageView)record.value())
.timestamp;;
stop
endif 
if (record.value() instanceof PageViewTypedDemo.UserProfile) then (yes) 
:return ((PageViewTypedDemo.UserProfile)record.value())
.timestamp;;
stop
endif 
if (record.value() instanceof JsonNode) then (yes) 
:return ((JsonNode)record.value()).get("timestamp")
.longValue();;
stop
endif 
:throw new IllegalArgumentException("JsonTimestampExtractor cannot recognize the record value "+record.value());;
end
@enduml

