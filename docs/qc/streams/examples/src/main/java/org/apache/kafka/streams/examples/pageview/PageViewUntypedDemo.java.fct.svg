@startuml
!pragma layout smetana
start
note right
void main(final String[]args)
end note
:props.put(StreamsConfig.APPLICATION_ID_CONFIG,"streams-pageview-untyped");
:props.put(StreamsConfig.BOOTSTRAP_SERVERS_CONFIG,"localhost:9092");
:props.put(StreamsConfig.DEFAULT_TIMESTAMP_EXTRACTOR_CLASS_CONFIG,JsonTimestampExtractor.class );
:props.put(StreamsConfig.CACHE_MAX_BYTES_BUFFERING_CONFIG,0);
:props.put(ConsumerConfig.AUTO_OFFSET_RESET_CONFIG,"earliest");
:return (JsonNode)jNode.put("user",view.get("user").textValue()).put("page",view.get("page").textValue()).put("region",region==null ? String.valueOf("UNKNOWN"):region);;
stop
:keyNode.put("window-start",key.window().start()).put("region",key.key());
:valueNode.put("count",value);
:return new KeyValue<>((JsonNode)keyNode,(JsonNode)valueNode);;
stop
:regionCount.to("streams-pageviewstats-untyped-output",Produced.with(jsonSerde,jsonSerde));
:streams.start();
:Thread.sleep(5000L);
:streams.close();
end
@enduml

