@startuml
!pragma layout smetana
start
note right
void main(final String[] args)
end note
:final Properties props=new Properties();;
:props.put(StreamsConfig.APPLICATION_ID_CONFIG,
"streams-pageview-untyped");;
:props.put(StreamsConfig.BOOTSTRAP_SERVERS_CONFIG,
"localhost:9092");;
:props.put(StreamsConfig.DEFAULT_TIMESTAMP_EXTRACTOR_CLASS_CONFIG,
JsonTimestampExtractor.class );;
:props.put(StreamsConfig.CACHE_MAX_BYTES_BUFFERING_CONFIG,0);;
:props.put(ConsumerConfig.AUTO_OFFSET_RESET_CONFIG,
"earliest");;
:final StreamsBuilder builder=new StreamsBuilder();;
:final Serializer<JsonNode> jsonSerializer=new JsonSerializer();;
:final Deserializer<JsonNode> jsonDeserializer=new JsonDeserializer();;
:final Serde<JsonNode> jsonSerde=Serdes.serdeFrom(jsonSerializer,
jsonDeserializer);;
:final Consumed<String,JsonNode> consumed=Consumed.with(Serdes.String(),
jsonSerde);;
:final KStream<String,JsonNode> views=builder.stream("streams-pageview-input",
consumed);;
:final KTable<String,JsonNode> users=builder.table("streams-userprofile-input",
consumed);;
:final KTable<String,String> userRegions=users.mapValues(record->record.get("region")
.textValue());;
:final Duration duration24Hours=Duration.ofHours(24);;
:final KStream<JsonNode,JsonNode> regionCount=views.leftJoin(userRegions,
(view,region)->{final ObjectNode jNode=JsonNodeFactory.instance.objectNode();return (JsonNode )jNode.put("user",
view.get("user").textValue()).put("page",
view.get("page").textValue()).put("region",
region==null ? String.valueOf("UNKNOWN"):region);}).map((user,
viewRegion)->new KeyValue<>(viewRegion.get("region").textValue(),
viewRegion)).groupByKey(Grouped.with(Serdes.String(),
jsonSerde)).windowedBy(TimeWindows.ofSizeAndGrace(Duration.ofDays(7),
duration24Hours).advanceBy(Duration.ofSeconds(1))).count().toStream().map((key,
value)->{final ObjectNode keyNode=JsonNodeFactory.instance.objectNode();keyNode.put("window-start",
key.window().start()).put("region",key.key());final ObjectNode valueNode=JsonNodeFactory.instance.objectNode();valueNode.put("count",
value);return new KeyValue<>((JsonNode )keyNode,
(JsonNode )valueNode);});;
:regionCount.to("streams-pageviewstats-untyped-output",
Produced.with(jsonSerde,jsonSerde));;
:final KafkaStreams streams=new KafkaStreams(builder.build(),
props);;
:streams.start();;
:Thread.sleep(5000L);;
:streams.close();;
end
@enduml

