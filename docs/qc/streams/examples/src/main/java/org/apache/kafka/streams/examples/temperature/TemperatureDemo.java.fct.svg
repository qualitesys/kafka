@startuml
!pragma layout smetana
start
note right
void main(final String[]args)
end note
:props.put(StreamsConfig.APPLICATION_ID_CONFIG,"streams-temperature");
:props.put(StreamsConfig.BOOTSTRAP_SERVERS_CONFIG,"localhost:9092");
:props.put(StreamsConfig.DEFAULT_KEY_SERDE_CLASS_CONFIG,Serdes.String().getClass());
:props.put(StreamsConfig.DEFAULT_VALUE_SERDE_CLASS_CONFIG,Serdes.String().getClass());
:props.put(ConsumerConfig.AUTO_OFFSET_RESET_CONFIG,"earliest");
:props.put(StreamsConfig.CACHE_MAX_BYTES_BUFFERING_CONFIG,0);
if (Integer.parseInt(value1)>Integer.parseInt(value2)) then (yes) 
:return value1;;
stop
else (no)
:return value2;;
stop
endif 
:max.to("iot-temperature-max",Produced.with(windowedSerde,Serdes.String()));
:Runtime.getRuntime().addShutdownHook(new Thread("streams-temperature-shutdown-hook"){@Override public void run(){streams.close();latch.countDown();}});
:streams.start();
:latch.await();
:System.exit(1);
:System.exit(0);
end
@enduml

