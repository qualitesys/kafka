@startuml
!pragma layout smetana
start
note right
void main(final String[]args)
end note
:final Propertiesprops=new Properties();;
:props.put(StreamsConfig.APPLICATION_ID_CONFIG,
"streams-temperature");;
:props.put(StreamsConfig.BOOTSTRAP_SERVERS_CONFIG,
"localhost:9092");;
:props.put(StreamsConfig.DEFAULT_KEY_SERDE_CLASS_CONFIG,
Serdes.String().getClass());;
:props.put(StreamsConfig.DEFAULT_VALUE_SERDE_CLASS_CONFIG,
Serdes.String().getClass());;
:props.put(ConsumerConfig.AUTO_OFFSET_RESET_CONFIG,
"earliest");;
:props.put(StreamsConfig.CACHE_MAX_BYTES_BUFFERING_CONFIG,0);;
:final Durationduration24Hours=Duration.ofHours(24);;
:final StreamsBuilderbuilder=new StreamsBuilder();;
:final KStream<String,String>source=builder.stream("iot-temperature");;
:final KStream<Windowed<String>,String>max=source.selectKey((key,
value)->"temp").groupByKey().windowedBy(TimeWindows.ofSizeAndGrace(Duration.ofSeconds(TEMPERATURE_WINDOW_SIZE),
duration24Hours)).reduce((value1,value2)->{if (Integer.parseInt(value1)>Integer.parseInt(value2)){return value1;}else {return value2;}}).toStream().filter((key,
value)->Integer.parseInt(value)>TEMPERATURE_THRESHOLD);;
:final Serde<Windowed<String>>windowedSerde=WindowedSerdes.timeWindowedSerdeFrom(String.class ,
TEMPERATURE_WINDOW_SIZE);;
:max.to("iot-temperature-max",Produced.with(windowedSerde,
Serdes.String()));;
:final KafkaStreamsstreams=new KafkaStreams(builder.build(),
props);;
:final CountDownLatchlatch=new CountDownLatch(1);;
:Runtime.getRuntime().addShutdownHook(new Thread("streams-temperature-shutdown-hook"){@Override public void run(){streams.close();
:latch.countDown();}});;
switch (try/catch block)
case (try)
:streams.start();;
:latch.await();;
case (catch (final Throwablee))
:System.exit(1);;
endswitch
:System.exit(0);;
end
@enduml

