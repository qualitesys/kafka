nal StringmetricsScope)</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="71" x="5" y="176.3438">end note</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="231" x="5" y="192.6406">:super (name,metricsScope);</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="30" x="5" y="208.9375">end</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="37" x="5" y="225.2344">start</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="78" x="5" y="241.5313">note right</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="454" x="5" y="257.8281">constructor RocksDBTimestampedStore(final Stringname,</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="539" x="5" y="274.125">final StringparentDir,final RocksDBMetricsRecordermetricsRecorder)</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="71" x="5" y="290.4219">end note</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="334" x="5" y="306.7188">:super (name,parentDir,metricsRecorder);</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="30" x="5" y="323.0156">end</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="37" x="5" y="339.3125">start</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="78" x="5" y="355.6094">note right</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="358" x="5" y="371.9063">void openRocksDB(final DBOptionsdbOptions,</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="380" x="5" y="388.2031">final ColumnFamilyOptionscolumnFamilyOptions)</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="71" x="5" y="404.5">end note</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="438" x="5" y="420.7969">:db=RocksDB.open(dbOptions,dbDir.getAbsolutePath(),</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="335" x="5" y="437.0938">columnFamilyDescriptors,columnFamilies);</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="495" x="5" y="453.3906">:setDbAccessor(columnFamilies.get(0),columnFamilies.get(1));</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="555" x="5" y="469.6875">if (String.valueOf("Column family not found: keyValueWithTimestamp")</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" text-decoration="wavy underline" textLength="284" x="5" y="485.9844">.equals(e.getMessage())) then (yes)</text><text fill="#FF0000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="106" x="10" y="502.2813">Syntax Error?</text><!--MD5=[8bc5e2adc8f04b74c70fca159341075f]
@startuml
!pragma layout smetana
start
note right
constructor RocksDBTimestampedStore(final Stringname,
final StringmetricsScope)
end note
:super (name,metricsScope);
end
start
note right
constructor RocksDBTimestampedStore(final Stringname,
final StringparentDir,final RocksDBMetricsRecordermetricsRecorder)
end note
:super (name,parentDir,metricsRecorder);
end
start
note right
void openRocksDB(final DBOptionsdbOptions,
final ColumnFamilyOptionscolumnFamilyOptions)
end note
:db=RocksDB.open(dbOptions,dbDir.getAbsolutePath(),
columnFamilyDescriptors,columnFamilies);
:setDbAccessor(columnFamilies.get(0),columnFamilies.get(1));
if (String.valueOf("Column family not found: keyValueWithTimestamp")
.equals(e.getMessage())) then (yes) 
:db=RocksDB.open(dbOptions,dbDir.getAbsolutePath(),
columnFamilyDescriptors.subList(0,1),columnFamilies);
:columnFamilies.add(db.createColumnFamily(columnFamilyDescriptors.get(1)));
:throw new ProcessorStateException("Error opening store "+
name+" at location "+dbDir.toString(),fatal);;
:setDbAccessor(columnFamilies.get(0),columnFamilies.get(1));
else (no)
:throw new ProcessorStateException("Error opening store "+
name+" at location "+dbDir.toString(),e);;
endif 
end
start
note right
void setDbAccessor(final ColumnFamilyHandlenoTimestampColumnFamily,
final ColumnFamilyHandlewithTimestampColumnFamily)
end note
:noTimestampsIter.seekToFirst();
if (noTimestampsIter.isValid()) then (yes) 
:log.info("Opening store {} in upgrade mode",
name);
:dbAccessor=new DualColumnFamilyAccessor(noTimestampColumnFamily,
withTimestampColumnFamily);
else (no)
:log.info("Opening store {} in regular mode",
name);
:dbAccessor=new SingleColumnFamilyAccessor(withTimestampColumnFamily);
:noTimestampColumnFamily.close();
endif 
:noTimestampsIter.close();
end
start
note right
constructor DualColumnFamilyAccessor(final ColumnFamilyHandleoldColumnFamily,
final ColumnFamilyHandlenewColumnFamily)
end note
:this.oldColumnFamily=oldColumnFamily;
:this.newColumnFamily=newColumnFamily;
end
start
note right
void put(final byte[]key,final byte[]valueWithTimestamp)
end note
if (valueWithTimestamp==null ) then (yes) 
:db.delete(oldColumnFamily,wOptions,key);
:throw new ProcessorStateException("Error while removing key from store "+
name,e);;
:db.delete(newColumnFamily,wOptions,key);
:throw new ProcessorStateException("Error while removing key from store "+
name,e);;
else (no)
:db.delete(oldColumnFamily,wOptions,key);
:throw new ProcessorStateException("Error while removing key from store "+
name,e);;
:db.put(newColumnFamily,wOptions,key,valueWithTimestamp);
:StoreQueryUtils.updatePosition(position,
context);
:throw new ProcessorStateException("Error while putting key/value into store "+
name,e);;
endif 
end
start
note right
void prepareBatch(final List<KeyValue<Bytes,
byte[]>>entries,final WriteBatchbatch)
end note
:Objects.requireNonNull(entry.key,"key cannot be null");
:addToBatch(entry.key.get(),entry.value,batch);
end
start
note right
byte[]get(final byte[]key)
end note
if (valueWithTimestamp!=null ) then (yes) 
:return valueWithTimestamp;;
stop
endif 
if (plainValue!=null ) then (yes) 
:put(key,valueWithUnknownTimestamp);
:return valueWithUnknownTimestamp;;
stop
endif 
:return null ;;
stop
end
start
note right
byte[]getOnly(final byte[]key)
end note
if (valueWithTimestamp!=null ) then (yes) 
:return valueWithTimestamp;;
stop
endif 
if (plainValue!=null ) then (yes) 
:return convertToTimestampedFormat(plainValue);;
stop
endif 
:return null ;;
stop
end
start
note right
KeyValueIterator<Bytes,byte[]>range(final Bytesfrom,
final Bytesto,final booleanforward)
end note
:return new RocksDBDualCFRangeIterator(name,
db.newIterator(newColumnFamily),db.newIterator(oldColumnFamily),
from,to,forward,true);;
stop
end
start
note right
void deleteRange(final byte[]from,final byte[]to)
end note
:db.deleteRange(oldColumnFamily,wOptions,
from,to);
:throw new ProcessorStateException("Error while removing key from store "+
name,e);;
:db.deleteRange(newColumnFamily,wOptions,
from,to);
:throw new ProcessorStateException("Error while removing key from store "+
name,e);;
end
start
note right
KeyValueIterator<Bytes,byte[]>all(final booleanforward)
end note
if (forward) then (yes) 
:innerIterWithTimestamp.seekToFirst();
:innerIterNoTimestamp.seekToFirst();
else (no)
:innerIterWithTimestamp.seekToLast();
:innerIterNoTimestamp.seekToLast();
endif 
:return new RocksDBDualCFIterator(name,innerIterWithTimestamp,
innerIterNoTimestamp,forward);;
stop
end
start
note right
KeyValueIterator<Bytes,byte[]>prefixScan(final Bytesprefix)
end note
:return new RocksDBDualCFRangeIterator(name,
db.newIterator(newColumnFamily),db.newIterator(oldColumnFamily),
prefix,to,true,false);;
stop
end
start
note right
longapproximateNumEntries()
end note
:return db.getLongProperty(oldColumnFamily,"rocksdb.estimate-num-keys")+
db.getLongProperty(newColumnFamily,"rocksdb.estimate-num-keys");;
stop
end
start
note right
void flush()
end note
:db.flush(fOptions,oldColumnFamily);
:db.flush(fOptions,newColumnFamily);
end
start
note right
void prepareBatchForRestore(final Collection<KeyValue<byte[],
byte[]>>records,final WriteBatchbatch)
end note
:addToBatch(record.key,record.value,batch);
end
start
note right
void addToBatch(final byte[]key,final byte[]value,
final WriteBatchbatch)
end note
if (value==null ) then (yes) 
:batch.delete(oldColumnFamily,key);
:batch.delete(newColumnFamily,key);
else (no)
:batch.delete(oldColumnFamily,key);
:batch.put(newColumnFamily,key,value);
endif 
end
start
note right
void close()
end note
:oldColumnFamily.close();
:newColumnFamily.close();
end
start
note right
constructor RocksDBDualCFIterator(final StringstoreName,
final RocksIteratoriterWithTimestamp,final RocksIteratoriterNoTimestamp,
final booleanforward)
end note
:this.iterWithTimestamp=iterWithTimestamp;
:this.iterNoTimestamp=iterNoTimestamp;
:this.storeName=storeName;
:this.forward=forward;
end
start
note right
booleanhasNext()
end note
if (!open) then (yes) 
:throw new InvalidStateStoreException(String.format("RocksDB iterator for store %s has closed",
storeName));;
endif 
:return super .hasNext();;
stop
end
start
note right
KeyValue<Bytes,byte[]>next()
end note
:return super .next();;
stop
end
start
note right
KeyValue<Bytes,byte[]>makeNext()
end note
if (nextNoTimestamp==null &&iterNoTimestamp.isValid()) then (yes) 
:nextNoTimestamp=iterNoTimestamp.key();
endif 
if (nextWithTimestamp==null &&iterWithTimestamp.isValid()) then (yes) 
:nextWithTimestamp=iterWithTimestamp.key();
endif 
if (nextNoTimestamp==null &&!iterNoTimestamp.isValid()) then (yes) 
if (nextWithTimestamp==null &&!iterWithTimestamp.isValid()) then (yes) 
:return allDone();;
stop
else (no)
:next=KeyValue.pair(new Bytes(nextWithTimestamp),
iterWithTimestamp.value());
:nextWithTimestamp=null ;
if (forward) then (yes) 
:iterWithTimestamp.next();
else (no)
:iterWithTimestamp.prev();
endif 
endif 
else (no)
if (nextWithTimestamp==null ) then (yes) 
:next=KeyValue.pair(new Bytes(nextNoTimestamp),
convertToTimestampedFormat(iterNoTimestamp.value()));
:nextNoTimestamp=null ;
if (forward) then (yes) 
:iterNoTimestamp.next();
else (no)
:iterNoTimestamp.prev();
endif 
else (no)
if (forward) then (yes) 
if (comparator.compare(nextNoTimestamp,nextWithTimestamp)<=0) then (yes) 
:next=KeyValue.pair(new Bytes(nextNoTimestamp),
convertToTimestampedFormat(iterNoTimestamp.value()));
:nextNoTimestamp=null ;
:iterNoTimestamp.next();
else (no)
:next=KeyValue.pair(new Bytes(nextWithTimestamp),
iterWithTimestamp.value());
:nextWithTimestamp=null ;
:iterWithTimestamp.next();
endif 
else (no)
if (comparator.compare(nextNoTimestamp,nextWithTimestamp)>=0) then (yes) 
:next=KeyValue.pair(new Bytes(nextNoTimestamp),
convertToTimestampedFormat(iterNoTimestamp.value()));
:nextNoTimestamp=null ;
:iterNoTimestamp.prev();
else (no)
:next=KeyValue.pair(new Bytes(nextWithTimestamp),
iterWithTimestamp.value());
:nextWithTimestamp=null ;
:iterWithTimestamp.prev();
endif 
endif 
endif 
endif 
:return next;;
stop
end
start
note right
void close()
end note
:openIterators.remove(this);
:iterNoTimestamp.close();
:iterWithTimestamp.close();
:open=false;
end
start
note right
BytespeekNextKey()
end note
if (!hasNext()) then (yes) 
:throw new NoSuchElementException();;
endif 
:return next.key;;
stop
end
start
note right
constructor RocksDBDualCFRangeIterator(final StringstoreName,
final RocksIteratoriterWithTimestamp,final RocksIteratoriterNoTimestamp,
final Bytesfrom,final Bytesto,final booleanforward,
final booleantoInclusive)
end note
:super (storeName,iterWithTimestamp,iterNoTimestamp,
forward);
:this.forward=forward;
:this.toInclusive=toInclusive;
if (forward) then (yes) 
if (from==null ) then (yes) 
:iterWithTimestamp.seekToFirst();
:iterNoTimestamp.seekToFirst();
else (no)
:iterWithTimestamp.seek(from.get());
:iterNoTimestamp.seek(from.get());
endif 
:rawLastKey=to==null ? null :to.get();
else (no)
if (to==null ) then (yes) 
:iterWithTimestamp.seekToLast();
:iterNoTimestamp.seekToLast();
else (no)
:iterWithTimestamp.seekForPrev(to.get());
:iterNoTimestamp.seekForPrev(to.get());
endif 
:rawLastKey=from==null ? null :from.get();
endif 
end
start
note right
KeyValue<Bytes,byte[]>makeNext()
end note
if (next==null ) then (yes) 
:return allDone();;
stop
else (no)
if (forward) then (yes) 
if (comparator.compare(next.key.get(),rawLastKey)<0) then (yes) 
:return next;;
stop
else (no)
:return allDone();;
stop
endif 
else (no)
if (comparator.compare(next.key.get(),rawLastKey)>=0) then (yes) 
:return next;;
stop
else (no)
:return allDone();;
stop
endif 
endif 
endif 
end
@enduml

