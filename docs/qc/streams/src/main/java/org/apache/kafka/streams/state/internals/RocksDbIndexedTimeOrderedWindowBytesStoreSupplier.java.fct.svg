@startuml
!pragma layout smetana
start
note right
RocksDbIndexedTimeOrderedWindowBytesStoreSuppliercreate(final Stringname,
final DurationretentionPeriod,final DurationwindowSize,
final booleanretainDuplicates,final booleanhasIndex)
end note
:Objects.requireNonNull(name,"name cannot be null");;
:final StringrpMsgPrefix=prepareMillisCheckFailMsgPrefix(retentionPeriod,
"retentionPeriod");;
:final longretentionMs=validateMillisecondDuration(retentionPeriod,
rpMsgPrefix);;
:final StringwsMsgPrefix=prepareMillisCheckFailMsgPrefix(windowSize,
"windowSize");;
:final longwindowSizeMs=validateMillisecondDuration(windowSize,
wsMsgPrefix);;
:final longdefaultSegmentInterval=Math.max(retentionMs/2,
60_000L);;
if (retentionMs<0L) then (yes) 
:throw new IllegalArgumentException("retentionPeriod cannot be negative");;
stop
endif 
if (windowSizeMs<0L) then (yes) 
:throw new IllegalArgumentException("windowSize cannot be negative");;
stop
endif 
if (defaultSegmentInterval<1L) then (yes) 
:throw new IllegalArgumentException("segmentInterval cannot be zero or negative");;
stop
endif 
if (windowSizeMs>retentionMs) then (yes) 
:throw new IllegalArgumentException("The retention period of the window store "+
name+" must be no smaller than its window size. Got size=["+
windowSizeMs+"], retention=["+retentionMs+
"]");;
stop
endif 
:return new RocksDbIndexedTimeOrderedWindowBytesStoreSupplier(name,
retentionMs,defaultSegmentInterval,windowSizeMs,
retainDuplicates,hasIndex);;
stop
end
start
note right
constructor RocksDbIndexedTimeOrderedWindowBytesStoreSupplier(final Stringname,
final longretentionPeriod,final longsegmentInterval,
final longwindowSize,final booleanretainDuplicates,
final booleanwithIndex)
end note
:this(name,retentionPeriod,segmentInterval,
windowSize,retainDuplicates,withIndex? WindowStoreTypes.INDEXED_WINDOW_STORE:WindowStoreTypes.DEFAULT_WINDOW_STORE);;
end
start
note right
constructor RocksDbIndexedTimeOrderedWindowBytesStoreSupplier(final Stringname,
final longretentionPeriod,final longsegmentInterval,
final longwindowSize,final booleanretainDuplicates,
final WindowStoreTypeswindowStoreType)
end note
:this.name=name;;
:this.retentionPeriod=retentionPeriod;;
:this.segmentInterval=segmentInterval;;
:this.windowSize=windowSize;;
:this.retainDuplicates=retainDuplicates;;
:this.windowStoreType=windowStoreType;;
end
start
note right
Stringname()
end note
:return name;;
stop
end
start
note right
WindowStore<Bytes,byte[]>get()
end note
switch (switch (windowStoreType))
endswith
end
start
note right
StringmetricsScope()
end note
:return "rocksdb-window";;
stop
end
start
note right
longsegmentIntervalMs()
end note
:return segmentInterval;;
stop
end
start
note right
longwindowSize()
end note
:return windowSize;;
stop
end
start
note right
booleanretainDuplicates()
end note
:return retainDuplicates;;
stop
end
start
note right
longretentionPeriod()
end note
:return retentionPeriod;;
stop
end
start
note right
StringtoString()
end note
:return "RocksDbIndexedTimeOrderedWindowBytesStoreSupplier{"+
"name='"+name+'\''+", retentionPeriod="+retentionPeriod+
", segmentInterval="+segmentInterval+", windowSize="+
windowSize+", retainDuplicates="+retainDuplicates+
", windowStoreType="+windowStoreType+'}';;
stop
end
@enduml

