@startuml
!pragma layout smetana
start
note right
constructor UnlimitedWindow(final long startMs)
end note
:super (startMs,Long.MAX_VALUE);;
end
start
note right
boolean overlap(final Window other)
end note
if (getClass()!=other.getClass()) then (yes) 
:throw new IllegalArgumentException("Cannot compare windows of different type. Other window has type "+
other.getClass()+".");;
stop
endif 
:return true;;
stop
end
@enduml

