@startuml
!pragma layout smetana
start
note right
constructor UnlimitedWindow(final longstartMs)
end note
:super (startMs,Long.MAX_VALUE);
end
start
note right
booleanoverlap(final Windowother)
end note
if (getClass()!=other.getClass()) then (yes) 
:throw new IllegalArgumentException("Cannot compare windows of different type. Other window has type "+other.getClass()+".");;
endif 
:return true;;
stop
end
@enduml

