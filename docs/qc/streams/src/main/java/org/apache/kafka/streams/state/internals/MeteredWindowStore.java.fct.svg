@startuml
!pragma layout smetana
start
note right
constructor MeteredWindowStore(final WindowStore<Bytes,
byte[]>inner,final longwindowSizeMs,final StringmetricsScope,
final Timetime,final Serde<K>keySerde,final Serde<V>valueSerde)
end note
:super (inner);
:this.windowSizeMs=windowSizeMs;
:this.metricsScope=metricsScope;
:this.time=time;
:this.keySerde=keySerde;
:this.valueSerde=valueSerde;
end
start
note right
void init(final ProcessorContextcontext,final StateStoreroot)
end note
:this.context=context instanceof InternalProcessorContext? (InternalProcessorContext<? ,
? >)context:null ;
:taskId=context.taskId();
:initStoreSerde(context);
:streamsMetrics=(StreamsMetricsImpl)context.metrics();
:registerMetrics();
:maybeMeasureLatency(()->super .init(context,
root),time,restoreSensor);
end
start
note right
void init(final StateStoreContextcontext,
final StateStoreroot)
end note
:this.context=context instanceof InternalProcessorContext? (InternalProcessorContext<? ,
? >)context:null ;
:taskId=context.taskId();
:initStoreSerde(context);
:streamsMetrics=(StreamsMetricsImpl)context.metrics();
:registerMetrics();
:maybeMeasureLatency(()->super .init(context,
root),time,restoreSensor);
end
start
note right
Serde<V>prepareValueSerde(final Serde<V>valueSerde,
final SerdeGettergetter)
end note
:return WrappingNullableUtils.prepareValueSerde(valueSerde,
getter);;
stop
end
start
note right
void registerMetrics()
end note
:putSensor=StateStoreMetrics.putSensor(taskId.toString(),
metricsScope,name(),streamsMetrics);
:fetchSensor=StateStoreMetrics.fetchSensor(taskId.toString(),
metricsScope,name(),streamsMetrics);
:flushSensor=StateStoreMetrics.flushSensor(taskId.toString(),
metricsScope,name(),streamsMetrics);
:e2eLatencySensor=StateStoreMetrics.e2ELatencySensor(taskId.toString(),
metricsScope,name(),streamsMetrics);
end
start
note right
void initStoreSerde(final ProcessorContextcontext)
end note
:serdes=new StateSerdes<>(changelogTopic,
prepareKeySerde(keySerde,new SerdeGetter(context)),
prepareValueSerde(valueSerde,new SerdeGetter(context)));
end
start
note right
void initStoreSerde(final StateStoreContextcontext)
end note
:serdes=new StateSerdes<>(changelogTopic,
prepareKeySerde(keySerde,new SerdeGetter(context)),
prepareValueSerde(valueSerde,new SerdeGetter(context)));
end
start
note right
booleansetFlushListener(final CacheFlushListener<Windowed<K>,
V>listener,final booleansendOldValues)
end note
if (wrapped instanceof CachedStateStore) then (yes) 
:return ((CachedStateStore<byte[],byte[]>)wrapped)
.setFlushListener(record->listener.apply(record.withKey(WindowKeySchema.fromStoreKey(record.key(),
windowSizeMs,serdes.keyDeserializer(),serdes.topic()))
.withValue(new Change<>(record.value().newValue!=null ? serdes.valueFrom(record.value().newValue):null ,
record.value().oldValue!=null ? serdes.valueFrom(record.value().oldValue):null ))),
sendOldValues);;
stop
endif 
:return false;;
stop
end
start
note right
void put(final Kkey,final Vvalue,final longwindowStartTimestamp)
end note
:Objects.requireNonNull(key,"key cannot be null");
:maybeMeasureLatency(()->wrapped().put(keyBytes(key),
serdes.rawValue(value),windowStartTimestamp),
time,putSensor);
:maybeRecordE2ELatency();
:throw new ProcessorStateException(message,e);;
end
start
note right
Vfetch(final Kkey,final longtimestamp)
end note
:Objects.requireNonNull(key,"key cannot be null");
:return maybeMeasureLatency(()->{final byte[]result=wrapped().fetch(keyBytes(key),
timestamp);if (result==null ){return null ;}return serdes.valueFrom(result);},
time,fetchSensor);;
stop
end
start
note right
WindowStoreIterator<V>fetch(final Kkey,final longtimeFrom,
final longtimeTo)
end note
:Objects.requireNonNull(key,"key cannot be null");
:return new MeteredWindowStoreIterator<>(wrapped().fetch(keyBytes(key),
timeFrom,timeTo),fetchSensor,streamsMetrics,
serdes::valueFrom,time);;
stop
end
start
note right
WindowStoreIterator<V>backwardFetch(final Kkey,
final longtimeFrom,final longtimeTo)
end note
:Objects.requireNonNull(key,"key cannot be null");
:return new MeteredWindowStoreIterator<>(wrapped().backwardFetch(keyBytes(key),
timeFrom,timeTo),fetchSensor,streamsMetrics,
serdes::valueFrom,time);;
stop
end
start
note right
KeyValueIterator<Windowed<K>,V>fetch(final KkeyFrom,
final KkeyTo,final longtimeFrom,final longtimeTo)
end note
:return new MeteredWindowedKeyValueIterator<>(wrapped().fetch(keyBytes(keyFrom),
keyBytes(keyTo),timeFrom,timeTo),fetchSensor,
streamsMetrics,serdes::keyFrom,serdes::valueFrom,
time);;
stop
end
start
note right
KeyValueIterator<Windowed<K>,V>backwardFetch(final KkeyFrom,
final KkeyTo,final longtimeFrom,final longtimeTo)
end note
:return new MeteredWindowedKeyValueIterator<>(wrapped().backwardFetch(keyBytes(keyFrom),
keyBytes(keyTo),timeFrom,timeTo),fetchSensor,
streamsMetrics,serdes::keyFrom,serdes::valueFrom,
time);;
stop
end
start
note right
KeyValueIterator<Windowed<K>,V>fetchAll(final longtimeFrom,
final longtimeTo)
end note
:return new MeteredWindowedKeyValueIterator<>(wrapped().fetchAll(timeFrom,
timeTo),fetchSensor,streamsMetrics,serdes::keyFrom,
serdes::valueFrom,time);;
stop
end
start
note right
KeyValueIterator<Windowed<K>,V>backwardFetchAll(final longtimeFrom,
final longtimeTo)
end note
:return new MeteredWindowedKeyValueIterator<>(wrapped().backwardFetchAll(timeFrom,
timeTo),fetchSensor,streamsMetrics,serdes::keyFrom,
serdes::valueFrom,time);;
stop
end
start
note right
KeyValueIterator<Windowed<K>,V>all()
end note
:return new MeteredWindowedKeyValueIterator<>(wrapped().all(),
fetchSensor,streamsMetrics,serdes::keyFrom,
serdes::valueFrom,time);;
stop
end
start
note right
KeyValueIterator<Windowed<K>,V>backwardAll()
end note
:return new MeteredWindowedKeyValueIterator<>(wrapped().backwardAll(),
fetchSensor,streamsMetrics,serdes::keyFrom,
serdes::valueFrom,time);;
stop
end
start
note right
void flush()
end note
:maybeMeasureLatency(super ::flush,time,flushSensor);
end
start
note right
void close()
end note
:wrapped().close();
:streamsMetrics.removeAllStoreLevelSensorsAndMetrics(taskId.toString(),
name());
end
if (handler==null ) then (yes) 
:result=wrapped().query(query,positionBound,
config);
if (config.isCollectExecutionInfo()) then (yes) 
:result.addExecutionInfo("Handled in "+getClass()+
" in "+(time.nanoseconds()-start)+"ns");
endif 
else (no)
:result=(QueryResult<R>)handler.apply(query,
positionBound,config,this);
if (config.isCollectExecutionInfo()) then (yes) 
:result.addExecutionInfo("Handled in "+getClass()+
" with serdes "+serdes+" in "+(time.nanoseconds()-start)+
"ns");
endif 
endif 
:return result;;
stop
if (typedQuery.getTimeFrom().isPresent()&&typedQuery.getTimeTo()
.isPresent()) then (yes) 
if (rawResult.isSuccess()) then (yes) 
:result=(QueryResult<R>)typedQueryResult;
else (no)
:result=(QueryResult<R>)rawResult;
endif 
else (no)
:result=QueryResult.forFailure(FailureReason.UNKNOWN_QUERY_TYPE,"This store ("+
getClass()+") doesn't know how to"+" execute the given query ("+
query+") because"+" WindowStores only supports WindowRangeQuery.withWindowStartRange."+
" Contact the store maintainer if you need support"+
" for a new query type.");
endif 
:return result;;
stop
if (typedQuery.getTimeFrom().isPresent()&&typedQuery.getTimeTo()
.isPresent()) then (yes) 
if (rawResult.isSuccess()) then (yes) 
:queryResult=(QueryResult<R>)typedQueryResult;
else (no)
:queryResult=(QueryResult<R>)rawResult;
endif 
else (no)
:queryResult=QueryResult.forFailure(FailureReason.UNKNOWN_QUERY_TYPE,"This store ("+
getClass()+") doesn't know how to execute"+
" the given query ("+query+") because it only supports closed-range"+
" queries."+" Contact the store maintainer if you need support for a new query type.");
endif 
:return queryResult;;
stop
start
note right
ByteskeyBytes(final Kkey)
end note
:return Bytes.wrap(serdes.rawKey(key));;
stop
end
start
note right
VouterValue(final byte[]value)
end note
:return value!=null ? serdes.valueFrom(value):null ;;
stop
end
start
note right
void maybeRecordE2ELatency()
end note
if (e2eLatencySensor.shouldRecord()&&context!=null ) then (yes) 
:e2eLatencySensor.record(e2eLatency,currentTime);
endif 
end
@enduml

