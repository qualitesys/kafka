@startuml
!pragma layout smetana
start
note right
constructor WrappingStoreProvider(final Collection<StreamThreadStateStoreProvider>storeProviders,
final StoreQueryParametersstoreQueryParameters)
end note
:this.storeProviders=storeProviders;
:this.storeQueryParameters=storeQueryParameters;
end
start
note right
void setStoreQueryParameters(final StoreQueryParametersstoreQueryParameters)
end note
:this.storeQueryParameters=storeQueryParameters;
end
if (!stores.isEmpty()) then (yes) 
:allStores.addAll(stores);
if (storeQueryParameters.partition()!=null ) then (yes) 
endif 
endif 
if (allStores.isEmpty()) then (yes) 
if (storeQueryParameters.partition()!=null ) then (yes) 
:throw new InvalidStateStorePartitionException(String.format("The specified partition %d for store %s does not exist.",
storeQueryParameters.partition(),storeName));;
endif 
:throw new InvalidStateStoreException("The state store, "+
storeName+", may have migrated to another instance.");;
endif 
:return allStores;;
stop
@enduml

