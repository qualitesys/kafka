roke-width:1.0;" x1="222.5" x2="222.5" y1="416.8477" y2="454.5469"/><polygon fill="#181818" points="218.5,444.5469,222.5,454.5469,226.5,444.5469,222.5,448.5469" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="222.5" x2="222.5" y1="502.4844" y2="522.4844"/><polygon fill="#181818" points="218.5,512.4844,222.5,522.4844,226.5,512.4844,222.5,516.4844" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="222.5" x2="222.5" y1="612.3281" y2="632.3281"/><polygon fill="#181818" points="218.5,622.3281,222.5,632.3281,226.5,622.3281,222.5,626.3281" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="222.5" x2="222.5" y1="666.2969" y2="686.2969"/><polygon fill="#181818" points="218.5,676.2969,222.5,686.2969,226.5,676.2969,222.5,680.2969" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[6e8cb47286ab87182a092ade6186a657]
@startuml
!pragma layout smetana
start
note right
Sensor consumedSensor(final String threadId,
final String taskId,final String processorNodeId,
final String topic,final StreamsMetricsImpl streamsMetrics)
end note
:final Sensor sensor=streamsMetrics.topicLevelSensor(threadId,
taskId,processorNodeId,topic,CONSUMED,RecordingLevel.INFO);;
:addTotalCountAndSumMetricsToSensor(sensor,
TOPIC_LEVEL_GROUP,streamsMetrics.topicLevelTagMap(threadId,
taskId,processorNodeId,topic),RECORDS_CONSUMED,
BYTES_CONSUMED,RECORDS_CONSUMED_TOTAL_DESCRIPTION,
BYTES_CONSUMED_TOTAL_DESCRIPTION);;
:return sensor;;
stop
end
start
note right
Sensor producedSensor(final String threadId,
final String taskId,final String processorNodeId,
final String topic,final StreamsMetricsImpl streamsMetrics)
end note
:final Sensor sensor=streamsMetrics.topicLevelSensor(threadId,
taskId,processorNodeId,topic,PRODUCED,RecordingLevel.INFO);;
:addTotalCountAndSumMetricsToSensor(sensor,
TOPIC_LEVEL_GROUP,streamsMetrics.topicLevelTagMap(threadId,
taskId,processorNodeId,topic),RECORDS_PRODUCED,
BYTES_PRODUCED,RECORDS_PRODUCED_TOTAL_DESCRIPTION,
BYTES_PRODUCED_TOTAL_DESCRIPTION);;
:return sensor;;
stop
end
@enduml

