@startuml
!pragma layout smetana
start
note right
constructor StreamsException(final Stringmessage)
end note
:this(message,(TaskId)null );
end
start
note right
constructor StreamsException(final Stringmessage,final TaskIdtaskId)
end note
:super (message);
:this.taskId=taskId;
end
start
note right
constructor StreamsException(final Stringmessage,final Throwablethrowable)
end note
:this(message,throwable,null );
end
start
note right
constructor StreamsException(final Stringmessage,final Throwablethrowable,final TaskIdtaskId)
end note
:super (message,throwable);
:this.taskId=taskId;
end
start
note right
constructor StreamsException(final Throwablethrowable)
end note
:this(throwable,null );
end
start
note right
constructor StreamsException(final Throwablethrowable,final TaskIdtaskId)
end note
:super (throwable);
:this.taskId=taskId;
end
start
note right
Optional<TaskId>taskId()
end note
:return Optional.ofNullable(taskId);;
stop
end
start
note right
void setTaskId(final TaskIdtaskId)
end note
:this.taskId=taskId;
end
@enduml

