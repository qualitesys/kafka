@startuml
!pragma layout smetana
start
note right
constructor GroupedStreamAggregateBuilder(final InternalStreamsBuilderbuilder,final GroupedInternal<K,V>groupedInternal,final booleanrepartitionRequired,final Set<String>subTopologySourceNodes,final Stringname,final GraphNodegraphNode)
end note
:this.builder=builder;
:this.keySerde=groupedInternal.keySerde();
:this.valueSerde=groupedInternal.valueSerde();
:this.repartitionRequired=repartitionRequired;
:this.subTopologySourceNodes=subTopologySourceNodes;
:this.name=name;
:this.graphNode=graphNode;
:this.userProvidedRepartitionTopicName=groupedInternal.name();
end
if (repartitionRequired) then (yes) 
:sourceName=createRepartitionSource(repartitionTopicPrefix,
repartitionNodeBuilder);
if (repartitionNode==null ||userProvidedRepartitionTopicName==null ) then (yes) 
:repartitionNode=repartitionNodeBuilder.build();
endif 
:builder.addGraphNode(parentNode,repartitionNode);
:parentNode=repartitionNode;
endif 
:builder.addGraphNode(parentNode,statefulProcessorNode);
:return new KTableImpl<>(aggFunctionName,
keySerde,valueSerde,sourceName.equals(this.name)? subTopologySourceNodes:Collections.singleton(sourceName),queryableStoreName,aggregateSupplier,statefulProcessorNode,builder);;
stop
start
note right
StringcreateRepartitionSource(final StringrepartitionTopicNamePrefix,final OptimizableRepartitionNodeBuilder<K,V>optimizableRepartitionNodeBuilder)
end note
:return KStreamImpl.createRepartitionedSource(builder,
keySerde,valueSerde,repartitionTopicNamePrefix,
null ,optimizableRepartitionNodeBuilder);;
stop
end
@enduml

