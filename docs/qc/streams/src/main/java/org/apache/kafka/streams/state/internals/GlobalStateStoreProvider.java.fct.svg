@startuml
!pragma layout smetana
start
note right
constructor GlobalStateStoreProvider(final Map<String,
StateStore>globalStateStores)
end note
:this.globalStateStores=globalStateStores;
end
if (store==null ||!queryableStoreType.accepts(store)) then (yes) 
:return Collections.emptyList();;
stop
endif 
if (!store.isOpen()) then (yes) 
:throw new InvalidStateStoreException("the state store, "+
storeName+", is not open.");;
endif 
if (store instanceof TimestampedKeyValueStore&&queryableStoreType instanceof QueryableStoreTypes.KeyValueStoreType) then (yes) 
:return (List<T>)Collections.singletonList(new ReadOnlyKeyValueStoreFacade((TimestampedKeyValueStore<Object,
Object>)store));;
stop
endif 
:return (List<T>)Collections.singletonList(store);;
stop
@enduml

