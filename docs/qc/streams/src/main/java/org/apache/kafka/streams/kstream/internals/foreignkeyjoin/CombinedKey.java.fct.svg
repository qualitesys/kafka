@startuml
!pragma layout smetana
start
note right
constructor CombinedKey(final KFforeignKey,final KPprimaryKey)
end note
:Objects.requireNonNull(foreignKey,"foreignKey can't be null");
:Objects.requireNonNull(primaryKey,"primaryKey can't be null");
:this.foreignKey=foreignKey;
:this.primaryKey=primaryKey;
end
start
note right
KFgetForeignKey()
end note
:return foreignKey;;
stop
end
start
note right
KPgetPrimaryKey()
end note
:return primaryKey;;
stop
end
start
note right
booleanequals(final KFforeignKey,final KPprimaryKey)
end note
:return this.foreignKey.equals(foreignKey)&&this.primaryKey.equals(primaryKey);;
stop
end
start
note right
StringtoString()
end note
:return "CombinedKey{"+"foreignKey="+foreignKey+", primaryKey="+primaryKey+'}';;
stop
end
@enduml

