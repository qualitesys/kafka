@startuml
!pragma layout smetana
start
note right
AdmingetAdmin(final Map<String,Object>config)
end note
:return Admin.create(config);;
stop
end
start
note right
Producer<byte[],byte[]>getProducer(final Map<String,Object>config)
end note
:return new KafkaProducer<>(config,new ByteArraySerializer(),
new ByteArraySerializer());;
stop
end
start
note right
Consumer<byte[],byte[]>getConsumer(final Map<String,Object>config)
end note
:return new KafkaConsumer<>(config,new ByteArrayDeserializer(),
new ByteArrayDeserializer());;
stop
end
start
note right
Consumer<byte[],byte[]>getRestoreConsumer(final Map<String,Object>config)
end note
:return new KafkaConsumer<>(config,new ByteArrayDeserializer(),
new ByteArrayDeserializer());;
stop
end
start
note right
Consumer<byte[],byte[]>getGlobalConsumer(final Map<String,Object>config)
end note
:return new KafkaConsumer<>(config,new ByteArrayDeserializer(),
new ByteArrayDeserializer());;
stop
end
@enduml

