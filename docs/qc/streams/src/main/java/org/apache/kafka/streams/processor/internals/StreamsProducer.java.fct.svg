ont-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="37" x="5" y="153.0625">start</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="78" x="5" y="169.3594">note right</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="450" x="5" y="185.6563">constructor StreamsProducer(final StreamsConfigconfig,</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="461" x="5" y="201.9531">final StringthreadId,final KafkaClientSupplierclientSupplier,</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="519" x="5" y="218.25">final TaskIdtaskId,final UUIDprocessId,final LogContextlogContext,</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="116" x="5" y="234.5469">final Timetime)</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="71" x="5" y="250.8438">end note</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="447" x="5" y="267.1406">:Objects.requireNonNull(config,"config cannot be null");;</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="481" x="5" y="283.4375">:Objects.requireNonNull(threadId,"threadId cannot be null");;</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="462" x="5" y="299.7344">:this.clientSupplier=Objects.requireNonNull(clientSupplier,</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="257" x="5" y="316.0313">"clientSupplier cannot be null");;</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="545" x="5" y="332.3281">:log=Objects.requireNonNull(logContext,"logContext cannot be null")</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="160" x="5" y="348.625">.logger(getClass());;</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="321" x="5" y="364.9219">:logPrefix=logContext.logPrefix().trim();;</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="380" x="5" y="381.2188">:this.time=Objects.requireNonNull(time,"time");;</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="508" x="5" y="397.5156">:processingMode=StreamsConfigUtils.processingMode(config);;</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="348" x="5" y="413.8125">:final Map&lt;String,Object&gt;producerConfigs;;</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="269" x="5" y="430.1094">switch (switch (processingMode))</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" text-decoration="wavy underline" textLength="73" x="5" y="446.4063">endswith</text><text fill="#FF0000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="106" x="10" y="462.7031">Syntax Error?</text><!--MD5=[446663f441dd22806605445d9a475fdc]
@startuml
!pragma layout smetana
start
note right
constructor StreamsProducer(final StreamsConfigconfig,
final StringthreadId,final KafkaClientSupplierclientSupplier,
final TaskIdtaskId,final UUIDprocessId,final LogContextlogContext,
final Timetime)
end note
:Objects.requireNonNull(config,"config cannot be null");;
:Objects.requireNonNull(threadId,"threadId cannot be null");;
:this.clientSupplier=Objects.requireNonNull(clientSupplier,
"clientSupplier cannot be null");;
:log=Objects.requireNonNull(logContext,"logContext cannot be null")
.logger(getClass());;
:logPrefix=logContext.logPrefix().trim();;
:this.time=Objects.requireNonNull(time,"time");;
:processingMode=StreamsConfigUtils.processingMode(config);;
:final Map<String,Object>producerConfigs;;
switch (switch (processingMode))
endswith
:producer=clientSupplier.getProducer(producerConfigs);;
end
start
note right
StringformatException(final Stringmessage)
end note
:return message+" ["+logPrefix+"]";;
stop
end
start
note right
booleaneosEnabled()
end note
:return StreamsConfigUtils.eosEnabled(processingMode);;
stop
end
start
note right
void initTransaction()
end note
if (!eosEnabled()) then (yes) 
:throw new IllegalStateException(formatException("Exactly-once is not enabled"));;
stop
endif 
if (!transactionInitialized) then (yes) 
:try ;
:producer.initTransactions();;
:transactionInitialized=true;;
:catch (final TimeoutExceptiontimeoutException);
:log.warn("Timeout exception caught trying to initialize transactions. "+
"The broker is either slow or in bad state (like not having enough replicas) in "+
"responding to the request, or the connection to broker was interrupted sending "+
"the request or receiving the response. "+
"Will retry initializing the task in the next loop. "+
"Consider overwriting {} to a larger value to avoid timeout errors",
ProducerConfig.MAX_BLOCK_MS_CONFIG);;
:throw timeoutException;;
stop
:catch (final KafkaExceptionexception);
:throw new StreamsException(formatException("Error encountered trying to initialize transactions"),
exception);;
stop
endif 
end
start
note right
void resetProducer()
end note
if (processingMode!=EXACTLY_ONCE_V2) then (yes) 
:throw new IllegalStateException("Expected eos-v2 to be enabled, but the processing mode was "+
processingMode);;
stop
endif 
:oldProducerTotalBlockedTime+=totalBlockedTime(producer);;
:final longstart=time.nanoseconds();;
:producer.close();;
:final longcloseTime=time.nanoseconds()-start;;
:oldProducerTotalBlockedTime+=closeTime;;
:producer=clientSupplier.getProducer(eosV2ProducerConfigs);;
:transactionInitialized=false;;
end
start
note right
doublegetMetricValue(final Map<MetricName,
?  extends Metric>metrics,final Stringname)
end note
:final List<MetricName>found=metrics.keySet()
.stream().filter(n->n.name().equals(name)).collect(Collectors.toList());;
if (found.isEmpty()) then (yes) 
:return 0.0;;
stop
endif 
if (found.size()>1) then (yes) 
:final Stringerr=String.format("found %d values for metric %s. total blocked time computation may be incorrect",
found.size(),name);;
:log.error(err);;
:throw new IllegalStateException(err);;
stop
endif 
:return (Double)metrics.get(found.get(0))
.metricValue();;
stop
end
start
note right
doubletotalBlockedTime(final Producer<? ,
? >producer)
end note
:return getMetricValue(producer.metrics(),"bufferpool-wait-time-ns-total")+
getMetricValue(producer.metrics(),"flush-time-ns-total")+
getMetricValue(producer.metrics(),"txn-init-time-ns-total")+
getMetricValue(producer.metrics(),"txn-begin-time-ns-total")+
getMetricValue(producer.metrics(),"txn-send-offsets-time-ns-total")+
getMetricValue(producer.metrics(),"txn-commit-time-ns-total")+
getMetricValue(producer.metrics(),"txn-abort-time-ns-total")+
getMetricValue(producer.metrics(),"metadata-wait-time-ns-total");;
stop
end
start
note right
doubletotalBlockedTime()
end note
:return oldProducerTotalBlockedTime+totalBlockedTime(producer);;
stop
end
start
note right
void maybeBeginTransaction()
end note
if (eosEnabled()&&!transactionInFlight) then (yes) 
:try ;
:producer.beginTransaction();;
:transactionInFlight=true;;
:catch (final ProducerFencedException|InvalidProducerEpochExceptionerror);
:throw new TaskMigratedException(formatException("Producer got fenced trying to begin a new transaction"),
error);;
stop
:catch (final KafkaExceptionerror);
:throw new StreamsException(formatException("Error encountered trying to begin a new transaction"),
error);;
stop
endif 
end
start
note right
Future<RecordMetadata>send(final ProducerRecord<byte[],
byte[]>record,final Callbackcallback)
end note
:maybeBeginTransaction();;
:try ;
:return producer.send(record,callback);;
stop
:catch (final KafkaExceptionuncaughtException);
if (isRecoverable(uncaughtException)) then (yes) 
:throw new TaskMigratedException(formatException("Producer got fenced trying to send a record"),
uncaughtException.getCause());;
stop
else (no)
:throw new StreamsException(formatException(String.format("Error encountered trying to send record to topic %s",
record.topic())),uncaughtException);;
stop
endif 
end
start
note right
booleanisRecoverable(final KafkaExceptionuncaughtException)
end note
:return uncaughtException.getCause() instanceof ProducerFencedException||uncaughtException.getCause() instanceof InvalidProducerEpochException||uncaughtException.getCause() instanceof UnknownProducerIdException;;
stop
end
start
note right
void commitTransaction(final Map<TopicPartition,
OffsetAndMetadata>offsets,final ConsumerGroupMetadataconsumerGroupMetadata)
end note
if (!eosEnabled()) then (yes) 
:throw new IllegalStateException(formatException("Exactly-once is not enabled"));;
stop
endif 
:maybeBeginTransaction();;
:try ;
:final ConsumerGroupMetadatamaybeDowngradedGroupMetadata=processingMode==EXACTLY_ONCE_V2? consumerGroupMetadata:new ConsumerGroupMetadata(consumerGroupMetadata.groupId());;
:producer.sendOffsetsToTransaction(offsets,
maybeDowngradedGroupMetadata);;
:producer.commitTransaction();;
:transactionInFlight=false;;
:catch (final ProducerFencedException|InvalidProducerEpochException|CommitFailedExceptionerror);
:throw new TaskMigratedException(formatException("Producer got fenced trying to commit a transaction"),
error);;
stop
:catch (final TimeoutExceptiontimeoutException);
:throw timeoutException;;
stop
:catch (final KafkaExceptionerror);
:throw new StreamsException(formatException("Error encountered trying to commit a transaction"),
error);;
stop
end
start
note right
void abortTransaction()
end note
if (!eosEnabled()) then (yes) 
:throw new IllegalStateException(formatException("Exactly-once is not enabled"));;
stop
endif 
if (transactionInFlight) then (yes) 
:try ;
:producer.abortTransaction();;
:catch (final TimeoutExceptionlogAndSwallow);
:log.warn("Aborting transaction failed due to timeout."+
" Will rely on broker to eventually abort the transaction after the transaction timeout passed.",
logAndSwallow);;
:catch (final ProducerFencedException|InvalidProducerEpochExceptionerror);
:log.debug("Encountered {} while aborting the transaction; this is expected and hence swallowed",
error.getMessage());;
:catch (final KafkaExceptionerror);
:throw new StreamsException(formatException("Error encounter trying to abort a transaction"),
error);;
stop
:transactionInFlight=false;;
endif 
end
start
note right
List<PartitionInfo>partitionsFor(final Stringtopic)
end note
:return producer.partitionsFor(topic);;
stop
end
start
note right
Map<MetricName,?  extends Metric>metrics()
end note
:return producer.metrics();;
stop
end
start
note right
void flush()
end note
:producer.flush();;
end
start
note right
void close()
end note
:producer.close();;
end
start
note right
Producer<byte[],byte[]>kafkaProducer()
end note
:return producer;;
stop
end
@enduml

