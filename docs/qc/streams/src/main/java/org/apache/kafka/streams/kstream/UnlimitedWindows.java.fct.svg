@startuml
!pragma layout smetana
start
note right
constructor UnlimitedWindows(final longstartMs)
end note
:this.startMs=startMs;;
end
start
note right
UnlimitedWindowsof()
end note
:return new UnlimitedWindows(DEFAULT_START_TIMESTAMP_MS);;
stop
end
start
note right
UnlimitedWindowsstartOn(final Instantstart)
end note
:final StringmsgPrefix=prepareMillisCheckFailMsgPrefix(start,
"start");;
:final longstartMs=ApiUtils.validateMillisecondInstant(start,
msgPrefix);;
if (startMs<0) then (yes) 
:throw new IllegalArgumentException("Window start time (startMs) cannot be negative.");;
stop
endif 
:return new UnlimitedWindows(startMs);;
stop
end
start
note right
Map<Long,UnlimitedWindow>windowsFor(final longtimestamp)
end note
:final Map<Long,UnlimitedWindow>windows=new HashMap<>();;
if (timestamp>=startMs) then (yes) 
:windows.put(startMs,new UnlimitedWindow(startMs));;
endif 
:return windows;;
stop
end
start
note right
longsize()
end note
:return Long.MAX_VALUE;;
stop
end
start
note right
longgracePeriodMs()
end note
:return 0L;;
stop
end
start
note right
booleanequals(final Objecto)
end note
if (this==o) then (yes) 
:return true;;
stop
endif 
if (o==null ||getClass()!=o.getClass()) then (yes) 
:return false;;
stop
endif 
:final UnlimitedWindowsthat=(UnlimitedWindows)o;;
:return startMs==that.startMs;;
stop
end
start
note right
inthashCode()
end note
:return Objects.hash(startMs);;
stop
end
start
note right
StringtoString()
end note
:return "UnlimitedWindows{"+"startMs="+startMs+
'}';;
stop
end
@enduml

