@startuml
!pragma layout smetana
start
note right
constructor TableJoined(final StreamPartitioner<K,Void>partitioner,final StreamPartitioner<KO,Void>otherPartitioner,final Stringname)
end note
:this.partitioner=partitioner;
:this.otherPartitioner=otherPartitioner;
:this.name=name;
end
start
note right
constructor TableJoined(final TableJoined<K,KO>tableJoined)
end note
:this(tableJoined.partitioner,tableJoined.otherPartitioner,
tableJoined.name);
end
:return new TableJoined<>(partitioner,otherPartitioner,
null );;
stop
:return new TableJoined<>(null ,null ,name);;
stop
start
note right
TableJoined<K,KO>withPartitioner(final StreamPartitioner<K,Void>partitioner)
end note
:return new TableJoined<>(partitioner,otherPartitioner,
name);;
stop
end
start
note right
TableJoined<K,KO>withOtherPartitioner(final StreamPartitioner<KO,Void>otherPartitioner)
end note
:return new TableJoined<>(partitioner,otherPartitioner,
name);;
stop
end
start
note right
TableJoined<K,KO>withName(final Stringname)
end note
:return new TableJoined<>(partitioner,otherPartitioner,
name);;
stop
end
@enduml

