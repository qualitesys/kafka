@startuml
!pragma layout smetana
start
note right
constructor MeteredWindowStoreIterator(final WindowStoreIterator<byte[]>iter,
final Sensorsensor,final StreamsMetricsmetrics,
final Function<byte[],V>valueFrom,final Timetime)
end note
:this.iter=iter;;
:this.sensor=sensor;;
:this.metrics=metrics;;
:this.valueFrom=valueFrom;;
:this.startNs=time.nanoseconds();;
:this.time=time;;
end
start
note right
booleanhasNext()
end note
:return iter.hasNext();;
stop
end
start
note right
KeyValue<Long,V>next()
end note
:return KeyValue.pair(next.key,valueFrom.apply(next.value));;
stop
end
start
note right
void close()
end note
:try {iter.close();}finally {sensor.record(time.nanoseconds()-startNs);};
end
start
note right
LongpeekNextKey()
end note
:return iter.peekNextKey();;
stop
end
@enduml

