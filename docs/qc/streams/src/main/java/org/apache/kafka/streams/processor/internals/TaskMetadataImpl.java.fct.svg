@startuml
!pragma layout smetana
start
note right
constructor TaskMetadataImpl(final TaskIdtaskId,final Set<TopicPartition>topicPartitions,final Map<TopicPartition,Long>committedOffsets,final Map<TopicPartition,Long>endOffsets,final Optional<Long>timeCurrentIdlingStarted)
end note
:this.taskId=taskId;
:this.topicPartitions=Collections.unmodifiableSet(topicPartitions);
:this.committedOffsets=Collections.unmodifiableMap(committedOffsets);
:this.endOffsets=Collections.unmodifiableMap(endOffsets);
:this.timeCurrentIdlingStarted=timeCurrentIdlingStarted;
end
start
note right
TaskIdtaskId()
end note
:return taskId;;
stop
end
start
note right
Set<TopicPartition>topicPartitions()
end note
:return topicPartitions;;
stop
end
start
note right
Map<TopicPartition,Long>committedOffsets()
end note
:return committedOffsets;;
stop
end
start
note right
Map<TopicPartition,Long>endOffsets()
end note
:return endOffsets;;
stop
end
start
note right
Optional<Long>timeCurrentIdlingStarted()
end note
:return timeCurrentIdlingStarted;;
stop
end
start
note right
booleanequals(final Objecto)
end note
if (this==o) then (yes) 
:return true;;
stop
endif 
if (o==null ||getClass()!=o.getClass()) then (yes) 
:return false;;
stop
endif 
:return Objects.equals(taskId,that.taskId)&&Objects.equals(topicPartitions,
that.topicPartitions);;
stop
end
start
note right
inthashCode()
end note
:return Objects.hash(taskId,topicPartitions);;
stop
end
start
note right
StringtoString()
end note
:return "TaskMetadata{"+"taskId="+taskId+
", topicPartitions="+topicPartitions+", committedOffsets="+
committedOffsets+", endOffsets="+endOffsets+
", timeCurrentIdlingStarted="+timeCurrentIdlingStarted+
'}';;
stop
end
@enduml

