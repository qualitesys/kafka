@startuml
!pragma layout smetana
start
note right
constructor TimestampedKeyAndJoinSideDeserializer(final Deserializer<K>keyDeserializer)
end note
:this.keyDeserializer=keyDeserializer;;
end
start
note right
void setIfUnset(final SerdeGettergetter)
end note
if (keyDeserializer==null ) then (yes) 
:keyDeserializer=(Deserializer<K>)getter.keySerde()
.deserializer();;
endif 
:initNullableDeserializer(keyDeserializer,
getter);;
end
start
note right
void configure(final Map<String,? >configs,
final booleanisKey)
end note
:keyDeserializer.configure(configs,isKey);;
end
start
note right
TimestampedKeyAndJoinSide<K>deserialize(final Stringtopic,
final byte[]data)
end note
:return TimestampedKeyAndJoinSide.make(bool,
key,timestamp);;
stop
end
start
note right
byte[]rawTimestamp(final byte[]data)
