start
note right
constructor StatefulProcessorNode(final ProcessorParameters<K,V,? ,? >processorParameters,final Set<StoreBuilder<? >>preRegisteredStores,final Set<KTableValueGetterSupplier<? ,? >>valueGetterSuppliers)
end note
:super (processorParameters.processorName(),processorParameters);
:storeNames=Stream.concat(registeredStoreNames,valueGetterStoreNames).toArray(String[]::new );
:storeBuilder=null ;
end
start
note right
constructor StatefulProcessorNode(final StringnodeName,final ProcessorParameters<K,V,? ,? >processorParameters,final String[]storeNames)
end note
:super (nodeName,processorParameters);
:this.storeNames=storeNames;
:this.storeBuilder=null ;
end
start
note right
constructor StatefulProcessorNode(final StringnodeName,final ProcessorParameters<K,V,? ,? >processorParameters,final StoreBuilder<? >materializedKTableStoreBuilder)
end note
