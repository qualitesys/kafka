@startuml
!pragma layout smetana
start
note right
constructor StatefulProcessorNode(final ProcessorParameters<K,
V,? ,? >processorParameters,final Set<StoreBuilder<? >>preRegisteredStores,
final Set<KTableValueGetterSupplier<? ,? >>valueGetterSuppliers)
end note
end
start
note right
constructor StatefulProcessorNode(final StringnodeName,
final ProcessorParameters<K,V,? ,? >processorParameters,
final String[]storeNames)
end note
end
start
note right
constructor StatefulProcessorNode(final StringnodeName,
final ProcessorParameters<K,V,? ,? >processorParameters,
final StoreBuilder<? >materializedKTableStoreBuilder)
end note
end
start
note right
StringtoString()
end note
:return "StatefulProcessorNode{"+"storeNames="+
Arrays.toString(storeNames)+", storeBuilder="+
storeBuilder+"} "+super .toString();;
stop
end
start
note right
void writeToTopology(final InternalTopologyBuildertopologyBuilder)
end note
if (storeNames!=null &&storeNames.length>0) then (yes) 
endif 
if (storeBuilder!=null ) then (yes) 
endif 
end
@enduml

