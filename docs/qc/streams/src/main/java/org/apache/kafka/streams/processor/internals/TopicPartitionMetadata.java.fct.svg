@startuml
!pragma layout smetana
start
note right
constructor TopicPartitionMetadata(final longpartitionTime,
final ProcessorMetadataprocessorMetadata)
end note
:Objects.requireNonNull(processorMetadata);;
:this.partitionTime=partitionTime;;
:this.processorMetadata=processorMetadata;;
end
start
note right
longpartitionTime()
end note
:return partitionTime;;
stop
end
start
note right
ProcessorMetadataprocessorMetadata()
end note
:return processorMetadata;;
stop
end
start
note right
Stringencode()
end note
:final byte[]serializedMeta=processorMetadata.serialize();;
:final ByteBufferbuffer=ByteBuffer.allocate(Byte.BYTES+
Long.BYTES+serializedMeta.length);;
:buffer.put(LATEST_MAGIC_BYTE);;
:buffer.putLong(partitionTime);;
:buffer.put(serializedMeta);;
:return Base64.getEncoder().encodeToString(buffer.array());;
stop
end
start
note right
TopicPartitionMetadatadecode(final StringencryptedString)
end note
:longtimestamp=RecordQueue.UNKNOWN;;
:ProcessorMetadatametadata=new ProcessorMetadata();;
if (encryptedString.isEmpty()) then (yes) 
:return new TopicPartitionMetadata(timestamp,
metadata);;
stop
endif 
:try ;
:final ByteBufferbuffer=ByteBuffer.wrap(Base64.getDecoder()
.decode(encryptedString));;
:final byteversion=buffer.get();;
switch (switch (version))
endswith
:catch (final Exceptionexception);
:LOG.warn("Unsupported offset metadata found");;
:return new TopicPartitionMetadata(timestamp,
metadata);;
stop
end
start
note right
inthashCode()
end note
:return Objects.hash(partitionTime,processorMetadata);;
stop
end
start
note right
booleanequals(final Objectobj)
end note
if (obj==null ||obj.getClass()!=getClass()) then (yes) 
:return false;;
stop
endif 
if (obj==this) then (yes) 
:return true;;
stop
endif 
:return partitionTime==((TopicPartitionMetadata)obj).partitionTime&&Objects.equals(processorMetadata,
((TopicPartitionMetadata)obj).processorMetadata);;
stop
end
