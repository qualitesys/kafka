@startuml
!pragma layout smetana
start
note right
constructor StateStoreNode(final StoreBuilder<S>storeBuilder)
end note
:super (storeBuilder.name());
:this.storeBuilder=storeBuilder;
end
start
note right
void writeToTopology(final InternalTopologyBuildertopologyBuilder)
end note
:topologyBuilder.addStateStore(storeBuilder);
end
start
note right
StringtoString()
end note
:return "StateStoreNode{"+" name='"+storeBuilder.name()+'\''+", logConfig="+storeBuilder.logConfig()+", loggingEnabled='"+storeBuilder.loggingEnabled()+'\''+"} ";;
stop
end
@enduml

