@startuml
!pragma layout smetana
start
note right
constructor JoinWindows(final JoinWindowsjoinWindows)
end note
:this(joinWindows.beforeMs,joinWindows.afterMs,
joinWindows.graceMs,joinWindows.enableSpuriousResultFix);;
end
start
note right
constructor JoinWindows(final longbeforeMs,
final longafterMs,final longgraceMs,final booleanenableSpuriousResultFix)
end note
if (beforeMs+afterMs<0) then (yes) 
:throw new IllegalArgumentException("Window interval (ie, beforeMs+
afterMs) must not be negative.");;
stop
endif 
if (graceMs<0) then (yes) 
:throw new IllegalArgumentException("Grace period must not be negative.");;
stop
endif 
:this.afterMs=afterMs;;
:this.beforeMs=beforeMs;;
:this.graceMs=graceMs;;
:this.enableSpuriousResultFix=enableSpuriousResultFix;;
end
start
note right
JoinWindowsofTimeDifferenceAndGrace(final DurationtimeDifference,
final DurationafterWindowEnd)
end note
:final StringtimeDifferenceMsgPrefix=prepareMillisCheckFailMsgPrefix(timeDifference,
"timeDifference");;
:final longtimeDifferenceMs=validateMillisecondDuration(timeDifference,
timeDifferenceMsgPrefix);;
:final StringafterWindowEndMsgPrefix=prepareMillisCheckFailMsgPrefix(afterWindowEnd,
"afterWindowEnd");;
:final longafterWindowEndMs=validateMillisecondDuration(afterWindowEnd,
afterWindowEndMsgPrefix);;
:return new JoinWindows(timeDifferenceMs,
timeDifferenceMs,afterWindowEndMs,true);;
stop
end
start
note right
JoinWindowsofTimeDifferenceWithNoGrace(final DurationtimeDifference)
end note
:return ofTimeDifferenceAndGrace(timeDifference,
Duration.ofMillis(NO_GRACE_PERIOD));;
stop
end
start
note right
JoinWindowsof(final DurationtimeDifference)
end note
:final StringmsgPrefix=prepareMillisCheckFailMsgPrefix(timeDifference,
"timeDifference");;
:final longtimeDifferenceMs=validateMillisecondDuration(timeDifference,
msgPrefix);;
:return new JoinWindows(timeDifferenceMs,
timeDifferenceMs,Math.max(DEPRECATED_DEFAULT_24_HR_GRACE_PERIOD-timeDifferenceMs*2,
0),false);;
stop
end
start
note right
JoinWindowsbefore(final DurationtimeDifference)
end note
:final StringmsgPrefix=prepareMillisCheckFailMsgPrefix(timeDifference,
"timeDifference");;
:final longtimeDifferenceMs=validateMillisecondDuration(timeDifference,
msgPrefix);;
:return new JoinWindows(timeDifferenceMs,
afterMs,graceMs,enableSpuriousResultFix);;
stop
end
start
note right
JoinWindowsafter(final DurationtimeDifference)
end note
:final StringmsgPrefix=prepareMillisCheckFailMsgPrefix(timeDifference,
"timeDifference");;
:final longtimeDifferenceMs=validateMillisecondDuration(timeDifference,
msgPrefix);;
:return new JoinWindows(beforeMs,timeDifferenceMs,
graceMs,enableSpuriousResultFix);;
stop
end
start
note right
Map<Long,Window>windowsFor(final longtimestamp)
end note
:throw new UnsupportedOperationException("windowsFor() is not supported by JoinWindows.");;
stop
end
start
note right
longsize()
end note
:return beforeMs+afterMs;;
stop
end
start
note right
JoinWindowsgrace(final DurationafterWindowEnd)
end note
if (this.enableSpuriousResultFix) then (yes) 
:throw new IllegalStateException("Cannot call grace() after setting grace value via ofTimeDifferenceAndGrace or ofTimeDifferenceWithNoGrace.");;
stop
endif 
:final StringmsgPrefix=prepareMillisCheckFailMsgPrefix(afterWindowEnd,
"afterWindowEnd");;
:final longafterWindowEndMs=validateMillisecondDuration(afterWindowEnd,
msgPrefix);;
:return new JoinWindows(beforeMs,afterMs,
afterWindowEndMs,false);;
stop
end
start
note right
longgracePeriodMs()
end note
:return graceMs;;
stop
end
start
note right
booleanequals(final Objecto)
end note
if (this==o) then (yes) 
:return true;;
stop
endif 
if (o==null ||getClass()!=o.getClass()) then (yes) 
:return false;;
stop
endif 
:final JoinWindowsthat=(JoinWindows)o;;
:return beforeMs==that.beforeMs&&afterMs==that.afterMs&&graceMs==that.graceMs;;
stop
end
start
note right
inthashCode()
end note
:return Objects.hash(beforeMs,afterMs,graceMs);;
stop
end
start
note right
StringtoString()
end note
:return "JoinWindows{"+"beforeMs="+beforeMs+
", afterMs="+afterMs+", graceMs="+graceMs+
'}';;
stop
end
@enduml

