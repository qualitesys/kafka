@startuml
!pragma layout smetana
start
note right
constructor PrintedInternal(final Printed<K,
V>printed)
end note
:super (printed);;
end
start
note right
ProcessorSupplier<K,V,Void,Void>build(final StringprocessorName)
end note
:return new KStreamPrint<>(new PrintForeachAction<>(outputStream,
