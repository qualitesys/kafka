@startuml
!pragma layout smetana
start
note right
constructor WrappingNullableSerde(final WrappingNullableSerializer<T,
InnerK,InnerV> serializer,final WrappingNullableDeserializer<T,
InnerK,InnerV> deserializer)
end note
:Objects.requireNonNull(serializer,"serializer can't be null");;
:Objects.requireNonNull(deserializer,"deserializer can't be null");;
:this.serializer=serializer;;
:this.deserializer=deserializer;;
end
start
note right
Serializer<T> serializer()
end note
:return serializer;;
stop
end
start
note right
Deserializer<T> deserializer()
end note
:return deserializer;;
stop
end
start
note right
void configure(final Map<String,?> configs,
final boolean isKey)
end note
:serializer.configure(configs,isKey);;
:deserializer.configure(configs,isKey);;
end
start
note right
void close()
end note
:serializer.close();;
:deserializer.close();;
end
start
note right
void setIfUnset(final SerdeGetter getter)
end note
:serializer.setIfUnset(getter);;
:deserializer.setIfUnset(getter);;
end
@enduml

