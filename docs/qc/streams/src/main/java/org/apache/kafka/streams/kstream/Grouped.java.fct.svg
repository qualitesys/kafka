@startuml
!pragma layout smetana
start
note right
constructor Grouped(final Stringname,final Serde<K>keySerde,
final Serde<V>valueSerde)
end note
:this.name=name;
:this.keySerde=keySerde;
:this.valueSerde=valueSerde;
end
start
note right
constructor Grouped(final Grouped<K,V>grouped)
end note
:this(grouped.name,grouped.keySerde,grouped.valueSerde);
end
:return new Grouped<>(name,null ,null );;
stop
:return new Grouped<>(null ,keySerde,null );;
stop
:return new Grouped<>(null ,null ,valueSerde);;
stop
:return new Grouped<>(name,keySerde,valueSerde);;
stop
:return new Grouped<>(null ,keySerde,valueSerde);;
stop
start
note right
Grouped<K,V>withName(final Stringname)
end note
:return new Grouped<>(name,keySerde,valueSerde);;
stop
end
start
note right
Grouped<K,V>withKeySerde(final Serde<K>keySerde)
end note
:return new Grouped<>(name,keySerde,valueSerde);;
stop
end
start
note right
Grouped<K,V>withValueSerde(final Serde<V>valueSerde)
end note
:return new Grouped<>(name,keySerde,valueSerde);;
stop
end
@enduml

