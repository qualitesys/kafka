@startuml
!pragma layout smetana
start
note right
constructor KStreamFlatMapValues(final ValueMapperWithKey<? super KIn,
? super VIn,?  extends Iterable<?  extends VOut>>mapper)
end note
:this.mapper=mapper;;
end
start
note right
FixedKeyProcessor<KIn,VIn,VOut>get()
end note
:return new KStreamFlatMapValuesProcessor();;
stop
end
start
note right
void process(final FixedKeyRecord<KIn,VIn>record)
end note
:final Iterable<?  extends VOut>newValues=mapper.apply(record.key(),
record.value());;
:context().forward(record.withValue(v));;
end
@enduml

