@startuml
!pragma layout smetana
start
note right
constructor KStreamFlatMapValues(final ValueMapperWithKey<?superKIn,
?superVIn,?extendsIterable<?extendsVOut>> mapper)
end note
:this.mapper=mapper;;
end
start
note right
FixedKeyProcessor<KIn,VIn,VOut> get()
end note
:return new KStreamFlatMapValuesProcessor();;
stop
end
start
note right
void process(final FixedKeyRecord<KIn,VIn> record)
end note
:final Iterable<?extendsVOut> newValues=mapper.apply(record.key(),
record.value());;
:context().forward(record.withValue(v));;
end
@enduml

