@startuml
!pragma layout smetana
if (delegate==null ) then (yes) 
:return null ;;
stop
else (no)
:return new ProcessorAdapter<>(delegate);;
stop
endif 
if (delegate==null ) then (yes) 
:return null ;;
stop
else (no)
:return new ProcessorAdapter<>(delegate);;
stop
endif 
start
note right
constructor ProcessorAdapter(final org.apache.kafka.streams.processor.Processor<KIn,VIn>delegate)
end note
:this.delegate=delegate;
end
start
note right
void init(final ProcessorContext<KOut,VOut>context)
end note
:this.context=(InternalProcessorContext)context;
:delegate.init((org.apache.kafka.streams.processor.ProcessorContext)context);
end
start
note right
void process(final Record<KIn,VIn>record)
end note
:context.setRecordContext(new ProcessorRecordContext(record.timestamp(),context.offset(),context.partition(),context.topic(),record.headers()));
:delegate.process(record.key(),record.value());
:context.setRecordContext(processorRecordContext);
end
start
note right
void close()
end note
:delegate.close();
end
