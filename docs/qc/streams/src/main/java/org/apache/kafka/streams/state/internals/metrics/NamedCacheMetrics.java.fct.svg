849e55417556ae7]
@startuml
!pragma layout smetana
start
note right
constructor NamedCacheMetrics()
end note
end
start
note right
SensorhitRatioSensor(final StreamsMetricsImplstreamsMetrics,
final StringthreadId,final StringtaskName,
final StringstoreName)
end note
:hitRatioName=HIT_RATIO;;
:hitRatioSensor=streamsMetrics.cacheLevelSensor(threadId,
taskName,storeName,hitRatioName,Sensor.RecordingLevel.DEBUG);;
:addAvgAndMinAndMaxToSensor(hitRatioSensor,
CACHE_LEVEL_GROUP,streamsMetrics.cacheLevelTagMap(threadId,
taskName,storeName),hitRatioName,HIT_RATIO_AVG_DESCRIPTION,
HIT_RATIO_MIN_DESCRIPTION,HIT_RATIO_MAX_DESCRIPTION);;
:return hitRatioSensor;;
stop
end
@enduml

