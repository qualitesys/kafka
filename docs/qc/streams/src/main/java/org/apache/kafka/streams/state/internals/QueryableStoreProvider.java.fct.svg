@startuml
!pragma layout smetana
start
note right
constructor QueryableStoreProvider(final GlobalStateStoreProvider globalStateStoreProvider)
end note
:this.storeProviders=new HashMap<>();;
:this.globalStoreProvider=globalStateStoreProvider;;
end
:final String storeName=storeQueryParameters.storeName();;
:final QueryableStoreType<T> queryableStoreType=storeQueryParameters.queryableStoreType();;
:final List<T> globalStore=globalStoreProvider.stores(storeName,
queryableStoreType);;
if (!globalStore.isEmpty()) then (yes) 
:return queryableStoreType.create(globalStoreProvider,
storeName);;
stop
endif 
:return queryableStoreType.create(new WrappingStoreProvider(storeProviders.values(),
storeQueryParameters),storeName);;
stop
start
note right
void addStoreProviderForThread(final String threadName,
final StreamThreadStateStoreProvider streamThreadStateStoreProvider)
end note
:this.storeProviders.put(threadName,streamThreadStateStoreProvider);;
end
start
note right
void removeStoreProviderForThread(final String threadName)
end note
:this.storeProviders.remove(threadName);;
end
@enduml

