@startuml
!pragma layout smetana
start
note right
constructor QueryableStoreProvider(final GlobalStateStoreProviderglobalStateStoreProvider)
end note
:this.storeProviders=new HashMap<>();
:this.globalStoreProvider=globalStateStoreProvider;
end
if (!globalStore.isEmpty()) then (yes) 
:return queryableStoreType.create(globalStoreProvider,
storeName);;
stop
endif 
:return queryableStoreType.create(new WrappingStoreProvider(storeProviders.values(),storeQueryParameters),storeName);;
stop
start
note right
void addStoreProviderForThread(final StringthreadName,final StreamThreadStateStoreProviderstreamThreadStateStoreProvider)
end note
:this.storeProviders.put(threadName,streamThreadStateStoreProvider);
end
start
note right
void removeStoreProviderForThread(final StringthreadName)
end note
:this.storeProviders.remove(threadName);
end
@enduml

