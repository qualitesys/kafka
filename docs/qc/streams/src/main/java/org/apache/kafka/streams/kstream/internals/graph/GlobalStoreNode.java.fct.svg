@startuml
!pragma layout smetana
start
note right
constructor GlobalStoreNode(final StoreBuilder<S>storeBuilder,
final StringsourceName,final Stringtopic,
final ConsumedInternal<KIn,VIn>consumed,final StringprocessorName,
final ProcessorSupplier<KIn,VIn,Void,Void>stateUpdateSupplier)
end note
:super (storeBuilder);
:this.sourceName=sourceName;
:this.topic=topic;
:this.consumed=consumed;
:this.processorName=processorName;
:this.stateUpdateSupplier=stateUpdateSupplier;
end
start
note right
void writeToTopology(final InternalTopologyBuildertopologyBuilder)
end note
:storeBuilder.withLoggingDisabled();
:topologyBuilder.addGlobalStore(storeBuilder,
sourceName,consumed.timestampExtractor(),
consumed.keyDeserializer(),consumed.valueDeserializer(),
topic,processorName,stateUpdateSupplier);
end
start
note right
StringtoString()
end note
:return "GlobalStoreNode{"+"sourceName='"+sourceName+'\''+",
 topic='"+topic+'\''+", processorName='"+processorName+'\''+"} ";;
stop
end
@enduml

