le="stroke:#181818;stroke-width:1.0;" x1="215" x2="215" y1="717.0195" y2="739.5859"/><polygon fill="#181818" points="211,729.5859,215,739.5859,219,729.5859,215,733.5859" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="215" x2="215" y1="801.4922" y2="821.4922"/><polygon fill="#181818" points="211,811.4922,215,821.4922,219,811.4922,215,815.4922" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[2b09dd3f5886d059c8cdb5ba0d292cc9]
@startuml
!pragma layout smetana
start
note right
constructor GlobalStoreNode(final StoreBuilder<S> storeBuilder,
final String sourceName,final String topic,
final ConsumedInternal<KIn,VIn> consumed,
final String processorName,final ProcessorSupplier<KIn,
VIn,Void,Void> stateUpdateSupplier)
end note
:super (storeBuilder);;
:this.sourceName=sourceName;;
:this.topic=topic;;
:this.consumed=consumed;;
:this.processorName=processorName;;
:this.stateUpdateSupplier=stateUpdateSupplier;;
end
start
note right
void writeToTopology(final InternalTopologyBuilder topologyBuilder)
end note
:storeBuilder.withLoggingDisabled();;
:topologyBuilder.addGlobalStore(storeBuilder,
sourceName,consumed.timestampExtractor(),
consumed.keyDeserializer(),consumed.valueDeserializer(),
topic,processorName,stateUpdateSupplier);;
end
start
note right
String toString()
end note
:return "GlobalStoreNode{"+"sourceName='"+
sourceName+'\''+", topic='"+topic+'\''+", processorName='"+
processorName+'\''+"} ";;
stop
end
@enduml

