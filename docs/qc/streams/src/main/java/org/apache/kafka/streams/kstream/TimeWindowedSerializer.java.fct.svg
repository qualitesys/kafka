@startuml
!pragma layout smetana
start
note right
constructor TimeWindowedSerializer()
end note
end
start
note right
constructor TimeWindowedSerializer(final Serializer<T>inner)
end note
:this.inner=inner;
end
start
note right
void configure(final Map<String,? >configs,
final booleanisKey)
end note
if (windowedInnerClassSerdeConfig!=null ) then (yes) 
:windowInnerClassSerde=Utils.newInstance(windowedInnerClassSerdeConfig,
Serde.class );
:throw new ConfigException(StreamsConfig.WINDOWED_INNER_CLASS_SERDE,windowedInnerClassSerdeConfig,"Serde class "+
windowedInnerClassSerdeConfig+" could not be found.");;
endif 
if (inner!=null &&windowedInnerClassSerdeConfig!=null ) then (yes) 
if (!inner.getClass().getName().equals(windowInnerClassSerde.serializer()
.getClass().getName())) then (yes) 
:throw new IllegalArgumentException("Inner class serializer set using constructor "+
"("+inner.getClass().getName()+")"+" is different from the one set in windowed.inner.class.serde config "+
"("+windowInnerClassSerde.serializer().getClass().getName()+
").");;
endif 
endif 
end
start
note right
byte[]serialize(final Stringtopic,final Windowed<T>data)
end note
:WindowedSerdes.verifyInnerSerializerNotNull(inner,
this);
if (data==null ) then (yes) 
:return null ;;
stop
endif 
:return WindowKeySchema.toBinary(data,inner,
topic);;
stop
end
start
note right
void close()
end note
if (inner!=null ) then (yes) 
:inner.close();
endif 
end
start
note right
byte[]serializeBaseKey(final Stringtopic,
final Windowed<T>data)
end note
:WindowedSerdes.verifyInnerSerializerNotNull(inner,
this);
:return inner.serialize(topic,data.key());;
stop
end
start
note right
Serializer<T>innerSerializer()
end note
:return inner;;
stop
end
@enduml

