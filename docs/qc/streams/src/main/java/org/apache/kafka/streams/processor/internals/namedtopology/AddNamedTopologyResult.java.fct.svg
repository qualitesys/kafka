@startuml
!pragma layout smetana
start
note right
constructor AddNamedTopologyResult(final KafkaFuture<Void>addTopologyFuture)
end note
end
start
note right
KafkaFuture<Void>all()
end note
:return addTopologyFuture;;
stop
end
start
note right
StreamsExceptionexceptionNow()
end note
:return null ;;
stop
if (e.getCause() instanceof StreamsException) then (yes) 
:return (StreamsException)e.getCause();;
stop
else (no)
:return new StreamsException(e.getCause());;
stop
endif 
:return null ;;
stop
end
@enduml

