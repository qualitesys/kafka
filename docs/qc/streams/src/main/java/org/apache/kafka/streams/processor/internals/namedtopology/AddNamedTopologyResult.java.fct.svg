@startuml
!pragma layout smetana
start
note right
constructor AddNamedTopologyResult(final KafkaFuture<Void>addTopologyFuture)
end note
:this.addTopologyFuture=addTopologyFuture;;
end
start
note right
KafkaFuture<Void>all()
end note
:return addTopologyFuture;;
stop
end
start
note right
StreamsExceptionexceptionNow()
end note
:try {addTopologyFuture.getNow(null );return null ;
:}catch (final ExecutionExceptione){if (e.getCause() instanceof StreamsException){return (StreamsException)e.getCause();
:}else {return new StreamsException(e.getCause());
:}}catch (final InterruptedExceptione){return null ;};
end
@enduml

