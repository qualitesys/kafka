@startuml
!pragma layout smetana
start
note right
constructor AddNamedTopologyResult(final KafkaFuture<Void> addTopologyFuture)
end note
:this.addTopologyFuture=addTopologyFuture;;
end
start
note right
KafkaFuture<Void> all()
end note
:return addTopologyFuture;;
stop
end
start
note right
StreamsException exceptionNow()
end note
switch (try/catch block)
case (try)
:addTopologyFuture.getNow(null );;
:return null ;;
stop
case (catch (final ExecutionException e))
if (e.getCause() instanceof StreamsException ) then (yes) 
:return (StreamsException )e.getCause();;
stop
else (no)
:return new StreamsException(e.getCause());;
stop
endif 
case (catch (final InterruptedException e))
:return null ;;
stop
endswitch
end
@enduml

