@startuml
!pragma layout smetana
start
note right
constructor TaskMovement(final TaskIdtask,
final UUIDdestination,final SortedSet<UUID>caughtUpClients)
end note
:this.task=task;
:this.destination=destination;
:this.caughtUpClients=caughtUpClients;
end
start
note right
TaskIdtask()
end note
:return task;;
stop
end
start
note right
intnumCaughtUpClients()
end note
:return caughtUpClients.size();;
stop
end
start
note right
booleantaskIsNotCaughtUpOnClientAndOtherMoreCaughtUpClientsExist(final TaskIdtask,
final UUIDclient,final Map<UUID,ClientState>clientStates,
final Map<TaskId,SortedSet<UUID>>tasksToCaughtUpClients,
final Map<TaskId,SortedSet<UUID>>tasksToClientByLag)
end note
if (taskIsCaughtUpOnClient(task,client,tasksToCaughtUpClients)) then (yes) 
:return false;;
stop
endif 
:return mostCaughtUpLag<clientLag;;
stop
end
start
note right
booleantaskIsCaughtUpOnClient(final TaskIdtask,
final UUIDclient,final Map<TaskId,SortedSet<UUID>>tasksToCaughtUpClients)
end note
:return caughtUpClients.contains(client);;
stop
end
start
note right
intassignActiveTaskMovements(final Map<TaskId,
SortedSet<UUID>>tasksToCaughtUpClients,final Map<TaskId,
SortedSet<UUID>>tasksToClientByLag,final Map<UUID,
ClientState>clientStates,final Map<UUID,Set<TaskId>>warmups,
final AtomicIntegerremainingWarmupReplicas)
end note
if (taskIsNotCaughtUpOnClientAndOtherMoreCaughtUpClientsExist(task,
client,clientStates,tasksToCaughtUpClients,
tasksToClientByLag)) then (yes) 
:taskMovements.add(new TaskMovement(task,
client,tasksToCaughtUpClients.get(task)));
endif 
:caughtUpClientsByTaskLoad.offer(client);
if (!moved) then (yes) 
:throw new IllegalStateException("Tried to move task to more caught-up client as scheduled before but none exist");;
endif 
:return movementsNeeded;;
stop
end
start
note right
intassignStandbyTaskMovements(final Map<TaskId,
SortedSet<UUID>>tasksToCaughtUpClients,final Map<TaskId,
SortedSet<UUID>>tasksToClientByLag,final Map<UUID,
ClientState>clientStates,final AtomicIntegerremainingWarmupReplicas,
final Map<UUID,Set<TaskId>>warmups)
end note
if (warmups.getOrDefault(destination,Collections.emptySet())
.contains(task)) then (yes) 
endif 
:caughtUpClientsByTaskLoad.offer(destination);
if (sourceClient==null ) then (yes) 
:sourceClient=mostCaughtUpEligibleClient(tasksToClientByLag,
eligibleClientPredicate,movement.task,movement.destination);
endif 
if (sourceClient==null ) then (yes) 
else (no)
:moveStandbyAndTryToWarmUp(remainingWarmupReplicas,
movement.task,clientStates.get(sourceClient),
clientStates.get(movement.destination));
:caughtUpClientsByTaskLoad.offerAll(asList(sourceClient,
movement.destination));
:movementsNeeded++;
endif 
:return movementsNeeded;;
stop
end
start
note right
booleantryToSwapStandbyAndActiveOnCaughtUpClient(final Map<UUID,
ClientState>clientStates,final ConstrainedPrioritySetcaughtUpClientsByTaskLoad,
final TaskMovementmovement)
end note
if (caughtUpStandbySourceClient!=null ) then (yes) 
:swapStandbyAndActive(movement.task,clientStates.get(caughtUpStandbySourceClient),
clientStates.get(movement.destination));
:caughtUpClientsByTaskLoad.offerAll(asList(caughtUpStandbySourceClient,
movement.destination));
:return true;;
stop
endif 
:return false;;
stop
end
start
note right
booleantryToMoveActiveToCaughtUpClientAndTryToWarmUp(final Map<UUID,
ClientState>clientStates,final Map<UUID,Set<TaskId>>warmups,
final AtomicIntegerremainingWarmupReplicas,
final ConstrainedPrioritySetcaughtUpClientsByTaskLoad,
final TaskMovementmovement)
end note
if (caughtUpSourceClient!=null ) then (yes) 
:moveActiveAndTryToWarmUp(remainingWarmupReplicas,
movement.task,clientStates.get(caughtUpSourceClient),
clientStates.get(movement.destination),warmups.computeIfAbsent(movement.destination,
x->new TreeSet<>()));
:caughtUpClientsByTaskLoad.offerAll(asList(caughtUpSourceClient,
movement.destination));
:return true;;
stop
endif 
:return false;;
stop
end
start
note right
booleantryToMoveActiveToMostCaughtUpClient(final Map<TaskId,
SortedSet<UUID>>tasksToClientByLag,final Map<UUID,
ClientState>clientStates,final Map<UUID,Set<TaskId>>warmups,
final AtomicIntegerremainingWarmupReplicas,
final ConstrainedPrioritySetcaughtUpClientsByTaskLoad,
final TaskMovementmovement)
end note
if (mostCaughtUpSourceClient!=null ) then (yes) 
if (clientStates.get(mostCaughtUpSourceClient)
.hasStandbyTask(movement.task)) then (yes) 
:swapStandbyAndActive(movement.task,clientStates.get(mostCaughtUpSourceClient),
clientStates.get(movement.destination));
else (no)
:moveActiveAndTryToWarmUp(remainingWarmupReplicas,
movement.task,clientStates.get(mostCaughtUpSourceClient),
clientStates.get(movement.destination),warmups.computeIfAbsent(movement.destination,
x->new TreeSet<>()));
endif 
:caughtUpClientsByTaskLoad.offerAll(asList(mostCaughtUpSourceClient,
movement.destination));
:return true;;
stop
endif 
:return false;;
stop
end
start
note right
void moveActiveAndTryToWarmUp(final AtomicIntegerremainingWarmupReplicas,
final TaskIdtask,final ClientStatesourceClientState,
final ClientStatedestinationClientState,final Set<TaskId>warmups)
end note
:sourceClientState.assignActive(task);
if (remainingWarmupReplicas.getAndDecrement()>0) then (yes) 
:destinationClientState.unassignActive(task);
:destinationClientState.assignStandby(task);
:warmups.add(task);
else (no)
:destinationClientState.unassignActive(task);
endif 
end
start
note right
void moveStandbyAndTryToWarmUp(final AtomicIntegerremainingWarmupReplicas,
final TaskIdtask,final ClientStatesourceClientState,
final ClientStatedestinationClientState)
end note
:sourceClientState.assignStandby(task);
if (remainingWarmupReplicas.getAndDecrement()>0) then (yes) 
else (no)
:destinationClientState.unassignStandby(task);
endif 
end
start
note right
void swapStandbyAndActive(final TaskIdtask,
final ClientStatesourceClientState,final ClientStatedestinationClientState)
end note
:sourceClientState.unassignStandby(task);
:sourceClientState.assignActive(task);
:destinationClientState.unassignActive(task);
:destinationClientState.assignStandby(task);
end
start
note right
UUIDmostCaughtUpEligibleClient(final Map<TaskId,
SortedSet<UUID>>tasksToClientByLag,final TaskIdtask,
final UUIDdestinationClient)
end note
:return mostCaughtUpEligibleClient(tasksToClientByLag,
client->true,task,destinationClient);;
stop
end
start
note right
UUIDmostCaughtUpEligibleClient(final Map<TaskId,
SortedSet<UUID>>tasksToClientByLag,final Function<UUID,
Boolean>constraint,final TaskIdtask,final UUIDdestinationClient)
end note
if (destinationClient.equals(client)) then (yes) 
endif 
:return null ;;
stop
end
@enduml

