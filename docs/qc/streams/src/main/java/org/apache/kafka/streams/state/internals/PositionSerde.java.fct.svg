@startuml
!pragma layout smetana
start
note right
constructor PositionSerde()
end note
end
start
note right
Positiondeserialize(final ByteBufferbuffer)
end note
:final byteversion=buffer.get();;
switch (switch (version))
endswith
end
start
note right
ByteBufferserialize(final Positionposition)
end note
:final byteversion=(byte)0;;
:intarraySize=Byte.SIZE;;
:final intnTopics=position.getTopics().size();;
:arraySize+=Integer.SIZE;;
:final ArrayList<String>entries=new ArrayList<>(position.getTopics());;
:final byte[][]topics=new byte[entries.size()][];;
:final Stringtopic=entries.get(i);;
:final byte[]topicBytes=topic.getBytes(StandardCharsets.UTF_8);;
:topics[i]=topicBytes;;
:arraySize+=Integer.SIZE;;
:arraySize+=topicBytes.length;;
:final Map<Integer,Long>partitionOffsets=position.getPartitionPositions(topic);;
:arraySize+=Integer.SIZE;;
:arraySize+=(Integer.SIZE+Long.SIZE)*partitionOffsets.size();;
:final ByteBufferbuffer=ByteBuffer.allocate(arraySize);;
:buffer.put(version);;
:buffer.putInt(nTopics);;
:buffer.putInt(topics[i].length);;
:buffer.put(topics[i]);;
:final Stringtopic=entries.get(i);;
:final Map<Integer,Long>partitionOffsets=position.getPartitionPositions(topic);;
:buffer.putInt(partitionOffsets.size());;
:buffer.putInt(partitionOffset.getKey());;
:buffer.putLong(partitionOffset.getValue());;
:buffer.flip();;
:return buffer;;
stop
end
@enduml

