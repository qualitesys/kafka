@startuml
!pragma layout smetana
start
note right
constructor TaskMigratedException(final Stringmessage)
end note
:super (message+"; it means all tasks belonging to this thread should be migrated.");
end
start
note right
constructor TaskMigratedException(final Stringmessage,
final Throwablethrowable)
end note
:super (message+"; it means all tasks belonging to this thread should be migrated.",
throwable);
end
@enduml

