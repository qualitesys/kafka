end note
:this.topicName=topicName;;
end
start
note right
Stringextract(final Kkey,final Vvalue,final RecordContextrecordContext)
end note
:return topicName;;
stop
end
start
note right
StringtoString()
end note
:return "StaticTopicNameExtractor("+topicName+
")";;
stop
end
start
note right
booleanequals(final Objecto)
end note
if (this==o) then (yes) 
:return true;;
stop
endif 
