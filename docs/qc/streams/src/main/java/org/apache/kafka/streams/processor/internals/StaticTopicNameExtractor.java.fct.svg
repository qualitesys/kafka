@startuml
!pragma layout smetana
start
note right
constructor StaticTopicNameExtractor(final StringtopicName)
end note
end
start
note right
Stringextract(final Kkey,final Vvalue,final RecordContextrecordContext)
end note
:return topicName;;
stop
end
start
note right
StringtoString()
end note
:return "StaticTopicNameExtractor("+topicName+
")";;
stop
end
start
note right
booleanequals(final Objecto)
end note
if (this==o) then (yes) 
:return true;;
stop
endif 
if (o==null ||getClass()!=o.getClass()) then (yes) 
:return false;;
stop
endif 
:return Objects.equals(topicName,that.topicName);;
stop
end
start
note right
inthashCode()
end note
:return Objects.hash(topicName);;
stop
end
@enduml

