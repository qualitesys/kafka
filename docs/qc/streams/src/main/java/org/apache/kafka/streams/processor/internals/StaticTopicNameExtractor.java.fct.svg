@startuml
!pragma layout smetana
start
note right
constructor StaticTopicNameExtractor(final String topicName)
end note
:this.topicName=topicName;;
end
start
note right
String extract(final K key,final V value,
final RecordContext recordContext)
end note
:return topicName;;
stop
end
start
note right
String toString()
end note
:return "StaticTopicNameExtractor("+topicName+
")";;
stop
end
start
note right
boolean equals(final Object o)
end note
if (this==o) then (yes) 
:return true;;
stop
endif 
if (o==null ||getClass()!=o.getClass()) then (yes) 
:return false;;
stop
endif 
:final StaticTopicNameExtractor<?,?> that=(StaticTopicNameExtractor<?,
?> )o;;
:return Objects.equals(topicName,that.topicName);;
stop
end
start
note right
int hashCode()
end note
:return Objects.hash(topicName);;
stop
end
@enduml

