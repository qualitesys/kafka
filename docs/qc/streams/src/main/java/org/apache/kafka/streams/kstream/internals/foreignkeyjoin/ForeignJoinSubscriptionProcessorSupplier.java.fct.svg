@startuml
!pragma layout smetana
start
note right
constructor ForeignJoinSubscriptionProcessorSupplier(final StoreBuilder<TimestampedKeyValueStore<Bytes,
SubscriptionWrapper<K>>>storeBuilder,final CombinedKeySchema<KO,
K>keySchema)
end note
end
start
note right
Processor<KO,Change<VO>,K,SubscriptionResponseWrapper<VO>>get()
end note
:return new KTableKTableJoinProcessor();;
stop
end
start
note right
void init(final ProcessorContext<K,SubscriptionResponseWrapper<VO>>context)
end note
end
start
note right
void process(final Record<KO,Change<VO>>record)
end note
if (record.key()==null ) then (yes) 
if (context().recordMetadata().isPresent()) then (yes) 
else (no)
endif 
:return ;;
stop
endif 
while (prefixScanResults.hasNext())
if (prefixEquals(next.key.get(),prefixBytes.get())) then (yes) 
endif 
endwhile
end
start
note right
booleanprefixEquals(final byte[]x,final byte[]y)
end note
:return xSlice.equals(ySlice);;
stop
end
@enduml

