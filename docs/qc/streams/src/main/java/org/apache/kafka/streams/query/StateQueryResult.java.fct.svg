,1151.6484" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[863831a521d6b10fb2d04ee91816aefb]
@startuml
!pragma layout smetana
start
note right
void setGlobalResult(final QueryResult<R>r)
end note
:this.globalResult=r;
end
start
note right
void addResult(final intpartition,final QueryResult<R>r)
end note
:partitionResults.put(partition,r);
end
start
note right
Map<Integer,QueryResult<R>>getPartitionResults()
end note
:return partitionResults;;
stop
end
start
note right
QueryResult<R>getOnlyPartitionResult()
end note
if (nonempty.size()!=1) then (yes) 
:throw new IllegalArgumentException("The query did not return exactly one partition result: "+partitionResults);;
else (no)
:return nonempty.get(0);;
stop
endif 
end
start
note right
QueryResult<R>getGlobalResult()
end note
:return globalResult;;
stop
end
start
note right
PositiongetPosition()
end note
if (globalResult!=null ) then (yes) 
