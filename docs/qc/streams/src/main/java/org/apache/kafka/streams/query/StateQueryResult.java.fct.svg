@startuml
!pragma layout smetana
start
note right
void setGlobalResult(final QueryResult<R>r)
end note
:this.globalResult=r;;
end
start
note right
void addResult(final intpartition,final QueryResult<R>r)
end note
:partitionResults.put(partition,r);;
end
start
note right
Map<Integer,QueryResult<R>>getPartitionResults()
end note
:return partitionResults;;
stop
end
start
note right
QueryResult<R>getOnlyPartitionResult()
end note
:final List<QueryResult<R>>nonempty=partitionResults.values()
.stream().filter(r->r.getResult()!=null ).collect(Collectors.toList());;
if (nonempty.size()!=1) then (yes) 
:throw new IllegalArgumentException("The query did not return exactly one partition result: "+
partitionResults);;
stop
else (no)
:return nonempty.get(0);;
stop
endif 
end
start
note right
QueryResult<R>getGlobalResult()
end note
:return globalResult;;
stop
end
start
note right
PositiongetPosition()
end note
if (globalResult!=null ) then (yes) 
:return globalResult.getPosition();;
stop
else (no)
:final Positionposition=Position.emptyPosition();;
:position.merge(r.getPosition());;
:return position;;
stop
endif 
end
start
note right
StringtoString()
end note
:return "StateQueryResult{"+"partitionResults="+
partitionResults+", globalResult="+globalResult+
'}';;
stop
end
@enduml

