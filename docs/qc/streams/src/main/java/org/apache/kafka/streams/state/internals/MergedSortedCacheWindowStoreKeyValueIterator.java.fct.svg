@startuml
!pragma layout smetana
start
note right
constructor MergedSortedCacheWindowStoreKeyValueIterator(final PeekingKeyValueIterator<Bytes,
LRUCacheEntry>filteredCacheIterator,final KeyValueIterator<Windowed<Bytes>,
byte[]>underlyingIterator,final StateSerdes<Bytes,
byte[]>serdes,final longwindowSize,final SegmentedCacheFunctioncacheFunction,
final booleanforward)
end note
end
start
note right
constructor MergedSortedCacheWindowStoreKeyValueIterator(final PeekingKeyValueIterator<Bytes,
LRUCacheEntry>filteredCacheIterator,final KeyValueIterator<Windowed<Bytes>,
byte[]>underlyingIterator,final StateSerdes<Bytes,
byte[]>serdes,final longwindowSize,final SegmentedCacheFunctioncacheFunction,
final booleanforward,final StoreKeyToWindowKeystoreKeyToWindowKey,
final WindowKeyToByteswindowKeyToBytes)
end note
end
start
note right
Windowed<Bytes>deserializeStoreKey(final Windowed<Bytes>key)
end note
:return key;;
stop
end
start
note right
KeyValue<Windowed<Bytes>,byte[]>deserializeStorePair(final KeyValue<Windowed<Bytes>,
byte[]>pair)
end note
:return pair;;
stop
end
start
note right
Windowed<Bytes>deserializeCacheKey(final BytescacheKey)
end note
:return storeKeyToWindowKey.toWindowKey(binaryKey,
windowSize,serdes.keyDeserializer(),serdes.topic());;
stop
end
start
note right
byte[]deserializeCacheValue(final LRUCacheEntrycacheEntry)
end note
:return cacheEntry.value();;
stop
end
start
note right
intcompare(final BytescacheKey,final Windowed<Bytes>storeKey)
end note
:return cacheFunction.compareSegmentedKeys(cacheKey,
storeKeyBytes);;
stop
end
