@startuml
!pragma layout smetana
start
note right
constructor MergedSortedCacheWindowStoreKeyValueIterator(final PeekingKeyValueIterator<Bytes,LRUCacheEntry>filteredCacheIterator,final KeyValueIterator<Windowed<Bytes>,byte[]>underlyingIterator,final StateSerdes<Bytes,byte[]>serdes,final longwindowSize,final SegmentedCacheFunctioncacheFunction,final booleanforward)
end note
:this(filteredCacheIterator,underlyingIterator,serdes,windowSize,cacheFunction,forward,WindowKeySchema::fromStoreKey,WindowKeySchema::toStoreKeyBinary);
end
start
note right
constructor MergedSortedCacheWindowStoreKeyValueIterator(final PeekingKeyValueIterator<Bytes,LRUCacheEntry>filteredCacheIterator,final KeyValueIterator<Windowed<Bytes>,byte[]>underlyingIterator,final StateSerdes<Bytes,byte[]>serdes,final longwindowSize,final SegmentedCacheFunctioncacheFunction,final booleanforward,final StoreKeyToWindowKeystoreKeyToWindowKey,final WindowKeyToByteswindowKeyToBytes)
end note
:super (filteredCacheIterator,underlyingIterator,forward);
:this.serdes=serdes;
:this.windowSize=windowSize;
:this.cacheFunction=cacheFunction;
:this.storeKeyToWindowKey=storeKeyToWindowKey;
:this.windowKeyToBytes=windowKeyToBytes;
end
start
note right
Windowed<Bytes>deserializeStoreKey(final Windowed<Bytes>key)
end note
:return key;;
stop
end
start
note right
KeyValue<Windowed<Bytes>,byte[]>deserializeStorePair(final KeyValue<Windowed<Bytes>,byte[]>pair)
end note
:return pair;;
stop
end
