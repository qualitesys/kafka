.3594,277,1400.3594" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[79d804c602914ee509024476688b5003]
@startuml
!pragma layout smetana
start
note right
constructor TaskAndAction(final Tasktask,
final TaskIdtaskId,final Actionaction)
end note
:this.task=task;
:this.taskId=taskId;
:this.action=action;
end
start
note right
TaskAndActioncreateAddTask(final Tasktask)
end note
:Objects.requireNonNull(task,"Task to add is null!");
:return new TaskAndAction(task,null ,Action.ADD);;
stop
end
start
note right
TaskAndActioncreateRemoveTask(final TaskIdtaskId)
end note
:Objects.requireNonNull(taskId,"Task ID of task to remove is null!");
:return new TaskAndAction(null ,taskId,Action.REMOVE);;
stop
end
start
note right
TaskgetTask()
end note
if (action!=Action.ADD) then (yes) 
:throw new IllegalStateException("Action type "+action+" cannot have a task!");;
endif 
:return task;;
stop
end
start
note right
TaskIdgetTaskId()
end note
if (action!=Action.REMOVE) then (yes) 
:throw new IllegalStateException("Action type "+action+" cannot have a task ID!");;
endif 
:return taskId;;
stop
end
start
note right
ActiongetAction()
end note
:return action;;
stop
end
