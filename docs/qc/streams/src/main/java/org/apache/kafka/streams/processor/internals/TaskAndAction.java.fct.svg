="stroke:#181818;stroke-width:1.0;" x1="226" x2="226" y1="1399.1641" y2="1419.1641"/><polygon fill="#181818" points="222,1409.1641,226,1419.1641,230,1409.1641,226,1413.1641" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[03ad85c55a4b87d7fd31d882d874f007]
@startuml
!pragma layout smetana
start
note right
constructor TaskAndAction(final Tasktask,final TaskIdtaskId,final Actionaction)
end note
:this.task=task;
:this.taskId=taskId;
:this.action=action;
end
start
note right
TaskAndActioncreateAddTask(final Tasktask)
end note
:Objects.requireNonNull(task,"Task to add is null!");
:return new TaskAndAction(task,null ,Action.ADD);;
stop
end
start
note right
TaskAndActioncreateRemoveTask(final TaskIdtaskId)
end note
:Objects.requireNonNull(taskId,"Task ID of task to remove is null!");
:return new TaskAndAction(null ,taskId,Action.REMOVE);;
stop
end
start
note right
TaskgetTask()
end note
if (action!=Action.ADD) then (yes) 
:throw new IllegalStateException("Action type "+
action+" cannot have a task!");;
endif 
:return task;;
stop
end
