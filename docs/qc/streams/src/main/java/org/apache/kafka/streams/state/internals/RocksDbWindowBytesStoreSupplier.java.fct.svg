@startuml
!pragma layout smetana
start
note right
constructor RocksDbWindowBytesStoreSupplier(final Stringname,
final longretentionPeriod,final longsegmentInterval,
final longwindowSize,final booleanretainDuplicates,
final booleanreturnTimestampedStore)
end note
:this(name,retentionPeriod,segmentInterval,
windowSize,retainDuplicates,returnTimestampedStore? WindowStoreTypes.TIMESTAMPED_WINDOW_STORE:WindowStoreTypes.DEFAULT_WINDOW_STORE);;
end
start
note right
constructor RocksDbWindowBytesStoreSupplier(final Stringname,
final longretentionPeriod,final longsegmentInterval,
final longwindowSize,final booleanretainDuplicates,
final WindowStoreTypeswindowStoreType)
end note
:this.name=name;;
:this.retentionPeriod=retentionPeriod;;
:this.segmentInterval=segmentInterval;;
:this.windowSize=windowSize;;
:this.retainDuplicates=retainDuplicates;;
:this.windowStoreType=windowStoreType;;
end
start
note right
Stringname()
end note
:return name;;
stop
end
start
note right
WindowStore<Bytes,byte[]>get()
end note
switch (switch (windowStoreType))
endswith
end
start
note right
StringmetricsScope()
end note
:return "rocksdb-window";;
stop
end
start
note right
longsegmentIntervalMs()
end note
:return segmentInterval;;
stop
end
start
note right
longwindowSize()
end note
:return windowSize;;
stop
end
start
note right
booleanretainDuplicates()
end note
:return retainDuplicates;;
stop
end
start
note right
longretentionPeriod()
end note
:return retentionPeriod;;
stop
end
start
note right
StringtoString()
end note
:return "RocksDbWindowBytesStoreSupplier{"+
"name='"+name+'\''+", retentionPeriod="+retentionPeriod+
", segmentInterval="+segmentInterval+", windowSize="+
windowSize+", retainDuplicates="+retainDuplicates+
", windowStoreType="+windowStoreType+'}';;
stop
end
@enduml

