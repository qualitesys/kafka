2="558.4219"/><polygon fill="#181818" points="3799,548.4219,3803,558.4219,3807,548.4219,3803,552.4219" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="3803" x2="3803" y1="610.9883" y2="633.5547"/><polygon fill="#181818" points="3799,623.5547,3803,633.5547,3807,623.5547,3803,627.5547" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="3803" x2="3803" y1="667.5234" y2="687.5234"/><polygon fill="#181818" points="3799,677.5234,3803,687.5234,3807,677.5234,3803,681.5234" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[d308311073e3f996253b9569bb5a908b]
@startuml
!pragma layout smetana
start
note right
constructor RecordDeserializer(final SourceNode<? ,
? >sourceNode,final DeserializationExceptionHandlerdeserializationExceptionHandler,
final LogContextlogContext,final SensordroppedRecordsSensor)
end note
:this.sourceNode=sourceNode;;
:this.deserializationExceptionHandler=deserializationExceptionHandler;;
:this.log=logContext.logger(RecordDeserializer.class );;
:this.droppedRecordsSensor=droppedRecordsSensor;;
end
start
note right
ConsumerRecord<Object,Object>deserialize(final ProcessorContext<? ,
? >processorContext,final ConsumerRecord<byte[],
byte[]>rawRecord)
end note
:try {return new ConsumerRecord<>(rawRecord.topic(),
rawRecord.partition(),rawRecord.offset(),
rawRecord.timestamp(),TimestampType.CREATE_TIME,
rawRecord.serializedKeySize(),rawRecord.serializedValueSize(),
sourceNode.deserializeKey(rawRecord.topic(),
rawRecord.headers(),rawRecord.key()),sourceNode.deserializeValue(rawRecord.topic(),
rawRecord.headers(),rawRecord.value()),rawRecord.headers(),
Optional.empty());}catch (final ExceptiondeserializationException){final DeserializationExceptionHandler.DeserializationHandlerResponseresponse;try {response=deserializationExceptionHandler.handle((InternalProcessorContext<? ,? >)processorContext,rawRecord,deserializationException);}catch (final ExceptionfatalUserException){log.error("Deserialization error callback failed after deserialization error for record {}",rawRecord,deserializationException);throw new StreamsException("Fatal user code error in deserialization error callback",fatalUserException);}if (response==DeserializationExceptionHandler.DeserializationHandlerResponse.FAIL){throw new StreamsException("Deserialization exception handler is set to fail upon"+" a deserialization error. If you would rather have the streaming pipeline"+" continue after a deserialization error, please set the "+DEFAULT_DESERIALIZATION_EXCEPTION_HANDLER_CLASS_CONFIG+" appropriately.",deserializationException);}else {log.warn("Skipping record due to deserialization error. topic=[{}] partition=[{}] offset=[{}]",rawRecord.topic(),rawRecord.partition(),rawRecord.offset(),deserializationException);droppedRecordsSensor.record();return null ;}};
end
start
note right
SourceNode<? ,? >sourceNode()
end note
:return sourceNode;;
stop
end
@enduml

