@startuml
!pragma layout smetana
start
note right
constructor RecordDeserializer(final SourceNode<? ,
? >sourceNode,final DeserializationExceptionHandlerdeserializationExceptionHandler,final LogContextlogContext,final SensordroppedRecordsSensor)
end note
:this.sourceNode=sourceNode;
:this.deserializationExceptionHandler=deserializationExceptionHandler;
:this.log=logContext.logger(RecordDeserializer.class );
:this.droppedRecordsSensor=droppedRecordsSensor;
end
start
note right
ConsumerRecord<Object,Object>deserialize(final ProcessorContext<? ,
? >processorContext,final ConsumerRecord<byte[],
byte[]>rawRecord)
end note
:return new ConsumerRecord<>(rawRecord.topic(),
rawRecord.partition(),rawRecord.offset(),
rawRecord.timestamp(),TimestampType.CREATE_TIME,
rawRecord.serializedKeySize(),rawRecord.serializedValueSize(),
sourceNode.deserializeKey(rawRecord.topic(),
rawRecord.headers(),rawRecord.key()),sourceNode.deserializeValue(rawRecord.topic(),rawRecord.headers(),rawRecord.value()),rawRecord.headers(),Optional.empty());;
stop
:response=deserializationExceptionHandler.handle((InternalProcessorContext<? ,
? >)processorContext,rawRecord,deserializationException);
:log.error("Deserialization error callback failed after deserialization error for record {}",rawRecord,deserializationException);
:throw new StreamsException("Fatal user code error in deserialization error callback",fatalUserException);;
if (response==DeserializationExceptionHandler.DeserializationHandlerResponse.FAIL) then (yes) 
:throw new StreamsException("Deserialization exception handler is set to fail upon"+" a deserialization error. If you would rather have the streaming pipeline"+" continue after a deserialization error, please set the "+DEFAULT_DESERIALIZATION_EXCEPTION_HANDLER_CLASS_CONFIG+" appropriately.",deserializationException);;
else (no)
:log.warn("Skipping record due to deserialization error. topic=[{}] partition=[{}] offset=[{}]",rawRecord.topic(),rawRecord.partition(),rawRecord.offset(),deserializationException);
:droppedRecordsSensor.record();
:return null ;;
stop
endif 
end
start
note right
SourceNode<? ,? >sourceNode()
end note
:return sourceNode;;
stop
end
@enduml

