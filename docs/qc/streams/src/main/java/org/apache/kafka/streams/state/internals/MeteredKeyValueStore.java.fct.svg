@startuml
!pragma layout smetana
start
note right
constructor MeteredKeyValueStore(final KeyValueStore<Bytes,
byte[]>inner,final StringmetricsScope,final Timetime,
final Serde<K>keySerde,final Serde<V>valueSerde)
end note
:super (inner);
:this.metricsScope=metricsScope;
:this.time=time!=null ? time:Time.SYSTEM;
:this.keySerde=keySerde;
:this.valueSerde=valueSerde;
end
start
note right
void init(final ProcessorContextcontext,final StateStoreroot)
end note
:this.context=context instanceof InternalProcessorContext? (InternalProcessorContext)context:null ;
:taskId=context.taskId();
:initStoreSerde(context);
:streamsMetrics=(StreamsMetricsImpl)context.metrics();
:registerMetrics();
:maybeMeasureLatency(()->super .init(context,
root),time,restoreSensor);
end
start
note right
void init(final StateStoreContextcontext,
final StateStoreroot)
end note
:this.context=context instanceof InternalProcessorContext? (InternalProcessorContext<? ,
? >)context:null ;
:taskId=context.taskId();
:initStoreSerde(context);
:streamsMetrics=(StreamsMetricsImpl)context.metrics();
:registerMetrics();
:maybeMeasureLatency(()->super .init(context,
root),time,restoreSensor);
end
start
note right
void registerMetrics()
end note
:putSensor=StateStoreMetrics.putSensor(taskId.toString(),
metricsScope,name(),streamsMetrics);
:putIfAbsentSensor=StateStoreMetrics.putIfAbsentSensor(taskId.toString(),
metricsScope,name(),streamsMetrics);
:putAllSensor=StateStoreMetrics.putAllSensor(taskId.toString(),
metricsScope,name(),streamsMetrics);
:getSensor=StateStoreMetrics.getSensor(taskId.toString(),
metricsScope,name(),streamsMetrics);
:allSensor=StateStoreMetrics.allSensor(taskId.toString(),
metricsScope,name(),streamsMetrics);
:rangeSensor=StateStoreMetrics.rangeSensor(taskId.toString(),
metricsScope,name(),streamsMetrics);
:prefixScanSensor=StateStoreMetrics.prefixScanSensor(taskId.toString(),
metricsScope,name(),streamsMetrics);
:flushSensor=StateStoreMetrics.flushSensor(taskId.toString(),
metricsScope,name(),streamsMetrics);
:deleteSensor=StateStoreMetrics.deleteSensor(taskId.toString(),
metricsScope,name(),streamsMetrics);
:e2eLatencySensor=StateStoreMetrics.e2ELatencySensor(taskId.toString(),
metricsScope,name(),streamsMetrics);
end
start
note right
Serde<V>prepareValueSerdeForStore(final Serde<V>valueSerde,
final SerdeGettergetter)
end note
:return WrappingNullableUtils.prepareValueSerde(valueSerde,
getter);;
stop
end
start
note right
void initStoreSerde(final ProcessorContextcontext)
end note
:serdes=new StateSerdes<>(changelogTopic,
prepareKeySerde(keySerde,new SerdeGetter(context)),
prepareValueSerdeForStore(valueSerde,new SerdeGetter(context)));
end
start
note right
void initStoreSerde(final StateStoreContextcontext)
end note
:serdes=new StateSerdes<>(changelogTopic,
prepareKeySerde(keySerde,new SerdeGetter(context)),
prepareValueSerdeForStore(valueSerde,new SerdeGetter(context)));
end
start
note right
booleansetFlushListener(final CacheFlushListener<K,
V>listener,final booleansendOldValues)
end note
if (wrapped instanceof CachedStateStore) then (yes) 
:return ((CachedStateStore<byte[],byte[]>)wrapped)
.setFlushListener(record->listener.apply(record.withKey(serdes.keyFrom(record.key()))
.withValue(new Change<>(record.value().newValue!=null ? serdes.valueFrom(record.value().newValue):null ,
record.value().oldValue!=null ? serdes.valueFrom(record.value().oldValue):null ))),
sendOldValues);;
stop
endif 
:return false;;
stop
end
if (handler==null ) then (yes) 
:result=wrapped().query(query,positionBound,
config);
if (config.isCollectExecutionInfo()) then (yes) 
:result.addExecutionInfo("Handled in "+getClass()+
" in "+(time.nanoseconds()-start)+"ns");
endif 
else (no)
:result=(QueryResult<R>)handler.apply(query,
positionBound,config,this);
if (config.isCollectExecutionInfo()) then (yes) 
:result.addExecutionInfo("Handled in "+getClass()+
" with serdes "+serdes+" in "+(time.nanoseconds()-start)+
"ns");
endif 
endif 
:return result;;
stop
start
note right
PositiongetPosition()
end note
:return wrapped().getPosition();;
stop
end
if (typedQuery.getLowerBound().isPresent()&&typedQuery.getUpperBound()
.isPresent()) then (yes) 
:rawRangeQuery=RangeQuery.withRange(keyBytes(typedQuery.getLowerBound().get()),
keyBytes(typedQuery.getUpperBound().get()));
else (no)
:rawRangeQuery=RangeQuery.withNoBounds();
endif 
if (rawResult.isSuccess()) then (yes) 
:result=(QueryResult<R>)typedQueryResult;
else (no)
:result=(QueryResult<R>)rawResult;
endif 
:return result;;
stop
if (rawResult.isSuccess()) then (yes) 
:result=(QueryResult<R>)typedQueryResult;
else (no)
:result=(QueryResult<R>)rawResult;
endif 
:return result;;
stop
start
note right
Vget(final Kkey)
end note
:Objects.requireNonNull(key,"key cannot be null");
:return maybeMeasureLatency(()->outerValue(wrapped().get(keyBytes(key))),
time,getSensor);;
stop
:throw new ProcessorStateException(message,e);;
end
start
note right
void put(final Kkey,final Vvalue)
end note
:Objects.requireNonNull(key,"key cannot be null");
:maybeMeasureLatency(()->wrapped().put(keyBytes(key),
serdes.rawValue(value)),time,putSensor);
:maybeRecordE2ELatency();
:throw new ProcessorStateException(message,e);;
end
start
note right
VputIfAbsent(final Kkey,final Vvalue)
end note
:Objects.requireNonNull(key,"key cannot be null");
:maybeRecordE2ELatency();
:return currentValue;;
stop
end
start
note right
void putAll(final List<KeyValue<K,V>>entries)
end note
:entries.forEach(entry->Objects.requireNonNull(entry.key,
"key cannot be null"));
:maybeMeasureLatency(()->wrapped().putAll(innerEntries(entries)),
time,putAllSensor);
end
start
note right
Vdelete(final Kkey)
end note
:Objects.requireNonNull(key,"key cannot be null");
:return maybeMeasureLatency(()->outerValue(wrapped().delete(keyBytes(key))),
time,deleteSensor);;
stop
:throw new ProcessorStateException(message,e);;
end
:Objects.requireNonNull(prefix,"prefix cannot be null");
:Objects.requireNonNull(prefixKeySerializer,
"prefixKeySerializer cannot be null");
:return new MeteredKeyValueIterator(wrapped().prefixScan(prefix,
prefixKeySerializer),prefixScanSensor);;
stop
start
note right
KeyValueIterator<K,V>range(final Kfrom,final Kto)
end note
:return new MeteredKeyValueIterator(wrapped().range(Bytes.wrap(serFrom),
Bytes.wrap(serTo)),rangeSensor);;
stop
end
start
note right
KeyValueIterator<K,V>reverseRange(final Kfrom,
final Kto)
end note
:return new MeteredKeyValueIterator(wrapped().reverseRange(Bytes.wrap(serFrom),
Bytes.wrap(serTo)),rangeSensor);;
stop
end
start
note right
KeyValueIterator<K,V>all()
end note
:return new MeteredKeyValueIterator(wrapped().all(),
allSensor);;
stop
end
start
note right
KeyValueIterator<K,V>reverseAll()
end note
:return new MeteredKeyValueIterator(wrapped().reverseAll(),
allSensor);;
stop
end
start
note right
void flush()
end note
:maybeMeasureLatency(super ::flush,time,flushSensor);
end
start
note right
longapproximateNumEntries()
end note
:return wrapped().approximateNumEntries();;
stop
end
start
note right
void close()
end note
:wrapped().close();
:streamsMetrics.removeAllStoreLevelSensorsAndMetrics(taskId.toString(),
name());
end
start
note right
VouterValue(final byte[]value)
end note
:return value!=null ? serdes.valueFrom(value):null ;;
stop
end
start
note right
ByteskeyBytes(final Kkey)
end note
:return Bytes.wrap(serdes.rawKey(key));;
stop
end
start
note right
List<KeyValue<Bytes,byte[]>>innerEntries(final List<KeyValue<K,
V>>from)
end note
:byteEntries.add(KeyValue.pair(Bytes.wrap(serdes.rawKey(entry.key)),
serdes.rawValue(entry.value)));
:return byteEntries;;
stop
end
start
note right
void maybeRecordE2ELatency()
end note
if (e2eLatencySensor.shouldRecord()&&context!=null ) then (yes) 
:e2eLatencySensor.record(e2eLatency,currentTime);
endif 
end
start
note right
constructor MeteredKeyValueIterator(final KeyValueIterator<Bytes,
byte[]>iter,final Sensorsensor)
end note
:this.iter=iter;
:this.sensor=sensor;
:this.startNs=time.nanoseconds();
end
start
note right
booleanhasNext()
end note
:return iter.hasNext();;
stop
end
start
note right
KeyValue<K,V>next()
end note
:return KeyValue.pair(serdes.keyFrom(keyValue.key.get()),
outerValue(keyValue.value));;
stop
end
start
note right
void close()
end note
:iter.close();
:sensor.record(time.nanoseconds()-startNs);
end
start
note right
KpeekNextKey()
end note
:return serdes.keyFrom(iter.peekNextKey()
.get());;
stop
end
start
note right
constructor MeteredKeyValueTimestampedIterator(final KeyValueIterator<Bytes,
byte[]>iter,final Sensorsensor,final Function<byte[],
V>valueDeserializer)
end note
:this.iter=iter;
:this.sensor=sensor;
:this.valueDeserializer=valueDeserializer;
:this.startNs=time.nanoseconds();
end
start
note right
booleanhasNext()
end note
:return iter.hasNext();;
stop
end
start
note right
KeyValue<K,V>next()
end note
:return KeyValue.pair(serdes.keyFrom(keyValue.key.get()),
valueDeserializer.apply(keyValue.value));;
stop
end
start
note right
void close()
end note
:iter.close();
:sensor.record(time.nanoseconds()-startNs);
end
start
note right
KpeekNextKey()
end note
:return serdes.keyFrom(iter.peekNextKey()
.get());;
stop
end
