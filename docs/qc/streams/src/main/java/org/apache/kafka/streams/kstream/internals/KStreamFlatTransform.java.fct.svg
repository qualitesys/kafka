@startuml
!pragma layout smetana
start
note right
constructor KStreamFlatTransform(final TransformerSupplier<? super KIn,
? super VIn,Iterable<KeyValue<KOut,VOut>>>transformerSupplier)
end note
end
start
note right
Processor<KIn,VIn,KOut,VOut>get()
end note
:return new KStreamFlatTransformProcessor<>(transformerSupplier.get());;
stop
end
start
note right
Set<StoreBuilder<? >>stores()
end note
:return transformerSupplier.stores();;
stop
end
start
note right
constructor KStreamFlatTransformProcessor(final Transformer<? super KIn,
? super VIn,Iterable<KeyValue<KOut,VOut>>>transformer)
end note
end
start
note right
void init(final ProcessorContext<KOut,VOut>context)
end note
end
start
note right
void process(final Record<KIn,VIn>record)
end note
if (pairs!=null ) then (yes) 
endif 
end
start
note right
void close()
end note
end
@enduml

