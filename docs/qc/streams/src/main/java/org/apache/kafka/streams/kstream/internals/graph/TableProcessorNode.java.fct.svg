@startuml
!pragma layout smetana
start
note right
constructor TableProcessorNode(final StringnodeName,
final ProcessorParameters<K,V,? ,? >processorParameters,
final StoreBuilder<TimestampedKeyValueStore<K,
V>>storeBuilder)
end note
:this(nodeName,processorParameters,storeBuilder,
null );
end
start
note right
constructor TableProcessorNode(final StringnodeName,
final ProcessorParameters<K,V,? ,? >processorParameters,
final StoreBuilder<TimestampedKeyValueStore<K,
V>>storeBuilder,final String[]storeNames)
end note
:super (nodeName);
:this.processorParameters=processorParameters;
:this.storeBuilder=storeBuilder;
:this.storeNames=storeNames!=null ? storeNames:new String[]{};
end
start
note right
StringtoString()
end note
:return "TableProcessorNode{"+", processorParameters="+processorParameters+",
 storeBuilder="+(storeBuilder==null ? String.valueOf("null"):storeBuilder.name())+", storeNames="+Arrays.toString(storeNames)+"} "+super .toString();;
stop
end
start
note right
void writeToTopology(final InternalTopologyBuildertopologyBuilder)
end note
:topologyBuilder.addProcessor(processorName,
processorParameters.processorSupplier(),parentNodeNames());
if (storeNames.length>0) then (yes) 
:topologyBuilder.connectProcessorAndStateStores(processorName,
storeNames);
endif 
if (processorParameters.kTableSourceSupplier()!=null ) then (yes) 
if (processorParameters.kTableSourceSupplier().materialized()) then (yes) 
:topologyBuilder.addStateStore(Objects.requireNonNull(storeBuilder,
"storeBuilder was null"),processorName);
endif 
endif 
end
