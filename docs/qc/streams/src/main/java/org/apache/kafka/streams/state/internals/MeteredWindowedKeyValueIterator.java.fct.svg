@startuml
!pragma layout smetana
start
note right
constructor MeteredWindowedKeyValueIterator(final KeyValueIterator<Windowed<Bytes>,
byte[]>iter,final Sensorsensor,final StreamsMetricsmetrics,
final Function<byte[],K>deserializeKey,final Function<byte[],
V>deserializeValue,final Timetime)
end note
:this.iter=iter;
:this.sensor=sensor;
:this.metrics=metrics;
:this.deserializeKey=deserializeKey;
:this.deserializeValue=deserializeValue;
:this.startNs=time.nanoseconds();
:this.time=time;
end
start
note right
booleanhasNext()
end note
:return iter.hasNext();;
stop
end
start
note right
KeyValue<Windowed<K>,V>next()
end note
:return KeyValue.pair(windowedKey(next.key),
deserializeValue.apply(next.value));;
stop
end
start
note right
Windowed<K>windowedKey(final Windowed<Bytes>bytesKey)
end note
:return new Windowed<>(key,bytesKey.window());;
stop
end
start
note right
void close()
end note
:iter.close();
:sensor.record(time.nanoseconds()-startNs);
end
start
note right
Windowed<K>peekNextKey()
end note
:return windowedKey(iter.peekNextKey());;
stop
end
@enduml

