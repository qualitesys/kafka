@startuml
!pragma layout smetana
start
note right
constructor BaseJoinProcessorNode(final StringnodeName,
final ValueJoinerWithKey<? super K,? super V1,
? super V2,?  extends VR>valueJoiner,final ProcessorParameters<K,
V1,? ,? >joinThisProcessorParameters,final ProcessorParameters<K,
V2,? ,? >joinOtherProcessorParameters,final ProcessorParameters<K,
VR,? ,? >joinMergeProcessorParameters,final StringthisJoinSideNodeName,
final StringotherJoinSideNodeName)
end note
:super (nodeName);
:this.valueJoiner=valueJoiner;
:this.joinThisProcessorParameters=joinThisProcessorParameters;
:this.joinOtherProcessorParameters=joinOtherProcessorParameters;
:this.joinMergeProcessorParameters=joinMergeProcessorParameters;
:this.thisJoinSideNodeName=thisJoinSideNodeName;
:this.otherJoinSideNodeName=otherJoinSideNodeName;
end
start
note right
ProcessorParameters<K,V1,? ,? >thisProcessorParameters()
end note
:return joinThisProcessorParameters;;
stop
end
start
note right
ProcessorParameters<K,V2,? ,? >otherProcessorParameters()
end note
:return joinOtherProcessorParameters;;
stop
end
start
note right
ProcessorParameters<K,VR,? ,? >mergeProcessorParameters()
end note
:return joinMergeProcessorParameters;;
stop
end
start
note right
StringthisJoinSideNodeName()
end note
:return thisJoinSideNodeName;;
stop
end
start
note right
StringotherJoinSideNodeName()
end note
:return otherJoinSideNodeName;;
stop
end
start
note right
StringtoString()
end note
:return "BaseJoinProcessorNode{"+"joinThisProcessorParameters="+
joinThisProcessorParameters+", joinOtherProcessorParameters="+
joinOtherProcessorParameters+", joinMergeProcessorParameters="+
joinMergeProcessorParameters+", valueJoiner="+
valueJoiner+", thisJoinSideNodeName='"+thisJoinSideNodeName+
'\''+", otherJoinSideNodeName='"+otherJoinSideNodeName+
'\''+"} "+super .toString();;
stop
end
@enduml

