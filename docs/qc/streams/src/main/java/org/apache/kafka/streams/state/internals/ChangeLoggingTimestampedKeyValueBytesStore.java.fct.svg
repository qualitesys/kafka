@startuml
!pragma layout smetana
start
note right
constructor ChangeLoggingTimestampedKeyValueBytesStore(final KeyValueStore<Bytes,
byte[]> inner)
end note
:super (inner);;
end
start
note right
void log(final Bytes key,final byte[] valueAndTimestamp)
end note
if (valueAndTimestamp!=null ) then (yes) 
:context.logChange(name(),key,rawValue(valueAndTimestamp),
timestamp(valueAndTimestamp),wrapped().getPosition());;
else (no)
:context.logChange(name(),key,null ,context.timestamp(),
wrapped().getPosition());;
endif 
end
@enduml

