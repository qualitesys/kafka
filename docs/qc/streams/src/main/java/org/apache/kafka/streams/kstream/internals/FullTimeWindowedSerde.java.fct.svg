@startuml
!pragma layout smetana
start
note right
constructor FullTimeWindowedSerde(final Serde<T> inner,
final long windowSize)
end note
:super (new TimeWindowedSerializer<>(inner.serializer()),
new TimeWindowedDeserializer<>(inner.deserializer(),
windowSize));;
end
@enduml

