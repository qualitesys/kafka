@startuml
!pragma layout smetana
start
note right
constructor StandbyTaskAssignorFactory()
end note
end
start
note right
StandbyTaskAssignorcreate(final AssignorConfiguration.AssignmentConfigsconfigs)
end note
if (!configs.rackAwareAssignmentTags.isEmpty()) then (yes) 
:return new ClientTagAwareStandbyTaskAssignor();;
stop
else (no)
:return new DefaultStandbyTaskAssignor();;
stop
endif 
end
@enduml

