@startuml
!pragma layout smetana
start
note right
constructor KTableSuppressProcessorSupplier(final SuppressedInternal<K>suppress,
final StringstoreName,final KTableImpl<K,
? ,V>parentKTable)
end note
:this.suppress=suppress;;
:this.storeName=storeName;;
:this.parentKTable=parentKTable;;
:parentKTable.enableSendingOldValues(true);;
end
start
note right
Processor<K,Change<V>,K,Change<V>>get()
end note
:return new KTableSuppressProcessor<>(suppress,
storeName);;
stop
end
start
note right
KTableValueGetterSupplier<K,V>view()
end note
:final KTableValueGetterSupplier<K,V>parentValueGetterSupplier=parentKTable.valueGetterSupplier();;
:return new KTableValueGetterSupplier<K,V>(){@Override public KTableValueGetter<K,
V>get(){final KTableValueGetter<K,V>parentGetter=parentValueGetterSupplier.get();return new KTableValueGetter<K,
V>(){private TimeOrderedKeyValueBuffer<K,
V>buffer;@Override public void init(final ProcessorContext<? ,
? >context){parentGetter.init(context);buffer=requireNonNull(context.getStateStore(storeName));}@Override public ValueAndTimestamp<V>get(final Kkey){final Maybe<ValueAndTimestamp<V>>maybeValue=buffer.priorValueForBuffered(key);if (maybeValue.isDefined()){return maybeValue.getNullableValue();}else {return parentGetter.get(key);}}@Override public void close(){parentGetter.close();}};}@Override public String[]storeNames(){final String[]parentStores=parentValueGetterSupplier.storeNames();final String[]stores=new String[1+parentStores.length];System.arraycopy(parentStores,0,stores,1,parentStores.length);stores[0]=storeName;return stores;}};;
stop
end
start
note right
booleanenableSendingOldValues(final booleanforceMaterialization)
end note
:return parentKTable.enableSendingOldValues(forceMaterialization);;
stop
end
start
note right
constructor KTableSuppressProcessor(final SuppressedInternal<K>suppress,
final StringstoreName)
end note
:this.storeName=storeName;;
:requireNonNull(suppress);;
:maxRecords=suppress.bufferConfig().maxRecords();;
:maxBytes=suppress.bufferConfig().maxBytes();;
:suppressDurationMillis=suppress.timeToWaitForMoreEvents()
.toMillis();;
:bufferTimeDefinition=suppress.timeDefinition();;
:bufferFullStrategy=suppress.bufferConfig()
.bufferFullStrategy();;
:safeToDropTombstones=suppress.safeToDropTombstones();;
end
start
note right
void init(final ProcessorContext<K,Change<V>>context)
end note
:super .init(context);;
:internalProcessorContext=(InternalProcessorContext<K,
Change<V>>)context;;
:suppressionEmitSensor=ProcessorNodeMetrics.suppressionEmitSensor(Thread.currentThread().getName(),
context.taskId().toString(),internalProcessorContext.currentNode().name(),
internalProcessorContext.metrics());;
:buffer=requireNonNull(context.getStateStore(storeName));;
:buffer.setSerdesIfNull(new SerdeGetter(context));;
end
start
note right
void process(final Record<K,Change<V>>record)
end note
:observedStreamTime=Math.max(observedStreamTime,
record.timestamp());;
:buffer(record);;
:enforceConstraints();;
end
start
note right
void buffer(final Record<K,Change<V>>record)
end note
:final longbufferTime=bufferTimeDefinition.time(internalProcessorContext,
record.key());;
:buffer.put(bufferTime,record,internalProcessorContext.recordContext());;
end
start
note right
void enforceConstraints()
end note
:final longstreamTime=observedStreamTime;;
:final longexpiryTime=streamTime-suppressDurationMillis;;
:buffer.evictWhile(()->buffer.minTimestamp()<=expiryTime,
this::emit);;
if (overCapacity()) then (yes) 
switch (switch (bufferFullStrategy))
endswith
endif 
end
start
note right
booleanoverCapacity()
end note
:return buffer.numRecords()>maxRecords||buffer.bufferSize()>maxBytes;;
stop
end
start
note right
void emit(final TimeOrderedKeyValueBuffer.Eviction<K,
V>toEmit)
end note
if (shouldForward(toEmit.value())) then (yes) 
:final ProcessorRecordContextprevRecordContext=internalProcessorContext.recordContext();;
:internalProcessorContext.setRecordContext(toEmit.recordContext());;
:try ;
:internalProcessorContext.forward(toEmit.record()
.withTimestamp(toEmit.recordContext().timestamp()).withHeaders(toEmit.recordContext().headers()));;
:suppressionEmitSensor.record(1.0d,internalProcessorContext.currentSystemTimeMs());;
endif 
end
start
note right
booleanshouldForward(final Change<V>value)
end note
:return value.newValue!=null ||!safeToDropTombstones;;
stop
end
@enduml

