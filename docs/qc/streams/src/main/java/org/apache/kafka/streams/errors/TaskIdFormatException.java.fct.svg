@startuml
!pragma layout smetana
start
note right
constructor TaskIdFormatException(final Stringmessage)
end note
:super ("Task id cannot be parsed correctly"+
(message==null ? String.valueOf(""):String.valueOf(" from ")+
message));
end
start
note right
constructor TaskIdFormatException(final Stringmessage,
final Throwablethrowable)
end note
:super ("Task id cannot be parsed correctly"+
(message==null ? String.valueOf(""):String.valueOf(" from ")+
message),throwable);
end
start
note right
constructor TaskIdFormatException(final Throwablethrowable)
end note
:super (throwable);
end
@enduml

