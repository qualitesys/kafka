@startuml
!pragma layout smetana
start
note right
Cancellable schedule(final PunctuationSchedule sched)
end note
:synchronized (pq){pq.add(sched);};
:return sched.cancellable();;
stop
end
start
note right
void close()
end note
:synchronized (pq){pq.clear();};
end
start
note right
boolean mayPunctuate(final long timestamp,
final PunctuationType type,final ProcessorNodePunctuator processorNodePunctuator)
end note
:synchronized (pq){boolean punctuated=false;
:PunctuationSchedule top=pq.peek();while (top!=null &&top.timestamp<=timestamp){final PunctuationSchedule sched=top;pq.poll();if (!sched.isCancelled()){processorNodePunctuator.punctuate(sched.node(),
timestamp,type,sched.punctuator());if (!sched.isCancelled()){pq.add(sched.next(timestamp));}punctuated=true;}top=pq.peek();}return punctuated;};
end
@enduml

