@startuml
!pragma layout smetana
start
note right
Cancellableschedule(final PunctuationSchedulesched)
end note
:synchronized (pq){pq.add(sched);};
:return sched.cancellable();;
stop
end
start
note right
void close()
end note
:synchronized (pq){pq.clear();};
end
start
note right
booleanmayPunctuate(final longtimestamp,final PunctuationTypetype,
final ProcessorNodePunctuatorprocessorNodePunctuator)
end note
:synchronized (pq){booleanpunctuated=false;
:PunctuationScheduletop=pq.peek();while (top!=null &&top.timestamp<=timestamp){final PunctuationSchedulesched=top;pq.poll();if (!sched.isCancelled()){processorNodePunctuator.punctuate(sched.node(),
timestamp,type,sched.punctuator());if (!sched.isCancelled()){pq.add(sched.next(timestamp));}punctuated=true;}top=pq.peek();}return punctuated;};
end
@enduml

