@startuml
!pragma layout smetana
start
note right
Cancellableschedule(final PunctuationSchedulesched)
end note
:pq.add(sched);
:return sched.cancellable();;
stop
end
start
note right
void close()
end note
:pq.clear();
end
start
note right
booleanmayPunctuate(final longtimestamp,final PunctuationTypetype,
final ProcessorNodePunctuatorprocessorNodePunctuator)
end note
while (top!=null &&top.timestamp<=timestamp)
:pq.poll();
if (!sched.isCancelled()) then (yes) 
:processorNodePunctuator.punctuate(sched.node(),
timestamp,type,sched.punctuator());
if (!sched.isCancelled()) then (yes) 
:pq.add(sched.next(timestamp));
endif 
:punctuated=true;
endif 
:top=pq.peek();
endwhile
:return punctuated;;
stop
end
@enduml

