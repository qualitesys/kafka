@startuml
!pragma layout smetana
start
note right
constructor TransformerSupplierAdapter(final TransformerSupplier<KIn,VIn,KeyValue<KOut,VOut>>transformerSupplier)
end note
:this.transformerSupplier=transformerSupplier;
end
start
note right
Transformer<KIn,VIn,Iterable<KeyValue<KOut,VOut>>>get()
end note
:return new Transformer<KIn,VIn,Iterable<KeyValue<KOut,
VOut>>>(){private final Transformer<KIn,VIn,
KeyValue<KOut,VOut>>transformer=transformerSupplier.get();@Override public void init(final ProcessorContextcontext){transformer.init(context);}@Override public Iterable<KeyValue<KOut,VOut>>transform(final KInkey,final VInvalue){final KeyValue<KOut,VOut>pair=transformer.transform(key,value);if (pair!=null ){return Collections.singletonList(pair);}return Collections.emptyList();}@Override public void close(){transformer.close();}};;
stop
end
start
note right
Set<StoreBuilder<? >>stores()
end note
:return transformerSupplier.stores();;
stop
end
@enduml

