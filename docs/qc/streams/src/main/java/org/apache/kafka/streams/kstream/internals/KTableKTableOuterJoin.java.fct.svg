@startuml
!pragma layout smetana
start
note right
constructor KTableKTableOuterJoin(final KTableImpl<K,
? ,V1>table1,final KTableImpl<K,? ,V2>table2,
final ValueJoiner<? super V1,? super V2,?  extends VOut>joiner)
end note
:super (table1,table2,joiner);
end
start
note right
Processor<K,Change<V1>,K,Change<VOut>>get()
end note
:return new KTableKTableOuterJoinProcessor(valueGetterSupplier2.get());;
stop
end
start
note right
KTableValueGetterSupplier<K,VOut>view()
end note
:return new KTableKTableOuterJoinValueGetterSupplier(valueGetterSupplier1,
valueGetterSupplier2);;
stop
end
start
note right
constructor KTableKTableOuterJoinValueGetterSupplier(final KTableValueGetterSupplier<K,
V1>valueGetterSupplier1,final KTableValueGetterSupplier<K,
V2>valueGetterSupplier2)
end note
:super (valueGetterSupplier1,valueGetterSupplier2);
end
start
note right
KTableValueGetter<K,VOut>get()
end note
:return new KTableKTableOuterJoinValueGetter(valueGetterSupplier1.get(),
valueGetterSupplier2.get());;
stop
end
start
note right
constructor KTableKTableOuterJoinProcessor(final KTableValueGetter<K,
V2>valueGetter)
end note
:this.valueGetter=valueGetter;
end
start
note right
void init(final ProcessorContext<K,Change<VOut>>context)
end note
:super .init(context);
:droppedRecordsSensor=droppedRecordsSensor(Thread.currentThread().getName(),
context.taskId().toString(),(StreamsMetricsImpl)context.metrics());
:valueGetter.init(context);
end
start
note right
void process(final Record<K,Change<V1>>record)
end note
if (record.key()==null ) then (yes) 
if (context().recordMetadata().isPresent()) then (yes) 
:LOG.warn("Skipping record due to null key. "+
"topic=[{}] partition=[{}] offset=[{}]",recordMetadata.topic(),
recordMetadata.partition(),recordMetadata.offset());
else (no)
:LOG.warn("Skipping record due to null key. Topic,
 partition, and offset not known.");
endif 
:droppedRecordsSensor.record();
:return ;;
stop
endif 
if (value2==null ) then (yes) 
if (record.value().newValue==null &&record.value()
.oldValue==null ) then (yes) 
:return ;;
stop
endif 
:resultTimestamp=record.timestamp();
else (no)
:resultTimestamp=Math.max(record.timestamp(),
valueAndTimestamp2.timestamp());
endif 
if (value2!=null ||record.value().newValue!=null ) then (yes) 
:newValue=joiner.apply(record.value().newValue,
value2);
endif 
if (sendOldValues&&(value2!=null ||record.value()
.oldValue!=null )) then (yes) 
:oldValue=joiner.apply(record.value().oldValue,
value2);
endif 
:context().forward(record.withValue(new Change<>(newValue,
oldValue)).withTimestamp(resultTimestamp));
end
start
note right
void close()
end note
:valueGetter.close();
end
start
note right
constructor KTableKTableOuterJoinValueGetter(final KTableValueGetter<K,
V1>valueGetter1,final KTableValueGetter<K,
V2>valueGetter2)
end note
:this.valueGetter1=valueGetter1;
:this.valueGetter2=valueGetter2;
end
start
note right
void init(final ProcessorContext<? ,? >context)
end note
:valueGetter1.init(context);
:valueGetter2.init(context);
end
start
note right
ValueAndTimestamp<VOut>get(final Kkey)
end note
if (valueAndTimestamp1==null ) then (yes) 
:value1=null ;
:timestamp1=UNKNOWN;
else (no)
:value1=valueAndTimestamp1.value();
:timestamp1=valueAndTimestamp1.timestamp();
endif 
if (valueAndTimestamp2==null ) then (yes) 
:value2=null ;
:timestamp2=UNKNOWN;
else (no)
:value2=valueAndTimestamp2.value();
:timestamp2=valueAndTimestamp2.timestamp();
endif 
if (value1!=null ||value2!=null ) then (yes) 
:newValue=joiner.apply(value1,value2);
endif 
:return ValueAndTimestamp.make(newValue,Math.max(timestamp1,
timestamp2));;
stop
end
start
note right
void close()
end note
:valueGetter1.close();
:valueGetter2.close();
end
@enduml

