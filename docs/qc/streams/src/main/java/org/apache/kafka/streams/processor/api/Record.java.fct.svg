@startuml
!pragma layout smetana
start
note right
constructor Record(final Kkey,final Vvalue,
final longtimestamp,final Headersheaders)
end note
:this.key=key;;
:this.value=value;;
if (timestamp<0) then (yes) 
:throw new StreamsException("Malformed Record",new IllegalArgumentException("Timestamp may not be negative. Got: "+
timestamp));;
stop
endif 
:this.timestamp=timestamp;;
:this.headers=new RecordHeaders(headers);;
end
start
note right
constructor Record(final Kkey,final Vvalue,
final longtimestamp)
end note
:this(key,value,timestamp,null );;
end
start
note right
Kkey()
end note
:return key;;
stop
end
start
note right
Vvalue()
end note
:return value;;
stop
end
start
note right
longtimestamp()
end note
:return timestamp;;
stop
end
start
note right
Headersheaders()
end note
:return headers;;
stop
end
:return new Record<>(key,value,timestamp,
headers);;
stop
:return new Record<>(key,value,timestamp,
headers);;
stop
start
note right
Record<K,V>withTimestamp(final longtimestamp)
end note
:return new Record<>(key,value,timestamp,
headers);;
stop
end
start
note right
Record<K,V>withHeaders(final Headersheaders)
end note
:return new Record<>(key,value,timestamp,
headers);;
stop
end
start
note right
StringtoString()
end note
:return "Record{"+"key="+key+", value="+value+
", timestamp="+timestamp+", headers="+headers+
'}';;
stop
end
start
note right
booleanequals(final Objecto)
end note
if (this==o) then (yes) 
:return true;;
stop
endif 
if (o==null ||getClass()!=o.getClass()) then (yes) 
:return false;;
stop
endif 
:final Record<? ,? >record =(Record<? ,? >)o;;
:return timestamp==record .timestamp&&Objects.equals(key,
record .key)&&Objects.equals(value,record .value)&&Objects.equals(headers,
record .headers);;
stop
end
start
note right
inthashCode()
end note
:return Objects.hash(key,value,timestamp,
headers);;
stop
end
@enduml

