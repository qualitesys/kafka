,607.0859,232,611.0859" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="232" x2="232" y1="757.4258" y2="777.4258"/><polygon fill="#181818" points="228,767.4258,232,777.4258,236,767.4258,232,771.4258" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[f6572370aa33500c1b824ed1ca9cd465]
@startuml
!pragma layout smetana
start
note right
constructor StreamTableJoinNode(final StringnodeName,final ProcessorParameters<K,V,? ,? >processorParameters,final String[]storeNames,final StringotherJoinSideNodeName)
end note
:super (nodeName);
:this.storeNames=storeNames;
:this.processorParameters=processorParameters;
:this.otherJoinSideNodeName=otherJoinSideNodeName;
end
start
note right
StringtoString()
end note
:return "StreamTableJoinNode{"+"storeNames="+
Arrays.toString(storeNames)+", processorParameters="+
processorParameters+", otherJoinSideNodeName='"+
otherJoinSideNodeName+'\''+"} "+super .toString();;
stop
end
start
note right
void writeToTopology(final InternalTopologyBuildertopologyBuilder)
end note
:topologyBuilder.addProcessor(processorName,
processorSupplier,parentNodeNames());
if (otherJoinSideNodeName!=null ) then (yes) 
:topologyBuilder.connectProcessorAndStateStores(processorName,
storeNames);
endif 
end
@enduml

