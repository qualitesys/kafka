@startuml
!pragma layout smetana
start
note right
constructor StreamTableJoinNode(final StringnodeName,
final ProcessorParameters<K,V,? ,? >processorParameters,
final String[]storeNames,final StringotherJoinSideNodeName)
end note
:super (nodeName);;
:this.storeNames=storeNames;;
:this.processorParameters=processorParameters;;
:this.otherJoinSideNodeName=otherJoinSideNodeName;;
end
start
note right
StringtoString()
end note
:return "StreamTableJoinNode{"+"storeNames="+
Arrays.toString(storeNames)+", processorParameters="+
processorParameters+", otherJoinSideNodeName='"+
otherJoinSideNodeName+'\''+"} "+super .toString();;
stop
end
start
note right
void writeToTopology(final InternalTopologyBuildertopologyBuilder)
end note
:final StringprocessorName=processorParameters.processorName();;
:final ProcessorSupplier<K,V,? ,? >processorSupplier=processorParameters.processorSupplier();;
:topologyBuilder.addProcessor(processorName,
processorSupplier,parentNodeNames());;
if (otherJoinSideNodeName!=null ) then (yes) 
:topologyBuilder.connectProcessorAndStateStores(processorName,
storeNames);;
endif 
end
@enduml

