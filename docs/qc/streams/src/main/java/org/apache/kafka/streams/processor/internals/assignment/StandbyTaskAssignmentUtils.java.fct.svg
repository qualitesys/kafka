:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="610" x2="610" y1="535.7109" y2="555.7109"/><polygon fill="#181818" points="606,545.7109,610,555.7109,614,545.7109,610,549.7109" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="610" x2="610" y1="737.957" y2="757.957"/><polygon fill="#181818" points="606,747.957,610,757.957,614,747.957,610,751.957" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="610" x2="610" y1="818.0898" y2="848.2227"/><polygon fill="#181818" points="606,838.2227,610,848.2227,614,838.2227,610,842.2227" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="610" x2="610" y1="896.1602" y2="916.1602"/><polygon fill="#181818" points="606,906.1602,610,916.1602,614,906.1602,610,910.1602" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[5f3a082dd79d37c5d60b3bae53e2792b]
@startuml
!pragma layout smetana
start
note right
constructor StandbyTaskAssignmentUtils()
end note
end
start
note right
ConstrainedPrioritySetcreateLeastLoadedPrioritySetConstrainedByAssignedTask(final Map<UUID,
ClientState>clients)
end note
:return new ConstrainedPrioritySet((client,
t)->!clients.get(client).hasAssignedTask(t),
client->clients.get(client).assignedTaskLoad());;
stop
end
start
note right
void pollClientAndMaybeAssignAndUpdateRemainingStandbyTasks(final intnumStandbyReplicas,
final Map<UUID,ClientState>clients,final Map<TaskId,
Integer>tasksToRemainingStandbys,final ConstrainedPrioritySetstandbyTaskClientsByTaskLoad,
final TaskIdactiveTaskId,final Loggerlog)
end note
:intnumRemainingStandbys=tasksToRemainingStandbys.get(activeTaskId);;
:while (numRemainingStandbys>0){final UUIDclient=standbyTaskClientsByTaskLoad.poll(activeTaskId);
:if (client==null ){break ;}clients.get(client).assignStandby(activeTaskId);numRemainingStandbys- -;standbyTaskClientsByTaskLoad.offer(client);tasksToRemainingStandbys.put(activeTaskId,
numRemainingStandbys);};
if (numRemainingStandbys>0) then (yes) 
:log.warn("Unable to assign {} of {} standby tasks for task [{}]. "+
"There is not enough available capacity. You should "+
"increase the number of application instances "+
"to maintain the requested number of standby replicas.",
numRemainingStandbys,numStandbyReplicas,activeTaskId);;
endif 
end
start
note right
Map<TaskId,Integer>computeTasksToRemainingStandbys(final intnumStandbyReplicas,
final Set<TaskId>statefulTaskIds)
end note
:return statefulTaskIds.stream().collect(toMap(Function.identity(),
t->numStandbyReplicas));;
stop
end
@enduml

