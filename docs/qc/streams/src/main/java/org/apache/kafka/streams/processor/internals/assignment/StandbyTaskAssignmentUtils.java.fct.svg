oke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="232" x2="232" y1="941.9258" y2="961.9258"/><polygon fill="#181818" points="228,951.9258,232,961.9258,236,951.9258,232,955.9258" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="232" x2="232" y1="1022.0586" y2="1052.1914"/><polygon fill="#181818" points="228,1042.1914,232,1052.1914,236,1042.1914,232,1046.1914" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="232" x2="232" y1="1100.1289" y2="1120.1289"/><polygon fill="#181818" points="228,1110.1289,232,1120.1289,236,1110.1289,232,1114.1289" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[b47c43c01d59441b64470e82e4906f25]
@startuml
!pragma layout smetana
start
note right
constructor StandbyTaskAssignmentUtils()
end note
end
start
note right
ConstrainedPrioritySetcreateLeastLoadedPrioritySetConstrainedByAssignedTask(final Map<UUID,
ClientState>clients)
end note
:return new ConstrainedPrioritySet((client,
t)->!clients.get(client).hasAssignedTask(t),
client->clients.get(client).assignedTaskLoad());;
stop
end
start
note right
void pollClientAndMaybeAssignAndUpdateRemainingStandbyTasks(final intnumStandbyReplicas,
final Map<UUID,ClientState>clients,final Map<TaskId,
Integer>tasksToRemainingStandbys,final ConstrainedPrioritySetstandbyTaskClientsByTaskLoad,
final TaskIdactiveTaskId,final Loggerlog)
end note
while (numRemainingStandbys>0)
if (client==null ) then (yes) 
endif 
:clients.get(client).assignStandby(activeTaskId);
:numRemainingStandbys- -;
:standbyTaskClientsByTaskLoad.offer(client);
:tasksToRemainingStandbys.put(activeTaskId,
numRemainingStandbys);
endwhile
if (numRemainingStandbys>0) then (yes) 
:log.warn("Unable to assign {} of {} standby tasks for task [{}]. "+
"There is not enough available capacity. You should "+
"increase the number of application instances "+
"to maintain the requested number of standby replicas.",
numRemainingStandbys,numStandbyReplicas,activeTaskId);
endif 
end
start
note right
Map<TaskId,Integer>computeTasksToRemainingStandbys(final intnumStandbyReplicas,
final Set<TaskId>statefulTaskIds)
end note
:return statefulTaskIds.stream().collect(toMap(Function.identity(),
t->numStandbyReplicas));;
stop
end
@enduml

