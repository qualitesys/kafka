="934" y1="775.6445" y2="775.6445"/><polygon fill="#181818" points="944,771.6445,934,775.6445,944,779.6445,940,775.6445" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="922" x2="922" y1="743.6445" y2="763.6445"/><polygon fill="#181818" points="918,753.6445,922,763.6445,926,753.6445,922,757.6445" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="922" x2="922" y1="787.6445" y2="807.6445"/><polygon fill="#181818" points="918,797.6445,922,807.6445,926,797.6445,922,801.6445" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="922" x2="922" y1="860.2109" y2="882.7773"/><polygon fill="#181818" points="918,872.7773,922,882.7773,926,872.7773,922,876.7773" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="922" x2="922" y1="916.7461" y2="936.7461"/><polygon fill="#181818" points="918,926.7461,922,936.7461,926,926.7461,922,930.7461" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[4e75010a279ad83de0d6b663b26f4714]
@startuml
!pragma layout smetana
start
note right
constructor StandbyTaskAssignmentUtils()
end note
end
start
note right
ConstrainedPrioritySetcreateLeastLoadedPrioritySetConstrainedByAssignedTask(final Map<UUID,ClientState>clients)
end note
:return new ConstrainedPrioritySet((client,t)->!clients.get(client).hasAssignedTask(t),client->clients.get(client).assignedTaskLoad());;
stop
end
start
note right
void pollClientAndMaybeAssignAndUpdateRemainingStandbyTasks(final intnumStandbyReplicas,final Map<UUID,ClientState>clients,final Map<TaskId,Integer>tasksToRemainingStandbys,final ConstrainedPrioritySetstandbyTaskClientsByTaskLoad,final TaskIdactiveTaskId,final Loggerlog)
end note
while (numRemainingStandbys>0)
if (client==null ) then (yes) 
endif 
:clients.get(client).assignStandby(activeTaskId);
:numRemainingStandbys- -;
:standbyTaskClientsByTaskLoad.offer(client);
:tasksToRemainingStandbys.put(activeTaskId,numRemainingStandbys);
endwhile
if (numRemainingStandbys>0) then (yes) 
:log.warn("Unable to assign {} of {} standby tasks for task [{}]. "+"There is not enough available capacity. You should "+"increase the number of application instances "+"to maintain the requested number of standby replicas.",numRemainingStandbys,numStandbyReplicas,activeTaskId);
endif 
end
start
note right
Map<TaskId,Integer>computeTasksToRemainingStandbys(final intnumStandbyReplicas,final Set<TaskId>statefulTaskIds)
end note
:return statefulTaskIds.stream().collect(toMap(Function.identity(),t->numStandbyReplicas));;
stop
end
@enduml

