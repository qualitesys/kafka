@startuml
!pragma layout smetana
start
note right
constructor StandbyTaskAssignmentUtils()
end note
end
start
note right
ConstrainedPrioritySetcreateLeastLoadedPrioritySetConstrainedByAssignedTask(final Map<UUID,
ClientState>clients)
end note
:return new ConstrainedPrioritySet((client,
t)->!clients.get(client).hasAssignedTask(t),
client->clients.get(client).assignedTaskLoad());;
stop
end
start
note right
void pollClientAndMaybeAssignAndUpdateRemainingStandbyTasks(final intnumStandbyReplicas,
final Map<UUID,ClientState>clients,final Map<TaskId,
Integer>tasksToRemainingStandbys,final ConstrainedPrioritySetstandbyTaskClientsByTaskLoad,
final TaskIdactiveTaskId,final Loggerlog)
end note
while (numRemainingStandbys>0)
if (client==null ) then (yes) 
endif 
endwhile
if (numRemainingStandbys>0) then (yes) 
endif 
end
start
note right
Map<TaskId,Integer>computeTasksToRemainingStandbys(final intnumStandbyReplicas,
final Set<TaskId>statefulTaskIds)
end note
:return statefulTaskIds.stream().collect(toMap(Function.identity(),
t->numStandbyReplicas));;
stop
end
@enduml

