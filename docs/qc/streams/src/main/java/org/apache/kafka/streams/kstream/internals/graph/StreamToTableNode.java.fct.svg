63.2578" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="303.5" x2="303.5" y1="909.5977" y2="929.5977"/><polygon fill="#181818" points="299.5,919.5977,303.5,929.5977,307.5,919.5977,303.5,923.5977" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[4450e063bf7d37207034db9efc8394f3]
@startuml
!pragma layout smetana
start
note right
constructor StreamToTableNode(final String nodeName,
final ProcessorParameters<K,V,?,?> processorParameters,
final MaterializedInternal<K,V,?> materializedInternal)
end note
:super (nodeName);;
:this.processorParameters=processorParameters;;
:this.materializedInternal=materializedInternal;;
end
start
note right
String toString()
end note
:return "StreamToTableNode{"+", processorParameters="+
processorParameters+", materializedInternal="+
materializedInternal+"} "+super .toString();;
stop
end
start
note right
void writeToTopology(final InternalTopologyBuilder topologyBuilder)
end note
:final StoreBuilder<TimestampedKeyValueStore<K,
V>> storeBuilder=new TimestampedKeyValueStoreMaterializer<>((MaterializedInternal<K,
V,KeyValueStore<Bytes,byte[]>> )materializedInternal).materialize();;
:final String processorName=processorParameters.processorName();;
:final KTableSource<K,V> ktableSource=processorParameters.kTableSourceSupplier();;
:topologyBuilder.addProcessor(processorName,
processorParameters.processorSupplier(),parentNodeNames());;
if (storeBuilder!=null &&ktableSource.materialized()) then (yes) 
:topologyBuilder.addStateStore(storeBuilder,
processorName);;
endif 
end
@enduml

