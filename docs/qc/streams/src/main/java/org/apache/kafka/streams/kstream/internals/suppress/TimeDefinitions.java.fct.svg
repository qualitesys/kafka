@startuml
!pragma layout smetana
start
note right
constructor TimeDefinitions()
end note
end
start
note right
constructor RecordTimeDefinition()
end note
end
:return RecordTimeDefinition.INSTANCE;;
stop
start
note right
long time(final ProcessorContext context,
final K key)
end note
:return context.timestamp();;
stop
end
start
note right
TimeDefinitionType type()
end note
:return TimeDefinitionType.RECORD_TIME;;
stop
end
start
note right
constructor WindowEndTimeDefinition()
end note
end
:return WindowEndTimeDefinition.INSTANCE;;
stop
start
note right
long time(final ProcessorContext context,
final K key)
end note
:return key.window().end();;
stop
end
start
note right
TimeDefinitionType type()
end note
:return TimeDefinitionType.WINDOW_END_TIME;;
stop
end
@enduml

