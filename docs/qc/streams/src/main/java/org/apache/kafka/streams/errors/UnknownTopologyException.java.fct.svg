@startuml
!pragma layout smetana
start
note right
constructor UnknownTopologyException(final Stringmessage,
final StringnamedTopology)
end note
:super (message+" due to being unable to locate a Topology named "+namedTopology);
end
start
note right
constructor UnknownTopologyException(final Stringmessage,
final Throwablethrowable,final StringnamedTopology)
end note
:super (message+" due to being unable to locate a Topology named "+namedTopology,throwable);
end
@enduml

