"718.0156"/><polygon fill="#181818" points="330,708.0156,334,718.0156,338,708.0156,334,712.0156" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="334" x2="334" y1="751.9844" y2="771.9844"/><polygon fill="#181818" points="330,761.9844,334,771.9844,338,761.9844,334,765.9844" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[5eed7cc149d375c3df7c785e06707550]
@startuml
!pragma layout smetana
start
note right
constructor TimestampedKeyValueStoreMaterializer(final MaterializedInternal<K,
V,KeyValueStore<Bytes,byte[]>>materialized)
end note
:this.materialized=materialized;
end
start
note right
StoreBuilder<TimestampedKeyValueStore<K,V>>materialize()
end note
if (supplier==null ) then (yes) 
:supplier=Stores.inMemoryKeyValueStore(materialized.storeName());
:supplier=Stores.persistentTimestampedKeyValueStore(materialized.storeName());
:throw new IllegalStateException("Unknown store type: "+materialized.storeType());;
endif 
if (materialized.loggingEnabled()) then (yes) 
:builder.withLoggingEnabled(materialized.logConfig());
else (no)
:builder.withLoggingDisabled();
endif 
if (materialized.cachingEnabled()) then (yes) 
:builder.withCachingEnabled();
endif 
:return builder;;
stop
end
@enduml

