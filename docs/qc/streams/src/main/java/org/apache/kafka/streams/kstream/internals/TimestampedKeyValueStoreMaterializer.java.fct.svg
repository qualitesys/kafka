@startuml
!pragma layout smetana
start
note right
constructor TimestampedKeyValueStoreMaterializer(final MaterializedInternal<K,
V,KeyValueStore<Bytes,byte[]>> materialized)
end note
:this.materialized=materialized;;
end
start
note right
StoreBuilder<TimestampedKeyValueStore<K,V>> materialize()
end note
:KeyValueBytesStoreSupplier supplier=(KeyValueBytesStoreSupplier )materialized.storeSupplier();;
if (supplier==null ) then (yes) 
switch (switch materialized.storeType())
case (case IN_MEMORY:) 
:supplier=Stores.inMemoryKeyValueStore(materialized.storeName());;
:break ;;
case (case ROCKS_DB:) 
:supplier=Stores.persistentTimestampedKeyValueStore(materialized.storeName());;
:break ;;
case (default :) 
:throw new IllegalStateException("Unknown store type: "+
materialized.storeType());;
stop
endswitch
endif 
:final StoreBuilder<TimestampedKeyValueStore<K,
V>> builder=Stores.timestampedKeyValueStoreBuilder(supplier,
materialized.keySerde(),materialized.valueSerde());;
if (materialized.loggingEnabled()) then (yes) 
:builder.withLoggingEnabled(materialized.logConfig());;
else (no)
:builder.withLoggingDisabled();;
endif 
if (materialized.cachingEnabled()) then (yes) 
:builder.withCachingEnabled();;
endif 
:return builder;;
stop
end
@enduml

