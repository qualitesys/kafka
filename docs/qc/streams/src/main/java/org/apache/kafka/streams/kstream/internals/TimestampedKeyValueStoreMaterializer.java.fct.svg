3.5,678.5313,577.5,688.5313,581.5,678.5313,577.5,682.5313" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="577.5" x2="577.5" y1="722.5" y2="742.5"/><polygon fill="#181818" points="573.5,732.5,577.5,742.5,581.5,732.5,577.5,736.5" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[4dd861cc56d5a439ce488b81565e0343]
@startuml
!pragma layout smetana
start
note right
constructor TimestampedKeyValueStoreMaterializer(final MaterializedInternal<K,
V,KeyValueStore<Bytes,byte[]>>materialized)
end note
:this.materialized=materialized;;
end
start
note right
StoreBuilder<TimestampedKeyValueStore<K,V>>materialize()
end note
if (supplier==null ) then (yes) 
:switch (materialized.storeType()){case IN_MEMORY:supplier=Stores.inMemoryKeyValueStore(materialized.storeName());
:break ;case ROCKS_DB:supplier=Stores.persistentTimestampedKeyValueStore(materialized.storeName());break ;default :throw new IllegalStateException("Unknown store type: "+
materialized.storeType());};
endif 
if (materialized.loggingEnabled()) then (yes) 
:builder.withLoggingEnabled(materialized.logConfig());;
else (no)
:builder.withLoggingDisabled();;
endif 
if (materialized.cachingEnabled()) then (yes) 
:builder.withCachingEnabled();;
endif 
:return builder;;
stop
end
@enduml

