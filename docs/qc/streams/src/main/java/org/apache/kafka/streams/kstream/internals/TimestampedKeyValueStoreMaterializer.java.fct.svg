y1="696.8516" y2="716.8516"/><polygon fill="#181818" points="330,706.8516,334,716.8516,338,706.8516,334,710.8516" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="334" x2="334" y1="750.8203" y2="770.8203"/><polygon fill="#181818" points="330,760.8203,334,770.8203,338,760.8203,334,764.8203" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[92ec4f39558729faf8011e2230c56b8e]
@startuml
!pragma layout smetana
start
note right
constructor TimestampedKeyValueStoreMaterializer(final MaterializedInternal<K,V,KeyValueStore<Bytes,byte[]>>materialized)
end note
:this.materialized=materialized;
end
start
note right
StoreBuilder<TimestampedKeyValueStore<K,V>>materialize()
end note
if (supplier==null ) then (yes) 
:supplier=Stores.inMemoryKeyValueStore(materialized.storeName());
:supplier=Stores.persistentTimestampedKeyValueStore(materialized.storeName());
:throw new IllegalStateException("Unknown store type: "+
materialized.storeType());;
endif 
if (materialized.loggingEnabled()) then (yes) 
:builder.withLoggingEnabled(materialized.logConfig());
else (no)
:builder.withLoggingDisabled();
endif 
if (materialized.cachingEnabled()) then (yes) 
:builder.withCachingEnabled();
endif 
:return builder;;
stop
end
@enduml

