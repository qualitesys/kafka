yValueBytesStoreSuppliersupplier=(KeyValueBytesStoreSupplier)materialized.storeSupplier();;</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="234" x="5" y="348.625">if (supplier==null ) then (yes)</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="332" x="5" y="364.9219">switch (switch (materialized.storeType()))</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" text-decoration="wavy underline" textLength="73" x="5" y="381.2188">endswith</text><text fill="#FF0000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="106" x="10" y="397.5156">Syntax Error?</text><!--MD5=[b596d29e9d3478911d67f842eb1bcd86]
@startuml
!pragma layout smetana
start
note right
constructor TimestampedKeyValueStoreMaterializer(final MaterializedInternal<K,
V,KeyValueStore<Bytes,byte[]>>materialized)
end note
:this.materialized=materialized;;
end
start
note right
StoreBuilder<TimestampedKeyValueStore<K,V>>materialize()
end note
:KeyValueBytesStoreSuppliersupplier=(KeyValueBytesStoreSupplier)materialized.storeSupplier();;
if (supplier==null ) then (yes) 
switch (switch (materialized.storeType()))
endswith
endif 
:final StoreBuilder<TimestampedKeyValueStore<K,
V>>builder=Stores.timestampedKeyValueStoreBuilder(supplier,
materialized.keySerde(),materialized.valueSerde());;
if (materialized.loggingEnabled()) then (yes) 
:builder.withLoggingEnabled(materialized.logConfig());;
else (no)
:builder.withLoggingDisabled();;
endif 
if (materialized.cachingEnabled()) then (yes) 
:builder.withCachingEnabled();;
endif 
:return builder;;
stop
end
@enduml

