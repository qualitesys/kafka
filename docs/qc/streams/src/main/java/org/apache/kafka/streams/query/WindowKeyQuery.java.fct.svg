04,722.6406" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="204" x2="204" y1="776.5781" y2="796.5781"/><polygon fill="#181818" points="200,786.5781,204,796.5781,208,786.5781,204,790.5781" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[552e9bec483b9668f46e61af3162f1d2]
@startuml
!pragma layout smetana
start
note right
constructor WindowKeyQuery(final Kkey,final Optional<Instant>timeTo,
final Optional<Instant>timeFrom)
end note
end
:return new WindowKeyQuery<>(key,Optional.of(timeFrom),
Optional.of(timeTo));;
stop
start
note right
KgetKey()
end note
:return key;;
stop
end
start
note right
Optional<Instant>getTimeFrom()
end note
:return timeFrom;;
stop
end
start
note right
Optional<Instant>getTimeTo()
end note
:return timeTo;;
stop
end
start
note right
StringtoString()
end note
:return "WindowKeyQuery{"+"key="+key+", timeFrom="+
timeFrom+", timeTo="+timeTo+'}';;
stop
end
@enduml

