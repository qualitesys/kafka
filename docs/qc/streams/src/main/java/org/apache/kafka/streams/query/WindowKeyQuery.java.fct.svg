@startuml
!pragma layout smetana
start
note right
constructor WindowKeyQuery(final K key,final Optional<Instant> timeTo,
final Optional<Instant> timeFrom)
end note
:this.key=key;;
:this.timeFrom=timeFrom;;
:this.timeTo=timeTo;;
end
:return new WindowKeyQuery<>(key,Optional.of(timeFrom),
Optional.of(timeTo));;
stop
start
note right
K getKey()
end note
:return key;;
stop
end
start
note right
Optional<Instant> getTimeFrom()
end note
:return timeFrom;;
stop
end
start
note right
Optional<Instant> getTimeTo()
end note
:return timeTo;;
stop
end
start
note right
String toString()
end note
:return "WindowKeyQuery{"+"key="+key+", timeFrom="+
timeFrom+", timeTo="+timeTo+'}';;
stop
end
@enduml

