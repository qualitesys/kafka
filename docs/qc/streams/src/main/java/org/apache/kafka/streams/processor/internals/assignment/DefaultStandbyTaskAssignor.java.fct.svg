@startuml
!pragma layout smetana
start
note right
booleanassign(final Map<UUID,ClientState>clients,
final Set<TaskId>allTaskIds,final Set<TaskId>statefulTaskIds,
final AssignorConfiguration.AssignmentConfigsconfigs)
end note
:final intnumStandbyReplicas=configs.numStandbyReplicas;;
:final Map<TaskId,Integer>tasksToRemainingStandbys=computeTasksToRemainingStandbys(numStandbyReplicas,
statefulTaskIds);;
:final ConstrainedPrioritySetstandbyTaskClientsByTaskLoad=createLeastLoadedPrioritySetConstrainedByAssignedTask(clients);;
:standbyTaskClientsByTaskLoad.offerAll(clients.keySet());;
:pollClientAndMaybeAssignAndUpdateRemainingStandbyTasks(numStandbyReplicas,
clients,tasksToRemainingStandbys,standbyTaskClientsByTaskLoad,
task,log);;
:return false;;
stop
end
@enduml

