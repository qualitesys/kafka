75" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="150" x2="150" y1="448.4063" y2="468.4063"/><polygon fill="#181818" points="146,458.4063,150,468.4063,154,458.4063,150,462.4063" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[2958214e18ab7b03cd685e7c1e87a07a]
@startuml
!pragma layout smetana
start
note right
constructor KStreamPeek(final ForeachAction<K,
V>action)
end note
:this.action=action;;
end
start
note right
FixedKeyProcessor<K,V,V>get()
end note
:return new KStreamPeekProcessor();;
stop
end
start
note right
void process(final FixedKeyRecord<K,V>record)
end note
:action.apply(record.key(),record.value());;
:context().forward(record);;
end
@enduml

