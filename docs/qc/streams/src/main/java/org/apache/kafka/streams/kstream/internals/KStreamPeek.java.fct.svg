polygon fill="#181818" points="144,443.2734,148,453.2734,152,443.2734,148,447.2734" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[fd49cad31ce3adb92a238f189a77bc1a]
@startuml
!pragma layout smetana
start
note right
constructor KStreamPeek(final ForeachAction<K,V>action)
end note
:this.action=action;
end
start
note right
FixedKeyProcessor<K,V,V>get()
end note
:return new KStreamPeekProcessor();;
stop
end
start
note right
void process(final FixedKeyRecord<K,V>record)
end note
:action.apply(record.key(),record.value());
:context().forward(record);
end
@enduml

