,408.4375" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="154" x2="154" y1="448.4063" y2="468.4063"/><polygon fill="#181818" points="150,458.4063,154,468.4063,158,458.4063,154,462.4063" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[8dacc13a5c6d055aa6389de4be611e21]
@startuml
!pragma layout smetana
start
note right
constructor KStreamPeek(final ForeachAction<K,
V> action)
end note
:this.action=action;;
end
start
note right
FixedKeyProcessor<K,V,V> get()
end note
:return new KStreamPeekProcessor();;
stop
end
start
note right
void process(final FixedKeyRecord<K,V> record )
end note
:action.apply(record .key(),record .value());;
:context().forward(record );;
end
@enduml

