@startuml
!pragma layout smetana
start
note right
constructor AbstractQueryResult()
end note
end
start
note right
constructor AbstractQueryResult(final List<String>executionInfo,
final Positionposition)
end note
:this.executionInfo=executionInfo;;
:this.position=position;;
end
start
note right
void addExecutionInfo(final Stringmessage)
end note
:executionInfo.add(message);;
end
start
note right
