@startuml
!pragma layout smetana
start
note right
constructor OptimizableRepartitionNode(final StringnodeName,final StringsourceName,final ProcessorParameters<K,V,? ,? >processorParameters,final Serde<K>keySerde,final Serde<V>valueSerde,final StringsinkName,final StringrepartitionTopic,final StreamPartitioner<K,V>partitioner)
end note
:super (nodeName,sourceName,processorParameters,keySerde,valueSerde,sinkName,repartitionTopic,partitioner,InternalTopicProperties.empty());
end
start
note right
Serde<K>keySerde()
end note
:return keySerde;;
stop
end
start
note right
Serde<V>valueSerde()
end note
:return valueSerde;;
stop
end
start
note right
StringrepartitionTopic()
end note
:return repartitionTopic;;
stop
end
start
note right
StringtoString()
end note
:return "OptimizableRepartitionNode{ "+super .toString()+" }";;
stop
end
start
note right
void writeToTopology(final InternalTopologyBuildertopologyBuilder)
end note
:topologyBuilder.addInternalTopic(repartitionTopic,internalTopicProperties);
:processorParameters.addProcessorTo(topologyBuilder,parentNodeNames());
:topologyBuilder.addSink(sinkName,repartitionTopic,keySerializer(),valueSerializer(),partitioner,processorParameters.processorName());
:topologyBuilder.addSource(null ,sourceName,new FailOnInvalidTimestamp(),keyDeserializer(),valueDeserializer(),repartitionTopic);
end
:return new OptimizableRepartitionNodeBuilder<>();;
stop
start
note right
OptimizableRepartitionNode<K,V>build()
end note
:return new OptimizableRepartitionNode<>(nodeName,sourceName,processorParameters,keySerde,valueSerde,sinkName,repartitionTopic,partitioner);;
stop
end
@enduml

