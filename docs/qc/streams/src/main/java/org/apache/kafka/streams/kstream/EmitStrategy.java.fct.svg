@startuml
!pragma layout smetana
start
note right
shortcode()
end note
:return this.code;;
stop
end
start
note right
EmitStrategystrategy()
end note
:return this.strategy;;
stop
end
start
note right
constructor StrategyType(final intcode,final EmitStrategystrategy)
end note
:this.code=(short)code;
:this.strategy=strategy;
end
if (TYPE_TO_STRATEGY.put(type.code(),type.strategy())!=null ) then (yes) 
:throw new IllegalStateException("Code "+type.code()+" for type "+type+" has already been used");;
endif 
start
note right
EmitStrategyforType(final StrategyTypetype)
end note
:return TYPE_TO_STRATEGY.get(type.code());;
stop
end
:return new WindowCloseStrategy();;
stop
:return new WindowUpdateStrategy();;
stop
@enduml

