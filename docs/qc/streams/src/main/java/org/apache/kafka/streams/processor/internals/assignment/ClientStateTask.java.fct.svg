@startuml
!pragma layout smetana
start
note right
constructor ClientStateTask(final Set<TaskId>taskIds,
final Map<String,Set<TaskId>>consumerToTaskIds)
end note
:this.taskIds=taskIds;
:this.consumerToTaskIds=consumerToTaskIds;
end
start
note right
void taskIds(final Set<TaskId>clientToTaskIds)
end note
:taskIds=clientToTaskIds;
end
start
note right
Set<TaskId>taskIds()
end note
:return taskIds;;
stop
end
start
