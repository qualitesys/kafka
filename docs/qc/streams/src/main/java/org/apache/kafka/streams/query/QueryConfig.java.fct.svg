@startuml
!pragma layout smetana
start
note right
constructor QueryConfig(final boolean collectExecutionInfo)
end note
:this.collectExecutionInfo=collectExecutionInfo;;
end
start
note right
boolean isCollectExecutionInfo()
end note
:return collectExecutionInfo;;
stop
end
@enduml

