@startuml
!pragma layout smetana
start
note right
constructor CogroupedStreamAggregateBuilder(final InternalStreamsBuilderbuilder)
end note
end
:return createTable(processors,parentProcessors,
named,keySerde,valueSerde,queryableName,storeBuilder.name());;
stop
:return createTable(processors,parentProcessors,
named,keySerde,valueSerde,queryableName,storeBuilder.name());;
stop
:return createTable(processors,parentProcessors,
named,keySerde,valueSerde,queryableName,storeBuilder.name());;
stop
:return createTable(processors,parentProcessors,
named,keySerde,valueSerde,queryableName,storeBuilder.name());;
stop
start
note right
void processRepartitions(final Map<KGroupedStreamImpl<K,
? >,Aggregator<? super K,? super Object,VOut>>groupPatterns,
final StoreBuilder<? >storeBuilder)
end note
if (repartitionReqs.repartitionRequired) then (yes) 
if (!parentNodes.containsKey(repartitionReqs)) then (yes) 
endif 
else (no)
endif 
end
:return new KTableImpl<KR,VIn,VOut>(mergeProcessorName,
keySerde,valueSerde,Collections.singleton(mergeNode.nodeName()),
queryableName,passThrough,mergeNode,builder);;
stop
start
note right
StatefulProcessorNode<K,? >getStatefulProcessorNode(final StringprocessorName,
final booleanstateCreated,final StoreBuilder<? >storeBuilder,
final ProcessorSupplier<K,? ,K,? >kStreamAggregate)
end note
if (!stateCreated) then (yes) 
else (no)
endif 
:return statefulProcessorNode;;
stop
end
@enduml

