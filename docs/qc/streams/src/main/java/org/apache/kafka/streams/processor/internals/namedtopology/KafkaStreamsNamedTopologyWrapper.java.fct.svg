="371.9063">void resetOffsets(final Set&lt;TopicPartition&gt;partitionsToReset)</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="71" x="5" y="388.2031">end note</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="92" x="5" y="404.5">while (true)</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="246" x="5" y="420.7969">:deleteOffsetsResult.all().get();</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="427" x="5" y="437.0938">:log.info("Successfully completed resetting offsets.");</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="173" x="5" y="453.3906">:ex.printStackTrace();</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="281" x="5" y="469.6875">:log.error("Offset reset failed.",ex);</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="282" x="5" y="485.9844">:throw new StreamsException(ex);;</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="613" x="5" y="502.2813">if (error instanceof GroupSubscribedToTopicException&amp;&amp;error.getMessage()</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" text-decoration="wavy underline" textLength="911" x="5" y="518.5781">.equals("Deleting offsets of a topic is forbidden while the consumer group is actively subscribed to it.")) then (yes)</text><text fill="#FF0000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="106" x="10" y="534.875">Syntax Error?</text><!--MD5=[d61543dd371f61a56df3982f7967a44e]
@startuml
!pragma layout smetana
start
note right
constructor KafkaStreamsNamedTopologyWrapper(final Propertiesprops)
end note
:this(new StreamsConfig(props),new DefaultKafkaClientSupplier());
end
start
note right
constructor KafkaStreamsNamedTopologyWrapper(final Propertiesprops,
final KafkaClientSupplierclientSupplier)
end note
:this(new StreamsConfig(props),clientSupplier);
end
start
note right
constructor KafkaStreamsNamedTopologyWrapper(final StreamsConfigconfig,
final KafkaClientSupplierclientSupplier)
end note
:super (new TopologyMetadata(new ConcurrentSkipListMap<>(),
config),config,clientSupplier);
:this.log=logContext.logger(getClass());
end
start
note right
void start(final NamedTopologyinitialTopology)
end note
:start(Collections.singleton(initialTopology));
end
start
note right
void start(final Collection<NamedTopology>initialTopologies)
end note
:log.info("Starting Streams with topologies: {}",
initialTopologies);
if (addNamedTopologyResult.all().isCompletedExceptionally()) then (yes) 
:log.error("Failed to start Streams when adding topology "+
topology.name()+" due to",e);
:throw e;;
endif 
:super .start();
end
start
note right
NamedTopologyBuildernewNamedTopologyBuilder(final StringtopologyName,
final PropertiestopologyOverrides)
end note
if (topologyName.contains(TaskId.NAMED_TOPOLOGY_DELIMITER)) then (yes) 
:throw new IllegalArgumentException("The character sequence '__' is not allowed in a NamedTopology,
 please select a new name");;
endif 
:return new NamedTopologyBuilder(topologyName,
applicationConfigs,topologyOverrides);;
stop
end
start
note right
NamedTopologyBuildernewNamedTopologyBuilder(final StringtopologyName)
end note
:return newNamedTopologyBuilder(topologyName,
new Properties());;
stop
end
start
note right
Optional<NamedTopology>getTopologyByName(final Stringname)
end note
:return Optional.ofNullable(topologyMetadata.lookupBuilderForNamedTopology(name))
.map(InternalTopologyBuilder::namedTopology);;
stop
end
start
note right
Collection<NamedTopology>getAllTopologies()
end note
:return topologyMetadata.getAllNamedTopologies();;
stop
end
start
note right
AddNamedTopologyResultaddNamedTopology(final NamedTopologynewTopology)
end note
:log.info("Adding new NamedTopology: {}",
newTopology.name());
if (hasStartedOrFinishedShuttingDown()) then (yes) 
:future.completeExceptionally(new IllegalStateException("Cannot add a NamedTopology while the state is "+
super .state));
else (no)
:topologyMetadata.registerAndBuildNewTopology(future,
newTopology.internalTopologyBuilder());
:maybeCompleteFutureIfStillInCREATED(future,"adding topology "+
newTopology.name());
endif 
:return new AddNamedTopologyResult(future);;
stop
end
start
note right
RemoveNamedTopologyResultremoveNamedTopology(final StringtopologyToRemove,
final booleanresetOffsets)
end note
:log.info("Informed to remove topology {} with resetOffsets={} ",
topologyToRemove,resetOffsets);
if (hasStartedOrFinishedShuttingDown()) then (yes) 
:log.error("Attempted to remove topology {} from while the Kafka Streams was in state {}, "+
"topologies cannot be modified if the application has begun or completed shutting down.",
topologyToRemove,state);
:removeTopologyFuture.completeExceptionally(new IllegalStateException("Cannot remove a NamedTopology while the state is "+super .state));
endif 
:return tasks.stream();;
stop
:topologyMetadata.unregisterTopology(removeTopologyFuture,
topologyToRemove);
if (resetOffsets&&!skipResetForUnstartedApplication&&!partitionsToReset.isEmpty()) then (yes) 
:log.info("Resetting offsets for the following partitions of {} removed NamedTopology {}: {}",
removeTopologyFuture.isCompletedExceptionally()? String.valueOf("unsuccessfully"):String.valueOf("successfully"),
topologyToRemove,partitionsToReset);
:return new RemoveNamedTopologyResult(removeTopologyFuture,
topologyToRemove,()->resetOffsets(partitionsToReset));;
stop
else (no)
:return new RemoveNamedTopologyResult(removeTopologyFuture);;
stop
endif 
end
start
note right
void pauseNamedTopology(final StringtopologyName)
end note
:topologyMetadata.pauseTopology(topologyName);
end
start
note right
booleanisNamedTopologyPaused(final StringtopologyName)
end note
:return topologyMetadata.isPaused(topologyName);;
stop
end
start
note right
void resumeNamedTopology(final StringtopologyName)
end note
:topologyMetadata.resumeTopology(topologyName);
end
start
note right
booleanmaybeCompleteFutureIfStillInCREATED(final KafkaFutureImpl<Void>updateTopologyFuture,
final Stringoperation)
end note
if (state==State.CREATED&&!updateTopologyFuture.isDone()) then (yes) 
:updateTopologyFuture.complete(null );
:log.info("Completed {} since application has not been started",
operation);
:return true;;
stop
else (no)
:return false;;
stop
endif 
end
start
note right
void resetOffsets(final Set<TopicPartition>partitionsToReset)
end note
while (true)
:deleteOffsetsResult.all().get();
:log.info("Successfully completed resetting offsets.");
:ex.printStackTrace();
:log.error("Offset reset failed.",ex);
:throw new StreamsException(ex);;
if (error instanceof GroupSubscribedToTopicException&&error.getMessage()
.equals("Deleting offsets of a topic is forbidden while the consumer group is actively subscribed to it.")) then (yes) 
:log.debug("Offset reset failed, there may be other nodes which have not yet finished removing this topology",
error);
else (no)
if (- -retries>0) then (yes) 
:log.error("Offset reset failed, retries remaining: "+
retries,error);
else (no)
:log.error("Offset reset failed, no retries remaining.",
error);
:throw new StreamsException(error);;
endif 
endif 
:Thread.sleep(100);
:ex.printStackTrace();
endwhile
end
start
note right
RemoveNamedTopologyResultremoveNamedTopology(final StringtopologyToRemove)
end note
:return removeNamedTopology(topologyToRemove,
false);;
stop
end
start
note right
void cleanUpNamedTopology(final Stringname)
end note
if (getTopologyByName(name).isPresent()) then (yes) 
:throw new IllegalStateException("Can't clean up local state for an active NamedTopology: "+
name);;
endif 
:stateDirectory.clearLocalStateForNamedTopology(name);
end
start
note right
StringgetFullTopologyDescription()
end note
:return topologyMetadata.topologyDescriptionString();;
stop
end
start
note right
void verifyTopologyStateStore(final StringtopologyName,
final StringstoreName)
end note
if (builder==null ) then (yes) 
:throw new UnknownTopologyException("Cannot get state store "+
storeName,topologyName);;
endif 
end
:verifyTopologyStateStore(topologyName,storeName);
:return super .store(storeQueryParameters);;
stop
start
note right
Collection<StreamsMetadata>streamsMetadataForStore(final StringstoreName,
final StringtopologyName)
end note
:verifyTopologyStateStore(topologyName,storeName);
:validateIsRunningOrRebalancing();
:return streamsMetadataState.getAllMetadataForStore(storeName,
topologyName);;
stop
end
start
note right
Collection<StreamsMetadata>allStreamsClientsMetadataForTopology(final StringtopologyName)
end note
:validateIsRunningOrRebalancing();
:return streamsMetadataState.getAllMetadataForTopology(topologyName);;
stop
end
:verifyTopologyStateStore(topologyName,storeName);
:validateIsRunningOrRebalancing();
:return streamsMetadataState.getKeyQueryMetadataForKey(storeName,
key,keySerializer,topologyName);;
stop
start
note right
Map<String,Map<Integer,LagInfo>>allLocalStorePartitionLagsForTopology(final StringtopologyName)
end note
if (!getTopologyByName(topologyName).isPresent()) then (yes) 
:log.error("Can't get local store partition lags since topology {} does not exist in this application",
topologyName);
:throw new UnknownTopologyException("Can't get local store partition lags",
topologyName);;
endif 
:processStreamThread(thread->allTopologyTasks.addAll(thread.allTasks()
.values().stream().filter(t->topologyName.equals(t.id()
.topologyName())).collect(Collectors.toList())));
:return allLocalStorePartitionLags(allTopologyTasks);;
stop
end
@enduml

