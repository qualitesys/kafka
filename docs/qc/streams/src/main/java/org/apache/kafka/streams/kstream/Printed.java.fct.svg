@startuml
!pragma layout smetana
start
note right
constructor Printed(final OutputStreamoutputStream)
end note
:this.outputStream=outputStream;;
end
start
note right
constructor Printed(final Printed<K,V>printed)
end note
:this.outputStream=printed.outputStream;;
:this.label=printed.label;;
:this.mapper=printed.mapper;;
:this.processorName=printed.processorName;;
end
:Objects.requireNonNull(filePath,"filePath can't be null");;
if (Utils.isBlank(filePath)) then (yes) 
:throw new TopologyException("filePath can't be an empty string");;
stop
endif 
:try {return new Printed<>(Files.newOutputStream(Paths.get(filePath)));}catch (final IOExceptione){throw new TopologyException("Unable to write stream to file at ["+
filePath+"] "+e.getMessage());};
:return new Printed<>(System.out);;
stop
start
note right
Printed<K,V>withLabel(final Stringlabel)
end note
:Objects.requireNonNull(label,"label can't be null");;
:this.label=label;;
:return this;;
stop
end
start
note right
Printed<K,V>withKeyValueMapper(final KeyValueMapper<? super K,
? super V,String>mapper)
end note
:Objects.requireNonNull(mapper,"mapper can't be null");;
:this.mapper=mapper;;
:return this;;
stop
end
