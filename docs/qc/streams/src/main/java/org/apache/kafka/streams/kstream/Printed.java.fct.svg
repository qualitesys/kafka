@startuml
!pragma layout smetana
start
note right
constructor Printed(final OutputStreamoutputStream)
end note
end
start
note right
constructor Printed(final Printed<K,V>printed)
end note
end
if (Utils.isBlank(filePath)) then (yes) 
:throw new TopologyException("filePath can't be an empty string");;
endif 
:return new Printed<>(Files.newOutputStream(Paths.get(filePath)));;
stop
:throw new TopologyException("Unable to write stream to file at ["+
filePath+"] "+e.getMessage());;
:return new Printed<>(System.out);;
stop
start
note right
Printed<K,V>withLabel(final Stringlabel)
end note
:return this;;
stop
end
start
note right
Printed<K,V>withKeyValueMapper(final KeyValueMapper<? super K,
? super V,String>mapper)
end note
:return this;;
stop
end
start
note right
Printed<K,V>withName(final StringprocessorName)
end note
:return this;;
stop
end
@enduml

