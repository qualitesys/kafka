@startuml
!pragma layout smetana
start
note right
DeserializationHandlerResponsehandle(final ProcessorContextcontext,
final ConsumerRecord<byte[],byte[]>record,
final Exceptionexception)
end note
:log.warn("Exception caught during Deserialization, "
+"taskId: {}, topic: {}, partition: {}, offset: {}",
context.taskId(),record.topic(),record.partition(),
record.offset(),exception);
:return DeserializationHandlerResponse.CONTINUE;;
stop
end
start
note right
void configure(final Map<String,? >configs)
end note
end
@enduml

