@startuml
!pragma layout smetana
start
note right
constructor KTableKTableAbstractJoin(final KTableImpl<K,
? ,V1>table1,final KTableImpl<K,? ,V2>table2,
final ValueJoiner<? super V1,? super V2,?  extends VOut>joiner)
end note
:this.table1=table1;
:this.table2=table2;
:this.valueGetterSupplier1=table1.valueGetterSupplier();
:this.valueGetterSupplier2=table2.valueGetterSupplier();
:this.joiner=joiner;
end
start
note right
booleanenableSendingOldValues(final booleanforceMaterialization)
end note
:table1.enableSendingOldValues(true);
:table2.enableSendingOldValues(true);
:sendOldValues=true;
:return true;;
stop
end
@enduml

