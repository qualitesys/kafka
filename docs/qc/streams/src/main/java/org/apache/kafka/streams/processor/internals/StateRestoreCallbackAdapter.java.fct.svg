@startuml
!pragma layout smetana
start
note right
constructor StateRestoreCallbackAdapter()
end note
end
start
note right
RecordBatchingStateRestoreCallbackadapt(final StateRestoreCallbackrestoreCallback)
end note
:Objects.requireNonNull(restoreCallback,"stateRestoreCallback must not be null");;
if (restoreCallback instanceof RecordBatchingStateRestoreCallback) then (yes) 
:return (RecordBatchingStateRestoreCallback)restoreCallback;;
stop
else if (restoreCallback instanceof BatchingStateRestoreCallback) then (yes) 
:return records->{final List<KeyValue<byte[],
byte[]>>keyValues=new ArrayList<>();for (final ConsumerRecord<byte[],
byte[]>record :records){keyValues.add(new KeyValue<>(record .key(),
record .value()));}((BatchingStateRestoreCallback)restoreCallback).restoreAll(keyValues);};;
stop
else (no)
:return records->{for (final ConsumerRecord<byte[],
byte[]>record :records){restoreCallback.restore(record .key(),
record .value());}};;
stop
endif 
end
@enduml

