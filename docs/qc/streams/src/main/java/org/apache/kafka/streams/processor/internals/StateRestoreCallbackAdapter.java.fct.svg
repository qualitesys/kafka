-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="623.75" x2="643" y1="196.2344" y2="196.2344"/><line style="stroke:#181818;stroke-width:1.0;" x1="643" x2="643" y1="196.2344" y2="218.2344"/><polygon fill="#181818" points="639,208.2344,643,218.2344,647,208.2344,643,212.2344" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="429.25" x2="429.25" y1="164.2344" y2="184.2344"/><polygon fill="#181818" points="425.25,174.2344,429.25,184.2344,433.25,174.2344,429.25,178.2344" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[fe42866b65fe384bc00b4a40cf16c3e7]
@startuml
!pragma layout smetana
start
note right
constructor StateRestoreCallbackAdapter()
end note
end
start
note right
RecordBatchingStateRestoreCallbackadapt(final StateRestoreCallbackrestoreCallback)
end note
:Objects.requireNonNull(restoreCallback,"stateRestoreCallback must not be null");
if (restoreCallback instanceof RecordBatchingStateRestoreCallback) then (yes) 
:return (RecordBatchingStateRestoreCallback)restoreCallback;;
stop
else (no)
:return records->{for (final ConsumerRecord<byte[],
byte[]>record:records){restoreCallback.restore(record.key(),
record.value());}};;
stop
endif 
end
@enduml

