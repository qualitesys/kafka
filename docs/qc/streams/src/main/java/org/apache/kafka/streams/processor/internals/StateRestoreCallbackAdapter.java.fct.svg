8" points="546.5,192.2344,556.5,196.2344,546.5,200.2344,550.5,196.2344" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="736" x2="736" y1="164.2344" y2="169.2344"/><line style="stroke:#181818;stroke-width:1.0;" x1="736" x2="217.5" y1="169.2344" y2="169.2344"/><line style="stroke:#181818;stroke-width:1.0;" x1="217.5" x2="217.5" y1="169.2344" y2="184.2344"/><polygon fill="#181818" points="213.5,174.2344,217.5,184.2344,221.5,174.2344,217.5,178.2344" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="910.5" x2="1262" y1="196.2344" y2="196.2344"/><line style="stroke:#181818;stroke-width:1.0;" x1="1262" x2="1262" y1="196.2344" y2="243.5269"/><polygon fill="#181818" points="1258,233.5269,1262,243.5269,1266,233.5269,1262,237.5269" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[6b1ed42368a8601076b7cbfb99b68c38]
@startuml
!pragma layout smetana
start
note right
constructor StateRestoreCallbackAdapter()
end note
end
start
note right
RecordBatchingStateRestoreCallback adapt(final StateRestoreCallback restoreCallback)
end note
:Objects.requireNonNull(restoreCallback,"stateRestoreCallback must not be null");;
if (restoreCallback instanceof RecordBatchingStateRestoreCallback ) then (yes) 
:return (RecordBatchingStateRestoreCallback )restoreCallback;;
stop
else if (restoreCallback instanceof BatchingStateRestoreCallback ) then (yes) 
:return records->{final List<KeyValue<byte[],
byte[]>> keyValues=new ArrayList<>();for (final ConsumerRecord<byte[],
byte[]> record :records){keyValues.add(new KeyValue<>(record .key(),
record .value()));}((BatchingStateRestoreCallback )restoreCallback).restoreAll(keyValues);};;
stop
else (no)
:return records->{for (final ConsumerRecord<byte[],
byte[]> record :records){restoreCallback.restore(record .key(),
record .value());}};;
stop
endif 
end
@enduml

