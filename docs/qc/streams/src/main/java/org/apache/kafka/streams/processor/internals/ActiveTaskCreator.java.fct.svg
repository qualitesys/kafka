@startuml
!pragma layout smetana
start
note right
constructor ActiveTaskCreator(final TopologyMetadatatopologyMetadata,
final StreamsConfigapplicationConfig,final StreamsMetricsImplstreamsMetrics,
final StateDirectorystateDirectory,final ChangelogReaderstoreChangelogReader,
final ThreadCachecache,final Timetime,final KafkaClientSupplierclientSupplier,
final StringthreadId,final UUIDprocessId,
final Loggerlog)
end note
:this.topologyMetadata=topologyMetadata;
:this.applicationConfig=applicationConfig;
:this.streamsMetrics=streamsMetrics;
:this.stateDirectory=stateDirectory;
:this.storeChangelogReader=storeChangelogReader;
:this.cache=cache;
:this.time=time;
:this.clientSupplier=clientSupplier;
:this.threadId=threadId;
:this.log=log;
:createTaskSensor=ThreadMetrics.createTaskSensor(threadId,
streamsMetrics);
:processingMode=processingMode(applicationConfig);
if (processingMode==EXACTLY_ONCE_ALPHA) then (yes) 
:threadProducer=null ;
:taskProducers=new HashMap<>();
else (no)
:log.info("Creating thread producer client");
:threadProducer=new StreamsProducer(applicationConfig,
threadId,clientSupplier,null ,processId,logContext,
time);
:taskProducers=Collections.emptyMap();
endif 
end
start
note right
void reInitializeThreadProducer()
end note
:threadProducer.resetProducer();
end
start
note right
StreamsProducerstreamsProducerForTask(final TaskIdtaskId)
end note
if (processingMode!=EXACTLY_ONCE_ALPHA) then (yes) 
:throw new IllegalStateException("Expected EXACTLY_ONCE to be enabled, but the processing mode was "+
processingMode);;
endif 
if (taskProducer==null ) then (yes) 
:throw new IllegalStateException("Unknown TaskId: "+
taskId);;
endif 
:return taskProducer;;
stop
end
start
note right
StreamsProducerthreadProducer()
end note
if (processingMode!=EXACTLY_ONCE_V2) then (yes) 
:throw new IllegalStateException("Expected EXACTLY_ONCE_V2 to be enabled, but the processing mode was "+
processingMode);;
endif 
:return threadProducer;;
stop
end
start
note right
void removeRevokedUnknownTasks(final Set<TaskId>assignedTasks)
end note
:unknownTasksToBeCreated.keySet().retainAll(assignedTasks);
end
start
note right
Map<TaskId,Set<TopicPartition>>uncreatedTasksForTopologies(final Set<String>currentTopologies)
end note
:return filterMap(unknownTasksToBeCreated,
t->currentTopologies.contains(t.getKey().topologyName()));;
stop
end
start
note right
Collection<Task>createTasks(final Consumer<byte[],
byte[]>consumer,final Map<TaskId,Set<TopicPartition>>tasksToBeCreated)
end note
if (taskId.topologyName()!=null &&!topologyMetadata.namedTopologiesView()
.contains(taskId.topologyName())) then (yes) 
:newUnknownTasks.put(taskId,partitions);
endif 
:createdTasks.add(createActiveTask(taskId,
partitions,consumer,logContext,topology,stateManager,
context));
:unknownTasksToBeCreated.remove(taskId);
if (!newUnknownTasks.isEmpty()) then (yes) 
:log.info("Delaying creation of tasks not yet known by this instance: {}",
newUnknownTasks.keySet());
:unknownTasksToBeCreated.putAll(newUnknownTasks);
endif 
:return createdTasks;;
stop
end
start
note right
StreamTaskcreateActiveTaskFromStandby(final StandbyTaskstandbyTask,
final Set<TopicPartition>inputPartitions,
final Consumer<byte[],byte[]>consumer)
end note
:standbyTask.closeCleanAndRecycleState();
:stateManager.transitionTaskType(TaskType.ACTIVE,
logContext);
:return createActiveTask(standbyTask.id,inputPartitions,
consumer,logContext,topologyMetadata.buildSubtopology(standbyTask.id),
stateManager,context);;
stop
end
start
note right
StreamTaskcreateActiveTask(final TaskIdtaskId,
final Set<TopicPartition>inputPartitions,
final Consumer<byte[],byte[]>consumer,final LogContextlogContext,
final ProcessorTopologytopology,final ProcessorStateManagerstateManager,
final InternalProcessorContextcontext)
end note
if (processingMode==ProcessingMode.EXACTLY_ONCE_ALPHA) then (yes) 
:log.info("Creating producer client for task {}",
taskId);
:streamsProducer=new StreamsProducer(applicationConfig,
threadId,clientSupplier,taskId,null ,logContext,
time);
:taskProducers.put(taskId,streamsProducer);
else (no)
:streamsProducer=threadProducer;
endif 
:log.trace("Created task {} with assigned partitions {}",
taskId,inputPartitions);
:createTaskSensor.record();
:return task;;
stop
end
start
note right
void closeThreadProducerIfNeeded()
end note
if (threadProducer!=null ) then (yes) 
:threadProducer.close();
:throw new StreamsException("Thread producer encounter error trying to close.",e);;
endif 
end
start
note right
void closeAndRemoveTaskProducerIfNeeded(final TaskIdid)
end note
if (taskProducer!=null ) then (yes) 
:taskProducer.close();
:throw new StreamsException("["+id+"] task producer encounter error trying to close.",
e,id);;
endif 
end
start
note right
Map<MetricName,Metric>producerMetrics()
end note
:return ClientUtils.producerMetrics(producers);;
stop
end
start
note right
Set<String>producerClientIds()
end note
if (threadProducer!=null ) then (yes) 
:return Collections.singleton(getThreadProducerClientId(threadId));;
stop
else (no)
:return taskProducers.keySet().stream().map(taskId->getTaskProducerClientId(threadId,
taskId)).collect(Collectors.toSet());;
stop
endif 
end
start
note right
LogContextgetLogContext(final TaskIdtaskId)
end note
:return new LogContext(logPrefix);;
stop
end
start
note right
doubletotalProducerBlockedTime()
end note
if (threadProducer!=null ) then (yes) 
:return threadProducer.totalBlockedTime();;
stop
endif 
:return taskProducers.values().stream().mapToDouble(StreamsProducer::totalBlockedTime)
.sum();;
stop
end
@enduml

