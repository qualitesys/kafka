@startuml
!pragma layout smetana
start
note right
constructor SubscriptionResponseWrapper(final long[]originalValueHash,final FVforeignValue,final IntegerprimaryPartition)
end note
:this(originalValueHash,foreignValue,CURRENT_VERSION,
primaryPartition);
end
start
note right
constructor SubscriptionResponseWrapper(final long[]originalValueHash,final FVforeignValue,final byteversion,final IntegerprimaryPartition)
end note
if (version<0||version>CURRENT_VERSION) then (yes) 
:throw new UnsupportedVersionException("SubscriptionWrapper does not support version "+version);;
endif 
:this.originalValueHash=originalValueHash;
:this.foreignValue=foreignValue;
:this.version=version;
:this.primaryPartition=primaryPartition;
end
start
note right
long[]getOriginalValueHash()
end note
:return originalValueHash;;
stop
end
start
note right
FVgetForeignValue()
end note
:return foreignValue;;
stop
end
start
note right
bytegetVersion()
end note
:return version;;
stop
end
start
note right
IntegergetPrimaryPartition()
end note
:return primaryPartition;;
stop
end
start
note right
StringtoString()
end note
:return "SubscriptionResponseWrapper{"+"version="+
version+", foreignValue="+foreignValue+", originalValueHash="+
Arrays.toString(originalValueHash)+", primaryPartition="+
primaryPartition+'}';;
stop
end
@enduml

