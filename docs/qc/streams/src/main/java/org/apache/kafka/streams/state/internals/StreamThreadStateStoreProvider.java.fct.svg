;" x1="1032.25" x2="1032.25" y1="325.9883" y2="347.9883"/><polygon fill="#181818" points="1028.25,337.9883,1032.25,347.9883,1036.25,337.9883,1032.25,341.9883" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="1759.875" x2="1923.5" y1="325.9883" y2="325.9883"/><line style="stroke:#181818;stroke-width:1.0;" x1="1923.5" x2="1923.5" y1="325.9883" y2="347.9883"/><polygon fill="#181818" points="1919.5,337.9883,1923.5,347.9883,1927.5,337.9883,1923.5,341.9883" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="1215.875" x2="1215.875" y1="751.1958" y2="786.1958"/><polygon fill="#181818" points="1211.875,776.1958,1215.875,786.1958,1219.875,776.1958,1215.875,780.1958" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="1739.875" x2="1739.875" y1="793.1021" y2="828.1021"/><polygon fill="#181818" points="1735.875,818.1021,1739.875,828.1021,1743.875,818.1021,1739.875,822.1021" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="1429.875" x2="1215.875" y1="695.2271" y2="695.2271"/><line style="stroke:#181818;stroke-width:1.0;" x1="1215.875" x2="1215.875" y1="695.2271" y2="717.2271"/><polygon fill="#181818" points="1211.875,707.2271,1215.875,717.2271,1219.875,707.2271,1215.875,711.2271" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="1525.875" x2="1739.875" y1="695.2271" y2="695.2271"/><line style="stroke:#181818;stroke-width:1.0;" x1="1739.875" x2="1739.875" y1="695.2271" y2="717.2271"/><polygon fill="#181818" points="1735.875,707.2271,1739.875,717.2271,1743.875,707.2271,1739.875,711.2271" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[8d7ad09c956997a9227f967abbba61de]
@startuml
!pragma layout smetana
start
note right
constructor StreamThreadStateStoreProvider(final StreamThreadstreamThread)
end note
:this.streamThread=streamThread;;
end
if (state==StreamThread.State.DEAD) then (yes) 
:return Collections.emptyList();;
stop
endif 
if (storeQueryParams.staleStoresEnabled()? state.isAlive():state==StreamThread.State.RUNNING) then (yes) 
if (storeQueryParams.partition()!=null ) then (yes) 
if (task.id().partition()==storeQueryParams.partition()&&(topologyName==null ||topologyName.equals(task.id().topologyName()))&&task.getStore(storeName)!=null &&storeName.equals(task.getStore(storeName).name())) then (yes) 
:return Collections.singletonList(typedStore);;
stop
endif 
:return Collections.emptyList();;
stop
else (no)
if (store==null ) then (yes) 
else (no)
:list.add(typedStore);;
endif 
:return list;;
stop
endif 
else (no)
:throw new InvalidStateStoreException("Cannot get state store "+
storeName+" because the stream thread is "+
state+", not RUNNING"+(storeQueryParams.staleStoresEnabled()? String.valueOf(" or REBALANCING"):String.valueOf("")));;
stop
endif 
if (store==null ) then (yes) 
:throw new NullPointerException("Expected store not to be null at this point.");;
stop
else (no)
:throw new InvalidStateStoreException("Cannot get state store "+
storeName+" because the queryable store type ["+
queryableStoreType.getClass()+"] does not accept the actual store type ["+
store.getClass()+"].");;
stop
endif 
@enduml

