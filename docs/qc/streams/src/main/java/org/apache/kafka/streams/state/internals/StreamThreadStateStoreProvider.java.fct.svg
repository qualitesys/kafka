;" x1="1699.125" x2="2131.375" y1="703.3281" y2="703.3281"/><line style="stroke:#181818;stroke-width:1.0;" x1="2131.375" x2="2131.375" y1="703.3281" y2="725.3281"/><polygon fill="#181818" points="2127.375,715.3281,2131.375,725.3281,2135.375,715.3281,2131.375,719.3281" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="1170.875" x2="1170.875" y1="759.2969" y2="777.2969"/><line style="stroke:#181818;stroke-width:1.0;" x1="1170.875" x2="1639.125" y1="777.2969" y2="777.2969"/><polygon fill="#181818" points="1629.125,773.2969,1639.125,777.2969,1629.125,781.2969,1633.125,777.2969" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="2131.375" x2="2131.375" y1="759.2969" y2="777.2969"/><line style="stroke:#181818;stroke-width:1.0;" x1="2131.375" x2="1663.125" y1="777.2969" y2="777.2969"/><polygon fill="#181818" points="1673.125,773.2969,1663.125,777.2969,1673.125,781.2969,1669.125,777.2969" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[6e72c95335f8bb6b599f907c4eba616b]
@startuml
!pragma layout smetana
start
note right
constructor StreamThreadStateStoreProvider(final StreamThreadstreamThread)
end note
:this.streamThread=streamThread;
end
if (state==StreamThread.State.DEAD) then (yes) 
:return Collections.emptyList();;
stop
endif 
if (storeQueryParams.staleStoresEnabled()? state.isAlive():state==StreamThread.State.RUNNING) then (yes) 
if (storeQueryParams.partition()!=null ) then (yes) 
if (task.id().partition()==storeQueryParams.partition()&&(topologyName==null ||topologyName.equals(task.id().topologyName()))&&task.getStore(storeName)!=null &&storeName.equals(task.getStore(storeName).name())) then (yes) 
:return Collections.singletonList(typedStore);;
stop
endif 
:return Collections.emptyList();;
stop
else (no)
if (store==null ) then (yes) 
else (no)
:list.add(typedStore);
endif 
:return list;;
stop
endif 
else (no)
:throw new InvalidStateStoreException("Cannot get state store "+storeName+" because the stream thread is "+state+", not RUNNING"+(storeQueryParams.staleStoresEnabled()? String.valueOf(" or REBALANCING"):String.valueOf("")));;
endif 
if (store==null ) then (yes) 
:throw new NullPointerException("Expected store not to be null at this point.");;
else (no)
:throw new InvalidStateStoreException("Cannot get state store "+storeName+" because the queryable store type ["+queryableStoreType.getClass()+"] does not accept the actual store type ["+store.getClass()+"].");;
endif 
@enduml

