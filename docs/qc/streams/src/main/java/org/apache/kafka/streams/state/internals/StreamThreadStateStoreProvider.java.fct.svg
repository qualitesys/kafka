@startuml
!pragma layout smetana
start
note right
constructor StreamThreadStateStoreProvider(final StreamThreadstreamThread)
end note
:this.streamThread=streamThread;
end
if (state==StreamThread.State.DEAD) then (yes) 
:return Collections.emptyList();;
stop
endif 
if (storeQueryParams.staleStoresEnabled()? state.isAlive():state==StreamThread.State.RUNNING) then (yes) 
if (storeQueryParams.partition()!=null ) then (yes) 
if (task.id().partition()==storeQueryParams.partition()&&(topologyName==null ||topologyName.equals(task.id().topologyName()))&&task.getStore(storeName)!=null &&storeName.equals(task.getStore(storeName).name())) then (yes) 
:return Collections.singletonList(typedStore);;
stop
endif 
:return Collections.emptyList();;
stop
else (no)
if (store==null ) then (yes) 
else (no)
:list.add(typedStore);
endif 
:return list;;
stop
endif 
else (no)
endif 
if (store==null ) then (yes) 
else (no)
endif 
@enduml

