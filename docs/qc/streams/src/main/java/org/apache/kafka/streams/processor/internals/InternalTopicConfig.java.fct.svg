@startuml
!pragma layout smetana
start
note right
constructor InternalTopicConfig(final Stringname,
final Map<String,String>topicConfigs)
end note
end
start
note right
constructor InternalTopicConfig(final Stringname,
final Map<String,String>topicConfigs,final intnumberOfPartitions,
final booleanenforceNumberOfPartitions)
end note
end
start
note right
booleanhasEnforcedNumberOfPartitions()
end note
:return enforceNumberOfPartitions;;
stop
end
start
note right
Stringname()
end note
:return name;;
stop
end
start
note right
Optional<Integer>numberOfPartitions()
end note
:return numberOfPartitions;;
stop
end
start
note right
void setNumberOfPartitions(final intnumberOfPartitions)
end note
if (hasEnforcedNumberOfPartitions()) then (yes) 
:throw new UnsupportedOperationException("number of partitions are enforced on topic "+
""+name()+" and can't be altered.");;
endif 
end
start
note right
void validateNumberOfPartitions(final intnumberOfPartitions)
end note
if (numberOfPartitions<1) then (yes) 
:throw new IllegalArgumentException("Number of partitions must be at least 1.");;
endif 
end
start
note right
StringtoString()
end note
:return "InternalTopicConfig("+"name="+name+
", topicConfigs="+topicConfigs+", enforceNumberOfPartitions="+
enforceNumberOfPartitions+")";;
stop
end
@enduml

