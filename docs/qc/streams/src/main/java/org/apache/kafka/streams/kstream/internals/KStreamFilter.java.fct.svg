-width:1.0;"/><!--MD5=[53caa421b4261dfcd73521d2c124eeb9]
@startuml
!pragma layout smetana
start
note right
constructor KStreamFilter(final Predicate<K,
V>predicate,final booleanfilterNot)
end note
:this.predicate=predicate;;
:this.filterNot=filterNot;;
end
start
note right
FixedKeyProcessor<K,V,V>get()
end note
:return new KStreamFilterProcessor();;
stop
end
start
note right
void process(final FixedKeyRecord<K,V>record)
end note
if (filterNot^predicate.test(record.key(),
record.value())) then (yes) 
:context().forward(record);;
endif 
end
@enduml

