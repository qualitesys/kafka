@startuml
!pragma layout smetana
start
note right
constructor KeyValue(final Kkey,final Vvalue)
end note
:this.key=key;
:this.value=value;
end
:return new KeyValue<>(key,value);;
stop
start
note right
StringtoString()
end note
:return "KeyValue("+key+", "+value+")";;
stop
end
start
note right
booleanequals(final Objectobj)
end note
if (this==obj) then (yes) 
:return true;;
stop
endif 
if (!(obj instanceof KeyValue)) then (yes) 
:return false;;
stop
endif 
:return Objects.equals(key,other.key)&&Objects.equals(value,other.value);;
stop
end
start
note right
inthashCode()
end note
:return Objects.hash(key,value);;
stop
end
@enduml

