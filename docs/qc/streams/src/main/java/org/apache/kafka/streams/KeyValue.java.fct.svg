@startuml
!pragma layout smetana
start
note right
constructor KeyValue(final K key,final V value)
end note
:this.key=key;;
:this.value=value;;
end
:return new KeyValue<>(key,value);;
stop
start
note right
String toString()
end note
:return "KeyValue("+key+", "+value+")";;
stop
end
start
note right
boolean equals(final Object obj)
end note
if (this==obj) then (yes) 
:return true;;
stop
endif 
if (!(obj instanceof KeyValue )) then (yes) 
:return false;;
stop
endif 
:final KeyValue other=(KeyValue )obj;;
:return Objects.equals(key,other.key)&&Objects.equals(value,
other.value);;
stop
end
start
note right
int hashCode()
end note
:return Objects.hash(key,value);;
stop
end
@enduml

