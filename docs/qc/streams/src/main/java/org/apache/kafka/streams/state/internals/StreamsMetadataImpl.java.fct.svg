@startuml
!pragma layout smetana
start
note right
constructor StreamsMetadataImpl(final HostInfohostInfo,
final Set<String>stateStoreNames,final Set<TopicPartition>topicPartitions,
final Set<String>standbyStoreNames,final Set<TopicPartition>standbyTopicPartitions)
end note
:this(hostInfo,stateStoreNames,topicPartitions,
standbyStoreNames,standbyTopicPartitions,
null );;
end
start
note right
constructor StreamsMetadataImpl(final HostInfohostInfo,
final Set<String>stateStoreNames,final Set<TopicPartition>topicPartitions,
final Set<String>standbyStoreNames,final Set<TopicPartition>standbyTopicPartitions,
final StringtopologyName)
end note
:this.hostInfo=hostInfo;;
:this.stateStoreNames=Collections.unmodifiableSet(stateStoreNames);;
:this.topicPartitions=Collections.unmodifiableSet(topicPartitions);;
:this.standbyTopicPartitions=Collections.unmodifiableSet(standbyTopicPartitions);;
:this.standbyStateStoreNames=Collections.unmodifiableSet(standbyStoreNames);;
:this.topologyName=topologyName;;
end
start
note right
HostInfohostInfo()
end note
:return hostInfo;;
stop
end
start
note right
Set<String>stateStoreNames()
end note
:return stateStoreNames;;
stop
end
start
note right
Set<TopicPartition>topicPartitions()
end note
:return topicPartitions;;
stop
end
start
note right
Set<TopicPartition>standbyTopicPartitions()
end note
:return standbyTopicPartitions;;
stop
end
start
note right
Set<String>standbyStateStoreNames()
end note
:return standbyStateStoreNames;;
stop
end
start
note right
Stringhost()
end note
:return hostInfo.host();;
stop
end
start
note right
intport()
end note
:return hostInfo.port();;
stop
end
start
note right
StringtopologyName()
end note
:return topologyName;;
stop
end
start
note right
booleanequals(final Objecto)
end note
if (this==o) then (yes) 
:return true;;
stop
endif 
if (o==null ||getClass()!=o.getClass()) then (yes) 
:return false;;
stop
endif 
:final StreamsMetadataImplthat=(StreamsMetadataImpl)o;;
:return Objects.equals(hostInfo,that.hostInfo)&&Objects.equals(stateStoreNames,
that.stateStoreNames)&&Objects.equals(topicPartitions,
that.topicPartitions)&&Objects.equals(standbyStateStoreNames,
that.standbyStateStoreNames)&&Objects.equals(standbyTopicPartitions,
that.standbyTopicPartitions)&&Objects.equals(topologyName,
that.topologyName);;
stop
end
start
note right
inthashCode()
end note
:return Objects.hash(hostInfo,stateStoreNames,
topicPartitions,standbyStateStoreNames,standbyTopicPartitions);;
stop
end
start
note right
StringtoString()
end note
:final Stringstr="StreamsMetadata {"+"hostInfo="+
hostInfo+", stateStoreNames="+stateStoreNames+
", topicPartitions="+topicPartitions+", standbyStateStoreNames="+
standbyStateStoreNames+", standbyTopicPartitions="+
standbyTopicPartitions;;
if (topologyName==null ) then (yes) 
:return str+'}';;
stop
else (no)
:return str+", topologyName="+topologyName+
'}';;
stop
endif 
end
@enduml

