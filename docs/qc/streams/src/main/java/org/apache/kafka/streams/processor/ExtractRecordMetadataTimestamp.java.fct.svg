@startuml
!pragma layout smetana
start
note right
longextract(final ConsumerRecord<Object,Object>record ,
final longpartitionTime)
end note
:final longtimestamp=record .timestamp();;
if (timestamp<0) then (yes) 
:return onInvalidTimestamp(record ,timestamp,
partitionTime);;
stop
endif 
:return timestamp;;
stop
end
@enduml

