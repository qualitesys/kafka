@startuml
!pragma layout smetana
start
note right
long extract(final ConsumerRecord<Object,
Object> record,final long partitionTime)
end note
:final long timestamp=record.timestamp();;
if (timestamp<0) then (yes) 
:return onInvalidTimestamp(record,timestamp,
partitionTime);;
stop
endif 
:return timestamp;;
stop
end
@enduml

