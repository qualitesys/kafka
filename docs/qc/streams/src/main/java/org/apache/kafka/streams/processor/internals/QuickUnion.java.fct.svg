@startuml
!pragma layout smetana
start
note right
void add(final Tid)
end note
:ids.put(id,id);;
end
start
note right
booleanexists(final Tid)
end note
:return ids.containsKey(id);;
stop
end
start
note right
Troot(final Tid)
end note
if (parent==null ) then (yes) 
:throw new NoSuchElementException("id: "+
id.toString());;
stop
endif 
:while (!parent.equals(current)){final Tgrandparent=ids.get(parent);ids.put(current,
grandparent);current=parent;parent=grandparent;};
:return current;;
stop
end
start
note right
void unite(final Tid1,final T... idList)
end note
:unitePair(id1,id2);;
end
start
note right
void unitePair(final Tid1,final Tid2)
end note
if (!root1.equals(root2)) then (yes) 
:ids.put(root1,root2);;
endif 
end
@enduml

