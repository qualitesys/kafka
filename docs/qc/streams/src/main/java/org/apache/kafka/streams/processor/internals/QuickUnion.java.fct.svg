@startuml
!pragma layout smetana
start
note right
void add(final Tid)
end note
end
start
note right
booleanexists(final Tid)
end note
:return ids.containsKey(id);;
stop
end
start
note right
Troot(final Tid)
end note
if (parent==null ) then (yes) 
:throw new NoSuchElementException("id: "+
id.toString());;
endif 
while (!parent.equals(current))
endwhile
:return current;;
stop
end
start
note right
void unite(final Tid1,final T... idList)
end note
end
start
note right
void unitePair(final Tid1,final Tid2)
end note
if (!root1.equals(root2)) then (yes) 
endif 
end
@enduml

