@startuml
!pragma layout smetana
start
note right
constructor MergedSortedCacheKeyValueBytesStoreIterator(final PeekingKeyValueIterator<Bytes,
LRUCacheEntry>cacheIterator,final KeyValueIterator<Bytes,
byte[]>storeIterator,final booleanforward)
end note
:super (cacheIterator,storeIterator,forward);;
end
start
note right
KeyValue<Bytes,byte[]>deserializeStorePair(final KeyValue<Bytes,
byte[]>pair)
end note
:return pair;;
stop
end
start
note right
BytesdeserializeCacheKey(final BytescacheKey)
end note
:return cacheKey;;
stop
end
start
note right
byte[]deserializeCacheValue(final LRUCacheEntrycacheEntry)
end note
:return cacheEntry.value();;
stop
end
start
note right
BytesdeserializeStoreKey(final Byteskey)
end note
:return key;;
stop
end
start
note right
intcompare(final BytescacheKey,final BytesstoreKey)
end note
:return cacheKey.compareTo(storeKey);;
stop
end
