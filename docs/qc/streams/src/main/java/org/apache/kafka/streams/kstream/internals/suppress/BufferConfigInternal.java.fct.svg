@startuml
!pragma layout smetana
start
note right
Suppressed.StrictBufferConfigwithNoBound()
end note
:return new StrictBufferConfigImpl(Long.MAX_VALUE,Long.MAX_VALUE,SHUT_DOWN,getLogConfig());;
stop
end
start
note right
Suppressed.StrictBufferConfigshutDownWhenFull()
end note
:return new StrictBufferConfigImpl(maxRecords(),maxBytes(),SHUT_DOWN,getLogConfig());;
stop
end
start
note right
Suppressed.EagerBufferConfigemitEarlyWhenFull()
end note
:return new EagerBufferConfigImpl(maxRecords(),maxBytes(),getLogConfig());;
stop
end
@enduml

