@startuml
!pragma layout smetana
start
note right
Suppressed.StrictBufferConfig withNoBound()
end note
:return new StrictBufferConfigImpl(Long.MAX_VALUE,
Long.MAX_VALUE,SHUT_DOWN,getLogConfig());;
stop
end
start
note right
Suppressed.StrictBufferConfig shutDownWhenFull()
end note
:return new StrictBufferConfigImpl(maxRecords(),
maxBytes(),SHUT_DOWN,getLogConfig());;
stop
end
start
note right
Suppressed.EagerBufferConfig emitEarlyWhenFull()
end note
:return new EagerBufferConfigImpl(maxRecords(),
maxBytes(),getLogConfig());;
stop
end
@enduml

