@startuml
!pragma layout smetana
start
note right
constructor NamedTopologyBuilder(final StringtopologyName,final StreamsConfigapplicationConfigs,final PropertiestopologyOverrides)
end note
:super (new TopologyConfig(topologyName,applicationConfigs,
topologyOverrides));
:internalTopologyBuilder.setNamedTopology((NamedTopology)topology);
end
start
note right
NamedTopologybuild()
end note
:super .build(internalTopologyBuilder.topologyConfigs().topologyOverrides);
:return (NamedTopology)topology;;
stop
end
start
note right
NamedTopologygetNewTopology(final TopologyConfigtopologyConfigs)
end note
:return new NamedTopology(new InternalTopologyBuilder(topologyConfigs));;
stop
end
@enduml

