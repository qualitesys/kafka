@startuml
!pragma layout smetana
start
note right
constructor NamedTopologyBuilder(final String topologyName,
final StreamsConfig applicationConfigs,final Properties topologyOverrides)
end note
:super (new TopologyConfig(topologyName,applicationConfigs,
topologyOverrides));;
:internalTopologyBuilder.setNamedTopology((NamedTopology )topology);;
end
start
note right
NamedTopology build()
end note
:super .build(internalTopologyBuilder.topologyConfigs()
.topologyOverrides);;
:return (NamedTopology )topology;;
stop
end
start
note right
NamedTopology getNewTopology(final TopologyConfig topologyConfigs)
end note
:return new NamedTopology(new InternalTopologyBuilder(topologyConfigs));;
stop
end
@enduml

