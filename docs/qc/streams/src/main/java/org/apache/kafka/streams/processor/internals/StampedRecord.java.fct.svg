@startuml
!pragma layout smetana
start
note right
constructor StampedRecord(final ConsumerRecord<? ,
? >record ,final longtimestamp)
end note
:super (record ,timestamp);;
end
start
note right
Stringtopic()
end note
:return value.topic();;
stop
end
start
note right
intpartition()
end note
:return value.partition();;
stop
end
start
note right
Objectkey()
end note
:return value.key();;
stop
end
start
note right
Objectvalue()
end note
:return value.value();;
stop
end
start
note right
longoffset()
end note
:return value.offset();;
stop
end
start
note right
Headersheaders()
end note
:return value.headers();;
stop
end
start
note right
StringtoString()
end note
:return value.toString()+", timestamp = "+
timestamp;;
stop
end
@enduml

