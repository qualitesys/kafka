@startuml
!pragma layout smetana
start
note right
constructor ExceptionAndTasks(final Set<Task>tasks,
final RuntimeExceptionexception)
end note
:this.tasks=Objects.requireNonNull(tasks);
:this.exception=Objects.requireNonNull(exception);
end
start
note right
Set<Task>getTasks()
end note
:return Collections.unmodifiableSet(tasks);;
stop
end
start
note right
RuntimeExceptionexception()
end note
:return exception;;
stop
end
start
note right
booleanequals(final Objecto)
end note
if (this==o) then (yes) 
:return true;;
stop
endif 
if (!(o instanceof ExceptionAndTasks)) then (yes) 
:return false;;
stop
endif 
:return tasks.equals(that.tasks)&&exception.equals(that.exception);;
stop
end
start
note right
inthashCode()
end note
:return Objects.hash(tasks,exception);;
stop
end
@enduml

