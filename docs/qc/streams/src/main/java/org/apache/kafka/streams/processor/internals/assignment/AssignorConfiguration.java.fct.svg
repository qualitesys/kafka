@startuml
!pragma layout smetana
start
note right
constructor AssignorConfiguration(final Map<String,
? >configs)
end note
:streamsConfig=new ClientUtils.QuietStreamsConfig(configs);;
:internalConfigs=configs;;
:logPrefix=String.format("stream-thread [%s] ",
streamsConfig.getString(CommonClientConfigs.CLIENT_ID_CONFIG));;
:final LogContextlogContext=new LogContext(logPrefix);;
:log=logContext.logger(getClass());;
:final Objecto=configs.get(InternalConfig.REFERENCE_CONTAINER_PARTITION_ASSIGNOR);;
if (o==null ) then (yes) 
:final KafkaExceptionfatalException=new KafkaException("ReferenceContainer is not specified");;
:log.error(fatalException.getMessage(),fatalException);;
:throw fatalException;;
stop
endif 
if (!(o instanceof ReferenceContainer)) then (yes) 
:final KafkaExceptionfatalException=new KafkaException(String.format("%s is not an instance of %s",
o.getClass().getName(),ReferenceContainer.class .getName()));;
:log.error(fatalException.getMessage(),fatalException);;
:throw fatalException;;
stop
endif 
:referenceContainer=(ReferenceContainer)o;;
:final Stringo=(String)configs.get(INTERNAL_TASK_ASSIGNOR_CLASS);;
if (o==null ) then (yes) 
:taskAssignorClass=HighAvailabilityTaskAssignor.class .getName();;
else (no)
:taskAssignorClass=o;;
endif 
end
start
note right
ReferenceContainerreferenceContainer()
end note
:return referenceContainer;;
stop
end
start
note right
RebalanceProtocolrebalanceProtocol()
end note
:final StringupgradeFrom=streamsConfig.getString(StreamsConfig.UPGRADE_FROM_CONFIG);;
if (upgradeFrom!=null ) then (yes) 
switch (switch (upgradeFrom))
endswith
endif 
:log.info("Cooperative rebalancing protocol is enabled now");;
:return RebalanceProtocol.COOPERATIVE;;
stop
end
start
note right
StringlogPrefix()
end note
:return logPrefix;;
stop
end
start
note right
intconfiguredMetadataVersion(final intpriorVersion)
end note
:final StringupgradeFrom=streamsConfig.getString(StreamsConfig.UPGRADE_FROM_CONFIG);;
if (upgradeFrom!=null ) then (yes) 
switch (switch (upgradeFrom))
endswith
endif 
:return priorVersion;;
stop
end
start
note right
StringuserEndPoint()
end note
:final StringconfiguredUserEndpoint=streamsConfig.getString(StreamsConfig.APPLICATION_SERVER_CONFIG);;
if (configuredUserEndpoint!=null &&!configuredUserEndpoint.isEmpty()) then (yes) 
:try ;
:final Stringhost=getHost(configuredUserEndpoint);;
:final Integerport=getPort(configuredUserEndpoint);;
if (host==null ||port==null ) then (yes) 
:throw new ConfigException(String.format("%s Config %s isn't in the correct format. Expected a host:port pair but received %s",
logPrefix,StreamsConfig.APPLICATION_SERVER_CONFIG,
configuredUserEndpoint));;
stop
endif 
:catch (final NumberFormatExceptionnfe);
:throw new ConfigException(String.format("%s Invalid port supplied in %s for config %s: %s",
logPrefix,configuredUserEndpoint,StreamsConfig.APPLICATION_SERVER_CONFIG,
nfe));;
stop
:return configuredUserEndpoint;;
stop
else (no)
:return null ;;
stop
endif 
end
start
note right
InternalTopicManagerinternalTopicManager()
end note
:return new InternalTopicManager(referenceContainer.time,
referenceContainer.adminClient,streamsConfig);;
stop
end
start
note right
CopartitionedTopicsEnforcercopartitionedTopicsEnforcer()
end note
:return new CopartitionedTopicsEnforcer(logPrefix);;
stop
end
start
note right
AssignmentConfigsassignmentConfigs()
end note
:return new AssignmentConfigs(streamsConfig);;
stop
end
start
note right
TaskAssignortaskAssignor()
end note
:try ;
:return Utils.newInstance(taskAssignorClass,
TaskAssignor.class );;
stop
:catch (final ClassNotFoundExceptione);
:throw new IllegalArgumentException("Expected an instantiable class name for "+
INTERNAL_TASK_ASSIGNOR_CLASS,e);;
stop
end
start
note right
AssignmentListenerassignmentListener()
end note
:final Objecto=internalConfigs.get(InternalConfig.ASSIGNMENT_LISTENER);;
if (o==null ) then (yes) 
:return stable->{};;
stop
endif 
if (!(o instanceof AssignmentListener)) then (yes) 
:final KafkaExceptionfatalException=new KafkaException(String.format("%s is not an instance of %s",
o.getClass().getName(),AssignmentListener.class .getName()));;
:log.error(fatalException.getMessage(),fatalException);;
:throw fatalException;;
stop
endif 
:return (AssignmentListener)o;;
stop
end
start
note right
constructor AssignmentConfigs(final StreamsConfigconfigs)
end note
:acceptableRecoveryLag=configs.getLong(StreamsConfig.ACCEPTABLE_RECOVERY_LAG_CONFIG);;
:maxWarmupReplicas=configs.getInt(StreamsConfig.MAX_WARMUP_REPLICAS_CONFIG);;
:numStandbyReplicas=configs.getInt(StreamsConfig.NUM_STANDBY_REPLICAS_CONFIG);;
:probingRebalanceIntervalMs=configs.getLong(StreamsConfig.PROBING_REBALANCE_INTERVAL_MS_CONFIG);;
:rackAwareAssignmentTags=configs.getList(StreamsConfig.RACK_AWARE_ASSIGNMENT_TAGS_CONFIG);;
end
start
note right
constructor AssignmentConfigs(final LongacceptableRecoveryLag,
final IntegermaxWarmupReplicas,final IntegernumStandbyReplicas,
final LongprobingRebalanceIntervalMs,final List<String>rackAwareAssignmentTags)
end note
:this.acceptableRecoveryLag=validated(StreamsConfig.ACCEPTABLE_RECOVERY_LAG_CONFIG,
acceptableRecoveryLag);;
:this.maxWarmupReplicas=validated(StreamsConfig.MAX_WARMUP_REPLICAS_CONFIG,
maxWarmupReplicas);;
:this.numStandbyReplicas=validated(StreamsConfig.NUM_STANDBY_REPLICAS_CONFIG,
numStandbyReplicas);;
:this.probingRebalanceIntervalMs=validated(StreamsConfig.PROBING_REBALANCE_INTERVAL_MS_CONFIG,
probingRebalanceIntervalMs);;
:this.rackAwareAssignmentTags=validated(StreamsConfig.RACK_AWARE_ASSIGNMENT_TAGS_CONFIG,
rackAwareAssignmentTags);;
end
:final ConfigDef.Validatorvalidator=StreamsConfig.configDef()
.configKeys().get(configKey).validator;;
if (validator!=null ) then (yes) 
:validator.ensureValid(configKey,value);;
endif 
:return value;;
stop
start
note right
StringtoString()
end note
:return "AssignmentConfigs{"+"\n  acceptableRecoveryLag="+
acceptableRecoveryLag+"\n  maxWarmupReplicas="+
maxWarmupReplicas+"\n  numStandbyReplicas="+
numStandbyReplicas+"\n  probingRebalanceIntervalMs="+
probingRebalanceIntervalMs+"\n  rackAwareAssignmentTags="+
rackAwareAssignmentTags+"\n}";;
stop
end
@enduml

