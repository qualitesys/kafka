@startuml
!pragma layout smetana
start
note right
constructor KStreamPrint(final ForeachAction<K,
V>action)
end note
end
start
note right
Processor<K,V,Void,Void>get()
end note
:return new KStreamPrintProcessor();;
stop
end
start
note right
void process(final Record<K,V>record)
end note
end
start
note right
void close()
end note
