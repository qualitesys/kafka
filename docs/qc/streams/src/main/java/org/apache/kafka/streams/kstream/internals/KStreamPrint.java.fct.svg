@startuml
!pragma layout smetana
start
note right
constructor KStreamPrint(final ForeachAction<K,
V>action)
end note
:this.action=action;
end
start
note right
Processor<K,V,Void,Void>get()
end note
:return new KStreamPrintProcessor();;
stop
end
start
note right
void process(final Record<K,V>record)
end note
:action.apply(record.key(),record.value());
end
start
note right
void close()
end note
if (action instanceof PrintForeachAction) then (yes) 
:((PrintForeachAction<K,V>)action).close();
endif 
end
@enduml

