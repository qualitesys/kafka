@startuml
!pragma layout smetana
start
note right
constructor TimestampedSegments(final Stringname,
final StringmetricsScope,final longretentionPeriod,
final longsegmentInterval)
end note
end
start
note right
TimestampedSegmentgetOrCreateSegment(final longsegmentId,
final ProcessorContextcontext)
end note
if (segments.containsKey(segmentId)) then (yes) 
:return segments.get(segmentId);;
stop
else (no)
if (segments.put(segmentId,newSegment)!=null ) then (yes) 
:throw new IllegalStateException("TimestampedSegment already exists. Possible concurrent access.");;
endif 
:return newSegment;;
stop
endif 
end
start
note right
void openExisting(final ProcessorContextcontext,
final longstreamTime)
end note
end
@enduml

