="#181818" points="596,321.5703,600,331.5703,604,321.5703,600,325.5703" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="363" x2="363" y1="267.4375" y2="297.5703"/><polygon fill="#181818" points="359,287.5703,363,297.5703,367,287.5703,363,291.5703" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="363" x2="363" y1="788.4336" y2="818.5664"/><polygon fill="#181818" points="359,808.5664,363,818.5664,367,808.5664,363,812.5664" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="363" x2="363" y1="866.5039" y2="886.5039"/><polygon fill="#181818" points="359,876.5039,363,886.5039,367,876.5039,363,880.5039" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="363" x2="363" y1="920.4727" y2="940.4727"/><polygon fill="#181818" points="359,930.4727,363,940.4727,367,930.4727,363,934.4727" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[ca5822515deae78c2696fef9ae0eb2df]
@startuml
!pragma layout smetana
start
note right
constructor TimestampedSegments(final Stringname,
final StringmetricsScope,final longretentionPeriod,
final longsegmentInterval)
end note
:super (name,retentionPeriod,segmentInterval);;
:metricsRecorder=new RocksDBMetricsRecorder(metricsScope,
name);;
end
start
note right
TimestampedSegmentgetOrCreateSegment(final longsegmentId,
final ProcessorContextcontext)
end note
if (segments.containsKey(segmentId)) then (yes) 
:return segments.get(segmentId);;
stop
else (no)
:final TimestampedSegmentnewSegment=new TimestampedSegment(segmentName(segmentId),
name,segmentId,metricsRecorder);;
if (segments.put(segmentId,newSegment)!=null ) then (yes) 
:throw new IllegalStateException("TimestampedSegment already exists. Possible concurrent access.");;
stop
endif 
:newSegment.openDB(context.appConfigs(),context.stateDir());;
:return newSegment;;
stop
endif 
end
start
note right
void openExisting(final ProcessorContextcontext,
final longstreamTime)
end note
:metricsRecorder.init(ProcessorContextUtils.getMetricsImpl(context),
context.taskId());;
:super .openExisting(context,streamTime);;
end
@enduml

