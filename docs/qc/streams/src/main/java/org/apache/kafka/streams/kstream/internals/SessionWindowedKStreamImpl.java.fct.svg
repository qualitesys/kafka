a80af6273fe6]
@startuml
!pragma layout smetana
start
note right
constructor SessionWindowedKStreamImpl(final SessionWindowswindows,
final InternalStreamsBuilderbuilder,final Set<String>subTopologySourceNodes,
final Stringname,final Serde<K>keySerde,final Serde<V>valueSerde,
final GroupedStreamAggregateBuilder<K,V>aggregateBuilder,
final GraphNodegraphNode)
end note
:super (name,keySerde,valueSerde,subTopologySourceNodes,
graphNode,builder);
:Objects.requireNonNull(windows,"windows can't be null");
:this.windows=windows;
:this.aggregateBuilder=aggregateBuilder;
end
start
note right
KTable<Windowed<K>,Long>count()
end note
:return count(NamedInternal.empty());;
stop
end
start
note right
KTable<Windowed<K>,Long>count(final Namednamed)
end note
:return doCount(named,Materialized.with(keySerde,
Serdes.Long()));;
stop
end
start
note right
KTable<Windowed<K>,Long>count(final Materialized<K,
Long,SessionStore<Bytes,byte[]>>materialized)
end note
:return count(NamedInternal.empty(),materialized);;
stop
end
start
note right
KTable<Windowed<K>,Long>count(final Namednamed,
final Materialized<K,Long,SessionStore<Bytes,
byte[]>>materialized)
end note
:Objects.requireNonNull(materialized,"materialized can't be null");
if (new MaterializedInternal<>(materialized)
.storeName()==null ) then (yes) 
:builder.newStoreName(AGGREGATE_NAME);
endif 
:return doCount(named,materialized);;
stop
end
start
note right
SessionWindowedKStream<K,V>emitStrategy(final EmitStrategyemitStrategy)
end note
:this.emitStrategy=emitStrategy;
:return this;;
stop
end
start
note right
KTable<Windowed<K>,Long>doCount(final Namednamed,
final Materialized<K,Long,SessionStore<Bytes,
byte[]>>materialized)
end note
if (materializedInternal.keySerde()==null ) then (yes) 
:materializedInternal.withKeySerde(keySerde);
endif 
if (materializedInternal.valueSerde()==null ) then (yes) 
:materializedInternal.withValueSerde(Serdes.Long());
endif 
:return aggregateBuilder.build(new NamedInternal(aggregateName),
materialize(materializedInternal),new KStreamSessionWindowAggregate<>(windows,
materializedInternal.storeName(),emitStrategy,
aggregateBuilder.countInitializer,aggregateBuilder.countAggregator,
countMerger),materializedInternal.queryableStoreName(),
materializedInternal.keySerde()!=null ? new WindowedSerdes.SessionWindowedSerde<>(materializedInternal.keySerde()):null ,materializedInternal.valueSerde());;
stop
end
start
note right
KTable<Windowed<K>,V>reduce(final Reducer<V>reducer)
end note
:return reduce(reducer,NamedInternal.empty());;
stop
end
start
note right
KTable<Windowed<K>,V>reduce(final Reducer<V>reducer,
final Namednamed)
end note
:return reduce(reducer,named,Materialized.with(keySerde,
valueSerde));;
stop
end
start
note right
KTable<Windowed<K>,V>reduce(final Reducer<V>reducer,
final Materialized<K,V,SessionStore<Bytes,
byte[]>>materialized)
end note
:return reduce(reducer,NamedInternal.empty(),
materialized);;
stop
end
start
note right
KTable<Windowed<K>,V>reduce(final Reducer<V>reducer,
final Namednamed,final Materialized<K,V,SessionStore<Bytes,
byte[]>>materialized)
end note
:Objects.requireNonNull(reducer,"reducer can't be null");
:Objects.requireNonNull(named,"named can't be null");
:Objects.requireNonNull(materialized,"materialized can't be null");
if (materializedInternal.keySerde()==null ) then (yes) 
:materializedInternal.withKeySerde(keySerde);
endif 
if (materializedInternal.valueSerde()==null ) then (yes) 
:materializedInternal.withValueSerde(valueSerde);
endif 
:return aggregateBuilder.build(new NamedInternal(reduceName),
materialize(materializedInternal),new KStreamSessionWindowAggregate<>(windows,
materializedInternal.storeName(),emitStrategy,
aggregateBuilder.reduceInitializer,reduceAggregator,
mergerForAggregator(reduceAggregator)),materializedInternal.queryableStoreName(),
materializedInternal.keySerde()!=null ? new WindowedSerdes.SessionWindowedSerde<>(materializedInternal.keySerde()):null ,materializedInternal.valueSerde());;
stop
end
:return aggregate(initializer,aggregator,
sessionMerger,NamedInternal.empty());;
stop
:return aggregate(initializer,aggregator,
sessionMerger,named,Materialized.with(keySerde,
null ));;
stop
:return aggregate(initializer,aggregator,
sessionMerger,NamedInternal.empty(),materialized);;
stop
:Objects.requireNonNull(initializer,"initializer can't be null");
:Objects.requireNonNull(aggregator,"aggregator can't be null");
:Objects.requireNonNull(sessionMerger,"sessionMerger can't be null");
:Objects.requireNonNull(materialized,"materialized can't be null");
if (materializedInternal.keySerde()==null ) then (yes) 
:materializedInternal.withKeySerde(keySerde);
endif 
:return aggregateBuilder.build(new NamedInternal(aggregateName),
materialize(materializedInternal),new KStreamSessionWindowAggregate<>(windows,
materializedInternal.storeName(),emitStrategy,
initializer,aggregator,sessionMerger),materializedInternal.queryableStoreName(),
materializedInternal.keySerde()!=null ? new WindowedSerdes.SessionWindowedSerde<>(materializedInternal.keySerde()):null ,materializedInternal.valueSerde());;
stop
if (supplier==null ) then (yes) 
if ((windows.inactivityGap()+windows.gracePeriodMs())>retentionPeriod) then (yes) 
:throw new IllegalArgumentException("The retention period of the session store "+
materialized.storeName()+" must be no smaller than the session inactivity gap plus the"+
" grace period."+" Got gap=["+windows.inactivityGap()+
"],"+" grace=["+windows.gracePeriodMs()+"],"+
" retention=["+retentionPeriod+"]");;
endif 
:supplier=Stores.inMemorySessionStore(materialized.storeName(),
Duration.ofMillis(retentionPeriod));
:supplier=emitStrategy.type()==EmitStrategy.StrategyType.ON_WINDOW_CLOSE? new RocksDbTimeOrderedSessionBytesStoreSupplier(materialized.storeName(),retentionPeriod,true):Stores.persistentSessionStore(materialized.storeName(),Duration.ofMillis(retentionPeriod));
:throw new IllegalStateException("Unknown store type: "+
materialized.storeType());;
endif 
if (materialized.loggingEnabled()) then (yes) 
:builder.withLoggingEnabled(materialized.logConfig());
else (no)
:builder.withLoggingDisabled();
endif 
if (materialized.cachingEnabled()&&emitStrategy.type()!=EmitStrategy.StrategyType.ON_WINDOW_CLOSE) then (yes) 
:builder.withCachingEnabled();
endif 
:return builder;;
stop
start
note right
Merger<K,V>mergerForAggregator(final Aggregator<K,
V,V>aggregator)
end note
:return (aggKey,aggOne,aggTwo)->aggregator.apply(aggKey,
aggTwo,aggOne);;
stop
end
start
note right
Aggregator<K,V,V>aggregatorForReducer(final Reducer<V>reducer)
end note
:return (aggKey,value,aggregate)->aggregate==null ? value:reducer.apply(aggregate,
value);;
stop
end
@enduml

