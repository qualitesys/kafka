materializedInternal.storeName(),emitStrategy,
aggregateBuilder.reduceInitializer,reduceAggregator,
mergerForAggregator(reduceAggregator)),materializedInternal.queryableStoreName(),
materializedInternal.keySerde()!=null ? new WindowedSerdes.SessionWindowedSerde<>(materializedInternal.keySerde()):null ,
materializedInternal.valueSerde());;
stop
end
:return aggregate(initializer,aggregator,
sessionMerger,NamedInternal.empty());;
stop
:return aggregate(initializer,aggregator,
sessionMerger,named,Materialized.with(keySerde,
null ));;
stop
:return aggregate(initializer,aggregator,
sessionMerger,NamedInternal.empty(),materialized);;
stop
:Objects.requireNonNull(initializer,"initializer can't be null");;
:Objects.requireNonNull(aggregator,"aggregator can't be null");;
:Objects.requireNonNull(sessionMerger,"sessionMerger can't be null");;
:Objects.requireNonNull(materialized,"materialized can't be null");;
:final MaterializedInternal<K,VR,SessionStore<Bytes,
byte[]>>materializedInternal=new MaterializedInternal<>(materialized,
builder,AGGREGATE_NAME);;
if (materializedInternal.keySerde()==null ) then (yes) 
:materializedInternal.withKeySerde(keySerde);;
endif 
:final StringaggregateName=new NamedInternal(named).orElseGenerateWithPrefix(builder,
AGGREGATE_NAME);;
:return aggregateBuilder.build(new NamedInternal(aggregateName),
materialize(materializedInternal),new KStreamSessionWindowAggregate<>(windows,
materializedInternal.storeName(),emitStrategy,
