windows.gracePeriodMs();;
if ((windows.inactivityGap()+windows.gracePeriodMs())>retentionPeriod) then (yes) 
:throw new IllegalArgumentException("The retention period of the session store "+
materialized.storeName()+" must be no smaller than the session inactivity gap plus the"+
" grace period."+" Got gap=["+windows.inactivityGap()+
"],"+" grace=["+windows.gracePeriodMs()+"],"+
" retention=["+retentionPeriod+"]");;
stop
endif 
switch (switch (materialized.storeType()))
endswith
endif 
:final StoreBuilder<SessionStore<K,VR>>builder=Stores.sessionStoreBuilder(supplier,
materialized.keySerde(),materialized.valueSerde());;
if (materialized.loggingEnabled()) then (yes) 
:builder.withLoggingEnabled(materialized.logConfig());;
else (no)
:builder.withLoggingDisabled();;
endif 
if (materialized.cachingEnabled()&&emitStrategy.type()!=EmitStrategy.StrategyType.ON_WINDOW_CLOSE) then (yes) 
:builder.withCachingEnabled();;
