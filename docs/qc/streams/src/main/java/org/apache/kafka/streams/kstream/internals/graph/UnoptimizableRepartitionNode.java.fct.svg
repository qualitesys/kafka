="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="576" x2="576" y1="625.1797" y2="645.1797"/><polygon fill="#181818" points="572,635.1797,576,645.1797,580,635.1797,576,639.1797" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="576" x2="576" y1="699.7461" y2="722.3125"/><polygon fill="#181818" points="572,712.3125,576,722.3125,580,712.3125,576,716.3125" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="576" x2="576" y1="756.2813" y2="776.2813"/><polygon fill="#181818" points="572,766.2813,576,776.2813,580,766.2813,576,770.2813" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[18413e41feaad9006513fcddb81cd356]
@startuml
!pragma layout smetana
start
note right
constructor UnoptimizableRepartitionNode(final StringnodeName,final StringsourceName,final ProcessorParameters<K,V,? ,? >processorParameters,final Serde<K>keySerde,final Serde<V>valueSerde,final StringsinkName,final StringrepartitionTopic,final StreamPartitioner<K,V>partitioner,final InternalTopicPropertiesinternalTopicProperties)
end note
:super (nodeName,sourceName,processorParameters,keySerde,valueSerde,sinkName,repartitionTopic,partitioner,internalTopicProperties);
end
start
note right
void writeToTopology(final InternalTopologyBuildertopologyBuilder)
end note
:topologyBuilder.addInternalTopic(repartitionTopic,internalTopicProperties);
:processorParameters.addProcessorTo(topologyBuilder,parentNodeNames());
:topologyBuilder.addSink(sinkName,repartitionTopic,keySerializer(),valueSerializer(),partitioner,processorParameters.processorName());
:topologyBuilder.addSource(null ,sourceName,new FailOnInvalidTimestamp(),keyDeserializer(),valueDeserializer(),repartitionTopic);
end
start
note right
StringtoString()
end note
:return "UnoptimizableRepartitionNode{"+super .toString()+" }";;
stop
end
:return new UnoptimizableRepartitionNodeBuilder<>();;
stop
start
note right
UnoptimizableRepartitionNode<K,V>build()
end note
:return new UnoptimizableRepartitionNode<>(nodeName,sourceName,processorParameters,keySerde,valueSerde,sinkName,repartitionTopic,partitioner,internalTopicProperties);;
stop
end
@enduml

