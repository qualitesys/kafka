@startuml
!pragma layout smetana
start
note right
constructor UnoptimizableRepartitionNode(final String nodeName,
final String sourceName,final ProcessorParameters<K,
V,?,?> processorParameters,final Serde<K> keySerde,
final Serde<V> valueSerde,final String sinkName,
final String repartitionTopic,final StreamPartitioner<K,
V> partitioner,final InternalTopicProperties internalTopicProperties)
end note
:super (nodeName,sourceName,processorParameters,
keySerde,valueSerde,sinkName,repartitionTopic,
partitioner,internalTopicProperties);;
end
start
note right
void writeToTopology(final InternalTopologyBuilder topologyBuilder)
end note
:topologyBuilder.addInternalTopic(repartitionTopic,
internalTopicProperties);;
:processorParameters.addProcessorTo(topologyBuilder,
parentNodeNames());;
:topologyBuilder.addSink(sinkName,repartitionTopic,
keySerializer(),valueSerializer(),partitioner,
processorParameters.processorName());;
:topologyBuilder.addSource(null ,sourceName,
new FailOnInvalidTimestamp(),keyDeserializer(),
valueDeserializer(),repartitionTopic);;
end
start
note right
String toString()
end note
:return "UnoptimizableRepartitionNode{"+super .toString()+
" }";;
stop
end
:return new UnoptimizableRepartitionNodeBuilder<>();;
stop
start
note right
UnoptimizableRepartitionNode<K,V> build()
end note
:return new UnoptimizableRepartitionNode<>(nodeName,
sourceName,processorParameters,keySerde,valueSerde,
sinkName,repartitionTopic,partitioner,internalTopicProperties);;
stop
end
@enduml

