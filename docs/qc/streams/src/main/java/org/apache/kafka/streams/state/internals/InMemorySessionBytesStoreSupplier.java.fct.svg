1818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="201" x2="201" y1="945.6797" y2="965.6797"/><polygon fill="#181818" points="197,955.6797,201,965.6797,205,955.6797,201,959.6797" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[66fa19283fb61b52f33f0d9bb1def5a7]
@startuml
!pragma layout smetana
start
note right
constructor InMemorySessionBytesStoreSupplier(final Stringname,
final longretentionPeriod)
end note
:this.name=name;
:this.retentionPeriod=retentionPeriod;
end
start
note right
Stringname()
end note
:return name;;
stop
end
start
note right
SessionStore<Bytes,byte[]>get()
end note
:return new InMemorySessionStore(name,retentionPeriod,
metricsScope());;
stop
end
start
note right
StringmetricsScope()
end note
:return "in-memory-session";;
stop
end
start
note right
longsegmentIntervalMs()
end note
:return 1;;
stop
end
start
note right
longretentionPeriod()
end note
:return retentionPeriod;;
stop
end
@enduml

