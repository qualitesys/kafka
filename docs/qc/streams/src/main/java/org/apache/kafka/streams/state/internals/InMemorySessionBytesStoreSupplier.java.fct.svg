@startuml
!pragma layout smetana
start
note right
constructor InMemorySessionBytesStoreSupplier(final Stringname,final longretentionPeriod)
end note
:this.name=name;
:this.retentionPeriod=retentionPeriod;
end
start
note right
Stringname()
end note
:return name;;
stop
end
start
note right
SessionStore<Bytes,byte[]>get()
end note
:return new InMemorySessionStore(name,retentionPeriod,metricsScope());;
stop
end
start
note right
StringmetricsScope()
end note
:return "in-memory-session";;
stop
end
start
note right
longsegmentIntervalMs()
end note
:return 1;;
stop
end
start
note right
longretentionPeriod()
end note
:return retentionPeriod;;
stop
end
@enduml

