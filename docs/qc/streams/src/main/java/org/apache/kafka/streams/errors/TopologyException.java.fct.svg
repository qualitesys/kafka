@startuml
!pragma layout smetana
start
note right
constructor TopologyException(final Stringmessage)
end note
:super ("Invalid topology"+(message==null ? String.valueOf(""):String.valueOf(": ")+
message));
end
start
note right
constructor TopologyException(final Stringmessage,
final Throwablethrowable)
end note
:super ("Invalid topology"+(message==null ? String.valueOf(""):String.valueOf(": ")+
message),throwable);
end
start
note right
constructor TopologyException(final Throwablethrowable)
end note
:super (throwable);
end
@enduml

