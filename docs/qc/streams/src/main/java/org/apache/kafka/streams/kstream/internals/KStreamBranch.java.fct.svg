@startuml
!pragma layout smetana
start
note right
constructor KStreamBranch(final List<Predicate<? super K,
? super V>>predicates,final List<String>childNodes)
end note
:this.predicates=predicates;
:this.childNodes=childNodes;
end
start
note right
Processor<K,V,K,V>get()
end note
:return new KStreamBranchProcessor();;
stop
end
start
note right
void process(final Record<K,V>record)
end note
:i++;
if (predicates.get(i).test(record.key(),record.value())) then (yes) 
:context().forward(record,childNodes.get(i));
:return ;;
stop
endif 
if (childNodes.size()>predicates.size()) then (yes) 
:context().forward(record,childNodes.get(predicates.size()));
endif 
end
@enduml

