@startuml
!pragma layout smetana
start
note right
constructor RocksDbIterator(final StringstoreName,
final RocksIteratoriter,final Set<KeyValueIterator<Bytes,
byte[]>>openIterators,final booleanforward)
end note
end
start
note right
booleanhasNext()
end note
if (!open) then (yes) 
:throw new InvalidStateStoreException(String.format("RocksDB iterator for store %s has closed",
storeName));;
endif 
:return super .hasNext();;
stop
end
start
note right
KeyValue<Bytes,byte[]>makeNext()
end note
if (!iter.isValid()) then (yes) 
:return allDone();;
stop
else (no)
:return next;;
stop
endif 
end
start
note right
KeyValue<Bytes,byte[]>getKeyValue()
end note
:return new KeyValue<>(new Bytes(iter.key()),
iter.value());;
stop
end
start
note right
void close()
end note
end
