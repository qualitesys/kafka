@startuml
!pragma layout smetana
start
note right
constructor SourceGraphNode(final StringnodeName,
final Collection<String>topicNames,final ConsumedInternal<K,
V>consumedInternal)
end note
:super (nodeName);;
:this.topicNames=new HashSet<>(topicNames);;
:this.topicPattern=null ;;
:this.consumedInternal=consumedInternal;;
end
start
note right
constructor SourceGraphNode(final StringnodeName,
final PatterntopicPattern,final ConsumedInternal<K,
V>consumedInternal)
end note
:super (nodeName);;
:this.topicNames=null ;;
:this.topicPattern=topicPattern;;
:this.consumedInternal=consumedInternal;;
end
start
note right
Optional<Set<String>>topicNames()
end note
:return topicNames==null ? Optional.empty():Optional.of(Collections.unmodifiableSet(topicNames));;
stop
end
start
note right
Optional<Pattern>topicPattern()
end note
:return Optional.ofNullable(topicPattern);;
stop
end
start
note right
ConsumedInternal<K,V>consumedInternal()
end note
:return consumedInternal;;
stop
end
start
note right
Serde<K>keySerde()
end note
:return consumedInternal.keySerde();;
stop
end
start
note right
Serde<V>valueSerde()
end note
:return consumedInternal.valueSerde();;
stop
end
@enduml

