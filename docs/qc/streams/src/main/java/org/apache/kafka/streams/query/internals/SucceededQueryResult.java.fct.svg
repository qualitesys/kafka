@startuml
!pragma layout smetana
start
note right
constructor SucceededQueryResult(final Rresult)
end note
:this.result=result;
end
start
note right
constructor SucceededQueryResult(final Rresult,final List<String>executionInfo,final Positionposition)
end note
:super (executionInfo,position);
:this.result=result;
end
start
note right
booleanisSuccess()
end note
:return true;;
stop
end
start
note right
booleanisFailure()
end note
:return false;;
stop
end
start
note right
FailureReasongetFailureReason()
end note
:throw new IllegalArgumentException("Cannot get failure reason because this query did not fail.");;
end
start
note right
StringgetFailureMessage()
end note
:throw new IllegalArgumentException("Cannot get failure message because this query did not fail.");;
end
start
note right
RgetResult()
end note
:return result;;
stop
end
start
note right
StringtoString()
end note
:return "SucceededQueryResult{"+"result="+
result+", executionInfo="+getExecutionInfo()+
", position="+getPosition()+'}';;
stop
end
@enduml

