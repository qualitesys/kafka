e="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="321.5" x2="321.5" y1="983.3477" y2="1005.9141"/><polygon fill="#181818" points="317.5,995.9141,321.5,1005.9141,325.5,995.9141,321.5,999.9141" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="321.5" x2="321.5" y1="1039.8828" y2="1059.8828"/><polygon fill="#181818" points="317.5,1049.8828,321.5,1059.8828,325.5,1049.8828,321.5,1053.8828" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[e71c7b8ae32c14fcc758b8f2f2caedb4]
@startuml
!pragma layout smetana
start
note right
constructor KStreamTransformValues(final ValueTransformerWithKeySupplier<KIn,
VIn,VOut>valueTransformerSupplier)
end note
:this.valueTransformerSupplier=valueTransformerSupplier;;
end
start
note right
Processor<KIn,VIn,KIn,VOut>get()
end note
:return new KStreamTransformValuesProcessor<>(valueTransformerSupplier.get());;
stop
end
start
note right
Set<StoreBuilder<? >>stores()
end note
:return valueTransformerSupplier.stores();;
stop
end
start
note right
constructor KStreamTransformValuesProcessor(final ValueTransformerWithKey<KIn,
VIn,VOut>valueTransformer)
end note
:this.valueTransformer=valueTransformer;;
end
start
note right
void init(final ProcessorContext<KIn,VOut>context)
end note
:super .init(context);;
:valueTransformer.init(new ForwardingDisabledProcessorContext((InternalProcessorContext<KIn,
VOut>)context));;
end
start
note right
void process(final Record<KIn,VIn>record)
end note
:context().forward(record.withValue(valueTransformer.transform(record.key(),
record.value())));;
end
start
note right
void close()
end note
:valueTransformer.close();;
end
@enduml

