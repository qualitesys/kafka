181818" points="368.5,1005.6484,372.5,1015.6484,376.5,1005.6484,372.5,1009.6484" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[5b06004f5b3901a852dc8fe377af854d]
@startuml
!pragma layout smetana
start
note right
constructor KStreamTransformValues(final ValueTransformerWithKeySupplier<KIn,VIn,VOut>valueTransformerSupplier)
end note
:this.valueTransformerSupplier=valueTransformerSupplier;
end
start
note right
Processor<KIn,VIn,KIn,VOut>get()
end note
:return new KStreamTransformValuesProcessor<>(valueTransformerSupplier.get());;
stop
end
start
note right
Set<StoreBuilder<? >>stores()
end note
:return valueTransformerSupplier.stores();;
stop
end
start
note right
constructor KStreamTransformValuesProcessor(final ValueTransformerWithKey<KIn,VIn,VOut>valueTransformer)
end note
:this.valueTransformer=valueTransformer;
end
start
note right
void init(final ProcessorContext<KIn,VOut>context)
end note
:super .init(context);
:valueTransformer.init(new ForwardingDisabledProcessorContext((InternalProcessorContext<KIn,VOut>)context));
end
start
note right
void process(final Record<KIn,VIn>record)
end note
:context().forward(record.withValue(valueTransformer.transform(record.key(),
record.value())));
end
start
note right
void close()
end note
:valueTransformer.close();
end
@enduml

