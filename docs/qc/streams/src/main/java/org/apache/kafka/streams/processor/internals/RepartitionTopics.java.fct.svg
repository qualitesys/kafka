 y="160.0469">...</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="185" x="5" y="176.3438">... ( skipping 129 lines )</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="15" x="5" y="192.6406">...</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="637" x="5" y="208.9375">:log.error("Unable to determine the number of partitions of all repartition topics,</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="607" x="10" y="225.2344">most likely a source topic is missing or pattern doesn't match any topics\n"+</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="335" x="5" y="241.5313">"topic groups: {}\n"+"cluster topics: {}.",</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="306" x="5" y="257.8281">topicGroups,clusterMetadata.topics());</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="845" x="5" y="274.125">:throw new TaskAssignmentException("Failed to compute number of partitions for all repartition topics, "+</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="909" x="5" y="290.4219">"make sure all user input topics are created and all Pattern subscriptions match at least one topic in the cluster");;</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="40" x="5" y="306.7188">endif</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="290" x="5" y="323.0156">repeat while (partitionCountNeeded)</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="30" x="5" y="339.3125">end</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="37" x="5" y="355.6094">start</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="78" x="5" y="371.9063">note right</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="379" x="5" y="388.2031">IntegercomputePartitionCount(final Map&lt;String,</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="369" x="5" y="404.5">InternalTopicConfig&gt;repartitionTopicMetadata,</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="551" x="5" y="420.7969">final Collection&lt;TopicsInfo&gt;topicGroups,final ClusterclusterMetadata,</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="273" x="5" y="437.0938">final StringrepartitionSourceTopic)</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="71" x="5" y="453.3906">end note</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="463" x="5" y="469.6875">if (sinkTopics.contains(repartitionSourceTopic)) then (yes)</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="599" x="5" y="485.9844">if (repartitionTopicMetadata.containsKey(upstreamSourceTopic)) then (yes)</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="436" x="5" y="502.2813">if (repartitionTopicMetadata.get(upstreamSourceTopic)</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" text-decoration="wavy underline" textLength="355" x="5" y="518.5781">.numberOfPartitions().isPresent()) then (yes)</text><text fill="#FF0000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="106" x="10" y="534.875">Syntax Error?</text><!--MD5=[649374cd181ebc306552a7f7e31787d7]
@startuml
!pragma layout smetana
start
note right
constructor RepartitionTopics(final TopologyMetadatatopologyMetadata,
final InternalTopicManagerinternalTopicManager,
final CopartitionedTopicsEnforcercopartitionedTopicsEnforcer,
final ClusterclusterMetadata,final StringlogPrefix)
end note
:this.topologyMetadata=topologyMetadata;
:this.internalTopicManager=internalTopicManager;
:this.clusterMetadata=clusterMetadata;
:this.copartitionedTopicsEnforcer=copartitionedTopicsEnforcer;
:log=logContext.logger(getClass());
end
start
note right
void setup()
end note
if (repartitionTopicMetadata.isEmpty()) then (yes) 
if (missingInputTopicsBySubtopology.isEmpty()) then (yes) 
:log.info("Skipping the repartition topic validation since there are no repartition topics.");
else (no)
:log.info("Skipping the repartition topic validation since all topologies containing repartition"+
"topics are missing external user source topics and cannot be processed.");
endif 
else (no)
:ensureCopartitioning(topologyMetadata.copartitionGroups(),
repartitionTopicMetadata,clusterMetadata);
:internalTopicManager.makeReady(repartitionTopicMetadata);
:partition++;
:topicPartitionInfos.put(new TopicPartition(topic,
partition),new PartitionInfo(topic,partition,
null ,new Node[0],new Node[0]));
endif 
end
start
note right
Set<String>topologiesWithMissingInputTopics()
end note
:return missingInputTopicsBySubtopology.keySet()
.stream().map(s->getTopologyNameOrElseUnnamed(s.namedTopology))
.collect(Collectors.toSet());;
stop
end
start
note right
Queue<StreamsException>missingSourceTopicExceptions()
end note
:return missingInputTopicsBySubtopology.entrySet()
.stream().map(entry->{final Set<String>missingSourceTopics=entry.getValue();final intsubtopologyId=entry.getKey()
.nodeGroupId;final StringtopologyName=entry.getKey()
.namedTopology;return new StreamsException(new MissingSourceTopicException(String.format("Missing source topics %s for subtopology %d of topology %s",missingSourceTopics,subtopologyId,topologyName)),new TaskId(subtopologyId,0,topologyName));}).collect(Collectors.toCollection(LinkedList::new ));;
stop
end
start
note right
Map<TopicPartition,PartitionInfo>topicPartitionsInfo()
end note
:return Collections.unmodifiableMap(topicPartitionInfos);;
stop
end
start
note right
Map<String,InternalTopicConfig>computeRepartitionTopicConfig(final ClusterclusterMetadata)
end note
:topicsInfoForTopology.add(topicsInfo);
:repartitionTopicConfigsForTopology.putAll(topicsInfo.repartitionSourceTopics.values()
.stream().collect(Collectors.toMap(InternalTopicConfig::name,
topicConfig->topicConfig)));
:missingSourceTopicsForTopology.addAll(missingSourceTopicsForSubtopology);
if (!missingSourceTopicsForSubtopology.isEmpty()) then (yes) 
:missingInputTopicsBySubtopology.put(subtopology,
missingSourceTopicsForSubtopology);
:log.error("Subtopology {} was missing source topics {} and will be excluded from the current assignment, "+
"this can be due to the consumer client's metadata being stale or because they have "+
"not been created yet. Please verify that you have created all input topics; if they "+
"do exist, you just need to wait for the metadata to be updated, at which time a new "+
"rebalance will be kicked off automatically and the topology will be retried at that time.",
subtopology.nodeGroupId,missingSourceTopicsForSubtopology);
endif 
if (missingSourceTopicsForTopology.isEmpty()) then (yes) 
:allRepartitionTopicConfigs.putAll(repartitionTopicConfigsForTopology);
:allTopicsInfo.addAll(topicsInfoForTopology);
else (no)
:log.debug("Skipping repartition topic validation for entire topology {} due to missing source topics {}",
topologyName,missingSourceTopicsForTopology);
endif 
:setRepartitionSourceTopicPartitionCount(allRepartitionTopicConfigs,
allTopicsInfo,clusterMetadata);
:return allRepartitionTopicConfigs;;
stop
end
start
note right
void ensureCopartitioning(final Collection<Set<String>>copartitionGroups,
final Map<String,InternalTopicConfig>repartitionTopicMetadata,
final ClusterclusterMetadata)
end note
:copartitionedTopicsEnforcer.enforce(copartitionGroup,
repartitionTopicMetadata,clusterMetadata);
end
start
note right
Set<String>computeMissingExternalSourceTopics(final TopicsInfotopicsInfo,
final ClusterclusterMetadata)
end note
:missingExternalSourceTopics.removeAll(topicsInfo.repartitionSourceTopics.keySet());
:missingExternalSourceTopics.removeAll(clusterMetadata.topics());
:return missingExternalSourceTopics;;
stop
end
start
note right
void setRepartitionSourceTopicPartitionCount(final Map<String,
InternalTopicConfig>repartitionTopicMetadata,
final Collection<TopicsInfo>topicGroups,final ClusterclusterMetadata)
end note
repeat
:partitionCountNeeded=false;
if (!repartitionSourceTopicPartitionCount.isPresent()) then (yes) 
if (numPartitions==null ) then (yes) 
:partitionCountNeeded=true;
:log.trace("Unable to determine number of partitions for {},
 another iteration is needed",repartitionSourceTopic);
else (no)
:log.trace("Determined number of partitions for {} to be {}",
repartitionSourceTopic,numPartitions);
:repartitionTopicMetadata.get(repartitionSourceTopic)
.setNumberOfPartitions(numPartitions);
:progressMadeThisIteration=true;
endif 
endif 
if (!progressMadeThisIteration&&partitionCountNeeded) then (yes) 
:log.error("Unable to determine the number of partitions of all repartition topics,
 most likely a source topic is missing or pattern doesn't match any topics\n"+
"topic groups: {}\n"+"cluster topics: {}.",
topicGroups,clusterMetadata.topics());
:throw new TaskAssignmentException("Failed to compute number of partitions for all repartition topics, "+
"make sure all user input topics are created and all Pattern subscriptions match at least one topic in the cluster");;
endif 
repeat while (partitionCountNeeded)
end
start
note right
IntegercomputePartitionCount(final Map<String,
InternalTopicConfig>repartitionTopicMetadata,
final Collection<TopicsInfo>topicGroups,final ClusterclusterMetadata,
final StringrepartitionSourceTopic)
end note
if (sinkTopics.contains(repartitionSourceTopic)) then (yes) 
if (repartitionTopicMetadata.containsKey(upstreamSourceTopic)) then (yes) 
if (repartitionTopicMetadata.get(upstreamSourceTopic)
.numberOfPartitions().isPresent()) then (yes) 
:numPartitionsCandidate=repartitionTopicMetadata.get(upstreamSourceTopic)
.numberOfPartitions().get();
endif 
else (no)
if (count==null ) then (yes) 
:throw new TaskAssignmentException("No partition count found for source topic "+
upstreamSourceTopic+", but it should have been.");;
endif 
:numPartitionsCandidate=count;
endif 
if (numPartitionsCandidate!=null ) then (yes) 
if (partitionCount==null ||numPartitionsCandidate>partitionCount) then (yes) 
:partitionCount=numPartitionsCandidate;
endif 
endif 
endif 
:return partitionCount;;
stop
end
@enduml

