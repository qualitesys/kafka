@startuml
!pragma layout smetana
start
note right
constructor SessionWindowedCogroupedKStreamImpl(final SessionWindowssessionWindows,
final InternalStreamsBuilderbuilder,final Set<String>subTopologySourceNodes,
final Stringname,final CogroupedStreamAggregateBuilder<K,
V>aggregateBuilder,final GraphNodegraphNode,
final Map<KGroupedStreamImpl<K,? >,Aggregator<? super K,
? super Object,V>>groupPatterns)
end note
:super (name,null ,null ,subTopologySourceNodes,
graphNode,builder);;
:this.sessionWindows=sessionWindows;;
:this.aggregateBuilder=aggregateBuilder;;
:this.groupPatterns=groupPatterns;;
end
start
note right
KTable<Windowed<K>,V>aggregate(final Initializer<V>initializer,
final Merger<? super K,V>sessionMerger)
end note
:return aggregate(initializer,sessionMerger,
Materialized.with(null ,null ));;
stop
end
start
note right
KTable<Windowed<K>,V>aggregate(final Initializer<V>initializer,
final Merger<? super K,V>sessionMerger,final Materialized<K,
V,SessionStore<Bytes,byte[]>>materialized)
end note
:return aggregate(initializer,sessionMerger,
NamedInternal.empty(),materialized);;
stop
end
start
note right
KTable<Windowed<K>,V>aggregate(final Initializer<V>initializer,
final Merger<? super K,V>sessionMerger,final Namednamed)
end note
:return aggregate(initializer,sessionMerger,
named,Materialized.with(null ,null ));;
stop
end
start
note right
KTable<Windowed<K>,V>aggregate(final Initializer<V>initializer,
final Merger<? super K,V>sessionMerger,final Namednamed,
final Materialized<K,V,SessionStore<Bytes,
byte[]>>materialized)
end note
:Objects.requireNonNull(initializer,"initializer can't be null");;
:Objects.requireNonNull(sessionMerger,"sessionMerger can't be null");;
:Objects.requireNonNull(materialized,"materialized can't be null");;
:Objects.requireNonNull(named,"named can't be null");;
:final MaterializedInternal<K,V,SessionStore<Bytes,
byte[]>>materializedInternal=new MaterializedInternal<>(materialized,
builder,CogroupedKStreamImpl.AGGREGATE_NAME);;
:return aggregateBuilder.build(groupPatterns,
initializer,new NamedInternal(named),materialize(materializedInternal),
materializedInternal.keySerde()!=null ? new WindowedSerdes.SessionWindowedSerde<>(materializedInternal.keySerde()):null ,
materializedInternal.valueSerde(),materializedInternal.queryableStoreName(),
sessionWindows,sessionMerger);;
stop
end
start
note right
StoreBuilder<SessionStore<K,V>>materialize(final MaterializedInternal<K,
V,SessionStore<Bytes,byte[]>>materialized)
end note
:SessionBytesStoreSuppliersupplier=(SessionBytesStoreSupplier)materialized.storeSupplier();;
if (supplier==null ) then (yes) 
:final longretentionPeriod=materialized.retention()!=null ? materialized.retention().toMillis():sessionWindows.inactivityGap()+
sessionWindows.gracePeriodMs();;
if ((sessionWindows.inactivityGap()+sessionWindows.gracePeriodMs())>retentionPeriod) then (yes) 
:throw new IllegalArgumentException("The retention period of the session store "+
materialized.storeName()+" must be no smaller than the session inactivity gap plus the"+
" grace period."+" Got gap=["+sessionWindows.inactivityGap()+
"],"+" grace=["+sessionWindows.gracePeriodMs()+
"],"+" retention=["+retentionPeriod+"]");;
stop
endif 
switch (switch (materialized.storeType()))
endswith
endif 
:final StoreBuilder<SessionStore<K,V>>builder=Stores.sessionStoreBuilder(supplier,
materialized.keySerde(),materialized.valueSerde());;
if (materialized.loggingEnabled()) then (yes) 
:builder.withLoggingEnabled(materialized.logConfig());;
else (no)
:builder.withLoggingDisabled();;
endif 
if (materialized.cachingEnabled()) then (yes) 
:builder.withCachingEnabled();;
endif 
:return builder;;
stop
end
@enduml

