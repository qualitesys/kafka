@startuml
!pragma layout smetana
start
note right
longonInvalidTimestamp(final ConsumerRecord<Object,Object>record,final longrecordTimestamp,final longpartitionTime)
end note
:log.warn("Input record {} will be dropped because it has an invalid (negative) timestamp.",record);
:return recordTimestamp;;
stop
end
@enduml

