@startuml
!pragma layout smetana
start
note right
constructor MergedSortedCacheWindowStoreIterator(final PeekingKeyValueIterator<Bytes,
LRUCacheEntry> cacheIterator,final KeyValueIterator<Long,
byte[]> storeIterator,final boolean forward)
end note
:this(cacheIterator,storeIterator,forward,
WindowKeySchema::extractStoreTimestamp);;
end
start
note right
constructor MergedSortedCacheWindowStoreIterator(final PeekingKeyValueIterator<Bytes,
LRUCacheEntry> cacheIterator,final KeyValueIterator<Long,
byte[]> storeIterator,final boolean forward,
final Function<byte[],Long> tsExtractor)
end note
:super (cacheIterator,storeIterator,forward);;
:this.timestampExtractor=tsExtractor;;
end
start
note right
KeyValue<Long,byte[]> deserializeStorePair(final KeyValue<Long,
byte[]> pair)
end note
:return pair;;
stop
end
start
note right
Long deserializeCacheKey(final Bytes cacheKey)
end note
:final byte[] binaryKey=bytesFromCacheKey(cacheKey);;
:return timestampExtractor.apply(binaryKey);;
stop
end
start
note right
byte[] deserializeCacheValue(final LRUCacheEntry cacheEntry)
end note
:return cacheEntry.value();;
stop
end
start
note right
Long deserializeStoreKey(final Long key)
end note
:return key;;
stop
end
start
note right
int compare(final Bytes cacheKey,final Long storeKey)
end note
:final byte[] binaryKey=bytesFromCacheKey(cacheKey);;
:final Long cacheTimestamp=timestampExtractor.apply(binaryKey);;
:return cacheTimestamp.compareTo(storeKey);;
stop
end
