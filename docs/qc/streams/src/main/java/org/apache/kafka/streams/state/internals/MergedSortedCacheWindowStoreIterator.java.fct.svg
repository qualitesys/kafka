@startuml
!pragma layout smetana
start
note right
constructor MergedSortedCacheWindowStoreIterator(final PeekingKeyValueIterator<Bytes,
LRUCacheEntry>cacheIterator,final KeyValueIterator<Long,
byte[]>storeIterator,final booleanforward)
end note
:this(cacheIterator,storeIterator,forward,
WindowKeySchema::extractStoreTimestamp);;
end
start
note right
constructor MergedSortedCacheWindowStoreIterator(final PeekingKeyValueIterator<Bytes,
LRUCacheEntry>cacheIterator,final KeyValueIterator<Long,
byte[]>storeIterator,final booleanforward,
final Function<byte[],Long>tsExtractor)
end note
:super (cacheIterator,storeIterator,forward);;
:this.timestampExtractor=tsExtractor;;
end
start
note right
KeyValue<Long,byte[]>deserializeStorePair(final KeyValue<Long,
byte[]>pair)
end note
:return pair;;
stop
end
start
note right
LongdeserializeCacheKey(final BytescacheKey)
end note
:final byte[]binaryKey=bytesFromCacheKey(cacheKey);;
:return timestampExtractor.apply(binaryKey);;
stop
end
start
note right
byte[]deserializeCacheValue(final LRUCacheEntrycacheEntry)
end note
:return cacheEntry.value();;
stop
end
start
note right
LongdeserializeStoreKey(final Longkey)
end note
:return key;;
stop
end
start
note right
intcompare(final BytescacheKey,final LongstoreKey)
end note
:final byte[]binaryKey=bytesFromCacheKey(cacheKey);;
:final LongcacheTimestamp=timestampExtractor.apply(binaryKey);;
:return cacheTimestamp.compareTo(storeKey);;
stop
end
@enduml

