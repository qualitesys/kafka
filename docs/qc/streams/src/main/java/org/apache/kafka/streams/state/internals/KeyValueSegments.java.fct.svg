@startuml
!pragma layout smetana
start
note right
constructor KeyValueSegments(final Stringname,final StringmetricsScope,final longretentionPeriod,final longsegmentInterval)
end note
:super (name,retentionPeriod,segmentInterval);
:metricsRecorder=new RocksDBMetricsRecorder(metricsScope,
name);
end
start
note right
KeyValueSegmentgetOrCreateSegment(final longsegmentId,final ProcessorContextcontext)
end note
if (segments.containsKey(segmentId)) then (yes) 
:return segments.get(segmentId);;
stop
else (no)
if (segments.put(segmentId,newSegment)!=null ) then (yes) 
:throw new IllegalStateException("KeyValueSegment already exists. Possible concurrent access.");;
endif 
:newSegment.openDB(context.appConfigs(),context.stateDir());
:return newSegment;;
stop
endif 
end
start
note right
void openExisting(final ProcessorContextcontext,final longstreamTime)
end note
:metricsRecorder.init(ProcessorContextUtils.getMetricsImpl(context),
context.taskId());
:super .openExisting(context,streamTime);
end
@enduml

