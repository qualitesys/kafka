1818" points="582,321.5703,586,331.5703,590,321.5703,586,325.5703" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="356" x2="356" y1="267.4375" y2="297.5703"/><polygon fill="#181818" points="352,287.5703,356,297.5703,360,287.5703,356,291.5703" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="356" x2="356" y1="788.4336" y2="818.5664"/><polygon fill="#181818" points="352,808.5664,356,818.5664,360,808.5664,356,812.5664" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="356" x2="356" y1="866.5039" y2="886.5039"/><polygon fill="#181818" points="352,876.5039,356,886.5039,360,876.5039,356,880.5039" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="356" x2="356" y1="920.4727" y2="940.4727"/><polygon fill="#181818" points="352,930.4727,356,940.4727,360,930.4727,356,934.4727" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[ef3c19975955033288e39314f279cbd1]
@startuml
!pragma layout smetana
start
note right
constructor KeyValueSegments(final String name,
final String metricsScope,final long retentionPeriod,
final long segmentInterval)
end note
:super (name,retentionPeriod,segmentInterval);;
:metricsRecorder=new RocksDBMetricsRecorder(metricsScope,
name);;
end
start
note right
KeyValueSegment getOrCreateSegment(final long segmentId,
final ProcessorContext context)
end note
if (segments.containsKey(segmentId)) then (yes) 
:return segments.get(segmentId);;
stop
else (no)
:final KeyValueSegment newSegment=new KeyValueSegment(segmentName(segmentId),
name,segmentId,metricsRecorder);;
if (segments.put(segmentId,newSegment)!=null ) then (yes) 
:throw new IllegalStateException("KeyValueSegment already exists. Possible concurrent access.");;
stop
endif 
:newSegment.openDB(context.appConfigs(),context.stateDir());;
:return newSegment;;
stop
endif 
end
start
note right
void openExisting(final ProcessorContext context,
final long streamTime)
end note
:metricsRecorder.init(ProcessorContextUtils.getMetricsImpl(context),
context.taskId());;
:super .openExisting(context,streamTime);;
end
@enduml

