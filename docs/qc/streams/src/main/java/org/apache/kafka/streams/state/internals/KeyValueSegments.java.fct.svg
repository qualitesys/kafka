98.6797" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="356" x2="356" y1="838.6484" y2="858.6484"/><polygon fill="#181818" points="352,848.6484,356,858.6484,360,848.6484,356,852.6484" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[b35877de85e079bab267a8ebdd84e887]
@startuml
!pragma layout smetana
start
note right
constructor KeyValueSegments(final Stringname,
final StringmetricsScope,final longretentionPeriod,
final longsegmentInterval)
end note
:super (name,retentionPeriod,segmentInterval);;
:metricsRecorder=new RocksDBMetricsRecorder(metricsScope,
name);;
end
start
note right
KeyValueSegmentgetOrCreateSegment(final longsegmentId,
final ProcessorContextcontext)
end note
if (segments.containsKey(segmentId)) then (yes) 
:return segments.get(segmentId);;
stop
else (no)
if (segments.put(segmentId,newSegment)!=null ) then (yes) 
:throw new IllegalStateException("KeyValueSegment already exists. Possible concurrent access.");;
stop
endif 
:newSegment.openDB(context.appConfigs(),context.stateDir());;
:return newSegment;;
stop
endif 
end
start
note right
void openExisting(final ProcessorContextcontext,
final longstreamTime)
end note
:metricsRecorder.init(ProcessorContextUtils.getMetricsImpl(context),
context.taskId());;
:super .openExisting(context,streamTime);;
end
@enduml

