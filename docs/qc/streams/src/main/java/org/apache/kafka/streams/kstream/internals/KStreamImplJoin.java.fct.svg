@startuml
!pragma layout smetana
start
note right
void setEmitInterval(final longemitIntervalMs)
end note
:this.emitIntervalMs=emitIntervalMs;
end
start
note right
void advanceStreamTime(final longrecordTimestamp)
end note
:streamTime=Math.max(recordTimestamp,streamTime);
end
start
note right
void updatedMinTime(final longrecordTimestamp)
end note
:minTime=Math.min(recordTimestamp,minTime);
end
start
note right
void advanceNextTimeToEmit()
end note
:nextTimeToEmit+=emitIntervalMs;
end
start
note right
constructor KStreamImplJoin(final InternalStreamsBuilderbuilder,
final booleanleftOuter,final booleanrightOuter)
end note
:this.builder=builder;
:this.leftOuter=leftOuter;
:this.rightOuter=rightOuter;
end
:assertUniqueStoreNames(thisStoreSupplier,
otherStoreSupplier);
if (thisStoreSupplier==null ) then (yes) 
:thisWindowStore=joinWindowStoreBuilder(thisJoinStoreName,
windows,streamJoinedInternal.keySerde(),streamJoinedInternal.valueSerde(),
streamJoinedInternal.loggingEnabled(),streamJoinedInternal.logConfig());
else (no)
:assertWindowSettings(thisStoreSupplier,windows);
:thisWindowStore=joinWindowStoreBuilderFromSupplier(thisStoreSupplier,
streamJoinedInternal.keySerde(),streamJoinedInternal.valueSerde());
endif 
if (otherStoreSupplier==null ) then (yes) 
:otherWindowStore=joinWindowStoreBuilder(otherJoinStoreName,
windows,streamJoinedInternal.keySerde(),streamJoinedInternal.otherValueSerde(),
streamJoinedInternal.loggingEnabled(),streamJoinedInternal.logConfig());
else (no)
:assertWindowSettings(otherStoreSupplier,
windows);
:otherWindowStore=joinWindowStoreBuilderFromSupplier(otherStoreSupplier,
streamJoinedInternal.keySerde(),streamJoinedInternal.otherValueSerde());
endif 
:builder.addGraphNode(thisGraphNode,thisWindowedStreamsNode);
:builder.addGraphNode(otherGraphNode,otherWindowedStreamsNode);
if (leftOuter) then (yes) 
:outerJoinWindowStore=Optional.of(sharedOuterJoinWindowStoreBuilder(windows,
streamJoinedInternal,joinThisGeneratedName));
endif 
:joinBuilder.withJoinMergeProcessorParameters(joinMergeProcessorParams)
.withJoinThisProcessorParameters(joinThisProcessorParams)
.withJoinOtherProcessorParameters(joinOtherProcessorParams)
.withThisWindowStoreBuilder(thisWindowStore)
.withOtherWindowStoreBuilder(otherWindowStore)
.withThisWindowedStreamProcessorParameters(thisWindowStreamProcessorParams)
.withOtherWindowedStreamProcessorParameters(otherWindowStreamProcessorParams)
.withOuterJoinWindowStoreBuilder(outerJoinWindowStore)
.withValueJoiner(joiner).withNodeName(joinMergeName);
if (internalWindows.spuriousResultFixEnabled()) then (yes) 
:joinBuilder.withSpuriousResultFixEnabled();
endif 
:builder.addGraphNode(Arrays.asList(thisGraphNode,
otherGraphNode),joinGraphNode);
:allSourceNodes.addAll(((KStreamImpl<K,V2>)other)
.subTopologySourceNodes);
:return new KStreamImpl<>(joinMergeName,streamJoinedInternal.keySerde(),
null ,allSourceNodes,false,joinGraphNode,
builder);;
stop
start
note right
void assertWindowSettings(final WindowBytesStoreSuppliersupplier,
final JoinWindowsjoinWindows)
end note
if (!supplier.retainDuplicates()) then (yes) 
:throw new StreamsException("The StoreSupplier must set retainDuplicates=true,
 found retainDuplicates=false");;
endif 
if (!allMatch) then (yes) 
:throw new StreamsException(String.format("Window settings mismatch. WindowBytesStoreSupplier settings %s must match JoinWindows settings %s"+" for the window size and retention period",supplier,joinWindows));;
endif 
end
start
note right
void assertUniqueStoreNames(final WindowBytesStoreSuppliersupplier,
final WindowBytesStoreSupplierotherSupplier)
end note
if (supplier!=null &&otherSupplier!=null &&supplier.name()
.equals(otherSupplier.name())) then (yes) 
:throw new StreamsException("Both StoreSuppliers have the same name.  StoreSuppliers must provide unique names");;
endif 
end
if (loggingEnabled) then (yes) 
:builder.withLoggingEnabled(logConfig);
else (no)
:builder.withLoggingDisabled();
endif 
:return builder;;
stop
if (streamJoinedInternal.thisStoreSupplier()!=null &&!streamJoinedInternal.thisStoreSupplier()
.name().isEmpty()) then (yes) 
:return streamJoinedInternal.thisStoreSupplier().name()+
outerJoinSuffix;;
stop
else (no)
:return KStreamImpl.OUTERSHARED_NAME+joinThisGeneratedName.substring(rightOuter? KStreamImpl.OUTERTHIS_NAME.length():KStreamImpl.JOINTHIS_NAME.length());;
stop
endif 
if (retentionMs<0L) then (yes) 
:throw new IllegalArgumentException("retentionPeriod cannot be negative");;
endif 
if (windowSizeMs<0L) then (yes) 
:throw new IllegalArgumentException("windowSize cannot be negative");;
endif 
if (windowSizeMs>retentionMs) then (yes) 
:throw new IllegalArgumentException("The retention period of the window store "+
storeName+" must be no smaller than its window size. Got size=["+
windowSizeMs+"], retention=["+retentionMs+
"]");;
endif 
if (streamJoinedInternal.loggingEnabled()) then (yes) 
:builder.withLoggingEnabled(streamJoinedInternal.logConfig());
else (no)
:builder.withLoggingDisabled();
endif 
:return builder;;
stop
:return Stores.windowStoreBuilder(storeSupplier,
keySerde,valueSerde);;
stop
@enduml

