@startuml
!pragma layout smetana
start
note right
constructor KeyValueSegment(final String segmentName,
final String windowName,final long id,final RocksDBMetricsRecorder metricsRecorder)
end note
:super (segmentName,windowName,metricsRecorder);;
:this.id=id;;
end
start
note right
void destroy()
end note
:Utils.delete(dbDir);;
end
start
note right
void deleteRange(final Bytes keyFrom,final Bytes keyTo)
end note
:super .deleteRange(keyFrom,keyTo);;
end
start
note right
int compareTo(final KeyValueSegment segment)
end note
:return Long.compare(id,segment.id);;
stop
end
start
note right
