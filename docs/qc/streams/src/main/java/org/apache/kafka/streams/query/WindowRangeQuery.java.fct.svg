@startuml
!pragma layout smetana
start
note right
constructor WindowRangeQuery(final Optional<K>key,final Optional<Instant>timeFrom,final Optional<Instant>timeTo)
end note
:this.key=key;
:this.timeFrom=timeFrom;
:this.timeTo=timeTo;
end
:return new WindowRangeQuery<>(Optional.of(key),
Optional.empty(),Optional.empty());;
stop
:return new WindowRangeQuery<>(Optional.empty(),
Optional.of(timeFrom),Optional.of(timeTo));;
stop
start
note right
Optional<K>getKey()
end note
:return key;;
stop
end
start
note right
Optional<Instant>getTimeFrom()
end note
:return timeFrom;;
stop
end
start
note right
Optional<Instant>getTimeTo()
end note
:return timeTo;;
stop
end
start
note right
StringtoString()
end note
:return "WindowRangeQuery{"+"key="+key+", timeFrom="+
timeFrom+", timeTo="+timeTo+'}';;
stop
end
@enduml

