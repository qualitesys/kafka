@startuml
!pragma layout smetana
start
note right
constructor InMemoryWindowBytesStoreSupplier(final Stringname,
final longretentionPeriod,final longwindowSize,
final booleanretainDuplicates)
end note
end
start
note right
Stringname()
end note
:return name;;
stop
end
start
note right
WindowStore<Bytes,byte[]>get()
end note
:return new InMemoryWindowStore(name,retentionPeriod,
windowSize,retainDuplicates,metricsScope());;
stop
end
start
note right
StringmetricsScope()
end note
:return "in-memory-window";;
stop
end
start
note right
longretentionPeriod()
end note
:return retentionPeriod;;
stop
end
start
note right
longwindowSize()
end note
:return windowSize;;
stop
end
start
note right
longsegmentIntervalMs()
end note
:return 1;;
stop
end
start
note right
booleanretainDuplicates()
end note
:return retainDuplicates;;
stop
end
start
note right
StringtoString()
end note
:return "InMemoryWindowBytesStoreSupplier{"+
"name='"+name+'\''+", retentionPeriod="+retentionPeriod+
", windowSize="+windowSize+", retainDuplicates="+
retainDuplicates+'}';;
stop
end
@enduml

