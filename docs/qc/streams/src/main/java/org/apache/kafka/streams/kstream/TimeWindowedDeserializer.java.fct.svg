@startuml
!pragma layout smetana
start
note right
constructor TimeWindowedDeserializer()
end note
:this(null ,null );
end
start
note right
constructor TimeWindowedDeserializer(final Deserializer<T>inner)
end note
:this(inner,Long.MAX_VALUE);
end
start
note right
constructor TimeWindowedDeserializer(final Deserializer<T>inner,
final LongwindowSize)
end note
:this.inner=inner;
:this.windowSize=windowSize;
:this.isChangelogTopic=false;
end
start
note right
LonggetWindowSize()
end note
:return this.windowSize;;
stop
end
start
note right
void configure(final Map<String,? >configs,
final booleanisKey)
end note
if (configs.get(StreamsConfig.WINDOW_SIZE_MS_CONFIG) instanceof String) then (yes) 
:configWindowSize=Long.parseLong((String)configs.get(StreamsConfig.WINDOW_SIZE_MS_CONFIG));
else (no)
:configWindowSize=(Long)configs.get(StreamsConfig.WINDOW_SIZE_MS_CONFIG);
endif 
if (windowSize!=null &&configWindowSize!=null ) then (yes) 
:throw new IllegalArgumentException("Window size should not be set in both the time windowed deserializer constructor and the window.size.ms config");;
else (no)
:windowSize=windowSize==null ? configWindowSize:windowSize;
endif 
if (windowedInnerClassSerdeConfig!=null ) then (yes) 
:windowInnerClassSerde=Utils.newInstance(windowedInnerClassSerdeConfig,
Serde.class );
:throw new ConfigException(StreamsConfig.WINDOWED_INNER_CLASS_SERDE,windowedInnerClassSerdeConfig,"Serde class "+
windowedInnerClassSerdeConfig+" could not be found.");;
endif 
if (inner!=null &&windowedInnerClassSerdeConfig!=null ) then (yes) 
if (!inner.getClass().getName().equals(windowInnerClassSerde.deserializer()
.getClass().getName())) then (yes) 
:throw new IllegalArgumentException("Inner class deserializer set using constructor "+
"("+inner.getClass().getName()+")"+" is different from the one set in windowed.inner.class.serde config "+
"("+windowInnerClassSerde.deserializer().getClass().getName()+
").");;
endif 
endif 
end
start
note right
Windowed<T>deserialize(final Stringtopic,
final byte[]data)
end note
:WindowedSerdes.verifyInnerDeserializerNotNull(inner,
this);
if (data==null ||data.length==0) then (yes) 
:return null ;;
stop
endif 
if (this.isChangelogTopic) then (yes) 
:return WindowKeySchema.fromStoreKey(data,
windowSize,inner,topic);;
stop
endif 
:return WindowKeySchema.from(data,windowSize,
inner,topic);;
stop
end
start
note right
void close()
end note
if (inner!=null ) then (yes) 
:inner.close();
endif 
end
start
note right
void setIsChangelogTopic(final booleanisChangelogTopic)
end note
:this.isChangelogTopic=isChangelogTopic;
end
start
note right
Deserializer<T>innerDeserializer()
end note
:return inner;;
stop
end
@enduml

