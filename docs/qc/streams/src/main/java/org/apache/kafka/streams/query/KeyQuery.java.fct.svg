@startuml
!pragma layout smetana
start
note right
constructor KeyQuery(final Kkey,final booleanskipCache)
end note
:this.key=Objects.requireNonNull(key);
:this.skipCache=skipCache;
end
:return new KeyQuery<>(key,false);;
stop
start
note right
KeyQuery<K,V>skipCache()
end note
:return new KeyQuery<>(key,true);;
stop
end
start
note right
KgetKey()
end note
:return key;;
stop
end
start
note right
booleanisSkipCache()
end note
:return skipCache;;
stop
end
@enduml

