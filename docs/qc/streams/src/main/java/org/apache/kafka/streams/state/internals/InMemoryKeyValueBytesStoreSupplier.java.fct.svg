@startuml
!pragma layout smetana
start
note right
constructor InMemoryKeyValueBytesStoreSupplier(final String name)
end note
:this.name=name;;
end
start
note right
String name()
end note
:return name;;
stop
end
start
note right
KeyValueStore<Bytes,byte[]> get()
end note
:return new InMemoryKeyValueStore(name);;
stop
end
start
note right
String metricsScope()
end note
:return "in-memory";;
stop
end
@enduml

