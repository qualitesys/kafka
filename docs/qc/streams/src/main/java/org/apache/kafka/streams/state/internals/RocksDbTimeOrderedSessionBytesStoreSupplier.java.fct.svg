@startuml
!pragma layout smetana
start
note right
constructor RocksDbTimeOrderedSessionBytesStoreSupplier(final String name,
final long retentionPeriod,final boolean withIndex)
end note
:this.name=name;;
:this.retentionPeriod=retentionPeriod;;
:this.withIndex=withIndex;;
end
start
note right
String name()
end note
:return name;;
stop
end
start
note right
SessionStore<Bytes,byte[]> get()
end note
:return new RocksDBTimeOrderedSessionStore(new RocksDBTimeOrderedSessionSegmentedBytesStore(name,
metricsScope(),retentionPeriod,segmentIntervalMs(),
withIndex));;
stop
end
start
note right
String metricsScope()
end note
:return "rocksdb-session";;
stop
end
start
note right
long segmentIntervalMs()
end note
:return Math.max(retentionPeriod/2,60_000L);;
stop
end
start
note right
long retentionPeriod()
end note
:return retentionPeriod;;
stop
end
@enduml

