@startuml
!pragma layout smetana
start
note right
constructor RocksDbTimeOrderedSessionBytesStoreSupplier(final Stringname,
final longretentionPeriod,final booleanwithIndex)
end note
:this.name=name;
:this.retentionPeriod=retentionPeriod;
:this.withIndex=withIndex;
end
start
note right
Stringname()
end note
:return name;;
stop
end
start
note right
SessionStore<Bytes,byte[]>get()
end note
:return new RocksDBTimeOrderedSessionStore(new RocksDBTimeOrderedSessionSegmentedBytesStore(name,metricsScope(),retentionPeriod,segmentIntervalMs(),withIndex));;
stop
end
start
note right
StringmetricsScope()
end note
:return "rocksdb-session";;
stop
end
start
note right
longsegmentIntervalMs()
end note
:return Math.max(retentionPeriod/2,60_000L);;
stop
end
start
note right
longretentionPeriod()
end note
:return retentionPeriod;;
stop
end
@enduml

