@startuml
!pragma layout smetana
start
note right
constructor AssignmentInfo(final intversion,
final intcommonlySupportedVersion)
end note
:this(version,commonlySupportedVersion,Collections.emptyList(),
Collections.emptyMap(),Collections.emptyMap(),
Collections.emptyMap(),0);;
end
start
note right
constructor AssignmentInfo(final intversion,
final List<TaskId>activeTasks,final Map<TaskId,
Set<TopicPartition>>standbyTasks,final Map<HostInfo,
Set<TopicPartition>>partitionsByHost,final Map<HostInfo,
Set<TopicPartition>>standbyPartitionsByHost,
final interrCode)
end note
:this(version,LATEST_SUPPORTED_VERSION,activeTasks,
standbyTasks,partitionsByHost,standbyPartitionsByHost,
errCode);;
end
start
note right
constructor AssignmentInfo(final intversion,
final intcommonlySupportedVersion,final List<TaskId>activeTasks,
final Map<TaskId,Set<TopicPartition>>standbyTasks,
final Map<HostInfo,Set<TopicPartition>>partitionsByHost,
final Map<HostInfo,Set<TopicPartition>>standbyPartitionsByHost,
final interrCode)
end note
:this.usedVersion=version;;
:this.commonlySupportedVersion=commonlySupportedVersion;;
:this.activeTasks=activeTasks;;
:this.standbyTasks=standbyTasks;;
:this.partitionsByHost=partitionsByHost;;
:this.standbyPartitionsByHost=standbyPartitionsByHost;;
:this.errCode=errCode;;
if (version<1||version>LATEST_SUPPORTED_VERSION) then (yes) 
:throw new IllegalArgumentException("version must be between 1 and "+
LATEST_SUPPORTED_VERSION+"; was: "+version);;
stop
endif 
end
start
note right
void setNextRebalanceTime(final longnextRebalanceTimeMs)
end note
:this.nextRebalanceMs=nextRebalanceTimeMs;;
end
start
note right
intversion()
end note
:return usedVersion;;
stop
end
start
note right
interrCode()
end note
:return errCode;;
stop
end
start
note right
intcommonlySupportedVersion()
end note
:return commonlySupportedVersion;;
stop
end
start
note right
List<TaskId>activeTasks()
end note
:return activeTasks;;
stop
end
start
note right
Map<TaskId,Set<TopicPartition>>standbyTasks()
end note
:return standbyTasks;;
stop
end
start
note right
Map<HostInfo,Set<TopicPartition>>partitionsByHost()
end note
:return partitionsByHost;;
stop
end
start
note right
Map<HostInfo,Set<TopicPartition>>standbyPartitionByHost()
end note
:return standbyPartitionsByHost;;
stop
end
start
note right
longnextRebalanceMs()
end note
:return nextRebalanceMs;;
stop
end
start
note right
ByteBufferencode()
end note
:final ByteArrayOutputStreambaos=new ByteArrayOutputStream();;
:try ;
switch (switch (usedVersion))
endswith
:out.flush();;
:out.close();;
:return ByteBuffer.wrap(baos.toByteArray());;
stop
:catch (final IOExceptionex);
:throw new TaskAssignmentException("Failed to encode AssignmentInfo",
ex);;
stop
end
start
note right
void encodeActiveAndStandbyTaskAssignment(final DataOutputStreamout)
end note
:out.writeInt(activeTasks.size());;
:writeTaskIdTo(id,out,usedVersion);;
:out.writeInt(standbyTasks.size());;
:final TaskIdid=entry.getKey();;
:writeTaskIdTo(id,out,usedVersion);;
:final Set<TopicPartition>partitions=entry.getValue();;
:writeTopicPartitions(out,partitions);;
end
start
note right
void encodePartitionsByHost(final DataOutputStreamout)
end note
:out.writeInt(partitionsByHost.size());;
:writeHostInfo(out,entry.getKey());;
:writeTopicPartitions(out,entry.getValue());;
end
start
note right
void encodeHostPartitionMapUsingDictionary(final DataOutputStreamout,
final Map<String,Integer>topicNameDict,final Map<HostInfo,
Set<TopicPartition>>hostPartitionMap)
end note
:out.writeInt(hostPartitionMap.size());;
:writeHostInfo(out,entry.getKey());;
:out.writeInt(entry.getValue().size());;
:out.writeInt(topicNameDict.get(partition.topic()));;
:out.writeInt(partition.partition());;
end
start
note right
Map<String,Integer>encodeTopicDictionaryAndGet(final DataOutputStreamout,
final Set<TopicPartition>topicPartitions)
end note
:inttopicIndex=0;;
:final Map<String,Integer>topicNameDict=new HashMap<>();;
if (!topicNameDict.containsKey(topicPartition.topic())) then (yes) 
:topicNameDict.put(topicPartition.topic(),
topicIndex++);;
endif 
:out.writeInt(topicNameDict.size());;
:out.writeInt(entry.getValue());;
:out.writeUTF(entry.getKey());;
:return topicNameDict;;
stop
end
start
note right
void encodePartitionsByHostAsDictionary(final DataOutputStreamout)
end note
:final Set<TopicPartition>allTopicPartitions=partitionsByHost.values()
.stream().flatMap(Collection::stream).collect(Collectors.toSet());;
:final Map<String,Integer>topicNameDict=encodeTopicDictionaryAndGet(out,
allTopicPartitions);;
:encodeHostPartitionMapUsingDictionary(out,
topicNameDict,partitionsByHost);;
end
start
note right
void encodeActiveAndStandbyHostPartitions(final DataOutputStreamout)
end note
:final Set<TopicPartition>allTopicPartitions=Stream.concat(partitionsByHost.values().stream(),
standbyPartitionsByHost.values().stream()).flatMap(Collection::stream).collect(Collectors.toSet());;
:final Map<String,Integer>topicNameDict=encodeTopicDictionaryAndGet(out,
allTopicPartitions);;
:encodeHostPartitionMapUsingDictionary(out,
topicNameDict,partitionsByHost);;
:encodeHostPartitionMapUsingDictionary(out,
topicNameDict,standbyPartitionsByHost);;
end
start
note right
void writeHostInfo(final DataOutputStreamout,
final HostInfohostInfo)
end note
:out.writeUTF(hostInfo.host());;
:out.writeInt(hostInfo.port());;
end
start
note right
void writeTopicPartitions(final DataOutputStreamout,
final Set<TopicPartition>partitions)
end note
:out.writeInt(partitions.size());;
:out.writeUTF(partition.topic());;
:out.writeInt(partition.partition());;
end
start
note right
AssignmentInfodecode(final ByteBufferdata)
end note
:data.rewind();;
:try ;
:final AssignmentInfoassignmentInfo;;
:final intusedVersion=in.readInt();;
:final intcommonlySupportedVersion;;
switch (switch (usedVersion))
endswith
:return assignmentInfo;;
stop
:catch (final IOExceptionex);
:throw new TaskAssignmentException("Failed to decode AssignmentInfo",
ex);;
stop
end
start
note right
void decodeActiveTasks(final AssignmentInfoassignmentInfo,
final DataInputStreamin)
end note
:final intcount=in.readInt();;
:assignmentInfo.activeTasks=new ArrayList<>(count);;
:assignmentInfo.activeTasks.add(readTaskIdFrom(in,
assignmentInfo.usedVersion));;
end
start
note right
void decodeStandbyTasks(final AssignmentInfoassignmentInfo,
final DataInputStreamin)
end note
:final intcount=in.readInt();;
:assignmentInfo.standbyTasks=new HashMap<>(count);;
:final TaskIdid=readTaskIdFrom(in,assignmentInfo.usedVersion);;
:assignmentInfo.standbyTasks.put(id,readTopicPartitions(in));;
end
start
note right
void decodePartitionsByHost(final AssignmentInfoassignmentInfo,
final DataInputStreamin)
end note
:assignmentInfo.partitionsByHost=new HashMap<>();;
:final intnumEntries=in.readInt();;
:final HostInfohostInfo=new HostInfo(in.readUTF(),
in.readInt());;
:assignmentInfo.partitionsByHost.put(hostInfo,
readTopicPartitions(in));;
end
start
note right
Set<TopicPartition>readTopicPartitions(final DataInputStreamin)
end note
:final intnumPartitions=in.readInt();;
:final Set<TopicPartition>partitions=new HashSet<>(numPartitions);;
:partitions.add(new TopicPartition(in.readUTF(),
in.readInt()));;
:return partitions;;
stop
end
start
note right
Map<Integer,String>decodeTopicIndexAndGet(final DataInputStreamin)
end note
:final intdictSize=in.readInt();;
:final Map<Integer,String>topicIndexDict=new HashMap<>(dictSize);;
:topicIndexDict.put(in.readInt(),in.readUTF());;
:return topicIndexDict;;
stop
end
start
note right
Map<HostInfo,Set<TopicPartition>>decodeHostPartitionMapUsingDictionary(final DataInputStreamin,
final Map<Integer,String>topicIndexDict)
end note
:final Map<HostInfo,Set<TopicPartition>>hostPartitionMap=new HashMap<>();;
:final intnumEntries=in.readInt();;
:final HostInfohostInfo=new HostInfo(in.readUTF(),
in.readInt());;
:hostPartitionMap.put(hostInfo,readTopicPartitions(in,
topicIndexDict));;
:return hostPartitionMap;;
stop
end
start
note right
void decodePartitionsByHostUsingDictionary(final AssignmentInfoassignmentInfo,
final DataInputStreamin)
end note
:final Map<Integer,String>topicIndexDict=decodeTopicIndexAndGet(in);;
:assignmentInfo.partitionsByHost=decodeHostPartitionMapUsingDictionary(in,
topicIndexDict);;
end
start
note right
void decodeActiveAndStandbyHostPartitions(final AssignmentInfoassignmentInfo,
final DataInputStreamin)
end note
:final Map<Integer,String>topicIndexDict=decodeTopicIndexAndGet(in);;
:assignmentInfo.partitionsByHost=decodeHostPartitionMapUsingDictionary(in,
topicIndexDict);;
:assignmentInfo.standbyPartitionsByHost=decodeHostPartitionMapUsingDictionary(in,
topicIndexDict);;
end
start
note right
Set<TopicPartition>readTopicPartitions(final DataInputStreamin,
final Map<Integer,String>topicIndexDict)
end note
:final intnumPartitions=in.readInt();;
:final Set<TopicPartition>partitions=new HashSet<>(numPartitions);;
:partitions.add(new TopicPartition(topicIndexDict.get(in.readInt()),
in.readInt()));;
:return partitions;;
stop
end
start
note right
inthashCode()
end note
:final inthostMapHashCode=partitionsByHost.hashCode()^standbyPartitionsByHost.hashCode();;
:return usedVersion^commonlySupportedVersion^activeTasks.hashCode()^standbyTasks.hashCode()^hostMapHashCode^errCode;;
stop
end
start
note right
booleanequals(final Objecto)
end note
if (o instanceof AssignmentInfo) then (yes) 
:final AssignmentInfoother=(AssignmentInfo)o;;
:return usedVersion==other.usedVersion&&commonlySupportedVersion==other.commonlySupportedVersion&&errCode==other.errCode&&activeTasks.equals(other.activeTasks)&&standbyTasks.equals(other.standbyTasks)&&partitionsByHost.equals(other.partitionsByHost)&&standbyPartitionsByHost.equals(other.standbyPartitionsByHost);;
stop
else (no)
:return false;;
stop
endif 
end
start
note right
StringtoString()
end note
:return "[version="+usedVersion+", supported version="+
commonlySupportedVersion+", active tasks="+
activeTasks+", standby tasks="+standbyTasks+
", partitions by host="+partitionsByHost+
", standbyPartitions by host="+standbyPartitionsByHost+
"]";;
stop
end
