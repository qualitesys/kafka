@startuml
!pragma layout smetana
start
note right
constructor SessionCacheFlushListener(final ProcessorContext<Windowed<KOut>,
Change<VOut>> context)
end note
:this.context=(InternalProcessorContext<Windowed<KOut>,
Change<VOut>> )context;;
:myNode=this.context.currentNode();;
end
start
note right
void apply(final Record<Windowed<KOut>,Change<VOut>> record)
end note
:@SuppressWarnings ("rawtypes")final ProcessorNode prev=context.currentNode();;
:context.setCurrentNode(myNode);;
switch (try/catch block)
case (try)
:context.forward(record.withTimestamp(record.key()
.window().end()));;
endswitch
end
@enduml

