@startuml
!pragma layout smetana
start
note right
constructor FilteredCacheIterator(final PeekingKeyValueIterator<Bytes,
LRUCacheEntry>cacheIterator,final HasNextConditionhasNextCondition,
final CacheFunctioncacheFunction)
end note
end
start
note right
void close()
end note
end
start
note right
BytespeekNextKey()
end note
if (!hasNext()) then (yes) 
:throw new NoSuchElementException();;
endif 
:return cacheIterator.peekNextKey();;
stop
end
start
note right
booleanhasNext()
end note
:return hasNextCondition.hasNext(wrappedIterator);;
stop
end
start
note right
KeyValue<Bytes,LRUCacheEntry>next()
end note
if (!hasNext()) then (yes) 
:throw new NoSuchElementException();;
endif 
:return cacheIterator.next();;
stop
end
