@startuml
!pragma layout smetana
start
note right
constructor ProcessorGraphNode(final ProcessorParameters<K,
V,? ,? >processorParameters)
end note
:super (processorParameters.processorName());
:this.processorParameters=processorParameters;
end
start
note right
constructor ProcessorGraphNode(final StringnodeName,
final ProcessorParameters<K,V,? ,? >processorParameters)
end note
:super (nodeName);
:this.processorParameters=processorParameters;
end
start
note right
ProcessorParameters<K,V,? ,? >processorParameters()
end note
:return processorParameters;;
stop
end
start
note right
StringtoString()
end note
:return "ProcessorNode{"+"processorParameters="+
processorParameters+"} "+super .toString();;
stop
end
start
note right
void writeToTopology(final InternalTopologyBuildertopologyBuilder)
end note
:processorParameters.addProcessorTo(topologyBuilder,
parentNodeNames());
end
@enduml

