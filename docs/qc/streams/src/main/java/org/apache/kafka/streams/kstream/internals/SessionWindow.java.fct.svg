-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="423" x2="423" y1="379.707" y2="399.707"/><polygon fill="#181818" points="419,389.707,423,399.707,427,389.707,423,393.707" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[693bb93c94bb1e546136d5940ed5c30e]
@startuml
!pragma layout smetana
start
note right
constructor SessionWindow(final longstartMs,
final longendMs)
end note
:super (startMs,endMs);
end
start
note right
booleanoverlap(final Windowother)
end note
if (getClass()!=other.getClass()) then (yes) 
:throw new IllegalArgumentException("Cannot compare windows of different type. Other window has type "+other.getClass()+".");;
endif 
:return !(otherWindow.endMs<startMs||endMs<otherWindow.startMs);;
stop
end
@enduml

