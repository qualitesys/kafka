 style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[eed1dfaf077da6c8941830035554107a]
@startuml
!pragma layout smetana
start
note right
constructor SessionWindow(final longstartMs,
final longendMs)
end note
end
start
note right
booleanoverlap(final Windowother)
end note
if (getClass()!=other.getClass()) then (yes) 
:throw new IllegalArgumentException("Cannot compare windows of different type. Other window has type "+
other.getClass()+".");;
endif 
:return !(otherWindow.endMs<startMs||endMs<otherWindow.startMs);;
stop
end
@enduml

