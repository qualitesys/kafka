@startuml
!pragma layout smetana
start
note right
constructor SessionWindow(final longstartMs,final longendMs)
end note
:super (startMs,endMs);
end
start
note right
booleanoverlap(final Windowother)
end note
if (getClass()!=other.getClass()) then (yes) 
endif 
:return !(otherWindow.endMs<startMs||endMs<otherWindow.startMs);;
stop
end
@enduml

