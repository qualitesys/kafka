@startuml
!pragma layout smetana
start
note right
constructor UnwindowedChangelogTopicConfig(final Stringname,
final Map<String,String>topicConfigs)
end note
end
start
note right
Map<String,String>getProperties(final Map<String,
String>defaultProperties,final longadditionalRetentionMs)
end note
:return topicConfig;;
stop
end
start
note right
booleanequals(final Objecto)
end note
if (this==o) then (yes) 
:return true;;
stop
endif 
if (o==null ||getClass()!=o.getClass()) then (yes) 
:return false;;
stop
endif 
:return Objects.equals(name,that.name)&&Objects.equals(topicConfigs,
that.topicConfigs)&&Objects.equals(enforceNumberOfPartitions,
that.enforceNumberOfPartitions);;
stop
end
start
note right
inthashCode()
end note
:return Objects.hash(name,topicConfigs,enforceNumberOfPartitions);;
stop
end
start
note right
StringtoString()
end note
:return "UnwindowedChangelogTopicConfig("+
"name="+name+", topicConfigs="+topicConfigs+
", enforceNumberOfPartitions="+enforceNumberOfPartitions+
")";;
stop
end
