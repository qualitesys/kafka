end note
:super (name,topicConfigs);
end
start
note right
Map<String,String>getProperties(final Map<String,String>defaultProperties,final longadditionalRetentionMs)
end note
:topicConfig.putAll(defaultProperties);
:topicConfig.putAll(topicConfigs);
:return topicConfig;;
stop
end
start
note right
booleanequals(final Objecto)
end note
if (this==o) then (yes) 
:return true;;
stop
