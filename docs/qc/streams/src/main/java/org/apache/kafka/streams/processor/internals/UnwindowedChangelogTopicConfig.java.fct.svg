@startuml
!pragma layout smetana
:tempTopicDefaultOverrides.put(TopicConfig.CLEANUP_POLICY_CONFIG,
TopicConfig.CLEANUP_POLICY_COMPACT);
:UNWINDOWED_STORE_CHANGELOG_TOPIC_DEFAULT_OVERRIDES=Collections.unmodifiableMap(tempTopicDefaultOverrides);
start
note right
constructor UnwindowedChangelogTopicConfig(final Stringname,
final Map<String,String>topicConfigs)
end note
:super (name,topicConfigs);
end
start
note right
Map<String,String>getProperties(final Map<String,
String>defaultProperties,final longadditionalRetentionMs)
end note
:topicConfig.putAll(defaultProperties);
:topicConfig.putAll(topicConfigs);
:return topicConfig;;
stop
end
start
note right
booleanequals(final Objecto)
end note
if (this==o) then (yes) 
:return true;;
stop
endif 
if (o==null ||getClass()!=o.getClass()) then (yes) 
:return false;;
stop
endif 
