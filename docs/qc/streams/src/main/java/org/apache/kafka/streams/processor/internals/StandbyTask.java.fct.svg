@startuml
!pragma layout smetana
start
note right
constructor StandbyTask(final TaskIdid,final Set<TopicPartition>inputPartitions,
final ProcessorTopologytopology,final TaskConfigconfig,
final StreamsMetricsImplstreamsMetrics,final ProcessorStateManagerstateMgr,
final StateDirectorystateDirectory,final ThreadCachecache,
final InternalProcessorContextprocessorContext)
end note
:super (id,topology,stateDirectory,stateMgr,
inputPartitions,config.taskTimeoutMs,"standby-task",
StandbyTask.class );;
:this.processorContext=processorContext;;
:this.streamsMetrics=streamsMetrics;;
:processorContext.transitionToStandby(cache);;
:closeTaskSensor=ThreadMetrics.closeTaskSensor(Thread.currentThread().getName(),
streamsMetrics);;
:this.eosEnabled=config.eosEnabled;;
end
start
note right
booleanisActive()
end note
:return false;;
stop
end
start
note right
void initializeIfNeeded()
end note
if (state()==State.CREATED) then (yes) 
:StateManagerUtil.registerStateStores(log,
logPrefix,topology,stateMgr,stateDirectory,
processorContext);;
:offsetSnapshotSinceLastFlush=Collections.emptyMap();;
:transitionTo(State.RESTORING);;
:transitionTo(State.RUNNING);;
:processorContext.initialize();;
:log.info("Initialized");;
else if (state()==State.RESTORING) then (yes) 
:throw new IllegalStateException("Illegal state "+
state()+" while initializing standby task "+
id);;
stop
endif 
end
start
note right
void completeRestoration(final java.util.function .Consumer<Set<TopicPartition>>offsetResetter)
end note
:throw new IllegalStateException("Standby task "+
id+" should never be completing restoration");;
stop
end
start
note right
void suspend()
end note
switch (switch (state()))
endswith
end
start
note right
void resume()
end note
if (state()==State.RESTORING) then (yes) 
:throw new IllegalStateException("Illegal state "+
state()+" while resuming standby task "+id);;
stop
endif 
:log.trace("No-op resume with state {}",state());;
end
start
note right
Map<TopicPartition,OffsetAndMetadata>prepareCommit()
end note
switch (switch (state()))
endswith
:return Collections.emptyMap();;
stop
end
start
note right
void postCommit(final booleanenforceCheckpoint)
end note
switch (switch (state()))
endswith
end
start
note right
void closeClean()
end note
:streamsMetrics.removeAllTaskLevelSensors(Thread.currentThread().getName(),
id.toString());;
:close(true);;
:log.info("Closed clean");;
end
start
note right
void closeDirty()
end note
:streamsMetrics.removeAllTaskLevelSensors(Thread.currentThread().getName(),
id.toString());;
:close(false);;
:log.info("Closed dirty");;
end
start
note right
void closeCleanAndRecycleState()
end note
:streamsMetrics.removeAllTaskLevelSensors(Thread.currentThread().getName(),
id.toString());;
if (state()==State.SUSPENDED) then (yes) 
:stateMgr.recycle();;
else (no)
:throw new IllegalStateException("Illegal state "+
state()+" while closing standby task "+id);;
stop
endif 
:closeTaskSensor.record();;
:transitionTo(State.CLOSED);;
:log.info("Closed clean and recycled state");;
end
start
note right
void close(final booleanclean)
end note
switch (switch (state()))
endswith
:closeTaskSensor.record();;
:transitionTo(State.CLOSED);;
end
start
note right
booleancommitNeeded()
end note
:return StateManagerUtil.checkpointNeeded(false,
offsetSnapshotSinceLastFlush,stateMgr.changelogOffsets());;
stop
end
start
note right
Map<TopicPartition,Long>changelogOffsets()
end note
:return Collections.unmodifiableMap(stateMgr.changelogOffsets());;
stop
end
start
note right
Map<TopicPartition,Long>committedOffsets()
end note
:return Collections.emptyMap();;
stop
end
start
note right
Map<TopicPartition,Long>highWaterMark()
end note
:return Collections.emptyMap();;
stop
end
start
note right
Optional<Long>timeCurrentIdlingStarted()
end note
:return Optional.empty();;
stop
end
start
note right
void addRecords(final TopicPartitionpartition,
final Iterable<ConsumerRecord<byte[],byte[]>>records)
end note
:throw new IllegalStateException("Attempted to add records to task "+
id()+" for invalid input partition "+partition);;
stop
end
start
note right
InternalProcessorContextprocessorContext()
end note
:return processorContext;;
stop
end
start
note right
StringtoString()
end note
:return toString("");;
stop
end
start
note right
StringtoString(final Stringindent)
end note
:final StringBuildersb=new StringBuilder();;
:sb.append(indent);;
:sb.append("TaskId: ");;
:sb.append(id);;
:sb.append("\n");;
if (topology!=null ) then (yes) 
:sb.append(indent).append(topology.toString(indent+
"\t"));;
endif 
:return sb.toString();;
stop
end
@enduml

