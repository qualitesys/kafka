@startuml
!pragma layout smetana
start
note right
constructor Position(final ConcurrentHashMap<String,
ConcurrentHashMap<Integer,Long>>position)
end note
:this.position=position;;
end
start
note right
PositionemptyPosition()
end note
:return new Position(new ConcurrentHashMap<>());;
stop
end
start
note right
PositionfromMap(final Map<String,?  extends Map<Integer,
Long>>map)
end note
:return new Position(deepCopy(map));;
stop
end
start
note right
PositionwithComponent(final Stringtopic,final intpartition,
final longoffset)
end note
:position.computeIfAbsent(topic,k->new ConcurrentHashMap<>()).compute(partition,
(integer,prior)->prior==null ||offset>prior? offset:prior);;
:return this;;
stop
end
start
note right
Positioncopy()
end note
:return new Position(deepCopy(position));;
stop
end
start
note right
Positionmerge(final Positionother)
end note
if (other==null ) then (yes) 
:return this;;
stop
else (no)
:final Stringtopic=entry.getKey();;
:final Map<Integer,Long>partitionMap=position.computeIfAbsent(topic,
k->new ConcurrentHashMap<>());;
:final Integerpartition=partitionOffset.getKey();;
:final Longoffset=partitionOffset.getValue();;
if (!partitionMap.containsKey(partition)||partitionMap.get(partition)<offset) then (yes) 
:partitionMap.put(partition,offset);;
endif 
:return this;;
stop
endif 
end
start
note right
Set<String>getTopics()
end note
:return Collections.unmodifiableSet(position.keySet());;
stop
end
start
note right
Map<Integer,Long>getPartitionPositions(final Stringtopic)
end note
:final ConcurrentHashMap<Integer,Long>bound=position.get(topic);;
:return bound==null ? Collections.emptyMap():Collections.unmodifiableMap(bound);;
stop
end
start
note right
ConcurrentHashMap<String,ConcurrentHashMap<Integer,
Long>>deepCopy(final Map<String,?  extends Map<Integer,
Long>>map)
end note
if (map==null ) then (yes) 
:return new ConcurrentHashMap<>();;
stop
else (no)
:final ConcurrentHashMap<String,ConcurrentHashMap<Integer,
Long>>copy=new ConcurrentHashMap<>(map.size());;
:copy.put(entry.getKey(),new ConcurrentHashMap<>(entry.getValue()));;
:return copy;;
stop
endif 
end
start
note right
StringtoString()
end note
:return "Position{"+"position="+position+
'}';;
stop
end
start
note right
booleanequals(final Objecto)
end note
if (this==o) then (yes) 
:return true;;
stop
endif 
if (o==null ||getClass()!=o.getClass()) then (yes) 
:return false;;
stop
endif 
:final Positionposition1=(Position)o;;
:return Objects.equals(position,position1.position);;
stop
end
