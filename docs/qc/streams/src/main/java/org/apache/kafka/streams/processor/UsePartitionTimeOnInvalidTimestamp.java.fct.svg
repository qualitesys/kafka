@startuml
!pragma layout smetana
start
note right
longonInvalidTimestamp(final ConsumerRecord<Object,
Object>record,final longrecordTimestamp,final longpartitionTime)
end note
if (partitionTime<0) then (yes) 
:throw new StreamsException("Could not infer new timestamp for input record "+
record+" because partition time is unknown.");;
endif 
:return partitionTime;;
stop
end
@enduml

