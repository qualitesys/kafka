stroke-width:1.0;" x1="544" x2="544" y1="97.3984" y2="247.2695"/><line style="stroke:#181818;stroke-width:1.0;" x1="544" x2="272.5" y1="247.2695" y2="247.2695"/><line style="stroke:#181818;stroke-width:1.0;" x1="272.5" x2="272.5" y1="247.2695" y2="267.2695"/><polygon fill="#181818" points="268.5,257.2695,272.5,267.2695,276.5,257.2695,272.5,261.2695" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="272.5" x2="272.5" y1="47.6992" y2="85.3984"/><polygon fill="#181818" points="268.5,75.3984,272.5,85.3984,276.5,75.3984,272.5,79.3984" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="272.5" x2="272.5" y1="301.2383" y2="321.2383"/><polygon fill="#181818" points="268.5,311.2383,272.5,321.2383,276.5,311.2383,272.5,315.2383" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[019277c3edaff41307ac46dfbdbd855b]
@startuml
!pragma layout smetana
start
note right
long onInvalidTimestamp(final ConsumerRecord<Object,
Object> record,final long recordTimestamp,
final long partitionTime)
end note
if (partitionTime<0) then (yes) 
:throw new StreamsException("Could not infer new timestamp for input record "+
record+" because partition time is unknown.");;
stop
endif 
:return partitionTime;;
stop
end
@enduml

