@startuml
!pragma layout smetana
start
note right
constructor InternalQueryResultUtil()
end note
end
if (rawResult.isFailure()) then (yes) 
else (no)
:return new SucceededQueryResult<>(deserializedResult,rawResult.getExecutionInfo(),rawResult.getPosition());;
stop
endif 
@enduml

