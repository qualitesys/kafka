@startuml
!pragma layout smetana
start
note right
constructor InternalQueryResultUtil()
end note
end
if (rawResult.isFailure()) then (yes) 
:throw new IllegalArgumentException("Callers must avoid calling this method on a failed result.");;
stop
else (no)
:return new SucceededQueryResult<>(deserializedResult,
rawResult.getExecutionInfo(),rawResult.getPosition());;
stop
endif 
@enduml

