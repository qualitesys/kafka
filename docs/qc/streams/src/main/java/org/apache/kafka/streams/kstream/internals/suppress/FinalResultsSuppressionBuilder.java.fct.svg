@startuml
!pragma layout smetana
start
note right
constructor FinalResultsSuppressionBuilder(final Stringname,
final Suppressed.StrictBufferConfigbufferConfig)
end note
:this.name=name;;
:this.bufferConfig=bufferConfig;;
end
start
note right
SuppressedInternal<K>buildFinalResultsSuppression(final DurationgracePeriod)
end note
:return new SuppressedInternal<>(name,gracePeriod,
bufferConfig,TimeDefinitions.WindowEndTimeDefinition.instance(),
true);;
stop
end
start
note right
Suppressed<K>withName(final Stringname)
end note
:return new FinalResultsSuppressionBuilder<>(name,
bufferConfig);;
stop
end
start
note right
booleanequals(final Objecto)
end note
if (this==o) then (yes) 
:return true;;
stop
endif 
if (o==null ||getClass()!=o.getClass()) then (yes) 
:return false;;
stop
endif 
:final FinalResultsSuppressionBuilder<? >that=(FinalResultsSuppressionBuilder<? >)o;;
:return Objects.equals(name,that.name)&&Objects.equals(bufferConfig,
that.bufferConfig);;
stop
end
start
note right
Stringname()
end note
:return name;;
stop
end
start
note right
inthashCode()
end note
:return Objects.hash(name,bufferConfig);;
stop
end
start
note right
StringtoString()
end note
:return "FinalResultsSuppressionBuilder{"+
"name='"+name+'\''+", bufferConfig="+bufferConfig+
'}';;
stop
end
@enduml

