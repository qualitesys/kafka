@startuml
!pragma layout smetana
start
note right
constructor FinalResultsSuppressionBuilder(final Stringname,final Suppressed.StrictBufferConfigbufferConfig)
end note
:this.name=name;
:this.bufferConfig=bufferConfig;
end
start
note right
SuppressedInternal<K>buildFinalResultsSuppression(final DurationgracePeriod)
end note
:return new SuppressedInternal<>(name,gracePeriod,bufferConfig,TimeDefinitions.WindowEndTimeDefinition.instance(),true);;
stop
end
start
note right
Suppressed<K>withName(final Stringname)
end note
:return new FinalResultsSuppressionBuilder<>(name,bufferConfig);;
stop
end
