@startuml
!pragma layout smetana
start
note right
constructor RemoveNamedTopologyResult(final KafkaFutureImpl<Void>removeTopologyFuture)
end note
end
start
note right
constructor RemoveNamedTopologyResult(final KafkaFutureImpl<Void>removeTopologyFuture,
final StringremovedTopology,final RunnableresetOffsets)
end note
end
start
note right
KafkaFuture<Void>removeTopologyFuture()
end note
:return removeTopologyFuture;;
stop
end
start
note right
KafkaFuture<Void>resetOffsetsFuture()
end note
:return resetOffsetsFuture;;
stop
end
start
note right
KafkaFuture<Void>all()
end note
if (resetOffsetsFuture==null ) then (yes) 
:return removeTopologyFuture;;
stop
else (no)
:return resetOffsetsFuture;;
stop
endif 
end
start
note right
constructor ResetOffsetsFuture(final StringremovedTopology,
final KafkaFutureImpl<Void>removeTopologyFuture,
final RunnableresetOffsets)
end note
end
start
note right
Voidget()
end note
if (firstError.get()!=null ) then (yes) 
:throw new ExecutionException(firstError.get());;
else (no)
:return null ;;
stop
endif 
end
@enduml

