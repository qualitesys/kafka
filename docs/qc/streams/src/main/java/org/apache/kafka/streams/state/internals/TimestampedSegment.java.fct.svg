@startuml
!pragma layout smetana
start
note right
constructor TimestampedSegment(final StringsegmentName,
final StringwindowName,final longid,final RocksDBMetricsRecordermetricsRecorder)
end note
end
start
note right
void destroy()
end note
end
start
note right
void deleteRange(final ByteskeyFrom,final ByteskeyTo)
end note
:throw new UnsupportedOperationException();;
end
start
note right
intcompareTo(final TimestampedSegmentsegment)
end note
:return Long.compare(id,segment.id);;
stop
end
start
note right
void openDB(final Map<String,Object>configs,
final FilestateDir)
end note
end
start
note right
StringtoString()
end note
:return "TimestampedSegment(id="+id+", name="+
name()+")";;
stop
end
start
note right
booleanequals(final Objectobj)
end note
if (obj==null ||getClass()!=obj.getClass()) then (yes) 
:return false;;
stop
endif 
:return id==segment.id;;
stop
end
start
note right
inthashCode()
end note
:return Objects.hash(id);;
stop
end
@enduml

