@startuml
!pragma layout smetana
start
note right
constructor TimestampedSegment(final StringsegmentName,final StringwindowName,final longid,final RocksDBMetricsRecordermetricsRecorder)
end note
:super (segmentName,windowName,metricsRecorder);
:this.id=id;
end
start
note right
void destroy()
end note
:Utils.delete(dbDir);
end
start
note right
void deleteRange(final ByteskeyFrom,final ByteskeyTo)
end note
end
start
note right
intcompareTo(final TimestampedSegmentsegment)
end note
