@startuml
!pragma layout smetana
start
note right
constructor FallbackPriorTaskAssignor()
end note
:delegate=new StickyTaskAssignor(true);
end
start
note right
booleanassign(final Map<UUID,ClientState>clients,final Set<TaskId>allTaskIds,final Set<TaskId>statefulTaskIds,final AssignmentConfigsconfigs)
end note
:delegate.assign(clients,allTaskIds,statefulTaskIds,
configs);
:return true;;
stop
end
@enduml

