@startuml
!pragma layout smetana
start
note right
constructor KeyValueToTimestampedKeyValueIteratorAdapter(final KeyValueIterator<K,byte[]>innerIterator)
end note
:this.innerIterator=innerIterator;
end
start
note right
void close()
end note
:innerIterator.close();
end
start
note right
KpeekNextKey()
end note
:return innerIterator.peekNextKey();;
stop
end
start
note right
booleanhasNext()
end note
:return innerIterator.hasNext();;
stop
end
start
note right
KeyValue<K,byte[]>next()
end note
:return KeyValue.pair(plainKeyValue.key,convertToTimestampedFormat(plainKeyValue.value));;
stop
end
@enduml

