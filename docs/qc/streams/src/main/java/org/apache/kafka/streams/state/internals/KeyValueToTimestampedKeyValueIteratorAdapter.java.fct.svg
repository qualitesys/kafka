18;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="310.5" x2="310.5" y1="684.6406" y2="704.6406"/><polygon fill="#181818" points="306.5,694.6406,310.5,704.6406,314.5,694.6406,310.5,698.6406" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="310.5" x2="310.5" y1="738.6094" y2="758.6094"/><polygon fill="#181818" points="306.5,748.6094,310.5,758.6094,314.5,748.6094,310.5,752.6094" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[282b6c58e2d39523fa08fe71edb1f43a]
@startuml
!pragma layout smetana
start
note right
constructor KeyValueToTimestampedKeyValueIteratorAdapter(final KeyValueIterator<K,
byte[]> innerIterator)
end note
:this.innerIterator=innerIterator;;
end
start
note right
void close()
end note
:innerIterator.close();;
end
start
note right
K peekNextKey()
end note
:return innerIterator.peekNextKey();;
stop
end
start
note right
boolean hasNext()
end note
:return innerIterator.hasNext();;
stop
end
start
note right
KeyValue<K,byte[]> next()
end note
:final KeyValue<K,byte[]> plainKeyValue=innerIterator.next();;
:return KeyValue.pair(plainKeyValue.key,convertToTimestampedFormat(plainKeyValue.value));;
stop
end
@enduml

