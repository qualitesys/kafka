.3359,307,243.3359,303,247.3359" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="303" x2="303" y1="287.3047" y2="307.3047"/><polygon fill="#181818" points="299,297.3047,303,307.3047,307,297.3047,303,301.3047" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="303" x2="303" y1="341.2734" y2="361.2734"/><polygon fill="#181818" points="299,351.2734,303,361.2734,307,351.2734,303,355.2734" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="303" x2="303" y1="413.8398" y2="436.4063"/><polygon fill="#181818" points="299,426.4063,303,436.4063,307,426.4063,303,430.4063" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="303" x2="303" y1="470.375" y2="490.375"/><polygon fill="#181818" points="299,480.375,303,490.375,307,480.375,303,484.375" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[f8882ac2c02c11439c6042cdf95f9b6d]
@startuml
!pragma layout smetana
start
note right
constructor TaskCorruptedException(final Set<TaskId>corruptedTasks)
end note
:super ("Tasks "+corruptedTasks+" are corrupted and hence needs to be re-initialized");;
:this.corruptedTasks=corruptedTasks;;
end
start
note right
constructor TaskCorruptedException(final Set<TaskId>corruptedTasks,
final InvalidOffsetExceptione)
end note
:super ("Tasks "+corruptedTasks+" are corrupted and hence needs to be re-initialized",e);;
:this.corruptedTasks=corruptedTasks;;
end
start
note right
Set<TaskId>corruptedTasks()
end note
:return corruptedTasks;;
stop
end
@enduml

