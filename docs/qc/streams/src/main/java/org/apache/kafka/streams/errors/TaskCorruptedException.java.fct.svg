9,305,243.3359,301,247.3359" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="301" x2="301" y1="287.3047" y2="307.3047"/><polygon fill="#181818" points="297,297.3047,301,307.3047,305,297.3047,301,301.3047" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="301" x2="301" y1="341.2734" y2="361.2734"/><polygon fill="#181818" points="297,351.2734,301,361.2734,305,351.2734,301,355.2734" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="301" x2="301" y1="413.8398" y2="436.4063"/><polygon fill="#181818" points="297,426.4063,301,436.4063,305,426.4063,301,430.4063" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="301" x2="301" y1="470.375" y2="490.375"/><polygon fill="#181818" points="297,480.375,301,490.375,305,480.375,301,484.375" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[fb73433090324133856a5711331058f2]
@startuml
!pragma layout smetana
start
note right
constructor TaskCorruptedException(final Set<TaskId>corruptedTasks)
end note
:super ("Tasks "+corruptedTasks+" are corrupted and hence needs to be re-initialized");
:this.corruptedTasks=corruptedTasks;
end
start
note right
constructor TaskCorruptedException(final Set<TaskId>corruptedTasks,
final InvalidOffsetExceptione)
end note
:super ("Tasks "+corruptedTasks+" are corrupted and hence needs to be re-initialized",e);
:this.corruptedTasks=corruptedTasks;
end
start
note right
Set<TaskId>corruptedTasks()
end note
:return corruptedTasks;;
stop
end
@enduml

