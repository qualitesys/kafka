="270,815.7539,260,819.7539,270,823.7539,266,819.7539" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="248" x2="248" y1="711.2188" y2="733.7852"/><polygon fill="#181818" points="244,723.7852,248,733.7852,252,723.7852,248,727.7852" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="248" x2="248" y1="831.7539" y2="851.7539"/><polygon fill="#181818" points="244,841.7539,248,851.7539,252,841.7539,248,845.7539" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[cbbe8d2434cb4ad548133593fd99d9b3]
@startuml
!pragma layout smetana
start
note right
constructor PrintForeachAction(final OutputStreamoutputStream,
final KeyValueMapper<? super K,? super V,
String>mapper,final Stringlabel)
end note
:this.printWriter=new PrintWriter(new OutputStreamWriter(outputStream,
StandardCharsets.UTF_8));;
:this.closable=outputStream!=System.out&&outputStream!=System.err;;
:this.mapper=mapper;;
:this.label=label;;
end
start
note right
void apply(final Kkey,final Vvalue)
end note
:final Stringdata=String.format("[%s]: %s",
label,mapper.apply(key,value));;
:printWriter.println(data);;
if (!closable) then (yes) 
:printWriter.flush();;
endif 
end
start
note right
void close()
end note
if (closable) then (yes) 
:printWriter.close();;
else (no)
:printWriter.flush();;
endif 
end
@enduml

