164" y2="783.8164"/><polygon fill="#181818" points="243.5,773.8164,247.5,783.8164,251.5,773.8164,247.5,777.8164" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[ba402e089b19cf066a177b220e3a216e]
@startuml
!pragma layout smetana
start
note right
constructor PrintForeachAction(final OutputStreamoutputStream,
final KeyValueMapper<? super K,? super V,
String>mapper,final Stringlabel)
end note
:this.printWriter=new PrintWriter(new OutputStreamWriter(outputStream,
StandardCharsets.UTF_8));
:this.closable=outputStream!=System.out&&outputStream!=System.err;
:this.mapper=mapper;
:this.label=label;
end
start
note right
void apply(final Kkey,final Vvalue)
end note
:printWriter.println(data);
if (!closable) then (yes) 
:printWriter.flush();
endif 
end
start
note right
void close()
end note
if (closable) then (yes) 
:printWriter.close();
else (no)
:printWriter.flush();
endif 
end
@enduml

