@startuml
!pragma layout smetana
start
note right
constructor ValueAndTimestamp(final Vvalue,
final longtimestamp)
end note
:Objects.requireNonNull(value);;
:this.value=value;;
:this.timestamp=timestamp;;
end
:return value==null ? null :new ValueAndTimestamp<>(value,
