@startuml
!pragma layout smetana
start
note right
constructor ValueAndTimestamp(final Vvalue,final longtimestamp)
end note
:Objects.requireNonNull(value);
:this.value=value;
:this.timestamp=timestamp;
end
:return value==null ? null :new ValueAndTimestamp<>(value,timestamp);;
stop
:return valueAndTimestamp==null ? null :valueAndTimestamp.value();;
stop
start
note right
Vvalue()
end note
:return value;;
stop
end
start
note right
longtimestamp()
end note
:return timestamp;;
stop
end
start
note right
StringtoString()
end note
:return "<"+value+","+timestamp+">";;
stop
end
start
note right
booleanequals(final Objecto)
end note
if (this==o) then (yes) 
:return true;;
stop
endif 
if (o==null ||getClass()!=o.getClass()) then (yes) 
:return false;;
stop
endif 
:return timestamp==that.timestamp&&Objects.equals(value,that.value);;
stop
end
start
note right
inthashCode()
end note
:return Objects.hash(value,timestamp);;
stop
end
@enduml

