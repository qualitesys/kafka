@startuml
!pragma layout smetana
start
note right
constructor ValueAndTimestamp(final Vvalue,final longtimestamp)
end note
:Objects.requireNonNull(value);
:this.value=value;
:this.timestamp=timestamp;
end
:return value==null ? null :new ValueAndTimestamp<>(value,
timestamp);;
stop
:return valueAndTimestamp==null ? null :valueAndTimestamp.value();;
stop
start
note right
Vvalue()
end note
:return value;;
stop
end
start
note right
longtimestamp()
end note
:return timestamp;;
stop
end
