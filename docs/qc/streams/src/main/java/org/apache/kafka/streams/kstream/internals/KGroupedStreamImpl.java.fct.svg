b5d3934e31046]
@startuml
!pragma layout smetana
start
note right
constructor KGroupedStreamImpl(final Stringname,
final Set<String>subTopologySourceNodes,final GroupedInternal<K,
V>groupedInternal,final booleanrepartitionRequired,
final GraphNodegraphNode,final InternalStreamsBuilderbuilder)
end note
:super (name,groupedInternal.keySerde(),groupedInternal.valueSerde(),
subTopologySourceNodes,graphNode,builder);
:this.repartitionRequired=repartitionRequired;
:this.userProvidedRepartitionTopicName=groupedInternal.name();
:this.aggregateBuilder=new GroupedStreamAggregateBuilder<>(builder,
groupedInternal,repartitionRequired,subTopologySourceNodes,
name,graphNode);
end
start
note right
KTable<K,V>reduce(final Reducer<V>reducer)
end note
:return reduce(reducer,Materialized.with(keySerde,
valueSerde));;
stop
end
start
note right
KTable<K,V>reduce(final Reducer<V>reducer,
final Materialized<K,V,KeyValueStore<Bytes,
byte[]>>materialized)
end note
:return reduce(reducer,NamedInternal.empty(),
materialized);;
stop
end
start
note right
KTable<K,V>reduce(final Reducer<V>reducer,
final Namednamed,final Materialized<K,V,KeyValueStore<Bytes,
byte[]>>materialized)
end note
:Objects.requireNonNull(reducer,"reducer can't be null");
:Objects.requireNonNull(materialized,"materialized can't be null");
:Objects.requireNonNull(named,"name can't be null");
if (materializedInternal.keySerde()==null ) then (yes) 
:materializedInternal.withKeySerde(keySerde);
endif 
if (materializedInternal.valueSerde()==null ) then (yes) 
:materializedInternal.withValueSerde(valueSerde);
endif 
:return doAggregate(new KStreamReduce<>(materializedInternal.storeName(),
reducer),name,materializedInternal);;
stop
end
:return aggregate(initializer,aggregator,
NamedInternal.empty(),materialized);;
stop
:Objects.requireNonNull(initializer,"initializer can't be null");
:Objects.requireNonNull(aggregator,"aggregator can't be null");
:Objects.requireNonNull(materialized,"materialized can't be null");
:Objects.requireNonNull(named,"named can't be null");
if (materializedInternal.keySerde()==null ) then (yes) 
:materializedInternal.withKeySerde(keySerde);
endif 
:return doAggregate(new KStreamAggregate<>(materializedInternal.storeName(),
initializer,aggregator),name,materializedInternal);;
stop
:return aggregate(initializer,aggregator,
Materialized.with(keySerde,null ));;
stop
start
note right
KTable<K,Long>count()
end note
:return doCount(NamedInternal.empty(),Materialized.with(keySerde,
Serdes.Long()));;
stop
end
start
note right
KTable<K,Long>count(final Namednamed)
end note
:Objects.requireNonNull(named,"named can't be null");
:return doCount(named,Materialized.with(keySerde,
Serdes.Long()));;
stop
end
start
note right
KTable<K,Long>count(final Materialized<K,
Long,KeyValueStore<Bytes,byte[]>>materialized)
end note
:return count(NamedInternal.empty(),materialized);;
stop
end
start
note right
KTable<K,Long>count(final Namednamed,final Materialized<K,
Long,KeyValueStore<Bytes,byte[]>>materialized)
end note
:Objects.requireNonNull(materialized,"materialized can't be null");
if (new MaterializedInternal<>(materialized)
.storeName()==null ) then (yes) 
:builder.newStoreName(AGGREGATE_NAME);
endif 
:return doCount(named,materialized);;
stop
end
start
note right
KTable<K,Long>doCount(final Namednamed,final Materialized<K,
Long,KeyValueStore<Bytes,byte[]>>materialized)
end note
if (materializedInternal.keySerde()==null ) then (yes) 
:materializedInternal.withKeySerde(keySerde);
endif 
if (materializedInternal.valueSerde()==null ) then (yes) 
:materializedInternal.withValueSerde(Serdes.Long());
endif 
:return doAggregate(new KStreamAggregate<>(materializedInternal.storeName(),
aggregateBuilder.countInitializer,aggregateBuilder.countAggregator),
name,materializedInternal);;
stop
end
:return new TimeWindowedKStreamImpl<>(windows,
builder,subTopologySourceNodes,name,keySerde,
valueSerde,aggregateBuilder,graphNode);;
stop
start
note right
TimeWindowedKStream<K,V>windowedBy(final SlidingWindowswindows)
end note
:return new SlidingWindowedKStreamImpl<>(windows,
builder,subTopologySourceNodes,name,keySerde,
valueSerde,aggregateBuilder,graphNode);;
stop
end
start
note right
SessionWindowedKStream<K,V>windowedBy(final SessionWindowswindows)
end note
:return new SessionWindowedKStreamImpl<>(windows,
builder,subTopologySourceNodes,name,keySerde,
valueSerde,aggregateBuilder,graphNode);;
stop
end
:return aggregateBuilder.build(new NamedInternal(functionName),
new TimestampedKeyValueStoreMaterializer<>(materializedInternal).materialize(),
aggregateSupplier,materializedInternal.queryableStoreName(),
materializedInternal.keySerde(),materializedInternal.valueSerde());;
stop
:Objects.requireNonNull(aggregator,"aggregator can't be null");
:return new CogroupedKStreamImpl<K,VOut>(name,
subTopologySourceNodes,graphNode,builder).cogroup(this,
aggregator);;
stop
@enduml

