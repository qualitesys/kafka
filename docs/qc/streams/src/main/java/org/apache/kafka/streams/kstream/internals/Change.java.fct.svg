@startuml
!pragma layout smetana
start
note right
constructor Change(final TnewValue,final ToldValue)
end note
:this.newValue=newValue;
:this.oldValue=oldValue;
end
start
note right
StringtoString()
end note
:return "("+newValue+"<-"+oldValue+")";;
stop
end
start
note right
booleanequals(final Objecto)
end note
if (this==o) then (yes) 
:return true;;
stop
endif 
if (o==null ||getClass()!=o.getClass()) then (yes) 
:return false;;
stop
endif 
:return Objects.equals(newValue,change.newValue)&&Objects.equals(oldValue,change.oldValue);;
stop
end
start
note right
inthashCode()
end note
:return Objects.hash(newValue,oldValue);;
stop
end
@enduml

