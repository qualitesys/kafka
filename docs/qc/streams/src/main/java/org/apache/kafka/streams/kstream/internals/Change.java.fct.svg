@startuml
!pragma layout smetana
start
note right
constructor Change(final T newValue,final T oldValue)
end note
:this.newValue=newValue;;
:this.oldValue=oldValue;;
end
start
note right
String toString()
end note
:return "("+newValue+"<-"+oldValue+")";;
stop
end
start
note right
boolean equals(final Object o)
end note
if (this==o) then (yes) 
:return true;;
stop
endif 
if (o==null ||getClass()!=o.getClass()) then (yes) 
:return false;;
stop
endif 
:final Change<?> change=(Change<?> )o;;
:return Objects.equals(newValue,change.newValue)&&Objects.equals(oldValue,
change.oldValue);;
stop
end
start
note right
int hashCode()
end note
:return Objects.hash(newValue,oldValue);;
stop
end
@enduml

