style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="223.5" x2="223.5" y1="1071.8164" y2="1091.8164"/><polygon fill="#181818" points="219.5,1081.8164,223.5,1091.8164,227.5,1081.8164,223.5,1085.8164" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[8cd0eb13f98b1466e44052b25eafc70e]
@startuml
!pragma layout smetana
start
note right
constructor CompositeKeyValueIterator(final Iterator<StoreType>underlying,final NextIteratorFunction<K,V,StoreType>nextIteratorFunction)
end note
:this.storeIterator=underlying;
:this.nextIteratorFunction=nextIteratorFunction;
end
start
note right
void close()
end note
if (current!=null ) then (yes) 
:current.close();
:current=null ;
endif 
end
start
note right
KpeekNextKey()
end note
end
start
note right
booleanhasNext()
end note
while ((current==null ||!current.hasNext())&&storeIterator.hasNext())
:close();
:current=nextIteratorFunction.apply(storeIterator.next());
endwhile
:return current!=null &&current.hasNext();;
stop
end
start
note right
KeyValue<K,V>next()
end note
if (!hasNext()) then (yes) 
endif 
:return current.next();;
stop
end
@enduml

