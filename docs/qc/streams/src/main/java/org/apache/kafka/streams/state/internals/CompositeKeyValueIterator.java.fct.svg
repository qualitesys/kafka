@startuml
!pragma layout smetana
start
note right
constructor CompositeKeyValueIterator(final Iterator<StoreType>underlying,final NextIteratorFunction<K,V,StoreType>nextIteratorFunction)
end note
:this.storeIterator=underlying;
:this.nextIteratorFunction=nextIteratorFunction;
end
start
note right
void close()
end note
if (current!=null ) then (yes) 
:current.close();
:current=null ;
endif 
end
start
note right
KpeekNextKey()
end note
:throw new UnsupportedOperationException("peekNextKey not supported");;
end
start
note right
booleanhasNext()
end note
while ((current==null ||!current.hasNext())&&storeIterator.hasNext())
:close();
:current=nextIteratorFunction.apply(storeIterator.next());
endwhile
:return current!=null &&current.hasNext();;
stop
end
start
note right
KeyValue<K,V>next()
end note
if (!hasNext()) then (yes) 
:throw new NoSuchElementException();;
endif 
:return current.next();;
stop
end
@enduml

