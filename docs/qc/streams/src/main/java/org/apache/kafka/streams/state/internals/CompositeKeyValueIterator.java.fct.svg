.8359" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="256.5" x2="256.5" y1="1078.9492" y2="1103.3516"/><polygon fill="#181818" points="252.5,1093.3516,256.5,1103.3516,260.5,1093.3516,256.5,1097.3516" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="297" x2="397.5" y1="1066.9492" y2="1066.9492"/><polygon fill="#181818" points="393.5,1135.8359,397.5,1145.8359,401.5,1135.8359,397.5,1139.8359" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="397.5" x2="397.5" y1="1066.9492" y2="1209.8359"/><line style="stroke:#181818;stroke-width:1.0;" x1="397.5" x2="256.5" y1="1209.8359" y2="1209.8359"/><line style="stroke:#181818;stroke-width:1.0;" x1="256.5" x2="256.5" y1="1209.8359" y2="1229.8359"/><polygon fill="#181818" points="252.5,1219.8359,256.5,1229.8359,260.5,1219.8359,256.5,1223.8359" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="256.5" x2="256.5" y1="1032.3828" y2="1054.9492"/><polygon fill="#181818" points="252.5,1044.9492,256.5,1054.9492,260.5,1044.9492,256.5,1048.9492" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="256.5" x2="256.5" y1="1263.8047" y2="1283.8047"/><polygon fill="#181818" points="252.5,1273.8047,256.5,1283.8047,260.5,1273.8047,256.5,1277.8047" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[efc4eb82a9144bd517a88594ba914d15]
@startuml
!pragma layout smetana
start
note right
constructor CompositeKeyValueIterator(final Iterator<StoreType>underlying,
final NextIteratorFunction<K,V,StoreType>nextIteratorFunction)
end note
:this.storeIterator=underlying;;
:this.nextIteratorFunction=nextIteratorFunction;;
end
start
note right
void close()
end note
if (current!=null ) then (yes) 
:current.close();;
:current=null ;;
endif 
end
start
note right
KpeekNextKey()
end note
:throw new UnsupportedOperationException("peekNextKey not supported");;
stop
end
start
note right
booleanhasNext()
end note
while ((current==null ||!current.hasNext())&&storeIterator.hasNext())
:close();;
:current=nextIteratorFunction.apply(storeIterator.next());;
endwhile
:return current!=null &&current.hasNext();;
stop
end
start
note right
KeyValue<K,V>next()
end note
