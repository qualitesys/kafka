50" x2="350" y1="962.0508" y2="982.0508"/><polygon fill="#181818" points="346,972.0508,350,982.0508,354,972.0508,350,976.0508" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="350" x2="350" y1="1066.6172" y2="1089.1836"/><polygon fill="#181818" points="346,1079.1836,350,1089.1836,354,1079.1836,350,1083.1836" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="350" x2="350" y1="1123.1523" y2="1143.1523"/><polygon fill="#181818" points="346,1133.1523,350,1143.1523,354,1133.1523,350,1137.1523" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[087d3c28eeab2050c95c9baf9e27873c]
@startuml
!pragma layout smetana
start
note right
constructor ChangedDeserializer(final Deserializer<T> inner)
end note
:this.inner=inner;;
end
start
note right
Deserializer<T> inner()
end note
:return inner;;
stop
end
start
note right
void setIfUnset(final SerdeGetter getter)
end note
if (inner==null ) then (yes) 
:inner=(Deserializer<T> )getter.valueSerde()
.deserializer();;
endif 
end
start
note right
Change<T> deserialize(final String topic,
final Headers headers,final byte[] data)
end note
:final byte[] bytes=new byte[data.length-NEWFLAG_SIZE];;
:System.arraycopy(data,0,bytes,0,bytes.length);;
if (ByteBuffer.wrap(data).get(data.length-NEWFLAG_SIZE)!=0) then (yes) 
:return new Change<>(inner.deserialize(topic,
headers,bytes),null );;
stop
else (no)
:return new Change<>(null ,inner.deserialize(topic,
headers,bytes));;
stop
endif 
end
start
note right
Change<T> deserialize(final String topic,
final byte[] data)
end note
:return deserialize(topic,null ,data);;
stop
end
start
note right
void close()
end note
:inner.close();;
end
@enduml

