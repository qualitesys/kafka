@startuml
!pragma layout smetana
start
note right
constructor ChangedDeserializer(final Deserializer<T>inner)
end note
:this.inner=inner;
end
start
note right
Deserializer<T>inner()
end note
:return inner;;
stop
end
start
note right
void setIfUnset(final SerdeGettergetter)
end note
if (inner==null ) then (yes) 
:inner=(Deserializer<T>)getter.valueSerde().deserializer();
endif 
end
start
note right
Change<T>deserialize(final Stringtopic,final Headersheaders,final byte[]data)
end note
:System.arraycopy(data,0,bytes,0,bytes.length);
if (ByteBuffer.wrap(data).get(data.length-NEWFLAG_SIZE)!=0) then (yes) 
:return new Change<>(inner.deserialize(topic,headers,bytes),null );;
stop
else (no)
:return new Change<>(null ,inner.deserialize(topic,headers,bytes));;
stop
endif 
end
start
note right
Change<T>deserialize(final Stringtopic,final byte[]data)
end note
:return deserialize(topic,null ,data);;
stop
end
start
note right
void close()
end note
:inner.close();
end
@enduml

