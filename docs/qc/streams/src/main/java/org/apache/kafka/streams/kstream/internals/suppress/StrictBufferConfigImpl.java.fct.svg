@startuml
!pragma layout smetana
start
note right
constructor StrictBufferConfigImpl(final longmaxRecords,
final longmaxBytes,final BufferFullStrategybufferFullStrategy,
final Map<String,String>logConfig)
end note
:this.maxRecords=maxRecords;;
:this.maxBytes=maxBytes;;
:this.bufferFullStrategy=bufferFullStrategy;;
:this.logConfig=logConfig;;
end
start
note right
constructor StrictBufferConfigImpl()
end note
:this.maxRecords=Long.MAX_VALUE;;
:this.maxBytes=Long.MAX_VALUE;;
:this.bufferFullStrategy=SHUT_DOWN;;
:this.logConfig=Collections.emptyMap();;
end
start
note right
Suppressed.StrictBufferConfigwithMaxRecords(final longrecordLimit)
end note
:return new StrictBufferConfigImpl(recordLimit,
maxBytes,bufferFullStrategy,getLogConfig());;
stop
end
start
note right
Suppressed.StrictBufferConfigwithMaxBytes(final longbyteLimit)
end note
:return new StrictBufferConfigImpl(maxRecords,
byteLimit,bufferFullStrategy,getLogConfig());;
stop
end
start
note right
longmaxRecords()
end note
:return maxRecords;;
stop
end
start
note right
longmaxBytes()
end note
:return maxBytes;;
stop
end
start
note right
BufferFullStrategybufferFullStrategy()
end note
:return bufferFullStrategy;;
stop
end
start
note right
Suppressed.StrictBufferConfigwithLoggingDisabled()
end note
:return new StrictBufferConfigImpl(maxRecords,
maxBytes,bufferFullStrategy,null );;
stop
end
start
note right
Suppressed.StrictBufferConfigwithLoggingEnabled(final Map<String,
String>config)
end note
:return new StrictBufferConfigImpl(maxRecords,
maxBytes,bufferFullStrategy,config);;
stop
end
start
note right
booleanisLoggingEnabled()
end note
:return logConfig!=null ;;
stop
end
start
note right
Map<String,String>getLogConfig()
end note
:return isLoggingEnabled()? logConfig:Collections.emptyMap();;
stop
end
start
note right
booleanequals(final Objecto)
end note
if (this==o) then (yes) 
:return true;;
stop
endif 
if (o==null ||getClass()!=o.getClass()) then (yes) 
:return false;;
stop
endif 
:final StrictBufferConfigImplthat=(StrictBufferConfigImpl)o;;
:return maxRecords==that.maxRecords&&maxBytes==that.maxBytes&&bufferFullStrategy==that.bufferFullStrategy&&Objects.equals(getLogConfig(),
((StrictBufferConfigImpl)o).getLogConfig());;
stop
end
start
note right
inthashCode()
end note
:return Objects.hash(maxRecords,maxBytes,
bufferFullStrategy,getLogConfig());;
stop
end
start
note right
StringtoString()
end note
:return "StrictBufferConfigImpl{maxKeys="+
maxRecords+", maxBytes="+maxBytes+", bufferFullStrategy="+
bufferFullStrategy+", logConfig="+getLogConfig().toString()+
'}';;
stop
end
@enduml

