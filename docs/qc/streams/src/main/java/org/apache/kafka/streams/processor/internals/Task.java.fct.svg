@startuml
!pragma layout smetana
start
note right
constructor State(final Integer... validTransitions)
end note
:this.validTransitions.addAll(Arrays.asList(validTransitions));
end
start
note right
booleanisValidTransition(final StatenewState)
end note
:return validTransitions.contains(newState.ordinal());;
stop
end
start
note right
constructor TaskType(final Stringname)
end note
:this.name=name;
end
:throw new UnsupportedOperationException();;
:return false;;
stop
:return false;;
stop
:return false;;
stop
:return Collections.emptyMap();;
stop
:return state()==State.CREATED||state()==State.RESTORING;;
stop
