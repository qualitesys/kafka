@startuml
!pragma layout smetana
start
note right
constructor Branched(final Stringname,final Function<? super KStream<K,
V>,?  extends KStream<K,V>>chainFunction,
final Consumer<? super KStream<K,V>>chainConsumer)
end note
:this.name=name;
:this.chainFunction=chainFunction;
:this.chainConsumer=chainConsumer;
end
:Objects.requireNonNull(name,"name cannot be null");
:return new Branched<>(name,null ,null );;
stop
:Objects.requireNonNull(chain,"chain function cannot be null");
:return new Branched<>(null ,chain,null );;
stop
:Objects.requireNonNull(chain,"chain consumer cannot be null");
:return new Branched<>(null ,null ,chain);;
stop
:Objects.requireNonNull(chain,"chain function cannot be null");
:return new Branched<>(name,chain,null );;
stop
:Objects.requireNonNull(chain,"chain consumer cannot be null");
:return new Branched<>(name,null ,chain);;
stop
start
note right
constructor Branched(final Branched<K,V>branched)
end note
:this(branched.name,branched.chainFunction,
branched.chainConsumer);
end
start
note right
Branched<K,V>withName(final Stringname)
end note
:Objects.requireNonNull(name,"name cannot be null");
:return new Branched<>(name,chainFunction,
chainConsumer);;
stop
end
@enduml

