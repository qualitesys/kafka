@startuml
!pragma layout smetana
start
note right
constructor SubscriptionWrapperSerde(final Supplier<String>primaryKeySerializationPseudoTopicSupplier,
final Serde<K>primaryKeySerde)
end note
:super (new SubscriptionWrapperSerializer<>(primaryKeySerializationPseudoTopicSupplier,
primaryKeySerde==null ? null :primaryKeySerde.serializer()),
new SubscriptionWrapperDeserializer<>(primaryKeySerializationPseudoTopicSupplier,
primaryKeySerde==null ? null :primaryKeySerde.deserializer()));;
end
start
note right
constructor SubscriptionWrapperSerializer(final Supplier<String>primaryKeySerializationPseudoTopicSupplier,
final Serializer<K>primaryKeySerializer)
end note
:this.primaryKeySerializationPseudoTopicSupplier=primaryKeySerializationPseudoTopicSupplier;;
:this.primaryKeySerializer=primaryKeySerializer;;
end
start
note right
void setIfUnset(final SerdeGettergetter)
end note
if (primaryKeySerializer==null ) then (yes) 
:primaryKeySerializer=(Serializer<K>)getter.keySerde()
.serializer();;
endif 
end
start
note right
void configure(final Map<String,? >configs,
final booleanisKey)
end note
:this.upgradeFromV0=upgradeFromV0(configs);;
end
start
note right
booleanupgradeFromV0(final Map<String,? >configs)
end note
:final ObjectupgradeFrom=configs.get(StreamsConfig.UPGRADE_FROM_CONFIG);;
if (upgradeFrom==null ) then (yes) 
:return false;;
stop
endif 
switch (switch ((String)upgradeFrom))
endswith
end
start
note right
byte[]serialize(final Stringignored,final SubscriptionWrapper<K>data)
end note
if (Byte.compare((byte)0x7F,data.getVersion())<0) then (yes) 
:throw new UnsupportedVersionException("SubscriptionWrapper version is larger than maximum supported 0x7F");;
stop
endif 
:final intversion=data.getVersion();;
if (upgradeFromV0||version==0) then (yes) 
:return serializeV0(data);;
stop
else if (version==1) then (yes) 
:return serializeV1(data);;
stop
else (no)
:throw new UnsupportedVersionException("Unsupported SubscriptionWrapper version "+
data.getVersion());;
stop
endif 
end
start
note right
byte[]serializePrimaryKey(final SubscriptionWrapper<K>data)
end note
if (primaryKeySerializationPseudoTopic==null ) then (yes) 
:primaryKeySerializationPseudoTopic=primaryKeySerializationPseudoTopicSupplier.get();;
endif 
:return primaryKeySerializer.serialize(primaryKeySerializationPseudoTopic,
data.getPrimaryKey());;
stop
end
start
note right
ByteBufferserializeCommon(final SubscriptionWrapper<K>data,
final byteversion,final intextraLength)
end note
:final byte[]primaryKeySerializedData=serializePrimaryKey(data);;
:final ByteBufferbuf;;
:intdataLength=2+primaryKeySerializedData.length+
extraLength;;
if (data.getHash()!=null ) then (yes) 
:dataLength+=2*Long.BYTES;;
:buf=ByteBuffer.allocate(dataLength);;
:buf.put(version);;
else (no)
:buf=ByteBuffer.allocate(dataLength);;
:buf.put((byte)(version|(byte)0x80));;
endif 
:buf.put(data.getInstruction().getValue());;
:final long[]elem=data.getHash();;
if (data.getHash()!=null ) then (yes) 
:buf.putLong(elem[0]);;
:buf.putLong(elem[1]);;
endif 
:buf.put(primaryKeySerializedData);;
:return buf;;
stop
end
start
note right
byte[]serializeV0(final SubscriptionWrapper<K>data)
end note
:return serializeCommon(data,(byte)0,0).array();;
stop
end
start
note right
byte[]serializeV1(final SubscriptionWrapper<K>data)
end note
:final ByteBufferbuf=serializeCommon(data,
data.getVersion(),Integer.BYTES);;
:buf.putInt(data.getPrimaryPartition());;
:return buf.array();;
stop
end
start
note right
constructor SubscriptionWrapperDeserializer(final Supplier<String>primaryKeySerializationPseudoTopicSupplier,
final Deserializer<K>primaryKeyDeserializer)
end note
:this.primaryKeySerializationPseudoTopicSupplier=primaryKeySerializationPseudoTopicSupplier;;
:this.primaryKeyDeserializer=primaryKeyDeserializer;;
end
start
note right
void setIfUnset(final SerdeGettergetter)
end note
if (primaryKeyDeserializer==null ) then (yes) 
:primaryKeyDeserializer=(Deserializer<K>)getter.keySerde()
.deserializer();;
endif 
end
start
note right
SubscriptionWrapper<K>deserialize(final Stringignored,
final byte[]data)
end note
:final ByteBufferbuf=ByteBuffer.wrap(data);;
:final byteversionAndIsHashNull=buf.get();;
:final byteversion=(byte)(0x7F&versionAndIsHashNull);;
:final booleanisHashNull=(0x80&versionAndIsHashNull)==0x80;;
:final SubscriptionWrapper.Instructioninst=SubscriptionWrapper.Instruction.fromValue(buf.get());;
:intlengthSum=2;;
:final long[]hash;;
if (isHashNull) then (yes) 
:hash=null ;;
else (no)
:hash=new long[2];;
:hash[0]=buf.getLong();;
:hash[1]=buf.getLong();;
:lengthSum+=2*Long.BYTES;;
endif 
:final intprimaryKeyLength;;
if (version>0) then (yes) 
:primaryKeyLength=data.length-lengthSum-Integer.BYTES;;
else (no)
:primaryKeyLength=data.length-lengthSum;;
endif 
:final byte[]primaryKeyRaw=new byte[primaryKeyLength];;
:buf.get(primaryKeyRaw,0,primaryKeyLength);;
if (primaryKeySerializationPseudoTopic==null ) then (yes) 
:primaryKeySerializationPseudoTopic=primaryKeySerializationPseudoTopicSupplier.get();;
endif 
:final KprimaryKey=primaryKeyDeserializer.deserialize(primaryKeySerializationPseudoTopic,
primaryKeyRaw);;
:final IntegerprimaryPartition;;
if (version>0) then (yes) 
:primaryPartition=buf.getInt();;
else (no)
:primaryPartition=null ;;
endif 
:return new SubscriptionWrapper<>(hash,inst,
primaryKey,version,primaryPartition);;
stop
end
