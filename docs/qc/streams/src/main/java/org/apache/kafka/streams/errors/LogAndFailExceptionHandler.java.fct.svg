@startuml
!pragma layout smetana
start
note right
DeserializationHandlerResponsehandle(final ProcessorContextcontext,final ConsumerRecord<byte[],byte[]>record,final Exceptionexception)
end note
:log.error("Exception caught during Deserialization, "+"taskId: {}, topic: {}, partition: {}, offset: {}",context.taskId(),record.topic(),record.partition(),record.offset(),exception);
:return DeserializationHandlerResponse.FAIL;;
stop
end
start
note right
void configure(final Map<String,? >configs)
end note
end
@enduml

