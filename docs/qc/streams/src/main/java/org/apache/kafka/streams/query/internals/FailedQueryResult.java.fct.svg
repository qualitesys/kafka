2="395" y1="1004.2773" y2="1026.8438"/><polygon fill="#181818" points="391,1016.8438,395,1026.8438,399,1016.8438,395,1020.8438" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="395" x2="395" y1="1102.7188" y2="1122.7188"/><polygon fill="#181818" points="391,1112.7188,395,1122.7188,399,1112.7188,395,1116.7188" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[d5ef56a1a4789319ccec4c264d7d6610]
@startuml
!pragma layout smetana
start
note right
constructor FailedQueryResult(final FailureReasonfailureReason,
final Stringfailure)
end note
:this.failureReason=failureReason;
:this.failure=failure;
end
start
note right
booleanisSuccess()
end note
:return false;;
stop
end
start
note right
booleanisFailure()
end note
:return true;;
stop
end
start
note right
FailureReasongetFailureReason()
end note
:return failureReason;;
stop
end
start
note right
StringgetFailureMessage()
end note
:return failure;;
stop
end
start
note right
RgetResult()
end note
:throw new IllegalArgumentException("Cannot get result for failed query. Failure is "+failureReason.name()+": "+failure);;
end
start
note right
StringtoString()
end note
:return "FailedQueryResult{"+"failureReason="+
failureReason+", failure='"+failure+'\''+
", executionInfo="+getExecutionInfo()+", position="+
getPosition()+'}';;
stop
end
@enduml

