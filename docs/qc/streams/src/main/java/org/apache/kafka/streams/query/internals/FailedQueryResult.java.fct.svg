-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="395" x2="395" y1="1087.5859" y2="1107.5859"/><polygon fill="#181818" points="391,1097.5859,395,1107.5859,399,1097.5859,395,1101.5859" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[ab0bb7a372f8e7e3fe81fd23e0a73d46]
@startuml
!pragma layout smetana
start
note right
constructor FailedQueryResult(final FailureReasonfailureReason,final Stringfailure)
end note
:this.failureReason=failureReason;
:this.failure=failure;
end
start
note right
booleanisSuccess()
end note
:return false;;
stop
end
start
note right
booleanisFailure()
end note
:return true;;
stop
end
start
note right
FailureReasongetFailureReason()
end note
:return failureReason;;
stop
end
start
note right
StringgetFailureMessage()
end note
:return failure;;
stop
end
start
note right
RgetResult()
end note
:throw new IllegalArgumentException("Cannot get result for failed query. Failure is "+failureReason.name()+": "+failure);;
end
start
note right
StringtoString()
end note
:return "FailedQueryResult{"+"failureReason="+
failureReason+", failure='"+failure+'\''+
", executionInfo="+getExecutionInfo()+", position="+
getPosition()+'}';;
stop
end
@enduml

