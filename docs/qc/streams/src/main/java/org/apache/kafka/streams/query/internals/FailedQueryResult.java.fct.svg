@startuml
!pragma layout smetana
start
note right
constructor FailedQueryResult(final FailureReasonfailureReason,
final Stringfailure)
end note
:this.failureReason=failureReason;
:this.failure=failure;
end
start
note right
booleanisSuccess()
end note
:return false;;
stop
end
start
note right
booleanisFailure()
end note
:return true;;
stop
end
start
note right
FailureReasongetFailureReason()
end note
:return failureReason;;
stop
end
start
note right
StringgetFailureMessage()
end note
:return failure;;
stop
end
start
note right
RgetResult()
end note
:throw new IllegalArgumentException("Cannot get result for failed query. Failure is "+
failureReason.name()+": "+failure);;
end
start
note right
StringtoString()
end note
:return "FailedQueryResult{"+"failureReason="+
failureReason+", failure='"+failure+'\''+
", executionInfo="+getExecutionInfo()+", position="+
getPosition()+'}';;
stop
end
@enduml

