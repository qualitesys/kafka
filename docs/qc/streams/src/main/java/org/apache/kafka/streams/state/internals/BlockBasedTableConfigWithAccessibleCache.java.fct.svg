@startuml
!pragma layout smetana
start
note right
BlockBasedTableConfigsetBlockCache(final Cachecache)
end note
:blockCache=cache;;
:return super .setBlockCache(cache);;
stop
end
start
note right
CacheblockCache()
end note
:return blockCache;;
stop
end
@enduml

