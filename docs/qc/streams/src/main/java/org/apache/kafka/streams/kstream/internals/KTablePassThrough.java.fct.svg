@startuml
!pragma layout smetana
start
note right
constructor KTablePassThrough(final Collection<KStreamAggProcessorSupplier>parents,
final StringstoreName)
end note
end
start
note right
Processor<KIn,Change<VIn>,KIn,Change<VIn>>get()
end note
:return new KTablePassThroughProcessor();;
stop
end
start
note right
booleanenableSendingOldValues(final booleanforceMaterialization)
end note
:return true;;
stop
end
start
note right
KTableValueGetterSupplier<KIn,VIn>view()
end note
:return new KTableValueGetterSupplier<KIn,
VIn>(){public KTableValueGetter<KIn,VIn>get(){return new KTablePassThroughValueGetter();}@Override public String[]storeNames(){return new String[]{storeName};}};;
stop
end
start
note right
void init(final ProcessorContext<KIn,Change<VIn>>context)
end note
end
start
note right
void process(final Record<KIn,Change<VIn>>record)
end note
end
start
note right
void init(final ProcessorContext<? ,? >context)
end note
end
start
note right
ValueAndTimestamp<VIn>get(final KInkey)
end note
:return store.get(key);;
stop
end
@enduml

