="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="558.5" x2="558.5" y1="1040.2148" y2="1062.7813"/><polygon fill="#181818" points="554.5,1052.7813,558.5,1062.7813,562.5,1052.7813,558.5,1056.7813" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="558.5" x2="558.5" y1="1096.75" y2="1116.75"/><polygon fill="#181818" points="554.5,1106.75,558.5,1116.75,562.5,1106.75,558.5,1110.75" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="558.5" x2="558.5" y1="1169.3164" y2="1191.8828"/><polygon fill="#181818" points="554.5,1181.8828,558.5,1191.8828,562.5,1181.8828,558.5,1185.8828" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="558.5" x2="558.5" y1="1225.8516" y2="1245.8516"/><polygon fill="#181818" points="554.5,1235.8516,558.5,1245.8516,562.5,1235.8516,558.5,1239.8516" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[087ac30f76330d84d43d104396d0978a]
@startuml
!pragma layout smetana
start
note right
constructor KTablePassThrough(final Collection<KStreamAggProcessorSupplier>parents,
final StringstoreName)
end note
:this.parents=parents;;
:this.storeName=storeName;;
end
start
note right
Processor<KIn,Change<VIn>,KIn,Change<VIn>>get()
end note
:return new KTablePassThroughProcessor();;
stop
end
start
note right
booleanenableSendingOldValues(final booleanforceMaterialization)
end note
:parent.enableSendingOldValues();;
:return true;;
stop
end
start
note right
KTableValueGetterSupplier<KIn,VIn>view()
end note
:return new KTableValueGetterSupplier<KIn,
VIn>(){public KTableValueGetter<KIn,VIn>get(){return new KTablePassThroughValueGetter();}@Override public String[]storeNames(){return new String[]{storeName};}};;
stop
end
start
note right
void init(final ProcessorContext<KIn,Change<VIn>>context)
end note
:this.context=context;;
end
start
note right
void process(final Record<KIn,Change<VIn>>record )
end note
:context.forward(record );;
end
start
note right
void init(final ProcessorContext<? ,? >context)
end note
:store=context.getStateStore(storeName);;
end
start
note right
ValueAndTimestamp<VIn>get(final KInkey)
end note
:return store.get(key);;
stop
