@startuml
!pragma layout smetana
start
note right
constructor TimeWindowedKStreamImpl(final Windows<W>windows,
final InternalStreamsBuilderbuilder,final Set<String>subTopologySourceNodes,
final Stringname,final Serde<K>keySerde,final Serde<V>valueSerde,
final GroupedStreamAggregateBuilder<K,V>aggregateBuilder,
final GraphNodegraphNode)
end note
:super (name,keySerde,valueSerde,subTopologySourceNodes,
graphNode,builder);;
:this.windows=Objects.requireNonNull(windows,
"windows can't be null");;
:this.aggregateBuilder=aggregateBuilder;;
end
start
note right
KTable<Windowed<K>,Long>count()
end note
:return count(NamedInternal.empty());;
stop
end
start
note right
KTable<Windowed<K>,Long>count(final Namednamed)
end note
:return doCount(named,Materialized.with(keySerde,
Serdes.Long()));;
stop
end
start
note right
KTable<Windowed<K>,Long>count(final Materialized<K,
Long,WindowStore<Bytes,byte[]>>materialized)
end note
:return count(NamedInternal.empty(),materialized);;
stop
end
start
note right
KTable<Windowed<K>,Long>count(final Namednamed,
final Materialized<K,Long,WindowStore<Bytes,
byte[]>>materialized)
end note
:Objects.requireNonNull(materialized,"materialized can't be null");;
if (new MaterializedInternal<>(materialized).storeName()==null ) then (yes) 
:builder.newStoreName(AGGREGATE_NAME);;
endif 
:return doCount(named,materialized);;
stop
end
start
note right
KTable<Windowed<K>,Long>doCount(final Namednamed,
final Materialized<K,Long,WindowStore<Bytes,
byte[]>>materialized)
end note
:final MaterializedInternal<K,Long,WindowStore<Bytes,
byte[]>>materializedInternal=new MaterializedInternal<>(materialized,
builder,AGGREGATE_NAME);;
if (materializedInternal.keySerde()==null ) then (yes) 
:materializedInternal.withKeySerde(keySerde);;
endif 
if (materializedInternal.valueSerde()==null ) then (yes) 
:materializedInternal.withValueSerde(Serdes.Long());;
endif 
:final StringaggregateName=new NamedInternal(named).orElseGenerateWithPrefix(builder,
AGGREGATE_NAME);;
:return aggregateBuilder.build(new NamedInternal(aggregateName),
materialize(materializedInternal),new KStreamWindowAggregate<>(windows,
materializedInternal.storeName(),emitStrategy,
aggregateBuilder.countInitializer,aggregateBuilder.countAggregator),
materializedInternal.queryableStoreName(),
materializedInternal.keySerde()!=null ? new FullTimeWindowedSerde<>(materializedInternal.keySerde(),
windows.size()):null ,materializedInternal.valueSerde());;
stop
end
:return aggregate(initializer,aggregator,
Materialized.with(keySerde,null ));;
stop
:return aggregate(initializer,aggregator,
named,Materialized.with(keySerde,null ));;
stop
:return aggregate(initializer,aggregator,
NamedInternal.empty(),materialized);;
stop
:Objects.requireNonNull(initializer,"initializer can't be null");;
:Objects.requireNonNull(aggregator,"aggregator can't be null");;
:Objects.requireNonNull(materialized,"materialized can't be null");;
:final MaterializedInternal<K,VR,WindowStore<Bytes,
byte[]>>materializedInternal=new MaterializedInternal<>(materialized,
builder,AGGREGATE_NAME);;
if (materializedInternal.keySerde()==null ) then (yes) 
:materializedInternal.withKeySerde(keySerde);;
endif 
:final StringaggregateName=new NamedInternal(named).orElseGenerateWithPrefix(builder,
AGGREGATE_NAME);;
:return aggregateBuilder.build(new NamedInternal(aggregateName),
materialize(materializedInternal),new KStreamWindowAggregate<>(windows,
materializedInternal.storeName(),emitStrategy,
initializer,aggregator),materializedInternal.queryableStoreName(),
materializedInternal.keySerde()!=null ? new FullTimeWindowedSerde<>(materializedInternal.keySerde(),
windows.size()):null ,materializedInternal.valueSerde());;
stop
start
note right
KTable<Windowed<K>,V>reduce(final Reducer<V>reducer)
end note
:return reduce(reducer,NamedInternal.empty());;
stop
end
start
note right
KTable<Windowed<K>,V>reduce(final Reducer<V>reducer,
final Namednamed)
end note
:return reduce(reducer,named,Materialized.with(keySerde,
valueSerde));;
stop
end
start
note right
KTable<Windowed<K>,V>reduce(final Reducer<V>reducer,
final Materialized<K,V,WindowStore<Bytes,
byte[]>>materialized)
end note
:return reduce(reducer,NamedInternal.empty(),
materialized);;
stop
end
start
note right
KTable<Windowed<K>,V>reduce(final Reducer<V>reducer,
final Namednamed,final Materialized<K,V,WindowStore<Bytes,
byte[]>>materialized)
end note
:Objects.requireNonNull(reducer,"reducer can't be null");;
:Objects.requireNonNull(named,"named can't be null");;
:Objects.requireNonNull(materialized,"materialized can't be null");;
:final MaterializedInternal<K,V,WindowStore<Bytes,
byte[]>>materializedInternal=new MaterializedInternal<>(materialized,
builder,REDUCE_NAME);;
if (materializedInternal.keySerde()==null ) then (yes) 
:materializedInternal.withKeySerde(keySerde);;
endif 
if (materializedInternal.valueSerde()==null ) then (yes) 
:materializedInternal.withValueSerde(valueSerde);;
endif 
:final StringreduceName=new NamedInternal(named).orElseGenerateWithPrefix(builder,
REDUCE_NAME);;
:return aggregateBuilder.build(new NamedInternal(reduceName),
materialize(materializedInternal),new KStreamWindowAggregate<>(windows,
materializedInternal.storeName(),emitStrategy,
aggregateBuilder.reduceInitializer,aggregatorForReducer(reducer)),
materializedInternal.queryableStoreName(),
materializedInternal.keySerde()!=null ? new FullTimeWindowedSerde<>(materializedInternal.keySerde(),
windows.size()):null ,materializedInternal.valueSerde());;
stop
end
start
note right
TimeWindowedKStream<K,V>emitStrategy(final EmitStrategyemitStrategy)
end note
if (this.windows instanceof UnlimitedWindows&&emitStrategy.type()==StrategyType.ON_WINDOW_CLOSE) then (yes) 
:throw new IllegalArgumentException("ON_WINDOW_CLOSE emit strategy cannot be used for UnlimitedWindows");;
stop
endif 
:this.emitStrategy=emitStrategy;;
:return this;;
stop
end
:WindowBytesStoreSuppliersupplier=(WindowBytesStoreSupplier)materialized.storeSupplier();;
if (supplier==null ) then (yes) 
:final longretentionPeriod=materialized.retention()!=null ? materialized.retention().toMillis():windows.size()+
windows.gracePeriodMs();;
if ((windows.size()+windows.gracePeriodMs())>retentionPeriod) then (yes) 
:throw new IllegalArgumentException("The retention period of the window store "+
name+" must be no smaller than its window size plus the grace period."+
" Got size=["+windows.size()+"],"+" grace=["+
windows.gracePeriodMs()+"],"+" retention=["+
retentionPeriod+"]");;
stop
endif 
switch (switch (materialized.storeType()))
endswith
endif 
:final StoreBuilder<TimestampedWindowStore<K,
VR>>builder=Stores.timestampedWindowStoreBuilder(supplier,
materialized.keySerde(),materialized.valueSerde());;
if (materialized.loggingEnabled()) then (yes) 
:builder.withLoggingEnabled(materialized.logConfig());;
else (no)
:builder.withLoggingDisabled();;
endif 
if (materialized.cachingEnabled()) then (yes) 
:builder.withCachingEnabled();;
endif 
:return builder;;
stop
start
note right
Aggregator<K,V,V>aggregatorForReducer(final Reducer<V>reducer)
end note
:return (aggKey,value,aggregate)->aggregate==null ? value:reducer.apply(aggregate,
value);;
stop
end
