@startuml
!pragma layout smetana
start
note right
constructor RocksDbSessionBytesStoreSupplier(final Stringname,
final longretentionPeriod)
end note
:this.name=name;;
:this.retentionPeriod=retentionPeriod;;
end
start
note right
Stringname()
end note
:return name;;
stop
end
start
note right
SessionStore<Bytes,byte[]>get()
end note
:final RocksDBSegmentedBytesStoresegmented=new RocksDBSegmentedBytesStore(name,
metricsScope(),retentionPeriod,segmentIntervalMs(),
new SessionKeySchema());;
:return new RocksDBSessionStore(segmented);;
stop
end
start
note right
StringmetricsScope()
end note
:return "rocksdb-session";;
stop
end
start
note right
longsegmentIntervalMs()
end note
:return Math.max(retentionPeriod/2,60_000L);;
stop
end
start
note right
longretentionPeriod()
end note
:return retentionPeriod;;
stop
end
@enduml

