@startuml
!pragma layout smetana
start
note right
constructor RocksDbSessionBytesStoreSupplier(final String name,
final long retentionPeriod)
end note
:this.name=name;;
:this.retentionPeriod=retentionPeriod;;
end
start
note right
String name()
end note
:return name;;
stop
end
start
note right
SessionStore<Bytes,byte[]> get()
end note
:final RocksDBSegmentedBytesStore segmented=new RocksDBSegmentedBytesStore(name,
metricsScope(),retentionPeriod,segmentIntervalMs(),
new SessionKeySchema());;
:return new RocksDBSessionStore(segmented);;
stop
end
start
note right
String metricsScope()
end note
:return "rocksdb-session";;
stop
end
start
note right
long segmentIntervalMs()
end note
:return Math.max(retentionPeriod/2,60_000L);;
stop
end
start
note right
long retentionPeriod()
end note
:return retentionPeriod;;
stop
end
@enduml

