@startuml
!pragma layout smetana
start
note right
constructor DefaultStreamPartitioner(final Serializer<K> keySerializer)
end note
:this.keySerializer=keySerializer;;
end
start
note right
Integer partition(final String topic,final K key,
final V value,final int numPartitions)
end note
:final byte[] keyBytes=keySerializer.serialize(topic,
key);;
if (keyBytes==null ) then (yes) 
:return null ;;
stop
else (no)
:return BuiltInPartitioner.partitionForKey(keyBytes,
numPartitions);;
stop
endif 
end
@enduml

