cb364a]
@startuml
!pragma layout smetana
start
note right
constructor DefaultStreamPartitioner(final Serializer<K>keySerializer)
end note
:this.keySerializer=keySerializer;
end
start
note right
Integerpartition(final Stringtopic,final Kkey,final Vvalue,final intnumPartitions)
end note
if (keyBytes==null ) then (yes) 
:return null ;;
stop
else (no)
:return BuiltInPartitioner.partitionForKey(keyBytes,numPartitions);;
stop
endif 
end
@enduml

