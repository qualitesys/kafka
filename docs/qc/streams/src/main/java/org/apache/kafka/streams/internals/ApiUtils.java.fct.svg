oints="794.5,983.9766,798.5,993.9766,802.5,983.9766,798.5,987.9766" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="798.5" x2="798.5" y1="901.1211" y2="1063.4297"/><line style="stroke:#181818;stroke-width:1.0;" x1="798.5" x2="511" y1="1063.4297" y2="1063.4297"/><polygon fill="#181818" points="521,1059.4297,511,1063.4297,521,1067.4297,517,1063.4297" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[970a1d24715ba3be7367499ebc8ee288]
@startuml
!pragma layout smetana
start
note right
constructor ApiUtils()
end note
end
start
note right
longvalidateMillisecondDuration(final Durationduration,
final StringmessagePrefix)
end note
:try {if (duration==null ){throw new IllegalArgumentException(messagePrefix+
VALIDATE_MILLISECOND_NULL_SUFFIX);}return duration.toMillis();}catch (final ArithmeticExceptione){throw new IllegalArgumentException(messagePrefix+
VALIDATE_MILLISECOND_OVERFLOW_SUFFIX,e);};
end
start
note right
longvalidateMillisecondInstant(final Instantinstant,
final StringmessagePrefix)
end note
:try {if (instant==null ){throw new IllegalArgumentException(messagePrefix+
VALIDATE_MILLISECOND_NULL_SUFFIX);}return instant.toEpochMilli();}catch (final ArithmeticExceptione){throw new IllegalArgumentException(messagePrefix+
VALIDATE_MILLISECOND_OVERFLOW_SUFFIX,e);};
end
start
note right
StringprepareMillisCheckFailMsgPrefix(final Objectvalue,
final Stringname)
end note
:return format(MILLISECOND_VALIDATION_FAIL_MSG_FRMT,
name,value);;
stop
end
start
note right
void checkSupplier(final Supplier<? >supplier)
end note
if (supplier.get()==supplier.get()) then (yes) 
:throw new IllegalArgumentException(String.format("%s generates single reference."+
" %s#get() must return a new object each time it is called.",
supplierClass,supplierClass));;
stop
endif 
end
if (supplier.get()==supplier.get()) then (yes) 
:throw new IllegalArgumentException(String.format("%s generates single reference."+
" %s#get() must return a new object each time it is called.",
supplierClass,supplierClass));;
stop
endif 
@enduml

