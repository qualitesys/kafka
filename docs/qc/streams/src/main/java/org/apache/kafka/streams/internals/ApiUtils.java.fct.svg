@startuml
!pragma layout smetana
start
note right
constructor ApiUtils()
end note
end
start
note right
longvalidateMillisecondDuration(final Durationduration,final StringmessagePrefix)
end note
if (duration==null ) then (yes) 
endif 
:return duration.toMillis();;
stop
end
start
note right
longvalidateMillisecondInstant(final Instantinstant,final StringmessagePrefix)
end note
if (instant==null ) then (yes) 
endif 
:return instant.toEpochMilli();;
stop
end
start
note right
StringprepareMillisCheckFailMsgPrefix(final Objectvalue,final Stringname)
end note
:return format(MILLISECOND_VALIDATION_FAIL_MSG_FRMT,name,value);;
stop
end
start
note right
void checkSupplier(final Supplier<? >supplier)
end note
if (supplier.get()==supplier.get()) then (yes) 
endif 
end
if (supplier.get()==supplier.get()) then (yes) 
endif 
@enduml

