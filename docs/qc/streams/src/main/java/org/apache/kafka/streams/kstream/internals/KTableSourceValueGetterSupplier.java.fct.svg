@startuml
!pragma layout smetana
start
note right
constructor KTableSourceValueGetterSupplier(final StringstoreName)
end note
end
start
note right
KTableValueGetter<K,V>get()
end note
:return new KTableSourceValueGetter();;
stop
end
start
note right
String[]storeNames()
end note
:return new String[]{storeName};;
stop
end
start
note right
void init(final ProcessorContext<? ,? >context)
end note
end
start
note right
ValueAndTimestamp<V>get(final Kkey)
end note
:return store.get(key);;
stop
end
@enduml

