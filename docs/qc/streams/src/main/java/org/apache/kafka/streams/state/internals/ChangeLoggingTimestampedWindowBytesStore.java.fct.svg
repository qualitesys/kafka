3,178.2344" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="733" x2="733" y1="282.2031" y2="302.2031"/><polygon fill="#181818" points="729,292.2031,733,302.2031,737,292.2031,733,296.2031" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[cf41579dadc4f26079a93758f425533f]
@startuml
!pragma layout smetana
start
note right
constructor ChangeLoggingTimestampedWindowBytesStore(final WindowStore<Bytes,byte[]>bytesStore,final booleanretainDuplicates)
end note
:super (bytesStore,retainDuplicates,WindowKeySchema::toStoreKeyBinary);
end
start
note right
void log(final Byteskey,final byte[]valueAndTimestamp)
end note
if (valueAndTimestamp!=null ) then (yes) 
:context.logChange(name(),key,rawValue(valueAndTimestamp),timestamp(valueAndTimestamp),wrapped().getPosition());
else (no)
:context.logChange(name(),key,null ,context.timestamp(),wrapped().getPosition());
endif 
end
@enduml

