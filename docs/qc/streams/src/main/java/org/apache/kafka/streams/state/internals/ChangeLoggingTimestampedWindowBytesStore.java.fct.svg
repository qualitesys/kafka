@startuml
!pragma layout smetana
start
note right
constructor ChangeLoggingTimestampedWindowBytesStore(final WindowStore<Bytes,byte[]>bytesStore,final booleanretainDuplicates)
end note
:super (bytesStore,retainDuplicates,WindowKeySchema::toStoreKeyBinary);
end
start
note right
void log(final Byteskey,final byte[]valueAndTimestamp)
end note
if (valueAndTimestamp!=null ) then (yes) 
:context.logChange(name(),key,rawValue(valueAndTimestamp),
timestamp(valueAndTimestamp),wrapped().getPosition());
else (no)
:context.logChange(name(),key,null ,context.timestamp(),
wrapped().getPosition());
endif 
end
@enduml

