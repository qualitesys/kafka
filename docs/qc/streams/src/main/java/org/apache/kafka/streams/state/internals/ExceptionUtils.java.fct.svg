@startuml
!pragma layout smetana
start
note right
constructor ExceptionUtils()
end note
end
start
note right
LinkedList<RuntimeException> executeAll(final Runnable ... actions)
end note
:final LinkedList<RuntimeException> suppressed=new LinkedList<>();;
switch (try/catch block)
case (try)
:action.run();;
case (catch (final RuntimeException exception))
:suppressed.add(exception);;
endswitch
:return suppressed;;
stop
end
start
note right
void throwSuppressed(final String message,
final LinkedList<RuntimeException> suppressed)
end note
if (!suppressed.isEmpty()) then (yes) 
:final RuntimeException firstCause=suppressed.pollFirst();;
:final RuntimeException toThrow=new RuntimeException(message,
firstCause);;
:toThrow.addSuppressed(e);;
:throw toThrow;;
stop
endif 
end
@enduml

