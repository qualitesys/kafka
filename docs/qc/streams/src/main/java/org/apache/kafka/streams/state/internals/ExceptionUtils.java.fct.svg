@startuml
!pragma layout smetana
start
note right
constructor ExceptionUtils()
end note
end
start
note right
LinkedList<RuntimeException>executeAll(final Runnable... actions)
end note
:final LinkedList<RuntimeException>suppressed=new LinkedList<>();;
:try ;
:action.run();;
:catch (final RuntimeExceptionexception);
:suppressed.add(exception);;
:return suppressed;;
stop
end
start
note right
void throwSuppressed(final Stringmessage,
final LinkedList<RuntimeException>suppressed)
end note
if (!suppressed.isEmpty()) then (yes) 
:final RuntimeExceptionfirstCause=suppressed.pollFirst();;
:final RuntimeExceptiontoThrow=new RuntimeException(message,
firstCause);;
:toThrow.addSuppressed(e);;
:throw toThrow;;
stop
endif 
end
@enduml

