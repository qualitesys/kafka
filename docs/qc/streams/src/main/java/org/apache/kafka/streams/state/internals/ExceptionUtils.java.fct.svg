@startuml
!pragma layout smetana
start
note right
constructor ExceptionUtils()
end note
end
start
note right
LinkedList<RuntimeException>executeAll(final Runnable... actions)
end note
:action.run();
:suppressed.add(exception);
:return suppressed;;
stop
end
start
note right
void throwSuppressed(final Stringmessage,final LinkedList<RuntimeException>suppressed)
end note
if (!suppressed.isEmpty()) then (yes) 
:toThrow.addSuppressed(e);
endif 
end
@enduml

