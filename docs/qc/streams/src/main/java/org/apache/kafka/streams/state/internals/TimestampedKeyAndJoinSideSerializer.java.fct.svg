@startuml
!pragma layout smetana
start
note right
constructor TimestampedKeyAndJoinSideSerializer(final Serializer<K>keySerializer)
end note
:this.keySerializer=keySerializer;
end
start
note right
void setIfUnset(final SerdeGettergetter)
end note
if (keySerializer==null ) then (yes) 
:keySerializer=(Serializer<K>)getter.keySerde()
.serializer();
endif 
:initNullableSerializer(keySerializer,getter);
end
start
note right
void configure(final Map<String,? >configs,final booleanisKey)
end note
:keySerializer.configure(configs,isKey);
end
start
note right
byte[]serialize(final Stringtopic,final TimestampedKeyAndJoinSide<K>data)
end note
:return ByteBuffer.allocate(timestampBytes.length+
1+keyBytes.length).put(timestampBytes).put(boolByte)
.put(keyBytes).array();;
stop
end
start
note right
void close()
end note
:keySerializer.close();
end
@enduml

