@startuml
!pragma layout smetana
start
note right
constructor TimestampedKeyAndJoinSideSerializer(final Serializer<K> keySerializer)
end note
:this.keySerializer=keySerializer;;
end
start
note right
void setIfUnset(final SerdeGetter getter)
end note
if (keySerializer==null ) then (yes) 
:keySerializer=(Serializer<K> )getter.keySerde()
.serializer();;
endif 
:initNullableSerializer(keySerializer,getter);;
end
start
note right
void configure(final Map<String,?> configs,
final boolean isKey)
end note
:keySerializer.configure(configs,isKey);;
end
start
note right
byte[] serialize(final String topic,final TimestampedKeyAndJoinSide<K> data)
end note
:final byte boolByte=(byte )(data.isLeftSide()? 1:0);;
:final byte[] keyBytes=keySerializer.serialize(topic,
data.getKey());;
:final byte[] timestampBytes=timestampSerializer.serialize(topic,
data.getTimestamp());;
:return ByteBuffer.allocate(timestampBytes.length+
1+keyBytes.length).put(timestampBytes).put(boolByte).put(keyBytes).array();;
stop
end
start
note right
void close()
end note
:keySerializer.close();;
end
@enduml

