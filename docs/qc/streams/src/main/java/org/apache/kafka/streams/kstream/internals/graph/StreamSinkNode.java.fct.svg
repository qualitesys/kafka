" x2="341" y1="711.3828" y2="729.3828"/><line style="stroke:#181818;stroke-width:1.0;" x1="341" x2="520" y1="729.3828" y2="729.3828"/><polygon fill="#181818" points="510,725.3828,520,729.3828,510,733.3828,514,729.3828" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="723" x2="723" y1="711.3828" y2="729.3828"/><line style="stroke:#181818;stroke-width:1.0;" x1="723" x2="544" y1="729.3828" y2="729.3828"/><polygon fill="#181818" points="554,725.3828,544,729.3828,554,733.3828,550,729.3828" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="532" x2="532" y1="609.4453" y2="629.4453"/><polygon fill="#181818" points="528,619.4453,532,629.4453,536,619.4453,532,623.4453" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="532" x2="532" y1="741.3828" y2="761.3828"/><polygon fill="#181818" points="528,751.3828,532,761.3828,536,751.3828,532,755.3828" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[eafa8c761c07ff46dd98c093290a938d]
@startuml
!pragma layout smetana
start
note right
constructor StreamSinkNode(final StringnodeName,
final TopicNameExtractor<K,V>topicNameExtractor,
final ProducedInternal<K,V>producedInternal)
end note
:super (nodeName);
:this.topicNameExtractor=topicNameExtractor;
:this.producedInternal=producedInternal;
end
start
note right
StringtoString()
end note
:return "StreamSinkNode{"+"topicNameExtractor="+topicNameExtractor+",
 producedInternal="+producedInternal+"} "+super .toString();;
stop
end
start
note right
void writeToTopology(final InternalTopologyBuildertopologyBuilder)
end note
if (producedInternal.streamPartitioner()==null &&keySerializer instanceof WindowedSerializer) then (yes) 
:partitioner=(StreamPartitioner<K,V>)new WindowedStreamPartitioner<K,
V>((WindowedSerializer<K>)keySerializer);
else (no)
:partitioner=producedInternal.streamPartitioner();
endif 
if (topicNameExtractor instanceof StaticTopicNameExtractor) then (yes) 
:topologyBuilder.addSink(nodeName(),topicName,
keySerializer,valSerializer,partitioner,parentNames);
else (no)
:topologyBuilder.addSink(nodeName(),topicNameExtractor,
keySerializer,valSerializer,partitioner,parentNames);
endif 
end
@enduml

