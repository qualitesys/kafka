@startuml
!pragma layout smetana
start
note right
constructor StreamSinkNode(final String nodeName,
final TopicNameExtractor<K,V> topicNameExtractor,
final ProducedInternal<K,V> producedInternal)
end note
:super (nodeName);;
:this.topicNameExtractor=topicNameExtractor;;
:this.producedInternal=producedInternal;;
end
start
note right
String toString()
end note
:return "StreamSinkNode{"+"topicNameExtractor="+
topicNameExtractor+", producedInternal="+
producedInternal+"} "+super .toString();;
stop
end
start
note right
void writeToTopology(final InternalTopologyBuilder topologyBuilder)
end note
:final Serializer<K> keySerializer=producedInternal.keySerde()==null ? null :producedInternal.keySerde()
.serializer();;
:final Serializer<V> valSerializer=producedInternal.valueSerde()==null ? null :producedInternal.valueSerde()
.serializer();;
:final String[] parentNames=parentNodeNames();;
:final StreamPartitioner<?superK,?superV> partitioner;;
if (producedInternal.streamPartitioner()==null &&keySerializer instanceof WindowedSerializer ) then (yes) 
:partitioner=(StreamPartitioner<K,V> )new WindowedStreamPartitioner<K ,
V >((WindowedSerializer<K> )keySerializer);;
else (no)
:partitioner=producedInternal.streamPartitioner();;
endif 
if (topicNameExtractor instanceof StaticTopicNameExtractor ) then (yes) 
:final String topicName=((StaticTopicNameExtractor<K,
V> )topicNameExtractor).topicName;;
:topologyBuilder.addSink(nodeName(),topicName,
keySerializer,valSerializer,partitioner,parentNames);;
else (no)
:topologyBuilder.addSink(nodeName(),topicNameExtractor,
keySerializer,valSerializer,partitioner,parentNames);;
endif 
end
@enduml

