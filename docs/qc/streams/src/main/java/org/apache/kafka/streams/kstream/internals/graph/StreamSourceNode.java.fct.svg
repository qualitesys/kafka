.5977,499,1060.5977,503,1056.5977" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="781" x2="781" y1="1038.5977" y2="1056.5977"/><line style="stroke:#181818;stroke-width:1.0;" x1="781" x2="533" y1="1056.5977" y2="1056.5977"/><polygon fill="#181818" points="543,1052.5977,533,1056.5977,543,1060.5977,539,1056.5977" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="521" x2="521" y1="906.1563" y2="928.7227"/><polygon fill="#181818" points="517,918.7227,521,928.7227,525,918.7227,521,922.7227" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="521" x2="521" y1="1068.5977" y2="1088.5977"/><polygon fill="#181818" points="517,1078.5977,521,1088.5977,525,1078.5977,521,1082.5977" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[5b4bd734829be3bb3b59e4e3845951dd]
@startuml
!pragma layout smetana
start
note right
constructor StreamSourceNode(final StringnodeName,final Collection<String>topicNames,final ConsumedInternal<K,V>consumedInternal)
end note
:super (nodeName,topicNames,consumedInternal);
end
start
note right
constructor StreamSourceNode(final StringnodeName,final PatterntopicPattern,final ConsumedInternal<K,V>consumedInternal)
end note
:super (nodeName,topicPattern,consumedInternal);
end
start
note right
void merge(final StreamSourceNode<? ,? >other)
end note
if (resetPolicy!=null &&!resetPolicy.equals(otherResetPolicy)||otherResetPolicy!=null &&!otherResetPolicy.equals(resetPolicy)) then (yes) 
:log.error("Tried to merge source nodes {} and {} which are subscribed to the same topic/pattern, but "+"the offset reset policies do not match",this,other);
:throw new TopologyException("Can't configure different offset reset policies on the same input topic(s)");;
endif 
:other.removeChild(otherChild);
:addChild(otherChild);
end
start
note right
StringtoString()
end note
:return "StreamSourceNode{"+"topicNames="+
(topicNames().isPresent()? topicNames().get():null )+
", topicPattern="+(topicPattern().isPresent()? topicPattern().get():null )+
", consumedInternal="+consumedInternal()+
"} "+super .toString();;
stop
end
start
note right
void writeToTopology(final InternalTopologyBuildertopologyBuilder)
end note
if (topicPattern().isPresent()) then (yes) 
:topologyBuilder.addSource(consumedInternal().offsetResetPolicy(),
nodeName(),consumedInternal().timestampExtractor(),
consumedInternal().keyDeserializer(),consumedInternal().valueDeserializer(),
topicPattern().get());
else (no)
:topologyBuilder.addSource(consumedInternal().offsetResetPolicy(),
nodeName(),consumedInternal().timestampExtractor(),
consumedInternal().keyDeserializer(),consumedInternal().valueDeserializer(),
topicNames().get().toArray(new String[0]));
endif 
end
@enduml

