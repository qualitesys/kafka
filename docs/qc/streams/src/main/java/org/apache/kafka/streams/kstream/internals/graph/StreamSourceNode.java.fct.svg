@startuml
!pragma layout smetana
start
note right
constructor StreamSourceNode(final StringnodeName,
final Collection<String>topicNames,final ConsumedInternal<K,
V>consumedInternal)
end note
:super (nodeName,topicNames,consumedInternal);
end
start
note right
constructor StreamSourceNode(final StringnodeName,
final PatterntopicPattern,final ConsumedInternal<K,
V>consumedInternal)
end note
:super (nodeName,topicPattern,consumedInternal);
end
start
note right
void merge(final StreamSourceNode<? ,? >other)
end note
if (resetPolicy!=null &&!resetPolicy.equals(otherResetPolicy)||otherResetPolicy!=null &&!otherResetPolicy.equals(resetPolicy)) then (yes) 
:log.error("Tried to merge source nodes {} and {} which are subscribed to the same topic/pattern, but "+"the offset reset policies do not match",this,other);
:throw new TopologyException("Can't configure different offset reset policies on the same input topic(s)");;
endif 
:other.removeChild(otherChild);
:addChild(otherChild);
end
start
note right
StringtoString()
end note
:return "StreamSourceNode{"+"topicNames="+(topicNames().isPresent()? topicNames().get():null )+", topicPattern="+(topicPattern().isPresent()? topicPattern().get():null )+", consumedInternal="+consumedInternal()+"} "+super .toString();;
stop
end
start
note right
void writeToTopology(final InternalTopologyBuildertopologyBuilder)
end note
if (topicPattern().isPresent()) then (yes) 
:topologyBuilder.addSource(consumedInternal().offsetResetPolicy(),
nodeName(),consumedInternal().timestampExtractor(),
consumedInternal().keyDeserializer(),consumedInternal().valueDeserializer(),
topicPattern().get());
else (no)
:topologyBuilder.addSource(consumedInternal().offsetResetPolicy(),
nodeName(),consumedInternal().timestampExtractor(),
consumedInternal().keyDeserializer(),consumedInternal().valueDeserializer(),
topicNames().get().toArray(new String[0]));
endif 
end
