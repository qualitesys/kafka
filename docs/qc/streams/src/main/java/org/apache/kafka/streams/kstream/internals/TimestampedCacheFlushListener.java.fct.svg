797" y2="443.1797"/><polygon fill="#181818" points="482.5,433.1797,486.5,443.1797,490.5,433.1797,486.5,437.1797" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[85678136d0275f71897c8634228078e4]
@startuml
!pragma layout smetana
start
note right
constructor TimestampedCacheFlushListener(final ProcessorContext<KOut,
Change<VOut>>context)
end note
:this.context=(InternalProcessorContext<KOut,
Change<VOut>>)context;
:myNode=this.context.currentNode();
end
start
note right
void apply(final Record<KOut,Change<ValueAndTimestamp<VOut>>>record)
end note
:context.setCurrentNode(myNode);
:context.forward(record.withValue(new Change<>(getValueOrNull(record.value().newValue),
getValueOrNull(record.value().oldValue))).withTimestamp(record.value().newValue!=null ? record.value().newValue.timestamp():record.timestamp()));
:context.setCurrentNode(prev);
end
@enduml

