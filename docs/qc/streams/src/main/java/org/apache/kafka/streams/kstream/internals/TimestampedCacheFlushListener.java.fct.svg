-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="308" x2="308" y1="451.1172" y2="471.1172"/><polygon fill="#181818" points="304,461.1172,308,471.1172,312,461.1172,308,465.1172" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[8236df6ff56f371bc9d438837bc86978]
@startuml
!pragma layout smetana
start
note right
constructor TimestampedCacheFlushListener(final ProcessorContext<KOut,
Change<VOut>>context)
end note
:this.context=(InternalProcessorContext<KOut,
Change<VOut>>)context;
:myNode=this.context.currentNode();
end
start
note right
void apply(final Record<KOut,Change<ValueAndTimestamp<VOut>>>record)
end note
:context.setCurrentNode(myNode);
:context.forward(record.withValue(new Change<>(getValueOrNull(record.value().newValue),
getValueOrNull(record.value().oldValue)))
.withTimestamp(record.value().newValue!=null ? record.value()
.newValue.timestamp():record.timestamp()));
:context.setCurrentNode(prev);
end
@enduml

