@startuml
!pragma layout smetana
start
note right
constructor TimestampedCacheFlushListener(final ProcessorContext<KOut,
Change<VOut>>context)
end note
:this.context=(InternalProcessorContext<KOut,
Change<VOut>>)context;;
:myNode=this.context.currentNode();;
end
start
note right
void apply(final Record<KOut,Change<ValueAndTimestamp<VOut>>>record)
end note
:context.setCurrentNode(myNode);;
:try {context.forward(record.withValue(new Change<>(getValueOrNull(record.value().newValue),
getValueOrNull(record.value().oldValue))).withTimestamp(record.value().newValue!=null ? record.value().newValue.timestamp():record.timestamp()));}finally {context.setCurrentNode(prev);};
end
@enduml

