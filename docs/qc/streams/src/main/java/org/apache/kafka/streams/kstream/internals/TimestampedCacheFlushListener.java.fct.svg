:#181818;stroke-width:1.0;"/><!--MD5=[e01a84ba71eab4784481635b84f9272e]
@startuml
!pragma layout smetana
start
note right
constructor TimestampedCacheFlushListener(final ProcessorContext<KOut,
Change<VOut>>context)
end note
:this.context=(InternalProcessorContext<KOut,
Change<VOut>>)context;
:myNode=this.context.currentNode();
end
start
note right
void apply(final Record<KOut,Change<ValueAndTimestamp<VOut>>>record)
end note
:context.setCurrentNode(myNode);
:context.forward(record.withValue(new Change<>(getValueOrNull(record.value().newValue),getValueOrNull(record.value().oldValue))).withTimestamp(record.value().newValue!=null ? record.value().newValue.timestamp():record.timestamp()));
:context.setCurrentNode(prev);
end
@enduml

