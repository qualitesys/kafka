1818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="271.5" x2="271.5" y1="435.9844" y2="455.9844"/><polygon fill="#181818" points="267.5,445.9844,271.5,455.9844,275.5,445.9844,271.5,449.9844" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[de02e2a2ac71a63ddf42de5fe9826b0e]
@startuml
!pragma layout smetana
start
note right
constructor TimestampedCacheFlushListener(final ProcessorContext<KOut,Change<VOut>>context)
end note
:this.context=(InternalProcessorContext<KOut,
Change<VOut>>)context;
:myNode=this.context.currentNode();
end
start
note right
void apply(final Record<KOut,Change<ValueAndTimestamp<VOut>>>record)
end note
:context.setCurrentNode(myNode);
:context.forward(record.withValue(new Change<>(getValueOrNull(record.value()
.newValue),getValueOrNull(record.value().oldValue)))
.withTimestamp(record.value().newValue!=null ? record.value()
.newValue.timestamp():record.timestamp()));
:context.setCurrentNode(prev);
end
@enduml

