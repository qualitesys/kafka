;"/><line style="stroke:#181818;stroke-width:1.0;" x1="234.5" x2="234.5" y1="852.5781" y2="872.5781"/><polygon fill="#181818" points="230.5,862.5781,234.5,872.5781,238.5,862.5781,234.5,866.5781" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[a3792d838d7d36da2347efa580d6e496]
@startuml
!pragma layout smetana
start
note right
constructor WrappedSessionStoreIterator(final KeyValueIterator<Bytes,byte[]>bytesIterator)
end note
:this(bytesIterator,SessionKeySchema::from);
end
start
note right
constructor WrappedSessionStoreIterator(final KeyValueIterator<Bytes,byte[]>bytesIterator,final Function<Bytes,Windowed<Bytes>>windowConstructor)
end note
:this.bytesIterator=bytesIterator;
:this.windowConstructor=windowConstructor;
end
start
note right
void close()
end note
:bytesIterator.close();
end
start
note right
Windowed<Bytes>peekNextKey()
end note
:return windowConstructor.apply(bytesIterator.peekNextKey());;
stop
end
start
note right
booleanhasNext()
end note
:return bytesIterator.hasNext();;
stop
end
start
note right
KeyValue<Windowed<Bytes>,byte[]>next()
end note
:return KeyValue.pair(windowConstructor.apply(next.key),next.value);;
stop
end
@enduml

