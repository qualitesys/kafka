a6294cb78]
@startuml
!pragma layout smetana
start
note right
constructor WrappedSessionStoreIterator(final KeyValueIterator<Bytes,byte[]>bytesIterator)
end note
:this(bytesIterator,SessionKeySchema::from);
end
start
note right
constructor WrappedSessionStoreIterator(final KeyValueIterator<Bytes,byte[]>bytesIterator,final Function<Bytes,Windowed<Bytes>>windowConstructor)
end note
:this.bytesIterator=bytesIterator;
:this.windowConstructor=windowConstructor;
end
start
note right
void close()
end note
:bytesIterator.close();
end
start
note right
Windowed<Bytes>peekNextKey()
end note
:return windowConstructor.apply(bytesIterator.peekNextKey());;
stop
end
start
note right
booleanhasNext()
end note
:return bytesIterator.hasNext();;
stop
end
start
note right
KeyValue<Windowed<Bytes>,byte[]>next()
end note
:return KeyValue.pair(windowConstructor.apply(next.key),
next.value);;
stop
end
@enduml

