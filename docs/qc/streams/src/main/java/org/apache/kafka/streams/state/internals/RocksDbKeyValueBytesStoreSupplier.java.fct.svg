,550.4063,433,560.4063,437,550.4063,433,554.4063" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="433" x2="433" y1="594.375" y2="614.375"/><polygon fill="#181818" points="429,604.375,433,614.375,437,604.375,433,608.375" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[a2e504dd3d5beb4a9702ad115632317f]
@startuml
!pragma layout smetana
start
note right
constructor RocksDbKeyValueBytesStoreSupplier(final Stringname,final booleanreturnTimestampedStore)
end note
:this.name=name;
:this.returnTimestampedStore=returnTimestampedStore;
end
start
note right
Stringname()
end note
:return name;;
stop
end
start
note right
KeyValueStore<Bytes,byte[]>get()
end note
:return returnTimestampedStore? new RocksDBTimestampedStore(name,metricsScope()):new RocksDBStore(name,metricsScope());;
stop
end
start
note right
StringmetricsScope()
end note
:return "rocksdb";;
stop
end
@enduml

