@startuml
!pragma layout smetana
start
note right
constructor RocksDbKeyValueBytesStoreSupplier(final Stringname,final booleanreturnTimestampedStore)
end note
:this.name=name;
:this.returnTimestampedStore=returnTimestampedStore;
end
start
note right
Stringname()
end note
:return name;;
stop
end
start
note right
KeyValueStore<Bytes,byte[]>get()
end note
:return returnTimestampedStore? new RocksDBTimestampedStore(name,
metricsScope()):new RocksDBStore(name,metricsScope());;
stop
end
start
note right
StringmetricsScope()
end note
:return "rocksdb";;
stop
end
@enduml

