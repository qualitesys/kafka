/><line style="stroke:#181818;stroke-width:1.0;" x1="334.5" x2="334.5" y1="870.7109" y2="890.7109"/><polygon fill="#181818" points="330.5,880.7109,334.5,890.7109,338.5,880.7109,334.5,884.7109" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="334.5" x2="334.5" y1="685.6914" y2="715.8242"/><polygon fill="#181818" points="330.5,705.8242,334.5,715.8242,338.5,705.8242,334.5,709.8242" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="334.5" x2="334.5" y1="924.6797" y2="944.6797"/><polygon fill="#181818" points="330.5,934.6797,334.5,944.6797,338.5,934.6797,334.5,938.6797" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[14da3634587312d2ecdcabb736defc14]
@startuml
!pragma layout smetana
start
note right
constructor KeyValueStoreBuilder(final KeyValueBytesStoreSupplierstoreSupplier,
final Serde<K>keySerde,final Serde<V>valueSerde,
final Timetime)
end note
end
start
note right
KeyValueStore<K,V>build()
end note
:return new MeteredKeyValueStore<>(maybeWrapCaching(maybeWrapLogging(storeSupplier.get())),
storeSupplier.metricsScope(),time,keySerde,
valueSerde);;
stop
end
start
note right
KeyValueStore<Bytes,byte[]>maybeWrapCaching(final KeyValueStore<Bytes,
byte[]>inner)
end note
if (!enableCaching) then (yes) 
:return inner;;
stop
endif 
:return new CachingKeyValueStore(inner,false);;
stop
end
start
note right
KeyValueStore<Bytes,byte[]>maybeWrapLogging(final KeyValueStore<Bytes,
byte[]>inner)
end note
if (!enableLogging) then (yes) 
:return inner;;
stop
endif 
:return new ChangeLoggingKeyValueBytesStore(inner);;
stop
end
@enduml

