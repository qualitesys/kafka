@startuml
!pragma layout smetana
start
note right
constructor KeyValueStoreBuilder(final KeyValueBytesStoreSupplierstoreSupplier,final Serde<K>keySerde,final Serde<V>valueSerde,final Timetime)
end note
:super (storeSupplier.name(),keySerde,valueSerde,time);
:Objects.requireNonNull(storeSupplier,"storeSupplier can't be null");
:Objects.requireNonNull(storeSupplier.metricsScope(),"storeSupplier's metricsScope can't be null");
:this.storeSupplier=storeSupplier;
end
start
note right
KeyValueStore<K,V>build()
end note
:return new MeteredKeyValueStore<>(maybeWrapCaching(maybeWrapLogging(storeSupplier.get())),storeSupplier.metricsScope(),time,keySerde,valueSerde);;
stop
end
start
note right
KeyValueStore<Bytes,byte[]>maybeWrapCaching(final KeyValueStore<Bytes,byte[]>inner)
end note
if (!enableCaching) then (yes) 
:return inner;;
stop
endif 
:return new CachingKeyValueStore(inner,false);;
stop
end
start
note right
KeyValueStore<Bytes,byte[]>maybeWrapLogging(final KeyValueStore<Bytes,byte[]>inner)
end note
if (!enableLogging) then (yes) 
:return inner;;
stop
endif 
:return new ChangeLoggingKeyValueBytesStore(inner);;
stop
end
@enduml

