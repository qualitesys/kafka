.0391,338.5,998.0391,334.5,1002.0391" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="389" x2="401" y1="971.6367" y2="971.6367"/><polygon fill="#181818" points="397,1040.5234,401,1050.5234,405,1040.5234,401,1044.5234" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="401" x2="401" y1="971.6367" y2="1114.5234"/><line style="stroke:#181818;stroke-width:1.0;" x1="401" x2="334.5" y1="1114.5234" y2="1114.5234"/><line style="stroke:#181818;stroke-width:1.0;" x1="334.5" x2="334.5" y1="1114.5234" y2="1134.5234"/><polygon fill="#181818" points="330.5,1124.5234,334.5,1134.5234,338.5,1124.5234,334.5,1128.5234" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="334.5" x2="334.5" y1="929.5039" y2="959.6367"/><polygon fill="#181818" points="330.5,949.6367,334.5,959.6367,338.5,949.6367,334.5,953.6367" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="334.5" x2="334.5" y1="1168.4922" y2="1188.4922"/><polygon fill="#181818" points="330.5,1178.4922,334.5,1188.4922,338.5,1178.4922,334.5,1182.4922" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[168657eace2423ac7bea2d79cdf51c5b]
@startuml
!pragma layout smetana
start
note right
constructor KeyValueStoreBuilder(final KeyValueBytesStoreSupplier storeSupplier,
final Serde<K> keySerde,final Serde<V> valueSerde,
final Time time)
end note
:super (storeSupplier.name(),keySerde,valueSerde,
time);;
:Objects.requireNonNull(storeSupplier,"storeSupplier can't be null");;
:Objects.requireNonNull(storeSupplier.metricsScope(),
"storeSupplier's metricsScope can't be null");;
:this.storeSupplier=storeSupplier;;
end
start
note right
KeyValueStore<K,V> build()
end note
:return new MeteredKeyValueStore<>(maybeWrapCaching(maybeWrapLogging(storeSupplier.get())),
storeSupplier.metricsScope(),time,keySerde,
valueSerde);;
stop
end
start
note right
KeyValueStore<Bytes,byte[]> maybeWrapCaching(final KeyValueStore<Bytes,
byte[]> inner)
end note
if (!enableCaching) then (yes) 
:return inner;;
stop
endif 
:return new CachingKeyValueStore(inner,false);;
stop
end
start
note right
KeyValueStore<Bytes,byte[]> maybeWrapLogging(final KeyValueStore<Bytes,
byte[]> inner)
end note
if (!enableLogging) then (yes) 
:return inner;;
stop
endif 
:return new ChangeLoggingKeyValueBytesStore(inner);;
stop
end
@enduml

