14" x2="514" y1="1086.5859" y2="1106.5859"/><polygon fill="#181818" points="510,1096.5859,514,1106.5859,518,1096.5859,514,1100.5859" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="514" x2="514" y1="901.5664" y2="931.6992"/><polygon fill="#181818" points="510,921.6992,514,931.6992,518,921.6992,514,925.6992" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="514" x2="514" y1="1140.5547" y2="1160.5547"/><polygon fill="#181818" points="510,1150.5547,514,1160.5547,518,1150.5547,514,1154.5547" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[d3393fa9ac7f2785e6e2831a6ae90642]
@startuml
!pragma layout smetana
start
note right
constructor KeyValueStoreBuilder(final KeyValueBytesStoreSupplierstoreSupplier,
final Serde<K>keySerde,final Serde<V>valueSerde,
final Timetime)
end note
:super (storeSupplier.name(),keySerde,valueSerde,
time);
:Objects.requireNonNull(storeSupplier,"storeSupplier can't be null");
:Objects.requireNonNull(storeSupplier.metricsScope(),
"storeSupplier's metricsScope can't be null");
:this.storeSupplier=storeSupplier;
end
start
note right
KeyValueStore<K,V>build()
end note
:return new MeteredKeyValueStore<>(maybeWrapCaching(maybeWrapLogging(storeSupplier.get())),storeSupplier.metricsScope(),time,keySerde,valueSerde);;
stop
end
start
note right
KeyValueStore<Bytes,byte[]>maybeWrapCaching(final KeyValueStore<Bytes,
byte[]>inner)
end note
if (!enableCaching) then (yes) 
:return inner;;
stop
endif 
:return new CachingKeyValueStore(inner,false);;
stop
end
start
note right
KeyValueStore<Bytes,byte[]>maybeWrapLogging(final KeyValueStore<Bytes,
byte[]>inner)
end note
if (!enableLogging) then (yes) 
:return inner;;
stop
endif 
:return new ChangeLoggingKeyValueBytesStore(inner);;
stop
end
@enduml

