@startuml
!pragma layout smetana
start
note right
void applyChecksAndUpdatePosition(final ConsumerRecord<byte[],
byte[]>record,final booleanconsistencyEnabled,
final Positionposition)
end note
if (!consistencyEnabled) then (yes) 
:return ;;
stop
endif 
if (versionHeader==null ) then (yes) 
:return ;;
stop
else (no)
:switch (versionHeader.value()[0]){case 0:final HeadervectorHeader=record.headers().lastHeader(CHANGELOG_POSITION_HEADER_KEY);
:if (vectorHeader==null ){throw new StreamsException("This should not happen. Consistency is enabled but the changelog "+
"contains records without consistency information.");}position.merge(PositionSerde.deserialize(ByteBuffer.wrap(vectorHeader.value())));break ;default :log.warn("Changelog records have been encoded using a larger version than this server understands."+"Please upgrade your server.");};
endif 
end
@enduml

