@startuml
!pragma layout smetana
start
note right
void applyChecksAndUpdatePosition(final ConsumerRecord<byte[],
byte[]>record,final booleanconsistencyEnabled,
final Positionposition)
end note
if (!consistencyEnabled) then (yes) 
:return ;;
stop
endif 
:final HeaderversionHeader=record.headers()
.lastHeader(ChangelogRecordDeserializationHelper.CHANGELOG_VERSION_HEADER_KEY);;
if (versionHeader==null ) then (yes) 
:return ;;
stop
else (no)
switch (switch versionHeader.value()[0])
case (case 0:) 
:final HeadervectorHeader=record.headers()
.lastHeader(CHANGELOG_POSITION_HEADER_KEY);;
if (vectorHeader==null ) then (yes) 
:throw new StreamsException("This should not happen. Consistency is enabled but the changelog "+
"contains records without consistency information.");;
stop
endif 
:position.merge(PositionSerde.deserialize(ByteBuffer.wrap(vectorHeader.value())));;
:break ;;
case (default :) 
:log.warn("Changelog records have been encoded using a larger version than this server understands."+
"Please upgrade your server.");;
endswitch
endif 
end
@enduml

