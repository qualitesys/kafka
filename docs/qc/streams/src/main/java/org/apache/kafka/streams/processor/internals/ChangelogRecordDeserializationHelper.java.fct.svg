@startuml
!pragma layout smetana
start
note right
void applyChecksAndUpdatePosition(final ConsumerRecord<byte[],byte[]>record,final booleanconsistencyEnabled,final Positionposition)
end note
if (!consistencyEnabled) then (yes) 
:return ;;
stop
endif 
if (versionHeader==null ) then (yes) 
:return ;;
stop
else (no)
if (vectorHeader==null ) then (yes) 
endif 
:position.merge(PositionSerde.deserialize(ByteBuffer.wrap(vectorHeader.value())));
:log.warn("Changelog records have been encoded using a larger version than this server understands."+"Please upgrade your server.");
endif 
end
@enduml

