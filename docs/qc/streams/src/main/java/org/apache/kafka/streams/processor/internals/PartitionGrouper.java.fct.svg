2,841.9727,266,831.9727,262,835.9727" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="262" x2="262" y1="719.6016" y2="739.6016"/><polygon fill="#181818" points="258,729.6016,262,739.6016,266,729.6016,262,733.6016" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="262" x2="262" y1="865.9727" y2="885.9727"/><polygon fill="#181818" points="258,875.9727,262,885.9727,266,875.9727,262,879.9727" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="262" x2="262" y1="919.9414" y2="939.9414"/><polygon fill="#181818" points="258,929.9414,262,939.9414,266,929.9414,262,933.9414" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[17cbd2348ab13c719a2b45d2ce9b9729]
@startuml
!pragma layout smetana
start
note right
Map<TaskId,Set<TopicPartition>>partitionGroups(final Map<Subtopology,
Set<String>>topicGroups,final Clustermetadata)
end note
:partitionId++;
if (partitionId<partitions.size()) then (yes) 
:group.add(new TopicPartition(topic,partitionId));
endif 
:groups.put(new TaskId(subtopology.nodeGroupId,
partitionId,subtopology.namedTopology),Collections.unmodifiableSet(group));
:return Collections.unmodifiableMap(groups);;
stop
end
start
note right
intmaxNumPartitions(final Clustermetadata,
final Set<String>topics)
end note
if (partitions.isEmpty()) then (yes) 
:log.error("Empty partitions for topic {}",
topic);
:throw new RuntimeException("Empty partitions for topic "+topic);;
endif 
if (numPartitions>maxNumPartitions) then (yes) 
:maxNumPartitions=numPartitions;
endif 
:return maxNumPartitions;;
stop
end
@enduml

