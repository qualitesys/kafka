;" x1="372" x2="391" y1="1220.7734" y2="1220.7734"/><polygon fill="#181818" points="387,1264.1602,391,1274.1602,395,1264.1602,391,1268.1602" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="391" x2="391" y1="1220.7734" y2="1323.1445"/><line style="stroke:#181818;stroke-width:1.0;" x1="391" x2="276" y1="1323.1445" y2="1323.1445"/><polygon fill="#181818" points="286,1319.1445,276,1323.1445,286,1327.1445,282,1323.1445" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="264" x2="264" y1="1291.1445" y2="1311.1445"/><polygon fill="#181818" points="260,1301.1445,264,1311.1445,268,1301.1445,264,1305.1445" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="264" x2="264" y1="1188.7734" y2="1208.7734"/><polygon fill="#181818" points="260,1198.7734,264,1208.7734,268,1198.7734,264,1202.7734" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="264" x2="264" y1="1335.1445" y2="1355.1445"/><polygon fill="#181818" points="260,1345.1445,264,1355.1445,268,1345.1445,264,1349.1445" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="264" x2="264" y1="1389.1133" y2="1409.1133"/><polygon fill="#181818" points="260,1399.1133,264,1409.1133,268,1399.1133,264,1403.1133" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[fbeca1f8e44174b26df03ec01ef12102]
@startuml
!pragma layout smetana
start
note right
Map<TaskId,Set<TopicPartition>> partitionGroups(final Map<Subtopology,
Set<String>> topicGroups,final Cluster metadata)
end note
:final Map<TaskId,Set<TopicPartition>> groups=new HashMap<>();;
:final Subtopology subtopology=entry.getKey();;
:final Set<String> topicGroup=entry.getValue();;
:final int maxNumPartitions=maxNumPartitions(metadata,
topicGroup);;
:final Set<TopicPartition> group=new HashSet<>(topicGroup.size());;
:final List<PartitionInfo> partitions=metadata.partitionsForTopic(topic);;
if (partitionId<partitions.size()) then (yes) 
:group.add(new TopicPartition(topic,partitionId));;
endif 
:groups.put(new TaskId(subtopology.nodeGroupId,
partitionId,subtopology.namedTopology),Collections.unmodifiableSet(group));;
:return Collections.unmodifiableMap(groups);;
stop
end
start
note right
int maxNumPartitions(final Cluster metadata,
final Set<String> topics)
end note
:int maxNumPartitions=0;;
:final List<PartitionInfo> partitions=metadata.partitionsForTopic(topic);;
if (partitions.isEmpty()) then (yes) 
:log.error("Empty partitions for topic {}",
topic);;
:throw new RuntimeException("Empty partitions for topic "+
topic);;
stop
endif 
:final int numPartitions=partitions.size();;
if (numPartitions>maxNumPartitions) then (yes) 
:maxNumPartitions=numPartitions;;
endif 
:return maxNumPartitions;;
stop
end
@enduml

