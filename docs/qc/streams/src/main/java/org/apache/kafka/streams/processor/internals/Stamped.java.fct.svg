@startuml
!pragma layout smetana
start
note right
constructor Stamped(final Vvalue,final longtimestamp)
end note
end
start
note right
intcompareTo(final Objectother)
end note
if (timestamp<otherTimestamp) then (yes) 
:return -1;;
stop
endif 
:return 0;;
stop
end
start
note right
booleanequals(final Objectother)
end note
if (other==null ||getClass()!=other.getClass()) then (yes) 
:return false;;
stop
endif 
:return timestamp==otherTimestamp;;
stop
end
start
note right
inthashCode()
end note
:return Objects.hash(timestamp);;
stop
end
@enduml

