"/><line style="stroke:#181818;stroke-width:1.0;" x1="578.5" x2="578.5" y1="848.6016" y2="871.168"/><polygon fill="#181818" points="574.5,861.168,578.5,871.168,582.5,861.168,578.5,865.168" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="578.5" x2="578.5" y1="1080.0234" y2="1100.0234"/><polygon fill="#181818" points="574.5,1090.0234,578.5,1100.0234,582.5,1090.0234,578.5,1094.0234" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[994576ed6838850a9c7526b290eb3806]
@startuml
!pragma layout smetana
start
note right
constructor ListValueStoreBuilder(final KeyValueBytesStoreSupplierstoreSupplier,final Serde<K>keySerde,final Serde<V>valueSerde,final Timetime)
end note
:super (storeSupplier.name(),keySerde,valueSerde,
time);
:Objects.requireNonNull(storeSupplier,"storeSupplier can't be null");
:Objects.requireNonNull(storeSupplier.metricsScope(),
"storeSupplier's metricsScope can't be null");
:this.storeSupplier=storeSupplier;
end
start
note right
KeyValueStore<K,V>build()
end note
:return new MeteredKeyValueStore<>(maybeWrapCaching(maybeWrapLogging(new ListValueStore(storeSupplier.get()))),storeSupplier.metricsScope(),time,keySerde,valueSerde);;
stop
end
start
note right
KeyValueStore<Bytes,byte[]>maybeWrapCaching(final KeyValueStore<Bytes,byte[]>inner)
end note
if (!enableCaching) then (yes) 
:return inner;;
stop
endif 
:return new CachingKeyValueStore(inner,false);;
stop
end
start
note right
KeyValueStore<Bytes,byte[]>maybeWrapLogging(final KeyValueStore<Bytes,byte[]>inner)
end note
if (!enableLogging) then (yes) 
:return inner;;
stop
endif 
:return new ChangeLoggingListValueBytesStore(inner);;
stop
end
@enduml

