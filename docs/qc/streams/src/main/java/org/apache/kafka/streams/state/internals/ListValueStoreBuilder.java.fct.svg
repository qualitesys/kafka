.0;" x1="465.5" x2="465.5" y1="971.6367" y2="1114.5234"/><line style="stroke:#181818;stroke-width:1.0;" x1="465.5" x2="399" y1="1114.5234" y2="1114.5234"/><line style="stroke:#181818;stroke-width:1.0;" x1="399" x2="399" y1="1114.5234" y2="1134.5234"/><polygon fill="#181818" points="395,1124.5234,399,1134.5234,403,1124.5234,399,1128.5234" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="399" x2="399" y1="929.5039" y2="959.6367"/><polygon fill="#181818" points="395,949.6367,399,959.6367,403,949.6367,399,953.6367" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="399" x2="399" y1="1168.4922" y2="1188.4922"/><polygon fill="#181818" points="395,1178.4922,399,1188.4922,403,1178.4922,399,1182.4922" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[483dc57e28f9985d9cd15202c2c0c66a]
@startuml
!pragma layout smetana
start
note right
constructor ListValueStoreBuilder(final KeyValueBytesStoreSupplierstoreSupplier,
final Serde<K>keySerde,final Serde<V>valueSerde,
final Timetime)
end note
:super (storeSupplier.name(),keySerde,valueSerde,
time);
:Objects.requireNonNull(storeSupplier,"storeSupplier can't be null");
:Objects.requireNonNull(storeSupplier.metricsScope(),
"storeSupplier's metricsScope can't be null");
:this.storeSupplier=storeSupplier;
end
start
note right
KeyValueStore<K,V>build()
end note
:return new MeteredKeyValueStore<>(maybeWrapCaching(maybeWrapLogging(new ListValueStore(storeSupplier.get()))),
storeSupplier.metricsScope(),time,keySerde,
valueSerde);;
stop
end
start
note right
KeyValueStore<Bytes,byte[]>maybeWrapCaching(final KeyValueStore<Bytes,
byte[]>inner)
end note
if (!enableCaching) then (yes) 
:return inner;;
stop
endif 
:return new CachingKeyValueStore(inner,false);;
stop
end
start
note right
KeyValueStore<Bytes,byte[]>maybeWrapLogging(final KeyValueStore<Bytes,
byte[]>inner)
end note
if (!enableLogging) then (yes) 
:return inner;;
stop
endif 
:return new ChangeLoggingListValueBytesStore(inner);;
stop
end
@enduml

