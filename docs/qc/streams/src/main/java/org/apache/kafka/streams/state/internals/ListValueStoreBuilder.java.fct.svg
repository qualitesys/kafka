 x2="399" y1="685.6914" y2="715.8242"/><polygon fill="#181818" points="395,705.8242,399,715.8242,403,705.8242,399,709.8242" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="399" x2="399" y1="924.6797" y2="944.6797"/><polygon fill="#181818" points="395,934.6797,399,944.6797,403,934.6797,399,938.6797" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[2003507fc5466c55976693ce6579132a]
@startuml
!pragma layout smetana
start
note right
constructor ListValueStoreBuilder(final KeyValueBytesStoreSupplierstoreSupplier,
final Serde<K>keySerde,final Serde<V>valueSerde,
final Timetime)
end note
end
start
note right
KeyValueStore<K,V>build()
end note
:return new MeteredKeyValueStore<>(maybeWrapCaching(maybeWrapLogging(new ListValueStore(storeSupplier.get()))),
storeSupplier.metricsScope(),time,keySerde,
valueSerde);;
stop
end
start
note right
KeyValueStore<Bytes,byte[]>maybeWrapCaching(final KeyValueStore<Bytes,
byte[]>inner)
end note
if (!enableCaching) then (yes) 
:return inner;;
stop
endif 
:return new CachingKeyValueStore(inner,false);;
stop
end
start
note right
KeyValueStore<Bytes,byte[]>maybeWrapLogging(final KeyValueStore<Bytes,
byte[]>inner)
end note
if (!enableLogging) then (yes) 
:return inner;;
stop
endif 
:return new ChangeLoggingListValueBytesStore(inner);;
stop
end
@enduml

