@startuml
!pragma layout smetana
start
note right
constructor KStreamGlobalKTableJoin(final KTableValueGetterSupplier<K2,
V2>valueGetterSupplier,final ValueJoinerWithKey<? super K1,
? super V1,? super V2,?  extends VOut>joiner,
final KeyValueMapper<? super K1,? super V1,
?  extends K2>mapper,final booleanleftJoin)
end note
:this.valueGetterSupplier=valueGetterSupplier;
:this.joiner=joiner;
:this.mapper=mapper;
:this.leftJoin=leftJoin;
end
start
note right
Processor<K1,V1,K1,VOut>get()
end note
:return new KStreamKTableJoinProcessor<>(valueGetterSupplier.get(),
mapper,joiner,leftJoin);;
stop
end
@enduml

