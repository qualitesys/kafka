@startuml
!pragma layout smetana
start
note right
constructor KStreamGlobalKTableJoin(final KTableValueGetterSupplier<K2,
V2> valueGetterSupplier,final ValueJoinerWithKey<?superK1,
?superV1,?superV2,?extendsVOut> joiner,final KeyValueMapper<?superK1,
?superV1,?extendsK2> mapper,final boolean leftJoin)
end note
:this.valueGetterSupplier=valueGetterSupplier;;
:this.joiner=joiner;;
:this.mapper=mapper;;
:this.leftJoin=leftJoin;;
end
start
note right
Processor<K1,V1,K1,VOut> get()
end note
:return new KStreamKTableJoinProcessor<>(valueGetterSupplier.get(),
mapper,joiner,leftJoin);;
stop
end
@enduml

