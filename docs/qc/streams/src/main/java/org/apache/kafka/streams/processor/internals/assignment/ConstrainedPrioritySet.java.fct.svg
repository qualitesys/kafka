@startuml
!pragma layout smetana
start
note right
constructor ConstrainedPrioritySet(final BiFunction<UUID,
TaskId,Boolean>constraint,final Function<UUID,
Double>weight)
end note
:this.constraint=constraint;;
:clientsByTaskLoad=new PriorityQueue<>(Comparator.comparing(weight)
.thenComparing(clientId->clientId));;
end
start
note right
UUIDpoll(final TaskIdtask,final Function<UUID,
Boolean>extraConstraint)
end note
:while (!clientsByTaskLoad.isEmpty()){final UUIDcandidateClient=pollNextClient();if (constraint.apply(candidateClient,
task)&&extraConstraint.apply(candidateClient)){offerAll(invalidPolledClients);return candidateClient;}else {invalidPolledClients.add(candidateClient);}};
:offerAll(invalidPolledClients);;
:return null ;;
stop
end
start
note right
UUIDpoll(final TaskIdtask)
end note
:return poll(task,client->true);;
stop
end
start
note right
void offerAll(final Collection<UUID>clients)
end note
:offer(client);;
end
start
note right
void offer(final UUIDclient)
end note
if (uniqueClients.contains(client)) then (yes) 
:clientsByTaskLoad.remove(client);;
else (no)
:uniqueClients.add(client);;
endif 
:clientsByTaskLoad.offer(client);;
end
start
note right
UUIDpollNextClient()
end note
:uniqueClients.remove(client);;
:return client;;
