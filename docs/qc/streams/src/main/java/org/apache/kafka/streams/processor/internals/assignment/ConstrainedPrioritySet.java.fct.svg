 x1="168" x2="261.5" y1="857.3711" y2="857.3711"/><polygon fill="#181818" points="251.5,853.3711,261.5,857.3711,251.5,861.3711,255.5,857.3711" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="369" x2="379" y1="817.3711" y2="817.3711"/><polygon fill="#181818" points="375,827.3711,379,837.3711,383,827.3711,379,831.3711" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="379" x2="379" y1="817.3711" y2="857.3711"/><line style="stroke:#181818;stroke-width:1.0;" x1="379" x2="285.5" y1="857.3711" y2="857.3711"/><polygon fill="#181818" points="295.5,853.3711,285.5,857.3711,295.5,861.3711,291.5,857.3711" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="273.5" x2="273.5" y1="782.8047" y2="805.3711"/><polygon fill="#181818" points="269.5,795.3711,273.5,805.3711,277.5,795.3711,273.5,799.3711" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="273.5" x2="273.5" y1="869.3711" y2="889.3711"/><polygon fill="#181818" points="269.5,879.3711,273.5,889.3711,277.5,879.3711,273.5,883.3711" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="273.5" x2="273.5" y1="941.9375" y2="964.5039"/><polygon fill="#181818" points="269.5,954.5039,273.5,964.5039,277.5,954.5039,273.5,958.5039" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="273.5" x2="273.5" y1="998.4727" y2="1018.4727"/><polygon fill="#181818" points="269.5,1008.4727,273.5,1018.4727,277.5,1008.4727,273.5,1012.4727" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[4c662a6123227aa27fc777a2efcd4280]
@startuml
!pragma layout smetana
start
note right
constructor ConstrainedPrioritySet(final BiFunction<UUID,
TaskId,Boolean>constraint,final Function<UUID,
Double>weight)
end note
end
start
note right
UUIDpoll(final TaskIdtask,final Function<UUID,
Boolean>extraConstraint)
end note
while (!clientsByTaskLoad.isEmpty())
if (constraint.apply(candidateClient,task)&&extraConstraint.apply(candidateClient)) then (yes) 
:return candidateClient;;
stop
else (no)
endif 
endwhile
:return null ;;
stop
end
start
note right
UUIDpoll(final TaskIdtask)
end note
:return poll(task,client->true);;
stop
end
start
note right
void offerAll(final Collection<UUID>clients)
end note
end
start
note right
void offer(final UUIDclient)
end note
if (uniqueClients.contains(client)) then (yes) 
else (no)
endif 
end
start
note right
UUIDpollNextClient()
end note
:return client;;
stop
end
@enduml

