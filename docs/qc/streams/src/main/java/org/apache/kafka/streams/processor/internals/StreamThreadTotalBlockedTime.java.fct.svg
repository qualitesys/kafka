288.5,241.3047" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="288.5" x2="288.5" y1="307.4375" y2="337.5703"/><polygon fill="#181818" points="284.5,327.5703,288.5,337.5703,292.5,327.5703,288.5,331.5703" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="288.5" x2="288.5" y1="385.5078" y2="405.5078"/><polygon fill="#181818" points="284.5,395.5078,288.5,405.5078,292.5,395.5078,288.5,399.5078" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="288.5" x2="288.5" y1="490.0742" y2="512.6406"/><polygon fill="#181818" points="284.5,502.6406,288.5,512.6406,292.5,502.6406,288.5,506.6406" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="288.5" x2="288.5" y1="630.4219" y2="650.4219"/><polygon fill="#181818" points="284.5,640.4219,288.5,650.4219,292.5,640.4219,288.5,644.4219" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[2032c856cbc7b54b93ac95ae35baa557]
@startuml
!pragma layout smetana
start
note right
constructor StreamThreadTotalBlockedTime(final Consumer<?,
?> consumer,final Consumer<?,?> restoreConsumer,
final Supplier<Double> producerTotalBlockedTime)
end note
:this.consumer=consumer;;
:this.restoreConsumer=restoreConsumer;;
:this.producerTotalBlockedTime=producerTotalBlockedTime;;
end
start
note right
double metricValue(final Map<MetricName,?extendsMetric> metrics,
final String name)
end note
:return metrics.keySet().stream().filter(n->n.name()
.equals(name)).findFirst().map(n->(Double )metrics.get(n).metricValue()).orElse(0.0);;
stop
end
start
note right
double compute()
end note
:return metricValue(consumer.metrics(),"io-wait-time-ns-total")+
metricValue(consumer.metrics(),"io-time-ns-total")+
metricValue(consumer.metrics(),"committed-time-ns-total")+
metricValue(consumer.metrics(),"commit-sync-time-ns-total")+
metricValue(restoreConsumer.metrics(),"io-wait-time-ns-total")+
metricValue(restoreConsumer.metrics(),"io-time-ns-total")+
producerTotalBlockedTime.get();;
stop
end
@enduml

