734" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="446" x2="446" y1="571.0547" y2="591.0547"/><polygon fill="#181818" points="442,581.0547,446,591.0547,450,581.0547,446,585.0547" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[f64310b44c016670525d0956f232d795]
@startuml
!pragma layout smetana
start
note right
constructor StreamThreadTotalBlockedTime(final Consumer<? ,? >consumer,final Consumer<? ,? >restoreConsumer,final Supplier<Double>producerTotalBlockedTime)
end note
:this.consumer=consumer;
:this.restoreConsumer=restoreConsumer;
:this.producerTotalBlockedTime=producerTotalBlockedTime;
end
start
note right
doublemetricValue(final Map<MetricName,?  extends Metric>metrics,final Stringname)
end note
:return metrics.keySet().stream().filter(n->n.name().equals(name)).findFirst().map(n->(Double)metrics.get(n).metricValue()).orElse(0.0);;
stop
end
start
note right
doublecompute()
end note
:return metricValue(consumer.metrics(),"io-wait-time-ns-total")+
metricValue(consumer.metrics(),"io-time-ns-total")+
metricValue(consumer.metrics(),"committed-time-ns-total")+
metricValue(consumer.metrics(),"commit-sync-time-ns-total")+
metricValue(restoreConsumer.metrics(),"io-wait-time-ns-total")+
metricValue(restoreConsumer.metrics(),"io-time-ns-total")+
producerTotalBlockedTime.get();;
stop
end
@enduml

