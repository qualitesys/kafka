1818;stroke-width:1.0;" x1="446" x2="446" y1="371.5391" y2="391.5391"/><polygon fill="#181818" points="442,381.5391,446,391.5391,450,381.5391,446,385.5391" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="446" x2="446" y1="476.1055" y2="498.6719"/><polygon fill="#181818" points="442,488.6719,446,498.6719,450,488.6719,446,492.6719" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="446" x2="446" y1="616.4531" y2="636.4531"/><polygon fill="#181818" points="442,626.4531,446,636.4531,450,626.4531,446,630.4531" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[07781b74ea61761ff412965639881576]
@startuml
!pragma layout smetana
start
note right
constructor StreamThreadTotalBlockedTime(final Consumer<? ,
? >consumer,final Consumer<? ,? >restoreConsumer,
final Supplier<Double>producerTotalBlockedTime)
end note
:this.consumer=consumer;
:this.restoreConsumer=restoreConsumer;
:this.producerTotalBlockedTime=producerTotalBlockedTime;
end
start
note right
doublemetricValue(final Map<MetricName,?  extends Metric>metrics,
final Stringname)
end note
:return metrics.keySet().stream().filter(n->n.name().equals(name)).findFirst().map(n->(Double)metrics.get(n).metricValue()).orElse(0.0);;
stop
end
start
note right
doublecompute()
end note
:return metricValue(consumer.metrics(),"io-wait-time-ns-total")+
metricValue(consumer.metrics(),"io-time-ns-total")+
metricValue(consumer.metrics(),"committed-time-ns-total")+
metricValue(consumer.metrics(),"commit-sync-time-ns-total")+
metricValue(restoreConsumer.metrics(),"io-wait-time-ns-total")+
metricValue(restoreConsumer.metrics(),"io-time-ns-total")+
producerTotalBlockedTime.get();;
stop
end
@enduml

