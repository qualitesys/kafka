@startuml
!pragma layout smetana
start
note right
constructor StreamThreadTotalBlockedTime(final Consumer<? ,
? >consumer,final Consumer<? ,? >restoreConsumer,
final Supplier<Double>producerTotalBlockedTime)
end note
:this.consumer=consumer;
:this.restoreConsumer=restoreConsumer;
:this.producerTotalBlockedTime=producerTotalBlockedTime;
end
start
note right
doublemetricValue(final Map<MetricName,?  extends Metric>metrics,
final Stringname)
end note
:return metrics.keySet().stream().filter(n->n.name().equals(name)).findFirst().map(n->(Double)metrics.get(n).metricValue()).orElse(0.0);;
stop
end
start
note right
doublecompute()
end note
:return metricValue(consumer.metrics(),"io-wait-time-ns-total")+metricValue(consumer.metrics(),"io-time-ns-total")+metricValue(consumer.metrics(),"committed-time-ns-total")+metricValue(consumer.metrics(),"commit-sync-time-ns-total")+metricValue(restoreConsumer.metrics(),"io-wait-time-ns-total")+metricValue(restoreConsumer.metrics(),"io-time-ns-total")+producerTotalBlockedTime.get();;
stop
end
@enduml

