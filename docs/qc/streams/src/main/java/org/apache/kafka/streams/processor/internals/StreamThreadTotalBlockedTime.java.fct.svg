0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="221" x2="221" y1="307.4375" y2="337.5703"/><polygon fill="#181818" points="217,327.5703,221,337.5703,225,327.5703,221,331.5703" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="221" x2="221" y1="399.4766" y2="419.4766"/><polygon fill="#181818" points="217,409.4766,221,419.4766,225,409.4766,221,413.4766" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="221" x2="221" y1="504.043" y2="526.6094"/><polygon fill="#181818" points="217,516.6094,221,526.6094,225,516.6094,221,520.6094" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="221" x2="221" y1="644.3906" y2="664.3906"/><polygon fill="#181818" points="217,654.3906,221,664.3906,225,654.3906,221,658.3906" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[66cc8d38f8528b8a6a90dd1bd8ebcf05]
@startuml
!pragma layout smetana
start
note right
constructor StreamThreadTotalBlockedTime(final Consumer<? ,
? >consumer,final Consumer<? ,? >restoreConsumer,
final Supplier<Double>producerTotalBlockedTime)
end note
:this.consumer=consumer;
:this.restoreConsumer=restoreConsumer;
:this.producerTotalBlockedTime=producerTotalBlockedTime;
end
start
note right
doublemetricValue(final Map<MetricName,?  extends Metric>metrics,
final Stringname)
end note
:return metrics.keySet().stream().filter(n->n.name()
.equals(name)).findFirst().map(n->(Double)metrics.get(n)
.metricValue()).orElse(0.0);;
stop
end
start
note right
doublecompute()
end note
:return metricValue(consumer.metrics(),"io-wait-time-ns-total")+
metricValue(consumer.metrics(),"io-time-ns-total")+
metricValue(consumer.metrics(),"committed-time-ns-total")+
metricValue(consumer.metrics(),"commit-sync-time-ns-total")+
metricValue(restoreConsumer.metrics(),"io-wait-time-ns-total")+
metricValue(restoreConsumer.metrics(),"io-time-ns-total")+
producerTotalBlockedTime.get();;
stop
end
@enduml

