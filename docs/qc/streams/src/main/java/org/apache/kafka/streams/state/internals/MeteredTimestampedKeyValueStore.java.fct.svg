.9219" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="608" x2="608" y1="872.8906" y2="892.8906"/><polygon fill="#181818" points="604,882.8906,608,892.8906,612,882.8906,608,886.8906" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="608" x2="608" y1="926.8594" y2="946.8594"/><polygon fill="#181818" points="604,936.8594,608,946.8594,612,936.8594,608,940.8594" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[43c08c168a4e5bc0f92fa3294568e4aa]
@startuml
!pragma layout smetana
start
note right
constructor MeteredTimestampedKeyValueStore(final KeyValueStore<Bytes,
byte[]>inner,final StringmetricScope,final Timetime,
final Serde<K>keySerde,final Serde<ValueAndTimestamp<V>>valueSerde)
end note
:super (inner,metricScope,time,keySerde,valueSerde);;
end
start
note right
Serde<ValueAndTimestamp<V>>prepareValueSerdeForStore(final Serde<ValueAndTimestamp<V>>valueSerde,
final SerdeGettergetter)
end note
if (valueSerde==null ) then (yes) 
:return new ValueAndTimestampSerde<>((Serde<V>)getter.valueSerde());;
stop
else (no)
:return super .prepareValueSerdeForStore(valueSerde,
getter);;
stop
endif 
end
start
note right
RawAndDeserializedValue<V>getWithBinary(final Kkey)
end note
:try {return maybeMeasureLatency(()->{final byte[]serializedValue=wrapped().get(keyBytes(key));return new RawAndDeserializedValue<>(serializedValue,
outerValue(serializedValue));},time,getSensor);}catch (final ProcessorStateExceptione){final Stringmessage=String.format(e.getMessage(),
key);throw new ProcessorStateException(message,
e);};
end
start
note right
booleanputIfDifferentValues(final Kkey,final ValueAndTimestamp<V>newValue,
final byte[]oldSerializedValue)
end note
:try {return maybeMeasureLatency(()->{final byte[]newSerializedValue=serdes.rawValue(newValue);if (ValueAndTimestampSerializer.valuesAreSameAndTimeIsIncreasing(oldSerializedValue,
newSerializedValue)){return false;}else {wrapped().put(keyBytes(key),
newSerializedValue);return true;}},time,putSensor);}catch (final ProcessorStateExceptione){final Stringmessage=String.format(e.getMessage(),
key,newValue);throw new ProcessorStateException(message,
e);};
end
start
note right
constructor RawAndDeserializedValue(final byte[]serializedValue,
final ValueAndTimestamp<ValueType>value)
end note
:this.serializedValue=serializedValue;;
:this.value=value;;
end
@enduml

