="#181818" points="975,530.4375,979,540.4375,983,530.4375,979,534.4375" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="979" x2="979" y1="574.4063" y2="594.4063"/><polygon fill="#181818" points="975,584.4063,979,594.4063,983,584.4063,979,588.4063" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="979" x2="979" y1="678.9727" y2="701.5391"/><polygon fill="#181818" points="975,691.5391,979,701.5391,983,691.5391,979,695.5391" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="979" x2="979" y1="735.5078" y2="755.5078"/><polygon fill="#181818" points="975,745.5078,979,755.5078,983,745.5078,979,749.5078" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="979" x2="979" y1="789.4766" y2="809.4766"/><polygon fill="#181818" points="975,799.4766,979,809.4766,983,799.4766,979,803.4766" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[ec7eb4dc7706b933cf40821f4eca264c]
@startuml
!pragma layout smetana
start
note right
constructor MeteredTimestampedKeyValueStore(final KeyValueStore<Bytes,byte[]>inner,final StringmetricScope,final Timetime,final Serde<K>keySerde,final Serde<ValueAndTimestamp<V>>valueSerde)
end note
:super (inner,metricScope,time,keySerde,valueSerde);
end
start
note right
Serde<ValueAndTimestamp<V>>prepareValueSerdeForStore(final Serde<ValueAndTimestamp<V>>valueSerde,final SerdeGettergetter)
end note
if (valueSerde==null ) then (yes) 
:return new ValueAndTimestampSerde<>((Serde<V>)getter.valueSerde());;
stop
else (no)
:return super .prepareValueSerdeForStore(valueSerde,getter);;
stop
endif 
end
start
note right
RawAndDeserializedValue<V>getWithBinary(final Kkey)
end note
:return maybeMeasureLatency(()->{final byte[]serializedValue=wrapped().get(keyBytes(key));return new RawAndDeserializedValue<>(serializedValue,outerValue(serializedValue));},time,getSensor);;
stop
end
start
note right
booleanputIfDifferentValues(final Kkey,final ValueAndTimestamp<V>newValue,final byte[]oldSerializedValue)
end note
:return maybeMeasureLatency(()->{final byte[]newSerializedValue=serdes.rawValue(newValue);if (ValueAndTimestampSerializer.valuesAreSameAndTimeIsIncreasing(oldSerializedValue,newSerializedValue)){return false;}else {wrapped().put(keyBytes(key),newSerializedValue);return true;}},time,putSensor);;
stop
end
start
note right
constructor RawAndDeserializedValue(final byte[]serializedValue,final ValueAndTimestamp<ValueType>value)
end note
:this.serializedValue=serializedValue;
:this.value=value;
end
@enduml

