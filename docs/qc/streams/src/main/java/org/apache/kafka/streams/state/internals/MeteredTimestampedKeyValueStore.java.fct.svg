18;stroke-width:1.0;" x1="477.5" x2="477.5" y1="1096.8906" y2="1116.8906"/><polygon fill="#181818" points="473.5,1106.8906,477.5,1116.8906,481.5,1106.8906,477.5,1110.8906" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="477.5" x2="477.5" y1="1150.8594" y2="1170.8594"/><polygon fill="#181818" points="473.5,1160.8594,477.5,1170.8594,481.5,1160.8594,477.5,1164.8594" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[f6cd7aff2e11684a176eff82dbe5d8f3]
@startuml
!pragma layout smetana
start
note right
constructor MeteredTimestampedKeyValueStore(final KeyValueStore<Bytes,
byte[]>inner,final StringmetricScope,final Timetime,
final Serde<K>keySerde,final Serde<ValueAndTimestamp<V>>valueSerde)
end note
:super (inner,metricScope,time,keySerde,valueSerde);
end
start
note right
Serde<ValueAndTimestamp<V>>prepareValueSerdeForStore(final Serde<ValueAndTimestamp<V>>valueSerde,
final SerdeGettergetter)
end note
if (valueSerde==null ) then (yes) 
:return new ValueAndTimestampSerde<>((Serde<V>)getter.valueSerde());;
stop
else (no)
:return super .prepareValueSerdeForStore(valueSerde,
getter);;
stop
endif 
end
start
note right
RawAndDeserializedValue<V>getWithBinary(final Kkey)
end note
:return maybeMeasureLatency(()->{final byte[]serializedValue=wrapped().get(keyBytes(key));
:return new RawAndDeserializedValue<>(serializedValue,
outerValue(serializedValue));},time,getSensor);;
stop
:throw new ProcessorStateException(message,e);;
end
start
note right
booleanputIfDifferentValues(final Kkey,final ValueAndTimestamp<V>newValue,
final byte[]oldSerializedValue)
end note
:return maybeMeasureLatency(()->{final byte[]newSerializedValue=serdes.rawValue(newValue);
:if (ValueAndTimestampSerializer.valuesAreSameAndTimeIsIncreasing(oldSerializedValue,
newSerializedValue)){return false;}else {wrapped().put(keyBytes(key),
newSerializedValue);return true;}},time,putSensor);;
stop
:throw new ProcessorStateException(message,e);;
end
start
note right
constructor RawAndDeserializedValue(final byte[]serializedValue,
final ValueAndTimestamp<ValueType>value)
end note
:this.serializedValue=serializedValue;
:this.value=value;
end
@enduml

