@startuml
!pragma layout smetana
start
note right
constructor ReadOnlyKeyValueStoreFacade(final TimestampedKeyValueStore<K,V>store)
end note
:inner=store;
end
start
note right
Vget(final Kkey)
end note
:return getValueOrNull(inner.get(key));;
stop
end
start
note right
KeyValueIterator<K,V>range(final Kfrom,final Kto)
end note
:return new KeyValueIteratorFacade<>(inner.range(from,to));;
stop
end
start
note right
KeyValueIterator<K,V>reverseRange(final Kfrom,final Kto)
end note
:return new KeyValueIteratorFacade<>(inner.reverseRange(from,to));;
stop
end
:return new KeyValueIteratorFacade<>(inner.prefixScan(prefix,prefixKeySerializer));;
stop
start
note right
KeyValueIterator<K,V>all()
end note
:return new KeyValueIteratorFacade<>(inner.all());;
stop
end
start
note right
KeyValueIterator<K,V>reverseAll()
end note
:return new KeyValueIteratorFacade<>(inner.reverseAll());;
stop
end
start
note right
longapproximateNumEntries()
end note
:return inner.approximateNumEntries();;
stop
end
@enduml

