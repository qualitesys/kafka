@startuml
!pragma layout smetana
start
note right
constructor KStreamKTableJoin(final KTableValueGetterSupplier<K,V2>valueGetterSupplier,final ValueJoinerWithKey<? super K,? super V1,? super V2,VOut>joiner,final booleanleftJoin)
end note
:this.valueGetterSupplier=valueGetterSupplier;
:this.joiner=joiner;
:this.leftJoin=leftJoin;
end
start
note right
Processor<K,V1,K,VOut>get()
end note
:return new KStreamKTableJoinProcessor<>(valueGetterSupplier.get(),
keyValueMapper,joiner,leftJoin);;
stop
end
@enduml

