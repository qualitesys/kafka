@startuml
!pragma layout smetana
start
note right
constructor KStreamKTableJoin(final KTableValueGetterSupplier<K,
V2>valueGetterSupplier,final ValueJoinerWithKey<? super K,
? super V1,? super V2,VOut>joiner,final booleanleftJoin)
end note
end
start
note right
