@startuml
!pragma layout smetana
start
note right
constructor RangeQuery(final Optional<K>lower,final Optional<K>upper)
end note
:this.lower=lower;
:this.upper=upper;
end
:return new RangeQuery<>(Optional.of(lower),
Optional.of(upper));;
stop
:return new RangeQuery<>(Optional.empty(),
Optional.of(upper));;
stop
:return new RangeQuery<>(Optional.of(lower),
Optional.empty());;
stop
:return new RangeQuery<>(Optional.empty(),
Optional.empty());;
stop
start
note right
Optional<K>getLowerBound()
end note
:return lower;;
stop
end
start
note right
Optional<K>getUpperBound()
end note
:return upper;;
stop
end
@enduml

