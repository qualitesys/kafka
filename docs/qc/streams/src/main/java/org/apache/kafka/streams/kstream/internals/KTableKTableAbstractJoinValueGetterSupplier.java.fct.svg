@startuml
!pragma layout smetana
start
note right
constructor KTableKTableAbstractJoinValueGetterSupplier(final KTableValueGetterSupplier<K,
V1> valueGetterSupplier1,final KTableValueGetterSupplier<K,
V2> valueGetterSupplier2)
end note
:this.valueGetterSupplier1=valueGetterSupplier1;;
:this.valueGetterSupplier2=valueGetterSupplier2;;
end
start
note right
String[] storeNames()
end note
:final String[] storeNames1=valueGetterSupplier1.storeNames();;
:final String[] storeNames2=valueGetterSupplier2.storeNames();;
:final Set<String> stores=new HashSet<>(storeNames1.length+
storeNames2.length);;
:Collections.addAll(stores,storeNames1);;
:Collections.addAll(stores,storeNames2);;
:return stores.toArray(new String[0]);;
stop
end
@enduml

