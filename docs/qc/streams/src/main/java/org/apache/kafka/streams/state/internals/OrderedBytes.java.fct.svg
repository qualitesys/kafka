@startuml
!pragma layout smetana
start
note right
Bytes upperRange(final Bytes key,final byte[] maxSuffix)
end note
:final byte[] bytes=key.get();;
:final ByteBuffer rangeEnd=ByteBuffer.allocate(bytes.length+
maxSuffix.length);;
:final int firstTimestampByte=maxSuffix[0]&0xFF;;
if (firstTimestampByte==0) then (yes) 
:return Bytes.wrap(rangeEnd.put(bytes).put(maxSuffix)
.array());;
stop
else (no)
:int i=0;;
while (i<bytes.length&&(i<MIN_KEY_LENGTH||(bytes[i]&0xFF)>=firstTimestampByte))
:rangeEnd.put(bytes[i++]);;
endwhile
:rangeEnd.put(maxSuffix);;
:rangeEnd.flip();;
:final byte[] res=new byte[rangeEnd.remaining()];;
:ByteBuffer.wrap(res).put(rangeEnd);;
:return Bytes.wrap(res);;
stop
endif 
end
start
note right
Bytes lowerRange(final Bytes key,final byte[] minSuffix)
end note
:final byte[] bytes=key.get();;
:final ByteBuffer rangeStart=ByteBuffer.allocate(bytes.length+
minSuffix.length);;
:return Bytes.wrap(rangeStart.put(bytes).put(minSuffix)
.array());;
stop
end
@enduml

