@startuml
!pragma layout smetana
start
note right
BytesupperRange(final Byteskey,final byte[]maxSuffix)
end note
if (firstTimestampByte==0) then (yes) 
:return Bytes.wrap(rangeEnd.put(bytes).put(maxSuffix)
.array());;
stop
else (no)
:while (i<bytes.length&&(i<MIN_KEY_LENGTH||(bytes[i]&0xFF)>=firstTimestampByte)){rangeEnd.put(bytes[i+
+]);};
:rangeEnd.put(maxSuffix);;
:rangeEnd.flip();;
:ByteBuffer.wrap(res).put(rangeEnd);;
:return Bytes.wrap(res);;
stop
endif 
end
start
note right
ByteslowerRange(final Byteskey,final byte[]minSuffix)
end note
:return Bytes.wrap(rangeStart.put(bytes).put(minSuffix)
.array());;
stop
end
@enduml

