@startuml
!pragma layout smetana
start
note right
constructor Windowed(final K key,final Window window)
end note
:this.key=key;;
:this.window=window;;
end
start
note right
K key()
end note
:return key;;
stop
end
start
note right
Window window()
end note
:return window;;
stop
end
start
note right
String toString()
end note
:return "["+key+"@"+window.start()+"/"+window.end()+
"]";;
stop
end
start
note right
boolean equals(final Object obj)
end note
if (obj==this) then (yes) 
:return true;;
stop
endif 
if (!(obj instanceof Windowed )) then (yes) 
:return false;;
stop
endif 
:final Windowed<?> that=(Windowed )obj;;
:return window.equals(that.window)&&key.equals(that.key);;
stop
end
start
note right
int hashCode()
end note
:final long n=((long )window.hashCode()<<32)|key.hashCode();;
:return (int )(n%0xFFFFFFFFL);;
stop
end
@enduml

