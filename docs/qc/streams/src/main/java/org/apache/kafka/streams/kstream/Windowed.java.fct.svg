@startuml
!pragma layout smetana
start
note right
constructor Windowed(final Kkey,final Windowwindow)
end note
end
start
note right
Kkey()
end note
:return key;;
stop
end
start
note right
Windowwindow()
end note
:return window;;
stop
end
start
note right
StringtoString()
end note
:return "["+key+"@"+window.start()+"/"+window.end()+
"]";;
stop
end
start
note right
booleanequals(final Objectobj)
end note
if (obj==this) then (yes) 
:return true;;
stop
endif 
if (!(obj instanceof Windowed)) then (yes) 
:return false;;
stop
endif 
:return window.equals(that.window)&&key.equals(that.key);;
stop
end
start
note right
inthashCode()
end note
:return (int)(n%0xFFFFFFFFL);;
stop
end
@enduml

