@startuml
!pragma layout smetana
start
note right
constructor TimestampedTupleForwarder(final StateStorestore,
final ProcessorContext<K,Change<V>>context,
final CacheFlushListener<K,? >flushListener,
final booleansendOldValues)
end note
end
start
note right
constructor TimestampedTupleForwarder(final ProcessorContext<K,
Change<V>>context,final booleansendOldValues)
end note
end
start
note right
void maybeForward(final Record<K,Change<V>>record)
end note
if (!cachingEnabled) then (yes) 
if (sendOldValues) then (yes) 
else (no)
endif 
endif 
end
@enduml

