@startuml
!pragma layout smetana
start
note right
constructor TimestampedTupleForwarder(final StateStorestore,
final ProcessorContext<K,Change<V>>context,
final CacheFlushListener<K,? >flushListener,
final booleansendOldValues)
end note
:this.context=(InternalProcessorContext<K,
Change<V>>)context;
:this.sendOldValues=sendOldValues;
:cachingEnabled=((WrappedStateStore)store).setFlushListener(flushListener,
sendOldValues);
end
start
note right
constructor TimestampedTupleForwarder(final ProcessorContext<K,
Change<V>>context,final booleansendOldValues)
end note
:this.context=(InternalProcessorContext<K,
Change<V>>)context;
:this.sendOldValues=sendOldValues;
:cachingEnabled=false;
end
start
note right
void maybeForward(final Record<K,Change<V>>record)
end note
if (!cachingEnabled) then (yes) 
if (sendOldValues) then (yes) 
:context.forward(record);
else (no)
:context.forward(record.withValue(new Change<>(record.value().newValue,
null )));
endif 
endif 
end
@enduml

