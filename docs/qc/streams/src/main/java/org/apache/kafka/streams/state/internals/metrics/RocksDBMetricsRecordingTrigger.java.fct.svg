1="826.9297" y2="846.9297"/><polygon fill="#181818" points="251.5,836.9297,255.5,846.9297,259.5,836.9297,255.5,840.9297" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="255.5" x2="255.5" y1="931.4961" y2="954.0625"/><polygon fill="#181818" points="251.5,944.0625,255.5,954.0625,259.5,944.0625,255.5,948.0625" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="255.5" x2="255.5" y1="988.0313" y2="1008.0313"/><polygon fill="#181818" points="251.5,998.0313,255.5,1008.0313,259.5,998.0313,255.5,1002.0313" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[a87f59e19f7b3f60da880a5bae618cb4]
@startuml
!pragma layout smetana
start
note right
constructor RocksDBMetricsRecordingTrigger(final Timetime)
end note
:this.time=time;
end
start
note right
void addMetricsRecorder(final RocksDBMetricsRecordermetricsRecorder)
end note
if (metricsRecordersToTrigger.containsKey(metricsRecorderName)) then (yes) 
:throw new IllegalStateException("RocksDB metrics recorder for store \""+
metricsRecorder.storeName()+"\" of task "+
metricsRecorder.taskId().toString()+" has already been added. "+
"This is a bug in Kafka Streams.");;
endif 
:metricsRecordersToTrigger.put(metricsRecorderName,
metricsRecorder);
end
start
note right
void removeMetricsRecorder(final RocksDBMetricsRecordermetricsRecorder)
end note
if (removedMetricsRecorder==null ) then (yes) 
:throw new IllegalStateException("No RocksDB metrics recorder for store "+
"\""+metricsRecorder.storeName()+"\" of task "+
metricsRecorder.taskId()+" could be found. "+
"This is a bug in Kafka Streams.");;
endif 
end
start
note right
StringmetricsRecorderName(final RocksDBMetricsRecordermetricsRecorder)
end note
:return metricsRecorder.taskId().toString()+
"-"+metricsRecorder.storeName();;
stop
end
start
note right
void run()
end note
:metricsRecorder.record(now);
end
@enduml

