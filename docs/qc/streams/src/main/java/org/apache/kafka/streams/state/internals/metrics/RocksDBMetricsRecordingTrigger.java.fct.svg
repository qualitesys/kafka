@startuml
!pragma layout smetana
start
note right
constructor RocksDBMetricsRecordingTrigger(final Timetime)
end note
:this.time=time;
end
start
note right
void addMetricsRecorder(final RocksDBMetricsRecordermetricsRecorder)
end note
if (metricsRecordersToTrigger.containsKey(metricsRecorderName)) then (yes) 
:throw new IllegalStateException("RocksDB metrics recorder for store \""+metricsRecorder.storeName()+"\" of task "+metricsRecorder.taskId().toString()+" has already been added. "+"This is a bug in Kafka Streams.");;
endif 
:metricsRecordersToTrigger.put(metricsRecorderName,
metricsRecorder);
end
start
note right
void removeMetricsRecorder(final RocksDBMetricsRecordermetricsRecorder)
end note
if (removedMetricsRecorder==null ) then (yes) 
:throw new IllegalStateException("No RocksDB metrics recorder for store "
+"\""+metricsRecorder.storeName()+"\" of task "+metricsRecorder.taskId()+" could be found. "+"This is a bug in Kafka Streams.");;
endif 
end
start
note right
StringmetricsRecorderName(final RocksDBMetricsRecordermetricsRecorder)
end note
:return metricsRecorder.taskId().toString()+"-"+metricsRecorder.storeName();;
stop
end
start
note right
void run()
end note
:metricsRecorder.record(now);
end
@enduml

