troke-width:1.0;" x1="441.5" x2="441.5" y1="1189.9375" y2="1209.9375"/><polygon fill="#181818" points="437.5,1199.9375,441.5,1209.9375,445.5,1199.9375,441.5,1203.9375" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[06f614317754cb1d2c78d98a23d27493]
@startuml
!pragma layout smetana
start
note right
constructor RocksDBMetricsRecordingTrigger(final Time time)
end note
:this.time=time;;
end
start
note right
void addMetricsRecorder(final RocksDBMetricsRecorder metricsRecorder)
end note
:final String metricsRecorderName=metricsRecorderName(metricsRecorder);;
if (metricsRecordersToTrigger.containsKey(metricsRecorderName)) then (yes) 
:throw new IllegalStateException("RocksDB metrics recorder for store \""+
metricsRecorder.storeName()+"\" of task "+
metricsRecorder.taskId().toString()+" has already been added. "+
"This is a bug in Kafka Streams.");;
stop
endif 
:metricsRecordersToTrigger.put(metricsRecorderName,
metricsRecorder);;
end
start
note right
void removeMetricsRecorder(final RocksDBMetricsRecorder metricsRecorder)
end note
:final RocksDBMetricsRecorder removedMetricsRecorder=metricsRecordersToTrigger.remove(metricsRecorderName(metricsRecorder));;
if (removedMetricsRecorder==null ) then (yes) 
:throw new IllegalStateException("No RocksDB metrics recorder for store "+
"\""+metricsRecorder.storeName()+"\" of task "+
metricsRecorder.taskId()+" could be found. "+
"This is a bug in Kafka Streams.");;
stop
endif 
end
start
note right
String metricsRecorderName(final RocksDBMetricsRecorder metricsRecorder)
end note
:return metricsRecorder.taskId().toString()+
"-"+metricsRecorder.storeName();;
stop
end
start
note right
void run()
end note
:final long now=time.milliseconds();;
:metricsRecorder.record(now);;
end
@enduml

