@startuml
!pragma layout smetana
start
note right
constructor WindowedStreamPartitioner(final WindowedSerializer<K>serializer)
end note
:this.serializer=serializer;
end
start
note right
Integerpartition(final Stringtopic,final Windowed<K>windowedKey,
final Vvalue,final intnumPartitions)
end note
:return BuiltInPartitioner.partitionForKey(keyBytes,
numPartitions);;
stop
end
@enduml

