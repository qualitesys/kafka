@startuml
!pragma layout smetana
start
note right
constructor KStreamFlatMap(final KeyValueMapper<?superKIn,
?superVIn,?extendsIterable<?extendsKeyValue<?extendsKOut,
?extendsVOut>>> mapper)
end note
:this.mapper=mapper;;
end
start
note right
Processor<KIn,VIn,KOut,VOut> get()
end note
:return new KStreamFlatMapProcessor();;
stop
end
start
note right
void process(final Record<KIn,VIn> record )
end note
:final Iterable<?extendsKeyValue<?extendsKOut,
?extendsVOut>> newKeyValues=mapper.apply(record .key(),
record .value());;
:Objects.requireNonNull(newKeyValues,"The provided KeyValueMapper returned null which is not allowed.");;
:context().forward(record .withKey(newPair.key)
.withValue(newPair.value));;
end
@enduml

