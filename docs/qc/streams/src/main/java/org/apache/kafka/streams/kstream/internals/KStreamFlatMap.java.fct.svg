@startuml
!pragma layout smetana
start
note right
constructor KStreamFlatMap(final KeyValueMapper<? super KIn,
? super VIn,?  extends Iterable<?  extends KeyValue<?  extends KOut,
?  extends VOut>>>mapper)
end note
:this.mapper=mapper;
end
start
note right
Processor<KIn,VIn,KOut,VOut>get()
end note
:return new KStreamFlatMapProcessor();;
stop
end
start
note right
void process(final Record<KIn,VIn>record)
end note
:Objects.requireNonNull(newKeyValues,"The provided KeyValueMapper returned null which is not allowed.");
:context().forward(record.withKey(newPair.key).withValue(newPair.value));
end
@enduml

