@startuml
!pragma layout smetana
start
note right
constructor TimeWindows(final longsizeMs,
final longadvanceMs,final longgraceMs,final booleanhasSetGrace)
end note
:this.sizeMs=sizeMs;;
:this.advanceMs=advanceMs;;
:this.graceMs=graceMs;;
:this.hasSetGrace=hasSetGrace;;
if (sizeMs<=0) then (yes) 
:throw new IllegalArgumentException("Window size (sizeMs) must be larger than zero.");;
stop
endif 
if (advanceMs<=0||advanceMs>sizeMs) then (yes) 
:throw new IllegalArgumentException(String.format("Window advancement interval should be more than zero "+
"and less than window duration which is %d ms,
 but given advancement interval is: %d ms",
sizeMs,advanceMs));;
stop
endif 
if (graceMs<0) then (yes) 
:throw new IllegalArgumentException("Grace period must not be negative.");;
stop
endif 
end
start
note right
TimeWindowsofSizeWithNoGrace(final Durationsize)
end note
:return ofSizeAndGrace(size,ofMillis(NO_GRACE_PERIOD));;
stop
end
start
note right
TimeWindowsofSizeAndGrace(final Durationsize,
final DurationafterWindowEnd)
end note
:final StringsizeMsgPrefix=prepareMillisCheckFailMsgPrefix(size,
"size");;
:final longsizeMs=validateMillisecondDuration(size,
sizeMsgPrefix);;
:final StringafterWindowEndMsgPrefix=prepareMillisCheckFailMsgPrefix(afterWindowEnd,
"afterWindowEnd");;
:final longafterWindowEndMs=validateMillisecondDuration(afterWindowEnd,
afterWindowEndMsgPrefix);;
:return new TimeWindows(sizeMs,sizeMs,afterWindowEndMs,
true);;
stop
end
start
note right
TimeWindowsof(final Durationsize)
end note
:final StringmsgPrefix=prepareMillisCheckFailMsgPrefix(size,
"size");;
:final longsizeMs=validateMillisecondDuration(size,
msgPrefix);;
:return new TimeWindows(sizeMs,sizeMs,Math.max(DEPRECATED_DEFAULT_24_HR_GRACE_PERIOD-sizeMs,
0),false);;
stop
end
start
note right
TimeWindowsadvanceBy(final Durationadvance)
end note
:final StringmsgPrefix=prepareMillisCheckFailMsgPrefix(advance,
"advance");;
:final longadvanceMs=validateMillisecondDuration(advance,
msgPrefix);;
:return new TimeWindows(sizeMs,advanceMs,
graceMs,false);;
stop
end
start
note right
Map<Long,TimeWindow>windowsFor(final longtimestamp)
end note
:longwindowStart=(Math.max(0,timestamp-sizeMs+
advanceMs)/advanceMs)*advanceMs;;
:final Map<Long,TimeWindow>windows=new LinkedHashMap<>();;
while (windowStart<=timestamp)
:final TimeWindowwindow=new TimeWindow(windowStart,windowStart+
sizeMs);;
:windows.put(windowStart,window);;
:windowStart+=advanceMs;;
endwhile
:return windows;;
stop
end
start
note right
longsize()
end note
:return sizeMs;;
stop
end
start
note right
TimeWindowsgrace(final DurationafterWindowEnd)
end note
if (this.hasSetGrace) then (yes) 
:throw new IllegalStateException("Cannot call grace() after setting grace value via ofSizeAndGrace or ofSizeWithNoGrace.");;
stop
endif 
:final StringmsgPrefix=prepareMillisCheckFailMsgPrefix(afterWindowEnd,
"afterWindowEnd");;
:final longafterWindowEndMs=validateMillisecondDuration(afterWindowEnd,
msgPrefix);;
:return new TimeWindows(sizeMs,advanceMs,
afterWindowEndMs,false);;
stop
end
start
note right
longgracePeriodMs()
end note
:return graceMs;;
stop
end
start
note right
booleanequals(final Objecto)
end note
if (this==o) then (yes) 
:return true;;
stop
endif 
if (o==null ||getClass()!=o.getClass()) then (yes) 
:return false;;
stop
endif 
:final TimeWindowsthat=(TimeWindows)o;;
:return sizeMs==that.sizeMs&&advanceMs==that.advanceMs&&graceMs==that.graceMs;;
stop
end
start
note right
inthashCode()
end note
:return Objects.hash(sizeMs,advanceMs,graceMs);;
stop
end
start
note right
StringtoString()
end note
:return "TimeWindows{"+", sizeMs="+sizeMs+
", advanceMs="+advanceMs+", graceMs="+graceMs+
'}';;
stop
end
@enduml

