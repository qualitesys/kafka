@startuml
!pragma layout smetana
start
note right
constructor TimeWindows(final long sizeMs,
final long advanceMs,final long graceMs,final boolean hasSetGrace)
end note
:this.sizeMs=sizeMs;;
:this.advanceMs=advanceMs;;
:this.graceMs=graceMs;;
:this.hasSetGrace=hasSetGrace;;
if (sizeMs<=0) then (yes) 
:throw new IllegalArgumentException("Window size (sizeMs) must be larger than zero.");;
stop
endif 
if (advanceMs<=0||advanceMs>sizeMs) then (yes) 
:throw new IllegalArgumentException(String.format("Window advancement interval should be more than zero "+
"and less than window duration which is %d ms,
 but given advancement interval is: %d ms",
sizeMs,advanceMs));;
stop
endif 
if (graceMs<0) then (yes) 
:throw new IllegalArgumentException("Grace period must not be negative.");;
stop
endif 
end
start
note right
TimeWindows ofSizeWithNoGrace(final Duration size)
end note
:return ofSizeAndGrace(size,ofMillis(NO_GRACE_PERIOD));;
stop
end
start
note right
TimeWindows ofSizeAndGrace(final Duration size,
final Duration afterWindowEnd)
end note
:final String sizeMsgPrefix=prepareMillisCheckFailMsgPrefix(size,
"size");;
:final long sizeMs=validateMillisecondDuration(size,
sizeMsgPrefix);;
:final String afterWindowEndMsgPrefix=prepareMillisCheckFailMsgPrefix(afterWindowEnd,
"afterWindowEnd");;
:final long afterWindowEndMs=validateMillisecondDuration(afterWindowEnd,
afterWindowEndMsgPrefix);;
:return new TimeWindows(sizeMs,sizeMs,afterWindowEndMs,
true);;
stop
end
start
note right
TimeWindows of(final Duration size)
end note
:final String msgPrefix=prepareMillisCheckFailMsgPrefix(size,
"size");;
:final long sizeMs=validateMillisecondDuration(size,
msgPrefix);;
:return new TimeWindows(sizeMs,sizeMs,Math.max(DEPRECATED_DEFAULT_24_HR_GRACE_PERIOD-sizeMs,
0),false);;
stop
end
start
note right
TimeWindows advanceBy(final Duration advance)
end note
:final String msgPrefix=prepareMillisCheckFailMsgPrefix(advance,
"advance");;
:final long advanceMs=validateMillisecondDuration(advance,
msgPrefix);;
:return new TimeWindows(sizeMs,advanceMs,
graceMs,false);;
stop
end
start
note right
Map<Long,TimeWindow> windowsFor(final long timestamp)
end note
:long windowStart=(Math.max(0,timestamp-sizeMs+
advanceMs)/advanceMs)*advanceMs;;
:final Map<Long,TimeWindow> windows=new LinkedHashMap<>();;
while (windowStart<=timestamp)
:final TimeWindow window=new TimeWindow(windowStart,windowStart+
sizeMs);;
:windows.put(windowStart,window);;
:windowStart+=advanceMs;;
endwhile
:return windows;;
stop
end
start
note right
long size()
end note
:return sizeMs;;
stop
end
start
note right
TimeWindows grace(final Duration afterWindowEnd)
end note
if (this.hasSetGrace) then (yes) 
:throw new IllegalStateException("Cannot call grace() after setting grace value via ofSizeAndGrace or ofSizeWithNoGrace.");;
stop
endif 
:final String msgPrefix=prepareMillisCheckFailMsgPrefix(afterWindowEnd,
"afterWindowEnd");;
:final long afterWindowEndMs=validateMillisecondDuration(afterWindowEnd,
msgPrefix);;
:return new TimeWindows(sizeMs,advanceMs,
afterWindowEndMs,false);;
stop
end
start
note right
long gracePeriodMs()
end note
:return graceMs;;
stop
end
start
note right
boolean equals(final Object o)
end note
if (this==o) then (yes) 
:return true;;
stop
endif 
if (o==null ||getClass()!=o.getClass()) then (yes) 
:return false;;
stop
endif 
:final TimeWindows that=(TimeWindows )o;;
:return sizeMs==that.sizeMs&&advanceMs==that.advanceMs&&graceMs==that.graceMs;;
stop
end
start
note right
int hashCode()
end note
:return Objects.hash(sizeMs,advanceMs,graceMs);;
stop
end
start
note right
String toString()
end note
:return "TimeWindows{"+", sizeMs="+sizeMs+
", advanceMs="+advanceMs+", graceMs="+graceMs+
'}';;
stop
end
@enduml

