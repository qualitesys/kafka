@startuml
!pragma layout smetana
start
note right
longonInvalidTimestamp(final ConsumerRecord<Object,
Object>record ,final longrecordTimestamp,
final longpartitionTime)
end note
:final Stringmessage="Input record "+record +
" has invalid (negative) timestamp. "+"Possibly because a pre-0.10 producer client was used to write this record to Kafka without embedding "+
"a timestamp, or because the input topic was created before upgrading the Kafka cluster to 0.10+
. "+"Use a different TimestampExtractor to process this data.";;
:log.error(message);;
:throw new StreamsException(message);;
stop
end
@enduml

