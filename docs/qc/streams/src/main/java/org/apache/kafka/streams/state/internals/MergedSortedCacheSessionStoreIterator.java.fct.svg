@startuml
!pragma layout smetana
start
note right
constructor MergedSortedCacheSessionStoreIterator(final PeekingKeyValueIterator<Bytes,
LRUCacheEntry> cacheIterator,final KeyValueIterator<Windowed<Bytes>,
byte[]> storeIterator,final SegmentedCacheFunction cacheFunction,
final boolean forward)
end note
:super (cacheIterator,storeIterator,forward);;
:this.cacheFunction=cacheFunction;;
end
start
note right
KeyValue<Windowed<Bytes>,byte[]> deserializeStorePair(final KeyValue<Windowed<Bytes>,
byte[]> pair)
end note
:return pair;;
stop
end
start
note right
Windowed<Bytes> deserializeCacheKey(final Bytes cacheKey)
end note
:final byte[] binaryKey=cacheFunction.key(cacheKey)
.get();;
:final byte[] keyBytes=SessionKeySchema.extractKeyBytes(binaryKey);;
:final Window window=SessionKeySchema.extractWindow(binaryKey);;
:return new Windowed<>(Bytes.wrap(keyBytes),
window);;
stop
end
start
note right
byte[] deserializeCacheValue(final LRUCacheEntry cacheEntry)
end note
:return cacheEntry.value();;
stop
end
start
note right
Windowed<Bytes> deserializeStoreKey(final Windowed<Bytes> key)
end note
:return key;;
stop
end
start
note right
int compare(final Bytes cacheKey,final Windowed<Bytes> storeKey)
end note
:final Bytes storeKeyBytes=SessionKeySchema.toBinary(storeKey);;
:return cacheFunction.compareSegmentedKeys(cacheKey,
storeKeyBytes);;
stop
end
@enduml

