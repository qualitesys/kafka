@startuml
!pragma layout smetana
start
note right
constructor MergedSortedCacheSessionStoreIterator(final PeekingKeyValueIterator<Bytes,LRUCacheEntry>cacheIterator,final KeyValueIterator<Windowed<Bytes>,byte[]>storeIterator,final SegmentedCacheFunctioncacheFunction,final booleanforward)
end note
:super (cacheIterator,storeIterator,forward);
:this.cacheFunction=cacheFunction;
end
start
note right
KeyValue<Windowed<Bytes>,byte[]>deserializeStorePair(final KeyValue<Windowed<Bytes>,byte[]>pair)
end note
:return pair;;
stop
end
start
note right
Windowed<Bytes>deserializeCacheKey(final BytescacheKey)
end note
:return new Windowed<>(Bytes.wrap(keyBytes),window);;
stop
end
start
note right
byte[]deserializeCacheValue(final LRUCacheEntrycacheEntry)
end note
:return cacheEntry.value();;
stop
end
start
note right
Windowed<Bytes>deserializeStoreKey(final Windowed<Bytes>key)
end note
:return key;;
stop
end
start
note right
intcompare(final BytescacheKey,final Windowed<Bytes>storeKey)
end note
:return cacheFunction.compareSegmentedKeys(cacheKey,storeKeyBytes);;
stop
end
@enduml

