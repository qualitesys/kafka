@startuml
!pragma layout smetana
start
note right
constructor SinkNode(final Stringname,final TopicNameExtractor<KIn,VIn>topicExtractor,final Serializer<KIn>keySerializer,final Serializer<VIn>valSerializer,final StreamPartitioner<? super KIn,? super VIn>partitioner)
end note
:super (name);
:this.topicExtractor=topicExtractor;
:this.keySerializer=keySerializer;
:this.valSerializer=valSerializer;
:this.partitioner=partitioner;
end
start
note right
void addChild(final ProcessorNode<Void,Void,? ,? >child)
end note
:throw new UnsupportedOperationException("sink node does not allow addChild");;
end
start
note right
void init(final InternalProcessorContext<Void,Void>context)
end note
:super .init(context);
:this.context=context;
:keySerializer=prepareKeySerializer(keySerializer,
context,this.name());
:valSerializer=prepareValueSerializer(valSerializer,
context,this.name());
end
start
note right
void process(final Record<KIn,VIn>record)
end note
:collector.send(topic,key,value,record.headers(),
timestamp,keySerializer,valSerializer,name(),
context,partitioner);
end
start
note right
StringtoString()
end note
:return toString("");;
stop
end
start
note right
