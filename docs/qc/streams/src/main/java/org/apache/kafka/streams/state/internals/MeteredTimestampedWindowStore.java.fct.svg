stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="402" x2="257" y1="255.6016" y2="255.6016"/><line style="stroke:#181818;stroke-width:1.0;" x1="257" x2="257" y1="255.6016" y2="277.6016"/><polygon fill="#181818" points="253,267.6016,257,277.6016,261,267.6016,257,271.6016" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="532" x2="677" y1="255.6016" y2="255.6016"/><line style="stroke:#181818;stroke-width:1.0;" x1="677" x2="677" y1="255.6016" y2="277.6016"/><polygon fill="#181818" points="673,267.6016,677,277.6016,681,267.6016,677,271.6016" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="467" x2="467" y1="213.4688" y2="243.6016"/><polygon fill="#181818" points="463,233.6016,467,243.6016,471,233.6016,467,237.6016" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[9f47afd466b7ea3ae34bc9e448d57325]
@startuml
!pragma layout smetana
start
note right
constructor MeteredTimestampedWindowStore(final WindowStore<Bytes,
byte[]> inner,final long windowSizeMs,final String metricScope,
final Time time,final Serde<K> keySerde,final Serde<ValueAndTimestamp<V>> valueSerde)
end note
:super (inner,windowSizeMs,metricScope,time,
keySerde,valueSerde);;
end
start
note right
Serde<ValueAndTimestamp<V>> prepareValueSerde(final Serde<ValueAndTimestamp<V>> valueSerde,
final SerdeGetter getter)
end note
if (valueSerde==null ) then (yes) 
:return new ValueAndTimestampSerde<>((Serde<V> )getter.valueSerde());;
stop
else (no)
:return super .prepareValueSerde(valueSerde,
getter);;
stop
endif 
end
@enduml

