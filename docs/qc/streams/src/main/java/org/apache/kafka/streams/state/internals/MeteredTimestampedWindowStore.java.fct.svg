oke-width:1.0;" x1="255" x2="255" y1="240.4688" y2="262.4688"/><polygon fill="#181818" points="251,252.4688,255,262.4688,259,252.4688,255,256.4688" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="529" x2="673" y1="240.4688" y2="240.4688"/><line style="stroke:#181818;stroke-width:1.0;" x1="673" x2="673" y1="240.4688" y2="262.4688"/><polygon fill="#181818" points="669,252.4688,673,262.4688,677,252.4688,673,256.4688" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="464" x2="464" y1="205.9023" y2="228.4688"/><polygon fill="#181818" points="460,218.4688,464,228.4688,468,218.4688,464,222.4688" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[106cc71fa27fd1a6e85457db6cf9a535]
@startuml
!pragma layout smetana
start
note right
constructor MeteredTimestampedWindowStore(final WindowStore<Bytes,
byte[]>inner,final longwindowSizeMs,final StringmetricScope,
final Timetime,final Serde<K>keySerde,final Serde<ValueAndTimestamp<V>>valueSerde)
end note
:super (inner,windowSizeMs,metricScope,time,
keySerde,valueSerde);
end
start
note right
Serde<ValueAndTimestamp<V>>prepareValueSerde(final Serde<ValueAndTimestamp<V>>valueSerde,final SerdeGettergetter)
end note
if (valueSerde==null ) then (yes) 
:return new ValueAndTimestampSerde<>((Serde<V>)getter.valueSerde());;
stop
else (no)
:return super .prepareValueSerde(valueSerde,
getter);;
stop
endif 
end
@enduml

