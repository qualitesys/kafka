@startuml
!pragma layout smetana
start
note right
constructor MeteredTimestampedWindowStore(final WindowStore<Bytes,
byte[]>inner,final longwindowSizeMs,final StringmetricScope,
final Timetime,final Serde<K>keySerde,final Serde<ValueAndTimestamp<V>>valueSerde)
end note
end
start
note right
Serde<ValueAndTimestamp<V>>prepareValueSerde(final Serde<ValueAndTimestamp<V>>valueSerde,
final SerdeGettergetter)
end note
if (valueSerde==null ) then (yes) 
:return new ValueAndTimestampSerde<>((Serde<V>)getter.valueSerde());;
stop
else (no)
:return super .prepareValueSerde(valueSerde,
getter);;
stop
endif 
end
@enduml

