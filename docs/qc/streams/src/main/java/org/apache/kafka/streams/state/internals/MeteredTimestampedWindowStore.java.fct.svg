 style="stroke:#181818;stroke-width:1.0;" x1="476" x2="476" y1="161.668" y2="184.2344"/><polygon fill="#181818" points="472,174.2344,476,184.2344,480,174.2344,476,178.2344" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[5ef636a27651302e334c78ac36c20560]
@startuml
!pragma layout smetana
start
note right
constructor MeteredTimestampedWindowStore(final WindowStore<Bytes,byte[]>inner,final longwindowSizeMs,final StringmetricScope,final Timetime,final Serde<K>keySerde,final Serde<ValueAndTimestamp<V>>valueSerde)
end note
:super (inner,windowSizeMs,metricScope,time,keySerde,valueSerde);
end
start
note right
Serde<ValueAndTimestamp<V>>prepareValueSerde(final Serde<ValueAndTimestamp<V>>valueSerde,final SerdeGettergetter)
end note
if (valueSerde==null ) then (yes) 
:return new ValueAndTimestampSerde<>((Serde<V>)getter.valueSerde());;
stop
else (no)
:return super .prepareValueSerde(valueSerde,getter);;
stop
endif 
end
@enduml

