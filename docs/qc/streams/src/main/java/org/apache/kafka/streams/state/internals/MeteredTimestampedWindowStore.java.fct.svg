h:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="399" x2="255" y1="255.6016" y2="255.6016"/><line style="stroke:#181818;stroke-width:1.0;" x1="255" x2="255" y1="255.6016" y2="277.6016"/><polygon fill="#181818" points="251,267.6016,255,277.6016,259,267.6016,255,271.6016" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="529" x2="673" y1="255.6016" y2="255.6016"/><line style="stroke:#181818;stroke-width:1.0;" x1="673" x2="673" y1="255.6016" y2="277.6016"/><polygon fill="#181818" points="669,267.6016,673,277.6016,677,267.6016,673,271.6016" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="464" x2="464" y1="213.4688" y2="243.6016"/><polygon fill="#181818" points="460,233.6016,464,243.6016,468,233.6016,464,237.6016" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[f1113739a408481e1a179e089cf532fd]
@startuml
!pragma layout smetana
start
note right
constructor MeteredTimestampedWindowStore(final WindowStore<Bytes,
byte[]>inner,final longwindowSizeMs,final StringmetricScope,
final Timetime,final Serde<K>keySerde,final Serde<ValueAndTimestamp<V>>valueSerde)
end note
:super (inner,windowSizeMs,metricScope,time,
keySerde,valueSerde);
end
start
note right
Serde<ValueAndTimestamp<V>>prepareValueSerde(final Serde<ValueAndTimestamp<V>>valueSerde,
final SerdeGettergetter)
end note
if (valueSerde==null ) then (yes) 
:return new ValueAndTimestampSerde<>((Serde<V>)getter.valueSerde());;
stop
else (no)
:return super .prepareValueSerde(valueSerde,
getter);;
stop
endif 
end
@enduml

