h:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="355.5" x2="355.5" y1="486.0781" y2="506.0781"/><polygon fill="#181818" points="351.5,496.0781,355.5,506.0781,359.5,496.0781,355.5,500.0781" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[30c17f5dc624cff2099383db92163bc5]
@startuml
!pragma layout smetana
start
note right
constructor TimeWindow(final longstartMs,
final longendMs)
end note
if (startMs==endMs) then (yes) 
:throw new IllegalArgumentException("Window endMs must be greater than window startMs.");;
endif 
end
start
note right
booleanoverlap(final Windowother)
end note
if (getClass()!=other.getClass()) then (yes) 
:throw new IllegalArgumentException("Cannot compare windows of different type. Other window has type "+
other.getClass()+".");;
endif 
:return startMs<otherWindow.endMs&&otherWindow.startMs<endMs;;
stop
end
@enduml

