62.0781,359.5,452.0781,355.5,456.0781" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="355.5" x2="355.5" y1="323.1719" y2="345.7383"/><polygon fill="#181818" points="351.5,335.7383,355.5,345.7383,359.5,335.7383,355.5,339.7383" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="355.5" x2="355.5" y1="486.0781" y2="506.0781"/><polygon fill="#181818" points="351.5,496.0781,355.5,506.0781,359.5,496.0781,355.5,500.0781" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="355.5" x2="355.5" y1="540.0469" y2="560.0469"/><polygon fill="#181818" points="351.5,550.0469,355.5,560.0469,359.5,550.0469,355.5,554.0469" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[1d7df52bbe58cc2bb0080a49fc47f923]
@startuml
!pragma layout smetana
start
note right
constructor TimeWindow(final longstartMs,
final longendMs)
end note
:super (startMs,endMs);
if (startMs==endMs) then (yes) 
:throw new IllegalArgumentException("Window endMs must be greater than window startMs.");;
endif 
end
start
note right
booleanoverlap(final Windowother)
end note
if (getClass()!=other.getClass()) then (yes) 
:throw new IllegalArgumentException("Cannot compare windows of different type. Other window has type "+
other.getClass()+".");;
endif 
:return startMs<otherWindow.endMs&&otherWindow.startMs<endMs;;
stop
end
@enduml

