" x2="423" y1="472.1094" y2="492.1094"/><polygon fill="#181818" points="419,482.1094,423,492.1094,427,482.1094,423,486.1094" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="423" x2="423" y1="526.0781" y2="546.0781"/><polygon fill="#181818" points="419,536.0781,423,546.0781,427,536.0781,423,540.0781" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[da130e71b7138133245274f1b411695a]
@startuml
!pragma layout smetana
start
note right
constructor TimeWindow(final longstartMs,
final longendMs)
end note
:super (startMs,endMs);
if (startMs==endMs) then (yes) 
:throw new IllegalArgumentException("Window endMs must be greater than window startMs.");;
endif 
end
start
note right
booleanoverlap(final Windowother)
end note
if (getClass()!=other.getClass()) then (yes) 
:throw new IllegalArgumentException("Cannot compare windows of different type. Other window has type "+other.getClass()+".");;
endif 
:return startMs<otherWindow.endMs&&otherWindow.startMs<endMs;;
stop
end
@enduml

