yle="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="423" x2="423" y1="510.9453" y2="530.9453"/><polygon fill="#181818" points="419,520.9453,423,530.9453,427,520.9453,423,524.9453" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[5a5c263f2cd1f63b54a44da7adba01e7]
@startuml
!pragma layout smetana
start
note right
constructor TimeWindow(final longstartMs,final longendMs)
end note
:super (startMs,endMs);
if (startMs==endMs) then (yes) 
:throw new IllegalArgumentException("Window endMs must be greater than window startMs.");;
endif 
end
start
note right
booleanoverlap(final Windowother)
end note
if (getClass()!=other.getClass()) then (yes) 
:throw new IllegalArgumentException("Cannot compare windows of different type. Other window has type "+other.getClass()+".");;
endif 
:return startMs<otherWindow.endMs&&otherWindow.startMs<endMs;;
stop
end
@enduml

