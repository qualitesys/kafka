"331" x2="331" y1="1233.0586" y2="1255.625"/><polygon fill="#181818" points="327,1245.625,331,1255.625,335,1245.625,331,1249.625" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="331" x2="331" y1="1289.5938" y2="1309.5938"/><polygon fill="#181818" points="327,1299.5938,331,1309.5938,335,1299.5938,331,1303.5938" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[d68cc390838cb0957a073443bb3afb0b]
@startuml
!pragma layout smetana
start
note right
constructor SessionStoreBuilder(final SessionBytesStoreSupplier storeSupplier,
final Serde<K> keySerde,final Serde<V> valueSerde,
final Time time)
end note
:super (Objects.requireNonNull(storeSupplier,
"storeSupplier cannot be null").name(),keySerde,
valueSerde,time);;
:Objects.requireNonNull(storeSupplier.metricsScope(),
"storeSupplier's metricsScope can't be null");;
:this.storeSupplier=storeSupplier;;
end
start
note right
SessionStore<K,V> build()
end note
:return new MeteredSessionStore<>(maybeWrapCaching(maybeWrapLogging(storeSupplier.get())),
storeSupplier.metricsScope(),keySerde,valueSerde,
time);;
stop
end
start
note right
SessionStore<Bytes,byte[]> maybeWrapCaching(final SessionStore<Bytes,
byte[]> inner)
end note
if (!enableCaching) then (yes) 
:return inner;;
stop
endif 
:return new CachingSessionStore(inner,storeSupplier.segmentIntervalMs());;
stop
end
start
note right
SessionStore<Bytes,byte[]> maybeWrapLogging(final SessionStore<Bytes,
byte[]> inner)
end note
if (!enableLogging) then (yes) 
:return inner;;
stop
endif 
:return new ChangeLoggingSessionBytesStore(inner);;
stop
end
start
note right
long retentionPeriod()
end note
:return storeSupplier.retentionPeriod();;
stop
end
@enduml

