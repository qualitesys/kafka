1221.125,514.5,1211.125,510.5,1215.125" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[d929dee966f41ebba92df3be5b828c3f]
@startuml
!pragma layout smetana
start
note right
constructor SessionStoreBuilder(final SessionBytesStoreSupplierstoreSupplier,final Serde<K>keySerde,final Serde<V>valueSerde,final Timetime)
end note
:super (Objects.requireNonNull(storeSupplier,
"storeSupplier cannot be null").name(),keySerde,
valueSerde,time);
:Objects.requireNonNull(storeSupplier.metricsScope(),
"storeSupplier's metricsScope can't be null");
:this.storeSupplier=storeSupplier;
end
start
note right
SessionStore<K,V>build()
end note
:return new MeteredSessionStore<>(maybeWrapCaching(maybeWrapLogging(storeSupplier.get())),storeSupplier.metricsScope(),keySerde,valueSerde,time);;
stop
end
start
note right
SessionStore<Bytes,byte[]>maybeWrapCaching(final SessionStore<Bytes,byte[]>inner)
end note
if (!enableCaching) then (yes) 
:return inner;;
stop
endif 
:return new CachingSessionStore(inner,storeSupplier.segmentIntervalMs());;
stop
end
start
note right
SessionStore<Bytes,byte[]>maybeWrapLogging(final SessionStore<Bytes,byte[]>inner)
end note
if (!enableLogging) then (yes) 
:return inner;;
stop
endif 
:return new ChangeLoggingSessionBytesStore(inner);;
stop
end
start
note right
longretentionPeriod()
end note
:return storeSupplier.retentionPeriod();;
stop
end
@enduml

