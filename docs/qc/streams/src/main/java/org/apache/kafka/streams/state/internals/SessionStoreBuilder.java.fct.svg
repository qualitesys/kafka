.5" y1="1100.5547" y2="1120.5547"/><polygon fill="#181818" points="506.5,1110.5547,510.5,1120.5547,514.5,1110.5547,510.5,1114.5547" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="510.5" x2="510.5" y1="1205.1211" y2="1227.6875"/><polygon fill="#181818" points="506.5,1217.6875,510.5,1227.6875,514.5,1217.6875,510.5,1221.6875" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="510.5" x2="510.5" y1="1261.6563" y2="1281.6563"/><polygon fill="#181818" points="506.5,1271.6563,510.5,1281.6563,514.5,1271.6563,510.5,1275.6563" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[d19044d11cf3b0f3acc5be68779df811]
@startuml
!pragma layout smetana
start
note right
constructor SessionStoreBuilder(final SessionBytesStoreSupplierstoreSupplier,
final Serde<K>keySerde,final Serde<V>valueSerde,
final Timetime)
end note
:super (Objects.requireNonNull(storeSupplier,
"storeSupplier cannot be null").name(),keySerde,
valueSerde,time);
:Objects.requireNonNull(storeSupplier.metricsScope(),
"storeSupplier's metricsScope can't be null");
:this.storeSupplier=storeSupplier;
end
start
note right
SessionStore<K,V>build()
end note
:return new MeteredSessionStore<>(maybeWrapCaching(maybeWrapLogging(storeSupplier.get())),storeSupplier.metricsScope(),keySerde,valueSerde,time);;
stop
end
start
note right
SessionStore<Bytes,byte[]>maybeWrapCaching(final SessionStore<Bytes,
byte[]>inner)
end note
if (!enableCaching) then (yes) 
:return inner;;
stop
endif 
:return new CachingSessionStore(inner,storeSupplier.segmentIntervalMs());;
stop
end
start
note right
SessionStore<Bytes,byte[]>maybeWrapLogging(final SessionStore<Bytes,
byte[]>inner)
end note
if (!enableLogging) then (yes) 
:return inner;;
stop
endif 
:return new ChangeLoggingSessionBytesStore(inner);;
stop
end
start
note right
longretentionPeriod()
end note
:return storeSupplier.retentionPeriod();;
stop
end
@enduml

