"327,1041.8125,331,1051.8125,335,1041.8125,331,1045.8125" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="331" x2="331" y1="1085.7813" y2="1105.7813"/><polygon fill="#181818" points="327,1095.7813,331,1105.7813,335,1095.7813,331,1099.7813" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[f4f264e16bb7b887e96b0c9ae6b1f58d]
@startuml
!pragma layout smetana
start
note right
constructor SessionStoreBuilder(final SessionBytesStoreSupplierstoreSupplier,
final Serde<K>keySerde,final Serde<V>valueSerde,
final Timetime)
end note
end
start
note right
SessionStore<K,V>build()
end note
:return new MeteredSessionStore<>(maybeWrapCaching(maybeWrapLogging(storeSupplier.get())),
storeSupplier.metricsScope(),keySerde,valueSerde,
time);;
stop
end
start
note right
SessionStore<Bytes,byte[]>maybeWrapCaching(final SessionStore<Bytes,
byte[]>inner)
end note
if (!enableCaching) then (yes) 
:return inner;;
stop
endif 
:return new CachingSessionStore(inner,storeSupplier.segmentIntervalMs());;
stop
end
start
note right
SessionStore<Bytes,byte[]>maybeWrapLogging(final SessionStore<Bytes,
byte[]>inner)
end note
if (!enableLogging) then (yes) 
:return inner;;
stop
endif 
:return new ChangeLoggingSessionBytesStore(inner);;
stop
end
start
note right
longretentionPeriod()
end note
:return storeSupplier.retentionPeriod();;
stop
end
@enduml

