@startuml
!pragma layout smetana
start
note right
constructor ForeachProcessor(final ForeachAction<K,V>action)
end note
:this.action=action;
end
start
note right
void process(final Record<K,V>record)
end note
:action.apply(record.key(),record.value());
end
@enduml

