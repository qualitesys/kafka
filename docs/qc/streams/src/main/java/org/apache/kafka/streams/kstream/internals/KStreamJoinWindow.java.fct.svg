.4063" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="209.5" x2="209.5" y1="723.7461" y2="743.7461"/><polygon fill="#181818" points="205.5,733.7461,209.5,743.7461,213.5,733.7461,209.5,737.7461" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[87957b25c599819c9d81aadbd6591373]
@startuml
!pragma layout smetana
start
note right
constructor KStreamJoinWindow(final String windowName)
end note
:this.windowName=windowName;;
end
start
note right
Processor<K,V,K,V> get()
end note
:return new KStreamJoinWindowProcessor();;
stop
end
start
note right
void init(final ProcessorContext<K,V> context)
end note
:super .init(context);;
:window=context.getStateStore(windowName);;
end
start
note right
void process(final Record<K,V> record)
end note
if (record.key()!=null ) then (yes) 
:context().forward(record);;
:window.put(record.key(),record.value(),record.timestamp());;
endif 
end
@enduml

