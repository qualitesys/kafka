yle="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="207.5" x2="207.5" y1="723.7461" y2="743.7461"/><polygon fill="#181818" points="203.5,733.7461,207.5,743.7461,211.5,733.7461,207.5,737.7461" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[a579d9c3c9a660ff31bef7f1485afdbe]
@startuml
!pragma layout smetana
start
note right
constructor KStreamJoinWindow(final StringwindowName)
end note
:this.windowName=windowName;
end
start
note right
Processor<K,V,K,V>get()
end note
:return new KStreamJoinWindowProcessor();;
stop
end
start
note right
void init(final ProcessorContext<K,V>context)
end note
:super .init(context);
:window=context.getStateStore(windowName);
end
start
note right
void process(final Record<K,V>record)
end note
if (record.key()!=null ) then (yes) 
:context().forward(record);
:window.put(record.key(),record.value(),record.timestamp());
endif 
end
@enduml

