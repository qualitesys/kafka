05,166,753.2305,170,743.2305,166,747.2305" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[2109110a6469bef5dea5b1a20f116c48]
@startuml
!pragma layout smetana
start
note right
constructor KStreamJoinWindow(final String windowName)
end note
:this.windowName=windowName;;
end
start
note right
Processor<K,V,K,V> get()
end note
:return new KStreamJoinWindowProcessor();;
stop
end
start
note right
void init(final ProcessorContext<K,V> context)
end note
:super .init(context);;
:window=context.getStateStore(windowName);;
end
start
note right
void process(final Record<K,V> record )
end note
if (record .key()!=null ) then (yes) 
:context().forward(record );;
:window.put(record .key(),record .value(),
record .timestamp());;
endif 
end
@enduml

