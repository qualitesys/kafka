@startuml
!pragma layout smetana
start
note right
constructor ContextualRecord(final byte[]value,
final ProcessorRecordContextrecordContext)
end note
:this.value=value;
:this.recordContext=Objects.requireNonNull(recordContext);
end
start
note right
ProcessorRecordContextrecordContext()
end note
:return recordContext;;
stop
end
start
note right
byte[]value()
end note
:return value;;
stop
end
start
note right
longresidentMemorySizeEstimate()
end note
:return (value==null ? 0:value.length)+recordContext.residentMemorySizeEstimate();;
stop
end
start
note right
ContextualRecorddeserialize(final ByteBufferbuffer)
end note
:return new ContextualRecord(value,context);;
stop
end
start
note right
booleanequals(final Objecto)
end note
if (this==o) then (yes) 
:return true;;
stop
endif 
if (o==null ||getClass()!=o.getClass()) then (yes) 
:return false;;
stop
endif 
:return Arrays.equals(value,that.value)&&Objects.equals(recordContext,
that.recordContext);;
stop
end
start
note right
inthashCode()
end note
:return Objects.hash(value,recordContext);;
stop
end
start
note right
StringtoString()
end note
:return "ContextualRecord{"+"recordContext="+
recordContext+", value="+Arrays.toString(value)+
'}';;
stop
end
@enduml

