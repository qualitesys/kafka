.5552,704,446.5552,700,450.5552" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="410.5" x2="234" y1="324.7114" y2="324.7114"/><line style="stroke:#181818;stroke-width:1.0;" x1="234" x2="234" y1="324.7114" y2="346.7114"/><polygon fill="#181818" points="230,336.7114,234,346.7114,238,336.7114,234,340.7114" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="523.5" x2="700" y1="324.7114" y2="324.7114"/><line style="stroke:#181818;stroke-width:1.0;" x1="700" x2="700" y1="324.7114" y2="346.7114"/><polygon fill="#181818" points="696,336.7114,700,346.7114,704,336.7114,700,340.7114" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[b318e2fbe524753130abc7c0e5f27c19]
@startuml
!pragma layout smetana
:return new SucceededQueryResult<>(result);;
stop
:return new FailedQueryResult<>(failureReason,
failureMessage);;
stop
:return forFailure(FailureReason.UNKNOWN_QUERY_TYPE,"This store ("+
store.getClass()+") doesn't know how to execute "+
"the given query ("+query+")."+" Contact the store maintainer if you need support for a new query type.");;
stop
if (partition==null ) then (yes) 
:return new FailedQueryResult<>(FailureReason.NOT_UP_TO_BOUND,
"The store is not initialized yet, so it is not yet up to the bound "+
positionBound);;
stop
else (no)
:return new FailedQueryResult<>(FailureReason.NOT_UP_TO_BOUND,
"For store partition "+partition+", the current position "+
currentPosition+" is not yet up to the bound "+
positionBound);;
stop
endif 
@enduml

