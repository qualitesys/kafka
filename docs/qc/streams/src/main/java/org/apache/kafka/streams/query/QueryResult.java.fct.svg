@startuml
!pragma layout smetana
:return new SucceededQueryResult<>(result);;
stop
:return new FailedQueryResult<>(failureReason,
failureMessage);;
stop
:return forFailure(FailureReason.UNKNOWN_QUERY_TYPE,"This store ("+
store.getClass()+") doesn't know how to execute "+
"the given query ("+query+")."+" Contact the store maintainer if you need support for a new query type.");;
stop
if (partition==null ) then (yes) 
:return new FailedQueryResult<>(FailureReason.NOT_UP_TO_BOUND,"The store is not initialized yet, so it is not yet up to the bound "+
positionBound);;
stop
else (no)
:return new FailedQueryResult<>(FailureReason.NOT_UP_TO_BOUND,"For store partition "+
partition+", the current position "+currentPosition+
" is not yet up to the bound "+positionBound);;
stop
endif 
@enduml

