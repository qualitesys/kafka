36.7114,275.5,340.7114" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="668" x2="947.5" y1="324.7114" y2="324.7114"/><line style="stroke:#181818;stroke-width:1.0;" x1="947.5" x2="947.5" y1="324.7114" y2="346.7114"/><polygon fill="#181818" points="943.5,336.7114,947.5,346.7114,951.5,336.7114,947.5,340.7114" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[e3ef7c74c96cdf98bf5e93140cdf66ab]
@startuml
!pragma layout smetana
:return new SucceededQueryResult<>(result);;
stop
:return new FailedQueryResult<>(failureReason,
failureMessage);;
stop
:return forFailure(FailureReason.UNKNOWN_QUERY_TYPE,
"This store ("+store.getClass()+") doesn't know how to execute "
+"the given query ("+query+")."+" Contact the store maintainer if you need support for a new query type.");;
stop
if (partition==null ) then (yes) 
:return new FailedQueryResult<>(FailureReason.NOT_UP_TO_BOUND,
"The store is not initialized yet, so it is not yet up to the bound "+positionBound);;
stop
else (no)
:return new FailedQueryResult<>(FailureReason.NOT_UP_TO_BOUND,
"For store partition "+partition+", the current position "+currentPosition+" is not yet up to the bound "+positionBound);;
stop
endif 
@enduml

