h:1.0;" x1="445" x2="234" y1="324.7114" y2="324.7114"/><line style="stroke:#181818;stroke-width:1.0;" x1="234" x2="234" y1="324.7114" y2="346.7114"/><polygon fill="#181818" points="230,336.7114,234,346.7114,238,336.7114,234,340.7114" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="558" x2="769" y1="324.7114" y2="324.7114"/><line style="stroke:#181818;stroke-width:1.0;" x1="769" x2="769" y1="324.7114" y2="346.7114"/><polygon fill="#181818" points="765,336.7114,769,346.7114,773,336.7114,769,340.7114" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[0829652aac76ae4a8628f39e098db67a]
@startuml
!pragma layout smetana
:return new SucceededQueryResult<>(result);;
stop
:return new FailedQueryResult<>(failureReason,
failureMessage);;
stop
:return forFailure(FailureReason.UNKNOWN_QUERY_TYPE,"This store ("+
store.getClass()+") doesn't know how to execute "+
"the given query ("+query+")."+" Contact the store maintainer if you need support for a new query type.");;
stop
if (partition==null ) then (yes) 
:return new FailedQueryResult<>(FailureReason.NOT_UP_TO_BOUND,
"The store is not initialized yet, so it is not yet up to the bound "+
positionBound);;
stop
else (no)
:return new FailedQueryResult<>(FailureReason.NOT_UP_TO_BOUND,"For store partition "+
partition+", the current position "+currentPosition+
" is not yet up to the bound "+positionBound);;
stop
endif 
@enduml

