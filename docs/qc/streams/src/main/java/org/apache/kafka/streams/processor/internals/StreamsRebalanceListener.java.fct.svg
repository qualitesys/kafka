@startuml
!pragma layout smetana
start
note right
constructor StreamsRebalanceListener(final Timetime,
final TaskManagertaskManager,final StreamThreadstreamThread,
final Loggerlog,final AtomicIntegerassignmentErrorCode)
end note
end
start
note right
void onPartitionsAssigned(final Collection<TopicPartition>partitions)
end note
if (assignmentErrorCode.get()==AssignorError.INCOMPLETE_SOURCE_TOPIC_METADATA.code()) then (yes) 
:throw new MissingSourceTopicException("One or more source topics were missing during rebalance");;
endif 
end
start
note right
void onPartitionsRevoked(final Collection<TopicPartition>partitions)
end note
if ((streamThread.setState(State.PARTITIONS_REVOKED)!=null ||streamThread.state()==State.PENDING_SHUTDOWN)&&!partitions.isEmpty()) then (yes) 
endif 
end
start
note right
void onPartitionsLost(final Collection<TopicPartition>partitions)
end note
end
@enduml

