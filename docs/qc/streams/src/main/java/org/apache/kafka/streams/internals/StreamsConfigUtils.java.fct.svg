81818;stroke-width:1.0;"/><!--MD5=[a6af2ce90bf713b2713c11bd81fbc215]
@startuml
!pragma layout smetana
start
note right
constructor ProcessingMode(final Stringname)
end note
:this.name=name;;
end
start
note right
ProcessingModeprocessingMode(final StreamsConfigconfig)
end note
if (StreamsConfig.EXACTLY_ONCE.equals(config.getString(StreamsConfig.PROCESSING_GUARANTEE_CONFIG))) then (yes) 
:return ProcessingMode.EXACTLY_ONCE_ALPHA;;
stop
else (no)
:return ProcessingMode.AT_LEAST_ONCE;;
stop
endif 
end
start
note right
StringprocessingModeString(final ProcessingModeprocessingMode)
end note
if (processingMode==ProcessingMode.EXACTLY_ONCE_V2) then (yes) 
:return StreamsConfig.EXACTLY_ONCE_V2;;
stop
else (no)
:return StreamsConfig.AT_LEAST_ONCE;;
stop
endif 
end
start
note right
booleaneosEnabled(final StreamsConfigconfig)
end note
:return eosEnabled(processingMode(config));;
stop
end
start
note right
booleaneosEnabled(final ProcessingModeprocessingMode)
end note
:return processingMode==ProcessingMode.EXACTLY_ONCE_ALPHA||processingMode==ProcessingMode.EXACTLY_ONCE_V2;;
stop
end
@enduml

