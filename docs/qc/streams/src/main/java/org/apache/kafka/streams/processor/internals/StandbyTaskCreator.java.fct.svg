d" lengthAdjust="spacing" textLength="106" x="10" y="534.875">Syntax Error?</text><!--MD5=[10d9093dadf7a0ae6a7a33bfb0f752d8]
@startuml
!pragma layout smetana
start
note right
constructor StandbyTaskCreator(final TopologyMetadatatopologyMetadata,
final StreamsConfigapplicationConfig,final StreamsMetricsImplstreamsMetrics,
final StateDirectorystateDirectory,final ChangelogReaderstoreChangelogReader,
final StringthreadId,final Loggerlog)
end note
:this.topologyMetadata=topologyMetadata;
:this.applicationConfig=applicationConfig;
:this.streamsMetrics=streamsMetrics;
:this.stateDirectory=stateDirectory;
:this.storeChangelogReader=storeChangelogReader;
:this.log=log;
:createTaskSensor=ThreadMetrics.createTaskSensor(threadId,
streamsMetrics);
:dummyCache=new ThreadCache(new LogContext(String.format("stream-thread [%s] ",
Thread.currentThread().getName())),0,streamsMetrics);
end
start
note right
void removeRevokedUnknownTasks(final Set<TaskId>assignedTasks)
end note
:unknownTasksToBeCreated.keySet().retainAll(assignedTasks);
end
start
note right
Map<TaskId,Set<TopicPartition>>uncreatedTasksForTopologies(final Set<String>currentTopologies)
end note
:return filterMap(unknownTasksToBeCreated,
t->currentTopologies.contains(t.getKey().topologyName()));;
stop
end
start
note right
Collection<Task>createTasks(final Map<TaskId,
Set<TopicPartition>>tasksToBeCreated)
end note
if (taskId.topologyName()!=null &&!topologyMetadata.namedTopologiesView()
.contains(taskId.topologyName())) then (yes) 
:newUnknownTasks.put(taskId,partitions);
endif 
if (topology.hasStateWithChangelogs()) then (yes) 
:createdTasks.add(createStandbyTask(taskId,
partitions,topology,stateManager,context));
else (no)
:log.trace("Skipped standby task {} with assigned partitions {} "+
"since it does not have any state stores to materialize",
taskId,partitions);
endif 
:unknownTasksToBeCreated.remove(taskId);
if (!newUnknownTasks.isEmpty()) then (yes) 
:log.info("Delaying creation of tasks not yet known by this instance: {}",
newUnknownTasks.keySet());
:unknownTasksToBeCreated.putAll(newUnknownTasks);
endif 
:return createdTasks;;
stop
end
start
note right
StandbyTaskcreateStandbyTaskFromActive(final StreamTaskstreamTask,
final Set<TopicPartition>inputPartitions)
end note
:streamTask.closeCleanAndRecycleState();
:stateManager.transitionTaskType(TaskType.STANDBY,
getLogContext(streamTask.id()));
:return createStandbyTask(streamTask.id(),
inputPartitions,topologyMetadata.buildSubtopology(streamTask.id),
stateManager,context);;
stop
end
start
note right
StandbyTaskcreateStandbyTask(final TaskIdtaskId,
final Set<TopicPartition>inputPartitions,
final ProcessorTopologytopology,final ProcessorStateManagerstateManager,
final InternalProcessorContextcontext)
end note
:log.trace("Created task {} with assigned partitions {}",
taskId,inputPartitions);
:createTaskSensor.record();
:return task;;
stop
end
start
note right
LogContextgetLogContext(final TaskIdtaskId)
end note
:return new LogContext(logPrefix);;
stop
end
@enduml

