@startuml
!pragma layout smetana
start
note right
constructor LagInfo(final long currentOffsetPosition,
final long endOffsetPosition)
end note
:this.currentOffsetPosition=currentOffsetPosition;;
:this.endOffsetPosition=endOffsetPosition;;
:this.offsetLag=Math.max(0,endOffsetPosition-currentOffsetPosition);;
end
start
note right
long currentOffsetPosition()
end note
:return this.currentOffsetPosition;;
stop
end
start
note right
long endOffsetPosition()
end note
:return this.endOffsetPosition;;
stop
end
start
note right
long offsetLag()
end note
:return this.offsetLag;;
stop
end
start
note right
boolean equals(final Object obj)
end note
if (!(obj instanceof LagInfo )) then (yes) 
:return false;;
stop
endif 
:final LagInfo other=(LagInfo )obj;;
:return currentOffsetPosition==other.currentOffsetPosition&&endOffsetPosition==other.endOffsetPosition&&this.offsetLag==other.offsetLag;;
stop
end
start
note right
int hashCode()
end note
:return Objects.hash(currentOffsetPosition,
endOffsetPosition,offsetLag);;
stop
end
start
note right
String toString()
end note
:return "LagInfo {"+" currentOffsetPosition="+
currentOffsetPosition+", endOffsetPosition="+
endOffsetPosition+", offsetLag="+offsetLag+
'}';;
stop
end
@enduml

