@startuml
!pragma layout smetana
start
note right
constructor ChangeLoggingListValueBytesStore(final KeyValueStore<Bytes,byte[]>inner)
end note
:super (inner);
end
start
note right
void put(final Byteskey,final byte[]value)
end note
:wrapped().put(key,value);
if (value==null ) then (yes) 
:log(key,null );
else (no)
:log(key,wrapped().get(key));
endif 
end
start
note right
byte[]putIfAbsent(final Byteskey,final byte[]value)
end note
if (oldValue!=null ) then (yes) 
:put(key,value);
endif 
:return null ;;
stop
end
@enduml

