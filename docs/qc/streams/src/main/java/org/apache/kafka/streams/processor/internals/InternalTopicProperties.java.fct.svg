@startuml
!pragma layout smetana
start
note right
constructor InternalTopicProperties(final IntegernumberOfPartitions)
end note
end
start
note right
Optional<Integer>getNumberOfPartitions()
end note
:return Optional.ofNullable(numberOfPartitions);;
stop
end
start
note right
InternalTopicPropertiesempty()
end note
:return new InternalTopicProperties(null );;
stop
end
start
note right
StringtoString()
end note
:return "InternalTopicProperties{"+"numberOfPartitions="+
numberOfPartitions+'}';;
stop
end
@enduml

