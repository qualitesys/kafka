77,325.5,1074.3477,321.5,1078.3477" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="321.5" x2="321.5" y1="1118.3164" y2="1138.3164"/><polygon fill="#181818" points="317.5,1128.3164,321.5,1138.3164,325.5,1128.3164,321.5,1132.3164" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="321.5" x2="321.5" y1="1172.2852" y2="1192.2852"/><polygon fill="#181818" points="317.5,1182.2852,321.5,1192.2852,325.5,1182.2852,321.5,1186.2852" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[682e593254a76efec2fc307ec98134e4]
@startuml
!pragma layout smetana
start
note right
constructor KStreamFlatTransformValues(final ValueTransformerWithKeySupplier<KIn,
VIn,Iterable<VOut>>valueTransformerWithKeySupplier)
end note
:this.valueTransformerSupplier=valueTransformerWithKeySupplier;
end
start
note right
Processor<KIn,VIn,KIn,VOut>get()
end note
:return new KStreamFlatTransformValuesProcessor<>(valueTransformerSupplier.get());;
stop
end
start
note right
Set<StoreBuilder<? >>stores()
end note
:return valueTransformerSupplier.stores();;
stop
end
start
note right
constructor KStreamFlatTransformValuesProcessor(final ValueTransformerWithKey<KIn,
VIn,Iterable<VOut>>valueTransformer)
end note
:this.valueTransformer=valueTransformer;
end
start
note right
void init(final ProcessorContext<KIn,VOut>context)
end note
:super .init(context);
:valueTransformer.init(new ForwardingDisabledProcessorContext((InternalProcessorContext<KIn,
VOut>)context));
end
start
note right
void process(final Record<KIn,VIn>record)
end note
if (transformedValues!=null ) then (yes) 
:context().forward(record.withValue(transformedValue));
endif 
end
start
note right
void close()
end note
:super .close();
:valueTransformer.close();
end
@enduml

