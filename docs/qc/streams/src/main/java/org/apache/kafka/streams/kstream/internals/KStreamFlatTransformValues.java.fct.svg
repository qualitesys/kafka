@startuml
!pragma layout smetana
start
note right
constructor KStreamFlatTransformValues(final ValueTransformerWithKeySupplier<KIn,
VIn,Iterable<VOut>>valueTransformerWithKeySupplier)
end note
end
start
note right
Processor<KIn,VIn,KIn,VOut>get()
end note
:return new KStreamFlatTransformValuesProcessor<>(valueTransformerSupplier.get());;
stop
end
start
note right
Set<StoreBuilder<? >>stores()
end note
:return valueTransformerSupplier.stores();;
stop
end
start
note right
constructor KStreamFlatTransformValuesProcessor(final ValueTransformerWithKey<KIn,
VIn,Iterable<VOut>>valueTransformer)
end note
end
start
note right
void init(final ProcessorContext<KIn,VOut>context)
end note
end
start
note right
void process(final Record<KIn,VIn>record)
end note
if (transformedValues!=null ) then (yes) 
endif 
end
start
note right
void close()
end note
end
@enduml

