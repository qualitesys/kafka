1818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="171" x2="171" y1="408.4063" y2="428.4063"/><polygon fill="#181818" points="167,418.4063,171,428.4063,175,418.4063,171,422.4063" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="171" x2="171" y1="462.375" y2="482.375"/><polygon fill="#181818" points="167,472.375,171,482.375,175,472.375,171,476.375" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[eed95dac7ad9db69104936ca30c224ba]
@startuml
!pragma layout smetana
start
note right
constructor KStreamMapValues(final ValueMapperWithKey<KIn,
VIn,VOut>mapper)
end note
:this.mapper=mapper;;
end
start
note right
FixedKeyProcessor<KIn,VIn,VOut>get()
end note
:return new KStreamMapProcessor();;
stop
end
start
note right
void process(final FixedKeyRecord<KIn,VIn>record)
end note
:final VOutnewValue=mapper.apply(record.key(),
record.value());;
:context().forward(record.withValue(newValue));;
end
@enduml

