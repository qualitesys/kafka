385bb17881fd57fc7e]
@startuml
!pragma layout smetana
start
note right
constructor KStreamMapValues(final ValueMapperWithKey<KIn,
VIn,VOut>mapper)
end note
:this.mapper=mapper;
end
start
note right
FixedKeyProcessor<KIn,VIn,VOut>get()
end note
:return new KStreamMapProcessor();;
stop
end
start
note right
void process(final FixedKeyRecord<KIn,VIn>record)
end note
:context().forward(record.withValue(newValue));
end
@enduml

