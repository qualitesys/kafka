ygon fill="#181818" points="264,780.6094,268,790.6094,272,780.6094,268,784.6094" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[ece1d2257f3a9d161dcc8ee603ccb0db]
@startuml
!pragma layout smetana
start
note right
constructor KeyValueIteratorFacade(final KeyValueIterator<K,
ValueAndTimestamp<V>>iterator)
end note
:innerIterator=iterator;;
end
start
note right
booleanhasNext()
end note
:return innerIterator.hasNext();;
stop
end
start
note right
KpeekNextKey()
end note
:return innerIterator.peekNextKey();;
stop
end
start
note right
KeyValue<K,V>next()
end note
:final KeyValue<K,ValueAndTimestamp<V>>innerKeyValue=innerIterator.next();;
:return KeyValue.pair(innerKeyValue.key,getValueOrNull(innerKeyValue.value));;
stop
end
start
note right
void close()
end note
:innerIterator.close();;
end
@enduml

