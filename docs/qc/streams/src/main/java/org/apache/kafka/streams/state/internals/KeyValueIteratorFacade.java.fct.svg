><polygon fill="#181818" points="266,780.6094,270,790.6094,274,780.6094,270,784.6094" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[41e5746dfdc1d07f30e8a5128bbb6b83]
@startuml
!pragma layout smetana
start
note right
constructor KeyValueIteratorFacade(final KeyValueIterator<K,
ValueAndTimestamp<V>> iterator)
end note
:innerIterator=iterator;;
end
start
note right
boolean hasNext()
end note
:return innerIterator.hasNext();;
stop
end
start
note right
K peekNextKey()
end note
:return innerIterator.peekNextKey();;
stop
end
start
note right
KeyValue<K,V> next()
end note
:final KeyValue<K,ValueAndTimestamp<V>> innerKeyValue=innerIterator.next();;
:return KeyValue.pair(innerKeyValue.key,getValueOrNull(innerKeyValue.value));;
stop
end
start
note right
void close()
end note
:innerIterator.close();;
end
@enduml

