@startuml
!pragma layout smetana
start
note right
constructor KeyValueIteratorFacade(final KeyValueIterator<K,
ValueAndTimestamp<V>>iterator)
end note
end
start
note right
booleanhasNext()
end note
:return innerIterator.hasNext();;
stop
end
start
note right
KpeekNextKey()
end note
:return innerIterator.peekNextKey();;
stop
end
start
note right
KeyValue<K,V>next()
end note
:return KeyValue.pair(innerKeyValue.key,getValueOrNull(innerKeyValue.value));;
stop
end
start
note right
void close()
end note
end
@enduml

