@startuml
!pragma layout smetana
start
note right
constructor LeftOrRightValueDeserializer(final Deserializer<V1>leftDeserializer,final Deserializer<V2>rightDeserializer)
end note
:this.leftDeserializer=leftDeserializer;
:this.rightDeserializer=rightDeserializer;
end
start
note right
void setIfUnset(final SerdeGettergetter)
end note
if (leftDeserializer==null ) then (yes) 
:leftDeserializer=(Deserializer<V1>)getter.valueSerde().deserializer();
endif 
if (rightDeserializer==null ) then (yes) 
:rightDeserializer=(Deserializer<V2>)getter.valueSerde().deserializer();
endif 
:initNullableDeserializer(leftDeserializer,getter);
:initNullableDeserializer(rightDeserializer,getter);
end
start
note right
void configure(final Map<String,? >configs,final booleanisKey)
end note
:leftDeserializer.configure(configs,isKey);
