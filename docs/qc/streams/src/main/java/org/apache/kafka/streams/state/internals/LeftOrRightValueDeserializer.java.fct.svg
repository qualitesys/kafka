@startuml
!pragma layout smetana
start
note right
constructor LeftOrRightValueDeserializer(final Deserializer<V1>leftDeserializer,
final Deserializer<V2>rightDeserializer)
end note
end
start
note right
void setIfUnset(final SerdeGettergetter)
end note
if (leftDeserializer==null ) then (yes) 
endif 
if (rightDeserializer==null ) then (yes) 
endif 
end
start
note right
void configure(final Map<String,? >configs,
final booleanisKey)
end note
end
start
note right
LeftOrRightValue<V1,V2>deserialize(final Stringtopic,
final byte[]data)
end note
if (data==null ||data.length==0) then (yes) 
:return null ;;
stop
endif 
:return (data[0]==1)? LeftOrRightValue.makeLeftValue(leftDeserializer.deserialize(topic,
rawValue(data))):LeftOrRightValue.makeRightValue(rightDeserializer.deserialize(topic,
rawValue(data)));;
stop
end
start
note right
byte[]rawValue(final byte[]data)
end note
:return rawValue;;
stop
end
@enduml

