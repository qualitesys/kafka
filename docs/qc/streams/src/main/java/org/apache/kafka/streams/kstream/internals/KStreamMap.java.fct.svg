" x2="332.5" y1="248.4688" y2="268.4688"/><polygon fill="#181818" points="328.5,258.4688,332.5,268.4688,336.5,258.4688,332.5,262.4688" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="332.5" x2="332.5" y1="353.0352" y2="375.6016"/><polygon fill="#181818" points="328.5,365.6016,332.5,375.6016,336.5,365.6016,332.5,369.6016" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="332.5" x2="332.5" y1="409.5703" y2="429.5703"/><polygon fill="#181818" points="328.5,419.5703,332.5,429.5703,336.5,419.5703,332.5,423.5703" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="332.5" x2="332.5" y1="477.5078" y2="497.5078"/><polygon fill="#181818" points="328.5,487.5078,332.5,497.5078,336.5,487.5078,332.5,491.5078" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[c39eef6d632e920f1d02140a588d054d]
@startuml
!pragma layout smetana
start
note right
constructor KStreamMap(final KeyValueMapper<? super KIn,
? super VIn,?  extends KeyValue<?  extends KOut,
?  extends VOut>>mapper)
end note
:this.mapper=mapper;
end
start
note right
Processor<KIn,VIn,KOut,VOut>get()
end note
:return new KStreamMapProcessor();;
stop
end
start
note right
void process(final Record<KIn,VIn>record)
end note
:Objects.requireNonNull(newPair,"The provided KeyValueMapper returned null which is not allowed.");
:context().forward(record.withKey(newPair.key)
.withValue(newPair.value));
end
@enduml

