="332.5" x2="332.5" y1="322.7695" y2="345.3359"/><polygon fill="#181818" points="328.5,335.3359,332.5,345.3359,336.5,335.3359,332.5,339.3359" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="332.5" x2="332.5" y1="379.3047" y2="399.3047"/><polygon fill="#181818" points="328.5,389.3047,332.5,399.3047,336.5,389.3047,332.5,393.3047" style="stroke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="332.5" x2="332.5" y1="447.2422" y2="467.2422"/><polygon fill="#181818" points="328.5,457.2422,332.5,467.2422,336.5,457.2422,332.5,461.2422" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[2f8477e9ac3869063a8198807d8243d1]
@startuml
!pragma layout smetana
start
note right
constructor KStreamMap(final KeyValueMapper<? super KIn,? super VIn,?  extends KeyValue<?  extends KOut,?  extends VOut>>mapper)
end note
:this.mapper=mapper;
end
start
note right
Processor<KIn,VIn,KOut,VOut>get()
end note
:return new KStreamMapProcessor();;
stop
end
start
note right
void process(final Record<KIn,VIn>record)
end note
:Objects.requireNonNull(newPair,"The provided KeyValueMapper returned null which is not allowed.");
:context().forward(record.withKey(newPair.key)
.withValue(newPair.value));
end
@enduml

