@startuml
!pragma layout smetana
start
note right
constructor KStreamMap(final KeyValueMapper<? super KIn,
? super VIn,?  extends KeyValue<?  extends KOut,
?  extends VOut>>mapper)
end note
:this.mapper=mapper;;
end
start
note right
Processor<KIn,VIn,KOut,VOut>get()
end note
:return new KStreamMapProcessor();;
stop
end
start
note right
void process(final Record<KIn,VIn>record )
end note
:final KeyValue<?  extends KOut,?  extends VOut>newPair=mapper.apply(record .key(),
record .value());;
:Objects.requireNonNull(newPair,"The provided KeyValueMapper returned null which is not allowed.");;
:context().forward(record .withKey(newPair.key)
.withValue(newPair.value));;
end
@enduml

