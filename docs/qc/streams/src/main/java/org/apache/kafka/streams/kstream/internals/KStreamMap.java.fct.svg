@startuml
!pragma layout smetana
start
note right
constructor KStreamMap(final KeyValueMapper<?superKIn,
?superVIn,?extendsKeyValue<?extendsKOut,?extendsVOut>> mapper)
end note
:this.mapper=mapper;;
end
start
note right
Processor<KIn,VIn,KOut,VOut> get()
end note
:return new KStreamMapProcessor();;
stop
end
start
note right
void process(final Record<KIn,VIn> record )
end note
:final KeyValue<?extendsKOut,?extendsVOut> newPair=mapper.apply(record .key(),
record .value());;
:Objects.requireNonNull(newPair,"The provided KeyValueMapper returned null which is not allowed.");;
:context().forward(record .withKey(newPair.key)
.withValue(newPair.value));;
end
@enduml

