ont-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="37" x="5" y="153.0625">start</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="78" x="5" y="169.3594">note right</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="409" x="5" y="185.6563">boolean assign(final Map&lt;UUID,ClientState&gt; clients,</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="15" x="5" y="201.9531">...</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="175" x="5" y="218.25">... ( skipping 63 lines )</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="15" x="5" y="234.5469">...</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="431" x="5" y="250.8438">void balanceTasksOverThreads(final SortedMap&lt;UUID,</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="410" x="5" y="267.1406">ClientState&gt; clientStates,final Function&lt;ClientState,</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="585" x="5" y="283.4375">Set&lt;TaskId&gt;&gt; currentAssignmentAccessor,final BiConsumer&lt;ClientState,</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="431" x="5" y="299.7344">TaskId&gt; taskUnassignor,final BiConsumer&lt;ClientState,</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="406" x="5" y="316.0313">TaskId&gt; taskAssignor,final BiPredicate&lt;ClientState,</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="362" x="5" y="332.3281">ClientState&gt; taskMovementAttemptPredicate)</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="71" x="5" y="348.625">end note</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="245" x="5" y="364.9219">:boolean keepBalancing=true;;</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="173" x="5" y="381.2188">while (keepBalancing)</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="182" x="5" y="397.5156">:keepBalancing=false;;</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="379" x="5" y="413.8125">:final UUID sourceClient=sourceEntry.getKey();;</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="483" x="5" y="430.1094">:final ClientState sourceClientState=sourceEntry.getValue();;</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="445" x="5" y="446.4063">:final UUID destinationClient=destinationEntry.getKey();;</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="549" x="5" y="462.7031">:final ClientState destinationClientState=destinationEntry.getValue();;</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="415" x="5" y="479">if (sourceClient.equals(destinationClient)) then (yes)</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="92" x="5" y="495.2969">:continue ;;</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="40" x="5" y="511.5938">endif</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="839" x="5" y="527.8906">:final Set&lt;TaskId&gt; sourceTasks=new TreeSet&lt;&gt;(currentAssignmentAccessor.apply(sourceClientState));;</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="498" x="5" y="544.1875">:final Iterator&lt;TaskId&gt; sourceIterator=sourceTasks.iterator();;</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" text-decoration="wavy underline" textLength="348" x="5" y="560.4844">while (shouldMoveATask(sourceClientState,</text><text fill="#FF0000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="106" x="10" y="576.7813">Syntax Error?</text><!--MD5=[d918b3d673f1aef09622fed2b078672d]
@startuml
!pragma layout smetana
start
note right
boolean assign(final Map<UUID,ClientState> clients,
final Set<TaskId> allTaskIds,final Set<TaskId> statefulTaskIds,
final AssignmentConfigs configs)
end note
:final SortedSet<TaskId> statefulTasks=new TreeSet<>(statefulTaskIds);;
:final TreeMap<UUID,ClientState> clientStates=new TreeMap<>(clients);;
:assignActiveStatefulTasks(clientStates,statefulTasks);;
:assignStandbyReplicaTasks(clientStates,allTaskIds,
statefulTasks,configs);;
:final AtomicInteger remainingWarmupReplicas=new AtomicInteger(configs.maxWarmupReplicas);;
:final Map<TaskId,SortedSet<UUID>> tasksToCaughtUpClients=tasksToCaughtUpClients(statefulTasks,
clientStates,configs.acceptableRecoveryLag);;
:final Map<TaskId,SortedSet<UUID>> tasksToClientByLag=tasksToClientByLag(statefulTasks,
clientStates);;
:final Map<UUID,Set<TaskId>> warmups=new TreeMap<>();;
:final int neededActiveTaskMovements=assignActiveTaskMovements(tasksToCaughtUpClients,
tasksToClientByLag,clientStates,warmups,remainingWarmupReplicas);;
:final int neededStandbyTaskMovements=assignStandbyTaskMovements(tasksToCaughtUpClients,
tasksToClientByLag,clientStates,remainingWarmupReplicas,
warmups);;
:assignStatelessActiveTasks(clientStates,
diff(TreeSet::new ,allTaskIds,statefulTasks));;
:final boolean probingRebalanceNeeded=neededActiveTaskMovements+
neededStandbyTaskMovements>0;;
:log.info("Decided on assignment: "+clientStates+
" with"+(probingRebalanceNeeded? String.valueOf(""):String.valueOf(" no"))+
" followup probing rebalance.");;
:return probingRebalanceNeeded;;
stop
end
start
note right
void assignActiveStatefulTasks(final SortedMap<UUID,
ClientState> clientStates,final SortedSet<TaskId> statefulTasks)
end note
:Iterator<ClientState> clientStateIterator=null ;;
if (clientStateIterator==null ||!clientStateIterator.hasNext()) then (yes) 
:clientStateIterator=clientStates.values()
.iterator();;
endif 
:clientStateIterator.next().assignActive(task);;
:balanceTasksOverThreads(clientStates,ClientState::activeTasks,
ClientState::unassignActive,ClientState::assignActive,
(source,destination)->true);;
end
start
note right
void assignStandbyReplicaTasks(final TreeMap<UUID,
ClientState> clientStates,final Set<TaskId> allTaskIds,
final Set<TaskId> statefulTasks,final AssignmentConfigs configs)
end note
if (configs.numStandbyReplicas==0) then (yes) 
:return ;;
stop
endif 
:final StandbyTaskAssignor standbyTaskAssignor=StandbyTaskAssignorFactory.create(configs);;
:standbyTaskAssignor.assign(clientStates,
allTaskIds,statefulTasks,configs);;
:balanceTasksOverThreads(clientStates,ClientState::standbyTasks,
ClientState::unassignStandby,ClientState::assignStandby,
standbyTaskAssignor::isAllowedTaskMovement);;
end
start
note right
void balanceTasksOverThreads(final SortedMap<UUID,
ClientState> clientStates,final Function<ClientState,
Set<TaskId>> currentAssignmentAccessor,final BiConsumer<ClientState,
TaskId> taskUnassignor,final BiConsumer<ClientState,
TaskId> taskAssignor,final BiPredicate<ClientState,
ClientState> taskMovementAttemptPredicate)
end note
:boolean keepBalancing=true;;
while (keepBalancing)
:keepBalancing=false;;
:final UUID sourceClient=sourceEntry.getKey();;
:final ClientState sourceClientState=sourceEntry.getValue();;
:final UUID destinationClient=destinationEntry.getKey();;
:final ClientState destinationClientState=destinationEntry.getValue();;
if (sourceClient.equals(destinationClient)) then (yes) 
:continue ;;
endif 
:final Set<TaskId> sourceTasks=new TreeSet<>(currentAssignmentAccessor.apply(sourceClientState));;
:final Iterator<TaskId> sourceIterator=sourceTasks.iterator();;
while (shouldMoveATask(sourceClientState,
destinationClientState)&&sourceIterator.hasNext())
:final TaskId taskToMove=sourceIterator.next();;
:final boolean canMove=!destinationClientState.hasAssignedTask(taskToMove)&&taskMovementAttemptPredicate.test(sourceClientState,
destinationClientState);;
if (canMove) then (yes) 
:taskUnassignor.accept(sourceClientState,
taskToMove);;
:taskAssignor.accept(destinationClientState,
taskToMove);;
:keepBalancing=true;;
endif 
endwhile
endwhile
end
start
note right
boolean shouldMoveATask(final ClientState sourceClientState,
final ClientState destinationClientState)
end note
:final double skew=sourceClientState.assignedTaskLoad()-destinationClientState.assignedTaskLoad();;
if (skew<=0) then (yes) 
:return false;;
stop
endif 
:final double proposedAssignedTasksPerStreamThreadAtDestination=(destinationClientState.assignedTaskCount()+
1.0)/destinationClientState.capacity();;
:final double proposedAssignedTasksPerStreamThreadAtSource=(sourceClientState.assignedTaskCount()-1.0)/sourceClientState.capacity();;
:final double proposedSkew=proposedAssignedTasksPerStreamThreadAtSource-proposedAssignedTasksPerStreamThreadAtDestination;;
if (proposedSkew<0) then (yes) 
:return false;;
stop
endif 
:return proposedSkew<skew;;
stop
end
start
note right
void assignStatelessActiveTasks(final TreeMap<UUID,
ClientState> clientStates,final Iterable<TaskId> statelessTasks)
end note
:final ConstrainedPrioritySet statelessActiveTaskClientsByTaskLoad=new ConstrainedPrioritySet((client,
task)->true,client->clientStates.get(client).activeTaskLoad());;
:statelessActiveTaskClientsByTaskLoad.offerAll(clientStates.keySet());;
:final UUID client=statelessActiveTaskClientsByTaskLoad.poll(task);;
:final ClientState state=clientStates.get(client);;
:state.assignActive(task);;
:statelessActiveTaskClientsByTaskLoad.offer(client);;
end
start
note right
Map<TaskId,SortedSet<UUID>> tasksToCaughtUpClients(final Set<TaskId> statefulTasks,
final Map<UUID,ClientState> clientStates,
final long acceptableRecoveryLag)
end note
:final Map<TaskId,SortedSet<UUID>> taskToCaughtUpClients=new HashMap<>();;
:final TreeSet<UUID> caughtUpClients=new TreeSet<>();;
:final UUID client=clientEntry.getKey();;
:final long taskLag=clientEntry.getValue()
.lagFor(task);;
if (activeRunning(taskLag)||unbounded(acceptableRecoveryLag)||acceptable(acceptableRecoveryLag,
taskLag)) then (yes) 
:caughtUpClients.add(client);;
endif 
:taskToCaughtUpClients.put(task,caughtUpClients);;
:return taskToCaughtUpClients;;
stop
end
start
note right
Map<TaskId,SortedSet<UUID>> tasksToClientByLag(final Set<TaskId> statefulTasks,
final Map<UUID,ClientState> clientStates)
end note
:final Map<TaskId,SortedSet<UUID>> tasksToClientByLag=new HashMap<>();;
:final SortedSet<UUID> clientLag=new TreeSet<>(Comparator.<UUID >comparingLong(a->clientStates.get(a)
.lagFor(task)).thenComparing(a->a));;
:clientLag.addAll(clientStates.keySet());;
:tasksToClientByLag.put(task,clientLag);;
:return tasksToClientByLag;;
stop
end
start
note right
boolean unbounded(final long acceptableRecoveryLag)
end note
:return acceptableRecoveryLag==Long.MAX_VALUE;;
stop
end
start
note right
boolean acceptable(final long acceptableRecoveryLag,
final long taskLag)
end note
:return taskLag>=0&&taskLag<=acceptableRecoveryLag;;
stop
end
start
note right
boolean activeRunning(final long taskLag)
end note
:return taskLag==Task.LATEST_OFFSET;;
stop
end
@enduml

