..</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="175" x="5" y="176.3438">... ( skipping 38 lines )</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="15" x="5" y="192.6406">...</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="336" x="5" y="208.9375">:standbyTaskAssignor.assign(clientStates,</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="263" x="5" y="225.2344">allTaskIds,statefulTasks,configs);</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="532" x="5" y="241.5313">:balanceTasksOverThreads(clientStates,ClientState::standbyTasks,</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="456" x="5" y="257.8281">ClientState::unassignStandby,ClientState::assignStandby,</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="389" x="5" y="274.125">standbyTaskAssignor::isAllowedTaskMovement);</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="30" x="5" y="290.4219">end</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="37" x="5" y="306.7188">start</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="78" x="5" y="323.0156">note right</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="431" x="5" y="339.3125">void balanceTasksOverThreads(final SortedMap&lt;UUID,</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="405" x="5" y="355.6094">ClientState&gt;clientStates,final Function&lt;ClientState,</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="580" x="5" y="371.9063">Set&lt;TaskId&gt;&gt;currentAssignmentAccessor,final BiConsumer&lt;ClientState,</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="426" x="5" y="388.2031">TaskId&gt;taskUnassignor,final BiConsumer&lt;ClientState,</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="401" x="5" y="404.5">TaskId&gt;taskAssignor,final BiPredicate&lt;ClientState,</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="357" x="5" y="420.7969">ClientState&gt;taskMovementAttemptPredicate)</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="71" x="5" y="437.0938">end note</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="173" x="5" y="453.3906">while (keepBalancing)</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="176" x="5" y="469.6875">:keepBalancing=false;</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="415" x="5" y="485.9844">if (sourceClient.equals(destinationClient)) then (yes)</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="40" x="5" y="502.2813">endif</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" text-decoration="wavy underline" textLength="348" x="5" y="518.5781">while (shouldMoveATask(sourceClientState,</text><text fill="#FF0000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="106" x="10" y="534.875">Syntax Error?</text><!--MD5=[46655a801ce13beb48d089f5c2da9d3e]
@startuml
!pragma layout smetana
start
note right
booleanassign(final Map<UUID,ClientState>clients,
final Set<TaskId>allTaskIds,final Set<TaskId>statefulTaskIds,
final AssignmentConfigsconfigs)
end note
:assignActiveStatefulTasks(clientStates,statefulTasks);
:assignStandbyReplicaTasks(clientStates,allTaskIds,
statefulTasks,configs);
:assignStatelessActiveTasks(clientStates,
diff(TreeSet::new ,allTaskIds,statefulTasks));
:log.info("Decided on assignment: "+clientStates+
" with"+(probingRebalanceNeeded? String.valueOf(""):String.valueOf(" no"))+
" followup probing rebalance.");
:return probingRebalanceNeeded;;
stop
end
start
note right
void assignActiveStatefulTasks(final SortedMap<UUID,
ClientState>clientStates,final SortedSet<TaskId>statefulTasks)
end note
if (clientStateIterator==null ||!clientStateIterator.hasNext()) then (yes) 
:clientStateIterator=clientStates.values()
.iterator();
endif 
:clientStateIterator.next().assignActive(task);
:balanceTasksOverThreads(clientStates,ClientState::activeTasks,
ClientState::unassignActive,ClientState::assignActive,
(source,destination)->true);
end
start
note right
void assignStandbyReplicaTasks(final TreeMap<UUID,
ClientState>clientStates,final Set<TaskId>allTaskIds,
final Set<TaskId>statefulTasks,final AssignmentConfigsconfigs)
end note
if (configs.numStandbyReplicas==0) then (yes) 
:return ;;
stop
endif 
:standbyTaskAssignor.assign(clientStates,
allTaskIds,statefulTasks,configs);
:balanceTasksOverThreads(clientStates,ClientState::standbyTasks,
ClientState::unassignStandby,ClientState::assignStandby,
standbyTaskAssignor::isAllowedTaskMovement);
end
start
note right
void balanceTasksOverThreads(final SortedMap<UUID,
ClientState>clientStates,final Function<ClientState,
Set<TaskId>>currentAssignmentAccessor,final BiConsumer<ClientState,
TaskId>taskUnassignor,final BiConsumer<ClientState,
TaskId>taskAssignor,final BiPredicate<ClientState,
ClientState>taskMovementAttemptPredicate)
end note
while (keepBalancing)
:keepBalancing=false;
if (sourceClient.equals(destinationClient)) then (yes) 
endif 
while (shouldMoveATask(sourceClientState,
destinationClientState)&&sourceIterator.hasNext())
if (canMove) then (yes) 
:taskUnassignor.accept(sourceClientState,
taskToMove);
:taskAssignor.accept(destinationClientState,
taskToMove);
:keepBalancing=true;
endif 
endwhile
endwhile
end
start
note right
booleanshouldMoveATask(final ClientStatesourceClientState,
final ClientStatedestinationClientState)
end note
if (skew<=0) then (yes) 
:return false;;
stop
endif 
if (proposedSkew<0) then (yes) 
:return false;;
stop
endif 
:return proposedSkew<skew;;
stop
end
start
note right
void assignStatelessActiveTasks(final TreeMap<UUID,
ClientState>clientStates,final Iterable<TaskId>statelessTasks)
end note
:statelessActiveTaskClientsByTaskLoad.offerAll(clientStates.keySet());
:state.assignActive(task);
:statelessActiveTaskClientsByTaskLoad.offer(client);
end
start
note right
Map<TaskId,SortedSet<UUID>>tasksToCaughtUpClients(final Set<TaskId>statefulTasks,
final Map<UUID,ClientState>clientStates,final longacceptableRecoveryLag)
end note
if (activeRunning(taskLag)||unbounded(acceptableRecoveryLag)||acceptable(acceptableRecoveryLag,
taskLag)) then (yes) 
:caughtUpClients.add(client);
endif 
:taskToCaughtUpClients.put(task,caughtUpClients);
:return taskToCaughtUpClients;;
stop
end
start
note right
Map<TaskId,SortedSet<UUID>>tasksToClientByLag(final Set<TaskId>statefulTasks,
final Map<UUID,ClientState>clientStates)
end note
:clientLag.addAll(clientStates.keySet());
:tasksToClientByLag.put(task,clientLag);
:return tasksToClientByLag;;
stop
end
start
note right
booleanunbounded(final longacceptableRecoveryLag)
end note
:return acceptableRecoveryLag==Long.MAX_VALUE;;
stop
end
start
note right
booleanacceptable(final longacceptableRecoveryLag,
final longtaskLag)
end note
:return taskLag>=0&&taskLag<=acceptableRecoveryLag;;
stop
end
start
note right
booleanactiveRunning(final longtaskLag)
end note
:return taskLag==Task.LATEST_OFFSET;;
stop
end
@enduml

