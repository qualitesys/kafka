nt-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="37" x="5" y="153.0625">start</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="78" x="5" y="169.3594">note right</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="399" x="5" y="185.6563">booleanassign(final Map&lt;UUID,ClientState&gt;clients,</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="15" x="5" y="201.9531">...</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="175" x="5" y="218.25">... ( skipping 38 lines )</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="15" x="5" y="234.5469">...</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="336" x="5" y="250.8438">:standbyTaskAssignor.assign(clientStates,</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="263" x="5" y="267.1406">allTaskIds,statefulTasks,configs);</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="532" x="5" y="283.4375">:balanceTasksOverThreads(clientStates,ClientState::standbyTasks,</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="456" x="5" y="299.7344">ClientState::unassignStandby,ClientState::assignStandby,</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="389" x="5" y="316.0313">standbyTaskAssignor::isAllowedTaskMovement);</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="30" x="5" y="332.3281">end</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="37" x="5" y="348.625">start</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="78" x="5" y="364.9219">note right</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="431" x="5" y="381.2188">void balanceTasksOverThreads(final SortedMap&lt;UUID,</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="405" x="5" y="397.5156">ClientState&gt;clientStates,final Function&lt;ClientState,</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="580" x="5" y="413.8125">Set&lt;TaskId&gt;&gt;currentAssignmentAccessor,final BiConsumer&lt;ClientState,</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="426" x="5" y="430.1094">TaskId&gt;taskUnassignor,final BiConsumer&lt;ClientState,</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="401" x="5" y="446.4063">TaskId&gt;taskAssignor,final BiPredicate&lt;ClientState,</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="357" x="5" y="462.7031">ClientState&gt;taskMovementAttemptPredicate)</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="71" x="5" y="479">end note</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="173" x="5" y="495.2969">while (keepBalancing)</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="176" x="5" y="511.5938">:keepBalancing=false;</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="415" x="5" y="527.8906">if (sourceClient.equals(destinationClient)) then (yes)</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="40" x="5" y="544.1875">endif</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" text-decoration="wavy underline" textLength="348" x="5" y="560.4844">while (shouldMoveATask(sourceClientState,</text><text fill="#FF0000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="106" x="10" y="576.7813">Syntax Error?</text><!--MD5=[46655a801ce13beb48d089f5c2da9d3e]
@startuml
!pragma layout smetana
start
note right
booleanassign(final Map<UUID,ClientState>clients,
final Set<TaskId>allTaskIds,final Set<TaskId>statefulTaskIds,
final AssignmentConfigsconfigs)
end note
:assignActiveStatefulTasks(clientStates,statefulTasks);
:assignStandbyReplicaTasks(clientStates,allTaskIds,
statefulTasks,configs);
:assignStatelessActiveTasks(clientStates,
diff(TreeSet::new ,allTaskIds,statefulTasks));
:log.info("Decided on assignment: "+clientStates+
" with"+(probingRebalanceNeeded? String.valueOf(""):String.valueOf(" no"))+
" followup probing rebalance.");
:return probingRebalanceNeeded;;
stop
end
start
note right
void assignActiveStatefulTasks(final SortedMap<UUID,
ClientState>clientStates,final SortedSet<TaskId>statefulTasks)
end note
if (clientStateIterator==null ||!clientStateIterator.hasNext()) then (yes) 
:clientStateIterator=clientStates.values()
.iterator();
endif 
:clientStateIterator.next().assignActive(task);
:balanceTasksOverThreads(clientStates,ClientState::activeTasks,
ClientState::unassignActive,ClientState::assignActive,
(source,destination)->true);
end
start
note right
void assignStandbyReplicaTasks(final TreeMap<UUID,
ClientState>clientStates,final Set<TaskId>allTaskIds,
final Set<TaskId>statefulTasks,final AssignmentConfigsconfigs)
end note
if (configs.numStandbyReplicas==0) then (yes) 
:return ;;
stop
endif 
:standbyTaskAssignor.assign(clientStates,
allTaskIds,statefulTasks,configs);
:balanceTasksOverThreads(clientStates,ClientState::standbyTasks,
ClientState::unassignStandby,ClientState::assignStandby,
standbyTaskAssignor::isAllowedTaskMovement);
end
start
note right
void balanceTasksOverThreads(final SortedMap<UUID,
ClientState>clientStates,final Function<ClientState,
Set<TaskId>>currentAssignmentAccessor,final BiConsumer<ClientState,
TaskId>taskUnassignor,final BiConsumer<ClientState,
TaskId>taskAssignor,final BiPredicate<ClientState,
ClientState>taskMovementAttemptPredicate)
end note
while (keepBalancing)
:keepBalancing=false;
if (sourceClient.equals(destinationClient)) then (yes) 
endif 
while (shouldMoveATask(sourceClientState,
destinationClientState)&&sourceIterator.hasNext())
if (canMove) then (yes) 
:taskUnassignor.accept(sourceClientState,
taskToMove);
:taskAssignor.accept(destinationClientState,
taskToMove);
:keepBalancing=true;
endif 
endwhile
endwhile
end
start
note right
booleanshouldMoveATask(final ClientStatesourceClientState,
final ClientStatedestinationClientState)
end note
if (skew<=0) then (yes) 
:return false;;
stop
endif 
if (proposedSkew<0) then (yes) 
:return false;;
stop
endif 
:return proposedSkew<skew;;
stop
end
start
note right
void assignStatelessActiveTasks(final TreeMap<UUID,
ClientState>clientStates,final Iterable<TaskId>statelessTasks)
end note
:statelessActiveTaskClientsByTaskLoad.offerAll(clientStates.keySet());
:state.assignActive(task);
:statelessActiveTaskClientsByTaskLoad.offer(client);
end
start
note right
Map<TaskId,SortedSet<UUID>>tasksToCaughtUpClients(final Set<TaskId>statefulTasks,
final Map<UUID,ClientState>clientStates,final longacceptableRecoveryLag)
end note
if (activeRunning(taskLag)||unbounded(acceptableRecoveryLag)||acceptable(acceptableRecoveryLag,
taskLag)) then (yes) 
:caughtUpClients.add(client);
endif 
:taskToCaughtUpClients.put(task,caughtUpClients);
:return taskToCaughtUpClients;;
stop
end
start
note right
Map<TaskId,SortedSet<UUID>>tasksToClientByLag(final Set<TaskId>statefulTasks,
final Map<UUID,ClientState>clientStates)
end note
:clientLag.addAll(clientStates.keySet());
:tasksToClientByLag.put(task,clientLag);
:return tasksToClientByLag;;
stop
end
start
note right
booleanunbounded(final longacceptableRecoveryLag)
end note
:return acceptableRecoveryLag==Long.MAX_VALUE;;
stop
end
start
note right
booleanacceptable(final longacceptableRecoveryLag,
final longtaskLag)
end note
:return taskLag>=0&&taskLag<=acceptableRecoveryLag;;
stop
end
start
note right
booleanactiveRunning(final longtaskLag)
end note
:return taskLag==Task.LATEST_OFFSET;;
stop
end
@enduml

