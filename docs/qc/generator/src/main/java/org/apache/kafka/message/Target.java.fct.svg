@startuml
!pragma layout smetana
start
note right
constructor Target(FieldSpecfield,StringsourceVariable,StringhumanReadableName,Function<String,String>assignmentStatementGenerator)
end note
:this.field=field;
:this.sourceVariable=sourceVariable;
:this.humanReadableName=humanReadableName;
:this.assignmentStatementGenerator=assignmentStatementGenerator;
end
start
note right
StringassignmentStatement(StringrightHandSide)
end note
:return assignmentStatementGenerator.apply(rightHandSide);;
stop
end
start
note right
TargetnonNullableCopy()
end note
:return new Target(nonNullableField,sourceVariable,
humanReadableName,assignmentStatementGenerator);;
stop
end
start
note right
TargetarrayElementTarget(Function<String,String>assignmentStatementGenerator)
end note
if (!field.type().isArray()) then (yes) 
:throw new RuntimeException("Field "+field+
" is not an array.");;
endif 
:return new Target(elementField,"_element",humanReadableName+
" element",assignmentStatementGenerator);;
stop
end
start
note right
FieldSpecfield()
end note
:return field;;
stop
end
start
note right
StringsourceVariable()
end note
:return sourceVariable;;
stop
end
start
note right
StringhumanReadableName()
end note
:return humanReadableName;;
stop
end
@enduml

