note right
void processDirectories(StringpackageName,
StringoutputDir,StringinputDir,List<String>typeClassGeneratorTypes,
List<String>messageClassGeneratorTypes)
end note
:Files.createDirectories(Paths.get(outputDir));;
:intnumProcessed=0;;
:List<TypeClassGenerator>typeClassGenerators=createTypeClassGenerators(packageName,
typeClassGeneratorTypes);;
:HashSet<String>outputFileNames=new HashSet<>();;
:try ;
:try ;
:MessageSpecspec=JSON_SERDE.readValue(inputPath.toFile(),
MessageSpec.class );;
:List<MessageClassGenerator>generators=createMessageClassGenerators(packageName,
messageClassGeneratorTypes);;
:Stringname=generator.outputName(spec)+JAVA_SUFFIX;;
:outputFileNames.add(name);;
:PathoutputPath=Paths.get(outputDir,name);;
:try ;
:generator.generateAndWrite(spec,writer);;
:numProcessed++;;
:typeClassGenerators.forEach(generator->generator.registerMessageType(spec));;
:catch (Exceptione);
:throw new RuntimeException("Exception while processing "+
inputPath.toString(),e);;
stop
:outputFileNames.add(typeClassGenerator.outputName());;
:PathfactoryOutputPath=Paths.get(outputDir,
typeClassGenerator.outputName());;
:try ;
:typeClassGenerator.generateAndWrite(writer);;
:try ;
:PathfileName=outputPath.getFileName();;
if (fileName!=null ) then (yes) 
if (!outputFileNames.contains(fileName.toString())) then (yes) 
:Files.delete(outputPath);;
endif 
endif 
:System.out.printf("MessageGenerator: processed %d Kafka message JSON files(s).%n",
numProcessed);;
end
start
note right
StringcapitalizeFirst(Stringstring)
end note
if (string.isEmpty()) then (yes) 
:return string;;
stop
endif 
:return string.substring(0,1).toUpperCase(Locale.ENGLISH)+
string.substring(1);;
stop
end
start
note right
StringlowerCaseFirst(Stringstring)
end note
if (string.isEmpty()) then (yes) 
:return string;;
stop
endif 
:return string.substring(0,1).toLowerCase(Locale.ENGLISH)+
string.substring(1);;
stop
end
start
note right
booleanfirstIsCapitalized(Stringstring)
end note
if (string.isEmpty()) then (yes) 
:return false;;
stop
endif 
:return Character.isUpperCase(string.charAt(0));;
stop
end
start
note right
StringtoSnakeCase(Stringstring)
end note
:StringBuilderbld=new StringBuilder();;
:booleanprevWasCapitalized=true;;
:charc=string.charAt(i);;
if (Character.isUpperCase(c)) then (yes) 
if (!prevWasCapitalized) then (yes) 
:bld.append('_');;
endif 
:bld.append(Character.toLowerCase(c));;
:prevWasCapitalized=true;;
else (no)
:bld.append(c);;
:prevWasCapitalized=false;;
endif 
:return bld.toString();;
stop
end
start
note right
StringstripSuffix(Stringstr,Stringsuffix)
end note
if (str.endsWith(suffix)) then (yes) 
:return str.substring(0,str.length()-suffix.length());;
stop
else (no)
:throw new RuntimeException("String "+str+
" does not end with the "+"expected suffix "+
suffix);;
stop
endif 
end
start
note right
intsizeOfUnsignedVarint(intvalue)
end note
:intbytes=1;;
while ((value&0xffffff80)!=0L)
:bytes+=1;;
:value>>>=7;;
endwhile
:return bytes;;
stop
end
start
note right
void main(String[]args)
end note
:ArgumentParserparser=ArgumentParsers.newArgumentParser("message-generator")
.defaultHelp(true).description("The Kafka message generator");;
:parser.addArgument("- -package","-p").action(store())
.required(true).metavar("PACKAGE").help("The java package to use in generated files.");;
:parser.addArgument("- -output","-o").action(store())
.required(true).metavar("OUTPUT").help("The output directory to create.");;
:parser.addArgument("- -input","-i").action(store())
.required(true).metavar("INPUT").help("The input directory to use.");;
:parser.addArgument("- -typeclass-generators","-t").nargs("+
").action(store()).metavar("TYPECLASS_GENERATORS").help("The type class generators to use,
 if any.");;
:parser.addArgument("- -message-class-generators","-m").nargs("+
").action(store()).metavar("MESSAGE_CLASS_GENERATORS").help("The message class generators to use.");;
:Namespaceres=parser.parseArgsOrFail(args);;
:processDirectories(res.getString("package"),
res.getString("output"),res.getString("input"),
res.getList("typeclass_generators"),res.getList("message_class_generators"));;
end
