 fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="175" x="5" y="176.3438">... ( skipping 36 lines )</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="15" x="5" y="192.6406">...</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="440" x="5" y="208.9375">:generateSchemas(arrayType.elementType().toString(),</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="326" x="5" y="225.2344">structRegistry.findStruct(field),versions);</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="40" x="5" y="241.5313">endif</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="45" x="5" y="257.8281">:v++;</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="337" x="5" y="274.125">:generateSchemaForVersion(struct,v,cur);</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="250" x="5" y="290.4219">if (!cur.equals(prev)) then (yes)</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="349" x="5" y="306.7188">:messageInfo.schemaForVersion.put(v,cur);</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="40" x="5" y="323.0156">endif</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="86" x="5" y="339.3125">:prev=cur;</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="30" x="5" y="355.6094">end</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="37" x="5" y="371.9063">start</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="78" x="5" y="388.2031">note right</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="404" x="5" y="404.5">void generateSchemaForVersion(StructSpecstruct,</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="251" x="5" y="420.7969">shortversion,CodeBufferbuffer)</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="71" x="5" y="437.0938">end note</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="92" x="5" y="453.3906">while (true)</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="244" x="5" y="469.6875">if (lastValidIndex&lt;0) then (yes)</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="40" x="5" y="485.9844">endif</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="503" x="5" y="502.2813">if ((!field.taggedVersions().contains(version))&amp;&amp;field.versions()</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" text-decoration="wavy underline" textLength="235" x="5" y="518.5781">.contains(version)) then (yes)</text><text fill="#FF0000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="106" x="10" y="534.875">Syntax Error?</text><!--MD5=[11dae1730151800191cc0e35acc63b46]
@startuml
!pragma layout smetana
start
note right
constructor MessageInfo(Versionsversions)
end note
:this.versions=versions;
:this.schemaForVersion=new TreeMap<>();
end
start
note right
constructor SchemaGenerator(HeaderGeneratorheaderGenerator,
StructRegistrystructRegistry)
end note
:this.headerGenerator=headerGenerator;
:this.structRegistry=structRegistry;
:this.messages=new HashMap<>();
end
start
note right
void generateSchemas(MessageSpecmessage)
end note
:this.messageFlexibleVersions=message.flexibleVersions();
:Iterator<StructSpec>iter=structRegistry.commonStructs();
:generateSchemas(struct.name(),struct,message.struct()
.versions());
:generateSchemas(message.dataClassName(),
message.struct(),message.struct().versions());
end
start
note right
void generateSchemas(StringclassName,StructSpecstruct,
VersionsparentVersions)
end note
if (messageInfo!=null ) then (yes) 
:return ;;
stop
endif 
:messageInfo=new MessageInfo(versions);
:messages.put(className,messageInfo);
if (field.type().isStructArray()) then (yes) 
:generateSchemas(arrayType.elementType().toString(),
structRegistry.findStruct(field),versions);
endif 
:v++;
:generateSchemaForVersion(struct,v,cur);
if (!cur.equals(prev)) then (yes) 
:messageInfo.schemaForVersion.put(v,cur);
endif 
:prev=cur;
end
start
note right
void generateSchemaForVersion(StructSpecstruct,
shortversion,CodeBufferbuffer)
end note
while (true)
if (lastValidIndex<0) then (yes) 
endif 
if ((!field.taggedVersions().contains(version))&&field.versions()
.contains(version)) then (yes) 
endif 
:lastValidIndex- -;
endwhile
if (messageFlexibleVersions.contains(version)) then (yes) 
:finalLine++;
endif 
:headerGenerator.addImport(MessageGenerator.SCHEMA_CLASS);
:buffer.printf("new Schema(%n");
:buffer.incrementIndent();
:i++;
if ((!field.versions().contains(version))||field.taggedVersions()
.contains(version)) then (yes) 
endif 
:headerGenerator.addImport(MessageGenerator.FIELD_CLASS);
:buffer.printf("new Field(\"%s\", %s, \"%s\")%s%n",
field.snakeCaseName(),fieldTypeToSchemaType(field,
version,fieldFlexibleVersions),field.about(),
i==finalLine? String.valueOf(""):String.valueOf(","));
if (messageFlexibleVersions.contains(version)) then (yes) 
:generateTaggedFieldsSchemaForVersion(struct,
version,buffer);
endif 
:buffer.decrementIndent();
:buffer.printf(");%n");
end
start
note right
void generateTaggedFieldsSchemaForVersion(StructSpecstruct,
shortversion,CodeBufferbuffer)
end note
:headerGenerator.addStaticImport(MessageGenerator.TAGGED_FIELDS_SECTION_CLASS);
while (true)
if (lastValidIndex<0) then (yes) 
endif 
if ((field.taggedVersions().contains(version))&&field.versions()
.contains(version)) then (yes) 
endif 
:lastValidIndex- -;
endwhile
:buffer.printf("TaggedFieldsSection.of(%n");
:buffer.incrementIndent();
:i++;
if ((!field.versions().contains(version))||(!field.taggedVersions()
.contains(version))) then (yes) 
endif 
:headerGenerator.addImport(MessageGenerator.FIELD_CLASS);
:buffer.printf("%d, new Field(\"%s\", %s,
 \"%s\")%s%n",field.tag().get(),field.snakeCaseName(),
fieldTypeToSchemaType(field,version,fieldFlexibleVersions),
field.about(),i==lastValidIndex? String.valueOf(""):String.valueOf(","));
:buffer.decrementIndent();
:buffer.printf(")%n");
end
start
note right
StringfieldTypeToSchemaType(FieldSpecfield,
shortversion,VersionsfieldFlexibleVersions)
end note
:return fieldTypeToSchemaType(field.type(),
field.nullableVersions().contains(version),
version,fieldFlexibleVersions,field.zeroCopy());;
stop
end
start
note right
StringfieldTypeToSchemaType(FieldTypetype,
booleannullable,shortversion,VersionsfieldFlexibleVersions,
booleanzeroCopy)
end note
if (type instanceof FieldType.BoolFieldType) then (yes) 
:headerGenerator.addImport(MessageGenerator.TYPE_CLASS);
if (nullable) then (yes) 
:throw new RuntimeException("Type "+type+
" cannot be nullable.");;
endif 
:return "Type.BOOLEAN";;
stop
else (no)
:throw new RuntimeException("Unsupported type "+
type);;
endif 
end
start
note right
shortfloorVersion(StringclassName,shortv)
end note
:return message.schemaForVersion.floorKey(v);;
stop
end
start
note right
void writeSchema(StringclassName,CodeBufferbuffer)
end note
:v++;
if (declaration==null ) then (yes) 
:buffer.printf("public static final Schema SCHEMA_%d = SCHEMA_%d;%n",
v,v-1);
else (no)
:buffer.printf("public static final Schema SCHEMA_%d =%n",v);
:buffer.incrementIndent();
:declaration.write(buffer);
:buffer.decrementIndent();
endif 
:buffer.printf("%n");
:buffer.printf("public static final Schema[] SCHEMAS = new Schema[] {%n");
:buffer.incrementIndent();
:v++;
:buffer.printf("null%s%n",(v==versions.highest())? String.valueOf(""):String.valueOf(","));
:v++;
:buffer.printf("SCHEMA_%d%s%n",v,(v==versions.highest())? String.valueOf(""):String.valueOf(","));
:buffer.decrementIndent();
:buffer.printf("};%n");
:buffer.printf("%n");
:buffer.printf("public static final short LOWEST_SUPPORTED_VERSION = %d;%n",
versions.lowest());
:buffer.printf("public static final short HIGHEST_SUPPORTED_VERSION = %d;%n",
versions.highest());
:buffer.printf("%n");
end
@enduml

