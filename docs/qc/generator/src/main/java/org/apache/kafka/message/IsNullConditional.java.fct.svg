 note</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="392" x="5" y="371.9063">:this.conditionalGenerator=conditionalGenerator;</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="102" x="5" y="388.2031">:return this;;</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="35" x="5" y="404.5">stop</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="30" x="5" y="420.7969">end</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="37" x="5" y="437.0938">start</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="78" x="5" y="453.3906">note right</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="261" x="5" y="469.6875">void generate(CodeBufferbuffer)</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="71" x="5" y="485.9844">end note</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="376" x="5" y="502.2813">if (nullableVersions.intersect(possibleVersions)</text><text fill="#33FF02" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" text-decoration="wavy underline" textLength="158" x="5" y="518.5781">.empty()) then (yes)</text><text fill="#FF0000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="106" x="10" y="534.875">Syntax Error?</text><!--MD5=[a24339c429f6bb310778f31abb011f7c]
@startuml
!pragma layout smetana
start
note right
Stringgenerate(Stringname,booleannegated)
end note
if (negated) then (yes) 
:return String.format("%s != null",name);;
stop
else (no)
:return String.format("%s == null",name);;
stop
endif 
end
start
note right
IsNullConditionalforName(Stringname)
end note
:return new IsNullConditional(name);;
stop
end
start
note right
IsNullConditionalforField(FieldSpecfield)
end note
:cond.nullableVersions(field.nullableVersions());
:return cond;;
stop
end
start
note right
constructor IsNullConditional(Stringname)
end note
:this.name=name;
end
start
note right
IsNullConditionalnullableVersions(VersionsnullableVersions)
end note
:this.nullableVersions=nullableVersions;
:return this;;
stop
end
start
note right
IsNullConditionalpossibleVersions(VersionspossibleVersions)
end note
:this.possibleVersions=possibleVersions;
:return this;;
stop
end
start
note right
IsNullConditionalifNull(RunnableifNull)
end note
:this.ifNull=ifNull;
:return this;;
stop
end
start
note right
IsNullConditionalifShouldNotBeNull(RunnableifShouldNotBeNull)
end note
:this.ifShouldNotBeNull=ifShouldNotBeNull;
:return this;;
stop
end
start
note right
IsNullConditionalalwaysEmitBlockScope(booleanalwaysEmitBlockScope)
end note
:this.alwaysEmitBlockScope=alwaysEmitBlockScope;
:return this;;
stop
end
start
note right
IsNullConditionalconditionalGenerator(ConditionalGeneratorconditionalGenerator)
end note
:this.conditionalGenerator=conditionalGenerator;
:return this;;
stop
end
start
note right
void generate(CodeBufferbuffer)
end note
if (nullableVersions.intersect(possibleVersions)
.empty()) then (yes) 
if (ifShouldNotBeNull!=null ) then (yes) 
if (alwaysEmitBlockScope) then (yes) 
:buffer.printf("{%n");
:buffer.incrementIndent();
endif 
:ifShouldNotBeNull.run();
if (alwaysEmitBlockScope) then (yes) 
:buffer.decrementIndent();
:buffer.printf("}%n");
endif 
endif 
else (no)
if (ifNull!=null ) then (yes) 
:buffer.printf("if (%s) {%n",conditionalGenerator.generate(name,
false));
:buffer.incrementIndent();
:ifNull.run();
:buffer.decrementIndent();
if (ifShouldNotBeNull!=null ) then (yes) 
:buffer.printf("} else {%n");
:buffer.incrementIndent();
:ifShouldNotBeNull.run();
:buffer.decrementIndent();
endif 
:buffer.printf("}%n");
endif 
endif 
end
@enduml

