@startuml
!pragma layout smetana
start
note right
constructor HeaderGenerator(String packageName)
end note
:this.buffer=new CodeBuffer();;
:this.imports=new TreeSet<>();;
:this.packageName=packageName;;
:this.staticImports=new TreeSet<>();;
end
start
note right
void addImport(String newImport)
end note
:this.imports.add(newImport);;
end
start
note right
void addStaticImport(String newImport)
end note
:this.staticImports.add(newImport);;
end
start
note right
void generate()
end note
:Objects.requireNonNull(packageName);;
:buffer.printf("%s%n",HEADER[i]);;
:buffer.printf("package %s;%n",packageName);;
:buffer.printf("%n");;
:buffer.printf("import %s;%n",newImport);;
:buffer.printf("%n");;
if (!staticImports.isEmpty()) then (yes) 
:buffer.printf("import static %s;%n",newImport);;
:buffer.printf("%n");;
endif 
end
start
note right
CodeBuffer buffer()
end note
:return buffer;;
stop
end
@enduml

