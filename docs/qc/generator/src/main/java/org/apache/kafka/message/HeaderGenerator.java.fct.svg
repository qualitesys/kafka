@startuml
!pragma layout smetana
start
note right
constructor HeaderGenerator(StringpackageName)
end note
:this.buffer=new CodeBuffer();
:this.imports=new TreeSet<>();
:this.packageName=packageName;
:this.staticImports=new TreeSet<>();
end
start
note right
void addImport(StringnewImport)
end note
:this.imports.add(newImport);
end
start
note right
void addStaticImport(StringnewImport)
end note
:this.staticImports.add(newImport);
end
start
note right
void generate()
end note
:Objects.requireNonNull(packageName);
:i++;
:buffer.printf("%s%n",HEADER[i]);
:buffer.printf("package %s;%n",packageName);
:buffer.printf("%n");
:buffer.printf("import %s;%n",newImport);
:buffer.printf("%n");
if (!staticImports.isEmpty()) then (yes) 
:buffer.printf("import static %s;%n",newImport);
:buffer.printf("%n");
endif 
end
start
note right
CodeBufferbuffer()
end note
:return buffer;;
stop
end
@enduml

