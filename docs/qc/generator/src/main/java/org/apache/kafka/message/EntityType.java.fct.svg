roke:#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="398" x2="398" y1="600.9766" y2="620.9766"/><polygon fill="#181818" points="394,610.9766,398,620.9766,402,610.9766,398,614.9766" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[313d6d3a7960003498c6f06d185b00ca]
@startuml
!pragma layout smetana
start
note right
constructor EntityType(FieldType baseType)
end note
:this.baseType=baseType;;
end
start
note right
void verifyTypeMatches(String fieldName,FieldType type)
end note
if (this==UNKNOWN) then (yes) 
:return ;;
stop
endif 
if (type instanceof FieldType.ArrayType ) then (yes) 
:FieldType.ArrayType arrayType=(FieldType.ArrayType )type;;
:verifyTypeMatches(fieldName,arrayType.elementType());;
else (no)
if (!type.toString().equals(baseType.toString())) then (yes) 
:throw new RuntimeException("Field "+fieldName+
" has entity type "+name()+", but field type "+
type.toString()+", which does "+"not match.");;
stop
endif 
endif 
end
@enduml

