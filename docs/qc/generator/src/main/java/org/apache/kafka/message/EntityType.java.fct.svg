#181818;stroke-width:1.0;"/><line style="stroke:#181818;stroke-width:1.0;" x1="392" x2="392" y1="600.9766" y2="620.9766"/><polygon fill="#181818" points="388,610.9766,392,620.9766,396,610.9766,392,614.9766" style="stroke:#181818;stroke-width:1.0;"/><!--MD5=[062d28324905bbfde2cf168d847296cc]
@startuml
!pragma layout smetana
start
note right
constructor EntityType(FieldTypebaseType)
end note
:this.baseType=baseType;;
end
start
note right
void verifyTypeMatches(StringfieldName,FieldTypetype)
end note
if (this==UNKNOWN) then (yes) 
:return ;;
stop
endif 
if (type instanceof FieldType.ArrayType) then (yes) 
:FieldType.ArrayTypearrayType=(FieldType.ArrayType)type;;
:verifyTypeMatches(fieldName,arrayType.elementType());;
else (no)
if (!type.toString().equals(baseType.toString())) then (yes) 
:throw new RuntimeException("Field "+fieldName+
" has entity type "+name()+", but field type "+
type.toString()+", which does "+"not match.");;
stop
endif 
endif 
end
@enduml

