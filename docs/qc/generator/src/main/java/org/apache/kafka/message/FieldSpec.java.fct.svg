note right
StringfieldAbstractJavaType(HeaderGeneratorheaderGenerator,
StructRegistrystructRegistry)
end note
if (type instanceof FieldType.BoolFieldType) then (yes) 
:return "boolean";;
stop
else (no)
:throw new RuntimeException("Unknown field type "+
type);;
endif 
end
start
note right
StringconcreteJavaType(HeaderGeneratorheaderGenerator,
StructRegistrystructRegistry)
end note
if (type.isArray()) then (yes) 
if (structRegistry.isStructArrayWithKeys(this)) then (yes) 
:return collectionType(arrayType.elementType()
.toString());;
stop
else (no)
:headerGenerator.addImport(MessageGenerator.ARRAYLIST_CLASS);
:return String.format("ArrayList<%s>",arrayType.elementType()
.getBoxedJavaType(headerGenerator));;
stop
endif 
else (no)
:return fieldAbstractJavaType(headerGenerator,
structRegistry);;
stop
endif 
end
start
note right
