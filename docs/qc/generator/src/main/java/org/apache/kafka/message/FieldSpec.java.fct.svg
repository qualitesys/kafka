note right
StringfieldDefault(HeaderGeneratorheaderGenerator,
StructRegistrystructRegistry)
end note
if (type instanceof FieldType.BoolFieldType) then (yes) 
if (fieldDefault.isEmpty()) then (yes) 
:return "false";;
stop
else (no)
:throw new RuntimeException("Invalid default for boolean field "+
name+": "+fieldDefault);;
