start
note right
void generateNonDefaultValueCheck(HeaderGeneratorheaderGenerator,
StructRegistrystructRegistry,CodeBufferbuffer,
StringfieldPrefix,VersionsnullableVersions)
end note
if (type().isArray()) then (yes) 
if (fieldDefault.equals("null")) then (yes) 
:buffer.printf("if (%s%s != null) {%n",fieldPrefix,
camelCaseName());
else (no)
:buffer.printf("if (%s%s == null || !%s%s.isEmpty()) {%n",
fieldPrefix,camelCaseName(),fieldPrefix,camelCaseName());
endif 
else (no)
:buffer.printf("if (%s%s != %s) {%n",fieldPrefix,
camelCaseName(),fieldDefault);
endif 
end
start
note right
void generateNonIgnorableFieldCheck(HeaderGeneratorheaderGenerator,
StructRegistrystructRegistry,StringfieldPrefix,
CodeBufferbuffer)
end note
:generateNonDefaultValueCheck(headerGenerator,
structRegistry,buffer,fieldPrefix,nullableVersions());
:buffer.incrementIndent();
:headerGenerator.addImport(MessageGenerator.UNSUPPORTED_VERSION_EXCEPTION_CLASS);
:buffer.printf("throw new UnsupportedVersionException("+
"\"Attempted to write a non-default %s at version \" +
 _version);%n",camelCaseName());
:buffer.decrementIndent();
:buffer.printf("}%n");
end
