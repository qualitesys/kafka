note right
constructor FieldSpec(@JsonProperty ("name")Stringname,
@JsonProperty ("versions")Stringversions,
@JsonProperty ("fields")List<FieldSpec>fields,
@JsonProperty ("type")Stringtype,@JsonProperty ("mapKey")booleanmapKey,
@JsonProperty ("nullableVersions")StringnullableVersions,
@JsonProperty ("default")StringfieldDefault,
@JsonProperty ("ignorable")booleanignorable,
@JsonProperty ("entityType")EntityTypeentityType,
@JsonProperty ("about")Stringabout,@JsonProperty ("taggedVersions")StringtaggedVersions,
@JsonProperty ("flexibleVersions")StringflexibleVersions,
@JsonProperty ("tag")Integertag,@JsonProperty ("zeroCopy")booleanzeroCopy)
end note
:this.name=Objects.requireNonNull(name);
if (!VALID_FIELD_NAMES.matcher(this.name)
.matches()) then (yes) 
:throw new RuntimeException("Invalid field name "+
this.name);;
endif 
:this.taggedVersions=Versions.parse(taggedVersions,
Versions.NONE);
:this.versions=Versions.parse(versions,this.taggedVersions.empty()? null :this.taggedVersions);
if (this.versions==null ) then (yes) 
:throw new RuntimeException("You must specify the version of the "+
name+" structure.");;
endif 
:this.fields=Collections.unmodifiableList(fields==null ? Collections.emptyList():new ArrayList<>(fields));
:this.type=FieldType.parse(Objects.requireNonNull(type));
:this.mapKey=mapKey;
:this.nullableVersions=Versions.parse(nullableVersions,
Versions.NONE);
if (!this.nullableVersions.empty()) then (yes) 
if (!this.type.canBeNullable()) then (yes) 
:throw new RuntimeException("Type "+this.type+
" cannot be nullable.");;
endif 
endif 
:this.fieldDefault=fieldDefault==null ? String.valueOf(""):fieldDefault;
:this.ignorable=ignorable;
:this.entityType=(entityType==null )? EntityType.UNKNOWN:entityType;
:this.entityType.verifyTypeMatches(name,this.type);
:this.about=about==null ? String.valueOf(""):about;
if (!this.fields().isEmpty()) then (yes) 
if (!this.type.isArray()&&!this.type.isStruct()) then (yes) 
:throw new RuntimeException("Non-array or Struct field "+
name+" cannot have fields");;
endif 
endif 
if (flexibleVersions==null ||flexibleVersions.isEmpty()) then (yes) 
:this.flexibleVersions=Optional.empty();
else (no)
:this.flexibleVersions=Optional.of(Versions.parse(flexibleVersions,
null ));
if (!(this.type.isString()||this.type.isBytes())) then (yes) 
:throw new RuntimeException("Invalid flexibleVersions override for "+
name+".  Only fields of type string or bytes can specify a flexibleVersions "+
"override.");;
endif 
endif 
:this.tag=Optional.ofNullable(tag);
if (this.tag.isPresent()&&mapKey) then (yes) 
:throw new RuntimeException("Tagged fields cannot be used as keys.");;
endif 
:checkTagInvariants();
:this.zeroCopy=zeroCopy;
if (this.zeroCopy&&!this.type.isBytes()) then (yes) 
:throw new RuntimeException("Invalid zeroCopy value for "+
name+". Only fields of type bytes can use zeroCopy flag.");;
endif 
end
start
note right
void checkTagInvariants()
end note
if (this.tag.isPresent()) then (yes) 
if (this.tag.get()<0) then (yes) 
:throw new RuntimeException("Field "+name+
" specifies a tag of "+this.tag.get()+".  Tags cannot be negative.");;
endif 
if (this.taggedVersions.empty()) then (yes) 
:throw new RuntimeException("Field "+name+
" specifies a tag of "+this.tag.get()+", but has no tagged versions.  If a tag is specified, taggedVersions must "+
"be specified as well.");;
endif 
if (!(nullableTaggedVersions.empty()||nullableTaggedVersions.equals(this.taggedVersions))) then (yes) 
:throw new RuntimeException("Field "+name+
" specifies nullableVersions "+this.nullableVersions+
" and taggedVersions "+this.taggedVersions+
".  "+"Either all tagged versions must be nullable,
 or none must be.");;
endif 
if (this.taggedVersions.highest()<Short.MAX_VALUE) then (yes) 
:throw new RuntimeException("Field "+name+
" specifies taggedVersions "+this.taggedVersions+
", which is not open-ended.  taggedVersions must "+
"be either none, or an open-ended range (that ends with a plus sign)
.");;
endif 
if (!this.taggedVersions.intersect(this.versions)
.equals(this.taggedVersions)) then (yes) 
:throw new RuntimeException("Field "+name+
" specifies taggedVersions "+this.taggedVersions+
", and versions "+this.versions+".  "+"taggedVersions must be a subset of versions.");;
endif 
endif 
end
